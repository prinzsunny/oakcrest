<script>const { $, el, svg: makeSvg, text, panel, say, sayAsync, pick, pickInt, wait, confetti, choices, explain, everyday, emoji, shuffle, numpad } = KIT;

const W = 1000;
const H = 560;
let token = 0;
let view = null;

const UNITS = [
  { id: "s0", label: "See it", icon: "👀" },
  { id: "s1", label: "1. Planets in order", icon: "🪐" },
  { id: "s2", label: "2. Sizes & distances", icon: "📏" },

// ---------- colours & small helpers ----------
const SKY = "#1c2340";
const LIGHT = "#fff6e0";
const GOLD = "#ffd166";
const SOFT = "#c3c9ef";
const GOOD = "#7ee0a1";
const BAD = "#ff9b85";
stage.style.background = SKY;

const smooth = (t) => (t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
const lin = (t) => t;
const tw = (ms, fn, live, ease = smooth) =>
  new Promise((resolve) => {
    if (KIT.still.matches) {
      fn(1);
      return resolve(live());
    }
    const t0 = performance.now();
    const frame = (now) => {
      if (!live()) return resolve(false);
      const t = Math.min(1, (now - t0) / ms);
      fn(ease(t));
      if (t < 1) requestAnimationFrame(frame);
      else resolve(true);
    };
    requestAnimationFrame(frame);
  });
const nap = (ms, live) => wait(KIT.still.matches ? Math.min(ms, 150) : ms).then(() => live());
const T = (parent, x, y, str, size = 26, fill = LIGHT, extra = {}) => text(parent, x, y, str, { "font-size": size, fill, ...extra });
const move = (node, x, y, extra = "") => node.setAttribute("transform", `translate(${x} ${y})${extra}`);
const fmt = (n) => Number(n).toLocaleString("en-US");
const rad = (d) => (d * Math.PI) / 180;

function sky(v) {
  el("rect", { x: 0, y: 0, width: W, height: H, fill: SKY }, v);
  const defs = el("defs", {}, v);
  defs.innerHTML = `<radialGradient id="spShade" cx="0.35" cy="0.32" r="0.8"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></radialGradient><radialGradient id="spSun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff7c2"/><stop offset=".55" stop-color="#ffd23f"/><stop offset="1" stop-color="#ff9a1f"/></radialGradient><radialGradient id="spGlow" cx=".5" cy=".5" r=".5"><stop offset=".55" stop-color="#ffcf4d" stop-opacity=".5"/><stop offset="1" stop-color="#ffcf4d" stop-opacity="0"/></radialGradient>`;
  let s = 11;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 80; i++) el("circle", { cx: (rnd() * W).toFixed(1), cy: (rnd() * H).toFixed(1), r: (0.8 + rnd() * 1.6).toFixed(2), fill: "#fff", opacity: (0.25 + rnd() * 0.5).toFixed(2) }, v);
}
function fresh() {
  stage.innerHTML = "";
  view = makeSvg(`0 0 ${W} ${H}`, stage);
  sky(view);
  return view;
}
function drawSun(parent, x, y, r) {
  const g = el("g", {}, parent);
  el("circle", { cx: x, cy: y, r: r * 1.5, fill: "url(#spGlow)" }, g);
  el("circle", { cx: x, cy: y, r, fill: "url(#spSun)" }, g);
  return g;
}

// ---------- true planet facts (NASA fact-sheet values, rounded) ----------
// d: mean diameter km · au: average distance from the Sun in AU · mkm: million km · yr: one trip around the Sun · g: gravity compared with Earth
const PLANETS = [
  { n: "Mercury", d: 4879, au: 0.39, mkm: 58, yrDays: 88, yr: "88 days", g: 0.38, col: "#b5aca3", fact: "the innermost and smallest planet, with almost no atmosphere" },
  { n: "Venus", d: 12104, au: 0.72, mkm: 108, yrDays: 225, yr: "225 days", g: 0.91, col: "#e8c27a", fact: "the hottest planet: its thick carbon-dioxide atmosphere traps heat" },
  { n: "Earth", d: 12742, au: 1, mkm: 150, yrDays: 365, yr: "365 days", g: 1, col: "#3f7fd6", fact: "the only world known to host life, with liquid water on its surface" },
  { n: "Mars", d: 6779, au: 1.52, mkm: 228, yrDays: 687, yr: "687 days", g: 0.38, col: "#d0603a", fact: "the red planet: iron-oxide (rust) dust colors its surface" },
  { n: "Jupiter", d: 139820, au: 5.2, mkm: 778, yrDays: 4333, yr: "12 years", g: 2.5, col: "#d9a066", fact: "the largest planet, a gas giant made mostly of hydrogen and helium" },
  { n: "Saturn", d: 116460, au: 9.5, mkm: 1430, yrDays: 10759, yr: "29 years", g: 1.07, col: "#e6cf8b", ring: true, fact: "a gas giant with the most extensive rings, made of ice and rock" },
  { n: "Uranus", d: 50724, au: 19.2, mkm: 2870, yrDays: 30687, yr: "84 years", g: 0.9, col: "#9fd9e0", fact: "an ice giant whose axis is tilted about 98°, so it rolls on its side" },
  { n: "Neptune", d: 49244, au: 30.1, mkm: 4500, yrDays: 60190, yr: "165 years", g: 1.14, col: "#4f6fd6", fact: "the outermost planet, with the fastest winds measured in the solar system" },
];
const P = Object.fromEntries(PLANETS.map((p) => [p.n, p]));
const EARTH_D = 12742;
const SUN_D = 1392700;

function drawPlanet(parent, x, y, r, p) {
  const g = el("g", { transform: `translate(${x} ${y})` }, parent);
  const name = p.n;
  if (p.ring) el("ellipse", { rx: r * 1.8, ry: r * 0.5, fill: "none", stroke: "#d8c38a", "stroke-width": Math.max(2, r * 0.18), transform: "rotate(-16)" }, g);
  el("circle", { r, fill: p.col }, g);
  if (name === "Earth") {
    for (const [cx, cy, rr] of [[-0.3, -0.2, 0.35], [0.25, 0.25, 0.3], [0.35, -0.35, 0.18]]) el("circle", { cx: cx * r, cy: cy * r, r: rr * r, fill: "#5bb267" }, g);
  }
  if (name === "Jupiter" || name === "Saturn") {
    for (const yy of [-0.5, -0.18, 0.18, 0.5]) {
      const hw = r * Math.sqrt(1 - yy * yy) * 0.97;
      el("rect", { x: -hw, y: yy * r - r * 0.06, width: hw * 2, height: r * 0.12, rx: r * 0.06, fill: name === "Jupiter" ? "#b9824f" : "#cdb06c" }, g);
    }
    if (name === "Jupiter") el("ellipse", { cx: r * 0.32, cy: r * 0.32, rx: r * 0.16, ry: r * 0.09, fill: "#c4553a" }, g);
  }
  if (name === "Mars") el("ellipse", { cx: 0, cy: -r * 0.82, rx: r * 0.3, ry: r * 0.12, fill: "#fff", opacity: 0.85 }, g);
  if (name === "Moon") for (const [cx, cy, rr] of [[-0.3, -0.25, 0.18], [0.3, 0.1, 0.14], [-0.05, 0.4, 0.12]]) el("circle", { cx: cx * r, cy: cy * r, r: rr * r, fill: "#aaa59b" }, g);
  el("circle", { r, fill: "url(#spShade)" }, g);
  if (p.ring) {
    const a = r * 1.8;
    const b = r * 0.5;
    el("path", { d: `M${-a} 0 A${a} ${b} 0 0 0 ${a} 0`, fill: "none", stroke: "#e8d6a0", "stroke-width": Math.max(2, r * 0.18), transform: "rotate(-16)" }, g);
  }
  return g;
}
const MOON = { n: "Moon", col: "#d6d1c6" };

// Moon phase seen from the north half of Earth. k = 0..7 (0 new, 2 first quarter, 4 full, 6 third quarter).
const PHASES = ["New Moon", "Waxing crescent", "First quarter", "Waxing gibbous", "Full Moon", "Waning gibbous", "Third quarter", "Waning crescent"];
const PHEMO = ["🌑", "🌒", "🌓", "🌔", "🌕", "🌖", "🌗", "🌘"];
function drawPhase(parent, cx, cy, r, k) {
  const f = k / 8;
  const g = el("g", {}, parent);
  el("circle", { cx, cy, r, fill: "#3b4060", stroke: "#8e93b8", "stroke-width": 2 }, g);
  if (k === 0) return g;
  if (k === 4) {
    el("circle", { cx, cy, r, fill: "#f5edd0" }, g);
  } else {
    const c = Math.cos(2 * Math.PI * f);
    const rx = Math.abs(c) * r;
    const top = `${cx} ${cy - r}`;
    const bot = `${cx} ${cy + r}`;
    const d = f < 0.5 ? `M${top} A${r} ${r} 0 0 1 ${bot} A${rx} ${r} 0 0 ${c > 0 ? 0 : 1} ${top} Z` : `M${top} A${r} ${r} 0 0 0 ${bot} A${rx} ${r} 0 0 ${c > 0 ? 1 : 0} ${top} Z`;
    el("path", { d, fill: "#f5edd0" }, g);
  }
  return g;
}

// ---------- level chips, Try-it cards ----------
const LEVELS = [["easy", "🐣 Easy"], ["medium", "🦊 Medium"], ["hard", "🦁 Hard"]];
const levelRow = (cur, tryIt = true) =>

    const b = event.target.closest("[data-lv]");

const spStyle = document.createElement("style");
spStyle.textContent = `

.sp-notice{margin:5px 0 3px;font-size:13.5px}.sp-try .kt-go{min-height:40px;font-size:17px;margin-top:2px}.sp-trybtn{min-height:32px;font-size:13px;padding:0 10px}}
@media (max-height:460px),(max-width:420px) and (max-height:720px){.sp-pick .kt-choices button{min-height:44px;min-width:64px;font-size:15.5px;padding:0 11px}}

function closeTry() {
  const box = document.querySelector(".sp-try");
  if (!box) return;
  box.remove();
  VOICE.hush();
}
function tryCard(id) {
  const t = TRY[id];
  if (!t) return;
  closeTry();
  const box = document.createElement("div");
  box.className = "sp-try";
  box.setAttribute("role", "dialog");
  box.setAttribute("aria-label", "Try it for real");
  box.innerHTML = `<div class="sp-try-card"><h2>🏠 Try it for real: ${t.title}</h2><p class="sp-safe">🤝 ${t.safe}</p><div class="sp-cols"><div><h3>You need</h3><ul>${t.need.map((x) => `<li>${x}</li>`).join("")}</ul></div><div><h3>Do this</h3><ol>${t.steps.map((x) => `<li>${x}</li>`).join("")}</ol></div></div><p class="sp-notice">👀 <b>Notice:</b> ${t.notice}</p><button type="button" class="kt-go" data-close>✓ Got it</button></div>`;
  document.body.appendChild(box);
  box.addEventListener("click", (event) => {
    if (event.target === box || event.target.closest("[data-close]")) closeTry();
  });
  VOICE.speak(`Try it for real: ${t.title}. ${t.safe} You need: ${t.need.join(", ")}. ${t.steps.join(" ")} Notice: ${t.notice}`);
}

function explainCard(id) {
  const t = EXPLAIN[id];

  const box = document.createElement("div");

  document.body.appendChild(box);

    if (event.target === box || event.target.closest("[data-close]")) closeTry();

}
function endButtons(host, id, again) {
  host.innerHTML = `<div class="ap-buttons"><button type="button" class="primary" data-explain>🗣️ Explain it</button>${TRY[id] ? `<button type="button" data-trynow>🏠 Try it for real</button>` : ""}<button type="button" data-more>🔁 Again</button></div>`;

// ---------- the question engine ----------
// q: { ask, draw(q, api), opts?, pad?, ans | check(v), hint(v), why, show(live), mark(v, ok), test(v, live), ansText }
const NICE = ["Correct.", "Correct — and here is why:"];
function game(id, cfg) {
  const my = token;
  const alive = () => my === token;
  const R = cfg.rounds || 8;
  let level = shell.progress()[id]?.level || "easy";
  let round = 0;
  let q = null;
  let tries = 0;
  let busy = false;
  let gen = 0;
  const bags = {};
  const ctx = {
    next(key, list) {
      if (!bags[key]?.length) bags[key] = shuffle(list);
      return bags[key].pop();
    },
  };
  panel(`${levelRow(level, !!TRY[id])}<div class="sp-pick" data-choices></div>`);
  const host = $("[data-choices]");
  $("[data-try]")?.addEventListener("click", () => {
    window.OC?.touch();
    tryCard(id);
  });
  const status = (s) => {
    const b = $("[data-status]");
    if (b) b.textContent = s || `Question ${Math.min(round + 1, R)} of ${R}`;
  };
  const isRight = (v) => (q.check ? q.check(v) : v === q.ans);
  const ask = () => {
    if (!alive()) return;
    q = cfg.make(level, round, ctx);
    tries = 0;
    busy = false;
    const g = ++gen;
    q.live = () => alive() && g === gen;
    fresh();
    q.draw?.(q, { pick: (v) => answer(v) });
    status();
    if (q.pad) {
      host.onclick = null;
      host.innerHTML = `<div class="sp-padwrap"></div>`;
      q.padApi = numpad(host.firstChild, { max: q.max || 4, onEnter: (n) => answer(n) });
    } else if (q.opts) choices(host, q.opts, (c, b) => answer(c.v, b));
    else {
      host.innerHTML = `<div class="ap-buttons"><button type="button" data-again>🔁 Say it again</button></div>`;
      host.onclick = (event) => {
        if (event.target.closest("[data-again]")) say(q.ask);
      };
    }
    say(q.ask);
    window.__spq = q;
    window.__spPick = (val) => answer(val, host.querySelector(`[data-c="${q.opts ? q.opts.findIndex((o) => o.v === val) : -1}"]`) || undefined);
  };
  const answer = async (v, button) => {
    if (!alive() || busy || !q) return;
    window.OC?.touch();
    const live = q.live;
    if (q.test) {
      busy = true;
      host.querySelectorAll("[data-c]").forEach((b) => (b.disabled = true));
      await q.test(v, live);
      if (!live()) return;
      host.querySelectorAll("[data-c]").forEach((b) => (b.disabled = b.classList.contains("wrong")));
      busy = false;
    }
    if (isRight(v)) {
      busy = true;
      button?.classList.add("right");
      host.querySelectorAll("[data-c]").forEach((b) => (b.disabled = b !== button));
      q.mark?.(v, true);
      MUSIC.chime();
      say(`${tries ? "Correct — you revised your thinking." : pick(NICE)} ${q.why}`);
      if (q.show) await q.show(live);
      if (!live()) return;
      return done();
    }
    tries += 1;
    MUSIC.oops();
    if (button) {
      button.classList.add("wrong");
      button.disabled = true;
    }
    q.mark?.(v, false);
    q.padApi?.clear();
    if (tries < 2) {
      say(`Not quite. Consider: ${typeof q.hint === "function" ? q.hint(v) : q.hint || "what do you notice? Look again."}`);
      return;
    }
    busy = true;
    await sayAsync("Mistakes are how we learn. Let's look why.");
    if (!live()) return;
    let label = q.ansText;
    if (q.opts) {
      const i = q.opts.findIndex((o) => isRight(o.v));
      const b = host.querySelector(`[data-c="${i}"]`);
      b?.classList.add("right");
      label = label ?? q.opts[i]?.label;
      host.querySelectorAll("[data-c]").forEach((x) => (x.disabled = x !== b));
    }
    if (q.pad && q.padApi) q.padApi.set(q.ansText ?? q.ans);
    q.mark?.(q.ans, true);
    say(`The answer is <b>${label ?? q.ans}</b>. ${q.why}`);
    if (q.show) await q.show(live);
    if (!live()) return;
    done();
  };
  const done = () => {
    round += 1;
    window.OC?.count(cfg.count || "space questions");
    const last = round >= R;
    status(`Question ${round} of ${R}`);
    host.innerHTML = `<div class="ap-buttons"><button type="button" class="primary" data-next>${last ? "Finish ▶" : "Next ▶"}</button></div>`;
    host.onclick = (event) => {
      if (!event.target.closest("[data-next]")) return;
      VOICE.hush();
      if (last) finish();
      else ask();
    };
  };
  const finish = () => {
    if (!alive()) return;
    gen += 1;
    confetti();
    MUSIC.chime();
    shell.mark(id, { done: true });
    window.OC?.count("space games finished");
    status(`All ${R} done`);
    say(`All ${R} complete. You reasoned carefully and persisted. Now the most important step: explain the idea in your own words.`);
    endButtons(host, id, () => {
      round = 0;
      ask();
    });
  };
  onLevels(id, (lv) => {
    level = lv;
    round = 0;
    ask();
  });
  ask();
}
// three choices from a list, always including the answer, in a fixed order
const opt3 = (ans, pool, n = 3) => {
  const rest = shuffle(pool.filter((x) => x !== ans)).slice(0, n - 1);
  return shuffle([ans, ...rest]);
};
const labelled = (list, fn = (x) => String(x)) => list.map((x) => ({ label: fn(x), v: x }));

  let busy = false;
  let gen = 0;
  let tokens = [];
  let mode = MODES[level];
  const SX = (i) => 175 + i * 108;
  const SY = 150;
  const status = () => {
    const b = $("[data-status]");
    if (b) b.textContent = `Placed ${placed} of 8`;
  };
  const toSvg = (event) => {
    const p = view.createSVGPoint();
    p.x = event.clientX;
    p.y = event.clientY;
    return p.matrixTransform(view.getScreenCTM().inverse());
  };
  const start = () => {
    const g = ++gen;
    const live = () => alive() && g === gen;
    mode = MODES[level];
    placed = 0;
    wrongs = 0;
    busy = false;
    fresh();
    drawSun(view, -40, SY, 150);
    T(view, 560, 50, mode.title, 28, GOLD);
    for (let i = 0; i < 8; i++) {
      el("circle", { cx: SX(i), cy: SY, r: 42, fill: "#ffffff", opacity: 0.06, stroke: "#9aa3d6", "stroke-width": 2.5, "stroke-dasharray": "7 7" }, view);
      T(view, SX(i), SY + 9, i + 1, 26, "#6c74a8");
    }
    const xs = shuffle([...Array(8).keys()]);
    tokens = PLANETS.map((p, j) => {
      const x = 70 + xs[j] * 123;
      const y = 400;
      const t = el("g", { class: "sp-tap", "data-n": p.n }, view);
      el("circle", { r: 50, fill: "transparent" }, t);
      const r = level === "easy" ? Math.min(36, 16 + 24 * Math.sqrt(p.d / 139820)) * (p.ring ? 0.8 : 1) : p.ring ? 24 : 30;
      drawPlanet(t, 0, 0, r, p);
      const halo = el("circle", { r: 46, fill: "none", stroke: GOLD, "stroke-width": 5, opacity: 0 }, t);
      const name = T(t, 0, 66, p.n, 22, LIGHT);
      const tag = mode.tag(p) ? T(t, 0, 92, mode.tag(p), 22, GOLD) : null;
      move(t, x, y);
      const tok = { p, g: t, x, y, home: [x, y], halo, name, tag, done: false };
      wire(tok, live);
      return tok;
    });
    status();
    host.innerHTML = `<div class="ap-buttons"><button type="button" data-again>🔁 Say it again</button></div>`;
    host.onclick = (event) => {
      if (event.target.closest("[data-again]")) say(mode.ask);
    };
    say(mode.ask);
  };
  const wire = (tok, live) => {
    let drag = null;
    tok.g.addEventListener("pointerdown", (event) => {
      if (!live() || busy || tok.done) return;
      event.preventDefault();
      try {
        tok.g.setPointerCapture(event.pointerId);
      } catch {}
      const p = toSvg(event);
      drag = { sx: p.x, sy: p.y, moved: false };
      view.appendChild(tok.g);
    });
    tok.g.addEventListener("pointermove", (event) => {
      if (!drag) return;
      const p = toSvg(event);
      const dx = p.x - drag.sx;
      const dy = p.y - drag.sy;
      if (Math.hypot(dx, dy) > 10) drag.moved = true;
      if (drag.moved) move(tok.g, tok.x + dx, tok.y + dy);
    });
    const end = (event, cancel) => {
      if (!drag) return;
      const d = drag;
      drag = null;
      if (cancel) return back(tok, live);
      let target = null;
      if (!d.moved) target = firstEmpty();
      else {
        const p = toSvg(event);
        const x = tok.x + (p.x - d.sx);
        const y = tok.y + (p.y - d.sy);
        let best = 90;
        for (let i = 0; i < 8; i++) {
          const dist = Math.hypot(SX(i) - x, SY - y);
          if (dist < best && !tokens.some((t) => t.slot === i)) {
            best = dist;
            target = i;
          }
        }
      }
      if (target == null) return back(tok, live);
      attempt(tok, target, live);
    };
    tok.g.addEventListener("pointerup", (event) => end(event, false));
    tok.g.addEventListener("pointercancel", (event) => end(event, true));
  };
  const firstEmpty = () => {
    for (let i = 0; i < 8; i++) if (!tokens.some((t) => t.slot === i)) return i;
    return null;
  };
  const back = (tok, live) => {
    const [x0, y0] = [Number(tok.g.transform.baseVal[0]?.matrix.e ?? tok.x), Number(tok.g.transform.baseVal[0]?.matrix.f ?? tok.y)];
    tw(400, (t) => move(tok.g, x0 + (tok.x - x0) * t, y0 + (tok.y - y0) * t), live);
  };
  const place = async (tok, i, live) => {
    tok.done = true;
    tok.slot = i;
    tok.halo.setAttribute("opacity", 0);
    const x0 = tok.g.transform.baseVal[0]?.matrix.e ?? tok.x;
    const y0 = tok.g.transform.baseVal[0]?.matrix.f ?? tok.y;
    tok.x = SX(i);
    tok.y = SY;
    tok.name.setAttribute("y", 72);
    if (tok.tag) tok.tag.setAttribute("y", 98);
    await tw(500, (t) => move(tok.g, x0 + (SX(i) - x0) * t, y0 + (SY - y0) * t), live);
    MUSIC.play("xylophone", 72 + [0, 2, 4, 5, 7, 9, 11, 12][i], { gain: 0.4 });
    placed += 1;
    wrongs = 0;
    status();
    window.OC?.count("planets placed");
  };
  const attempt = async (tok, i, live) => {
    window.OC?.touch();
    const want = mode.order[i];
    if (tok.p === want) {
      busy = true;
      await place(tok, i, live);
      if (!live()) return;
      busy = false;
      if (placed === 8) return finish(live);
      say(level === "easy" ? `Correct. ${tok.p.n}: ${tok.p.fact}.` : `Correct. ${tok.p.n}: ${tok.tag ? tok.tag.textContent : ""}${level === "medium" ? " km" : ""}. Which comes next?`);
      return;
    }
    back(tok, live);
    MUSIC.oops();
    wrongs += 1;
    if (wrongs < 2) {
      say(mode.hint);
      return;
    }
    busy = true;
    await sayAsync("Mistakes are how we learn. Let's look why.");
    if (!live()) return;
    const k = firstEmpty();
    const right = tokens.find((t) => t.p === mode.order[k]);
    right.halo.setAttribute("opacity", 1);
    say(mode.why(right.p, k));
    await nap(1600, live);
    if (!live()) return;
    await place(right, k, live);
    if (!live()) return;
    busy = false;
    if (placed === 8) finish(live);
  };
  const finish = (live) => {
    confetti();
    MUSIC.chime();
    shell.mark(id, { done: true });
    window.OC?.count("space games finished");
    const b = $("[data-status]");
    if (b) b.textContent = "All 8 placed";
    say(`All 8 placed. ${mode.end} Now explain the pattern in your own words.`);
    endButtons(host, id, start);
    void live;
  };
  onLevels(id, (lv) => {
    level = lv;
    start();
  });
  start();
}

// ---------- 2. SIZES & DISTANCES ----------
function twoPlanets(q, api, a, b) {
  const big = a.d > b.d ? a : b;
  const scale = 170 / big.d;
  const left = Math.random() < 0.5 ? a : b;
  const right = left === a ? b : a;
  T(view, 500, 46, "Drawn to scale", 24, SOFT);
  [[left, 280], [right, 720]].forEach(([p, x]) => {
    const r = Math.max(3, p.d * scale);
    const g = el("g", { class: "sp-tap" }, view);
    el("circle", { cx: x, cy: 270, r: Math.max(r, 80), fill: "transparent" }, g);
    drawPlanet(g, x, 270, r, p);
    T(g, x, 500, p.n, 32, LIGHT);
    g.addEventListener("pointerdown", () => api.pick(p.n));
    q.nodes = { ...(q.nodes || {}), [p.n]: g };
  });
}
async function earthsAcross(target, live) {
  const ratio = target.d / EARTH_D;
  fresh();
  if (target.n === "Sun") {
    T(view, 500, 46, "The Sun", 30, GOLD);
    el("path", { d: "M40 470 A460 460 0 0 1 960 470 Z", fill: "url(#spSun)" }, view);
    const d = 920 / ratio;
    const count = T(view, 500, 535, "", 30, LIGHT);
    let shown = 0;
    await tw(2600, (t) => {
      const n = Math.round(109 * t);
      while (shown < n) {
        el("circle", { cx: 40 + d / 2 + shown * d, cy: 470 + d / 2 + 2, r: d / 2 - 0.5, fill: "#3f7fd6" }, view);
        shown += 1;
      }
      count.textContent = `${shown} Earths`;
    }, live, lin);
    count.textContent = "About 109 Earths across the Sun";
    return;
  }
  const D = ratio >= 8 ? 440 : 380;
  const d = D / ratio;
  T(view, 500, 40, target.n, 30, GOLD);
  drawPlanet(view, 500, 270, D / 2, target);
  const n = Math.round(ratio);
  const count = T(view, 500, 535, "", 30, LIGHT);
  for (let i = 0; i < n; i++) {
    drawPlanet(view, 500 - D / 2 + d / 2 + i * d, 270, d / 2 - 1, P.Earth);
    count.textContent = `${i + 1} Earth${i ? "s" : ""}`;
    MUSIC.play("xylophone", 72 + Math.min(24, i * 2), { gain: 0.3 });
    if (!(await nap(300, live))) return;
  }
  count.textContent = `About ${n} Earths across ${target.n}`;
}
// A walk from the Sun along a straight line. stepAu: AU per step. labels: which planets to name.
function walkStrip(target, { names = null, tapNames = null, api = null } = {}) {
  const x0 = 80;
  const xs = (au) => x0 + (au / target.au) * 840;
  drawSun(view, 20, 300, 50);
  el("line", { x1: 70, x2: 950, y1: 300, y2: 300, stroke: "#4c557f", "stroke-width": 3, "stroke-dasharray": "4 8" }, view);
  const list = PLANETS.filter((p) => p.au <= target.au + 1e-9 && (!names || names.includes(p.n)));
  let last = -99;
  let row = 0;
  const nodes = {};
  for (const p of list) {
    const x = xs(p.au);
    const g = el("g", { class: tapNames ? "sp-tap" : "" }, view);
    if (tapNames) el("circle", { cx: x, cy: 300, r: 55, fill: "transparent" }, g);
    drawPlanet(g, x, 300, tapNames ? 18 : 9, p);
    if (x - last > 70 || p === target || tapNames) {
      T(g, x, row % 2 ? 360 : 262, p.n, tapNames ? 30 : 22, p === target ? GOLD : SOFT);
      last = x;
      row += 1;
    }
    if (tapNames) g.addEventListener("pointerdown", () => api.pick(p.n));
    nodes[p.n] = g;
  }
  return { xs, nodes };
}
async function walk(target, stepMkm, live) {
  fresh();
  const { xs } = walkStrip(target);
  const total = target.mkm / stepMkm;
  T(view, 500, 60, stepMkm === 150 ? "1 step = 150 million km (Sun to Earth)" : `1 step = ${stepMkm} million km`, 28, GOLD);
  const walker = el("g", {}, view);
  emoji(walker, 0, 0, "🚶", 54, { transform: "scale(-1 1)" });
  move(walker, 80, 200);
  const steps = T(view, 500, 470, "Steps: 0", 34, LIGHT);
  const every = Math.max(1, Math.ceil(total / 40));
  let n = 0;
  const ok = await tw(Math.min(6000, 1500 + total * 120), (t) => {
    const au = target.au * t;
    move(walker, xs(au), 200);
    const k = Math.floor(total * t + 1e-6);
    if (k > n) {
      n = k;
      steps.textContent = `Steps: ${n}`;
      if (n % every === 0) {
        el("ellipse", { cx: xs((n / total) * target.au), cy: 405, rx: 5, ry: 9, fill: "#8e93b8" }, view);
        MUSIC.play("woodblock", 79, { gain: 0.15 });
      }
    }
  }, live, lin);
  if (!ok) return;
  steps.textContent = `About ${fmt(Math.round(total * 10) / 10)} steps, mostly empty space!`;
}
// A "worksheet" scene: the given facts, written clearly.
function sheet(title, lines, y0 = 150) {
  T(view, 500, 64, title, 30, GOLD);
  lines.forEach((ln, i) => T(view, 500, y0 + i * 56, ln, i === lines.length - 1 && /\?$/.test(ln) ? 36 : 28, i === lines.length - 1 && /\?$/.test(ln) ? LIGHT : SOFT));
}

      pts.push([x, y]);
      break;
    }

      break;

        ask: `Which event happened between ${a.y} and ${c.y}?`,
        draw() {
          timeline(view, 330, [a, c]);
          T(view, (TX(a.y) + TX(c.y)) / 2, 280, "?", 50, GOLD);

        opts: shuffle([mid, ...others]).map((e) => ({ label: `${e.e} ${e.s}`, v: e.y })),

        hint: "date each option roughly. Is it before, after, or inside that span?",
        why: `${mid.l[0]} (${mid.l[1]}): ${mid.y}.`,
      };
    },
    function sequence() {
      const three = shuffle([EVENTS[3], EVENTS[0], EVENTS[1]]);
      return {
        ask: "Which of these three came first?",
        draw() {
          three.forEach((ev, i) => eventCard(view, 180 + i * 320, 60, ev, 300, 260));
        },
        opts: three.map((e) => ({ label: `${e.e} ${e.s}`, v: e.y })),

        hint: "before risking a person in orbit, what would engineers test first?",
        why: "Sputnik 1 (1957), then the first person in space (1961), then the Moon landing (1969).",
