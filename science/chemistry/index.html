<script>const { $, el, svg: makeSvg, text, panel, say, pick, wait, confetti, choices, explain, everyday, emoji, shuffle } = KIT;

const W = 1000;
const H = 560;

let view = null;
let uid = 0;
const STOP = Symbol("stop");
const nid = (p) => `${p}${++uid}`;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const INK = "#2b1d12";

const UNITS = [
  { id: "c0", label: "See it", icon: "👀" },

// ---------- speech without emoji names ----------
const plainSpeech = (html) =>
  html
    .replace(/<[^>]+>/g, " ")
    .replace(/[\p{Extended_Pictographic}️‍]/gu, "")
    .replace(/−\s?(\d)/g, "minus $1")
    .replace(/°C/g, " degrees Celsius")
    .replace(/°F/g, " degrees Fahrenheit")
    .replace(/\bpH\b/g, "P H")
    .replace(/\s+/g, " ")
    .trim();
const tell = (html) => {
  say(html, { voice: false });
  VOICE.speak(plainSpeech(html));
};
const tellAsync = (html) => {
  say(html, { voice: false });
  return VOICE.speakAsync(plainSpeech(html));
};

function openTry(id) {
  const t = TRY[id];
  if (!t) return;
  document.querySelector(".ch-try")?.remove();
  const box = document.createElement("div");
  box.className = "ch-try";
  box.setAttribute("role", "dialog");
  box.setAttribute("aria-label", "Try it for real");
  box.innerHTML = `<div class="ch-card"><h2><span aria-hidden="true">${t.icon}</span>🏠 Try it for real: ${t.title}</h2><div class="ch-cols"><div><h3>You need</h3><ul>${t.need.map((x) => `<li>${x}</li>`).join("")}</ul></div><div><h3>Steps</h3><ol>${t.steps.map((x) => `<li>${x}</li>`).join("")}</ol></div></div><div class="ch-note">👀 <b>Notice:</b> ${t.notice}</div><div class="ch-safe">⚠️ <b>Safety:</b> ${t.safe}</div><button type="button" class="kt-go" data-close>✓ Got it</button></div>`;
  document.body.appendChild(box);
  VOICE.speak(plainSpeech(`Try it for real: ${t.title}. ${t.steps.join(" ")} Notice: ${t.notice} Safety: ${t.safe}`));
  box.addEventListener("click", (e) => {
    if (e.target === box || e.target.closest("[data-close]")) {
      VOICE.hush();
      box.remove();
    }
  });
  window.OC?.touch();
}

// ---------- drawing helpers ----------
function fresh(id) {
  stage.innerHTML = "";
  document.querySelector(".ch-try")?.remove();
  view = makeSvg(`0 0 ${W} ${H}`, stage);
  const defs = el("defs", {}, view);
  const wall = el("linearGradient", { id: "chWall", x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  el("stop", { offset: 0, "stop-color": "#f4fbf5" }, wall);
  el("stop", { offset: 1, "stop-color": "#f6faf3" }, wall);
  el("rect", { x: -1500, y: -1000, width: W + 3000, height: H + 1000, fill: "#f6faf3" }, view);
  el("rect", { width: W, height: H, fill: "url(#chWall)" }, view);
  el("rect", { x: -1500, y: BENCH, width: W + 3000, height: H - BENCH + 1000, fill: "#e3bf8f" }, view);
  el("rect", { x: -1500, y: BENCH, width: W + 3000, height: 10, fill: "#c99a62" }, view);
  for (let x = 40; x < W; x += 160) el("path", { d: `M${x} ${BENCH + 34}q60 -8 120 0`, stroke: "#d4a874", "stroke-width": 3, fill: "none" }, view);
  if (id && TRY[id]) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "ch-trybtn";
    b.textContent = "🏠 Try it for real";

    stage.appendChild(b);

}

// Predict → Test → Why strip, top left.
let stepNodes = [];
function drawSteps(parent) {
  stepNodes = [];
  [["🤔", "Predict"], ["🧪", "Test"], ["💡", "Why"]].forEach(([icon, word], i) => {
    const g = el("g", { transform: `translate(${16 + i * 162} 12)` }, parent);
    const r = el("rect", { width: 150, height: 46, rx: 23, fill: "#fff", stroke: "#cfe6d4", "stroke-width": 3 }, g);
    emoji(g, 28, 22, icon, 26);
    const t = text(g, 92, 31, word, { "font-size": 24, fill: "#6b7d70" });
    stepNodes.push({ r, t });
    if (i < 2) text(parent, 16 + i * 162 + 156, 44, "›", { "font-size": 26, fill: "#9bb8a2" });
  });
}
function setStep(i) {
  stepNodes.forEach((s, k) => {
    s.r.setAttribute("fill", k === i ? "var(--accent)" : k < i ? "var(--accent-soft)" : "#fff");
    s.r.setAttribute("stroke", k <= i ? "var(--accent)" : "#cfe6d4");
    s.t.setAttribute("fill", k === i ? "#fff" : k < i ? "var(--accent-dark)" : "#6b7d70");
  });
}

function glass(parent, x, y, w, h, { level = 0.6, color = "#9ad7f5", op = 0.8 } = {}) {
  const g = el("g", {}, parent);
  const id = nid("chg");
  const cp = el("clipPath", { id }, g);
  const d = `M${x} ${y}L${x + 8} ${y + h - 20}Q${x + 10} ${y + h} ${x + 30} ${y + h}L${x + w - 30} ${y + h}Q${x + w - 10} ${y + h} ${x + w - 8} ${y + h - 20}L${x + w} ${y}Z`;
  el("path", { d }, cp);
  el("path", { d, fill: "#ffffff", opacity: 0.6 }, g);
  const inner = el("g", { "clip-path": `url(#${id})` }, g);
  const liq = el("rect", { x: x - 5, y: y + h * (1 - level), width: w + 10, height: h * level + 5, fill: color, opacity: op }, inner);
  const front = el("g", { "clip-path": `url(#${id})` }, g);
  el("path", { d, fill: "none", stroke: "#7d98a6", "stroke-width": 6, "stroke-linejoin": "round" }, g);
  el("path", { d: `M${x + 20} ${y + 22}L${x + 26} ${y + h - 44}`, stroke: "#fff", "stroke-width": 8, "stroke-linecap": "round", opacity: 0.75 }, g);
  const o = {
    g,
    inner,
    front,
    liq,
    x,
    y,
    w,
    h,
    level,
    yAt: (lv) => y + h * (1 - lv),
    set(lv, col) {
      o.level = lv;
      liq.setAttribute("y", y + h * (1 - lv));
      liq.setAttribute("height", h * lv + 5);
      if (col) liq.setAttribute("fill", col);
    },
  };
  return o;
}

const hex = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
const mix = (a, b, t) => {
  const A = hex(a);
  const B = hex(b);
  return `#${A.map((v, i) => Math.round(lerp(v, B[i], t)).toString(16).padStart(2, "0")).join("")}`;
};

// A zoom circle with moving particles. Modes: lattice (hold place and wiggle), wander (slide, liquid), fly (gas).
function Zoom(parent, cx, cy, R, alive, { label = "🔬 Zoomed in", bg = "#f2fafe" } = {}) {
  const g = el("g", { transform: `translate(${cx} ${cy})` }, parent);
  el("line", { x1: R * 0.7, y1: R * 0.7, x2: R * 1.06, y2: R * 1.06, stroke: "#8a5a3a", "stroke-width": 26, "stroke-linecap": "round" }, g);
  el("circle", { r: R, fill: bg, stroke: "#5a4130", "stroke-width": 10 }, g);
  const id = nid("chz");
  const cp = el("clipPath", { id }, g);
  el("circle", { r: R - 5 }, cp);
  const inner = el("g", { "clip-path": `url(#${id})` }, g);
  const over = el("g", { "clip-path": `url(#${id})` }, g);
  if (label) text(g, -R + 6, -R - 8, label, { "font-size": 23, fill: "#5a4130", "text-anchor": "start" });
  const z = {
    g,
    inner,
    over,
    R,
    ps: [],
    heat: 1,
    add(p) {
      const q = { x: 0, y: 0, vx: 0, vy: 0, r: 13, fill: "#4aa3df", mode: "wander", top: -R, bot: R, spd: 1, shake: 3, ...p };
      q.hx ??= q.x;
      q.hy ??= q.y;
      q.node = el("circle", { cx: q.x, cy: q.y, r: q.r, fill: q.fill, stroke: "rgba(0,0,0,.25)", "stroke-width": 2 }, inner);
      z.ps.push(q);
      return q;
    },
  };
  const frame = () => {
    if (!alive() || !g.isConnected) return;
    const ht = z.heat;
    const ps = z.ps;
    for (const p of ps) {
      if (p.mode === "lattice" || p.mode === "stuck") {
        p.x += (p.hx - p.x) * 0.12;
        p.y += (p.hy - p.y) * 0.12;
        const j = p.mode === "stuck" ? 0 : p.shake * ht;
        p.dx = (Math.random() - 0.5) * j;
        p.dy = (Math.random() - 0.5) * j;
      } else {
        const s = (p.mode === "fly" ? 4.6 : 1.1) * ht * p.spd;
        p.vx += (Math.random() - 0.5) * s * 0.6;
        p.vy += (Math.random() - 0.5) * s * 0.6;
        const v = Math.hypot(p.vx, p.vy);
        if (v > s) {
          p.vx *= s / v;
          p.vy *= s / v;
        }
        p.x += p.vx;
        p.y += p.vy;
        const top = p.mode === "fly" ? -R : p.top;
        const bot = p.mode === "fly" ? R : p.bot;
        if (p.y < top + p.r) {
          p.y += (top + p.r - p.y) * 0.25;
          p.vy = Math.abs(p.vy);
        }
        if (p.y > bot - p.r) {
          p.y -= (p.y - bot + p.r) * 0.25;
          p.vy = -Math.abs(p.vy);
        }
        const d = Math.hypot(p.x, p.y);
        const lim = R - p.r - 6;
        if (d > lim) {
          p.x *= lim / d;
          p.y *= lim / d;
          const nx = p.x / d;
          const ny = p.y / d;
          const dot = p.vx * nx + p.vy * ny;
          if (dot > 0) {
            p.vx -= 2 * dot * nx;
            p.vy -= 2 * dot * ny;
          }
        }
        p.dx = 0;
        p.dy = 0;
      }
    }
    for (let i = 0; i < ps.length; i++)
      for (let j = i + 1; j < ps.length; j++) {
        const a = ps[i];
        const b = ps[j];
        const fa = a.mode === "wander" || a.mode === "fly";
        const fb = b.mode === "wander" || b.mode === "fly";
        if (!fa && !fb) continue;
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 0.01;
        const min = a.r + b.r + 1;
        if (d < min) {
          const push = (min - d) / (fa && fb ? 2 : 1);
          const ux = dx / d;
          const uy = dy / d;
          if (fa) {
            a.x -= ux * push;
            a.y -= uy * push;
          }
          if (fb) {

const grid = (cols, rows, gap, cx = 0, cy = 0) => {

};

const tw = (ms, fn, alive) =>
  new Promise((resolve) => {
    if (KIT.still.matches) {
      fn(1);
      return resolve(true);
    }
    const t0 = performance.now();
    const frame = (now) => {
      if (!alive()) return resolve(false);
      const t = Math.min(1, (now - t0) / ms);
      fn(t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
      if (t < 1) requestAnimationFrame(frame);
      else resolve(true);
    };
    requestAnimationFrame(frame);
  });

const LEVELS = [["easy", "🐣 Easy"], ["medium", "🦊 Medium"], ["hard", "🦁 Hard"]];

function puffs(parent, x, y, n = 4, spread = 60) {

// ---------- the Predict → Test → Why game engine ----------
// make(level) returns rounds: { q, o: [[v, label]...], a, why, draw(ctx) -> scene, test(ctx, scene), hint?, tries? }
function labGame(id, { make, word = "experiments" }) {
  const my = token;
  let level = shell.progress()[id]?.level || "easy";
  let gen = 0;
  panel(`${levelRow(level)}<div class="ch-acts" data-acts></div>`);
  const acts = $("[data-acts]");
  const start = () => {
    const g = ++gen;
    const alive = () => my === token && g === gen;
    const list = make(level);
    let round = 0;
    const ctx = {
      alive,
      level,
      wait: (ms) => new Promise((res, rej) => setTimeout(() => (alive() ? res() : rej(STOP)), KIT.still.matches ? Math.min(ms, 200) : ms)),
      tween: async (ms, fn) => {
        if (!(await tw(ms, fn, alive))) throw STOP;
      },
      say: (h) => alive() && tell(h),
      sayAsync: async (h) => {
        await tellAsync(h);
        if (!alive()) throw STOP;
      },
      press: (buttons) =>
        new Promise((resolve) => {
          if (!alive()) return;
          acts.innerHTML = `<div class="ap-buttons">${buttons.map(([k, l, primary]) => `<button type="button" data-a="${k}"${primary ? ' class="primary" data-pulse' : ""}>${l}</button>`).join("")}</div>`;
          acts.onclick = (e) => {
            const b = e.target.closest("[data-a]");
            if (!b || !alive()) return;
            window.OC?.touch();
            acts.onclick = null;
            resolve(b.dataset.a);
          };
        }),
    };
    const play = async () => {
      const r = list[round];
      $("[data-status]").textContent = `Experiment ${round + 1} of ${list.length}`;
      fresh(id);
      const scene = r.draw(ctx) || {};
      drawSteps(view);
      setStep(0);
      tell(`🤔 <b>Predict:</b> ${r.q}`);
      let tries = 0;
      const guess = await new Promise((resolve) => {
        const opts = r.keep ? r.o : shuffle(r.o);
        window.__chRound = { r, opts, round };
        choices(acts, opts.map(([v, label]) => ({ v, label })), (o, button) => {
          if (!alive()) return;
          window.OC?.touch();
          if (r.tries && o.v !== r.a && tries === 0) {
            tries += 1;
            button.classList.add("wrong");
            button.disabled = true;
            MUSIC.oops();
            tell(`Mistakes are how we learn. ${r.hint || "What do you notice? Try again."}`);
            return;
          }
          acts.onclick = null;
          button.classList.add("picked");
          resolve(o.v);
        });
      });
      if (!alive()) return;
      setStep(1);
      await r.test(ctx, scene, guess);
      if (!alive()) return;
      setStep(2);
      const ok = guess === r.a;
      if (ok) MUSIC.chime();
      else MUSIC.oops();
      const lead = ok
        ? tries
          ? "You tried again and found it!"
          : pick(["Your prediction matched!", "Just as you predicted!", "You predicted it!"])
        : r.tries
          ? "Now we know! Let's look why."
          : pick(["Surprise! Scientists get surprised all the time. Let's look why.", "Not what we predicted, and that's how scientists learn! Here's why."]);
      tell(`💡 ${lead} ${r.why}`);
      window.OC?.count(word);
      round += 1;
      await ctx.press([["next", round >= list.length ? "🏁 Finish" : "Next ▶", true]]);
      if (!alive()) return;
      if (round >= list.length) finish();
      else play().catch(onErr);
    };
    const finish = () => {
      confetti();
      MUSIC.chime();
      shell.mark(id, { done: true });
      setStep(2);
      tell(`🎉 You made ${list.length} predictions and tested every one, just like a real scientist. You kept going! Now try it for real, away from the screen.`);
      acts.innerHTML = `<div class="ap-buttons"><button type="button" class="primary" data-a="try" data-pulse>🏠 Try it for real</button><button type="button" data-a="again">🔁 Again</button></div>`;
      acts.onclick = (e) => {
        const b = e.target.closest("[data-a]");
        if (!b || !alive()) return;
        if (b.dataset.a === "try") openTry(id);
        else start();
      };
    };
    const onErr = (e) => {
      if (e !== STOP) console.error(e);
    };
    play().catch(onErr);
  };
  $("[data-levels]").addEventListener("click", (event) => {
    const b = event.target.closest("[data-lv]");
    if (!b) return;
    document.querySelectorAll("[data-lv]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    level = b.dataset.lv;
    shell.mark(id, { level });
    window.OC?.touch();
    VOICE.hush();
    start();
  });
  start();
}

function slgTest(r) {
  return async (ctx, sc) => {
    if (r.f) {
      await ctx.wait(500);
      sc.fahr = true;
      sc.show();
    }
    if (r.goal === r.start) {
      ctx.say(`🔬 ${r.look || "Look closely at the tiny particles in the zoom circle."}`);
      await ctx.press([["see", "👀 I see it", true]]);
      return;
    }
    const dir = Math.sign(r.goal - r.start);
    ctx.say(`🧪 Let's test it! Tap ${dir > 0 ? "🔥 Hotter" : "❄️ Cooler"}${r.count ? " and count your presses" : ""}.`);
    let n = 0;
    while (dir > 0 ? sc.T < r.goal : sc.T > r.goal) {
      const k = await ctx.press([["cool", "❄️ Cooler"], ["hot", "🔥 Hotter"], ["unit", "°C ⇄ °F"]]);
      if (!ctx.alive()) return;
      if (k === "unit") {
        sc.toggle();
        continue;
      }
      const d = k === "hot" ? 10 : -10;
      const T = clamp(sc.T + d, -20, 120);
      if (d * dir < 0) ctx.say(`That makes it ${d > 0 ? "hotter" : "colder"}. For this test, tap ${dir > 0 ? "🔥 Hotter" : "❄️ Cooler"}.`);
      else {
        n += 1;
        if (r.count) sc.setPress(n);
        MUSIC.play("xylophone", d > 0 ? 72 + Math.min(24, n * 2) : 96 - Math.min(24, n * 2), { gain: 0.3 });
      }
      await sc.setT(T, d > 0);
    }
    await ctx.wait(900);
  };
}

function disSat(ctx, r) {
  const v = view;
  const cups = r.cups;
  const out = cups.map((c, i) => {
    const x = cups.length === 1 ? 220 : 90 + i * 330;
    const gl = glass(v, x, 200, 230, BENCH - 200, { level: 0.62, color: c.warm ? "#a9d8ef" : WATER });
    text(v, x + 115, 182, c.label, { "font-size": 28, fill: INK });
    if (c.warm) puffs(v, x + 115, 210, 3, 40);
    const pile = el("g", {}, gl.inner);
    const count = text(v, x + 115, 530, "", { "font-size": cups.length > 1 ? 22 : 28, fill: "#5a4130" });
    return { ...c, gl, pile, count, x, n: 0 };
  });
  if (cups.length === 1) {
    const z = Zoom(v, 790, 300, 150, ctx.alive);
    for (let k = 0; k < 20; k++) z.add({ x: -110 + (k % 7) * 36, y: -90 + Math.floor(k / 7) * 60, r: 12, fill: "#4aa3df", mode: "wander", spd: 0.9 });
    out[0].z = z;
  }
  return {
    out,
    async add() {
      for (const o of out) {
        o.n += 1;
        const extra = o.n - o.limit;
        o.count.textContent = extra > 0 ? `${o.limit} dissolved, ${extra} on the bottom` : `${o.n} added, all dissolved`;
        if (extra > 0) {
          for (let k = 0; k < 10; k++) el("rect", { x: o.x + 40 + ((k * 17 + o.n * 7) % 150), y: BENCH - 12 - extra * 8 - (k % 2) * 6, width: 9, height: 9, fill: "#fff", stroke: "#cfc6b6" }, o.pile);

        if (extra > 0 && o.z) o.z.add({ x: 0, y: 120, hx: (o.n - 6) * 26 - 26, hy: 120, r: 11, fill: "#f6f1e7", mode: "lattice", shake: 1 });
      }
      MUSIC.play("woodblock", 79, { gain: 0.25 });
      await ctx.wait(450);
    },
  };
}

function snowflake(parent, x, y, s, arms = 6) {

  const list = [];
  for (let k = 0; k < arms; k++) {
    const a = el("g", { transform: `rotate(${(k * 360) / arms})` }, g);
    el("line", { x1: 0, y1: 0, x2: 0, y2: -s, stroke: "#5aa7d6", "stroke-width": 10, "stroke-linecap": "round" }, a);
    for (const f of [0.45, 0.72]) {
      el("line", { x1: 0, y1: -s * f, x2: s * 0.22, y2: -s * (f + 0.18), stroke: "#5aa7d6", "stroke-width": 7, "stroke-linecap": "round" }, a);
      el("line", { x1: 0, y1: -s * f, x2: -s * 0.22, y2: -s * (f + 0.18), stroke: "#5aa7d6", "stroke-width": 7, "stroke-linecap": "round" }, a);
    }
    list.push(a);
  }
  el("circle", { r: s * 0.14, fill: "#cfe9f8", stroke: "#5aa7d6", "stroke-width": 5 }, g);
  return { g, arms: list };
}
function cube3d(parent, x, y, s, { fill = "#ffffff", stroke = "#9fb3c0" } = {}) {
  const g = el("g", { transform: `translate(${x} ${y})` }, parent);
  const dx = s * 0.5;
  const dy = s * 0.3;
  const faces = [
    el("path", { d: `M0 0L${s} 0L${s} ${s}L0 ${s}Z`, fill, stroke, "stroke-width": 3 }, g),
    el("path", { d: `M0 0L${dx} ${-dy}L${s + dx} ${-dy}L${s} 0Z`, fill: mix(fill, "#d7e6ef", 0.5), stroke, "stroke-width": 3 }, g),
    el("path", { d: `M${s} 0L${s + dx} ${-dy}L${s + dx} ${s - dy}L${s} ${s}Z`, fill: mix(fill, "#b8cddb", 0.5), stroke, "stroke-width": 3 }, g),
  ];
  const corners = [[0, 0], [s, 0], [s, s], [0, s], [dx, -dy], [s + dx, -dy], [s + dx, s - dy], [dx, s - dy]];
  return { g, faces, corners };
}

function changeRound(key) {
  const c = CHG[key];
  return {
    q: `${c.name}. Can we undo it?`,
    o: [["rev", "↩️ Can undo"], ["irr", "➡️ Can't undo"]],
    a: c.rev ? "rev" : "irr",
    keep: true,
    tries: true,
    hint: c.hint,
    why: c.why,
    draw(ctx) {
      const v = view;
      const bins = [["↩️ Can undo", 40, "#e6f4ff"], ["➡️ Can't undo", 700, "#fff1e6"]];
      bins.forEach(([l, x, f]) => {
        el("rect", { x, y: 330, width: 260, height: BENCH - 330 + 10, rx: 24, fill: f, stroke: "#d8c6ac", "stroke-width": 4 }, v);
        text(v, x + 130, 312, l, { "font-size": 28, fill: INK });
      });
      el("rect", { x: 360, y: 110, width: 280, height: 300, rx: 32, fill: "#fff", stroke: "var(--accent)", "stroke-width": 5 }, v);
      const pic = el("g", {}, v);
      const glyph = emoji(pic, 500, 240, c.b, 140);
      const lab = text(v, 500, 384, c.name, { "font-size": c.name.length > 18 ? 22 : 26, fill: INK });
      const act = text(v, 500, 455, "", { "font-size": 30, fill: "#a8632d" });
      return { pic, glyph, lab, act };
    },
    async test(ctx, sc) {
      ctx.say(`🧪 Let's test it. Tap ${c.fwd}.`);
      await ctx.press([["f", c.fwd, true]]);
      sc.act.textContent = c.fwd;
      await ctx.tween(500, (t) => sc.glyph.setAttribute("opacity", 1 - t));
      sc.glyph.textContent = c.a;
      MUSIC.play("harp", 67, { gain: 0.3 });
      await ctx.tween(500, (t) => sc.glyph.setAttribute("opacity", t));
      ctx.say(`Now let's try to undo it. Tap ${c.back}.`);
      await ctx.press([["b", c.back, true]]);
      sc.act.textContent = c.back;
      if (c.rev) {
        await ctx.tween(500, (t) => sc.glyph.setAttribute("opacity", 1 - t));
        sc.glyph.textContent = c.b;
        MUSIC.play("harp", 72, { gain: 0.3 });
        await ctx.tween(500, (t) => sc.glyph.setAttribute("opacity", t));
        sc.act.textContent = "↩️ It came back!";
      } else {
        await ctx.tween(900, (t) => sc.pic.setAttribute("transform", `translate(${Math.sin(t * Math.PI * 6) * 14} 0)`));
        MUSIC.play("cello", 48, { gain: 0.3 });
        sc.act.textContent = "➡️ It stays changed";
      }
      await ctx.wait(700);
      const bx = c.rev ? 170 : 830;
      await ctx.tween(900, (t) => {
        const sc2 = 1 - 0.45 * t;
        sc.pic.setAttribute("transform", `translate(${lerp(500, bx, t) - 500 * sc2} ${lerp(240, 400, t) - 240 * sc2}) scale(${sc2})`);
      });
      emoji(view, 500, 250, c.rev ? `${c.b}→${c.a}→${c.b}` : `${c.b}→${c.a}`, c.rev ? 56 : 70);
      await ctx.wait(400);
    },
  };
}
