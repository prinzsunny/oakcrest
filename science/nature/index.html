<!doctype html>
<html lang="en">
<head>

<title>Nature Explorers · OakCrest Academy</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">

<link rel="stylesheet" href="../../assets/app.css">
<script src="../../assets/oc.js"></script>
<script src="../../assets/firebase-config.js"></script>
<script src="../../assets/cloud.js"></script>
<script src="../../assets/voice.js"></script>
<script src="../../assets/music.js"></script>
<script src="../../assets/shell.js"></script>
<script src="../../assets/kit.js"></script>
<style>
html{touch-action:manipulation}
.ap-stage{-webkit-touch-callout:none}
.ne-round{position:absolute;inset:0}
.ne-emo{display:block;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:clamp(38px,11vh,100px);line-height:1.1;font-style:normal}
.ne-svg{display:block;overflow:visible}

/* cards: big, instant press feedback, no hover states that stick on touch */
.ne-card{position:relative;display:grid;place-items:center;min-width:0;min-height:0;padding:6px;border:0;border-radius:24px;background:#fff;box-shadow:0 0 0 3px #e4efe6,0 6px 0 #d3e3d6;color:var(--ink);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;transition:transform .08s ease,box-shadow .08s ease,opacity .3s ease;font-family:var(--sans)}
.ne-card:active{transform:translateY(4px) scale(.97);box-shadow:0 0 0 3px #e4efe6,0 2px 0 #d3e3d6}
.ne-card:focus-visible,.ne-zone:focus-visible,.ne-cbtn:focus-visible{outline:4px solid #ffcf5c;outline-offset:3px}
.ne-card svg{pointer-events:none}
.ne-card.good{box-shadow:0 0 0 5px #22a05a,0 6px 0 #157a40}
.ne-card.bad{opacity:.4}
.ne-card.dim{opacity:.3}
.ne-card.hint,.ne-zone.hint{animation:ne-glow 1s ease-in-out infinite}
.ne-act{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;pointer-events:none}
.ne-pic{display:grid;place-items:center;flex:1 1 auto;min-height:0;width:100%;transform:scale(var(--s,1));transform-origin:50% 85%}
.ne-pic svg{height:100%;max-height:clamp(56px,17vh,150px);width:auto;max-width:100%}
.ne-act b{font:900 clamp(15px,2.4vh,23px)/1.15 var(--sans);color:#2b1d12;text-align:center;max-width:100%;overflow-wrap:break-word}

/* picking rounds */
.ne-q{position:absolute;inset:0;display:flex;gap:clamp(8px,1.6vw,16px);padding:clamp(8px,1.6vw,16px)}
.ne-prompt{flex:0 0 36%;min-width:0;min-height:0;display:grid;place-items:center;border-radius:24px;background:var(--accent-soft);overflow:hidden;padding:8px}
.ne-q.wide .ne-prompt{flex-basis:46%}
.ne-prompt>svg{width:100%;height:100%}
.ne-cards{flex:1 1 auto;min-width:0;min-height:0;display:flex;gap:clamp(8px,1.6vw,16px)}
.ne-pick{flex:1 1 0}
.ne-q.side .ne-cards{flex-direction:column}
.ne-q.side .ne-cards.n4,.ne-cards.n4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
.ne-q.side .ne-cards.n3 .ne-act{flex-direction:row;gap:12px}
.ne-q.side .ne-cards.n3 .ne-pic{flex:0 0 auto;width:auto;height:100%}
.ne-q.side .ne-cards.n3 .ne-emo{font-size:clamp(32px,8vh,70px)}
.ne-cards.n4 .ne-emo{font-size:clamp(30px,8vh,74px)}
.ne-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;width:100%;height:100%;text-align:center}
.ne-state .ne-pic{flex:0 1 auto;max-height:50%}
.ne-state .ne-emo{font-size:clamp(44px,12vh,110px)}
.ne-state p{margin:0;color:#2b1d12;font:800 clamp(18px,3vh,30px)/1.25 var(--sans)}
.ne-fossil-pic .ne-emo,.ne-fossil-pic svg{filter:sepia(.85) saturate(.75) contrast(1.05)}
.ne-fossil-pic .ne-emo{font-size:clamp(70px,20vh,180px)}
.ne-fossil-pic svg{height:clamp(90px,26vh,220px);width:auto}
@media (max-aspect-ratio:1/1){
  .ne-q{flex-direction:column}
  .ne-prompt{flex-basis:34%}
  .ne-q.wide .ne-prompt{flex-basis:40%}
  .ne-q.side .ne-cards{flex-direction:row}
  .ne-q.side .ne-cards.n3 .ne-act{flex-direction:column;gap:4px}
  .ne-q.side .ne-cards.n3 .ne-pic{flex:1 1 auto;width:100%;height:auto}
}

/* race track */
.ne-row{flex-wrap:nowrap;width:min(100%,620px)}
.ne-race{position:relative;flex:1 1 220px;min-width:140px;height:44px;border-radius:22px;background:#8d6e4b;box-shadow:inset 0 0 0 3px #7cc66a}
.ne-race::before{content:"";position:absolute;left:12px;right:44px;top:50%;height:3px;margin-top:-1px;background:repeating-linear-gradient(90deg,#f3e3c3 0 10px,transparent 10px 20px)}
.ne-race-goal{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:24px;line-height:1}
.ne-racer{position:absolute;left:4px;top:50%;margin-top:-19px;font-size:30px;line-height:38px;transition:left .9s cubic-bezier(.3,.8,.3,1)}
@media (max-width:480px){.ne-wide{display:none}.ne-row{gap:6px}.ne-row .ap-btn{min-width:52px;padding:0 12px}}

/* drag and sort */
.ne-sort{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(140px,.34fr);gap:clamp(8px,1.6vw,14px);padding:clamp(8px,1.6vw,14px)}
.ne-zones{display:grid;gap:clamp(6px,1.2vw,12px);min-height:0}
.ne-sort.cols .ne-zones{grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.ne-sort.rows .ne-zones{grid-auto-rows:minmax(0,1fr);gap:0;border-radius:22px;overflow:hidden}
.ne-zone{position:relative;min-height:0;border:0;border-radius:22px;overflow:hidden;background:#eef6ef;box-shadow:0 0 0 3px #e4efe6,0 6px 0 #d3e3d6;color:#2b1d12;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:box-shadow .12s ease,transform .08s ease;font-family:var(--sans)}
.ne-sort.rows .ne-zone{border-radius:0;box-shadow:none}
.ne-zone:active{transform:translateY(2px)}
.ne-zone.over{box-shadow:inset 0 0 0 6px #ffcf5c;transform:scale(1.02)}
.ne-zone-name{position:absolute;left:10px;top:8px;z-index:1;max-width:calc(100% - 20px);padding:4px 12px;border-radius:14px;background:rgba(255,255,255,.93);color:#2b1d12;font:900 clamp(13px,2.1vh,19px)/1.2 var(--sans);text-align:left}
.ne-zone-name i{font-style:normal}
.ne-zone-park{position:absolute;left:8px;right:8px;top:44px;bottom:6px;display:flex;flex-wrap:wrap;align-content:flex-end;justify-content:center;gap:4px;pointer-events:none}
.ne-sort.rows .ne-zone-park{top:4px;bottom:4px;left:auto;right:8px;width:52%;align-content:center;justify-content:flex-end}
.ne-sort.rows .ne-zone-name{top:50%;transform:translateY(-50%)}
.ne-zone-park span{display:grid;place-items:center}
.ne-zone-park .ne-emo{font-size:clamp(24px,5.5vh,48px)}
.ne-zone-park svg{height:clamp(26px,6vh,52px);width:auto}
.ne-dock{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:0;min-width:0}
.ne-token{position:relative;width:100%;max-width:220px;aspect-ratio:1;flex:0 1 auto;max-height:calc(100% - 26px);border-radius:24px;background:#fff;box-shadow:0 0 0 3px #e4efe6,0 6px 0 #d3e3d6;touch-action:none;cursor:grab;will-change:transform;-webkit-user-drag:none}
.ne-token[hidden]{display:none}
.ne-token.lift{cursor:grabbing;box-shadow:0 0 0 3px #ffcf5c,0 18px 24px rgba(0,0,0,.2);z-index:5}
.ne-left{color:var(--muted);font:800 14px var(--sans);min-height:1em}
.z-sun{background:linear-gradient(#bfeaff,#6cc7f2)}
.z-twi{background:linear-gradient(#3d8fc9,#1d5a91)}
.z-mid{background:linear-gradient(#123764,#06142a)}
.z-emergent{background:linear-gradient(#cdeeff,#a8dcb0)}
.z-canopy{background:linear-gradient(#6dbb5a,#3f9b47)}
.z-under{background:linear-gradient(#3b8a42,#2a6a33)}
.z-floor{background:linear-gradient(#5f7a3a,#6b4a2b)}
.z-arctic{background:linear-gradient(#e8f4ff,#bcdcf5)}
.z-antarctic{background:linear-gradient(#f4f8ff,#cfd8ea)}
.z-both{background:linear-gradient(#dff3f1,#b8e1dc)}
.z-plant{background:linear-gradient(#e2f5d5,#b7e09c)}
.z-meat{background:linear-gradient(#fde6dc,#f6b9a1)}
.z-fish{background:linear-gradient(#dff4ff,#a9dcf5)}
.z-mammal{background:linear-gradient(#fff2dc,#f5d39b)}
.z-inv{background:linear-gradient(#f2e6ff,#d4b8f2)}
.z-insect{background:linear-gradient(#e5f7da,#bfe5a6)}
.z-not{background:linear-gradient(#f3eee8,#ddd2c4)}
@media (max-aspect-ratio:1/1){
  .ne-sort{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,27%)}
  .ne-token{height:calc(100% - 22px);width:auto;max-width:100%}
  .ne-sort.cols .ne-zones.n3{grid-auto-flow:row;grid-auto-columns:auto;grid-auto-rows:minmax(0,1fr)}
}

/* put in order */
.ne-order{position:absolute;inset:0;display:flex;flex-direction:column;gap:clamp(8px,1.6vh,14px);padding:clamp(8px,1.6vw,14px)}
.ne-order .ne-prompt{flex:0 0 34%;width:100%}
.ne-slots{flex:1 1 0;display:flex;align-items:stretch;gap:4px;min-height:0}
.ne-slot{position:relative;flex:1 1 0;min-width:0;border-radius:20px;border:4px dashed var(--accent);background:#fbfff9}
.ne-slot.filled{border-style:solid;background:#fff}
.ne-slot-n{position:absolute;left:8px;top:4px;z-index:1;color:var(--accent-dark);font:900 clamp(16px,2.6vh,24px)/1 var(--sans)}
.ne-slot-art{position:absolute;inset:0}
.ne-arrow{align-self:center;flex:none;color:var(--accent-dark);font:900 clamp(16px,3vh,26px)/1 var(--sans)}
.ne-pool{flex:1 1 0;display:flex;gap:clamp(6px,1.4vw,14px);min-height:0}
.ne-ocard{flex:1 1 0}
.ne-ocard.used{visibility:hidden}
.ne-order .ne-emo{font-size:clamp(28px,8vh,72px)}
.ne-slots.n5 .ne-act b,.ne-pool.n5 .ne-act b{font-size:clamp(12px,1.9vh,18px)}
@media (max-aspect-ratio:1/1){.ne-arrow{display:none}.ne-slots{gap:6px}.ne-act b{font-size:clamp(12px,2vh,20px)}}

/* tap the part */
.ne-tap{position:absolute;inset:0;display:grid;place-items:center;padding:clamp(6px,1.4vw,14px)}
.ne-tap-art{width:100%;height:100%;min-height:0}
.ne-tap-art svg{width:100%;height:100%;display:block}
[data-part]{cursor:pointer}
.ne-tap .ne-hit:not([data-hit]){stroke:#ffb300;stroke-width:7px;paint-order:stroke}
.ne-tap .ne-hit.hint:not([data-hit]){animation:ne-blink .8s ease-in-out infinite}
.ne-tap .ne-no:not([data-hit]){stroke:#e53935;stroke-width:6px;paint-order:stroke}
.ne-lbl{opacity:0;transition:opacity .3s ease;font-family:var(--sans);font-weight:900;fill:#2b1d12;stroke:#fff;stroke-width:6px;paint-order:stroke;pointer-events:none}
.ne-lbl.show{opacity:1}

/* build with + and - */
.ne-build{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(8px,1.6vw,16px);padding:clamp(8px,1.6vw,16px)}
.ne-build-art{min-width:0;min-height:0;border-radius:24px;background:var(--accent-soft);overflow:hidden}
.ne-build-art svg{width:100%;height:100%;display:block}
.ne-ctl{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,1.4vh,12px)}
.ne-cbtn{min-width:86px;min-height:clamp(54px,11vh,76px);padding:0 16px;border:0;border-radius:22px;background:#fff;box-shadow:0 5px 0 #d3e3d6;color:var(--ink);font:900 clamp(26px,5vh,36px)/1 var(--sans);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.ne-cbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #d3e3d6}
.ne-cbtn:disabled{opacity:.4}
.ne-cbtn.ne-check{background:var(--accent);color:#fff;box-shadow:0 5px 0 var(--accent-dark);font-size:clamp(19px,3.2vh,24px)}
.ne-count{display:grid;place-items:center;min-width:86px;min-height:1em;color:#2b1d12;font:900 clamp(36px,8vh,60px)/1 var(--sans)}
@media (max-aspect-ratio:1/1){
  .ne-build{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .ne-ctl{flex-direction:row;flex-wrap:wrap}
  .ne-cbtn{min-width:64px}
  .ne-count{min-width:56px}
}

/* dig */
.ne-dig{position:absolute;inset:0;display:grid;padding:clamp(8px,1.6vw,16px)}
.ne-pit{position:relative;min-height:0;border-radius:24px;overflow:hidden;background:radial-gradient(circle at 30% 30%,#c9b291 0 8%,transparent 9%) 0 0/120px 120px,radial-gradient(circle at 70% 60%,#b59c78 0 6%,transparent 7%) 0 0/90px 90px,linear-gradient(#bda585,#a88d6b)}
.ne-fossil{position:absolute;inset:0;display:grid;place-items:center}
.ne-fossil .ne-emo{font-size:clamp(90px,30vh,230px)}
.ne-fossil svg{height:62%;width:auto;max-width:80%}
.ne-sand{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.ne-brush{position:absolute;right:12px;bottom:10px;padding:6px 12px;border-radius:14px;background:rgba(255,255,255,.9);font:800 15px var(--sans);color:#5a3d22;pointer-events:none}

/* volcano and blubber experiment */
.ne-lab{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(8px,1.6vw,16px);padding:clamp(8px,1.6vw,16px)}
.ne-lab-art{min-width:0;min-height:0;border-radius:24px;overflow:hidden;background:#eaf6ff}
.ne-lab-art svg{width:100%;height:100%;display:block}
.ne-lab-ctl{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.ne-gauge{position:relative;width:34px;height:clamp(110px,36vh,280px);border-radius:17px;background:#efe7dc;overflow:hidden;box-shadow:inset 0 0 0 3px #e0d4c4}
.ne-gauge i{position:absolute;left:0;right:0;bottom:0;height:var(--p,0%);background:linear-gradient(#ff5722,#ffca28);transition:height .2s ease,width .2s ease}
.ne-push{width:clamp(108px,15vw,150px);aspect-ratio:1;align-content:center;gap:2px}
.ne-push .ne-emo{font-size:clamp(40px,8vh,64px)}
.ne-push b{font:900 clamp(18px,3vh,24px)/1 var(--sans)}
.ne-push.hold{transform:scale(.95);box-shadow:0 0 0 5px #ffcf5c,0 3px 0 #d3e3d6}
@media (max-aspect-ratio:1/1){
  .ne-lab{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .ne-lab-ctl{flex-direction:row}
  .ne-gauge{width:clamp(120px,40vw,200px);height:28px}
  .ne-gauge i{top:0;right:auto;height:100%;width:var(--p,0%)}
  .ne-push{width:110px}
}
.ne-shake{animation:ne-quake .35s linear infinite}

/* hide and seek */
.ne-hunt{position:absolute;inset:0;padding:clamp(6px,1.4vw,14px)}
.ne-hunt svg{width:100%;height:100%;display:block;border-radius:22px;cursor:pointer;touch-action:manipulation}
.ne-ring{animation:ne-pulse 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}

/* end card */
.ne-done{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vw,32px);padding:16px;background:radial-gradient(circle at 30% 40%,#fff,var(--accent-soft))}
.ne-done-pic{display:grid;place-items:center;width:min(34vh,260px);aspect-ratio:1;flex:none;border-radius:50%;background:#fff;box-shadow:0 8px 0 #d3e3d6;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:min(20vh,150px);line-height:1}
.ne-done-text{max-width:30em}
.ne-done-text h2{margin:0 0 8px;color:var(--accent-dark);font:900 clamp(20px,3vw,30px)/1.15 var(--sans)}
.ne-done-text p{margin:0;color:#2b1d12;font:700 clamp(17px,2.4vw,23px)/1.4 var(--sans)}
@media (max-aspect-ratio:1/1){.ne-done{flex-direction:column;text-align:center}.ne-done-pic{width:min(28vh,200px);font-size:min(16vh,120px)}}

@keyframes ne-glow{0%,100%{box-shadow:0 0 0 3px #e4efe6,0 6px 0 #d3e3d6}50%{box-shadow:0 0 0 8px #ffcf5c,0 6px 0 #d3e3d6}}
@keyframes ne-blink{0%,100%{stroke-opacity:1}50%{stroke-opacity:.2}}
@keyframes ne-quake{0%,100%{transform:translate(0,0)}25%{transform:translate(-4px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-1px)}}
@keyframes ne-pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.ne-card.hint,.ne-zone.hint,.ne-shake,.ne-ring,.ne-tap .ne-hit.hint:not([data-hit]){animation:none}}
</style>
</head>
<body data-subject="science">
<div class="ap">
<header class="ap-bar">
  <a class="ap-home" href="../../" aria-label="OakCrest home" title="OakCrest home">🏠</a>
  <div class="ap-title"><b>Nature Explorers</b><small>Science · Foundations to Level 3</small></div>
  <button type="button" class="ap-pick" data-pick aria-label="Choose an expedition"></button>
  <div class="ap-spacer"></div>
  <div class="ap-tools">
    <span data-chip data-home="../../"></span>
    <button type="button" class="ap-icon" data-help aria-label="How to play" title="How to play" hidden>❓</button>
    <button type="button" class="ap-icon" data-voice aria-label="Voice on">🔊</button>
    <button type="button" class="ap-icon" data-menu aria-label="Settings">⚙</button>
    <div class="ap-pop" data-pop hidden>
      <label>Voice <select data-voice-pick aria-label="Choose a voice"></select></label>
      <button type="button" class="ap-pop-btn" data-sound>🔔 Sounds on</button>
      <p>Piano and xylophone sounds from the FluidR3 GM soundfont by Frank Wen, used under Creative Commons Attribution 3.0.</p>
    </div>
  </div>
</header>
<main class="ap-main"><div class="ap-stage" data-stage></div><div class="ap-panel" data-panel></div></main>
</div>
<script>const { $, el, panel, wait, confetti, explain, shuffle, still, surprise, sparkle, PRAISE, KIND } = KIT;
const stage = $("[data-stage]");
let token = 0;
let cleanups = [];
let shell = null;
const learner = () => (window.OC ? OC.current() : "") || "";
const rpick = (list) => list[Math.floor(Math.random() * list.length)];
const cap = (s) => s[0].toUpperCase() + s.slice(1);
const attr = (s) => String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
const EMO = "Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif";

    if (event.button > 0) return;

    run(event);

const LEVEL_UP = ["You're learning so fast! Here come some harder facts.", "Super exploring! Let's make it a little trickier.", "Wow! Let's go up a level."];
const HALFWAY = ["Halfway there, explorer! Keep going!", "You're halfway! Great exploring!", "Halfway! You're doing brilliantly!"];

// ======================================================================
// Learning that adapts (as in Zoom Town). Each expedition keeps a level for the child:
// three right first time in a row → harder facts; two misses in a row → easier.
// Missed items are remembered and come back in later rounds.
// The first level follows the learner's site level: Foundations, Level 2, Level 3.
// ======================================================================
const startLevel = () => {
  const lv = window.OC ? OC.levelOf(OC.current()) : "";
  return !lv || lv === "Foundations" ? 0 : lv === "Level 2" ? 1 : 2;
};
function skillOf(id, { max = 2 } = {}) {
  const saved = shell.progress()[id] || {};
  let level = Math.max(0, Math.min(max, saved.level ?? startLevel()));
  let missed = Array.isArray(saved.missed) ? saved.missed : [];
  let streak = 0;
  let slips = 0;
  const save = () => shell.mark(id, { level, missed });
  return {
    get level() {
      return level;
    },
    max,
    right(key) {
      streak += 1;
      slips = 0;
      missed = missed.filter((k) => k !== key);
      const up = streak >= 3 && level < max;
      if (up) {
        level += 1;
        streak = 0;
      }
      save();
      return up;
    },
    wrong(key) {
      streak = 0;
      slips += 1;
      missed = [key, ...missed.filter((k) => k !== key)].slice(0, 8);
      if (slips >= 2 && level > 0) {
        level -= 1;
        slips = 0;
      }
      save();
    },
    // Not the same as last time; a missed item comes back about two rounds in five.
    pick(list, keyOf, last) {
      const others = list.filter((x) => keyOf(x) !== last);
      const pool = others.length ? others : list;
      const review = pool.filter((x) => missed.includes(keyOf(x)));
      return review.length && Math.random() < 0.4 ? rpick(review) : rpick(pool);
    },
  };
}

// ======================================================================

// Tap the right card.
function pickCards(ctx, o) {
  return new Promise((resolve) => {
    const { my } = ctx;
    const n = o.choices.length;
    const root = document.createElement("div");
    root.className = `ne-q${o.prompt ? " side" : ""}${o.wide ? " wide" : ""}`;
    root.innerHTML = `${o.prompt ? `<div class="ne-prompt">${o.prompt}</div>` : ""}<div class="ne-cards n${n}">${o.choices.map((c, i) => `<button type="button" class="ne-card ne-pick" data-c="${i}" aria-label="${attr(c.label)}">${cardArt(c.g, c.label, c.scale)}</button>`).join("")}</div>`;
    ctx.box.replaceChildren(root);
    const cards = $(".ne-cards", root);
    const prompt = $(".ne-prompt", root);
    if (prompt?.firstElementChild) anim(prompt.firstElementChild, [{ transform: "scale(.85)", opacity: 0 }, { transform: "none", opacity: 1 }], 380, { fill: "none" });
    [...cards.children].forEach((card, i) => anim(card, [{ transform: "translateY(24px)", opacity: 0 }, { transform: "none", opacity: 1 }], 380, { delay: i * 70, fill: "backwards" }));

      const c = o.choices[Number(button.dataset.c)];
      if (!open || c.state || my !== token) return;
      if (c.ok) {
        open = false;
        c.state = "good";
        button.classList.add("good");
        for (const b of cards.children) if (b !== button) b.classList.add("dim");
        MUSIC.chime();
        sparkle(button);
        pop(button);
        await talk(o.praise, my);
        resolve();
      } else {
        tries += 1;
        c.state = "bad";
        ctx.miss();
        button.classList.add("bad");
        MUSIC.oops();
        shake(button);

        if (tries >= Math.min(2, n - 1)) {

          resolve();
        } else await talk(o.hint ? o.hint(c) : `${rpick(KIND)} Try another one.`, my);

        return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
      });
    tokenEl.addEventListener("pointerdown", (event) => {
      if (!open || drag) return;
      event.preventDefault();
      for (const a of tokenEl.getAnimations()) a.cancel();
      try {
        tokenEl.setPointerCapture(event.pointerId);
      } catch {}
      drag = { id: event.pointerId, x0: event.clientX, y0: event.clientY, x: 0, y: 0, over: null };
      tokenEl.classList.add("lift");
      window.OC?.touch();
    });
    tokenEl.addEventListener("pointermove", (event) => {
      if (!drag || event.pointerId !== drag.id) return;
      drag.x = event.clientX - drag.x0;
      drag.y = event.clientY - drag.y0;
      drag.cx = event.clientX;
      drag.cy = event.clientY;
      if (frame) return;
      frame = requestAnimationFrame(() => {
        frame = 0;
        if (!drag) return;
        tokenEl.style.transform = `translate(${drag.x}px, ${drag.y}px) scale(1.05)`;
        const over = zoneAt(drag.cx, drag.cy);
        if (over !== drag.over) {
          drag.over?.classList.remove("over");
          over?.classList.add("over");
          drag.over = over;
        }
      });
    });
    const drop = (event) => {
      if (!drag || event.pointerId !== drag.id) return;
      const d = drag;
      drag = null;
      cancelAnimationFrame(frame);
      frame = 0;
      tokenEl.classList.remove("lift");
      d.over?.classList.remove("over");
      const zone = event.type === "pointerup" ? zoneAt(event.clientX, event.clientY) : null;
      tokenEl.style.transform = "";
      if (zone) answer(zone, { x: d.x, y: d.y });
      else {
        anim(tokenEl, [{ transform: `translate(${d.x}px, ${d.y}px)` }, { transform: "none" }], 380, { fill: "none" });
        if (Math.hypot(d.x, d.y) < 12) talk(question(), my);
      }
    };
    tokenEl.addEventListener("pointerup", drop);
    tokenEl.addEventListener("pointercancel", drop);
    onTap(root, "[data-zone]", (zone) => answer(zone));
    next();
  });
}

// Tap the pictures in order; each one flies into the next numbered box.
function orderTap(ctx, o) {
  return new Promise((resolve) => {
    const { my } = ctx;
    const n = o.items.length;
    let deck = shuffle(o.items.map((it, k) => ({ ...it, k })));
    if (deck.every((d, j) => d.k === j)) deck = deck.reverse();
    const root = document.createElement("div");
    root.className = "ne-order";
    root.innerHTML = `${o.prompt ? `<div class="ne-prompt">${o.prompt}</div>` : ""}<div class="ne-slots n${n}">${o.items.map((_, k) => `<div class="ne-slot" data-slot="${k}"><span class="ne-slot-n">${k + 1}</span></div>${k < n - 1 ? '<span class="ne-arrow" aria-hidden="true">➜</span>' : ""}`).join("")}</div><div class="ne-pool n${n}">${deck.map((d, j) => `<button type="button" class="ne-card ne-ocard" data-o="${j}" aria-label="${attr(d.label)}">${cardArt(d.g, d.label)}</button>`).join("")}</div>`;
    ctx.box.replaceChildren(root);
    const pool = $(".ne-pool", root);
    [...pool.children].forEach((card, j) => anim(card, [{ transform: "translateY(24px)", opacity: 0 }, { transform: "none", opacity: 1 }], 380, { delay: j * 70, fill: "backwards" }));
    let step = 0;
    let tries = 0;
    let busy = false;
    ctx.again = () => talk(o.ask, my);
    talk(o.ask, my);
    onTap(pool, "[data-o]", async (button) => {
      const d = deck[Number(button.dataset.o)];
      if (busy || d.placed || my !== token) return;
      if (d.k === step) {
        busy = true;
        d.placed = true;
        const slot = root.querySelector(`[data-slot="${step}"]`);
        const from = button.getBoundingClientRect();
        slot.insertAdjacentHTML("beforeend", `<span class="ne-slot-art">${cardArt(d.g, d.label)}</span>`);
        const art = slot.lastElementChild;
        const to = art.getBoundingClientRect();
        button.classList.add("used");
        for (const h of root.querySelectorAll(".hint")) h.classList.remove("hint");
        slot.classList.add("filled");
        anim(art, [{ transform: `translate(${from.left - to.left}px, ${from.top - to.top}px) scale(${from.width / Math.max(1, to.width)})` }, { transform: "none" }], 420, { fill: "none" });
        MUSIC.play("xylophone", SCALE[step * 2] || 84, { gain: 0.45 });
        step += 1;
        tries = 0;
        await talk(d.say || `<b>${d.label}</b>`, my);
        if (my !== token) return;
        if (step >= n) {
          MUSIC.chime();
          sparkle($(".ne-slots", root));
          await talk(o.done, my);
          return resolve();
        }
        busy = false;
      } else {
        tries += 1;
        ctx.miss();
        MUSIC.oops();
        shake(button);
        busy = true;
        if (tries >= 2) {
          const right = [...pool.children][deck.findIndex((x) => x.k === step)];
          right.classList.add("hint");
          await talk(`<b>${o.items[step].label}</b> comes ${step ? "next" : "first"}.`, my);
        } else await talk(step === 0 ? `${rpick(KIND)} What comes first?` : `${rpick(KIND)} What comes after <b>${o.items[step - 1].label}</b>?`, my);
        busy = false;
      }
    });
  });
}

// Tap the right part of a drawing (a volcano, the Earth, an insect, a globe).
function tapPart(ctx, o) {
  return new Promise((resolve) => {
    const { my } = ctx;
    const root = document.createElement("div");
    root.className = "ne-tap";
    root.innerHTML = `<div class="ne-tap-art">${o.svg}</div>`;
    ctx.box.replaceChildren(root);
    const all = (k) => root.querySelectorAll(`[data-part="${k}"]`);
    const label = (k) => root.querySelectorAll(`[data-label="${k}"]`).forEach((l) => l.classList.add("show"));
    let tries = 0;
    let open = true;
    ctx.again = () => talk(o.ask, my);
    talk(o.ask, my);
    onTap(root, "[data-part]", async (part) => {
      if (!open || my !== token) return;
      const key = part.dataset.part;
      if (key === o.target) {
        open = false;
        all(key).forEach((p) => p.classList.add("ne-hit"));
        label(key);
        MUSIC.chime();
        sparkle(part);
        await talk(o.praise, my);
        resolve();
      } else {
        tries += 1;
        ctx.miss();
        MUSIC.oops();
        all(key).forEach((p) => {
          p.classList.add("ne-no");
          setTimeout(() => p.classList.remove("ne-no"), 900);
        });
        label(key);
        if (tries >= 2) {
          open = false;
          all(o.target).forEach((p) => p.classList.add("ne-hit", "hint"));
          label(o.target);
          await talk(o.reveal, my);
          resolve();
        } else await talk(`${rpick(KIND)} That's the <b>${o.names[key]}</b>. ${o.hint || "Try again!"}`, my);
      }
    });
  });
}

// Make something with ➕ and ➖ (legs on a bug, buses beside a dinosaur), then ✓ Check.
function counter(ctx, o) {
  return new Promise((resolve) => {
    const { my } = ctx;
    let n = o.n0 || 0;
    const root = document.createElement("div");
    root.className = "ne-build";
    root.innerHTML = `<div class="ne-build-art">${o.art}</div><div class="ne-ctl"><button type="button" class="ne-cbtn" data-minus aria-label="One less">➖</button><output class="ne-count" data-n aria-live="polite">${n}</output><button type="button" class="ne-cbtn" data-plus aria-label="One more">➕</button><button type="button" class="ne-cbtn ne-check" data-check>✓ Check</button></div>`;
    ctx.box.replaceChildren(root);
    const vary = $("[data-var]", root);
    const out = $("[data-n]", root);
    const show = () => {
      vary.innerHTML = o.parts(n);
      out.textContent = n;
      $("[data-minus]", root).disabled = n <= 0;
      $("[data-plus]", root).disabled = n >= o.max;
    };
    show();
    let tries = 0;
    let open = true;
    ctx.again = () => talk(o.ask, my);
    talk(o.ask, my);
    onTap(root, "[data-plus],[data-minus],[data-check]", async (button) => {
      if (!open || my !== token) return;
      if (button.matches("[data-plus]") || button.matches("[data-minus]")) {
        n = Math.max(0, Math.min(o.max, n + (button.matches("[data-plus]") ? 1 : -1)));
        show();
        pop(out);
        MUSIC.play("xylophone", SCALE[Math.max(0, n - 1)] || 72, { gain: 0.4 });
        talk(`<b>${n}</b>`, my);
        return;
      }
      if (n === o.target) {
        open = false;
        MUSIC.chime();
        sparkle(vary.closest("svg") || button);
        pop(root.firstElementChild);
        await talk(o.praise, my);
        resolve();
      } else {
        tries += 1;
        ctx.miss();
        MUSIC.oops();
        shake(out);
        if (tries >= 2) {
          open = false;
          n = o.target;
          show();
          await talk(o.reveal, my);
          resolve();
        } else await talk(o.wrong(n), my);
      }
    });
  });
}

// ======================================================================
// The round engine: an expedition is a plan of rounds. Every round is a different kind
// (dig, drag, order, tap, build, true or false...), chosen at the child's level.
// The race track under the stage moves the explorer one step per round.
// ======================================================================
const raceHtml = (racer = "🧭", goal = "🏁") => `<div class="ne-race" data-race aria-hidden="true"><span class="ne-race-goal">${goal}</span><span class="ne-racer" data-racer>${racer}</span></div>`;
function raceTo(host, round, rounds) {
  const racer = $("[data-racer]", host);
  if (racer) racer.style.left = `calc((100% - 78px) * ${round / rounds} + 4px)`;
}
async function expedition(cfg) {
  const my = token;
  const rounds = cfg.plan.length;
  const skill = skillOf(cfg.id);
  const own = {};
  const lastOf = {};
  let round = 0;
  let ctx = null;
  stage.innerHTML = `<div class="ne-round" data-round></div>`;
  const box = $("[data-round]", stage);
  const host = panel(`<div class="ap-row ne-row">${raceHtml(cfg.racer, cfg.goal)}<span class="ap-status" data-level></span><button type="button" class="ap-btn" data-again aria-label="Say it again">🔊<span class="ne-wide"> Again</span></button></div>`);
  host.onclick = (event) => {
    if (event.target.closest("[data-again]")) ctx?.again?.();
  };
  const dots = () => {
    raceTo(host, round, rounds);
    $("[data-level]", host).innerHTML = `🧭<span class="ne-wide"> Level</span> ${skill.level + 1}`;
  };
  dots();
  if (cfg.intro) {
    surprise("stars");
    await talk(cfg.intro, my);
  }
  while (round < rounds) {
    if (my !== token) return;
    const step = cfg.plan[round];
    const T = THEMES[step.theme];
    // In the Explorer quiz each question comes at the level the child has reached in that expedition.
    const sk = step.theme === cfg.id ? skill : (own[step.theme] ||= skillOf(step.theme));
    const kind = KINDS[step.kind];
    const slot = `${step.theme}:${step.kind}:${step.arg || ""}`;
    const q = kind.gen(T, sk.level, sk, lastOf[slot], step.arg);
    lastOf[slot] = q.key;
    ctx = {
      my,
      box,
      level: sk.level,
      tries: 0,
      again: null,
      miss(key) {
        if (!this.tries) skill.wrong(key ?? q.key);
        this.tries += 1;
      },
    };
    await kind.run(q, ctx, T, step.arg);
    if (my !== token) return;
    const up = ctx.tries === 0 ? skill.right(q.key) : false;
    round += 1;
    window.OC?.count(cfg.count);
    dots();
    if (round === 3 || round === rounds - 2) surprise();
    if (up && round < rounds) {
      await levelUp(my);
      if (my !== token) return;
      dots();
    }
    if (round === Math.ceil(rounds / 2) && round < rounds) {
      await talk(rpick(HALFWAY), my);
      if (my !== token) return;
    }
  }
  finishCard({ id: cfg.id, ...cfg.finish });
}
const NEXT = { see: "dino", dino: "ocean", ocean: "rain", rain: "polar", polar: "volcano", volcano: "bugs", bugs: "quiz", quiz: null };
function finishCard({ id, icon, message, speech }) {
  const my = token;
  stage.innerHTML = `<div class="ne-done"><div class="ne-done-pic" aria-hidden="true">${icon}</div><div class="ne-done-text"><h2>Try it for real, with a grown-up</h2><p>${message}</p></div></div>`;
  confetti();
  MUSIC.chime();
  shell.mark(id, { done: true });
  const host = panel(`<div class="ap-buttons"><button type="button" data-again>🔁 Play again</button>${NEXT[id] ? '<button type="button" class="primary" data-next data-pulse>▶ Next expedition</button>' : ""}</div>`);
  talk(speech, my);
  host.onclick = (event) => {
    if (event.target.closest("[data-again]")) shell.go(id);
    else if (event.target.closest("[data-next]")) shell.go(NEXT[id]);
  };
}

// Pick items for a sorting round: the first may be a missed one, the rest spread over the places.
function sortRound(pool, zones, level, skill, last, extra = {}) {
  const n = Math.min(pool.length, [2, 3, 4][Math.min(level, 2)]);
  const first = skill.pick(pool, (x) => x.key, last);
  const chosen = [first];
  const rest = shuffle(pool.filter((x) => x !== first));
  for (const z of shuffle(zones)) {
    if (chosen.length >= n) break;
    if (chosen.some((c) => c.zone === z.key)) continue;
    const hit = rest.find((x) => x.zone === z.key && !chosen.includes(x));
    if (hit) chosen.push(hit);
  }
  for (const x of rest) if (chosen.length < n && !chosen.includes(x)) chosen.push(x);
  return { key: first.key, zones, items: shuffle(chosen), ...extra };
}

      const list = level >= 2 ? [{ key: "b-ant", kind: "ant" }, { key: "b-lady", kind: "ladybird" }, { key: "b-spider", kind: "spider" }, { key: "b-spider", kind: "spider" }] : [{ key: "b-ant", kind: "ant" }, { key: "b-lady", kind: "ladybird" }];
      const it = skill.pick(list, (x) => x.key, last);
      return { key: it.key, kind: it.kind };
    },
    async run(q, ctx) {
      const spider = q.kind === "spider";
      const name = spider ? "spider" : q.kind;
      const target = spider ? 8 : 6;
      await counter(ctx, {
        art: bugSvg(q.kind, { vary: true }),
        n0: 0,
        max: 10,
        target,
        parts: (k) => bugParts(q.kind, k),
        ask: spider ? "Spiders are <b>not</b> insects. Give the spider the right number of legs with ➕, then press Check." : ctx.level === 0 ? `Insects have <b>6 legs</b>. Give the ${name} 6 legs! Tap ➕ to add a leg, then press Check.` : `How many legs does an insect have? Give the ${name} the right number with ➕, then press Check.`,
        praise: spider ? `${rpick(PRAISE)} 8 legs, 4 on each side. Spiders have 8 legs, so they are not insects. They're arachnids.` : `${rpick(PRAISE)} 6 legs, 3 on each side. All insects have 6 legs!`,
        wrong: (k) => (k < target ? `That's ${k} legs. ${ctx.level === 0 ? "We need 6. Add more!" : "Count again: does it need more?"}` : `That's ${k} legs. That's too many! Take some away.`),
        reveal: spider ? "A spider has 8 legs: 4 on each side. Count them: 1, 2, 3, 4, 5, 6, 7, 8!" : "An insect has 6 legs: 3 on each side. Count them: 1, 2, 3, 4, 5, 6!",
      });
      if (!spider || ctx.my !== token) return;
      return factRound(ctx, { q: "How many <b>body parts</b> does a spider have?", a: ["2️⃣", "2"], w: [["3️⃣", "3"], ["1️⃣", "1"], ["4️⃣", "4"]], why: "A spider has 2 body parts. An insect has 3: head, thorax and abdomen.", p: "🕷️", lv: 2 });
    },
  },

  // ---------- Minibeasts: tap the parts of an insect ----------
  parts: {
    gen: (T, level, skill, last) => {
      const asks = [
        [
          { key: "pa", target: "antennae", ask: "Tap the <b>antennae</b>. Insects feel and smell with them.", praise: "Yes! The antennae are on the head." },
          { key: "pl", target: "legs", ask: "Tap a <b>leg</b>.", praise: "Yes! Insects have 6 legs." },
          { key: "pw", target: "wings", ask: "Tap the <b>wings</b>.", praise: "Yes! Most insects have wings and can fly." },
        ],
        [
          { key: "ph", target: "head", ask: "Insects have 3 body parts. Tap the <b>head</b>.", praise: "Yes! The head has the eyes, mouth and antennae." },
          { key: "pt", target: "thorax", ask: "Insects have 3 body parts. Tap the <b>thorax</b>: the middle part.", praise: "Yes! The thorax is the middle part." },
          { key: "pb", target: "abdomen", ask: "Insects have 3 body parts. Tap the <b>abdomen</b>: the back part.", praise: "Yes! The abdomen is the biggest part, at the back." },
        ],
        [
          { key: "p2t", target: "thorax", ask: "Tap the part where the <b>legs and wings</b> join on.", praise: "Yes! The legs and wings all join onto the thorax." },
          { key: "p2h", target: "head", ask: "Tap the part with the <b>eyes and antennae</b>.", praise: "Yes! The head has the eyes, the mouth and the antennae." },
          { key: "p2b", target: "abdomen", ask: "Tap the part where food is <b>digested</b>.", praise: "Yes! Food is digested in the abdomen, the big back part." },
        ],
      ][Math.min(level, 2)];
      const a = skill.pick(asks, (x) => x.key, last);
      return { key: a.key, a };
    },
    run: (q, ctx) =>
      tapPart(ctx, {
        svg: bugSvg("bee", { parts: true }),
        target: q.a.target,
        names: { head: "head", thorax: "thorax", abdomen: "abdomen", legs: "legs", antennae: "antennae", wings: "wings" },
        ask: q.a.ask,
        praise: q.a.praise,
        reveal: `Here it is! ${q.a.praise.replace(/^Yes! /, "")}`,
      }),
  },
};

// ======================================================================
const T = (g, x, y, s) => svgPic(g, x, y, s);
function sceneFor(bg, items, label) {
  return async (view, api) => {
    view.innerHTML = bg;
    if (label) {
      const t = el("g", {}, view);
      t.innerHTML = `<text x="500" y="540" text-anchor="middle" font-size="34" font-weight="900" fill="#2b1d12" stroke="#fff" stroke-width="8" paint-order="stroke" font-family="Nunito, sans-serif">${label}</text>`;
    }
    for (const [g, x, y, s] of items) {
      const node = el("g", { opacity: 0 }, view);
      node.innerHTML = T(g, x, y, s);
      await api.tween(380, (t) => {
        node.setAttribute("opacity", t);
        node.setAttribute("transform", `translate(0 ${((1 - t) * 30).toFixed(1)})`);
      });
      await api.wait(150);
    }
  };
}

  bugs: `<rect width="1000" height="560" fill="#e8f5e9"/><rect y="420" width="1000" height="140" fill="#81c784"/><g stroke="#4caf50" stroke-width="6">${Array.from({ length: 30 }, (_, i) => `<path d="M${i * 34 + 10} 430 l-6 -30 M${i * 34 + 20} 430 l6 -24"/>`).join("")}</g>`,
};
function seeScenes() {
  return [
    {
      say: "Hello, explorer! Let's visit six amazing places in nature: the time of the <b>dinosaurs</b>, the deep <b>ocean</b>, the <b>rainforest</b>, the icy <b>poles</b>, <b>volcanoes</b>, and tiny <b>minibeasts</b>!",
      draw: async (view, api) => {
        view.innerHTML = SEE_BG.intro;
        const c = el("g", { opacity: 0 }, view);

        await api.tween(500, (t) => c.setAttribute("opacity", t));
        const icons = ["🦕", "🐙", "🌴", "🐧", "🌋", "🐞"];
        for (let i = 0; i < 6; i++) {
          const a = -Math.PI / 2 + (i * Math.PI) / 3;
          const g = el("g", { opacity: 0 }, view);
          g.innerHTML = T(icons[i], 500 + Math.cos(a) * 340, 235 + Math.sin(a) * 175, 76);
          await api.tween(300, (t) => g.setAttribute("opacity", t));
        }
      },
    },
    { say: "Long, long ago, <b>dinosaurs</b> lived on Earth. We know because we find their bones and footprints in rock. These are called <b>fossils</b>. And birds are living dinosaurs!", draw: sceneFor(SEE_BG.dino, [["🦕", 300, 300, 220], ["🦖", 680, 310, 180], ["🦴", 470, 480, 70], ["🐦", 860, 220, 60]]) },
    { say: "The <b>ocean</b> is salty and covers most of our planet. Near the top it's sunny. Deep down it's completely dark, and some animals make their own light!", draw: sceneFor(SEE_BG.ocean, [["🐬", 300, 100, 90], ["🐢", 640, 110, 80], ["🦑", 420, 280, 90], ["svg:angler", 650, 470, 110], ["🐳", 850, 120, 100]]) },
    { say: "<b>Rainforests</b> are hot and rainy. Animals live in every layer, from the forest floor all the way up to the tallest treetops.", draw: sceneFor(SEE_BG.rain, [["🦅", 780, 70, 80], ["🐒", 280, 210, 90], ["🦥", 600, 220, 90], ["🐸", 420, 350, 70], ["🐆", 640, 490, 90]]) },
    { say: "The <b>Arctic</b> is at the top of the world, where polar bears live. <b>Antarctica</b> is at the bottom, where penguins live. They never meet!", draw: sceneFor(SEE_BG.polar, [["🐻‍❄️", 220, 330, 150], ["🦊", 400, 380, 80], ["🐧", 700, 340, 130], ["🐧", 840, 360, 100]]) },
    { say: "Deep under the ground, rock is so hot it melts. A <b>volcano</b> is where that melted rock, called lava, comes out. When rocks underground slip, the ground shakes: that's an <b>earthquake</b>.", draw: async (view, api) => {
      view.innerHTML = `<rect width="1000" height="560" fill="#d6efff"/>`;
      const g = el("g", { opacity: 0 }, view);
      g.innerHTML = volcanoSvg('x="150" y="40" width="700" height="470"');
      await api.tween(500, (t) => g.setAttribute("opacity", t));
      const flows = g.querySelectorAll("[data-flow]");
      const mag = g.querySelector("[data-magma]");
      await api.tween(1600, (t) => {
        mag.setAttribute("y", (326 - t * 226).toFixed(1));

      });

    {
      say: "Pick an expedition, and let's explore! Every right answer moves you closer to the treasure.",

          await api.tween(320, (t) => g.setAttribute("opacity", t));

const planOf = (T) => T.plan.map((s) => {
  const [kind, arg] = s.split(":");
  return { theme: T.id, kind, arg };
});
const units = {
  see() {
    const my = token;
    explain(seeScenes(), { alive: () => my === token, onDone: () => { shell.mark("see", { done: true }); shell.go("dino"); } });
  },
  quiz() {
    const ids = ["dino", "ocean", "rain", "polar", "volcano", "bugs"];
    const order = [...shuffle(ids), ...shuffle(ids).slice(0, 4)];
    const pattern = ["facts", "myth", "quick", "facts", "myth", "quick", "facts", "myth", "quick", "facts"];
    const plan = order.map((theme, i) => {
      const s = pattern[i] === "quick" ? THEMES[theme].quick : pattern[i];
      const [kind, arg] = s.split(":");
      return { theme, kind, arg };
    });
    expedition({
      id: "quiz",
      racer: "🧭",
      goal: "🏆",
      count: "quiz questions",
      intro: "The Explorer quiz! Questions from every expedition. Every right answer moves your compass closer to the trophy.",
      plan,
      finish: {
        icon: "🏆",
        message: "Make an explorer's notebook: draw your favourite animal from each place, and write or tell a grown-up one fact about it. Which place would you most like to visit?",
        speech: "You're a true nature explorer! Make an explorer's notebook: draw your favourite animal from each place, and tell a grown-up one fact about it. Which place would you most like to visit?",
      },
    });
  },
};
for (const id of ["dino", "ocean", "rain", "polar", "volcano", "bugs"]) {
  const T = THEMES[id];
  units[id] = () => expedition({ id, racer: T.racer, goal: T.goal, count: T.count, intro: T.intro, plan: planOf(T), finish: T.finish });
}
