<script>const { $, el, svg: makeSvg, text, panel, say, pick, pickInt, wait, confetti, PRAISE, KIND, choices, explain, everyday, emoji, shuffle } = KIT;
const stage = $("[data-stage]");
const W = 1000;
const H = 560;
let token = 0;
let view = null;

const UNITS = [
  { id: "bd0", label: "See it", icon: "👀" },
  { id: "bd1", label: "1. Cells", icon: "🔬" },
  { id: "bd2", label: "2. Heart & blood", icon: "🫀" },
  { id: "bd3", label: "3. Lungs & breathing", icon: "🫁" },
  { id: "bd4", label: "4. Digestion", icon: "🍎" },
  { id: "bd5", label: "5. Bones & muscles", icon: "🦴" },
  { id: "bd6", label: "6. Brain & nerves", icon: "🧠" },
  { id: "bd7", label: "7. Keeping healthy", icon: "🧼" },
  { id: "bd8", label: "8. Body challenge", icon: "🏆" },
];

function fresh() {
  stage.innerHTML = "";
  view = makeSvg(`0 0 ${W} ${H}`, stage);
  return view;
}
const wrap = (str, max) => {
  const out = [];
  for (const w of String(str).split(" ")) {
    const last = out[out.length - 1];
    if (last !== undefined && (last + " " + w).length <= max) out[out.length - 1] = last + " " + w;
    else out.push(w);
  }
  return out;
};
const lines = (parent, x, y, str, max, lh, attrs) => {
  const ls = wrap(str, max);
  ls.forEach((l, i) => text(parent, x, y + i * lh, l, attrs));
  return ls.length;
};
const fmtN = (n) => (Number.isInteger(n) ? n.toLocaleString("en-US") : String(n));

// Speech: units, symbols and arrows read as words.
const spoken = (html) =>
  html
    .replace(/<[^>]+>/g, " ")
    .replace(/CO₂/g, "carbon dioxide")
    .replace(/O₂/g, "oxygen")
    .replace(/µm/g, " micrometres")
    .replace(/→/g, ", then ")
    .replace(/×/g, " times ")
    .replace(/÷/g, " divided by ")
    .replace(/≈/g, " approximately ")
    .replace(/=/g, " equals ")
    .replace(/(\d)\s?–\s?(\d)/g, "$1 to $2")
    .replace(/−\s?(\d)/g, " minus $1")
    .replace(/m\/s\b/g, " meters per second")
    .replace(/(\d) mL\b/g, "$1 milliliters")
    .replace(/(\d) L\b/g, "$1 liters")
    .replace(/(\d) ms\b/g, "$1 milliseconds")
    .replace(/(\d) cm\b/g, "$1 centimeters")
    .replace(/(\d) mm\b/g, "$1 millimeters")
    .replace(/(\d) km\b/g, "$1 kilometers")
    .replace(/(\d) kg\b/g, "$1 kilograms")
    .replace(/(\d) m\b/g, "$1 meters")
    .replace(/(\d) N\b/g, "$1 newtons")
    .replace(/(\d) h\b/g, "$1 hours")
    .replace(/(\d) s\b/g, "$1 seconds")
    .replace(/\bmL\b/g, "millilitres")
    .replace(/\bms\b/g, "milliseconds")
    .replace(/\s+/g, " ")
    .trim();
const talk = (html) => {
  say(html, { voice: false });
  VOICE.speak(spoken(html));
};

const GOOD = ["Correct — and here is why:", "Correct. Your reasoning holds:", "Correct. Precisely:", "Correct — well reasoned:"];
const OOPS = ["Not quite. Consider this:", "Not quite. Look again:", "Not yet. Mistakes are how we learn. Consider:", "Not quite. Ask yourself:"];

// =====================================================================
// Diagram engine: every diagram draws into the left of the stage (x 0–620)
// and returns P = { key: { name, info, clue, deep, where, at, lab, g, hits } }.
const DIAG = {};
const BONE = "#f3ead8";
const BONE_LINE = "#9c8b70";
const RICH = "#e53935";
const POOR = "#7d2340";
function partOf(P, diag, key, parent, at, lab) {
  const g = el("g", { class: "bd-part", "data-part": key }, parent);
  P[key] = { ...INFO[diag][key], key, diag, at, lab, g, hits: [] };
  return g;
}
function hit(P, key, x, y, r = 30) {
  el("circle", { cx: x, cy: y, r, fill: "transparent", class: "bd-hit" }, P[key].g);
  P[key].hits.push([x, y]);
}
const hidden = (P, name, value) => Object.defineProperty(P, name, { value, enumerable: false, configurable: true });

// A label: leader line from the part to a white pill with its name.
function tag(parent, p, { bad = false, maxX = 620 } = {}) {
  const [ax, ay] = p.at;
  let [lx, ly] = p.lab;
  const w = Math.round(p.name.length * 13.5 + 32);
  lx = Math.max(w / 2 + 6, Math.min(maxX - w / 2, lx));
  ly = Math.max(26, Math.min(H - 24, ly));
  const g = el("g", { class: "bd-tag", "pointer-events": "none" }, parent);
  const col = bad ? "#b3261e" : "#2b1d12";
  if (Math.hypot(lx - ax, ly - ay) > 26) {
    el("line", { x1: ax, y1: ay, x2: lx, y2: ly, stroke: "#fff", "stroke-width": 8, "stroke-linecap": "round" }, g);
    el("line", { x1: ax, y1: ay, x2: lx, y2: ly, stroke: col, "stroke-width": 3 }, g);
  }
  el("circle", { cx: ax, cy: ay, r: 7, fill: col, stroke: "#fff", "stroke-width": 3 }, g);
  el("rect", { x: lx - w / 2, y: ly - 21, width: w, height: 40, rx: 14, fill: bad ? "#fdecea" : "#fff", stroke: bad ? "#b3261e" : "var(--accent)", "stroke-width": 3 }, g);
  text(g, lx, ly + 8, p.name, { "font-size": 24, fill: col });
  return g;
}

// Tap handling: a part under the finger, or the nearest part within reach.
function tappable(svgEl, P, onTap) {
  svgEl.addEventListener("pointerdown", (event) => {
    let key = event.target.closest?.(".bd-part")?.dataset.part;
    if (!key || !P[key]) {
      const m = svgEl.getScreenCTM();
      if (!m) return;
      const pt = svgEl.createSVGPoint();
      pt.x = event.clientX;
      pt.y = event.clientY;
      const p = pt.matrixTransform(m.inverse());
      if (p.x > 630) return;
      let best = null;
      let bd = 55;
      for (const [k, v] of Object.entries(P))
        for (const [x, y] of [v.at, ...v.hits]) {
          const d = Math.hypot(x - p.x, y - p.y);
          if (d < bd) {
            bd = d;
            best = k;
          }
        }
      key = best;
    }
    if (key) onTap(key);
  });
}

// Catmull-Rom points to a smooth path.
const smooth = (pts, closed = true) => {
  const n = pts.length;
  const at = (i) => pts[closed ? (i + n) % n : Math.max(0, Math.min(n - 1, i))];
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < (closed ? n : n - 1); i++) {
    const p0 = at(i - 1);
    const p1 = at(i);
    const p2 = at(i + 1);
    const p3 = at(i + 2);
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d + (closed ? "Z" : "");
};
const blob = (cx, cy, rx, ry, seed = 0, n = 24) => {
  const pts = [];
  for (let k = 0; k < n; k++) {
    const a = (2 * Math.PI * k) / n;
    const r = 1 + 0.06 * Math.sin(3 * a + seed) + 0.04 * Math.cos(5 * a + seed * 2);
    pts.push([cx + rx * r * Math.cos(a), cy + ry * r * Math.sin(a)]);
  }
  return smooth(pts);
};
function mito(parent, x, y, rot, s = 1) {
  const g = el("g", { transform: `translate(${x} ${y}) rotate(${rot}) scale(${s})` }, parent);
  el("ellipse", { rx: 42, ry: 20, fill: "#ffb59a", stroke: "#c0573a", "stroke-width": 4 }, g);
  el("polyline", { points: "-30,0 -24,-10 -16,10 -8,-10 0,10 8,-10 16,10 24,-10 30,0", fill: "none", stroke: "#c0573a", "stroke-width": 3, "stroke-linejoin": "round" }, g);
  return g;
}
function chloro(parent, x, y, rot) {
  const g = el("g", { transform: `translate(${x} ${y}) rotate(${rot})` }, parent);
  el("ellipse", { rx: 32, ry: 17, fill: "#4caf50", stroke: "#1b5e20", "stroke-width": 3 }, g);
  for (const dx of [-15, 0, 15]) el("rect", { x: dx - 5, y: -9, width: 10, height: 18, rx: 3, fill: "#2e7d32" }, g);
  return g;
}
// Arrow chevron at a fraction along a path element.
function chevron(parent, path, frac, fill = "#fff") {
  const L = path.getTotalLength();
  const a = path.getPointAtLength(L * frac);
  const b = path.getPointAtLength(Math.min(L, L * frac + 2));
  const ang = (Math.atan2(b.y - a.y, b.x - a.x) * 180) / Math.PI;
  el("polygon", { points: "-7,-7 6,0 -7,7", transform: `translate(${a.x} ${a.y}) rotate(${ang})`, fill, opacity: 0.95, "pointer-events": "none" }, parent);
}
function tube(parent, d, inner, width, outline = "#3a1a14") {
  el("path", { d, fill: "none", stroke: outline, "stroke-width": width + 6, "stroke-linecap": "round", "stroke-linejoin": "round" }, parent);
  return el("path", { d, fill: "none", stroke: inner, "stroke-width": width, "stroke-linecap": "round", "stroke-linejoin": "round" }, parent);
}
function grad(v, id, a, b, x1, x2) {
  const g = el("linearGradient", { id, gradientUnits: "userSpaceOnUse", x1, x2, y1: 0, y2: 0 }, v);
  el("stop", { offset: 0, "stop-color": a }, g);
  el("stop", { offset: 1, "stop-color": b }, g);
}
// Moving dots along paths (blood flow, signals). Stops when the unit changes.
function flow(paths, my, { n = 4, speed = 70, r = 5, fill = "#fff" } = {}) {
  if (KIT.still.matches) return;
  const dots = paths.map((p) => {
    const L = p.getTotalLength();
    return { p, L, d: Array.from({ length: n }, () => el("circle", { r, fill, opacity: 0.85, "pointer-events": "none" }, p.parentNode)) };
  });
  const t0 = performance.now();
  const frame = (now) => {
    if (my !== token || !paths[0].isConnected) return;
    const s = ((now - t0) / 1000) * speed;
    for (const { p, L, d } of dots)
      d.forEach((c, i) => {
        const q = p.getPointAtLength((s + (i * L) / n) % L);
        c.setAttribute("cx", q.x);
        c.setAttribute("cy", q.y);
      });
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

// ---------- Animal cell ----------
DIAG.animal = (v) => {
  const P = {};
  const d = blob(315, 290, 230, 190, 0.4);
  el("path", { d, fill: "#fbe3cf" }, partOf(P, "animal", "cytoplasm", v, [265, 375], [130, 525]));
  hit(P, "cytoplasm", 390, 150, 26);
  const rib = partOf(P, "animal", "ribo", v, [250, 160], [330, 45]);
  for (const [cx, cy] of [[250, 160], [450, 450 - 120], [170, 330]]) {
    for (let k = 0; k < 7; k++) el("circle", { cx: cx + Math.cos(k * 2.3) * (6 + k * 3), cy: cy + Math.sin(k * 2.3) * (6 + k * 3), r: 4.5, fill: "#5d4037" }, rib);
    hit(P, "ribo", cx, cy, 24);
  }
  const mi = partOf(P, "animal", "mito", v, [470, 410], [480, 525]);
  for (const [x, y, r] of [[470, 410, -30], [175, 230, 25], [215, 410, -15], [480, 205, 35]]) {
    mito(mi, x, y, r);
    hit(P, "mito", x, y, 34);
  }
  const nu = partOf(P, "animal", "nucleus", v, [335, 270], [520, 45]);
  el("circle", { cx: 335, cy: 270, r: 74, fill: "#c9b6ea", stroke: "#6c4fa3", "stroke-width": 5 }, nu);
  el("path", { d: "M290 250 q15 -18 30 0 t30 0 M300 295 q12 14 24 0 t24 0", fill: "none", stroke: "#8e74c4", "stroke-width": 3 }, nu);
  el("circle", { cx: 350, cy: 262, r: 22, fill: "#6c4fa3", opacity: 0.75 }, nu);
  const me = partOf(P, "animal", "membrane", v, [315, 98], [120, 45]);
  el("path", { d, fill: "none", stroke: "transparent", "stroke-width": 30 }, me);
  el("path", { d, fill: "none", stroke: "#c26a4a", "stroke-width": 9 }, me);
  P.membrane.hits.push([85, 290], [545, 290], [315, 480]);
  return P;
};

// ---------- Plant cell ----------
DIAG.plant = (v) => {
  const P = {};
  const wa = partOf(P, "plant", "wall", v, [72, 200], [110, 40]);
  el("rect", { x: 58, y: 72, width: 514, height: 432, rx: 22, fill: "#8bc34a", stroke: "#33691e", "stroke-width": 4 }, wa);
  P.wall.hits.push([566, 300], [315, 78], [315, 500]);
  el("rect", { x: 88, y: 102, width: 454, height: 372, rx: 12, fill: "#eef7e4" }, partOf(P, "plant", "cytoplasm", v, [205, 300], [300, 528]));
  hit(P, "cytoplasm", 200, 245, 22);
  const va = partOf(P, "plant", "vacuole", v, [350, 290], [350, 290]);
  el("rect", { x: 235, y: 170, width: 240, height: 240, rx: 60, fill: "#d4ecfb", stroke: "#5b9bd5", "stroke-width": 4 }, va);
  const nu = partOf(P, "plant", "nucleus", v, [160, 170], [290, 40]);
  el("circle", { cx: 160, cy: 170, r: 46, fill: "#c9b6ea", stroke: "#6c4fa3", "stroke-width": 4 }, nu);
  el("circle", { cx: 170, cy: 164, r: 15, fill: "#6c4fa3", opacity: 0.75 }, nu);
  const ch = partOf(P, "plant", "chloro", v, [420, 440], [500, 528]);
  for (const [x, y, r] of [[150, 300, 80], [140, 420, 60], [320, 135, 8], [420, 440, -10], [510, 300, 90], [300, 445, 4]]) {
    chloro(ch, x, y, r);
    hit(P, "chloro", x, y, 30);
  }
  const mi = partOf(P, "plant", "mito", v, [430, 132], [480, 40]);
  for (const [x, y, r] of [[430, 132, 10], [505, 420, 60]]) {
    mito(mi, x, y, r, 0.75);
    hit(P, "mito", x, y, 28);
  }
  const me = partOf(P, "plant", "membrane", v, [200, 474], [110, 528]);
  el("rect", { x: 88, y: 102, width: 454, height: 372, rx: 12, fill: "none", stroke: "transparent", "stroke-width": 18 }, me);
  el("rect", { x: 88, y: 102, width: 454, height: 372, rx: 12, fill: "none", stroke: "#c26a4a", "stroke-width": 5 }, me);
  P.membrane.hits.push([88, 300], [542, 200]);
  return P;
};

// ---------- Heart and double circulation ----------
DIAG.heart = (v) => {
  const P = {};
  grad(v, "bdLung", POOR, RICH, 195, 425);
  grad(v, "bdBody", POOR, RICH, 140, 480);
  const lu = partOf(P, "heart", "lungs", v, [310, 70], [530, 40]);
  el("rect", { x: 170, y: 16, width: 280, height: 86, rx: 30, fill: "#f9dbe3", stroke: "#b0506c", "stroke-width": 3 }, lu);
  text(lu, 310, 44, "LUNGS", { "font-size": 22, fill: "#8a3b52" });
  el("path", { d: "M195 82 C235 52 265 102 310 74 S385 52 425 82", fill: "none", stroke: "url(#bdLung)", "stroke-width": 9, "stroke-linecap": "round" }, lu);
  const bo = partOf(P, "heart", "body", v, [310, 495], [560, 520]);
  el("rect", { x: 110, y: 456, width: 400, height: 90, rx: 30, fill: "#f6e3cc", stroke: "#b98b5e", "stroke-width": 3 }, bo);
  text(bo, 310, 535, "BODY", { "font-size": 22, fill: "#8a6040" });
  el("path", { d: "M480 488 C440 462 410 512 370 488 S290 462 250 488 S180 512 140 488", fill: "none", stroke: "url(#bdBody)", "stroke-width": 9, "stroke-linecap": "round" }, bo);
  const paths = [];
  const vessel = (key, d, col, at, lab) => {
    const g = partOf(P, "heart", key, v, at, lab);
    const p = tube(g, d, col, 16);
    el("path", { d, fill: "none", stroke: "transparent", "stroke-width": 40 }, g);
    paths.push(p);
    return p;
  };
  const vc = vessel("vena", "M130 458 L130 222 L202 222", POOR, [130, 340], [70, 400]);
  const ao = vessel("aorta", "M418 340 L490 340 L490 458", RICH, [490, 400], [560, 420]);
  const pv = vessel("pv", "M430 100 C470 115 470 150 470 200 L470 215 L420 215", RICH, [470, 160], [560, 150]);
  // Chambers
  const ch = (key, x, y, w, h, fill, at, lab, sw = 5) => {
    const g = partOf(P, "heart", key, v, at, lab);
    el("rect", { x, y, width: w, height: h, rx: 26, fill, stroke: "#3b0d18", "stroke-width": sw }, g);
    return g;
  };
  ch("ra", 202, 176, 98, 88, POOR, [236, 205], [90, 150]);
  ch("rv", 202, 274, 98, 118, POOR, [236, 350], [90, 430]);
  ch("la", 320, 176, 98, 88, RICH, [385, 205], [560, 260]);
  ch("lv", 320, 274, 98, 118, RICH, [385, 360], [560, 360], 13);
  const se = partOf(P, "heart", "septum", v, [310, 330], [310, 420]);
  el("rect", { x: 300, y: 178, width: 20, height: 212, fill: "#c98a7a", stroke: "#3b0d18", "stroke-width": 2 }, se);
  const va = partOf(P, "heart", "valves", v, [251, 268], [90, 280]);
  for (const x0 of [202, 320]) {
    el("polygon", { points: `${x0 + 16},264 ${x0 + 46},264 ${x0 + 40},284`, fill: "#fbe9e7", stroke: "#3b0d18", "stroke-width": 2.5 }, va);
    el("polygon", { points: `${x0 + 82},264 ${x0 + 52},264 ${x0 + 58},284`, fill: "#fbe9e7", stroke: "#3b0d18", "stroke-width": 2.5 }, va);
    hit(P, "valves", x0 + 49, 270, 24);
  }
  const pa = vessel("pa", "M262 318 C298 314 310 292 310 252 L310 140 C310 112 282 104 252 100", POOR, [310, 200], [110, 80]);
  text(v, 251, 166, "right side", { "font-size": 19, fill: "#6b5240", "pointer-events": "none" });
  text(v, 369, 166, "left side", { "font-size": 19, fill: "#6b5240", "pointer-events": "none" });
  for (const p of paths) {
    chevron(p.parentNode, p, 0.35);
    chevron(p.parentNode, p, 0.75);
  }
  const lg = el("g", { "pointer-events": "none" }, v);
  el("rect", { x: 148, y: 410, width: 26, height: 22, rx: 6, fill: RICH }, lg);

  el("ellipse", { cx: 120, cy: 300, rx: 65, ry: 49, fill: POOR, stroke: "#4a1020", "stroke-width": 2 }, ve);
  const ca = partOf(P, "vessels", "cap", v, [135, 470], [135, 535]);
  el("rect", { x: 25, y: 452, width: 220, height: 38, rx: 19, fill: "#f8d7d4", stroke: "#c97a74", "stroke-width": 3 }, ca);
  for (const x of [50, 110, 170, 225]) el("ellipse", { cx: x, cy: 452, rx: 9, ry: 4, fill: "#c97a74" }, ca);
  for (const x of [55, 95, 135, 175, 215]) el("ellipse", { cx: x, cy: 471, rx: 13, ry: 10, fill: "#d32f2f" }, ca);
  hit(P, "cap", 135, 471, 40);
  const pl = partOf(P, "vessels", "plasma", v, [440, 445], [440, 520]);
  el("circle", { cx: 440, cy: 290, r: 168, fill: "#f3d68a", stroke: "#c9a23d", "stroke-width": 4 }, pl);
  text(v, 440, 100, "a drop of blood, magnified", { "font-size": 21, fill: "#6b5240", "pointer-events": "none" });
  const wbcAt = [[395, 225], [505, 365]];
  const rb = partOf(P, "vessels", "rbc", v, [470, 280], [440, 38]);
  const spots = [];
  for (let gx = 296; gx <= 584; gx += 42)
    for (let gy = 150; gy <= 430; gy += 42) {
      const x = gx + (Math.round(gy / 42) % 2 ? 18 : 0);
      if (Math.hypot(x - 440, gy - 290) > 138) continue;
      if (wbcAt.some(([a, b]) => Math.hypot(x - a, gy - b) < 56)) continue;
            spots.push([x, gy]);
    }
  const plt = spots.filter((_, i) => i % 5 === 2);
  for (const s of spots) {
    if (plt.includes(s)) continue;
    const [x, y] = s;
    el("circle", { cx: x, cy: y, r: 18, fill: "#d32f2f", stroke: "#8e1b1b", "stroke-width": 2 }, rb);
    el("circle", { cx: x, cy: y, r: 8, fill: "#b71c1c", opacity: 0.6 }, rb);
  }
  P.rbc.hits.push(...spots.filter((s) => !plt.includes(s)).slice(0, 8));
  const wb = partOf(P, "vessels", "wbc", v, wbcAt[0], [270, 470]);
  for (const [x, y] of wbcAt) {
    el("circle", { cx: x, cy: y, r: 30, fill: "#ece2f7", stroke: "#7e57c2", "stroke-width": 3 }, wb);
    for (const [dx, dy] of [[-9, -5], [6, -9], [8, 7]]) el("circle", { cx: x + dx, cy: y + dy, r: 9, fill: "#7e57c2" }, wb);
    hit(P, "wbc", x, y, 32);
  }
  const pt = partOf(P, "vessels", "platelets", v, plt[0] || [440, 290], [600, 470]);
  for (const [x, y] of plt) {
    el("polygon", { points: `${x - 11},${y - 4} ${x - 3},${y - 12} ${x + 11},${y - 5} ${x + 8},${y + 8} ${x - 7},${y + 9}`, fill: "#9575cd", stroke: "#5e35b1", "stroke-width": 2 }, pt);
    hit(P, "platelets", x, y, 18);
  }
  return P;
};

  const notes = el("g", { "pointer-events": "none" }, v);
  const lens = (A, B, thick, up) => {
    const dx = B[0] - A[0];
    const dy = B[1] - A[1];
    const L = Math.hypot(dx, dy);
    const n = up ? [dy / L, -dx / L] : [-dy / L, dx / L];
    const M = [(A[0] + B[0]) / 2, (A[1] + B[1]) / 2];
    const c1 = [M[0] + n[0] * thick * 2, M[1] + n[1] * thick * 2];
    const c2 = [M[0] - n[0] * thick * 0.5, M[1] - n[1] * thick * 0.5];
    return `M${A[0]} ${A[1]} Q${c1[0]} ${c1[1]} ${B[0]} ${B[1]} Q${c2[0]} ${c2[1]} ${A[0]} ${A[1]} Z`;
  };
  let showNotes = null;
  const pose = (b, show) => {
    if (show !== undefined) showNotes = show;
    const th = b * 2.0;
    const d = [Math.cos(th), -Math.sin(th)];
    const n = [-Math.sin(th), -Math.cos(th)];
    const Wr = [E[0] + d[0] * 220, E[1] + d[1] * 220];
    fBones.forEach(([o, i], k) => {
      const off = k ? -7 : 7;
      for (const ln of [o, i]) {
        ln.setAttribute("x1", E[0] + n[0] * off);
        ln.setAttribute("y1", E[1] + n[1] * off);
        ln.setAttribute("x2", Wr[0] + n[0] * off);
        ln.setAttribute("y2", Wr[1] + n[1] * off);
      }
    });
    hand.setAttribute("cx", Wr[0] + d[0] * 22);
    hand.setAttribute("cy", Wr[1] + d[1] * 22);
    for (const [k, val] of [["x1", E[0] + d[0] * 30], ["y1", E[1] + d[1] * 30], ["x2", Wr[0]], ["y2", Wr[1]]]) fhit.setAttribute(k, val);
    const I1 = [E[0] + d[0] * 46 + n[0] * 14, E[1] + d[1] * 46 + n[1] * 14];
    const O1 = [128, 226];
    const u = [O1[0] - I1[0], O1[1] - I1[1]];
    const uL = Math.hypot(...u);
    const T = [I1[0] + (u[0] / uL) * 48, I1[1] + (u[1] / uL) * 48];
    biP.setAttribute("d", lens(O1, T, 16 + 26 * b, true));
    for (const ln of [teL, teO]) {
      ln.setAttribute("x1", T[0]);
      ln.setAttribute("y1", T[1]);
      ln.setAttribute("x2", I1[0]);
      ln.setAttribute("y2", I1[1]);
    }
    teHit.setAttribute("cx", (T[0] + I1[0]) / 2);
    teHit.setAttribute("cy", (T[1] + I1[1]) / 2);
    const I2 = [E[0] - d[0] * 16 - n[0] * 20, E[1] - d[1] * 16 - n[1] * 20];
    trP.setAttribute("d", lens([128, 274], I2, 16 + 26 * (1 - b), false));
    const bm = [(O1[0] + T[0]) / 2, (O1[1] + T[1]) / 2 - 12 - 14 * b];
    Object.assign(P.biceps, { at: bm, lab: [bm[0], 60] });
    Object.assign(P.triceps, { at: [240, 284 + 14 * (1 - b)], lab: [200, 470] });
    Object.assign(P.tendon, { at: [(T[0] + I1[0]) / 2, (T[1] + I1[1]) / 2], lab: [520, 300] });
    Object.assign(P.forearm, { at: [E[0] + d[0] * 140, E[1] + d[1] * 140], lab: [520, b > 0.5 ? 120 : 380] });
    P.forearm.hits = [[E[0] + d[0] * 140, E[1] + d[1] * 140], [E[0] + d[0] * 200, E[1] + d[1] * 200]];
    P.tendon.hits = [P.tendon.at];
    P.biceps.hits = [bm];
    P.triceps.hits = [P.triceps.at];
    notes.innerHTML = "";
    if (showNotes === null) return;
    const tight = showNotes === 1;
    text(notes, 190, Math.max(40, bm[1] - 52), tight ? "biceps contracted" : "biceps relaxed", { "font-size": 21, fill: tight ? "#b3261e" : "#7a6552" });
    text(notes, 240, 340 + 18 * (1 - b), tight ? "triceps relaxed" : "triceps contracted", { "font-size": 21, fill: tight ? "#7a6552" : "#b3261e" });
  };
  pose(bend);
  hidden(P, "pose", pose);
  hidden(P, "notes", notes);
  return P;
};

// ---------- A neuron ----------
DIAG.neuron = (v) => {
  const P = {};
  const de = partOf(P, "neuron", "dendrites", v, [50, 230], [90, 110]);
  for (const a of [150, 190, 220, 255, 120, 280]) {
    const r = (a * Math.PI) / 180;
    const x1 = 110 + Math.cos(r) * 40;
    const y1 = 300 + Math.sin(r) * 40;
    const x2 = 110 + Math.cos(r) * 100;
    const y2 = 300 + Math.sin(r) * 100;
    el("path", { d: `M${x1} ${y1} L${x2} ${y2} M${(x1 + x2) / 2 + Math.cos(r) * 10} ${(y1 + y2) / 2 + Math.sin(r) * 10} l${Math.cos(r + 0.7) * 34} ${Math.sin(r + 0.7) * 34} M${x2} ${y2} l${Math.cos(r - 0.6) * 26} ${Math.sin(r - 0.6) * 26}`, fill: "none", stroke: "#d29a3a", "stroke-width": 6, "stroke-linecap": "round" }, de);
    hit(P, "dendrites", x2, y2, 24);
  }
  const ax = partOf(P, "neuron", "axon", v, [174, 300], [330, 400]);
  el("line", { x1: 150, y1: 300, x2: 530, y2: 300, stroke: "#d29a3a", "stroke-width": 10 }, ax);
  const my = partOf(P, "neuron", "myelin", v, [282, 300], [330, 200]);

    el("rect", { x, y: 284, width: 50, height: 32, rx: 14, fill: "#fff3c4", stroke: "#c9a23d", "stroke-width": 3 }, my);

  }
  const te = partOf(P, "neuron", "terminals", v, [580, 300], [530, 470]);
  for (const [x, y] of [[585, 238], [600, 300], [585, 362]]) {
    el("path", { d: `M530 300 Q560 ${300 + (y - 300) * 0.4} ${x} ${y}`, fill: "none", stroke: "#d29a3a", "stroke-width": 6 }, te);

    hit(P, "terminals", x, y, 20);
  }
  const bo = partOf(P, "neuron", "body", v, [125, 330], [140, 470]);
  el("circle", { cx: 110, cy: 300, r: 48, fill: "#ffd59a", stroke: "#c78a2c", "stroke-width": 4 }, bo);
  const nu = partOf(P, "neuron", "nucleus", v, [110, 300], [110, 520]);

  const sig = el("g", { "pointer-events": "none" }, v);
  el("line", { x1: 220, y1: 240, x2: 470, y2: 240, stroke: "#7a6552", "stroke-width": 4 }, sig);
  el("polygon", { points: "470,230 490,240 470,250", fill: "#7a6552" }, sig);
  text(sig, 345, 228, "signal travels this way", { "font-size": 21, fill: "#7a6552" });

};

const LEVELS = [["easy", "🐣 Grade 4"], ["medium", "🦊 Grade 5–6"], ["hard", "🦁 Grade 7–8"]];

const lowerFirst = (s) => s.charAt(0).toLowerCase() + s.slice(1);
const mcQ = ([t, a, w, hint, why, icon]) => ({ kind: "mc", text: t, ans: a, opts: shuffle([a, ...w]).map((x) => ({ label: x, v: x })), hint, why, icon: icon || "❓" });
const nopts = (ans, wrong = []) => {
  const s = [];
  const add = (x) => {
    if (typeof x !== "number" || !Number.isFinite(x) || x <= 0) return;
    x = Math.round(x * 1000) / 1000;
    if (!s.includes(x) && s.length < 4) s.push(x);
  };
  add(ans);
  wrong.forEach(add);
  const step = Number.isInteger(ans) ? Math.max(1, Math.round(ans / 10)) : Math.max(0.5, Math.round(ans * 2) / 20);
  for (const f of [1, -1, 2, -2, 3, 4]) add(ans + f * step);
  return s.sort((a, b) => a - b);
};
const numQ = (g) => ({
  kind: "num",
  text: g.text,
  ans: g.ans,
  opts: g.choices ? shuffle([g.ans, ...g.choices]).map((x) => ({ label: x, v: x })) : nopts(g.ans, g.wrong).map((n) => ({ label: fmtN(n), v: n })),
  hint: (v) => g.hints?.[v] || g.hint,
  why: g.steps.join(". ") + ".",
  steps: g.steps,
  icon: g.icon || "🧮",
});
function tapQs(diags, level) {
  const out = [];
  const seen = new Set();
  for (const d of diags)
    for (const [k, inf] of Object.entries(INFO[d])) {
      const t = level === "easy" ? inf.ask || `Tap the ${lowerFirst(inf.name)}.` : level === "medium" ? inf.clue : inf.deep || inf.clue;
      if (seen.has(t)) continue;
      seen.add(t);
      out.push({ kind: "tap", diag: d, part: k, text: t, hint: inf.where, why: `<b>${inf.name}</b>. ${inf.info}` });
    }
  return out;
}
function fromGen(list, n, seen) {
  const out = [];
  const order = shuffle(list);
  let guard = 0;
  while (out.length < n && guard < 80) {
    const g = order[guard % order.length]();
    guard += 1;
    if (seen.has(g.text)) continue;
    seen.add(g.text);
    out.push(numQ(g));
  }
  return out;
}
function makeSet(id, level) {
  const seen = new Set();
  const diags = UNIT_DIAGS[id] || [];
  const out = [];
  if (diags.length) out.push(...shuffle(tapQs(diags, level)).slice(0, 4));
  out.push(...shuffle(FACTS[id][level]).slice(0, diags.length ? 3 : 7).map(mcQ));
  out.push(...fromGen(GEN[TOPIC[id]][level], 3, seen));
  return shuffle(out);
}
function challengeSet(level) {
  const seen = new Set();
  const all = (lv) => Object.values(GEN).flatMap((t) => t[lv]);
  const out =
    level === "easy" ? [...fromGen(all("easy"), 5, seen), ...fromGen(all("medium"), 3, seen)] : level === "medium" ? [...fromGen(all("medium"), 4, seen), ...fromGen(all("hard"), 3, seen)] : [...fromGen(all("hard"), 3, seen), ...fromGen(CONTEST, 4, seen)];
  out.push(...shuffle(CLAIMS).slice(0, level === "easy" ? 2 : 3).map(mcQ));
  return shuffle(out);
}

    };
    tappable(view, P, (k) => curTap?.(k));
    if (d === "heart") flow(P.paths, my, { n: 3, speed: 55 });
    if (d === "reflex") flow(P.paths, my, { n: 2, speed: 110, r: 6, fill: "#fff59d" });
    if (d === "arm") {
      const mk = (x, label, target, primary) => {
        const g = el("g", { class: "bd-btn", "data-bend": target }, btns);
        el("rect", { x, y: 466, width: 156, height: 66, rx: 20, fill: primary ? "var(--accent)" : "#fff", stroke: "var(--accent-dark)", "stroke-width": 3 }, g);
        text(g, x + 78, 508, label, { "font-size": 25, fill: primary ? "#fff" : "var(--accent-dark)" });
      };
      mk(652, "💪 Bend", 1, true);
      mk(820, "Straighten", 0, false);
      btns.addEventListener("pointerdown", async (event) => {
        const b = event.target.closest(".bd-btn");
        if (!b || my !== token) return;
        event.stopPropagation();
        const to = Number(b.dataset.bend);
        const from = bend;
        window.OC?.touch();
        MUSIC.play("xylophone", to ? 79 : 72, { gain: 0.3 });
        talk(to ? "The <b>biceps contracts</b> and shortens, pulling the forearm up. The triceps relaxes and is stretched." : "The <b>triceps contracts</b>, pulling the forearm straight; the biceps relaxes. Each muscle can only pull, so they work as an antagonistic (opposing) pair.");
        const ok = await tween(900, (t) => {
          bend = from + (to - from) * t;
          P.pose(bend, to);
        }, () => my === token && view.contains(btns));
        if (ok && last) {
          tags.innerHTML = "";
          tag(tags, P[last]);
        }
      });
    }
    host.innerHTML = cfg.diags.length > 1 ? `<div class="ap-buttons">${cfg.diags.map((x, k) => `<button type="button" data-d="${k}"${k === cur ? ' class="primary"' : ""}>${DIAG_NAME[x]}</button>`).join("")}</div>` : "";
    host.onclick = (event) => {

      VOICE.hush();
      cur = Number(b.dataset.d);
      explore();
    };
    talk(DIAG_INTRO[d]);
  };

  const begin = () => {
    q = null;
    busy = false;
    curTap = null;
    host.onclick = null;
    host.innerHTML = "";
    if (level === "explore") return explore();
    qs = cfg.make(level);
    i = 0;
    first = 0;
    ask();
  };
  const revealTap = (k) => {
    view.querySelectorAll(".bd-hi").forEach((n) => n.classList.remove("bd-hi"));
    P[k].g.classList.add("bd-hi");
    tags.innerHTML = "";
    tag(tags, P[k]);
    infoCard(card, P[k]);
  };
  const ask = () => {
    q = qs[i];
    tries = 0;
    busy = false;
    fresh();
    setStatus(`Question ${i + 1} of ${qs.length}`);
    host.onclick = null;
    host.innerHTML = "";
    curTap = null;
    if (q.kind === "tap") {
      P = DIAG[q.diag](view, {});
      tags = el("g", {}, view);
      card = el("g", {}, view);
      cardBox(card);
      emoji(card, 813, 80, "🔎", 56);
      lines(card, 813, 170, q.text, 19, 38, { "font-size": 28, fill: "#2b1d12" });
      curTap = (k) => answer(k);
      tappable(view, P, (k) => curTap?.(k));
    } else {
      qCard(view, q);
      choices(host, q.opts, (o, b) => answer(o.v, b));
    }
    talk(q.text);
  };
  function answer(v, button) {
    if (my !== token || busy || !q) return;
    if (q.kind === "tap" && !P[v]) return;
    window.OC?.touch();
    button = button || (q.opts ? buttonFor(v) : null);
    const right = q.kind === "tap" ? v === q.part : isAns(v);
    if (right) {
      busy = true;
      button?.classList.add("right");
      MUSIC.chime();
      if (!tries) first += 1;
      window.OC?.count("body questions");
      if (q.kind === "tap") revealTap(q.part);
      else solCard(view, q);
      talk(`${pick(GOOD)} ${q.why}`);
      return nextBtn();
    }
    tries += 1;
    if (button) {
      button.classList.add("wrong");
      button.disabled = true;
    }
    MUSIC.oops();
    if (q.kind === "tap") {
      tags.innerHTML = "";
      tag(tags, P[v], { bad: true });
    }
    const h = q.kind === "tap" ? `You tapped: ${P[v].name}. ${q.hint}` : typeof q.hint === "function" ? q.hint(v) : q.hint;
    if (tries === 1) return talk(`${pick(OOPS)} ${h}`);
    busy = true;
    if (q.kind === "tap") revealTap(q.part);
    else {
      buttonFor(q.ans)?.classList.add("right");
      solCard(view, q);
    }
    talk(`Here is the reasoning. ${q.why}`);
    nextBtn();
  }
  const nextBtn = () => {
    setTimeout(() => {
      if (my !== token || !busy) return;
      host.innerHTML = `<div class="ap-buttons"><button type="button" class="primary" data-next>${i + 1 >= qs.length ? "Finish 🏁" : "Next ▶"}</button></div>`;
      host.onclick = (event) => event.target.closest("[data-next]") && next();
    }, 500);
  };
  const next = () => {
    if (my !== token || !busy) return;
    VOICE.hush();
    i += 1;
    if (i >= qs.length) finishScreen(id, qs.length, first, host, begin);
    else ask();
  };
  onChips(id, (lv) => {
    level = lv;
    begin();
  });
  window.__bd = {
    state: () => ({ level, i, total: qs.length, first, tries, kind: q?.kind, ans: q?.kind === "tap" ? q.part : q?.ans, say: $("[data-say]")?.innerText }),
    right: () => (q ? (answer(q.kind === "tap" ? q.part : q.ans), "right") : "no q"),
    wrong: () => {
      if (!q) return "no q";
      if (q.kind === "tap") {
        const k = Object.keys(P).find((x) => x !== q.part);
        answer(k);
        return "wrong " + k;
      }
      const o = q.opts.find((x) => !isAns(x.v) && !buttonFor(x.v)?.disabled);
      answer(o.v);
      return "wrong " + o.v;
    },
    tap: (k) => (curTap?.(k), k),
    next: () => (host.querySelector("[data-next]")?.click(), "next"),
    qs: () => qs,
    P: () => P,
  };
  begin();
}

const tween = (ms, fn, alive) =>
  new Promise((resolve) => {
    if (KIT.still.matches) {
      fn(1);
      return resolve(true);
    }
    const t0 = performance.now();
    const frame = (now) => {
      if (!alive()) return resolve(false);
      const t = Math.min(1, (now - t0) / ms);
      fn(t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
      if (t < 1) requestAnimationFrame(frame);
      else resolve(true);
    };
    requestAnimationFrame(frame);
  });
