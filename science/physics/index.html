<script>const { $, el, svg: makeSvg, text, panel, say, sayAsync, pick, pickInt, wait, confetti, choices, explain, everyday, emoji, shuffle } = KIT;

const W = 1000;
const H = 560;
let token = 0;
let view = null;

const UNITS = [
  { id: "p0", label: "See it", icon: "👀" },
  { id: "p1", label: "1. Ramps & rolling", icon: "🚗" },
  { id: "p2", label: "2. Levers & seesaws", icon: "⚖️" },
  { id: "p3", label: "3. Float or sink", icon: "🛟" },
  { id: "p4", label: "4. Magnets", icon: "🧲" },
  { id: "p5", label: "5. Light & shadows", icon: "🔦" },
  { id: "p6", label: "6. Sound & vibration", icon: "🎸" },
  { id: "p7", label: "7. Circuits", icon: "💡" },
];

function fresh() {
  stage.innerHTML = "";
  view = makeSvg(`0 0 ${W} ${H}`, stage);
  return view;
}

// ---------- shared helpers ----------
const LEVELS = [["easy", "🐣 Easy"], ["medium", "🦊 Medium"], ["hard", "🦁 Hard"]];
const levelRow = (cur) =>
  `<div class="ap-row"><div class="ap-chips" data-levels>${LEVELS.map(([k, l]) => `<button type="button" data-lv="${k}" aria-pressed="${k === cur}">${l}</button>`).join("")}</div><button type="button" class="ph-trybtn" data-try>🏠 Try it</button><p class="ap-status" data-status></p></div>`;
const onLevels = (id, fn) =>
  $("[data-levels]").addEventListener("click", (event) => {
    const b = event.target.closest("[data-lv]");
    if (!b) return;
    document.querySelectorAll("[data-lv]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    shell.mark(id, { level: b.dataset.lv });
    window.OC?.touch();
    fn(b.dataset.lv);
  });
const smooth = (t) => (t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
const lin = (t) => t;
const tw = (ms, fn, live, ease = smooth) =>
  new Promise((resolve) => {
    if (KIT.still.matches) {
      fn(1);
      return resolve(live());
    }
    const t0 = performance.now();
    const frame = (now) => {
      if (!live()) return resolve(false);
      const t = Math.min(1, (now - t0) / ms);
      fn(ease(t));
      if (t < 1) requestAnimationFrame(frame);
      else resolve(true);
    };
    requestAnimationFrame(frame);
  });
const nap = (ms, live) => wait(KIT.still.matches ? Math.min(ms, 150) : ms).then(() => live());
const pl = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
const cap = (s) => s[0].toUpperCase() + s.slice(1);
const move = (node, x, y, r = 0) => node.setAttribute("transform", `translate(${x} ${y})${r ? ` rotate(${r})` : ""}`);
const label = (parent, x, y, str, size = 24, fill = "#2b1d12", extra = {}) => text(parent, x, y, str, { "font-size": size, fill, ...extra });
const halo = { stroke: "#fffaf0", "stroke-width": 5, "paint-order": "stroke", "stroke-linejoin": "round" };
const wrap = (str, max = 12) => {
  const lines = [];
  for (const word of String(str).split(" ")) {
    const last = lines[lines.length - 1];
    if (last && (last + " " + word).length <= max) lines[lines.length - 1] = last + " " + word;
    else lines.push(word);
  }
  return lines;
};
const lines = (parent, x, y, str, size = 26, max = 12, fill = "#2b1d12") => wrap(str, max).forEach((ln, i) => label(parent, x, y + i * (size + 6), ln, size, fill));
const bg = (fill = "#f7f1e6") => el("rect", { x: 0, y: 0, width: W, height: H, fill }, view);

const phStyle = document.createElement("style");

@media (max-height:460px),(max-width:420px) and (max-height:720px){.ph-pick .kt-choices button{min-height:46px;min-width:70px;font-size:16px;padding:0 12px}}

document.head.appendChild(phStyle);

// ---------- "Try it for real" cards ----------
const TRY = {
  p1: {
    title: "Ramp races",
    safe: "Do this with a grown-up. Keep the ramp out of the way of feet.",
    need: ["A toy car", "A flat board or big hardback book", "2–4 books", "A tape measure or ruler", "Sticky notes or tape"],
    steps: ["Lean the board on 1 book to make a ramp.", "Let the car go from the top. Don't push!", "Mark where it stops and measure.", "Add a book, then try again. Then try on a rug."],
    notice: "Higher ramp, farther roll. Rug or carpet, shorter roll (more friction). Change just one thing each time: that's a fair test!",
  },
  p2: {
    title: "Coin seesaw",
    safe: "Do this with a grown-up. Coins are not for mouths.",
    need: ["A 30 cm ruler", "A round pencil", "About 6 coins that are all the same"],
    steps: ["Lay the pencil under the middle of the ruler.", "Put 2 coins near one end.", "Where must 1 coin go to balance them? Try!", "Now slide the pencil and try again."],
    notice: "1 coin far out can balance 2 coins close in. Weight × distance must match on both sides.",
  },
  p3: {
    title: "Foil boats",
    safe: "Always with a grown-up near water. Coins are not for mouths.",
    need: ["A tub or sink of water", "2 squares of kitchen foil, the same size", "Coins that are all the same", "A towel"],
    steps: ["Squeeze one foil square into a tight ball. Does it float?", "Fold the other square into a boat.", "Add coins one at a time.", "Count how many it holds before it sinks!"],
    notice: "Same foil, different shape! A wide boat pushes aside lots of water, so it can float.",
  },
  p4: {
    title: "Fridge magnet hunt",
    safe: "With a grown-up. Keep magnets away from phones and cards. Never put small magnets in your mouth.",
    need: ["A fridge magnet", "Things to test: paper clip, spoon, foil, coin, toy, keys, tin can"],
    steps: ["Predict first: will it stick? Say yes or no.", "Touch the magnet to it.", "Make a 'sticks' pile and a 'no' pile.", "Try doors, the fridge, a radiator and a tin can."],
    notice: "Only some metals stick: iron and steel. Aluminium foil, copper, gold, plastic and wood do not.",
  },
  p5: {
    title: "Shadow puppets & a water rainbow",
    safe: "With a grown-up. Never look at the sun, and don't shine the torch into eyes.",
    need: ["A torch", "A plain wall in a dark room", "Your hands or a paper shape", "A glass of water and sunshine"],
    steps: ["Shine the torch at the wall.", "Make a shape with your hands in the light.", "Move your hands near the torch, then near the wall.", "Rainbow: stand the glass in sunshine and look on the floor."],
    notice: "Near the torch, the shadow is big. The rainbow colours are always in order: red, orange, yellow, green, blue, indigo, violet.",
  },
  p6: {
    title: "Rubber-band guitar & string telephone",
    safe: "A grown-up makes holes in the cups. Don't snap bands at faces.",
    need: ["An open box or tub", "Rubber bands, thick and thin", "2 paper cups", "A long piece of string"],
    steps: ["Stretch the bands around the box and pluck them.", "Which sounds high? Which sounds low?", "Telephone: tie the string through the bottoms of 2 cups.", "Pull it tight, then talk into one cup!"],
    notice: "Thin or tight bands sound higher. The telephone works only when the string is tight: the sound travels along it.",
  },
  p7: {
    title: "Light an LED",
    safe: "A grown-up holds the coin battery. Coin batteries are very dangerous if swallowed. Never use wall sockets!",
    need: ["1 coin battery (CR2032)", "1 small LED", "Kitchen foil strips", "Tape, a paper clip, a plastic toy"],
    steps: ["Touch the LED's long leg to + and its short leg to −.", "Turn the LED round. Does it still light?", "Use foil strips as wires to make a bigger loop.", "Put a paper clip, then a plastic toy, in a gap."],
    notice: "It lights only with a complete loop, and an LED only one way round. Metal lets electricity through; plastic and paper don't.",
  },
};
function closeTry() {
  const box = document.querySelector(".ph-try");
  if (!box) return;
  box.remove();
  VOICE.hush();
}
function tryCard(id) {
  const t = TRY[id];
  if (!t) return;
  closeTry();
  const box = document.createElement("div");
  box.className = "ph-try";
  box.setAttribute("role", "dialog");
  box.setAttribute("aria-label", "Try it for real");
  box.innerHTML = `<div class="ph-try-card"><h2>🏠 Try it for real: ${t.title}</h2><p class="ph-safe">🤝 ${t.safe}</p><div class="ph-cols"><div><h3>You need</h3><ul>${t.need.map((x) => `<li>${x}</li>`).join("")}</ul></div><div><h3>Do this</h3><ol>${t.steps.map((x) => `<li>${x}</li>`).join("")}</ol></div></div><p class="ph-notice">👀 <b>Notice:</b> ${t.notice}</p><button type="button" class="kt-go" data-close>✓ Got it</button></div>`;
  document.body.appendChild(box);
  box.addEventListener("click", (event) => {
    if (event.target === box || event.target.closest("[data-close]")) closeTry();
  });
  VOICE.speak(`Try it for real: ${t.title}. ${t.safe} You need: ${t.need.join(", ")}. ${t.steps.join(" ")} Notice: ${t.notice}`);
}

// ---------- the experiment engine: predict, test, explain ----------
// cfg: make(level, round, ctx) -> q {ask, opts:[{label,v,say}], fix?, ans?}; draw(q); run(q, live, v) -> outcome; why(q, outcome); hint(q, v) for fix rounds.
function lab(id, cfg) {
  const my = token;
  const alive = () => my === token;
  const R = 8;
  let level = shell.progress()[id]?.level || "easy";
  let round = 0;
  let q = null;
  let gen = 0;
  let tries = 0;
  let busy = false;
  const bags = {};
  const ctx = {
    next(key, list) {
      if (!bags[key]?.length) bags[key] = shuffle(list);
      return bags[key].pop();
    },
  };
  panel(`${levelRow(level)}<div class="ph-pick" data-choices></div>`);
  const host = $("[data-choices]");
  $("[data-try]").addEventListener("click", () => {
    window.OC?.touch();
    tryCard(id);
  });
  const status = (s) => {
    const b = $("[data-status]");
    if (b) b.textContent = s || `Experiment ${Math.min(round + 1, R)} of ${R}`;
  };
  const setup = (qq) => {
    const g = ++gen;
    qq.live = () => alive() && g === gen;
    fresh();
    cfg.draw(qq);
  };
  const buttons = () => [...host.querySelectorAll("[data-c]")];
  const ask = () => {
    if (!alive()) return;
    q = cfg.make(level, round, ctx);
    q.level = level;
    tries = 0;
    busy = false;
    setup(q);
    status();
    choices(host, q.opts, (c, b) => choose(c, b));
    const intro = round === 0 && cfg.intro ? `${cfg.intro} ` : "";
    say(`${intro}${q.fix ? "🧩" : "🤔 Predict:"} ${q.ask}`);
  };
  const done = (msg) => {
    round += 1;
    window.OC?.count(cfg.count || "experiments");
    say(msg);
    const last = round >= R;
    status(`Experiment ${round} of ${R}`);
    host.innerHTML = `<div class="ap-buttons"><button type="button" data-again>🔁 Watch again</button><button type="button" class="primary" data-next>${last ? "🎉 Finish" : "Next ▶"}</button></div>`;
    host.onclick = (event) => {
      if (event.target.closest("[data-next]")) {
        VOICE.hush();
        if (last) finish();
        else ask();
      } else if (event.target.closest("[data-again]")) {
        window.OC?.touch();
        setup(q);
        cfg.run(q, q.live, q.fix ? q.ans : q.picked);
      }
    };
  };
  const choose = async (c, button) => {
    if (!alive() || busy) return;
    busy = true;
    window.OC?.touch();
    q.picked = c.v;
    buttons().forEach((b) => (b.disabled = b !== button));
    button.classList.add("ph-picked");
    const live = q.live;
    if (q.fix) {
      VOICE.hush();
      await cfg.run(q, live, c.v);
      if (!live()) return;
      if (c.v === q.ans) {
        MUSIC.chime();
        done(`${tries ? "You kept trying, and you found it! " : "It balances! "}${cfg.why(q, q.ans)}`);
        return;
      }
      tries += 1;
      MUSIC.oops();
      button.classList.remove("ph-picked");
      button.classList.add("wrong");
      if (tries < 2) {
        say(cfg.hint(q, c.v));
        buttons().forEach((b) => (b.disabled = b.classList.contains("wrong")));
        busy = false;
        return;
      }
      await sayAsync("Mistakes are how we learn. Let's look why.");
      if (!live()) return;
      await cfg.run(q, live, q.ans);
      if (!live()) return;
      done(cfg.why(q, q.ans));
      return;
    }
    await sayAsync(`You predict: <b>${c.say || c.label}</b>. Let's test it!`);
    if (!live()) return;
    const truth = await cfg.run(q, live, c.v);
    if (!live()) return;
    const match = c.v === truth;
    if (match) MUSIC.chime();
    else MUSIC.play("harp", 67, { gain: 0.3 });
    const lead = match
      ? pick(["Your prediction matched the test!", "The test agreed with your prediction!", "Just as you predicted!"])
      : pick(["Scientists predict, then test! Now we know.", "A surprise! That's why scientists test."]);
    done(`${lead} ${cfg.why(q, truth)}`);
  };
  const finish = () => {
    if (!alive()) return;
    gen += 1;
    confetti();
    MUSIC.chime();
    shell.mark(id, { done: true });
    window.OC?.count("labs finished");
    status(`${R} experiments done`);
    say(`🎉 You ran ${R} experiments! You predicted, tested and found out why. That is real science. Now try it for real!`);
    host.innerHTML = `<div class="ap-buttons"><button type="button" class="primary" data-trynow>🏠 Try it for real</button><button type="button" data-more>🔁 Play again</button></div>`;
    host.onclick = (event) => {
      if (event.target.closest("[data-trynow]")) tryCard(id);
      else if (event.target.closest("[data-more]")) {
        round = 0;
        ask();
      }
    };
  };
  onLevels(id, (lv) => {
    level = lv;
    round = 0;
    ask();
  });
  ask();
}

// ---------- drawing helpers ----------
function drawCar(parent, color) {
  const g = el("g", {}, parent);
  el("path", { d: "M-34 -12 V-30 Q-34 -36 -28 -36 H-14 L-4 -52 H14 L24 -36 H28 Q34 -36 34 -30 V-12 Z", fill: color, stroke: "#2b1d12", "stroke-width": 3, "stroke-linejoin": "round" }, g);
  el("path", { d: "M-1 -48 H12 L19 -38 H-6 Z", fill: "#d6ecf7" }, g);
  for (const x of [-19, 20]) {
    el("circle", { cx: x, cy: -10, r: 10, fill: "#2b1d12" }, g);
    el("circle", { cx: x, cy: -10, r: 4, fill: "#cfd8dc" }, g);
  }
  return g;
}
function horseshoe(parent) {
  const g = el("g", {}, parent);
  el("path", { d: "M-55 0 V-70 A55 55 0 0 1 55 -70 V0", fill: "none", stroke: "#d84336", "stroke-width": 34 }, g);
  for (const x of [-55, 55]) el("rect", { x: x - 17, y: -28, width: 34, height: 30, fill: "#cfd8dc", stroke: "#78909c", "stroke-width": 2 }, g);
  label(g, -55, -44, "N", 22, "#fff");
  label(g, 55, -44, "S", 22, "#fff");
  return g;
}
const POLE = { N: "#e05a47", S: "#3f7fd6" };
function barMagnet(parent, x, y, leftPole, half = 100) {
  const g = el("g", { transform: `translate(${x} ${y})` }, parent);
  const other = leftPole === "N" ? "S" : "N";
  el("rect", { x: -half, y: -28, width: half, height: 56, fill: POLE[leftPole] }, g);
  el("rect", { x: 0, y: -28, width: half, height: 56, fill: POLE[other] }, g);
  el("rect", { x: -half, y: -28, width: half * 2, height: 56, rx: 6, fill: "none", stroke: "#2b1d12", "stroke-width": 3 }, g);
  label(g, -half / 2, 11, leftPole, 30, "#fff");
  label(g, half / 2, 11, other, 30, "#fff");
  return g;
}
function torchShape(parent) {
  // a torch pointing right; the lens is at (0, 0)
  const g = el("g", {}, parent);
  el("rect", { x: -78, y: -15, width: 58, height: 30, rx: 8, fill: "#3f7fd6", stroke: "#2b1d12", "stroke-width": 3 }, g);
  el("path", { d: "M-22 -15 L0 -26 V26 L-22 15 Z", fill: "#5c93e0", stroke: "#2b1d12", "stroke-width": 3, "stroke-linejoin": "round" }, g);
  el("rect", { x: -2, y: -26, width: 6, height: 52, rx: 2, fill: "#fff59d", stroke: "#2b1d12", "stroke-width": 2 }, g);
  el("rect", { x: -62, y: -21, width: 14, height: 7, rx: 2, fill: "#f2c94c" }, g);
  return g;
}

// ---------- See it ----------
function seeIt() {
  const my = token;
  explain(

// ---------- 1. Ramps & rolling ----------
// Energy model: the car's height energy is used up by rolling friction on the floor, so distance = height ÷ friction.
// Squares rolled per book of height: carpet 1, wood 2, ice 4.
const SURF = {
  carpet: { name: "carpet", per: 1, fill: "#c4553c", dot: "#e48a6f" },
  wood: { name: "wood", per: 2, fill: "#d9a066", dot: "#a87038" },
  ice: { name: "ice", per: 4, fill: "#d3f1fb", dot: "#ffffff" },
};
const ROUGH = ["carpet", "wood", "ice"];
const RAMP = { x0: 40, bx: 150, foot: 330, tile: 46, tiles: 14, book: 30 };
function drawLane(L, color, nums) {
  const { x0, bx, foot, tile, tiles, book } = RAMP;
  const y = L.floorY;
  const s = SURF[L.surf];
  el("rect", { x: 16, y, width: foot - 16, height: 16, rx: 4, fill: "#b98a5e" }, view);
  el("rect", { x: foot, y, width: tile * tiles, height: 16, fill: s.fill, stroke: "#5a4130", "stroke-width": 2 }, view);
  for (let x = foot + 8; x < foot + tile * tiles; x += 16) {
    if (L.surf === "carpet") el("circle", { cx: x, cy: y + 8, r: 3, fill: s.dot }, view);
    else if (L.surf === "wood" && (x - foot) % 64 < 16) el("line", { x1: x, x2: x, y1: y + 2, y2: y + 14, stroke: s.dot, "stroke-width": 2 }, view);
    else if (L.surf === "ice" && (x - foot) % 48 < 16) el("line", { x1: x, x2: x + 14, y1: y + 12, y2: y + 4, stroke: s.dot, "stroke-width": 3 }, view);
  }
  for (let i = 1; i <= tiles; i++) {
    const x = foot + i * tile;
    el("line", { x1: x, x2: x, y1: y + 16, y2: y + 24, stroke: "#5a4130", "stroke-width": 2 }, view);
    if (nums) label(view, x, y + 46, i, 22, "#5a4130");
  }
  const cols = ["#3f7fd6", "#e0a96d", "#43a047", "#8e5bd0"];
  for (let k = 0; k < L.books; k++) {
    el("rect", { x: x0, y: y - (k + 1) * book, width: bx - x0, height: book - 2, rx: 4, fill: cols[k % 4], stroke: "#2b1d12", "stroke-width": 2 }, view);
    el("line", { x1: x0 + 8, x2: bx - 6, y1: y - (k + 1) * book + 20, y2: y - (k + 1) * book + 20, stroke: "#fffaf0", "stroke-width": 3 }, view);
  }
  const topY = y - L.books * book;
  el("line", { x1: bx - 14, y1: topY - 4, x2: foot + 4, y2: y - 4, stroke: "#a8632d", "stroke-width": 10, "stroke-linecap": "round" }, view);
  label(view, (x0 + bx) / 2, y + 44, s.name, 24, "#2b1d12");
  L.p0 = { x: bx - 10, y: topY - 9 };
  L.p1 = { x: foot, y: y - 9 };
  L.ang = (Math.atan2(L.p1.y - L.p0.y, L.p1.x - L.p0.x) * 180) / Math.PI;
  L.car = drawCar(view, color);
  const s0 = 0.14;
  move(L.car, L.p0.x + (L.p1.x - L.p0.x) * s0, L.p0.y + (L.p1.y - L.p0.y) * s0, L.ang);
}
function markLane(L) {
  const x = RAMP.foot + L.d * RAMP.tile;
  if (L.d > RAMP.tiles) label(view, 860, L.floorY - 66, "off the end! →", 26, "var(--accent-dark)", halo);
  else label(view, Math.min(920, Math.max(400, x)), L.floorY - 66, pl(L.d, "square"), 26, "var(--accent-dark)", halo);
}
async function rollCar(L, live) {
  const { p0, p1 } = L;
  const s0 = 0.14;
  let ok = await tw(
    650 + L.books * 90,
    (t) => {
      const s = s0 + (1 - s0) * t * t;
      move(L.car, p0.x + (p1.x - p0.x) * s, p0.y + (p1.y - p0.y) * s, L.ang);
    },
    live,
    lin
  );
  if (!ok) return false;
  const y = L.floorY;
  const dist = L.d * RAMP.tile;
  const dur = 900 + Math.min(dist, 700) * 2.4;
  const at = (u) => RAMP.foot + dist * (1 - (1 - u) ** 2);
  if (L.d <= RAMP.tiles) ok = await tw(dur, (t) => move(L.car, at(t), y), live, lin);
  else {
    const f = (1070 - RAMP.foot) / dist;
    const te = 1 - Math.sqrt(1 - f);
    ok = await tw(dur * te, (t) => move(L.car, at(t * te), y), live, lin);
  }
  return ok;
}

const ramps = {
  make(level, round, ctx) {
    let top;
    let bot;
    let kind;
    const two = (max) => {
      const a = pickInt(1, max);
      let b;
      do b = pickInt(1, max);
      while (b === a);
      return [a, b];
    };
    if (level === "easy") {
      kind = ctx.next("e", ["height", "surface", "height", "surface"]);
      if (kind === "height") {
        const s = pick(["wood", "carpet"]);
        const [a, b] = shuffle([1, 3]);
        top = { surf: s, books: a };
        bot = { surf: s, books: b };
      } else {
        const [a, b] = shuffle(["carpet", "ice"]);
        top = { surf: a, books: 2 };
        bot = { surf: b, books: 2 };
      }
    } else if (level === "medium") {
      kind = ctx.next("m", ["height", "surface", "height", "surface", "same"]);
      if (kind === "height") {
        const s = pick(ROUGH);
        const [a, b] = two(4);
        top = { surf: s, books: a };
        bot = { surf: s, books: b };
      } else if (kind === "surface") {
        const n = pickInt(1, 3);
        const [a, b] = shuffle(ROUGH);
        top = { surf: a, books: n };
        bot = { surf: b, books: n };
      } else {
        const s = pick(ROUGH);
        const n = pickInt(1, 3);
        top = { surf: s, books: n };
        bot = { surf: s, books: n };
      }
    } else {
      kind = "hard";
      const s = pick(ROUGH);
      const maxB = s === "ice" ? 3 : 4;
      const a = pick([1, 2]);
      let b;
      do b = pickInt(1, maxB);
      while (b === a);
      top = { surf: s, books: a };
      bot = { surf: s, books: b };
    }
    for (const L of [top, bot]) L.d = L.books * SURF[L.surf].per;
    const q = { kind, top, bot };
    if (kind === "hard") {
      const per = SURF[top.surf].per;
      const ans = bot.d;
      q.ans = ans;
      const set = new Set([ans]);
      for (const x of shuffle([ans + per, ans - per, top.d, ans + 2 * per, ans + 1])) if (set.size < 4 && x > 0) set.add(x);
      q.opts = [...set].sort((x, y) => x - y).map((x) => ({ label: String(x), v: x, say: pl(x, "square") }));
      q.ask = `On ${top.surf}, ${pl(top.books, "book")} rolled the red car ${pl(top.d, "square")}. How far will the blue car roll with ${pl(bot.books, "book")}?`;
    } else {
      q.opts = [
        { label: "🔴 Red car", v: "top", say: "the red car" },
        { label: "🔵 Blue car", v: "bot", say: "the blue car" },
      ];
      if (level === "medium") q.opts.push({ label: "🟰 Same", v: "same", say: "they roll the same" });
      q.ask = "Which car will roll farther?";
    }
    return q;
  },
  draw(q) {
    bg("#f7f1e6");
    q.top.floorY = 226;
    q.bot.floorY = 494;
    const nums = q.level !== "easy";
    drawLane(q.top, "#e05a47", nums);
    drawLane(q.bot, "#3f7fd6", nums);
    if (q.kind === "hard") {
      move(q.top.car, RAMP.foot + q.top.d * RAMP.tile, q.top.floorY);
      markLane(q.top);
    }
  },
  async run(q, live) {
    MUSIC.play("woodblock", 79, { gain: 0.4 });
    if (q.kind === "hard") {
      await rollCar(q.bot, live);
      if (!live()) return;
      markLane(q.bot);
      MUSIC.play("xylophone", 84, { gain: 0.3 });
      return q.bot.d;
    }
    await Promise.all([rollCar(q.top, live), rollCar(q.bot, live)]);
    if (!live()) return;
    markLane(q.top);
    markLane(q.bot);
    MUSIC.play("xylophone", 84, { gain: 0.3 });
    return q.top.d === q.bot.d ? "same" : q.top.d > q.bot.d ? "top" : "bot";
  },
  why(q) {
    const { top, bot } = q;
    if (q.kind === "hard") {
      const per = SURF[top.surf].per;
      const each = top.books === 1 ? `1 book gave ${pl(per, "square")}.` : `${top.books} books gave ${top.d} squares, so each book gives ${per}.`;
      return `${each} ${bot.books} × ${per} = ${bot.d}. Height and distance grow together!`;
    }
    if (top.surf === bot.surf && top.books === bot.books) return "Same height and same floor, so they roll the same. A fair test changes only one thing!";
    if (top.surf === bot.surf) return `The ${top.books > bot.books ? "red" : "blue"} car starts higher, so it has more energy. Higher ramp, farther roll!`;
    const [rough, smooth] = ROUGH.indexOf(top.surf) < ROUGH.indexOf(bot.surf) ? [top.surf, bot.surf] : [bot.surf, top.surf];
    return `${cap(rough)} is rougher than ${smooth}. Rubbing slows the wheels: that's called friction. Less friction, farther roll!`;
  },
};

    };
    const k = ctx.next("h", Object.keys(H_));
    return { k, c: H_[k][0], opts: LIGHT, ask: H_[k][1] };
  },
  draw(q) {
    drawCircuit(q);
  },
  async run(q, live) {
    MUSIC.play("woodblock", 79, { gain: 0.4 });
    const { L, R, T, B } = CK;
    if (!q.res.ok) {
      if (!(await nap(500, live))) return;
      const ring = el("circle", { cx: q.brk[0], cy: q.brk[1], r: 34, fill: "none", stroke: "#e05a47", "stroke-width": 6, "stroke-dasharray": "10 7", opacity: 0 }, view);
      if (!(await tw(900, (t) => ring.setAttribute("opacity", Math.min(1, t * 2)), live))) return;
      return "no";
    }
    const top = q.res.topRoute === "branch" ? `H330 V250 H670 V${T}` : "";
    const bot = q.res.botRoute === "branch" ? `H640 V330 H360 V${B}` : "";
    const d = `M${L} 210 V${T} ${top} H${R} V${B} ${bot} H${L} V340`;
    const path = el("path", { d, fill: "none", stroke: "none" }, view);
    const len = path.getTotalLength();
    const dots = Array.from({ length: 18 }, () => el("circle", { r: 6, fill: "#ffd54f", stroke: "#a8632d", "stroke-width": 1.5 }, view));
    MUSIC.play("harp", 72, { gain: 0.3 });
    const ok = await tw(3000, (t) => {
      dots.forEach((dot, i) => {
        const p = path.getPointAtLength((i * len) / dots.length + ((t * 900) % (len / dots.length)));
        dot.setAttribute("cx", p.x);
        dot.setAttribute("cy", p.y);
      });
      q.lamps.forEach((lp, i) => {
        if (!q.res.lit[i]) return;
        lp.glow.setAttribute("opacity", Math.min(1, t * 3));
        lp.glass?.setAttribute("fill", t > 0.15 ? "#fff59d" : "#f4f6f8");
      });
    }, live, lin);
    if (!ok) return;
    return "yes";
  },
  why(q) {
    const k = q.k;
    const W_ = {
      closed: "The wires make a complete loop: from the battery, through the bulb and back. Electricity flows round, so it lights!",
      gap: "There's a gap in the loop. Electricity can't jump across air, so the bulb stays dark.",
      swon: "The switch is closed, so the loop is complete. Light on!",
      swoff: "An open switch makes a gap. No complete loop, no light.",
      none: "No battery means nothing pushes the electricity round. No light.",
      sw2on: "Both switches are closed, so the loop is complete.",
      sw2off: "These switches are in a row. One open switch breaks the whole loop.",
      swpon: "The switches are side by side. Electricity goes round through the closed one!",
      swpoff: "Both paths are open, so there is no loop.",
      ser: "In a row, electricity must go through both bulbs. The broken one makes a gap, so both stay dark.",
      par: "Side by side, each bulb has its own path. The good bulb still lights!",
      led: "The LED's + leg faces the battery's + end, so electricity can flow. It lights!",
      ledrev: "An LED lets electricity go only one way. It's in backwards, so it stays dark.",
      same: "Both wires go to the + end. Electricity must go out of one end and back into the other, so there's no loop.",
    };
    return k === "mat" ? q.c.mat.why : W_[k];
  },
};
