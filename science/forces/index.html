<script>const { $, el, svg: makeSvg, text, panel, say, pick, pickInt, wait, confetti, PRAISE, KIND, choices, explain, everyday, emoji, numpad, shuffle } = KIT;
const stage = $("[data-stage]");
const W = 1000;
const H = 560;
const GY = 440; // ground line in most scenes
let token = 0;
let view = null;
const STOP = Symbol("stop");
const C = { ink: "#2b1d12", soft: "#7a6552", wood: "#a8632d", woodL: "#e0a96d", blue: "#1e88e5", orange: "#f08a24", red: "#e53935", green: "#2e9d5b", grey: "#8a7764", purple: "#8e44ad" };

const UNITS = [
  { id: "f0", label: "See it", icon: "👀" },
  { id: "f1", label: "1. Speed", icon: "🏃" },
  { id: "f2", label: "2. Newton's laws", icon: "🚀" },
  { id: "f3", label: "3. Gravity & weight", icon: "🌙" },
  { id: "f4", label: "4. Friction & air", icon: "🪂" },
  { id: "f5", label: "5. Energy", icon: "🎢" },
  { id: "f6", label: "6. Simple machines", icon: "⚙️" },
];

// ---------- small helpers ----------
function fresh() {
  stage.innerHTML = "";
  view = makeSvg(`0 0 ${W} ${H}`, stage);
  return view;
}
const spoken = (html) =>
  html
    .replace(/<[^>]+>/g, " ")
    .replace(/m\/s²/g, " meters per second, every second")
    .replace(/N\/kg/g, " newtons per kilogram")
    .replace(/m\/s/g, " meters per second")
    .replace(/km\/h/g, " kilometers per hour")
    .replace(/(\d)\s?kg\b/g, "$1 kilograms")
    .replace(/(\d)\s?km\b/g, "$1 kilometers")
    .replace(/(\d)\s?N\b/g, "$1 newtons")
    .replace(/(\d)\s?J\b/g, "$1 joules")
    .replace(/(\d)\s?m\b/g, "$1 meters")
    .replace(/(\d)\s?s\b/g, "$1 seconds")
    .replace(/(\d)\s?h\b/g, "$1 hours")
    .replace(/(\d)\s?W\b/g, "$1 watts")
    .replace(/\b1 (metre|second|hour|newton|joule|kilogram|kilometre)s\b/g, "1 $1")
    .replace(/→/g, ", so ")
    .replace(/≈/g, " about ")
    .replace(/½/g, " half of ")
    .replace(/²/g, " squared")
    .replace(/\s−\s/g, " minus ")
    .replace(/%/g, " percent");
function talk(html) {
  const box = $("[data-say]");
  if (box) box.innerHTML = html;
  VOICE.speak(spoken(html));
}
function talkAsync(html) {
  const box = $("[data-say]");
  if (box) box.innerHTML = html;
  return VOICE.speakAsync(spoken(html));
}
const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
const lin = (t) => t;
// Animation helpers for games: they reject with STOP when the game is switched away.
function anim(my) {
  const alive = () => my === token && stage.isConnected;
  return {
    alive,
    wait: (ms) => new Promise((res, rej) => setTimeout(() => (alive() ? res() : rej(STOP)), KIT.still.matches ? Math.min(ms, 150) : ms)),
    tween: (ms, fn, e = ease) =>
      new Promise((res, rej) => {
        if (KIT.still.matches) {
          fn(1);
          return res();
        }
        const t0 = performance.now();
        const frame = (now) => {
          if (!alive()) return rej(STOP);
          const t = Math.min(1, (now - t0) / ms);
          fn(e(t));
          if (t < 1) requestAnimationFrame(frame);
          else res();
        };
        requestAnimationFrame(frame);
      }),
  };
}
const T = (v, x, y, s, size = 26, fill = C.ink, extra = {}) => text(v, x, y, s, { "font-size": size, fill, ...extra });
const fade = (A, g, ms = 500) => A.tween(ms, (t) => g.setAttribute("opacity", t));

function bg(v, kind = "lab") {
  if (kind === "moon") {
    el("rect", { width: W, height: H, fill: "#1d2333" }, v);
    for (let i = 0; i < 40; i++) el("circle", { cx: (i * 263) % W, cy: (i * 97) % 380, r: 1.5 + (i % 3), fill: "#fff", opacity: 0.7 }, v);
    el("rect", { x: 0, y: GY, width: W, height: H - GY, fill: "#c9c6c0" }, v);
    for (const [x, w] of [[140, 90], [520, 140], [840, 70]]) el("ellipse", { cx: x, cy: GY + 50, rx: w, ry: 14, fill: "#aaa69f" }, v);
  } else if (kind === "mars") {
    el("rect", { width: W, height: H, fill: "#f4d9c2" }, v);
    el("rect", { x: 0, y: GY, width: W, height: H - GY, fill: "#c4683f" }, v);
    for (const [x, w] of [[200, 70], [700, 110]]) el("ellipse", { cx: x, cy: GY + 55, rx: w, ry: 12, fill: "#a9532f" }, v);
  } else if (kind === "jupiter" || kind === "planet") {
    el("rect", { width: W, height: H, fill: kind === "jupiter" ? "#f1dcc0" : "#2a2350" }, v);
    if (kind === "jupiter") for (let i = 0; i < 7; i++) el("rect", { x: 0, y: GY + i * 18, width: W, height: 10, fill: i % 2 ? "#d9a37a" : "#c9845a" }, v);
    else {
      for (let i = 0; i < 30; i++) el("circle", { cx: (i * 263) % W, cy: (i * 97) % 380, r: 2, fill: "#fff", opacity: 0.7 }, v);
      el("rect", { x: 0, y: GY, width: W, height: H - GY, fill: "#7d6bb3" }, v);
    }
  } else if (kind === "earth") {
    el("rect", { width: W, height: H, fill: "#e4f3fb" }, v);
    el("rect", { x: 0, y: GY, width: W, height: H - GY, fill: "#bfe0a5" }, v);
  } else if (kind === "space") {
    el("rect", { width: W, height: H, fill: "#151a2b" }, v);
    for (let i = 0; i < 60; i++) el("circle", { cx: (i * 331) % W, cy: (i * 149) % H, r: 1 + (i % 3), fill: "#fff", opacity: 0.75 }, v);
  } else {
    el("rect", { width: W, height: H, fill: "#fffaf0" }, v);
    el("rect", { x: 0, y: GY, width: W, height: H - GY, fill: "#ead3b0" }, v);
    for (let x = 0; x < W; x += 125) el("line", { x1: x, x2: x, y1: GY, y2: H, stroke: "#d8bb92", "stroke-width": 3 }, v);
    el("line", { x1: 0, x2: W, y1: GY, y2: GY, stroke: "#c9a679", "stroke-width": 4 }, v);
  }
}
function arrow(v, x1, y1, x2, y2, { color = C.red, label, w = 10, lx, ly, size = 26 } = {}) {
  const g = el("g", {}, v);
  const dx = x2 - x1;
  const dy = y2 - y1;
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len;
  const uy = dy / len;
  const hl = Math.min(w * 2.6, len * 0.6);
  const hx = x2 - ux * hl;
  const hy = y2 - uy * hl;
  el("line", { x1, y1, x2: hx, y2: hy, stroke: color, "stroke-width": w, "stroke-linecap": "round" }, g);
  el("path", { d: `M${x2} ${y2}L${hx - uy * w * 1.6} ${hy + ux * w * 1.6}L${hx + uy * w * 1.6} ${hy - ux * w * 1.6}Z`, fill: color }, g);
  if (label) T(g, lx ?? (x1 + x2) / 2 + uy * 62, ly ?? (y1 + y2) / 2 - ux * 22 + 9, label, size, color);
  return g;
}
// A pickable emoji that faces right (most emoji runners face left, so we mirror them).
function glyph(v, x, y, ch, size, flip = false) {
  const g = el("g", { transform: `translate(${x} ${y})` }, v);
  const inner = el("g", { transform: flip ? "scale(-1 1)" : "" }, g);
  emoji(inner, 0, 0, ch, size);
  return g;
}
function cart(v, x, ground, kg, color = "#f2c94c") {
  const g = el("g", { transform: `translate(${x} 0)` }, v);
  const w = Math.min(190, 90 + kg * 12);
  const h = Math.min(90, 46 + kg * 5);
  el("rect", { x: -w / 2, y: ground - 26 - h, width: w, height: h, rx: 12, fill: color, stroke: C.ink, "stroke-width": 3 }, g);
  T(g, 0, ground - 26 - h / 2 + 10, `${kg} kg`, 28);
  for (const s of [-1, 1]) el("circle", { cx: (s * w) / 3, cy: ground - 14, r: 14, fill: "#3b2a1e", stroke: "#8a7764", "stroke-width": 4 }, g);
  g.w = w;
  g.h = h + 26;
  return g;
}
function person(v, x, ground, { color = "#1e88e5", scale = 1 } = {}) {
  const g = el("g", { transform: `translate(${x} ${ground}) scale(${scale})` }, v);
  el("rect", { x: -14, y: -78, width: 28, height: 50, rx: 12, fill: color }, g);
  el("line", { x1: -8, y1: -30, x2: -12, y2: 0, stroke: C.ink, "stroke-width": 8, "stroke-linecap": "round" }, g);
  el("line", { x1: 8, y1: -30, x2: 12, y2: 0, stroke: C.ink, "stroke-width": 8, "stroke-linecap": "round" }, g);
  el("circle", { cx: 0, cy: -96, r: 18, fill: "#f2c39b", stroke: C.ink, "stroke-width": 2 }, g);
  return g;
}
// Energy bars that always add to a fixed total.
function bars(v, x, y, items, max, { bw = 64, hmax = 150, gap = 18 } = {}) {
  const g = el("g", {}, v);
  el("rect", { x: x - 14, y: y - hmax - 52, width: items.length * (bw + gap) - gap + 28, height: hmax + 104, rx: 18, fill: "#fff", stroke: "#e2d6c4", "stroke-width": 3, opacity: 0.94 }, g);
  const parts = items.map(([label, color], i) => {
    const bx = x + i * (bw + gap);
    el("rect", { x: bx, y: y - hmax, width: bw, height: hmax, rx: 8, fill: "#f3ece1" }, g);
    const r = el("rect", { x: bx, y, width: bw, height: 0, rx: 8, fill: color }, g);
    const val = T(g, bx + bw / 2, y - hmax - 14, "", 22, color);
    T(g, bx + bw / 2, y + 32, label, 22, C.ink);
    return { r, val };
  });
  return {
    g,
    set(values) {
      values.forEach((n, i) => {
        const h = Math.max(0, (n / max) * hmax);
        parts[i].r.setAttribute("y", y - h);
        parts[i].r.setAttribute("height", h);
        parts[i].val.textContent = `${Math.round(n)} J`;
      });
    },
  };
}

// The worked-solution card (the "Explain" step of predict, test, explain).
function card(lines, A, top = false) {
  const n = lines.length;
  const h = 28 + n * 38;
  const y = top ? 12 : H - 12 - h;
  const g = el("g", { opacity: 0, "pointer-events": "none" }, view);
  el("rect", { x: 16, y, width: 968, height: h, rx: 22, fill: "#fff", stroke: "var(--accent)", "stroke-width": 4, opacity: 0.97 }, g);
  lines.forEach((l, i) => T(g, 40, y + 44 + i * 38, l, 26, C.ink, { "text-anchor": "start" }));
  return A.tween(500, (t) => g.setAttribute("opacity", t));
}

// ---------- styles ----------
const feStyle = document.createElement("style");
feStyle.textContent = `
.fe-ans{display:flex;justify-content:center;width:100%}
.fe-ans .kt-choices button{min-height:54px;font-size:19px;padding:4px 16px;line-height:1.15}
.fe-ans .kt-choices button:disabled{opacity:.45}
.fe-real{position:fixed;z-index:50}
.fe-real .kt-how-card{gap:8px;padding:16px 22px}
.fe-real h2{font-size:clamp(20px,2.8vw,27px)}
.fe-real li{font-size:clamp(15px,2vw,19px)}
.fe-real .kt-go{min-height:52px;margin-top:2px}
.fe-real p{margin:0;color:#2b1d12;font:700 clamp(15px,2vw,18px)/1.35 var(--sans);text-align:left;width:100%}
.fe-real p.safe{color:#8a4b14;background:#fff4e2;border-radius:14px;padding:8px 12px}
@media (max-height:460px),(max-width:420px) and (max-height:720px){
 .fe-ans .kt-choices button{min-height:44px;font-size:15px;padding:2px 10px}
 .fe-real .kt-how-card{padding:10px 14px;gap:5px}
 .fe-real li,.fe-real p{font-size:14px}
}`;
document.head.appendChild(feStyle);

// ---------- levels ----------
const LEVELS = [["easy", "🐣 Grade 4"], ["medium", "🦊 Grade 5–6"], ["hard", "🦁 Grade 7–8"]];
const levelRow = (cur) => `<div class="ap-row"><div class="ap-chips" data-levels>${LEVELS.map(([k, l]) => `<button type="button" data-lv="${k}" aria-pressed="${k === cur}">${l}</button>`).join("")}</div><p class="ap-status" data-status></p></div>`;
const GOOD = ["Correct.", "Correct — your reasoning holds.", "Correct. You applied the rule carefully.", "Correct. You checked the quantities."];
const OOPS = ["Not quite. Consider:", "Not quite. Mistakes are how we learn. Consider:", "Not yet. Consider:"];

// ---------- the game engine: predict, test, explain ----------
const ROUNDS = 8;
function game(id, { types, gen, real, counted, explainIt }) {
  const my = token;
  const A = anim(my);
  let level = shell.progress()[id]?.level || "easy";
  let round = 0;
  let first = 0;
  let tries = 0;
  let q = null;
  let phase = "predict";
  let plan = [];
  let seen = new Set();
  let pad = null;
  const host = panel(`${levelRow(level)}<div class="fe-ans" data-ans></div>`);
  const status = () => {
    const s = $("[data-status]");
    if (s) s.textContent = `Round ${round + 1} of ${ROUNDS} · ${phase === "predict" ? "🤔 Predict" : phase === "test" ? "🧪 Test" : "💡 Explain"}`;
  };
  const makeQ = () => {
    let out;
    const order = [plan[round], ...shuffle(types[level])];
    search: for (const t of order) {
      for (let k = 0; k < 30; k++) {
        out = gen[t](level);
        if (!seen.has(out.key)) break search;
      }
    }
    seen.add(out.key);
    if (!out.pad && !out.keepOrder) {
      const right = out.opts[out.ok];
      out.opts = shuffle(out.opts);
      out.ok = out.opts.indexOf(right);
    }
    if (out.pad) out.answerText = out.answerText || `${out.ans} ${out.unit || ""}`.trim();
    else out.answerText = out.answerText || out.opts[out.ok];
    return out;
  };
  const begin = () => {
    round = 0;
    first = 0;
    seen = new Set();
    plan = [];
    while (plan.length < ROUNDS) plan.push(...shuffle(types[level]));
    plan = plan.slice(0, ROUNDS);
    ask();
  };
  const ask = () => {
    phase = "predict";
    tries = 0;
    q = makeQ();
    fresh();
    q.ctx = q.draw(view) || {};
    status();
    const box = $("[data-ans]");
    pad = null;
    if (q.pad) pad = numpad(box, { onEnter: (v) => answer(v === q.ans, v), max: 5 });
    else
      choices(
        box,
        q.opts.map((label, i) => ({ label, i })),
        (o, b) => answer(o.i === q.ok, o.i, b)
      );
    talk(q.say);
  };
  const answer = async (ok, value, button) => {
    if (my !== token || phase !== "predict") return;
    window.OC?.touch();
    if (ok) {
      button?.classList.add("right");
      MUSIC.chime();
      if (tries === 0) first += 1;
      return run(true);
    }
    tries += 1;
    MUSIC.oops();
    if (button) {
      button.classList.add("wrong");
      button.disabled = true;
    }
    if (tries < 2) {
      pad?.clear();
      const extra = q.hintFor?.(value);
      talk(`${pick(OOPS)} ${extra || q.hint}`);
    } else run(false);
  };
  const run = async (ok) => {
    phase = "test";
    status();
    $("[data-ans]").innerHTML = "";
    try {
      await talkAsync(ok ? `${pick(GOOD)} Now we test the prediction.` : "Let us run the test and observe what actually happens.");
      if (my !== token) return;
      if (q.test) await q.test(q.ctx, A);
      phase = "explain";
      status();
      card(q.why, A, q.top).catch(() => {});
      talk(`${ok ? "" : `The answer is <b>${q.answerText}</b>. `}${q.why.join(" ")}`);
      $("[data-ans]").innerHTML = `<div class="ap-buttons"><button type="button" data-again aria-label="Hear it again">🔁</button><button type="button" class="primary" data-next>${round + 1 >= ROUNDS ? "Finish ✓" : "Next ▶"}</button></div>`;
    } catch (error) {
      if (error !== STOP) console.error(error);
    }
  };
  const finish = () => {
    phase = "done";
    fresh();
    bg(view, "lab");
    emoji(view, 500, 150, "🏅", 150);
    emoji(view, 500, 70, "🗣️", 70);
    T(view, 500, 160, "Explain it", 44, "var(--accent-dark)");
    explainIt.forEach((l, i) => T(view, 500, 220 + i * 40, l, 27, C.ink));
    T(view, 500, 400, `${ROUNDS} rounds complete · correct on the first attempt: ${first} of ${ROUNDS}`, 26, C.soft);
    T(view, 500, 450, "Say it aloud to a grown-up, or write it down.", 26, C.soft);
    T(view, 500, 510, "Predict → Test → Explain: the method of every scientist.", 24, C.soft);
    confetti();
    MUSIC.chime();
    shell.mark(id, { done: true });
    window.OC?.count(counted);
    const effort = first >= ROUNDS - 1 ? "You read each problem with care and checked your reasoning." : "You persisted through the difficult problems and learned from every test.";
    talk(`All ${ROUNDS} rounds complete. ${effort} Explain it: ${explainIt.join(" ")} Answer in two to four sentences, aloud or in writing.`);
    const s = $("[data-status]");
    if (s) s.textContent = "Complete · 🗣️ Explain it";
    $("[data-ans]").innerHTML = `<div class="ap-buttons"><button type="button" class="primary" data-real>🏠 Try it for real</button><button type="button" data-replay>🔁 Play again</button></div>`;
  };
  host.onclick = (event) => {
    if (my !== token) return;
    const lv = event.target.closest("[data-lv]");
    if (lv) {
      level = lv.dataset.lv;
      host.querySelectorAll("[data-lv]").forEach((b) => b.setAttribute("aria-pressed", String(b === lv)));
      shell.mark(id, { level });
      window.OC?.touch();
      VOICE.hush();
      return begin();
    }
    if (event.target.closest("[data-next]")) {
      window.OC?.touch();
      VOICE.hush();
      round += 1;
      if (round >= ROUNDS) finish();
      else ask();
    } else if (event.target.closest("[data-again]")) {
      talk(q.why.join(" "));
    } else if (event.target.closest("[data-real]")) realCard(real);
    else if (event.target.closest("[data-replay]")) begin();
  };
  begin();
  // Test hooks (used by the automated checks only).
  window.__fe = {
    state: () => ({ id, level, round, first, phase, t: q?.t, ans: q?.ans, ok: q?.ok, say: $("[data-say]")?.innerText }),
    right: () => {
      if (q.pad) answer(true, q.ans);
      else host.querySelector(`[data-c="${q.ok}"]`).click();
      return "right";
    },
    wrong: () => {
      if (q.pad) answer(false, q.ans + 1);
      else host.querySelector(`[data-c]:not([data-c="${q.ok}"]):not(:disabled)`).click();
      return "wrong";
    },
    next: () => (host.querySelector("[data-next]")?.click(), "next"),
    show: (t) => {
      plan[round] = t;
      seen = new Set();
      ask();
      return t;
    },
    gen: (lv, n = 60) => {
      const out = [];
      for (const t of types[lv]) for (let i = 0; i < n; i++) {
        const g = gen[t](lv);
        out.push({ t: g.t, v: g.v, ans: g.ans, ok: g.ok, opts: g.opts, pad: !!g.pad, why: g.why });
      }
      return out;
    },
  };
}

// A race track: lanes of runners, distance marks and a stopwatch.
function track(v, lanes, D, unit = "m", clockUnit = "s") {
  el("rect", { width: W, height: H, fill: "#cfe8b8" }, v);
  const x0 = 110;
  const x1 = 890;
  const n = lanes.length;
  const lh = 92;
  const top = n === 1 ? 190 : n === 2 ? 150 : 110;
  for (let i = 0; i < n; i++) {
    el("rect", { x: 40, y: top + i * lh, width: 920, height: lh - 6, fill: unit === "km" ? "#8d8a86" : "#d9744a" }, v);
    if (unit === "km") el("line", { x1: 40, x2: 960, y1: top + i * lh + 43, y2: top + i * lh + 43, stroke: "#fff", "stroke-width": 4, "stroke-dasharray": "30 22" }, v);
  }
  for (let k = 0; k < 10; k++) el("rect", { x: x1 - 6, y: top + k * ((n * lh - 6) / 10), width: 12, height: (n * lh - 6) / 10, fill: k % 2 ? "#fff" : C.ink }, v);
  el("line", { x1: x0, x2: x0, y1: top, y2: top + n * lh - 6, stroke: "#fff", "stroke-width": 5 }, v);
  const by = top + n * lh + 28;
  for (let k = 0; k <= 4; k++) {
    const x = x0 + (k / 4) * (x1 - x0);
    el("line", { x1: x, x2: x, y1: by - 18, y2: by - 4, stroke: C.ink, "stroke-width": 3 }, v);
    T(v, x, by + 22, `${Math.round((D * k) / 4 * 10) / 10} ${unit}`, 23, C.ink);
  }
  const clock = el("g", {}, v);
  el("rect", { x: 380, y: 18, width: 240, height: 62, rx: 20, fill: "#fff", stroke: C.ink, "stroke-width": 3 }, clock);
  const ct = T(clock, 500, 62, `⏱ 0 ${clockUnit}`, 34);
  const who = lanes.map((ln, i) => {
    const r = RACERS[ln.kind];
    const g = glyph(v, x0, top + i * lh + 42, r.g, 58, r.flip);
    if (ln.tag) T(v, 70, top + i * lh + 52, ln.tag, 30, "#fff");
    return g;
  });
  return {
    xOf: (d) => x0 + (Math.min(d, D) / D) * (x1 - x0),
    move(i, d) {
      who[i].setAttribute("transform", `translate(${x0 + (Math.min(d, D) / D) * (x1 - x0)} ${top + i * lh + 42})`);
    },
    time(t) {
      ct.textContent = `⏱ ${Math.round(t * 10) / 10} ${clockUnit}`;
    },
    laneY: (i) => top + i * lh,
    top,
    lh,
  };
}
// Run every lane: speeds[i], stop at dist[i]. Shows a clock.
async function race(tr, A, speeds, dists, { tMax, startGaps = [] } = {}) {
  const end = tMax ?? Math.max(...dists.map((d, i) => d / speeds[i]));
  const ms = Math.max(1600, Math.min(4200, end * 300));
  MUSIC.play("woodblock", 79, { gain: 0.3 });
  await A.tween(ms, (k) => {
    const t = k * end;
    tr.time(t);
    speeds.forEach((s, i) => tr.move(i, Math.min(dists[i], (startGaps[i] || 0) + s * t)));
  }, lin);
  MUSIC.play("woodblock", 84, { gain: 0.35 });
  await A.wait(500);
}
const twoKinds = () => shuffle(["runner", "bike", "dog"]).slice(0, 2);

// Find the path length where the car sits at the hill top (x = 640).
const sAtX = (c, x) => {
  let lo = 0;
  let hi = c.len;
  for (let i = 0; i < 30; i++) {
    const mid = (lo + hi) / 2;
    if (c.path.getPointAtLength(mid).x < x) lo = mid;
    else hi = mid;
  }
  return lo;
};
async function ride(c, A, fromS, toS, ms, lossPerLen = 0) {
  await A.tween(ms, (k) => {
    const s = fromS + (toS - fromS) * k;
    const h = c.place(s);
    const gpe = (c.total * h) / c.startH;
    const heat = Math.min(c.total, lossPerLen * s);
    const ke = Math.max(0, c.total - gpe - heat);
    c.b.set(c.heat ? [Math.max(0, Math.min(c.total, gpe)), ke, heat] : [Math.max(0, Math.min(c.total, gpe)), ke]);
  });
}

function pulleyScene(v, n, load, effort = "?") {

  el("line", { x1: fx, x2: fx, y1: 300, y2: 340, stroke: "#6d4c2f", "stroke-width": 6 }, g);
  el("rect", { x: fx - 70, y: 340, width: 140, height: 80, rx: 10, fill: "#d9a066", stroke: C.ink, "stroke-width": 3 }, g);
  T(g, fx, 392, `${load} N`, 30);
  const freeX = fx + Math.max(fw / 2, 70) + 60;
  el("path", { d: `M${fx + fw / 2 - 10} 80 Q${freeX} 70 ${freeX} 110`, fill: "none", stroke: "#6d4c2f", "stroke-width": 6 }, v);
  const free = el("line", { x1: freeX, x2: freeX, y1: 108, y2: 300, stroke: "#6d4c2f", "stroke-width": 6 }, v);

async function lift(c, A, n, liftPx = 60) {
  const pull = Math.min(200, liftPx * n);
  const rise = pull / n;
  MUSIC.play("woodblock", 76, { gain: 0.35 });
  await A.tween(2000, (k) => {
    c.g.setAttribute("transform", `translate(0 ${-rise * k})`);
    c.ropes.forEach((r) => r.setAttribute("y2", 300 - rise * k));
    c.free.setAttribute("y2", 300 + pull * k);
    c.hand.setAttribute("transform", `translate(${c.freeX} ${300 + pull * k})`);
  });
  c.ropes.forEach((r) => r.setAttribute("stroke", C.green));
  await A.wait(400);
}
function rampScene(v, L, h, load, effort = "?") {
  bg(v, "lab");
  const base = Math.sqrt(L * L - h * h);
  const s = Math.min(640 / base, 300 / h);
  const x0 = 160;
  const x1 = x0 + base * s;
  const y1 = GY - h * s;
  el("path", { d: `M${x0} ${GY} L${x1} ${GY} L${x1} ${y1} Z`, fill: "#e8dccb", stroke: "#a8916f", "stroke-width": 4 }, v);
  T(v, x1 + 18, (GY + y1) / 2 + 8, `${h} m`, 28, C.blue, { "text-anchor": "start" });
  const ang = Math.atan2(h, base);
  T(v, (x0 + x1) / 2 - 30, (GY + y1) / 2 - 28, `${L} m`, 28, C.green, { transform: `rotate(${(-ang * 180) / Math.PI} ${(x0 + x1) / 2 - 30} ${(GY + y1) / 2 - 28})` });
  const box = el("g", {}, v);
  el("rect", { x: -40, y: -60, width: 80, height: 60, rx: 8, fill: "#d9a066", stroke: C.ink, "stroke-width": 3 }, box);
  T(box, 0, -22, `${load} N`, 22);
  arrow(box, -150, -30, -46, -30, { color: C.red, label: effort === "?" ? "push ?" : `${effort} N`, ly: -60 });
  const at = (k) => {
    const x = x0 + 90 + (x1 - x0 - 140) * k;
    const y = GY - (x - x0) * Math.tan(ang);
    box.setAttribute("transform", `translate(${x} ${y}) rotate(${(-ang * 180) / Math.PI})`);
  };
  at(0);
  return { at };
}
