const shellsOf = (e) => {
  const out = [];
  let left = e;
  for (const cap of [2, 8, 8, 32]) {
    if (left <= 0) break;
    const k = Math.min(cap, left);
    out.push(k);
    left -= k;
  }
  return out;
};
const shellStr = (e) => shellsOf(e).join("-");
const outerOf = (z) => shellsOf(z).at(-1);
const tablePos = (z) => {
  const sh = shellsOf(z);

};

const IONS = [

// ---------- Formulas ----------
const SUBS = "₀₁₂₃₄₅₆₇₈₉";
const SUPS = { 0: "⁰", 1: "¹", 2: "²", 3: "³", "+": "⁺", "-": "⁻" };
const fm = (s) => {
  const [body, ch] = s.split("^");
  return body.replace(/([A-Za-z)])(\d+)/g, (m, a, d) => a + [...d].map((c) => SUBS[c]).join("")) + (ch ? [...ch].map((c) => SUPS[c]).join("") : "");
};
const fsay = (s) => {
  const [body, ch] = s.split("^");
  let out = body.replace(/^(\d+)/, "$1 ").replace(/([A-Z][a-z]?)(\d*)/g, (m, sym, d) => ` ${sym.toUpperCase().split("").join(" ")}${d ? " " + d : ""} `);
  if (ch) out += " " + ch.replace("+", " plus").replace("-", " minus");
  return out.replace(/\s+/g, " ").trim();
};
const F = (s) => `<b class="at-f" data-s="${fsay(s)}">${fm(s)}</b>`;
const atomsOf = (f) => {
  const out = {};
  for (const [, s, d] of f.matchAll(/([A-Z][a-z]?)(\d*)/g)) out[s] = (out[s] || 0) + Number(d || 1);
  return out;
};
const sideCount = (terms) => {
  const out = {};
  for (const [k, f] of terms) for (const [s, n] of Object.entries(atomsOf(f))) out[s] = (out[s] || 0) + k * n;
  return out;
};
const eqText = (terms, blank = -1) => terms.map(([k, f], i) => (i === blank ? "?" : k > 1 ? k : "") + fm(f)).join(" + ");

// Reactions (all balanced; verified in tests). type: reaction class where it is unambiguous.
const RXS = [

  { name: "Hydrogen burning", L: [[2, "H2"], [1, "O2"]], R: [[2, "H2O"]] },

  { name: "Neutralising an acid", L: [[1, "NaOH"], [1, "HCl"]], R: [[1, "NaCl"], [1, "H2O"]], type: "double replacement" },

  { name: "Blast furnace", L: [[1, "Fe2O3"], [3, "CO"]], R: [[2, "Fe"], [3, "CO2"]] },
  { name: "Limestone + acid", L: [[1, "CaCO3"], [2, "HCl"]], R: [[1, "CaCl2"], [1, "H2O"], [1, "CO2"]] },
  { name: "Respiration in your cells", L: [[1, "C6H12O6"], [6, "O2"]], R: [[6, "CO2"], [6, "H2O"]], big: true },
  { name: "Photosynthesis in leaves", L: [[6, "CO2"], [6, "H2O"]], R: [[1, "C6H12O6"], [6, "O2"]], big: true },
];
const RTYPES = ["synthesis", "decomposition", "combustion", "single replacement", "double replacement"];

// Speech: formulas read letter by letter, temperatures and grams in words.
const spoken = (html) =>
  html
    .replace(/<b class="at-f" data-s="([^"]*)">.*?<\/b>/g, " $1 ")
    .replace(/→/g, " makes ")
    .replace(/−\s?(\d)/g, " minus $1")
    .replace(/°C/g, " degrees Celsius")
    .replace(/(\d)-(?=\d)/g, "$1, ")
    .replace(/(\d) g\b/g, "$1 grams");
const talk = (html) => {
  say(html, { voice: false });

};
const talkAsync = (html) => {

const GOOD = ["Correct — and here is why:", "Correct. Your reasoning holds:", "Correct. Precisely:", "Correct — well reasoned:"];
const OOPS = ["Not quite. Consider this:", "Not quite. Look again:", "Not yet. Mistakes are how we learn. Consider:", "Not quite. Ask yourself:"];

// ---------- Drawing helpers ----------
const COLOR = { Al: "#b8c4d6", H: "#ffffff", C: "#3d3d3d", N: "#3b6fe0", O: "#e53935", Cl: "#3fae49", Na: "#9c5bd6", Fe: "#c0692b", Mg: "#2e9b62", Ca: "#7d9c5a", Cu: "#c8763d", Zn: "#8d99ae", Au: "#e6b422", He: "#7fd6e6", Ar: "#86c9de", Si: "#d9b77a", S: "#f2d531", Ne: "#f28c5c", K: "#8f40d4", Hg: "#b8c4cc", Ag: "#c7ccd1" };
const DARK = new Set(["C", "N", "O", "Cl", "Na", "Fe", "Mg", "Ca", "Cu", "K", "Zn"]);
function ball(parent, x, y, s, r, label = r >= 16) {
  const g = el("g", { transform: `translate(${x} ${y})` }, parent);
  el("circle", { r, fill: COLOR[s] || "#bbb", stroke: s === "H" ? "#8b7d70" : "#3a2a1c", "stroke-width": Math.max(1.5, r / 10) }, g);
  el("circle", { cx: -r * 0.35, cy: -r * 0.35, r: r * 0.28, fill: "#fff", opacity: 0.45 }, g);
  if (label) text(g, 0, r * 0.36, s, { "font-size": Math.round(r * 0.95), fill: DARK.has(s) ? "#fff" : "#2b1d12" });
  return g;
}
const wrap = (str, max) => {
  const lines = [];
  for (const w of String(str).split(" ")) {
    const l = lines[lines.length - 1];
    if (l !== undefined && (l + " " + w).length <= max) lines[lines.length - 1] = l + " " + w;
    else lines.push(w);
  }
  return lines;
};
const lines = (parent, x, y, str, max, lh, attrs) => {
  const ls = wrap(str, max);
  ls.forEach((l, i) => text(parent, x, y + i * lh, l, attrs));
  return ls.length;
};

// A Bohr-model atom (a simplified picture): protons (red, +), neutrons (grey) in the nucleus, electrons (blue, −) on shells 2-8-8-2.
function drawAtom(parent, cx, cy, p, n, e, { r0 = 98, dr = 44, pr = 9, rings = true } = {}) {
  const g = el("g", {}, parent);
  const sh = shellsOf(e);
  if (rings) sh.forEach((_, i) => el("circle", { cx, cy, r: r0 + i * dr, fill: "none", stroke: "#cdbba2", "stroke-width": 3, "stroke-dasharray": "3 9", "stroke-linecap": "round" }, g));
  const total = p + n;
  const nuc = el("g", {}, g);
  for (let k = total - 1; k >= 0; k--) {
    const isP = Math.floor(((k + 1) * p) / total) > Math.floor((k * p) / total);
    const rad = pr * 1.08 * Math.sqrt(k + 0.4);
    const a = k * 2.39996;
    const x = cx + rad * Math.cos(a);
    const y = cy + rad * Math.sin(a);
    el("circle", { cx: x, cy: y, r: pr, fill: isP ? "#e5533d" : "#a59a8d", stroke: isP ? "#9c2c1c" : "#6f655b", "stroke-width": 1.5 }, nuc);
    if (pr >= 12) text(nuc, x, y + pr * 0.38, isP ? "+" : "", { "font-size": pr * 1.2, fill: "#fff" });
  }
  sh.forEach((k, i) => {
    const sg = el("g", { class: "at-spin", "data-cx": cx, "data-cy": cy, "data-sp": [26, 17, 12, 9][i] }, g);
    const r = r0 + i * dr;
    for (let j = 0; j < k; j++) {
      const a = (2 * Math.PI * j) / k - Math.PI / 2;
      const x = cx + r * Math.cos(a);
      const y = cy + r * Math.sin(a);
      el("circle", { cx: x, cy: y, r: pr + 1, fill: "#2f7de1", stroke: "#164d96", "stroke-width": 1.5 }, sg);
      el("circle", { cx: x - pr * 0.3, cy: y - pr * 0.3, r: pr * 0.3, fill: "#fff", opacity: 0.5 }, sg);
    }
  });
  return g;
}
function spinLoop(alive) {
  const t0 = performance.now();
  const frame = (now) => {
    if (!alive()) return;
    if (!KIT.still.matches)
      for (const g of stage.querySelectorAll(".at-spin")) g.setAttribute("transform", `rotate(${(((now - t0) / 1000) * Number(g.dataset.sp)) % 360} ${g.dataset.cx} ${g.dataset.cy})`);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
function tile(parent, x, y, z, size = 74, attrs = {}) {
  const e = EL[z];
  const g = el("g", { transform: `translate(${x} ${y})`, ...attrs }, parent);
  el("rect", { width: size, height: size, rx: size * 0.16, fill: CAT[e.cat][1], stroke: "#8a7764", "stroke-width": 2.5 }, g);
  text(g, 7, size * 0.3, z, { "font-size": Math.max(18, size * 0.27), fill: "#4d3c2e", "text-anchor": "start" });
  text(g, size / 2, size * 0.83, e.s, { "font-size": size * 0.46, fill: "#2b1d12" });
  return g;
}
// Small cluster picture of one molecule, e.g. for reactions.
const HEX = [[0, 0]];
for (let ring = 1; ring <= 2; ring++) for (let k = 0; k < 6 * ring; k++) {
  const side = Math.floor(k / ring);
  const step = k % ring;
  const a0 = (Math.PI / 3) * side;
  const a1 = (Math.PI / 3) * (side + 1);
  const p0 = [Math.cos(a0) * ring, Math.sin(a0) * ring];
  const p1 = [Math.cos(a1) * ring, Math.sin(a1) * ring];
  HEX.push([p0[0] + ((p1[0] - p0[0]) * step) / ring, p0[1] + ((p1[1] - p0[1]) * step) / ring]);
}
function cluster(parent, x, y, f, r = 12) {
  const counts = atomsOf(f);
  const list = [];
  for (const [s, n] of Object.entries(counts)) if (s !== "H") for (let k = 0; k < n; k++) list.push(s);
  for (let k = 0; k < (counts.H || 0); k++) list.push("H");
  const g = el("g", {}, parent);
  const d = r * 1.9;
  list.forEach((s, i) => ball(g, x + HEX[i][0] * d, y + HEX[i][1] * d, s, s === "H" ? r * 0.78 : r, false));
  return g;
}
const clusterH = (f, r = 12) => {
  const n = Object.values(atomsOf(f)).reduce((a, b) => a + b, 0);
  return (n === 1 ? 2 : n <= 7 ? 4 : 6) * r * 0.95 + 6;
};

// Generic question game: q = { say, opts?, ans (value or list), hint (string or fn(v)), why, draw?(view, q, answer), reveal?(view, q), wrongMark?(view, q, v) }.
function runner(id, cfg) {
  const my = token;
  const modes = cfg.modes || LEVELS;
  let level = shell.progress()[id]?.level || cfg.start || modes[0][0];
  if (!modes.some((m) => m[0] === level)) level = modes[0][0];
  let qs = [];
  let i = 0;
  let first = 0;
  let tries = 0;
  let q = null;
  let busy = false;
  panel(`<div class="ap-row">${chipsHtml(modes, level)}<p class="ap-status" data-status></p></div><div class="at-pick" data-choices></div>`);
  const host = $("[data-choices]");
  const isAns = (v) => (Array.isArray(q.ans) ? q.ans.map(String).includes(String(v)) : String(v) === String(q.ans));
  const begin = () => {
    q = null;
    busy = false;
    host.onclick = null;
    host.innerHTML = "";
    if (cfg.custom?.(level, api)) return;
    qs = cfg.make(level);
    i = 0;
    first = 0;
    ask();
  };
  const ask = () => {
    q = qs[i];
    tries = 0;
    busy = false;
    fresh();
    q.draw?.(view, q, answer);
    setStatus(`${cfg.word || "Question"} ${i + 1} of ${qs.length}`);
    host.onclick = null;
    if (q.opts) choices(host, q.opts.map((o) => (typeof o === "object" ? o : { label: String(o), v: o })), (o, b) => answer(o.v, b));
    else host.innerHTML = "";
    talk(q.say);
  };
  const buttonFor = (v) => [...host.querySelectorAll("[data-c]")].find((b, k) => String(q.opts[k]?.v ?? q.opts[k]) === String(v));
  function answer(v, button) {
    if (my !== token || busy || !q) return;
    window.OC?.touch();
    button = button || (q.opts ? buttonFor(v) : null);
    if (isAns(v)) {
      busy = true;
      button?.classList.add("right");
      MUSIC.chime();
      if (!tries) first += 1;
      window.OC?.count(cfg.noun);
      q.reveal?.(view, q, v);
      talk(`${pick(GOOD)} ${q.why}`);
      nextBtn();
    } else {
      tries += 1;
      if (button) {
        button.classList.add("wrong");
        button.disabled = true;
      }
      MUSIC.oops();
      q.wrongMark?.(view, q, v);
      if (tries === 1) talk(`${pick(OOPS)} ${typeof q.hint === "function" ? q.hint(v) : q.hint}`);
      else {
        busy = true;
        q.reveal?.(view, q, Array.isArray(q.ans) ? q.ans[0] : q.ans);
        talk(`Here is the reasoning. ${q.why}`);
        nextBtn();
      }
    }
  }
  const nextBtn = () => {
    setTimeout(() => {
      if (my !== token) return;
      host.innerHTML = `<div class="ap-buttons"><button type="button" class="primary" data-next>${i + 1 >= qs.length ? "Finish 🏁" : "Next ▶"}</button></div>`;
      host.onclick = (event) => event.target.closest("[data-next]") && next();
    }, 500);
  };
  const next = () => {
    if (my !== token || !busy) return;
    VOICE.hush();
    i += 1;
    if (i >= qs.length) finishScreen(id, qs.length, first, host, begin, cfg.noun);
    else ask();
  };
  onChips(id, (lv) => {
    level = lv;
    begin();
  });
  const api = {
    state: () => ({ level, i, total: qs.length, first, tries, ans: q?.ans, say: $("[data-say]")?.innerText }),
    right: () => (q ? (answer(Array.isArray(q.ans) ? q.ans[0] : q.ans), "right") : "no q"),
    wrong: () => {
      if (!q) return "no q";
      const pool = q.opts ? q.opts.map((o) => (typeof o === "object" ? o.v : o)) : q.wrongs || [];
      const v = pool.find((x) => !isAns(x) && !buttonFor(x)?.disabled);
      answer(v);
      return "wrong " + v;
    },
    next: () => (host.querySelector("[data-next]")?.click(), "next"),
    qs: () => qs,
    answer,
  };
  window.__at = api;
  begin();
  return api;
}

        const plain = Math.round((iso.reduce((a, [m]) => a + m, 0) / iso.length) * 100) / 100;
        const opts = [...new Set([avg, plain, Math.round((avg + 0.3) * 100) / 100, Math.round((avg - 0.2) * 100) / 100])].slice(0, 4).sort((a, b) => a - b);
        return { text: `Natural ${el_} is about ${iso.map(([m, pc]) => `${pc}% ${el_}-${m}`).join(" and ")}. Using mass numbers as masses, what is its average atomic mass?`, ans: avg, opts, hint: "This is a weighted mean: each isotope's mass counts in proportion to its percentage. Multiply, then add.", steps: [iso.map(([m, pc]) => `${m} × ${pc / 100}`).join(" + "), `= ${avg}`, "The commoner isotope pulls the average toward itself."] };
      },
      () => {
        const z = pick([3, 4, 5, 6, 7, 8, 9, 11, 12, 13, 14, 15, 16, 17, 19, 20]);
        const v = outerOf(z);
        return { text: `How many valence electrons (outer-shell electrons) does ${EL[z].name.toLowerCase()}, element ${z}, have?`, ans: v, opts: near(v, [z % 8 || 8, shellsOf(z).length]), hint: `Fill the shells in order, 2 then 8 then 8, until you have placed ${z} electrons. How many are in the last shell?`, steps: [`${z} electrons → ${shellStr(z)}`, `Valence electrons = ${v}`] };
      },
      () => {
        const z = pick([3, 11, 19, 4, 12, 20, 13, 7, 8, 9, 15, 16, 17]);
        const v = outerOf(z);
        const c = v <= 3 ? v : v - 8;
        const lab = (x) => (x > 0 ? `+${x}` : `−${-x}`);
        return { text: `${EL[z].name} (${shellStr(z)}) usually forms an ion. What is its charge?`, ans: c, opts: [-3, -2, -1, 1, 2, 3].map((x) => ({ label: lab(x), v: x })), hint: "Atoms gain or lose the fewest electrons needed to reach a full outer shell. Is it easier for this atom to lose or to gain?", steps: [`${v} valence electron${v > 1 ? "s" : ""}`, c > 0 ? `Lose ${c} → full shell → charge ${lab(c)}` : `Gain ${-c} → 8 → charge ${lab(c)}`] };
      },
      () => {
        const [fact, val, dir] = pick([["Liquid nitrogen boils at 77 K", 77, "C"], ["Oxygen boils at 90 K", 90, "C"], ["Mercury melts at −39 °C", -39, "K"], ["Iron melts at 1538 °C", 1538, "K"], ["Water boils at 100 °C", 100, "K"]]);
        const ans = dir === "C" ? val - 273 : val + 273;
        const lab = (x) => (x < 0 ? `−${-x}` : String(x)) + (dir === "C" ? " °C" : " K");
        const opts = [...new Set([ans, dir === "C" ? val + 273 : val - 273, ans + 10, dir === "C" ? 273 - val : Math.abs(val) + 273])].slice(0, 4).sort((a, b) => a - b);
        return { text: `${fact}. Using kelvin = °C + 273, what is this ${dir === "C" ? "in °C" : "in kelvin"}?`, ans, opts: opts.map((x) => ({ label: lab(x), v: x })), hint: "Kelvin values are always 273 larger than Celsius values. Which way are you converting?", steps: [dir === "C" ? `${val} − 273 = ${ans}` : `${val} + 273 = ${ans}`, `Answer: ${lab(ans)}`] };
      },
      () => {
        const rx = pick(RXS);
        const terms = [...rx.L.map((t, i) => ["L", i, t]), ...rx.R.map((t, i) => ["R", i, t])];
        const cand = terms.filter(([, , t]) => t[0] > 1);
        const [side, i, [k, f]] = pick(cand.length ? cand : terms);
        const shown = `${eqText(rx.L, side === "L" ? i : -1)} → ${eqText(rx.R, side === "R" ? i : -1)}`;
        return { text: `Balance: ${shown}. What number replaces the ?`, say: `${rx.name}. Which coefficient balances the equation where the question mark is, in front of ${F(f)}?`, ans: k, opts: [1, 2, 3, 4, 5, 6], hint: "Choose one element that appears in that term. Count it on the other side, then ask how many copies of the term you need.", steps: [`${eqText(rx.L)} → ${eqText(rx.R)}`, `Left: ${Object.entries(sideCount(rx.L)).map(([a, b]) => a + " " + b).join(", ")}`, `Right: ${Object.entries(sideCount(rx.R)).map(([a, b]) => a + " " + b).join(", ")}`] };
      },
      ...T.hard.slice(0, 1),
      ...T.hard.slice(3, 4),
    ];
    const BANK = { easy: [...T.easy, T.medium[0]], medium: [...T.medium.slice(1), ...T.hard], hard: HARD };
    runner("at7", {
      noun: "hunt questions",
      make: (level) => {
        const out = [];
        const seen = new Set();
        const tpl = shuffle(BANK[level]);
        let guard = 0;
        while (out.length < 10 && guard++ < 300) {
          const g = tpl[out.length % tpl.length]();
          if (seen.has(g.text)) continue;
          seen.add(g.text);
          out.push(g);
        }
        return shuffle(out).map((g) => ({
          say: g.say || g.text,
          ans: g.ans,
          opts: g.opts,
          hint: g.hint,
          why: g.steps.join(". ") + ".",
          draw(v) {
            el("rect", { x: 40, y: 24, width: 920, height: 512, rx: 34, fill: "#fffaf0", stroke: "#e0cfb5", "stroke-width": 3 }, v);
            emoji(v, 100, 80, "🔎", 56);
            const n = lines(v, 520, 90, g.text, 40, 46, { "font-size": 36, fill: "#2b1d12" });
            el("g", { class: "at-steps", "data-y": 120 + n * 46 }, v);
          },
          reveal(v) {
            const s = v.querySelector(".at-steps");
            const y0 = Number(s.dataset.y) + 30;
            text(s, 500, y0, "Worked solution", { "font-size": 26, fill: "var(--accent-dark)" });
            g.steps.forEach((st, k) => text(s, 500, y0 + 50 + k * 50, st, { "font-size": 32, fill: "#2e7d46" }));
          },
        }));
      },
    });
  },
};

const tween = (ms, fn, alive) =>
  new Promise((resolve) => {
    if (KIT.still.matches) {
      fn(1);
      return resolve(true);
    }
    const t0 = performance.now();
    const frame = (now) => {
      if (!alive()) return resolve(false);
      const t = Math.min(1, (now - t0) / ms);
      fn(t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
      if (t < 1) requestAnimationFrame(frame);
      else resolve(true);
    };
    requestAnimationFrame(frame);
  });
