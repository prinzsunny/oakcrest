<script>const { $, el, svg: makeSvg, text, panel, say, sayAsync, pick, pickInt, wait, confetti, choices, explain, everyday, emoji, shuffle } = KIT;

function fresh() {

}
const grp = (p, x, y, s = 1, attrs = {}) => el("g", { transform: `translate(${x} ${y}) scale(${s})`, ...attrs }, p);
const place = (g, x, y, s = 1, r = 0) => g.setAttribute("transform", `translate(${x} ${y}) rotate(${r}) scale(${s})`);
const toSvg = (v, event) => {
  const p = v.createSVGPoint();
  p.x = event.clientX;
  p.y = event.clientY;
  return p.matrixTransform(v.getScreenCTM().inverse());
};
// A calm repeating animation that stops when `alive()` turns false.
function loop(alive, fn) {
  if (KIT.still.matches) return fn(0.4);
  const t0 = performance.now();
  const frame = (now) => {
    if (!alive()) return;
    fn((now - t0) / 1000);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
const tween = (ms, fn, alive) =>
  new Promise((resolve) => {
    if (KIT.still.matches) {
      fn(1);
      return resolve(true);
    }
    const t0 = performance.now();
    const frame = (now) => {
      if (!alive()) return resolve(false);
      const t = Math.min(1, (now - t0) / ms);
      fn(t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
      if (t < 1) requestAnimationFrame(frame);
      else resolve(true);
    };
    requestAnimationFrame(frame);
  });

// ---------- sounds (real instrument samples) ----------
// A flute trill that sounds a little like birdsong (it is a flute, not a bird recording).
function trill(gain = 0.22) {
  const t = MUSIC.now() + 0.03;
  [84, 88, 86, 91, 88, 93].forEach((m, i) => MUSIC.play("flute", m, { gain, at: t + i * 0.09, length: 0.07 }));
}
const click = (gain = 0.5) => MUSIC.play("woodblock", 79, { gain });
const buzz = () => MUSIC.play("cello", 48, { gain: 0.18, length: 0.5 });
const note = (i, gain = 0.4) => MUSIC.play("xylophone", 72 + [0, 2, 4, 5, 7, 9, 11, 12, 14, 16, 17, 19][Math.min(11, i)], { gain });

// ---------- backgrounds ----------
function sky(v, { night = false, ground = true, sea = false } = {}) {
  const id = `flSky${++uid}`;

  el("stop", { offset: 1, "stop-color": night ? "#39406e" : "#fbf4e2" }, lg);
  el("rect", { x: -1000, y: -600, width: 3000, height: 1760, fill: `url(#${id})` }, v);
  if (night) {
    for (let i = 0; i < 26; i++) el("circle", { cx: (i * 397) % 1000, cy: 20 + ((i * 131) % 300), r: i % 3 ? 2 : 3, fill: "#fff8d6", opacity: 0.8 }, v);

    el("circle", { cx: 900, cy: 70, r: 42, fill: "#ffd54f", opacity: 0.9 }, v);

      for (const [dx, r] of [[-30, 22], [0, 30], [30, 22]]) el("circle", { cx: cx + dx, cy, r, fill: "#fff" }, c);

  if (sea) el("path", { d: `M-1000 470 H0 Q250 450 500 470 T1000 470 H2000 V1200 H-1000 Z`, fill: "#7fb8d8" }, v);

  el("circle", { cx: 60, cy: -37, r: 4, fill: INK }, g);
  el("path", { d: "M72 -40 L104 -30 L72 -22 Z", fill: c.beak }, g);

  el("path", { d: "M10 -12 C-20 -32 -72 -18 -90 12 C-56 26 -14 24 10 -12 Z", fill: c.wing }, wing);
  el("path", { d: "M-30 2 L-72 14 M-20 8 L-56 20 M-42 -6 L-82 6", stroke: c.body, "stroke-width": 3, opacity: 0.7, fill: "none" }, wing);
  return { g, wing, flap: (a) => wing.setAttribute("transform", `rotate(${a} 10 -12)`) };
}
function hummer(p, x, y, s = 1) {

  el("path", { d: "M30 0 Q28 10 42 8 Q50 0 44 -6 Z", fill: "#d81b60" }, g);

  el("ellipse", { cx: -14, cy: -38, rx: 13, ry: 48, fill: "#b3e5fc", opacity: 0.75, stroke: "#4fa3c7", "stroke-width": 2, transform: "rotate(-28 -14 -38)" }, wing);

}
function bat(p, x, y, s = 1, o = {}) {
  const g = grp(p, x, y, s);
  const wingC = o.wing || "#7b5a4c";
  const halves = [-1, 1].map((sx) => {
    const w = el("g", { transform: `scale(${sx} 1)` }, g);
    el("path", { d: "M8 -16 C40 -48 104 -56 154 -32 L142 -14 Q126 -20 120 8 Q104 -6 92 20 Q76 4 62 24 Q46 8 30 22 Q18 12 8 16 Z", fill: wingC, stroke: "#3e2723", "stroke-width": 3, "stroke-linejoin": "round" }, w);
    el("path", { d: "M10 -14 L120 8 M10 -14 L92 20 M10 -14 L62 24 M10 -14 L150 -30", stroke: "#3e2723", "stroke-width": 2.5, opacity: 0.6, fill: "none" }, w);
    return w;
  });
  el("ellipse", { cx: 0, cy: 6, rx: 21, ry: 31, fill: "#5d4037" }, g);
  el("path", { d: "M-15 -40 L-24 -70 L-3 -48 Z M15 -40 L24 -70 L3 -48 Z", fill: "#5d4037" }, g);
  el("path", { d: "M-13 -44 L-18 -62 L-6 -48 Z M13 -44 L18 -62 L6 -48 Z", fill: "#d7a59a" }, g);
  el("circle", { cx: 0, cy: -32, r: 20, fill: "#6d4c41" }, g);
  for (const ex of [-8, 8]) {

}
function butterfly(p, x, y, s = 1, o = {}) {
  const c = o.color || "#f28c28";
  const g = grp(p, x, y, s);
  const wings = [-1, 1].map((sx) => {
    const w = el("g", { transform: `scale(${sx} 1)` }, g);

// Honeybee, seen from above, facing right. kind: worker | queen | drone.
function bee(p, x, y, s = 1, o = {}) {
  const kind = o.kind || "worker";
  const g = grp(p, x, y, s);
  const abL = kind === "queen" ? 82 : kind === "drone" ? 58 : 54;
  const abR = kind === "drone" ? 38 : kind === "queen" ? 30 : 32;
  const legs = el("g", { class: "fl-legs" }, g);

  el("ellipse", { cx: -20 - abL, cy: 0, rx: abL, ry: abR, fill: "#f9c22e", stroke: INK, "stroke-width": 4 }, g);
  const bands = el("g", { "clip-path": `url(#${cid})` }, g);
  for (let i = 1; i < 4; i++) el("rect", { x: -20 - i * abL * 0.5 - 6, y: -60, width: abL * 0.22, height: 120, fill: "#3e2a1a" }, bands);

  el("circle", { cx: 6, cy: 0, r: 27, fill: "#6d4c41", stroke: INK, "stroke-width": 4 }, g);
  for (let i = 0; i < 10; i++) el("circle", { cx: 6 + Math.cos(i * 0.63) * 18, cy: Math.sin(i * 0.63) * 18, r: 3, fill: "#a1887f" }, g);
  const head = el("g", {}, g);
  el("circle", { cx: 46, cy: 0, r: kind === "drone" ? 24 : 20, fill: "#3e2a1a", stroke: INK, "stroke-width": 4 }, head);
  const eye = kind === "drone" ? 14 : 9;
  for (const sy of [-1, 1]) el("ellipse", { cx: 50, cy: sy * (kind === "drone" ? 11 : 12), rx: eye, ry: eye * 0.75, fill: "#1a1a1a", stroke: "#795548", "stroke-width": 2 }, head);
  const ant = el("g", {}, g);
  if (!o.noAntennae) for (const sy of [-1, 1]) el("path", { d: `M60 ${sy * 8} L76 ${sy * 22} L94 ${sy * 24}`, stroke: INK, "stroke-width": 4, fill: "none", "stroke-linecap": "round" }, ant);
  const wings = el("g", { opacity: o.noWings ? 0 : 1 }, g);
  for (const sy of [-1, 1]) {
    el("ellipse", { cx: -26, cy: sy * 34, rx: 46, ry: 18, fill: "#e3f2fd", opacity: 0.8, stroke: "#90a4ae", "stroke-width": 2.5, transform: `rotate(${sy * -22} -26 ${sy * 34})` }, wings);
    el("ellipse", { cx: -30, cy: sy * 24, rx: 30, ry: 12, fill: "#e3f2fd", opacity: 0.8, stroke: "#90a4ae", "stroke-width": 2, transform: `rotate(${sy * -12} -30 ${sy * 24})` }, wings);
  }

}

function pterosaur(p, x, y, s = 1) {
  const g = grp(p, x, y, s);

  el("ellipse", { cx: -10, cy: 0, rx: 46, ry: 20, fill: "#a1887f", stroke: "#4e3b2c", "stroke-width": 4 }, g);
  el("path", { d: "M-40 14 l-14 26 l-8 2 M-24 16 l-8 26 l-8 2", stroke: "#4e3b2c", "stroke-width": 4, fill: "none", "stroke-linecap": "round" }, g);

// ---------- the game frame (8 rounds, struggle first, calm finish) ----------
const LEVELS = [["easy", "🐣 Easy"], ["medium", "🦊 Medium"], ["hard", "🦁 Hard"]];
const GOOD = ["Yes! You looked closely.", "Right! Good noticing.", "Yes! You used the clues.", "That's it! Careful thinking.", "Yes! You checked the clues.", "Right! You thought it through."];
const NOTYET = ["Not yet.", "Hmm, not quite.", "Mistakes help us learn.", "Good try."];

function frame(id, { rounds = 8, noun = "Round", countKey, ask }) {
  const my = token;
  const saved = shell.progress()[id]?.level;
  const g = { id, level: LEVELS.some(([k]) => k === saved) ? saved : "easy", round: 0, score: 0, qt: 0, busy: false, gen: 0, q: {} };
  g.live = () => my === token;
  g.cur = () => {
    const gen = g.gen;
    return () => g.live() && gen === g.gen;
  };
  panel(`<div class="ap-row"><div class="ap-chips" data-levels>${LEVELS.map(([k, l]) => `<button type="button" data-lv="${k}" aria-pressed="${k === g.level}">${l}</button>`).join("")}</div><p class="ap-status" data-status></p></div><div class="fl-ans" data-ans></div>`);
  g.ans = $("[data-ans]");
  g.ok = () => g.live() && !g.busy;
  g.next = () => {
    if (!g.live()) return;
    g.gen += 1;
    g.busy = false;
    g.q = {};
    g.qt = 0;
    g.st = 0;
    g.missed = false;
    $("[data-status]").textContent = `${noun} ${g.round + 1} of ${rounds}`;
    g.ans.innerHTML = "";
    g.ans.onclick = null;
    ask(g);
  };
  // A question: { hint, reveal, why, show(), then() }. then() runs instead of finishing the round (multi-step rounds).
  g.set = (q) => {
    g.q = q;
    g.qt = 0;
  };
  g.answer = (ok, btn) => {
    if (!g.ok() || btn?.classList.contains("wrong")) return;
    window.OC?.touch();
    if (ok) {
      btn?.classList.add("right");
      if (g.q.then) {
        MUSIC.chime();
        return g.q.then();
      }
      return g.win(g.q.why || "");
    }
    btn?.classList.add("wrong");
    g.miss();
  };
  g.miss = async () => {
    if (!g.ok()) return;
    MUSIC.oops();
    g.qt += 1;
    g.missed = true;
    if (g.qt < 2) return say(`${pick(NOTYET)} ${g.q.hint || "Look again. What do you notice?"}`);
    g.busy = true;
    const alive = g.cur();
    g.q.show?.();
    await Promise.all([sayAsync(`Let's look why. ${g.q.reveal || g.q.why || ""}`), wait(2000)]);
    if (!alive()) return;
    await wait(900);
    if (!alive()) return;
    if (g.q.then) {
      g.busy = false;
      g.q.then();
    } else g.advance();
  };
  g.win = async (msg, ms = 1500) => {
    if (!g.live()) return;
    g.busy = true;
    const alive = g.cur();
    MUSIC.chime();
    if (!g.missed) g.score += 1;
    window.OC?.count(countKey);
    await Promise.all([sayAsync(`${pick(GOOD)} ${msg}`), wait(ms)]);
    if (alive()) g.advance();
  };
  g.advance = () => {
    g.round += 1;
    if (g.round >= rounds) g.finish();
    else g.next();
  };
  g.finish = async () => {
    g.gen += 1;
    const alive = g.cur();
    g.busy = true;
    confetti();
    shell.mark(id, { done: true });
    $("[data-status]").textContent = `All ${rounds} done ✓`;
    g.ans.innerHTML = `<div class="ap-buttons"><button type="button" data-again>🔁 Play again</button>${TRY[id] ? `<button type="button" class="primary" data-try>🏠 Try it for real</button>` : ""}</div>`;
    g.ans.onclick = (event) => {
      if (event.target.closest("[data-again]")) {
        g.round = 0;
        g.score = 0;
        g.next();
      } else if (event.target.closest("[data-try]")) tryCard(id);
    };
    await sayAsync(`🎉 You finished all ${rounds}! You kept trying and looked closely at the clues. Now try it for real, away from the screen.`);
    if (alive() && TRY[id]) tryCard(id);
  };
  // A step inside a round: 1st miss gives a hint, 2nd miss explains (caller then does the right move).
  g.st = 0;
  g.step = (ok, { hint, reveal }) => {
    window.OC?.touch();
    if (ok) {
      g.st = 0;
      return true;
    }
    MUSIC.oops();
    g.missed = true;
    g.st += 1;
    if (g.st < 2) {
      say(`${pick(NOTYET)} ${hint}`);
      return false;
    }
    g.st = 0;
    say(`Let's look why. ${reveal}`);
    return true;
  };
  g.choose = (opts, q) => {
    g.set({ show: () => g.ans.querySelectorAll("[data-c]").forEach((b, i) => opts[i].ok && b.classList.add("right")), ...q });
    choices(g.ans, opts, (o, b) => g.answer(o.ok, b));
  };
  $("[data-levels]").addEventListener("click", (event) => {
    const b = event.target.closest("[data-lv]");
    if (!b || !g.live()) return;
    g.level = b.dataset.lv;
    document.querySelectorAll("[data-lv]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    shell.mark(id, { level: g.level });
    window.OC?.touch();
    VOICE.hush();
    g.round = 0;
    g.score = 0;
    g.next();
  });
  g.next();
  return g;
}

// A label with a pointer line that fades in.
async function label(v, api, [x1, y1], [x2, y2], word, color = "var(--accent-dark)") {
  const g = el("g", { opacity: 0 }, v);
  el("line", { x1, y1, x2, y2, stroke: color, "stroke-width": 4, "stroke-linecap": "round" }, g);
  el("circle", { cx: x1, cy: y1, r: 7, fill: color }, g);
  const t = text(g, x2, y2 + (y2 < y1 ? -12 : 32), word, { "font-size": 30, fill: INK });
  await api.tween(600, (k) => g.setAttribute("opacity", k));
  return t;
}

          text(b, x + 110, 490, word, { "font-size": 32, fill: INK });
          return b;
        });
        const holder = el("g", { transform: "translate(500 250)" }, view);
        if (a.e) emoji(holder, 0, 0, a.e, 240);
        else a.d(holder);
        if (a.n === "robin" || a.n === "hummingbird") trill(0.15);
        const step2 = () => {
          const opts = a.bird
            ? shuffle([{ label: "🪶 It has feathers", ok: true }, { label: "✈️ It can fly" }, { label: "🥚 It lays eggs" }])
            : shuffle([{ label: "🪶 It has no feathers", ok: true }, { label: "🦵 It has legs" }, { label: "🌳 It lives outside" }]);
          say(`Yes! Now, how can you be sure? Which clue tells you?`);
          g.choose(opts, { hint: "Bats can fly and turtles lay eggs. So what clue belongs only to birds?", reveal: `Only birds have feathers. ${a.why}`, why: `Only birds have feathers. ${a.why}` });
        };
        const q = {
          hint: a.bird ? "Look at its body. What is it covered with?" : "Look at its body. Can you see any feathers?",
          reveal: a.why,
          why: a.why,
          show: () => {},
          then: g.level === "hard" ? step2 : null,
        };
        const pickIt = (isBird, btn) => {
          if (!g.ok()) return;
          const ok = isBird === a.bird;
          if (ok && !q.then) {
            const target = a.bird ? 130 : 870;
            tween(800, (t) => place(holder, 500 + (target - 500) * t, 250 + 150 * t, 1 - 0.75 * t), g.cur());
          }
          g.answer(ok, btn);
        };
        g.set(q);
        g.ans.innerHTML = `<div class="ap-chips kt-choices"><button type="button" data-yes>🪶 Bird</button><button type="button" data-no>🚫 Not a bird</button></div>`;
        g.ans.onclick = (event) => {
          const b = event.target.closest("button");
          if (b?.matches("[data-yes]")) pickIt(true, b);
          else if (b?.matches("[data-no]")) pickIt(false, b);
        };
        baskets.forEach((b) => b.addEventListener("pointerdown", () => g.q === q && pickIt(b.dataset.b === "1", null)));
        say(`Is this ${/^[aeiou]/.test(a.n) ? "an" : "a"} ${a.n} a bird? Tap Bird or Not a bird.`);
      },
    });
  },

  // ---------- 2. How wings fly ----------
  f2() {
    const SHAPES = {
      glide: { q: "Which wings are best for gliding over the sea for hours, like an albatross?", why: "Long, thin wings glide far with hardly any flapping." },
      dart: { q: "Which wings help a little sparrow turn quickly between bushes?", why: "Short, round wings help a bird take off fast and turn quickly." },
      soar: { q: "Which wings help an eagle soar in circles on warm, rising air?", why: "Broad wings with spread-out finger feathers soar on rising warm air." },
      dive: { q: "Which wings help a falcon dive super fast?", why: "Pointed wings that sweep back help a falcon dive very fast." },
    };
    const LIFT = [
      { q: "Air rushes over the curved wing. Which way does lift push the wing?", opts: [["⬆️ Up", true], ["⬇️ Down"], ["⬅️ Backwards"]], hint: "Watch the green arrow. Which way does it point?", why: "The wing turns the air down, so the air pushes the wing up. That's lift." },
      { q: "Which gives a wing more lift?", opts: [["💨 Faster air", true], ["🍃 Slower air"], ["🌧️ Wet air"]], hint: "Think of a kite. Does it fly better on a windy day or a still day?", why: "Faster air over the wing makes more lift." },
      { q: "Why do many birds take off facing into the wind?", opts: [["💨 More air over the wings", true], ["👀 To see better"], ["🧣 To stay warm"]], hint: "What does a wing need to make lift?", why: "Facing the wind sends more air over the wings, so they get more lift." },
    ];
    let plan = [];
    frame("f2", {
      noun: "Question",
      countKey: "wing questions",
      ask(g) {
        if (g.round === 0 || !plan.length) {
          plan = g.level === "easy" ? shuffle(["flap", "glide", "flap", "glide", "hover", "hover", "flap", "glide"]) : g.level === "medium" ? shuffle(["flap", "glide", "hover", "s", "s", "s", "s", "s"]) : shuffle(["hover", "glide", "s", "s", "s", "l", "l", "l"]);
          plan.shapes = shuffle(g.level === "medium" ? ["glide", "dart", "soar", "glide", "dart"] : ["glide", "dart", "soar", "dive"]);
          plan.lifts = shuffle(LIFT);
        }
        const kind = plan[g.round];
        const alive = g.cur();
        fresh();
        if (kind === "flap" || kind === "glide" || kind === "hover") {
          sky(view, { ground: false });
          let anim;
          if (kind === "hover") {
            el("path", { d: "M640 560 Q620 420 650 300", stroke: "#558b2f", "stroke-width": 10, fill: "none" }, view);
            el("path", { d: "M650 300 l-50 -70 l50 20 l50 -20 Z", fill: "#e91e63", stroke: "#ad1457", "stroke-width": 3 }, view);
            const h = hummer(view, 430, 270, 1.6);
            anim = (s) => {
              h.flap(Math.sin(s * Math.PI * 30) * 34);
              place(h.g, 430, 270 + Math.sin(s * 2) * 4, 1.6);
            };
          } else if (kind === "flap") {
            const b = bird(view, 0, 280, 1.4, { noLegs: true });
            anim = (s) => {
              b.flap(Math.sin(s * Math.PI * 4) * 34);
              place(b.g, 150 + ((s * 120) % 800), 280 - Math.sin(s * Math.PI * 4) * 12, 1.4);
            };
          } else {
            const b = bird(view, 0, 280, 1.4, { noLegs: true });
            b.flap(-6);
            anim = (s) => place(b.g, 150 + ((s * 110) % 800), 200 + ((s * 26) % 180), 1.4);
          }
          loop(alive, anim);
          const opts = [{ label: "🪽 Flapping", ok: kind === "flap" }, { label: "🕊️ Gliding", ok: kind === "glide" }];
          if (g.level !== "easy" || kind === "hover") opts.push({ label: "🌸 Hovering", ok: kind === "hover" });
          const why = { flap: "Its wings beat up and down. That's flapping.", glide: "Its wings are held out still while it slides through the air. That's gliding.", hover: "A hummingbird beats its wings so fast it can stay in one spot. That's hovering." }[kind];
          g.choose(opts, { hint: kind === "hover" ? "Is the bird moving along, or staying in one spot?" : "Watch the wings. Are they moving up and down, or held still?", reveal: why, why });
          say("Watch the bird. Is it flapping, gliding or hovering?");
        } else if (kind === "s") {
          const want = plan.shapes.pop() || "glide";
          const types = shuffle(g.level === "medium" ? ["glide", "dart", "soar"] : ["glide", "dart", "soar", "dive"]);
          sky(view, { ground: false });
          const n = types.length;
          types.forEach((t, i) => {
            const x = (W / n) * (i + 0.5);
            const tile = el("g", { class: "fl-tap", "data-t": t }, view);
            el("rect", { x: x - W / n / 2 + 10, y: 40, width: W / n - 20, height: 480, rx: 26, fill: "#ffffffcc", stroke: "#d9cdb5", "stroke-width": 4 }, tile);
            silhouette(tile, x, 280, Math.min(1.2, (W / n - 50) / 420), t);
          });
          const why = SHAPES[want].why;
          g.set({
            hint: "Look at each wing. Is it long and thin, short and round, broad, or pointed? Which fits the job?",
            reveal: why,
            why,
            show: () => view.querySelector(`[data-t="${want}"] rect`)?.setAttribute("stroke", "#22a05a"),
          });
          view.addEventListener("pointerdown", (event) => {
            const tile = event.target.closest("[data-t]");

            const ok = tile.dataset.t === want;
            tile.querySelector("rect").setAttribute("stroke", ok ? "#22a05a" : "#e57373");
            tile.querySelector("rect").setAttribute("stroke-width", 8);
            if (!ok) tile.dataset.wrong = 1;
            g.answer(ok, null);
          });
          say(`${SHAPES[want].q} Tap it.`);
        } else {
          const L = plan.lifts.pop() || LIFT[0];
          el("rect", { x: -1000, y: -600, width: 3000, height: 1760, fill: "#eef6fb" }, view);
          el("path", { d: AIRFOIL, fill: "#8d6e63", stroke: "#4e342e", "stroke-width": 5, transform: "translate(240 360) rotate(6)" }, view);
          const lines = [0, 1, 2].map((i) => el("path", { d: `M40 ${200 + i * 36} C240 ${200 + i * 36} 300 ${150 + i * 46} 520 ${170 + i * 44} S760 ${280 + i * 36} 960 ${360 + i * 36}`, fill: "none", stroke: "#90caf9", "stroke-width": 4, "stroke-dasharray": "14 12" }, view));
          const dots = lines.map(() => el("circle", { r: 9, fill: "#1e88e5" }, view));
          const up = el("g", {}, view);
          el("path", { d: "M500 300 L500 120", stroke: "#43a047", "stroke-width": 16, "stroke-linecap": "round" }, up);
          el("path", { d: "M470 140 L500 92 L530 140 Z", fill: "#43a047" }, up);
          text(up, 590, 120, "LIFT", { "font-size": 40, fill: "#2e7d32" });
          loop(alive, (s) =>
            lines.forEach((path, i) => {
              const len = path.getTotalLength();
              const p = path.getPointAtLength((((s * 0.4) + i * 0.15) % 1) * len);
              dots[i].setAttribute("cx", p.x);
              dots[i].setAttribute("cy", p.y);
            })
          );
          g.choose(L.opts.map(([label, ok]) => ({ label, ok: !!ok })), { hint: L.hint, reveal: L.why, why: L.why });
          say(L.q);
        }
      },
    });
  },

  // ---------- 3. Beaks and feet ----------
  f3() {
    const FOOD = {
      seed: { label: "🌻 Seeds", bird: "finch", why: "A finch's short, thick beak cracks hard seeds, like a nutcracker." },
      hook: { label: "🐭 Small animals", bird: "eagle", why: "An eagle's sharp, hooked beak tears meat." },
      needle: { label: "🌺 Nectar", bird: "hummingbird", why: "A hummingbird's long, thin beak reaches deep into flowers for sweet nectar." },
      flat: { label: "💧 Food in water", bird: "duck", why: "A duck's wide, flat bill scoops up water and strains out food." },
      chisel: { label: "🐛 Bugs in wood", bird: "woodpecker", why: "A woodpecker's strong, pointed beak chips into wood to find bugs." },
    };
    const FEET = {
      perch: { label: "🌳 Holds a branch", bird: "robin", why: "Perching feet curl around a branch and hold on tight, even when the bird sleeps." },
      talon: { label: "🦅 Grabs prey", bird: "eagle", why: "Talons are sharp, curved claws for grabbing prey." },
      web: { label: "💧 Paddles in water", bird: "duck", why: "Webbed feet push water like paddles, so a duck can swim." },
      climb: { label: "🪵 Climbs tree trunks", bird: "woodpecker", why: "Two toes point forward and two point back, so a woodpecker can climb up a tree trunk." },
    };
    let plan = [];
    frame("f3", {
      noun: "Bird",
      countKey: "beaks and feet matched",
      ask(g) {
        if (g.round === 0 || !plan.length) {
          const beaks = shuffle(Object.keys(FOOD));
          const feet = shuffle(Object.keys(FEET));
          if (g.level === "easy") plan = shuffle([...beaks, ...shuffle(["seed", "hook", "needle"])]).map((k) => ["beak", k]);
          else if (g.level === "medium") plan = shuffle([...beaks.map((k) => ["beak", k]), ...feet.slice(0, 3).map((k) => ["foot", k])]).concat([["foot", feet[3]]]);
          else plan = shuffle([...beaks.slice(0, 4).map((k) => ["pickBeak", k]), ...feet.slice(0, 2).map((k) => ["foot", k]), ["combo", "hook"], ["combo", "flat"]]);
        }
        const [kind, k] = plan[g.round];
        fresh();
        el("rect", { x: -1000, y: -600, width: 3000, height: 1760, fill: "#f3f8ec" }, view);
        if (kind === "beak") {
          beakHead(view, k === "needle" ? 330 : 400, 270, 2.1, k);
          const n = g.level === "easy" ? 2 : 3;
          const others = shuffle(Object.keys(FOOD).filter((x) => x !== k)).slice(0, n - 1);
          const opts = shuffle([k, ...others]).map((x) => ({ label: FOOD[x].label, ok: x === k }));
          g.choose(opts, { hint: "Look at the beak's shape. Is it thick, hooked, long, flat or pointed? What could that shape do?", reveal: FOOD[k].why, why: FOOD[k].why });
          say("Look at this beak. What food does it eat?");
        } else if (kind === "foot") {

          const n = g.level === "medium" ? 3 : 4;
          const opts = shuffle([k, ...shuffle(Object.keys(FEET).filter((x) => x !== k)).slice(0, n - 1)]).map((x) => ({ label: FEET[x].label, ok: x === k }));
          g.choose(opts, { hint: "Look at the toes. Are they curled, sharp, joined by skin, or pointing two ways?", reveal: FEET[k].why, why: FEET[k].why });
          say("Look at this bird's foot. What job is it made for?");
        } else if (kind === "pickBeak") {
          const types = shuffle([k, ...shuffle(Object.keys(FOOD).filter((x) => x !== k)).slice(0, 3)]);
          types.forEach((t, i) => {
            const x = 125 + i * 250;
            const tile = el("g", { class: "fl-tap", "data-t": t }, view);
            el("rect", { x: x - 115, y: 60, width: 230, height: 440, rx: 26, fill: "#fff", stroke: "#d9cdb5", "stroke-width": 4 }, tile);
            beakHead(tile, x - 35, 280, t === "needle" ? 0.6 : 0.8, t);
          });
          g.set({ hint: "Think about the food. Do you need to crack it, tear it, sip it, scoop it or chip it out?", reveal: FOOD[k].why, why: FOOD[k].why, show: () => view.querySelector(`[data-t="${k}"] rect`)?.setAttribute("stroke", "#22a05a") });
          view.addEventListener("pointerdown", (event) => {
            const tile = event.target.closest("[data-t]");
            if (!tile || !g.ok() || tile.dataset.wrong) return;
            const ok = tile.dataset.t === k;
            tile.querySelector("rect").setAttribute("stroke", ok ? "#22a05a" : "#e57373");
            tile.querySelector("rect").setAttribute("stroke-width", 8);
            if (!ok) tile.dataset.wrong = 1;
            g.answer(ok, null);
          });
          say(`Which beak is best for ${{ seed: "cracking hard seeds", hook: "tearing meat", needle: "sipping nectar deep in a flower", flat: "scooping food from water", chisel: "chipping bugs out of wood" }[k]}? Tap it.`);
        } else {
          beakHead(view, 330, 270, 1.7, k);
          foot(view, 760, 300, 1.2, k === "hook" ? "talon" : "web");
          const opts = shuffle(["seed", "hook", "needle", "flat"]).slice(0, 4).map((x) => ({ label: FOOD[x].label, ok: x === k }));
          const why = k === "hook" ? "A hooked beak tears meat and talons grab prey. This bird hunts small animals, like an eagle." : "A flat bill and webbed feet: this bird swims and scoops food from water, like a duck.";
          g.choose(opts, { hint: "Use both clues: the beak and the foot. Where does this bird find its food?", reveal: why, why });
          say("Look at the beak and the foot together. What does this bird eat?");
        }
      },
    });

  // ---------- 4. Nests and eggs ----------
  f4() {
    const MATS = [
      ["twig", (p) => el("path", { d: "M-40 10 L40 -10 M0 0 L14 -20 M-20 5 L-30 -12", stroke: "#795548", "stroke-width": 7, "stroke-linecap": "round", fill: "none" }, p)],
      ["grass", (p) => el("path", { d: "M-30 20 Q-20 -10 -34 -30 M-10 20 Q0 -20 -6 -36 M10 20 Q14 -14 26 -30 M24 20 Q30 0 40 -16", stroke: "#7cb342", "stroke-width": 6, "stroke-linecap": "round", fill: "none" }, p)],
      ["moss", (p) => [[-14, 4, 16], [8, -4, 18], [20, 10, 13], [-2, 14, 14]].forEach(([cx, cy, r]) => el("circle", { cx, cy, r, fill: "#558b2f" }, p))],
      ["mud", (p) => el("path", { d: "M-34 10 Q-30 -20 0 -18 Q34 -22 34 8 Q20 24 0 20 Q-24 26 -34 10 Z", fill: "#6d4c41" }, p)],
      ["feather", (p) => {
        el("path", { d: "M-36 24 C-20 -10 10 -30 38 -32 C26 -6 0 18 -36 24 Z", fill: "#eceff1", stroke: "#90a4ae", "stroke-width": 3 }, p);
        el("path", { d: "M-44 30 L32 -28", stroke: "#78909c", "stroke-width": 3 }, p);
      }],
    ];
    const NEST = [480, 400];
    const scenery = () => {
      sky(view);
      el("path", { d: "M0 470 Q200 440 360 450 L620 440 Q700 430 760 380", stroke: "#6d4c41", "stroke-width": 34, fill: "none", "stroke-linecap": "round" }, view);
      for (const [x, y, r] of [[120, 420, 0], [700, 400, -30]]) leaf(view, x, y, 0.7, r);
    };
    const STAGEN = {
      nEgg(p) {
        nest(p, 0, 30, 0.62);
        egg(p, -16, 20, 0.7);
        egg(p, 16, 22, 0.7);
      },
      nHatch(p) {
        nest(p, 0, 34, 0.62);
        el("path", { d: "M-24 24 Q-24 50 0 50 Q24 50 24 24 L16 16 L8 26 L0 14 L-8 26 L-16 16 Z", fill: "#a7d8e8", stroke: "#6b8f9b", "stroke-width": 3 }, p);
        el("circle", { cx: 0, cy: 0, r: 20, fill: "#ffe082", stroke: "#e0a800", "stroke-width": 2 }, p);
        el("circle", { cx: 6, cy: -4, r: 3.5, fill: INK }, p);
        el("path", { d: "M16 0 L30 4 L16 8 Z", fill: "#fb8c00" }, p);
      },
      nNest(p) {
        nest(p, 0, 40, 0.62);
        el("circle", { cx: 0, cy: 10, r: 26, fill: "#ffcc80", stroke: "#e0a060", "stroke-width": 2 }, p);
        el("path", { d: "M-12 -10 L0 -48 L12 -10 Z", fill: "#ff7043" }, p);
        el("path", { d: "M-6 -60 q8 -8 14 0 q6 8 14 0", stroke: "#e57373", "stroke-width": 5, fill: "none", "stroke-linecap": "round" }, p);
        el("circle", { cx: -12, cy: 4, r: 3.5, fill: INK }, p);
      },
      nFledge(p) {
        nest(p, -30, 50, 0.5);
        const b = bird(p, 30, -10, 0.45, { noLegs: true });
        b.flap(30);
      },
    };
    let plan = [];
    frame("f4", {
      noun: "Step",
      countKey: "nest steps",
      ask(g) {
        if (g.round === 0 || !plan.length) plan = ["build", "warm", "order", "build", "warm", "order", "warm", "build"];
        const kind = plan[g.round];
        const alive = g.cur();
        fresh();
        if (kind === "build") {
          scenery();
          const pile = el("g", {}, view);
          nest(view, NEST[0], NEST[1], 1.25);
          const hard = g.level === "hard";
          g.lock = false;
          const need = g.level === "easy" ? 3 : g.level === "medium" ? 6 : 10;
          let have = 0;
          const tally = text(view, NEST[0], 300, "", { "font-size": 34, fill: INK });
          const showTally = () => (tally.textContent = `${have} of ${need}`);
          const tray = el("g", {}, view);
          el("rect", { x: 790, y: 30, width: 190, height: 400, rx: 24, fill: "#fffaf0", stroke: "#d9cdb5", "stroke-width": 4 }, tray);
          MATS.forEach(([name, draw], i) => {
            const m = el("g", { class: "fl-tap fl-mat", "data-m": i, transform: `translate(885 ${78 + i * 76})` }, tray);
            el("rect", { x: -80, y: -34, width: 160, height: 68, rx: 18, fill: "transparent" }, m);
            draw(m);
          });
          const add = (i) => {
            if (!alive() || have >= need) return;
            have += 1;
            const p = el("g", { transform: `translate(${NEST[0] + pickInt(-100, 100)} ${NEST[1] - 6 + pickInt(-14, 10)}) rotate(${pickInt(-40, 40)}) scale(0.8)` }, view);
            MATS[i][1](p);
            showTally();
            note(have - 1);
            window.OC?.touch();
            if (have >= need) {
              const b = bird(view, NEST[0] + 10, NEST[1] - 70, 0.8);
              b.flap(10);
              trill();
              g.win(`${need} pieces! Birds build nests with twigs, grass, moss, mud and soft feathers.`);
            } else VOICE.speak(String(have));
          };
          if (hard) {
            for (let k = 0; k < 4; k++) {
              const p = el("g", { transform: `translate(${NEST[0] - 80 + k * 52} ${NEST[1] - 8}) rotate(${k * 20 - 30}) scale(0.8)` }, pile);
              MATS[0][1](p);
            }
            pile.remove();
            view.appendChild(pile);
            have = 4;
          }
          showTally();
          // drag a material into the nest, or just tap it
          let drag = null;
          view.addEventListener("pointerdown", (event) => {
            const m = event.target.closest(".fl-mat");
            if (!m || !g.live() || g.lock) return;
            const p = toSvg(view, event);
            const ghost = el("g", { transform: `translate(${p.x} ${p.y})`, "pointer-events": "none" }, view);
            MATS[Number(m.dataset.m)][1](ghost);
            drag = { i: Number(m.dataset.m), x: p.x, y: p.y, moved: false, ghost };
            try {
              view.setPointerCapture(event.pointerId);
            } catch {}
          });
          view.addEventListener("pointermove", (event) => {
            if (!drag) return;
            const p = toSvg(view, event);
            if (Math.hypot(p.x - drag.x, p.y - drag.y) > 10) drag.moved = true;
            drag.ghost.setAttribute("transform", `translate(${p.x} ${p.y})`);
            drag.px = p.x;
            drag.py = p.y;
          });
          const up = () => {
            if (!drag) return;
            const d = drag;
            drag = null;
            d.ghost.remove();
            if (!d.moved || (Math.abs(d.px - NEST[0]) < 170 && Math.abs(d.py - NEST[1]) < 110)) add(d.i);
            else say("Drop it on the nest.");
          };
          view.addEventListener("pointerup", up);
          view.addEventListener("pointercancel", up);
          if (hard) {
            g.lock = true;
            say("This nest has 4 twigs. A strong nest needs 10 pieces. How many more do we need?");
            g.choose(shuffle([5, 6, 7]).map((n) => ({ label: String(n), ok: n === 6 })), {
              hint: "Start at 4 and count up to 10 on your fingers. How many fingers did you put up?",
              reveal: "4 and 6 make 10. So we need 6 more.",
              then: () => {
                g.lock = false;
                g.ans.innerHTML = "";
                say("Yes! 4 and 6 make 10. Now add 6 more pieces. Drag them to the nest.");
              },
            });
          } else say(`Help the bird build its nest. Drag ${need} pieces into the nest. You can tap them too.`);
        } else if (kind === "warm") {
          scenery();
          const n = g.level === "easy" ? pickInt(2, 4) : 3;
          const glow = el("ellipse", { cx: NEST[0], cy: NEST[1] - 20, rx: 160, ry: 70, fill: "#ffb74d", opacity: 0 }, view);
          nest(view, NEST[0], NEST[1], 1.25);
          const eggs = [];
          for (let i = 0; i < n; i++) eggs.push(egg(view, NEST[0] - (n - 1) * 30 + i * 60, NEST[1] - 10, 1));
          const b = bird(view, NEST[0], 150, 1.1);
          b.g.classList.add("fl-tap");
          let flapping = true;
          loop(() => alive() && flapping, (s) => b.flap(Math.sin(s * 12) * 30));
          let tapped = false;
          b.g.addEventListener("pointerdown", async () => {
            if (tapped || !alive()) return;
            tapped = true;
            window.OC?.touch();
            flapping = false;
            b.flap(-4);
            await tween(1200, (t) => place(b.g, NEST[0], 150 + (NEST[1] - 70 - 150) * t, 1.1), alive);
            say("The parent bird sits on the eggs to keep them warm. This is called incubation.");
            await tween(2400, (t) => glow.setAttribute("opacity", 0.5 * Math.sin(t * Math.PI)), alive);
            if (!alive()) return;
            await tween(900, (t) => place(b.g, NEST[0] + 260 * t, NEST[1] - 70 - 120 * t, 1.1), alive);
            eggs.forEach((e, i) => {
              const box = e.getBBox();
              e.remove();
              const c = el("g", { transform: `translate(${NEST[0] - (n - 1) * 30 + i * 60} ${NEST[1] - 20})` }, view);
              el("circle", { cx: 0, cy: 0, r: 24, fill: "#ffe082", stroke: "#e0a800", "stroke-width": 2 }, c);
              el("circle", { cx: 6, cy: -6, r: 4, fill: INK }, c);
              el("path", { d: "M18 -2 L34 4 L18 10 Z", fill: "#fb8c00" }, c);
              void box;
            });
            trill();
            if (!alive()) return;
            if (g.level === "easy") {
              g.choose([n - 1, n, n + 1].map((x) => ({ label: String(x), ok: x === n })), { hint: "Touch each chick and count: 1, 2…", reveal: `Let's count: ${Array.from({ length: n }, (_, i) => i + 1).join(", ")}. ${n} chicks hatched.`, why: `${n} chicks hatched because their eggs were kept warm.` });
              say("The eggs hatched! How many chicks?");
            } else if (g.level === "medium") {
              g.choose(shuffle([{ label: "🔥 To keep them warm", ok: true }, { label: "💧 To wash them" }, { label: "😴 To take a nap" }]), { hint: "What did the eggs need so the chicks could grow inside?", reveal: "Eggs need warmth so the chick inside can grow. The parent's body keeps them warm.", why: "Eggs need warmth so the chick inside can grow." });
              say("The eggs hatched! Why did the bird sit on the eggs?");
            } else {
              const [who, days] = pick([["A hen", 21], ["A duck", 28], ["A robin", 14]]);
              const weeks = days / 7;
              g.choose([weeks - 1, weeks, weeks + 1].map((x) => ({ label: `${x} weeks`, ok: x === weeks })), { hint: "A week has 7 days. Count by 7s: 7, 14, 21… When do you reach the days?", reveal: `${Array.from({ length: weeks }, (_, i) => (i + 1) * 7).join(", ")}: that is ${weeks} weeks.`, why: `${days} days is ${weeks} weeks, because ${weeks} sevens make ${days}.` });
              say(`${who} sits on her eggs for about ${days} days. How many weeks is that?`);
            }
          });
          say("The eggs need to stay warm. Tap the parent bird so it sits on them.");
        } else {
          sky(view, { ground: false });
          const items = [["nEgg", "egg"], ["nHatch", "hatching"], ["nNest", "chick"], ["nFledge", "flying"]].filter((x, i) => g.level !== "easy" || i !== 2);
          orderGame(g, items.map(([k, word]) => ({ draw: STAGEN[k], word })), {
            pre: g.level === "easy" ? 1 : 0,
            hint: (i) => ["What comes first, before anything hatches?", "What happens to the egg next?", "What does a new chick do in the nest?", "What happens when the chick has grown its feathers?"][i + (g.level === "easy" && i >= 2 ? 1 : 0)],
            why: { egg: "First comes the egg.", hatching: "The chick breaks out of the egg: it hatches.", chick: "The chick stays in the nest and its parents feed it.", flying: "When its feathers grow, the young bird leaves the nest and flies." },
            done: () => g.win("Egg, hatching, chick in the nest, then flying. That is how a bird grows."),
          });
          say("Put the pictures in order. Tap what happens first.");
        }
      },
    });
  },

  // ---------- 5. Bats and echoes ----------
  f5() {
    const BAT = [130, 290];
    frame("f5", {
      noun: "Moth",
      countKey: "moths found",
      ask(g) {
        const alive = g.cur();
        fresh();
        sky(view, { night: true });
        el("path", { d: "M0 40 L230 50", stroke: "#4e342e", "stroke-width": 14, "stroke-linecap": "round" }, view);
        const b = bat(view, BAT[0], BAT[1], 0.6, { wing: "#8d6e63" });
        loop(alive, (s) => b.flap(0.75 + Math.sin(s * 9) * 0.25));
        const level = g.level;
        let moths;
        if (level === "hard") {
          const d = pickInt(2, 6);
          moths = [{ x: BAT[0] + d * 120, y: BAT[1], d }];
        } else if (level === "medium") {
          const near = pickInt(250, 380);
          const far = near + pickInt(240, 330);
          const ang = [pickInt(-25, 25), pickInt(-25, 25)];
          moths = shuffle([near, far]).map((r, i) => ({ x: BAT[0] + r * Math.cos((ang[i] * Math.PI) / 180), y: Math.max(90, Math.min(500, BAT[1] + r * Math.sin((ang[i] * Math.PI) / 180) + (i ? 90 : -90))), r }));
        } else moths = [{ x: pickInt(500, 880), y: pickInt(110, 460) }];
        moths.forEach((m) => {
          m.dist = Math.hypot(m.x - BAT[0], m.y - BAT[1]);
          m.g = el("g", { class: "fl-tap", opacity: 0, "data-moth": 1 }, view);
          el("circle", { cx: m.x, cy: m.y, r: 60, fill: "#fff59d", opacity: 0.18 }, m.g);
          moth(m.g, m.x, m.y, 0.42);
        });
        const closer = moths.reduce((a, c) => (c.dist < a.dist ? c : a));
        const counter = text(view, 500, 70, "", { "font-size": 44, fill: "#fff3c4" });
        let pinged = false;
        let busy = false;
        const ping = async () => {
          if (busy || !alive()) return;
          busy = true;
          window.OC?.touch();
          const speed = level === "hard" ? 120 / 600 : 0.5;
          const maxD = Math.max(...moths.map((m) => m.dist));
          const T = (2 * maxD) / speed + 200;
          click(0.55);
          const ring = el("circle", { cx: BAT[0], cy: BAT[1], r: 0, fill: "none", stroke: "#ffe082", "stroke-width": 6 }, view);
          const echoes = moths.map((m) => ({ m, ring: el("circle", { cx: m.x, cy: m.y, r: 0, fill: "none", stroke: "#80deea", "stroke-width": 5, opacity: 0 }, view), hit: false, back: false }));
          let ticks = 0;
          if (level === "hard") counter.textContent = "0";
          const t0 = performance.now();
          await new Promise((resolve) => {
            const f = (now) => {
              if (!alive()) return resolve();
              const ms = Math.min(T, now - t0);
              const r = ms * speed;
              ring.setAttribute("r", r);
              ring.setAttribute("opacity", Math.max(0, 1 - r / (maxD + 120)));
              if (level === "hard") {
                const k = Math.floor(ms / 600);
                if (k > ticks && k <= 2 * moths[0].d) {
                  ticks = k;
                  counter.textContent = String(k);
                  if (k < 2 * moths[0].d) MUSIC.play("woodblock", 72, { gain: 0.25 });
                }
              }
              for (const e of echoes) {
                if (!e.hit && r >= e.m.dist) {
                  e.hit = true;
                  e.m.g.setAttribute("opacity", 1);
                  e.ring.setAttribute("opacity", 1);
                }
                if (e.hit) {
                  const er = r - e.m.dist;
                  e.ring.setAttribute("r", Math.max(0, er));
                  if (!e.back && er >= e.m.dist) {
                    e.back = true;
                    e.ring.setAttribute("opacity", 0);
                    click(0.22);
                    if (level === "medium") e.m.g.setAttribute("opacity", 0.35);
                  }
                }
              }
              if (ms < T) requestAnimationFrame(f);
              else resolve();
            };
            requestAnimationFrame(f);
          });
          ring.remove();
          echoes.forEach((e) => e.ring.remove());
          busy = false;
          if (!alive()) return;
          if (!pinged) {
            pinged = true;
            if (level === "easy") say("The echo found it! Tap the moth.");
            else if (level === "medium") say("Two echoes came back. Which moth is closer? Tap it.");
            else {
              const d = moths[0].d;
              say(`The echo came back after ${2 * d} ticks. How many ticks away is the moth?`);
              g.choose(shuffle([d, 2 * d, d + 1]).map((x) => ({ label: `${x} ticks`, ok: x === d })), {
                hint: "The sound went to the moth and then came all the way back. What part of the trip was the way there?",
                reveal: `There and back took ${2 * d} ticks. Half of ${2 * d} is ${d}, so the moth is ${d} ticks away.`,
                why: `There and back took ${2 * d} ticks, and half of ${2 * d} is ${d}.`,
                show: marks,
              });
            }
          } else if (level === "medium") say("Listen again: which echo came back first? Tap the closer moth.");
        };
        const marks = () => {
          for (let k = 1; k <= moths[0].d; k++) {
            el("line", { x1: BAT[0] + k * 120, x2: BAT[0] + k * 120, y1: BAT[1] + 70, y2: BAT[1] + 100, stroke: "#fff3c4", "stroke-width": 4 }, view);
            text(view, BAT[0] + k * 120, BAT[1] + 136, k, { "font-size": 28, fill: "#fff3c4" });
          }
        };
        if (level === "hard") {
          const win0 = g.win;
          g.win = (msg) => {
            marks();
            g.win = win0;
            return win0(msg);
          };
        }
        if (level === "medium")
          g.set({ hint: "Which echo came back first? Press Click and listen again.", reveal: "The closer moth's echo came back first, because the sound had less far to go.", why: "Its echo came back first, because the sound had less far to go.", show: () => closer.g.setAttribute("opacity", 1) });
        view.addEventListener("pointerdown", async (event) => {
          const mg = event.target.closest("[data-moth]");
          if (!mg || !pinged || !g.ok() || level === "hard") return;
          const m = moths.find((x) => x.g === mg);
          if (level === "easy") {
            g.busy = true;
            await tween(900, (t) => place(b.g, BAT[0] + (m.x - BAT[0]) * t, BAT[1] + (m.y - BAT[1]) * t, 0.6), alive);
            m.g.remove();
            g.busy = false;
            g.set({});
            g.win("The echo told the bat where the moth was. Many bats eat insects like moths and mosquitoes.");
          } else {
            mg.setAttribute("opacity", 1);
            g.answer(m === closer, null);
          }
        });
        g.ans.innerHTML = `<div class="ap-buttons"><button type="button" class="primary" data-ping>🦇 Click!</button></div>`;
        g.ans.onclick = (event) => event.target.closest("[data-ping]") && ping();
        say(level === "hard" ? "Press Click. Count the ticks until the echo comes back." : level === "medium" ? "Two moths are hiding in the dark. Press Click and listen for the echoes." : "A moth is hiding in the dark. Press Click to send out a sound!");
      },
    });
  },

  // ---------- 6. Build an insect ----------
  f6() {
    const P = { abdomen: [250, 290], thorax: [410, 290], head: [520, 290] };
    const drawPart = (p, k, x, y, s = 1) => {
      const g = grp(p, x, y, s);
      if (k === "head") {
        el("circle", { r: 42, fill: "#3e2a1a", stroke: INK, "stroke-width": 4 }, g);
        for (const sy of [-1, 1]) el("ellipse", { cx: 12, cy: sy * 20, rx: 16, ry: 12, fill: "#1a1a1a", stroke: "#795548", "stroke-width": 2 }, g);
      } else if (k === "thorax") {
        el("circle", { r: 52, fill: "#6d4c41", stroke: INK, "stroke-width": 4 }, g);
        for (let i = 0; i < 12; i++) el("circle", { cx: Math.cos(i * 0.52) * 34, cy: Math.sin(i * 0.52) * 34, r: 4, fill: "#a1887f" }, g);
      } else {
        const id = `flIn${++uid}`;
        const c = el("clipPath", { id }, g);
        el("ellipse", { rx: 110, ry: 66 }, c);
        el("ellipse", { rx: 110, ry: 66, fill: "#f9c22e", stroke: INK, "stroke-width": 4 }, g);
        const b = el("g", { "clip-path": `url(#${id})` }, g);
        for (const x of [-60, -10, 40]) el("rect", { x, y: -80, width: 24, height: 160, fill: "#3e2a1a" }, b);
        el("ellipse", { rx: 110, ry: 66, fill: "none", stroke: INK, "stroke-width": 4 }, g);
      }
      return g;
    };
    const LEGS = [];
    for (const sy of [-1, 1]) for (const [x0, dx1, dx2] of [[440, 40, 70], [410, 0, -6], [380, -50, -100]]) LEGS.push(`M${x0} ${290 + sy * 40} L${x0 + dx1} ${290 + sy * 110} L${x0 + dx2} ${290 + sy * 160}`);
    const ANT = [-1, 1].map((sy) => `M548 ${290 + sy * 26} L590 ${290 + sy * 80} L640 ${290 + sy * 96}`);
    const WINGS = [];
    for (const sy of [-1, 1]) WINGS.push([330, 290 + sy * 96, 110, 36, sy * -18], [310, 290 + sy * 70, 80, 26, sy * -8]);
    const CRITTERS = [
      { n: "bee", ins: true, d: (p) => bee(p, 560, 270, 2), why: "A bee has 6 legs, 3 body parts and 2 antennae. It is an insect!" },
      { n: "ladybird", ins: true, d: (p) => ladybird(p, 500, 270, 2.4), why: "A ladybird has 6 legs and 3 body parts. Its hard red wing cases hide its wings. It is an insect!" },
      { n: "butterfly", ins: true, d: (p) => butterfly(p, 500, 290, 1.9), why: "A butterfly has 6 legs, 3 body parts and 2 antennae. It is an insect!" },
      { n: "dragonfly", ins: true, d: (p) => dragonfly(p, 600, 280, 1.8), why: "A dragonfly has 6 legs and 3 body parts. It is an insect!" },
      { n: "ant", ins: true, e: "🐜", why: "An ant has 6 legs and 3 body parts. It is an insect, even without wings!" },
      { n: "spider", ins: false, d: (p) => spider(p, 520, 280, 2.3), why: "A spider has 8 legs and only 2 body parts. It is not an insect. It is an arachnid." },
      { n: "snail", ins: false, e: "🐌", why: "A snail has no legs at all. It is not an insect." },
      { n: "worm", ins: false, e: "🪱", why: "A worm has no legs. It is not an insect." },
      { n: "scorpion", ins: false, e: "🦂", why: "A scorpion has 8 legs, like a spider. It is not an insect." },
      { n: "robin", ins: false, d: (p) => bird(p, 480, 270, 2), why: "A robin has 2 legs and feathers. It is a bird, not an insect." },
    ];
    let plan = [];
    let bag = [];
    frame("f6", {
      noun: "Round",
      countKey: "insects built",
      ask(g) {
        if (g.round === 0 || !plan.length) {
          plan = g.level === "hard" ? ["build", "isit", "math", "build", "isit", "math", "isit", "math"] : ["build", "isit", "isit", "build", "isit", "isit", "build", "isit"];
          bag = shuffle(g.level === "easy" ? CRITTERS.filter((c) => c.n !== "scorpion") : CRITTERS);
        }
        const kind = plan[g.round];
        const alive = g.cur();
        fresh();
        el("rect", { x: -1000, y: -600, width: 3000, height: 1760, fill: "#f3f8ec" }, view);
        if (kind === "build") {
          const base = el("g", {}, view);
          const legLayer = el("g", {}, view);
          const body = el("g", {}, view);
          const top = el("g", {}, view);
          const slots = {};
          for (const k of ["abdomen", "thorax", "head"]) {
            const [x, y] = P[k];
            slots[k] = el("g", { class: "fl-tap", "data-slot": k }, base);
            if (k === "abdomen") el("ellipse", { cx: x, cy: y, rx: 110, ry: 66, fill: "#fff", stroke: "#bfae95", "stroke-width": 4, "stroke-dasharray": "12 10" }, slots[k]);
            else el("circle", { cx: x, cy: y, r: k === "head" ? 42 : 52, fill: "#fff", stroke: "#bfae95", "stroke-width": 4, "stroke-dasharray": "12 10" }, slots[k]);
          }
          const placed = {};
          const put = (k) => {
            placed[k] = drawPart(body, k, ...P[k]);
            placed[k].classList.add("fl-tap");
            placed[k].dataset.slot = k;
            note(Object.keys(placed).length + 1);
          };
          const tray = el("g", {}, view);
          el("rect", { x: 720, y: 30, width: 260, height: 500, rx: 26, fill: "#fffaf0", stroke: "#d9cdb5", "stroke-width": 4 }, tray);
          const items = el("g", {}, tray);
          const show = (list) => {
            items.innerHTML = "";
            list.forEach(([key, word, draw], i) => {
              const y = list.length === 1 ? 280 : 120 + i * 155;
              const it = el("g", { class: "fl-tap", "data-item": key }, items);
              el("rect", { x: 735, y: y - 70, width: 230, height: 140, rx: 20, fill: "transparent" }, it);
              draw(it, 850, y - 12);
              if (word) text(it, 850, y + 62, word, { "font-size": 24, fill: INK });
            });
          };
          const steps = [];
          const level = g.level;
          if (level === "easy") ["abdomen", "thorax", "head"].forEach(put);
          else {
            const order = level === "medium" ? ["head", "thorax", "abdomen"] : shuffle(["head", "thorax", "abdomen"]);
            const say1 = { head: "the head, at the front", thorax: "the thorax, in the middle", abdomen: "the abdomen, at the back" };
            for (const k of order) steps.push({ kind: "part", k, prompt: `Which part is ${say1[k]}? Tap it.` });
          }
          if (level === "hard") steps.push({ kind: "where", k: "thorax", prompt: "Where do an insect's legs go? Tap that body part.", hint: "Legs hold up the middle of the body. Which part is in the middle?", reveal: "Legs grow from the thorax, the middle part." });
          steps.push({ kind: "add", what: "leg", n: 6, prompt: "Tap the leg to add legs. An insect needs 6!" });
          if (level === "hard") {
            steps.push({ kind: "where", k: "thorax", prompt: "Where do the wings go? Tap that body part.", hint: "Wings and legs grow from the same part. Which one?", reveal: "Wings grow from the thorax too." });
            steps.push({ kind: "add", what: "wing", n: 4, prompt: "A bee has 4 wings. Tap the wing to add them." });
            steps.push({ kind: "where", k: "head", prompt: "Where do the antennae go? Tap that body part.", hint: "Antennae feel and smell the way ahead. Which part leads the way?", reveal: "Antennae grow from the head." });
          }
          steps.push({ kind: "add", what: "antenna", n: 2, prompt: "Now tap the antenna to add 2 antennae." });
          let si = 0;
          let added = 0;
          const run = () => {
            if (!alive()) return;
            const st = steps[si];
            if (!st) {
              buzz();
              return g.win("Head, thorax, abdomen, 6 legs and 2 antennae. You built an insect!");
            }
            added = 0;
            Object.values(slots).forEach((s) => s.firstChild.setAttribute("stroke", "#bfae95"));
            if (st.kind === "part") {
              slots[st.k].firstChild.setAttribute("stroke", "var(--accent)");
              slots[st.k].firstChild.classList.add("fl-pulse");
              const list = shuffle(["head", "thorax", "abdomen"].filter((k) => !placed[k])).map((k) => [k, level === "medium" ? k : "", (p, x, y) => drawPart(p, k, x, y, k === "abdomen" ? 0.55 : 0.85)]);
              show(list);
            } else if (st.kind === "where") show([]);
            else
              show([[st.what, st.what, (p, x, y) => {
                const gg = grp(p, x, y, 1);
                if (st.what === "leg") el("path", { d: "M-40 -30 L0 10 L30 -10", stroke: INK, "stroke-width": 10, fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round" }, gg);
                else if (st.what === "antenna") el("path", { d: "M-40 30 L0 -10 L40 -20", stroke: INK, "stroke-width": 8, fill: "none", "stroke-linecap": "round" }, gg);
                else el("ellipse", { rx: 60, ry: 22, fill: "#e3f2fd", stroke: "#90a4ae", "stroke-width": 3 }, gg);
              }]]);
            say(st.prompt);
          };
          const doAdd = () => {
            const st = steps[si];
            const i = added;
            if (st.what === "leg") el("path", { d: LEGS[i], stroke: INK, "stroke-width": 9, fill: "none", "stroke-linecap": "round", "stroke-linejoin": "round" }, legLayer);
            else if (st.what === "antenna") el("path", { d: ANT[i], stroke: INK, "stroke-width": 7, fill: "none", "stroke-linecap": "round" }, top);
            else {
              const [cx, cy, rx, ry, r] = WINGS[i];
              el("ellipse", { cx, cy, rx, ry, fill: "#e3f2fd", opacity: 0.8, stroke: "#90a4ae", "stroke-width": 3, transform: `rotate(${r} ${cx} ${cy})` }, top);
            }
            added += 1;
            note(added - 1);
            VOICE.speak(String(added));
            if (added >= st.n) {
              si += 1;
              setTimeout(run, 900);
            }
          };
          let drag = null;
          view.addEventListener("pointerdown", (event) => {
            if (!g.ok() || !steps[si]) return;
            const st = steps[si];
            const it = event.target.closest("[data-item]");
            const slot = event.target.closest("[data-slot]");
            if (it && st.kind !== "where") {
              const p = toSvg(view, event);
              drag = { key: it.dataset.item, x: p.x, y: p.y, moved: false, it };
              try {
                view.setPointerCapture(event.pointerId);
              } catch {}
            } else if (slot && st.kind === "where") {
              if (g.step(slot.dataset.slot === st.k, st)) {
                const k = st.k;
                placed[k]?.querySelector("circle,ellipse")?.setAttribute("stroke", "#22a05a");
                si += 1;
                const wasOk = slot.dataset.slot === k;
                if (wasOk) MUSIC.chime();
                setTimeout(run, wasOk ? 700 : 2600);
              }
            }
          });
          view.addEventListener("pointermove", (event) => {
            if (!drag) return;
            const p = toSvg(view, event);
            if (Math.hypot(p.x - drag.x, p.y - drag.y) > 10) drag.moved = true;
            drag.it.setAttribute("transform", `translate(${p.x - drag.x} ${p.y - drag.y})`);
          });
          const up = () => {
            if (!drag) return;
            const d = drag;
            drag = null;
            d.it.removeAttribute("transform");
            const st = steps[si];
            if (!st || !g.ok()) return;
            if (st.kind === "add") return added < st.n && doAdd();
            const ok = d.key === st.k;
            if (g.step(ok, { hint: "Look at the sizes. The head is small and round, the thorax is in the middle, and the abdomen is the big back part.", reveal: `This one is the ${st.k}.` })) {
              slots[st.k].firstChild.classList.remove("fl-pulse");
              put(st.k);
              si += 1;
              setTimeout(run, ok ? 600 : 2400);
            }
          };
          view.addEventListener("pointerup", up);
          view.addEventListener("pointercancel", up);
          run();
        } else if (kind === "isit") {
          const c = bag[g.round % bag.length];
          const holder = el("g", {}, view);
          if (c.e) emoji(holder, 500, 270, c.e, 260);
          else c.d(holder);
          if (c.n === "bee") buzz();
          const opts = [{ label: "✅ Insect", ok: c.ins }, { label: "🚫 Not an insect", ok: !c.ins }];
          const twoStep = g.level !== "easy" && !c.ins && (c.n === "spider" || c.n === "scorpion");
          g.choose(opts, {
            hint: "Count the legs. An insect has 6 legs and 3 body parts.",
            reveal: c.why,
            why: c.why,
            then: twoStep

          loop(alive, (s) => {
            const per = run + back;
            const n = Math.floor(s / per);
            const tt = s - n * per;
            let x;
            let y;
            if (tt < run) {

            last = [x, y];
          });
          const dirWord = want[0] === 0 ? "straight up, so the flowers are toward the sun" : want[0] === 180 ? "straight down, so the flowers are away from the sun" : want[0] > 0 ? "up and to the right, so the flowers are to the right of the sun" : "up and to the left, so the flowers are to the left of the sun";

            t.querySelector("circle").setAttribute("stroke-width", 8);
            if (!ok) t.dataset.wrong = 1;

            g.answer(ok, null);
          });
          say(g.level === "easy" ? "This bee is dancing to tell the others where flowers are! Up means toward the sun. Tap the flowers she means." : "Watch the waggle dance. Which flowers does she mean? Tap them.");
        }
      },
    });
  },
};

// Order the pictures: tap the cards in the right order. 1st miss: hint. 2nd miss: the card is placed for you, with the why.
function orderGame(g, items, { pre = 0, hint, why, done }) {
  const alive = g.cur();
  const n = items.length;
  const sw = 210;
  const gap = 26;
  const x0 = (W - (n * sw + (n - 1) * gap)) / 2;
  const slotX = (i) => x0 + i * (sw + gap);
  for (let i = 0; i < n; i++) {
    el("rect", { x: slotX(i), y: 24, width: sw, height: 220, rx: 22, fill: "#fff", stroke: "#cdbb9c", "stroke-width": 4, "stroke-dasharray": "12 10" }, view);
    text(view, slotX(i) + sw / 2, 145, i + 1, { "font-size": 54, fill: "#e6dccd" });
    if (i < n - 1) el("path", { d: `M${slotX(i) + sw + 4} 134 l${gap - 8} 0 m-10 -10 l10 10 l-10 10`, stroke: "var(--accent)", "stroke-width": 5, fill: "none", "stroke-linecap": "round" }, view);
  }
  const cards = items.map((it, i) => {
    const c = el("g", { class: "fl-tap", "data-card": i }, view);
    el("rect", { x: -sw / 2, y: -100, width: sw, height: 210, rx: 22, fill: "#fffaf0", stroke: "#a8632d", "stroke-width": 4 }, c);
    const pic = el("g", { transform: "translate(0 -18)" }, c);
    it.draw(pic);
    text(c, 0, 90, it.word, { "font-size": 26, fill: INK });
    return c;
  });
  let next = 0;
  const putAt = (ci, si) => place(cards[ci], slotX(si) + sw / 2, 134, 1);
  for (; next < pre; next++) {
    putAt(next, next);
    cards[next].dataset.done = 1;
  }
  // put the not-yet-placed cards in a shuffled bottom row (pre-placed ones are above)
  const rest = shuffle(cards.map((_, i) => i).filter((i) => i >= pre));
  rest.forEach((ci, k) => place(cards[ci], x0 + sw / 2 + k * (sw + gap) + ((n - rest.length) * (sw + gap)) / 2, 412, 1));
  const move = async (ci) => {
    cards[ci].dataset.done = 1;
    const m = /translate\(([-\d.]+) ([-\d.]+)\)/.exec(cards[ci].getAttribute("transform"));
    const [fx, fy] = [Number(m[1]), Number(m[2])];
    const si = next;
    next += 1;
    note(si * 2);
    await tween(600, (t) => place(cards[ci], fx + (slotX(si) + sw / 2 - fx) * t, fy + (134 - fy) * t, 1), alive);
  };
  view.addEventListener("pointerdown", async (event) => {
    const c = event.target.closest("[data-card]");
    if (!c || c.dataset.done || !g.ok() || next >= n) return;
    const ci = Number(c.dataset.card);
    const ok = ci === next;
    const reason = why[items[next].word] || "";
    if (!g.step(ok, { hint: hint(next), reveal: `Next comes the ${items[next].word}. ${reason}` })) {
      c.querySelector("rect").setAttribute("stroke", "#e57373");
      setTimeout(() => c.querySelector("rect")?.setAttribute("stroke", "#a8632d"), 700);
      return;
    }
    g.busy = true;
    if (ok) say(`${items[next].word[0].toUpperCase()}${items[next].word.slice(1)}! ${reason}`);
    await move(next);
    if (!alive()) return;
    if (!ok) await wait(1800);
    if (!alive()) return;
    g.busy = false;
    if (next >= n) done();
  });
}
