// ---------- colours & small helpers ----------
const INK = "#2b1d12";

const smooth = (t) => (t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
const lin = (t) => t;
const tw = (ms, fn, live, ease = smooth) =>
  new Promise((resolve) => {
    if (KIT.still.matches) {
      fn(1);
      return resolve(live());
    }
    const t0 = performance.now();
    const frame = (now) => {
      if (!live()) return resolve(false);
      const t = Math.min(1, (now - t0) / ms);
      fn(ease(t));
      if (t < 1) requestAnimationFrame(frame);
      else resolve(true);
    };
    requestAnimationFrame(frame);
  });
const T = (parent, x, y, str, size = 26, fill = INK, extra = {}) => text(parent, x, y, str, { "font-size": size, fill, ...extra });
const move = (node, x, y, extra = "") => node.setAttribute("transform", `translate(${x} ${y})${extra}`);
const fmt = (n) => Number(n).toLocaleString("en-US");
const rad = (d) => (d * Math.PI) / 180;
const lerp = (a, b, t) => a + (b - a) * t;
const round1 = (n) => Math.round(n * 10) / 10;

// Text wrapped to a width (characters), centred on x.
function wrapT(parent, x, y, str, max = 40, size = 24, fill = INK, gap = 1.25, extra = {}) {
  const lines = [];
  for (const word of String(str).split(" ")) {
    const last = lines[lines.length - 1];
    if (last && (last + " " + word).length <= max) lines[lines.length - 1] = last + " " + word;
    else lines.push(word);
  }
  return lines.map((line, i) => T(parent, x, y + i * size * gap, line, size, fill, extra));
}
// A pill label with a white backing so it reads over any picture.
function tag(parent, x, y, str, { size = 24, fill = INK, bg = "#fff", stroke = "#e2d6c4", anchor = "middle" } = {}) {
  const g = el("g", {}, parent);
  const w = str.length * size * 0.56 + 22;
  const x0 = anchor === "start" ? x - 10 : anchor === "end" ? x - w + 10 : x - w / 2;
  el("rect", { x: x0, y: y - size * 0.95, width: w, height: size * 1.35, rx: size * 0.6, fill: bg, stroke, "stroke-width": 2 }, g);
  T(g, x, y, str, size, fill, { "text-anchor": anchor });
  return g;
}
function arrow(parent, x1, y1, x2, y2, { color = INK, width = 5, head = 14, dash } = {}) {
  const g = el("g", {}, parent);
  const a = Math.atan2(y2 - y1, x2 - x1);
  el("line", { x1, y1, x2: x2 - Math.cos(a) * head * 0.8, y2: y2 - Math.sin(a) * head * 0.8, stroke: color, "stroke-width": width, "stroke-linecap": "round", "stroke-dasharray": dash }, g);
  const p = (ang, r) => `${x2 - Math.cos(a + ang) * r} ${y2 - Math.sin(a + ang) * r}`;
  el("path", { d: `M${x2} ${y2}L${p(0.45, head * 1.5)}L${p(-0.45, head * 1.5)}Z`, fill: color }, g);
  return g;
}
function curveArrow(parent, x1, y1, cx, cy, x2, y2, { color = INK, width = 5, head = 14 } = {}) {
  const g = el("g", {}, parent);
  el("path", { d: `M${x1} ${y1}Q${cx} ${cy} ${x2} ${y2}`, fill: "none", stroke: color, "stroke-width": width, "stroke-linecap": "round" }, g);
  const a = Math.atan2(y2 - cy, x2 - cx);
  const p = (ang, r) => `${x2 - Math.cos(a + ang) * r} ${y2 - Math.sin(a + ang) * r}`;
  el("path", { d: `M${x2 + Math.cos(a) * 4} ${y2 + Math.sin(a) * 4}L${p(0.45, head * 1.5)}L${p(-0.45, head * 1.5)}Z`, fill: color }, g);
  return g;
}

// Speech: the bubble shows rich text; the voice reads a plain version with units spelled out.
const plain = (html) =>
  String(html)
    .replace(/<[^>]+>/g, " ")
    .replace(/[\p{Extended_Pictographic}️‍]/gu, "")
    .replace(/(\d),(?=\d{3})/g, "$1")
    .replace(/−\s?(\d)/g, "minus $1")
    .replace(/°C/g, " degrees Celsius")
    .replace(/\bcm\/yr\b/g, "centimeters per year")
    .replace(/\bmm\/yr\b/g, "millimeters per year")
    .replace(/\bkm\/s\b/g, "kilometers per second")
    .replace(/\bg\/cm³/g, "grams per cubic centimeter")
    .replace(/\bcm³/g, "cubic centimeters")
    .replace(/\bcm²/g, "square centimeters")
    .replace(/\bm²/g, "square meters")
    .replace(/(\d)\s?km\b/g, "$1 kilometers")
    .replace(/(\d)\s?cm\b/g, "$1 centimeters")
    .replace(/(\d)\s?mm\b/g, "$1 millimeters")
    .replace(/(\d)\s?m\b/g, "$1 meters")
    .replace(/(\d)\s?L\b/g, "$1 liters")
    .replace(/(\d)\s?hPa\b/g, "$1 hectopascals")
    .replace(/\bppm\b/g, "parts per million")
    .replace(/≈/g, " about ")
    .replace(/→/g, " to ")
    .replace(/–/g, " to ")
    .replace(/\s+/g, " ")
    .trim();
const tell = (html) => {
  say(html, { voice: false });
  VOICE.speak(plain(html));
};
const tellAsync = (html) => {
  say(html, { voice: false });
  return VOICE.speakAsync(plain(html));
};

  defs.innerHTML = `<radialGradient id="eaShade" cx="0.35" cy="0.3" r="0.85"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></radialGradient><linearGradient id="eaSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe0f5"/><stop offset="1" stop-color="#eef7fc"/></linearGradient><linearGradient id="eaSea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5d9de0"/><stop offset="1" stop-color="#2f6db8"/></linearGradient><pattern id="eaSand" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#e8cf96"/><circle cx="3" cy="4" r="1.6" fill="#c9a86a"/><circle cx="10" cy="10" r="1.4" fill="#b8955a"/></pattern>`;
  return view;
}

// ---------- level chips, Try-it and Explain-it cards ----------
const LEVELS = [["easy", "🐣 Easy"], ["medium", "🦊 Medium"], ["hard", "🦁 Hard"]];
const levelRow = (cur, tryIt = true) =>

    document.querySelectorAll("[data-lv]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));

const eaStyle = document.createElement("style");
eaStyle.textContent = `

@media (max-height:460px),(max-width:420px) and (max-height:720px){.ea-pick .kt-choices button{min-height:44px;min-width:64px;font-size:15.5px;padding:0 11px}}

document.head.appendChild(eaStyle);

const TRY = {

    safe: "With a grown-up: they boil the egg and do the cutting. Let it cool first.",
    need: ["A hard-boiled egg", "A sharp knife (grown-up only)", "A ruler"],
    steps: ["Look at the shell: it is thin and cracked into pieces, like the crust and its plates.", "A grown-up cuts the egg in half, top to bottom.", "Find the 'crust' (shell), 'mantle' (white) and 'core' (yolk).", "Measure each part with the ruler and compare."],
    notice: "The model is useful but imperfect: Earth's core has two parts (liquid outer, solid inner), and the real crust is far thinner, relative to Earth, than an eggshell is to an egg. Every model teaches some things and hides others.",
  },
  e2: {

function closeTry() {
  const box = document.querySelector(".ea-try");
  if (!box) return;
  box.remove();
  VOICE.hush();
}
function tryCard(id) {
  const t = TRY[id];
  if (!t) return;
  closeTry();
  const box = document.createElement("div");
  box.className = "ea-try";
  box.setAttribute("role", "dialog");
  box.setAttribute("aria-label", "Try it for real");
  box.innerHTML = `<div class="ea-card"><h2>🏠 Try it for real: ${t.title}</h2><p class="ea-safe">🤝 ${t.safe}</p><div class="ea-cols"><div><h3>You need</h3><ul>${t.need.map((x) => `<li>${x}</li>`).join("")}</ul></div><div><h3>Do this</h3><ol>${t.steps.map((x) => `<li>${x}</li>`).join("")}</ol></div></div><p class="ea-notice">👀 <b>Notice:</b> ${t.notice}</p><button type="button" class="kt-go" data-close>✓ Got it</button></div>`;
  document.body.appendChild(box);
  box.addEventListener("click", (event) => {
    if (event.target === box || event.target.closest("[data-close]")) closeTry();
  });
  VOICE.speak(plain(`Try it for real: ${t.title}. ${t.safe} You need: ${t.need.join(", ")}. ${t.steps.join(" ")} Notice: ${t.notice}`));
}

const EXPLAIN = {
  e0: { q: "How do scientists know what is inside Earth, when no one has ever drilled through the crust?", pts: ["The deepest borehole reaches only about 12 km, a tiny fraction of the 6,371 km to the center.", "Earthquake (seismic) waves travel through the whole planet; their speed changes and they bend at boundaries between layers.", "S waves cannot pass through liquid, and they vanish beyond about 104° from an earthquake: so the outer core must be liquid."] },
  e1: { q: "Describe Earth's four main layers from the outside in, and give one piece of evidence for them.", pts: ["Crust: thin solid rock, about 30–50 km under continents and 5–10 km under oceans.", "Mantle: hot solid rock about 2,900 km thick that flows very slowly; outer core: liquid iron and nickel; inner core: solid iron and nickel, kept solid by enormous pressure.", "Evidence: seismic waves change speed and direction at each boundary, and the S-wave shadow zone shows the outer core is liquid."] },
  e2: { q: "Explain how one grain of sand could become part of three different kinds of rock.", pts: ["Sand is weathered and eroded from an existing rock, then deposited in layers.", "Buried and pressed (compaction) and glued by minerals (cementation), it becomes sedimentary rock such as sandstone.", "Heat and pressure can change sandstone into metamorphic quartzite; melting makes magma, which cools into igneous rock."] },
  e3: { q: "Why did scientists at first reject continental drift, and what evidence changed their minds?", pts: ["In 1912 Alfred Wegener showed that continents fit together and share fossils and rock types, but he could not explain what moved them.", "In the 1950s and 1960s, maps of the ocean floor revealed mid-ocean ridges and symmetric magnetic stripes: the sea floor is spreading.", "Scientists changed their minds because of new evidence, not because an argument sounded persuasive."] },

// ---------- the question engine ----------
// q: { ask, draw(q, api), opts?, pad?, ans | check(v), hint, why, show(live), mark(v, ok), ansText, max }
const NICE = ["Correct.", "Correct — and here is why:", "Precisely.", "Correct. Good reasoning."];
function game(id, cfg) {
  const my = token;
  const alive = () => my === token;
  const R = cfg.rounds || 8;
  let level = shell.progress()[id]?.level || "easy";
  let round = 0;
  let q = null;
  let tries = 0;
  let busy = false;
  let gen = 0;
  const bags = {};
  const ctx = {
    next(key, list) {
      if (!bags[key]?.length) bags[key] = shuffle(list);
      return bags[key].pop();
    },
  };
  panel(`${levelRow(level, !!TRY[id])}<div class="ea-pick" data-choices></div>`);
  const host = $("[data-choices]");
  $("[data-try]")?.addEventListener("click", () => {
    window.OC?.touch();
    tryCard(id);
  });
  const status = (s) => {
    const b = $("[data-status]");
    if (b) b.textContent = s || `Question ${Math.min(round + 1, R)} of ${R}`;
  };
  const isRight = (v) => (q.check ? q.check(v) : v === q.ans);
  const ask = () => {
    if (!alive()) return;
    q = ctx.next(`gen-${level}`, cfg.bank[level])(ctx, level);
    tries = 0;
    busy = false;
    const g = ++gen;
    q.live = () => alive() && g === gen;
    fresh();
    q.draw?.(q, { pick: (v) => answer(v) });
    status();
    if (q.pad) {
      host.onclick = null;
      host.innerHTML = `<div class="ea-padwrap"></div>`;
      q.padApi = numpad(host.firstChild, { max: q.max || 4, onEnter: (n) => answer(n) });
    } else if (q.opts) choices(host, q.opts, (c, b) => answer(c.v, b));
    else {
      host.innerHTML = `<div class="ap-buttons"><button type="button" data-again>🔁 Say it again</button></div>`;
      host.onclick = (event) => {
        if (event.target.closest("[data-again]")) tell(q.ask);
      };
    }
    tell(q.ask);
    window.__eaq = q;
    window.__eaPick = (val) => answer(val, host.querySelector(`[data-c="${q.opts ? q.opts.findIndex((o) => o.v === val) : -1}"]`) || undefined);
  };
  const answer = async (v, button) => {
    if (!alive() || busy || !q) return;
    window.OC?.touch();
    const live = q.live;
    if (isRight(v)) {
      busy = true;
      button?.classList.add("right");
      host.querySelectorAll("[data-c]").forEach((b) => (b.disabled = b !== button));
      q.mark?.(v, true);
      MUSIC.chime();
      tell(`${tries ? "Correct — you revised your thinking." : pick(NICE)} ${q.why}`);
      if (q.show) await q.show(live);
      if (!live()) return;
      return done();
    }
    tries += 1;
    MUSIC.oops();
    if (button) {
      button.classList.add("wrong");
      button.disabled = true;
    }
    q.mark?.(v, false);
    q.padApi?.clear();
    if (tries < 2) {
      tell(`Not quite. Consider: ${typeof q.hint === "function" ? q.hint(v) : q.hint || "what do you notice? Look again."}`);
      return;
    }
    busy = true;
    await tellAsync("Mistakes are how we learn. Let's look why.");
    if (!live()) return;
    let label = q.ansText;
    if (q.opts) {
      const i = q.opts.findIndex((o) => isRight(o.v));
      const b = host.querySelector(`[data-c="${i}"]`);
      b?.classList.add("right");
      label = label ?? q.opts[i]?.label;
      host.querySelectorAll("[data-c]").forEach((x) => (x.disabled = x !== b));
    }
    if (q.pad && q.padApi) q.padApi.set(q.ansText ?? q.ans);
    q.mark?.(q.ans, true);
    tell(`The answer is <b>${label ?? fmt(q.ans)}</b>. ${q.why}`);
    if (q.show) await q.show(live);
    if (!live()) return;
    done();
  };
  const done = () => {
    round += 1;
    window.OC?.count(cfg.count || "earth science questions");
    const last = round >= R;
    status(`Question ${round} of ${R}`);
    host.innerHTML = `<div class="ap-buttons"><button type="button" class="primary" data-next>${last ? "Finish ▶" : "Next ▶"}</button></div>`;
    host.onclick = (event) => {
      if (!event.target.closest("[data-next]")) return;
      VOICE.hush();
      if (last) finish();
      else ask();
    };
  };
  const finish = () => {
    if (!alive()) return;
    gen += 1;
    confetti();
    MUSIC.chime();
    shell.mark(id, { done: true });
    window.OC?.count("earth science games finished");
    status(`All ${R} done`);
    tell(`All ${R} complete. You reasoned carefully and persisted. Now the most important step: explain the idea in your own words.`);
    endButtons(host, id, () => {
      round = 0;
      ask();
    });
  };
  onLevels(id, (lv) => {
    level = lv;
    round = 0;
    ask();
  });
  ask();
}
// option helpers
const opts = (list, fn = (x) => String(x)) => shuffle(list).map((x) => ({ label: fn(x), v: x }));
const fixed = (list, fn = (x) => String(x)) => list.map((x) => ({ label: fn(x), v: x }));

const mc = (ask, ans, wrongs, hint, why, draw) => ({ ask, opts: opts([ans, ...wrongs]), ans, hint, why, draw });

// ---------- seismic waves through Earth ----------
function seismic(parent, { cx = 330, cy = 300, R = 235, s = true, p = true, labels = true, lehmann = false, quiz = false } = {}) {
  const g = el("g", {}, parent);
  el("circle", { cx, cy, r: R, fill: "#f3d2a8", stroke: "#5a3d22", "stroke-width": 3 }, g);
  el("circle", { cx, cy, r: R * 0.546, fill: LAYER.outer, stroke: "#5a3d22", "stroke-width": 2 }, g);
  el("circle", { cx, cy, r: R * 0.19, fill: LAYER.inner, stroke: "#5a3d22", "stroke-width": 2 }, g);
  const pt = (deg, r = R) => [cx + r * Math.sin(rad(deg)), cy - r * Math.cos(rad(deg))];
  const ray = (deg, color, w = 4) => {
    const [x2, y2] = pt(deg);
    const [x1, y1] = pt(0);
    const half = rad(Math.abs(deg) / 2);
    const chordMid = R * Math.cos(half);
    const deep = chordMid * 0.886;
    const ctrl = 2 * deep - chordMid;
    const [qx, qy] = pt(deg / 2, ctrl);
    return el("path", { d: `M${x1} ${y1}Q${qx} ${qy} ${x2} ${y2}`, fill: "none", stroke: color, "stroke-width": w, "stroke-linecap": "round", opacity: 0.9 }, g);
  };
  const rays = [];
  for (const d of [22, 44, 66, 88, 103]) for (const sg of [-1, 1]) {
    if (p) rays.push(ray(sg * d, "#1e66c8", 4));
    if (s) rays.push(ray(sg * (d - 3), "#c8352a", 4));
  }
  if (p) {
    // P waves that cross the core are bent (refracted) and land beyond 140°
    for (const sg of [-1, 1]) for (const d of [150, 168]) {
      const [x2, y2] = pt(sg * d);
      const [x1, y1] = pt(0);
      rays.push(el("path", { d: `M${x1} ${y1}L${cx + sg * R * 0.2} ${cy - R * 0.5}L${cx + sg * R * (d === 150 ? 0.16 : 0.05)} ${cy + R * 0.5}L${x2} ${y2}`, fill: "none", stroke: "#1e66c8", "stroke-width": 4, "stroke-linejoin": "round", opacity: 0.9 }, g));
    }
  }
  if (lehmann) {
    const [x1, y1] = pt(0);
    const [x2, y2] = pt(118);
    rays.push(el("path", { d: `M${x1} ${y1}L${cx + R * 0.08} ${cy - R * 0.19}L${x2} ${y2}`, fill: "none", stroke: "#7a3fc4", "stroke-width": 5, "stroke-dasharray": "10 7" }, g));
  }
  // shadow zones on the surface
  const arcD = (a0, a1, r) => {
    const [x0, y0] = pt(a0, r);
    const [x1, y1] = pt(a1, r);
    return `M${x0} ${y0}A${r} ${r} 0 0 ${a1 > a0 ? 1 : 0} ${x1} ${y1}`;
  };
  if (s) {
    el("path", { d: arcD(104, 180, R + 14), fill: "none", stroke: "#c8352a", "stroke-width": 9, "stroke-dasharray": "14 8" }, g);
    el("path", { d: arcD(-104, -180, R + 14), fill: "none", stroke: "#c8352a", "stroke-width": 9, "stroke-dasharray": "14 8" }, g);
  }
  if (p) {
    el("path", { d: arcD(104, 140, R + 28), fill: "none", stroke: "#1e66c8", "stroke-width": 9 }, g);
    el("path", { d: arcD(-104, -140, R + 28), fill: "none", stroke: "#1e66c8", "stroke-width": 9 }, g);
  }
  const [qx, qy] = pt(0);
  emoji(g, qx, qy - 16, "💥", 46);
  if (labels) {
    const x = cx + R + 70;
    T(g, x, 70, "Earthquake", 26, INK, { "text-anchor": "start" });
    if (p) {
      el("rect", { x, y: 120, width: 36, height: 8, rx: 4, fill: "#1e66c8" }, g);
      T(g, x + 48, 132, quiz ? "P waves" : "P waves: solids and liquids", 23, INK, { "text-anchor": "start" });
    }
    if (s) {
      el("rect", { x, y: 170, width: 36, height: 8, rx: 4, fill: "#c8352a" }, g);
      T(g, x + 48, 182, quiz ? "S waves" : "S waves: solids only", 23, INK, { "text-anchor": "start" });
      el("path", { d: `M${x} 230h36`, stroke: "#c8352a", "stroke-width": 9, "stroke-dasharray": "12 6" }, g);
      T(g, x + 48, 240, "no S waves arrive here", 23, INK, { "text-anchor": "start" });
    }
    if (p) {
      el("path", { d: `M${x} 286h36`, stroke: "#1e66c8", "stroke-width": 9 }, g);
      T(g, x + 48, 296, "P-wave shadow (104°–140°)", 23, INK, { "text-anchor": "start" });

}

// ---------- the rock cycle ----------
const RC_NODES = {
  magma: { n: "Magma", x: 500, y: 74, c: "#e8552f" },
  igneous: { n: "Igneous rock", x: 820, y: 205, c: "#8a8f99" },
  sediment: { n: "Sediment", x: 700, y: 470, c: "#e0bf7a" },
  sedimentary: { n: "Sedimentary rock", x: 300, y: 470, c: "#d0a46a" },
  metamorphic: { n: "Metamorphic rock", x: 180, y: 205, c: "#9b8fb8" },
};
const RC_STEPS = [
  { k: "cool", a: "magma", b: "igneous", n: "cooling & crystallizing", lx: 760, ly: 104 },
  { k: "weather", a: "igneous", b: "sediment", n: "weathering & erosion", lx: 880, ly: 350 },
  { k: "compact", a: "sediment", b: "sedimentary", n: "compaction & cementation", lx: 500, ly: 538 },
  { k: "heat", a: "sedimentary", b: "metamorphic", n: "heat & pressure", lx: 140, ly: 350 },
  { k: "melt", a: "metamorphic", b: "magma", n: "melting", lx: 270, ly: 104 },
  { k: "heat2", a: "igneous", b: "metamorphic", n: "heat & pressure", lx: 500, ly: 194 },
  { k: "weather2", a: "metamorphic", b: "sediment", n: "weathering", lx: 470, ly: 318 },
];
const RC_STEP = Object.fromEntries(RC_STEPS.map((s) => [s.k, s]));
function rockCycle(parent, { hide = [], hl = null, tap = null, hideNodes = [] } = {}) {
  const g = el("g", {}, parent);
  const steps = {};
  for (const s of RC_STEPS) {
    const A = RC_NODES[s.a];
    const B = RC_NODES[s.b];
    const shrink = (P, Q, d) => {
      const L = Math.hypot(Q.x - P.x, Q.y - P.y);
      return [P.x + ((Q.x - P.x) / L) * d, P.y + ((Q.y - P.y) / L) * d];
    };
    // stop each arrow just outside the node boxes (half-size 114 × 36) so every arrowhead shows
    const edge = (P, Q) => {
      const L = Math.hypot(Q.x - P.x, Q.y - P.y);
      const ux = Math.abs((Q.x - P.x) / L);
      const uy = Math.abs((Q.y - P.y) / L);
      return Math.min(ux ? 114 / ux : Infinity, uy ? 36 / uy : Infinity) + 10;
    };
    const [x1, y1] = shrink(A, B, edge(A, B));
    const [x2, y2] = shrink(B, A, edge(A, B));
    const on = s.k === hl;
    const ar = arrow(g, x1, y1, x2, y2, { color: on ? "#1e7bd6" : s.k.endsWith("2") ? "#b8a58a" : "#6b5a48", width: on ? 8 : 5 });
    const isHidden = hide.includes(s.k);
    const lab = tag(g, s.lx, s.ly, isHidden ? "?" : s.n, { size: 22, bg: on ? "#e3f0fc" : "#fff", stroke: on ? "#1e7bd6" : "#e2d6c4" });
    steps[s.k] = { ar, lab };
  }
  const nodes = {};
  for (const [k, nd] of Object.entries(RC_NODES)) {
    const ng = el("g", { class: tap ? "ea-tap" : null }, g);
    const w = 228;
    el("rect", { x: nd.x - w / 2, y: nd.y - 34, width: w, height: 62, rx: 22, fill: nd.c, stroke: k === hl ? "#1e7bd6" : "#4a3826", "stroke-width": k === hl ? 7 : 3 }, ng);
    T(ng, nd.x, nd.y + 8, hideNodes.includes(k) ? "?" : nd.n, 25, k === "magma" ? "#fff" : INK);
    if (tap) ng.addEventListener("click", () => tap(k));
    nodes[k] = ng;
  }
  return { g, steps, nodes };
}

// ---------- the atmosphere ----------
const ATMOS = [
  { k: "tropo", n: "Troposphere", lo: 0, hi: 12, c: "#bfe0f5", note: "weather, clouds, aeroplanes" },
  { k: "strato", n: "Stratosphere", lo: 12, hi: 50, c: "#a9cdec", note: "ozone layer absorbs UV" },
  { k: "meso", n: "Mesosphere", lo: 50, hi: 85, c: "#7fa9d6", note: "meteors burn up" },
  { k: "thermo", n: "Thermosphere", lo: 85, hi: 110, c: "#3f5f9a", note: "auroras; space station (~400 km)" },
];
function atmosphere(parent, { names = true, tap = null, hl = null, temps = false } = {}) {
  const g = el("g", {}, parent);
  const y = (km) => 530 - (km / 110) * 490;
  const x0 = 140;
  const w = temps ? 380 : 470;
  const bands = {};
  for (const L of ATMOS) {
    const r = el("rect", { x: x0, y: y(L.hi), width: w, height: y(L.lo) - y(L.hi), fill: L.c, stroke: L.k === hl ? "#c8352a" : "#2b3a55", "stroke-width": L.k === hl ? 6 : 1.5, class: tap ? "ea-tap" : null }, g);
    if (tap) r.addEventListener("click", () => tap(L.k));
    bands[L.k] = r;
    const mid = (y(L.lo) + y(L.hi)) / 2;
    const dark = L.k === "thermo" || L.k === "meso";
    const nameT = T(g, x0 + w / 2, mid + (L.k === "tropo" ? 9 : -4), names ? L.n : "?", 26, dark ? "#fff" : INK, { "pointer-events": "none" });
    if (L.k !== "tropo" && names) T(g, x0 + w / 2, mid + 26, L.note, 22, dark ? "#e8f0ff" : "#2b3a55", { "pointer-events": "none" });
    L.t = nameT;
  }
  for (const km of [0, 12, 50, 85, 110]) {
    el("line", { x1: x0 - 12, y1: y(km), x2: x0, y2: y(km), stroke: INK, "stroke-width": 3 }, g);
    T(g, x0 - 18, y(km) + 8, km === 110 ? "110+ km" : `${km} km`, 22, INK, { "text-anchor": "end" });
  }
  emoji(g, x0 + 40, y(6), "☁️", 34, { "pointer-events": "none" });
  emoji(g, x0 + w - 40, y(8), "✈️", 28, { "pointer-events": "none" });
  if (temps) {
    // average temperature profile (US Standard Atmosphere, rounded)
    const px0 = 620;
    const px = (c) => px0 + ((c + 100) / 130) * 330;
    el("rect", { x: 600, y: 40, width: 370, height: 490, fill: "#fff", stroke: "#e2d6c4", "stroke-width": 2, rx: 10 }, g);
    for (const c of [-80, -40, 0]) {
      el("line", { x1: px(c), y1: 40, x2: px(c), y2: 530, stroke: "#eee3d2", "stroke-width": 2 }, g);
      T(g, px(c), 552, `${c}°C`, 22, MUTED);
    }
    const pts = [[15, 0], [-56, 12], [-56, 20], [-2, 50], [-2, 52], [-90, 85], [-20, 110]];
    el("path", { d: `M${pts.map(([c, km]) => `${px(c)} ${y(km)}`).join("L")}`, fill: "none", stroke: "#c8352a", "stroke-width": 5, "stroke-linejoin": "round" }, g);
    T(g, 785, 72, "temperature", 22, "#c8352a");
  }
  return { g, bands, y };
}

// ---------- a weather map ----------
// cfg: { H:[x,y], L:[x,y], front: "cold"|"warm"|null, cities: [{n,x,y}], tight: "left"|"right" }
function weatherMap(parent, cfg, tap = null) {
  const g = el("g", {}, parent);
  el("rect", { x: 30, y: 30, width: 940, height: 500, rx: 20, fill: "#e8f2df", stroke: "#a9c29a", "stroke-width": 3 }, g);
  el("path", { d: "M30 400Q200 360 300 420T560 470T970 430L970 530L30 530Z", fill: "#cfe3f5" }, g);
  const iso = (cx, cy, rs) => rs.forEach((r) => el("ellipse", { cx, cy, rx: r * 1.3, ry: r, fill: "none", stroke: "#6b7b8c", "stroke-width": 2.5 }, g));
  const [hx, hy] = cfg.H;
  const [lx, ly] = cfg.L;
  iso(hx, hy, [50, 95, 140]);
  iso(lx, ly, cfg.deep ? [30, 55, 80, 105, 130] : [45, 90, 135]);
  T(g, hx, hy + 18, "H", 54, "#1e66c8");
  T(g, lx, ly + 18, "L", 54, "#c8352a");
  if (cfg.front) {
    const fx = (lx + hx) / 2 + (cfg.frontDx || 0);
    const d = `M${lx + 20} ${ly + 60}Q${fx} ${ly + 160} ${fx - 20} 470`;
    el("path", { d, stroke: cfg.front === "cold" ? "#1e66c8" : "#c8352a", "stroke-width": 6, fill: "none" }, g);
    const P0 = [lx + 20, ly + 60];
    const P1 = [fx, ly + 160];
    const P2 = [fx - 20, 470];
    for (let i = 1; i <= 5; i++) {
      const t = i / 6;
      const qx = (1 - t) ** 2 * P0[0] + 2 * (1 - t) * t * P1[0] + t * t * P2[0];
      const qy = (1 - t) ** 2 * P0[1] + 2 * (1 - t) * t * P1[1] + t * t * P2[1];
      let dx = 2 * (1 - t) * (P1[0] - P0[0]) + 2 * t * (P2[0] - P1[0]);
      let dy = 2 * (1 - t) * (P1[1] - P0[1]) + 2 * t * (P2[1] - P1[1]);
      const L = Math.hypot(dx, dy);
      dx /= L;
      dy /= L;
      let nx = dy;
      let ny = -dx;
      if (nx < 0) (nx = -nx), (ny = -ny);
      const b1 = [qx - dx * 14, qy - dy * 14];
      const b2 = [qx + dx * 14, qy + dy * 14];
      if (cfg.front === "cold") el("path", { d: `M${b1[0]} ${b1[1]}L${qx + nx * 22} ${qy + ny * 22}L${b2[0]} ${b2[1]}Z`, fill: "#1e66c8" }, g);
      else el("path", { d: `M${b1[0]} ${b1[1]}A14 14 0 0 ${nx * dy - ny * dx > 0 ? 0 : 1} ${b2[0]} ${b2[1]}Z`, fill: "#c8352a" }, g);
    }
  }
  // wind arrows from H toward L
  if (cfg.wind !== false) {
    const mx = (hx + lx) / 2;
    const my = (hy + ly) / 2;
    arrow(g, mx + (hx - lx) * 0.12, my + (hy - ly) * 0.12, mx - (hx - lx) * 0.12, my - (hy - ly) * 0.12, { color: "#6b5a48", width: 5, dash: "10 6" });
  }
  const dots = {};
  for (const c of cfg.cities || []) {
    const cg = el("g", { class: tap ? "ea-tap" : null }, g);
    el("circle", { cx: c.x, cy: c.y, r: 26, fill: "transparent" }, cg);
    const dot = el("circle", { cx: c.x, cy: c.y, r: 11, fill: INK, stroke: "#fff", "stroke-width": 3 }, cg);
    tag(cg, c.x, c.y - 22, c.n, { size: 22 });
    if (tap) cg.addEventListener("click", () => tap(c.n));
    dots[c.n] = dot;
  }
  return { g, dots };
}

// ---------- a climate graph (climograph) ----------
const MONTHS = ["J", "F", "M", "A", "M", "J", "J", "A", "S", "O", "N", "D"];
const MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
function climograph(parent, data, { tap = null, temp = true, title = null, maxRain = null, vals = null } = {}) {
  const g = el("g", {}, parent);
  const x0 = 110;
  const x1 = 890;
  const y0 = 490;
  const y1 = 80;
  const top = maxRain || Math.max(100, Math.ceil(Math.max(...data.rain) / 50) * 50);
  const bw = (x1 - x0) / 12;
  const ry = (mm) => y0 - (mm / top) * (y0 - y1);
  const tmin = -40;
  const tmax = 40;
  const minus = (n) => String(n).replace("-", "−");
  const ty = (c) => y0 - ((c - tmin) / (tmax - tmin)) * (y0 - y1);
  el("rect", { x: x0, y: y1, width: x1 - x0, height: y0 - y1, fill: "#fff", stroke: "#e2d6c4", "stroke-width": 2 }, g);
  const steps = top <= 150 ? 50 : top <= 300 ? 100 : 200;
  for (let mm = 0; mm <= top; mm += steps) {
    el("line", { x1: x0, y1: ry(mm), x2: x1, y2: ry(mm), stroke: "#eee3d2", "stroke-width": 2 }, g);
    T(g, x0 - 10, ry(mm) + 8, String(mm), 22, "#1e66c8", { "text-anchor": "end" });
  }
  T(g, x0 - 50, y1 - 22, "rain (mm)", 22, "#1e66c8", { "text-anchor": "start" });
  const bars = [];
  data.rain.forEach((mm, i) => {
    const b = el("rect", { x: x0 + i * bw + 7, y: ry(mm), width: bw - 14, height: y0 - ry(mm), rx: 4, fill: "#6fa8e6", stroke: "#1e66c8", "stroke-width": 2, class: tap ? "ea-tap" : null }, g);
    if (tap) {
      const hit = el("rect", { x: x0 + i * bw, y: y1, width: bw, height: y0 - y1, fill: "transparent", class: "ea-tap" }, g);
      hit.addEventListener("click", () => tap(i));
    }
    bars.push(b);
    T(g, x0 + i * bw + bw / 2, y0 + 30, MONTHS[i], 22, INK);
  });
  if (temp && data.temp) {
    for (const c of [-40, -20, 0, 20, 40]) T(g, x1 + 10, ty(c) + 8, `${minus(c)}°`, 22, "#c8352a", { "text-anchor": "start" });
    T(g, x1 + 50, y1 - 22, "temp (°C)", 22, "#c8352a", { "text-anchor": "end" });
    el("path", { d: `M${data.temp.map((c, i) => `${x0 + i * bw + bw / 2} ${ty(c)}`).join("L")}`, fill: "none", stroke: "#c8352a", "stroke-width": 5, "pointer-events": "none" }, g);
    data.temp.forEach((c, i) => el("circle", { cx: x0 + i * bw + bw / 2, cy: ty(c), r: 6, fill: "#c8352a", "pointer-events": "none" }, g));
  }
  // exact values, for questions that need them (a graph alone cannot be read to the nearest unit)
  if (vals === "rain") data.rain.forEach((mm, i) => T(g, x0 + i * bw + bw / 2, ry(mm) - 8, String(mm), 22, "#1e66c8", { "pointer-events": "none" }));
  if (vals === "temp") data.temp.forEach((c, i) => tag(g, x0 + i * bw + bw / 2, ty(c) - 16, minus(c), { size: 22, fill: "#c8352a", stroke: "#f0c4bd" }));
  if (title) T(g, 500, 38, title, 26, INK);
  return { g, bars };
}

// ---------- a claim card (for reasoning questions) ----------
function claimCard(parent, lines, { icon = "💬", y = 90 } = {}) {

}

function mohsCompare(ctx) {

    ask: `${MOHS[x - 1]} has hardness ${x}; ${MOHS[y - 1]} has hardness ${y}. Which one can scratch the other?`,
    draw: () => mohs(view, { hl: [x, y] }),
    opts: fixed([MOHS[x - 1], MOHS[y - 1]]),
    ans: MOHS[b - 1],
    hint: "a harder material scratches a softer one.",
    why: `${MOHS[b - 1]} (${b}) is harder than ${MOHS[a - 1]} (${a}), so it scratches it, never the reverse.`,
  };
}
function scratchRange(ctx) {
  const [a, b] = ctx.next("sr", [[3, 6], [4, 7], [2, 5], [5, 8], [6, 9], [3, 7], [4, 8], [2, 6]]);
  const mids = [];
  for (let i = a + 1; i < b; i++) mids.push(i);
  const ans = `Between ${a} and ${b}`;
  return {
    ask: `A mystery mineral scratches ${MOHS[a - 1].toLowerCase()} (${a}) but is scratched by ${MOHS[b - 1].toLowerCase()} (${b}). What is its hardness?`,
    draw: () => mohs(view, { hl: [a, b] }),
    opts: opts([ans, `Less than ${a}`, `More than ${b}`]),
    ans,
    hint: "it is harder than the one it scratches, and softer than the one that scratches it.",
    why: `It must be harder than ${a} and softer than ${b}: somewhere between them (hardness need not be a whole number). Further tests (streak, luster, cleavage) would narrow it down.`,
  };
}

const argUnique = (arr, f) => {
  const best = f(...arr);
  return arr.filter((v) => v === best).length === 1 ? arr.indexOf(best) : -1;
};
function graphQ(ctx, what) {
  const pool = CLIMATES.filter((c) => argUnique(what === "warm" ? c.temp : c.rain, what === "dry" ? Math.min : Math.max) >= 0);
  const c = ctx.next(`g${what}`, pool);
  const i = argUnique(what === "warm" ? c.temp : c.rain, what === "dry" ? Math.min : Math.max);
  let g;
  return {
    ask: what === "wet" ? "Tap the wettest month (the tallest blue bar)." : what === "dry" ? "Tap the driest month (the shortest blue bar)." : "Tap the warmest month (the highest red dot).",
    draw(q, api) {
      g = climograph(view, c, { tap: (m) => api.pick(m), title: `Example: ${c.n.toLowerCase()} climate` });
    },
    ans: i,
    ansText: MONTH_NAMES[i],
    mark(v, ok) {
      g.bars[v]?.setAttribute("fill", ok ? GOOD : BAD);

    hint: what === "warm" ? "the red line shows temperature. Find its highest point, then read the month below." : "compare the heights of the bars.",
    why: what === "warm" ? `${MONTH_NAMES[i]} averages ${c.temp[i]} °C, the highest on the graph.` : `${MONTH_NAMES[i]} has ${c.rain[i]} mm of rain, the ${what === "wet" ? "most" : "least"} of any month.`,
  };
}
