<script>const { $, el, svg: makeSvg, text, panel, say, sayAsync, pick, pickInt, wait, confetti, choices, explain, everyday, emoji, numpad, shuffle } = KIT;
const stage = $("[data-stage]");
const W = 1000;
const H = 560;
const INK = "#2b1d12";
let token = 0;
let view = null;

const UNITS = [
  { id: "ls0", label: "See it", icon: "👀" },
  { id: "ls1", label: "1. Money jars", icon: "🫙" },
  { id: "ls2", label: "2. My routines", icon: "⏰" },
  { id: "ls3", label: "3. Healthy body", icon: "🥦" },
  { id: "ls4", label: "4. Safety smarts", icon: "🦺" },
  { id: "ls5", label: "5. Feelings & calm", icon: "💛" },
  { id: "ls6", label: "6. Chores & helping", icon: "🧹" },
];

// Precise, serious feedback. Praise reasoning, never speed or "smart".
const EFFORT = ["Correct.", "Correct, and here is why:", "Correct. Your reasoning holds:", "Correct. You checked carefully:"];
const LEARN = ["Not quite. Consider this:", "Mistakes are how we learn. Let's look at why:", "Not yet. Think it through:"];

// ---------- small helpers ----------
function fresh() {
  stage.innerHTML = "";
  view = makeSvg(`0 0 ${W} ${H}`, stage);
  return view;
}
const tween = (ms, fn, alive) =>
  new Promise((resolve) => {
    if (KIT.still.matches) {
      fn(1);
      return resolve(true);
    }
    const t0 = performance.now();
    const frame = (now) => {
      if (!alive()) return resolve(false);
      const t = Math.min(1, (now - t0) / ms);
      fn(t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
      if (t < 1) requestAnimationFrame(frame);
      else resolve(true);
    };
    requestAnimationFrame(frame);
  });
const toSvg = (event) => {
  const p = view.createSVGPoint();
  p.x = event.clientX;
  p.y = event.clientY;
  return p.matrixTransform(view.getScreenCTM().inverse());
};
function wrap(str, n) {
  const lines = [];
  for (const word of String(str).split(" ")) {
    const last = lines[lines.length - 1];
    if (last && (last + " " + word).length <= n) lines[lines.length - 1] = last + " " + word;
    else lines.push(word);
  }
  return lines;
}
function lines(parent, x, y, str, n, size, attrs = {}) {
  const ls = wrap(str, n);
  ls.forEach((line, i) => text(parent, x, y + i * size * 1.22 - ((ls.length - 1) * size * 1.22) / 2, line, { "font-size": size, fill: INK, ...attrs }));
  return ls.length;
}
const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
const fmtTime = (m) => `${Math.floor(m / 60) % 12 || 12}:${String(m % 60).padStart(2, "0")}`;
const cents = (c) => (c < 100 ? `${c}¢` : `$${(c / 100).toFixed(2)}`);
const dollarsWord = (d) => `${d} dollar${d === 1 ? "" : "s"}`;
const centsSay = (c) => (c < 100 ? `${c} cents` : c % 100 ? `${dollarsWord(Math.floor(c / 100))} and ${c % 100} cents` : dollarsWord(c / 100));

// A calm picture card: a row of big pictures and a short caption.
function scene(glyphs, caption, { bg = "#fffaf0" } = {}) {
  fresh();
  el("rect", { x: 30, y: 24, width: 940, height: 512, rx: 34, fill: bg, stroke: "#eadcc4", "stroke-width": 4 }, view);
  const n = glyphs.length;
  const size = [0, 180, 150, 125, 105][n] || 95;
  const gap = Math.min(250, 860 / n);
  glyphs.forEach((g, i) => emoji(view, 500 + (i - (n - 1) / 2) * gap, caption ? 200 : 260, g, size));
  if (caption) lines(view, 500, 430, caption, 36, 34);
}

// Picture tile used by sort and order rounds.
function tile(parent, glyph, label, w, h, extra) {
  el("rect", { x: -w / 2, y: -h / 2, width: w, height: h, rx: 22, fill: "#fff", stroke: "#d9c7ab", "stroke-width": 3, class: "ls-face" }, parent);
  emoji(parent, 0, -h / 2 + 52, glyph, 62);
  const ls = wrap(label, Math.max(8, Math.floor(w / 12.5))).slice(0, 2);
  const lab = el("g", { class: "ls-lab" }, parent);
  ls.forEach((line, i) => text(lab, 0, -h / 2 + 116 + i * 25 - (extra ? 0 : (ls.length - 1) * 4), line, { "font-size": 22, fill: INK }));
  if (extra) text(lab, 0, h / 2 - 12, extra, { "font-size": 22, fill: "var(--accent-dark)", "font-weight": 900 });
}

// ---------- the game engine: levels, 8 rounds, tries, reveal, calm finish ----------
const LV = [["easy", "🐣 Easy"], ["medium", "🦊 Medium"], ["hard", "🦁 Hard"]];
function game(id, cfg) {
  const my = token;
  const live = () => my === token;
  let level = shell.progress()[id]?.level || "easy";
  let list = [];
  let round = 0;
  panel(`<div class="ap-row"><div class="ap-chips" data-levels>${LV.map(([k, l]) => `<button type="button" data-lv="${k}" aria-pressed="${k === level}">${l}</button>`).join("")}</div><p class="ap-status" data-status></p></div><div class="ls-ans" data-ans></div>`);
  const ans = $("[data-ans]");
  const status = (t) => {
    const s = $("[data-status]");
    if (s) s.textContent = t;
  };
  $("[data-levels]").addEventListener("click", (event) => {
    const b = event.target.closest("[data-lv]");
    if (!b) return;
    document.querySelectorAll("[data-lv]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    level = b.dataset.lv;
    shell.mark(id, { level });
    window.OC?.touch();
    VOICE.hush();
    begin();
  });
  const nextBtn = () => {
    const last = round === list.length - 1;
    ans.innerHTML = `<div class="ap-buttons"><button type="button" class="primary" data-next>${last ? "🎉 Finish" : "Next ▶"}</button><button type="button" data-hear aria-label="Hear it again">🔁</button></div>`;
    ans.onclick = (event) => {
      if (event.target.closest("[data-hear]")) return VOICE.speak($("[data-say]")?.innerHTML || "");
      if (!event.target.closest("[data-next]")) return;
      ans.onclick = null;
      window.OC?.touch();
      round += 1;
      next();
    };
  };
  const hearBtn = () => {
    ans.innerHTML = `<div class="ap-buttons"><button type="button" data-hear>🔁 Hear it again</button></div>`;
    ans.onclick = (event) => event.target.closest("[data-hear]") && VOICE.speak($("[data-say]")?.innerHTML || "");
  };
  const ctx = {
    live,
    ans,
    hearBtn,
    level: () => level,
    miss() {
      MUSIC.oops();
      window.OC?.touch();
    },
    async solved(r, msg) {
      if (!live()) return;
      MUSIC.chime();
      window.OC?.count(cfg.count);
      if (r.then) {
        ans.onclick = null;
        ans.innerHTML = "";
        await sayAsync(`${pick(EFFORT)} ${msg}`);
        if (!live()) return;
        return run(r.then, true);
      }
      say(`${pick(EFFORT)} ${msg}`);
      nextBtn();
      if (r.onSolved) r.onSolved(live);
    },
    reveal(r, msg) {
      if (!live()) return;
      say(msg);
      if (r.then) {
        ans.innerHTML = `<div class="ap-buttons"><button type="button" class="primary" data-go>Next ▶</button></div>`;
        ans.onclick = (event) => event.target.closest("[data-go]") && run(r.then, true);
        return;
      }
      nextBtn();
      if (r.onSolved) r.onSolved(live);
    },
  };
  const run = (r, keep) => {
    ans.onclick = null;
    ans.innerHTML = "";
    if (!keep) fresh();
    window.__lsRound = r;
    r.draw?.(view);
    TYPES[r.type](r, ctx);
  };
  const next = () => {
    if (!live()) return;
    if (round >= list.length) return (cfg.finale ? cfg.finale(ctx, finish) : finish());
    status(`Round ${round + 1} of ${list.length}`);
    run(list[round]);
  };
  const finish = (real = cfg.real) => {
    if (!live()) return;
    fresh();
    el("rect", { x: 30, y: 24, width: 940, height: 512, rx: 34, fill: "#fffaf0", stroke: "#eadcc4", "stroke-width": 4 }, view);
    emoji(view, 500, 170, "🌟", 150);
    text(view, 500, 360, "Complete", { "font-size": 60, fill: INK });
    lines(view, 500, 440, cfg.end, 40, 30, { fill: "var(--accent-dark)" });
    confetti();
    MUSIC.chime();
    shell.mark(id, { done: true });
    status("All done");
    say(`You have completed all ${list.length} rounds. ${cfg.end} Next, explain the idea in your own words, then try it for real.`);
    ans.innerHTML = `<div class="ap-buttons"><button type="button" class="primary" data-explain>🗣️ Explain it</button><button type="button" data-real>🏠 Try it for real</button><button type="button" data-again aria-label="Play again">🔁</button></div>`;
    ans.onclick = (event) => {
      if (event.target.closest("[data-explain]")) explainCard(cfg.explain);
      else if (event.target.closest("[data-real]")) realCard(real);
      else if (event.target.closest("[data-again]")) begin();
    };
  };
  const begin = () => {
    list = cfg.deck(level);
    round = 0;
    next();
  };
  begin();
}

const TYPES = {
  // Tap the right picture/answer. First miss: a thinking hint. Second miss: show the answer and WHY.
  choice(r, c) {
    let tries = 0;
    let done = false;
    const opts = r.keep ? r.options : shuffle(r.options);
    say(r.say);
    choices(c.ans, opts.map((o) => ({ label: o.label, o })), (x, btn) => {
      if (!c.live() || done || btn.disabled) return;
      window.OC?.touch();
      const buttons = [...c.ans.querySelectorAll("[data-c]")];
      if (x.o.ok) {
        done = true;
        btn.classList.add("right");
        buttons.forEach((b) => (b.disabled = true));
        c.solved(r, r.why);
        return;
      }
      tries += 1;
      btn.classList.add("wrong");
      btn.disabled = true;
      c.miss();
      if (tries >= 2) {
        done = true;
        const i = opts.findIndex((o) => o.ok);
        buttons[i].classList.add("right");
        buttons.forEach((b) => (b.disabled = true));
        c.reveal(r, `${pick(LEARN)} The answer is <b>${opts[i].label}</b>. ${r.why}`);
      } else say(`${pick(LEARN)} ${x.o.no || r.hint}`);
    });
  },
  // Type a number on the pad.
  num(r, c) {
    let tries = 0;
    let done = false;
    say(r.say);
    const pad = numpad(c.ans, {
      max: 4,
      onEnter(v) {
        if (!c.live() || done) return;
        window.OC?.touch();
        if (v === r.answer) {
          done = true;
          return c.solved(r, r.why);
        }
        tries += 1;
        c.miss();
        pad.clear();
        if (tries >= 2) {
          done = true;
          c.reveal(r, `${pick(LEARN)} The answer is <b>${r.answer}</b>. ${r.why}`);
        } else say(`${pick(LEARN)} You said ${v}. ${typeof r.hint === "function" ? r.hint(v) : r.hint}`);
      },
    });
  },
  // Drag (or tap, then tap a box) each picture into the right box.
  sort(r, c) {
    const zones = r.zones.map((z) => ({ ...z, n: 0 }));
    if (!zones[0].w) {
      const n = zones.length;
      const zw = (960 - (n - 1) * 18) / n;
      zones.forEach((z, i) => Object.assign(z, { x: 20 + i * (zw + 18), y: 232, w: zw, h: 312 }));
    }
    zones.forEach((z) => {
      z.g = el("g", { class: "ls-zone", "data-z": z.key }, view);
      (r.drawZone || drawBin)(z.g, z);
    });
    const n = r.items.length;
    const tw = Math.min(150, (960 - (n - 1) * 14) / n);
    const items = r.items.map((it, i) => {
      const hx = 500 + (i - (n - 1) / 2) * (tw + 14);
      const g = el("g", { class: "ls-item", "data-i": i, transform: `translate(${hx} 122)` }, view);
      tile(g, it.g, it.t, tw, 150);
      return { ...it, i, g, hx, hy: 122, misses: 0, placed: false };
    });
    let left = n;
    let sel = null;
    let drag = null;
    const home = (it) => it.g.setAttribute("transform", `translate(${it.hx} ${it.hy})`);
    const mark = (it, on) => it.g.querySelector(".ls-face").setAttribute("stroke", on ? "var(--accent)" : "#d9c7ab");
    const ok = (it, z) => (r.accept ? r.accept(it, z, zones) : it.zone === z.key);
    const put = (it, z) => {
      const k = z.n++;
      const [px, py] = z.slot ? z.slot(k) : binSlot(z, k);
      it.placed = true;
      it.g.classList.add("done");
      mark(it, false);
      it.g.querySelector(".ls-lab").setAttribute("opacity", 0);
      it.g.querySelector(".ls-face").setAttribute("opacity", 0.0);
      it.g.setAttribute("transform", `translate(${px} ${py}) scale(0.62)`);
      view.appendChild(it.g);
      r.onPlace?.(z, zones);
      MUSIC.play("xylophone", 72 + [0, 4, 7, 12, 16, 19, 24][Math.min(6, n - left)], { gain: 0.4 });
      left -= 1;
      if (!left) c.solved(r, r.done);
    };
    const drop = (it, z) => {
      if (!c.live() || it.placed) return;
      sel = null;
      window.OC?.touch();
      const res = ok(it, z);
      if (res === true) {
        put(it, z);
        if (left) say(it.why || "Correct.");
        return;
      }
      it.misses += 1;
      c.miss();
      home(it);
      mark(it, false);
      if (it.misses >= 2) {
        const right = zones.find((zz) => ok(it, zz) === true);
        say(`${it.why || `It goes in ${right.label}.`}`);
        if (right) put(it, right);
      } else say(`${pick(LEARN)} ${typeof res === "string" ? res : r.ask(it)}`);
    };
    const zoneAt = (p) => zones.find((z) => p.x >= z.x && p.x <= z.x + z.w && p.y >= z.y && p.y <= z.y + z.h);
    view.addEventListener("pointerdown", (event) => {
      if (!c.live()) return;
      const g = event.target.closest(".ls-item");
      if (g && !g.classList.contains("done")) {
        const it = items[Number(g.dataset.i)];
        drag = { it, p0: toSvg(event), moved: false };
        view.appendChild(it.g);
        try {
          view.setPointerCapture(event.pointerId);
        } catch {}
        return;
      }
      const zg = event.target.closest(".ls-zone");
      if (zg && sel) drop(sel, zones.find((z) => z.key === zg.dataset.z));
    });
    view.addEventListener("pointermove", (event) => {
      if (!drag) return;
      const p = toSvg(event);
      const dx = p.x - drag.p0.x;
      const dy = p.y - drag.p0.y;
      if (Math.hypot(dx, dy) > 12) drag.moved = true;
      if (drag.moved) drag.it.g.setAttribute("transform", `translate(${drag.it.hx + dx} ${drag.it.hy + dy})`);
    });
    const up = (event) => {
      if (!drag) return;
      const { it, moved } = drag;
      drag = null;
      if (moved) {
        const z = zoneAt(toSvg(event));
        if (z) drop(it, z);
        else home(it);
      } else {
        if (sel) mark(sel, false);
        sel = it;
        mark(it, true);
        MUSIC.play("woodblock", 79, { gain: 0.25 });
        say(`${it.t}. Now tap the box where it belongs.`);
      }
    };
    view.addEventListener("pointerup", up);
    view.addEventListener("pointercancel", up);
    say(r.say);
    c.hearBtn();
  },
  // Tap the picture cards in a sensible order. A card fits when everything it needs is already done.
  order(r, c) {
    const n = r.cards.length;
    const cw = Math.min(172, (960 - (n - 1) * 16) / n);
    const order = shuffle(r.cards.map((_, i) => i));
    const slotX = (k) => 500 + (k - (n - 1) / 2) * (cw + 16);
    for (let k = 0; k < n; k++) {
      el("rect", { x: slotX(k) - cw / 2, y: 312, width: cw, height: 176, rx: 22, fill: "#fbf6ee", stroke: "#cdbb9f", "stroke-width": 3, "stroke-dasharray": "12 9" }, view);
      el("circle", { cx: slotX(k), cy: 312, r: 22, fill: "var(--accent)" }, view);
      text(view, slotX(k), 320, k + 1, { "font-size": 24, fill: "#fff" });
    }
    const cards = r.cards.map((cd, i) => {
      const pos = order.indexOf(i);
      const hx = slotX(pos);
      const g = el("g", { class: "ls-card", "data-i": i, transform: `translate(${hx} 136)` }, view);
      tile(g, cd.g, cd.t, cw, 176, r.mins ? `${cd.m} min` : null);
      return { ...cd, i, g, hx, placed: false };
    });
    const placed = [];
    let misses = 0;
    let busy = false;
    const can = (cd) => (cd.a || []).every((j) => placed.includes(j));
    const place = async (cd) => {
      busy = true;
      cd.placed = true;
      placed.push(cd.i);
      misses = 0;
      cd.g.classList.add("done");
      const k = placed.length - 1;
      const x0 = cd.hx;
      MUSIC.play("xylophone", 72 + [0, 2, 4, 5, 7, 9][k % 6], { gain: 0.4 });
      await tween(600, (t) => cd.g.setAttribute("transform", `translate(${x0 + (slotX(k) - x0) * t} ${136 + 264 * t})`), c.live);
      busy = false;
      if (!c.live()) return;
      if (placed.length === n) return c.solved(r, r.done);
    };
    view.addEventListener("pointerdown", (event) => {
      const g = event.target.closest(".ls-card");
      if (!g || busy || !c.live()) return;
      const cd = cards[Number(g.dataset.i)];
      if (cd.placed) return;
      window.OC?.touch();
      if (can(cd)) {
        if (placed.length < n - 1) say(`${placed.length + 1}. ${cd.t}.`);
        place(cd);
        return;
      }
      misses += 1;
      c.miss();
      cd.g.querySelector(".ls-face").setAttribute("stroke", "#e0603a");
      setTimeout(() => cd.g.querySelector(".ls-face").setAttribute("stroke", "#d9c7ab"), 700);
      if (misses >= 2) {
        const nxt = cards.find((x) => !x.placed && can(x));
        say(`${nxt.t} comes next. ${nxt.why || `It has to happen before you can ${cd.t.toLowerCase()}.`}`);
        place(nxt);
      } else say(`${pick(LEARN)} What has to happen before you can ${cd.t.toLowerCase()}?`);
    });
    say(r.say);
    c.hearBtn();
  },
  custom(r, c) {
    r.start(c);
  },
};

function drawBin(g, z) {
  el("rect", { x: z.x, y: z.y, width: z.w, height: z.h, rx: 26, fill: z.soft, stroke: z.color, "stroke-width": 5 }, g);
  emoji(g, z.x + 40, z.y + 34, z.glyph, 40);
