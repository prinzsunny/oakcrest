<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Month plan · OakCrest Academy</title>
<meta name="description" content="">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2048%2048%22%20aria-hidden%3D%22true%22%3E%3Cpath%20d%3D%22M24%203%2042%209v13c0%2011.5-7.6%2019.6-18%2023C13.6%2041.6%206%2033.5%206%2022V9Z%22%20fill%3D%22%237a4520%22%2F%3E%3Cpath%20d%3D%22M24%206.4%2039%2011.4V22c0%209.7-6.3%2016.6-15%2019.7C15.3%2038.6%209%2031.7%209%2022V11.4Z%22%20fill%3D%22%23fffcf6%22%2F%3E%3Cpath%20d%3D%22M24%2014.5c-4.6%200-7.6%202.4-7.9%205.6h15.8c-.3-3.2-3.3-5.6-7.9-5.6Z%22%20fill%3D%22%237a4520%22%2F%3E%3Cpath%20d%3D%22M17%2021.3h14c-.2%206.3-3.1%2010.7-7%2012.6-3.9-1.9-6.8-6.3-7-12.6Z%22%20fill%3D%22%23c98c58%22%2F%3E%3Cpath%20d%3D%22M24%2014.5v-3.2%22%20stroke%3D%22%237a4520%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M19.4%2017.3c1.5-1%203-1.4%204.6-1.4M28.6%2017.3c-1.5-1-3-1.4-4.6-1.4%22%20stroke%3D%22%23c98c58%22%20stroke-width%3D%221.2%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="../assets/oc.css">
<script src="../assets/oc.js"></script>
<script src="../assets/plan.js"></script></head>
<body>
<div class="oc-wrap pl">
  <header class="oc-top"><a class="oc-brand" href="../"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3 42 9v13c0 11.5-7.6 19.6-18 23C13.6 41.6 6 33.5 6 22V9Z" fill="#7a4520"/><path d="M24 6.4 39 11.4V22c0 9.7-6.3 16.6-15 19.7C15.3 38.6 9 31.7 9 22V11.4Z" fill="#fffcf6"/><path d="M24 14.5c-4.6 0-7.6 2.4-7.9 5.6h15.8c-.3-3.2-3.3-5.6-7.9-5.6Z" fill="#7a4520"/><path d="M17 21.3h14c-.2 6.3-3.1 10.7-7 12.6-3.9-1.9-6.8-6.3-7-12.6Z" fill="#c98c58"/><path d="M24 14.5v-3.2" stroke="#7a4520" stroke-width="2" stroke-linecap="round"/><path d="M19.4 17.3c1.5-1 3-1.4 4.6-1.4M28.6 17.3c-1.5-1-3-1.4-4.6-1.4" stroke="#c98c58" stroke-width="1.2" stroke-linecap="round" fill="none"/></svg><span><b>OakCrest Academy</b><small>Learning at home</small></span></a><span data-chip data-home="../"></span></header>
  <a class="oc-back" href="../">← All subjects</a>
  <h1 style="margin-top:8px">🗓️ Our month plan</h1>
  <p class="oc-lead">Four weeks of short lessons on Tuesdays, Thursdays, Saturdays and Sundays. Tap ▶ to start a lesson and ✓ when it's done.</p>
  <section class="pl-controls">
    <div class="pl-tracks" role="group" aria-label="Which plan">
      <button type="button" data-track="big">🦁 Big learner <small>grades 3–4</small></button>
      <button type="button" data-track="little">🐣 Little learner <small>ages 3–5</small></button>
    </div>
    <label class="oc-field pl-start">First Tuesday<input type="date" data-start></label>
  </section>
  <section class="pl-today" data-today></section>
  <p class="pl-meter" data-meter></p>
  <div data-weeks></div>
  <p class="oc-foot">Ticks are saved on this device for each learner. Every lesson you open is also added to the learning log.</p>
</div>

<script>const $ = (s) => document.querySelector(s);
const learner = () => OC.current() || "Learner";
const fmt = (date, opts) => date.toLocaleDateString(undefined, opts);
const row = (day, item, i, done) => {
  const [path, what, minutes] = item;
  const key = `${day.key}-${i}`;
  const on = !!done[key];
  const icon = PLAN.SUBJECT_OF[path.split("/")[0]] || "⭐";
  return `<li class="pl-item${on ? " done" : ""}"><button type="button" class="pl-tick" data-key="${key}" aria-pressed="${on}" aria-label="${on ? "Done" : "Mark done"}: ${OC.escapeHtml(what)}">${on ? "✓" : ""}</button><span class="pl-icon" aria-hidden="true">${icon}</span><span class="pl-what">${OC.escapeHtml(what)}<small>${minutes} min</small></span><a class="pl-go" href="../${path}" aria-label="Start ${OC.escapeHtml(what)}">▶</a></li>`;
};
function render() {
  const track = PLAN.trackOf(learner());
  document.querySelectorAll("[data-track]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.track === track)));
  $("[data-start]").value = OC.dayOf(PLAN.start());
  const done = PLAN.doneOf(learner());
  const days = PLAN.days(track);
  const today = OC.dayOf(new Date());
  const next = PLAN.upcoming(track);
  const total = days.reduce((n, d) => n + d.items.length, 0);
  const ticked = days.reduce((n, d) => n + d.items.filter((_, i) => done[`${d.key}-${i}`]).length, 0);
  $("[data-meter]").innerHTML = `<span class="oc-meter"><span style="width:${Math.round((ticked / total) * 100)}%"></span></span>${ticked} of ${total} lessons done`;
  $("[data-today]").innerHTML = next
    ? `<h2>${next.iso === today ? "⭐ Today" : "Next lesson day"} · ${fmt(next.date, { weekday: "long", month: "long", day: "numeric" })}</h2><p class="pl-theme">Week ${next.week}: ${next.theme}</p><ol class="pl-items big">${next.items.map((item, i) => row(next, item, i, done)).join("")}</ol>`
    : `<h2>🎉 The month is finished!</h2><p class="pl-theme">Pick a new first Tuesday to start again.</p>`;
  let html = "";
  for (let w = 1; w <= 4; w++) {
    const week = days.filter((d) => d.week === w);
    html += `<h2 class="oc-strand">Week ${w}: ${week[0].theme}</h2><section class="pl-week">${week
      .map((d) => {
        const all = d.items.every((_, i) => done[`${d.key}-${i}`]);
        return `<article class="pl-day${d.iso === today ? " today" : ""}${all ? " complete" : ""}"><h3>${fmt(d.date, { weekday: "short" })} <span>${fmt(d.date, { month: "short", day: "numeric" })}</span>${all ? " ⭐" : ""}</h3><ol class="pl-items">${d.items.map((item, i) => row(d, item, i, done)).join("")}</ol></article>`;
      })
      .join("")}</section>`;
  }
  $("[data-weeks]").innerHTML = html;
}
document.addEventListener("click", (event) => {
  const tick = event.target.closest("[data-key]");
  if (tick) {
    PLAN.setDone(learner(), tick.dataset.key, tick.getAttribute("aria-pressed") !== "true");
    render();
  }
  const track = event.target.closest("[data-track]");
  if (track) {
    PLAN.setTrack(learner(), track.dataset.track);
    render();
  }
});
$("[data-start]").addEventListener("change", (event) => {
  if (event.target.value) PLAN.setStart(event.target.value);
  render();
});
OC.chip($("[data-chip]"));
OC.onChange(render);
render();
</script>
</body>
</html>
