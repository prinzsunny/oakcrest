<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grown-up skill check · OakCrest Academy</title>
<meta name="description" content="A guided ten-minute skill check: ask, watch, and mark Got it, Almost or Not yet.">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap">
<link rel="stylesheet" href="../../assets/oc.css">
<script src="../../assets/oc.js"></script>
<script src="../../assets/firebase-config.js"></script>
<script src="../../assets/cloud.js"></script>
<script src="../../assets/skill-tags.js"></script>
<script src="../../assets/skills.js"></script>
</head>
<body>
<div class="oc-wrap">
  <header class="oc-top no-print"><a class="oc-brand" href="../../"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3 42 9v13c0 11.5-7.6 19.6-18 23C13.6 41.6 6 33.5 6 22V9Z" fill="#7a4520"/><path d="M24 6.4 39 11.4V22c0 9.7-6.3 16.6-15 19.7C15.3 38.6 9 31.7 9 22V11.4Z" fill="#fffcf6"/><path d="M24 14.5c-4.6 0-7.6 2.4-7.9 5.6h15.8c-.3-3.2-3.3-5.6-7.9-5.6Z" fill="#7a4520"/><path d="M17 21.3h14c-.2 6.3-3.1 10.7-7 12.6-3.9-1.9-6.8-6.3-7-12.6Z" fill="#c98c58"/><path d="M24 14.5v-3.2" stroke="#7a4520" stroke-width="2" stroke-linecap="round"/><path d="M19.4 17.3c1.5-1 3-1.4 4.6-1.4M28.6 17.3c-1.5-1-3-1.4-4.6-1.4" stroke="#c98c58" stroke-width="1.2" stroke-linecap="round" fill="none"/></svg><span><b>OakCrest Academy</b><small>Learning at home</small></span></a><span data-chip data-home="../"></span></header>
  <a class="oc-back no-print" href="../">← Portfolio</a>
<style>
.ck{max-width:760px;margin:0 auto}
.ck-bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:10px 0 16px}.ck-bar b{display:block;height:100%;background:#16a34a;transition:width .3s}
.ck-card{padding:20px;border-radius:20px;background:var(--card);box-shadow:0 0 0 1px var(--line)}
.ck-card h2{margin:4px 0 6px}.ck-meta{color:var(--muted);font-size:14px;margin:0}
.ck-ask{margin:14px 0;padding:14px 16px;border-radius:14px;background:#eef4ff;font-size:18px}
.ck-card ul{margin:6px 0 0;padding-left:20px}
.ck-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.ck-btns button{flex:1 1 140px;min-height:56px;font-size:17px;font-weight:800;border-radius:14px;border:2px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink)}
.ck-btns [data-s=yes]{border-color:#16a34a}.ck-btns [data-s=almost]{border-color:#eab308}.ck-btns [data-s=notyet]{border-color:#f59e0b}
.ck-done li{margin:4px 0}
@media (prefers-color-scheme:dark){.ck-ask{background:#22324d}}
</style>
<main class="ck">
  <h1>🧑‍🏫 Grown-up skill check</h1>
  <p class="oc-lead" data-lead>About 10 minutes. One skill at a time: ask the question, watch, then tap what you saw. Results go straight into the portfolio as “Grown-up check”.</p>
  <div class="ck-bar" aria-hidden="true"><b data-bar style="width:0"></b></div>
  <section class="ck-card" data-card aria-live="polite"><p>Loading skills…</p></section>
</main>
<script>
(async () => {
  const $ = (q) => document.querySelector(q);
  const esc = OC.escapeHtml;
  if (!(await OC.parent("The skill check is for grown-ups. Enter the parent PIN."))) return location.replace("../");
  try { await SKILLS.load(); } catch { $("[data-card]").innerHTML = "<p>Skills couldn't load. Check the connection and reload.</p>"; return; }
  const name = OC.current() || "Learner";
  const age = OC.ageOf(name) ?? SKILLS.ageOf(name);
  // Ready skills near her age, plus a few a year or two older (where "ahead of age" evidence comes from).
  const status = SKILLS.statusMap(name);
  const near = SKILLS.next({ name, count: 7, status });
  const stretch = [...SKILLS.topics.values()]
    .filter((t) => t.ageStart > age && t.ageStart <= age + 2 && SKILLS.isReady(t.id, status) && !near.includes(t))
    .sort((a, b) => b.centrality - a.centrality).slice(0, 3);
  const list = [...near, ...stretch];
  const results = [];
  let i = 0;
  $("[data-lead]").firstChild.textContent = `About 10 minutes with ${name}. One skill at a time: ask the question, watch, then tap what you saw. Results go straight into the portfolio as “Grown-up check”.`;
  function show() {
    $("[data-bar]").style.width = `${Math.round((i / Math.max(1, list.length)) * 100)}%`;
    if (i >= list.length) return finish();
    const t = list[i];
    const ask = t.prompt || t.description;
    $("[data-card]").innerHTML = `<p class="ck-meta">${i + 1} of ${list.length} · ${esc(t.subject)} · ${esc(t.domain || "")} · usually age ${t.ageStart}${t.ageStart > age ? " · <b>stretch</b>" : ""}</p>
      <h2>${esc(t.name)}</h2><p>${esc(t.description)}</p>
      ${ask ? `<div class="ck-ask">💬 <b>Try:</b> ${esc(ask)}</div>` : ""}
      ${t.evidence?.length ? `<b>Look for:</b><ul>${t.evidence.slice(0, 3).map((e) => `<li>${esc(e)}</li>`).join("")}</ul>` : ""}
      <div class="ck-btns"><button type="button" data-s="yes">✅ Got it</button><button type="button" data-s="almost">🟡 Almost</button><button type="button" data-s="notyet">⏳ Not yet</button><button type="button" data-s="skip">Skip</button></div>`;
  }
  function finish() {
    const label = { yes: "✅ Got it", almost: "🟡 Almost", notyet: "⏳ Not yet" };
    $("[data-card]").innerHTML = `<h2>All done!</h2>${results.length ? `<ul class="ck-done">${results.map((r) => `<li>${label[r.s]}: ${esc(r.t.name)}</li>`).join("")}</ul>` : "<p>No skills marked.</p>"}
      <p>Do this once a week. “Almost” and “Not yet” skills show up in the portfolio's <b>Needs more work</b> list with links to practise them.</p>
      <div class="ck-btns"><a class="oc-button" href="../">📋 Open the portfolio</a><a class="oc-button" href="./">🔁 Check more skills</a></div>`;
  }
  $("[data-card]").addEventListener("click", (event) => {
    const s = event.target.closest("[data-s]")?.dataset.s;
    if (!s) return;
    if (s !== "skip") { SKILLS.check(list[i].id, s, { name, src: "check" }); results.push({ t: list[i], s }); }
    i += 1;
    show();
  });
  show();
})();
</script>
</div>
</body>
</html>
