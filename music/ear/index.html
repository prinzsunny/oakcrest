<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ear Training · OakCrest Academy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2048%2048%22%20aria-hidden%3D%22true%22%3E%3Cpath%20d%3D%22M24%203%2042%209v13c0%2011.5-7.6%2019.6-18%2023C13.6%2041.6%206%2033.5%206%2022V9Z%22%20fill%3D%22%237a4520%22%2F%3E%3Cpath%20d%3D%22M24%206.4%2039%2011.4V22c0%209.7-6.3%2016.6-15%2019.7C15.3%2038.6%209%2031.7%209%2022V11.4Z%22%20fill%3D%22%23fffcf6%22%2F%3E%3Cpath%20d%3D%22M24%2014.5c-4.6%200-7.6%202.4-7.9%205.6h15.8c-.3-3.2-3.3-5.6-7.9-5.6Z%22%20fill%3D%22%237a4520%22%2F%3E%3Cpath%20d%3D%22M17%2021.3h14c-.2%206.3-3.1%2010.7-7%2012.6-3.9-1.9-6.8-6.3-7-12.6Z%22%20fill%3D%22%23c98c58%22%2F%3E%3Cpath%20d%3D%22M24%2014.5v-3.2%22%20stroke%3D%22%237a4520%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M19.4%2017.3c1.5-1%203-1.4%204.6-1.4M28.6%2017.3c-1.5-1-3-1.4-4.6-1.4%22%20stroke%3D%22%23c98c58%22%20stroke-width%3D%221.2%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="../../assets/oc.css">
<link rel="stylesheet" href="../../assets/app.css">

<body data-subject="music">
<div class="ap">
<header class="ap-bar">
  <a class="ap-home" href="../../" aria-label="OakCrest home" title="OakCrest home">🏠</a>
  <div class="ap-title"><b>Ear Training</b><small>Music · all levels</small></div>
  <button type="button" class="ap-pick" data-pick aria-label="Choose a game"></button>
  <div class="ap-spacer"></div>
  <div class="ap-tools">
    <span data-chip data-home="../../"></span>
    <button type="button" class="ap-icon" data-help aria-label="How to play" title="How to play" hidden>❓</button>
    <button type="button" class="ap-icon" data-voice aria-label="Voice on">🔊</button>
    <button type="button" class="ap-icon" data-menu aria-label="Settings">⚙</button>
    <div class="ap-pop" data-pop hidden>
      <label>Voice <select data-voice-pick aria-label="Choose a voice"></select></label>
      <button type="button" class="ap-pop-btn" data-sound>🔔 Sounds on</button>
      <p>Piano, xylophone and woodblock sounds from the FluidR3 GM soundfont by Frank Wen, used under Creative Commons Attribution 3.0.</p>
    </div>
  </div>
</header>
<main class="ap-main"><div class="ap-stage" data-stage></div><div class="ap-panel" data-panel></div></main>
</div>
<script>const { $, el, svg: makeSvg, text, panel, say, sayAsync, pick, pickInt, wait, confetti, PRAISE, explain, everyday, emoji } = KIT;
const stage = $("[data-stage]");
const W = 1000;
const H = 560;
let token = 0;
let view = null;

const UNITS = [
  { id: "e0", label: "👀 See it", icon: "👀" },
  { id: "e6", label: "1. Loud or soft? Long or short?" },
  { id: "e1", label: "2. Higher or lower?" },
  { id: "e2", label: "3. Same or different?" },
  { id: "e3", label: "4. Steps or skips?" },
  { id: "e4", label: "5. Happy or sad?" },
  { id: "e5", label: "6. Name that interval" },
];
const WHITE = [0, 2, 4, 5, 7, 9, 11];

function scene(lit = [], { icon = "👂" } = {}) {
  stage.innerHTML = "";
  view = makeSvg(`0 0 ${W} ${H}`, stage);
  text(view, W / 2, 150, icon, { "font-size": 110 });
  const low = 55;
  const high = 84;
  const whites = [];
  for (let m = low; m <= high; m++) if (WHITE.includes(m % 12)) whites.push(m);
  const kw = 900 / whites.length;
  const x0 = 50;
  const y0 = 260;
  whites.forEach((m, i) => el("rect", { x: x0 + i * kw + 1, y: y0, width: kw - 2, height: 240, rx: 6, fill: lit.includes(m) ? (lit.indexOf(m) === 0 ? "#f3d7a8" : "#cfe9d3") : "#fffdf8", stroke: "#7d6a58", "stroke-width": 1.5 }, view));
  whites.forEach((m, i) => {
    if (!WHITE.includes((m + 1) % 12) && m + 1 <= high) el("rect", { x: x0 + (i + 1) * kw - kw * 0.31, y: y0, width: kw * 0.62, height: 150, rx: 4, fill: lit.includes(m + 1) ? "#a8632d" : "#2a1d14" }, view);
  });
  lit.forEach((m, k) => {
    const i = whites.indexOf(WHITE.includes(m % 12) ? m : m - 1);
    const cx = x0 + i * kw + (WHITE.includes(m % 12) ? kw / 2 : kw);
    text(view, cx, y0 + 225, k + 1, { "font-size": 26, fill: "#7a4520" });
  });
}

function quiz({ id, rounds = 10, pass = 8, make, play, answers, judge, explain }) {
  const my = token;
  let round = 0;
  let right = 0;
  let level = 0;
  let q = null;
  let done = true;
  panel(`<p class="ap-status" data-status></p><div class="ap-buttons" data-answers>${answers.map((a) => `<button type="button" class="ap-big" data-a="${a.v}" aria-label="${a.label}">${a.icon}</button>`).join("")}</div><div class="ap-buttons"><button type="button" data-again>🔁 Hear it again</button></div>`);
  const ask = async () => {
    q = make(level);
    scene();
    $("[data-status]").textContent = `Question ${round + 1} of ${rounds}`;
    done = false;
    await wait(500);
    if (my === token) play(q);
  };
  $("[data-panel]").onclick = async (event) => {
    if (my !== token || !q) return;
    if (event.target.closest("[data-again]")) return play(q);
    const button = event.target.closest("[data-a]");
    if (!button || done) return;
    done = true;
    const ok = judge(q, button.dataset.a);
    round += 1;
    window.OC?.count("ear questions");
    if (ok) {
      right += 1;
      level = Math.min(level + 1, 6);
      MUSIC.chime();
    } else level = Math.max(level - 1, 0);
    say(`${ok ? pick(PRAISE) : "Good listening!"} ${explain(q)}`);
    scene(q.show || []);
    await wait(900);
    play(q);
    await wait(2600);
    if (my !== token) return;
    if (round >= rounds) {
      if (right >= pass) {
        shell.mark(id, { done: true, best: Math.max(right, shell.progress()[id]?.best || 0) });
        confetti();
      }
      say(`${right} out of ${rounds}! ${right >= pass ? "Amazing ears! 🎉" : "Let's listen some more."}`);
      round = 0;
      right = 0;
      await wait(3000);
    }
    if (my === token) ask();
  };
  ask();
}

const note = (m, at = 0, length = 0.8) => MUSIC.play("piano", m, { at, length, gain: 0.85 });
const seq = (list, gap = 0.75) => {
  const t0 = MUSIC.now() + 0.1;
  list.forEach((m, i) => note(m, t0 + i * gap, gap * 0.95));
};
const words = (n) => ["", "1 step", "2 steps", "3", "4", "5", "6", "7"][n] || n;
const INTERVALS = { 2: ["2nd", "Happy Birthday: hap-py"], 4: ["3rd", "When the Saints: oh when"], 5: ["4th", "Here Comes the Bride: here comes"], 7: ["5th", "Twinkle Twinkle: twin-kle, twin-kle"], 12: ["octave", "Somewhere Over the Rainbow: some-where"] };

const units = {
  e0() {
    const my = token;
    const label = (parent, x, y, str, size = 32, fill = "#2b1d12") => text(parent, x, y, str, { "font-size": size, fill, "font-weight": 900 });
    // Read the scene's words first, then play, so the music never talks over the voice.
    const talk = async (api, html) => {
      await sayAsync(html);
      await api.wait(250);
    };
    const STAIRS = [60, 62, 64, 65, 67, 69, 71, 72];
    const NAMES = ["C", "D", "E", "F", "G", "A", "B", "C"];
    const stairs = (v, { x0 = 150, y0 = 470, w = 90, h = 42 } = {}) => {
      STAIRS.forEach((m, i) => {
        el("rect", { x: x0 + i * w, y: y0 - (i + 1) * h, width: w, height: (i + 1) * h, fill: i % 2 ? "#e9dcc8" : "#f3e9da", stroke: "#c9b8a1", "stroke-width": 2 }, v);
        text(v, x0 + i * w + w / 2, y0 - 10, NAMES[i], { "font-size": 26, fill: "#8a7764", "font-weight": 800 });
      });
      return (i) => [x0 + i * w + w / 2, y0 - (i + 1) * h];
    };
    const hop = async (api, node, [x0, y0], [x1, y1], ms = 420, lift = 60) => {
      await api.tween(ms, (t) => node.setAttribute("transform", `translate(${x0 + (x1 - x0) * t} ${y0 + (y1 - y0) * t - Math.sin(t * Math.PI) * lift})`), (t) => t);
    };
    const face = (v, x, y, happy) => {
      const g = el("g", { transform: `translate(${x} ${y})` }, v);
      el("circle", { r: 110, fill: happy ? "#ffd54f" : "#b0bec5", stroke: happy ? "#f0a500" : "#78909c", "stroke-width": 6 }, g);
      el("circle", { cx: -38, cy: -25, r: 12, fill: "#3b2a1d" }, g);
      el("circle", { cx: 38, cy: -25, r: 12, fill: "#3b2a1d" }, g);
      el("path", { d: happy ? "M-50 25 Q0 80 50 25" : "M-50 60 Q0 15 50 60", stroke: "#3b2a1d", "stroke-width": 9, fill: "none", "stroke-linecap": "round" }, g);
      if (!happy) el("path", { d: "M-40 0 q-8 18 0 26 q8 -8 0 -26Z", fill: "#4fa3e0" }, g);
      return g;
    };
    const chord = (notes, t0) => {
      notes.forEach((m) => note(m, t0, 1.5));
      notes.forEach((m, i) => note(m, t0 + 1.8 + i * 0.4, 0.6));
    };
    const scenes = [
      {
        say: "Why do we train our ears? Good listening keeps us safe and helps us make music!",
        draw: everyday([["🚗", "Hearing a car coming"], ["📞", "Knowing a voice"], ["🎤", "Singing in tune"], ["🐦", "Birdsong"]]),
      },
      {
        say: "Sounds can be <b>low</b> or <b>high</b>. A big bear growls low. A little bird sings high.",
        async draw(v, api) {
          el("path", { d: "M80 470 L920 470", stroke: "#c9b8a1", "stroke-width": 4 }, v);
          text(v, 70, 460, "low", { "font-size": 30, fill: "#8a7764", "font-weight": 800, "text-anchor": "start" });
          text(v, 930, 120, "high", { "font-size": 30, fill: "#8a7764", "font-weight": 800, "text-anchor": "end" });
          const bear = el("g", { transform: "translate(260 400)" }, v);
          emoji(bear, 0, 0, "🐻", 150);
          const bird = el("g", { transform: "translate(740 170)" }, v);
          emoji(bird, 0, 0, "🐦", 110);
          await talk(api, this.say);
          for (let k = 0; k < 2; k++) {
            note(41, MUSIC.now() + 0.05, 1.2);
            await api.tween(500, (t) => bear.setAttribute("transform", `translate(260 ${400 - Math.sin(t * Math.PI) * 25}) scale(${1 + Math.sin(t * Math.PI) * 0.08})`));
            await api.wait(700);
            const t0 = MUSIC.now() + 0.05;
            [84, 81, 84].forEach((m, i) => note(m, t0 + i * 0.18, 0.2));
            await api.tween(600, (t) => bird.setAttribute("transform", `translate(740 ${170 - Math.sin(t * Math.PI * 2) * 25})`));
            await api.wait(900);
          }
        },
      },
      {
        say: "Notes go up and down like <b>stairs</b>. Each step up sounds a little higher. Watch the chick climb!",
        async draw(v, api) {
          const top = stairs(v);
          const chick = el("g", {}, v);
          emoji(chick, 0, -40, "🐥", 64);
          chick.setAttribute("transform", `translate(${top(0)[0] - 90} 470)`);
          await talk(api, this.say);
          let at = [top(0)[0] - 90, 470];
          for (let i = 0; i < 8; i++) {
            note(STAIRS[i], MUSIC.now() + 0.02, 0.5);
            await hop(api, chick, at, top(i));
            at = top(i);
            await api.wait(180);
          }
          await api.wait(700);
          for (let i = 6; i >= 0; i--) {
            note(STAIRS[i], MUSIC.now() + 0.02, 0.5);
            await hop(api, chick, at, top(i));
            at = top(i);
            await api.wait(180);
          }
          label(v, 500, 70, "up = higher · down = lower", 32, "#7a4520");
        },
      },
      {
        say: "Going to the very next note is a <b>step</b> 👣. Jumping over notes is a <b>skip</b> 🦘.",
        async draw(v, api) {
          const top = stairs(v);
          const walker = el("g", {}, v);
          emoji(walker, 0, -36, "👣", 54);
          walker.setAttribute("transform", `translate(${top(0)[0]} ${top(0)[1]})`);
          const tag = label(v, 500, 70, "", 38, "#7a4520");
          await talk(api, this.say);
          tag.textContent = "👣 steps: C D E";
          let at = top(0);
          note(60, MUSIC.now() + 0.02, 0.5);
          await api.wait(500);
          for (const i of [1, 2]) {
            note(STAIRS[i], MUSIC.now() + 0.02, 0.5);
            await hop(api, walker, at, top(i), 420, 25);
            at = top(i);
            await api.wait(350);
          }
          await api.wait(800);
          walker.remove();
          const roo = el("g", {}, v);
          emoji(roo, 0, -40, "🦘", 64);
          roo.setAttribute("transform", `translate(${top(0)[0]} ${top(0)[1]})`);
          tag.textContent = "🦘 skips: C E G";
          at = top(0);
          note(60, MUSIC.now() + 0.02, 0.5);
          await api.wait(500);
          for (const i of [2, 4]) {
            note(STAIRS[i], MUSIC.now() + 0.02, 0.5);
            await hop(api, roo, at, top(i), 600, 120);
            at = top(i);
            await api.wait(350);
          }
        },
      },
      {
        say: "Three notes together make a <b>chord</b>. This one sounds bright and <b>happy</b>, like sunshine. It's called <b>major</b>.",
        async draw(v, api) {
          const g = face(v, 500, 250, true);
          emoji(v, 760, 130, "☀️", 90);
          label(v, 500, 450, "😊 major: C E G", 38, "#7a4520");
          await talk(api, this.say);
          chord([60, 64, 67], MUSIC.now() + 0.05);
          await api.tween(3200, (t) => g.setAttribute("transform", `translate(500 250) rotate(${Math.sin(t * Math.PI * 4) * 6})`), (t) => t);
        },
      },
      {
        say: "Now the middle note moves down just a tiny bit. Hear how it sounds <b>sad</b>, like rain? That's <b>minor</b>.",
        async draw(v, api) {
          const g = face(v, 500, 250, false);
          emoji(v, 760, 130, "🌧️", 90);
          label(v, 500, 450, "😢 minor: C E♭ G", 38, "#7a4520");
          await talk(api, this.say);
          chord([60, 63, 67], MUSIC.now() + 0.05);
          await api.tween(3200, (t) => g.setAttribute("transform", `translate(500 ${250 + Math.sin(t * Math.PI) * 12})`), (t) => t);
          await api.wait(600);
          label(v, 500, 520, "Listen again: happy, then sad", 28, "#8a7764");
          const t0 = MUSIC.now() + 0.05;
          [60, 64, 67].forEach((m) => note(m, t0, 1.3));
          [60, 63, 67].forEach((m) => note(m, t0 + 1.8, 1.5));
        },
      },
    ];
    explain(scenes, {
      alive: () => my === token,
      title: "Listening",
      onDone: () => {
        shell.mark("e0", { done: true });
        shell.go("e6");
      },
    });
  },

  e6() {
    const my = token;
    const ROUNDS = 10;
    let hard = false;
    let round = 0;
    let right = 0;
    let q = null;
    let done = true;
    panel(`<div class="ap-chips" data-levels><button type="button" data-l="easy" aria-pressed="true">🐣 Easy</button><button type="button" data-l="hard" aria-pressed="false">🦁 Harder</button></div><p class="ap-status" data-status></p><div class="ap-buttons" data-answers></div>`);
    const SETS = {
      loud: [{ v: "loud", icon: "🐘", label: "Loud" }, { v: "soft", icon: "🐭", label: "Soft" }],
      long: [{ v: "long", icon: "🐍", label: "Long" }, { v: "short", icon: "🐸", label: "Short" }],
    };
    const WORDS = { loud: "loud, like an elephant 🐘", soft: "soft, like a little mouse 🐭", long: "long, like a snake 🐍", short: "short, like a frog's hop 🐸" };
    const drawStage = (reveal = false) => {
      stage.innerHTML = "";
      view = makeSvg(`0 0 ${W} ${H}`, stage);
      if (!reveal) {
        emoji(view, 500, 230, "👂", 170);
        text(view, 500, 470, q.kind === "loud" ? "loud or soft?" : "long or short?", { "font-size": 44, fill: "#8a7764", "font-weight": 800 });
        return;
      }
      const big = q.answer === "loud" || q.answer === "long";
      emoji(view, 500, 110, SETS[q.kind].find((a) => a.v === q.answer).icon, 120);
      // The sound drawn as a wave: tall = loud, wide = long.
      const amp = q.kind === "loud" ? (big ? 120 : 22) : 70;
      const len = q.kind === "long" ? (big ? 800 : 110) : 600;
      const x0 = 500 - len / 2;
      let d = `M${x0} 360`;
      const waves = Math.max(2, Math.round(len / 40));
      for (let i = 0; i <= waves * 8; i++) {
        const x = x0 + (i / (waves * 8)) * len;
        const fade = q.kind === "long" ? 1 - (i / (waves * 8)) * 0.5 : 1;
        d += `L${x} ${360 - Math.sin((i / 8) * Math.PI * 2) * amp * fade}`;
      }
      el("path", { d, stroke: "var(--accent)", "stroke-width": 6, fill: "none", "stroke-linejoin": "round" }, view);
      text(view, 500, 535, q.kind === "loud" ? (big ? "big wave = loud" : "tiny wave = soft") : big ? "long wave = long sound" : "short wave = short sound", { "font-size": 36, fill: "#7a4520", "font-weight": 900 });
    };
    const play = async (mine = token) => {
      const t0 = MUSIC.now() + 0.08;
      if (q.kind === "loud") {
        const gain = q.answer === "loud" ? (hard ? 0.95 : 1.25) : hard ? 0.32 : 0.1;
        [60, 64, 67, 72].forEach((m, i) => MUSIC.play("piano", m, { gain, at: t0 + i * 0.42, length: 0.45 }));
      } else {
        const length = q.answer === "long" ? (hard ? 1.2 : 2.6) : hard ? 0.45 : 0.14;
        MUSIC.play("piano", 67, { gain: 0.85, at: t0, length });
      }
      await wait(q.kind === "loud" ? 1900 : 2900);
      return mine === token;
    };
    const ask = async () => {
      if (my !== token) return;
      const kind = round % 2 === 0 ? "loud" : "long";
      q = { kind, answer: SETS[kind][Math.random() < 0.5 ? 0 : 1].v };
      drawStage();
      $("[data-status]").textContent = `Question ${round + 1} of ${ROUNDS}`;
      $("[data-answers]").innerHTML = SETS[kind].map((a) => `<button type="button" class="ap-big" data-a="${a.v}" aria-label="${a.label}">${a.icon}</button>`).join("") + `<button type="button" data-again aria-label="Hear it again">🔁</button>`;
      done = true;
      const ok = await sayAsync(kind === "loud" ? "Listen. Is it <b>loud</b> like an elephant 🐘, or <b>soft</b> like a mouse 🐭?" : "Listen. Is the note <b>long</b> like a snake 🐍, or <b>short</b> like a frog's hop 🐸?");
      if (my !== token || !ok) return;
      done = false;
      play();
    };
    $("[data-panel]").onclick = async (event) => {
      if (my !== token) return;
      const lv = event.target.closest("[data-l]");
      if (lv) {
        hard = lv.dataset.l === "hard";
        document.querySelectorAll("[data-l]").forEach((b) => b.setAttribute("aria-pressed", String(b === lv)));
        round = 0;
        right = 0;
        VOICE.hush();
        return ask();
      }
      if (!q) return;
      if (event.target.closest("[data-again]")) return play();
      const button = event.target.closest("[data-a]");
      if (!button || done) return;
      done = true;
      window.OC?.touch();
      window.OC?.count("ear questions");
      round += 1;
      const ok = button.dataset.a === q.answer;
      if (ok) {
        right += 1;
        MUSIC.chime();
        button.classList.add("right");
      } else MUSIC.oops();
      drawStage(true);
      const heard = await sayAsync(`${ok ? pick(PRAISE) : "Good listening!"} It was ${WORDS[q.answer]}.${ok ? "" : " Listen again."}`);
      if (my !== token || !heard) return;
      if (!ok && !(await play())) return;
      await wait(600);
      if (my !== token) return;
      if (round >= ROUNDS) {
        if (right >= 8) {
          shell.mark("e6", { done: true, best: Math.max(right, shell.progress().e6?.best || 0) });
          confetti();
        }
        if (!(await sayAsync(`${right} out of ${ROUNDS}! ${right >= 8 ? (hard ? "Amazing ears! 🎉" : "Amazing ears! 🎉 Try 🦁 Harder.") : "Let's listen some more."}`))) return;
        round = 0;
        right = 0;
        await wait(800);
      }
      if (my === token) ask();
    };
    ask();
  },

  e1() {
    quiz({
      id: "e1",
      answers: [{ v: "up", icon: "🐦", label: "Higher" }, { v: "down", icon: "🐟", label: "Lower" }],
      make(level) {
        const gap = [7, 5, 4, 3, 2, 2, 1][level];
        const a = pickInt(60, 72);
        const up = Math.random() < 0.5;
        const b = up ? a + gap : a - gap;
        return { a, b, up, show: [a, b] };
      },
      play: (q) => seq([q.a, q.b], 0.9),
      judge: (q, v) => (v === "up") === q.up,
      explain: (q) => `The second note went ${q.up ? "up, higher 🐦" : "down, lower 🐟"}.`,
    });
  },
  e2() {
    quiz({
      id: "e2",
      answers: [{ v: "same", icon: "🟰", label: "Same" }, { v: "diff", icon: "≠", label: "Different" }],
      make(level) {
        const len = level < 3 ? 3 : 4;
        const tune = [];
        let m = pick([60, 62, 64, 65, 67]);
        for (let i = 0; i < len; i++) {
          tune.push(m);
          m += pick([-2, -1, 1, 2, 3]);
          m = Math.max(57, Math.min(76, m));
        }
        const same = Math.random() < 0.5;
        const other = [...tune];
        if (!same) {
          const i = pickInt(1, len - 1);
          other[i] += pick(level < 3 ? [-3, 3, 4] : [-1, 1, 2]);
        }
        return { tune, other, same, show: other };
      },
      play: async (q) => {
        seq(q.tune, 0.5);
        await wait(q.tune.length * 500 + 700);
        seq(q.other, 0.5);
      },
      judge: (q, v) => (v === "same") === q.same,
      explain: (q) => (q.same ? "The two tunes were the same." : "One note changed, so they were different."),
    });
  },
  e3() {
    quiz({
      id: "e3",
      answers: [{ v: "step", icon: "👣", label: "Step" }, { v: "skip", icon: "🦘", label: "Skip" }],
      make() {
        const base = pick([60, 62, 64, 65, 67, 69]);
        const steps = Math.random() < 0.5 ? 1 : pick([2, 3, 4]);
        const idx = WHITE.indexOf(base % 12);
        const up = Math.random() < 0.6;
        const targetIdx = idx + (up ? steps : -steps);
        const oct = Math.floor(base / 12) + Math.floor(targetIdx / 7);
        const b = oct * 12 + WHITE[((targetIdx % 7) + 7) % 7];
        return { a: base, b, step: steps === 1, steps, show: [base, b] };
      },
      play: (q) => seq([q.a, q.b], 0.85),
      judge: (q, v) => (v === "step") === q.step,
      explain: (q) => (q.step ? "That was a step: the very next note, like walking 👣." : "That was a skip: it jumped over notes, like a kangaroo 🦘."),
    });
  },
  e4() {
    quiz({
      id: "e4",
      answers: [{ v: "major", icon: "😊", label: "Happy, major" }, { v: "minor", icon: "😢", label: "Sad, minor" }],
      make() {
        const root = pick([60, 62, 64, 65, 67, 69]);
        const major = Math.random() < 0.5;
        return { root, major, show: [root, root + (major ? 4 : 3), root + 7] };
      },
      play: (q) => {
        const t0 = MUSIC.now() + 0.1;
        q.show.forEach((m) => note(m, t0, 1.4));
        q.show.forEach((m, i) => note(m, t0 + 1.7 + i * 0.35, 0.5));
      },
      judge: (q, v) => (v === "major") === q.major,
      explain: (q) => (q.major ? "It was a major chord: bright and happy 😊." : "It was a minor chord: sad or serious 😢."),
    });
  },
  e5() {
    quiz({
      id: "e5",
      answers: Object.entries(INTERVALS).map(([k, [name]]) => ({ v: k, icon: name, label: name })),
      make(level) {
        const pool = level < 2 ? [4, 7, 12] : [2, 4, 5, 7, 12];
        const size = pick(pool);
        const a = pick([60, 62, 64, 65, 67]);
        return { a, b: a + size, size, show: [a, a + size] };
      },
      play: (q) => seq([q.a, q.b], 0.9),
      judge: (q, v) => Number(v) === q.size,
      explain: (q) => `It was a ${INTERVALS[q.size][0]}. It sounds like ${INTERVALS[q.size][1]}.`,
    });
  },
};

    e4: { icon: "😊", title: "Happy or sad?", steps: ["Listen to the chord.", "Bright and happy? Tap 😊.", "Sad or serious? Tap 😢."] },
