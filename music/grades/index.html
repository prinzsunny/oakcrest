<script>// Theory Grades 1–2 (and beyond): clefs, note values, time, accidentals, keys, intervals, triads, Italian terms, transposition.
// Every exercise is generated fresh; every answer is computed by the small music-theory model below (tested in Node).

// ===== MODEL START =====
const GR = (() => {
  const rp = (list) => list[Math.floor(Math.random() * list.length)];
  const ri = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
  const rs = (list) => {
    const out = [...list];
    for (let i = out.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
  };
  const mod = (a, n) => ((a % n) + n) % n;

  // ---------- pitch ----------
  const LET = ["C", "D", "E", "F", "G", "A", "B"];
  const NAT = [0, 2, 4, 5, 7, 9, 11];
  const SIGN = { "-2": "𝄫", "-1": "♭", 0: "", 1: "♯", 2: "𝄪" };
  const WORD = { "-2": "double flat", "-1": "flat", 0: "natural", 1: "sharp", 2: "double sharp" };
  const nt = (l, a, o) => ({ l, a, o });
  function P(s) {
    const m = /^([A-G])(bb|b|##|#|♭|♯|)(-?\d)$/.exec(s);
    return nt(LET.indexOf(m[1]), { "": 0, "#": 1, "♯": 1, "##": 2, b: -1, "♭": -1, bb: -2 }[m[2]], Number(m[3]));
  }
  const stepOf = (n) => n.o * 7 + n.l;
  const midiOf = (n) => (n.o + 1) * 12 + NAT[n.l] + n.a;
  const nameOf = (n) => LET[n.l] + SIGN[n.a];
  const sciOf = (n) => nameOf(n) + n.o;
  const atStep = (s, a = 0) => nt(mod(s, 7), a, Math.floor(s / 7));
  const same = (a, b) => a.l === b.l && a.a === b.a && a.o === b.o;

  // Staff position 0 = bottom line, even = line, odd = space. Treble bottom line E4, bass bottom line G2.
  const CLEFS = {
    treble: { bottom: stepOf(P("E4")), name: "treble clef", alias: "G clef", line: 2, lineNote: "G4" },
    bass: { bottom: stepOf(P("G2")), name: "bass clef", alias: "F clef", line: 6, lineNote: "F3" },
  };
  const posOf = (n, clef) => stepOf(n) - CLEFS[clef].bottom;
  const noteAt = (pos, clef, a = 0) => atStep(pos + CLEFS[clef].bottom, a);
  function ledgers(pos) {
    const out = [];
    for (let p = -2; p >= pos; p -= 2) out.push(p);
    for (let p = 10; p <= pos; p += 2) out.push(p);
    return out;
  }
  const ORD = ["first", "second", "third", "fourth", "fifth"];
  function placeWords(pos) {
    if (pos >= 0 && pos <= 8) return pos % 2 === 0 ? `on the ${ORD[pos / 2]} line (counting from the bottom)` : `in the ${ORD[(pos - 1) / 2]} space (counting from the bottom)`;
    if (pos === -1) return "in the space just below the staff";
    if (pos === 9) return "in the space just above the staff";
    if (pos < -1) return pos % 2 === 0 ? `on the ${ORD[-pos / 2 - 1]} ledger line below the staff` : `just below the ${ORD[(-pos - 1) / 2 - 1]} ledger line below the staff`;
    return pos % 2 === 0 ? `on the ${ORD[(pos - 10) / 2]} ledger line above the staff` : `just above the ${ORD[(pos - 11) / 2]} ledger line above the staff`;
  }
  // Landmarks a reader counts from.
  const LANDMARKS = {
    treble: [[-2, "middle C (C4), on the first ledger line below"], [2, "G4, the line the clef curls around"], [5, "C5, in the third space"], [8, "F5, the top line"], [12, "C6, on the second ledger line above"]],
    bass: [[-2, "E2, on the first ledger line below"], [0, "G2, the bottom line"], [6, "F3, the line between the clef's two dots"], [10, "middle C (C4), on the first ledger line above"]],
  };
  const landmarkFor = (pos, clef) => LANDMARKS[clef].reduce((best, m) => (Math.abs(m[0] - pos) < Math.abs(best[0] - pos) ? m : best));

  // ---------- scales and keys ----------
  const PATTERN = { major: [0, 2, 4, 5, 7, 9, 11, 12], harmonic: [0, 2, 3, 5, 7, 8, 11, 12], melodic: [0, 2, 3, 5, 7, 9, 11, 12], natural: [0, 2, 3, 5, 7, 8, 10, 12] };
  function scaleOf(tonic, form) {
    const s0 = stepOf(tonic);
    const m0 = midiOf(tonic);
    return PATTERN[form].map((semi, i) => {
      const n = atStep(s0 + i);
      n.a = m0 + semi - midiOf(n);
      return n;
    });
  }
  // Tonic chosen so the scale sits comfortably on the treble staff; the bass version is two octaves lower.
  const KEYS = [
    { id: "C", tonic: "C4", mode: "major", grade: 1 },
    { id: "G", tonic: "G4", mode: "major", grade: 1 },
    { id: "D", tonic: "D4", mode: "major", grade: 1 },
    { id: "F", tonic: "F4", mode: "major", grade: 1 },
    { id: "A", tonic: "A4", mode: "major", grade: 2 },
    { id: "Bb", tonic: "Bb4", mode: "major", grade: 2 },
    { id: "Eb", tonic: "Eb4", mode: "major", grade: 2 },
    { id: "a", tonic: "A4", mode: "minor", grade: 2 },
    { id: "e", tonic: "E4", mode: "minor", grade: 2 },
    { id: "d", tonic: "D4", mode: "minor", grade: 2 },
    { id: "E", tonic: "E4", mode: "major", grade: 3 },
    { id: "Ab", tonic: "Ab4", mode: "major", grade: 3 },
    { id: "b", tonic: "B4", mode: "minor", grade: 3 },
    { id: "f#", tonic: "F#4", mode: "minor", grade: 3 },
    { id: "c#", tonic: "C#4", mode: "minor", grade: 3 },
    { id: "g", tonic: "G4", mode: "minor", grade: 3 },
    { id: "c", tonic: "C4", mode: "minor", grade: 3 },
    { id: "f", tonic: "F4", mode: "minor", grade: 3 },
  ];
  const SIG_COUNT = { C: 0, G: 1, D: 2, A: 3, E: 4, F: -1, Bb: -2, Eb: -3, Ab: -4, a: 0, e: 1, b: 2, "f#": 3, "c#": 4, d: -1, g: -2, c: -3, f: -4 };
  const keyById = (id) => KEYS.find((k) => k.id === id);
  const keysFor = (lv) => KEYS.filter((k) => k.grade <= lv);
  // Bass: two octaves lower, unless that would start below the first ledger line (then one octave lower).
  const tonicOf = (key, clef = "treble") => {
    const t = P(key.tonic);
    if (clef !== "bass") return t;
    const two = atStep(stepOf(t) - 14, t.a);
    return stepOf(two) - stepOf(P("G2")) < -2 ? atStep(stepOf(t) - 7, t.a) : two;
  };
  const keyName = (key) => `${nameOf(P(key.tonic))} ${key.mode}`;
  const SHARP_ORDER = [3, 0, 4, 1, 5, 2, 6]; // F C G D A E B
  const FLAT_ORDER = [6, 2, 5, 1, 4, 0, 3]; // B E A D G C F
  const SIG_POS = {
    sharp: { treble: [8, 5, 9, 6, 3, 7, 4], bass: [6, 3, 7, 4, 1, 5, 2] },
    flat: { treble: [4, 7, 3, 6, 2, 5, 1], bass: [2, 5, 1, 4, 0, 3, 6] },
  };
  // The key signature, read off the scale itself (major, or natural minor for a minor key).
  function sigOf(key) {
    const sc = scaleOf(P(key.tonic), key.mode === "major" ? "major" : "natural").slice(0, 7);
    const acc = sc.filter((n) => n.a !== 0);
    if (!acc.length) return { type: null, n: 0, letters: [] };
    const type = acc[0].a > 0 ? "sharp" : "flat";
    const order = type === "sharp" ? SHARP_ORDER : FLAT_ORDER;
    const letters = acc.map((n) => n.l).sort((x, y) => order.indexOf(x) - order.indexOf(y));
    return { type, n: letters.length, letters };
  }
  function sigPositions(key, clef) {
    const s = sigOf(key);
    if (!s.n) return [];
    return SIG_POS[s.type][clef].slice(0, s.n).map((pos) => ({ pos, a: s.type === "sharp" ? 1 : -1 }));
  }
  const sigMap = (key) => {
    const s = sigOf(key);
    const map = {};
    for (const l of s.letters) map[l] = s.type === "sharp" ? 1 : -1;
    return map;
  };
  const sigWords = (key) => {
    const s = sigOf(key);
    if (!s.n) return "no sharps or flats";
    return `${s.n} ${s.type}${s.n > 1 ? "s" : ""} (${s.letters.map((l) => LET[l] + SIGN[s.type === "sharp" ? 1 : -1]).join(", ")})`;
  };
  const relativeOf = (key) => KEYS.find((k) => k.mode !== key.mode && SIG_COUNT[k.id] === SIG_COUNT[key.id]);

  // ---------- intervals ----------
  const NUM = ["", "unison", "2nd", "3rd", "4th", "5th", "6th", "7th", "8ve"];
  const NUM_WORD = ["", "unison", "second", "third", "fourth", "fifth", "sixth", "seventh", "octave"];
  function intervalOf(lo, hi) {
    const num = stepOf(hi) - stepOf(lo) + 1;
    const semis = midiOf(hi) - midiOf(lo);
    const base = { 1: 0, 2: 2, 3: 4, 4: 5, 5: 7, 6: 9, 7: 11, 8: 12 }[num];
    const d = semis - base;
    const perfect = [1, 4, 5, 8].includes(num);
    const q = perfect ? { 0: "perfect", 1: "augmented", "-1": "diminished" }[d] : { 0: "major", "-1": "minor", 1: "augmented", "-2": "diminished" }[d];
    return { num, semis, q };
  }

  // ---------- accidentals within a bar ----------
  // events: [{ pos, acc: null | -1 | 0 | 1, bar, tie (tied from the previous note) }]
  function effAcc(events, i, clef, sig = {}) {
    const e = events[i];
    if (e.acc !== null && e.acc !== undefined) return { acc: e.acc, why: "written" };
    if (e.tie && i > 0) return { acc: effAcc(events, i - 1, clef, sig).acc, why: "tie", from: i - 1 };
    for (let j = i - 1; j >= 0 && events[j].bar === e.bar; j--) if (events[j].pos === e.pos && events[j].acc !== null && events[j].acc !== undefined) return { acc: events[j].acc, why: "bar", from: j };
    const l = noteAt(e.pos, clef).l;
    return { acc: sig[l] || 0, why: sig[l] ? "key" : "none" };
  }

  // ---------- rhythm ----------
  const VAL = {
    sb: { d: 4, uk: "semibreve", us: "whole note" },
    dm: { d: 3, uk: "dotted minim", us: "dotted half note" },
    m: { d: 2, uk: "minim", us: "half note" },
    dc: { d: 1.5, uk: "dotted crotchet", us: "dotted quarter note" },
    c: { d: 1, uk: "crotchet", us: "quarter note" },
    dq: { d: 0.75, uk: "dotted quaver", us: "dotted eighth note" },
    q: { d: 0.5, uk: "quaver", us: "eighth note" },
    sq: { d: 0.25, uk: "semiquaver", us: "sixteenth note" },
  };
  const restName = (v) => `${VAL[v].uk} rest (${VAL[v].us.replace(" note", " rest")})`;
  const noteName = (v) => `${VAL[v].uk} (${VAL[v].us})`;
  const TIMES = {
    "2/4": { top: 2, bot: 4, bar: 2, beat: 1 },
    "3/4": { top: 3, bot: 4, bar: 3, beat: 1 },
    "4/4": { top: 4, bot: 4, bar: 4, beat: 1 },
    "2/2": { top: 2, bot: 2, bar: 4, beat: 2 },
    "3/2": { top: 3, bot: 2, bar: 6, beat: 2 },
    "3/8": { top: 3, bot: 8, bar: 1.5, beat: 0.5 },
  };
  const BEAT_NOTE = { 2: "m", 4: "c", 8: "q" };
  const timesFor = (lv) => (lv >= 3 ? ["2/4", "3/4", "4/4", "2/2", "3/2", "3/8"] : ["2/4", "3/4", "4/4"]);
  const sumD = (items) => items.reduce((s, it) => s + VAL[it.v].d, 0);
  const frac = (d) => {
    const w = Math.floor(d + 1e-9);
    const f = Math.round((d - w) * 4);
    const tail = ["", "¼", "½", "¾"][f];
    return w ? `${w}${tail}` : tail || "0";
  };

  function weighted(cands) {
    const list = cands.filter(Boolean);
    let r = Math.random() * list.reduce((s, c) => s + c.w, 0);
    for (const c of list) if ((r -= c.w) <= 0) return c;
    return list[list.length - 1];
  }
  let beamId = 0;
  // Fill the span [from, to) of a bar with correctly grouped notes. Durations in crotchet units.
  function fill(ts, from, to, lv) {
    const T = TIMES[ts];
    const out = [];
    let p = from;
    const push = (vs, beamed) => {
      const id = beamed ? ++beamId : 0;
      for (const v of vs) out.push({ t: "n", v, beam: VAL[v].d < 1 && beamed ? id : 0 });
    };
    let guard = 0;
    while (p < to - 1e-9 && guard++ < 40) {
      const left = to - p;
      let c;
      if (T.bot === 4) {
        const strong2 = T.top === 4 ? p === 0 || p === 2 : T.top === 2 ? p === 0 : p <= 1;
        c = weighted([
          left >= 1 && { it: ["c"], w: 3 },
          left >= 1 && { it: ["q", "q"], beam: true, w: 2.5 },
          left >= 1 && lv >= 2 && { it: ["sq", "sq", "sq", "sq"], beam: true, w: 1 },
          left >= 1 && lv >= 3 && { it: ["dq", "sq"], beam: true, w: 1 },
          left >= 2 && strong2 && { it: ["m"], w: 2 },
          left >= 2 && strong2 && { it: ["dc", "q"], w: 1.2 },
          left >= 3 && ((T.top === 3 && p === 0) || (T.top === 4 && p <= 1)) && { it: ["dm"], w: 1.4 },
          left >= 4 && T.top === 4 && p === 0 && { it: ["sb"], w: 0.6 },
        ]);
      } else if (T.bot === 2) {
        if (Math.abs(p % 2 - 1) < 1e-9) c = { it: ["c"] };
        else
          c = weighted([
            left >= 2 && { it: ["m"], w: 3 },
            left >= 2 && { it: ["c", "c"], w: 2 },
            left >= 2 && { it: ["c", "q", "q"], beamTail: true, w: 1.5 },
            left >= 4 && (p === 0 || (T.top === 3 && p === 2)) && { it: ["sb"], w: 1 },
            left >= 4 && (p === 0 || (T.top === 3 && p === 2)) && { it: ["dm", "c"], w: 1 },
          ]);
      } else {
        c = weighted([left >= 1.5 && { it: ["q", "q", "q"], beam: true, w: 2 }, left >= 1.5 && { it: ["c", "q"], w: 1.5 }, left >= 1.5 && { it: ["dc"], w: 1 }, left < 1.5 && { it: ["q"], w: 1 }]);
      }
      if (c.beamTail) {
        push(["c"], false);
        push(["q", "q"], true);
      } else push(c.it, !!c.beam);
      p += c.it.reduce((s, v) => s + VAL[v].d, 0);
    }
    return out;
  }
  const melody = (items, lo = 1, hi = 7) => {
    let pos = ri(lo + 1, hi - 1);
    for (const it of items) {
      if (it.t !== "n") continue;
      pos = Math.max(lo, Math.min(hi, pos + rp([-2, -1, -1, 0, 1, 1, 2])));
      it.pos = pos;
    }
    return items;
  };
  const barOf = (ts, lv) => fill(ts, 0, TIMES[ts].bar, lv);

  // ---------- generators (data only; the page draws them) ----------
  const CL = () => rp(["treble", "bass"]);
  const RANGE = { 1: [0, 8], 2: [-4, 12], 3: [-6, 14] };

  function genClef(lv, mode) {
    const clef = CL();
    const [lo, hi] = RANGE[lv];
    let pos = ri(lo, hi);
    if (lv === 1 && Math.random() < 0.15) pos = clef === "treble" ? -2 : 10;
    const note = noteAt(pos, clef);
    const lm = landmarkFor(pos, clef);
    const dist = pos - lm[0];
    const why = `This note is ${placeWords(pos)} of the ${CLEFS[clef].name}, so it is ${sciOf(note)}${sciOf(note) === "C4" ? " (middle C)" : ""}. Count from ${lm[1]}: ${dist === 0 ? "it is that very note" : `${Math.abs(dist)} step${Math.abs(dist) > 1 ? "s" : ""} ${dist > 0 ? "up" : "down"} (each step is the next line or space) reaches ${LET[note.l]}`}.${ledgers(pos).length ? ` It needs ${ledgers(pos).length} ledger line${ledgers(pos).length > 1 ? "s" : ""}.` : ""}`;
    return { clef, pos, note, mode, any: lv === 1 && mode === "place", range: [Math.min(lo, -2), Math.max(hi, 10)], lm, ans: mode === "name" ? note.l : pos, why };
  }

  const NOTE_POOL = { 1: ["sb", "m", "c", "q", "dm", "dc"], 2: ["sb", "m", "c", "q", "sq", "dm", "dc"], 3: ["sb", "m", "c", "q", "sq", "dm", "dc", "dq"] };
  const REST_POOL = { 1: ["sb", "m", "c", "q"], 2: ["sb", "m", "c", "q", "sq"], 3: ["sb", "m", "c", "q", "sq", "dc"] };
  function genValue(lv, kind) {
    if (kind === "name") {
      const rest = Math.random() < 0.4;
      const pool = rest ? REST_POOL[lv] : NOTE_POOL[lv];
      const v = rp(pool);
      const label = rest ? restName : noteName;
      const opts = rs([v, ...rs(pool.filter((x) => x !== v)).slice(0, 3)]);
      return { kind, rest, v, ans: v, opts: opts.map((x) => ({ label: label(x), v: x })), why: rest ? `This is a ${restName(v)}: ${frac(VAL[v].d)} crotchet beat${VAL[v].d === 1 ? "" : "s"} of silence. ${REST_SHAPE[v]}` : `This is a ${noteName(v)}, worth ${frac(VAL[v].d)} crotchet beat${VAL[v].d === 1 ? "" : "s"}. ${NOTE_SHAPE[v]}` };
    }
    if (kind === "equal") {
      const pairs = [];
      const pool = NOTE_POOL[lv];
      for (const a of pool) for (const b of pool) if (VAL[a].d > VAL[b].d && Number.isInteger(VAL[a].d / VAL[b].d) && !(b.startsWith("d") && lv < 3)) pairs.push([a, b]);
      const [a, b] = rp(pairs);
      const n = VAL[a].d / VAL[b].d;
      return { kind, a, b, ans: n, why: `A ${noteName(a)} lasts ${frac(VAL[a].d)} crotchet beat${VAL[a].d === 1 ? "" : "s"}; a ${noteName(b)} lasts ${frac(VAL[b].d)}. ${frac(VAL[a].d)} ÷ ${frac(VAL[b].d)} = ${n}, so ${n} ${VAL[b].uk}s fill the same time.` };
    }
    // tie or dot: total length in crotchet beats
    const tiePool = lv === 1 ? ["m", "c", "q", "dm", "dc"] : lv === 2 ? ["sb", "m", "c", "q", "dm", "dc", "sq"] : ["sb", "m", "c", "q", "dm", "dc", "sq", "dq"];
    const count = lv === 3 && Math.random() < 0.5 ? 3 : 2;
    const vs = Array.from({ length: count }, () => rp(tiePool));
    const total = vs.reduce((s, v) => s + VAL[v].d, 0);

// A tappable band over the staff: the nearest line or space under the pointer.

// A piano keyboard drawn in the stage (tap a key to hear it).
function keyboard(parent, { low, high, x, y, w, h }) {

// ---------- sound ----------
const BPM = 92;
function playSeq(seq, { bpm = BPM, gain = 0.8 } = {}) {
  const t0 = MUSIC.now() + 0.08;
  const beat = 60 / bpm;
  let t = t0;
  for (const s of seq) {
    const ms = s.m === null || s.m === undefined ? [] : [].concat(s.m);
    for (const m of ms) MUSIC.play("piano", m, { gain: s.gain ?? gain, at: t, length: s.len ?? Math.max(0.12, s.d * beat * 0.92) });
    if (s.tick) MUSIC.tick(s.tick === 2, t);
    t += s.d * beat;
  }
  return t - t0;
}
const playNotes = (notes, d = 0.8, opts) => playSeq(notes.map((n) => ({ m: midiOf(n), d })), opts);
const playChord = (notes, at = 0) => playSeq([{ m: notes.map(midiOf), d: 2, len: 1.6 }]);
// Pitched playback of a rhythm drawn on a staff (accidentals as written).
function playItems(items, clef, { bpm = BPM } = {}) {
  const seq = [];
  items.forEach((it) => {
    if (it.t === "n") {
      if (it.tie) seq[seq.length - 1].d += VAL[it.v].d;
      else seq.push({ m: midiOf(noteAt(it.pos, clef, it.acc || 0)), d: VAL[it.v].d });
    } else if (it.t === "r") seq.push({ m: null, d: it.whole ? it.whole : VAL[it.v].d });
  });
  seq.forEach((s) => (s.len = Math.max(0.12, s.d * (60 / bpm) * 0.92)));
  return playSeq(seq, { bpm });
}

const LOW = { x: 24, y: 350, w: 952, h: 198 };
const RIGHT = { x: 600, y: 16, w: 384, h: 528 };
function notes(lines, { title = "🔎 How we know", region = LOW, tone = "work" } = {}) {
  view.querySelector(".gr-notes")?.remove();
  const g = el("g", { class: "gr-notes" }, view);
  let font = 26;
  const fit = () => {
    const per = Math.floor((region.w - 40) / (font * 0.53));
    return lines.flatMap((l) => wrap(l, per));
  };
  let rows = fit();
  while (60 + rows.length * font * 1.34 > region.h && font > 22) {
    font -= 1;
    rows = fit();
  }
  const lh = font * 1.34;
  const h = Math.min(region.h, 58 + rows.length * lh);
  const work = tone === "work";
  el("rect", { x: region.x, y: region.y, width: region.w, height: h, rx: 22, fill: work ? "#f1faf3" : "#fff8ea", stroke: work ? "#8fcf9f" : "#e0b872", "stroke-width": 3 }, g);

}

// ---------- the question engine: ask, a hint after an honest attempt, the reasoning after two ----------
// q: { draw(api), ask, voice?, opts?, pad?, ans, ok?(v), hint(v), why, work?, region?, play?(), after?(api, won), parts?, askPart?(i), revealPart?(i) }
let liveQ = null;
function quiz(id, cfg) {
  const my = token;
  const R = cfg.R || 8;
  let level = shell.progress()[id]?.level || "easy";
  let round = 0;
  let first = 0;
  let tries = 0;
  let missed = false;
  let q = null;
  let busy = false;
  let pad = null;
  panel(`${topRow(level)}<div class="gr-in" data-in></div>`);
  const host = $("[data-in]");
  $("[data-hear]").onclick = () => {
    window.OC?.touch();
    VOICE.hush();
    q?.play?.();
  };
  const status = () => setStatus(`Question ${Math.min(round + 1, R)} of ${R}`);
  const isRight = (v) => (q.ok ? q.ok(v) : v === q.ans);
  const ask = () => {
    if (my !== token) return;
    tries = 0;
    missed = false;
    busy = false;
    q = cfg.make(LV[level], round);
    q.part = 0;
    liveQ = q;
    const qq = q;
    q.api = anim(() => my === token && q === qq);
    q.api.answer = (v) => answer(v, null);
    fresh();
    q.draw(q.api);
    status();
    host.onclick = null;
    host.classList.toggle("gr-pick", !!q.opts);
    host.classList.toggle("gr-many", !!q.opts && q.opts.length > 4);
    pad = null;
    if (q.opts) choices(host, q.opts, (o, b) => answer(o.v, b));
    else if (q.pad) pad = numpad(host, { onEnter: (v) => answer(v), max: 3 });
    else host.innerHTML = `<p class="gr-tapnote">${q.tapNote || "Tap the staff to answer."}</p>`;
    talk(q.parts ? `${q.ask} ${q.askPart(0)}` : q.ask, q.voice);
    $("[data-hear]").hidden = !q.play;
    if (q.play && q.autoplay !== false) setTimeout(() => my === token && q === qq && q.play(), 600);
  };
  const settle = async (won) => {
    busy = true;
    const qq = q;
    host.querySelectorAll("button").forEach((b) => (b.disabled = true));
    const lead = won ? (tries || missed ? "Correct — your persistence paid off." : pick(EFFORT).replace(/[:.]$/, ".")) : "Here is the answer.";
    talk(`${lead} Read the reasoning in <b>How we know</b>.`, `${lead} ${q.why}`);
    notes(q.work || [q.why], { region: q.region || LOW });
    await quiet(q.after?.(q.api, won));
    if (my !== token || q !== qq) return;
    host.classList.remove("gr-pick", "gr-many");
    host.innerHTML = `<div class="ap-buttons"><button type="button" class="primary" data-next>${round + 1 >= R ? "Finish ▶" : "Next ▶"}</button></div>`;
    host.onclick = (event) => {
      if (!event.target.closest("[data-next]")) return;
      window.OC?.touch();
      VOICE.hush();
      round += 1;
      if (round >= R) finishGame(id, host, { R, first, again: restart });
      else ask();
    };
  };
  // Returns true (right), false (wrong) or null (ignored), so tap-based questions can colour what was tapped.
  const answer = (v, button) => {
    if (my !== token || busy) return null;
    window.OC?.touch();
    if (isRight(v)) {
      button?.classList.add("right");
      MUSIC.chime();
      if (q.parts && q.part < q.parts - 1) {
        q.part += 1;
        tries = 0;
        talk(`${pick(["Correct.", "Exactly.", "Right."])} ${q.askPart(q.part)}`);
        return true;
      }
      if (tries === 0 && !missed) first += 1;
      window.OC?.count(cfg.count);
      settle(true);
      return true;
    }
    tries += 1;
    button?.classList.add("wrong");
    MUSIC.oops();
    if (tries < 2) {
      pad?.clear();
      talk(`${pick(NUDGE)} ${q.hint(v)}`);
      return false;
    }
    missed = true;
    if (q.parts && q.part < q.parts - 1) {
      quiet(q.revealPart(q.part));
      q.part += 1;
      tries = 0;
      talk(`Here is that note, with the reasoning: ${q.partWhy(q.part - 1)} ${q.askPart(q.part)}`);
      return false;
    }
    if (q.parts) quiet(q.revealPart(q.part));
    if (q.opts) {
      host.querySelectorAll("[data-c]").forEach((b, i) => {
        if (isRight(q.opts[i].v)) b.classList.add("right");
      });
    } else pad?.set(q.ans);
    settle(false);
    return false;
  };
  const restart = () => {
    round = 0;
    first = 0;
    ask();
  };
  $("[data-levels]").addEventListener("click", (event) => {
    const b = event.target.closest("[data-lv]");
    if (!b) return;
    document.querySelectorAll("[data-lv]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    level = b.dataset.lv;
    shell.mark(id, { level });
    window.OC?.touch();
    VOICE.hush();
    restart();
  });
  ask();
}
const rot = (round, list) => list[round % list.length];
const stdStaff = (clef, extra = {}) => staff(view, { x0: 70, x1: 930, yb: 236, g: 26, clef, ...extra });
const accWritten = (n, sig = {}) => (n.a !== (sig[n.l] || 0) ? n.a : null);
// Little "?" pointer above a note.
function pointer(x, y, color = HOT) {
  const g = el("g", { class: "gr-pointer" }, view);
  el("path", { d: `M${x - 14} ${y - 34}L${x + 14} ${y - 34}L${x} ${y - 12}Z`, fill: color }, g);
  text(g, x, y - 44, "?", { "font-size": 34, fill: color });
  return g;
}

// ================= 1. Clefs =================
function clefCase(lv, round) {
  const mode = rot(round, ["name", "place"]);
  const d = GR.genClef(lv, mode);
  const midi = midiOf(d.note);
  const sci = sciOf(d.note);
  let S;
  let placed = null;
  const NX = 560;
  const q = {
    ...d,
    opts: mode === "name" ? LET.map((l, i) => ({ label: l, v: i })) : null,
    ok: mode === "place" ? (pos) => (d.any ? noteAt(pos, d.clef).l === d.note.l : pos === d.pos) : null,
    ask: mode === "name" ? `Name this note in the ${CLEFS[d.clef].name}.` : d.any ? `Place any ${LET[d.note.l]} on this ${d.clef} staff.` : `Place ${sci}${sci === "C4" ? " (middle C)" : ""} on this ${d.clef} staff.`,
    voice: mode === "place" && !d.any ? `Place ${spoken(sci)}${sci === "C4" ? ", middle C," : ""} on this ${d.clef} staff.` : undefined,
    tapNote: "Tap a line or a space on the staff. Ledger lines appear as you need them.",
    draw(api) {
      S = stdStaff(d.clef);
      q.S = S;
      const x = header(S);
      text(view, 500, 40, mode === "name" ? "Name the note" : d.any ? `Place a ${LET[d.note.l]}` : `Place ${sci}`, { "font-size": 30, fill: SOFT });
      if (mode === "name") note(S, NX, d.pos, { v: "sb" });
      else
        tapStaff(S, {
          lo: d.range[0],
          hi: d.range[1],
          x0: x,
          x1: 930,
          ghostX: NX,
          onPick: (pos) => {
            placed?.remove();
            const n = note(S, NX, pos, { v: "sb", color: HOT });
            placed = n.grp;
            MUSIC.play("piano", midiOf(noteAt(pos, d.clef)), { gain: 0.8, length: 1.1 });
            const res = api.answer(pos);
            if (res === null) return placed.remove();
            recolor(placed, res ? GREEN : WRONG);
          },
        });
    },
    play: mode === "name" ? () => MUSIC.play("piano", midi, { gain: 0.85, length: 1.4 }) : null,
    hint(v) {
      const lm = d.lm[1];
      if (mode === "name") return `You chose ${LET[v]}. Start from a landmark you know for certain — ${lm} — and step one letter per line or space toward the note. Where do you arrive?`;
      const got = noteAt(v, d.clef);
      return `You placed ${sciOf(got)}. ${d.any ? "" : `Octave numbers change at each C: ${sciOf(d.note)} lies ${stepOf(d.note) >= 28 ? "at or above" : "below"} middle C (C4). `}Start from ${lm}: which way, and how many steps?`;
    },
    async after(api, won) {
      MUSIC.play("piano", midi, { gain: 0.85, length: 1.4 });
      if (mode === "place" && !won) {
        placed?.remove();
        note(S, NX, d.pos, { v: "sb", color: GREEN });
      }
      if (mode === "name") note(S, NX, d.pos, { v: "sb", color: GREEN });
      text(view, NX + 70, S.y(d.pos) + 10, sci, { "font-size": 30, fill: GREEN, "text-anchor": "start" });
    },
  };
  return q;
}

// ================= 2. Note and rest values =================
function valueCase(lv, round) {
  const kind = rot(round, ["name", "equal", "tie"]);
  const d = GR.genValue(lv, kind);
  let S;
  const q = { ...d };
  const pos = pickInt(2, 6);
  if (kind === "name") {
    q.ask = d.rest ? "Name this rest. Give both names: British (American)." : "Name this note. Give both names: British (American).";
    q.draw = () => {
      S = staff(view, { x0: 250, x1: 750, yb: 236, g: 30, clef: "treble" });
      header(S);
      if (d.rest) rest(S, 540, d.v);
      else note(S, 540, pos, { v: d.v });
    };
    q.play = () => (d.rest ? playSeq([{ m: null, d: 0, tick: 2 }, ...Array.from({ length: Math.max(1, Math.round(VAL[d.v].d)) }, () => ({ m: null, d: 1, tick: 1 }))]) : playSeq([{ m: midiOf(noteAt(pos, "treble")), d: VAL[d.v].d }]));
    q.hint = () => (d.rest ? "Where does the rest sit: hanging below a line, sitting on one, a zigzag, or a hook with flags? Count any flags." : "Look closely: is the head hollow or filled? Is there a stem? How many flags? Is there a dot?");
  } else if (kind === "equal") {
    q.pad = true;
    q.ask = `How many ${VAL[d.b].uk}s (${VAL[d.b].us}s) last as long as one ${VAL[d.a].uk} (${VAL[d.a].us})?`;
    q.draw = () => {
      S = staff(view, { x0: 120, x1: 880, yb: 236, g: 28, clef: "treble" });
      header(S);
      note(S, 360, 3, { v: d.a });
      text(view, 520, S.y(4) + 14, "=", { "font-size": 64, fill: INK });
      text(view, 640, S.y(4) + 14, "? ×", { "font-size": 50, fill: HOT });
      note(S, 760, 3, { v: d.b });
    };
    q.play = () => playSeq([{ m: 64, d: VAL[d.a].d }, ...Array.from({ length: Math.min(16, d.ans) }, () => ({ m: 67, d: VAL[d.b].d }))]);
    q.hint = (v) => `You said ${v}. How many crotchet beats is a ${VAL[d.a].uk}? And a ${VAL[d.b].uk}? How many of the second fit into the first?`;
  } else {
    q.ask = d.vs.length > 2 ? "These three notes are tied. How many crotchet beats does the sound last?" : "These notes are tied. How many crotchet beats does the sound last?";
    q.draw = () => {
      S = staff(view, { x0: 120, x1: 880, yb: 236, g: 28, clef: "treble" });
      const x = header(S);
      const items = d.vs.map((v, i) => ({ t: "n", v, pos: 3, tie: i > 0 }));
      music(S, items, x + 40, 860, { maxUnit: 2.2 });
    };
    q.play = () => playSeq([{ m: 64, d: d.ans }]);
    q.hint = () => "Find each note's value in crotchet beats (a dot adds half the note's own value). A tie joins them into one sound, so add them.";
  }
  return q;
}

// ================= 3. Time signatures =================
function timeCase(lv, round) {
  const kind = rot(round, ["which", "barline", "rest", "meaning"]);
  const d = GR.genTime(lv, kind);
  const T = TIMES[d.ts];
  const q = { ...d };
  let S;
  if (kind === "which") {
    const items = [...d.bars[0], { t: "bar" }, ...d.bars[1], { t: "end" }];
    q.ask = "Which time signature fits these bars?";
    q.draw = () => {
      S = stdStaff("treble", { yb: 220 });
      const x = header(S);
      text(view, x + 30, S.y(4) + 18, "?", { "font-size": 60, fill: HOT });
      music(S, items, x + 80, 930);
    };
    q.play = () => playItems(items, "treble");
    q.hint = () => "Add up one bar in crotchet beats (a quaver is ½, a minim 2). Which time signature holds exactly that many?";
  } else if (kind === "barline") {
    const items = [];
    d.bars.forEach((b, i) => {
      items.push(...b);
      if (i < d.bars.length - 1 && i !== d.missing) items.push({ t: "bar" });
    });
    items.push({ t: "end" });
    q.ask = "One barline is missing. Tap the gap where it belongs.";
    q.tapNote = "Tap between two notes on the staff.";
    q.draw = (api) => {
      S = stdStaff("treble", { yb: 220 });
      const x = header(S, { ts: d.ts });
      music(S, items, x + 10, 930);
      let cum = 0;
      items.forEach((it, i) => {
        if (it.t === "n" || it.t === "r") cum += VAL[it.v].d;
        const next = items[i + 1];
        if (!(it.t === "n" || it.t === "r") || !next || !(next.t === "n" || next.t === "r")) return;
        const at = cum;
        const gx = Math.max(it.x + 0.9 * S.g, Math.min(next.x - 1.6 * S.g, it.slot[1]));
        const guide = el("line", { x1: gx, x2: gx, y1: S.y(8) - 6, y2: S.y(0) + 6, stroke: "#d8c9b3", "stroke-width": 2, "stroke-dasharray": "4 6" }, S.layer);
        const hit = el("rect", { class: "gr-tap", x: it.x + 0.7 * S.g, y: S.y(12), width: Math.max(16, next.x - it.x - 1.4 * S.g), height: S.y(-4) - S.y(12), fill: "transparent" }, S.node);
        hit.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          const res = api.answer(at);
          if (res === null) return;
          guide.setAttribute("stroke", res ? GREEN : WRONG);
          guide.setAttribute("stroke-dasharray", res ? "" : "4 6");
          guide.setAttribute("stroke-width", 3);
          it.gx = gx;
        });
        it.guide = guide;
        it.cumAt = at;
      });
      q.items = items;
    };
    q.play = () => playItems(items, "treble");
    q.hint = () => `Start after the time signature (or after a barline) and add the note values. In ${d.ts}, where does the total first reach ${GR.frac(T.bar)} crotchet beat${T.bar === 1 ? "" : "s"}?`;
    q.after = () => {
      const it = q.items.find((x) => x.cumAt !== undefined && q.ok(x.cumAt));
      if (it) {
        it.guide.setAttribute("stroke", GREEN);
        it.guide.setAttribute("stroke-dasharray", "");
        it.guide.setAttribute("stroke-width", 3);
      }
    };
  } else if (kind === "rest") {
    const items = d.items.map((it) => ({ ...it }));
    const gap = items.find((it) => it.gap);
    if (d.spec.whole) gap.whole = T.bar;
    q.ask = d.spec.whole ? "This whole bar is silent. Which rest fills it?" : "One rest is missing (in the dashed box). Which single rest completes the bar?";
    q.draw = () => {
      S = stdStaff("treble", { yb: 220 });
      const x = header(S, { ts: d.ts });
      const shown = items.map((it) => (it.gap ? { ...it, color: "transparent" } : it));
      music(S, [...shown, { t: "end" }], x + 10, 930, { maxUnit: 2 });
      const gi = shown.find((it) => it.gap);
      gap.x = gi.x;
      el("rect", { x: gi.x - 1.1 * S.g, y: S.y(9), width: 2.2 * S.g, height: 5 * S.g, rx: 10, fill: "none", stroke: HOT, "stroke-width": 3, "stroke-dasharray": "8 6" }, S.layer);
    };
    q.play = () => playItems(items, "treble");
    q.hint = () => (d.spec.whole ? "When a whole bar is silent, one particular rest is used whatever the time signature. Which?" : `Add the notes in the bar. ${d.ts} needs ${GR.frac(T.bar)} crotchet beats in total: how many are missing, and does the gap begin on a beat?`);
    q.after = () => rest(S, gap.x, d.spec.v, { color: GREEN });
  } else {
    q.ask = d.ask;
    q.draw = () => {
      S = staff(view, { x0: 150, x1: 850, yb: 236, g: 30, clef: "treble" });
      const x = header(S, { ts: d.ts });
      const bar = GR.melody(GR.barOf(d.ts, Math.min(lv, 2)));
      music(S, [...bar, { t: "end" }], x + 10, 850, { maxUnit: 1.6 });
      q.bar = bar;
    };
    q.play = () => playItems(q.bar, "treble");
    q.hint = () => "The top number counts beats in a bar. The bottom number names the beat as a fraction of a semibreve: 2 = minims, 4 = crotchets, 8 = quavers.";
  }
  return q;
}

// ================= 4. Accidentals =================
function accidentalCase(lv) {
  const d = GR.genAccidental(lv);
  const sig = d.key ? GR.sigMap(d.key) : {};
  let S;
  const items = [];
  d.events.forEach((e, i) => {
    if (i === 4) items.push({ t: "bar" });
    items.push({ t: "n", v: "c", pos: e.pos, acc: e.acc, tie: e.tie, color: i === d.target ? HOT : INK, i });
  });
  items.push({ t: "end" });
  const q = {
    ...d,
    ask: `What is the highlighted note${d.key ? ` (the key signature is ${GR.keyName(d.key)})` : ""}?`,
    draw() {
      S = stdStaff(d.clef);
      const x = header(S, { sig: d.key ? GR.sigPositions(d.key, d.clef) : [] });
      music(S, items, x + 10, 930);
      const t = items.find((it) => it.i === d.target);
      pointer(t.x, Math.min(S.y(10), t.y - 3.6 * S.g));
      q.t = t;
    },
    play() {
      const seq = d.events.map((e, i) => ({ m: midiOf(noteAt(e.pos, d.clef, GR.effAcc(d.events, i, d.clef, sig).acc)), d: 1, tie: e.tie }));
      const out = [];
      seq.forEach((s) => (s.tie ? (out[out.length - 1].d += 1) : out.push(s)));
      return playSeq(out, { bpm: 100 });
    },
    hint: () => `Look back along this bar to the left: has the same line or space already had a sharp, flat or natural? Is there a barline in between?${d.key ? " And what does the key signature say?" : ""}`,
    after() {
      text(view, q.t.x, Math.max(S.y(-3), q.t.y + 3.4 * S.g) + 34, nameOf(d.note), { "font-size": 30, fill: GREEN });
    },
  };
  return q;
}

// ================= 5. Scales and key signatures =================
function scaleCase(lv, round) {
  const kinds = lv === 1 ? ["sig", "pick", "missing", "semitones"] : ["sig", "pick", "missing", "semitones", "minor"];
  const kind = rot(round, kinds);
  const d = GR.genScale(lv, kind);
  const q = { ...d };
  let S;
  const scaleItems = (sc, sig = {}) => sc.map((n, i) => ({ t: "n", v: "sb", pos: posOf(n, d.clef), acc: accWritten(n, sig), i }));
  if (kind === "sig") {
    q.ask = `Which ${d.mode} key has this key signature?`;
    q.draw = () => {
      S = staff(view, { x0: 230, x1: 770, yb: 236, g: 30, clef: d.clef });
      header(S, { sig: GR.sigPositions(d.key, d.clef) });
    };
    q.play = null;
    q.hint = () => (d.mode === "major" ? "With sharps, the key note is a semitone above the last sharp. With flats, the second-to-last flat names the key; one flat alone means F major." : "Find the major key with this signature first. Its relative minor begins on its 6th degree, three semitones below the major key note.");
    q.after = () => {
      const sc = GR.scaleOf(GR.tonicOf(d.key, d.clef), d.key.mode === "major" ? "major" : "harmonic");
      playNotes(sc, 0.6, { bpm: 132 });
    };
  } else if (kind === "pick") {
    q.ask = `Which shows the correct key signature of ${GR.keyName(d.key)}?`;
    q.draw = () => {
      d.cards.forEach((c, i) => {
        const x0 = 30 + i * 320;
        text(view, x0 + 150, 76, ["A", "B", "C"][i], { "font-size": 40, fill: "var(--accent-dark)" });
        const s = staff(view, { x0, x1: x0 + 290, yb: 236, g: 24, clef: d.clef });
        header(s, { sig: c.list });
        c.s = s;
      });
    };
    q.hint = () => `Check three things: the order (${GR.sigOf(d.key).type === "sharp" ? "sharps F C G D A E B" : "flats B E A D G C F"}), the octave of each sign, and the clef.`;
    q.after = () => {
      const i = d.cards.findIndex((c) => c.ok);
      el("rect", { x: 22 + i * 320, y: 40, width: 306, height: 290, rx: 20, fill: "none", stroke: GREEN, "stroke-width": 5 }, view);
    };
  } else if (kind === "missing") {
    const items = scaleItems(d.shown);
    q.ask = `This is the scale of ${GR.keyName(d.key)}${d.form !== "major" ? ` (${d.form}${d.form === "melodic" ? ", ascending" : ""})` : ""}, written with accidentals. One accidental is missing: tap that note.`;
    q.tapNote = "Tap the note that needs a sharp, flat or natural.";
    q.draw = (api) => {
      S = stdStaff(d.clef);
      const x = header(S);
      music(S, [...items, { t: "end" }], x + 10, 930);
      items.forEach((it) => {
        const hit = el("rect", { class: "gr-tap", x: it.x - 30, y: S.y(Math.max(it.pos, 8) + 3), width: 60, height: S.y(Math.min(it.pos, 0) - 3) - S.y(Math.max(it.pos, 8) + 3), fill: "transparent" }, S.node);
        hit.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          MUSIC.play("piano", midiOf(d.shown[it.i]), { gain: 0.8, length: 0.9 });
          const res = api.answer(it.i);
          if (res !== null) recolor(it.node, res ? GREEN : WRONG);
        });
      });
      q.items = items;
    };
    q.play = () => playNotes(d.shown, 0.6, { bpm: 120 });
    q.hint = () => `Listen again: one note sounds wrong. Check each step against the pattern ${d.form === "major" ? "tone, tone, semitone, tone, tone, tone, semitone" : d.form === "harmonic" ? "tone, semitone, tone, tone, semitone, tone-and-a-half, semitone" : "tone, semitone, tone, tone, tone, tone, semitone"}. Where does it break?`;
    q.after = () => {
      const it = q.items[d.miss];
      accGlyph(S.layer, it.x - 1.6 * S.g, S.y(it.pos), d.sc[d.miss].a, S.g, GREEN);
      recolor(it.node, GREEN);
      setTimeout(() => playNotes(d.sc, 0.6, { bpm: 120 }), 300);
    };
  } else {
    const items = scaleItems(d.sc);
    q.ask = kind === "semitones" ? `The scale of ${GR.keyName(d.key)}${d.form !== "major" ? ` (${d.form}${d.form === "melodic" ? ", ascending" : ""})` : ""}. Between which degrees are the semitones?` : `This is a scale of ${GR.keyName(d.key)}. Which form of the minor scale is it?`;
    q.draw = () => {
      S = stdStaff(d.clef, { yb: 220 });
      const x = header(S);
      music(S, [...items, { t: "end" }], x + 10, 930);
      if (kind === "semitones") items.forEach((it) => text(view, it.x, 336, it.i + 1, { "font-size": 26, fill: SOFT }));
      q.items = items;
    };
    q.play = () => playNotes(d.sc, 0.6, { bpm: 120 });
    q.hint = () => (kind === "semitones" ? "On a keyboard, a semitone is the very next key. Between which neighboring notes of this scale is there no key at all?" : "Look at degrees 6 and 7 (the two notes before the top tonic). Is only the 7th raised, or both?");
    q.after = () => {
      if (kind !== "semitones") return;
      for (let i = 0; i < 7; i++)
        if (midiOf(d.sc[i + 1]) - midiOf(d.sc[i]) === 1) {
          const a = q.items[i];
          const b = q.items[i + 1];
          const y = Math.max(S.y(a.pos), S.y(b.pos)) + 30;
          el("path", { d: `M${a.x} ${y}Q${(a.x + b.x) / 2} ${y + 28} ${b.x} ${y}`, fill: "none", stroke: GREEN, "stroke-width": 4 }, view);
        }
    };
  }
  q.region = LOW;
  return q;
}

// ================= 6. Tones and semitones =================
function stepCase(lv, round) {
  const kind = lv === 3 ? rot(round, ["which", "above"]) : "which";
  const d = GR.genStep(lv, kind);
  const q = { ...d, region: RIGHT };
  let S;
  let kb;
  const lowNote = kind === "above" ? d.base : d.lo;
  const c0 = Math.floor((midiOf(lowNote) - 1) / 12) * 12;
  q.ask = kind === "which" ? "Tone or semitone?" : `Which note is a ${d.want === 1 ? "semitone" : "tone"} above ${nameOf(d.base)}?`;
  q.draw = () => {
    S = staff(view, { x0: 40, x1: 570, yb: 190, g: 26, clef: d.clef });
    const x = header(S);
    if (kind === "which") music(S, [{ t: "n", v: "sb", pos: posOf(d.lo, d.clef), acc: d.lo.a || null }, { t: "n", v: "sb", pos: posOf(d.hi, d.clef), acc: d.hi.a || (d.hi.l === d.lo.l ? 0 : null) }], x + 20, 560, { maxUnit: 3 });
    else note(S, x + 120, posOf(d.base, d.clef), { v: "sb", acc: d.base.a || null });
    kb = keyboard(view, { low: c0, high: c0 + 23, x: 40, y: 330, w: 530, h: 200 });
  };
  q.play = () => (kind === "which" ? playNotes([d.lo, d.hi], 1) : MUSIC.play("piano", midiOf(d.base), { length: 1.2 }));
  q.hint = () => (kind === "which" ? "Find both notes on the keyboard below (sharps are the key just to the right, flats just to the left). Is there a key between them, black or white?" : "Use the next letter name. A semitone is the very next key; a tone skips exactly one key.");
  q.after = () => {
    const a = kind === "which" ? d.lo : d.base;
    const b = kind === "which" ? d.hi : d.up;
    kb.mark(midiOf(a), "#f6c58b");
    kb.mark(midiOf(b), "#9fd3a8");
    const xa = kb.centre(midiOf(a));
    const xb = kb.centre(midiOf(b));
    if (xa && xb) el("path", { d: `M${xa} 322Q${(xa + xb) / 2} 290 ${xb} 322`, fill: "none", stroke: GREEN, "stroke-width": 4 }, view);
    playNotes([a, b], 1);
  };
  return q;
}

// ================= 7. Intervals =================
function intervalCase(lv) {
  const d = GR.genInterval(lv);
  const sig = GR.sigMap(d.key);
  const q = { ...d };
  let S;
  q.ask = `In ${GR.keyName(d.key)}, name the interval above the tonic${lv >= 3 ? ": quality and number" : " by number"}.`;
  q.draw = () => {
    S = stdStaff(d.clef);
    const x = header(S, { sig: GR.sigPositions(d.key, d.clef) });
    q.items = music(S, [{ t: "n", v: "sb", pos: posOf(d.lo, d.clef), acc: accWritten(d.lo, sig) }, { t: "n", v: "sb", pos: posOf(d.hi, d.clef), acc: accWritten(d.hi, sig) }, { t: "end" }], x + 40, 930, { maxUnit: 3 });
    text(view, q.items[0].x, S.y(-4) + 10, "tonic", { "font-size": 24, fill: SOFT });
  };
  q.play = () => playSeq([{ m: midiOf(d.lo), d: 1 }, { m: midiOf(d.hi), d: 1 }, { m: [midiOf(d.lo), midiOf(d.hi)], d: 2 }]);
  q.hint = () => `Count the letter names from the tonic up to the higher note, counting both ends: ${LET[d.lo.l]} is 1.${lv >= 3 ? " Then count the semitones: a major 3rd has 4, a minor 3rd 3, a perfect 4th 5, a perfect 5th 7." : ""}`;
  q.after = () => {
    const sc = d.sc.slice(0, d.deg + 1);
    sc.forEach((n, i) => text(view, q.items[0].x + (i * (q.items[1].x - q.items[0].x)) / Math.max(1, d.deg), S.y(-4) + 48, LET[n.l], { "font-size": 26, fill: GREEN }));
  };
  return q;
}

// ================= 8. Tonic triads =================
function triadCase(lv, round) {
  const kind = rot(round, ["key", "wrong"]);
  const d = GR.genTriad(lv, kind);
  const q = { ...d };
  let S;
  if (kind === "key") {
    q.ask = "This is a tonic triad. Of which key?";
    q.draw = () => {
      S = stdStaff(d.clef);
      const x = header(S, { sig: GR.sigPositions(d.key, d.clef) });
      d.triad.forEach((n) => note(S, x + 200, posOf(n, d.clef), { v: "sb" }));
    };
    q.play = () => playSeq([{ m: d.triad.map(midiOf), d: 2, len: 1.6 }, ...d.triad.map((n) => ({ m: midiOf(n), d: 0.6 }))]);
    q.hint = () => "The lowest note is the tonic. Is the middle note 4 semitones above it (major) or 3 (minor)?";
  } else {
    q.ask = `This should be the tonic triad of ${GR.keyName(d.key)}, written without a key signature. One note is wrong: tap it.`;
    q.tapNote = "Tap the wrong note.";
    q.draw = (api) => {
      S = stdStaff(d.clef);
      const x = header(S);
      const items = d.shown.map((n, i) => ({ t: "n", v: "sb", pos: posOf(n, d.clef), acc: n.a || null, i }));
      music(S, [...items, { t: "end" }], x + 60, 930, { maxUnit: 3 });
      items.forEach((it) => {
        const hit = el("rect", { class: "gr-tap", x: it.x - 70, y: S.y(Math.max(it.pos, 8) + 3), width: 110, height: S.y(Math.min(it.pos, 0) - 3) - S.y(Math.max(it.pos, 8) + 3), fill: "transparent" }, S.node);
        hit.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          MUSIC.play("piano", midiOf(d.shown[it.i]), { gain: 0.8, length: 0.9 });
          const res = api.answer(it.i);
          if (res !== null) recolor(it.node, res ? GREEN : WRONG);
        });
      });
      q.items = items;
    };
    q.play = () => playSeq([{ m: d.shown.map(midiOf), d: 2, len: 1.6 }]);
    q.hint = () => `Spell the scale of ${GR.keyName(d.key)} and pick out degrees 1, 3 and 5. Compare each written note with them, accidental included.`;
    q.after = () => {
      const it = q.items[d.bad];
      text(view, it.x, S.y(-5) + 6, `→ ${nameOf(d.triad[d.bad])}`, { "font-size": 30, fill: GREEN });
      setTimeout(() => playSeq([{ m: d.triad.map(midiOf), d: 2, len: 1.6 }]), 200);
    };
  }
  return q;
}

// ================= 9. Italian terms =================
const DEMO = {
  allegro: { bpm: 150 },
  andante: { bpm: 84 },
  adagio: { bpm: 56 },
  lento: { bpm: 52 },
  largo: { bpm: 48 },
  moderato: { bpm: 104 },
  allegretto: { bpm: 124 },
  presto: { bpm: 190 },
  vivace: { bpm: 164 },
  accelerando: { bpm: [70, 170] },
  rallentando: { bpm: [150, 60] },
  ritardando: { bpm: [150, 60] },
  piano: { gain: [0.22, 0.22] },
  forte: { gain: [1, 1] },
  "mezzo piano": { gain: [0.4, 0.4] },
  "mezzo forte": { gain: [0.65, 0.65] },
  pianissimo: { gain: [0.1, 0.1] },
  fortissimo: { gain: [1.25, 1.25] },
  crescendo: { gain: [0.1, 1.2] },
  diminuendo: { gain: [1.2, 0.1] },
  decrescendo: { gain: [1.2, 0.1] },
  legato: { len: 1.08 },
  staccato: { len: 0.14 },
  fortepiano: { fp: true },
};
const PHRASE = [60, 62, 64, 65, 67, 69, 71, 72, 71, 69, 67, 65, 64, 62, 60];
function demo(term) {
  const d = DEMO[term];
  if (!d) return 0;
  const n = PHRASE.length;
  const t0 = MUSIC.now() + 0.08;
  let t = t0;
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);
    const bpm = Array.isArray(d.bpm) ? d.bpm[0] + (d.bpm[1] - d.bpm[0]) * f : d.bpm || 110;
    const beat = 60 / bpm / 1;
    const gain = d.fp ? (i === 0 ? 1.2 : 0.2) : d.gain ? d.gain[0] + (d.gain[1] - d.gain[0]) * f : 0.75;
    const len = d.fp && i === 0 ? beat * 0.9 : d.len ? beat * d.len : beat * 0.85;
    MUSIC.play("piano", PHRASE[i], { gain, at: t, length: len });
    t += beat;
  }
  return t - t0;
}
const CAT = { tempo: "a tempo (speed) marking", change: "a change of speed", dynamic: "a dynamic (volume) marking", touch: "an articulation (touch) marking", style: "a marking of character or style", form: "a direction about the order of the music", word: "a small word that modifies other terms" };
function termCase(lv, round) {
  const kind = rot(round, ["meaning", "term"]);
  const d = GR.genTerm(lv, kind);
  const q = { ...d };
  const can = !!DEMO[d.t.term];
  q.ask = kind === "meaning" ? `What does <i>${d.t.term}</i> mean?` : `Which term means "${d.t.meaning}"?`;
  q.voice = kind === "meaning" ? `What does ${d.t.term} mean?` : `Which term means: ${d.t.meaning}?`;
  q.autoplay = false;
  q.draw = () => {
    el("rect", { x: 140, y: 40, width: 720, height: 280, rx: 30, fill: "#fffaf0", stroke: "#e0b872", "stroke-width": 4 }, view);
    text(view, 500, 92, kind === "meaning" ? "Italian term" : "Meaning", { "font-size": 26, fill: SOFT });
    if (kind === "meaning") text(view, 500, 200, d.t.term, { "font-size": d.t.term.length > 12 ? 64 : 80, fill: INK, "font-family": "Georgia, 'Times New Roman', serif", "font-style": "italic" });
    else wrap(d.t.meaning, 30).forEach((line, i, all) => text(view, 500, 190 + i * 52 - (all.length - 1) * 26, line, { "font-size": 44, fill: INK }));
    if (can) text(view, 500, 290, "Press 🔊 Hear it to hear the term performed.", { "font-size": 24, fill: SOFT, "font-weight": 600 });
  };
  q.play = can ? () => demo(d.t.term) : null;
  q.hint = () => `This is ${CAT[d.t.cat]}.${can ? " Listen with 🔊 Hear it." : ""} Which option fits that kind of instruction — and is there an English word that shares its root?`;
  q.after = () => can && demo(d.t.term);
  return q;
}

// ================= 10. Octave transposition =================
function transposeCase(lv) {
  const d = GR.genTranspose(lv);
  const q = { ...d, region: RIGHT, parts: d.notes.length };
  let A;
  let B;
  const xs = [];
  const placed = [];
  q.ask = `Write ${d.notes.length > 1 ? "this melody" : "this note"} one octave ${d.down ? "lower" : "higher"} in the ${CLEFS[d.to].name}.`;
  q.askPart = (i) => (d.notes.length > 1 ? `Note ${i + 1} of ${d.notes.length}: tap its new place on the lower staff.` : "Tap its new place on the lower staff.");
  q.tapNote = "Tap a line or space on the lower staff.";
  q.ok = (pos) => pos === d.notes[q.part].dp;
  q.draw = (api) => {
    A = staff(view, { x0: 30, x1: 580, yb: 180, g: 24, clef: d.from });
    const xa = header(A);
    B = staff(view, { x0: 30, x1: 580, yb: 432, g: 24, clef: d.to });
    q.S = B;
    const xb = header(B);
    text(view, 30, 26, d.from === "treble" ? "Treble clef" : "Bass clef", { "font-size": 24, fill: SOFT, "text-anchor": "start" });
    text(view, 30, 282, `${CLEFS[d.to].name[0].toUpperCase() + CLEFS[d.to].name.slice(1)}: one octave ${d.down ? "lower" : "higher"}`, { "font-size": 24, fill: SOFT, "text-anchor": "start" });
    const x0 = Math.max(xa, xb) + 50;
    const step = d.notes.length > 1 ? Math.min(120, (560 - x0) / (d.notes.length - 0.3)) : 0;
    d.notes.forEach((n, i) => {
      xs.push(x0 + i * step + (d.notes.length === 1 ? 140 : 0));
      note(A, xs[i], n.sp, { v: "c", acc: n.src.a || null });
    });
    q.mark = el("g", {}, view);
    const [lo, hi] = lv === 1 ? [-3, 11] : [-6, 14];
    tapStaff(B, {
      lo,
      hi,
      x0: x0 - 40,
      x1: 590,
      ghostX: () => xs[Math.min(q.part, xs.length - 1)],
      onPick: (pos) => {
        const part = q.part;
        const n = d.notes[part];
        placed[part]?.remove();
        const g = note(B, xs[part], pos, { v: "c", acc: n.src.a || null, color: HOT });
        placed[part] = g.grp;
        MUSIC.play("piano", midiOf(noteAt(pos, d.to, n.src.a)), { gain: 0.8, length: 0.9 });
        const res = api.answer(pos);
        if (res === null) return g.grp.remove();
        recolor(g.grp, res ? GREEN : WRONG);
        if (!res) setTimeout(() => placed[part] === g.grp && q.part === part && g.grp.setAttribute("opacity", 0.35), 900);
        else highlight();
      },
    });
    highlight();
  };
  const highlight = () => {
    q.mark.innerHTML = "";
    if (q.part < d.notes.length) {
      const y = A.y(d.notes[q.part].sp);
      el("circle", { cx: xs[q.part], cy: y, r: 26, fill: "none", stroke: HOT, "stroke-width": 3, "stroke-dasharray": "5 5" }, q.mark);
    }
  };
  q.revealPart = async (i) => {
    placed[i]?.remove();
    const n = d.notes[i];
    placed[i] = note(B, xs[i], n.dp, { v: "c", acc: n.src.a || null, color: GREEN }).grp;
    setTimeout(highlight, 50);
  };
  q.partWhy = (i) => `${sciOf(d.notes[i].src)} ${d.down ? "down" : "up"} an octave is ${sciOf(d.notes[i].dst)}, ${GR.placeWords(d.notes[i].dp)} of the ${CLEFS[d.to].name}.`;
  q.play = () => playSeq(d.notes.map((n) => ({ m: midiOf(n.src), d: 1 })).concat(d.notes.map((n) => ({ m: midiOf(n.dst), d: 1 }))));
  q.hint = () => {
    const n = d.notes[q.part];
    return `This note is ${sciOf(n.src)}. An octave ${d.down ? "lower" : "higher"} keeps the letter ${LET[n.src.l]} and changes the octave number to ${n.dst.o}. Where is ${sciOf(n.dst)} in the ${CLEFS[d.to].name}? ${d.to === "bass" ? "F3 sits between the clef's dots; middle C is on the ledger line above." : "G4 is the line the clef curls around; middle C is on the ledger line below."}`;
  };
  q.after = () => {
    q.mark.innerHTML = "";
    playSeq(d.notes.map((n) => ({ m: midiOf(n.dst), d: 1 })));
  };
  return q;
}

          music(S, items, x + 20, 920);
          const t1 = text(v, x - 60, 92, "3 = beats in a bar", { "font-size": 30, fill: HOT, "text-anchor": "start" });
          const t2 = text(v, x - 60, 470, "4 = each beat is a crotchet (¼)", { "font-size": 30, fill: "#1e6fb0", "text-anchor": "start" });
          await fade(t1, api);
          await fade(t2, api);
          const notesOnly = items.filter((it) => it.t === "n");
          for (let rep = 0; rep < 2; rep++)
            for (let i = 0; i < notesOnly.length; i++) {
              const it = notesOnly[i];
              const c = text(v, it.x, S.y(-4) + 10, (i % 3) + 1, { "font-size": 30, fill: i % 3 === 0 ? HOT : SOFT });
              MUSIC.play("piano", midiOf(noteAt(it.pos, "treble")), { gain: i % 3 === 0 ? 1 : 0.45, length: 0.5 });
              MUSIC.tick(i % 3 === 0);
              await api.wait(560);
              if (rep === 0) c.remove();
            }
        },
      },
      {
        say: "Every major scale follows one pattern: tone, tone, semitone, tone, tone, tone, semitone. Starting on G, the pattern forces F sharp as the 7th note. Rather than writing that sharp every time, we place it once at the start of each line, on the F line: that is the key signature of G major.",
        async draw(v, api) {
          const S = staff(v, { x0: 60, x1: 940, yb: 300, g: 28, clef: "treble" });
          const x = header(S);
          const sc = GR.scaleOf(P("G4"), "major");
          const items = sc.map((n) => ({ t: "n", v: "sb", pos: posOf(n, "treble"), acc: n.a || null }));
          music(S, [...items, { t: "end" }], x + 100, 940);
          for (let i = 0; i < 8; i++) {
            MUSIC.play("piano", midiOf(sc[i]), { length: 0.7 });
            if (i) {
              const semi = midiOf(sc[i]) - midiOf(sc[i - 1]) === 1;
              text(v, (items[i].x + items[i - 1].x) / 2, S.y(-5), semi ? "S" : "T", { "font-size": 28, fill: semi ? HOT : SOFT });
            }
            await api.wait(480);
          }
          await api.wait(600);
          const it = items[6];
          const mover = accGlyph(v, it.x - 1.6 * S.g, S.y(it.pos), 1, S.g, HOT);
          const tx = x - 0.8 * S.g + 0.6 * S.g;
          const ty = S.y(8);
          const sx = it.x - 1.6 * S.g;
          const sy = S.y(it.pos);
          await api.tween(1400, (t) => mover.setAttribute("transform", `translate(${sx + (tx - sx) * t} ${sy + (ty - sy) * t}) scale(${S.g / 26})`));
          text(v, tx, S.y(12), "key signature", { "font-size": 28, fill: HOT });
        },
      },
      {
        say: `Explain it, in two to four sentences, aloud to a grown-up or in writing: ${EXPLAIN.gr0}`,
        async draw(v) {
          view = v;
          explainCard("gr0", 90);
        },
      },
    ],
    { alive: () => my === token, onDone: () => shell.go("gr1"), title: "Reading music precisely", doneLabel: "▶ Begin: clefs" }
  );
}
