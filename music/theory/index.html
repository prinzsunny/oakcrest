<script>const $ = (selector) => document.querySelector(selector);
const stage = $("[data-stage]");
const panel = $("[data-panel]");
const NS = "http://www.w3.org/2000/svg";
const W = 1000;
const H = 600;
const { stepOf, midiOfStep, letterOf, isWhite } = MUSIC;

const UNITS = [
  { id: "place", label: "Placement check", icon: "🧭" },
  { id: "t1", label: "1. Reading notes (treble clef)", icon: "🎼" },
  { id: "t2", label: "2. Rhythm: fill the bar", icon: "🧩" },
  { id: "t2b", label: "2. Rhythm: clap it back", icon: "👏" },
  { id: "t3", label: "3. Time signatures", icon: "🕰️" },
  { id: "t4", label: "4. Bass clef", icon: "🐻" },
  { id: "t5", label: "5. Scales and keys", icon: "🪜" },
  { id: "t6", label: "6. Intervals", icon: "📏" },
  { id: "t7", label: "7. Chords", icon: "🎹" },
  { id: "t8", label: "8. Sight-reading", icon: "👀" },
  { id: "t9", label: "9. Compose", icon: "✍️" },
  { id: "t10", label: "10. Composers and the orchestra", icon: "🎻" },
];

const KEY_LOW = 60;
const KEY_HIGH = 84;
const WHITES = [];
for (let m = KEY_LOW; m <= KEY_HIGH; m++) if (isWhite(m)) WHITES.push(m);
const KW = W / WHITES.length;
const KEY_TOP = 330;
const KEY_H = 250;

const LINE_GAP = 22;
const BOTTOM = 196;
const E4 = stepOf(64);
let CLEF = "treble";
const BASE = () => (CLEF === "bass" ? stepOf(43) : E4);
const yOf = (step) => BOTTOM - (step - BASE()) * (LINE_GAP / 2);

const VALUES = {
  w: { beats: 4, name: "whole note", frac: "1", tone: "#7a4520" },
  h: { beats: 2, name: "half note", frac: "½", tone: "#a8632d" },
  q: { beats: 1, name: "quarter note", frac: "¼", tone: "#3f7d4e" },
  e: { beats: 0.5, name: "eighth note", frac: "⅛", tone: "#3e5f86" },
  dh: { beats: 3, name: "dotted half note", frac: "¾", tone: "#8a4b8f" },
  dq: { beats: 1.5, name: "dotted quarter note", frac: "⅜", tone: "#2f7f86" },
};

const svg = document.createElementNS(NS, "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
stage.appendChild(svg);
const style = document.createElement("style");
style.textContent = `
.kb-key{cursor:pointer}
.kb-white{fill:#fffdf8;stroke:#7d6a58;stroke-width:1.5}
.kb-black{fill:#2a1d14;stroke:#120b06;stroke-width:1}
.kb-key.down .kb-white,.kb-key.down.kb-w rect{fill:#f1e2cc}
.kb-key.down .kb-black{fill:#5a4130}
.kb-key.hint .kb-white{fill:#d9f0dd}
.kb-key.hint .kb-black{fill:#3f7d4e}
.kb-key.wrong .kb-white{fill:#fbe3dc}
.kb-key.sel .kb-white{fill:#f3d7a8}
.kb-key.sel .kb-black{fill:#a8632d}
.kb-label{font:700 22px var(--sans);fill:#8a7764;pointer-events:none;display:none}
svg.labels .kb-label{display:block}
.kb-label.c{fill:#7a4520}
.st-line{stroke:#3b2a1d;stroke-width:2}
.st-clef{font-family:"Noto Music","Bravura","Apple Symbols","Segoe UI Symbol",serif;fill:#2b1d12}
.st-note{fill:#2b1d12;stroke:#2b1d12}
.st-note.hollow{fill:#fffcf6;stroke-width:3.5}
.st-note.now{fill:#a8632d;stroke:#a8632d}
.st-stem{stroke:#2b1d12;stroke-width:3.2;stroke-linecap:round}
.st-time{font:800 54px/1 var(--serif);fill:#2b1d12}
.fr-cell{stroke:#fffcf6;stroke-width:3}
.fr-text{font:800 30px var(--sans);fill:#fff;pointer-events:none}
.pad{cursor:pointer}
.pad.hit circle.skin{fill:#f6e7cf}
`;
document.head.appendChild(style);

MUSIC.preload("piano", WHITES.concat([61, 63, 66, 68, 70, 73, 75, 78, 80, 82]));
MUSIC.preload("woodblock", [72, 79]);
MUSIC.preload("xylophone", [84, 88, 91, 96]);

function el(name, attrs = {}, parent = svg) {
  const node = document.createElementNS(NS, name);
  for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
  parent.appendChild(node);
  return node;
}
const clear = () => {
  svg.innerHTML = "";
  svg.classList.remove("labels");
};

function staff({ x0 = 40, x1 = 960, clef = true } = {}) {
  const g = el("g");
  for (let i = 0; i < 5; i++) el("line", { class: "st-line", x1: x0, x2: x1, y1: BOTTOM - i * LINE_GAP, y2: BOTTOM - i * LINE_GAP }, g);
  el("line", { class: "st-line", x1: x0, x2: x0, y1: BOTTOM - 4 * LINE_GAP, y2: BOTTOM, "stroke-width": 2.5 }, g);
  el("line", { class: "st-line", x1: x1, x2: x1, y1: BOTTOM - 4 * LINE_GAP, y2: BOTTOM, "stroke-width": 2.5 }, g);
  if (clef) {
    const bass = CLEF === "bass";
    const c = el("text", { class: "st-clef", x: x0 + 10, y: bass ? BOTTOM - 3 * LINE_GAP + 40 : BOTTOM - LINE_GAP + 23, "font-size": LINE_GAP * (bass ? 3.3 : 4.1) }, g);
    c.textContent = bass ? "𝄢" : "𝄞";
  }
  return g;
}

function noteHead(x, step, { value = "q", now = false, parent = svg, sharp = "" } = {}) {
  const y = yOf(step);
  const g = el("g", {}, parent);
  const base = BASE();
  const diff = step - base;
  for (let d = -2; d >= diff; d -= 2) el("line", { class: "st-line", x1: x - 24, x2: x + 24, y1: yOf(base + d), y2: yOf(base + d) }, g);
  for (let d = 10; d <= diff; d += 2) el("line", { class: "st-line", x1: x - 24, x2: x + 24, y1: yOf(base + d), y2: yOf(base + d) }, g);
  const hollow = value === "w" || value === "h" || value === "dh";
  el("ellipse", { class: `st-note${hollow ? " hollow" : ""}${now ? " now" : ""}`, cx: x, cy: y, rx: 13.5, ry: 10, transform: `rotate(-20 ${x} ${y})` }, g);
  if (value === "dh" || value === "dq") el("circle", { cx: x + 22, cy: diff % 2 === 0 ? y - 6 : y, r: 4, fill: "#2b1d12" }, g);
  if (sharp) {
    const s = el("text", { x: x - 34, y: y + 10, "text-anchor": "middle", "font-size": 30, "font-weight": 700, fill: "#2b1d12" }, g);
    s.textContent = sharp;
  }
  if (value !== "w") {
    const up = step < base + 4;
    const sx = up ? x + 12.5 : x - 12.5;
    el("line", { class: "st-stem", x1: sx, x2: sx, y1: y + (up ? -3 : 3), y2: y + (up ? -72 : 72) }, g);
    if (value === "e") {
      const fy = y + (up ? -72 : 72);
      const dir = up ? 1 : -1;
      el("path", { d: `M${sx} ${fy}C${sx + 4} ${fy + 18 * dir} ${sx + 26} ${fy + 22 * dir} ${sx + 16} ${fy + 50 * dir}C${sx + 22} ${fy + 28 * dir} ${sx + 8} ${fy + 22 * dir} ${sx} ${fy + 18 * dir}Z`, fill: "#2b1d12" }, g);
    }
  }
  return g;
}

function keyboard({ onKey, low = KEY_LOW, high = KEY_HIGH, top = KEY_TOP, height = KEY_H } = {}) {
  const WHITES = [];
  for (let m = low; m <= high; m++) if (isWhite(m)) WHITES.push(m);
  const KW = W / WHITES.length;
  const KEY_TOP = top;
  const KEY_H = height;
  const KEY_HIGH = high;
  const g = el("g", { "aria-label": "Piano keyboard" });
  const keys = new Map();
  WHITES.forEach((midi, i) => {
    const k = el("g", { class: "kb-key kb-w", "data-midi": midi }, g);
    el("rect", { class: "kb-white", x: i * KW + 1, y: KEY_TOP, width: KW - 2, height: KEY_H, rx: 6 }, k);
    const t = el("text", { class: `kb-label${letterOf(midi) === "C" ? " c" : ""}`, x: i * KW + KW / 2, y: KEY_TOP + KEY_H - 18, "text-anchor": "middle" }, k);
    t.textContent = letterOf(midi) + (midi === 60 ? "·" : "");
    keys.set(midi, k);
  });
  WHITES.forEach((midi, i) => {
    if (!isWhite(midi + 1) && midi + 1 <= KEY_HIGH) {
      const k = el("g", { class: "kb-key kb-b", "data-midi": midi + 1 }, g);
      el("rect", { class: "kb-black", x: (i + 1) * KW - KW * 0.31, y: KEY_TOP, width: KW * 0.62, height: KEY_H * 0.6, rx: 4 }, k);
      keys.set(midi + 1, k);
    }
  });
  const middleC = WHITES.indexOf(60);
  if (middleC >= 0) el("circle", { cx: middleC * KW + KW / 2, cy: KEY_TOP + KEY_H - 46, r: 5, fill: "#c98c58", "pointer-events": "none" }, g);
  g.addEventListener("pointerdown", (event) => {
    const key = event.target.closest(".kb-key");
    if (!key) return;
    event.preventDefault();
    const midi = Number(key.dataset.midi);
    press(midi);
    onKey?.(midi);
  });
  const press = (midi) => {
    MUSIC.play("piano", midi, { gain: 0.85, length: 1.2 });
    const k = keys.get(midi);
    k?.classList.add("down");
    setTimeout(() => k?.classList.remove("down"), 220);
    window.OC?.touch();
  };
  return {
    mark(midi, kind, on = true) {
      keys.get(midi)?.classList.toggle(kind, on);
    },
    unmark() {
      keys.forEach((k) => k.classList.remove("hint", "wrong", "sel"));
    },
    centre(midi) {
      if (isWhite(midi)) return WHITES.indexOf(midi) * KW + KW / 2;
      return (WHITES.indexOf(midi - 1) + 1) * KW;
    },
    press,
  };
}

const say = (html, { voice = true } = {}) => {
  const box = $("[data-say]");
  if (box) box.innerHTML = html;
  if (voice) VOICE.speak(html);
};
const pick = (list) => list[Math.floor(Math.random() * list.length)];
const pickInt = (low, high) => low + Math.floor(Math.random() * (high - low + 1));
const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const PRAISE = ["Yes!", "Correct!", "Well done!", "Brilliant!", "Nice!"];
let token = 0;
let keyHandler = null;
let currentUnit = "";
const setPanel = (html, { explain = true } = {}) =>
  (panel.innerHTML = `<p class="ap-say" data-say aria-live="polite"></p>${html}${explain && LESSONS[currentUnit] ? `<button type="button" class="ap-link" data-explain>📖 How it works</button>` : ""}`);

function whereIs(midi) {
  const diff = stepOf(midi) - BASE();
  if (CLEF === "bass") {
    if (diff === 10) return "on a little line above the staff: middle C";
    if (diff === -2) return "on a little line below the staff";
  }
  const ordinal = ["first", "second", "third", "fourth", "fifth"];
  if (diff === -2) return "on a little line below the staff: middle C";
  if (diff === -1) return "just under the bottom line";
  if (diff === 9) return "just above the top line";
  if (diff === 10) return "on a little line above the staff";
  if (diff > 10) return "above the staff, past the little line";
  if (diff % 2 === 0) return `on the ${ordinal[diff / 2]} line from the bottom`;
  return `in the ${ordinal[(diff - 1) / 2]} space from the bottom`;
}
function memoryHook(midi) {
  const diff = stepOf(midi) - BASE();
  if (CLEF === "bass") {
    if (diff >= 0 && diff <= 8 && diff % 2 === 0) return "Bass clef lines from the bottom: Good Boys Do Fine Always (G B D F A).";
    if (diff >= 1 && diff <= 7) return "Bass clef spaces from the bottom: All Cows Eat Grass (A C E G).";
    return "Count up or down the steps from a note you know.";
  }
  if (diff >= 0 && diff <= 8 && diff % 2 === 0) return "Lines from the bottom: Every Good Boy Does Fine (E G B D F).";
  if (diff >= 1 && diff <= 7) return "Spaces from the bottom spell FACE.";
  return "Count up or down the steps from a note you know.";
}

const STAGES = {
  A: { label: "C D E", notes: [60, 62, 64] },
  B: { label: "C to G", notes: [60, 62, 64, 65, 67] },
  C: { label: "C to C", notes: [60, 62, 64, 65, 67, 69, 71, 72] },
  D: { label: "Whole staff", notes: [60, 62, 64, 65, 67, 69, 71, 72, 74, 76, 77, 79, 81] },
};

function noteScene(midi) {
  clear();
  staff();
  noteHead(560, stepOf(midi), { value: "w" });
}

function reading(id, clef, stages, low, high) {
    CLEF = clef;
    const my = token;
  const saved = shell.progress();
  let stageKey = saved[id]?.stage || (id === "t1" ? saved.place?.stage : "") || "A";
  let target = 0;
  let count = 0;
  let right = 0;
  let missed = false;
  let started = 0;
  let timer = 0;
  let kb = null;
  setPanel(`<div class="ap-row"><div class="ap-chips" data-stages>${Object.entries(stages).map(([k, s]) => `<button type="button" data-stage="${k}">${k}: ${s.label}</button>`).join("")}</div><label class="ap-chips"><button type="button" data-letters aria-pressed="false">Letters on keys</button></label></div><p class="ap-status" data-dots></p><div class="ap-buttons"><button type="button" data-do="restart">↺ New round</button></div>`);
  const chips = () => panel.querySelectorAll("[data-stage]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.stage === stageKey)));
  const status = () => {
    const secs = started ? Math.round((performance.now() - started) / 1000) : 0;
    $("[data-dots]").textContent = `Note ${Math.min(count + 1, 20)} of 20 · ${right} right · ${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}`;
  };
  const next = () => {
    let m;
    do m = pick(stages[stageKey].notes);
    while (m === target && stages[stageKey].notes.length > 1);
    target = m;
    missed = false;
    const labelsOn = svg.classList.contains("labels");
    noteScene(target);
    if (labelsOn) svg.classList.add("labels");
    kb = keyboard({ onKey, low, high });
    status();
  };
  const begin = () => {
    count = 0;
    right = 0;
    started = performance.now();
    clearInterval(timer);
    timer = setInterval(() => {
      if (my !== token) return clearInterval(timer);
      status();
    }, 1000);
    chips();
    next();
    say(`Stage ${stageKey}: ${stages[stageKey].label}. Play each note you see. 20 notes!`);
  };
  const onKey = async (midi) => {
    if (my !== token || count >= 20) return;
    const ok = letterOf(midi) && stepOf(midi) === stepOf(target);
    if (ok) {
      kb.unmark();
      if (!missed) right += 1;
      count += 1;
      window.OC?.count("notes read");
      if (count >= 20) return finish();
      if (!missed) say(pick(PRAISE), { voice: false });
      await wait(350);
      if (my === token) next();
    } else {
      if (!missed) MUSIC.oops();
      missed = true;
      kb.unmark();
      kb.mark(midi, "wrong");
      kb.mark(target, "hint");
      say(`That was ${MUSIC.prettyOf(midi)}. This note is ${whereIs(target)}. It's ${letterOf(target)}. <small>${memoryHook(target)}</small>`);
    }
  };
  const finish = () => {
    clearInterval(timer);
    const secs = Math.round((performance.now() - started) / 1000);
    const pct = Math.round((right / 20) * 100);
    const best = shell.progress()[id]?.best?.[stageKey];
    const better = !best || pct > best.pct || (pct === best.pct && secs < best.secs);
    const bests = { ...(shell.progress()[id]?.best || {}) };
    if (better) bests[stageKey] = { pct, secs };
    const nextStage = { A: "B", B: "C", C: "D" }[stageKey];
    const passed = pct >= 90;
    shell.mark(id, { stage: passed && nextStage ? nextStage : stageKey, best: bests, done: shell.progress()[id]?.done || (stageKey === Object.keys(stages).pop() && passed) });
    window.OC?.note(`stage ${stageKey}`, `${pct}% in ${secs}s`);
    MUSIC.chime();
    say(`<span class="ap-cheer">🎉</span> ${right} out of 20 (${pct}%) in ${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}.${better ? " Your best yet!" : ""} ${passed ? (nextStage ? `Ready for stage ${nextStage}!` : `You can read the whole ${clef} staff!`) : "Let's practise this stage again to reach 90%."}`);
    if (passed && nextStage) stageKey = nextStage;
    chips();
  };
  panel.onclick = (event) => {
    const s = event.target.closest("[data-stage]");
    if (s) {
      stageKey = s.dataset.stage;
      return begin();
    }
    const letters = event.target.closest("[data-letters]");
    if (letters) {
      svg.classList.toggle("labels");
      letters.setAttribute("aria-pressed", String(svg.classList.contains("labels")));
      return;
    }
    if (event.target.closest("[data-do]")) begin();
  };
  begin();
  
}

const BASS_STAGES = {
  A: { label: "A B C", notes: [57, 59, 60] },
  B: { label: "F to C", notes: [53, 55, 57, 59, 60] },
  C: { label: "C to C", notes: [48, 50, 52, 53, 55, 57, 59, 60] },
  D: { label: "Whole staff", notes: [40, 41, 43, 45, 47, 48, 50, 52, 53, 55, 57, 59, 60] },
};

const units = {
  place() {
    const my = token;
    const qs = [];
    const notePool = [60, 62, 64, 65, 67, 69, 71, 72, 74, 76, 77, 79];
    for (let k = 0; k < 5; k++) qs.push({ kind: "note", midi: pick(notePool) });
    const values = ["w", "h", "q", "e"];
    for (const v of ["h", "q", "e"]) qs.push({ kind: "value", value: v });
    qs.push({ kind: "choice", text: "In 4/4 time, how many quarter notes fill one bar?", choices: ["2", "3", "4", "8"], answer: "4" });
    qs.push({ kind: "choice", text: "In 3/4 time, what does the top number 3 tell you?", choices: ["3 beats in each bar", "3 bars in the song", "Play 3 times faster"], answer: "3 beats in each bar" });
    let at = 0;
    let locked = false;
    const score = { notes: 0, rhythm: 0 };
    setPanel(`<p class="ap-dots" data-dots></p><div class="ap-chips" data-choices></div>`);
    let kb = null;
    const show = () => {
      locked = false;
      $("[data-dots]").textContent = qs.map((_, k) => (k < at ? "●" : k === at ? "◉" : "○")).join("");
      const q = qs[at];
      $("[data-choices]").innerHTML = "";
      keyHandler = null;
      if (q.kind === "note") {
        noteScene(q.midi);
        kb = keyboard({ onKey: (midi) => answer(letterOf(midi) && stepOf(midi) === stepOf(q.midi)) });
        say(`Question ${at + 1} of 10. Play this note on the piano.`);
      } else if (q.kind === "value") {
        clear();
        staff({ x0: 300, x1: 700, clef: false });
        noteHead(500, E4 + 4, { value: q.value });
        $("[data-choices]").innerHTML = values.map((v) => `<button type="button" data-ans="${VALUES[v].beats}">${VALUES[v].beats === 0.5 ? "½" : VALUES[v].beats} beat${VALUES[v].beats === 1 || VALUES[v].beats === 0.5 ? "" : "s"}</button>`).join("");
        say(`Question ${at + 1} of 10. In 4/4 time, how many beats is this note worth?`);
      } else {
        clear();
        const t = el("text", { class: "st-time", x: W / 2, y: 230, "text-anchor": "middle" });
        t.textContent = q.text.includes("3/4") ? "3/4" : "4/4";
        $("[data-choices]").innerHTML = q.choices.map((c) => `<button type="button" data-ans="${c}">${c}</button>`).join("");
        say(`Question ${at + 1} of 10. ${q.text}`);
      }
    };
    const answer = async (correct) => {
      if (my !== token || locked) return;
      locked = true;
      const q = qs[at];
      if (q.kind === "note") score.notes += correct ? 1 : 0;
      else score.rhythm += correct ? 1 : 0;
      at += 1;
      if (correct) MUSIC.chime();
      if (at < qs.length) {
        await wait(correct ? 700 : 300);
        if (my === token) show();
        return;
      }
      finish();
    };
    panel.onclick = (event) => {
      const button = event.target.closest("[data-ans]");
      if (!button || at >= qs.length) return;
      const q = qs[at];
      const correct = q.kind === "value" ? Number(button.dataset.ans) === VALUES[q.value].beats : button.dataset.ans === q.answer;
      answer(correct);
    };
    const finish = () => {
      const stage = score.notes >= 5 ? "D" : score.notes >= 4 ? "C" : score.notes >= 2 ? "B" : "A";
      const rhythmStart = score.rhythm >= 4 ? "t2b" : "t2";
      shell.mark("place", { done: true, notes: score.notes, rhythm: score.rhythm, stage, rhythmStart });
      clear();
      staff();
      [60, 64, 67, 72, 76].forEach((m, k) => noteHead(220 + k * 140, stepOf(m), { value: "q" }));
      $("[data-dots]").textContent = "";
      $("[data-choices]").innerHTML = `<button type="button" data-go="t1">Reading notes → stage ${stage}</button><button type="button" data-go="${rhythmStart}">${rhythmStart === "t2" ? "Rhythm: fill the bar" : "Rhythm: clap it back"}</button>`;
      panel.onclick = (event) => {
        const go = event.target.closest("[data-go]");
        if (go) shell.go(go.dataset.go);
      };
      window.OC?.note("placement", `notes ${score.notes}/5, rhythm ${score.rhythm}/5`);
      say(`All done! Notes: ${score.notes} out of 5. Rhythm: ${score.rhythm} out of 5. ${score.notes >= 4 ? "You read notes well, so we'll start further along." : "We'll build up the notes step by step."} Pick where to start.`);
    };
    say("A quick check so we start in the right place. Ten questions!");
    setTimeout(() => my === token && show(), 2600);
  },

  t1() {
    reading("t1", "treble", STAGES, 60, 84);
  },

  t2() {
    const my = token;
    const CHALLENGES = [
      { text: "Fill one bar of 4/4 any way you like.", ok: () => true },
      { text: "Fill the bar using exactly 4 notes.", ok: (list) => list.length === 4 },
      { text: "Start with a half note, then fill the rest.", ok: (list) => list[0] === "h" },
      { text: "Fill the bar using exactly 3 notes.", ok: (list) => list.length === 3 },
      { text: "Fill the bar using exactly 8 notes.", ok: (list) => list.length === 8 },
      { text: "Fill the bar using exactly 5 notes.", ok: (list) => list.length === 5 },
      { text: "Use at least one of every note except the whole note.", ok: (list) => ["h", "q", "e"].every((v) => list.includes(v)) },
    ];
    let at = shell.progress().t2?.next || 0;
    let list = [];
    setPanel(`<p class="ap-status" data-dots></p><div class="ap-buttons" data-palette>${["w", "h", "q", "e"].map((v) => `<button type="button" data-add="${v}" aria-label="${VALUES[v].name}">${glyph(v)}<span style="font-size:13px;display:block;margin-top:2px">${VALUES[v].frac}</span></button>`).join("")}</div><div class="ap-buttons"><button type="button" data-do="undo">↶ Undo</button><button type="button" data-do="clear">Clear</button><button type="button" data-do="play">▶ Play it</button></div>`);
    const used = () => list.reduce((sum, v) => sum + VALUES[v].beats, 0);
    const draw = () => {
      clear();
      const ly = yOf(E4 + 4);
      const t = el("text", { class: "st-time", x: 70, y: ly - 6, "text-anchor": "middle" });
      t.innerHTML = `<tspan x="70" dy="0">4</tspan><tspan x="70" dy="48">4</tspan>`;
      el("line", { class: "st-line", x1: 110, x2: 930, y1: ly, y2: ly });
      el("line", { class: "st-line", x1: 930, x2: 930, y1: ly - 50, y2: ly + 50, "stroke-width": 3 });
      let beat = 0;
      list.forEach((v) => {
        const x = 150 + (beat / 4) * 760 + 20;
        noteHead(x, E4 + 4, { value: v });
        beat += VALUES[v].beats;
      });
      const X0 = 110;
      const X1 = 930;
      const Y = 340;
      const HH = 90;
      el("rect", { x: X0, y: Y, width: X1 - X0, height: HH, rx: 14, fill: "#efe6d8" });
      beat = 0;
      list.forEach((v) => {
        const w = (VALUES[v].beats / 4) * (X1 - X0);
        const x = X0 + (beat / 4) * (X1 - X0);
        el("rect", { class: "fr-cell", x, y: Y, width: w, height: HH, rx: 12, fill: VALUES[v].tone });
        const label = el("text", { class: "fr-text", x: x + w / 2, y: Y + HH / 2 + 11, "text-anchor": "middle", "font-size": w < 70 ? 22 : 30 });
        label.textContent = VALUES[v].frac;
        beat += VALUES[v].beats;
      });
      for (let k = 1; k < 8; k++) el("line", { x1: X0 + (k / 8) * (X1 - X0), x2: X0 + (k / 8) * (X1 - X0), y1: Y + HH, y2: Y + HH + (k % 2 ? 10 : 18), stroke: "#8a7764", "stroke-width": k % 2 ? 1.5 : 2.5 });
      [1, 2, 3, 4].forEach((b) => {
        const t2 = el("text", { x: X0 + ((b - 0.5) / 4) * (X1 - X0), y: Y + HH + 44, "text-anchor": "middle", fill: "#8a7764", "font-size": 22, "font-weight": 700 });
        t2.textContent = `beat ${b}`;
      });
      const left = 4 - used();
      const sum = el("text", { x: W / 2, y: 560, "text-anchor": "middle", fill: "#2b1d12", "font-size": 30, "font-weight": 700 });
      sum.textContent = list.length ? `${list.map((v) => VALUES[v].frac).join(" + ")}${left === 0 ? " = 1 whole bar" : ""}` : "Tap a note below to add it";
      $("[data-dots]").textContent = `Challenge ${at + 1} of ${CHALLENGES.length} · ${left === 0 ? "bar full" : `${left === 0.5 ? "½" : left} beat${left === 1 || left === 0.5 ? "" : "s"} left`}`;
    };
    const playBar = async () => {
      const t0 = MUSIC.now() + 0.15;
      const b = 60 / 80;
      let beat = 0;
      for (const v of list) {
        MUSIC.play("woodblock", 79, { gain: 0.8, at: t0 + beat * b });
        beat += VALUES[v].beats;
      }
      for (let k = 0; k < 4; k++) MUSIC.play("woodblock", 72, { gain: 0.25, at: t0 + k * b });
    };
    const fresh = () => {
      list = [];
      draw();
      say(`Challenge ${at + 1}: ${CHALLENGES[at].text}`);
    };
    panel.onclick = async (event) => {
      if (my !== token) return;
      const add = event.target.closest("[data-add]")?.dataset.add;
      const what = event.target.closest("[data-do]")?.dataset.do;
      if (add) {
        const left = 4 - used();
        if (VALUES[add].beats > left) {
          MUSIC.oops();
          say(`A ${VALUES[add].name} needs ${VALUES[add].beats === 0.5 ? "½" : VALUES[add].beats} beat${VALUES[add].beats === 1 || VALUES[add].beats === 0.5 ? "" : "s"}, but only ${left === 0.5 ? "½" : left} ${left === 1 || left === 0.5 ? "is" : "are"} left. Try a shorter note!`);
          return;
        }
        list.push(add);
        MUSIC.play("woodblock", 79, { gain: 0.6 });
        draw();
        if (used() === 4) {
          if (CHALLENGES[at].ok(list)) {
            MUSIC.chime();
            window.OC?.count("bars filled");
            say(`<span class="ap-cheer">✓</span> Full bar! ${list.map((v) => VALUES[v].frac).join(" + ")} = 1. Listen!`);
            await wait(900);
            await playBar();
            at = (at + 1) % CHALLENGES.length;
            shell.mark("t2", { next: at, done: shell.progress().t2?.done || at === 0 });
            await wait(3200);
            if (my === token) fresh();
          } else {
            say(`The bar is full, but the challenge was: ${CHALLENGES[at].text} Tap Undo and try again!`);
          }
        }
      }
      if (what === "undo") {
        list.pop();
        draw();
      }
      if (what === "clear") fresh();
      if (what === "play" && list.length) playBar();
    };
    fresh();
  },

  t2b() {
    const my = token;
    const PATTERNS = [
      ["q", "q", "q", "q"],
      ["h", "q", "q"],
      ["q", "q", "h"],
      ["h", "h"],
      ["q", "e", "e", "q", "q"],
      ["e", "e", "q", "h"],
      ["q", "h", "q"],
      ["e", "e", "e", "e", "q", "q"],
      ["q", "e", "e", "e", "e", "q"],
    ];
    const BPM = 70;
    const B = 60 / BPM;
    let level = Math.min(shell.progress().t2b?.level || 0, PATTERNS.length - 1);
    let pattern = PATTERNS[level];
    let taps = [];
    let windowStart = 0;
    let capturing = false;
    let wins = 0;
    setPanel(`<p class="ap-status" data-dots></p><div class="ap-buttons"><button type="button" data-do="listen">🔊 Listen</button><button type="button" class="primary" data-do="go">👏 My turn</button><button type="button" data-do="new">Next rhythm</button></div><p style="margin:0;color:var(--muted);font-size:13px">Tap the drum, or press the space bar, on each note.</p>`);
    const onsets = () => {
      let beat = 0;
      return pattern.map((v) => {
        const at = beat;
        beat += VALUES[v].beats;
        return at;
      });
    };
    const scene = (marks = []) => {
      clear();
      const ly = yOf(E4 + 2);
      const t = el("text", { class: "st-time", x: 70, y: ly - 6, "text-anchor": "middle" });
      t.innerHTML = `<tspan x="70" dy="0">4</tspan><tspan x="70" dy="48">4</tspan>`;
      el("line", { class: "st-line", x1: 110, x2: 930, y1: ly, y2: ly });
      el("line", { class: "st-line", x1: 930, x2: 930, y1: ly - 50, y2: ly + 50, "stroke-width": 3 });
      const xOf = (beat) => 150 + (beat / 4) * 760;
      onsets().forEach((beat, k) => noteHead(xOf(beat) + 20, E4 + 2, { value: pattern[k] }));
      el("line", { x1: 150, x2: 910, y1: 240, y2: 240, stroke: "#c9b8a1", "stroke-width": 2 });
      [0, 1, 2, 3].forEach((b) => el("circle", { cx: xOf(b) + 20, cy: 240, r: 5, fill: "#8a7764" }));
      marks.forEach(({ beat, ok, label }) => {
        const x = Math.max(120, Math.min(930, xOf(beat) + 20));
        el("path", { d: `M${x} 251l-10 18h20z`, fill: ok ? "#3f7d4e" : "#d9822b" });
        if (label) {
          const tl = el("text", { x, y: 292, "text-anchor": "middle", "font-size": 18, "font-weight": 700, fill: ok ? "#3f7d4e" : "#b5651d" });
          tl.textContent = label;
        }
      });
      const pad = el("g", { class: "pad" });
      el("circle", { cx: W / 2, cy: 445, r: 120, fill: "#8a5a35" }, pad);
      el("circle", { class: "skin", cx: W / 2, cy: 440, r: 106, fill: "#fbf3e6", stroke: "#c9b8a1", "stroke-width": 3 }, pad);
      const tt = el("text", { x: W / 2, y: 452, "text-anchor": "middle", "font-size": 34, "font-weight": 800, fill: "#a8632d" }, pad);
      tt.textContent = "TAP";
      pad.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        hit();
        pad.classList.add("hit");
        setTimeout(() => pad.classList.remove("hit"), 120);
      });
      $("[data-dots]").textContent = `Rhythm ${level + 1} of ${PATTERNS.length} · ${pattern.map((v) => VALUES[v].frac).join(" + ")} = 1`;
    };
    const countIn = (t0) => {
      for (let k = 0; k < 4; k++) MUSIC.tick(k === 0, t0 + k * B);
    };
    const listen = async () => {
      capturing = false;
      const t0 = MUSIC.now() + 0.2;
      countIn(t0);
      onsets().forEach((beat) => MUSIC.play("woodblock", 79, { gain: 0.85, at: t0 + 4 * B + beat * B }));
      say("Listen: 1, 2, 3, 4, then the rhythm.", { voice: false });
    };
    const go = async () => {
      taps = [];
      const ctx = MUSIC.context();
      const t0 = MUSIC.now() + 0.25;
      countIn(t0);
      for (let k = 0; k < 4; k++) MUSIC.play("woodblock", 72, { gain: 0.18, at: t0 + (4 + k) * B });
      windowStart = performance.now() + (t0 + 4 * B - ctx.currentTime) * 1000;
      capturing = true;
      say("Get ready: 1, 2, 3, 4, then tap!", { voice: false });
      await wait((t0 - MUSIC.now()) * 1000 + 8 * B * 1000 + 600);
      if (my !== token || !capturing) return;
      capturing = false;
      judge();
    };
    const hit = () => {
      MUSIC.play("woodblock", 79, { gain: 0.7 });
      window.OC?.touch();
      if (capturing) taps.push((performance.now() - windowStart) / 1000 / B);
    };
    const judge = () => {
      const want = onsets();
      const got = taps.filter((t) => t > -0.5 && t < 4.4);
      if (got.length !== want.length) {
        scene(got.map((beat) => ({ beat, ok: false })));
        MUSIC.oops();
        say(`I heard ${got.length} tap${got.length === 1 ? "" : "s"}, but the rhythm has ${want.length} notes. Listen again, then try!`);
        return;
      }
      const tolerance = 0.18;
      const marks = got.map((beat, k) => {
        const err = beat - want[k];
        const ok = Math.abs(err) <= tolerance;
        return { beat, ok, label: ok ? "" : err < 0 ? "early" : "late" };
      });
      scene(marks);
      const good = marks.every((m) => m.ok);
      if (good) {
        wins += 1;
        MUSIC.chime();
        window.OC?.count("rhythms clapped");
        const nextLevel = Math.min(level + 1, PATTERNS.length - 1);
        shell.mark("t2b", { level: nextLevel, done: shell.progress().t2b?.done || level >= 4 });
        say(`<span class="ap-cheer">✓</span> Right on the beat! ${level < PATTERNS.length - 1 ? "Press Next rhythm for a harder one." : "You can clap them all!"}`);
        level = nextLevel;
      } else {
        const early = marks.filter((m) => !m.ok && m.label === "early").length;
        const late = marks.filter((m) => !m.ok && m.label === "late").length;
        say(`So close! ${early ? `${early} tap${early > 1 ? "s were" : " was"} a little early. ` : ""}${late ? `${late} tap${late > 1 ? "s were" : " was"} a little late. ` : ""}Count the beats in your head and try again.`);
      }
    };
    panel.onclick = (event) => {
      const what = event.target.closest("[data-do]")?.dataset.do;
      if (what === "listen") listen();
      if (what === "go") go();
      if (what === "new") {
        pattern = PATTERNS[level];
        scene();
        say("A new rhythm! Press Listen first.");
      }
    };
    keyHandler = (event) => {
      if (event.code === "Space") {
        event.preventDefault();
        if (!event.repeat) hit();
      }
    };
    scene();
    say("Clap it back! Press Listen, then My turn, and tap the drum on each note.");
  },
  t3() {
    const my = token;
    let modeName = "fill";
    setPanel(`<div class="ap-chips" data-modes><button type="button" data-m="fill" aria-pressed="true">Fill the bar</button><button type="button" data-m="listen">Listen: 2, 3 or 4?</button></div><p class="ap-status" data-dots></p><div class="ap-buttons" data-palette></div><div class="ap-buttons" data-tools></div>`);
    const SIGS = [[3, 4], [2, 4], [6, 8], [3, 4], [4, 4], [6, 8]];
    let at = 0;
    let list = [];
    let sig = SIGS[0];
    const cap = () => sig[0] * (4 / sig[1]);
    const used = () => list.reduce((sum, v) => sum + VALUES[v].beats, 0);
    const palette = () => (sig[1] === 8 ? ["dq", "q", "e"] : sig[0] === 3 ? ["dh", "h", "q", "e"] : ["h", "q", "e"]);
    const beatWord = (b) => (b === 0.5 ? "half a beat" : `${b} beat${b === 1 ? "" : "s"}`);
    const draw = () => {
      clear();
      const ly = yOf(E4 + 4);
      const t = el("text", { class: "st-time", x: 70, y: ly - 6, "text-anchor": "middle" });
      t.innerHTML = `<tspan x="70" dy="0">${sig[0]}</tspan><tspan x="70" dy="48">${sig[1]}</tspan>`;
      el("line", { class: "st-line", x1: 110, x2: 930, y1: ly, y2: ly });
      el("line", { class: "st-line", x1: 930, x2: 930, y1: ly - 50, y2: ly + 50, "stroke-width": 3 });
      let beat = 0;
      for (const v of list) {
        noteHead(150 + (beat / cap()) * 740 + 20, E4 + 4, { value: v });
        beat += VALUES[v].beats;
      }
      const X0 = 110;
      const X1 = 930;
      el("rect", { x: X0, y: 330, width: X1 - X0, height: 80, rx: 14, fill: "#efe6d8" });
      beat = 0;
      for (const v of list) {
        const w = (VALUES[v].beats / cap()) * (X1 - X0);
        const x = X0 + (beat / cap()) * (X1 - X0);
        el("rect", { class: "fr-cell", x, y: 330, width: w, height: 80, rx: 12, fill: VALUES[v].tone });
        const f = el("text", { class: "fr-text", x: x + w / 2, y: 380, "text-anchor": "middle", "font-size": w < 80 ? 18 : 24 });
        f.textContent = beatWord(VALUES[v].beats).replace(" beats", "b").replace(" beat", "b").replace("half a b", "½b");
        beat += VALUES[v].beats;
      }
      const groups = sig[1] === 8 ? [1.5, 3] : Array.from({ length: sig[0] }, (_, k) => k + 1);
      for (const g of groups) if (g < cap()) el("line", { x1: X0 + (g / cap()) * (X1 - X0), x2: X0 + (g / cap()) * (X1 - X0), y1: 412, y2: 432, stroke: "#8a7764", "stroke-width": 3 });
      const left = cap() - used();
      $("[data-dots]").textContent = `Bar ${at + 1} of ${SIGS.length} · ${sig[0]}/${sig[1]} · ${left === 0 ? "full!" : `${beatWord(left)} left`}`;
    };
    const fillRound = () => {
      sig = SIGS[at % SIGS.length];
      list = [];
      $("[data-palette]").innerHTML = palette().map((v) => `<button type="button" data-add="${v}" aria-label="${VALUES[v].name}">${glyph(v)}<span style="font-size:12px;display:block;margin-top:2px">${beatWord(VALUES[v].beats)}</span></button>`).join("");
      $("[data-tools]").innerHTML = `<button type="button" data-do="undo">↶ Undo</button><button type="button" data-do="clear">Clear</button>`;
      draw();
      const meaning = sig[1] === 8 ? `${sig[0]}/${sig[1]} has six eighth notes in a bar, in two groups of three. That's the same as two dotted quarter notes.` : `${sig[0]}/${sig[1]} means ${sig[0]} quarter-note beats in every bar.`;
      say(`${meaning} Fill the bar exactly!`);
    };
    const playBar = () => {
      const B = 60 / 84;
      const t0 = MUSIC.now() + 0.15;
      let beat = 0;
      for (const v of list) {
        const accent = beat === 0 || (sig[1] === 8 && beat === 1.5);
        MUSIC.play("woodblock", accent ? 79 : 72, { gain: accent ? 0.9 : 0.6, at: t0 + beat * B });
        beat += VALUES[v].beats;
      }
    };
    let listenQ = null;
    let listenRound = 0;
    let listenRight = 0;
    const listenAsk = () => {
      clear();
      const n = pick([2, 3, 4]);
      listenQ = n;
      const t = el("text", { x: W / 2, y: 230, "text-anchor": "middle", "font-size": 90 }, svg);
      t.textContent = "👂";
      const c = el("text", { x: W / 2, y: 330, "text-anchor": "middle", "font-size": 30, "font-weight": 700, fill: "#8a7764" }, svg);

      $("[data-tools]").innerHTML = `<button type="button" data-do="hear">🔊 Hear it again</button>`;
      $("[data-dots]").textContent = `Question ${listenRound + 1} of 8`;
      say("Listen. How many beats are in each bar: 2, 3 or 4? The loud beat is beat one.");
      setTimeout(() => my === token && listenPlay(), 2600);
    };
    const listenPlay = () => {
      const B = 60 / 100;
      const t0 = MUSIC.now() + 0.1;
      for (let k = 0; k < listenQ * 4; k++) MUSIC.play("woodblock", k % listenQ === 0 ? 79 : 72, { gain: k % listenQ === 0 ? 1 : 0.35, at: t0 + k * B });
    };
    const start = (m) => {
      modeName = m;
      panel.querySelectorAll("[data-m]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.m === m)));

      if (add) {
        const left = cap() - used();
        if (VALUES[add].beats > left) {
          MUSIC.oops();
          say(`A ${VALUES[add].name} lasts ${beatWord(VALUES[add].beats)}, but only ${beatWord(left)} ${left === 1 || left === 0.5 ? "is" : "are"} left. Try a shorter note!`);
          return;
        }
        list.push(add);
        MUSIC.play("woodblock", 79, { gain: 0.5 });
        draw();
        if (used() === cap()) {
          MUSIC.chime();
          window.OC?.count("bars filled");
          say(`✓ Full bar of ${sig[0]}/${sig[1]}! Listen to the strong first beat.`);
          await wait(900);
          playBar();
          at += 1;
          const done = at >= SIGS.length;
          shell.mark("t3", { fill: Math.max(at, shell.progress().t3?.fill || 0), done: shell.progress().t3?.done || (done && (shell.progress().t3?.listen || 0) >= 6) });
          await wait(3000);
          if (my === token && modeName === "fill") fillRound();
        }
      }
      if (what === "undo") {
        list.pop();
        draw();
      }
      if (what === "clear") {
        list = [];
        draw();
      }
      if (what === "hear") listenPlay();
      if (guess) {
        const ok = Number(guess) === listenQ;
        listenRound += 1;
        if (ok) {
          listenRight += 1;
          MUSIC.chime();
          say(`${pick(PRAISE)} ${listenQ} beats in a bar: ${listenQ}/4.${listenQ === 3 ? " That's waltz time!" : listenQ === 2 ? " That's march time!" : ""}`);
        } else say(`It was ${listenQ}/4. Count from each loud beat: ${Array.from({ length: listenQ }, (_, k) => (k ? k + 1 : "ONE")).join(", ")}.`);
        window.OC?.count("meters heard");
        await wait(2800);
        if (my !== token) return;
        if (listenRound >= 8) {
          shell.mark("t3", { listen: Math.max(listenRight, shell.progress().t3?.listen || 0), done: shell.progress().t3?.done || (listenRight >= 6 && (shell.progress().t3?.fill || 0) >= SIGS.length) });
          say(`${listenRight} out of 8! ${listenRight >= 6 ? "Great counting! 🎉" : "Let's listen again."}`);
          listenRound = 0;
          listenRight = 0;
          await wait(2800);
        }
        if (my === token && modeName === "listen") listenAsk();
      }
    };
    start("fill");
  },

  t4() {
    reading("t4", "bass", BASS_STAGES, 36, 60);
  },

  t5() {
    const my = token;
    const SHARP_KEYS = { C: 60, G: 67, D: 62, A: 69, E: 64 };
    const FLAT_KEYS = { F: 65, "B♭": 70 };
    const KEYS = { ...SHARP_KEYS, ...FLAT_KEYS };
    const STEPS = [2, 2, 1, 2, 2, 2, 1];
    const SHARPS = ["C", "C♯", "D", "D♯", "E", "F", "F♯", "G", "G♯", "A", "A♯", "B"];
    const FLATS = ["C", "D♭", "D", "E♭", "E", "F", "G♭", "G", "A♭", "A", "B♭", "B"];
    let key = "C";
    let at = 0;
    let notes = [];
    let kb = null;
    let missed = 0;
    setPanel(`<div class="ap-chips" data-keys>${Object.keys(KEYS).map((k) => `<button type="button" data-key="${k}">${k} major</button>`).join("")}</div><p class="ap-status" data-dots></p>`);
    const name = (midi) => (FLAT_KEYS[key] ? FLATS : SHARPS)[midi % 12];
    const draw = () => {
      clear();
      kb = keyboard({ onKey, low: 60, high: 84, top: 300, height: 260 });
      const builtCount = notes.length;
      for (let i = 0; i < builtCount; i++) {
        kb.mark(notes[i], "sel");
        const x = kb.centre(notes[i]);
        const tt = el("text", { x, y: 270, "text-anchor": "middle", "font-size": 30, "font-weight": 800, fill: "#7a4520" });
        tt.textContent = name(notes[i]);
        if (i > 0) {
          const x0 = kb.centre(notes[i - 1]);
          el("path", { d: `M${x0} 230Q${(x0 + x) / 2} 170 ${x} 230`, fill: "none", stroke: STEPS[i - 1] === 2 ? "#3f7d4e" : "#d9822b", "stroke-width": 4 });
          const lab = el("text", { x: (x0 + x) / 2, y: 180, "text-anchor": "middle", "font-size": 24, "font-weight": 800, fill: STEPS[i - 1] === 2 ? "#3f7d4e" : "#d9822b" });
          lab.textContent = STEPS[i - 1] === 2 ? "W" : "H";
        }
      }
      const pattern = el("text", { x: W / 2, y: 70, "text-anchor": "middle", "font-size": 34, "font-weight": 800, fill: "#2b1d12" });
      pattern.innerHTML = STEPS.map((s, i) => `<tspan fill="${i < builtCount - 1 ? (s === 2 ? "#3f7d4e" : "#d9822b") : "#c9b8a1"}">${s === 2 ? "W" : "H"}</tspan>`).join(" ");
      $("[data-dots]").textContent = `${key} major · note ${Math.min(builtCount + 1, 8)} of 8`;
    };
    const begin = (k) => {
      key = k;
      notes = [KEYS[k]];
      at = 1;
      missed = 0;
      panel.querySelectorAll("[data-key]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.key === k)));
      draw();
      MUSIC.play("piano", KEYS[k], { length: 0.8 });
      say(`Let's build the ${k} major scale. We start on ${k}. The pattern is whole, whole, half, whole, whole, whole, half. A whole step skips one key. A half step goes to the very next key. Play the next note!`);
    };
    function onKey(midi) {
      if (my !== token || at > 7) return;
      const want = notes[at - 1] + STEPS[at - 1];
      if (midi === want) {
        notes.push(midi);
        at += 1;
        missed = 0;
        draw();
        if (at > 7) return finish();
        say(`${pick(PRAISE)} ${name(midi)}.`, { voice: false });
      } else {
        missed += 1;
        if (missed === 1) MUSIC.oops();
        const gap = midi - notes[at - 1];
        const stepName = STEPS[at - 1] === 2 ? "a whole step (skip one key)" : "a half step (the very next key)";
        say(`${gap === 1 ? "That's only a half step." : gap === 2 ? "That's a whole step." : "That's too far."} We need ${stepName} from ${name(notes[at - 1])}.${missed >= 2 ? ` It's ${name(want)}.` : ""}`);
        if (missed >= 2) {
          draw();
          kb.mark(want, "hint");
        }
      }
    }
    const finish = async () => {
      MUSIC.chime();
      const t0 = MUSIC.now() + 0.4;
      notes.forEach((m, i) => MUSIC.play("piano", m, { at: t0 + i * 0.32, length: 0.4 }));
      const special = notes.map(name).filter((n) => n.length > 1);
      const built = new Set([...(shell.progress().t5?.keys || []), key]);
      shell.mark("t5", { keys: [...built], done: ["C", "G", "D", "F"].every((k) => built.has(k)) });
      window.OC?.count("scales built");
      say(`🎉 You built ${key} major: ${notes.map(name).join(", ")}. ${special.length ? `It has ${special.length} ${special[0].includes("♯") ? "sharp" : "flat"}${special.length > 1 ? "s" : ""}: ${special.join(", ")}. That's its key signature!` : "It uses only white keys, so it has no sharps or flats."} Pick another key!`);
    };
    panel.onclick = (event) => {
      const b = event.target.closest("[data-key]");
      if (b) begin(b.dataset.key);
    };
    begin("C");
  },

  t6() {
    const my = token;
    const NAMES = { 1: "2nd", 2: "3rd", 3: "4th", 4: "5th", 5: "6th", 6: "7th", 7: "octave" };
    const SONGS = { 1: "Happy Birthday: hap-py", 2: "When the Saints: oh when", 4: "Twinkle Twinkle: twin-kle, twin-kle", 7: "Somewhere Over the Rainbow: some-where" };
    let modeName = "sight";
    let round = 0;
    let right = 0;
    let q = null;
    setPanel(`<div class="ap-chips" data-modes><button type="button" data-m="sight" aria-pressed="true">By sight</button><button type="button" data-m="ear">By ear</button></div><p class="ap-status" data-dots></p><div class="ap-chips kt-choices" data-answers></div><div class="ap-buttons" data-tools></div>`);
    const ask = () => {
      q = null;
      const pool = modeName === "ear" ? [1, 2, 4, 7] : [1, 2, 3, 4, 5, 6, 7];
      const size = pick(pool);
      const lowStep = stepOf(60) + pickInt(0, 4);
      const a = midiOfStep(lowStep);
      const b = midiOfStep(lowStep + size);
      q = { size, a, b };
      clear();
      if (modeName === "sight") {
        staff();
        noteHead(420, stepOf(a), { value: "w" });
        noteHead(600, stepOf(b), { value: "w" });
        say(`What interval is this? Count every line and space from the low note to the high note, counting both notes.`);
      } else {
        const tt = el("text", { x: W / 2, y: 250, "text-anchor": "middle", "font-size": 100 });
        tt.textContent = "👂";
        say("Listen to the two notes. What interval is it?");
        setTimeout(() => my === token && hear(), 1800);
      }
      $("[data-answers]").innerHTML = pool.map((s) => `<button type="button" data-i="${s}">${NAMES[s]}</button>`).join("");
      $("[data-tools]").innerHTML = `<button type="button" data-do="hear">🔊 Hear it</button>`;
      $("[data-dots]").textContent = `${modeName === "sight" ? "By sight" : "By ear"} · question ${round + 1} of 10`;
    };
    const hear = () => {
      const t0 = MUSIC.now() + 0.1;
      MUSIC.play("piano", q.a, { at: t0, length: 0.8 });
      MUSIC.play("piano", q.b, { at: t0 + 0.9, length: 0.9 });
    };
    const start = (m) => {
      modeName = m;
      round = 0;
      right = 0;
      panel.querySelectorAll("[data-m]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.m === m)));
      ask();
    };
    panel.onclick = async (event) => {
      if (my !== token) return;
      const m = event.target.closest("[data-m]");
      if (m) return start(m.dataset.m);
      if (event.target.closest("[data-do='hear']") && q) return hear();
      const pickBtn = event.target.closest("[data-i]");
      if (!pickBtn || !q || q.done) return;
      q.done = true;
      const ok = Number(pickBtn.dataset.i) === q.size;
      round += 1;
      window.OC?.count("intervals");
      pickBtn.classList.add(ok ? "right" : "wrong");
      const letters = Array.from({ length: q.size + 1 }, (_, k) => MUSIC.letterOf(midiOfStep(stepOf(q.a) + k))).join(", ");
      if (ok) {
        right += 1;
        MUSIC.chime();
        say(`${pick(PRAISE)} A ${NAMES[q.size]}: ${letters}.${modeName === "ear" && SONGS[q.size] ? ` It sounds like ${SONGS[q.size]}.` : ""}`);
      } else say(`It's a ${NAMES[q.size]}. Count: ${letters}. That's ${q.size + 1} notes.${modeName === "ear" && SONGS[q.size] ? ` Remember ${SONGS[q.size]}.` : ""}`);
      hear();
      await wait(3600);
      if (my !== token) return;
      if (round >= 10) {
        const prev = shell.progress().t6 || {};
        const data = { ...prev, [modeName]: Math.max(right, prev[modeName] || 0) };
        data.done = (data.sight || 0) >= 8 && (data.ear || 0) >= 8;
        shell.mark("t6", data);
        say(`${right} out of 10! ${right >= 8 ? "Interval expert! 🎉" : "Let's practise more."}`);
        round = 0;
        right = 0;
        await wait(3000);
      }
      if (my === token) ask();
    };
    start("sight");
  },

  t7() {
    const my = token;
    const CHORDS = [
      ["C major", [60, 64, 67], "C, E, G"],
      ["F major", [65, 69, 72], "F, A, C"],
      ["G major", [67, 71, 74], "G, B, D"],
      ["A minor", [69, 72, 76], "A, C, E"],
      ["D minor", [62, 65, 69], "D, F, A"],
      ["E minor", [64, 67, 71], "E, G, B"],
      ["D major", [62, 66, 69], "D, F♯, A"],
      ["C minor", [60, 63, 67], "C, E♭, G"],
    ];
    let modeName = "build";
    let chord = null;
    let chosen = [];
    let kb;
    let built = new Set(shell.progress().t7?.built || []);
    let round = 0;
    let right = 0;
    let heard = null;
    setPanel(`<div class="ap-chips" data-modes><button type="button" data-m="build" aria-pressed="true">Build chords</button><button type="button" data-m="ear">Happy or sad?</button></div><p class="ap-status" data-dots></p><div class="ap-chips" data-list></div><div class="ap-buttons" data-tools></div>`);
    const playChord = (notes, arp = true) => {
      const t0 = MUSIC.now() + 0.1;
      notes.forEach((m) => MUSIC.play("piano", m, { at: t0, length: 1.4, gain: 0.7 }));
      if (arp) notes.forEach((m, i) => MUSIC.play("piano", m, { at: t0 + 1.6 + i * 0.3, length: 0.5, gain: 0.7 }));
    };
    const drawBuild = () => {
      clear();
      kb = keyboard({ onKey, low: 60, high: 84, top: 300, height: 260 });
      chosen.forEach((m) => kb.mark(m, "sel"));
      const tt = el("text", { x: W / 2, y: 150, "text-anchor": "middle", "font-size": 64, "font-weight": 800, fill: "#2b1d12" });
      tt.textContent = chord[0];
      const sub = el("text", { x: W / 2, y: 220, "text-anchor": "middle", "font-size": 28, "font-weight": 600, fill: "#8a7764" });
      sub.textContent = `Tap 3 keys: root, third, fifth · ${chosen.length} of 3`;
    };
    const nextChord = () => {
      const remaining = CHORDS.filter((c) => !built.has(c[0]));
      chord = remaining.length ? remaining[0] : pick(CHORDS);
      chosen = [];
      drawBuild();
      const minor = chord[0].includes("minor");
      say(`Build ${chord[0]}. Start on ${chord[0].split(" ")[0]}, the root. Then skip a key up for the third${minor ? ": a minor third is 3 half steps" : ": a major third is 4 half steps"}, then up to the fifth.`);
      $("[data-list]").innerHTML = CHORDS.map((c) => `<button type="button" data-c="${c[0]}" aria-pressed="${c === chord}">${built.has(c[0]) ? "✓ " : ""}${c[0]}</button>`).join("");
      $("[data-tools]").innerHTML = `<button type="button" data-do="clear">Clear</button>`;
      $("[data-dots]").textContent = `${built.size} of ${CHORDS.length} chords built`;
    };
    function onKey(midi) {
      if (my !== token || modeName !== "build") return;
      if (chosen.includes(midi)) chosen = chosen.filter((m) => m !== midi);
      else chosen.push(midi);
      drawBuild();
      if (chosen.length < 3) return;
      const want = new Set(chord[1].map((m) => m % 12));
      const got = new Set(chosen.map((m) => m % 12));
      if ([...want].every((p) => got.has(p)) && got.size === 3) {
        built.add(chord[0]);
        shell.mark("t7", { built: [...built], done: built.size >= 6 });
        window.OC?.count("chords built");
        MUSIC.chime();
        playChord(chord[1]);
        say(`🎉 ${chord[0]}: ${chord[2]}. ${chord[0].includes("minor") ? "Minor chords sound sad or serious." : "Major chords sound happy and bright."}`);
        setTimeout(() => my === token && modeName === "build" && nextChord(), 4200);
      } else {
        MUSIC.oops();
        say(`Not quite. ${chord[0]} is ${chord[2]}. Tap a key again to remove it, then try.`);
      }
    }
    const earAsk = () => {
      clear();
      const tt = el("text", { x: W / 2, y: 260, "text-anchor": "middle", "font-size": 100 });
      tt.textContent = "😊 😢";
      const c = pick(CHORDS);
      heard = c;
      $("[data-list]").innerHTML = `<button type="button" class="ap-big" data-ans="major" aria-label="Happy, major">😊</button><button type="button" class="ap-big" data-ans="minor" aria-label="Sad, minor">😢</button>`;
      $("[data-tools]").innerHTML = `<button type="button" data-do="hear">🔊 Hear it again</button>`;
      $("[data-dots]").textContent = `Question ${round + 1} of 10`;
      say("Listen to the chord. Is it happy, major? Or sad, minor?");
      setTimeout(() => my === token && playChord(c[1]), 2200);
    };
    const start = (m) => {
      modeName = m;
      round = 0;
      right = 0;
      panel.querySelectorAll("[data-m]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.m === m)));
      if (m === "build") nextChord();
      else earAsk();
    };
    panel.onclick = async (event) => {
      if (my !== token) return;
      const m = event.target.closest("[data-m]");
      if (m) return start(m.dataset.m);
      const c = event.target.closest("[data-c]");
      if (c) {
        chord = CHORDS.find((x) => x[0] === c.dataset.c);
        chosen = [];
        drawBuild();
        $("[data-list]").querySelectorAll("[data-c]").forEach((b) => b.setAttribute("aria-pressed", String(b === c)));
        say(`Build ${chord[0]}.`);
        return;
      }
      if (event.target.closest("[data-do='clear']")) {
        chosen = [];
        drawBuild();
      }
      if (event.target.closest("[data-do='hear']") && heard) playChord(heard[1]);
      const ans = event.target.closest("[data-ans]")?.dataset.ans;
      if (ans && heard) {
        const truth = heard[0].includes("minor") ? "minor" : "major";
        const ok = ans === truth;
        round += 1;
        if (ok) {
          right += 1;
          MUSIC.chime();
        }
        say(`${ok ? pick(PRAISE) : "Listen again."} It was ${heard[0]}: ${truth === "major" ? "happy 😊" : "sad 😢"}.`);
        const last = heard;
        heard = null;
        playChord(last[1], false);
        await wait(2800);
        if (my !== token) return;
        if (round >= 10) {
          say(`${right} out of 10! ${right >= 8 ? "Great ears! 🎉" : "Let's listen again."}`);
          round = 0;
          right = 0;
          await wait(2800);
        }
        if (my === token && modeName === "ear") earAsk();
      }
    };
    start("build");
  },

  t8() {
    const my = token;
    const TUNES = [
      { name: "Hot Cross Buns", notes: "E4q D4q C4h E4q D4q C4h C4e C4e C4e C4e D4e D4e D4e D4e E4q D4q C4h" },
      { name: "Mary Had a Little Lamb", notes: "E4q D4q C4q D4q E4q E4q E4h D4q D4q D4h E4q G4q G4h" },
      { name: "Lightly Row", notes: "G4q E4q E4h F4q D4q D4h C4q D4q E4q F4q G4q G4q G4h" },
      { name: "Ode to Joy", notes: "E4q E4q F4q G4q G4q F4q E4q D4q C4q C4q D4q E4q E4q D4q D4h" },
      { name: "Twinkle Twinkle", notes: "C4q C4q G4q G4q A4q A4q G4h F4q F4q E4q E4q D4q D4q C4h" },
      { name: "Jingle Bells", notes: "E4q E4q E4h E4q E4q E4h E4q G4q C4q D4q E4w" },
    ];
    let tune = 0;
    let notes = [];
    let at = 0;
    let missed = 0;
    let kb;
    let errors = 0;
    let beatMode = false;
    let beatStart = 0;
    let hits = [];
    setPanel(`<div class="ap-chips" data-tunes>${TUNES.map((x, i) => `<button type="button" data-tune="${i}">${x.name}</button>`).join("")}</div><p class="ap-status" data-dots></p><div class="ap-buttons"><button type="button" data-do="listen">🔊 Listen</button><button type="button" class="primary" data-do="beat">🥁 Play with the beat</button><button type="button" data-do="restart">↺ Start again</button></div>`);
    const parse = (s) => s.split(" ").map((tok) => ({ midi: MUSIC.midiOf(tok.slice(0, -1)), value: tok.slice(-1) }));
    const layout = () => {
      let beat = 0;
      return notes.map((n) => {
        const b = beat;
        beat += VALUES[n.value].beats;
        return b;
      });
    };
    const draw = () => {
      clear();
      staff({ x0: 30, x1: 970 });
      const weights = notes.map((n) => Math.max(1.05, Math.sqrt(VALUES[n.value].beats)));
      const sum = weights.reduce((s, w) => s + w, 0);
      const xs = [];
      let acc = 0;
      weights.forEach((w) => {
        xs.push(130 + (acc / sum) * 820);
        acc += w;
      });
      let beat = 0;
      notes.forEach((n, i) => {
        if (i > 0 && beat > 0 && beat % 4 === 0) el("line", { class: "st-line", x1: xs[i] - 22, x2: xs[i] - 22, y1: BOTTOM - 4 * LINE_GAP, y2: BOTTOM, "stroke-width": 2 });
        beat += VALUES[n.value].beats;
      });
      let pos = 0;
      notes.forEach((n, i) => {
        const pairStart = n.value === "e" && notes[i + 1]?.value === "e" && pos % 1 === 0;
        const pairEnd = n.value === "e" && notes[i - 1]?.value === "e" && pos % 1 === 0.5;
        noteHead(xs[i] + 8, stepOf(n.midi), { value: pairStart || pairEnd ? "q" : n.value, now: i === at });
        if (pairStart) {
          const y1 = yOf(stepOf(n.midi)) - 72;
          const y2 = yOf(stepOf(notes[i + 1].midi)) - 72;
          const top = Math.min(y1, y2);
          el("line", { x1: xs[i] + 20.5, x2: xs[i + 1] + 20.5, y1: top, y2: top, stroke: "#2b1d12", "stroke-width": 7 });
          if (y1 > top) el("line", { class: "st-stem", x1: xs[i] + 20.5, x2: xs[i] + 20.5, y1: y1, y2: top });
          if (y2 > top) el("line", { class: "st-stem", x1: xs[i + 1] + 20.5, x2: xs[i + 1] + 20.5, y1: y2, y2: top });
        }
        pos += VALUES[n.value].beats;
      });
      kb = keyboard({ onKey, low: 60, high: 84, top: 330, height: 250 });
      $("[data-dots]").textContent = `${TUNES[tune].name} · note ${Math.min(at + 1, notes.length)} of ${notes.length}`;
    };
    const choose = (i) => {
      tune = i;
      notes = parse(TUNES[i].notes);
      at = 0;
      missed = 0;
      errors = 0;
      beatMode = false;
      panel.querySelectorAll("[data-tune]").forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.tune) === i)));
      draw();
      say(`${TUNES[i].name}. Read the orange note and play it on the piano. Go at your own speed. When you're ready, try Play with the beat!`);
    };
    const listen = () => {
      const B = 60 / 80;
      const t0 = MUSIC.now() + 0.2;
      layout().forEach((b, i) => MUSIC.play("piano", notes[i].midi, { at: t0 + b * B, length: VALUES[notes[i].value].beats * B * 0.9 }));
    };
    function onKey(midi) {
      if (my !== token) return;
      if (beatMode) {
        hits.push({ midi, t: (MUSIC.now() - beatStart) / (60 / 60) });
        return;
      }
      if (at >= notes.length) return;

  let beat = 0;

  for (const v of pattern) {
    noteHead(150 + (beat / 4) * 760 + 20, step, { value: v });

  }
}
function playRhythm(pattern, { countIn = true, bpm = 76 } = {}) {
  const B = 60 / bpm;
  const t0 = MUSIC.now() + 0.15;
  const lead = countIn ? 4 : 0;
  for (let k = 0; k < lead; k++) MUSIC.tick(k === 0, t0 + k * B);
  let beat = 0;
  for (const v of pattern) {
    MUSIC.play("woodblock", 79, { gain: 0.85, at: t0 + (lead + beat) * B });
    beat += VALUES[v].beats;
  }
}

function runLesson(id, then) {
  const my = token;
  const slides = LESSONS[id];
  let step = 0;
  setPanel(`<p class="ap-status" data-dots></p><div class="ap-buttons"><button type="button" data-l="back">◀ Back</button><button type="button" data-l="hear">🔊 Hear it</button><button type="button" class="primary" data-l="next">Next ▶</button></div><button type="button" class="ap-link" data-l="skip">Skip to practice</button>`, { explain: false });
  const show = () => {
    const slide = slides[step];
    CLEF = "treble";
    clear();
    slide.draw();
    $("[data-dots]").textContent = slides.length > 1 ? `Lesson · step ${step + 1} of ${slides.length}` : "Before you start";
    panel.querySelector('[data-l="back"]').disabled = step === 0;
    panel.querySelector('[data-l="hear"]').hidden = !slide.sound;
    panel.querySelector('[data-l="next"]').textContent = step === slides.length - 1 ? (id === "place" ? "Start the check ▶" : "Start practice ▶") : "Next ▶";
    panel.querySelector('[data-l="skip"]').hidden = step === slides.length - 1;
    $("[data-say]").innerHTML = slide.text;
    VOICE.speakAsync(slide.text).then((ok) => {
      if (ok && my === token && slides[step] === slide && slide.sound) slide.sound();
    });
  };
  const finish = () => {
    VOICE.hush();
    shell.mark(id, { learned: true });
    window.OC?.count("lessons read");
    token += 1;
    then();
  };
  panel.onclick = (event) => {
    const what = event.target.closest("[data-l]")?.dataset.l;
    if (!what || my !== token) return;
    if (what === "back" && step > 0) {
      step -= 1;
      show();
    }
    if (what === "hear") {
      VOICE.hush();
      slides[step].sound?.();
    }
    if (what === "next") {
      if (step < slides.length - 1) {
        step += 1;
        show();
      } else finish();
    }
    if (what === "skip") finish();
  };
  show();
}

panel.addEventListener("click", (event) => {
  if (!event.target.closest("[data-explain]")) return;
  const id = currentUnit;
  token += 1;
  keyHandler = null;
  panel.onclick = null;
  VOICE.hush();
  runLesson(id, () => units[id]());
});

const shell = SHELL({
  units: UNITS,
  start: MUSIC.progress.of((window.OC && OC.current()) || "Learner").place?.done ? "t1" : "place",
  subject: "Music",
  activity: "Music Theory",
  onUnit(id) {
    token += 1;
    currentUnit = id;
    CLEF = "treble";
    svg.onpointerdown = null;
    keyHandler = null;
    panel.onclick = null;
    VOICE.hush();
    if (LESSONS[id] && !shell.progress()[id]?.learned) runLesson(id, () => units[id]());
    else units[id]();
  },
});
