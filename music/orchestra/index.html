// Draw an instrument at (x, y), about `size` tall.
function drawInst(parent, key, x, y, size = 200, attrs = {}) {
  defs(parent.ownerSVGElement || parent);
  const g = el("g", { transform: `translate(${x} ${y})`, ...attrs }, parent);
  const mid = el("g", {}, g);
  const inner = el("g", { transform: `scale(${size / 240})` }, mid);
  DRAW[key](inner);

}

// ---------- waves ----------
function wavePath(x0, x1, y, amp, cycles, phase = 0) {
  const pts = [];
  const n = Math.max(80, Math.round(cycles * 24));
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    pts.push(`${(x0 + (x1 - x0) * t).toFixed(1)} ${(y - amp * Math.sin(2 * Math.PI * (cycles * t - phase))).toFixed(1)}`);
  }
  return `M${pts.join(" L")}`;
}
const hz = (midi) => Math.round(440 * 2 ** ((midi - 69) / 12));
const noteName = (midi) => `${MUSIC.prettyOf(midi)}${Math.floor(midi / 12) - 1}`;

function stagePlan(parent, { labels = true } = {}) {
  const g = el("g", {}, parent);
  const cx = 500;
  const cy = 1500;
  const bands = [
    ["percussion", 10, 150],
    ["brass", 150, 262],
    ["woodwinds", 262, 375],
    ["strings", 375, 640],
  ];
  const ring = (r0, r1) => {
    const a0 = Math.asin(Math.min(1, 640 / r0));
    const a1 = Math.asin(Math.min(1, 640 / r1));
    const p = (r, a) => `${(cx + r * Math.sin(a)).toFixed(1)} ${(cy - r * Math.cos(a)).toFixed(1)}`;
    return `M${p(r0, -a0)} A${r0} ${r0} 0 0 1 ${p(r0, a0)} L${p(r1, a1)} A${r1} ${r1} 0 0 0 ${p(r1, -a1)} Z`;
  };
  for (const [fam, y0, y1] of bands) el("path", { d: ring(cy - y0, cy - y1), fill: FAM[fam].soft, stroke: "#fff", "stroke-width": 6 }, g);

// ---------- 2. Sound wave lab ----------
const LAB = { harp: [48, 84], flute: [60, 84], cello: [36, 69] };
function waveLab() {
  const my = token;
  let inst = "harp";
  let pitch = 0.5;
  let loud = 0.6;
  let mode = "free";
  let task = null;
  let tasks = 0;
  let plays = 0;
  let phase = 0;
  let pulse = 0;
  panel(`<div class="ap-row"><p class="ap-status" data-status></p><div class="ap-chips" data-insts>${Object.keys(LAB).map((k) => `<button type="button" data-i="${k}" aria-pressed="${k === inst}">${cap(k)}</button>`).join("")}</div><div class="ap-chips" data-modes><button type="button" data-m="free" aria-pressed="true">🧪 Explore</button><button type="button" data-m="task" aria-pressed="false">🎯 Challenge</button></div></div><div class="ap-buttons"><button type="button" class="primary" data-do="play" data-pulse>▶ Play</button></div>`);
  const midiOf = () => Math.round(LAB[inst][0] + pitch * (LAB[inst][1] - LAB[inst][0]));
  const gainOf = () => 0.06 + loud * 0.94;
  let wave;
  let readout;
  let picG;
  const sliders = {};
  const draw = () => {
    fresh();
    el("rect", { x: 190, y: 26, width: 660, height: 280, rx: 26, fill: "#fff", stroke: "#e2d6c4", "stroke-width": 3 }, view);
    el("line", { x1: 210, x2: 830, y1: 166, y2: 166, stroke: "#eee4d4", "stroke-width": 3, "stroke-dasharray": "8 8" }, view);
    picG = drawInst(view, inst, 100, 166, 180);
    emoji(view, 920, 166, "👂", 90);
    wave = el("path", { stroke: "var(--accent)", "stroke-width": 6, fill: "none", "stroke-linejoin": "round" }, view);
    readout = text(view, 520, 292, "", { "font-size": 23, fill: "#7a5a3e" });
    slider("pitch", 380, "🐻 Low", "High 🐦", "#2f9a62");
    slider("loud", 480, "🐭 Soft", "Loud 🦁", "#c8642a");
    view.addEventListener("pointerdown", down);
    view.addEventListener("pointermove", moveDrag);
    view.addEventListener("pointerup", upDrag);
    update();
  };
  const X0 = 300;
  const X1 = 820;
  function slider(name, y, left, right, color) {
    const g = el("g", { class: "or-slider", "data-s": name }, view);
    el("rect", { x: X0 - 40, y: y - 40, width: X1 - X0 + 80, height: 80, fill: "transparent" }, g);
    el("rect", { x: X0, y: y - 9, width: X1 - X0, height: 18, rx: 9, fill: "#efe6d6" }, g);
    const fill = el("rect", { x: X0, y: y - 9, width: 10, height: 18, rx: 9, fill: color }, g);
    const knob = el("circle", { cx: X0, cy: y, r: 30, fill: "#fff", stroke: color, "stroke-width": 7 }, g);
    text(view, 200, y + 9, left, { "font-size": 26, fill: INK });
    text(view, 910, y + 9, right, { "font-size": 26, fill: INK });
    sliders[name] = { fill, knob };
  }
  const update = () => {
    for (const [name, v] of [["pitch", pitch], ["loud", loud]]) {
      const x = X0 + v * (X1 - X0);
      sliders[name].knob.setAttribute("cx", x);
      sliders[name].fill.setAttribute("width", Math.max(18, x - X0));
    }
    const m = midiOf();
    readout.textContent = `${noteName(m)} · ${hz(m)} wobbles every second · ${loud > 0.66 ? "loud" : loud < 0.34 ? "soft" : "medium"}`;
  };
  const cyclesOf = () => 1.4 * 2 ** ((midiOf() - 36) / 12);
  loop(() => {
    phase += 0.004 * cyclesOf();
    pulse = Math.max(0, pulse - 0.012);
    const amp = (10 + loud * 105) * (0.55 + pulse * 0.45);
    wave?.setAttribute("d", wavePath(210, 830, 166, amp, cyclesOf(), phase));
  }, my);
  let drag = null;
  const setFrom = (event) => {
    const p = svgPoint(event);
    const v = Math.max(0, Math.min(1, (p.x - X0) / (X1 - X0)));
    if (drag === "pitch") pitch = v;
    else loud = v;
    update();
  };
  function down(event) {
    const s = event.target.closest(".or-slider");
    if (!s) {
      if (event.target.closest("g") === picG || picG.contains(event.target)) playIt();
      return;
    }
    event.preventDefault();
    window.OC?.touch();
    drag = s.dataset.s;
    try {
      view.setPointerCapture(event.pointerId);
    } catch {}
    setFrom(event);
  }
  function moveDrag(event) {
    if (drag) setFrom(event);
  }
  function upDrag() {
    if (!drag) return;
    drag = null;
    playIt(false);
  }
  const zone = (v) => (v > 0.66 ? "high" : v < 0.34 ? "low" : "mid");
  const lzone = (v) => (v > 0.66 ? "loud" : v < 0.34 ? "soft" : "mid");
  const TASKS = [
    { p: "high", say: "Make a <b>high</b> sound! 🐦" },
    { p: "low", say: "Make a <b>low</b> sound! 🐻" },
    { l: "soft", say: "Make a <b>soft</b> sound! 🐭" },
    { l: "loud", say: "Make a <b>loud</b> sound! 🦁" },
    { p: "low", l: "loud", say: "Make a <b>low, loud</b> sound! 🐻🦁" },
    { p: "high", l: "soft", say: "Make a <b>high, soft</b> sound! 🐦🐭" },
    { p: "high", l: "loud", say: "Make a <b>high, loud</b> sound! 🐦🦁" },
    { p: "low", l: "soft", say: "Make a <b>low, soft</b> sound! 🐻🐭" },
  ];
  const nextTask = () => {
    task = TASKS[tasks % TASKS.length];
    status(`Challenge ${tasks + 1} of 8`);
    say(`${task.say} Move the knobs, then press ▶ Play.`);
  };
  const playIt = async (check = true) => {
    if (my !== token) return;
    window.OC?.touch();
    const m = midiOf();
    playInst(inst, m, { gain: gainOf(), length: 1.4 });
    bump(picG);
    pulse = 1;
    plays += 1;
    window.OC?.count("sounds made");
    const t = task;
    if (mode === "task" && t && check) {

      start();
    }
  };
  start();
}
