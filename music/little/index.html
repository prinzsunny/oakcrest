<script>const $ = (selector) => document.querySelector(selector);
const stage = $("[data-stage]");
const panel = $("[data-panel]");
const NS = "http://www.w3.org/2000/svg";

const BARS = [
  { midi: 72, letter: "C", color: "#e53935", name: "red" },
  { midi: 74, letter: "D", color: "#fb8c00", name: "orange" },
  { midi: 76, letter: "E", color: "#fdd835", name: "yellow" },
  { midi: 77, letter: "F", color: "#43a047", name: "green" },
  { midi: 79, letter: "G", color: "#26a69a", name: "teal" },
  { midi: 81, letter: "A", color: "#1e88e5", name: "blue" },
  { midi: 83, letter: "B", color: "#8e24aa", name: "purple" },
  { midi: 84, letter: "C", color: "#ec407a", name: "pink" },
];
const byLetter = { C: 0, D: 1, E: 2, F: 3, G: 4, A: 5, B: 6, "C'": 7 };

const SONGS = [
  { name: "Hot Cross Buns", notes: "E D C- E D C- C C C C D D D D E D C-" },
  { name: "Mary Had a Little Lamb", notes: "E D C D E E E- D D D- E G G- E D C D E E E E D D E D C--" },
  { name: "Twinkle Twinkle", notes: "C C G G A A G- F F E E D D C- G G F F E E D- G G F F E E D- C C G G A A G- F F E E D D C-" },
  { name: "Ode to Joy", notes: "E E F G G F E D C C D E E. D_ D- E E F G G F E D C C D E D. C_ C-" },
];
const parseSong = (text) =>
  text.split(/\s+/).map((token) => {
    const letter = token.replace(/[-._]/g, "");
    const beats = token.endsWith("--") ? 4 : token.endsWith("-") ? 2 : token.endsWith(".") ? 1.5 : token.endsWith("_") ? 0.5 : 1;
    return { bar: byLetter[letter], beats };
  });

const UNITS = [
  { id: "u0", label: "👀 See it", icon: "👀" },
  { id: "free", label: "Free play" },
  { id: "u1", label: "1. Meet the xylophone" },
  { id: "u2", label: "2. Loud or soft? Fast or slow?" },
  { id: "u3", label: "3. Higher or lower?" },
  { id: "u4", label: "4. Copy me" },
  { id: "u5", label: "5. Clap the beat" },
  { id: "u6", label: "6. First songs" },
  { id: "u7", label: "7. Colours to letters" },
  { id: "u8", label: "8. Animal sounds: high or low?" },
];

const W = 1000;
const H = 520;
const BAR_W = 92;
const GAP = 22;
const X0 = (W - (8 * BAR_W + 7 * GAP)) / 2;
const MID = 262;
const lengthOf = (i) => 430 - i * 19;
const svg = document.createElementNS(NS, "svg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.setAttribute("role", "group");
svg.setAttribute("aria-label", "A xylophone with eight coloured wooden bars, from low C on the left to high C on the right");

function el(name, attrs = {}, parent = svg) {
  const node = document.createElementNS(NS, name);
  for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
  parent.appendChild(node);
  return node;
}

function drawXylophone() {
  const defs = el("defs");
  defs.innerHTML = `
    <linearGradient id="xy-sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".22"/><stop offset=".18" stop-color="#fff" stop-opacity=".28"/><stop offset=".45" stop-color="#fff" stop-opacity=".06"/><stop offset=".8" stop-color="#000" stop-opacity=".05"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></linearGradient>
    <linearGradient id="xy-rail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b4226"/><stop offset=".5" stop-color="#4a2c17"/><stop offset="1" stop-color="#2f1b0d"/></linearGradient>
    <linearGradient id="xy-frame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5a35"/><stop offset="1" stop-color="#5b371d"/></linearGradient>
    <radialGradient id="xy-pin" cx=".35" cy=".35" r=".7"><stop offset="0" stop-color="#fff3c4"/><stop offset=".5" stop-color="#d4a94a"/><stop offset="1" stop-color="#7a5a1a"/></radialGradient>
    <filter id="xy-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#3a2210" flood-opacity=".35"/></filter>
    <filter id="xy-glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
  el("ellipse", { cx: W / 2, cy: 500, rx: 470, ry: 14, fill: "#3a2210", opacity: 0.18 });
  const top = (i) => MID - lengthOf(i) / 2 + lengthOf(i) * 0.224;
  const bottom = (i) => MID + lengthOf(i) / 2 - lengthOf(i) * 0.224;
  const x0 = X0 - 30;
  const x1 = X0 + 8 * BAR_W + 7 * GAP + 30;
  const slope = (fn) => [fn(0) - ((fn(1) - fn(0)) * 30) / (BAR_W + GAP), fn(7) + ((fn(7) - fn(6)) * 30) / (BAR_W + GAP)];
  for (const fn of [top, bottom]) {
    const [a, b] = slope(fn);
    el("path", { d: `M${x0} ${a - 13}L${x1} ${b - 13}L${x1} ${b + 13}L${x0} ${a + 13}Z`, fill: "url(#xy-rail)", filter: "url(#xy-shadow)" });
    el("path", { d: `M${x0} ${a - 13}L${x1} ${b - 13}`, stroke: "#8a5a35", "stroke-width": 2, opacity: 0.6 });
  }
  BARS.forEach((bar, i) => {
    const x = X0 + i * (BAR_W + GAP);
    const L = lengthOf(i);
    const y = MID - L / 2;
    const g = el("g", { class: "xy-bar", "data-i": i, tabindex: 0, role: "button", "aria-label": `${bar.name} bar, ${bar.letter}` });
    g.style.transformOrigin = `${x + BAR_W / 2}px ${MID}px`;
    el("rect", { class: "xy-halo", x: x - 8, y: y - 8, width: BAR_W + 16, height: L + 16, rx: 22, fill: bar.color, opacity: 0, filter: "url(#xy-glow)" }, g);
    el("rect", { x, y, width: BAR_W, height: L, rx: 16, fill: bar.color, filter: "url(#xy-shadow)" }, g);
    el("rect", { x, y, width: BAR_W, height: L, rx: 16, fill: "url(#xy-sheen)" }, g);
    const grain = el("g", { opacity: 0.16, stroke: "#3a1a05", fill: "none", "stroke-width": 1.2, "stroke-linecap": "round" }, g);
    for (let k = 0; k < 5; k++) {
      const gx = x + 14 + k * 16 + ((i * 7 + k * 5) % 6);
      el("path", { d: `M${gx} ${y + 18}C${gx + 6} ${y + L * 0.3} ${gx - 6} ${y + L * 0.62} ${gx + 3} ${y + L - 18}` }, grain);
    }
    el("rect", { x: x + 1.5, y: y + 1.5, width: BAR_W - 3, height: L - 3, rx: 15, fill: "none", stroke: "#fff", "stroke-opacity": 0.35, "stroke-width": 1.5 }, g);
    el("rect", { x, y, width: BAR_W, height: L, rx: 16, fill: "none", stroke: "#2b1608", "stroke-opacity": 0.45, "stroke-width": 1.5 }, g);
    for (const py of [top(i), bottom(i)]) {
      el("circle", { cx: x + BAR_W / 2, cy: py, r: 7, fill: "url(#xy-pin)", stroke: "#5b4210", "stroke-width": 1 }, g);
      el("circle", { cx: x + BAR_W / 2 - 2, cy: py - 2, r: 2, fill: "#fff", opacity: 0.8 }, g);
    }
    const label = el("text", { class: "xy-letter", x: x + BAR_W / 2, y: MID + 20, "text-anchor": "middle", fill: "#fff", "font-size": 54, "font-weight": 800, "font-family": "ui-rounded, ui-sans-serif, system-ui, sans-serif", stroke: "rgba(0,0,0,.35)", "stroke-width": 2, "paint-order": "stroke" }, g);
    label.textContent = bar.letter;
    bar.g = g;
    bar.x = x + BAR_W / 2;
    bar.top = y;
  });
  const mallet = el("g", { class: "xy-mallet", opacity: 0, "pointer-events": "none" });
  el("rect", { x: -6, y: 22, width: 12, height: 150, rx: 6, fill: "#c9935e", stroke: "#7a4a22", "stroke-width": 1.5 }, mallet);
  el("circle", { cx: 0, cy: 0, r: 26, fill: "#fff7ec", stroke: "#a86b4f", "stroke-width": 2 }, mallet);
  el("circle", { cx: -8, cy: -8, r: 8, fill: "#fff", opacity: 0.8 }, mallet);
  return mallet;
}

stage.appendChild(svg);
const mallet = drawXylophone();
const style = document.createElement("style");
style.textContent = `
.ap-stage,.ap-stage svg{touch-action:none}
.xy-bar{cursor:pointer;transition:filter .2s}
.xy-bar:focus{outline:none}
.xy-bar:focus-visible .xy-halo{opacity:.5}
.xy-bar.hit{animation:xy-wobble .42s ease-out}
.bt-drum{cursor:pointer}
.bt-drum.hit{animation:xy-wobble .3s ease-out;transform-origin:500px 480px}
.xy-bar.glow .xy-halo{animation:xy-glow 1.1s ease-in-out infinite}
.xy-bar.flash .xy-halo{opacity:.8;transition:opacity .1s}
svg:not(.letters) .xy-letter{display:none}
.xy-mallet{transition:opacity .25s, transform .35s cubic-bezier(.32,.72,0,1)}
.xy-mallet.tap{animation:xy-tap .9s ease-in-out infinite}
.ap-strip{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;max-width:34em}
.ap-strip span{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);opacity:.45;transition:transform .2s,opacity .2s}
.ap-strip span.long{width:30px;border-radius:10px}
.ap-strip span.done{opacity:.9}
.ap-strip span.now{opacity:1;transform:scale(1.45)}
.ap-target{display:inline-block;min-width:1.4em;padding:0 .2em;border-radius:12px;color:#fff;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.35)}
@keyframes xy-wobble{0%{transform:scaleY(1)}20%{transform:scaleY(.965) translateY(4px)}45%{transform:scaleY(1.012)}70%{transform:scaleY(.995)}100%{transform:none}}
@keyframes xy-glow{0%,100%{opacity:.25}50%{opacity:.85}}
@keyframes xy-tap{0%,100%{translate:0 -26px}45%{translate:0 0}}
@media (max-height:460px){.ap-strip{gap:3px}.ap-strip span{width:13px;height:13px}.ap-strip span.long{width:20px}.ap-strip span.now{transform:scale(1.3)}.ap-chips button{min-height:32px;font-size:13px;padding:0 9px}}
@media (prefers-reduced-motion:reduce){.xy-bar.hit,.xy-bar.glow .xy-halo,.xy-mallet.tap{animation:none}.xy-bar.glow .xy-halo{opacity:.7}}`;
document.head.appendChild(style);

MUSIC.preload("xylophone", BARS.map((bar) => bar.midi).concat([84, 88, 91, 96]));
MUSIC.preload("piano", [40, 41, 43, 53, 55, 60, 62, 64, 67]);

const say = (html, { voice = true } = {}) => {
  $("[data-say]").innerHTML = html;
  if (voice) VOICE.speak(html);
};
const sayAsync = (html) => {
  $("[data-say]").innerHTML = html;
  return VOICE.speakAsync(html);
};
const pick = (list) => list[Math.floor(Math.random() * list.length)];
const chip = (bar) => `<span class="ap-target" style="background:${bar.color}">${svg.classList.contains("letters") ? bar.letter : capital(bar.name)}</span>`;
const capital = (text) => text.charAt(0).toUpperCase() + text.slice(1);
const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const PRAISE = ["Yes!", "Great!", "Well done!", "Super!", "You did it!"];

let token = 0;
let handler = null;
let trail = [];

function strike(i, { quiet = false } = {}) {
  const bar = BARS[i];
  MUSIC.play("xylophone", bar.midi, { gain: quiet ? 0.6 : 0.95 });
  bar.g.classList.remove("hit");
  void bar.g.getBBox();
  bar.g.classList.add("hit");
  bar.g.classList.add("flash");
  setTimeout(() => bar.g.classList.remove("flash"), 180);
}

function glow(i, on = true) {
  BARS.forEach((bar, k) => bar.g.classList.toggle("glow", on && k === i));
}

function pointMallet(i) {
  if (i === null || i === undefined) {
    mallet.setAttribute("opacity", 0);
    mallet.classList.remove("tap");
    return;
  }
  const bar = BARS[i];
  mallet.setAttribute("transform", `translate(${bar.x} ${bar.top + 60}) rotate(-28)`);
  mallet.setAttribute("opacity", 1);
  mallet.classList.add("tap");
}

async function playSequence(list, { beat = 520, glowing = true, my = token } = {}) {
  for (const item of list) {
    if (my !== token) return false;
    const i = typeof item === "number" ? item : item.bar;
    const beats = typeof item === "number" ? 1 : item.beats;
    strike(i);
    if (glowing) BARS[i].g.classList.add("flash");
    await wait(beat * beats);
    BARS[i].g.classList.remove("flash");
  }
  return my === token;
}

let unitId = "free";
function onHit(i, { swipe = false } = {}) {
  strike(i, { quiet: swipe });
  window.OC?.touch();
  if (!swipe || unitId === "free") handler?.(i);
}

const swipes = new Map();
const barAt = (x, y) => {
  const hit = document.elementFromPoint(x, y)?.closest?.(".xy-bar");
  return hit && svg.contains(hit) ? Number(hit.dataset.i) : null;
};
svg.addEventListener("pointerdown", (event) => {
  event.preventDefault();
  try {
    svg.setPointerCapture(event.pointerId);
  } catch {}
  const i = barAt(event.clientX, event.clientY);
  swipes.set(event.pointerId, i);
  if (i !== null) onHit(i);
});
svg.addEventListener("pointermove", (event) => {
  if (!swipes.has(event.pointerId)) return;
  const points = event.getCoalescedEvents ? event.getCoalescedEvents() : [event];
  for (const point of points.length ? points : [event]) {
    const i = barAt(point.clientX, point.clientY);
    if (i === swipes.get(event.pointerId)) continue;
    swipes.set(event.pointerId, i);
    if (i !== null) onHit(i, { swipe: true });
  }
});
for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) svg.addEventListener(type, (event) => swipes.delete(event.pointerId));
svg.addEventListener("keydown", (event) => {
  const g = event.target.closest(".xy-bar");
  if (g && (event.key === "Enter" || event.key === " ")) {
    event.preventDefault();
    onHit(Number(g.dataset.i));
  }
});
const KEYMAP = { a: 0, s: 1, d: 2, f: 3, g: 4, h: 5, j: 6, k: 7 };
addEventListener("keydown", (event) => {
  if (event.target.closest("select, input")) return;
  const i = KEYMAP[event.key.toLowerCase()];
  if (i !== undefined && !event.repeat) onHit(i);
});

function setPanel(html) {
  panel.innerHTML = `<p class="ap-say" data-say aria-live="polite"></p>${html}`;
}

function reset() {
  token += 1;
  // "See it" and the animal game draw their own pictures; put the xylophone back for everything else.
  if (!svg.isConnected) {
    stage.innerHTML = "";
    stage.appendChild(svg);
  }
  stopExtras?.();
  stopExtras = null;
  unitKeys = null;
  handler = null;
  glow(null, false);
  pointMallet(null);
  VOICE.hush();
  svg.classList.remove("letters");
}

let stopExtras = null;
let unitKeys = null;
addEventListener("keydown", (event) => unitKeys?.(event));
const units = {
  u0() {
    const my = token;
    const K = KIT;
    const label = (parent, x, y, str, size = 32, fill = "#7a4520") => K.text(parent, x, y, str, { "font-size": size, fill, "font-weight": 900 });
    const talk = async (api, html) => {
      await K.sayAsync(html);
      await api.wait(250);
    };
    // A simple wooden xylophone for the pictures: bar i is long (low) on the left, short (high) on the right.
    const mini = (v, { y = 300, scale = 0.8 } = {}) => {
      const bars = BARS.map((bar, i) => {
        const L = lengthOf(i) * scale;
        const x = 120 + i * 100;
        const g = K.el("g", {}, v);
        K.el("rect", { x: x - 40, y: y - L / 2, width: 80, height: L, rx: 14, fill: bar.color, stroke: "rgba(0,0,0,.3)", "stroke-width": 2 }, g);
        K.el("circle", { cx: x, cy: y - L / 2 + L * 0.22, r: 6, fill: "#d4a94a" }, g);
        K.el("circle", { cx: x, cy: y + L / 2 - L * 0.22, r: 6, fill: "#d4a94a" }, g);
        return { g, x, top: y - L / 2, L };
      });
      return bars;
    };
    const bonk = async (api, bars, i, gain = 0.9) => {
      MUSIC.play("xylophone", BARS[i].midi, { gain });
      const b = bars[i];
      await api.tween(260, (t) => b.g.setAttribute("transform", `translate(0 ${Math.sin(t * Math.PI) * 8})`), (t) => t);
    };
    const rings = async (api, v, x, y, big) => {
      const r0 = big ? 70 : 30;
      const ring = K.el("circle", { cx: x, cy: y, r: r0, fill: "none", stroke: "var(--accent)", "stroke-width": big ? 10 : 3 }, v);
      await api.tween(700, (t) => {
        ring.setAttribute("r", r0 + t * (big ? 150 : 40));
        ring.setAttribute("opacity", 1 - t);
      }, (t) => t);
      ring.remove();
    };
    const scenes = [
      {
        say: "Why do we make music? Music lets us sing, dance and share feelings together!",
        draw: K.everyday([["🎵", "Singing songs"], ["💃", "Dancing"], ["🥁", "Playing instruments"], ["🌙", "Lullabies at bedtime"]]),
      },
      {
        say: "Look at the xylophone. <b>Long</b> bars sing <b>low</b>. <b>Short</b> bars sing <b>high</b>.",
        async draw(v, api) {
          const bars = mini(v);
          await talk(api, this.say);
          const longTag = label(v, 120, 520, "");
          const shortTag = label(v, 820, 520, "");
          for (let k = 0; k < 2; k++) {
            longTag.textContent = "long = low";
            await bonk(api, bars, 0);
            await api.wait(900);
            shortTag.textContent = "short = high";
            await bonk(api, bars, 7);
            await api.wait(900);
          }
        },
      },
      {
        say: "Now play them all, from the longest bar to the shortest. Hear the sound climb up, up, up!",
        async draw(v, api) {
          const bars = mini(v);
          const arrow = label(v, 500, 70, "", 36);
          await talk(api, this.say);
          arrow.textContent = "up ⬆️ higher";
          for (let i = 0; i < 8; i++) {
            await bonk(api, bars, i);
            await api.wait(200);
          }
          await api.wait(600);
          arrow.textContent = "down ⬇️ lower";
          for (let i = 7; i >= 0; i--) {
            await bonk(api, bars, i);
            await api.wait(200);
          }
        },

    let at = 0;
    let listening = false;
    setPanel(`<p class="ap-dots" data-dots></p><div class="ap-buttons"><button type="button" data-do="again">🔁 Play it again</button></div>`);
    const show = () => ($("[data-dots]").textContent = `${length} notes · ` + Array.from({ length: seq.length }, (_, k) => (k < at ? "●" : "○")).join(""));
    const play = async () => {
      listening = false;
      at = 0;
      show();
      await sayAsync("Listen and watch…");
      if (my !== token) return;
      const ok = await playSequence(seq, { beat: 620, my });
      if (!ok) return;
      listening = true;
      say("Your turn! Play the same bars.", { voice: true });
    };
    const fresh = () => {
      seq = [];
      for (let k = 0; k < length; k++) {
        let next;
        do next = Math.floor(Math.random() * (length <= 3 ? 5 : 8));
        while (k && next === seq[k - 1]);
        seq.push(next);
      }
      play();
    };
    handler = async (i) => {
      if (my !== token || !listening) return;
      if (i === seq[at]) {
        at += 1;
        show();
        if (at < seq.length) return;
        listening = false;
        wins += 1;
        MUSIC.chime();
        window.OC?.count("patterns copied");
        if (length >= 4) shell.mark("u4", { done: true, best: Math.max(length, shell.progress().u4?.best || 0) });
        const grow = wins % 2 === 0 && length < 5;
        say(`${pick(PRAISE)} You copied ${length} notes!${grow ? " Let's try one more note." : ""}`);
        if (grow) length += 1;
        await wait(2600);
        if (my === token) fresh();
      } else {
        listening = false;
        say("Almost! Listen again.");
        await wait(1500);
        if (my === token) play();
      }
    };
    panel.onclick = (event) => {
      if (event.target.closest("[data-do]")) play();
    };
    fresh();
  },

  u6() {
    const my = token;
    let song = null;
    let notes = [];
    let at = 0;
    let misses = 0;
    setPanel(`<div class="ap-chips" data-songs>${SONGS.map((s, k) => `<button type="button" data-song="${k}">${s.name}</button>`).join("")}</div><div class="ap-strip" data-strip aria-hidden="true"></div><div class="ap-buttons"><button type="button" data-do="listen">🔊 Listen first</button><button type="button" data-do="restart">↺ Start again</button></div>`);
    const strip = () => {
      $("[data-strip]").innerHTML = notes.map((n, k) => `<span class="${k < at ? "done" : k === at ? "now" : ""}${n.beats >= 2 ? " long" : ""}" style="background:${BARS[n.bar].color}"></span>`).join("");
    };
    const cue = () => {
      if (at >= notes.length) return;
      glow(notes[at].bar);
      pointMallet(misses >= 1 || at === 0 ? notes[at].bar : null);
      strip();
    };
    const choose = (k) => {
      song = SONGS[k];
      notes = parseSong(song.notes);
      at = 0;
      misses = 0;
      $$chips(k);
      say(`Let's play ${song.name}! Tap the glowing bar.`);
      cue();
    };
    const $$chips = (k) => panel.querySelectorAll("[data-song]").forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.song) === k)));
    handler = async (i) => {
      if (my !== token || !song || at >= notes.length) return;
      if (i === notes[at].bar) {
        at += 1;
        misses = 0;
        pointMallet(null);
        if (at >= notes.length) {
          glow(null, false);
          strip();
          await wait(500);
          MUSIC.chime();
          window.OC?.count("songs played");
          const played = new Set([...(shell.progress().u6?.songs || []), song.name]);
          shell.mark("u6", { done: true, songs: [...played] });
          say(`<span class="ap-cheer">🎉</span> You played ${song.name}! ${played.size < SONGS.length ? "Pick another song!" : "You know all the songs!"}`);
          return;
        }
        cue();
      } else {
        misses += 1;
        if (misses === 2) say(`Find the glowing ${chip(BARS[notes[at].bar])} bar.`);
        cue();
      }
    };
    panel.onclick = async (event) => {
      const songButton = event.target.closest("[data-song]");
      if (songButton) return choose(Number(songButton.dataset.song));
      const what = event.target.closest("[data-do]")?.dataset.do;
      if (!song) return say("Pick a song first!");
      if (what === "restart") choose(SONGS.indexOf(song));
      if (what === "listen") {
        glow(null, false);
        pointMallet(null);
        say(`Listen to ${song.name}…`, { voice: false });
        const mine = token;
        await playSequence(notes, { beat: 460, my: mine });
        if (mine === token) {
          say("Now you try! Tap the glowing bar.");
          cue();
        }
      }
    };
    say("Pick a song to play!");
  },

  u7() {
    svg.classList.add("letters");
    let round = 0;
    let target = -1;
    let misses = 0;
    const my = token;
    setPanel(`<p class="ap-dots" data-dots></p><div class="ap-buttons"><button type="button" data-do="again">🔊 Say it again</button></div>`);
    const ask = () => {
      let next;
      do next = Math.floor(Math.random() * 7);
      while (next === target);
      target = next;
      misses = 0;
      glow(null, false);
      $("[data-dots]").textContent = Array.from({ length: 8 }, (_, k) => (k < round ? "●" : "○")).join("");
      say(`Play the letter <b style="font-size:1.4em">${BARS[target].letter}</b>!`);
    };
    handler = (i) => {
      if (my !== token || target < 0) return;
      if (BARS[i].letter === BARS[target].letter) {
        round += 1;
        MUSIC.chime();
        window.OC?.count("letters played");
        const done = round >= 8;
        say(`${pick(PRAISE)} ${BARS[i].letter} is ${BARS[i].name}!${done ? " You can read the letters!" : ""}`);
        target = -2;
        if (done) {
          shell.mark("u7", { done: true });
          setTimeout(() => my === token && units.u7(), 4200);
          return;
        }
        setTimeout(() => {
          if (my !== token) return;
          target = -1;
          ask();
        }, 1500);
      } else {
        misses += 1;
        say(`That's ${BARS[i].letter}. Find ${BARS[target].letter}!`);
        if (misses >= 2) glow(target);
      }
    };
    panel.onclick = (event) => {
      if (event.target.closest("[data-do]") && target >= 0) say(`Play the letter ${BARS[target].letter}!`);
    };
    say("Now the bars have letters! The musical alphabet goes C, D, E, F, G, A, B.");
    setTimeout(() => my === token && ask(), 4200);
  },
};

const shell = SHELL({
  units: UNITS,
  how: {
    u0: { icon: "👀", title: "See it", steps: ["Watch the pictures and listen.", "Press Next ▶ to go on.", "Press Let's play when you are ready."] },
    u8: { icon: "🐻", title: "Animal sounds", steps: ["Listen to the sound.", "Low and deep? Tap the big animal.", "High and squeaky? Tap the little animal."] },
    free: { icon: "🎶", title: "Free play", steps: ["Tap a bar to hear it.", "Slide your finger across the bars for a whoosh!"] },
    u1: { icon: "🎨", title: "Meet the colours", steps: ["Listen to the colour.", "Tap that coloured bar."] },
    u2: { icon: "🐘", title: "Loud or soft? Fast or slow?", steps: ["Listen to the music.", "Loud? Tap the elephant 🐘. Soft? Tap the mouse 🐭.", "Fast? Tap the rabbit 🐇. Slow? Tap the tortoise 🐢."] },
    u5: { icon: "🥁", title: "Clap the beat", steps: ["Watch the ball bounce on the drum.", "Tap the big drum every time the ball lands.", "Keep it steady, like a clock!"] },
    u3: { icon: "🐦", title: "Higher or lower?", steps: ["Listen to two sounds.", "Going up? Tap the bird 🐦.", "Going down? Tap the fish 🐟."] },
    u4: { icon: "🔁", title: "Copy me", steps: ["Watch the bars light up.", "Then tap the same bars."] },
    u6: { icon: "🎵", title: "First songs", steps: ["Pick a song.", "Tap the bar that glows.", "Keep going to the end!"] },
    u7: { icon: "🔤", title: "Colours to letters", steps: ["Each bar has a letter now.", "Listen for the letter, then tap it."] },
  },
  start: "u0",
  onStop() {
    reset();
    panel.onclick = null;
  },
  subject: "Music",
  activity: "Little Musicians",
  onUnit(id) {
    unitId = id;
    reset();
    panel.onclick = null;
    units[id]();
  },
});
</script>
