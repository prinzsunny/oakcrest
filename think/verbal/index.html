// ---------- helpers ----------
const shuf = (list) => {
  const out = [...list];
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
};
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const plain = (s) => String(s).replace(/_/g, " ");
// "🧦sock" -> { e: "🧦", t: "sock" }; "hot" -> { e: "", t: "hot" }
const tok = (s) => {
  const m = String(s).match(/^([^\p{L}\p{N}]*)(.*)$/u);
  return { e: m[1], t: plain(m[2]) };
};
const deck = (arr) => {
  let queue = [];
  return () => {
    if (!queue.length) queue = shuf(arr);
    return queue.pop();
  };
};
const card = (s, cls = "") => {
  const k = typeof s === "string" ? tok(s) : s;
  return `<div class="vw-card ${k.e ? "" : "txt"} ${cls}">${k.e ? `<span class="vw-big">${k.e}</span>` : ""}<b>${esc(k.t)}</b></div>`;
};
const QCARD = `<div class="vw-card q" aria-label="question">❓</div>`;
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

// A built item: { say, show, opts:[{e,t,ok}], after, hideLabel }
function mk({ say: sayText, show, ok, bad, after = "", hideLabel = false }) {
  const opts = shuf([ok, ...bad].map((t, i) => ({ ...tok(t), ok: i === 0 })));
  return { say: sayText, show, opts, after, hideLabel };
}

const analogy = ([a, b, c, ok, d1, d2]) => {
  const A = tok(a), B = tok(b), C = tok(c);
  return mk({
    say: `${cap(A.t)} is to ${B.t}, as ${C.t} is to what?`,
    show: `${card(A)}<span class="vw-arr">→</span>${card(B)}<span class="vw-sep">as</span>${card(C)}<span class="vw-arr">→</span>${QCARD}`,
    ok, bad: [d1, d2],
    after: `${cap(C.t)} is to ${tok(ok).t}, just like ${A.t} is to ${B.t}.`,
  });

  let busy = false;
  let missed = false;
  panel(`<p class="ap-status" data-status></p><div class="vw-ctl"><button type="button" class="vw-btn soft" data-hear>🔊 Hear it again</button></div>`);
  $("[data-hear]").onclick = () => {
    if (!item) return;
    const names = item.hideLabel ? "" : ` The choices are: ${item.opts.map((o) => o.t).join(". Or. ")}.`;
    VOICE.speak(item.say + names);
  };
  const alive = () => my === token;
  const ask = () => {
    if (!alive()) return;
    if (round >= total) return finish();
    busy = false;
    missed = false;
    item = young ? GEN_YOUNG[gid]() : GEN[gid][level]();
    const long = item.opts.some((o) => o.t.length > 28);
    stage.innerHTML = `<div class="vw vw-pop"><div class="vw-show">${item.show}</div><div class="vw-opts${long ? " wide" : ""}" role="group" aria-label="Answers">${item.opts
      .map((o, i) => `<button type="button" class="vw-opt" data-i="${i}" aria-label="${esc(o.t)}">${o.e ? `<span class="vw-e" aria-hidden="true">${o.e}</span>` : ""}${item.hideLabel && o.e ? "" : `<span class="vw-t">${esc(o.t)}</span>`}</button>`)
      .join("")}</div></div>`;
    status(`Question ${round + 1} of ${total} · Step ${young ? "🌼" : LEVEL_ICON[level]}`);
    say(esc(item.say));
  };
  stage.onclick = async (event) => {
    const b = event.target.closest(".vw-opt");
    if (!b || busy || b.disabled || !alive()) return;
    window.OC?.touch();
    const o = item.opts[Number(b.dataset.i)];
    if (!o.ok) {
      missed = true;
      b.classList.add("wrong");
      b.disabled = true;
      MUSIC.oops();
      say(young ? "Try another one. You can do it!" : `${pick(KIND)} Try another one.`);
      return;
    }
    busy = true;
    b.classList.add("right");
    stage.querySelectorAll(".vw-opt").forEach((x) => (x.disabled = true));
    MUSIC.chime();
    round += 1;
    if (!missed) {
      right += 1;
      streak += 1;
    } else streak = 0;
    let moved = "";
    if (young) {
      moved = "";
    } else if (!missed && streak >= 2 && level < 3) {
      level += 1;
      streak = 0;
      moved = " Now it gets a little trickier!";
    } else if (missed && level > 0) {
      level -= 1;
      moved = " Let's try a slightly easier one.";
    }
    if (!young) saveLv(gid, level);
    const line = `${missed ? "That's it! You found it!" : `${pick(PRAISE)} ${pick(["Great job!", "You are so clever!", "Hooray!"])}`} ${item.after}${moved}`;
    await Promise.race([Promise.all([sayAsync(esc(line)), wait(1400)]), wait(9000)]);
    if (alive()) ask();
  };
  const finish = async () => {
    stage.onclick = null;
    MUSIC.chime();
    confetti();
    window.OC?.count("games finished");
    if (right >= Math.ceil(total * 0.6)) shell.mark(gid, { done: true });
    stage.innerHTML = `<div class="vw"><div class="vw-show"><div class="vw-card q">🎉</div></div><p class="vw-clue">You got ${right} of ${total} right the first time!</p></div>`;
    panel(`<div class="vw-ctl"><button type="button" class="vw-btn" data-again>▶ Play again</button></div>`);
    $("[data-again]").onclick = () => units[gid]();
    say(`🎉 All ${total} done! You got ${right} right first time. ${right >= total - 1 ? "Super word wizard!" : "Let's play again!"}`);
  };
  ask();
}

const units = {};
UNITS.forEach((u) => (units[u.id] = () => play(u.id)));

const shell = SHELL({
  units: UNITS,
  how: {
    vb1: { icon: "🔗", title: "Goes together", steps: ["Look at the first pair. See how they go together.", "Find what goes with the next picture in the same way.", "Tap your answer. Press 🔊 to hear it again."] },
    vb2: { icon: "🤝", title: "Alike", steps: ["Listen to the question.", "Think about how the things are the same.", "Tap the best answer."] },
    vb3: { icon: "🔤", title: "Word meanings", steps: ["Listen to the word.", "Tap the picture or word that matches.", "New words are explained after each one."] },
    vb4: { icon: "🕵️", title: "Riddles", steps: ["Listen to the clues.", "Think about what the clues have in common.", "Tap who or what you think it is."] },
    vb5: { icon: "↔️", title: "Opposites & groups", steps: ["Opposites are very different, like hot and cold.", "Groups are things that go together, like dogs and cats.", "Tap your answer."] },
    vb6: { icon: "🤔", title: "What would you do?", steps: ["Listen to what is happening.", "Think about the safest, kindest or smartest thing to do.", "Tap your choice."] },
  },
  start: "vb1",
  onStop() {
    token += 1;
    stage.onclick = null;
  },
  subject: "Thinking Skills",
  activity: "Word Wizard",
  onUnit(id) {
    token += 1;
    VOICE.hush();
    stage.onclick = null;
    units[id]();
  },
});
</script>
</body>
</html>
