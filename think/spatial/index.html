<div class="ap">
<header class="ap-bar">

    </div>
  </div>

<script>
const { $, $$, el, svg: makeSvg, text, panel, say, sayAsync, pick, pickInt, wait, confetti, PRAISE, KIND, explain, shuffle, still } = KIT;
const stage = $("[data-stage]");
const W = 1000;
const H = 560;
let token = 0;
let view = null;
const LV = {};
const INK = "#2b1d12";
const PAL = ["#e5533d", "#3b82f6", "#f2b705", "#22a05a", "#8b5cf6"];
const rnd = (n) => Math.floor(Math.random() * n);

const UNITS = [
  { id: "sp0", label: "1. See it", icon: "👀" },
  { id: "sp1", label: "2. Copy the tiles", icon: "🟦" },
  { id: "sp2", label: "3. Missing piece", icon: "🧩" },
  { id: "sp3", label: "4. Fold and punch", icon: "📄" },
  { id: "sp4", label: "5. Turn it", icon: "🔄" },
  { id: "sp5", label: "6. Puzzle pieces", icon: "🧱" },
  { id: "sp6", label: "7. Mirror", icon: "🪞" },
];

const css = document.createElement("style");
css.textContent = `.sp-tap{cursor:pointer}.sp-tap:focus-visible{outline:4px solid #ffcf5c}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}`;
document.head.appendChild(css);

const fresh = () => {
  stage.innerHTML = "";
  view = makeSvg(`0 0 ${W} ${H}`, stage);
  view.style.background = "#fdf8ef";
  return view;
};
const status = (s) => {
  const b = $("[data-status]");
  if (b) b.textContent = s;
};
const LV3 = [
  ["tiny", "🐥 Little"],
  ["easy", "🐣 Easy"],
  ["medium", "🦊 Medium"],
  ["hard", "🦁 Hard"],
  ["expert", "🦉 Expert"],
];
const NEXT = { tiny: "easy", easy: "medium", medium: "hard", hard: "expert" };
const PREV = { expert: "hard", hard: "medium", medium: "easy", easy: "tiny" };
const littleAge = () => {
  let age = null;
  try {
    age = window.OC?.ageOf(window.OC.current());
  } catch {}
  return age != null && age < 5;
};
const startLv = () => (littleAge() ? "tiny" : "easy");
const chipsHtml = (cur) => `<div class="ap-chips" data-lvls>${LV3.filter(([k]) => k !== "expert" || !littleAge()).map(([k, l]) => `<button type="button" data-lv="${k}" aria-pressed="${k === cur}">${l}</button>`).join("")}</div>`;
const bindLevels = (onPick) => {
  const host = $("[data-lvls]");
  host.onclick = (event) => {
    const b = event.target.closest("[data-lv]");
    if (!b) return;
    window.OC?.touch();
    setChip(b.dataset.lv);
    onPick(b.dataset.lv);
  };
};
const setChip = (v) => $$("[data-lv]").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.lv === v)));
const NOTES = [72, 74, 76, 77, 79, 81, 83, 84, 86, 88, 89, 91];
const note = (i, gain = 0.4) => MUSIC.play("xylophone", NOTES[Math.min(NOTES.length - 1, Math.max(0, i))], { gain });
const tween = (my, ms, fn) =>
  new Promise((resolve) => {
    if (still.matches) {
      fn(1);
      return resolve(my === token);
    }
    const t0 = performance.now();
    const step = (now) => {
      if (my !== token) return resolve(false);
      const t = Math.min(1, (now - t0) / ms);
      fn(t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
      if (t < 1) requestAnimationFrame(step);
      else resolve(true);
    };
    requestAnimationFrame(step);
  });
const card = (parent, x, y, w, h, attrs = {}) => el("rect", { x, y, width: w, height: h, rx: 20, fill: "#fff", stroke: "#e2d6c4", "stroke-width": 4, ...attrs }, parent);

// Finish a run of rounds: celebrate, mark done, and nudge the level up or down (adaptive).
async function finish(my, id, right, total, what, lv) {
  MUSIC.chime();
  confetti();
  window.OC?.count("games finished");
  if (right >= Math.ceil(total * 0.6)) shell.mark(id, { done: true });
  const rate = right / total;
  let move = null;
  if (rate >= 0.8 && NEXT[lv] && !(NEXT[lv] === "expert" && littleAge())) move = NEXT[lv];
  else if (rate <= 0.34 && PREV[lv]) move = PREV[lv];
  const extra = move ? (rate >= 0.8 ? " Ready for a harder one!" : " Let's try some easier ones.") : "";
  say(`🎉 All ${total} done! You got ${right} right first time. ${right >= total - 1 ? `Super ${what}!` : "Let's play again!"}${extra}`);
  await wait(3800);
  if (my !== token) return null;
  return move || lv;
}

// ---------- shared drawing: polyominoes, tiles ----------
const NB = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const norm = (cells) => {
  const mx = Math.min(...cells.map((c) => c[0]));
  const my = Math.min(...cells.map((c) => c[1]));
  return cells.map((c) => [c[0] - mx, c[1] - my]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
};
const rot90 = (cells) => cells.map(([x, y]) => [-y, x]);
const flipX = (cells) => cells.map(([x, y]) => [-x, y]);
const keyOf = (cells) => norm(cells).map((c) => c.join(",")).join(";");
const cls = (cells) => {
  let best = null;
  let c = cells;
  for (let i = 0; i < 4; i++) {
    const k = keyOf(c);
    if (best === null || k < best) best = k;
    c = rot90(c);
  }
  return best;
};
const cls2 = (cells) => {
  const a = cls(cells);
  const b = cls(flipX(cells));
  return a < b ? a : b;
};
const has = (cells, x, y) => cells.some((c) => c[0] === x && c[1] === y);
const dims = (cells) => [Math.max(...cells.map((c) => c[0])) + 1, Math.max(...cells.map((c) => c[1])) + 1];
const fits = (cells, mw, mh) => {
  const [w, h] = dims(norm(cells));
  return (w <= mw && h <= mh) || (w <= mh && h <= mw);
};
const connected = (cells) => {
  if (!cells.length) return false;
  const seen = [cells[0]];
  for (let i = 0; i < seen.length; i++) {
    for (const [dx, dy] of NB) {
      const x = seen[i][0] + dx;
      const y = seen[i][1] + dy;
      if (has(cells, x, y) && !has(seen, x, y)) seen.push([x, y]);
    }
  }
  return seen.length === cells.length;
};
function growPoly(n, mw, mh, needChiral) {
  for (let tries = 0; tries < 2000; tries++) {
    let cells = [[0, 0]];
    while (cells.length < n) {
      const c = pick(cells);
      const d = pick(NB);
      const x = c[0] + d[0];
      const y = c[1] + d[1];
      if (!has(cells, x, y)) cells.push([x, y]);
    }
    cells = norm(cells);
    const [w, h] = dims(cells);
    if (!fits(cells, mw, mh) || Math.min(w, h) < 2) continue;
    if (needChiral && cls(cells) === cls(flipX(cells))) continue;
    return cells;
  }
  return norm([[0, 0], [0, 1], [0, 2], [1, 2]]);
}
function mutate(cells, mw, mh) {
  for (let tries = 0; tries < 80; tries++) {
    const i = rnd(cells.length);
    const rest = cells.filter((_, j) => j !== i);
    if (!connected(rest)) continue;
    const opts = [];
    for (const c of rest) for (const [dx, dy] of NB) {
      const x = c[0] + dx;
      const y = c[1] + dy;
      if (!has(rest, x, y) && !(x === cells[i][0] && y === cells[i][1])) opts.push([x, y]);
    }
    if (!opts.length) continue;
    const next = norm([...rest, pick(opts)]);
    if (fits(next, mw, mh) && cls(next) !== cls(cells)) return next;
  }
  return null;
}
// Draw cells (already normalised) centred at (cx, cy) with cell size cs.
function drawPoly(parent, cells, cx, cy, cs, fill, stroke = "rgba(43,29,18,.5)", sw = 3) {
  const [w, h] = dims(cells);
  const g = el("g", {}, parent);
  for (const [x, y] of cells) el("rect", { x: cx - (w * cs) / 2 + x * cs, y: cy - (h * cs) / 2 + y * cs, width: cs, height: cs, rx: cs * 0.14, fill, stroke, "stroke-width": sw }, g);
  return g;
}

// A half-coloured tile: background colour a, diagonal half in colour b, orientation o (0-3).
function drawTile(parent, x, y, s, t, o = t.o) {
  const g = el("g", { transform: `translate(${x} ${y})` }, parent);
  el("rect", { width: s, height: s, fill: t.a, stroke: "#fff", "stroke-width": 2 }, g);
  const corners = [[0, 0], [s, 0], [s, s], [0, s]];
  const inner = el("g", { transform: `rotate(${o * 90} ${s / 2} ${s / 2})` }, g);
  el("polygon", { points: [0, 1, 2].map((i) => corners[i].join(",")).join(" "), fill: t.b }, inner);
  return { g, inner, s };
}

// ---------- 1. Copy the tiles ----------
function sp1() {
  const my = token;
  let lv = LV.sp1 || startLv();
  let round = 0;
  let right = 0;
  let q = null;
  let busy = false;
  const TOTAL = 4;
  panel(`${chipsHtml(lv)}<p class="ap-status" data-status></p><div class="ap-buttons"><button type="button" data-do="hear">🔊 Say it again</button><button type="button" data-do="hint">💡 Show me one</button></div>`);
  bindLevels((v) => {
    LV.sp1 = lv = v;
    round = right = 0;
    ask();
  });
  const COLS = [["#3b82f6", "#f2b705"], ["#e5533d", "#fff3d6"], ["#22a05a", "#f2b705"], ["#8b5cf6", "#fff3d6"]];
  const draw = () => {
    fresh();
    const n = q.n;
    const rows = q.rows;
    const T = n === 2 ? 230 : n === 3 ? 270 : 280;
    const B = n === 2 ? 340 : n === 3 ? 420 : 440;
    text(view, 250, 70, "Copy this picture", { "font-size": 34, fill: INK });
    text(view, 735, 38, "Tap a tile to turn it", { "font-size": 30, fill: "#8a7764" });
    const tx = 250 - T / 2;
    const ty = 280 - (T / n * rows) / 2 + 20;
    el("rect", { x: tx - 8, y: ty - 8, width: T + 16, height: (T / n) * rows + 16, rx: 14, fill: "#fff", stroke: "#d9cdb5", "stroke-width": 4 }, view);
    q.target.forEach((t, i) => drawTile(view, tx + (i % n) * (T / n), ty + Math.floor(i / n) * (T / n), T / n, t, q.tiny ? 0 : t.o));
    const bx = 735 - B / 2;
    const by = 300 - (B / n * rows) / 2 + 14;
    el("rect", { x: bx - 8, y: by - 8, width: B + 16, height: (B / n) * rows + 16, rx: 14, fill: "#fff", stroke: "var(--accent)", "stroke-width": 5 }, view);
    q.tiles = q.target.map((t, i) => {
      const s = B / n;
      const cell = el("g", { class: "sp-tap sp-tile", "data-i": i, role: "button", "aria-label": `Tile ${i + 1}` }, view);
      const d = drawTile(cell, bx + (i % n) * s, by + Math.floor(i / n) * s, s, q.tiny ? { a: q.cols[q.cur[i]], b: q.cols[q.cur[i]] } : t, q.tiny ? 0 : q.cur[i]);
      return d;
    });
  };
  const ask = () => {
    busy = false;
    if (lv === "tiny") {
      const c3 = shuffle([PAL[0], PAL[1], PAL[2], PAL[3]]);
      const target = [0, 1].map((i) => ({ a: c3[i], b: c3[i], o: i }));
      const cur = [1, 0];
      q = { n: 2, rows: 1, tiny: true, cols: c3, target, cur, tiles: [] };
      draw();
      status(`Pattern ${round + 1} of ${TOTAL}`);
      say(`Copy the colours! Look at the two squares on the left. Tap a square on the right to change its colour until they match.`);
      return;
    }
    const n = lv === "easy" ? 2 : lv === "medium" || lv === "hard" ? 3 : 4;
    const pair = shuffle(COLS);
    const target = Array.from({ length: n * n }, (_, i) => {
      const [a, b] = lv === "hard" ? pair[rnd(2)] : lv === "expert" ? pair[rnd(4)] : pair[0];
      return { a, b, o: rnd(4) };
    });
    const cur = target.map((t) => (Math.random() < 0.85 ? (t.o + 1 + rnd(3)) % 4 : rnd(4)));
    if (cur.every((o, i) => o === target[i].o)) cur[0] = (cur[0] + 1) % 4;
    q = { n, rows: n, target, cur, tiles: [] };
    draw();
    status(`Picture ${round + 1} of ${TOTAL}`);
    say(`Copy the picture on the left. Tap a tile on the right to turn it a quarter turn. Make every tile match!`);
  };
  const wrongTiles = () => q.cur.map((o, i) => (o === q.target[i].o ? -1 : i)).filter((i) => i >= 0);
  const turn = async (i) => {
    if (q.tiny) {
      q.cur[i] = (q.cur[i] + 1) % 3;
      const col = q.cols[q.cur[i]];
      q.tiles[i].g.querySelector("rect").setAttribute("fill", col);
      q.tiles[i].g.querySelector("polygon").setAttribute("fill", col);
      note(q.cur[i] === q.target[i].o ? 7 : 2, 0.35);
      if (!wrongTiles().length) win();
      return;
    }
    q.cur[i] = (q.cur[i] + 1) % 4;
    note(q.cur[i] === q.target[i].o ? 7 : 2, 0.35);
    const tile = q.tiles[i];
    const to = q.cur[i] * 90;
    const from = to - 90;
    const s = tile.s;
    await tween(my, 220, (t) => tile.inner.setAttribute("transform", `rotate(${from + 90 * t} ${s / 2} ${s / 2})`));
    tile.inner.setAttribute("transform", `rotate(${to} ${s / 2} ${s / 2})`);
    if (my === token && !wrongTiles().length) win();
  };
  const win = async () => {
    busy = true;
    MUSIC.chime();
    round += 1;
    right += 1;
    window.OC?.count("tile pictures");
    say(`${pick(PRAISE)} Every tile matches. You turned each one the right way! 🟦`);
    await wait(2800);
    if (my !== token) return;
    if (round >= TOTAL) {
      const next = await finish(my, "sp1", right, TOTAL, "tile copying", lv);
      if (next === null) return;
      if (next !== lv) (LV.sp1 = lv = next), setChip(next);
      round = right = 0;
    }
    ask();
  };
  stage.onpointerdown = (event) => {
    if (my !== token || busy) return;
    const g = event.target.closest?.(".sp-tile");
    if (!g) return;
    window.OC?.touch();
    turn(Number(g.dataset.i));
  };
  $("[data-panel]").onclick = (event) => {
    const what = event.target.closest("[data-do]")?.dataset.do;
    if (!what || my !== token || !q) return;
    if (what === "hear") say(`Copy the picture on the left. Tap a tile on the right to turn it a quarter turn.`);
    if (what === "hint" && !busy) {
      const w = wrongTiles();
      if (!w.length) return;
      const i = pick(w);
      const r = q.tiles[i].g.querySelector("rect");
      r.setAttribute("stroke", "#e5533d");
      r.setAttribute("stroke-width", 10);
      setTimeout(() => r.setAttribute("stroke-width", 2), 1400);
      const [wx, wy] = [i % q.n, Math.floor(i / q.n)];
      say(q.tiny ? `Look at the ${wx ? "second" : "first"} square. Is it the same colour as the one on the left?` : `Look at the tile in row ${wy + 1}, column ${wx + 1}. Find the same spot in the picture on the left. Where is the coloured corner?`);
    }
  };
  ask();
}

// ---------- shared multiple-choice frame (units 3, 4, 5, 6) ----------
// cfg.make(lv, round) returns { say, drawQ(g), opts: [{ draw(g) }], ans, wrong(i), right(), reveal?(g, my), after?(g, alive) }
// Option drawings are centred on (0,0) inside a 160 by 160 box.
const choiceUnit = (id, cfg) => () => {
  const my = token;
  let lv = LV[id] || startLv();
  let round = 0;
  let right = 0;
  let missed = false;
  let q = null;
  let busy = false;
  let qg = null;
  let TOTAL = cfg.total || 6;
  panel(`${chipsHtml(lv)}<p class="ap-status" data-status></p><div class="ap-buttons"><button type="button" data-do="hear">🔊 Say it again</button>${cfg.buttons || ""}</div>`);
  bindLevels((v) => {
    LV[id] = lv = v;
    round = right = 0;
    ask();
  });
  const draw = () => {
    fresh();
    qg = el("g", {}, view);
    q.drawQ(qg);
    q.cards = q.opts.map((o, i) => {
      const x = q.opts.length === 3 && i === 2 ? 700 : 600 + (i % 2) * 200;
      const y = 45 + Math.floor(i / 2) * 240;
      const g = el("g", { class: "sp-tap sp-opt", "data-i": i, role: "button", "aria-label": `Choice ${i + 1}` }, view);
      const r = card(g, x, y, 185, 215, { stroke: "var(--accent)" });
      o.draw(el("g", { transform: `translate(${x + 92.5} ${y + 107.5})` }, g));
      return r;
    });
  };
  const alive = (mine) => () => my === token && q === mine;
  const ask = () => {
    busy = false;
    missed = false;
    TOTAL = lv === "tiny" ? 4 : cfg.total || 6;
    q = cfg.make(lv, round);
    draw();
    status(`Puzzle ${round + 1} of ${TOTAL}`);
    say(q.say);
    q.after?.(qg, alive(q));
  };
  const choose = async (i) => {
    if (my !== token || busy || !q) return;
    window.OC?.touch();
    const r = q.cards[i];
    if (i === q.ans) {
      busy = true;
      r.setAttribute("fill", "#d9f2df");
      r.setAttribute("stroke", "#22a05a");
      MUSIC.chime();
      round += 1;
      if (!missed) right += 1;
      window.OC?.count(cfg.count);
      say(`${pick(PRAISE)} ${q.right()}`);
      if (q.reveal) await q.reveal(qg, my);
      await wait(cfg.pause || 4200);
      if (my !== token) return;
      if (round >= TOTAL) {
        const next = await finish(my, id, right, TOTAL, cfg.what, lv);
        if (next === null) return;
        if (next !== lv) (LV[id] = lv = next), setChip(next);
        round = right = 0;
      }
      ask();
    } else {
      if (r.getAttribute("fill") === "#f6dcd4") return;
      missed = true;
      MUSIC.oops();
      r.setAttribute("fill", "#f6dcd4");
      say(`${pick(KIND)} ${q.wrong(i)}`);
    }
  };
  stage.onpointerdown = (event) => {
    const g = event.target.closest?.(".sp-opt");
    if (g) choose(Number(g.dataset.i));
  };
  $("[data-panel]").onclick = (event) => {
    const what = event.target.closest("[data-do]")?.dataset.do;
    if (!what || my !== token || !q) return;
    if (what === "hear") {

      q.cells.push(row);
    }
    const line = { stroke: "var(--accent)", "stroke-width": 6, "stroke-dasharray": "16 10", "stroke-linecap": "round" };
    el("line", { x1: W / 2, y1: gy - 14, x2: W / 2, y2: gy + rows * cs + 14, ...line }, view);
    if (q.two) el("line", { x1: gx - 14, y1: H / 2, x2: gx + cw * cs + 14, y2: H / 2, ...line }, view);
    paint();
  };
  const ask = () => {
    busy = false;
    missed = false;
    const two = lv === "expert";
    const hw = lv === "tiny" ? 2 : lv === "easy" ? 3 : lv === "medium" ? 4 : lv === "hard" ? 5 : 4;
    const rows = lv === "tiny" ? 3 : lv === "easy" ? 4 : lv === "medium" ? 5 : 6;
    const gh = two ? rows / 2 : rows;
    const ncol = lv === "hard" ? 3 : two ? 2 : 1;
    let left;
    for (;;) {
      left = Array.from({ length: gh }, () => Array.from({ length: hw }, () => (Math.random() < (lv === "easy" ? 0.38 : 0.45) ? 1 + rnd(ncol) : 0)));
      const count = left.flat().filter(Boolean).length;
      const touching = left.filter((r) => r[hw - 1]).length;
      const bottom = !two || left[gh - 1].some(Boolean);
      if (count >= hw + 1 && touching >= 1 && bottom && count <= hw * gh * 0.6) break;
    }
    const cw = hw * 2;
    q = { hw, rows, cw, ncol, two, left, gh };
    q.given = (r, c) => (two ? r < gh && c < hw : c < hw);
    q.want = (r, c) => left[two && r >= gh ? rows - 1 - r : r][c < hw ? c : cw - 1 - c];
    q.grid = Array.from({ length: rows }, (_, r) => Array.from({ length: cw }, (_, c) => (q.given(r, c) ? left[r][c] : 0)));
    draw();
    status(`Mirror ${round + 1} of ${TOTAL}`);
    say(two ? `There are two mirror lines! Copy the squares from the top left into the other three corners, flipping across each line. ${ncol > 1 ? "Tap again to change the colour." : ""}` : `The dotted line is a mirror. Copy the squares on the left onto the right side, the way a mirror would show them. ${ncol > 1 ? "Tap again to change the colour." : ""}`);
  };
  const wrong = () => {
    const bad = [];
    for (let r = 0; r < q.rows; r++) for (let c = 0; c < q.cw; c++) if (!q.given(r, c) && q.grid[r][c] !== q.want(r, c)) bad.push([r, c]);
    return bad;
  };
  const check = async () => {
    if (busy) return;
    const bad = wrong();
    if (!bad.length) {
      busy = true;
      MUSIC.chime();
      round += 1;
      if (!missed) right += 1;
      window.OC?.count("mirror pictures");
      say(`${pick(PRAISE)} A mirror flips the picture. Each square is the same distance from the line as its twin! 🪞`);
      await wait(3600);
      if (my !== token) return;
      if (round >= TOTAL) {
        const next = await finish(my, "sp6", right, TOTAL, "mirror drawing", lv);
        if (next === null) return;
        if (next !== lv) (LV.sp6 = lv = next), setChip(next);
        round = right = 0;
      }
      ask();
    } else {
      missed = true;
      MUSIC.oops();
      bad.forEach(([r, c]) => q.cells[r][c].rect.setAttribute("stroke", "#e5533d"));
      setTimeout(() => bad.forEach(([r, c]) => q.cells[r]?.[c]?.rect.setAttribute("stroke", "#b9d8d6")), 1800);
      say(`${pick(KIND)} ${bad.length} square${bad.length > 1 ? "s are" : " is"} not matching yet (red edges). Start next to the mirror line: each square has a twin the same distance from the line on the other side.`);
    }
  };
  stage.onpointerdown = (event) => {
    if (my !== token || busy) return;
    const g = event.target.closest?.(".sp-cell");
    if (!g) return;
    window.OC?.touch();
    const r = Number(g.dataset.r);
    const c = Number(g.dataset.c);
    q.grid[r][c] = (q.grid[r][c] + 1) % (q.ncol + 1);
    note(q.grid[r][c] ? 5 : 1, 0.3);
    paint();
  };
  $("[data-panel]").onclick = (event) => {
    const what = event.target.closest("[data-do]")?.dataset.do;
    if (!what || my !== token || !q) return;
    if (what === "hear") say(q.two ? `There are two mirror lines. Copy the top left into the other corners.` : `The dotted line is a mirror. Copy the squares on the left onto the right side, the way a mirror would show them.`);
    if (what === "check") check();
  };
  ask();
}

// ---------- 0. See it ----------
function sp0() {
  const my = token;
  const demoTile = (v, x, y, s, o, a = "#3b82f6", b = "#f2b705") => drawTile(v, x, y, s, { a, b, o }, o);
  const scenes = [
    {
      say: "Welcome to Shape Lab! Look closely at shapes and imagine how they move. Here are tiles that are half one colour and half another. Each one can turn a quarter turn.",
      draw: async (v, api) => {
        const ts = [0, 1, 2, 3].map((i) => demoTile(v, 150 + i * 190, 190, 150, 0));
        await api.wait(900);
        for (let step = 1; step <= 3; step++) {
          note(step * 2);
          await api.tween(700, (t) => ts.forEach((tile, i) => tile.inner.setAttribute("transform", `rotate(${(step - 1 + t) * 90} 75 75)`)));
          await api.wait(500);
        }
        text(v, 500, 440, "Turn the tile until it matches", { "font-size": 36, fill: INK });
      },
    },
    {
      say: "A turn is not a flip. Turning a shape spins it round. Flipping it over, like a mirror, makes a different shape. When you are asked for the same shape turned, ignore the flipped ones.",
      draw: async (v, api) => {
        const L = norm([[0, 0], [0, 1], [0, 2], [1, 2]]);
        const g1 = el("g", { transform: "translate(200 280)" }, v);
        drawPoly(g1, L, 0, 0, 60, PAL[1]);
        text(v, 200, 90, "Start", { "font-size": 32, fill: INK });
        await api.wait(900);
        const g2 = el("g", { transform: "translate(500 280)" }, v);
        drawPoly(g2, L, 0, 0, 60, PAL[3]);
        text(v, 500, 90, "Turned ✔", { "font-size": 32, fill: "#22a05a" });
        note(4);
        await api.tween(1300, (t) => g2.setAttribute("transform", `translate(500 280) rotate(${180 * t})`));
        await api.wait(600);
        const g3 = el("g", { transform: "translate(800 280)" }, v);
        drawPoly(g3, flipX(L).length ? norm(flipX(L)) : L, 0, 0, 60, PAL[0]);
        text(v, 800, 90, "Flipped ✘", { "font-size": 32, fill: "#e5533d" });
        MUSIC.oops();
        await api.wait(1500);
      },
    },
    {
      say: "Fold and punch! Fold a paper in half and punch a hole. When you open it, the fold works like a mirror, so you see two holes, one on each side.",
      draw: async (v, api) => {
        el("rect", { x: 100, y: 150, width: 300, height: 300, fill: PAPER.fill, stroke: PAPER.stroke, "stroke-width": 4 }, v);
        el("line", { x1: 250, y1: 150, x2: 250, y2: 450, stroke: "#e5533d", "stroke-width": 4, "stroke-dasharray": "14 10" }, v);
        text(v, 250, 110, "Fold in half", { "font-size": 32, fill: INK });
        await api.wait(1500);
        const mv = el("g", {}, v);
        el("rect", { x: 100, y: 150, width: 150, height: 300, fill: PAPER.fill, stroke: PAPER.stroke, "stroke-width": 4 }, mv);
        await api.tween(1100, (t) => mv.setAttribute("transform", `matrix(${1 - 2 * t} 0 0 1 ${500 * t} 0)`));
        holeDot(v, 330, 270, 16);
        MUSIC.play("woodblock", 79, { gain: 0.5 });
        text(v, 250, 520, "Punch!", { "font-size": 32, fill: INK });
        await api.wait(1500);
        el("rect", { x: 580, y: 150, width: 300, height: 300, fill: PAPER.fill, stroke: PAPER.stroke, "stroke-width": 4 }, v);
        holeDot(v, 830, 270, 16);
        await api.wait(500);
        holeDot(v, 630, 270, 16);
        note(6);
        text(v, 730, 110, "Open it up", { "font-size": 32, fill: INK });
        text(v, 730, 520, "Two holes, like a mirror", { "font-size": 32, fill: "#22a05a" });
      },
    },
  ];
  explain(scenes, { alive: () => my === token, onDone: () => shell.go("sp1"), title: "Shape Lab" });
}

const units = { sp0, sp1, sp2, sp3, sp4, sp5, sp6 };
const clearStage = () => {
  stage.onpointerdown = stage.onpointermove = stage.onpointerup = stage.onpointercancel = null;
};
const shell = SHELL({
  units: UNITS,
  how: {
    sp0: { icon: "👀", title: "See it", steps: ["Watch the shapes move.", "Press Next ▶ to go on.", "Press Let's play when you are ready."] },
    sp1: { icon: "🟦", title: "Copy the tiles", steps: ["Look at the picture on the left.", "Tap a tile on the right to turn it.", "Make your picture match."] },
    sp2: { icon: "🧩", title: "Missing piece", steps: ["Find what changes along the rows and columns.", "Tap the piece that fits the ? square."] },
    sp3: { icon: "📄", title: "Fold and punch", steps: ["Watch the paper fold and the hole get punched.", "Think: the fold is like a mirror.", "Tap the paper that shows it opened out."] },
    sp4: { icon: "🔄", title: "Turn it", steps: ["Look at the shape.", "Imagine spinning it round.", "Tap the same shape, turned. Flips do not count."] },
    sp5: { icon: "🧱", title: "Puzzle pieces", steps: ["Look at the shape.", "Which pieces fit together to make it?", "Tap that group of pieces."] },
    sp6: { icon: "🪞", title: "Mirror", steps: ["The dotted line is a mirror.", "Tap squares on the right to copy the left.", "Press Check when you are done."] },
  },
  start: "sp0",
  onStop() {
    token += 1;
    clearStage();
    $("[data-panel]").onclick = null;
  },
  subject: "Thinking Skills",
  activity: "Shape Lab",
  onUnit(id) {
    token += 1;
    VOICE.hush();
    clearStage();
    units[id]();
  },
});
MUSIC.preload("xylophone", NOTES);
MUSIC.preload("woodblock", [72, 79]);
