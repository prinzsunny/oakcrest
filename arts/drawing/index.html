function svgPoint(event, v = view) {
  const m = v.getScreenCTM();
  if (!m) return [0, 0];
  const p = new DOMPoint(event.clientX, event.clientY).matrixTransform(m.inverse());
  return [p.x, p.y];
}
// Finger / mouse drawing on an SVG: begin(p), move(p), end().
function ink(v, h) {
  v.classList.add("dl-ink");
  let on = false;
  v.addEventListener("pointerdown", (event) => {
    event.preventDefault();
    on = true;
    try {
      v.setPointerCapture(event.pointerId);
    } catch {}
    window.OC?.touch();
    h.begin?.(svgPoint(event, v), event);
  });
  v.addEventListener("pointermove", (event) => {
    if (!on) return;
    const list = event.getCoalescedEvents ? event.getCoalescedEvents() : [];
    for (const e of list.length ? list : [event]) h.move?.(svgPoint(e, v), e);
  });
  const stop = () => {
    if (!on) return;
    on = false;
    h.end?.();
  };
  v.addEventListener("pointerup", stop);
  v.addEventListener("pointercancel", stop);
}

function samplePath(node, step = 10) {
  const len = node.getTotalLength();

  for (let s = 0; s <= len; s += step) {
    const p = node.getPointAtLength(s);
    out.push([p.x, p.y]);

}
function nearest(p, list) {
  let best = Infinity;
  for (const q of list) {
    const d = (p[0] - q[0]) ** 2 + (p[1] - q[1]) ** 2;
    if (d < best) best = d;
  }
  return Math.sqrt(best);
}
function coverage(target, drawn, tol) {
  if (!drawn.length) return 0;
  let hit = 0;
  for (const t of target) if (nearest(t, drawn) <= tol) hit += 1;
  return hit / target.length;
}
function meanAway(drawn, target) {
  if (!drawn.length) return Infinity;
  let s = 0;
  for (const p of drawn) s += nearest(p, target);
  return s / drawn.length;
}

function galleryAdd(src, title) {

}
function snapshot(v) {
  return new Promise((resolve) => {
    try {
      const clone = v.cloneNode(true);
      clone.querySelectorAll(".no-save").forEach((n) => n.remove());
      clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      const vb = v.viewBox.baseVal;
      clone.setAttribute("width", vb.width);
      clone.setAttribute("height", vb.height);
      const img = new Image();
      img.onload = () => {
        try {
          const c = document.createElement("canvas");
          c.width = 500;
          c.height = Math.round((500 * vb.height) / vb.width);
          const x = c.getContext("2d");
          x.fillStyle = "#ffffff";
          x.fillRect(0, 0, c.width, c.height);
          x.drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL("image/jpeg", 0.82));
        } catch {
          resolve(null);
        }
      };
      img.onerror = () => resolve(null);
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(new XMLSerializer().serializeToString(clone));
    } catch {
      resolve(null);
    }
  });
}
async function saveArt(v, title, id) {
  const src = await snapshot(v);

    MUSIC.oops();
    say("Oh no, I could not save this picture on this device.");
    return false;
  }
  MUSIC.chime();
  confetti();
  shell.mark(id, { done: true });
  window.OC?.count("drawings saved");
  say("🎉 Saved to your gallery! Press 🖼️ to see all your pictures.");
  return true;
}

  const tip = pencil ? emoji(parent, 0, 0, "✏️", 48) : null;
  await api.tween(ms, (t) => {
    path.setAttribute("stroke-dashoffset", 1 - t);

      tip.setAttribute("x", p.x + 18);

  }, (t) => t);
  tip?.remove();

}

function shapeEl(s, attrs, parent) {
  const rot = s.rot ? `rotate(${s.rot} ${s.cx} ${s.cy})` : null;
  if (s.t === "circle") return el("circle", { cx: s.cx, cy: s.cy, r: s.r, ...attrs }, parent);
  if (s.t === "ellipse") return el("ellipse", { cx: s.cx, cy: s.cy, rx: s.rx, ry: s.ry, transform: rot, ...attrs }, parent);
  if (s.t === "rect") return el("rect", { x: s.x, y: s.y, width: s.w, height: s.h, ...attrs }, parent);
  return el("polygon", { points: s.pts.map((p) => p.join(",")).join(" "), ...attrs }, parent);
}
function shapeOutline(s, step = 10) {
  const tmp = shapeEl(s, { fill: "none", stroke: "none" }, view);
  const pts = samplePath(tmp, step);
  tmp.remove();
  if (!s.rot) return pts;
  const a = (s.rot * Math.PI) / 180;
  return pts.map(([x, y]) => [s.cx + (x - s.cx) * Math.cos(a) - (y - s.cy) * Math.sin(a), s.cy + (x - s.cx) * Math.sin(a) + (y - s.cy) * Math.cos(a)]);
}
function shapeWord(s) {
  if (s.t === "circle") return ["circle", "A circle is round. It has no corners."];
  if (s.t === "ellipse") return ["oval", "An oval is a stretched circle, like an egg."];
  if (s.t === "poly") return ["triangle", "A triangle has 3 sides and 3 corners."];
  if (s.w === s.h) return ["square", "A square has 4 sides, all the same length."];
  return ["rectangle", "A rectangle has 4 sides and 4 corners."];
}

const flipH = (t) => t.map((row) => [...row].reverse().map((c) => ({ ...c, s: [0, 2, 1, 4, 3][c.s] })));
const flipV = (t) => [...t].reverse().map((row) => row.map((c) => ({ ...c, s: [0, 4, 3, 2, 1][c.s] })));
const rot90 = (t) => t.map((row, r) => row.map((_, c) => ({ ...t[3 - c][r], s: [0, 2, 3, 4, 1][t[3 - c][r].s] })));
const sig = (t) => t.map((row) => row.map((c) => (c.c ? c.c + c.s : "-")).join(",")).join("|");
function cellShape(g, x, y, size, cell) {
  if (!cell.c) return;
  const [a, b, c, d] = [[x, y], [x + size, y], [x + size, y + size], [x, y + size]];
  const pts = [null, [a, b, d], [a, b, c], [b, c, d], [a, c, d]][cell.s];
  if (!pts) el("rect", { x, y, width: size, height: size, fill: cell.c }, g);
  else el("polygon", { points: pts.map((p) => p.join(",")).join(" "), fill: cell.c }, g);
}

  // ----- Trace the lines -----
  d1() {
    const my = token;
    const POOLS = {
      easy: [
        ["straight line", "M160 300 L840 300"],
        ["line going down", "M500 80 L500 480"],
        ["slanted line", "M200 460 L800 120"],
        ["curved line", "M150 420 Q500 -20 850 420"],
        ["smile curve", "M200 180 Q500 640 800 180"],
        ["zigzag line", "M150 400 L325 160 L500 400 L675 160 L850 400"],
      ],
      medium: [
        ["wavy line", gen((t) => [140 + 720 * t, 290 + 110 * Math.sin(t * Math.PI * 4)])],
        ["circle", gen((t) => [500 + 190 * Math.cos(t * Math.PI * 2 - Math.PI / 2), 290 + 190 * Math.sin(t * Math.PI * 2 - Math.PI / 2)])],
        ["bumpy line", gen((t) => [140 + 720 * t, 380 - 190 * Math.abs(Math.sin(t * Math.PI * 3))])],
        ["square", "M330 120 L670 120 L670 460 L330 460 Z"],
        ["S curve", "M300 120 C700 120 700 290 500 290 C300 290 300 460 700 460"],
        ["mountain zigzag", "M120 440 L240 200 L330 330 L500 100 L670 330 L760 200 L880 440"],
      ],
      hard: [
        ["spiral", gen((t) => [500 + (14 + 200 * t) * Math.cos(t * Math.PI * 6), 290 + (14 + 200 * t) * Math.sin(t * Math.PI * 6)], 240)],
        ["loopy line", gen((t) => { const u = t * Math.PI * 8; return [190 + 26 * u - 70 * Math.sin(u), 300 + 90 * Math.cos(u)]; }, 240)],
        ["figure eight", gen((t) => { const s = t * Math.PI * 2; const d = 1 + Math.sin(s) ** 2; return [500 + 340 * Math.cos(s) / d, 290 + 340 * Math.sin(s) * Math.cos(s) / d]; }, 200)],
        ["star", gen((t) => { const k = Math.floor(t * 5 * 0.9999); const f = t * 5 - k; const p = (i) => [500 + 220 * Math.cos(-Math.PI / 2 + (i * 4 * Math.PI) / 5), 300 + 220 * Math.sin(-Math.PI / 2 + (i * 4 * Math.PI) / 5)]; const a = p(k); const b = p(k + 1); return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]; }, 200)],
        ["heart", gen((t) => { const s = t * Math.PI * 2; return [500 + 13 * 16 * Math.sin(s) ** 3, 280 - 13 * (13 * Math.cos(s) - 5 * Math.cos(2 * s) - 2 * Math.cos(3 * s) - Math.cos(4 * s))]; }, 200)],
        ["wave of loops", gen((t) => { const u = t * Math.PI * 6; return [180 + 34 * u - 60 * Math.sin(u), 290 + 60 * Math.cos(u) + 80 * Math.sin(t * Math.PI * 2)]; }, 240)],
      ],
    };
    const TOL = { easy: 50, medium: 42, hard: 36 };
    let level = shell.progress().d1?.level || "easy";
    let list = [];
    let round = 0;
    let stars = 0;
    let target = [];
    let drawn = [];
    let inkLayer;
    let pathNode;
    let busy = false;
    let cur = null;
    panel(`${chipRow([["easy", "🐣 Easy"], ["medium", "🦊 Medium"], ["hard", "🦁 Hard"]], level, "lv")}<div class="ap-buttons"><span class="ap-status" data-status></span><button type="button" data-do="show">👀 Show me</button><button type="button" data-do="again">🧽 Try again</button></div>`);
    const demo = async () => {
      if (!pathNode) return;
      const len = pathNode.getTotalLength();
      const hand = emoji(view, 0, 0, "👆", 60, { class: "no-save", "pointer-events": "none" });
      const t0 = performance.now();
      const ms = Math.max(1600, len * 2.2);
      while (my === token && hand.isConnected) {
        const t = Math.min(1, (performance.now() - t0) / ms);
        const p = pathNode.getPointAtLength(len * t);
        hand.setAttribute("x", p.x + 6);
        hand.setAttribute("y", p.y + 46);
        if (t >= 1) break;
        await new Promise((r) => requestAnimationFrame(r));
      }
      await wait(300);
      hand.remove();
    };
    const draw = () => {
      fresh();
      const [name, d] = cur;
      pathNode = el("path", { d, fill: "none", stroke: "#e6d8c2", "stroke-width": 40, "stroke-linecap": "round", "stroke-linejoin": "round" }, view);
      el("path", { d, fill: "none", stroke: "#a8916f", "stroke-width": 12, "stroke-linecap": "round", "stroke-dasharray": "0.1 24" }, view);
      target = samplePath(pathNode, 8);
      const a = target[0];
      const b = target[target.length - 1];
      const closed = dist(a, b) < 20;
      el("circle", { cx: a[0], cy: a[1], r: 24, fill: "#22a05a" }, view);
      text(view, a[0], a[1] + 9, "▶", { "font-size": 24, fill: "#fff", "pointer-events": "none" });
      if (!closed) emoji(view, b[0], b[1], "⭐", 48, { "pointer-events": "none" });
      text(view, 500, 545, name, { "font-size": 26, fill: "#8a7764", class: "no-save" });
      inkLayer = el("g", { "pointer-events": "none" }, view);
      drawn = [];
      let line = null;
      let near = null;
      ink(view, {
        begin(p) {
          if (busy) return;
          line = null;
          near = null;
          this.move(p);
        },
        move(p) {
          if (busy) return;
          const ok = nearest(p, target) <= TOL[level];
          if (!line || ok !== near) {
            const last = line ? line.dataset.last : null;
            line = el("polyline", { points: last ? `${last} ${p[0]},${p[1]}` : `${p[0]},${p[1]} ${p[0] + 0.1},${p[1]}`, fill: "none", stroke: ok ? "#22a05a" : "#f08a24", "stroke-width": 14, "stroke-linecap": "round", "stroke-linejoin": "round" }, inkLayer);
            near = ok;
          } else line.setAttribute("points", `${line.getAttribute("points")} ${p[0]},${p[1]}`);
          line.dataset.last = `${p[0]},${p[1]}`;
          drawn.push(p);
        },
        end: () => judge(),
      });
      $("[data-status]").textContent = `Line ${round + 1} of 8 · ⭐ ${stars}`;
    };
    const next = () => {
      if (my !== token) return;
      busy = false;
      cur = list[round % list.length];
      draw();
      say(`Trace the <b>${cur[0]}</b>. Start at the green dot and follow the dots with your finger.`);
      demo();
    };
    const judge = async () => {
      if (my !== token || busy || drawn.length < 3) return;
      const tol = TOL[level];
      const cov = coverage(target, drawn, tol);
      const away = meanAway(drawn, target);
      if (away > tol * 0.8 && drawn.length > 8) {
        busy = true;
        MUSIC.oops();
        say(`${pick(KIND)} Your line went away from the dots, so let's try again. Go slowly and keep your finger on the dots.`);
        await wait(1600);
        if (my !== token) return;
        busy = false;
        inkLayer.innerHTML = "";
        drawn = [];
        return;
      }
      if (cov < 0.85) return say("Good! Keep going along the dots, all the way to the end.", { voice: cov > 0.3 });
      busy = true;
      const got = away < tol * 0.3 ? 3 : away < tol * 0.5 ? 2 : 1;
      stars += got;
      round += 1;
      MUSIC.chime();
      window.OC?.count("lines traced");
      text(view, 500, 80, "⭐".repeat(got), { "font-size": 64, class: "no-save" });
      say(`${pick(PRAISE)} ${got === 3 ? "Super close to the dots!" : got === 2 ? "Nice and close!" : "You did it! Next time, try to stay right on the dots."}`);
      $("[data-status]").textContent = `Line ${round} of 8 · ⭐ ${stars}`;
      await wait(2300);
      if (my !== token) return;
      if (round >= 8) {
        confetti();
        shell.mark("d1", { done: true, level });
        say(`🎉 You traced 8 lines and won ${stars} stars! ${level === "hard" ? "You are a tracing champion!" : "Try a harder level next!"}`);
        round = 0;
        stars = 0;
        list = shuffle(POOLS[level]);
        await wait(3600);
      }
      next();
    };
    const start = (lv) => {
      level = lv;
      round = 0;
      stars = 0;
      list = shuffle(POOLS[level]);
      document.querySelectorAll("[data-lv]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lv === lv)));
      next();
    };
    $("[data-panel]").onclick = (event) => {
      if (my !== token) return;
      const lv = event.target.closest("[data-lv]")?.dataset.lv;
      if (lv) return start(lv);
      const what = event.target.closest("[data-do]")?.dataset.do;
      if (what === "show") demo();
      if (what === "again" && !busy) {
        inkLayer.innerHTML = "";
        drawn = [];
        say("Fresh start! Begin at the green dot.");
      }
    };
    start(level);
  },

  // ----- Draw with shapes -----
  d2() {
    const my = token;
    let picKey = "owl";
    let step = 0;
    let phase = "draw";
    let color = PAINT[0];
    let tries = 0;
    let strokes = [];
    let layers;
    let outline = [];
    let busy = false;
    const colored = new Set();
    let celebrated = false;
    const drawPanel = () => {
      panel(`${chipRow(PIC_ORDER.map((k) => [k, `${PICS[k].icon} ${PICS[k].name}`]), picKey, "pic")}<div class="ap-buttons"><span class="ap-status" data-status></span><button type="button" data-do="undo">↩️ Undo</button><button type="button" data-do="skip">⏭️ Next shape</button></div>`);
      status();
    };
    const colourPanel = () => {
      panel(`${palRow(color, PAINT.slice(0, 9))}<div class="ap-buttons"><span class="ap-status" data-status></span><button type="button" class="primary" data-do="save">💾 Save</button><button type="button" data-do="gallery" aria-label="Gallery">🖼️</button><button type="button" data-do="new">🔁 New picture</button></div>`);
      status();
    };
    const status = () => {
      const box = $("[data-status]");
      if (!box) return;
      const pic = PICS[picKey];
      box.textContent = phase === "draw" ? `Shape ${Math.min(step + 1, pic.steps.length)} of ${pic.steps.length}` : `Coloured ${colored.size} of ${pic.steps.length}`;
    };
    const build = () => {
      fresh("#fffdf8");
      layers = { fills: el("g", {}, view), guide: el("g", { class: "no-save", "pointer-events": "none" }, view), strokes: el("g", { "pointer-events": "none" }, view), details: el("g", { "pointer-events": "none" }, view) };
      render();
      ink(view, {
        begin(p) {
          if (phase !== "draw" || busy) return;
          const line = el("polyline", { points: `${p[0]},${p[1]} ${p[0] + 0.1},${p[1]}`, fill: "none", stroke: "#3b2a1c", "stroke-width": 9, "stroke-linecap": "round", "stroke-linejoin": "round" }, layers.strokes);
          strokes.push({ line, pts: [p], step });
        },
        move(p) {
          if (phase !== "draw" || busy) return;
          const s = strokes[strokes.length - 1];
          if (!s) return;
          s.pts.push(p);
          s.line.setAttribute("points", `${s.line.getAttribute("points")} ${p[0]},${p[1]}`);
        },
        end: () => phase === "draw" && checkStep(),
      });
      view.addEventListener("pointerdown", (event) => {
        if (phase !== "colour" || my !== token) return;
        const part = event.target.closest(".dl-part");
        if (!part) return;
        part.setAttribute("fill", color);
        colored.add(part.dataset.i);
        MUSIC.play("xylophone", 72 + PAINT.indexOf(color) * 2, { gain: 0.35 });
        status();
        if (colored.size === PICS[picKey].steps.length && !celebrated) {
          celebrated = true;
          MUSIC.chime();
          confetti();
          window.OC?.count("shape pictures");
          shell.mark("d2", { done: true, [picKey]: true });
          say(`🎉 What a beautiful ${PICS[picKey].name}! Press 💾 Save to keep it in your gallery.`);
        }
      });
    };
    const render = () => {
      const pic = PICS[picKey];
      layers.fills.innerHTML = "";
      layers.guide.innerHTML = "";
      pic.steps
        .map((s, i) => ({ s, i, z: s.z ?? i }))
        .filter(({ i }) => i < step)
        .sort((a, b) => a.z - b.z)
        .forEach(({ s, i }) => shapeEl(s, { class: "dl-part", "data-i": i, fill: "#fffdf8", stroke: "#c9b8a1", "stroke-width": 3, "stroke-linejoin": "round" }, layers.fills));
      if (phase === "draw" && step < pic.steps.length) {
        const s = pic.steps[step];
        shapeEl(s, { fill: "rgba(240,138,36,.10)", stroke: "#f08a24", "stroke-width": 8, "stroke-dasharray": "4 16", "stroke-linecap": "round", "stroke-linejoin": "round", class: "dl-ghost" }, layers.guide);
        outline = shapeOutline(s, 8);
      }
    };
    const ask = () => {
      const s = PICS[picKey].steps[step];
      const [word, fact] = shapeWord(s);
      say(`Draw ${an(word).replace(word, `<b>${word}</b>`)} for the ${s.part}. Go over the orange dots. ${step === 0 ? fact : ""}`);
    };
    const accept = async (helped) => {
      busy = true;
      const s = PICS[picKey].steps[step];
      MUSIC.play("xylophone", 76 + step * 2, { gain: 0.45 });
      if (!helped) MUSIC.chime();
      say(helped ? `Good try! I'll help with this ${shapeWord(s)[0]}.` : `${pick(PRAISE)} ${shapeWord(s)[1]}`);
      step += 1;
      tries = 0;
      render();
      status();
      await wait(helped ? 1500 : 2200);
      if (my !== token) return;
      busy = false;
      if (step >= PICS[picKey].steps.length) return finishDrawing();
      ask();
    };
    const checkStep = () => {
      if (my !== token || busy) return;
      const pts = strokes.filter((s) => s.step === step).flatMap((s) => s.pts);
      const cov = coverage(outline, pts, 38);
      if (cov >= 0.6) return accept(false);
      tries += 1;
      if (tries >= 4) return accept(true);
      const last = strokes[strokes.length - 1]?.pts || [];
      if (meanAway(last, outline) > 70) {
        MUSIC.oops();
        say(`${pick(KIND)} Draw right on top of the orange dots, so your shape lands in the right place.`);
        const bad = strokes.pop();
        setTimeout(() => bad?.line.remove(), 900);
      } else say(`Keep going! Go all the way round the ${shapeWord(PICS[picKey].steps[step])[0]}.`);
    };
    const finishDrawing = async () => {
      phase = "colour";
      PICS[picKey].details(layers.details);
      render();
      colourPanel();
      MUSIC.chime();
      window.OC?.touch();
      say(`You drew a ${PICS[picKey].name} from shapes! Now pick a paint and tap each part to colour it in.`);
    };
    const load = (key) => {
      picKey = key;
      step = 0;
      phase = "draw";
      tries = 0;
      strokes = [];
      colored.clear();
      celebrated = false;
      busy = false;
      drawPanel();
      build();
      say(`Let's draw ${an(PICS[key].name)} ${PICS[key].icon} from ${PICS[key].steps.length} shapes. ${(() => {
        const s = PICS[key].steps[0];
        const [word, fact] = shapeWord(s);
        return `First, ${an(word).replace(word, `<b>${word}</b>`)} for the ${s.part}. ${fact} Draw over the orange dots.`;
      })()}`);
    };
    $("[data-panel]").onclick = async (event) => {
      if (my !== token) return;
      const k = event.target.closest("[data-pic]")?.dataset.pic;
      if (k) return load(k);
      const c = event.target.closest("[data-paint]")?.dataset.paint;
      if (c) {
        color = c;
        markPal(c);
        MUSIC.play("xylophone", 72 + PAINT.indexOf(c) * 2, { gain: 0.3 });
        return;
      }
      const what = event.target.closest("[data-do]")?.dataset.do;
      if (what === "undo") {
        const s = strokes.pop();
        if (s && s.step === step) s.line.remove();
        else if (s) strokes.push(s);
      }
      if (what === "skip" && !busy && phase === "draw") accept(true);
      if (what === "save") saveArt(view, PICS[picKey].name, "d2");
      if (what === "gallery") showGallery();
      if (what === "new") load(PIC_ORDER[(PIC_ORDER.indexOf(picKey) + 1) % PIC_ORDER.length]);
    };
    load(picKey);
  },

  // ----- Pixel art -----
  d3() {

      if (mode !== "free") {
        const rows = PIXEL_PICS[mode].rows;
        el("rect", { x: T.x - 6, y: T.y - 6, width: T.cell * 12 + 12, height: T.cell * 12 + 12, rx: 12, fill: "#fff", stroke: "#d9cdb5", "stroke-width": 3, class: "no-save" }, view);
        rows.forEach((row, r) => [...row].forEach((ch, c) => el("rect", { x: T.x + c * T.cell, y: T.y + r * T.cell, width: T.cell, height: T.cell, fill: ch === "." ? EMPTY : PIX[ch], stroke: "#fff", "stroke-width": 1, class: "no-save" }, view)));
        text(view, T.label[0], T.label[1], "Copy me!", { "font-size": 30, fill: "#2b1d12", class: "no-save" });
        text(view, T.note[0], T.note[1], "12 × 12 =", { "font-size": 22, fill: "#8a7764", class: "no-save" });
        text(view, T.note[0], T.note[1] + 28, "144 squares", { "font-size": 22, fill: "#8a7764", class: "no-save" });
      } else {
        text(view, 116, 240, "✨", { "font-size": 70, class: "no-save" });
        text(view, 116, 300, "Make", { "font-size": 28, fill: "#2b1d12", class: "no-save" });
        text(view, 116, 334, "your own!", { "font-size": 28, fill: "#2b1d12", class: "no-save" });
      }
      const g = el("g", {}, view);
      cells = [];
      for (let r = 0; r < N; r++) {
        cells.push([]);
        for (let c = 0; c < N; c++) cells[r].push(el("rect", { x: X0 + c * S, y: Y0 + r * S, width: S - 2, height: S - 2, rx: 5, fill: grid[r][c] || EMPTY }, g));
      }
      for (let i = 0; i <= N; i += 4) {
        el("line", { x1: X0 - 1 + i * S, y1: Y0 - 1, x2: X0 - 1 + i * S, y2: Y0 + N * S, stroke: "#c9b8a1", "stroke-width": 2, class: "no-save", "pointer-events": "none" }, view);
        el("line", { x1: X0 - 1, y1: Y0 - 1 + i * S, x2: X0 + N * S, y2: Y0 - 1 + i * S, stroke: "#c9b8a1", "stroke-width": 2, class: "no-save", "pointer-events": "none" }, view);
      }
      let last = "";
      const paintAt = (p) => {
        const c = Math.floor((p[0] - X0) / S);
        const r = Math.floor((p[1] - Y0) / S);
        if (r < 0 || c < 0 || r >= N || c >= N || last === `${r},${c}`) return;
        last = `${r},${c}`;
        grid[r][c] = color;
        cells[r][c].setAttribute("fill", color || EMPTY);
        MUSIC.play("xylophone", 72 + ((r + c) % 12) * 2, { gain: 0.22 });
      };
      ink(view, { begin: (p) => ((last = ""), paintAt(p)), move: paintAt, end: () => (last = "") });
    };
    const clear = () => (grid = Array.from({ length: N }, () => Array(N).fill("")));
    const start = (m) => {
      mode = m;
      clear();
      color = PIX[keys()[0]];
      build();
      say(m === "free" ? "Pick a colour and tap or drag on the squares to make your own pixel picture!" : `Copy the ${m}! Pick a colour, then tap the squares in the same places.`);
    };
    const check = async () => {
      const rows = PIXEL_PICS[mode].rows;
      let wrong = 0;
      let first = null;
      for (let r = 0; r < N; r++)
        for (let c = 0; c < N; c++) {
          const want = rows[r][c] === "." ? "" : PIX[rows[r][c]];
          if ((grid[r][c] || "") !== want) {
            wrong += 1;
            first ||= [r, c, want];
          }
        }
      if (!wrong) {
        MUSIC.chime();
        confetti();
        window.OC?.count("pixel pictures");
        const done = new Set([...(shell.progress().d3?.pics || []), mode]);
        shell.mark("d3", { pics: [...done], done: true });
        say(`${pick(PRAISE)} Your ${mode} matches, square for square! Press 💾 Save to keep it.`);
        return;
      }
      MUSIC.oops();
      const [r, c, want] = first;
      const name = want ? Object.keys(PIX).find((k) => PIX[k] === want) : "";
      const word = { R: "red", P: "pink", Y: "yellow", K: "black", W: "white", T: "tan", G: "green", B: "blue", O: "orange", U: "purple" }[name] || "empty";
      const hl = el("rect", { x: X0 + c * S - 4, y: Y0 + r * S - 4, width: S + 6, height: S + 6, rx: 8, fill: "none", stroke: "#f08a24", "stroke-width": 6, class: "no-save", "pointer-events": "none" }, view);
      setTimeout(() => hl.remove(), 2600);
      say(`${wrong} square${wrong === 1 ? "" : "s"} to fix. Look at row ${r + 1}, square ${c + 1} from the left: it should be ${word}.`);
    };
    $("[data-panel]").onclick = (event) => {
      if (my !== token) return;
      const m = event.target.closest("[data-mode]")?.dataset.mode;
      if (m) return start(m);
      const p = event.target.closest("[data-paint]");
      if (p) {
        color = p.dataset.paint;
        markPal(color);
        return;
      }
      const what = event.target.closest("[data-do]")?.dataset.do;
      if (what === "check") check();
      if (what === "clear") {
        clear();
        cells.forEach((row) => row.forEach((n) => n.setAttribute("fill", EMPTY)));
      }
      if (what === "save") {
        if (!grid.flat().some(Boolean)) return say("Colour some squares first!");
        saveArt(view, "pixel art", "d3");
      }
      if (what === "gallery") showGallery();
    };
    start(mode);
  },

  // ----- Pattern tiles -----
  d4() {
    const my = token;
    const COLS = ["#e53935", "#fdd835", "#1e88e5", "#43a047", "#2b1d12"];
    let mode = "slide";
    let color = COLS[0];
    let tile = [];
    let quiz = null;
    let round = 0;
    let right = 0;
    const blank = () => Array.from({ length: 4 }, () => Array.from({ length: 4 }, () => ({ c: "", s: 0 })));
    const starter = () => {
      const t = blank();
      t[0][0] = { c: "#e53935", s: 1 };
      t[0][1] = { c: "#fdd835", s: 0 };
      t[1][0] = { c: "#1e88e5", s: 0 };
      t[1][1] = { c: "#e53935", s: 3 };
      t[3][3] = { c: "#43a047", s: 0 };
      return t;
    };
    const tileAt = (t, i, j, how) => {
      if (how === "flip") {
        let out = t;
        if (i % 2) out = flipH(out);
        if (j % 2) out = flipV(out);
        return out;
      }
      if (how === "turn") {
        let out = t;
        const turns = [[0, 1], [3, 2]][j % 2][i % 2];
        for (let k = 0; k < turns; k++) out = rot90(out);
        return out;
      }
      return t;
    };
    const wallpaper = (t, how, { x0 = 330, y0 = 40, size = 20, cols = 8, rows = 6, animate = true } = {}) => {
      const g = el("g", {}, view);
      el("rect", { x: x0, y: y0, width: cols * size * 4, height: rows * size * 4, fill: "#fff" }, g);
      const tiles = [];
      for (let j = 0; j < rows; j++)
        for (let i = 0; i < cols; i++) {
          const tg = el("g", { opacity: animate ? 0 : 1 }, g);
          const tt = tileAt(t, i, j, how);
          tt.forEach((row, r) => row.forEach((cell, c) => cellShape(tg, x0 + i * size * 4 + c * size, y0 + j * size * 4 + r * size, size, cell)));
          el("rect", { x: x0 + i * size * 4, y: y0 + j * size * 4, width: size * 4, height: size * 4, fill: "none", stroke: "#e6dccd", "stroke-width": 1, class: "no-save" }, tg);
          tiles.push(tg);
        }
      if (animate) {
        const mine = token;
        tiles.forEach((tg, k) => setTimeout(() => mine === token && tg.setAttribute("opacity", 1), k * 18));
      }
      return g;
    };
    const build = (animate = true) => {
      fresh();
      if (mode === "quiz") {
        wallpaper(quiz.tile, quiz.how, { x0: 180, y0: 40, size: 20, cols: 8, rows: 6, animate });
        el("rect", { x: 337, y: 197, width: 166, height: 166, rx: 6, fill: "none", stroke: "#f08a24", "stroke-width": 7, "stroke-dasharray": "16 9" }, view);
        return;
      }
      text(view, 160, 60, "Your tile", { "font-size": 30, fill: "#2b1d12", class: "no-save" });
      el("rect", { x: 34, y: 94, width: 252, height: 252, rx: 14, fill: "#fff", stroke: "#a8916f", "stroke-width": 4, class: "no-save" }, view);
      const tg = el("g", {}, view);
      tile.forEach((row, r) =>
        row.forEach((cell, c) => {
          const x = 40 + c * 60;
          const y = 100 + r * 60;
          el("rect", { x, y, width: 60, height: 60, fill: "#fffcf6", stroke: "#e6dccd", "stroke-width": 2, class: "dl-tcell no-save", "data-r": r, "data-c": c, style: "cursor:pointer" }, tg);
        }),
      );
      const shapes = el("g", { "pointer-events": "none" }, tg);
      tile.forEach((row, r) => row.forEach((cell, c) => cellShape(shapes, 40 + c * 60, 100 + r * 60, 60, cell)));
      const how = { slide: "🔁 slide", flip: "🪞 flip", turn: "🔄 turn" }[mode];
      text(view, 160, 395, `repeat: ${how}`, { "font-size": 28, fill: "#b8620f", class: "no-save" });
      text(view, 160, 435, "Tap again for a triangle", { "font-size": 22, fill: "#8a7764", class: "no-save" });
      wallpaper(tile, mode, { animate });
      view.addEventListener("pointerdown", (event) => {
        const cellNode = event.target.closest(".dl-tcell");
        if (!cellNode || my !== token) return;
        const r = Number(cellNode.dataset.r);
        const c = Number(cellNode.dataset.c);
        const cell = tile[r][c];
        if (cell.c !== color) tile[r][c] = { c: color, s: 0 };
        else if (cell.s < 4) tile[r][c] = { c: color, s: cell.s + 1 };
        else tile[r][c] = { c: "", s: 0 };
        MUSIC.play("xylophone", 72 + (r * 4 + c), { gain: 0.3 });
        window.OC?.touch();
        build(false);
      });
    };
    const makePanel = () => {
      const modes = chipRow([["slide", "🔁 Slide"], ["flip", "🪞 Flip"], ["turn", "🔄 Turn"], ["quiz", "❓ Which move?"]], mode, "mode");
      if (mode === "quiz") panel(`${chipRow([["slide", "✏️ Make my tile"], ["quiz", "❓ Which move?"]], mode, "mode")}<div class="ap-buttons"><span class="ap-status" data-status></span><button type="button" data-ans="slide">🔁 Slide</button><button type="button" data-ans="flip">🪞 Flip</button><button type="button" data-ans="turn">🔄 Turn</button></div>`);
      else panel(`${modes}<div class="ap-chips dl-pal">${COLS.map((c) => `<button type="button" data-paint="${c}" aria-pressed="${c === color}" aria-label="colour" style="background:${c}"></button>`).join("")}<button type="button" data-do="clear" aria-label="Clear" style="font-size:20px">🗑️</button><button type="button" data-do="save" aria-label="Save" style="font-size:20px">💾</button><button type="button" data-do="gallery" aria-label="Gallery" style="font-size:20px">🖼️</button></div>`);
    };
    const randomTile = () => {
      for (;;) {
        const t = blank();
        const n = 5 + Math.floor(Math.random() * 4);
        for (let k = 0; k < n; k++) t[Math.floor(Math.random() * 4)][Math.floor(Math.random() * 4)] = { c: pick(COLS.slice(0, 4)), s: Math.floor(Math.random() * 5) };
        const s = sig(t);
        if (s !== sig(flipH(t)) && s !== sig(flipV(t)) && s !== sig(rot90(t)) && s !== sig(rot90(rot90(t))) && sig(flipH(t)) !== sig(flipV(t))) return t;
      }
    };
    const ask = () => {
      quiz = { tile: randomTile(), how: pick(["slide", "flip", "turn"]) };
      build();
      $("[data-status]").textContent = `${round + 1} of 8`;
      say("Look at the 4 tiles in the orange box. Did the tile <b>slide</b>, <b>flip</b> or <b>turn</b>?");
    };
    const WHY = {
      slide: "Every tile is exactly the same, just slid along. That's a slide.",
      flip: "Tiles next to each other are mirror images, flipped over. That's a flip.",
      turn: "Each tile is turned a quarter turn, like a clock hand. That's a turn.",
    };
    const answer = async (a, button) => {
      if (!quiz || quiz.done) return;
      quiz.done = true;
      round += 1;
      if (a === quiz.how) {
        right += 1;
        MUSIC.chime();
        button.classList.add("right");
        say(`${pick(PRAISE)} ${WHY[quiz.how]}`);
      } else {
        MUSIC.oops();
        button.classList.add("wrong");
        say(`${pick(KIND)} ${WHY[quiz.how]}`);
      }
      window.OC?.count("patterns spotted");
      await wait(3000);
      if (my !== token || mode !== "quiz") return;
      if (round >= 8) {
        if (right >= 6) {
          confetti();
          shell.mark("d4", { done: true });
        }
        say(`${right} out of 8! ${right >= 6 ? "🎉 You can spot slides, flips and turns!" : "Let's practise more. Look at one corner of a tile."}`);
        round = 0;
        right = 0;
        await wait(3200);
        if (my !== token || mode !== "quiz") return;
      }
      makePanel();
      ask();
    };
    const setMode = (m) => {
      mode = m;
      makePanel();
      if (m === "quiz") {
        round = 0;
        right = 0;
        return ask();
      }
      build();
      say(
        {
          slide: "Tap the squares on your tile to colour it. Watch it repeat across the wall, like wallpaper!",
          flip: "Flip! Every other tile is a mirror image. Look how new shapes appear where they meet.",
          turn: "Turn! Each tile turns a quarter turn. Four turns make a pinwheel.",
        }[m],
      );
    };
    $("[data-panel]").onclick = (event) => {
      if (my !== token) return;
      const m = event.target.closest("[data-mode]")?.dataset.mode;
      if (m) return setMode(m);
      const a = event.target.closest("[data-ans]");
      if (a) return answer(a.dataset.ans, a);
      const p = event.target.closest("[data-paint]");
      if (p) {
        color = p.dataset.paint;
        markPal(color);
        return;
      }
      const what = event.target.closest("[data-do]")?.dataset.do;
      if (what === "clear") {
        tile = blank();
        build(false);
      }
      if (what === "save") saveArt(view, "pattern", "d4");
      if (what === "gallery") showGallery();
    };
    tile = starter();
    setMode("slide");
  },

  // ----- Free draw -----
  d5() {
    const my = token;
    const STAMPS = ["⭐", "❤️", "🌸", "🐞", "☀️", "🐟", "🌈", "🦋"];
    let tool = "pen";
    let color = PAINT[4];
    let stamp = STAMPS[0];
    let hue = 0;
    let made = 0;
    const SIZES = { pencil: 6, pen: 14, brush: 34, rainbow: 20 };
    const strokes = [];
    const makePanel = () => {
      const tools = chipRow([["pencil", "✏️ Pencil"], ["pen", "🖍️ Crayon"], ["brush", "🖌️ Brush"], ["rainbow", "🌈 Rainbow"], ["stamp", "⭐ Stamps"]], tool, "tool");
      const row2 =
        tool === "stamp"
          ? `<div class="ap-chips dl-pal">${STAMPS.map((s) => `<button type="button" data-stamp="${s}" aria-pressed="${s === stamp}" style="background:#fff;font-size:24px">${s}</button>`).join("")}</div>`
          : tool === "rainbow"
            ? ""
            : palRow(color);
      panel(`${tools}${row2}<div class="ap-buttons"><button type="button" data-do="undo">↩️ Undo</button><button type="button" data-do="clear">🗑️ Clear</button><button type="button" class="primary" data-do="save">💾 Save</button><button type="button" data-do="gallery" aria-label="Gallery">🖼️</button></div>`);
    };
    const box = stage.getBoundingClientRect();
    fresh("#ffffff", W, Math.round(Math.max(420, Math.min(1600, (W * box.height) / Math.max(1, box.width)))));
    const layer = el("g", {}, view);
    let cur = null;
    let last = null;
    ink(view, {
      begin(p) {
        made += 1;
        if (tool === "stamp") {
          const g = emoji(layer, p[0], p[1], stamp, 70);
          strokes.push(g);
          MUSIC.play("xylophone", 84 + STAMPS.indexOf(stamp), { gain: 0.3 });
          cur = null;
          return;
        }
        cur = el("g", {}, layer);
        strokes.push(cur);
        last = p;
        this.move([p[0] + 0.1, p[1]]);
      },
      move(p) {
        if (!cur) return;
        if (tool === "rainbow") {
          if (dist(p, last) < 6) return;
          hue = (hue + 7) % 360;
          el("line", { x1: last[0], y1: last[1], x2: p[0], y2: p[1], stroke: `hsl(${hue} 85% 55%)`, "stroke-width": SIZES.rainbow, "stroke-linecap": "round" }, cur);
          last = p;
          return;
        }
        let line = cur.lastChild;
        if (!line) line = el("polyline", { points: `${last[0]},${last[1]}`, fill: "none", stroke: color, "stroke-width": SIZES[tool], "stroke-linecap": "round", "stroke-linejoin": "round", opacity: tool === "pen" ? 0.92 : 1 }, cur);
        line.setAttribute("points", `${line.getAttribute("points")} ${p[0].toFixed(1)},${p[1].toFixed(1)}`);
        last = p;
      },
      end() {
        cur = null;
      },
    });
    makePanel();
    say("Pick a brush and a colour, then draw anything you like! Try the stamps too.");
    $("[data-panel]").onclick = (event) => {
      if (my !== token) return;
      const t = event.target.closest("[data-tool]")?.dataset.tool;
      if (t) {
        tool = t;
        makePanel();
        return;
      }
      const c = event.target.closest("[data-paint]")?.dataset.paint;
      if (c) {
        color = c;
        markPal(c);
        MUSIC.play("xylophone", 72 + PAINT.indexOf(c) * 2, { gain: 0.3 });
        return;
      }
      const s = event.target.closest("[data-stamp]")?.dataset.stamp;
      if (s) {
        stamp = s;
        document.querySelectorAll("[data-stamp]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.stamp === s)));
        return;
      }
      const what = event.target.closest("[data-do]")?.dataset.do;
      if (what === "undo") strokes.pop()?.remove();
      if (what === "clear") {
        strokes.length = 0;
        layer.innerHTML = "";
      }
      if (what === "save") {
        if (!layer.childNodes.length) return say("Draw something first!");
        saveArt(view, "free drawing", "d5");
      }
      if (what === "gallery") showGallery();
    };
  },
};

const style = document.createElement("style");
style.textContent = `.dl-ink{touch-action:none;cursor:crosshair}
.dl-pal button{width:44px;min-width:44px;padding:0 !important;box-shadow:0 3px 0 rgba(0,0,0,.22) !important;border:2px solid rgba(0,0,0,.08) !important}
.dl-pal button[aria-pressed="true"]{outline:4px solid #2b1d12;outline-offset:2px}
.dl-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;width:100%}
.dl-gallery img{width:100%;border-radius:14px;box-shadow:0 3px 0 #e2d6c4;display:block}
.dl-part{cursor:pointer}
.ap-buttons .ap-status{align-self:center}
@media (max-height:460px),(max-width:420px) and (max-height:720px){.dl-pal button{width:36px;min-width:36px}}`;
document.head.appendChild(style);

const shell = SHELL({
  units: UNITS,
  how: {
    d0: { icon: "👀", title: "See it", steps: ["Watch the pictures.", "Press Next ▶ to go on.", "Press Let's play when you are ready."] },
    d1: { icon: "✏️", title: "Trace the lines", steps: ["Put your finger on the green dot.", "Follow the dots all the way to the end.", "Green line means close. Orange means too far."] },
    d2: { icon: "🦉", title: "Draw with shapes", steps: ["Draw over the orange dotted shape.", "Each shape adds a part to the picture.", "Then pick a paint and tap the parts to colour them."] },
    d3: { icon: "🟥", title: "Pixel art", steps: ["Pick a colour below.", "Tap or drag on the squares to colour them.", "Copy the picture, then press Check."] },
    d4: { icon: "🧩", title: "Pattern tiles", steps: ["Tap the squares on your tile to colour them.", "Watch your tile repeat like wallpaper.", "Try Flip and Turn, then play Which move?"] },
    d5: { icon: "🖌️", title: "Free draw", steps: ["Pick a brush or a stamp.", "Draw with your finger.", "Press 💾 Save to keep your picture."] },
  },
  start: "d0",
  onStop() {
    token += 1;
    $("[data-panel]").onclick = null;
  },
  subject: "Arts",
  activity: "Drawing Lab",
  onUnit(id) {
    token += 1;
    VOICE.hush();
    units[id]();
  },
});
MUSIC.preload("xylophone", [72, 74, 76, 78, 80, 82, 84, 86, 88, 90, 91, 92, 94, 96]);
MUSIC.preload("piano", [64, 67]);
</script>
