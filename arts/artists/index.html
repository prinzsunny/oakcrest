<script>const { $, el, svg: makeSvg, text, panel, say, sayAsync, pick, pickInt, wait, confetti, PRAISE, KIND, explain, everyday, emoji, shuffle } = KIT;
const stage = $("[data-stage]");
const W = 1000;
const H = 560;
let token = 0;
let view = null;
let uid = 0;

const UNITS = [
  { id: "a0", label: "1. See it", icon: "👀" },
  { id: "a1", label: "2. Mondrian blocks", icon: "🟥" },
  { id: "a2", label: "3. Kandinsky circles", icon: "🎵" },
  { id: "a3", label: "4. Seurat dots", icon: "🔵" },
  { id: "a4", label: "5. Matisse cut-outs", icon: "✂️" },
  { id: "a5", label: "6. Van Gogh swirls", icon: "🌌" },

  { id: "a7", label: "8. Who made this?", icon: "🖼️" },
];

// ---------- the artists (true facts, simple words) ----------
const ARTISTS = {
  mondrian: {
    name: "Piet Mondrian",
    flag: "🇳🇱",
    years: "1872–1944",
    face: "👨‍🎨",
    facts: [
      "Piet Mondrian was a Dutch painter, from the Netherlands. He lived from 1872 to 1944.",
      "He used only straight black lines, white, and the three primary colours: red, yellow and blue.",
      "When he moved to New York, he loved jazz music, and he painted Broadway Boogie Woogie.",
    ],
    why: "Straight black lines and blocks of red, yellow and blue: that's Mondrian!",
  },
  kandinsky: {
    name: "Wassily Kandinsky",
    flag: "🇷🇺",
    years: "1866–1944",
    face: "👨‍🎨",
    facts: [
      "Wassily Kandinsky was a Russian painter, born in Moscow in 1866.",
      "He was one of the first artists to paint only shapes and colours, not things.",
      "He thought colours were like music. He said yellow sounds like a trumpet, and dark blue like a cello.",
    ],
    why: "Circles inside circles, in squares of colour: that's Kandinsky!",
  },
  seurat: {
    name: "Georges Seurat",
    flag: "🇫🇷",
    years: "1859–1891",
    face: "👨‍🎨",
    facts: [
      "Georges Seurat was a French painter. He lived from 1859 to 1891.",
      "He painted with tiny dots of colour. This is called pointillism.",
      "Up close you see dots. From far away, the dots mix together in your eyes!",
    ],
    why: "A picture made of tiny dots of colour: that's Seurat!",
  },
  matisse: {
    name: "Henri Matisse",
    flag: "🇫🇷",
    years: "1869–1954",
    face: "👨‍🎨",
    facts: [
      "Henri Matisse was a French artist. He lived from 1869 to 1954.",
      "When he was older he was often ill and used a wheelchair, so he made art with scissors.",
      "Helpers painted paper in bright colours, and he cut out shapes. He called it drawing with scissors.",
    ],
    why: "Bright cut-paper shapes like leaves and stars: that's Matisse!",
  },
  vangogh: {
    name: "Vincent van Gogh",
    flag: "🇳🇱",
    years: "1853–1890",
    face: "👨‍🎨",
    facts: [
      "Vincent van Gogh was a Dutch painter. He lived from 1853 to 1890.",
      "He painted with thick paint and short, swirly brush strokes.",
      "His painting The Starry Night, from 1889, shows a swirling night sky full of stars.",
    ],
    why: "A swirly night sky with glowing stars, in short brush strokes: that's Van Gogh!",
  },
  kusama: {
    name: "Yayoi Kusama",
    flag: "🇯🇵",
    years: "born 1929",
    face: "👩‍🎨",
    facts: [
      "Yayoi Kusama is a Japanese artist. She was born in 1929.",
      "She loves polka dots! She puts them on pumpkins, on rooms, and even on people.",
      "Some of her rooms have mirrors, so the dots seem to go on forever.",
    ],
    why: "A pumpkin covered in polka dots: that's Yayoi Kusama!",
  },
};
const ORDER = ["mondrian", "kandinsky", "seurat", "matisse", "vangogh", "kusama"];
const lastName = (k) => ({ mondrian: "Mondrian", kandinsky: "Kandinsky", seurat: "Seurat", matisse: "Matisse", vangogh: "Van Gogh", kusama: "Kusama" })[k];

// ---------- helpers ----------
function fresh(bg = "#fdf8ef", vw = W, vh = H) {
  stage.innerHTML = "";
  view = makeSvg(`0 0 ${vw} ${vh}`, stage);
  el("rect", { width: vw, height: vh, fill: bg }, view);
  return view;
}
function svgPoint(event, v = view) {
  const m = v.getScreenCTM();
  if (!m) return [0, 0];
  const p = new DOMPoint(event.clientX, event.clientY).matrixTransform(m.inverse());
  return [p.x, p.y];
}
function ink(v, h) {
  v.classList.add("ac-ink");
  let on = false;
  v.addEventListener("pointerdown", (event) => {
    event.preventDefault();
    on = true;
    try {
      v.setPointerCapture(event.pointerId);
    } catch {}
    window.OC?.touch();
    h.begin?.(svgPoint(event, v), event);
  });
  v.addEventListener("pointermove", (event) => {
    if (!on) return;
    const list = event.getCoalescedEvents ? event.getCoalescedEvents() : [];
    for (const e of list.length ? list : [event]) h.move?.(svgPoint(e, v), e);
  });
  const stop = () => {
    if (!on) return;
    on = false;
    h.end?.();
  };
  v.addEventListener("pointerup", stop);
  v.addEventListener("pointercancel", stop);
}
const an = (w) => (/^[aeiou]/i.test(w) ? `an ${w}` : `a ${w}`);
// On tall phone screens, zoom the picture in on the part you play with (the artist card is dropped).
const focus = (box) => {
  if (stage.clientWidth / Math.max(1, stage.clientHeight) < 1.3) view.setAttribute("viewBox", box.join(" "));
};
const rnd = (a, b) => a + Math.random() * (b - a);
const chipRow = (list, cur, attr, extra = "") => `<div class="ap-chips">${list.map(([k, label]) => `<button type="button" data-${attr}="${k}" aria-pressed="${k === cur}">${label}</button>`).join("")}${extra}</div>`;
const swatches = (list, cur, attr = "paint") => list.map((c) => `<button type="button" class="ac-sw" data-${attr}="${c}" aria-pressed="${c === cur}" aria-label="colour" style="background:${c}"></button>`).join("");
const press = (attr, value) => document.querySelectorAll(`[data-${attr}]`).forEach((b) => b.setAttribute("aria-pressed", String(b.dataset[attr] === value)));
const ICON_BTNS = `<button type="button" data-do="save" aria-label="Save">💾</button><button type="button" data-do="gallery" aria-label="Gallery">🖼️</button><button type="button" data-do="fact" aria-label="Tell me a fact">💡</button>`;

// Read the artist's facts aloud one by one, then the instruction. Stops if the child starts playing.
async function tellFacts(my, key, then) {
  for (const f of ARTISTS[key].facts) {
    if (my !== token) return;
    const ok = await sayAsync(`${ARTISTS[key].flag} ${f}`);
    if (!ok || my !== token) return;
    await wait(250);
  }
  if (my === token) say(then);
}
function oneFact(key) {
  const k = `ac-fact-${key}`;
  const i = ((window[k] ?? -1) + 1) % ARTISTS[key].facts.length;
  window[k] = i;
  say(`💡 ${ARTISTS[key].facts[i]}`);
}

// ---------- gallery (shared with Drawing Lab) ----------
const GKEY = "oc-drawing-gallery";
const galleryItems = () => {
  try {
    const list = JSON.parse(localStorage.getItem(GKEY) || "[]");
    return Array.isArray(list) ? list : [];
  } catch {
    return [];
  }
};
function galleryAdd(src, title) {
  let items = [{ src, title, at: Date.now() }, ...galleryItems()].slice(0, 12);
  while (items.length) {
    try {
      localStorage.setItem(GKEY, JSON.stringify(items));
      return true;
    } catch {
      items = items.slice(0, -1);
    }
  }
  return false;
}
function snapshot(v) {
  return new Promise((resolve) => {
    try {
      const clone = v.cloneNode(true);
      clone.querySelectorAll(".no-save").forEach((n) => n.remove());
      const vb = v.viewBox.baseVal;
      clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      clone.setAttribute("width", vb.width);
      clone.setAttribute("height", vb.height);
      const img = new Image();
      img.onload = () => {
        try {
          const c = document.createElement("canvas");
          c.width = 500;
          c.height = Math.round((500 * vb.height) / vb.width);
          const x = c.getContext("2d");
          x.fillStyle = "#ffffff";
          x.fillRect(0, 0, c.width, c.height);
          x.drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL("image/jpeg", 0.82));
        } catch {
          resolve(null);
        }
      };
      img.onerror = () => resolve(null);
      img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(new XMLSerializer().serializeToString(clone));
    } catch {
      resolve(null);
    }
  });
}
async function saveArt(title, id) {
  const src = await snapshot(view);
  if (!src || !galleryAdd(src, title)) {
    MUSIC.oops();
    say("Oh no, I could not save this picture on this device.");
    return false;
  }
  MUSIC.chime();
  confetti();
  shell.mark(id, { done: true, saved: true });
  window.OC?.count("artworks saved");
  say("🎉 Saved to your gallery! Press 🖼️ to see all your pictures.");
  return true;
}
function showGallery() {
  stage.querySelector(".ac-gal")?.remove();
  const items = galleryItems();
  const box = document.createElement("div");
  box.className = "kt-how ac-gal";
  box.innerHTML = `<div class="kt-how-card" style="max-width:780px"><h2>🖼️ My gallery</h2>${
    items.length
      ? `<div class="ac-gallery">${items.map((it, i) => `<a href="${it.src}" download="oakcrest-art-${i + 1}.jpg"><img src="${it.src}" alt="${it.title || "Artwork"}"></a>`).join("")}</div><p style="margin:0;color:var(--muted)">Tap a picture to download it.</p>`
      : `<p>No pictures yet. Make something and press 💾 Save!</p>`
  }<button type="button" class="kt-go">Close</button></div>`;
  stage.appendChild(box);
  box.querySelector(".kt-go").onclick = () => box.remove();
  VOICE.speak(items.length ? `You have ${items.length} picture${items.length === 1 ? "" : "s"} in your gallery.` : "No pictures yet.");
}
// Panel clicks shared by every studio: save, gallery, fact.
function common(what, key, title, id) {
  if (what === "save") saveArt(title, id);
  if (what === "gallery") showGallery();
  if (what === "fact") oneFact(key);
}

// ---------- art generators: each draws an artwork "in the style" into a box ----------
function clipBox(parent, x, y, w, h, round = 0) {
  const id = `acc${++uid}`;
  const defs = el("defs", {}, parent);
  const cp = el("clipPath", { id }, defs);
  if (round) el("circle", { cx: x + w / 2, cy: y + h / 2, r: w / 2 }, cp);
  else el("rect", { x, y, width: w, height: h }, cp);
  return el("g", { "clip-path": `url(#${id})` }, parent);
}
const PRIMARY = { red: "#d7262e", yellow: "#f7d21e", blue: "#1f4fbf", white: "#f6f2e7" };
function genMondrian(parent, x, y, w, h) {
  const g = clipBox(parent, x, y, w, h);
  let rects = [{ x: 0, y: 0, w: 1, h: 1, fill: PRIMARY.white }];
  const n = pickInt(5, 8);
  for (let i = 0; i < n; i++) {
    rects.sort((a, b) => b.w * b.h - a.w * a.h);
    const r = rects.splice(pickInt(0, Math.min(1, rects.length - 1)), 1)[0];
    const t = rnd(0.3, 0.7);
    if (r.w > r.h ? Math.random() < 0.75 : Math.random() < 0.25) rects.push({ ...r, w: r.w * t }, { ...r, x: r.x + r.w * t, w: r.w * (1 - t) });
    else rects.push({ ...r, h: r.h * t }, { ...r, y: r.y + r.h * t, h: r.h * (1 - t) });
  }
  const order = shuffle(rects.map((_, i) => i));
  rects[order[0]].fill = PRIMARY.red;
  rects[order[1]].fill = PRIMARY.yellow;
  rects[order[2]].fill = PRIMARY.blue;
  if (Math.random() < 0.5) rects[order[3]].fill = pick([PRIMARY.red, PRIMARY.blue, PRIMARY.yellow]);
  const lw = Math.max(3, w * 0.024);
  el("rect", { x, y, width: w, height: h, fill: "#111" }, g);
  for (const r of rects) el("rect", { x: x + r.x * w + lw / 2, y: y + r.y * h + lw / 2, width: Math.max(0, r.w * w - lw), height: Math.max(0, r.h * h - lw), fill: r.fill }, g);
  return g;
}
const KCOL = ["#f7c90c", "#1f4fbf", "#3a9b4a", "#d7262e", "#6db8e8", "#7b3fa0", "#f08a24", "#f3ead6", "#1d1d1d", "#e88aa8"];
function genKandinsky(parent, x, y, w, h) {
  const g = clipBox(parent, x, y, w, h);
  el("rect", { x, y, width: w, height: h, fill: "#2a2320" }, g);
  const cw = w / 4;
  const ch = h / 3;
  for (let r = 0; r < 3; r++)
    for (let c = 0; c < 4; c++) {
      const bg = pick(KCOL);
      const pad = cw * 0.03;
      el("rect", { x: x + c * cw + pad, y: y + r * ch + pad, width: cw - 2 * pad, height: ch - 2 * pad, fill: bg }, g);
      let prev = bg;
      const m = Math.min(cw, ch);
      const cx = x + c * cw + cw / 2 + rnd(-0.04, 0.04) * cw;
      const cy = y + r * ch + ch / 2 + rnd(-0.04, 0.04) * ch;
      for (const f of [0.42, 0.31, 0.2, 0.1]) {
        let col = pick(KCOL);
        while (col === prev) col = pick(KCOL);
        prev = col;
        el("circle", { cx: cx + rnd(-0.015, 0.015) * m, cy: cy + rnd(-0.015, 0.015) * m, r: f * m, fill: col }, g);
      }
    }
  return g;
}
function genSeurat(parent, x, y, w, h) {
  const g = clipBox(parent, x, y, w, h);
  el("rect", { x, y, width: w, height: h, fill: "#f6f0e2" }, g);
  const s = Math.max(5, w / 40);
  const sun = [0.74, 0.22, 0.13];
  for (let gy = s / 2; gy < h; gy += s * 0.86)
    for (let gx = s / 2; gx < w; gx += s) {
      const px = gx + rnd(-0.3, 0.3) * s;
      const py = gy + rnd(-0.3, 0.3) * s;
      const fx = px / w;
      const fy = py / h;
      const horizon = 0.52 + 0.04 * Math.sin(fx * 6);
      let list;
      if (Math.hypot(fx - sun[0], (fy - sun[1]) * (h / w)) < sun[2]) list = ["#ffd800", "#ff9a1f", "#fff1a0", "#e8262d"];
      else if (fy < horizon) list = ["#6db8e8", "#ffffff", "#9fd0f0", "#6db8e8", "#f7e08a"];
      else if (fy < 0.68) list = ["#1e6fc0", "#6db8e8", "#ffffff", "#2a9d8f"];
      else if (fx > 0.18 && fx < 0.26 && fy > 0.55) list = ["#6d4c2f", "#2b1d12", "#8d5a34"];
      else list = ["#3a9b4a", "#ffd800", "#1e6fc0", "#7cc35a", "#3a9b4a"];
      el("circle", { cx: x + px, cy: y + py, r: s * 0.42, fill: pick(list) }, g);
    }
  return g;
}
const SHAPES = {
  leaf: (a) => [0.55 * (0.82 + 0.18 * Math.cos(6 * a)) * Math.cos(a), 1.2 * (0.82 + 0.18 * Math.cos(6 * a)) * Math.sin(a)],
  star: (a) => [(0.62 + 0.38 * Math.cos(7 * a)) * Math.cos(a), (0.62 + 0.38 * Math.cos(7 * a)) * Math.sin(a)],
  flower: (a) => [(0.76 + 0.24 * Math.cos(5 * a)) * Math.cos(a), (0.76 + 0.24 * Math.cos(5 * a)) * Math.sin(a)],
  pebble: (a) => [(0.88 + 0.1 * Math.sin(3 * a + 1) + 0.05 * Math.sin(5 * a)) * 1.1 * Math.cos(a), (0.88 + 0.1 * Math.sin(3 * a + 1) + 0.05 * Math.sin(5 * a)) * 0.8 * Math.sin(a)],
};
const SHAPE_WORDS = { leaf: ["leaf", "leaves"], star: ["star", "stars"], flower: ["flower", "flowers"], pebble: ["pebble", "pebbles"] };
const shapePath = (type) => "M" + Array.from({ length: 120 }, (_, i) => SHAPES[type]((i / 120) * Math.PI * 2 - Math.PI / 2).map((v) => v.toFixed(3)).join(" ")).join(" L") + " Z";
const MATISSE = ["#e8262d", "#f7c90c", "#1f4fbf", "#2e9e47", "#f08a24", "#ec6fa4", "#1d1d1d"];
function genMatisse(parent, x, y, w, h) {
  const g = clipBox(parent, x, y, w, h);
  const bg = pick(["#1f4fbf", "#f6efe0", "#f7c90c", "#2e9e47"]);
  el("rect", { x, y, width: w, height: h, fill: bg }, g);
  const n = pickInt(6, 8);
  for (let i = 0; i < n; i++) {
    let col = pick(MATISSE);
    while (col === bg) col = pick(MATISSE);
    const s = w * rnd(0.08, 0.13);
    el("path", { d: shapePath(pick(Object.keys(SHAPES))), fill: col, transform: `translate(${x + w * rnd(0.12, 0.88)} ${y + h * rnd(0.12, 0.88)}) rotate(${rnd(0, 360)}) scale(${s})` }, g);
  }
  return g;
}
const NIGHT = ["#2e5cb8", "#4f7fd0", "#7fb3e6", "#c9dcf2", "#1b3a8a", "#3d6cc4"];
const STARS = ["#f7d64a", "#f2b705", "#fff3b0", "#ffe27a"];
const CYPRESS = ["#1f3d2b", "#2f5d3a", "#0f2418", "#46704a"];
function swirlStroke(parent, px, py, ang, len, width, col, curl = 0.5) {
  const dx = Math.cos(ang) * len;
  const dy = Math.sin(ang) * len;
  const nx = -dy * curl * 0.35;
  const ny = dx * curl * 0.35;
  return el("path", { d: `M${(px - dx / 2).toFixed(1)} ${(py - dy / 2).toFixed(1)} Q${(px + nx).toFixed(1)} ${(py + ny).toFixed(1)} ${(px + dx / 2).toFixed(1)} ${(py + dy / 2).toFixed(1)}`, fill: "none", stroke: col, "stroke-width": width, "stroke-linecap": "round" }, parent);
}
function starBurst(parent, cx, cy, r, scale = 1) {
  const g = el("g", {}, parent);
  for (let k = 3; k >= 1; k--) el("circle", { cx, cy, r: r * k * 0.36, fill: "none", stroke: k === 3 ? "#7fb3e6" : pick(STARS), "stroke-width": r * 0.13, "stroke-dasharray": `${r * 0.22 * scale} ${r * 0.1 * scale}`, "stroke-linecap": "round" }, g);
  el("circle", { cx, cy, r: r * 0.2, fill: "#fff3b0" }, g);
  return g;
}
function genVanGogh(parent, x, y, w, h) {
  const g = clipBox(parent, x, y, w, h);
  el("rect", { x, y, width: w, height: h, fill: "#1d2f6f" }, g);
  const centers = [[0.38, 0.32], [0.62, 0.26]];
  const sp = w / 24;
  for (let gy = sp / 2; gy < h * 0.66; gy += sp * 0.7)
    for (let gx = sp / 2; gx < w; gx += sp * 0.8) {
      let vx = 1;
      let vy = 0.15 * Math.sin(gx / w * 8);
      for (const [cx, cy] of centers) {
        const ddx = gx - cx * w;
        const ddy = gy - cy * h;
        const d = Math.hypot(ddx, ddy) || 1;
        const k = 2.2 * Math.exp(-d / (w * 0.12));
        vx += (-ddy / d) * k;
        vy += (ddx / d) * k;
      }
      swirlStroke(g, x + gx + rnd(-3, 3), y + gy + rnd(-3, 3), Math.atan2(vy, vx), sp * 1.1, Math.max(2, w / 90), pick(NIGHT), 0.6);
    }
  for (let i = 0; i < 6; i++) starBurst(g, x + w * rnd(0.08, 0.75), y + h * rnd(0.08, 0.5), w * rnd(0.03, 0.05), w / 500);
  starBurst(g, x + w * 0.87, y + h * 0.15, w * 0.07, w / 500);
  el("circle", { cx: x + w * 0.87, cy: y + h * 0.15, r: w * 0.035, fill: "#f7c90c" }, g);
  el("path", { d: `M${x} ${y + h * 0.7} Q${x + w * 0.3} ${y + h * 0.58} ${x + w * 0.6} ${y + h * 0.68} T${x + w} ${y + h * 0.64} L${x + w} ${y + h} L${x} ${y + h} Z`, fill: "#22385a" }, g);
  for (let i = 0; i < 7; i++) {
    const hx = x + w * (0.35 + i * 0.08);
    const hy = y + h * (0.78 + (i % 3) * 0.05);
    el("rect", { x: hx, y: hy, width: w * 0.06, height: h * 0.07, fill: "#2b3b52" }, g);
    el("rect", { x: hx + w * 0.02, y: hy + h * 0.02, width: w * 0.015, height: h * 0.02, fill: "#f7d64a" }, g);
  }
  el("path", { d: `M${x + w * 0.08} ${y + h} C${x + w * 0.05} ${y + h * 0.6} ${x + w * 0.13} ${y + h * 0.35} ${x + w * 0.15} ${y + h * 0.1} C${x + w * 0.2} ${y + h * 0.4} ${x + w * 0.27} ${y + h * 0.6} ${x + w * 0.24} ${y + h} Z`, fill: "#16301f" }, g);
  for (let i = 0; i < 26; i++) swirlStroke(g, x + w * rnd(0.1, 0.22), y + h * rnd(0.3, 0.95), -Math.PI / 2 + rnd(-0.5, 0.5), sp * 0.9, Math.max(2, w / 110), pick(CYPRESS), 0.8);
  return g;
}
function genKusama(parent, x, y, w, h) {
  const g = clipBox(parent, x, y, w, h);
  el("rect", { x, y, width: w, height: h, fill: "#d7262e" }, g);
  const s = w / 9;
  for (let r = 0; r < 12; r++) for (let c = 0; c < 12; c++) el("circle", { cx: x + c * s + (r % 2) * s * 0.5, cy: y + r * s * 0.8, r: s * 0.18, fill: "#fff" }, g);

}
function pumpkin(parent, cx, cy, rx, ry, dots) {
  const g = el("g", {}, parent);
  el("path", { d: `M${cx - rx * 0.06} ${cy - ry * 0.95} q${rx * 0.02} ${-ry * 0.3} ${rx * 0.12} ${-ry * 0.38} l${rx * 0.06} ${ry * 0.08} q${-rx * 0.06} ${ry * 0.12} ${-rx * 0.04} ${ry * 0.32} Z`, fill: "#2f4f1f" }, g);

}

}
function artistCard(key, x = 115) {

async function reveal(g, api, ms = 1600) {
  const kids = [...g.querySelectorAll("rect, circle, path, ellipse")];
  kids.forEach((k) => k.setAttribute("opacity", 0));
  const per = Math.max(1, Math.ceil(kids.length / 40));
  for (let i = 0; i < kids.length; i += per) {
    kids.slice(i, i + per).forEach((k) => k.removeAttribute("opacity"));
    await api.wait(ms / 40);
  }
}

    };
    const answer = async (c, node) => {
      if (!quiz || quiz.done) return;
      quiz.done = true;
      round += 1;

      if (c === col) {
        right += 1;

      } else {

        node.querySelector("rect").setAttribute("stroke", "#d9822b");

      }

      if (my !== token || mode !== "quiz") return;

      else if (mode === "paint") panel(`${modes}<div class="ap-chips">${swatches(COLS, paint)}${ICON_BTNS}</div>`);

        right = 0;

      const tip = m === "paint" ? "Pick a colour below, then tap a circle to paint it. Each colour has its own sound!" : "Tap a circle to hear its colour. Tap the square around it to hear them all!";
      if (first) tellFacts(my, "kandinsky", tip);
      else say(tip);
    };
    $("[data-panel]").onclick = (event) => {
      if (my !== token) return;
      const m = event.target.closest("[data-mode]")?.dataset.mode;
      if (m) return setMode(m);
      const lv = event.target.closest("[data-lv]")?.dataset.lv;
      if (lv) {
        level = lv;
        press("lv", lv);
        return ask();

      const c = event.target.closest("[data-paint]")?.dataset.paint;

        ringNote(c, 0);

      if (what === "again") return playQuiz();
      if (what === "new") {

        return;
      }

    };
    newGrid();
    setMode("play", true);
  },

  // ----- Seurat -----
  a3() {
    const my = token;
    const DOTS = { red: "#e8262d", yellow: "#ffd800", blue: "#1e9be0", white: "#ffffff" };
    const TARGETS = [
      { name: "green tree", want: "green", need: ["blue", "yellow"], shape: [{ c: [500, 190, 115] }, { c: [415, 250, 85] }, { c: [585, 250, 85] }], deco: "tree" },
      { name: "orange sun", want: "orange", need: ["red", "yellow"], shape: [{ c: [500, 280, 165] }], deco: "sun" },
      { name: "purple grapes", want: "purple", need: ["red", "blue"], shape: [[430, 170], [500, 170], [570, 170], [465, 250], [535, 250], [500, 330]].map((c) => ({ c: [...c, 48] })), deco: "grapes" },
      { name: "light blue sky", want: "light blue", need: ["blue", "white"], shape: [{ r: [262, 42, 476, 230] }], deco: "hill" },
    ];
    let level = "easy";
    let round = 0;
    let color = "blue";
    let target;
    let dots = [];
    let art;
    let dotLayer;
    let busy = false;
    const inside = ([x, y]) => target.shape.some((s) => (s.c ? Math.hypot(x - s.c[0], y - s.c[1]) <= s.c[2] : x >= s.r[0] && x <= s.r[0] + s.r[2] && y >= s.r[1] && y <= s.r[1] + s.r[3]));
    const draw = () => {
      fresh();
      artistCard("seurat");
      const f = el("filter", { id: "ac-blur", x: "-10%", y: "-10%", width: "120%", height: "120%" }, el("defs", {}, view));
      el("feGaussianBlur", { stdDeviation: 0 }, f);
      art = el("g", {}, view);
      el("rect", { x: 250, y: 30, width: 500, height: 500, fill: "#fbf7ee", stroke: "#d9cdb5", "stroke-width": 3 }, art);
      const pre = el("g", {}, art);
      const dotIn = (x0, y0, w, h, cols, test = () => true) => {
        for (let y = y0; y < y0 + h; y += 15)
          for (let x = x0; x < x0 + w; x += 16) {
            const p = [x + rnd(-4, 4), y + rnd(-4, 4)];
            if (test(p)) el("circle", { cx: p[0], cy: p[1], r: 8, fill: pick(cols) }, pre);
          }
      };
      if (target.deco === "tree") dotIn(475, 300, 50, 225, ["#6d4c2f", "#2b1d12", "#8d5a34"]);
      if (target.deco === "grapes") dotIn(490, 90, 22, 40, ["#3a9b4a", "#2b1d12"]);
      if (target.deco === "hill") dotIn(258, 300, 486, 225, ["#3a9b4a", "#ffd800", "#1e6fc0"], ([x, y]) => y > 330 + 30 * Math.sin((x - 250) / 80));
      if (target.deco === "sun") dotIn(258, 455, 486, 70, ["#1e6fc0", "#6db8e8", "#ffffff"]);
      dotLayer = el("g", {}, art);
      for (const d of dots) el("circle", { cx: d.x, cy: d.y, r: 8, fill: DOTS[d.c] }, dotLayer);
      const guide = el("g", { class: "no-save ac-guide", "pointer-events": "none" }, view);
      for (const s of target.shape) {
        if (s.c) el("circle", { cx: s.c[0], cy: s.c[1], r: s.c[2], fill: "none", stroke: "#a8916f", "stroke-width": 4, "stroke-dasharray": "10 10" }, guide);
        else el("rect", { x: s.r[0], y: s.r[1], width: s.r[2], height: s.r[3], fill: "none", stroke: "#a8916f", "stroke-width": 4, "stroke-dasharray": "10 10" }, guide);
      }
      const side = el("g", { class: "no-save" }, view);
      text(side, 875, 70, /^[aeiou]/.test(target.name) ? "Make an" : "Make a", { "font-size": 26, fill: "#8a7764" });
      text(side, 875, 108, target.name, { "font-size": 26, fill: "#2b1d12" });
      if (level === "easy") {
        target.need.forEach((k, i) => {
          el("circle", { cx: 845 + i * 60, cy: 150, r: 20, fill: DOTS[k], stroke: "#c9b8a1", "stroke-width": 2 }, side);
        });
        text(side, 875, 157, "+", { "font-size": 30, fill: "#2b1d12" });
      }
      el("circle", { class: "ac-mix", cx: 875, cy: 300, r: 60, fill: "#f3ead6", stroke: "#d9cdb5", "stroke-width": 3 }, side);
      text(side, 875, 395, "From far", { "font-size": 22, fill: "#8a7764" });
      text(side, 875, 423, "away", { "font-size": 22, fill: "#8a7764" });
      $("[data-status]").textContent = `Picture ${round + 1} of 4`;
      focus([240, 15, 760, 530]);
      let last = null;
      const add = (p) => {
        if (busy || p[0] < 250 || p[0] > 750 || p[1] < 30 || p[1] > 530 || dots.length > 1500) return;
        if (last && Math.hypot(p[0] - last[0], p[1] - last[1]) < 14) return;
        last = p;
        for (let k = 0; k < 2; k++) {
          const d = { x: p[0] + rnd(-12, 12), y: p[1] + rnd(-12, 12), c: color };
          dots.push(d);
          el("circle", { cx: d.x, cy: d.y, r: 8, fill: DOTS[color] }, dotLayer);
        }
        if (dots.length % 6 === 0) MUSIC.play("xylophone", 84 + Object.keys(DOTS).indexOf(color) * 3, { gain: 0.15 });
      };
      ink(view, { begin: (p) => ((last = null), add(p)), move: add, end: () => (last = null) });
    };
    const avg = (list) => {
      const rgb = [0, 0, 0];
      for (const d of list) {
        const h = DOTS[d.c];
        for (let i = 0; i < 3; i++) rgb[i] += parseInt(h.slice(1 + i * 2, 3 + i * 2), 16);
      }
      return `rgb(${rgb.map((v) => Math.round(v / Math.max(1, list.length))).join(",")})`;
    };
    const stepBack = async () => {
      const blur = view.querySelector("#ac-blur feGaussianBlur");
      const guide = view.querySelector(".ac-guide");
      guide?.setAttribute("opacity", 0);
      art.setAttribute("filter", "url(#ac-blur)");
      const t0 = performance.now();
      while (my === token) {
        const t = Math.min(1, (performance.now() - t0) / 1400);
        art.setAttribute("transform", `translate(500 280) scale(${1 - 0.55 * t}) translate(-500 -280)`);
        blur.setAttribute("stdDeviation", 7 * t);
        if (t >= 1) break;
        await new Promise((r) => requestAnimationFrame(r));
      }
    };
    const stepIn = () => {
      art.removeAttribute("filter");
      art.removeAttribute("transform");
      view.querySelector(".ac-guide")?.setAttribute("opacity", 1);
    };
    const check = async () => {
      if (busy) return;
      const inDots = dots.filter((d) => inside([d.x, d.y]));
      const need = level === "easy" ? 25 : 40;
      if (inDots.length < need) {
        say(`Put more dots inside the dotted shape. You have ${inDots.length}. Try for ${need}!`);
        return;
      }
      busy = true;
      const n = inDots.length;
      const share = (k) => inDots.filter((d) => d.c === k).length / n;
      const ok = target.need.every((k) => share(k) >= 0.2) && Object.keys(DOTS).filter((k) => !target.need.includes(k)).reduce((s, k) => s + share(k), 0) <= 0.15;
      view.querySelector(".ac-mix")?.setAttribute("fill", avg(inDots));
      await stepBack();
      if (my !== token) return;
      if (ok) {
        MUSIC.chime();
        window.OC?.count("dot paintings");
        say(`${pick(PRAISE)} Up close it's ${target.need[0]} and ${target.need[1]} dots. From far away they mix into ${target.want}!`);
      } else {
        MUSIC.oops();
        const [a, b] = target.need;
        say(`${pick(KIND)} From far away it doesn't look ${target.want} yet. To make ${target.want}, use ${a} dots and ${b} dots, all mixed up.`);
      }
      await wait(3600);
      if (my !== token) return;
      stepIn();
      busy = false;
      if (!ok) return;
      round += 1;
      if (round >= 4) {
        confetti();
        shell.mark("a3", { done: true });
        say("🎉 You painted 4 pictures with dots, just like Seurat! Press 💾 to save this one.");
        round = 0;
        return;
      }
      load(false);
    };
    const load = (first) => {
      target = TARGETS[round];
      dots = [];
      busy = false;
      draw();
      const tip = level === "easy" ? `Make ${an(target.name)} with dots. Use ${target.need[0]} and ${target.need[1]} dots inside the dotted shape. Then press 🔭 Step back!` : `Make ${an(target.name)} with dots. Which two colours of dots will mix to make ${target.want}? Then press 🔭 Step back!`;
      if (first) tellFacts(my, "seurat", tip);
      else say(tip);
    };
    panel(`${chipRow([["easy", "🐣 Easy"], ["hard", "🦁 Hard"]], level, "lv", `<span class="ap-status" data-status></span>`)}<div class="ap-chips">${Object.entries(DOTS).map(([k, c]) => `<button type="button" class="ac-sw" data-dot="${k}" aria-pressed="${k === color}" aria-label="${k}" style="background:${c}"></button>`).join("")}<button type="button" class="ac-go" data-do="back">🔭 Step back</button><button type="button" data-do="clear" aria-label="Clear">🧽</button>${ICON_BTNS}</div>`);
    $("[data-panel]").onclick = (event) => {
      if (my !== token) return;
      const lv = event.target.closest("[data-lv]")?.dataset.lv;
      if (lv) {
        level = lv;
        press("lv", lv);
        round = 0;
        return load(false);
      }
      const d = event.target.closest("[data-dot]")?.dataset.dot;
      if (d) {
        color = d;
        press("dot", d);
        return;
      }
      const what = event.target.closest("[data-do]")?.dataset.do;
      if (what === "back") return check();
      if (what === "clear" && !busy) {
        dots = [];
        dotLayer.innerHTML = "";
        return;
      }
      common(what, "seurat", "Seurat dots", "a3");
    };
    load(true);
  },

  // ----- Matisse -----
  a4() {
    const my = token;
    const TYPES = Object.keys(SHAPES);
    let color = MATISSE[2];
    let level = "easy";
    let pieces = [];
    let sel = null;
    let goal = null;
    let met = false;
    let drag = null;
    let pieceLayer;
    let ring;
    const colName = { "#e8262d": "red", "#f7c90c": "yellow", "#1f4fbf": "blue", "#2e9e47": "green", "#f08a24": "orange", "#ec6fa4": "pink", "#1d1d1d": "black" };
    const newGoal = () => {
      met = false;
      if (level === "easy") {
        const t = pick(TYPES);
        goal = [{ type: t, n: pickInt(2, 5) }];
      } else {
        const [a, b] = shuffle(TYPES);
        const [ca, cb] = shuffle(MATISSE.slice(0, 6));
        goal = [{ type: a, color: ca, n: pickInt(1, 3) }, { type: b, color: cb, n: pickInt(2, 4) }];
      }
    };
    const count = (g) => pieces.filter((p) => p.type === g.type && (!g.color || p.color === g.color)).length;
    const goalWords = () => goal.map((g) => `${g.n} ${g.color ? colName[g.color] + " " : ""}${SHAPE_WORDS[g.type][g.n === 1 ? 0 : 1]}`).join(" and ");
    const status = () => {
      const s = $("[data-status]");
      if (s) s.textContent = goal.map((g) => `${SHAPE_WORDS[g.type][1]}: ${count(g)} of ${g.n}`).join(" · ");
    };
    const renderPiece = (p) => {
      p.node?.remove();
      p.node = el("path", { class: "ac-piece", d: shapePath(p.type), fill: p.color, transform: `translate(${p.x} ${p.y}) rotate(${p.rot}) scale(${p.s})`, style: "cursor:grab" }, pieceLayer);
      p.node._piece = p;
    };
    const showSel = () => {
      ring.innerHTML = "";
      if (sel) el("circle", { cx: sel.x, cy: sel.y, r: sel.s * 1.35, fill: "none", stroke: "#2b1d12", "stroke-width": 4, "stroke-dasharray": "10 8" }, ring);
    };
    const draw = () => {
      fresh();
      el("rect", { x: 0, y: 0, width: 196, height: H, fill: "#efe4d2", class: "no-save" }, view);
      text(view, 98, 38, "✂️ Drag", { "font-size": 24, fill: "#8a7764", class: "no-save" });
      TYPES.forEach((t, i) => {
        const g = el("g", { class: "ac-tray no-save", "data-type": t, style: "cursor:grab" }, view);
        el("rect", { x: 22, y: 58 + i * 124, width: 152, height: 112, rx: 18, fill: "#fff" }, g);
        el("path", { d: shapePath(t), fill: color, transform: `translate(98 ${114 + i * 124}) scale(${t === "leaf" ? 42 : 46})` }, g);
      });
      el("rect", { x: 206, y: 10, width: 784, height: 540, rx: 4, fill: "#fbf6ea", stroke: "#e2d6c4", "stroke-width": 2 }, view);
      pieceLayer = el("g", {}, view);
      ring = el("g", { class: "no-save", "pointer-events": "none" }, view);
      for (const p of pieces) renderPiece(p);
      showSel();
      let start = null;
      ink(view, {
        begin(pt, event) {
          if (my !== token) return;
          const node = event.target.closest(".ac-piece");
          const tray = event.target.closest(".ac-tray");
          if (node) {
            const p = node._piece;
            drag = { p, dx: p.x - pt[0], dy: p.y - pt[1], fresh: false };
            pieceLayer.appendChild(p.node);
          } else if (tray) {
            const p = { type: tray.dataset.type, color, x: pt[0], y: pt[1], rot: pickInt(-30, 30), s: tray.dataset.type === "leaf" ? 58 : 62 };
            pieces.push(p);
            renderPiece(p);
            drag = { p, dx: 0, dy: 0, fresh: true };
            MUSIC.play("xylophone", 84, { gain: 0.25 });
          } else {
            sel = null;
            showSel();
            drag = null;
          }
          start = pt;
        },
        move(pt) {
          if (!drag) return;
          drag.p.x = Math.max(0, Math.min(W, pt[0] + drag.dx));
          drag.p.y = Math.max(0, Math.min(H, pt[1] + drag.dy));
          drag.p.node.setAttribute("transform", `translate(${drag.p.x} ${drag.p.y}) rotate(${drag.p.rot}) scale(${drag.p.s})`);
          if (sel === drag.p) showSel();
        },
        end() {
          if (!drag) return;
          const p = drag.p;
          const moved = start && Math.hypot(p.x - drag.dx - start[0], p.y - drag.dy - start[1]);
          if (p.x < 206) {
            pieces = pieces.filter((q) => q !== p);
            p.node.remove();
            if (sel === p) sel = null;
            MUSIC.tick(false);
          } else if (!drag.fresh && moved < 6) {
            sel = sel === p ? null : p;
            if (sel) say("Now tap 🔄 Turn, or a colour to change it.", { voice: false });
          } else {
            if (drag.fresh) sel = null;
            MUSIC.play("xylophone", 88, { gain: 0.3 });
          }
          drag = null;
          showSel();
          status();
          check();
        },
      });
    };
    const check = () => {
      if (met || !goal.every((g) => count(g) === g.n)) return;
      met = true;
      MUSIC.chime();
      confetti();
      window.OC?.count("cut-out pictures");
      shell.mark("a4", { done: true });
      say(`${pick(PRAISE)} ${goalWords()}! A picture Matisse would love. Press 💾 to save, or 🎯 for a new goal.`);
    };
    const start = (first) => {
      newGoal();
      pieces = [];
      sel = null;
      draw();
      status();
      const tip = `Drag shapes onto the paper. Put ${goalWords()} on the paper!`;
      if (first) tellFacts(my, "matisse", tip);
      else say(tip);
    };
    panel(`${chipRow([["easy", "🐣 Easy"], ["hard", "🦁 Hard"]], level, "lv", `<span class="ap-status" data-status></span>`)}<div class="ap-chips">${swatches(MATISSE, color)}</div><div class="ap-chips"><button type="button" data-do="turn">🔄 Turn</button><button type="button" data-do="del" aria-label="Remove">🗑️</button><button type="button" data-do="goal">🎯 New goal</button>${ICON_BTNS}</div>`);
    $("[data-panel]").onclick = (event) => {
      if (my !== token) return;
      const lv = event.target.closest("[data-lv]")?.dataset.lv;
      if (lv) {
        level = lv;
        press("lv", lv);
        return start(false);
      }
      const c = event.target.closest("[data-paint]")?.dataset.paint;
      if (c) {
        color = c;
        press("paint", c);
        view.querySelectorAll(".ac-tray path").forEach((p) => p.setAttribute("fill", c));
        if (sel) {
          sel.color = c;
          renderPiece(sel);
          status();
          check();
        }
        return;
      }
      const what = event.target.closest("[data-do]")?.dataset.do;
      if (what === "turn") {
        if (!sel) return say("Tap a shape on the paper first, then press Turn.");
        sel.rot = (sel.rot + 30) % 360;
        renderPiece(sel);
        MUSIC.play("xylophone", 91, { gain: 0.3 });
        return;
      }
      if (what === "del") {
        if (!sel) return say("Tap a shape on the paper first. Or drag it back to the left.");
        pieces = pieces.filter((q) => q !== sel);
        sel.node.remove();
        sel = null;
        showSel();
        status();
        return check();
      }
      if (what === "goal") return start(false);
      common(what, "matisse", "Matisse cut-outs", "a4");
    };
    start(true);
  },

  // ----- Van Gogh -----
  a5() {
    const my = token;
    let tool = "swirl";
    let level = "easy";
    let strokesN = 0;
    let stars = 0;
    let met = false;
    const groups = [];
    const need = () => (level === "easy" ? { stars: 2, strokes: 70 } : { stars: 4, strokes: 160 });
    fresh("#1d2f6f");
    const base = el("g", {}, view);
    el("rect", { x: 0, y: 0, width: W, height: H, fill: "#1d2f6f" }, base);
    el("path", { d: "M0 420 Q300 350 600 410 T1000 390 L1000 560 L0 560 Z", fill: "#22385a" }, base);
    for (let i = 0; i < 9; i++) {
      const hx = 360 + i * 66;
      const hy = 450 + (i % 3) * 22;
      el("rect", { x: hx, y: hy, width: 52, height: 40, fill: "#2b3b52" }, base);
      el("path", { d: `M${hx - 4} ${hy} L${hx + 26} ${hy - 20} L${hx + 56} ${hy} Z`, fill: "#1a2638" }, base);
      el("rect", { x: hx + 18, y: hy + 12, width: 14, height: 14, fill: "#f7d64a" }, base);
    }
    el("path", { d: "M90 560 C70 400 140 250 160 90 C190 260 250 400 230 560 Z", fill: "#16301f" }, base);
    const paint = el("g", {}, view);
    const goalG = el("g", { class: "no-save", "pointer-events": "none" }, view);
    const status = () => {
      const n = need();
      const s = $("[data-status]");
      if (s) s.textContent = `⭐ ${Math.min(stars, n.stars)} of ${n.stars} · 🌀 ${Math.min(100, Math.round((strokesN / n.strokes) * 100))}%`;
      goalG.innerHTML = "";
    };
    let cur = null;
    let last = null;
    const SETS = { swirl: NIGHT, cypress: CYPRESS };
    ink(view, {
      begin(p) {
        if (my !== token) return;
        cur = el("g", {}, paint);
        groups.push(cur);
        if (tool === "star") {
          starBurst(cur, p[0], p[1], 60, 1);
          stars += 1;
          MUSIC.play("harp", [72, 76, 79, 84][stars % 4], { gain: 0.5 });
          cur = null;
          status();
          check();
          return;
        }
        last = p;
      },
      move(p) {
        if (!cur || !last) return;
        const d = Math.hypot(p[0] - last[0], p[1] - last[1]);
        if (d < 10) return;
        const ang = Math.atan2(p[1] - last[1], p[0] - last[0]);
        const nx = -Math.sin(ang);
        const ny = Math.cos(ang);
        for (const k of [-1, 0, 1]) {
          const o = k * 11 + rnd(-3, 3);
          swirlStroke(cur, p[0] + nx * o, p[1] + ny * o, ang + rnd(-0.25, 0.25), 30, tool === "cypress" ? 9 : 8, pick(SETS[tool]), rnd(0.3, 0.9));
        }
        strokesN += 1;
        last = p;
        if (strokesN % 12 === 0) MUSIC.play("cello", pick([48, 55, 60]), { gain: 0.18, length: 0.6 });
        if (strokesN % 8 === 0) status();
      },
      end() {
        cur = null;
        last = null;
        status();
        check();
      },
    });
    const check = () => {
      const n = need();
      if (met || stars < n.stars || strokesN < n.strokes) return;
      met = true;
      MUSIC.chime();
      confetti();
      window.OC?.count("starry nights");
      shell.mark("a5", { done: true });
      say(`${pick(PRAISE)} A swirly, starry night, like Van Gogh! Press 💾 to save it.`);
    };
    const tipText = () => (level === "easy" ? "Pick 🌀 Swirl and paint the sky with your finger. Then tap ⭐ Star and add 2 stars!" : "Fill the whole sky with swirls that curl round and round, and add 4 glowing stars. Try 🌳 for the tall cypress tree!");
    panel(`${chipRow([["easy", "🐣 Easy"], ["hard", "🦁 Hard"]], level, "lv", `<span class="ap-status" data-status></span>`)}${chipRow([["swirl", "🌀 Swirl"], ["star", "⭐ Star"], ["cypress", "🌳 Tree"]], tool, "tool")}<div class="ap-chips"><button type="button" data-do="undo">↩️ Undo</button><button type="button" data-do="clear" aria-label="Clear">🧽</button>${ICON_BTNS}</div>`);
    $("[data-panel]").onclick = (event) => {
      if (my !== token) return;
      const lv = event.target.closest("[data-lv]")?.dataset.lv;
      if (lv) {
        level = lv;
        met = false;
        press("lv", lv);
        status();
        check();
        return say(tipText());
      }
      const t = event.target.closest("[data-tool]")?.dataset.tool;
      if (t) {
        tool = t;
        press("tool", t);
        return say({ swirl: "Swirl: drag your finger and the brush strokes follow it.", star: "Star: tap the sky to add a glowing star.", cypress: "Tree: paint the tall, dark cypress tree with green strokes, going up like a flame." }[t]);
      }
      const what = event.target.closest("[data-do]")?.dataset.do;
      if (what === "undo") {
        const g = groups.pop();
        if (g) {
          if (g.querySelector("circle")) stars = Math.max(0, stars - 1);
          else strokesN = Math.max(0, strokesN - g.childNodes.length / 3);
          g.remove();
          status();
        }
        return;
      }
      if (what === "clear") {
        paint.innerHTML = "";
        groups.length = 0;
        stars = 0;
        strokesN = 0;
        met = false;
        return status();
      }
      common(what, "vangogh", "Van Gogh night", "a5");
    };
    status();
    tellFacts(my, "vangogh", tipText());
  },

  // ----- Kusama -----
  a6() {
    const my = token;
    let level = "easy";
    let round = 0;
    let goal = 0;
    let big = true;
    let busy = false;
    let dotsG;
    const n = () => dotsG.querySelectorAll(".ac-kdot").length;
    const draw = () => {
      fresh("#d7262e");
      const bg = el("g", {}, view);
      for (let r = 0; r < 9; r++) for (let c = 0; c < 15; c++) el("circle", { cx: c * 72 + (r % 2) * 36, cy: r * 70 + 10, r: 11, fill: "#fff" }, bg);
      el("rect", { x: 18, y: 18, width: 194, height: 296, rx: 22, fill: "#fff", opacity: 0.9, class: "no-save" }, view);
      artistCard("kusama");
      pumpkin(view, 600, 330, 300, 200, false);
      dotsG = el("g", {}, view);
      const goalG = el("g", { class: "no-save", "pointer-events": "none" }, view);
      el("rect", { x: 860, y: 20, width: 125, height: 120, rx: 18, fill: "#fff" }, goalG);
      text(goalG, 922, 62, "Goal", { "font-size": 24, fill: "#8a7764" });
      text(goalG, 922, 115, String(goal), { "font-size": 50, fill: "#2b1d12" });
      const shown = el("g", { class: "no-save ac-count", "pointer-events": "none" }, view);
      if (level === "easy") {
        el("rect", { x: 860, y: 155, width: 125, height: 120, rx: 18, fill: "#fff" }, shown);
        text(shown, 922, 197, "Dots", { "font-size": 24, fill: "#8a7764" });
        text(shown, 922, 250, "0", { "font-size": 50, fill: "#1f8a4c", class: "ac-n" });
      }
      focus([290, 12, 705, 536]);
      view.addEventListener("pointerdown", (event) => {
        if (my !== token || busy) return;
        window.OC?.touch();
        const dot = event.target.closest(".ac-kdot");
        if (dot) {
          dot.remove();
          MUSIC.play("xylophone", 76, { gain: 0.25 });
          update(false);
          return;
        }
        if (!event.target.closest(".ac-lobe")) return say("Put your dots on the yellow pumpkin!", { voice: n() === 0 });
        const [x, y] = svgPoint(event);
        el("circle", { class: "ac-kdot", cx: x, cy: y, r: big ? 26 : 14, fill: "#1d1d1d", style: "cursor:pointer" }, dotsG);
        update(true);
      });
    };
    const update = (added) => {
      const k = n();
      const nn = view.querySelector(".ac-n");
      if (nn) nn.textContent = String(k);
      if (added) MUSIC.play("xylophone", 72 + Math.min(24, k * 2), { gain: 0.35 });
      if (level === "easy") {
        if (added) VOICE.speak(String(k));
        if (k === goal) win();
        else if (k > goal) say(`That's ${k}, too many! Tap a dot to take it away.`);
      }
    };
    const win = async () => {
      busy = true;
      MUSIC.chime();
      window.OC?.count("polka dot pumpkins");
      say(`${pick(PRAISE)} ${goal} polka dots, just like Yayoi Kusama!`);
      round += 1;
      $("[data-status]").textContent = `Pumpkin ${Math.min(round + 1, 6)} of 6`;
      await wait(2600);
      if (my !== token) return;
      if (round >= 6) {
        confetti();
        shell.mark("a6", { done: true });
        say("🎉 6 dotty pumpkins! You count like a real artist. Here comes a new pumpkin!");
        round = 0;
        await wait(3600);
        if (my !== token) return;
      }
      next(false);
    };
    const next = (first) => {
      goal = level === "easy" ? pickInt(3, 10) : pickInt(12, 20);
      busy = false;
      draw();
      $("[data-status]").textContent = `Pumpkin ${round + 1} of 6`;
      const tip = level === "easy" ? `Tap the pumpkin to put ${goal} polka dots on it. Count with me! Press 💾 any time to save.` : `Put exactly ${goal} polka dots on the pumpkin. Count them yourself, then press ✓ Done!`;
      if (first) tellFacts(my, "kusama", tip);
      else say(tip);
    };
    panel(`${chipRow([["easy", "🐣 Easy"], ["hard", "🦁 Hard"]], level, "lv", `<span class="ap-status" data-status></span>`)}<div class="ap-chips"><button type="button" data-size="big" aria-pressed="true">⚫ Big</button><button type="button" data-size="small" aria-pressed="false">• Small</button><button type="button" class="ac-go" data-do="done">✓ Done</button>${ICON_BTNS}</div>`);
    $("[data-panel]").onclick = (event) => {
      if (my !== token) return;
      const lv = event.target.closest("[data-lv]")?.dataset.lv;
      if (lv) {
        level = lv;
        round = 0;
        press("lv", lv);
        return next(false);
      }
      const s = event.target.closest("[data-size]")?.dataset.size;
      if (s) {
        big = s === "big";
        press("size", s);
        return;
      }
      const what = event.target.closest("[data-do]")?.dataset.do;
      if (what === "done") {
        if (busy) return;
        const k = n();
        if (k === goal) return win();
        MUSIC.oops();
        return say(k < goal ? `Not yet: there are ${k} dots. You need ${goal - k} more to make ${goal}.` : `There are ${k} dots. That's ${k - goal} too many. Tap dots to take them away.`);
      }
      common(what, "kusama", "Kusama pumpkin", "a6");
    };
    next(true);
  },

  // ----- Who made this? -----
  a7() {
    const my = token;
    let level = "easy";
    let round = 0;
    let right = 0;
    let q = null;
    const ask = () => {
      const pool = level === "easy" ? ORDER.slice(0, 5) : ORDER;
      const ans = pick(pool);
      const n = level === "easy" ? 2 : 4;
      const opts = shuffle([ans, ...shuffle(pool.filter((k) => k !== ans)).slice(0, n - 1)]);
      q = { ans, opts, done: false };
      fresh();
      el("rect", { x: 28, y: 28, width: 504, height: 504, rx: 8, fill: "#8d5a34" }, view);
      el("rect", { x: 40, y: 40, width: 480, height: 480, fill: "#fff" }, view);
      GEN[ans](view, 46, 46, 468, 468);
      opts.forEach((k, i) => {
        const [x, y, w, h] = n === 2 ? [570, 30 + i * 260, 400, 240] : [570 + (i % 2) * 210, 30 + Math.floor(i / 2) * 260, 195, 240];
        const g = el("g", { class: "ac-opt", "data-k": k, style: "cursor:pointer" }, view);
        el("rect", { x, y, width: w, height: h, rx: 24, fill: "#fff", stroke: "#e2d6c4", "stroke-width": 4 }, g);
        if (n === 2) {
          badge(g, x + 105, y + h / 2, 78, k);
          const parts = ARTISTS[k].name.split(" ");
          text(g, x + 290, y + h / 2 - 22, parts[0], { "font-size": 28, fill: "#2b1d12" });
          text(g, x + 290, y + h / 2 + 16, parts.slice(1).join(" "), { "font-size": 32, fill: "#2b1d12", "font-weight": 900 });
          text(g, x + 290, y + h / 2 + 58, ARTISTS[k].flag, { "font-size": 32 });
        } else {
          badge(g, x + w / 2, y + 92, 66, k);
          text(g, x + w / 2, y + 200, lastName(k), { "font-size": 28, fill: "#2b1d12" });
          text(g, x + w / 2, y + 232, ARTISTS[k].flag, { "font-size": 24 });
        }
      });
      view.addEventListener("pointerdown", (event) => {
        const o = event.target.closest(".ac-opt");
        if (o && my === token) answer(o.dataset.k, o);
      });
      $("[data-status]").textContent = `Picture ${round + 1} of 10`;
      say("Look at this picture. Who made art like this? Tap the artist!");
    };
    const answer = async (k, node) => {
      if (!q || q.done) return;
      q.done = true;
      round += 1;
      window.OC?.touch();
      if (k === q.ans) {
        right += 1;
        MUSIC.chime();
        node.querySelector("rect").setAttribute("stroke", "#22a05a");
        say(`${pick(PRAISE)} ${ARTISTS[q.ans].why}`);
      } else {
        MUSIC.oops();
        node.querySelector("rect").setAttribute("stroke", "#d9822b");
        view.querySelector(`.ac-opt[data-k="${q.ans}"] rect`)?.setAttribute("stroke", "#22a05a");
        say(`${pick(KIND)} Not ${lastName(k)} this time. ${ARTISTS[q.ans].why}`);
      }
      window.OC?.count("artists spotted");
      await wait(3400);
      if (my !== token) return;
      if (round >= 10) {
        if (right >= 8) {
          confetti();
          shell.mark("a7", { done: true });
        }
        say(`${right} out of 10! ${right >= 8 ? "🎉 You know your artists!" : "Let's look again. Each artist has their own style."}`);
        round = 0;
        right = 0;
        await wait(3400);
        if (my !== token) return;
      }
      ask();
    };
    panel(`${chipRow([["easy", "🐣 Easy"], ["hard", "🦁 Hard"]], level, "lv", `<span class="ap-status" data-status></span>`)}`);
    $("[data-panel]").onclick = (event) => {
      if (my !== token) return;
      const lv = event.target.closest("[data-lv]")?.dataset.lv;
      if (lv) {
        level = lv;
        round = 0;
        right = 0;
        press("lv", lv);
        ask();
      }
    };
    ask();
  },
};

const style = document.createElement("style");
style.textContent = `.ac-ink{touch-action:none}
.ac-sw{width:44px;min-width:44px;padding:0 !important;border:2px solid rgba(0,0,0,.1) !important;box-shadow:0 3px 0 rgba(0,0,0,.22) !important}
.ac-sw[aria-pressed="true"],.ac-tool[aria-pressed="true"]{outline:4px solid #2b1d12;outline-offset:2px}

.ac-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;width:100%}

@media (max-height:460px),(max-width:420px) and (max-height:720px){.ac-sw{width:36px;min-width:36px}}`;
document.head.appendChild(style);

const shell = SHELL({
  units: UNITS,
  how: {
    a0: { icon: "👀", title: "See it", steps: ["Watch the pictures.", "Press Next ▶ to go on.", "Press Let's play when you are ready."] },
    a1: { icon: "🟥", title: "Mondrian blocks", steps: ["Pick red, yellow or blue below.", "Tap a block to paint it.", "On Hard, tap a Line button, then tap a block to split it."] },
    a2: { icon: "🎵", title: "Kandinsky circles", steps: ["Tap a circle to hear its colour.", "Paint: pick a colour, then tap a circle.", "Which colour?: listen, then tap the matching colour."] },
    a3: { icon: "🔵", title: "Seurat dots", steps: ["Pick a dot colour below.", "Drag your finger to dot inside the dotted shape.", "Press 🔭 Step back to see the dots mix!"] },
    a4: { icon: "✂️", title: "Matisse cut-outs", steps: ["Drag a shape from the left onto the paper.", "Tap a shape, then press 🔄 Turn or a colour.", "Make the goal Ollie asks for."] },
    a5: { icon: "🌌", title: "Van Gogh swirls", steps: ["Pick 🌀 Swirl and paint the sky with your finger.", "Pick ⭐ Star and tap to add stars.", "Fill the bar, then press 💾 Save."] },
    a6: { icon: "🎃", title: "Kusama polka dots", steps: ["Tap the yellow pumpkin to add a dot.", "Tap a dot to take it away.", "Put on exactly the number of dots in the Goal."] },
    a7: { icon: "🖼️", title: "Who made this?", steps: ["Look at the picture.", "Think about its lines, dots, shapes and colours.", "Tap the artist who painted like this."] },
  },
  start: "a0",
  onStop() {
    token += 1;
    $("[data-panel]").onclick = null;
  },
  subject: "Arts",
  activity: "Famous Artists",
  onUnit(id) {
    token += 1;
    VOICE.hush();
    units[id]();
  },
});
MUSIC.preload("xylophone", [72, 76, 79, 84, 86, 88, 91, 96]);
MUSIC.preload("trumpet", [72, 76, 79]);

MUSIC.preload("piano", [64, 67]);
