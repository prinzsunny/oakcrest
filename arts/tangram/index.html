<script>const { $, el, svg: makeSvg, text, panel, say, pick, wait, confetti, PRAISE, explain, everyday, emoji } = KIT;

  { id: "g2", label: "2. Cat, fish and rocket" },

const TYPES = {
  L: { name: "big triangle", color: "#ef6c4a" },
  M: { name: "middle triangle", color: "#f5b82e" },
  S: { name: "small triangle", color: "#4caf7a" },
  Q: { name: "square", color: "#4a90d9" },
  P: { name: "parallelogram", color: "#9c6ade" },
};
const PIECES = [
  ["L", [[0, 0], [4, 0], [2, 2]]],
  ["L", [[0, 0], [2, 2], [0, 4]]],
  ["M", [[2, 4], [4, 4], [4, 2]]],
  ["S", [[4, 0], [4, 2], [3, 1]]],
  ["Q", [[2, 2], [3, 1], [4, 2], [3, 3]]],
  ["S", [[2, 2], [3, 3], [1, 3]]],
  ["P", [[0, 4], [1, 3], [3, 3], [2, 4]]],
];

  { name: "Square", icon: "🟦", slots: PIECES },
  {
    name: "House",

    slots: [
      ["L", [[0, 2], [4, 2], [2, 0]]],

      ["M", [[0, 2], [2, 2], [0, 4]]],
      ["S", [[2, 2], [4, 2], [3, 3]]],
      ["S", [[4, 2], [4, 4], [3, 3]]],
      ["Q", [[2.5, 0.5], [3.5, -0.5], [4.5, 0.5], [3.5, 1.5]]],
      ["P", [[1, 4], [3, 4], [4, 5], [2, 5]]],
    ],
  },
  {
    name: "Big triangle",
    icon: "🔺",
    slots: [
      ["M", [[2, 0], [4, 0], [4, 2]]],
      ["S", [[4, 4], [4, 2], [3, 3]]],
      ["Q", [[2, 2], [3, 3], [4, 2], [3, 1]]],
      ["S", [[2, 2], [3, 1], [1, 1]]],
      ["P", [[0, 0], [1, 1], [3, 1], [2, 0]]],
      ["L", [[4, 0], [8, 0], [6, 2]]],
      ["L", [[4, 0], [6, 2], [4, 4]]],
    ],
  },
  {
    name: "Cat",
    icon: "🐱",
    set: "g2",
    slots: [
      ["Q", [[2, 0], [3, 1], [2, 2], [1, 1]]],
      ["S", [[1, -1], [2, 0], [1, 1]]],
      ["S", [[3, -1], [3, 1], [2, 0]]],
      ["L", [[2, 2], [2, 6], [4, 4]]],
      ["L", [[2, 6], [6, 6], [4, 4]]],
      ["M", [[0, 6], [2, 6], [2, 4]]],
      ["P", [[6, 6], [8, 6], [9, 5], [7, 5]]],
    ],
  },
  {
    name: "Fish",
    icon: "🐟",
    set: "g2",
    slots: [
      ["L", [[0, 2], [2, 0], [4, 2]]],
      ["L", [[0, 2], [4, 2], [2, 4]]],
      ["M", [[4, 2], [6, 0], [6, 2]]],
      ["S", [[4, 2], [6, 2], [5, 3]]],
      ["S", [[5, 3], [6, 2], [6, 4]]],
      ["Q", [[2, 0], [3, -1], [4, 0], [3, 1]]],

    name: "Rocket",

    set: "g2",
    slots: [
      ["M", [[0, 1.4142], [2.8284, 1.4142], [1.4142, 0]]],
      ["L", [[0, 1.4142], [2.8284, 1.4142], [0, 4.2426]]],
      ["L", [[2.8284, 1.4142], [2.8284, 4.2426], [0, 4.2426]]],
      ["S", [[0, 2.8284], [0, 4.2426], [-1.4142, 4.2426]]],
      ["S", [[2.8284, 2.8284], [2.8284, 4.2426], [4.2426, 4.2426]]],
      ["Q", [[0.7071, 4.2426], [2.1213, 4.2426], [2.1213, 5.6569], [0.7071, 5.6569]]],
      ["P", [[0.7071, 5.6569], [2.1213, 5.6569], [3.5355, 7.0711], [2.1213, 7.0711]]],
    ],

const centroid = (pts) => [pts.reduce((s, p) => s + p[0], 0) / pts.length, pts.reduce((s, p) => s + p[1], 0) / pts.length];
const rotate = ([x, y], k) => {
  const a = (k * Math.PI) / 4;
  return [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)];
};
const shapeOf = (piece) => {
  const c = centroid(piece.base);
  return piece.base.map(([x, y]) => {
    let p = [x - c[0], y - c[1]];
    if (piece.flip) p = [-p[0], p[1]];
    p = rotate(p, piece.rot);
    return [p[0] + piece.x, p[1] + piece.y];
  });
};
const samePoly = (a, b, tol = 0.2) => a.length === b.length && a.every((p) => b.some((q) => Math.hypot(p[0] - q[0], p[1] - q[1]) < tol));

// Where each of the 7 pieces sits (centre x, y, turns of 45°, flipped) to make a puzzle picture.
function layoutOf(puzzle) {
  const used = new Set();
  const out = [];
  for (const [type, pts] of puzzle.slots) {
    const c = centroid(pts);
    let found = null;
    PIECES.forEach(([t, base], i) => {
      if (found || t !== type || used.has(i)) return;
      for (let rot = 0; rot < 8 && !found; rot++)
        for (const flip of [false, true]) if (!found && samePoly(shapeOf({ base, rot, flip, x: c[0], y: c[1] }), pts)) found = { i, x: c[0], y: c[1], rot, flip };
    });
    used.add(found.i);
    out[found.i] = found;
  }
  return out;
}

// A tangram piece drawn around its own centre, moved with translate / rotate / scale.
function seePiece(parent, i) {
  const [type, base] = PIECES[i];
  const c = centroid(base);
  const g = el("g", {}, parent);
  el("path", { d: "M" + base.map(([x, y]) => `${x - c[0]} ${y - c[1]}`).join("L") + "Z", fill: TYPES[type].color, stroke: "#fff", "stroke-width": 3, "vector-effect": "non-scaling-stroke", "stroke-linejoin": "round" }, g);
  const state = { x: 0, y: 0, rot: 0, sx: 1, u: 60 };
  const put = (st) => {
    Object.assign(state, st);
    g.setAttribute("transform", `translate(${state.x} ${state.y}) rotate(${state.rot * 45}) scale(${state.u * state.sx} ${state.u})`);
  };
  return { g, state, put, type };
}
// Pixel place of a layout so the picture fits a box.
function fitLayout(puzzle, box = { x: 60, y: 40, w: 880, h: 470 }, maxU = 80) {
  const xs = puzzle.slots.flatMap(([, p]) => p.map((q) => q[0]));
  const ys = puzzle.slots.flatMap(([, p]) => p.map((q) => q[1]));
  const minX = Math.min(...xs);
  const minY = Math.min(...ys);
  const u = Math.min(box.w / (Math.max(...xs) - minX), box.h / (Math.max(...ys) - minY), maxU);
  const ox = box.x + (box.w - (Math.max(...xs) - minX) * u) / 2 - minX * u;
  const oy = box.y + (box.h - (Math.max(...ys) - minY) * u) / 2 - minY * u;
  return layoutOf(puzzle).map((p) => ({ x: ox + p.x * u, y: oy + p.y * u, rot: p.rot, sx: p.flip ? -1 : 1, u }));
}
async function glide(api, piece, to, ms = 1200) {
  const from = { ...piece.state };
  let dr = to.rot - from.rot;
  dr = ((((dr + 4) % 8) + 8) % 8) - 4;
  await api.tween(ms, (t) => piece.put({ x: from.x + (to.x - from.x) * t, y: from.y + (to.y - from.y) * t, rot: from.rot + dr * t, sx: from.sx + (to.sx - from.sx) * t, u: from.u + (to.u - from.u) * t }));
  piece.put({ ...to, rot: ((to.rot % 8) + 8) % 8 });
}

const units = {
  g0() {
    const my = token;
    const label = (parent, x, y, str, size = 32, fill = "#2b1d12") => text(parent, x, y, str, { "font-size": size, fill, "font-weight": 900 });
    const scenes = [
      {
        say: "Why do we play tangrams? Fitting shapes together trains your shape brain! Tangram is an old puzzle from China.",
        draw: everyday([["🧩", "Puzzles train shape thinking"], ["🏮", "An old puzzle from China"], ["🧳", "Packing a suitcase"], ["🧱", "Building with blocks"]]),
      },
      {
        say: "A tangram is a square cut into <b>7 pieces</b>. Watch them slide apart. Let's count them!",
        async draw(v, api) {
          const home = fitLayout(PUZZLES[0], { x: 350, y: 110, w: 300, h: 300 });
          const pieces = PIECES.map((_, i) => seePiece(v, i));
          pieces.forEach((p, i) => p.put(home[i]));
          await api.wait(1400);
          const cx = 500;
          const cy = 260;
          await Promise.all(pieces.map((p, i) => glide(api, p, { ...home[i], x: cx + (home[i].x - cx) * 2.1, y: cy + (home[i].y - cy) * 1.55 }, 1500)));
          for (const [i, p] of pieces.entries()) {
            await api.wait(450);
            const t = label(v, p.state.x, p.state.y + 12, String(i + 1), 36, "#fff");
            t.setAttribute("stroke", "#2b1d12");
            t.setAttribute("stroke-width", 5);
            t.setAttribute("paint-order", "stroke");
            MUSIC.play("xylophone", [84, 86, 88, 89, 91, 93, 95][i], { gain: 0.35 });
          }
          label(v, 500, 545, "7 pieces!", 34, "#7a4520");
        },
      },
      {
        say: "Two <b>small triangles</b> fit together to make a <b>square</b>. Move them again, and they make a <b>middle triangle</b>!",
        async draw(v, api) {
          const u = 100;
          const ox = 250;
          const oy = 130;
          const at = (x, y, rot) => ({ x: ox + x * u, y: oy + y * u, rot, sx: 1, u });
          const a = seePiece(v, 3);
          const b = seePiece(v, 5);
          // Piece 3 points left at rot 0; piece 5 points up at rot 0 (each turn of 2 is a quarter turn).
          a.put(at(-1.2, 1, 0));
          b.put(at(3.2, 1, 2));
          await api.wait(900);
          await Promise.all([glide(api, a, at(2 / 3, 1, 0)), glide(api, b, at(4 / 3, 1, 2))]);
          MUSIC.play("xylophone", 88, { gain: 0.4 });
          const eq = label(v, 600, 245, "=", 70, "#7a4520");
          const q = seePiece(v, 4);
          q.put({ x: 760, y: oy + u, rot: 0, sx: 1, u });
          label(v, 760, 360, "square", 30, "#7a4520");
          await api.wait(2400);
          eq.remove();
          v.querySelectorAll("text").forEach((t) => t.remove());
          q.g.remove();
          await Promise.all([glide(api, a, at(5 / 3, 1, 0)), glide(api, b, at(1, 5 / 3, 0))]);
          MUSIC.play("xylophone", 91, { gain: 0.4 });
          label(v, 600, 245, "=", 70, "#7a4520");
          const m = seePiece(v, 2);
          m.put({ x: 820, y: oy + (4 / 3) * u, rot: 0, sx: 1, u });
          label(v, 780, 360, "middle triangle", 30, "#7a4520");
        },
      },
      {
        say: "Tap a piece to <b>turn</b> it. Each tap turns it a little. Keep turning until it fits the shadow!",
        async draw(v, api) {
          const u = 95;
          const target = { x: 700, y: 250, rot: 3, sx: 1, u };
          const c = centroid(PIECES[2][1]);
          const sh = el("g", { transform: `translate(${target.x} ${target.y}) rotate(${target.rot * 45}) scale(${u})` }, v);
          el("path", { d: "M" + PIECES[2][1].map(([x, y]) => `${x - c[0]} ${y - c[1]}`).join("L") + "Z", fill: "#3b2a1d", opacity: 0.85 }, sh);
          const p = seePiece(v, 2);
          p.put({ x: 280, y: 250, rot: 0, sx: 1, u });
          const tag = label(v, 280, 470, "", 34, "#7a4520");
          await api.wait(1000);
          for (let k = 1; k <= 3; k++) {
            const hand = emoji(v, 280, 90, "👆", 60);
            MUSIC.play("woodblock", 79, { gain: 0.5 });
            await glide(api, p, { ...p.state, rot: k }, 700);
            tag.textContent = `turn ${k}`;
            hand.remove();
            await api.wait(600);

          await glide(api, p, target, 1300);

          tag.textContent = "it fits!";
        },
      },
      {
        say: "The purple <b>parallelogram</b> is special. Sometimes turning is not enough, so you <b>flip</b> it over, like turning a pancake!",
        async draw(v, api) {
          const u = 95;

          el("path", { d: "M" + PIECES[6][1].map(([x, y]) => `${x - c[0]} ${y - c[1]}`).join("L") + "Z", fill: "#3b2a1d", opacity: 0.85 }, sh);
          const p = seePiece(v, 6);

          await glide(api, p, target, 1100);

      {
        say: "The same 7 pieces can make lots of pictures: a square, a house, a cat and a rocket!",
        async draw(v, api) {

          pieces.forEach((p, i) => p.put(first[i]));
          const tag = label(v, 500, 540, `${order[0].icon} ${order[0].name}`, 36, "#7a4520");
          for (const pz of order.slice(1)) {
            await api.wait(1800);
            const lay = fitLayout(pz, box);
            await Promise.all(pieces.map((p, i) => glide(api, p, lay[i], 1500)));
            MUSIC.play("xylophone", 84 + order.indexOf(pz) * 4, { gain: 0.4 });

    explain(scenes, {

function tangramUnit(id, puzzles) {
  {
    const my = token;
    let index = Math.min(shell.progress()[id]?.next || 0, puzzles.length - 1);
    let pieces = [];
    let slots = [];
    let easy = true;
    let view;
    let U = 60;
    let ox = 40;
    let oy = 40;
    let dragging = null;
    let moved = false;
    let selected = null;
    panel(`<div class="ap-chips" data-puzzles>${puzzles.map((p, i) => `<button type="button" data-p="${i}">${p.icon} ${p.name}</button>`).join("")}</div><p class="ap-status" data-status></p><div class="ap-buttons"><button type="button" data-do="flip">↔️ Flip</button><button type="button" data-do="hint">💡 Hint</button><button type="button" data-do="mode">👀 Hard mode</button><button type="button" data-do="reset">↺ Start again</button></div>`);
    const toPx = ([x, y]) => [ox + x * U, oy + y * U];
    const fromPx = ([x, y]) => [(x - ox) / U, (y - oy) / U];
    const setup = () => {
      const puzzle = puzzles[index];
      const xs = puzzle.slots.flatMap(([, pts]) => pts.map((p) => p[0]));
      const ys = puzzle.slots.flatMap(([, pts]) => pts.map((p) => p[1]));
      const minX = Math.min(...xs);
      const maxX = Math.max(...xs);
      const minY = Math.min(...ys);
      const maxY = Math.max(...ys);
      const bbox = (pts) => {
        const px = pts.map((q) => q[0]);
        const py = pts.map((q) => q[1]);
        return { x0: Math.min(...px), y0: Math.min(...py), w: Math.max(...px) - Math.min(...px), h: Math.max(...py) - Math.min(...py) };
      };
      const order = PIECES.map(([type, base], i) => ({ i, type, base, box: bbox(base) })).sort((a, b) => b.box.h - a.box.h || b.box.w - a.box.w);
      const pack = (u) => {
        const width = 320 / u;
        const gap = 14 / u;
        let x = 0;
        let y = 0;
        let rowH = 0;
        const spots = {};
        for (const item of order) {
          if (x > 0 && x + item.box.w > width) {
            x = 0;
            y += rowH + gap;
            rowH = 0;
          }
          spots[item.i] = { x, y };
          x += item.box.w + gap;
          rowH = Math.max(rowH, item.box.h);
        }
        return { spots, height: (y + rowH) * u };
      };
      U = Math.min(560 / (maxX - minX), 470 / (maxY - minY), 95);
      while (pack(U).height > 470 && U > 30) U -= 2;
      ox = 40 + (560 - (maxX - minX) * U) / 2 - minX * U;
      oy = 45 + (470 - (maxY - minY) * U) / 2 - minY * U;
      slots = puzzle.slots.map(([type, pts]) => ({ type, pts, c: centroid(pts), filled: false }));
      const { spots, height } = pack(U);
      const trayTop = 40 + (480 - height) / 2;
      pieces = PIECES.map(([type, base], i) => {
        const box = bbox(base);
        const c = centroid(base);
        const px = 650 + (spots[i].x + (c[0] - box.x0)) * U;
        const py = trayTop + (spots[i].y + (c[1] - box.y0)) * U;
        const [x, y] = fromPx([px, py]);
        return { id: i, type, base, rot: 0, flip: false, x, y, placed: false };
      });
      selected = null;
      draw();
      $("[data-status]").textContent = `${puzzle.icon} ${puzzle.name} · 0 of 7 pieces`;
      document.querySelectorAll("[data-p]").forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.p) === index)));
      say(`Make the ${puzzle.name.toLowerCase()}! Drag each piece into the shape. Tap a piece to turn it.`);
    };
    const draw = () => {
      stage.innerHTML = "";
      view = makeSvg("0 0 1000 560", stage);
      el("rect", { x: 20, y: 20, width: 600, height: 520, rx: 26, fill: "#f6f0e6" }, view);
      el("rect", { x: 640, y: 20, width: 340, height: 520, rx: 26, fill: "#fbf8f2", stroke: "#eadfce", "stroke-width": 2, "stroke-dasharray": "10 8" }, view);
      text(view, 810, 52, "Pieces", { "font-size": 22, fill: "#8a7764", "font-weight": 800 });
      const shadow = el("g", {}, view);
      for (const s of slots) {
        const d = "M" + s.pts.map(toPx).map((p) => p.join(" ")).join("L") + "Z";
        el("path", { d, fill: s.filled ? TYPES[s.type].color : "#3b2a1d", opacity: s.filled ? 1 : 0.85, stroke: easy && !s.filled ? "#fffcf6" : "#3b2a1d", "stroke-width": easy ? 3 : 1, "stroke-linejoin": "round" }, shadow);
      }
      for (const p of pieces) {
        if (p.placed) continue;
        const pts = shapeOf(p).map(toPx);
        const g = el("g", { class: "tg-piece", "data-id": p.id, style: "cursor:grab" }, view);
        el("path", { d: "M" + pts.map((q) => q.join(" ")).join("L") + "Z", fill: TYPES[p.type].color, stroke: selected === p.id ? "#2b1d12" : "#fff", "stroke-width": selected === p.id ? 5 : 3, "stroke-linejoin": "round", filter: "drop-shadow(0 4px 4px rgba(0,0,0,.18))" }, g);
      }
    };
    const status = () => {
      const n = slots.filter((s) => s.filled).length;
      $("[data-status]").textContent = `${puzzles[index].icon} ${puzzles[index].name} · ${n} of 7 pieces`;
      return n;
    };
    const trySnap = (p) => {
      const pts = shapeOf(p);
      const c = centroid(pts);
      const near = slots.filter((s) => !s.filled && s.type === p.type).sort((a, b) => Math.hypot(a.c[0] - c[0], a.c[1] - c[1]) - Math.hypot(b.c[0] - c[0], b.c[1] - c[1]))[0];
      if (!near || Math.hypot(near.c[0] - c[0], near.c[1] - c[1]) > 0.9) return false;
      const moved = pts.map(([x, y]) => [x - c[0] + near.c[0], y - c[1] + near.c[1]]);
      if (samePoly(moved, near.pts)) {
        near.filled = true;
        p.placed = true;
        MUSIC.play("xylophone", 84 + status() * 2, { gain: 0.5 });
        window.OC?.touch();
        if (status() === 7) win();
        else say(pick(["It fits!", "Nice!", "Yes!", "Click!"]), { voice: false });
        return true;
      }
      say(`Almost! The ${TYPES[p.type].name} needs to turn${p.type === "P" ? " or flip" : ""}. Tap it to turn it.`, { voice: false });
      return false;
    };
    const win = async () => {
      selected = null;
      draw();
      MUSIC.chime();
      confetti();
      window.OC?.count("tangrams");
      const solved = new Set([...(shell.progress()[id]?.solved || []), puzzles[index].name]);
      shell.mark(id, { solved: [...solved], next: (index + 1) % puzzles.length, done: solved.size >= puzzles.length });
      say(`🎉 ${pick(PRAISE)} You made the ${puzzles[index].name.toLowerCase()} with all 7 pieces!`);
      await wait(3400);
      if (my !== token) return;
      index = (index + 1) % puzzles.length;
      setup();
    };
    stage.onpointerdown = (event) => {
      const g = event.target.closest(".tg-piece");
      if (!g || my !== token) return;
      event.preventDefault();
      const p = pieces[Number(g.dataset.id)];
      const box = view.getBoundingClientRect();
      const scale = 1 / Math.min(box.width / 1000, box.height / 560);
      dragging = { p, sx: event.clientX, sy: event.clientY, x: p.x, y: p.y, scale };
      moved = false;
      selected = p.id;
      try {
        stage.setPointerCapture(event.pointerId);
      } catch {}
    };
    stage.onpointermove = (event) => {
      if (!dragging) return;
      const dx = ((event.clientX - dragging.sx) * dragging.scale) / U;
      const dy = ((event.clientY - dragging.sy) * dragging.scale) / U;
      if (Math.hypot(dx, dy) > 0.12) moved = true;
      dragging.p.x = dragging.x + dx;
      dragging.p.y = dragging.y + dy;
      draw();
    };
    stage.onpointerup = () => {
      if (!dragging) return;
      const p = dragging.p;
      dragging = null;
      if (!moved) {
        p.rot = (p.rot + 1) % 8;
        MUSIC.play("woodblock", 79, { gain: 0.4 });
        if (!trySnap(p)) draw();
        return;
      }
      if (!trySnap(p)) draw();
      else draw();
    };
    $("[data-panel]").onclick = (event) => {
      if (my !== token) return;
      const pb = event.target.closest("[data-p]");
      if (pb) {
        index = Number(pb.dataset.p);
        return setup();
      }
      const what = event.target.closest("[data-do]")?.dataset.do;
      if (what === "flip") {
        const p = pieces.find((q) => q.id === selected && !q.placed) || pieces.find((q) => q.type === "P" && !q.placed);
        if (p) {
          p.flip = !p.flip;
          selected = p.id;
          draw();
          if (p.type !== "P") say("Flipping only changes the parallelogram's shape. Try it on the purple piece!", { voice: false });
        }
      }
      if (what === "mode") {
        easy = !easy;
        event.target.closest("button").textContent = easy ? "👀 Hard mode" : "🙂 Easy mode";
        draw();
        say(easy ? "Easy mode: you can see where each piece goes." : "Hard mode: only the shadow! Can you work it out?");
      }
      if (what === "reset") setup();
      if (what === "hint") {
        const s = slots.find((q) => !q.filled);
        if (!s) return;
        const p = pieces.find((q) => !q.placed && q.type === s.type);
        selected = p.id;
        draw();
        const d = "M" + s.pts.map(toPx).map((q) => q.join(" ")).join("L") + "Z";
        el("path", { d, fill: TYPES[s.type].color, opacity: 0.55, stroke: "#fff", "stroke-width": 4 }, view);
        say(`Try the ${TYPES[s.type].name} here. It's glowing in the shape.`);
      }
    };
    setup();
  }
}

const shell = SHELL({
  units: UNITS,
  how: {
    g0: { icon: "👀", title: "See it", steps: ["Watch the pictures.", "Press Next ▶ to go on.", "Press Let's play when you are ready."] },
    g2: { icon: "🐱", title: "Cat, fish and rocket", steps: ["Drag a coloured piece into the dark shape.", "Tap a piece to turn it. Use Flip for the purple one.", "Fit all 7 pieces to make the picture!"] },
    g1: { icon: "🧩", title: "Tangram puzzles", steps: ["Drag a coloured piece into the dark shape.", "Tap a piece to turn it. Use Flip for the purple one.", "Fit all 7 pieces to finish the picture!"] },
  },
  start: "g0",
  onStop() {
    token += 1;
    $("[data-panel]").onclick = null;
    stage.onpointerdown = stage.onpointermove = stage.onpointerup = null;
  },
  subject: "Arts",
  activity: "Tangram Puzzles",
  onUnit(id) {
    token += 1;
    VOICE.hush();
    units[id]();
  },
});
MUSIC.preload("xylophone", [84, 86, 88, 90, 92, 94, 96, 98]);
MUSIC.preload("woodblock", [79]);
</script>
</body>
