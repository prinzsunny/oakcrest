function wrapLines(str, max) {
  const lines = [];
  for (const w of String(str).split(" ")) {
    const l = lines[lines.length - 1];
    if (l !== undefined && (l + " " + w).length <= max) lines[lines.length - 1] = l + " " + w;
    else lines.push(w);
  }
  return lines;
}
function textBlock(parent, x, y, str, max, size, lh, attrs = {}) {
  const lines = wrapLines(str, max);
  lines.forEach((ln, i) => text(parent, x, y + i * lh, ln, { "font-size": size, fill: INK, ...attrs }));
  return lines.length;
}

function onLevels(id, fn) {

}
function levelOf(id, fallback, allowed) {
  const lv = shell.progress()[id]?.level;

}
const tween = (ms, fn, alive) =>
  new Promise((resolve) => {
    if (KIT.still.matches) {
      fn(1);
      return resolve(true);
    }
    const t0 = performance.now();
    const frame = (now) => {
      if (!alive()) return resolve(false);
      const t = Math.min(1, (now - t0) / ms);
      fn(t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
      if (t < 1) requestAnimationFrame(frame);
      else resolve(true);
    };
    requestAnimationFrame(frame);
  });

// Answer buttons: a button already marked right or wrong does nothing.
const choose = (host, opts, fn) =>
  KIT.choices(host, opts, (c, b) => {
    if (b.classList.contains("wrong") || b.classList.contains("right")) return;
    fn(c, b);
  });

// Rounds: struggle first, a Socratic hint after the first miss, the answer (with why) after the second.
function rounds(id, my, { total = 8, noun = "Round", count, ask }) {
  const g = { round: 0, first: 0, tries: 0, busy: false };
  const status = () => {
    const s = $("[data-status]");
    if (s) s.textContent = `${noun} ${Math.min(g.round + 1, total)} of ${total}`;
  };
  g.next = () => {
    g.tries = 0;
    g.busy = false;
    status();
    ask();
  };
  g.restart = () => {
    g.round = 0;
    g.first = 0;
    g.next();
  };
  const advance = () => {
    g.round += 1;
    window.OC?.count(typeof count === "function" ? count() : count);
    if (g.round < total) return g.next();
    confetti();
    shell.mark(id, { done: true });
    const s = $("[data-status]");
    if (s) s.textContent = "All done!";
    say(`🎉 All ${total} done! ${g.first} on the first try. You kept going and thought carefully.`);
    const host = $("[data-choices]");
    if (host) {
      host.innerHTML = `<div class="ap-buttons"><button type="button" class="primary" data-again>🔁 Play again</button><button type="button" data-real>🏠 Try it for real</button></div>`;
      host.onclick = (e) => {
        if (e.target.closest("[data-again]")) g.restart();
        else if (e.target.closest("[data-real]")) shell.go("w8");
      };
    }
  };
  g.win = async (msg, extra = 700) => {
    if (g.busy) return;
    g.busy = true;
    MUSIC.chime();
    if (g.tries === 0) g.first += 1;
    window.OC?.touch();
    await talk(msg, extra);
    if (my !== token) return;
    advance();
  };
  // returns true when the answer was revealed
  g.miss = async (hint, reveal, show) => {
    if (g.busy) return false;
    window.OC?.touch();
    MUSIC.oops();
    g.tries += 1;
    if (g.tries < 2) {
      say(`${pick(OOPS)} ${hint}`);
      return false;
    }
    g.busy = true;
    show?.();
    await talk(`Here it is. ${reveal}`, 1200);
    if (my !== token) return true;
    advance();
    return true;
  };
  return g;
}

function pyramid(parent, x, base, w, h, attrs = {}) {
  const g = el("g", attrs, parent);
  el("path", { d: `M${x - w / 2} ${base}L${x} ${base - h}L${x + w / 2} ${base}Z`, fill: "#e8c27a", stroke: "#a77b3c", "stroke-width": 3, "stroke-linejoin": "round" }, g);
  el("path", { d: `M${x} ${base - h}L${x + w / 2} ${base}L${x + w * 0.12} ${base}Z`, fill: "#c99a52" }, g);
  for (let k = 1; k < 5; k++) {
    const yy = base - (h * k) / 5;
    const half = (w / 2) * (1 - k / 5);
    el("line", { x1: x - half, x2: x + half, y1: yy, y2: yy, stroke: "#b88c4a", "stroke-width": 1.5, opacity: 0.6 }, g);
  }
  return g;
}
function icon(parent, x, y, glyph, size) {
  if (glyph === "pyr") return pyramid(parent, x, y + size * 0.42, size * 1.15, size * 0.8);
  return emoji(parent, x, y, glyph, size);
}

// ---------- cuneiform wedges ----------
function wedgeOne(parent, x, y, s = 1) {
  return el("path", { d: `M${x - 18 * s} ${y}L${x + 18 * s} ${y}L${x + 3 * s} ${y + 16 * s}L${x + 3 * s} ${y + 64 * s}L${x - 3 * s} ${y + 64 * s}L${x - 3 * s} ${y + 16 * s}Z`, fill: "#6e4526", stroke: "#4a2d17", "stroke-width": 1.5 }, parent);
}
function wedgeTen(parent, x, y, s = 1) {
  return el("path", { d: `M${x + 22 * s} ${y - 26 * s}L${x - 24 * s} ${y}L${x + 22 * s} ${y + 26 * s}L${x + 8 * s} ${y}Z`, fill: "#6e4526", stroke: "#4a2d17", "stroke-width": 1.5 }, parent);
}
function drawNumberWedges(parent, n, cx, cy, s = 1) {
  const tens = Math.floor(n / 10);
  const ones = n % 10;
  const tensW = tens ? Math.min(tens, 3) * 52 * s : 0;
  const onesW = ones ? Math.min(ones, 3) * 46 * s : 0;
  const gap = tens && ones ? 34 * s : 0;
  let x = cx - (tensW + gap + onesW) / 2;
  const out = [];
  for (let j = 0; j < tens; j++) out.push(wedgeTen(parent, x + 26 * s + (j % 3) * 52 * s, cy - 30 * s + Math.floor(j / 3) * 60 * s, s));
  x += tensW + gap;
  for (let i = 0; i < ones; i++) out.push(wedgeOne(parent, x + 23 * s + (i % 3) * 46 * s, cy - 100 * s + Math.floor(i / 3) * 74 * s, s));
  return out;
}

// ---------- Roman numerals ----------
function toRoman(n) {
  const map = [[100, "C"], [90, "XC"], [50, "L"], [40, "XL"], [10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]];
  let out = "";
  for (const [v, s] of map)
    while (n >= v) {
      out += s;
      n -= v;
    }
  return out;
}
function fromRoman(s) {
  const v = { I: 1, V: 5, X: 10, L: 50, C: 100 };
  let total = 0;
  for (let i = 0; i < s.length; i++) {
    const a = v[s[i]];
    const b = v[s[i + 1]] || 0;
    total += a < b ? -a : a;
  }
  return total;
}

  // Continents & oceans
  w1() {
    const my = token;
    let level = levelOf("w1", "easy", ["easy", "medium", "hard"]);
    let list = [];
    let q = null;
    let nodes = null;
    let labels = null;
    panel(`${modeRow(LEVELS, level)}<div class="hw-pick" data-choices></div>`);
    const COUNTRY = [
      { n: "Egypt", c: "af", at: [30, 26], hint: "Egypt has the Nile river and the pyramids. It is just across the sea, south of Europe." },
      { n: "China", c: "as", at: [104, 35], hint: "China has the Great Wall. It is on the biggest continent of all." },
      { n: "India", c: "as", at: [79, 22], hint: "India is a big point of land pushing down into the Indian Ocean. Which continent is it part of?" },
      { n: "Greece", c: "eu", at: [22, 39.5], hint: "Greece has lots of islands in the Mediterranean Sea, on the small continent above Africa." },
      { n: "Italy", c: "eu", at: [12.5, 42.5], hint: "Italy is shaped like a boot, kicking into the Mediterranean Sea, above Africa." },
      { n: "Iraq, where Mesopotamia was", c: "as", at: [44, 33], hint: "Iraq is between two rivers, east of the Mediterranean Sea, next to Arabia." },
      { n: "Israel", c: "as", at: [35, 31.5], hint: "Israel is at the eastern end of the Mediterranean Sea, just next to Egypt but not in Africa." },
      { n: "Sudan, where the kingdom of Kush was", c: "af", at: [31, 17], hint: "Sudan is just south of Egypt, along the Nile river." },
      { n: "Iran, where Persia was", c: "as", at: [54, 32], hint: "Iran is east of Iraq, above the Persian Gulf." },
      { n: "Mexico, home of the Maya", c: "na", at: [-100, 22], hint: "Mexico is just south of the United States." },
      { n: "Peru", c: "sa", at: [-75, -10], hint: "Peru is on the west side of the ice-cream-cone shaped continent." },
    ];
    let host = null;
    const drawBase = () => {
      fresh();
      ({ nodes } = drawMap(view));
      labels = el("g", {}, view);
      host = el("g", {}, view);
      view.addEventListener("pointerdown", (event) => {
        const chip = event.target.closest(".hw-chip");
        if (chip) return startDrag(event, chip);
        const place = event.target.closest(".hw-place");
        if (place) answer(place.dataset.id);
      });
    };
    let drag = null;
    const toSvg = (e) => {
      const pt = view.createSVGPoint();
      pt.x = e.clientX;
      pt.y = e.clientY;
      return pt.matrixTransform(view.getScreenCTM().inverse());
    };
    const startDrag = (e, chip) => {
      if (g.busy) return;
      const p = toSvg(e);
      drag = { chip, dx: p.x - Number(chip.dataset.x), dy: p.y - Number(chip.dataset.y), id: e.pointerId };
      try {
        view.setPointerCapture(e.pointerId);
      } catch {}
      chip.setAttribute("pointer-events", "none");
      window.OC?.touch();
    };
    stage.onpointermove = (e) => {
      if (!drag || my !== token) return;
      const p = toSvg(e);
      drag.chip.setAttribute("transform", `translate(${p.x - drag.dx} ${p.y - drag.dy})`);
    };
    stage.onpointerup = (e) => {
      if (!drag || my !== token) return;
      const { chip } = drag;
      drag = null;
      const hit = document.elementFromPoint(e.clientX, e.clientY)?.closest?.(".hw-place");
      chip.setAttribute("transform", `translate(${chip.dataset.x} ${chip.dataset.y})`);
      chip.removeAttribute("pointer-events");
      if (hit) answer(hit.dataset.id);
    };
    const makeChip = (name) => {
      const w = name.length * 14 + 50;
      const chip = el("g", { class: "hw-chip", "data-x": 500, "data-y": 534, transform: "translate(500 534)" }, host);
      el("rect", { x: -w / 2, y: -24, width: w, height: 48, rx: 24, fill: "var(--accent)", stroke: "#fff", "stroke-width": 3 }, chip);
      text(chip, 0, 9, name, { "font-size": 23, fill: "#fff" });
    };
    const build = () => {
      if (level === "easy") list = shuffle([...shuffle(LANDS.map((l) => l.id)), "pacific", "atlantic", "indian"]).slice(0, 10);
      else if (level === "medium") list = shuffle(ALL_PLACES.map((p) => p.id)).slice(0, 10);
      else list = shuffle(COUNTRY).slice(0, 10);
    };
    const g = rounds("w1", my, {
      total: 10,
      noun: "Place",
      count: "places found",
      ask() {
        if (g.round === 0) {
          build();
          drawBase();
        }
        $("[data-choices]").innerHTML = "";
        host.innerHTML = "";
        q = list[g.round];
        window.__hwAns = typeof q === "string" ? q : q.c;
        if (level === "easy") say(`Tap <b>${the(placeById(q))}</b>.`);
        else if (level === "medium") {
          makeChip(placeById(q).name);
          say(`Drag the label to <b>${the(placeById(q))}</b>. Or just tap it.`);
        } else say(`Which continent is <b>${q.n}</b> in? Tap it on the map.`);
      },
    });
    const answer = async (id) => {
      if (my !== token || g.busy || !q) return;
      const target = typeof q === "string" ? q : q.c;
      const tp = placeById(target);
      if (id === target) {
        const land = LANDS.includes(tp);
        paintPlace(nodes, id, land ? tp.fill : "#7cc3e6");
        host.innerHTML = "";
        if (level !== "hard") placeLabel(labels, tp);
        else pin(labels, q.at[0], q.at[1], q.n.split(",")[0]);
        MUSIC.play("harp", 72 + g.round * 2, { gain: 0.3 });
        await g.win(level === "hard" ? `${pick(GOOD)} ${q.n.split(",")[0]} is in ${tp.name}.` : `${pick(GOOD)} That is ${the(tp)}. It is ${tp.where}.`);
        if (my === token && level !== "hard") paintPlace(nodes, id, land ? tp.fill : SEA);
        return;
      }
      const tapped = placeById(id);
      const flash = () => {
        paintPlace(nodes, target, "#fff176");
        if (level === "hard") pin(labels, q.at[0], q.at[1], q.n.split(",")[0]);
      };
      if (level === "hard") await g.miss(`${q.hint} What do you notice on the map?`, `${q.n.split(",")[0]} is in ${tp.name}. ${q.hint}`, flash);
      else await g.miss(`That is ${the(tapped)}. ${The(tp)} is ${tp.where}. Can you find it?`, `${The(tp)} is ${tp.where}.`, flash);
      if (my === token && g.tries >= 2) paintPlace(nodes, target, LANDS.includes(tp) ? tp.fill : SEA);
    };
    onLevels("w1", (lv) => {
      level = lv;
      g.restart();
    });
    g.restart();
  },

  // Timeline
  w2() {
    const my = token;
    let level = levelOf("w2", "easy", ["easy", "medium", "hard"]);
    let set = [];
    let missCard = 0;
    let placed = 0;
    let cards = [];
    panel(`${modeRow(LEVELS, level)}<div class="hw-pick" data-choices></div>`);
    const make = () => {
      if (level === "easy") return shuffle([pick(EVENTS.slice(0, 2)), pick([EVENTS[3], EVENTS[6], EVENTS[9]]), TODAY]);
      if (level === "medium") {
        let s;
        do s = shuffle(EVENTS).slice(0, 4);
        while (new Set(s.map((e) => e.k)).size < 4);
        return s;
      }
      const pairs = [["olympics", "rome"], ["caesar", "ad1"], ["alexander", "wall"], ["laws", "pyramids"]];
      const pair = pick(pairs).map((k) => EVENTS.find((e) => e.k === k));
      const rest = shuffle(EVENTS.filter((e) => !pair.includes(e))).slice(0, 3);
      return shuffle([...pair, ...rest]);
    };
    const remaining = () => cards.filter((c) => !c.done);
    const draw = () => {
      fresh();
      const n = set.length;
      el("line", { x1: 40, x2: 950, y1: 54, y2: 54, stroke: "#5a4130", "stroke-width": 7, "stroke-linecap": "round" }, view);
      el("path", { d: "M945 40L975 54L945 68Z", fill: "#5a4130" }, view);
      text(view, 90, 34, "long ago", { "font-size": 23, fill: "#a8632d" });
      text(view, 912, 34, "now", { "font-size": 23, fill: "#3f7d4e" });
      const sw = Math.min(170, 900 / n - 14);
      const slots = [];
      for (let i = 0; i < n; i++) {
        const cx = 50 + (i + 0.5) * (900 / n);
        el("rect", { x: cx - sw / 2, y: 74, width: sw, height: 156, rx: 16, fill: "#fffcf6", stroke: "#d9cdb5", "stroke-width": 3, "stroke-dasharray": "10 8" }, view);
        text(view, cx, 166, i + 1, { "font-size": 40, fill: "#e6dccd" });
        slots.push(cx);
      }
      const cw = Math.min(182, 940 / n - 14);
      cards = set.map((ev, i) => {
        const cx = 30 + (i + 0.5) * (940 / n);
        const g = el("g", { class: "hw-card", "data-i": i, transform: `translate(${cx} 250)` }, view);
        el("rect", { x: -cw / 2, y: 0, width: cw, height: 290, rx: 20, fill: "#fff", stroke: "var(--accent)", "stroke-width": 4 }, g);
        el("circle", { cx: 0, cy: 74, r: 54, fill: "var(--accent-soft)" }, g);
        icon(g, 0, 70, ev.icon, 66);
        const max = cw > 165 ? 13 : 11;
        const lines = textBlock(g, 0, 166, ev.title, max, 22, 27);
        if (level !== "easy") textBlock(g, 0, 172 + lines * 27 + 12, ev.date, max, 22, 26, { fill: "var(--accent-dark)" });
        return { ev, g, cx, done: false };
      });
      view.addEventListener("pointerdown", (event) => {
        const c = event.target.closest(".hw-card");
        if (c) tap(cards[Number(c.dataset.i)]);
      });
      return slots;
    };
    let slots = [];
    const g = rounds("w2", my, {
      total: 8,
      noun: "Timeline",
      count: "timelines made",
      ask() {
        $("[data-choices]").innerHTML = "";
        set = make();
        placed = 0;
        missCard = 0;
        slots = draw();
        window.__hwAns = () => remaining().slice().sort((a, b) => a.ev.year - b.ev.year)[0]?.ev.k;
        window.__hwSet = set.map((e) => e.k);
        say(level === "easy" ? "Which happened longest ago? Tap it first." : "Put them in order. Tap the one that happened first, longest ago.");
      },
    });
    const moveToSlot = async (c) => {
      c.done = true;
      const to = slots[placed];
      placed += 1;
      const fromX = c.cx;
      await tween(
        750,
        (t) => {
          c.g.setAttribute("transform", `translate(${fromX + (to - fromX) * t} ${250 - 176 * t}) scale(${1 - 0.45 * t})`);
          c.g.setAttribute("opacity", t < 0.7 ? 1 : 1 - (t - 0.7) / 0.3);
        },
        () => my === token
      );
      c.g.setAttribute("display", "none");
      const sw = Math.min(170, 900 / set.length - 14);
      const s = el("g", { "pointer-events": "none" }, view);
      el("rect", { x: to - sw / 2, y: 74, width: sw, height: 156, rx: 16, fill: "#fff8e1", stroke: "var(--accent)", "stroke-width": 4 }, s);
      icon(s, to, 112, c.ev.icon, 46);
      const lines = wrapLines(c.ev.title.replace(/:.*/, ""), 13).slice(0, 2);
      lines.forEach((ln, j) => text(s, to, 166 + j * 24, ln, { "font-size": 22, fill: INK }));
      if (level !== "easy") text(s, to, 166 + lines.length * 24 + 4, c.ev.date.replace(/^about /, "").replace(/ \(legend\)/, ""), { "font-size": 22, fill: "var(--accent-dark)" });
    };
    const tap = async (c) => {
      if (my !== token || g.busy || !c || c.done) return;
      window.OC?.touch();
      const rest = remaining().slice().sort((a, b) => a.ev.year - b.ev.year);
      const first = rest[0];
      if (c === first) {
        g.busy = true;
        missCard = 0;
        MUSIC.play("xylophone", 72 + placed * 3, { gain: 0.45 });
        await moveToSlot(c);
        if (my !== token) return;
        if (remaining().length === 1) {
          await moveToSlot(remaining()[0]);
          if (my !== token) return;
          g.busy = false;
          await g.win(`${pick(GOOD)} ${set.slice().sort((a, b) => a.year - b.year).map((e) => e.title.replace(/:.*/, "")).join(", then ")}.`, 900);
          return;
        }
        g.busy = false;
        say(`${c.ev.tell} What came next?`);
        return;
      }
      const a = c.ev;
      const b = first.ev;
      let hint;
      if (level === "easy") hint = a.k === "today" ? "Today is right now, so it goes last. Which one is oldest?" : `${b.k === "farms" ? "People needed food before anything else." : "That one came later."} Which one is the oldest?`;
      else if (a.year > 0 && b.year < 0) hint = "Look at the letters. BC years came before AD years. Is there a BC card left?";
      else if (a.year < 0 && b.year < 0) hint = "Both are BC. BC counts down to year 1, so a bigger BC number is longer ago. Which BC number is biggest?";
      else hint = "With AD years, a smaller number is longer ago.";
      MUSIC.oops();
      g.tries += 1;
      missCard += 1;
      if (missCard < 2) return say(`${pick(OOPS)} ${hint}`);
      // second miss on this card: show the right one, with the why
      g.busy = true;
      missCard = 0;
      await moveToSlot(first);
      if (my !== token) return;
      await talk(`Here it is. ${b.title.replace(/:.*/, "")} came first, in ${b.date}. ${b.tell}`, 900);
      if (my !== token) return;
      g.busy = false;
      if (remaining().length === 1) {
        await moveToSlot(remaining()[0]);
        if (my !== token) return;
        await g.win("Now the timeline is in order. Long ago on the left, newer on the right.", 1200);
      } else say("What came next? Tap the oldest one left.");
    };
    onLevels("w2", (lv) => {
      level = lv;
      g.restart();
    });
    g.restart();
  },

  // Ancient Egypt
  w3() {
    const my = token;
    const MODES = [["easy", "🐣 The Nile"], ["medium", "🦊 Spell it"], ["hard", "🦁 Read it"], ["name", "✍️ My name"]];
    let mode = levelOf("w3", "easy", MODES.map((m) => m[0]));
    panel(`${modeRow(MODES, mode)}<div class="hw-pick" data-choices></div>`);
    const NILE = [
      { k: "river", ask: "Tap the river Nile.", fact: "The Nile is one of the longest rivers in the world. Almost everyone in Egypt lived near it.", where: "The river is the long blue water in the middle." },
      { k: "pyramid", ask: "Tap a pyramid.", fact: "Pyramids were giant tombs for kings called pharaohs. The king's body was carefully wrapped in cloth to keep it safe. We call it a mummy.", where: "A pyramid has a pointy top and sloping sides." },
      { k: "desert", ask: "Tap the dry desert sand.", fact: "Most of Egypt is hot, dry desert. Very little grows there.", where: "The desert is the sandy yellow land away from the river." },
      { k: "field", ask: "Tap the green farm fields.", fact: "Farms grew right next to the river, where there was water and rich soil.", where: "The fields are the green strips beside the river." },
      { k: "boat", ask: "Tap the boat.", fact: "The Nile flows north, so boats floated north. The wind blows south, so they raised a sail to go south!", where: "The boat has a sail and floats on the river." },
      { k: "papyrus", ask: "Tap the tall papyrus reeds.", fact: "Egyptians made a kind of paper from papyrus reeds, and wrote on it.", where: "Papyrus reeds are tall green plants by the water, on the right." },
      { k: "river", ask: "Every summer the Nile flooded. Tap the river to make it flood!", flood: true, fact: "When the water went down, it left rich black mud on the fields. Perfect for growing food!", where: "Tap the blue river." },
      { k: "field", ask: "Now tap the black mud to plant seeds.", plant: true, fact: "The seeds grew into wheat and barley. Egyptians made bread from the wheat!", where: "The black mud is beside the river." },
    ];
    const SPELL = ["SUN", "CAT", "DOG", "NILE", "BOAT", "FISH", "MAP", "OWL", "KING", "SAND"];
    const READ = ["SUN", "CAT", "DOG", "NILE", "BOAT", "FISH", "MAP", "OWL", "KING", "SAND", "LAMP", "FROG", "BED", "HAT", "RED", "PIG"];
    let scene = null;
    let q = null;
    let built = "";
    let cart = null;
    const chart = (y0 = 222) => {
      const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
      letters.forEach((L, i) => {
        const row = Math.floor(i / 9);
        const col = i % 9;
        const inRow = row < 2 ? 9 : 8;
        const x = (W - inRow * 106 + 6) / 2 + col * 106;
        const y = y0 + row * 110;
        const t = el("g", { class: "hw-tile", "data-l": L, transform: `translate(${x} ${y})` }, view);
        el("rect", { width: 100, height: 104, rx: 14, fill: "#fff8e6", stroke: "#d9b98a", "stroke-width": 3 }, t);
        glyph(t, L, 50, 42, 58);
        text(t, 50, 96, L, { "font-size": 22, fill: "#8e4d24" });
      });
      view.addEventListener("pointerdown", (event) => {
        const t = event.target.closest(".hw-tile");
        if (t) tapTile(t.dataset.l, t);
      });
    };
    const cartouche = (y, h, count, letters) => {
      const n = Math.max(count, 3);
      const size = Math.min(76, (680 - 40) / n);
      const w = n * (size + 10) + 60;
      const x0 = 500 - w / 2;
      const g = el("g", {}, view);
      el("rect", { x: x0, y, width: w, height: h, rx: h / 2, fill: "#fff3d6", stroke: "#a8632d", "stroke-width": 6 }, g);
      el("line", { x1: x0 + w + 12, x2: x0 + w + 12, y1: y + 12, y2: y + h - 12, stroke: "#a8632d", "stroke-width": 8, "stroke-linecap": "round" }, g);
      const inner = el("g", {}, g);
      return { g, inner, at: (i) => x0 + 30 + (i + 0.5) * (size + 10), size, y, h, letters };
    };
    const fill = () => {
      if (mode === "name") {
        cart.g.remove();
        cart = cartouche(36, 150, Math.max(6, built.length), true);
      }
      cart.inner.innerHTML = "";
      [...built].forEach((L, i) => {
        glyph(cart.inner, L, cart.at(i), cart.y + cart.h / 2 - (cart.letters ? 10 : 0), cart.size * 0.8);
        if (cart.letters) text(cart.inner, cart.at(i), cart.y + cart.h - 12, L, { "font-size": 22, fill: "#8e4d24" });
      });
    };
    const g = rounds("w3", my, {
      total: 8,
      noun: "Round",
      count: "Egypt rounds",
      ask() {
        const host = $("[data-choices]");
        host.innerHTML = "";
        host.onclick = null;
        if (mode === "easy") {
          if (g.round === 0) {
            fresh();
            scene = egyptScene(view);
            view.addEventListener("pointerdown", (event) => {
              const h = event.target.closest(".hw-hit");
              if (h) tapScene(h.dataset.k);
            });
          }
          q = NILE[g.round];
          window.__hwAns = q.k;
          say(q.ask);
        } else if (mode === "medium") {
          if (g.round === 0) q = { order: shuffle(SPELL) };
          q.word = q.order[g.round];
          built = "";
          fresh();
          text(view, 500, 56, [...q.word].join(" "), { "font-size": 48, fill: INK, "letter-spacing": 6 });
          cart = cartouche(78, 128, q.word.length, true);
          chart();
          window.__hwAns = q.word;
          quiet(`Spell <b>${q.word}</b> in hieroglyphs. Tap the picture for <b>${q.word[0]}</b>.`, `Spell ${q.word.toLowerCase()} in hieroglyphs. Find the picture for the letter ${q.word[0]}.`);
        } else {
          if (g.round === 0) q = { order: shuffle(READ) };
          const word = q.order[g.round];
          q.word = word;
          built = word;
          fresh();
          cart = cartouche(40, 150, word.length, false);
          fill();
          chart(224);
          const opts = new Set([word]);
          for (const w of shuffle(READ)) if (opts.size < 3 && canon(w) !== canon(word)) opts.add(w);
          window.__hwAns = word;
          choose(host, shuffle([...opts]).map((w) => ({ label: w, v: w })), (c, b) => readAnswer(c.v, b));
          say("Read the hieroglyphs. Find each picture in the chart. Which word is it?");
        }
      },
    });
    const tapScene = async (k) => {
      if (my !== token || g.busy || mode !== "easy") return;
      if (k === q.k) {
        if (q.flood) {
          g.busy = true;
          MUSIC.play("harp", 60, { gain: 0.4 });
          await tween(
            1400,
            (t) => {
              scene.flood.setAttribute("d", `M0 ${372 - 50 * t}H1000V${448 + 54 * t}H0Z`);
              scene.flood.setAttribute("opacity", 0.9 * t);
            },
            () => my === token
          );
          await wait(500);
          scene.fields.forEach((f) => f.setAttribute("fill", "#4a3a2a"));
          await tween(1400, (t) => scene.flood.setAttribute("opacity", 0.9 * (1 - t)), () => my === token);
          g.busy = false;
        }
        if (q.plant) {
          g.busy = true;
          for (let x = 30; x < 1000; x += 44)
            for (const y of [356, 488]) {
              const s = el("line", { x1: x, x2: x, y1: y, y2: y, stroke: "#5aa83a", "stroke-width": 4, "stroke-linecap": "round" }, scene.sprouts);
              s.dataset.y = y;
            }
          await tween(1300, (t) => scene.sprouts.querySelectorAll("line").forEach((s) => s.setAttribute("y2", s.dataset.y - 26 * t)), () => my === token);
          scene.sprouts.querySelectorAll("line").forEach((s) => s.setAttribute("stroke", "#e0b13a"));
          g.busy = false;
        }
        if (my !== token) return;
        await g.win(`${pick(GOOD)} ${q.fact}`, 900);
        return;
      }
      const names = { river: "the river", pyramid: "a pyramid", desert: "the desert", field: "the fields", boat: "the boat", papyrus: "the papyrus reeds", sun: "the sun" };
      await g.miss(`That is ${names[k] || "something else"}. ${q.where}`, q.where, () => {
        const target = { river: scene.river, pyramid: scene.pyramid, desert: scene.desert, field: scene.fieldG, boat: scene.boat, papyrus: scene.papyrus }[q.k];
        target?.setAttribute("opacity", 0.55);
        setTimeout(() => target?.setAttribute("opacity", 1), 900);
      });
    };
    const tapTile = async (L, tile) => {
      if (my !== token || g.busy) return;
      window.OC?.touch();
      const rect = tile.querySelector("rect");
      if (mode === "name") {
        if (built.length >= 9) return say("The cartouche is full! Press Clear to start again.");
        built += L;
        fill();
        MUSIC.play("xylophone", 72 + (L.charCodeAt(0) % 12) * 2, { gain: 0.35 });
        window.OC?.count("hieroglyphs written");
        say(`${L} is the ${GLYPH_NAME[L]}.`);
        return;
      }
      if (mode !== "medium") return;
      const need = q.word[built.length];
      if (L === need) {
        built += L;
        fill();
        rect.setAttribute("fill", "#e3f4e7");
        setTimeout(() => rect.setAttribute("fill", "#fff8e6"), 500);
        MUSIC.play("xylophone", 72 + built.length * 3, { gain: 0.4 });
        if (built === q.word) {
          await g.win(`${pick(GOOD)} You wrote ${q.word.toLowerCase()} in hieroglyphs: ${[...q.word].map((c) => `the ${GLYPH_NAME[c]}`).join(", ")}.`, 900);
          return;
        }
        VOICE.speak(`${L}, the ${GLYPH_NAME[L]}. Next: ${q.word[built.length]}.`);
        say(`${L} is the ${GLYPH_NAME[L]}. Now find <b>${q.word[built.length]}</b>.`, { voice: false });
        return;
      }
      rect.setAttribute("fill", "#f6dcd4");
      setTimeout(() => rect.setAttribute("fill", "#fff8e6"), 500);
      MUSIC.oops();
      g.tries += 1;
      const cell = view.querySelector(`.hw-tile[data-l="${need}"] rect`);
      if (g.tries >= 2) {
        cell?.setAttribute("stroke", "#e53935");
        cell?.setAttribute("stroke-width", 7);
        say(`We need <b>${need}</b>. It is the ${GLYPH_NAME[need]}, glowing red. Tap it.`);
      } else say(`That is ${L}, the ${GLYPH_NAME[L]}. We need <b>${need}</b>. Look at the small letters under each picture. Where is ${need}?`);
    };
    const readAnswer = async (w, button) => {
      if (my !== token || g.busy) return;
      if (w === q.word) {
        button.classList.add("right");
        await g.win(`${pick(GOOD)} ${[...q.word].map((c) => `the ${GLYPH_NAME[c]}`).join(", ")}. That spells ${q.word.toLowerCase()}.`, 900);
        return;
      }
      button.classList.add("wrong");
      await g.miss(`What is the first picture? Find it in the chart. Which letter is under it?`, `The first picture is the ${GLYPH_NAME[q.word[0]]}, which is ${q.word[0]}. The word is ${q.word.toLowerCase()}.`, () => $("[data-choices]").querySelectorAll("button").forEach((b) => b.textContent === q.word && b.classList.add("right")));
    };
    const nameMode = () => {
      built = "";
      fresh();
      cart = cartouche(36, 150, 6, true);
      chart(224);
      const host = $("[data-choices]");
      host.innerHTML = `<div class="ap-buttons"><button type="button" data-do="back">⌫ Back</button><button type="button" data-do="clear">🧹 Clear</button></div>`;
      host.onclick = (e) => {
        const b = e.target.closest("[data-do]");
        if (!b || my !== token) return;
        built = b.dataset.do === "clear" ? "" : built.slice(0, -1);
        fill();
      };
      $("[data-status]").textContent = "Free writing";
      say("Write your name in hieroglyphs! Tap the picture for each letter of your name.");
      shell.mark("w3", { done: true });
    };
    const start = () => (mode === "name" ? nameMode() : g.restart());
    onLevels("w3", (lv) => {
      mode = lv;
      start();
    });
    start();
  },

  // Mesopotamia
  w4() {
    const my = token;
    const MODES = [["easy", "🐣 Wedges 1–9"], ["medium", "🦊 Wedges to 59"], ["hard", "🦁 Fair rules"]];
    let mode = levelOf("w4", "easy", MODES.map((m) => m[0]));
    panel(`${modeRow(MODES, mode)}<div class="hw-pick" data-choices></div>`);
    let q = null;
    let ones = 0;
    let tens = 0;
    let marks = null;
    let order = [];
    const tablet = () => {
      fresh();
      el("rect", { x: 0, y: 0, width: W, height: H, fill: "#f3e3c6" }, view);
      const t = el("g", { class: "hw-tablet" }, view);
      el("rect", { x: 300, y: 36, width: 640, height: 490, rx: 40, fill: "#c79a6b", stroke: "#8a6240", "stroke-width": 6 }, t);
      el("rect", { x: 318, y: 54, width: 604, height: 454, rx: 32, fill: "#d2a777" }, t);
      marks = el("g", { "pointer-events": "none" }, view);
      view.addEventListener("pointerdown", (event) => {
        if (event.target.closest(".hw-tablet") && mode === "easy") press(1);
      });
    };
    const redraw = () => {
      marks.innerHTML = "";
      drawNumberWedges(marks, tens * 10 + ones, 620, 290, 1.25);
    };
    const target = (label) => {
      const g = el("g", {}, view);
      el("rect", { x: 30, y: 150, width: 240, height: 220, rx: 26, fill: "#fff", stroke: "var(--accent)", "stroke-width": 4 }, g);
      text(g, 150, 210, label, { "font-size": 26, fill: "#8e4d24" });
      return text(g, 150, 320, "", { "font-size": 96, fill: INK });
    };
    const g = rounds("w4", my, {
      total: 8,
      noun: "Tablet",
      count: () => (mode === "hard" ? "fair rules" : "clay numbers"),
      ask() {
        const host = $("[data-choices]");
        host.onclick = null;
        host.innerHTML = "";
        if (mode === "hard") {
          if (g.round === 0) order = shuffle(FAIR);
          q = order[g.round];
          fresh();
          el("rect", { x: 0, y: 0, width: W, height: H, fill: "#f3e3c6" }, view);
          // law stone (stele)
          el("path", { d: "M800 520V140Q800 60 870 60Q940 60 940 140V520Z", fill: "#5d5a66", stroke: "#3c3a44", "stroke-width": 4 }, view);
          for (let r = 0; r < 9; r++) for (let c = 0; c < 5; c++) wedgeOne(view, 822 + c * 24, 250 + r * 28, 0.25);
          el("circle", { cx: 870, cy: 130, r: 34, fill: "#7a7684" }, view);
          emoji(view, 870, 128, "⚖️", 40);
          el("rect", { x: 40, y: 50, width: 720, height: 460, rx: 30, fill: "#fff", stroke: "var(--accent)", "stroke-width": 4 }, view);
          emoji(view, 400, 140, q.icon, 100);
          textBlock(view, 400, 270, q.q, 40, 30, 40);
          text(view, 400, 470, "What rule would be fair?", { "font-size": 26, fill: "var(--accent-dark)" });
          const opts = shuffle(q.opts.map((o, i) => ({ label: o, v: i })));
          window.__hwAns = q.opts[0];
          choose(host, opts, (c, b) => fairAnswer(c.v, b));
          say(`${q.q} What rule would be fair?`);
          return;
        }
        tablet();
        ones = 0;
        tens = 0;
        const n = mode === "easy" ? pickInt(1, 9) : pickInt(11, 59);
        const reading = mode === "medium" && g.round % 2 === 1;
        q = { n, reading };
        window.__hwAns = n;
        if (reading) {
          target("What number?").textContent = "?";
          tens = Math.floor(n / 10);
          ones = n % 10;
          redraw();
          const opts = new Set([n]);
          const swap = (n % 10) * 10 + Math.floor(n / 10);
          if (swap !== n && swap < 60 && swap > 0) opts.add(swap);
          while (opts.size < 3) opts.add(Math.max(1, Math.min(59, n + pick([-10, -1, 1, 10, 2]))));
          choose(host, shuffle([...opts]).map((x) => ({ label: String(x), v: x })), (c, b) => readAnswer(c.v, b));
          say("Read the clay tablet. A sideways wedge is 10. A tall wedge is 1. What number is it?");
        } else {
          target("Write").textContent = n;
          if (mode === "easy") {
            host.innerHTML = `<div class="hw-keys"><button type="button" data-w="1">▼ Press a wedge</button><button type="button" class="sm" data-w="undo">↩ Smooth</button></div>`;
            host.querySelector('[data-w="1"]').classList.add("sm");
            say(`Tap the clay ${n} ${n === 1 ? "time" : "times"} to press ${n} ${n === 1 ? "wedge" : "wedges"}.`);
          } else {
            host.innerHTML = `<div class="hw-keys"><button type="button" class="sm" data-w="10">◀ Ten</button><button type="button" class="sm" data-w="1">▼ One</button><button type="button" class="sm" data-w="undo">↩ Smooth</button><button type="button" class="ok" data-w="ok">✓</button></div>`;
            say(`Write <b>${n}</b> on the clay. A sideways wedge is 10. A tall wedge is 1.`);
          }
          host.onclick = (e) => {
            const b = e.target.closest("[data-w]");
            if (!b) return;
            const w = b.dataset.w;
            if (w === "1") press(1);
            else if (w === "10") press(10);
            else if (w === "undo") {
              if (ones) ones -= 1;
              else if (tens) tens -= 1;
              redraw();
            } else check();
          };
        }
      },
    });
    const press = (v) => {
      if (my !== token || g.busy || q?.reading || q?.done) return;
      window.OC?.touch();
      if (v === 1 && ones < 9) ones += 1;
      else if (v === 10 && tens < 5) tens += 1;
      else return say(v === 1 ? "9 tall wedges is the most. For 10, Babylonians used one sideways wedge!" : "5 sideways wedges is 50. That's the most here.");
      MUSIC.play("woodblock", v === 10 ? 72 : 79, { gain: 0.4 });
      redraw();
      if (mode === "easy") {

        if (ones === q.n) setTimeout(() => my === token && g.win(`${pick(GOOD)} ${q.n} ${q.n === 1 ? "wedge" : "wedges"} make ${q.n}. You wrote like the people of Sumer, 5,000 years ago!`, 900), 500);
      }

    const check = async () => {
      if (my !== token || g.busy) return;
      const made = tens * 10 + ones;
      if (made === q.n) return g.win(`${pick(GOOD)} ${Math.floor(q.n / 10)} tens and ${q.n % 10} ones make ${q.n}.`, 900);
      await g.miss(`You made ${made}. We need ${q.n}. How many tens are in ${q.n}? How many ones?`, `${q.n} is ${Math.floor(q.n / 10)} sideways wedges for the tens and ${q.n % 10} tall wedges for the ones.`, () => {
        tens = Math.floor(q.n / 10);
        ones = q.n % 10;
        redraw();
      });
    };
    const readAnswer = async (v, b) => {
      if (my !== token || g.busy) return;
      if (v === q.n) {
        b.classList.add("right");
        view.querySelector("text[font-size='96']") && (view.querySelector("text[font-size='96']").textContent = q.n);
        return g.win(`${pick(GOOD)} ${Math.floor(q.n / 10)} sideways wedges are ${Math.floor(q.n / 10)} tens, and ${q.n % 10} tall wedges are ${q.n % 10} ones: ${q.n}.`, 900);
      }
      b.classList.add("wrong");
      await g.miss("Count the sideways wedges first. Each one is 10. Then count the tall ones.", `There are ${Math.floor(q.n / 10)} sideways wedges and ${q.n % 10} tall wedges. That is ${q.n}.`, () => $("[data-choices]").querySelectorAll("button").forEach((x) => x.textContent === String(q.n) && x.classList.add("right")));
    };
    const fairAnswer = async (v, b) => {
      if (my !== token || g.busy) return;
      if (v === 0) {
        b.classList.add("right");
        return g.win(`${pick(GOOD)} ${q.why}`, 1000);
      }
      b.classList.add("wrong");
      await g.miss("Would that feel fair if it happened to you? Think about who was hurt, and how to make it right.", `The fair rule is: ${q.opts[0]}. ${q.why}`, () => $("[data-choices]").querySelectorAll("button").forEach((x) => x.textContent === q.opts[0] && x.classList.add("right")));
    };
    onLevels("w4", (lv) => {
      mode = lv;
      g.restart();
    });
    g.restart();
  },

      }
      b.classList.add("wrong");
      await g.miss(q.hint, q.why, () => $("[data-choices]").querySelectorAll("button").forEach((x) => x.textContent === q.opts[0] && x.classList.add("right")));
    };
    onLevels("w5", (lv) => {
      level = lv;
      g.restart();
    });
    g.restart();
  },

  // Roman numerals
  w6() {
    const my = token;
    let level = levelOf("w6", "easy", ["easy", "medium", "hard"]);
    panel(`${modeRow(LEVELS, level)}<div class="hw-pick" data-choices></div>`);
    let q = null;
    let built = "";
    let shown = null;
    let pad = null;
    const stone = (big) => {
      fresh();
      el("rect", { x: 0, y: 0, width: W, height: H, fill: "#f4ecdc" }, view);
      el("rect", { x: 210, y: 30, width: 580, height: 300, rx: 24, fill: "#e4ddcd", stroke: "#9a8f7b", "stroke-width": 6 }, view);
      el("rect", { x: 230, y: 50, width: 540, height: 260, rx: 16, fill: "none", stroke: "#bdb29c", "stroke-width": 3 }, view);
      shown = text(view, 500, 222, big, { "font-size": 130, fill: "#5b4a3a", ...ser });
      const keys = [["I", 1], ["V", 5], ["X", 10], ["L", 50], ["C", 100]];
      keys.forEach(([s, n], i) => {
        const x = 120 + i * 190;
        el("rect", { x: x - 76, y: 450, width: 152, height: 88, rx: 18, fill: "#fff", stroke: "var(--accent)", "stroke-width": 3 }, view);
        text(view, x - 32, 508, s, { "font-size": 42, fill: "#5b4a3a", ...ser });
        text(view, x + 34, 506, `= ${n}`, { "font-size": 26, fill: INK });
      });
    };
    const g = rounds("w6", my, {
      total: 8,
      noun: "Stone",
      count: "Roman numerals",
      ask() {
        const host = $("[data-choices]");
        host.innerHTML = "";
        host.onclick = null;
        if (level === "easy") {
          const n = pickInt(1, 10);
          q = { n };
          stone("");
          shown.setAttribute("font-size", 40);
          shown.textContent = "";
          const coins = el("g", {}, view);
          for (let i = 0; i < n; i++) {
            const row = Math.floor(i / 5);
            const col = i % 5;
            const x = 500 - 2 * 92 + col * 92 + (row ? 0 : 0);
            const y = 120 + row * 110;
            el("circle", { cx: x, cy: y, r: 38, fill: "#f2c94c", stroke: "#a8792c", "stroke-width": 5 }, coins);
            el("circle", { cx: x, cy: y, r: 26, fill: "none", stroke: "#d8a93a", "stroke-width": 3 }, coins);
          }
          q.label = text(view, 500, 412, "How many coins?", { "font-size": 30, fill: INK });
          const opts = new Set([n]);
          for (const d of shuffle([-1, 1, -2, 2, 4, -4, 5, -5])) if (opts.size < 3 && n + d >= 1 && n + d <= 10) opts.add(n + d);
          window.__hwAns = toRoman(n);
          choose(host, shuffle([...opts]).map((x) => ({ label: toRoman(x), v: x })), (c, b) => easyAnswer(c.v, b));
          host.querySelectorAll("button").forEach((b) => b.classList.add("hw-rom"));
          say("Count the coins. Which Roman numeral shows how many?");
        } else if (level === "medium") {
          const n = pickInt(11, 50);
          q = { n };
          stone(toRoman(n));
          window.__hwAns = n;
          pad = KIT.numpad(host, { max: 3, onEnter: (v) => medAnswer(v) });
          quiet(`What number is <b style="font-family:Georgia,serif">${toRoman(n)}</b>? Type it.`, `What number is this Roman numeral: ${romanSpeak(toRoman(n))}? Type it.`);
        } else {
          const n = pickInt(14, 100);
          q = { n };
          built = "";
          stone("");
          text(view, 500, 395, `Write ${n}`, { "font-size": 40, fill: "var(--accent-dark)" });
          window.__hwAns = toRoman(n);
          host.innerHTML = `<div class="hw-keys">${["I", "V", "X", "L", "C"].map((s) => `<button type="button" data-r="${s}">${s}</button>`).join("")}<button type="button" class="sm" data-r="del" aria-label="Delete">⌫</button><button type="button" class="ok" data-r="ok">✓</button></div>`;
          host.onclick = (e) => {
            const b = e.target.closest("[data-r]");
            if (!b || my !== token || g.busy) return;
            window.OC?.touch();
            const r = b.dataset.r;
            if (r === "del") built = built.slice(0, -1);
            else if (r === "ok") return hardCheck();
            else if (built.length < 9) {
              built += r;
              MUSIC.play("woodblock", 79, { gain: 0.3 });
            }
            shown.textContent = built;
            shown.setAttribute("font-size", built.length > 6 ? 90 : 130);
          };
          say(`Write <b>${n}</b> in Roman numerals. Use the buttons, then press ✓.`);
        }
      },
    });
    const easyAnswer = async (v, b) => {
      if (my !== token || g.busy) return;
      if (v === q.n) {
        b.classList.add("right");
        q.label.textContent = `${q.n} = ${toRoman(q.n)}`;
        q.label.setAttribute("font-size", 44);
        Object.entries(ser).forEach(([k, v]) => q.label.setAttribute(k, v));
        return g.win(`${pick(GOOD)} ${q.n} coins. In Roman numerals that is ${romanSpeak(toRoman(q.n))}.`, 900);
      }
      b.classList.add("wrong");
      await g.miss("Count the coins again, touching each one. Remember: I is 1, V is 5, X is 10.", `There are ${q.n} coins. ${q.n} is ${romanSpeak(toRoman(q.n))}.`, () => $("[data-choices]").querySelectorAll("button").forEach((x) => x.textContent === toRoman(q.n) && x.classList.add("right")));
    };
    const parts = (n) => {
      const t = Math.floor(n / 10) * 10;
      const o = n % 10;
      return [t, o].filter(Boolean);
    };
    const medAnswer = async (v) => {
      if (my !== token || g.busy) return;
      if (v === q.n) return g.win(`${pick(GOOD)} ${parts(q.n).map((p) => `${romanSpeak(toRoman(p))} is ${p}`).join(", and ")}. Together: ${q.n}.`, 900);
      pad?.clear();
      const [t, o] = parts(q.n);
      await g.miss(`Split it into parts. ${romanSpeak(toRoman(t))} is how much? ${o ? `And ${romanSpeak(toRoman(o))}?` : ""}`, `${parts(q.n).map((p) => `${romanSpeak(toRoman(p))} is ${p}`).join(", and ")}. Together that is ${q.n}.`, () => pad?.set(q.n));
    };
    const hardCheck = async () => {
      const want = toRoman(q.n);
      if (built === want) return g.win(`${pick(GOOD)} ${q.n} is ${romanSpeak(want)}.`, 900);
      const val = built ? fromRoman(built) : 0;
      const [t, o] = parts(q.n);
      const hint = val === q.n ? `That does add up to ${q.n}, but Romans wrote it the short way. A small numeral before a bigger one takes away: IV is 4, IX is 9, XL is 40, XC is 90.` : `Split ${q.n} into ${t}${o ? ` and ${o}` : ""}. How do Romans write ${t}? ${o ? `Then ${o}?` : ""}`;
      await g.miss(hint, `${q.n} is ${parts(q.n).map((p) => `${romanSpeak(toRoman(p))} for ${p}`).join(", then ")}.`, () => {
        built = want;
        shown.textContent = want;
      });
    };
    onLevels("w6", (lv) => {
      level = lv;
      g.restart();
    });
    g.restart();
  },

  // Famous people
  w7() {
    const my = token;
    const MODES = [["learn", "📖 Meet them"], ["easy", "🐣 Find"], ["medium", "🦊 Who am I?"], ["hard", "🦁 Who came first?"]];
    let mode = levelOf("w7", "learn", MODES.map((m) => m[0]));
    panel(`${modeRow(MODES, mode)}<div class="hw-pick" data-choices></div>`);
    let q = null;
    let order = [];
    let met = new Set();
    const cardW = 158;
    const cardH = 252;
    const grid = (only) => {
      fresh();
      const list = only || PEOPLE;
      const cols = only ? only.length : 6;
      const gap = only ? 80 : 8;
      const w = only ? 300 : cardW;
      const h = only ? 400 : cardH;
      const x0 = (W - (cols * w + (cols - 1) * gap)) / 2;
      list.forEach((p, i) => {
        const col = i % cols;
        const row = Math.floor(i / cols);
        const g = el("g", { class: "hw-card", "data-id": p.id, transform: `translate(${x0 + col * (w + gap)} ${only ? 70 : 16 + row * (h + 14)})` }, view);
        el("rect", { width: w, height: h, rx: 20, fill: "#fffaf0", stroke: met.has(p.id) && mode === "learn" ? "#3f7d4e" : "var(--accent)", "stroke-width": 4 }, g);
        el("circle", { cx: w / 2, cy: only ? 120 : 70, r: only ? 84 : 52, fill: "var(--accent-soft)" }, g);
        emoji(g, w / 2, only ? 116 : 66, p.icon, only ? 100 : 60);
        const lines = wrapLines(p.name, only ? 20 : 11);
        lines.forEach((ln, j) => text(g, w / 2, (only ? 250 : 152) + j * 27, ln, { "font-size": only ? 30 : 22, fill: INK }));
        if (mode === "learn" || only) text(g, w / 2, only ? 330 : 232, only ? p.when : p.short || p.when.replace(/^(about|died in) /, ""), { "font-size": only ? 28 : 22, fill: "var(--accent-dark)" });
      });
      view.addEventListener("pointerdown", (event) => {
        const c = event.target.closest(".hw-card");
        if (c) tap(c.dataset.id, c);
      });
    };
    const detail = (p) => {
      const g = el("g", { class: "hw-card", "data-id": "close" }, view);
      el("rect", { x: 0, y: 0, width: W, height: H, fill: "rgba(245,239,228,.92)" }, g);
      el("rect", { x: 40, y: 24, width: 920, height: 512, rx: 30, fill: "#fff", stroke: "var(--accent)", "stroke-width": 5 }, g);
      el("circle", { cx: 170, cy: 160, r: 100, fill: "var(--accent-soft)" }, g);
      emoji(g, 170, 156, p.icon, 120);
      text(g, 620, 110, p.name, { "font-size": 44, fill: INK });
      text(g, 300, 180, "📍", { "font-size": 30, "text-anchor": "start" });
      textBlock(g, 350, 180, p.where, 38, 26, 32, { "text-anchor": "start" });
      text(g, 300, 260, "🕰️", { "font-size": 30, "text-anchor": "start" });
      text(g, 350, 260, p.when, { "font-size": 26, fill: INK, "text-anchor": "start" });
      text(g, 90, 340, "⭐", { "font-size": 30, "text-anchor": "start" });
      textBlock(g, 140, 340, p.known, 52, 27, 36, { "text-anchor": "start" });
      text(g, 500, 508, "Tap anywhere to close", { "font-size": 22, fill: "var(--muted)" });
    };
    const g = rounds("w7", my, {
      total: 8,
      noun: "Question",
      count: "famous people",
      ask() {
        $("[data-choices]").innerHTML = "";
        if (mode === "easy" || mode === "medium") {
          if (g.round === 0) order = shuffle(PEOPLE);
          q = order[g.round];
          grid();
          window.__hwAns = q.id;
          if (mode === "easy") say(`Find <b>${q.name}</b>. Look for ${q.sym}!`);
          else say(`Who am I? ${q.clue}`);
        } else {
          let a;
          let b;
          do {
            a = pick(PEOPLE);
            b = pick(PEOPLE);
          } while (a === b || a.unsure || b.unsure || Math.abs(a.year - b.year) < 60);
          q = { pair: shuffle([a, b]) };
          q.first = a.year < b.year ? a : b;
          window.__hwAns = q.first.id;
          grid(q.pair);
          say(`Who lived longer ago: ${q.pair[0].name} or ${q.pair[1].name}? Tap the card.`);
        }
      },
    });
    const learn = () => {
      grid();
      $("[data-status]").textContent = `Met ${met.size} of 12`;
      say("Tap a card to meet a famous person from long ago.");
    };
    const tap = async (id, node) => {
      if (my !== token) return;
      window.OC?.touch();
      if (mode === "learn") {
        if (id === "close") {
          node.remove();
          learn();
          return;
        }
        const p = PEOPLE.find((x) => x.id === id);
        if (!met.has(id)) window.OC?.count("people met");
        met.add(id);
        detail(p);
        MUSIC.play("harp", 72, { gain: 0.3 });
        $("[data-status]").textContent = `Met ${met.size} of 12`;
        say(`<b>${p.name}</b>. From ${p.where}, ${p.when}. ${p.known}`);
        if (met.size === 12) shell.mark("w7", { done: true });
        return;
      }
      if (g.busy) return;
      const rect = node.querySelector("rect");
      if (mode === "hard") {
        const p = q.first;
        const other = q.pair.find((x) => x !== p);
        if (id === p.id) {
          rect.setAttribute("fill", "#e3f4e7");
          return g.win(`${pick(GOOD)} ${p.name}, ${p.when}, lived before ${other.name}, ${other.when}.`, 1000);
        }
        rect.setAttribute("fill", "#f6dcd4");
        const hint = other.year < 0 && p.year < 0 ? "Look at the dates. Both are BC. With BC, a bigger number is longer ago. Which number is bigger?" : "Look at the dates on the cards. Which is longer ago?";
        await g.miss(hint, `${p.name} lived ${p.when}. That is longer ago than ${other.name}, ${other.when}.`, () => view.querySelector(`.hw-card[data-id="${p.id}"] rect`)?.setAttribute("fill", "#e3f4e7"));
        return;
      }
      if (id === q.id) {
        rect.setAttribute("fill", "#e3f4e7");
        return g.win(`${pick(GOOD)} That is ${q.name}. ${q.known}`, 1000);
      }
      rect.setAttribute("fill", "#f6dcd4");
      setTimeout(() => rect.setAttribute("fill", "#fffaf0"), 700);
      const other = PEOPLE.find((x) => x.id === id);
      await g.miss(mode === "easy" ? `That is ${other.name}. Look for ${q.sym}.` : `That is ${other.name}. Listen again: ${q.clue}`, `It was ${q.name}, with ${q.sym}. ${q.known}`, () => view.querySelector(`.hw-card[data-id="${q.id}"] rect`)?.setAttribute("fill", "#e3f4e7"));
    };
    const start = () => (mode === "learn" ? learn() : g.restart());
    onLevels("w7", (lv) => {
      mode = lv;
      start();
    });
    start();
  },

  // Try it for real
  w8() {
    const my = token;
    let cur = shell.progress().w8?.level || "nile";
    if (!REAL.some((r) => r.k === cur)) cur = "nile";
    panel(`<div class="ap-row"><div class="ap-chips" data-levels>${REAL.map((r) => `<button type="button" data-lv="${r.k}" aria-pressed="${r.k === cur}">${r.icon} ${r.chip}</button>`).join("")}</div></div><div class="ap-buttons"><button type="button" class="primary" data-did>✅ We did it!</button></div>`);
    const show = () => {
      const r = REAL.find((x) => x.k === cur);
      fresh();
      el("rect", { x: 14, y: 10, width: 972, height: 540, rx: 30, fill: "#fffaf0", stroke: "var(--accent)", "stroke-width": 5 }, view);
      emoji(view, 70, 56, r.icon, 52);
      text(view, 110, 70, r.title, { "font-size": 34, fill: INK, "text-anchor": "start" });
      text(view, 40, 128, "You need:", { "font-size": 23, fill: "var(--accent-dark)", "text-anchor": "start" });
      r.stuff.forEach(([ic, name], i) => {
        const x = 220 + i * 156;
        emoji(view, x, 116, ic, 40);
        textBlock(view, x, 170, name, 12, 20, 22, {});
      });
      r.steps.forEach((s, i) => {
        const y = 240 + i * 70;
        el("circle", { cx: 60, cy: y + 8, r: 22, fill: "var(--accent)" }, view);
        text(view, 60, y + 16, i + 1, { "font-size": 24, fill: "#fff" });
        textBlock(view, 96, y + 2, s, 64, 23, 28, { "text-anchor": "start" });
      });
      el("rect", { x: 40, y: 500, width: 920, height: 40, rx: 20, fill: "#fff3d6" }, view);
      text(view, 500, 528, "🧑‍🍳 Do this with a grown-up. Wash your hands after.", { "font-size": 22, fill: "#8e4d24" });
      quiet(`<b>${r.title}</b>. Read the steps with a grown-up, then make it!`, `${r.title}. ${r.steps.join(" ")} Do this with a grown-up.`);
    };
    onLevels("w8", (lv) => {
      cur = lv;
      show();
    });
    $("[data-did]").addEventListener("click", () => {
      if (my !== token) return;
      MUSIC.chime();
      confetti();
      window.OC?.count("real-life projects");
      window.OC?.touch();
      shell.mark("w8", { done: true });
      say("🎉 Wonderful! You made history with your own hands. Tell someone what you made!");
    });
    show();
  },
};

const shell = SHELL({
  units: UNITS,
  how: {
    w0: { icon: "👀", title: "See it", steps: ["Watch the pictures.", "Press Next ▶ to go on.", "Press Let's play when you are ready."] },
    w1: { icon: "🌍", title: "Continents & oceans", steps: ["Listen for the place's name.", "Tap it on the map, or drag the label there.", "Hard: which continent is the country in?"] },
    w2: { icon: "⏳", title: "Timeline", steps: ["Look at the cards.", "Tap the one that happened longest ago.", "Keep going until the timeline is in order."] },
    w3: { icon: "🐫", title: "Ancient Egypt", steps: ["The Nile: tap the thing I name.", "Spell it: tap the pictures for each letter.", "My name: write your name in hieroglyphs!"] },
    w4: { icon: "🧱", title: "Mesopotamia", steps: ["Tap the clay to press wedges.", "A tall wedge is 1. A sideways wedge is 10.", "Fair rules: tap the rule that is fair."] },
    w5: { icon: "🧭", title: "Great civilisations", steps: ["Look at the picture of the old city.", "Listen to the question.", "Tap the picture or the answer."] },
    w6: { icon: "🏛️", title: "Roman numerals", steps: ["I is 1, V is 5, X is 10, L is 50, C is 100.", "Read the numeral on the stone.", "Tap or type your answer."] },
    w7: { icon: "👑", title: "Famous people", steps: ["Meet them: tap a card to hear their story.", "Find: tap the person I name.", "Who came first: tap who lived longer ago."] },
    w8: { icon: "🏠", title: "Try it for real", steps: ["Pick a project at the bottom.", "Get the things you need, with a grown-up.", "Make it, then press We did it!"] },
  },
  start: "w0",
  onStop() {
    token += 1;
    $("[data-panel]").onclick = null;
    stage.onpointermove = null;
    stage.onpointerup = null;
  },
  subject: "History",

  onUnit(id) {
    token += 1;
    VOICE.hush();
    units[id]();
  },
});
