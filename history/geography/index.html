  if (lat > 30 && lat < 47.5 && lon > -5.5 && lon < 42 && !(lat > 43 && lon < 0)) return null; // Mediterranean and Black Sea
  if (lat > 50 && lat < 66 && lon > 9 && lon < 32) return null; // Baltic
  if (lat > 50 && lat < 65 && lon > -96 && lon < -76) return null; // Hudson Bay
  if (lat > 58 && lat < 76 && lon > -45 && lon < 30) return null; // Greenland and Norwegian Seas
  if (lat >= 66) return "Arctic";
  if (lat > 12 && lat < 31 && lon > 32 && lon < 57) return null; // Red Sea and Persian Gulf
  if (lat > -18 && lat < 10 && lon > 100 && lon < 147) return null; // among the islands of Indonesia
  if (lon >= 147 || lon <= -180 + 0.0001) return "Pacific";
  if (lat < -30) {
    if (lon >= 20 && lon < 147) return "Indian";
    if (lon >= -66 && lon < 20) return "Atlantic";
    if (lon < -71) return "Pacific";
    return null;
  }
  if (lat < 8) {
    if (lon >= 32 && lon <= 100) return "Indian";
    if (lon >= 100 && lon < 147 && lat < -18) return "Indian";
    if (lon > -64 && lon < 20) return "Atlantic";
    if (lon < -72) return "Pacific";
    if (lon >= 100) return "Pacific";
    return null;
  }
  if (lat < 18) {
    if (lon >= 32 && lon < 99) return "Indian";
    if (lon >= 100) return "Pacific";
    if (lon > -83 && lon < 20) return "Atlantic";
    if (lon < -86) return "Pacific";
    return null;
  }
  if (lat < 32) {
    if (lon >= 57 && lon < 99) return "Indian";
    if (lon >= 105) return "Pacific";
    if (lon > -98 && lon < 20) return "Atlantic";
    if (lon < -106) return "Pacific";
    return null;
  }
  if (lon > -100 && lon < 20) return "Atlantic";
  if (lon <= -110 || lon >= 120) return "Pacific";
  return null;
}

// ---------- the question engine ----------
// q: { ask, draw(q, api), opts?, pad?, tapOnly?, ans | check(v), hint(v), why, show(live), mark(v, ok), ansText, unit }
// api.pick(v) lets a tap on the map answer the question.
function game(id, cfg) {
  const my = token;
  const alive = () => my === token;
  const R = cfg.rounds || 8;
  let level = shell.progress()[id]?.level || "easy";
  let round = 0;
  let q = null;
  let tries = 0;
  let busy = false;
  let gen = 0;
  const bags = {};
  const ctx = {
    // draw without repeats until the bag is empty
    next(key, list) {
      if (!bags[key]?.length) bags[key] = shuffle(list);
      return bags[key].pop();
    },
    state: {},
  };
  panel(`${levelRow(level, !!TRY[id], cfg.extra || "")}<div class="gg-pick" data-choices></div>`);
  const host = $("[data-choices]");
  $("[data-try]")?.addEventListener("click", () => {
    window.OC?.touch();
    tryCard(id);
  });
  const status = (s) => {
    const b = $("[data-status]");
    if (b) b.textContent = s || `Question ${Math.min(round + 1, R)} of ${R}`;
  };
  const isRight = (v) => (q.check ? q.check(v) : v === q.ans);
  const ask = () => {
    if (!alive()) return;
    q = cfg.make(level, round, ctx);
    tries = 0;
    busy = false;
    const g = ++gen;
    q.live = () => alive() && g === gen;
    fresh(q.bg);
    q.draw?.(q, { pick: (v) => answer(v) });
    status();
    if (q.pad) {
      host.onclick = null;
      host.innerHTML = `<div class="gg-padwrap">${q.unit ? `<span class="gg-unit">${q.unit}</span>` : ""}</div>`;
      const wrap = host.firstChild;
      const padHost = document.createElement("div");
      wrap.prepend(padHost);
      q.padApi = numpad(padHost, { max: q.max || 5, onEnter: (n) => answer(n) });
    } else if (q.opts) choices(host, q.opts, (c, b) => answer(c.v, b));
    else {
      host.innerHTML = `<div class="ap-buttons"><button type="button" data-again>🔁 Hear it again</button></div>`;
      host.onclick = (event) => {
        if (event.target.closest("[data-again]")) say(q.ask);
      };
    }
    say(q.ask);
    window.__ggq = q;
    window.__ggPick = (val) => answer(val, host.querySelector(`[data-c="${q.opts ? q.opts.findIndex((o) => o.v === val) : -1}"]`) || undefined);
  };
  const answer = async (v, button) => {
    if (!alive() || busy || !q) return;
    window.OC?.touch();
    const live = q.live;
    if (isRight(v)) {
      busy = true;
      button?.classList.add("right");
      host.querySelectorAll("[data-c]").forEach((b) => (b.disabled = b !== button));
      q.mark?.(v, true);
      MUSIC.chime();
      say(`${tries ? "Correct — you revised your thinking." : pick(["Correct.", "Correct — and here is why:", "Exactly right.", "Correct. Good reasoning."])} ${q.why}`);
      if (q.show) await q.show(live);
      if (!live()) return;
      return done();
    }
    tries += 1;
    MUSIC.oops();
    if (button) {
      button.classList.add("wrong");
      button.disabled = true;
    }
    q.mark?.(v, false);
    q.padApi?.clear();
    if (tries < 2) {
      say(`Not quite. Consider: ${typeof q.hint === "function" ? q.hint(v) : q.hint || "look again carefully."}`);
      return;
    }

      const f = pick(town);
      let nodes = {};
      const scaleTxt = kind === "scale1" ? "1 km" : kind === "scale500" ? "500 m" : "";
      const base = { draw: () => (nodes = drawTown(view, town, { scale: scaleTxt })) };
      if (kind === "gridWhat") {
        const others = shuffle(town.filter((x) => x !== f)).slice(0, 2);
        return {
          ...base,
          ask: `What is in square <b>${ref(f.c, f.r)}</b>? Use the key.`,
          opts: labelled(shuffle([f, ...others]), (x) => cap1(x.name)),
          check: (v) => v === f,
          hint: `Find column ${LETTERS[f.c]} along the top, then row ${f.r + 1} down the side. Where do they meet?`,
          why: `Column ${LETTERS[f.c]}, row ${f.r + 1}: square ${ref(f.c, f.r)} holds the ${f.name}. Letter first, then number.`,
          mark: (v, ok) => ok && hiCell(nodes, f.name, "rgba(34,160,90,.3)"),
        };
      }
      if (kind === "gridWhere") {
        const right = ref(f.c, f.r);
        const near = [ref(f.c, (f.r + 1) % TROWS), ref((f.c + 1) % TCOLS, f.r), ref(Math.min(f.r, TCOLS - 1), Math.min(f.c, TROWS - 1)), ref((f.c + 2) % TCOLS, (f.r + 2) % TROWS)].filter((x) => x !== right);
        return {
          ...base,
          ask: `In which square is the <b>${f.name}</b>?`,
          opts: labelled(shuffle([right, ...shuffle([...new Set(near)]).slice(0, 2)])),
          ans: right,
          hint: `Find the ${f.name} symbol (${f.icon}). Read the letter above it first, then the number beside it.`,
          why: `The ${f.name} is in column ${LETTERS[f.c]} and row ${f.r + 1}, so its grid reference is ${right}.`,
          mark: (v, ok) => ok && hiCell(nodes, f.name, "rgba(34,160,90,.3)"),
        };
      }
      if (kind === "dir4" || kind === "dir8") {
        const d = dir8(a, b);
        const pool8 = kind === "dir4" ? ["north", "east", "south", "west"] : DIR8;
        const opts = kind === "dir4" ? pool8 : optsOf(d, pool8, 4);
        let arrow = null;
        return {
          draw: () => {
            nodes = drawTown(view, town);
            hiCell(nodes, a.name, "rgba(224,96,47,.22)");
            hiCell(nodes, b.name, "rgba(47,127,193,.22)");
          },
          ask: `The <b>${b.name}</b> is ___ of the <b>${a.name}</b>. North is at the top.`,
          opts: labelled(opts, (x) => `${cap1(x)} (${ABBR[x]})`),
          ans: d,
          hint: kind === "dir4" ? `Start at the ${a.name} and move toward the ${b.name}. Is that up (north), down (south), right (east) or left (west)?` : `Start at the ${a.name}. Do you move up or down, and left or right? Combine them, with north or south first: up and right is north-east.`,
          why: `From the ${a.name} you travel ${d} to reach the ${b.name}.${d.includes("-") ? ` It is ${Math.abs(b.c - a.c)} across and ${Math.abs(b.r - a.r)} ${b.r > a.r ? "down" : "up"}: equal steps, so exactly ${d}.` : ""}`,
          show: async () => {
            arrow ||= arrowBetween(view, a, b);
          },
        };
      }
      if (kind === "scale1" || kind === "scale500") {
        const n = Math.abs(b.c - a.c) + Math.abs(b.r - a.r);
        const per = kind === "scale1" ? 1 : 500;
        const unit = kind === "scale1" ? "km" : "m";
        return {
          draw: () => {
            nodes = drawTown(view, town, { scale: scaleTxt });
            hiCell(nodes, a.name, "rgba(224,96,47,.22)");
            hiCell(nodes, b.name, "rgba(47,127,193,.22)");
          },
          ask: `How far is it from the center of the <b>${a.name}</b> square to the center of the <b>${b.name}</b> square? One square is ${per} ${unit}.`,
          pad: true,
          unit,
          ans: n * per,
          hint: `Count the squares between the two centers (${b.c === a.c ? "up or down" : "across"}), then multiply by ${per} ${unit}.`,
          why: `${n} squares × ${per} ${unit} = ${fmt(n * per)} ${unit}.`,
          show: async () => {
            arrowBetween(view, a, b);
          },
        };
      }
      if (kind === "bearing") {
        const d = dir8(a, b);
        const deg = DIR8.indexOf(d) * 45;
        return {
          draw: () => {
            nodes = drawTown(view, town);
            hiCell(nodes, a.name, "rgba(224,96,47,.22)");
            hiCell(nodes, b.name, "rgba(47,127,193,.22)");
          },
          ask: `What is the bearing from the <b>${a.name}</b> to the <b>${b.name}</b>? A bearing is measured in degrees clockwise from north.`,
          pad: true,
          max: 3,
          unit: "degrees",
          ans: deg,
          check: (v) => v === deg || (deg === 0 && v === 360),
          ansText: `${deg}°`,
          hint: `First name the direction (it is one of the eight compass points). North is 0°, east is 90°, south is 180°, west is 270°. Each half-step between them is 45°.`,
          why: `The ${b.name} is ${d} of the ${a.name}. Turning clockwise from north to ${d} is ${DIR8.indexOf(d)} × 45° = ${deg}°.`,
          show: async () => {
            arrowBetween(view, a, b);
          },
        };
      }
      if (kind === "pyth") {
        const s = pick([100, 200, 250, 500, 1000]);
        const dc = Math.abs(b.c - a.c);
        const dr = Math.abs(b.r - a.r);
        return {
          draw: () => {
            nodes = drawTown(view, town, { scale: `${fmt(s)} m` });
            hiCell(nodes, a.name, "rgba(224,96,47,.22)");
            hiCell(nodes, b.name, "rgba(47,127,193,.22)");
          },
          ask: `How far is it in a straight line from the <b>${a.name}</b> to the <b>${b.name}</b> (center to center)? One square is ${fmt(s)} m.`,
          pad: true,
          unit: "m",
          ans: 5 * s,
          hint: `It is ${dc} squares across and ${dr} squares ${b.r > a.r ? "down" : "up"}. The straight line is the longest side of a right triangle. What does a² + b² = c² give?`,
          why: `${dc}² + ${dr}² = ${dc * dc} + ${dr * dr} = 25 = 5², so the straight line is 5 squares (Pythagoras' theorem). 5 × ${fmt(s)} m = ${fmt(5 * s)} m.`,
          show: async () => {
            const [x1, y1] = cellXY(a);
            const [x2, y2] = cellXY(b);
            el("path", { d: `M${x1} ${y1} L${x2} ${y1} L${x2} ${y2}`, fill: "none", stroke: "#3b78b0", "stroke-width": 4, "stroke-dasharray": "8 6" }, view);
            arrowBetween(view, a, b);
          },
        };
      }
      // ratio scale
      const sc = pick([10000, 20000, 25000, 50000, 100000]);
      const cm = pickInt(2, 9);
      const metres = (cm * sc) / 100;
      return {
        draw: () => {
          nodes = drawTown(view, town);
          hiCell(nodes, a.name, "rgba(224,96,47,.22)");
          hiCell(nodes, b.name, "rgba(47,127,193,.22)");
          arrowBetween(view, a, b, "#3b78b0");
          tag(view, 500, 535, `Map scale 1 : ${fmt(sc)}   ·   on paper: ${cm} cm`, { size: 24 });
        },
        ask: `On a map with scale 1 : ${fmt(sc)}, the ${a.name} and the ${b.name} are ${cm} cm apart on paper. How far apart are they really, in meters?`,
        pad: true,
        max: 5,
        unit: "m",
        ans: metres,
        hint: `1 : ${fmt(sc)} means 1 cm on the map stands for ${fmt(sc)} cm in real life. How many meters is ${fmt(sc)} cm? (100 cm = 1 m.)`,
        why: `1 cm stands for ${fmt(sc)} cm = ${fmt(sc / 100)} m. So ${cm} cm stands for ${cm} × ${fmt(sc / 100)} m = ${fmt(metres)} m${metres >= 1000 ? `, which is ${metres / 1000} km` : ""}.`,
      };
    },
  });
}

// ---------- 2. LATITUDE & LONGITUDE ----------
const LINES = [
  { k: "equator", name: "Equator (0°)", lat: 0, col: HOT },
  { k: "cancer", name: "Tropic of Cancer (≈23.4°N)", lat: TROPIC, col: "#c4632b" },
  { k: "capricorn", name: "Tropic of Capricorn (≈23.4°S)", lat: -TROPIC, col: "#c4632b" },
  { k: "arctic", name: "Arctic Circle (≈66.6°N)", lat: POLAR, col: "#3b78b0" },
  { k: "antarctic", name: "Antarctic Circle (≈66.6°S)", lat: -POLAR, col: "#3b78b0" },
  { k: "prime", name: "Prime meridian (0°)", lon: 0, col: "#7a3fb0" },
];
function gridMap(v, step = 30, labels = true) {
  const P = WORLD([10, 8, 980, 544]);
  const map = worldMap(v, P, { grid: step, dots: false });
  if (labels) {
    const lab = el("g", { "pointer-events": "none" }, map.g);
    for (let lat = -60; lat <= 60; lat += 30) tag(lab, P.x(-180) + 8, P.y(lat) + 8, lat ? `${Math.abs(lat)}°${lat > 0 ? "N" : "S"}` : "0°", { size: 22, anchor: "start" });
    for (let lon = -120; lon <= 120; lon += 60) tag(lab, P.x(lon), P.y(-84) + 6, lon ? `${Math.abs(lon)}°${lon > 0 ? "E" : "W"}` : "0°", { size: 22 });
  }
  return map;
}
function drawLine(map, L, width = 4) {
  const P = map.P;
  if (L.lon !== undefined) return el("line", { x1: P.x(L.lon), x2: P.x(L.lon), y1: P.y(90), y2: P.y(-90), stroke: L.col, "stroke-width": width, "pointer-events": "none" }, map.g);
  return el("line", { x1: P.x(-180), x2: P.x(180), y1: P.y(L.lat), y2: P.y(L.lat), stroke: L.col, "stroke-width": width, "stroke-dasharray": L.lat ? "12 6" : null, "pointer-events": "none" }, map.g);
}
const clock = (h) => `${String(((h % 24) + 24) % 24).padStart(2, "0")}:00`;

function unitLatLong() {
  game("g2", {
    count: "coordinates read",
    make(level, round, ctx) {
      const kinds = { easy: ["hemiNS", "lineName", "hemiEW", "whichSouth", "zone", "lineName"], medium: ["coords", "tapAt", "cityAt", "zone", "coords", "tapAt"], hard: ["kmLat", "antipode", "timeLon", "polarCalc", "coords", "kmLon", "tapAt", "kmLat"] }[level];
      const kind = ctx.next(level + "k", kinds);
      let map = null;
      const pickCity = (filter) => {
        const list = CITIES.filter(filter);
        let c = CITY[ctx.next(level + "city", CITIES.map((x) => x.name))];
        for (let i = 0; i < 60 && !filter(c); i++) c = CITY[ctx.next(level + "city", CITIES.map((x) => x.name))];
        return filter(c) ? c : pick(list);
      };
      const showPin = (c, label = c.name) => async () => {
        pin(view, map.P, c.lon, c.lat, label);
      };
      if (kind === "hemiNS" || kind === "hemiEW") {
        const ns = kind === "hemiNS";
        const c = pickCity((x) => (ns ? Math.abs(x.lat) > 0.1 : Math.abs(x.lon) > 2));
        const ans = ns ? (c.lat > 0 ? "Northern" : "Southern") : c.lon > 0 ? "Eastern" : "Western";
        return {
          draw: () => {
            map = gridMap(view);
            drawLine(map, ns ? LINES[0] : LINES[5]);
            pin(view, map.P, c.lon, c.lat, c.name);
          },
          ask: `Is <b>${c.name}</b> in the ${ns ? "Northern or Southern" : "Eastern or Western"} Hemisphere?`,
          opts: labelled(ns ? ["Northern", "Southern"] : ["Eastern", "Western"], (x) => `${x} Hemisphere`),
          ans,
          hint: ns ? "The equator (the solid orange line) divides north from south. Is the pin above it or below it?" : "The prime meridian (the purple line) divides east from west. Is the pin to its right (east) or left (west)?",
          why: `${c.name} lies at about ${llTxt(c.lat, c.lon)}, so it is in the ${ans} Hemisphere.${c.name === "Quito" ? " Quito is only about 0.2° south of the equator, about 25 km." : ""}`,
        };
      }
      if (kind === "lineName") {
        const L = ctx.next(level + "line", LINES);
        return {
          draw: () => {
            map = gridMap(view);
            drawLine(map, L, 6);
          },
          ask: "Which line is drawn in color?",
          opts: labelled(optsOf(L, LINES, 4), (x) => x.name),
          ans: L,
          hint: L.lon !== undefined ? "Does this line run north–south or east–west? Lines of longitude (meridians) run from pole to pole." : `Is the line north or south of the equator, and is it near the tropics (about 23°) or near the poles (about 67°)?`,
          why: {
            equator: "The equator, 0° latitude, is halfway between the poles. It divides the Northern and Southern Hemispheres.",
            cancer: "The Tropic of Cancer, at about 23.4°N, is the farthest north that the Sun is ever directly overhead, around 21 June.",
            capricorn: "The Tropic of Capricorn, at about 23.4°S, is the farthest south that the Sun is ever directly overhead, around 21 December.",
            arctic: "The Arctic Circle, at about 66.6°N: north of it, there is at least one day a year when the Sun never sets, and one when it never rises.",
            antarctic: "The Antarctic Circle, at about 66.6°S: south of it, there is at least one day a year of midnight sun, and one of polar night.",
            prime: "The prime meridian, 0° longitude, runs through Greenwich in London. It was chosen at an international conference in 1884.",
          }[L.k],
        };
      }
      if (kind === "whichSouth") {
        const south = pickCity((x) => x.lat < -5);
        const north = shuffle(CITIES.filter((x) => x.lat > 5)).slice(0, 2);
        return {
          draw: () => {
            map = gridMap(view);
            drawLine(map, LINES[0]);
          },
          ask: "Which of these cities is in the <b>Southern</b> Hemisphere?",
          opts: labelled(shuffle([south, ...north]), (x) => x.name),
          ans: south,
          hint: "Picture where each city is. Which one is south of the equator?",
          why: `${south.name} (${south.country}) lies at about ${latTxt(south.lat)}, south of the equator. ${north.map((x) => `${x.name} is at about ${latTxt(x.lat)}`).join("; ")}.`,
          show: async () => {
            for (const c of [south, ...north]) pin(view, map.P, c.lon, c.lat, c.name, { color: c === south ? HOT : "#3b78b0" });
          },
        };
      }
      if (kind === "zone") {
        const c = pickCity((x) => Math.abs(Math.abs(x.lat) - TROPIC) > 1.5 && Math.abs(Math.abs(x.lat) - POLAR) > 1.5);
        const ans = zoneOf(c.lat);
        return {
          draw: () => {
            map = gridMap(view);
            for (const L of LINES.slice(0, 5)) drawLine(map, L, 3);
            pin(view, map.P, c.lon, c.lat, c.name);
          },
          ask: `By latitude alone, which zone is <b>${c.name}</b> in?`,
          opts: labelled(["tropical", "temperate", "polar"], (x) => `${cap1(x)} zone`),
          ans,
          hint: "The tropical zone lies between the two tropics (about 23.4° N and S). The polar zones lie beyond the polar circles (about 66.6°). Everything between is temperate.",
          why: `${c.name} is at about ${latTxt(c.lat)}, which is ${ans === "tropical" ? "between the tropics" : ans === "polar" ? "beyond a polar circle" : "between a tropic and a polar circle"}.${c.name === "Quito" ? " Yet Quito is cool all year, because it stands about 2,850 m above sea level: height matters as well as latitude." : c.name === "Tromsø" ? " Yet the sea there rarely freezes, thanks to warm water carried north by the North Atlantic Current." : c.name === "Mexico City" ? " Yet Mexico City is mild, because it stands about 2,240 m above sea level." : ans === "temperate" && Math.abs(c.lat) < 30 ? ` In practice ${c.name} is hot: deserts and warm seas matter too, so latitude zones are only a first approximation.` : ""}`,
        };
      }
      if (kind === "coords") {
        const c = pickCity((x) => Math.abs(x.lat) > 3 && Math.abs(x.lon) > 3);
        const right = llTxt(c.lat, c.lon);
        const near = level === "hard";
        const wrong = [llTxt(-c.lat, c.lon), llTxt(c.lat, -c.lon), near ? llTxt(c.lat + (c.lat > 0 ? 10 : -10), c.lon) : llTxt(c.lon > 90 || c.lon < -90 ? -c.lat : c.lon, c.lon > 90 || c.lon < -90 ? -c.lon : c.lat), near ? llTxt(c.lat, c.lon + (c.lon > 0 ? -10 : 10)) : llTxt(-c.lat, -c.lon)];
        return {
          draw: () => {
            map = gridMap(view, near ? 10 : 30);
            pin(view, map.P, c.lon, c.lat, c.name);
          },
          ask: `What are the coordinates of <b>${c.name}</b>, to the nearest degree? (Latitude first.)`,
          opts: labelled(shuffle([right, ...shuffle([...new Set(wrong)].filter((x) => x !== right)).slice(0, 3)])),
          ans: right,
          hint: `First: is ${c.name} north or south of the equator? Then: east or west of the prime meridian? Then read how far, using the grid lines (every ${near ? 10 : 30}°).`,
          why: `${c.name} is ${c.lat > 0 ? "north" : "south"} of the equator and ${c.lon > 0 ? "east" : "west"} of the prime meridian: about ${right}. Latitude is always written first.`,
        };
      }
      if (kind === "cityAt") {
        const c = pickCity(() => true);
        const others = shuffle(CITIES.filter((x) => x !== c && (Math.sign(x.lat) !== Math.sign(c.lat) || Math.sign(x.lon) !== Math.sign(c.lon) || Math.abs(x.lat - c.lat) > 15))).slice(0, 2);
        return {
          draw: () => {
            map = gridMap(view);
          },
          ask: `Which city is at about <b>${llTxt(c.lat, c.lon)}</b>?`,
          opts: labelled(shuffle([c, ...others]), (x) => x.name),
          ans: c,
          hint: `Find ${latTxt(c.lat)} first (north or south of the equator), then ${lonTxt(c.lon)} (east or west of the prime meridian). Which city do you know is there?`,
          why: `${c.name} (${c.country}) is at about ${llTxt(c.lat, c.lon)}. ${others.map((x) => `${x.name} is at about ${llTxt(x.lat, x.lon)}`).join("; ")}.`,
          show: async () => {
            pin(view, map.P, c.lon, c.lat, c.name);
          },
        };
      }
      if (kind === "tapAt") {
        let lat;
        let lon;
        do {
          lat = pickInt(-6, 7) * 10;
          lon = pickInt(-17, 17) * 10;
        } while (Math.abs(lat) < 1 && Math.abs(lon) < 1);
        const tol = 7;
        let marks = null;
        const dLon = (a) => Math.abs(((a - lon + 540) % 360) - 180);
        return {
          draw: (q, api) => {
            map = gridMap(view);
            marks = el("g", { "pointer-events": "none" }, view);
            view.addEventListener("pointerdown", (event) => {
              const p = svgPt(view, event);
              const [rx, ry, rw, rh] = map.P.rect;
              if (p.x < rx || p.x > rx + rw || p.y < ry || p.y > ry + rh) return;
              const [lo, la] = map.P.inv(p.x, p.y);
              api.pick([lo, la]);
            });
          },
          ask: `Tap the map at <b>${llTxt(lat, lon)}</b>.`,
          check: (v) => Array.isArray(v) && Math.abs(v[1] - lat) <= tol && dLon(v[0]) <= tol,
          mark: (v, ok) => {
            if (!Array.isArray(v)) return;
            if (!ok) {
              const [x, y] = map.P.p(v[0], v[1]);
              el("circle", { cx: x, cy: y, r: 8, fill: "#8a7764", stroke: "#fff", "stroke-width": 2 }, marks);
            }
          },
          hint: (v) => {
            if (!Array.isArray(v)) return "Find the latitude line first, then the longitude line.";
            const tips = [];
            if (Math.abs(v[1] - lat) > tol) tips.push(v[1] > lat ? "your tap is too far north (too high)" : "your tap is too far south (too low)");
            if (dLon(v[0]) > tol) tips.push((((v[0] - lon + 540) % 360) - 180) > 0 ? "too far east (to the right)" : "too far west (to the left)");
            return `${cap1(tips.join(" and "))}. You tapped near ${llTxt(v[1], v[0])}. Count the grid lines: each is 30°.`;
          },
          ans: [lon, lat],
          ansText: llTxt(lat, lon),
          why: `${llTxt(lat, lon)}: ${lat ? `${Math.abs(lat)}° ${lat > 0 ? "north" : "south"} of the equator` : "on the equator"}, and ${lon ? `${Math.abs(lon)}° ${lon > 0 ? "east" : "west"} of the prime meridian` : "on the prime meridian"}.${oceanAt(lon, lat) && oceanAt(lon, lat) !== "Caspian" ? ` That point is in the ${oceanAt(lon, lat)} Ocean.` : ""}`,
          show: async () => {
            pin(view, map.P, lon, lat, llTxt(lat, lon));
          },
        };
      }
      if (kind === "kmLat") {
        const a = pickInt(-6, 6) * 10;
        let b = pickInt(-6, 7) * 10;
        while (b === a) b = pickInt(-6, 7) * 10;
        const lo = Math.min(a, b);
        const hi = Math.max(a, b);
        const deg = hi - lo;
        return {
          draw: () => {
            map = gridMap(view);
            const P = map.P;
            el("line", { x1: P.x(20), x2: P.x(20), y1: P.y(hi), y2: P.y(lo), stroke: HOT, "stroke-width": 6 }, map.g);
            tag(map.g, P.x(20) + 12, P.y(hi) + 8, latTxt(hi) || "0°", { anchor: "start" });
            tag(map.g, P.x(20) + 12, P.y(lo) + 8, latTxt(lo) || "0°", { anchor: "start" });
          },
          ask: `One degree of latitude is about 111 km. How far is it along a meridian from <b>${latTxt(lo) || "0°"}</b> to <b>${latTxt(hi) || "0°"}</b>?`,
          pad: true,
          unit: "km",
          ans: deg * 111,
          hint: lo < 0 && hi > 0 ? "The two latitudes are on opposite sides of the equator. How many degrees from the first to 0°, and from 0° to the second?" : "How many degrees apart are the two latitudes? Multiply that by 111.",
          why: `${lo < 0 && hi > 0 ? `${-lo}° + ${hi}° = ${deg}°` : `${hi}° − ${lo}° = ${deg}°`} of latitude. ${deg} × 111 km = ${fmt(deg * 111)} km. (Earth's circumference is about 40,000 km, and 40,000 ÷ 360 ≈ 111.)`,
        };
      }
      if (kind === "kmLon") {
        const [lat, ans] = pick([[60, 56], [0, 111], [90, 0]]);
        const opts = [111, 56, 28, 0];
        return {
          draw: () => {
            map = gridMap(view, 30);
            drawLine(map, { lat, col: HOT }, 5);
          },
          ask: `Meridians meet at the poles. About how long is one degree of <b>longitude</b> at ${lat ? `${lat}°N` : "the equator"}? (cos 60° = 0.5)`,
          opts: labelled(opts, (x) => `${x} km`),
          ans,
          hint: "A degree of longitude is about 111 km at the equator. Going north, the meridians get closer and closer together, until they meet at the pole. Multiply 111 by the cosine of the latitude.",
          why: `111 km × cos ${lat}° = 111 × ${lat === 60 ? "0.5 ≈ 56" : lat === 0 ? "1 = 111" : "0 = 0"} km. ${lat === 90 ? "At the pole every meridian meets at a single point." : "Unlike latitude, the length of a degree of longitude shrinks toward the poles."}`,
        };
      }
      if (kind === "antipode") {
        const lat = pickInt(1, 7) * 10 * pick([1, -1]);

// ---------- shared: what did the tap hit? ----------
function onMapTap(map, fn) {
  view.addEventListener("pointerdown", (event) => {
    const p = svgPt(view, event);
    const [rx, ry, rw, rh] = map.P.rect;
    if (p.x < rx || p.x > rx + rw || p.y < ry || p.y > ry + rh) return;
    const [lon, lat] = map.P.inv(p.x, p.y);
    const hit = event.target.closest?.("[data-iso]");
    fn({ iso: hit ? hit.dataset.iso : null, lon, lat });
  });
}
// continents a tap on this country may count for (transcontinental countries split by the usual conventions)
function contsAt(iso, lon) {
  if (iso === "RUS") return [lon < 60 && lon > 0 ? "EU" : "AS"];
  if (iso === "TUR") return [lon < 29.1 ? "EU" : "AS"];
  if (iso === "KAZ") return [lon < 51 ? "EU" : "AS"];
  if (iso === "EGY") return [lon > 32.5 ? "AS" : "AF"];
  if (iso === "IDN") return lon > 130.5 ? ["OC", "AS"] : ["AS"]; // western New Guinea lies on the Australian continental shelf
  const c = COUNTRY[iso];
  if (c) return c.conts;
  return EXTRA_CONT[iso] ? [EXTRA_CONT[iso]] : [];
}

      const keyName = level + cont;
      let c = COUNTRY[ctx.next(keyName, pool.map((x) => x.iso))];
      if (kind === "capOf" || kind === "capCountry") for (let i = 0; i < 40 && !c.cap; i++) c = COUNTRY[ctx.next(keyName, pool.map((x) => x.iso))];
      if (!c.cap && (kind === "capOf" || kind === "capCountry")) kind = "nameIt";
      if (kind === "neighbour" && !(BORDERS[c.iso] || []).some((b) => COUNTRY[b])) kind = "capOf";
      if (kind === "capOf" && !c.cap) kind = "nameIt";
      // neighbours from the same continent first, so distractors are plausible
      const sameCont = (x) => x.iso !== c.iso && x.cont === c.cont;
      const distract = (n, extra = () => true) => {
        let list = COUNTRY_LIST.filter((x) => sameCont(x) && x.tier <= Math.max(maxTier, 2) && extra(x));
        if (list.length < n) list = COUNTRY_LIST.filter((x) => sameCont(x) && extra(x));
        if (list.length < n) list = COUNTRY_LIST.filter((x) => x.iso !== c.iso && extra(x));
        return shuffle(list).slice(0, n);
      };
      const V = VIEWS[viewFor(c)];
      let map = null;
      const drawRegion = (hi) => {
        map = worldMap(view, proj({ ...V, box: [10, 8, 980, 544] }), { fill: (iso) => (COUNTRY[iso] ? LAND : "#e7e2d6") });
        if (hi) highlight(hi, HOT);
      };
      const highlight = (iso, col) => {
        paint(map, iso, col);
        const k = COUNTRY[iso];
        if (k?.dot) {
          const [x, y] = map.P.p(k.dot[1], k.dot[0]);
          el("circle", { cx: x, cy: y, r: 20, fill: "none", stroke: col, "stroke-width": 4, "pointer-events": "none" }, map.g);
        }
      };
      const note = c.note ? ` ${c.note}` : "";
      if (kind === "nameIt") {
        const others = distract(3);
        return {
          draw: () => drawRegion(c.iso),
          ask: "Which country is shown in orange?",
          opts: labelled(shuffle([c, ...others]), (x) => x.name),
          ans: c,
          hint: `Look at its neighbors and its coast. It is in ${CONT_NAME[c.cont]}.${c.dot ? " It is a small country, shown as a dot." : ""}`,
          why: `That is ${nm(c)}${c.cap ? `, whose capital is ${c.cap}` : ""}.${note}`,
        };
      }
      if (kind === "capOf") {
        const trap = TRAPS[c.iso];
        const wrong = distract(trap ? 2 : 3, (x) => !!x.cap).map((x) => x.cap);
        const opts = shuffle([c.cap, ...(trap ? [trap] : []), ...wrong]);
        return {
          draw: () => drawRegion(c.iso),
          ask: `What is the capital of <b>${nm(c)}</b>?`,
          opts: labelled(opts),
          ans: c.cap,
          hint: trap ? `Careful: the largest or most famous city is not always the capital. Which city is the seat of the national government?` : `Think about which of these cities is in ${nm(c)} at all. The others are capitals of nearby countries.`,
          why: `The capital of ${nm(c)} is ${c.cap}.${trap ? ` ${trap} is a major city, but it is not the capital.` : ""}${note}`,
        };
      }
      if (kind === "capCountry") {
        const others = distract(3, (x) => !!x.cap);
        return {
          draw: () => drawRegion(null),
          ask: `<b>${c.cap}</b> is the capital of which country?`,
          opts: labelled(shuffle([c, ...others]), (x) => x.name),
          ans: c,
          hint: "Which of these countries could have a city with that name? Think about the language the name comes from.",
          why: `${c.cap} is the capital of ${nm(c)}.${note}`,
          show: async () => highlight(c.iso, HOT),
        };
      }
      if (kind === "findIt") {
        return {
          draw: (q, api) => {
            drawRegion(null);
            onMapTap(map, (hit) => {
              if (!hit.iso) return say(`That is water. Tap the land of ${nm(c)}.`, { voice: false });
              if (!COUNTRY[hit.iso]) return say(`That is ${NOT_UN[hit.iso] || "a territory"}. Find ${c.name}.`, { voice: false });
              api.pick(hit.iso);
            });
          },
          ask: `Tap <b>${nm(c)}</b>.${c.dot ? " (It is small: look for a dot.)" : ""}`,
          ans: c.iso,
          ansText: c.name,
          mark: (v, ok) => {
            if (v && v !== c.iso && !ok) paint(map, v, "#e6d3c8");
          },
          hint: (v) => (COUNTRY[v] ? `That is ${nm(COUNTRY[v])}. ${cap1(nm(c))} lies to the ${dirFrom(centreOf(v), centreOf(c.iso))} of it.` : "Look again."),
          why: `${cap1(nm(c))} is in ${CONT_NAME[c.cont]}${c.cap ? `; its capital is ${c.cap}` : ""}.${note}`,
          show: async () => highlight(c.iso, GOOD),
        };
      }
      if (kind === "neighbour") {
        const nbs = (BORDERS[c.iso] || []).filter((b) => COUNTRY[b]);
        const right = COUNTRY[pick(nbs)];
        const noted = BORDER_NOTE[c.iso] || [""];
        const others = distract(3, (x) => !nbs.includes(x.iso) && !noted.includes(x.iso) && kmBetween(x.iso, c.iso) > 1500);
        const nonUN = (BORDERS[c.iso] || []).filter((b) => !COUNTRY[b] && NOT_UN[b]).map((b) => NOT_UN[b]);
        return {
          draw: () => drawRegion(c.iso),
          ask: `Which of these countries shares a land border with <b>${nm(c)}</b>?`,
          opts: labelled(shuffle([right, ...others]), (x) => x.name),
          ans: right,
          hint: `${c.name} is the orange country. Which of these could touch it? Think about which are far away.`,
          why: `${cap1(nm(right))} borders ${nm(c)}. Land neighbors of ${nm(c)} (UN member states): ${nbs.map((b) => COUNTRY[b].name).join(", ")}.${nonUN.length ? ` Also on its border: ${nonUN.join(", ")}.` : ""}${noted[0] ? ` ${noted[0]}` : ""}`,
          show: async () => highlight(right.iso, "#8fc3e0"),
        };
      }
      // landlocked
      const ll = shuffle(LANDLOCKED.map((k) => COUNTRY[k]).filter((x) => inCont(x)));
      const ans = ll[0] || COUNTRY.CHE;
      const coastal = shuffle(COUNTRY_LIST.filter((x) => !LANDLOCKED.includes(x.iso) && !CASPIAN.includes(x.iso) && x.cont === ans.cont && !x.dot)).slice(0, 3);
      return {
        draw: () => {
          map = worldMap(view, proj({ ...VIEWS[ans.cont], box: [10, 8, 980, 544] }), { fill: (iso) => (COUNTRY[iso] ? LAND : "#e7e2d6") });
        },
        ask: "Which of these countries is <b>landlocked</b> (it has no coastline on the open sea)?",
        opts: labelled(shuffle([ans, ...coastal]), (x) => x.name),
        ans,
        hint: "Find each one on the map. Which is surrounded entirely by other countries?",
        why: `${cap1(nm(ans))} has no sea coast.${ans.iso === "UZB" || ans.iso === "LIE" ? " In fact it is doubly landlocked: every neighbor is landlocked too (counting the Caspian Sea as a lake). Only Uzbekistan and Liechtenstein are." : ""} Landlocked countries depend on their neighbors for access to ports, which affects their trade.`,
        show: async () => highlight(ans.iso, HOT),
      };
    },
  });
}

function unitPhysical() {
  game("g5", {
    count: "physical geography questions",
    make(level, round, ctx) {
      const kinds = { easy: ["riverName", "fact", "summitCont", "flowsInto", "fact", "riverName"], medium: ["riverName", "plate", "arith", "flowsInto", "fact", "summitCont", "fact"], hard: ["plate", "arith", "flowsNorth", "fact", "riverLong", "plate", "arith", "fact"] }[level];
      const kind = ctx.next(level + "k", kinds);
      let map = null;
      const riverView = (r) => {
        const b = bboxOf(riverOf(r.k));
        const padLon = Math.max(8, (b.lon1 - b.lon0) * 0.35);
        const padLat = Math.max(6, (b.lat0 - b.lat1) * 0.35);
        return proj({ lon0: b.lon0 - padLon, lon1: b.lon1 + padLon, lat0: Math.min(85, b.lat0 + padLat), lat1: Math.max(-85, b.lat1 - padLat), box: [10, 8, 980, 544] });
      };
      const showRiver = (r) => {
        const P = riverView(r);
        map = worldMap(view, P, { dots: false });
        for (const o of RIVERS) if (o !== r) drawRiver(map.inner, P, o.k, { width: 1.6, opacity: 0.55 });
        drawRiver(map.inner, P, r.k, { width: 6, color: "#1d63a8" });
      };
      if (kind === "riverName" || kind === "flowsInto") {
        const pool = level === "easy" ? RIVERS.filter((r) => ["Nile", "Amazon", "Yangtze", "Mississippi", "Volga", "Danube", "Congo", "Ganges", "Thames", "Rhine", "Murray", "Mekong", "Niger", "Zambezi", "Tigris", "Euphrates"].includes(r.k)) : RIVERS;
        const r = ctx.next(level + "river", pool);
        if (kind === "riverName") {
          const same = RIVERS.filter((x) => x !== r && x.cont === r.cont);
          const others = shuffle(same.length >= 2 ? same : RIVERS.filter((x) => x !== r)).slice(0, 2);
          return {
            draw: () => showRiver(r),
            ask: "Which river is drawn in dark blue?",
            opts: labelled(shuffle([r, ...others]), (x) => x.name),
            ans: r,
            hint: `Which continent is this? ${CONT_NAME[r.cont]}. Which great rivers do you know there, and where do they reach the sea?`,
            why: `That is the ${r.name}${r.km ? `, about ${fmt(r.km)} km long` : ""}, flowing into ${r.mouth}.${r.note ? ` ${r.note}` : ""}`,
          };
        }
        const wrong = shuffle([...new Set(RIVERS.filter((x) => OCEAN_OF[x.k] !== OCEAN_OF[r.k]).map((x) => x.mouth))]).slice(0, 2);
        return {
          draw: () => showRiver(r),
          ask: `Where does the <b>${r.name}</b> reach the sea?`,
          opts: labelled(shuffle([r.mouth, ...wrong]), cap1),
          ans: r.mouth,
          hint: "Follow the dark-blue line to the end where it meets open water. Which body of water is that?",
          why: `The ${r.name} flows into ${r.mouth}.${r.note ? ` ${r.note}` : ""}`,
        };
      }
      if (kind === "summitCont") {
        const s = ctx.next(level + "summit", SUMMITS);
        const conts = ["AS", "AF", "EU", "NA", "SA", "OC", "AN"];
        return {
          draw: () => {
            map = worldMap(view, WORLD([10, 8, 980, 544], 85, -90), { dots: false });
            pin(view, map.P, s.lon, s.lat, `${s.name} · ${fmt(s.m)} m`);

  { lv: "medium", q: "Most of Egypt's people live on a small fraction of its land. Where?", a: "Along the Nile valley and delta", o: ["Along the Nile valley and delta", "Spread evenly across the desert", "On the Red Sea islands"], why: "Over 90% of Egyptians live on the narrow strip of fertile land watered by the Nile. An average density for the whole country hides this." },
  { lv: "hard", q: "China spans about 60° of longitude, about four hours of sun time, yet uses a single time zone. What does this show?", a: "Time zones are human decisions, not facts of nature", o: ["Time zones are human decisions, not facts of nature", "The Sun rises at the same moment across China", "China is narrower than it looks on maps"], why: "Solar time is natural (15° of longitude per hour); clock time is chosen by governments. In far-western China the Sun can be highest in the sky after 15:00 by the clock." },
  { lv: "hard", q: "You fly west from Los Angeles across the International Date Line to Tokyo. What happens to the calendar date?", a: "It jumps forward one day", o: ["It jumps forward one day", "It goes back one day", "It stays the same"], why: "Crossing the Date Line westward adds a day; crossing eastward subtracts one. Otherwise a traveler going around the world would gain or lose a whole day." },
  { lv: "hard", q: "Which city is the largest in the world? Why do published lists disagree?", a: "It depends on where you draw the city's boundary: city limits, built-up area or wider region", o: ["It depends on where you draw the city's boundary: city limits, built-up area or wider region", "Cities change size every week", "Some lists count only adults"], why: "Tokyo, Jakarta, Delhi, Shanghai and Dhaka all appear near the top, in different orders, depending on the definition and data used. Always ask: measured how?" },
  { lv: "hard", q: "India and China have about 1.45 and 1.42 billion people; the world has about 8.2 billion. About what share of all people live in these two countries?", a: "about 35%", o: ["about 35%", "about 15%", "about 50%", "about 70%"], why: "1.45 + 1.42 = 2.87 billion; 2.87 ÷ 8.2 ≈ 0.35, so about 35%: roughly one person in three." },
];

function unitPeople() {
  game("g7", {
    count: "human geography questions",
    make(level, round, ctx) {
      const kinds = { easy: ["popPair", "water", "zoneEasy", "fact", "popPair", "water"], medium: ["density", "zone", "water", "popPair", "solar", "fact"], hard: ["densityCalc", "zoneDay", "fact", "density", "zoneDay", "fact", "egyptDensity"] }[level];
      const kind = ctx.next(level + "k", kinds);
      let map = null;
      const world = (fill) => (map = worldMap(view, WORLD([10, 8, 980, 544], 85, -60), { fill: fill || (() => LAND), dots: false }));
      if (kind === "popPair") {
        let a;
        let b;
        do {
          [a, b] = shuffle(POP).slice(0, 2);
        } while (Math.max(a.p, b.p) / Math.min(a.p, b.p) < 1.3);
        const big = a.p > b.p ? a : b;
        return {
          draw: () => {
            world();
            paint(map, a.iso, "#8fc3e0");
            paint(map, b.iso, "#efa077");
          },
          ask: `Which has more people: <b>${a.n}</b> or <b>${b.n}</b>?`,
          opts: labelled([a, b], (x) => x.n),
          ans: big,
          hint: "A large area does not mean many people. Think about deserts, ice and mountains, and about crowded river valleys.",
          why: `${a.n}: about ${fmt(a.p)} million people; ${b.n}: about ${fmt(b.p)} million (UN estimates for 2024).${(a.a && b.a && (a.a > b.a) !== (a.p > b.p)) ? " Notice that the larger country by area has fewer people." : ""}`,
        };
      }
      if (kind === "water") {
        const [city, river] = ctx.next(level + "water", WATER);
        const wrong = shuffle([...new Set(WATER.map((w) => w[1]))].filter((r) => r !== river)).slice(0, 2);
        return {
          draw: () => {
            world();
            for (const r of [river, ...wrong]) if (GEO.rivers[r]) drawRiver(map.inner, map.P, r, { width: 3 });
          },
          ask: `<b>${city}</b> grew up beside which river?`,
          opts: labelled(shuffle([river, ...wrong])),
          ans: river,
          hint: `Which country is ${city} in? Which great river flows through that country?`,
          why: `${city} stands on the ${river}. The river gave water, food and a route for trade${["Cairo", "Khartoum", "Baghdad", "Bamako", "Niamey"].includes(city) ? ", which mattered all the more in a dry land" : ""}.`,
        };
      }
      if (kind === "zoneEasy" || kind === "zone" || kind === "zoneDay") {
        const whole = ZONES.filter((z) => z.o % 1 === 0);
        let A;
        let B;
        if (kind === "zoneEasy") {
          A = ZONES[0];
          B = pick(whole.filter((z) => z.o !== 0 && z.o > -6 && z.o < 10));
        } else {
          const pool = kind === "zoneDay" ? ZONES : whole;
          // without a day change the answer must stay within one day, so keep the gap to 12 hours or less
          do {
            [A, B] = shuffle(pool).slice(0, 2);
          } while (A.o === B.o || (kind === "zone" && Math.abs(B.o - A.o) > 12));
        }
        const diff = B.o - A.o;
        let t;
        if (kind === "zoneDay") t = pickInt(0, 23);
        else {
          do t = pickInt(6, 18);
          while (t + diff < 0 || t + diff > 23);
        }
        const day = pickInt(1, 5);
        const res = t + diff;
        const shift = Math.floor(res / 24);
        const right = kind === "zoneDay" ? `${hhmm(res)} ${DAYS[(day + shift + 7) % 7]}` : hhmm(res);
        const wrongs = [t - diff, res + 1, res - 1, res + (diff > 0 ? -2 : 2)].map((x) => (kind === "zoneDay" ? `${hhmm(x)} ${DAYS[(day + Math.floor(x / 24) + 7) % 7]}` : hhmm(x)));
        const opts = [...new Set([right, ...wrongs])].filter((x, i) => i === 0 || x !== right).slice(0, 4);
        const fmtOff = (o) => `UTC${o >= 0 ? "+" : "−"}${Math.abs(o) % 1 ? `${Math.floor(Math.abs(o))}:30` : Math.abs(o)}`;
        return {
          draw: () => {
            world();
            const ca = CITY[A.n];
            const cb = CITY[B.n];
            const draws = [[A, ca], [B, cb]];
            for (const [z, c] of draws) {
              const lonlat = c ? [c.lon, c.lat] : { "São Paulo": [-46.6, -23.6], Chicago: [-87.6, 41.9], Denver: [-105.0, 39.7], Johannesburg: [28.0, -26.2], Brisbane: [153.0, -27.5] }[z.n];
              if (lonlat) pin(view, map.P, lonlat[0], lonlat[1], `${z.n} ${fmtOff(z.o)}`);
            }
          },
          ask: `In January, when it is <b>${hhmm(t)}${kind === "zoneDay" ? ` on ${DAYS[day]}` : ""}</b> in ${A.n}, what time is it in <b>${B.n}</b>?`,
          opts: labelled(shuffle(opts)),
          ans: right,
          hint: `${A.n} is ${fmtOff(A.o)} and ${B.n} is ${fmtOff(B.o)}. How many hours apart are they, and is ${B.n} ahead (east) or behind (west)?`,
          why: `${B.n} is ${Math.abs(diff)} hour${Math.abs(diff) === 1 ? "" : "s"} ${diff > 0 ? "ahead of" : "behind"} ${A.n} (${fmtOff(B.o)} versus ${fmtOff(A.o)}). ${hhmm(t)} ${diff > 0 ? "+" : "−"} ${Math.abs(diff)} h = ${right}${shift ? `: the clock passes midnight, so the day changes` : ""}.`,
        };
      }
      if (kind === "solar") {
        const lon = pick([-90, -75, -60, -45, -30, -15, 15, 30, 45, 60, 75, 90, 120, 135]);
        const ans = 12 + lon / 15;
        return {
          draw: () => {
            world();
            el("line", { x1: map.P.x(0), x2: map.P.x(0), y1: map.P.y(85), y2: map.P.y(-60), stroke: "#7a3fb0", "stroke-width": 4 }, map.g);
            el("line", { x1: map.P.x(lon), x2: map.P.x(lon), y1: map.P.y(85), y2: map.P.y(-60), stroke: HOT, "stroke-width": 4 }, map.g);
            tag(map.g, map.P.x(0), map.P.y(60), "noon", { size: 22 });
            tag(map.g, map.P.x(lon), map.P.y(40), lonTxt(lon), { size: 22, fill: HOT });
          },
          ask: `When the Sun is highest over the prime meridian (solar noon), what is the solar time at <b>${lonTxt(lon)}</b>? (Earth turns 15° each hour.)`,
          opts: labelled(sorted([...new Set([ans, 24 - ans, ans + 1, ans - 1])]).map(hhmm)),
          ans: hhmm(ans),
          hint: `${Math.abs(lon)}° ÷ 15° = how many hours? Places to the east have already had their noon, so their time is later.`,
          why: `${Math.abs(lon)}° ÷ 15° per hour = ${Math.abs(lon / 15)} h. ${lon > 0 ? "East is ahead" : "West is behind"}: 12:00 ${lon > 0 ? "+" : "−"} ${Math.abs(lon / 15)} h = ${hhmm(ans)}.`,
        };
      }
      if (kind === "density" || kind === "densityCalc") {
        const c = ctx.next(level + "dens", POP.filter((x) => x.a));
        const d = (c.p * 1e6) / c.a;
        const round2 = (x) => (x >= 100 ? Math.round(x / 10) * 10 : x >= 10 ? Math.round(x) : Math.round(x * 10) / 10);
        const ans = round2(d);
        if (kind === "densityCalc") {
          return {
            draw: () => {
              world();
              paint(map, c.iso, HOT);
            },
            ask: `${c.n} has about ${fmt(c.p)} million people and an area of about ${fmt(c.a)} km². About how many people is that per km²? (Round to a whole number.)`,
            pad: true,
            unit: "people per km²",
            ans: Math.round(d),
            check: (v) => Math.abs(v - d) <= Math.max(1, d * 0.06),
            ansText: `about ${fmt(Math.round(d))}`,
            hint: `Population density = people ÷ area. Write ${fmt(c.p)} million as ${fmt(c.p * 1e6)}, then divide by ${fmt(c.a)}. Canceling zeros first helps.`,
            why: `${fmt(c.p * 1e6)} ÷ ${fmt(c.a)} ≈ ${d < 10 ? d.toFixed(1) : fmt(Math.round(d))} people per km². (An answer within about 6% counts.)${c.iso === "EGY" ? " But most Egyptians live along the Nile, where the real density is far higher." : ""}`,
          };
        }
        const opts = sorted([...new Set([ans, round2(d * 10), round2(d / 10), round2(d * 3)])]);
        return {
          draw: () => {
            world();
            paint(map, c.iso, HOT);
          },
          ask: `${c.n}: about ${fmt(c.p)} million people on about ${fmt(c.a)} km². Roughly how many people per km²?`,
          opts: labelled(opts, (x) => `about ${fmt(x)}`),
          ans,
          hint: "Density = people ÷ area. Estimate first: round both numbers to one significant figure and divide.",
          why: `${fmt(c.p)} million ÷ ${fmt(c.a)} km² ≈ ${d < 10 ? d.toFixed(1) : fmt(Math.round(d))} people per km².`,
        };
      }
      if (kind === "egyptDensity") {
        // Egypt: about 116 million people; most live on roughly 5% of the land (about 50,000 km²).
        return {
          draw: () => {
            world();
            paint(map, "EGY", "#eac06a");
            drawRiver(map.inner, map.P, "Nile", { width: 4 });
          },
          ask: "Egypt has about 116 million people on about 1,000,000 km², but about 95% of them live on roughly 50,000 km² beside the Nile. About what is the density there?",
          opts: labelled([116, 1100, 2200, 22000], (x) => `about ${fmt(x)} per km²`),
          ans: 2200,
          hint: "95% of 116 million is about 110 million. Divide that by 50,000.",
          why: "0.95 × 116 million ≈ 110 million; 110,000,000 ÷ 50,000 = 2,200 people per km², about 19 times the national average of about 116. An average can hide where people really live. (The exact share and area depend on the source.)",
        };
      }
      const f = ctx.next(level + "fact", HUMAN_FACTS.filter((x) => x.lv === level || (level === "hard" && x.lv === "medium")));
      return {
        draw: () => world(),
        ask: f.q,
        opts: labelled(shuffle(f.o)),
        ans: f.a,
        hint: "Which option is true, and how do we know? Think about what was measured.",
        why: f.why,
      };
    },
  });
}

// ---------- the shell ----------
const units = {
  g0: seeIt,
  g1: unitMapSkills,
  g2: unitLatLong,
  g3: unitContinents,
  g4: unitCountries,
  g5: unitPhysical,
  g6: unitUS,
  g7: unitPeople,
};
const shell = SHELL({
  units: UNITS,
  how: {
    g0: { icon: "👀", title: "See it", steps: ["Watch each animated map and listen.", "Press Next ▶ to continue, or ◀ to review.", "The last scene asks you to explain an idea aloud."] },
    g1: { icon: "🧭", title: "Map skills", steps: ["Read the map: grid letters across the top, numbers down the side.", "Use the compass rose, the key and the scale.", "Tap an answer or type a number, then press ✓."] },
    g2: { icon: "🌐", title: "Latitude & longitude", steps: ["Latitude: north or south of the equator. Longitude: east or west of the prime meridian.", "Read pins, tap places, and reason about distance and time.", "Latitude is always written first."] },
    g3: { icon: "🌍", title: "Continents & oceans", steps: ["Tap continents and oceans on the world map.", "Compare areas and reason with real numbers.", "Remember: flat maps distort sizes."] },
    g4: { icon: "🏛️", title: "Countries & capitals", steps: ["Name countries, find them on the map, and learn their capitals.", "Choose a continent, or all of them.", "🐣 starts with large countries; 🦁 covers all 193 UN members."] },
    g5: { icon: "⛰️", title: "Physical geography", steps: ["Rivers, mountains, deserts, lakes and plate boundaries.", "Tap an answer or type a number.", "Ask of each claim: how was it measured?"] },
    g6: { icon: "🗽", title: "US states & capitals", steps: ["Tap states, name them and learn their capitals.", "Switch between the tile map and the real shapes.", "Beware: the largest city is often not the capital."] },
    g7: { icon: "🏙️", title: "People & places", steps: ["Population, density, cities by water and time zones.", "Work out the answer, then tap or type it.", "Always ask: what was measured, and how?"] },
  },
  start: "g0",
  onStop() {
    token += 1;
    closeTry();
    $("[data-panel]").onclick = null;
  },
  subject: "History",
  activity: "World Geography",
  onUnit(id) {
    token += 1;
    VOICE.hush();
    units[id]();
  },
});
MUSIC.preload("xylophone", [72, 74, 76, 77, 79, 81, 83]);
MUSIC.preload("harp", [67, 69, 71, 73]);
