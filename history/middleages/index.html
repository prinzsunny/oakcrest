<script>const { $, el, svg: makeSvg, text, panel, say, sayAsync, pick, pickInt, wait, confetti, choices, explain, everyday, emoji, shuffle, numpad } = KIT;

// ---------- colours & small helpers ----------
const INK = "#2b1d12";
const SOFTINK = "#6b5440";
const PARCH = "#f7ecd5";
const PARCH2 = "#efdfbd";
const SEA = "#bcdbe8";
const LAND = "#ecdcb3";

const BAD = "#c4553a";
const SERIF = "Georgia, 'Times New Roman', serif";

const smooth = (t) => (t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
const tw = (ms, fn, live, ease = smooth) =>
  new Promise((resolve) => {
    if (KIT.still.matches) {
      fn(1);
      return resolve(live());
    }
    const t0 = performance.now();
    const frame = (now) => {
      if (!live()) return resolve(false);
      const t = Math.min(1, (now - t0) / ms);
      fn(ease(t));
      if (t < 1) requestAnimationFrame(frame);
      else resolve(true);
    };
    requestAnimationFrame(frame);
  });
const T = (parent, x, y, str, size = 26, fill = INK, extra = {}) => text(parent, x, y, str, { "font-size": size, fill, ...extra });
const halo = { stroke: "#fffaf0", "stroke-width": 6, "paint-order": "stroke", "stroke-linejoin": "round" };
function wrap(str, max) {
  const lines = [];
  for (const w of String(str).split(/\s+/)) {
    const l = lines[lines.length - 1];
    if (l !== undefined && (l + " " + w).length <= max) lines[lines.length - 1] = l + " " + w;
    else lines.push(w);
  }
  return lines;
}
// Wrapped text block centred vertically on y. Returns the number of lines.
function block(parent, x, y, str, max, size, lh, attrs = {}) {
  const lines = wrap(str, max);
  const top = y - ((lines.length - 1) * lh) / 2;
  lines.forEach((ln, i) => T(parent, x, top + i * lh, ln, size, attrs.fill || INK, attrs));
  return lines.length;
}
// Wrapped text block from a top line downward.
function blockTop(parent, x, y, str, max, size, lh, attrs = {}) {
  const lines = wrap(str, max);
  lines.forEach((ln, i) => T(parent, x, y + i * lh, ln, size, attrs.fill || INK, attrs));
  return lines.length;
}
const yr = (e) => (e.about ? `about ${e.y}` : String(e.y));
const ord = (n) => {
  const s = ["th", "st", "nd", "rd"];
  const v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
};
const centuryOf = (y) => Math.floor((y - 1) / 100) + 1;
const strip = (html) => String(html).replace(/<[^>]+>/g, "");

function fresh(bg = PARCH) {
  stage.innerHTML = "";

  view.style.overflow = "hidden";
  el("rect", { x: 0, y: 0, width: W, height: H, fill: bg }, view);
  return view;
}
// a parchment card
function card(parent, x, y, w, h, attrs = {}) {
  const g = el("g", { transform: `translate(${x} ${y})`, ...attrs }, parent);
  el("rect", { x: 3, y: 5, width: w, height: h, rx: 18, fill: "#d9c39a", opacity: 0.6 }, g);
  el("rect", { width: w, height: h, rx: 18, fill: "#fffaf0", stroke: "#c9a874", "stroke-width": 3 }, g);
  return g;
}

// ---------- level chips ----------
const LEVELS = [["easy", "🐣 Grade 4"], ["medium", "🦊 Grade 5–6"], ["hard", "🦁 Grade 7–8"]];

function onLevels(id, fn) {
  $("[data-levels]").addEventListener("click", (event) => {
    const b = event.target.closest("[data-lv]");
    if (!b) return;
    document.querySelectorAll("[data-lv]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    shell.mark(id, { level: b.dataset.lv });
    window.OC?.touch();

  });
  $("[data-try]")?.addEventListener("click", () => {
    window.OC?.touch();

}

const maStyle = document.createElement("style");
maStyle.textContent = `

.ma-try .kt-go{display:block;margin:6px auto 0}
@media (max-width:600px){.ma-cols{grid-template-columns:1fr}}
@media (max-height:460px){.ma-try-card{padding:8px 14px}.ma-try-card h2{font-size:18px;margin-bottom:3px}.ma-safe{margin-bottom:4px;font-size:13px}.ma-try-card ul,.ma-try-card ol{font-size:13.5px;line-height:1.25}.ma-ask{font-size:16px;margin:2px 0 4px}.ma-notice{margin:5px 0 3px;font-size:13.5px}.ma-try .kt-go{min-height:40px;font-size:17px;margin-top:2px}.ma-trybtn{min-height:32px;font-size:13px;padding:0 10px}.ma-nav button{min-height:34px;font-size:13px;padding:0 10px}}
@media (max-width:420px){[data-levels] button{padding:0 9px;font-size:14px}.ma-trybtn{padding:0 10px;font-size:14px}.ap-panel{max-height:60vh;gap:6px}.ap-panel>.ap-say{flex-shrink:0;max-height:24vh;overflow-y:auto;font-size:15px;padding:8px 12px 8px 54px}.ap-panel>.ap-say::before{width:34px;height:34px;font-size:20px;left:10px}.ap-row{gap:5px 8px}}
@media (max-width:420px){.ma-pick .kt-choices button{min-height:44px;font-size:14px;padding:3px 8px;line-height:1.15}.ma-pick .ap-chips.kt-choices{gap:5px}}
@media (max-height:460px),(max-width:420px) and (max-height:720px){.ma-pick .kt-choices button{min-height:44px;font-size:14px;padding:4px 9px;line-height:1.15}.ma-pick .ap-chips.kt-choices{gap:5px;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))}}
`;
document.head.appendChild(maStyle);

// ---------- Try it for real ----------
const TRY = {
  m1: {
    title: "A thousand-year paper timeline",
    safe: "Do this with a grown-up if you use scissors and tape.",
    need: ["A strip of paper about 1.2 meters long (tape sheets together)", "A meter ruler or tape measure", "Pencil and colored pens"],
    steps: ["Choose a scale: 1 centimeter stands for 10 years. Draw a line and mark AD 400 at the left end.", "Mark every century: 500 is 10 cm along, 600 is 20 cm, and so on to 1500 at 110 cm.", "Work out each event's position: (year − 400) ÷ 10 centimeters. For 1066: 666 ÷ 10 = 66.6 cm.", "Add at least ten events, then shade the Early, High and Late Middle Ages in three colors."],
    notice: "Notice how long 1,000 years really is: from Charlemagne (800) to the Black Death (1347) is 54.7 cm — more than half a meter.",
  },
  m2: {
    title: "Trace the Silk Roads with string",
    safe: "Do this with a grown-up. Use a printed map or an atlas, not a screen.",
    need: ["An atlas or printed map of Europe and Asia with a scale bar", "A piece of string", "A ruler"],
    steps: ["Lay the string along the land route from Venice to Beijing, bending it through Constantinople, Baghdad, Samarkand and Kashgar.", "Mark the string, straighten it and measure it with the ruler.", "Use the scale bar to convert your measurement into kilometers.", "Now measure the sea route from China round India to the Red Sea. Which is longer?"],
    notice: "Marco Polo's whole journey there and back took about 24 years (1271–1295). At 20 km a day, how many days would 8,000 km take?",
  },
  m3: {
    title: "Build a motte-and-bailey",
    safe: "Do this with a grown-up, outdoors or on a tray.",
    need: ["Damp sand or modeling clay", "Craft sticks or twigs", "A shallow tray and a cup of water"],
    steps: ["Heap a steep mound (the motte) at one end of the tray.", "Flatten a larger yard (the bailey) beside it and dig a ditch round both.", "Push sticks in a ring to make palisades, and build a small wooden tower on the motte.", "Pour water gently into the ditch. Which part would be hardest for an unwanted visitor to reach, and why?"],
    notice: "The Normans could build a castle like this in a few weeks. Stone castles took years to build, but were far harder to burn.",
  },
  m4: {
    title: "Make — and test — a primary source",
    safe: "Ask a grown-up to take part.",
    need: ["Two sheets of paper", "Two pencils", "A grown-up or sibling"],
    steps: ["Each of you writes a short chronicle of the same event today (a meal, a walk, a game), without looking at each other's.", "Swap and read. Underline everything that agrees.", "Circle details that appear in only one account, and any opinions.", "Ask: which account would a historian trust more, and why?"],
    notice: "Two honest witnesses can still disagree. Historians corroborate: they trust a claim more when independent sources agree.",
  },
  m5: {
    title: "A historian's biography card",
    safe: "Use a library book or an encyclopedia with a grown-up.",
    need: ["An index card", "A book or encyclopedia article about one person from this unit", "A pencil"],
    steps: ["Choose one person. Write their name and dates (write 'about' if a date is uncertain).", "Write three facts, each with the page or source where you found it.", "Write one sentence of opinion about them, and label it 'opinion'.", "Explain the card to a grown-up in two to four sentences."],
    notice: "Notice how often birth dates are uncertain. For many medieval people, no record of their birth survives.",
  },
  m6: {

    safe: "A grown-up should cut the potato. Paint can stain clothes.",
    need: ["Half a potato or a rubber eraser", "Paint or an ink pad", "Paper, a pencil and a timer"],
    steps: ["Ask a grown-up to carve a simple letter or symbol into the potato (backwards, so it prints the right way).", "Time how long it takes to copy one short sentence by hand five times.", "Time how long it takes to stamp your symbol twenty times.", "Compare the times. Then think: which method makes identical copies?"],

  },
  m7: {
    title: "Archaeology in a box",
    safe: "Do this with a grown-up. Keep sand away from eyes.",
    need: ["A clear plastic box or jar", "Sand, soil and gravel", "Small objects: a button, a coin, a bead, a bottle cap"],
    steps: ["A grown-up builds three or four layers, burying one object in each and noting the order secretly.", "Excavate from the top down with a spoon, one layer at a time.", "Record each object and its layer on a drawing.", "Decide which object was buried first, then check with the grown-up."],

};
function closeTry() {
  const box = document.querySelector(".ma-try");
  if (!box) return;
  box.remove();
  VOICE.hush();
}
function tryCard(id) {
  const t = TRY[id];
  if (!t) return;
  closeTry();
  const box = document.createElement("div");
  box.className = "ma-try";
  box.setAttribute("role", "dialog");
  box.setAttribute("aria-label", "Try it for real");
  box.innerHTML = `<div class="ma-try-card"><h2>🏠 Try it for real: ${t.title}</h2><p class="ma-safe">🤝 ${t.safe}</p><div class="ma-cols"><div><h3>You need</h3><ul>${t.need.map((x) => `<li>${x}</li>`).join("")}</ul></div><div><h3>Do this</h3><ol>${t.steps.map((x) => `<li>${x}</li>`).join("")}</ol></div></div><p class="ma-notice">👀 <b>Notice:</b> ${t.notice}</p><button type="button" class="kt-go" data-close>✓ Got it</button></div>`;
  document.body.appendChild(box);
  box.addEventListener("click", (event) => {
    if (event.target === box || event.target.closest("[data-close]")) closeTry();
  });
  VOICE.speak(`Try it for real: ${t.title}. ${t.safe} You need: ${t.need.join(", ")}. ${t.steps.join(" ")} Notice: ${t.notice}`);
}

// ---------- Explain it ----------
const EXPLAIN = {
  m0: { q: "How do historians know about events that happened a thousand years ago, and why do they compare more than one source?", pts: ["They use primary sources made at the time — chronicles, letters, charters, coins, buildings — and archaeology.", "Every source has an author with a point of view, a purpose and limited knowledge, so it may be biased, mistaken or incomplete.", "When independent sources agree (corroboration), we can be more confident a claim is true."] },
  m1: { q: "Explain how to find the number of years between 44 BC and AD 476, and why the simple sum 44 + 476 is not quite right.", pts: ["Years count down to 1 BC and then up from AD 1.", "There is no year 0, so adding 44 + 476 counts one year too many.", "The span is 44 + 476 − 1 = 519 years."] },
  m2: { q: "Choose one city — Constantinople, Baghdad or Timbuktu — and explain how its location helped it become rich and important.", pts: ["Name the city and point out its geography (a strait, a river, the edge of the desert).", "Explain which trade or travel routes passed through it.", "Give a consequence, for example Constantinople's sheltered harbor, the Golden Horn, made it a great trading port."] },
  m3: { q: "Compare a motte-and-bailey castle with a later stone castle. Why did castle builders change their designs?", pts: ["A motte-and-bailey was an earth mound and wooden tower with a fenced yard: quick and cheap to build after 1066.", "Wood could burn and rot, so lords rebuilt in stone: keeps, curtain walls, round towers and gatehouses.", "Each change made the castle stronger and safer: round towers had no weak corners, and later castles had two rings of walls."] },
  m4: { q: "Pick one source from this unit. What does it tell us, and what might it leave out or get wrong?", pts: ["Identify the author, the date and the purpose of the source.", "State one thing it reliably tells us, perhaps something the author did not intend to reveal.", "State one limitation: the author's viewpoint, distance from events, or whose voices are missing."] },
  m5: { q: "Choose one person from the cards. Explain why they are remembered, and whether that reputation is deserved.", pts: ["Give the person's dates and place, marking uncertain dates with 'about'.", "Describe one or two achievements with evidence.", "Separate fact from opinion: say who has praised or criticized them, and why."] },
  m6: { q: "Choose one cause-and-effect chain from this unit and explain each link. Why is 'it happened afterwards' not enough to prove a cause?", pts: ["State the cause, the effect and the mechanism that connects them.", "Many events have several causes; name another one if you can.", "Sequence alone is not proof: one event can follow another by coincidence (the post hoc fallacy)."] },
  m7: { q: "Explain the difference between a fact, an opinion and a preference, and give a medieval example of each.", pts: ["A fact can be checked against evidence: 'Magna Carta was sealed in 1215.'", "An opinion is a judgement that people can argue about with reasons: 'King John was a poor king.'", "A preference is a personal taste: 'I like Viking ships best.' Only facts can be proved true or false."] },
};
function explainCard(id) {
  const t = EXPLAIN[id];
  if (!t) return;
  closeTry();
  const box = document.createElement("div");
  box.className = "ma-try";
  box.setAttribute("role", "dialog");
  box.setAttribute("aria-label", "Explain it");
  box.innerHTML = `<div class="ma-try-card"><h2>🗣️ Explain it</h2><p class="ma-ask">${t.q}</p><p class="ma-safe">Say it aloud to a grown-up in 2–4 full sentences, or write it down. Then compare.</p><div class="ma-model" hidden><h3>A strong answer includes</h3><ul>${t.pts.map((x) => `<li>${x}</li>`).join("")}</ul></div><div class="ap-buttons"><button type="button" data-model>Show a model answer</button><button type="button" class="primary" data-close>✓ Done</button></div></div>`;
  document.body.appendChild(box);
  box.addEventListener("click", (event) => {
    if (event.target === box || event.target.closest("[data-close]")) closeTry();
    else if (event.target.closest("[data-model]")) {
      box.querySelector(".ma-model").hidden = false;
      event.target.closest("[data-model]").remove();
      VOICE.speak(`A strong answer includes: ${t.pts.join(" ")}`);
    }
  });
  window.OC?.count("ideas explained");
  VOICE.speak(`Explain it. ${t.q} Say it aloud to a grown-up in two to four full sentences, or write it down.`);
}
function endButtons(host, id, again) {
  host.innerHTML = `<div class="ap-buttons"><button type="button" class="primary" data-explain>🗣️ Explain it</button>${TRY[id] ? `<button type="button" data-trynow>🏠 Try it for real</button>` : ""}<button type="button" data-more>🔁 Again</button></div>`;
  host.onclick = (event) => {
    if (event.target.closest("[data-explain]")) explainCard(id);
    else if (event.target.closest("[data-trynow]")) tryCard(id);
    else if (event.target.closest("[data-more]")) again();
  };
}

// ---------- the question engine ----------
// q: { ask, draw(q, api), opts?, pad?, ans | check(v), hint(v), why, show(live), mark(v, ok), ansText }
const NICE = ["Correct.", "Correct — and here is why:", "Precisely.", "Correct. Well reasoned."];
function game(id, cfg, level, extra = {}) {
  const my = token;
  const alive = () => my === token;
  const R = cfg.rounds || 8;
  let round = 0;
  let q = null;
  let tries = 0;
  let busy = false;
  let gen = 0;
  const bags = cfg.bags || {};
  const ctx = {
    next(key, list) {
      if (!bags[key]?.length) bags[key] = shuffle(list);
      return bags[key].pop();
    },
  };
  panel(`${levelRow(level, { explore: !!extra.explore })}<div class="ma-pick" data-choices></div>`);
  const host = $("[data-choices]");
  const status = (s) => {
    const b = $("[data-status]");
    if (b) b.textContent = s || `Question ${Math.min(round + 1, R)} of ${R}`;
  };
  const isRight = (v) => (q.check ? q.check(v) : v === q.ans);
  const ask = () => {
    if (!alive()) return;
    q = cfg.make(level, round, ctx);
    tries = 0;
    busy = false;
    const g = ++gen;
    q.live = () => alive() && g === gen;
    fresh(cfg.bg);
    q.draw?.(q, { pick: (v) => answer(v) });
    status();
    if (q.pad) {
      host.onclick = null;
      host.innerHTML = `<div class="ma-padwrap"></div>`;
      q.padApi = numpad(host.firstChild, { max: q.max || 4, onEnter: (n) => answer(n) });
    } else if (q.opts) choices(host, q.opts, (c, b) => answer(c.v, b));
    else {
      host.innerHTML = `<div class="ap-buttons"><button type="button" data-again>🔁 Say it again</button></div>`;
      host.onclick = (event) => {
        if (event.target.closest("[data-again]")) say(q.ask);
      };
    }
    say(q.ask);
    window.__maq = q;
    window.__maPick = (val) => answer(val, host.querySelector(`[data-c="${q.opts ? q.opts.findIndex((o) => o.v === val) : -1}"]`) || undefined);
  };
  const answer = async (v, button) => {
    if (!alive() || busy || !q) return;
    if (button && (button.classList.contains("wrong") || button.disabled)) return;
    window.OC?.touch();
    const live = q.live;
    if (isRight(v)) {
      busy = true;
      button?.classList.add("right");
      host.querySelectorAll("[data-c]").forEach((b) => (b.disabled = b !== button));
      q.mark?.(v, true);
      MUSIC.chime();
      say(`${tries ? "Correct — you revised your thinking." : pick(NICE)} ${q.why}`);
      if (q.show) await q.show(live);
      if (!live()) return;
      return done();
    }
    tries += 1;
    MUSIC.oops();
    if (button) {
      button.classList.add("wrong");
      button.disabled = true;
    }
    q.mark?.(v, false);
    q.padApi?.clear();
    if (tries < 2) {
      say(`Not quite. Consider: ${typeof q.hint === "function" ? q.hint(v) : q.hint || "look again at the evidence."}`);
      return;
    }
    busy = true;
    await sayAsync("Mistakes are how we learn. Let's look why.");
    if (!live()) return;
    let label = q.ansText;
    if (q.opts) {
      const i = q.opts.findIndex((o) => isRight(o.v));
      const b = host.querySelector(`[data-c="${i}"]`);
      b?.classList.add("right");
      label = label ?? q.opts[i]?.label;
      host.querySelectorAll("[data-c]").forEach((x) => (x.disabled = x !== b));
    }
    if (q.pad && q.padApi) q.padApi.set(q.ansText ?? q.ans);
    q.reveal?.();
    say(`The answer is <b>${label ?? q.ans}</b>. ${q.why}`);
    if (q.show) await q.show(live);
    if (!live()) return;
    done();
  };
  const done = () => {
    round += 1;
    window.OC?.count(cfg.count || "history questions");
    const last = round >= R;
    status(`Question ${round} of ${R}`);
    host.onclick = null;
    host.innerHTML = `<div class="ap-buttons"><button type="button" class="primary" data-next>${last ? "Finish ▶" : "Next ▶"}</button></div>`;
    host.onclick = (event) => {
      if (!event.target.closest("[data-next]")) return;
      VOICE.hush();
      if (last) finish();
      else ask();
    };
  };
  const finish = () => {
    if (!alive()) return;
    gen += 1;
    confetti();
    MUSIC.chime();
    shell.mark(id, { done: true });
    window.OC?.count("history games finished");
    window.OC?.touch();
    status(`All ${R} done`);
    say(`All ${R} complete. You weighed the evidence and persisted. Now the most important step: explain the idea in your own words.`);
    endButtons(host, id, () => {
      round = 0;
      ask();
    });
  };
  ask();
}
// Run a unit that has level chips (and optionally an Explore mode).
function modeUnit(id, cfg, explore) {
  const allowed = explore ? ["explore", "easy", "medium", "hard"] : ["easy", "medium", "hard"];
  let lv = shell.progress()[id]?.level;
  if (!allowed.includes(lv)) lv = explore ? "explore" : "easy";
  const run = (l) => {
    token += 1;
    VOICE.hush();
    closeTry();
    if (l === "explore") explore();
    else game(id, cfg, l, { explore: !!explore });
    onLevels(id, run);
  };
  run(lv);
}
// "towards the top left of the picture"
const where = (x, y) => {
  const v = y < 187 ? "top" : y > 373 ? "bottom" : "";
  const h = x < 333 ? "left" : x > 666 ? "right" : "";
  return v || h ? `toward the ${[v, h].filter(Boolean).join(" ")}` : "near the middle";
};
// choices helpers
const opt = (list) => list.map((x) => (typeof x === "object" ? x : { label: String(x), v: x }));
const mix = (ans, pool, n = 4) => shuffle([ans, ...shuffle(pool.filter((x) => x !== ans)).slice(0, n - 1)]);

// Project lon/lat onto a map (equirectangular, fitted to 1000 x 560).
function proj(m, lon, lat) {
  const M = MAPS[m];
  return [((lon - M.lon0) * 1000) / (M.lon1 - M.lon0), ((M.lat1 - lat) * 560) / (M.lat1 - M.lat0)];
}
const pathOf = (m, pts, close = true) => "M" + pts.map(([lo, la]) => proj(m, lo, la).map((v) => v.toFixed(1)).join(" ")).join("L") + (close ? "Z" : "");
// smooth open path through points (Catmull-Rom to Bezier)
function curveOf(m, pts) {
  const p = pts.map(([lo, la]) => proj(m, lo, la));
  let d = `M${p[0][0].toFixed(1)} ${p[0][1].toFixed(1)}`;
  for (let i = 0; i < p.length - 1; i++) {
    const p0 = p[i - 1] || p[i];
    const p1 = p[i];
    const p2 = p[i + 1];
    const p3 = p[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += `C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d;
}

// a horizontal timeline 400–1500
const TL = { x0: 70, x1: 930, y: 470, a: 400, b: 1500 };
const tx = (y) => TL.x0 + ((y - TL.a) / (TL.b - TL.a)) * (TL.x1 - TL.x0);
function drawTimeline(parent, { eras = true } = {}) {
  const g = el("g", {}, parent);
  if (eras) {
    const bands = [[476, 1000, "#f3d9a8", "Early Middle Ages"], [1000, 1300, "#e9c98b", "High Middle Ages"], [1300, 1453, "#ddb774", "Late Middle Ages"]];
    for (const [a, b, c, name] of bands) {
      el("rect", { x: tx(a), y: TL.y - 26, width: tx(b) - tx(a), height: 22, fill: c }, g);
      T(g, (tx(a) + tx(b)) / 2, TL.y - 9, name, 15, SOFTINK, { "font-weight": 800 });
    }
  }
  el("line", { x1: TL.x0 - 20, x2: TL.x1 + 20, y1: TL.y, y2: TL.y, stroke: INK, "stroke-width": 5, "stroke-linecap": "round" }, g);
  for (let c = TL.a; c <= TL.b; c += 100) {
    el("line", { x1: tx(c), x2: tx(c), y1: TL.y - 8, y2: TL.y + 12, stroke: INK, "stroke-width": 3 }, g);
    T(g, tx(c), TL.y + 40, c, 22, SOFTINK);
  }
  return g;
}
// marker on the timeline with a label above
function tlMark(parent, e, row = 0, color = "var(--accent)") {
  const g = el("g", { opacity: 0 }, parent);
  const x = tx(e.y);
  const top = TL.y - 46 - row * 52;
  el("line", { x1: x, x2: x, y1: top + 8, y2: TL.y, stroke: color, "stroke-width": 3, "stroke-dasharray": "5 4" }, g);
  el("circle", { cx: x, cy: TL.y, r: 9, fill: color, stroke: "#fff", "stroke-width": 3 }, g);
  const label = `${yr(e)}`;
  const w = label.length * 13 + 26;
  const bx = Math.max(10, Math.min(990 - w, x - w / 2));
  el("rect", { x: bx, y: top - 26, width: w, height: 34, rx: 10, fill: color }, g);
  T(g, bx + w / 2, top - 2, label, 22, "#fff");
  return g;
}

// Draw a map. Returns helpers for layers, cities and labels.
function drawMap(parent, m, { seas = true, rivers = true } = {}) {
  const g = el("g", { class: "ma-map" }, parent);
  const cid = `maLand${m}${++clipId}`;
  const defs = el("defs", {}, g);
  const cp = el("clipPath", { id: cid }, defs);
  el("path", { d: MAPS[m].land }, cp);
  el("rect", { x: 0, y: 0, width: W, height: H, fill: SEA }, g);
  el("path", { d: MAPS[m].land, fill: LAND, stroke: "#9c8460", "stroke-width": 1.4, "stroke-linejoin": "round" }, g);
  const layerG = el("g", { "clip-path": `url(#${cid})` }, g);
  if (rivers) for (const [name, pts] of Object.entries(RIVERS[m])) el("path", { d: curveOf(m, pts), fill: "none", stroke: "#6fa8c7", "stroke-width": m === "A" ? 2.6 : 2, "stroke-linecap": "round", "data-river": name }, g);
  if (seas) for (const [name, lon, lat] of SEAS[m]) {
    const [x, y] = proj(m, lon, lat);
    T(g, x, y, name, 19, "#3d6f8a", { "font-style": "italic", "font-weight": 700, "font-family": SERIF });
  }
  const top = el("g", {}, g);
  return {
    g,
    m,
    layer(id, attrs = {}) {
      const L = LAYER[id];
      const lg = el("g", { "data-layer": id, ...attrs }, L.kind === "state" ? layerG : top);
      if (L.kind === "state") for (const p of L.polys) el("path", { d: pathOf(m, p), fill: L.color, "fill-opacity": 0.5, stroke: L.color, "stroke-width": 3, "stroke-linejoin": "round" }, lg);
      else
        for (const p of L.lines) {
          el("path", { d: curveOf(m, p), fill: "none", stroke: "#fffaf0", "stroke-width": 8, "stroke-linecap": "round", opacity: 0.8 }, lg);
          el("path", { d: curveOf(m, p), fill: "none", stroke: L.color, "stroke-width": 4.5, "stroke-linecap": "round", "stroke-dasharray": "12 7" }, lg);
          const n = p.length;
          const [x1, y1] = proj(m, ...p[n - 2]);
          const [x2, y2] = proj(m, ...p[n - 1]);
          const a = Math.atan2(y2 - y1, x2 - x1);
          const s = 14;
          el("path", { d: `M${x2} ${y2}L${x2 - s * Math.cos(a - 0.45)} ${y2 - s * Math.sin(a - 0.45)}L${x2 - s * Math.cos(a + 0.45)} ${y2 - s * Math.sin(a + 0.45)}Z`, fill: L.color }, lg);
        }
      return lg;
    },
    city(id, { label = true, tap = null, r = 9, color = INK } = {}) {
      const c = CITY[id];
      const [x, y] = proj(m, c.lon, c.lat);
      const cg = el("g", { class: tap ? "ma-tap ma-city" : "ma-city", "data-city": id }, top);
      if (tap) el("circle", { cx: x, cy: y, r: 30, fill: "transparent" }, cg);
      el("circle", { cx: x, cy: y, r: r + 4, fill: "#fffaf0" }, cg);
      el("circle", { cx: x, cy: y, r, fill: color, class: "ma-dot" }, cg);
      if (label) cityLabel(cg, m, id);
      if (tap) cg.addEventListener("pointerdown", () => tap(id, cg));
      return cg;
    },
    point: (lon, lat) => proj(m, lon, lat),
  };
}
function cityLabel(cg, m, id) {
  const c = CITY[id];
  const [x, y] = proj(m, c.lon, c.lat);
  const right = x < 820;
  return T(cg, x + (right ? 16 : -16), y + 7, c.n, 21, INK, { "text-anchor": right ? "start" : "end", ...halo, class: "ma-clabel" });
}
// pick n cities on map m, at least gap px apart, including `must`
function spreadCities(m, n, must, gap = 70) {
  const pool = shuffle(CITIES.filter((c) => c.m.includes(m) && c.id !== must));
  const out = [must];
  for (const c of pool) {
    if (out.length >= n) break;
    const [x, y] = proj(m, c.lon, c.lat);
    if (out.every((o) => Math.hypot(...proj(m, CITY[o].lon, CITY[o].lat).map((v, i) => v - [x, y][i])) >= gap)) out.push(c.id);
  }
  return shuffle(out);
}

const CAUSES = [
  { lv: "easy", k: "effect", known: "Gutenberg's printing press (about 1455)", q: "What was one result of Gutenberg's printing press?", a: "Books became cheaper and far more plentiful.", d: ["Monasteries closed overnight.", "Castles were rebuilt in stone.", "Everyone stopped speaking Latin."], why: "A press could make in days what took scribes months. About 180 copies of the Gutenberg Bible were printed, and by 1500 European presses had printed millions of books.", hint: "think about how long it took to copy a book by hand, and how long a press took." },
  { lv: "easy", k: "cause", known: "Windmills appearing in England and France after about 1180", q: "Why did people build windmills in flat lands without fast rivers?", a: "Wind could turn millstones where there was no flowing water to drive a water mill.", d: ["Windmills were warmer than houses.", "The king banned water mills.", "Wind made the flour sweeter."], why: "A water mill needed a stream with a good fall of water. In flat or dry country, the wind gave power instead; European windmills are recorded from the 1180s.", hint: "what does a water mill need that flat, dry land lacks?" },
  { lv: "easy", k: "effect", known: "The Black Death (1347–1351)", q: "What was one result of the Black Death in Europe?", a: "So many workers died that survivors could demand higher wages.", d: ["Europe's population doubled.", "Castles stopped being built at once.", "Everyone moved to the countryside forever."], why: "Perhaps a third to a half of Europe's people died. Fewer workers meant labor was scarce, so wages rose despite laws trying to hold them down.", hint: "if a third of all workers die, what happens to the value of those who are left?" },
  { lv: "easy", k: "cause", known: "French words such as beef, pork, court and justice entering English", q: "What caused many French words to enter English?", a: "After 1066, England's new Norman rulers spoke French.", d: ["English people moved to France.", "Monks wrote only in French.", "The Vikings spoke French."], why: "For about three centuries the court, law and nobility used French. English farmers kept the animal words (cow, pig) while the French words named the meat served at noble tables (beef, pork).", hint: "which group of people ruled England after 1066, and what language did they speak?" },
  { lv: "easy", k: "cause", known: "Viking traders reaching Constantinople", q: "How could Viking traders travel all the way from Scandinavia to Constantinople?", a: "They sailed along great rivers such as the Dnieper, dragging their light ships overland between rivers.", d: ["They walked across the Alps.", "They rode camels across the Sahara.", "They sailed around Africa."], why: "Scandinavian ships were light enough to be pulled between rivers. Along the Dnieper they reached the Black Sea and Constantinople, trading furs, wax and honey for silver and silk.", hint: "look at the rivers of what is now Russia and Ukraine on the map." },
  { lv: "easy", k: "effect", known: "The magnetic compass reaching sailors", q: "What was one effect of the magnetic compass?", a: "Sailors could find direction under cloudy skies, far from land.", d: ["Ships no longer needed sails.", "Maps became unnecessary.", "Storms stopped."], why: "Stars and the Sun are hidden by cloud; a magnetized needle still points north–south. Chinese sailors used compasses by about 1100, and Europeans by about 1200.", hint: "how did sailors find direction before compasses, and when did that fail?" },
  { lv: "easy", k: "cause", known: "Paper replacing parchment for many books and letters", q: "Why did paper spread across the Islamic world and into Europe?", a: "It was much cheaper to make than parchment from animal skins.", d: ["It lasted longer than stone.", "Parchment had been banned.", "Paper was invented in France."], why: "Papermaking spread from China to Baghdad by about 800 and reached Spain by the 1100s. It made books and letters far cheaper.", hint: "how many calves were needed for one big parchment book?" },
  { lv: "easy", k: "cause", known: "King John agreeing to Magna Carta (1215)", q: "Why did King John agree to Magna Carta?", a: "Angry barons pressed him after years of heavy taxes.", d: ["He wanted to retire.", "The pope ordered it.", "The Vikings demanded it."], why: "John had raised heavy taxes for many years. In 1215 the barons, unhappy with how he ruled, made him agree to a charter that limited his power.", hint: "who was angry with John, and why?" },
  { lv: "easy", k: "effect", known: "The Hijra: Muhammad's move to Medina (622)", q: "What did the Hijra of 622 lead to?", a: "The first Muslim community in Medina, and the start of the Islamic calendar.", d: ["The founding of Baghdad.", "The building of Notre-Dame.", "The fall of Rome."], why: "In Medina Muhammad led a community; later Muslims counted their years from this event (AH, 'in the year of the Hijra').", hint: "Muslim years are counted from an important beginning. Which?" },
  { lv: "easy", k: "effect", known: "Monks copying books by hand", q: "What was an important result of monks copying books?", a: "Many ancient and religious texts were preserved.", d: ["Books became cheap.", "Everyone learned to read.", "Paper was invented."], why: "Many works of Latin literature survive only because monks copied them, often more than once.", hint: "what would happen to a book if no one ever made a new copy?" },
  { lv: "medium", k: "cause", known: "The Normans of Normandy speaking French by 1066", q: "The Normans descended from Vikings. Why did they speak French by 1066?", a: "Over generations they married local people and adopted their language and religion.", d: ["The pope ordered them to.", "Old Norse was banned by Charlemagne.", "They had always spoken French."], why: "Rollo's Vikings were granted Normandy about 911. Within a few generations their descendants were French-speaking Christians.", hint: "what usually happens to a small group of settlers living among many local people for 150 years?" },
  { lv: "medium", k: "cause", known: "Marco Polo traveling safely across Asia (1271–1295)", q: "How did the Mongol Empire make Marco Polo's journey possible?", a: "One power controlled most of the route and protected merchants and envoys.", d: ["The Mongols built a railway.", "The Mongols banned all travel.", "Polo was a Mongol prince."], why: "Historians call this the 'Mongol peace'. The Mongols used a relay-post system and passes (paiza) for official travelers.", hint: "is a journey easier through twenty separate kingdoms, each with its own tolls, or through one empire?" },
  { lv: "medium", k: "cause", known: "The Black Death arriving in Europe in 1347", q: "How did the Black Death probably reach Europe?", a: "Along trade routes from Central Asia, on ships sailing from the Black Sea.", d: ["It began in a Paris library.", "It was carried by Viking longships.", "It came from Greenland with Norse settlers."], why: "Plague reached the Crimean port of Caffa in 1346; Genoese ships carried it to Constantinople, Sicily and beyond in 1347.", hint: "trade connected Asia and Europe. Which route reached Italian ports from the east?" },
  { lv: "medium", k: "cause", known: "Hindu–Arabic numerals spreading in Europe after 1202", q: "Why did Hindu–Arabic numerals spread among European merchants?", a: "They made calculation far easier than Roman numerals, as Fibonacci's book showed.", d: ["The pope commanded it.", "Roman numerals had been forgotten.", "They used fewer pages of parchment only."], why: "Place value and zero make written addition, multiplication and bookkeeping simple. Try multiplying XLVII by XXIII on paper!", hint: "try writing 47 × 23 in Roman numerals. Which system makes it easier?" },
  { lv: "medium", k: "cause", known: "Aristotle studied in European universities by about 1200", q: "Why could European scholars study Aristotle by about 1200?", a: "His works had been translated into Latin from Arabic and Greek, especially in Toledo and Sicily.", d: ["Aristotle had moved to Paris.", "Every monk spoke Ancient Greek.", "The Vikings brought his books."], why: "Arabic scholars had translated and commented on Greek works; in Toledo, after 1085, translators turned them into Latin.", hint: "where had Greek learning been kept and studied, and how did it come back into Latin?" },
  { lv: "medium", k: "effect", known: "The Treaty of Verdun (843)", q: "What was the result of the Treaty of Verdun?", a: "Charlemagne's empire was split into three kingdoms.", d: ["Charlemagne was crowned.", "The Vikings left Francia.", "England and France united."], why: "His grandsons divided it into West Francia, Middle Francia and East Francia — roots of France and Germany.", hint: "the treaty was made between Charlemagne's three grandsons. What would three heirs want?" },
  { lv: "medium", k: "cause", known: "Alfred the Great having Latin books translated into English", q: "Why did Alfred have Latin books translated into English?", a: "Few people in his kingdom could still read Latin, and he wanted more of them to learn.", d: ["Latin had been banned.", "He could not read English.", "The pope told him to stop using Latin."], why: "In his preface to Pope Gregory's Pastoral Care, Alfred wrote that very few people south of the Humber could understand Latin, and planned for young men to learn to read English.", hint: "how many of Alfred's people could read Latin?" },
  { lv: "medium", k: "effect", known: "A shortage of labor after the Black Death", q: "What did the shortage of labor after 1350 lead to in western Europe?", a: "Peasants could bargain for wages and freedom, and serfdom slowly declined.", d: ["Lords freed every serf at once.", "Wages fell sharply.", "Towns disappeared."], why: "Lords competing for scarce workers had to offer better terms. Governments resisted — England's Statute of Labourers (1351) tried to cap wages — but over a century serfdom faded in the west.", hint: "when workers are scarce, who has more bargaining power?" },
  { lv: "medium", k: "effect", known: "Pilgrims walking to Santiago de Compostela", q: "What was one effect of the pilgrimage to Santiago de Compostela?", a: "Towns, churches and inns grew up along the routes across France and Spain.", d: ["Spain became empty.", "People stopped traveling.", "Ships were banned."], why: "Thousands of pilgrims walked the road each year; they needed food, beds and churches, so towns along the way prospered.", hint: "what do thousands of travelers need every night?" },
  { lv: "medium", k: "effect", known: "Universities founded in Bologna, Paris and Oxford", q: "What was one effect of the new universities?", a: "Students could gather to study law, medicine and theology with masters, and earn degrees.", d: ["Monasteries stopped copying books at once.", "Everyone in Europe learned to read.", "Latin stopped being used."], why: "From about 1100 groups of masters and students formed universities. Their degrees trained the lawyers, doctors and clergy who ran Europe's courts and churches.", hint: "what did lawyers, doctors and priests need before they could work?" },
  { lv: "medium", k: "effect", known: "Mansa Musa's pilgrimage (1324)", q: "What was one result of Mansa Musa's hajj?", a: "Mali became famous across the Mediterranean world as a land of gold.", d: ["Mali moved to the coast.", "Gold stopped being valuable everywhere.", "Mali moved its capital to Mecca."], why: "The Catalan Atlas of 1375 shows him holding a golden nugget — his fame reached European mapmakers.", hint: "news travels with merchants. What would they say about a king who gave away so much gold?" },
  { lv: "medium", k: "cause", known: "Gothic cathedrals with huge stained-glass windows", q: "How could Gothic builders put such huge windows in their walls?", a: "Pointed arches, ribbed vaults and flying buttresses carried the roof's weight, so the walls did not have to be solid.", d: ["Glass was stronger than stone.", "The roofs were made of cloth.", "The windows held the roof up."], why: "Flying buttresses pushed back against the outward thrust of the vaults, so the walls between could be filled with glass, as at Chartres and the Sainte-Chapelle.", hint: "if the walls do not hold up the roof, what else must?" },
  { lv: "medium", k: "cause", known: "English used again in England's law courts after 1362", q: "Why did English return to England's law courts in 1362?", a: "Most people, including nobles, now spoke English, and a new law said cases should be pleaded in it.", d: ["The king banned all writing.", "Everyone had moved to France.", "Latin had been forgotten everywhere."], why: "The Statute of Pleading (1362) complained that people did not understand the French used in court. Soon afterwards Chaucer chose English for his poems.", hint: "what language did most people in England speak at home?" },
  { lv: "hard", k: "reason", known: "Reasoning about causes", q: "A student says: 'The Black Death came before the Renaissance, so it caused the Renaissance.' What is wrong with this argument?", a: "Coming earlier does not prove causing — this is the post hoc fallacy.", d: ["Nothing: earlier events always cause later ones.", "The Black Death came after the Renaissance.", "The Renaissance has no causes."], why: "'Post hoc ergo propter hoc' means 'after this, therefore because of this'. A real causal claim needs a mechanism and evidence; historians do debate links between the plague and later changes, but sequence alone proves nothing.", hint: "the sun rose after you woke up today. Did waking up cause it?" },
  { lv: "hard", k: "reason", known: "Evidence for the Vikings in America", q: "Which is the strongest evidence that Norse people reached North America?", a: "Norse buildings and objects excavated at L'Anse aux Meadows, Newfoundland.", d: ["Icelandic sagas alone, written down about 200 years later.", "A modern statue of Leif Erikson.", "The fact that Vikings were good sailors."], why: "The sagas told the story, but archaeology confirmed it: in 2021 tree rings in cut wood from the site gave the exact year 1021.", hint: "which kind of evidence was made at the time, in the place itself?" },
  { lv: "hard", k: "reason", known: "Long-term and short-term causes", q: "Which pair gives a long-term cause and a short-term trigger of the Black Death reaching Europe?", a: "Centuries of trade linking Asia and Europe (long-term); ships sailing from Caffa in 1347 (trigger).", d: ["The founding of Rome (long-term); the printing press (trigger).", "Ships from Caffa (long-term); centuries of trade (trigger).", "Charlemagne's coronation (trigger); paper (long-term)."], why: "Long-term causes make an event possible; a trigger makes it happen at a particular moment. Trade had connected Asia and Europe for centuries; in 1347 ships carried the disease to Mediterranean ports.", hint: "which cause took centuries, and which happened in a single year?" },
  { lv: "hard", k: "reason", known: "Correlation and cause", q: "Which statement confuses correlation with causation?", a: "'Towns with more churches had more plague deaths, so churches spread the plague.'", d: ["'Fleas carrying plague bacteria spread the disease.'", "'Ships from Caffa carried plague to Sicily.'", "'Crowded cities had more deaths because disease spread between people.'"], why: "Bigger towns had both more churches and more people. A third factor — population — explains both, so the churches are not the cause.", hint: "what else do towns with many churches also have more of?" },
  { lv: "hard", k: "reason", known: "Magna Carta's later importance", q: "Magna Carta failed within weeks in 1215. What best explains its later importance?", a: "It was reissued and later used by lawyers and colonists to argue that rulers must obey the law.", d: ["It immediately gave everyone the vote.", "It ended the English monarchy.", "It was the first law ever written."], why: "The 1225 reissue entered English law. In the 1600s Sir Edward Coke used it against the Stuart kings, and American colonists cited it in their arguments with Britain.", hint: "what happened to the charter after 1215?" },
  { lv: "hard", k: "reason", known: "Causes of the growth of towns", q: "Why do historians say there was no single cause of the growth of towns after about 1000?", a: "Better farming, more people, growing trade and charters from lords all played parts.", d: ["Because towns had no causes.", "Because only trade mattered.", "Because only the weather mattered."], why: "Heavier ploughs and three-field farming fed more people; fairs drew merchants; charters gave townspeople rights. Explanations with only one cause usually oversimplify.", hint: "did every town grow for exactly the same reason?" },
  { lv: "hard", k: "reason", known: "The term 'Dark Ages'", q: "Why do most historians now avoid calling this period the 'Dark Ages'?", a: "It is a judgement, not a fact: the period had real achievements, and fewer written sources survive from some centuries.", d: ["Because the sun was dimmer then.", "Because no one could read at all.", "Because nothing happened between 500 and 1000."], why: "Renaissance writers used 'dark' to praise their own age. Byzantium, the Islamic world, Tang and Song China, and Carolingian schools show how misleading the label is.", hint: "is 'dark' something you can measure, or a judgement about the period?" },
  { lv: "hard", k: "reason", known: "Testing a claim about printing", q: "Which claim needs correcting before you accept it?", a: "'Gutenberg invented printing.'", d: ["'Gutenberg printed a Bible about 1455.'", "'Gutenberg worked in Mainz.'", "'Gutenberg used movable metal type.'"], why: "Woodblock printing existed in China by the 700s; Bi Sheng made movable clay type about 1040; the oldest surviving book printed with metal type, the Korean Jikji, dates from 1377. Gutenberg's achievement was a practical system that spread rapidly in Europe.", hint: "what had Chinese and Korean printers done before 1440?" },
  { lv: "hard", k: "reason", known: "A chain of causes", q: "Rollo is granted Normandy (911) → ? → William of Normandy becomes king of England (1066). Which link fits best?", a: "Rollo's descendants became powerful dukes of Normandy, among them William.", d: ["Rollo sailed to England in 1066.", "The Normans forgot about England for ever.", "The pope gave Normandy to Venice."], why: "William of Normandy was Rollo's great-great-great-grandson. A chain of cause and effect can stretch over generations.", hint: "who was William of Normandy descended from?" },
  { lv: "hard", k: "reason", known: "Baghdad's House of Wisdom", q: "Which explanation best accounts for Baghdad becoming a great center of learning?", a: "Caliphs paid for translations of Greek, Persian and Indian works, and paper made books cheaper.", d: ["Baghdad had no other industries.", "Scholars were forbidden to live elsewhere.", "Books were printed there by machine."], why: "Patronage plus a cheap writing material: Baghdad had paper mills by about 800, using a technique learned from China.", hint: "learning needs two things: people paid to study, and something cheap to write on." },

      const p = ctx.next(`p${kind}`, PEOPLE);
      const near = shuffle(PEOPLE.filter((x) => x !== p && Math.abs(x.b - p.b) < (level === "easy" ? 2000 : 400))).slice(0, 3);
      const fact = pick(p.f);
      return {
        ask: kind === "who" ? "Who am I?" : "Which person does this describe?",
        opts: shuffle([p, ...near]).map((x) => ({ label: x.n, v: x.id })),
        ans: p.id,
        draw() {
          const g = card(view, 70, 50, 860, 360);
          emoji(g, 430, 70, kind === "who" ? "❓" : "🔎", 70);
          block(g, 430, 240, kind === "who" ? `“${p.clue}”` : fact, 48, 28, 38, { "font-family": SERIF });
        },
        hint: `this person lived ${p.ba ? "around " : "from "}${p.b} to ${p.d}, in or around ${p.place}.`,
        why: `${p.n} (${life(p)}), ${p.role}. ${p.f.find((f) => f !== fact) || ""}`,
        show: async (live) => {
          fresh();
          drawPerson(p);
          await tw(200, () => {}, live);
        },
      };
    }
    if (kind === "born") {
      const gap = level === "hard" ? 8 : 40;
      let set;
      for (let t = 0; t < 300; t++) {
        set = shuffle(PEOPLE).slice(0, 4);
        if (set.every((a, i) => set.every((b, j) => i === j || Math.abs(a.b - b.b) >= Math.max(gap, bUnc(a) + bUnc(b) + 2)))) break;
      }
      const first = set.reduce((a, b) => (a.b < b.b ? a : b));
      return {
        ask: "Which of these people was born first?",
        opts: set.map((x) => ({ label: x.n, v: x.id })),
        ans: first.id,
        draw() {
          set.forEach((x, i) => {
            const g = card(view, 30 + i * 240, 60, 220, 300);
            emoji(g, 110, 80, x.e, 80);
            block(g, 110, 200, x.n, 14, 24, 30, { "font-family": SERIF });
            blockTop(g, 110, 262, x.role.split(";")[0].split(",")[0], 18, 18, 22, { fill: SOFTINK });
          });
        },
        hint: () => {
          const o = pick(set.filter((x) => x !== first));
          return `place each person in a century. ${o.n} was born ${o.ba ? "about" : "in"} ${o.b}. Who belongs earlier than that?`;
        },
        why: set.slice().sort((a, b) => a.b - b.b).map((x) => `${x.n} (born ${x.ba ? "about " : ""}${x.b})`).join(", "),
        show: async (live) => {
          drawTimeline(view, { eras: false });
          for (const [k, x] of set.slice().sort((a, b) => a.b - b.b).entries()) {
            const m = tlMark(view, { y: x.b, about: x.ba }, k % 2);
            await tw(300, (t) => m.setAttribute("opacity", t), live);
            if (!live()) return;
          }
        },
      };
    }
    if (kind === "overlap") {
      let a;
      let b;
      const want = Math.random() < 0.5;
      for (let t = 0; t < 600; t++) {
        [a, b] = shuffle(PEOPLE).slice(0, 2);
        const o = alive2(a, b);
        if (overlapSafe(a, b) && Math.abs(a.b - b.b) < 250 && o > 0 === want) break;
      }
      const yes = alive2(a, b) > 0;
      return {
        ask: `Were ${a.n} (${life(a)}) and ${b.n} (${life(b)}) alive at the same time?`,
        opts: [{ label: "Yes — their lifetimes overlap", v: "yes" }, { label: "No — their lifetimes do not overlap", v: "no" }],
        ans: yes ? "yes" : "no",
        draw() {
          [a, b].forEach((x, i) => {
            const g = card(view, 60 + i * 460, 40, 420, 230);
            emoji(g, 70, 70, x.e, 70);
            T(g, 250, 80, x.n, x.n.length > 16 ? 24 : 30, INK, { "font-family": SERIF });
            T(g, 210, 170, life(x), 32, "var(--accent-dark)");
          });
          drawTimeline(view, { eras: false });
        },
        hint: `compare the dates. Did the later-born person arrive before the earlier-born person died? ${a.b < b.b ? `${b.n} was born ${b.ba ? "about " : "in "}${b.b}; ${a.n} died ${a.da ? "about " : "in "}${a.d}.` : `${a.n} was born ${a.ba ? "about " : "in "}${a.b}; ${b.n} died ${b.da ? "about " : "in "}${b.d}.`}`,
        why: yes ? `Yes: both were alive from about ${Math.max(a.b, b.b)} to ${Math.min(a.d, b.d)} — an overlap of about ${alive2(a, b)} years. Being alive at the same time does not mean they met, though.` : `No: ${a.d < b.b ? `${a.n} died about ${b.b - a.d} years before ${b.n} was born` : `${b.n} died about ${a.b - b.d} years before ${a.n} was born`}.`,
        show: async (live) => {
          const bars = [a, b].map((x, i) => el("rect", { x: tx(Math.max(TL.a, x.b)), y: 330 + i * 40, width: 0, height: 28, rx: 8, fill: i ? "#1f618d" : "#8e44ad", opacity: 0.85 }, view));
          await tw(700, (t) => [a, b].forEach((x, i) => bars[i].setAttribute("width", (tx(Math.min(TL.b, x.d)) - tx(Math.max(TL.a, x.b))) * t)), live);
        },
      };
    }
    const it = ctx.next("age", AGES);
    const p = PERSON[it.p];
    const opts = shuffle([it.age, it.age - 10, it.age + 10, it.age + 20 > 90 ? it.age - 20 : it.age + 20]);
    return {
      ask: `${it.about ? "About how" : "How"} old was ${p.n} when ${it.ev}?`,
      opts: opts.map((x) => ({ label: `${it.about ? "about " : ""}${x}`, v: x })),
      ans: it.age,
      draw() {
        drawPerson(p, { facts: false });
        const g = card(view, 60, 300, 880, 200);
        block(g, 440, 100, `When ${it.ev}`, 50, 28, 36, { "font-family": SERIF });
      },
      hint: `subtract the birth year from the year of the event, then check whether the birthday had come yet that year. Born ${p.ba ? "about " : ""}${p.b}.`,
      why: it.how,
    };
  },
};

// ---------- 6. CAUSE AND EFFECT ----------
const CAUSEGAME = {
  count: "causes and effects",
  make(level, round, ctx) {
    const it = ctx.next(`c${level}`, CAUSES.filter((c) => c.lv === level));
    let qBox;
    return {
      ask: it.q,
      opts: shuffle([it.a, ...it.d]).map((o) => ({ label: o, v: o })),
      ans: it.a,
      draw() {
        if (it.k === "reason") {
          const g = card(view, 80, 50, 840, 420);
          emoji(g, 420, 70, "🧠", 70);
          T(g, 420, 170, it.known, 30, "var(--accent-dark)", { "font-family": SERIF });
          block(g, 420, 290, it.q, 52, 25, 33);
          return;
        }
        const leftKnown = it.k === "effect";
        const box = (x, title, body, known) => {
          const g = card(view, x, 90, 380, 300);
          T(g, 190, 46, title, 24, known ? "var(--accent-dark)" : SOFTINK, { "letter-spacing": 2 });
          if (known) block(g, 190, 170, body, 24, 26, 34, { "font-family": SERIF });
          else qBox = T(g, 190, 190, "?", 100, "#d9c39a");
          return g;
        };
        const L = box(50, "CAUSE", it.known, leftKnown);
        const R = box(570, "EFFECT", it.known, !leftKnown);
        el("path", { d: "M440 240H545", stroke: INK, "stroke-width": 8 }, view);
        el("path", { d: "M540 220L570 240L540 260Z", fill: INK }, view);
        this.slot = leftKnown ? R : L;
      },
      hint: it.hint,
      why: it.why,
      show: async function (live) {
        if (!qBox) return;
        qBox.remove();
        const g = el("g", { opacity: 0 }, this.slot);
        block(g, 190, 170, it.a, 26, 23, 30, { fill: GOOD });
        await tw(500, (t) => g.setAttribute("opacity", t), live);
      },
    };
  },
};

// ---------- 7. HISTORIAN'S TOOLKIT ----------
const TOOLGAME = {
  count: "evidence questions",
  make(level, round, ctx) {
    const kinds = level === "easy" ? ["ps", "fop", "ps", "fop"] : level === "medium" ? ["fop", "anach", "strat", "ps"] : ["rel", "anach2", "strat", "rel"];
    const kind = kinds[round % kinds.length];
    const big = (emo, title, body) => {
      const g = card(view, 80, 50, 840, 420);
      emoji(g, 420, 70, emo, 70);
      if (title) T(g, 420, 170, title, 26, "var(--accent-dark)", { "letter-spacing": 1 });
      block(g, 420, 290, body, 46, 30, 40, { "font-family": SERIF });
    };
    if (kind === "ps") {
      const [t, prim, why] = ctx.next("ps", PRIMSEC);
      return {
        ask: "Is this a primary source or a secondary source for studying the Middle Ages?",
        opts: [{ label: "Primary source", v: true }, { label: "Secondary source", v: false }],
        ans: prim,
        draw: () => big("🔍", "SOURCE", t),
        hint: "was it made during the Middle Ages, by people of that time, or later by someone looking back?",
        why: `It is ${prim ? "primary" : "secondary"}: ${why}.`,
      };
    }
    if (kind === "fop") {
      const [t, k] = ctx.next("fop", FOP);
      return {
        ask: "Is this statement a fact, an opinion or a preference?",
        opts: [{ label: "Fact", v: "fact" }, { label: "Opinion", v: "opinion" }, { label: "Preference", v: "preference" }],
        ans: k,
        draw: () => big("⚖️", "STATEMENT", `“${t}”`),
        hint: "could you check it against evidence? Is it a judgement others could argue about? Or is it simply someone's taste?",
        why: `It is ${k === "opinion" ? "an" : "a"} ${k}: ${FOP_WHY[k]}`,
      };
    }
    if (kind === "anach" || kind === "anach2") {
      if (kind === "anach2") {
        const pairs = ANACH.filter((a) => a[1] > 1250 && a[1] <= 1460);
        const it = ctx.next("anach2", pairs);
        const y1 = it[1] - pickInt(60, 120);
        const y2 = Math.min(1480, it[1] + pickInt(10, 40));
        const wrong = shuffle(ANACH.filter((a) => a[2].includes("Americas"))).slice(0, 2).map((a) => a[0]);
        const okd = pick(OK_DETAIL);
        return {
          ask: `Which detail would be out of place in a story set in ${y1}, but possible in ${y2}?`,
          opts: shuffle([it[0], ...wrong, okd]).map((o) => ({ label: o.charAt(0).toUpperCase() + o.slice(1), v: o })),
          ans: it[0],
          draw: () => big("🕰️", "ANACHRONISM", `Set in ${y1} … and in ${y2}`),
          hint: "two of these were impossible in both years, and one was possible in both. Which one appeared in Europe between the two dates?",
          why: `${it[0].charAt(0).toUpperCase() + it[0].slice(1)}: ${it[2]}. So it fits ${y2} but not ${y1}. Items from the Americas fit neither year, since they reached Europe after 1492.`,
        };
      }
      const year = pick([1000, 1066, 1100, 1150, 1200, 1250]);
      const it = ctx.next("anach", ANACH.filter((a) => a[1] > year));
      const oks = shuffle(OK_DETAIL).slice(0, 3);
      return {
        ask: `A story is set in England in ${year}. Which detail is an anachronism — out of its time?`,
        opts: shuffle([it[0], ...oks]).map((o) => ({ label: o.charAt(0).toUpperCase() + o.slice(1), v: o })),
        ans: it[0],
        draw: () => big("🕰️", "ANACHRONISM", `England, AD ${year}`),
        hint: "three of these were ordinary sights in medieval England. Which one comes from a later time — or from a place Europeans had not yet reached?",
        why: `${it[0].charAt(0).toUpperCase() + it[0].slice(1)} is an anachronism: ${it[2]}.`,
      };
    }
    if (kind === "strat") {
      if (level === "hard" && Math.random() < 0.5) {
        return {
          ask: "A plastic bead is found in the deepest layer, beside a Roman tile, inside an old rabbit burrow. What is the best explanation?",
          opts: ["The burrow let the bead fall into the older layer; disturbed layers need care.", "The Romans made plastic beads.", "Layers always lie in perfect order, so the tile must be modern.", "The bead proves the whole site is fake."].map((o) => ({ label: o, v: o })),
          ans: "The burrow let the bead fall into the older layer; disturbed layers need care.",
          draw() {
            drawStrata([STRATA[0], STRATA[2], STRATA[4]], true);
          },
          hint: "plastic did not exist in Roman times. How could something new get down into an old layer?",
          why: "Superposition holds only for undisturbed layers. Burrows, pits, roots and later digging can carry objects down, so archaeologists record such disturbances carefully.",
        };
      }
      const set = shuffle(STRATA).slice(0, level === "hard" ? 4 : 3).sort((a, b) => a[2] - b[2]);
      const askOld = Math.random() < 0.6;
      const target = askOld ? set[0] : set[set.length - 1];
      return {
        ask: `In these undisturbed layers, which object was probably buried ${askOld ? "first (the oldest)" : "last (the most recent)"}?`,
        opts: shuffle(set).map((s) => ({ label: s[0].charAt(0).toUpperCase() + s[0].slice(1), v: s[0] })),
        ans: target[0],
        draw() {
          drawStrata(set, false);
        },
        hint: "layers build up from the bottom. Which layer was laid down first?",
        why: `${target[0].charAt(0).toUpperCase() + target[0].slice(1)} lies ${askOld ? "deepest" : "highest"}, so by the principle of superposition it is probably the ${askOld ? "oldest" : "most recent"} (${target[1]}).`,
      };
    }
    const it = ctx.next("rel", RELIABLE);
    return {
      ask: it.q,
      opts: shuffle([it.a, ...it.d]).map((o) => ({ label: o, v: o })),
      ans: it.a,
      draw: () => big("🧐", "WEIGH THE EVIDENCE", it.q.length > 140 ? "Is it true? How do we know? Is the source reliable? Does the conclusion follow?" : it.q),
      hint: "ask: is the claim true? How do we know? Is the source independent and close to the events? Does the conclusion really follow?",
      why: it.why,
    };
  },
};
function drawStrata(set, burrow) {
  const n = set.length;
  const top = 70;
  const h = (H - top - 20) / n;
  el("rect", { x: 0, y: 0, width: W, height: top, fill: "#cfe7f3" }, view);
  el("rect", { x: 0, y: top - 8, width: W, height: 12, fill: GRASS }, view);
  const colors = ["#8a6d47", "#a8845a", "#b99668", "#c9a97a", "#d8bd8f"];
  const glyph = { "a Roman roof tile": "🧱", "an Anglo-Saxon brooch": "📌", "a Viking silver coin": "🪙", "a Norman pottery jug": "🏺", "a pilgrim's badge": "🎖️", "a piece of printed paper": "📄" };
  for (let i = 0; i < n; i++) {
    const s = set[n - 1 - i];
    const y = top + i * h;
    el("rect", { x: 0, y, width: W, height: h, fill: colors[i % colors.length], stroke: "#6b5440", "stroke-width": 1 }, view);
    const x = 200 + ((i * 230) % 600);
    emoji(view, x, y + h / 2 - 4, glyph[s[0]] || "🏺", 46);
    T(view, x + 40, y + h / 2 + 9, s[0], 24, INK, { "text-anchor": "start", ...halo });
  }
  if (burrow) {
    el("path", { d: `M110 ${top}C90 200 150 300 120 ${H - 60}`, fill: "none", stroke: "#3b2a1c", "stroke-width": 26, "stroke-linecap": "round", opacity: 0.6 }, view);
    emoji(view, 120, H - 70, "🟣", 26);
    T(view, 150, H - 60, "plastic bead", 22, "#fff", { "text-anchor": "start", stroke: INK, "stroke-width": 4, "paint-order": "stroke" });
    emoji(view, 60, top - 30, "🐇", 44);
  }
}
