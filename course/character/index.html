lesson({
  title: "Gratitude to those who teach us", icon: "🍎",
  learn: [
    { say: "Every skill you have was given to you partly by others: parents, teachers, coaches, authors. Gratitude toward teachers is <b>noticing and naming</b> what they gave you, and honouring them by using it well.", show: big("Every skill has a giver.") },
    { say: "Naaman, commander of the army of Aram, had leprosy. The prophet Elisha told him to wash seven times in the Jordan. Naaman was offended at first, but his servants persuaded him, and he was healed (2 Kings 5).", show: quote("2 Kings 5:14") },
    { say: "Naaman went back to Elisha to give thanks and offered a gift. Elisha refused it with an oath, 'As Yahweh lives, before whom I stand, I will receive none' (2 Kings 5:16); the text suggests he would not let God's gift look like something bought. Naaman's thanks led him to acknowledge the true God.", show: quote("2 Kings 5:15") },
    { say: "Scripture tells us to remember those who taught us and to imitate what was good in them. Paul begins his letter to the Philippians with thanks.", show: quotes(["Philippians 1:3", "Hebrews 13:7", "Luke 6:40"]) },
    { say: "History. <b>Anne Sullivan</b>, herself partly blind, arrived in Alabama on 3 March 1887 to teach six-year-old <b>Helen Keller</b>, who was deaf and blind. For weeks she spelled words into Helen's hand. On 5 April 1887, at the water pump, Helen understood that 'w-a-t-e-r' named the cool thing flowing over her hand.", show: tbl([["Date", "Event"], ["3 March 1887", "Anne Sullivan arrives in Tuscumbia, Alabama"], ["5 April 1887", "The water pump: Helen understands words"], ["1904", "Helen graduates from Radcliffe College, with Anne beside her"], ["1936", "Anne dies; Helen honours her as 'Teacher' all her life"]]) },
    { say: "The Roman philosopher <b>Seneca</b> (about 4 BC–AD 65) wrote a whole book <i>On Benefits</i>. He taught that a gift is measured by the giver's goodwill, not its price, and that a person who receives a gift gladly and remembers it has already begun to repay it.", show: pas("Seneca, On Benefits (ideas)", "A benefit is not the money or the object, but the goodwill behind it.\n\nReceive gladly: grudging thanks spoils a gift.\n\nRemember: forgetting a benefit is the worst ingratitude.\n\nRepay as you can: not always in kind, but in honour, use and goodwill.") },
    { say: "Two feelings can look alike. <b>Appreciation</b> is a warm recognition of what someone gave. <b>Obligation</b> or indebtedness is a heavy sense that you must pay them back. True gratitude is mostly appreciation: teachers are repaid chiefly when students learn well and pass it on.", show: tbl([["Appreciation", "Mere obligation"], ["'Look what she gave me!'", "'Now I owe her.'"], ["warm and glad", "heavy and anxious"], ["repays by using the gift well", "repays to be free of the debt"]]) },
    explain("What did Anne Sullivan give Helen Keller, and what does Seneca teach about how to receive a gift? Name one teacher of yours and exactly what they gave you."),
  ],
  practice: [
    ch("How does gratitude toward a teacher honour them best?", ["by noticing and naming what they gave, and using it well", "by giving them an expensive present at the end of the year", "by telling other people how strict and demanding they were", "by quickly moving on to a better teacher next year"], "Seneca: repay in honour, use and goodwill.", "Naming the gift and using it well is the deepest thanks."),
    ch("What did Elisha tell Naaman to do?", ["wash seven times in the Jordan", "climb a mountain", "pay a large fee", "fast for forty days"], "2 Kings 5:10.", "He was to wash seven times in the Jordan River."),
    ch("How did Naaman first react to Elisha's instruction?", ["He was angry and offended that it was so simple.", "He obeyed at once with joy.", "He laughed and went home happy.", "He asked for a harder task in writing."], "He expected a grand ceremony.", "Naaman was offended; his servants persuaded him to obey."),
    num("Naaman dipped himself in the Jordan how many times?", 7, "2 Kings 5:14.", "Seven times, 'according to the saying of the man of God'."),
    ch("Elisha refused Naaman's gift with the oath 'As Yahweh lives, before whom I stand' (2 Kings 5:16). What is the most likely reason?", ["The healing was God's gift and not something to be paid for.", "The gift was too small for so great a healing as Naaman's.", "Elisha disliked Naaman because he was a foreign general.", "Elisha wanted Naaman to send a larger gift the next year."], "Who really healed Naaman?", "Elisha would not let God's free gift look like a purchase (2 Kings 5:16)."),
    ch("Philippians 1:3: 'I thank my God whenever I...'", ["remember you", "see you", "am angry", "am rich"], "Paul thanks God for people.", "'I thank my God whenever I remember you.'"),
    ch("Hebrews 13:7 tells believers to remember their leaders and...", ["imitate their faith", "forget their words", "criticise their conduct", "replace them"], "Gratitude leads to imitation.", "'Considering the results of their conduct, imitate their faith.'"),
    ch("When did Anne Sullivan arrive to teach Helen Keller?", ["3 March 1887", "5 April 1887", "1 December 1955", "17 December 1903"], "Helen called it the most important day she could remember.", "Anne arrived on 3 March 1887."),
    num("Anne Sullivan arrived on 3 March 1887, and Helen understood 'water' on 5 April 1887. How many days later was that? (March has 31 days.)", 33, "Count the days left in March after the 3rd, then add the days in April.", "March 3 to March 31 is 28 days; then 5 more days in April: 28 + 5 = 33."),
    ch("What did Helen understand at the water pump?", ["that the letters spelled into her hand were names for things", "how to pump water for herself without help from anyone", "that she would one day be able to see and hear again", "that Anne Sullivan was her teacher and would stay"], "'w-a-t-e-r'.", "She grasped that words name things; after that she learned rapidly."),
    ch("Which college did Helen Keller graduate from in 1904?", ["Radcliffe College", "Oxford University", "the Academy of Athens", "Harvard Law School"], "Anne sat beside her, spelling lectures into her hand.", "Helen graduated from Radcliffe in 1904, the first deafblind person to earn a bachelor's degree."),
    ch("According to Seneca, a gift is measured by...", ["the goodwill of the giver", "its price", "its size", "how many people see it"], "On Benefits.", "Seneca taught that the benefit lies in the goodwill, not the object."),
    ch("According to Seneca, what is the worst ingratitude?", ["forgetting a benefit", "saying thank you too often", "returning a favour", "receiving gladly"], "What is the opposite of 'remembering'?", "Seneca judged forgetting a benefit the worst ingratitude; remembering is the beginning of repaying."),
    ch("Which response shows appreciation rather than mere obligation?", ["'Thank you for teaching me fractions; I used them to double a recipe today!'", "'Here is a present for you, so now we are even for all the lessons.'", "'I suppose I owe you something now for all the time you spent on me.'", "'Thank you, though of course teaching me was simply your job.'"], "Which is warm and names the gift?", "Appreciation names the gift gladly and shows it being used."),
    ch("Luke 6:40 says a student, fully trained, will be like...", ["his teacher", "his king", "his enemy", "nobody"], "Teaching shapes the student.", "Good teachers pass on not only knowledge but character; that is why choosing and honouring teachers matters."),
    G.virtue(16, ["gratitude", "kindness", "self-control"]), G.choose(16, ["gratitude"]), G.choose(16, ["gratitude"]), G.reason(), G.verse(["gratitude"]), G.verse(["gratitude"]), G.bible(["gratitude"]), G.hero(["Anne Sullivan", "Helen Keller", "Marcus Aurelius", "Elizabeth Fry"]), G.think(["Seneca", "Aristotle", "Epictetus"]), G.feel(), G.def(16),
  ],
  challenge: [
    ch("Naaman was angry because the cure seemed too ordinary. What does this suggest about gratitude?", ["Pride can blind us to gifts that come in humble forms, so humility helps gratitude.", "Simple gifts are not real gifts, so Naaman was right to expect something grander.", "Gratitude is only owed for gifts that cost the giver a great deal of money.", "Anger is always a sign that the gift was given with the wrong motive."], "What did his servants see that he did not?", "Naaman expected grandeur; humility let him receive. Pride and gratitude are opposed."),
    ch("Helen Keller learned about thirty words on the day at the pump, after weeks of apparently fruitless spelling. What does this teach about teaching and learning?", ["Long, patient effort can lead to sudden understanding; the earlier weeks were not wasted.", "The earlier weeks were wasted, since Helen learned everything important in a single day.", "Teaching works only on special days, so a teacher should wait for the right moment.", "Learning is always steady and even, so the pump story must be exaggerated."], "Could the pump moment have happened without the weeks before?", "Breakthroughs usually rest on patient, unseen preparation, which deserves gratitude too."),
    ch("Argument: 'A gift is valuable only if it is expensive. A spelling lesson costs nothing. So Anne's lessons were not valuable.' Evaluate it.", ["Valid in form, but the first premise is false (value lies in goodwill and benefit), so it is unsound.", "Sound: both premises are true and the conclusion follows from them necessarily.", "Invalid: even if both premises were true, the conclusion would not follow from them.", "It is a matter of taste, so it cannot be judged as either valid or invalid."], "If the premises were true, would the conclusion follow? Are they true?", "A valid argument with a false premise is unsound. Anne's gift was priceless though it cost no money."),
    ch("You did not enjoy a strict teacher, but she taught you to read music well. Is gratitude still appropriate?", ["Yes: gratitude names real goods received, even from someone you did not always enjoy.", "No: gratitude is owed only to teachers who made learning pleasant and enjoyable.", "No: strictness cancels any gift, since the lessons were given without warmth.", "Only if she asks to be thanked, since gratitude must be requested to be owed."], "Is gratitude about feelings of liking, or about goods received?", "Gratitude is honest recognition of a gift; it does not require that the giver was always pleasant."),
    ch("Seneca says that receiving a gift gladly and remembering it has already begun to repay it (a paraphrase of his teaching). Which reason best supports this?", ["The giver's aim was your good; your glad use of the gift fulfils that aim.", "Remembering a gift is a kind of payment, like returning borrowed money.", "Givers never expect anything back, so nothing needs to be repaid at all.", "A glad face is cheaper than a return gift, so it is the sensible choice."], "What did the giver want?", "If the giver wanted your good, your flourishing with the gift is what they hoped for."),
    G.reason(),
  ],
  extend: "Read 2 Kings 5 in full. Then read chapter 4 of Helen Keller's 'The Story of My Life' (1903, public domain), where she describes Anne Sullivan's arrival and the water pump. Copy one sentence that shows her gratitude.",
  offline: "Write a thank-you letter to a teacher or coach that names three specific things they taught you and how you have used them. Deliver it by hand. Explain it: in 2–4 sentences, explain to a grown-up why naming specific gifts makes thanks more meaningful, using Seneca's idea of goodwill.",
}),
// ---------- Lesson 17 ----------
lesson({
  title: "Perseverance: staying with the hard problem", icon: "🧗",
  learn: [
    { say: "A new virtue joins our list. <b>Perseverance</b> is keeping working at something hard even when you want to quit; finishing what you started. It is courage stretched over time, and it is for good goals: keeping on at something wrong is not a virtue. This week's rule: stay with a hard problem for <b>ten full minutes</b> before asking for help.", show: big("Perseverance:\nkeeping working at something hard\neven when you want to quit;\nfinishing what you started") },
    { say: "Jacob, returning home in fear of Esau, wrestled all night with a mysterious man. Though his hip was put out of joint, he would not let go. Afterwards Jacob said, 'I have seen God face to face' (Genesis 32:30).", show: quotes(["Genesis 32:26", "Genesis 32:28"]) },
    { say: "Scripture often pictures the life of faith as a long race, and it expects falls along the way. The righteous person is not someone who never falls, but someone who gets up.", show: quotes(["Hebrews 12:1", "Galatians 6:9", "Proverbs 24:16"]) },
    { say: "History. The <b>Wright brothers</b>' gliders of 1900 and 1901 disappointed them. Instead of quitting, they doubted their data: in late 1901 they built a small <b>wind tunnel</b> and tested about 200 wing shapes. On <b>17 December 1903</b> at Kitty Hawk, Orville made the first powered, controlled flight: <b>12 seconds, 120 feet</b>.", show: tbl([["Year", "What happened"], ["1900", "first glider at Kitty Hawk: lifts far less than the tables predicted"], ["1901", "second glider also disappoints; they build a wind tunnel and test about 200 wing shapes"], ["1902", "third glider, designed from their own data, flies well: hundreds of glides"], ["1903", "17 December: first powered flight, 12 seconds, 120 feet; the day's fourth flight lasts 59 seconds"]]) },
    { say: "Perseverance is a <b>mean</b>. Too little is <b>quitting</b> at the first difficulty. Too much is <b>stubbornness</b>: repeating the same failing method forever. The Wrights did not simply try harder; they changed their method when the evidence showed the old one was wrong. Persevere in the goal; be flexible in the method.", show: S(meanSvg("quitting", "perseverance", "stubbornness", "Perseverance as a mean")) },
    { say: "Feelings. When work is hard you may feel <b>discouraged</b> (losing heart) or <b>frustrated</b> (blocked). Those feelings do not mean you are failing; they often mean you are learning. Teachers call this <b>productive struggle</b>. Aesop's fable of the tortoise and the hare makes the same point: steady effort beats careless speed.", show: list(["Minutes 0–3: read the problem twice; say what is being asked.", "Minutes 3–7: try something: draw it, test a small case, work backward.", "Minutes 7–10: write down exactly where you are stuck.", "Then ask for a HINT, not the answer."]) },
    { say: "A dilemma. You have worked on a puzzle for forty minutes and it is bedtime. Is stopping quitting? Not necessarily. Choosing to rest and return tomorrow, with a note of where you are stuck, is perseverance with prudence. Quitting means abandoning the goal; resting means protecting it.", show: tbl([["Choice", "Goal kept?", "Verdict"], ["Throw the puzzle away", "no", "quitting"], ["Stay up until midnight, getting more tired", "yes, unwisely", "stubbornness"], ["Write where you are stuck; return after sleep", "yes", "perseverance"]]) },
    explain("Explain how the Wright brothers' wind tunnel shows the difference between perseverance and stubbornness."),
  ],
  practice: [
    ch("What is perseverance?", ["keeping working at something hard even when you want to quit; finishing what you started", "repeating the same method forever, whatever the evidence says about it", "finishing every task as quickly as possible so that it is out of the way", "never feeling discouraged, because strong people do not have such feelings"], "The definition has two parts: keeping on, and finishing.", "Perseverance: keeping working at something hard even when you want to quit; finishing what you started."),
    ch("In Genesis 32, what did Jacob say to the man he wrestled with?", ["I won't let you go, unless you bless me.", "Let me go, for the day breaks.", "Who are you?", "I surrender."], "Which of them asked to be let go?", "The man said 'Let me go'; Jacob answered, 'I won't let you go, unless you bless me.' (Genesis 32:26)"),
    ch("What new name did Jacob receive after wrestling?", ["Israel", "Abraham", "Esau", "Joseph"], "Genesis 32:28.", "'Your name will no longer be called Jacob, but Israel; for you have fought with God and with men, and have prevailed.'"),
    ch("Hebrews 12:1 says to run 'with perseverance' what?", ["the race that is set before us", "away from all trouble", "to the nearest city", "faster than others"], "The writer pictures a race watched by a cloud of witnesses.", "'Let us run with perseverance the race that is set before us.'"),
    ch("Proverbs 24:16 says a righteous man falls seven times and...", ["rises up again", "stays down", "blames others", "never falls again"], "What makes him righteous is not that he never falls.", "'A righteous man falls seven times, and rises up again.' (WEB)"),
    ch("Galatians 6:9: 'Let us not be weary in doing good, for we will reap in due season, if we...'", ["don't give up", "work faster", "are rich", "are praised"], "The harvest has a condition.", "'...if we don't give up.' The reward depends on perseverance."),
    ch("Where did the Wright brothers make their first powered flight?", ["Kitty Hawk, North Carolina", "Dayton, Ohio", "Paris, France", "London, England"], "They chose a windy, sandy place on the coast.", "They built their machines in Dayton but flew at Kitty Hawk, North Carolina, for its steady winds and soft sand."),
    ch("What was the date of the first powered, controlled aeroplane flight?", ["17 December 1903", "4 July 1776", "1 January 1900", "17 December 1803"], "It was in the first years of the 20th century.", "17 December 1903."),
    num("The first flight lasted 12 seconds. The fourth flight that day lasted 59 seconds. How many seconds longer was the fourth flight?", 47, "Subtract.", "59 − 12 = 47 seconds."),
    num("The first flight covered 120 feet in 12 seconds. On average, how many feet per second is that?", 10, "Divide distance by time.", "120 ÷ 12 = 10 feet per second."),
    ch("Why did the Wrights build a wind tunnel in 1901?", ["Their gliders performed worse than the published tables predicted, so they gathered their own data.", "They wanted to test bicycle frames for strength before selling them in their shop in Dayton.", "The government required all inventors to test their machines indoors before any flight.", "They hoped to sell wind tunnels to universities to raise money for their first engine."], "What did they come to doubt?", "They suspected the existing data were wrong, and testing about 200 wing shapes proved it. Perseverance plus evidence."),
    ch("Which is stubbornness rather than perseverance?", ["Repeating a failing method a hundred times without changing anything", "Testing a new method each time the previous one fails", "Resting for the night and returning to the problem the next day", "Asking for a hint after ten honest minutes of trying alone"], "Stubbornness keeps the method; perseverance keeps the goal.", "Perseverance holds the goal steady and adapts the method; stubbornness refuses to adapt."),
    ch("In Aesop's fable, why did the tortoise win?", ["He kept going steadily while the overconfident hare stopped to sleep.", "The hare was injured early on and could not run at his usual speed.", "The course ran downhill, which suited the tortoise's heavy shell.", "The other animals cheered for the tortoise, which made him faster."], "What did the hare do mid-race?", "Steady effort beat careless speed. (A fable: invented to teach.)"),
    ord("Put the ten-minute plan for a hard problem in order.", ["Read it twice and say what is asked", "Try something: draw, test a small case, work backward", "Write exactly where you are stuck", "Ask for a hint, not the answer"], "You cannot try something before you understand the question.", "Understand, attempt, locate the difficulty, then ask for a hint."),
    ch("What is 'productive struggle'?", ["working on something hard enough that effort is needed, which is how learning happens", "struggling with a problem that is impossible, so that you learn to accept failure", "arguing with others about a problem until someone gives you the answer", "working for a long time on easy problems so that you never make a mistake"], "Is struggle a sign of failure?", "Effortful work at the edge of your ability builds understanding; the discomfort is part of learning."),
    G.virtue(17, ["perseverance", "courage", "self-control"]), G.choose(17, ["perseverance"]), G.choose(17, ["perseverance"]), G.reason(), G.verse(["perseverance"]), G.verse(["perseverance"]), G.bible(["perseverance", "courage"]), G.hero(["Wilbur and Orville Wright", "Anne Sullivan", "William Wilberforce", "Helen Keller"]), G.legend(), G.feel(), G.def(17),
  ],
  challenge: [
    ch("Someone says: 'The Wrights succeeded because they never doubted.' Which evidence contradicts this?", ["Wilbur later recalled telling Orville in 1901 that men would not fly for fifty years; they persevered through doubt.", "They made the first powered flight in 1903, which shows that they were always certain they would succeed.", "They ran a successful bicycle shop, which shows that they were confident and never doubted their skill.", "They worked as brothers, and brothers who work together never doubt one another or their plans."], "Which fact shows they did feel doubt?", "The record shows real discouragement. In a 1908 speech Wilbur said he had told Orville in 1901 that man would not fly for fifty years; a later account (from Orville, through a biographer) remembers it as 'a thousand years'. Either way, perseverance is not the absence of doubt but acting well despite it."),
    ch("Is it ever right to stop pursuing a goal?", ["Yes, when evidence shows the goal is wrong or impossible, or a weightier duty calls; that is not a failure of perseverance.", "Never: perseverance means continuing whatever the evidence, because stopping always shows a lack of character.", "Yes, whenever the work becomes boring, since a goal that is no longer enjoyable is no longer worth pursuing.", "Only if someone in authority orders you to stop, since you cannot judge for yourself whether a goal is worthwhile."], "Perseverance is in doing what is right and good. What if the goal is not good?", "Perseverance serves good goals. Prudence judges which goals deserve it."),
    ch("Jacob would not let go though his hip was out of joint. Which conclusion is best supported by Genesis 32?", ["Jacob's persistence in seeking God's blessing was honoured, though it left him marked: he limped afterwards.", "Wrestling is the best way to pray, so believers should copy Jacob's method whenever they seek a blessing.", "Jacob won because he was stronger than the one he wrestled, so strength is what God rewards most.", "Jacob's injury shows that persistence in seeking God is always punished and should be avoided."], "Read 32:25–31 carefully: what did Jacob receive, and what did he carry away?", "He received the blessing and a new name, and he limped as he left (32:31). Persevering can leave marks."),
    ch("A student solves a hard problem in two minutes. Has she shown perseverance?", ["Not necessarily: perseverance shows when work is hard and you want to quit, and for her it was not.", "Yes: solving any problem that is labelled hard proves perseverance, however quickly it is done.", "No: working quickly is a sign of carelessness, and careless work can never show any virtue.", "Yes: the problem came from a difficult book, so whoever solves it must have persevered."], "What does the virtue respond to?", "The same task can test perseverance in one person and not in another. She should seek harder problems to practise it."),
    ch("Argument: 'The tortoise beat the hare. So slow people always beat fast people.' What is wrong?", ["It draws a universal conclusion from one invented story; the fable teaches steadiness and pride, not that slowness wins.", "Nothing is wrong: the fable reports a real race, and one real result is enough to prove a general rule.", "The premise is false, because in Aesop's story the hare actually won the race by a long distance.", "It is wrong only because tortoises are in fact faster than hares over very long distances."], "Is a fable evidence about all races?", "A fable illustrates a lesson; it is not data. And the lesson is about steady effort versus overconfidence."),
    G.reason(),
  ],
  extend: "Read Genesis 32–33 with a parent: Jacob's fear, the night of wrestling, and the meeting with Esau. Then read Aesop's 'The Hare and the Tortoise' (public domain). Write a paragraph comparing the two kinds of perseverance.",
  offline: "Ten-minute challenge: each day this week, choose one hard problem (math, chess or a puzzle) and work on it for ten full minutes before asking for help. Keep a log: problem, what you tried, where you got stuck. Explain it: tell a grown-up, in 2–4 sentences, the difference between perseverance and stubbornness.",
}),
// ---------- Lesson 18 ----------
lesson({
  title: "Humility: seeing yourself truly", icon: "🪞",
  learn: [
    { say: "<b>Humility</b> is knowing that you don't know everything; being willing to learn from others; not thinking of yourself as more important than you are. It is not pretending to be worthless; that would be dishonest. It is seeing yourself truly: honesty about yourself.", show: big("Humility:\nknowing that you don't know everything;\nbeing willing to learn from others;\nnot thinking of yourself as more important than you are") },
    { say: "Jesus told a parable to 'certain people who were convinced of their own righteousness' (Luke 18:9). Two men went up to the temple to pray. The Pharisee compared himself to others and listed his achievements.", show: quote("Luke 18:11-12") },
    { say: "The tax collector, despised as a collaborator with Rome, would not even look up. Jesus said that he, not the Pharisee, went home justified (made right with God).", show: quote("Luke 18:13-14") },
    { say: "Scripture's standard: think of yourself 'reasonably', that is, truly, and value others.", show: quotes(["Romans 12:3", "Philippians 2:3", "Micah 6:8"]) },
    { say: "Socrates' friend Chaerephon asked the oracle at Delphi whether anyone was wiser than Socrates. The answer: no one. Puzzled, Socrates questioned politicians, poets and craftsmen who were thought wise. He concluded that they believed they knew things they did not, while he at least knew that he did not know. This is <b>intellectual humility</b> (Plato, Apology 21a–23b).", show: pas("Socrates and the oracle", "Socrates did not conclude, 'I am the cleverest man alive.'\n\nHe concluded that human wisdom is worth little, and that the wisest person is the one who, like him, recognises how little he truly knows.\n\nThat recognition made him keep asking questions all his life.") },
    { say: "In a letter to Robert Hooke, Isaac Newton wrote: 'If I have seen further it is by standing on ye sholders of Giants.' (original spelling) The letter is dated 5 February 1675 in the English calendar of the time, whose year began on 25 March; by our reckoning that is February 1676. The image was not his own: about 1120 Bernard of Chartres compared his generation to dwarfs on the shoulders of giants.", show: S(svg(T(300, 40, "Standing on the shoulders of giants", 24) + `<circle cx='300' cy='105' r='30' fill='#e0f2f1' stroke='#0f766e' stroke-width='4'/><rect x='230' y='140' width='140' height='150' rx='20' fill='#e0f2f1' stroke='#0f766e' stroke-width='4'/><circle cx='300' cy='75' r='14' fill='#b45309'/>` + T(300, 225, "those who", 21) + T(300, 252, "came before", 21) + T(110, 160, "Newton, 1676", 22, "#7c2d12") + T(490, 160, "Bernard,", 22, "#7c2d12") + T(490, 188, "c. 1120", 22, "#7c2d12"))) },
    { say: "Feelings. <b>Healthy satisfaction</b> ('I worked hard and it went well') is good and honest. <b>Arrogance</b> needs others to be lower. <b>False modesty</b> ('it was terrible') when it was not, is a small lie. And <b>envy</b> is pride's twin: it cannot bear another's success. Humility can rejoice when others do well.", show: tbl([["Response to winning a prize", "What it shows"], ["'I'm better than all of you.'", "arrogance"], ["'Oh, it was rubbish, really.' (untrue)", "false modesty: dishonest"], ["'Thank you. I worked hard, and my teacher helped me a great deal.'", "humility: true and grateful"]]) },
    explain("Explain why false modesty is not humility, using our definition and the honesty definition."),
  ],
  practice: [
    ch("Which best describes humility?", ["knowing you don't know everything, being willing to learn, and not thinking yourself more important than you are", "thinking that you are worthless and have nothing to offer", "refusing all praise, even when it is true and deserved", "pretending to be bad at things so others feel better"], "Humility is honesty about yourself.", "Humility: knowing that you don't know everything; being willing to learn from others; not thinking of yourself as more important than you are. It sees yourself truly, neither too high nor falsely low."),
    ch("To whom did Jesus tell the parable of the Pharisee and the tax collector?", ["people convinced of their own righteousness who despised others", "tax collectors who were ashamed of how they had cheated", "the twelve disciples, on the night before he was arrested", "a crowd of Roman soldiers stationed in Jerusalem"], "Luke 18:9.", "It was aimed at those who trusted in themselves and looked down on others."),
    ch("What did the Pharisee do in his prayer?", ["thanked God he was not like other men and listed his fasting and tithes", "stood far off, beat his breast and asked God to be merciful to him", "prayed that the tax collector would repent and be forgiven", "confessed that he had cheated people and promised to repay them"], "Luke 18:11–12.", "He compared himself favourably with others and recited his achievements."),
    ch("What did the tax collector pray?", ["God, be merciful to me, a sinner!", "Thank you that I am rich.", "Make me famous.", "Punish the Pharisee."], "Luke 18:13.", "He asked only for mercy, acknowledging the truth about himself."),
    ch("Who went home justified, according to Jesus?", ["the tax collector", "the Pharisee", "both", "neither"], "Read Luke 18:14.", "'This man went down to his house justified rather than the other.'"),
    ch("James 4:6: 'God resists the proud, but gives grace to the...'", ["humble", "strong", "wealthy", "clever"], "The opposite of proud.", "'God resists the proud, but gives grace to the humble.' (WEB)"),
    ch("Romans 12:3 tells each person not to think of himself more highly than he ought, but to think...", ["reasonably", "lowly", "loudly", "nothing at all"], "It does not say to think badly of yourself.", "'...but to think reasonably.' Humility is accurate self-judgment."),
    ch("Proverbs 11:2: 'When pride comes, then comes shame, but with humility comes...'", ["wisdom", "riches", "silence", "fame"], "Humility opens the door to learning.", "'With humility comes wisdom.'"),
    ch("Who asked the Delphic oracle whether anyone was wiser than Socrates?", ["his friend Chaerephon", "Plato", "Aristotle", "the king of Persia"], "Plato's Apology 21a.", "Chaerephon asked; the oracle replied that no one was wiser."),
    ch("What did Socrates conclude from questioning people thought to be wise?", ["They thought they knew what they did not; he at least knew that he did not know.", "They really were wise, so the oracle must have been mistaken about Socrates himself.", "He was the cleverest person in Athens, as the oracle had plainly told his friend.", "Nobody can know anything at all, so there is no point in seeking wisdom."], "What was the difference between him and them?", "His wisdom was awareness of his ignorance: intellectual humility."),
    ch("To whom did Newton write 'If I have seen further it is by standing on ye sholders of Giants'?", ["Robert Hooke", "Galileo", "the King", "Benjamin Franklin"], "A fellow scientist, in 1676.", "The letter to Robert Hooke is dated 5 February 1675 in the old English reckoning, in which the new year began on 25 March; we call that February 1676."),
    ch("Was the image of standing on the shoulders of giants Newton's own invention?", ["No; Bernard of Chartres used it about 1120, as John of Salisbury reported in 1159.", "Yes; Newton invented it in 1676, and later writers copied it from his letter.", "Yes; Newton invented it, though Robert Hooke later claimed that it was his idea.", "No; it comes from the book of Proverbs, which Newton often quoted in his letters."], "Check the earlier source.", "The image is centuries older than Newton, which is itself a lesson in building on predecessors."),
    num("Bernard's image was reported by John of Salisbury in 1159; Newton used it in 1676. How many years apart?", 517, "Subtract.", "1676 − 1159 = 517 years."),
    ch("You win the chess tournament. Which response is humble AND honest?", ["'Thank you. I've practised a lot, and my coach helped me.'", "'I was just lucky; I'm terrible at chess.' (untrue)", "'Of course I won. Nobody else was any good.'", "Say nothing and look bored."], "Humility must still be truthful.", "Humility acknowledges real effort and real help without boasting or false self-deprecation."),
    ch("Your friend wins a prize you wanted. Which feeling must humility overcome?", ["envy", "gratitude", "contentment", "curiosity"], "Which feeling cannot bear another's success?", "Envy resents others' good; humility can rejoice with them (Romans 12:15)."),
    G.virtue(18, ["humility", "honesty", "gratitude", "perseverance"]), G.choose(18, ["humility"]), G.choose(18, ["humility"]), G.reason(), G.verse(["humility"]), G.verse(["humility"]), G.bible(["humility"]), G.think(["Socrates", "Plato", "Aristotle"]), G.hero(["Isaac Newton", "Socrates", "Marcus Aurelius", "George Washington"]), G.feel(), G.def(18),
  ],
  challenge: [
    ch("The Pharisee's list of fasting and tithing may have been TRUE. Why was his prayer still wrong?", ["True facts were used to exalt himself and despise others; he saw part of the truth but not his need of mercy.", "Fasting and tithing are wrong in themselves, so listing them in prayer was bound to offend God.", "His facts must have been false, because Jesus would not criticise anyone who told the truth.", "He prayed in the temple, and Jesus taught that prayer should only be offered at home in secret."], "A reason can be true and still not support the conclusion. What conclusion did he draw?", "His facts were not the problem; his conclusion ('I am better, I need nothing') did not follow and ignored the truth about his heart."),
    ch("Socrates said he was wiser only because he knew that he did not know. A student replies: 'Then the most ignorant person is the wisest.' What is wrong?", ["His point concerns awareness of the limits of one's knowledge, not having little; he sought knowledge all his life.", "Nothing is wrong: if knowing that you do not know is wisdom, then knowing nothing is the greatest wisdom.", "The error is that Socrates secretly believed he knew everything, so his statement was only false modesty.", "The error is that the oracle never spoke about Socrates, so his claim to wisdom had no basis at all."], "Is it ignorance itself, or knowing your ignorance, that he valued?", "Intellectual humility is accurate awareness of what you do and do not know, which drives further learning."),
    ch("Some historians suggest Newton's 'giants' line was partly a jab at Hooke, who was short. What is the best way to treat this claim?", ["As a possible interpretation with limited evidence: present it as debated, not as fact.", "As certainly true, since it is often repeated and makes Newton's letter more interesting.", "As certainly false, since Newton was always polite to everyone he wrote to.", "As irrelevant, since the motives of historical figures can never be studied."], "How strong is the evidence for a hidden motive in a letter?", "Claims about hidden motives need evidence; when it is thin, honest historians label them as debated."),
    ch("Argument: 'Humble people never accept praise. Maria accepted praise. So Maria is not humble.' What is wrong?", ["The first premise is false: humility can accept praise gratefully and truthfully.", "The second premise is false: Maria did not really accept the praise she received.", "Nothing is wrong: the form is valid and both premises are clearly true.", "The argument is invalid, since the conclusion does not follow from the premises."], "Test the first reason with the definition.", "Humility means not thinking yourself more important than you are; accepting true praise honestly and gratefully is compatible with it."),
    ch("Why might humility make a person a better scientist?", ["It makes her willing to test her own ideas and change her mind when evidence shows she was wrong.", "It makes her less likely to publish her results, so she avoids embarrassing public mistakes.", "It makes her trust whatever famous scientists say, which saves time on checking their work.", "It makes her work fewer hours, which leaves more time for rest and quiet reflection."], "Recall the Piltdown lesson.", "Intellectual humility keeps one open to evidence and correction, which science depends on."),
    G.reason(),
  ],
  extend: "Read Luke 18:9–14 and then Plato's Apology 20e–23c (Jowett translation, public domain). Write a paragraph comparing the tax collector and Socrates: what does each see truly about himself?",
  offline: "The 'shoulders' list: write the names of five people whose work you build on (teachers, authors, inventors of tools you use) and one sentence on what each gave you. Explain it: tell a grown-up, in 2–4 sentences, why humility is a form of honesty.",
}),
// ---------- Lesson 19 ----------
lesson({
  title: "Slow to anger: patience and the unsent letter", icon: "🌋",
  learn: [
    { say: "Self-control, our definition says, is choosing to wait, to stop, to hold back, even when you want to go ahead. Its hardest test is <b>anger</b>. Anger itself is not always wrong: it signals that something seems wrong or unjust. Scripture says, 'Be angry, and don't sin.' The question is what we do next.", show: quotes(["Ephesians 4:26", "James 1:19"]) },
    { say: "Proverbs contrasts two ways of handling anger, and ranks inner self-rule above military conquest.", show: quotes(["Proverbs 29:11", "Proverbs 15:1", "Proverbs 16:32"]) },
    { say: "<b>Joseph</b>, sold by his brothers at seventeen, served in Egypt and was then falsely accused by his master's wife and thrown into prison (Genesis 39). Even there 'Yahweh was with Joseph'. He interpreted the dream of Pharaoh's cupbearer, asking only to be remembered. The cupbearer forgot him for two full years. Joseph stood before Pharaoh at thirty (Genesis 41:46).", show: quotes(["Genesis 39:21", "Genesis 40:23"]) },
    { say: "History. After the Battle of Gettysburg (1–3 July 1863), General Meade let Lee's defeated army escape across the Potomac. On 14 July Abraham Lincoln wrote Meade a sharp letter saying how deeply distressed he was. Then he put it in an envelope endorsed to say that it was never sent or signed. It was found among his papers after his death.", show: pas("Lincoln's unsent letter (14 July 1863)", "Lincoln had real grounds for disappointment: many believed the escape prolonged the war.\n\nHe never explained why he held the letter back. A likely reason is that sending it would have wounded a general who had just won a great battle, and done no good.\n\nWriting it let him name his anger; not sending it was self-control. Many people still use this method: write the angry letter, wait, then decide.") },
    { say: "<b>Epictetus</b> (about AD 50–135) was born into slavery, later freed, and became a teacher of Stoic philosophy. The handbook of his teaching, compiled by his student Arrian, begins: some things are within our power and some are not. Our judgments, choices and desires are up to us; other people's actions, our reputation and much else are not. Anger often comes from demanding control of what is not ours to control.", show: S(svg(T(300, 40, "Epictetus: what is up to me?", 24) + `<circle cx='300' cy='180' r='120' fill='#fff7ed' stroke='#b45309' stroke-width='4'/><circle cx='300' cy='180' r='78' fill='#e0f2f1' stroke='#0f766e' stroke-width='4'/>` + T(300, 174, "my choices,", 19) + T(300, 198, "my response", 19) + T(515, 196, "other people,", 19, "#7c2d12") + T(515, 222, "weather,", 19, "#7c2d12") + T(515, 248, "the past", 19, "#7c2d12") + T(510, 120, "NOT up", 22, "#7c2d12") + T(510, 148, "to me", 22, "#7c2d12") + T(80, 180, "up to me", 22, "#0f4c45"))) },
    { say: "Know your anger. The body gives early signs: a hot face, a tight jaw, clenched fists, a racing heart, a louder voice. Notice them early, when stopping is still easy. Then cool down before you decide anything.", show: tbl([["Step", "What to do"], ["Notice", "hot face, fists, racing heart"], ["Stop", "do not speak or act yet"], ["Breathe", "slowly, with the out-breath longer than the in-breath"], ["Name", "'I am angry because I think that was unfair.'"], ["Choose", "a gentle answer, a request, or walking away for now"]]) },
    explain("Explain how Lincoln's unsent letter uses both honesty and self-control, and how Epictetus would advise someone who is angry at the weather on a picnic day."),
  ],
  practice: [
    ch("What does Ephesians 4:26 say about anger?", ["Be angry, and don't sin; don't let the sun go down on your wrath.", "Never feel anger, because every angry feeling is itself a sin.", "Anger is always holy when it is directed at someone who wronged you.", "Express your anger loudly at once, so that it does not stay inside."], "Notice the two parts of the verse.", "Anger is not forbidden, but it must not lead to sin, and it must not be nursed overnight."),
    ch("James 1:19: be swift to hear, slow to speak, and slow to...", ["anger", "learn", "help", "forgive"], "Three instructions in a row.", "'...swift to hear, slow to speak, and slow to anger.'"),
    ch("Proverbs 15:1: 'A gentle answer turns away wrath, but a harsh word...'", ["stirs up anger", "ends the argument", "shows wisdom", "brings peace"], "Contrast gentle and harsh.", "Harsh words provoke more anger; gentle ones defuse it."),
    ch("Proverbs 16:32 says one who rules his spirit is better than...", ["he who takes a city", "a wise king", "a rich man", "a strong ox"], "Self-rule versus military victory.", "'One who rules his spirit, than he who takes a city.' Inner self-control is the greater conquest."),
    ch("Proverbs 29:11: 'A fool vents all of his anger, but a wise man...'", ["brings himself under control", "shouts louder", "hides forever", "blames others"], "What does the wise man do with his anger?", "He brings himself under control. (WEB)"),
    ch("Why was Joseph put in prison?", ["He was falsely accused by his master's wife.", "He was caught stealing silver from Pharaoh's palace.", "He had refused to interpret Pharaoh's dreams.", "His brothers reported him to the Egyptian guards."], "Genesis 39.", "He was innocent; the accusation was false."),
    ch("What did the cupbearer do after Joseph interpreted his dream?", ["He forgot Joseph for two full years.", "He freed Joseph at once.", "He told Pharaoh immediately.", "He paid Joseph."], "Genesis 40:23 and 41:1.", "'The chief cup bearer didn't remember Joseph, but forgot him.' Two years passed."),
    num("Joseph was 17 when he was sold (Genesis 37:2) and 30 when he stood before Pharaoh (Genesis 41:46). How many years of waiting and hardship was that?", 13, "Subtract.", "30 − 17 = 13 years."),
    ch("Why did Lincoln write the letter to Meade?", ["He was distressed that Meade had let Lee's army escape after Gettysburg.", "He was furious that Meade had lost the Battle of Gettysburg to General Lee.", "He wanted to thank Meade warmly for winning the war in a single battle.", "He meant to dismiss Meade from the army for disobeying a direct order."], "What happened after the battle?", "Lee's army escaped across the Potomac, prolonging the war."),
    ch("What did Lincoln do with the letter?", ["He never sent or signed it.", "He sent it by telegraph.", "He published it in a newspaper.", "He read it aloud to Congress."], "It was found among his papers.", "The envelope was marked as never sent or signed: honest feelings, controlled action."),
    ch("Which strategy does Lincoln's letter illustrate?", ["Write out your anger, then wait before deciding whether to send it.", "Say the first thing you think, so that your feelings stay honest.", "Hide your anger completely, so that no one can ever detect it.", "Let a trusted friend express your anger for you in your place."], "He wrote, then held back.", "Writing names the feeling truthfully; waiting gives self-control time to work."),
    ch("Epictetus was born...", ["into slavery, and was later freed", "into the family of a Roman emperor", "into a wealthy family of Athenian philosophers", "in Rome, as the son of a senator"], "His life gave him reason to think about what is truly in our control.", "He was born enslaved around AD 50 and later freed; he taught Stoic philosophy."),
    ch("According to Epictetus, which is within our power?", ["our own choices and judgments", "the weather", "what other people think of us", "the past"], "What can you actually decide?", "Our judgments, choices and desires are up to us; external things are not."),
    ord("Put the anger steps in order.", ["Notice the body's signs", "Stop", "Breathe slowly", "Name the feeling and its cause", "Choose a response"], "You cannot stop what you have not noticed.", "Notice, stop, breathe, name, choose."),
    ch("It rains on your picnic day and you feel angry. What would Epictetus advise?", ["The weather is not in your power; put your effort into your response, such as an indoor picnic.", "Complain to everyone about the rain, since honest feelings should always be expressed fully.", "Refuse to enjoy anything that day, since the plan you wanted has been ruined.", "Blame whoever chose the date, since someone must be responsible for the bad weather."], "Is the rain up to you?", "Anger at what we cannot control wastes strength; choose what IS up to you."),
    G.virtue(19, ["self-control", "kindness", "perseverance"]), G.choose(19, ["self-control"]), G.choose(19, ["self-control"]), G.reason(), G.verse(["self-control"]), G.verse(["self-control"]), G.bible(["self-control"]), G.think(["Epictetus", "Socrates", "Aristotle", "Plato"]), G.hero(["Abraham Lincoln", "George Washington", "Benjamin Franklin", "Eric Liddell"]), G.feel(), G.def(19),
  ],
  challenge: [
    ch("Lincoln's anger at Meade was based on a true fact: Lee's army escaped. Was the anger therefore justified, and the letter therefore right to send?", ["The anger may have been reasonable, but sending the letter is a separate question of consequences and duty; he may well have judged it would do more harm than good.", "Yes: anger based on a true fact is justified, and justified anger must always be expressed in full to the person concerned.", "No: a President should feel no anger at all, so the letter was wrong to write even if he never sent it.", "The question does not arise, because Lincoln sent the letter and Meade resigned soon afterwards."], "Separate two questions: Is the feeling reasonable? Is the action wise?", "A true reason for a feeling does not by itself justify every action the feeling suggests."),
    ch("A student says: 'Epictetus says other people's actions are not up to me, so I should never try to stop a bully.' What is the error?", ["Our own actions (speaking up, fetching help) ARE up to us; Epictetus only warns against demanding outcomes we cannot control.", "There is no error: Epictetus teaches that we should accept everything others do without ever trying to change it.", "The error is that Epictetus taught that we can control everything, including other people's choices.", "The error is that bullying is a matter of fate, so neither Epictetus nor anyone else could do anything about it."], "What is within your power in that situation?", "You cannot control the bully's will, but you can choose to act rightly. The outcome is not yours; the choice is."),
    ch("Joseph waited thirteen years in hardship. Which verse best explains how he understood those years when he later met his brothers?", ["Genesis 50:20: 'you meant evil against me, but God meant it for good'", "Proverbs 29:11: a fool vents all of his anger, but a wise man brings himself under control", "Ephesians 4:26: be angry, and don't sin; don't let the sun go down on your wrath", "James 1:19: let every man be swift to hear, slow to speak, and slow to anger"], "Which verse speaks of God's purpose in what others meant for harm?", "Joseph saw God's purpose working through injustice, which allowed patience without bitterness."),
    ch("Why is it wise to act on anger only after the body has calmed down?", ["Strong anger narrows attention and makes us misjudge; calmer judgment weighs reasons better.", "Anger is always sinful, so any action taken while angry will certainly be wrong.", "The other person will usually forget the problem if you wait long enough.", "Calm people never need to act at all, so waiting usually removes the need."], "Recall how you speak when your face is hot.", "Self-control buys time for prudence: the reasons can then be tested for truth and relevance."),
    ch("Argument: 'Wise people control their anger. I never get angry. So I am wise.' What is wrong?", ["It treats one sign of wisdom as proof of wisdom; and never feeling anger may mean not caring about injustice.", "Nothing is wrong: it is valid, and both premises are true for anyone who rarely becomes angry.", "The first premise is false, because wise people never feel any emotions at all.", "The second premise proves too little, because anger can only be controlled by medicine."], "Does 'all wise people do X' mean 'everyone who does X is wise'?", "That reverses the 'if... then', and the 'never angry' premise may hide indifference rather than virtue."),
    G.reason(),
  ],
  extend: "Read Genesis 39–41 with a parent. Mark every place where Joseph could have become bitter and note what he did instead. Then read the opening chapter of Epictetus's Enchiridion (public domain, e.g. the Elizabeth Carter translation).",
  offline: "Make an 'anger plan' card: list your body's warning signs, two cooling strategies that work for you, and one sentence you can say ('I need a minute; I'll come back'). Keep it where you can see it. Explain it: tell a grown-up, in 2–4 sentences, what Epictetus meant and how it helps with anger.",
}),
// ---------- Lesson 20 ----------
lesson({
  title: "Owning mistakes: name, understand, repair, forgive", icon: "🧩",
  learn: [
    { say: "Honesty again, now about our own wrongs. Our family's four steps: <b>name it</b> (say plainly what you did), <b>understand it</b> (why it happened and how it hurt), <b>repair it</b> (make it right as far as you can), and <b>forgive</b> (receive and give forgiveness, and let go of punishment).", show: S(svg(T(300, 40, "Owning a mistake", 24) + box(20, 90, 130, 90, "#e0f2f1", "#0f766e") + T(85, 145, "Name", 24) + box(160, 90, 130, 90, "#e0f2f1", "#0f766e") + T(225, 135, "Under-", 22) + T(225, 162, "stand", 22) + box(300, 90, 130, 90, "#e0f2f1", "#0f766e") + T(365, 145, "Repair", 24) + box(440, 90, 140, 90, "#0f766e", "#0f4c45") + T(510, 145, "Forgive", 24, "#fff") + T(300, 240, "not: excuse, hide, or blame", 22, "#7c2d12") + T(300, 280, "Proverbs 28:13", 20, "#555"))) },
    { say: "Scripture promises mercy to the one who confesses, and puts reconciliation before worship.", show: quotes(["Proverbs 28:13", "Matthew 5:23-24"]) },
    { say: "<b>Zacchaeus</b> was a rich chief tax collector in Jericho, and by his own words he had wrongfully taken money from people. After Jesus came to his house, he named his wrong and promised to repair it generously. For fraud that a person confessed, the law asked for the sum plus a fifth (Leviticus 6:5); Zacchaeus chose the much heavier fourfold standard that the law set for a stolen sheep (Exodus 22:1).", show: quote("Luke 19:8") },
    { say: "<b>Joseph's</b> brothers had sold him into slavery. Years later, as governor of Egypt, he forgave them. Forgiveness did not pretend the wrong was small: 'you meant evil against me.' And Jesus told Peter there is no limit to forgiveness.", show: quotes(["Genesis 50:20", "Matthew 18:21-22", "Colossians 3:13"]) },
    { say: "History. <b>Corrie ten Boom</b>'s family in Haarlem hid Jewish people from the Nazis; her sister Betsie died in Ravensbrück camp in 1944. In 1947 in Munich a former Ravensbrück guard, now a Christian, asked Corrie's forgiveness. By her own account she felt only coldness, prayed for help, took his hand, and forgave him.", show: pas("Forgiveness is not a feeling first", "Corrie ten Boom wrote that she could not produce the feeling of forgiveness. She chose the act, taking his hand, and the feeling followed.\n\nForgiving him did not mean pretending Ravensbrück was not evil. It meant releasing her claim to punish him.\n\nSource: her own published accounts. We know of the meeting chiefly through her.") },
    { say: "An <b>apology</b> names the wrong and takes responsibility. An <b>excuse</b> explains it away. Compare: 'I'm sorry I broke your pencil; I was careless. I'll replace it' versus 'Sorry, but you left it on the edge.' The second shifts blame.", show: tbl([["Apology", "Excuse"], ["'I broke it.'", "'It broke.'"], ["'I was careless.'", "'You shouldn't have left it there.'"], ["'I'll replace it.'", "'It was old anyway.'"]]) },
    { say: "A new tool for reasoning. An argument is <b>valid</b> if, supposing its premises were true, the conclusion would have to be true. It is <b>sound</b> if it is valid AND its premises really are true. Only a sound argument proves its conclusion.", show: tbl([["Argument", "Valid?", "Premises true?", "Sound?"], ["All fish swim. A trout is a fish. So a trout swims.", "yes", "yes", "yes"], ["All birds can talk. A sparrow is a bird. So a sparrow can talk.", "yes", "no", "no"], ["Some apples are red. So this apple is red.", "no", "—", "no"]]) },
    explain("Walk through the four steps (name, understand, repair, forgive) for a real or imagined mistake, and explain why an excuse fails the first step."),
  ],
  practice: [
    ord("Put the four steps of owning a mistake in order.", ["Name it", "Understand it", "Repair it", "Forgive"], "You cannot repair what you have not named.", "Name, understand, repair, forgive."),
    ch("Proverbs 28:13 says one who conceals his sins doesn't prosper, but whoever confesses and renounces them...", ["finds mercy", "is punished twice", "is forgotten", "becomes rich"], "Confession leads somewhere good.", "'Whoever confesses and renounces them finds mercy.' (WEB)"),
    ch("According to Matthew 5:23–24, what should you do if you remember that your brother has something against you while offering a gift at the altar?", ["Go and be reconciled first, then offer your gift.", "Offer a larger gift to make up for the quarrel.", "Finish your worship and settle it some other day.", "Wait at the altar until your brother comes to you."], "Which comes first: reconciliation or the offering?", "Jesus puts repairing the relationship before the gift."),
    ch("What did Zacchaeus promise to do for anyone he had cheated?", ["restore four times as much", "say sorry", "pay back half", "nothing"], "Luke 19:8.", "'If I have wrongfully exacted anything of anyone, I restore four times as much.'"),
    num("Zacchaeus had overcharged a man by 15 coins. If he restored four times as much, how many coins did he give back?", 60, "Multiply by four.", "15 × 4 = 60 coins."),
    ch("Which of the four steps is Zacchaeus' fourfold repayment?", ["repair", "name", "forgive", "understand"], "Making it right.", "Restitution (paying back) repairs the harm."),
    ch("In Genesis 50:20, what did Joseph say about what his brothers had done?", ["You meant evil against me, but God meant it for good.", "What you did was nothing; I hardly noticed it at all.", "I will repay you for this when our father has died.", "I have forgotten everything that happened long ago."], "He named the wrong honestly and saw God's purpose.", "Forgiveness did not deny the evil; it named it and trusted God's good purpose."),
    ch("Peter asked if he should forgive seven times. Jesus answered...", ["until seventy times seven", "only three times", "exactly seven times", "never"], "Matthew 18:22.", "Jesus' answer means: without keeping count."),
    ch("Colossians 3:13 says to forgive each other 'even as...'", ["Christ forgave you", "they deserve", "the law requires", "you feel like it"], "The standard is a model.", "'Even as Christ forgave you, so you also do.'"),
    ch("Where did Corrie ten Boom's sister Betsie die?", ["Ravensbrück concentration camp", "Haarlem", "Munich", "London"], "The camp where both sisters were held.", "Betsie died at Ravensbrück in December 1944."),
    ch("According to her account, how did Corrie ten Boom manage to forgive the former guard?", ["She prayed for help and took his hand; the feeling of forgiveness followed the act.", "She felt warm forgiveness at once, so taking his hand was easy and natural.", "She waited until she no longer remembered the camp, and then forgave him.", "He paid her compensation, which made it possible for her to forgive."], "Did the feeling come first or the choice?", "She describes choosing the act while feeling cold; forgiveness began as a decision."),
    ch("Which is an apology rather than an excuse?", ["'I'm sorry I shouted. I was wrong to speak to you that way.'", "'I'm sorry I shouted, but you made me angry in the first place.'", "'I only shouted because I was tired and hungry after school.'", "'Everyone shouts sometimes, so you shouldn't be so upset.'"], "Does it take responsibility, or shift it?", "A real apology names the wrong and owns it."),
    ch("What is a VALID argument?", ["one where, if the premises were true, the conclusion would have to be true", "one whose premises are all true, whatever conclusion is drawn from them", "one whose conclusion is true, whatever premises are given for it", "one that most listeners find convincing when they first hear it"], "Validity concerns the connection, not the facts.", "Validity is about form: true premises would guarantee the conclusion."),
    ch("What makes an argument SOUND?", ["It is valid and its premises are actually true.", "It sounds convincing when spoken with confidence.", "Its conclusion is true, whatever the premises.", "Its premises are true, whether or not it is valid."], "Sound = valid + ...?", "A sound argument is valid with true premises, so its conclusion is true."),
    ch("'All birds can talk. A sparrow is a bird. So a sparrow can talk.' This argument is...", ["valid but not sound", "sound", "invalid and unsound because sparrows are not birds", "true"], "If both premises were true, would the conclusion follow? Are they true?", "The form is valid, but the first premise is false, so it is unsound."),
    G.virtue(20, ["honesty", "kindness", "humility"]), G.choose(20, ["honesty"]), G.reason(), G.reason(), G.verse(null, ["Proverbs 28:13", "Colossians 3:13", "Genesis 50:20", "Matthew 18:21-22"]), G.verse(["honesty"]), G.bible(["love", "honesty", "justice"]), G.hero(["Corrie ten Boom", "Ignaz Semmelweis", "Sojourner Truth", "Elizabeth Fry"]), G.feel(), G.def(20),
  ],
  challenge: [
    ch("'Whoever confesses and renounces his sins finds mercy (Proverbs 28:13). Zacchaeus confessed and renounced his wrongs. So Zacchaeus found mercy.' Is this argument valid? Is it sound (for a Christian who accepts Scripture)?", ["Valid, and sound if both premises are true; Luke 19:9 confirms that salvation came to his house.", "Invalid, because arguments that use Scripture as a premise cannot be judged for validity.", "Valid but certainly unsound, because Zacchaeus never confessed anything to anyone.", "Invalid, because the conclusion is about Zacchaeus while the premise is about everyone."], "Check the form first, then the premises.", "The form guarantees the conclusion; the premises are supported by Proverbs 28:13 and Luke 19."),
    ch("A friend says: 'If I forgive him, I'm saying what he did was fine.' What is the best reply?", ["Forgiveness names the wrong as wrong (as Joseph did) and then releases the claim to punish; it does not call evil good.", "You are right: forgiving means agreeing that the wrong did not matter, so you should forgive only small things.", "Forgiving means forgetting completely, so you should wait until you can no longer remember what happened.", "You should never forgive, because forgiveness always encourages the other person to do wrong again."], "Recall Genesis 50:20: 'you meant evil.'", "Forgiveness presupposes a real wrong. Calling it fine would be dishonest, not forgiving."),
    ch("Must forgiveness always mean immediately trusting the person again in everything?", ["No: forgiveness releases punishment; trust is rebuilt over time by evidence of change.", "Yes: refusing full trust at once shows that you have not really forgiven at all.", "No: once someone has wronged you, you should never trust them again in anything.", "Only if they apologise twice, since one apology is not enough to show real change."], "Recall the lesson on promises: trust is built slowly.", "Forgiveness is given; trust is earned again. Both are compatible."),
    ch("Construct the most precise description: 'If Mia apologised sincerely, she named her wrong. Mia named her wrong. So Mia apologised sincerely.' Is it valid?", ["No: naming a wrong is necessary for a sincere apology but does not guarantee one; the form is invalid.", "Yes: the form is valid, because the conclusion repeats what the first premise says.", "Yes, provided Mia is an honest person, since honest people always apologise sincerely.", "No: the form is valid, but the premise that Mia named her wrong is false."], "Does 'if A then B' plus 'B' prove 'A'?", "This is the error of affirming the consequent. B can be true without A."),
    ch("Zacchaeus gave fourfold. A student argues: 'He gave more than he owed, so it was not justice but kindness.' Which is the best analysis?", ["Repaying what he took was justice; the law for confessed fraud asked only the sum plus a fifth (Leviticus 6:5), so the rest of the fourfold was generosity: his act combined both.", "It was only kindness: Zacchaeus owed nothing, because the money he took had been collected legally for Rome and so belonged to him.", "It was only justice: the law required fourfold for every kind of wrong, so nothing he gave went beyond what he owed.", "It was neither justice nor kindness, because giving money away under pressure from a crowd cannot be a virtue."], "What did the law ask for confessed fraud (Leviticus 6:5), and what for a stolen sheep (Exodus 22:1)?", "Careful reasoning separates restitution owed from generosity freely given, and checks the background law: the sum plus a fifth for confessed fraud (Leviticus 6:5), fourfold only for theft of a sheep (Exodus 22:1)."),
    G.reason(),
  ],
  extend: "Read Genesis 42–45 (the brothers' visits to Egypt) and Luke 19:1–10. Note how Joseph tests whether his brothers have changed before revealing himself. Discuss: what is the difference between forgiving someone and trusting him again?",
  offline: "Think of one mistake from this month. Write four lines: Name it. Understand it. Repair it (what you did or will do). Forgive (yourself, or someone else involved). Do the repair this week if you have not. Explain it: tell a grown-up, in 2–4 sentences, the difference between a valid argument and a sound one, with your own example.",
}),
// ---------- Lesson 21 ----------
lesson({
  title: "Courage: the hardest problem first", icon: "🏔️",
  learn: [
    { say: "Courage is doing the right thing even when it is scary or hard. This week's practice is small but real: <b>try the hardest problem first</b>, while your mind is fresh, instead of circling it all day. Courage is built in small acts as well as great ones.", show: big("Courage:\ndoing the right thing\neven when it is scary or hard") },
    { say: "The Philistine champion <b>Goliath</b> challenged Israel's army for forty days, and every soldier was afraid (1 Samuel 17). Ancient copies differ about his height. The standard Hebrew text (the Masoretic Text, which the World English Bible follows) says six cubits and a span (nearly 3 metres). The oldest surviving Hebrew copy of this verse, a Dead Sea Scroll, and the ancient Greek translation (the Septuagint) say four cubits and a span (about 2 metres). Either way, he towered over a shepherd boy.", show: quote("1 Samuel 17:4") },
    { say: "David's courage was not a guess. He reasoned from <b>true evidence</b>: God had already delivered him from a lion and a bear. Then he named the real reason he could face Goliath.", show: quotes(["1 Samuel 17:37", "1 Samuel 17:45"]) },
    { say: "History. In January 1915 <b>Ernest Shackleton</b>'s ship <i>Endurance</i> was trapped in Antarctic ice; in October the ice crushed her, and in November she sank. The 28 men reached Elephant Island; Shackleton and five others sailed the small <i>James Caird</i> about 800 miles to South Georgia for help. On <b>30 August 1916</b> every man was rescued.", show: tbl([["Date", "Event"], ["Jan 1915", "Endurance trapped in the ice of the Weddell Sea"], ["Oct–Nov 1915", "the ship is crushed (October) and sinks (21 November)"], ["Apr 1916", "the men reach Elephant Island in three boats"], ["Apr–May 1916", "James Caird voyage, about 800 miles, to South Georgia"], ["30 Aug 1916", "rescue: all 28 men of the Endurance party survive"]]) },
    { say: "A TRUTH check. A famous 'advertisement' supposedly read: 'Men wanted for hazardous journey... safe return doubtful.' No copy has ever been found in any newspaper, despite long searches. It is probably invented. Likewise the advice 'eat a live frog first thing in the morning' is often credited to Mark Twain, but no one has found it in his writings.", show: tbl([["Claim", "Evidence", "Verdict"], ["Shackleton's men all survived", "diaries, photographs, records", "history"], ["the 'Men wanted' advertisement", "never found", "probably invented"], ["Twain's 'eat a live frog'", "not found in his writings", "unsupported attribution"]]) },
    { say: "Aristotle placed courage between <b>cowardice</b> (fleeing what should be faced) and <b>rashness</b> (rushing into danger without good reason). Shackleton's courage was full of <b>prudence</b>: careful planning, weighing risks, and refusing needless danger. Courage is not the absence of fear; it is right action with fear in its proper place.", show: S(meanSvg("cowardice", "courage", "rashness", "Aristotle's mean: facing danger")) },
    { say: "Feelings. <b>Dread</b> and <b>excitement</b> feel surprisingly alike in the body: a fast heart, alert mind, butterflies. Dread says, 'This will go badly.' Excitement says, 'This matters, and I am ready.' Before a hard task you can truthfully say, 'My body is getting ready.' In one 2014 set of experiments (by Alison Wood Brooks), adults who said 'I am excited' before singing, public speaking or a maths test did somewhat better than those who said 'I am calm'. These were small studies with adults, not children: treat them as a promising hint, not a proven rule.", show: tbl([["Dread", "Excitement"], ["fast heart, butterflies", "fast heart, butterflies"], ["'This will go badly.'", "'This matters, and I am ready.'"], ["avoid the hardest problem", "start with the hardest problem"]]) },
    explain("Explain why David's courage was not rashness. Use the words 'evidence' and 'reason'."),
  ],
  practice: [
    ch("What is courage, in our definition?", ["doing the right thing even when it is scary or hard", "feeling no fear at all in the face of danger", "taking dangerous risks to show others you are bold", "being stronger than anyone who opposes you"], "Courage is about the right thing.", "Courage: doing the right thing even when it is scary or hard."),
    ch("For how many days did Goliath challenge Israel's army?", ["forty", "seven", "three", "one hundred"], "1 Samuel 17:16.", "He came out morning and evening for forty days."),
    ch("Why do books give different heights for Goliath?", ["Ancient copies differ: the standard Hebrew text says six cubits and a span; a Dead Sea Scroll and the Greek Septuagint say four.", "Different writers measured him on different days, and he grew taller during the forty days.", "No one wrote anything down at the time, so every number is a modern guess by scholars.", "Cubits are a modern unit, so ancient readers would not have understood any of the numbers."], "Copies of ancient texts sometimes differ; scholars compare them.", "Comparing manuscripts is part of weighing evidence; the main point, that he was a giant warrior, is unaffected."),
    ch("What evidence did David give King Saul that he could fight Goliath?", ["God had delivered him from a lion and a bear while he kept sheep.", "He had already defeated many Philistine soldiers in earlier battles.", "He was the tallest and strongest of the sons of Jesse.", "Samuel had promised him that he would never be wounded in war."], "1 Samuel 17:37.", "David reasoned from past experience of God's faithfulness: true evidence, not wishful thinking."),
    ch("In 1 Samuel 17:45, David said he came against Goliath...", ["in the name of Yahweh of Armies", "with a sword and a spear", "with Saul's armour", "with a hundred soldiers"], "Goliath had weapons; what did David have?", "'I come to you in the name of Yahweh of Armies.'"),
    ch("What happened to the ship Endurance?", ["It was trapped and crushed by Antarctic ice, and sank in November 1915.", "It reached the coast of Antarctica and was used for the return voyage.", "It was wrecked by a storm in the Atlantic on its way south in 1914.", "It returned safely to England after the crew had been rescued."], "Ice, not storm.", "Pack ice trapped her in January 1915 and crushed her later that year."),
    ch("How did Shackleton get help for the men on Elephant Island?", ["He sailed about 800 miles in a small boat to South Georgia and crossed its mountains to a whaling station.", "He sent a radio message from the island, and a British warship arrived within a week to collect everyone.", "He waited on the island until a passing whaling ship happened to see the smoke from the men's fires.", "He walked across the frozen sea to South America with the strongest men, leaving the others behind."], "The James Caird.", "An open-boat voyage of about 800 miles, then a mountain crossing on foot."),
    num("Endurance's party had 28 men. Shackleton took 5 others in the James Caird. How many men waited on Elephant Island?", 22, "28 minus Shackleton and his 5 companions.", "28 − 6 = 22 men stayed on Elephant Island."),
    ch("Why is the famous 'Men wanted for hazardous journey' advertisement probably invented?", ["No copy has ever been found in any newspaper despite searches.", "Shackleton said in his diary that he had never written it.", "Newspapers in 1914 did not print any advertisements at all.", "The wording is too modern for anyone writing before 1950."], "What evidence would we expect if it were real?", "If it had been printed, a copy would almost certainly survive; its absence is strong evidence against it."),
    ch("Where is the saying 'eat a live frog first thing in the morning' found in Mark Twain's writings?", ["Nowhere that researchers have found; the attribution is unsupported.", "In the first chapter of The Adventures of Tom Sawyer (1876).", "In a letter Twain wrote to his daughter about her schoolwork.", "In the opening pages of Twain's autobiography, published in 1924."], "Has anyone actually found it?", "A saying credited to a famous person must be traced to a source. This one has not been."),
    ch("According to Aristotle, what is rashness?", ["rushing into danger without good reason: the excess of courage", "the virtue that lies between cowardice and boldness", "fleeing from danger too quickly: the deficiency of courage", "the same thing as courage, seen by people who dislike it"], "Picture the line: cowardice, courage, ...", "Rashness is too much boldness, without prudence."),
    ch("Which choice shows courage rather than rashness?", ["Planning carefully before a dangerous rescue that must be made", "Jumping off a high wall to impress friends", "Swimming in a storm for fun", "Running across a busy road on a dare"], "Is there a good reason for the danger?", "Courage faces danger for a good end, with prudence; rashness seeks danger needlessly."),
    ch("How are dread and excitement alike?", ["Both bring a fast heartbeat and alert body; they differ in what we tell ourselves.", "Both are pleasant feelings that make a person eager to begin a hard task.", "Both make the body slow and sleepy, which is why tasks feel harder.", "They are completely different in the body, though people confuse their names."], "Recall the table.", "The body's arousal is similar; the meaning we give it differs."),

    ch("David refused Saul's armour (1 Samuel 17:39). Why is that a sign of good judgment, not rashness?", ["He had not tested it and could not move well in it; he used the sling he knew.", "He wanted to look braver than the soldiers who were wearing their armour.", "The law forbade anyone who was not a soldier from wearing a king's armour.", "He thought the armour was unlucky, because Saul had lost battles in it."], "Read verse 39: 'I have not tested them.'", "He chose tested tools over untested ones: prudence serving courage."),

  challenge: [
    ch("Argument: 'Brave people feel no fear. Shackleton's men were afraid on the ice. So they were not brave.' What is wrong?", ["The first premise is false: courage is acting rightly despite fear, not the absence of fear.", "The second premise is false: the diaries show that none of the men were ever afraid on the ice.", "Nothing is wrong: the argument is valid and its premises are true, so the men were not brave.", "The argument is invalid, because its conclusion does not follow even if both premises are true."], "Test the first premise against our definition.", "The form is valid, but with a false premise the argument is unsound."),
    ch("Someone says: 'David was rash: a boy fighting a giant is obviously foolish.' What is the strongest reply from the text?", ["David gave reasons from real experience (lion and bear) and trusted God's faithfulness; he chose tested weapons, which is prudence.", "David was not really a boy but a trained soldier, so the fight was not as unequal as it looks and needed no special courage.", "Rashness is actually a virtue whenever the cause is good, so David was right to be rash in defending Israel.", "The account is a fable invented to teach a lesson, so it is pointless to ask whether David acted wisely."], "Recall verses 34–39.", "Rashness lacks good reasons; the text shows David reasoning from evidence and choosing his tools carefully."),
    ch("If the 'Men wanted' advertisement was invented, does that weaken the evidence that Shackleton's men all survived?", ["No: the survival is documented by independent evidence (diaries, photographs, records); one invented story does not undermine it.", "Yes: if one famous story about the expedition is false, then all the other stories about it must also be doubted equally.", "Yes, a little, because every story about an event is connected, so one falsehood always weakens the rest.", "No, because advertisements are a reliable kind of source, so the advertisement was probably genuine after all."], "Do the two claims rest on the same evidence?", "Evaluate each claim on its own evidence."),
    ch("A student refuses to attempt any hard problem, saying, 'Prudence means avoiding risk.' What is the error?", ["Prudence weighs risks wisely; avoiding every effortful or uncertain task is cowardice, not prudence.", "There is no error: a prudent person avoids anything that might end in failure or embarrassment.", "Prudence means taking every risk that comes along, so the student has it exactly backwards.", "Hard problems can harm a person's health, so avoiding them is simply a matter of safety."], "What does prudence aim at?", "Prudence finds the right action; when the right action is hard, refusing it is a failure of courage."),

// ---------- Lesson 22 ----------
lesson({
  title: "Justice: giving each their due", icon: "⚖️",
  learn: [
    { say: "<b>Justice</b> is giving people what they are owed; treating people fairly even when they can't benefit you. An ancient definition, recorded in the Roman emperor Justinian's law book of 533 AD, says justice is 'the set and constant purpose which gives to every man his due' (Institutes I.1, trans. J. B. Moyle). In Plato's Republic (Book I), the same idea is attributed to the poet Simonides.", show: big("Justice:\ngiving people what they are owed;\ntreating people fairly\neven when they can't benefit you") },
    { say: "Plato's Republic (Book IV) names four chief virtues. Later Christian writers, such as Ambrose of Milan in the 4th century, called them the <b>cardinal virtues</b>, from the Latin <i>cardo</i>, a hinge: the other virtues turn on them. You now know all four by some name.", show: tbl([["Cardinal virtue", "Also called", "In brief"], ["Prudence", "wisdom", "seeing what is truly good to do here"], ["Justice", "", "giving each their due"], ["Fortitude", "courage", "doing right when it is hard"], ["Temperance", "", "good things in the right measure"]]) },
    { say: "Two women came to King <b>Solomon</b>, each claiming the same baby. Solomon ordered the child divided. The real mother cried out to give the child away rather than see him killed; the other said, 'Divide him.' Solomon gave the child to the first woman. He had asked God for an understanding heart, and he used a test to reveal the truth (1 Kings 3).", show: quotes(["1 Kings 3:9", "1 Kings 3:28"]) },
    { say: "The prophets demand justice from everyone, and the law forbids favouritism in both directions: not toward the powerful, and not toward the poor either.", show: quotes(["Amos 5:24", "Leviticus 19:15", "Proverbs 31:8-9"]) },
    { say: "History. <b>William Wilberforce</b>, a Christian member of Parliament, fought the slave trade from 1787; his bills failed again and again until the <b>Slave Trade Act</b> of <b>1807</b>. On 26 July 1833, three days before he died, he heard that the bill abolishing slavery in most of the Empire was sure to pass the Commons; it became law that August. <b>Olaudah Equiano</b>'s life story (1789) gave first-hand evidence.", show: tbl([["Year", "Event"], ["1787", "Wilberforce commits to the cause"], ["1789", "his first major speech; Equiano publishes his Narrative"], ["1807", "Slave Trade Act passes"], ["1833", "abolition bill's passage assured (26 July); Wilberforce dies 29 July; the Act becomes law in August"]]) },
