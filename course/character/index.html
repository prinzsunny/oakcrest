lesson({
  title: "Courage and conscience", icon: "🧭",
  learn: [
    { say: "Your <b>conscience</b> is your inner sense of right and wrong, which judges your own choices. Paul says that even people who never read God's law show its work 'written in their hearts', their conscience 'accusing or else excusing them'.", show: quote("Romans 2:15") },
    { say: "In Egypt, Pharaoh ordered two Hebrew midwives, <b>Shiphrah and Puah</b>, to kill every newborn Hebrew boy. They refused, and when questioned, they found a way to protect the babies. They are among the first people in Scripture to defy a king's command out of reverence for God (Exodus 1).", show: quote("Exodus 1:17") },
    { say: "Centuries later, the apostles were ordered by the council in Jerusalem to stop teaching about Jesus. Peter's reply has guided Christians facing unjust commands ever since.", show: quote("Acts 5:29") },
    { say: "A philosopher's example. In 404 BC a group of tyrants, the Thirty, ruled Athens. They ordered Socrates and four other men to arrest an innocent man, <b>Leon of Salamis</b>, so that he could be executed. The other four went. Socrates simply went home, knowing he might be killed for it. He was saved only because the Thirty soon fell (Plato, Apology 32c–d).", show: pas("Socrates and Leon of Salamis (404 BC)", "The tyrants wanted to involve as many citizens as possible in their crimes.\n\nSocrates later told the jury that he cared not at all about death, but very much about doing nothing unjust or unholy.\n\nNotice: he did not make speeches or fight. He quietly refused to take part in a wrong.") },
    { say: "On 1 December 1955, in Montgomery, Alabama, <b>Rosa Parks</b>, aged 42, refused a bus driver's order to give up her seat to a white passenger, as the segregation law demanded. She was arrested and fined. The Black community's bus boycott lasted 381 days, until the Supreme Court's ruling ended bus segregation there in December 1956.", show: tbl([["Common myth", "What the evidence shows"], ["She was an old woman whose feet hurt.", "She was 42; she later wrote that the only tiredness she felt was being tired of giving in."], ["She acted on a sudden impulse.", "She was an experienced activist, secretary of the local NAACP branch."], ["She was the first to refuse.", "Others had refused before, including 15-year-old Claudette Colvin in March 1955."]]) },
    { say: "Conscience must be <b>informed</b>. It can be mistaken: Paul says that before he met Christ he 'thought that I ought' to oppose Jesus' followers (Acts 26:9). So a wise person both obeys conscience and trains it, by Scripture, wise counsel and true reasoning. Notice too: Socrates, the midwives and Rosa Parks refused to take part in a wrong <b>without violence</b>, and accepted the risk.", show: S(svg(T(300, 45, "A trustworthy conscience", 26) + box(30, 90, 160, 110, "#e0f2f1", "#0f766e") + T(110, 135, "Scripture", 22) + T(110, 165, "God's word", 20, "#555") + box(220, 90, 160, 110, "#e0f2f1", "#0f766e") + T(300, 135, "wise counsel", 22) + T(300, 165, "people who know", 20, "#555") + box(410, 90, 160, 110, "#e0f2f1", "#0f766e") + T(490, 135, "true reasons", 22) + T(490, 165, "the TRUTH rule", 20, "#555") + T(300, 260, "inform it, then obey it", 26, "#0f766e", 800))) },
    { say: "Feelings that come with conscience: an uneasy, heavy feeling when you are about to do wrong, and <b>peace</b> when you have done right, even at a cost. Paul wrote that he worked always to have 'a conscience void of offense toward God and men' (Acts 24:16). Treat that inner unease as a signal worth stopping for.", show: quote("Acts 24:16") },
    explain("What is conscience, why must it be informed, and how did Socrates, the midwives and Rosa Parks each show courage of conscience?"),
  ],
  practice: [
    ch("What is conscience?", ["your inner sense of right and wrong, which judges your own choices", "the voice of other people telling you what they think of you", "a strong feeling that tells you what you would most like to do", "the written rules of your school, home and country"], "Romans 2:15 says it accuses or excuses.", "Conscience is the inner judge of our own actions."),
    ch("What did Pharaoh order Shiphrah and Puah to do?", ["kill the newborn Hebrew boys", "build a pyramid", "leave Egypt", "teach Egyptian children"], "Exodus 1:15–16.", "He commanded the midwives to kill Hebrew baby boys at birth."),
    ch("Why did the midwives disobey (Exodus 1:17)?", ["They feared God.", "They feared the Hebrews.", "They wanted money.", "They forgot the order."], "Read the verse carefully.", "'But the midwives feared God, and didn't do what the king of Egypt commanded them.'"),
    ch("Who said, 'We must obey God rather than men'?", ["Peter and the apostles", "Pharaoh", "Socrates", "Rosa Parks"], "Acts 5:29, before the council in Jerusalem.", "Peter and the apostles answered the council with these words."),
    ch("What did the Thirty order Socrates to do in 404 BC?", ["help arrest Leon of Salamis, an innocent man, for execution", "leave Athens and never return, on pain of death", "stop teaching the young men of Athens in public", "lead an army against the city of Sparta"], "Plato, Apology 32c–d.", "They tried to involve citizens in their crimes by ordering them to arrest Leon."),
    ch("How did Socrates refuse?", ["He quietly went home instead of making the arrest.", "He warned Leon, who escaped from Athens in time.", "He made a speech against the Thirty in the market.", "He hid Leon in his own house until the danger passed."], "He did not fight; he simply would not take part.", "He went home, knowing he might be put to death for it."),
    num("Of the five men ordered to arrest Leon, Socrates alone refused. How many went to make the arrest?", 4, "Five minus Socrates.", "5 − 1 = 4."),
    ch("On what date did Rosa Parks refuse to give up her bus seat?", ["1 December 1955", "4 July 1776", "17 December 1903", "1 January 1863"], "It began the Montgomery bus boycott.", "1 December 1955, in Montgomery, Alabama."),
    num("Rosa Parks was born in 1913. How old was she in December 1955?", 42, "Subtract 1913 from 1955. (Her birthday was in February, so she had already had it.)", "1955 − 1913 = 42."),
    num("The Montgomery bus boycott lasted 381 days. About how many full weeks is that? (Divide by 7 and ignore the remainder.)", 54, "How many 7s in 381?", "381 ÷ 7 = 54 remainder 3, so 54 full weeks."),
    ch("Which statement about Rosa Parks is a myth?", ["She refused only because her feet were tired from work.", "She was secretary of the local NAACP branch.", "She was arrested and fined for refusing.", "The boycott that followed lasted over a year."], "What did she herself say about being tired?", "She later wrote that she was tired of giving in, not physically worn out."),
    ch("Who refused to give up her seat on a Montgomery bus nine months before Rosa Parks?", ["Claudette Colvin, aged 15", "Harriet Tubman", "Sarah Josepha Hale", "Elizabeth Fry"], "History often forgets those who went first.", "Claudette Colvin refused in March 1955."),
    ch("Why must conscience be informed?", ["It can be mistaken; Paul once thought he ought to oppose Jesus' followers.", "It is always wrong, so we should do the opposite of what it says.", "Only adults have a conscience, so children must borrow one from others.", "It is simply a feeling, so it can never tell us anything true."], "Acts 26:9.", "Conscience can err, so we train it by Scripture, wise counsel and true reasoning."),
    ch("What did Socrates, the midwives and Rosa Parks have in common?", ["Each refused to do wrong without violence, and accepted the risk.", "Each led a group that overthrew an unjust ruler by force.", "Each obeyed the law outwardly while working against it in secret.", "Each was later honoured by the very rulers they had defied."], "How did they resist?", "Each refused to take part in injustice, without violence, accepting the danger."),
    ch("You feel uneasy as your friends plan to read a classmate's diary. What does that feeling most likely signal?", ["Your conscience warning you that the plan is wrong", "Nervousness that you might not be included in the fun", "Excitement about discovering a secret before anyone else", "Tiredness after a long day, which has nothing to do with it"], "Treat inner unease as a signal worth stopping for.", "The unease is conscience at work. Stop and think before going along."),
    G.virtue(13, ["courage", "honesty", "kindness"]), G.choose(13, ["courage"]), G.choose(13, ["courage"]), G.reason(), G.bible(["courage"]), G.verse(["courage"]), G.verse(null, ["Acts 5:29", "Exodus 1:17", "Joshua 1:9"]), G.hero(["Rosa Parks", "Socrates", "Harriet Tubman", "Nicholas Winton"]), G.legend(), G.feel(), G.def(13),
  ],
  challenge: [
    ch("Argument: 'Whatever the law commands is right. The segregation law commanded Rosa Parks to give up her seat. So giving up her seat was right.' Which premise is false?", ["'Whatever the law commands is right': laws can be unjust, as Pharaoh's command shows.", "'The segregation law commanded it': no such law existed in Montgomery in 1955.", "Neither premise is false, and the argument is valid, so the conclusion must be true.", "The conclusion is false, but the argument is invalid, so no premise needs to be false."], "Is every law automatically just? Think of Exodus 1.", "The argument is valid in form, but its first premise is false, so it is unsound. Pharaoh's law was a law, and it was evil."),
    ch("Paul says his conscience once led him to persecute Christians. Which conclusion follows?", ["A sincere conscience can still be wrong, so it needs to be informed by truth.", "Conscience is always unreliable, so it should be ignored in every decision.", "Paul cannot have been sincere, since a sincere conscience is never mistaken.", "The persecution was right at the time, because he felt sure it was right."], "Does sincerity guarantee truth?", "Sincerity is not the same as correctness. That is why we test our convictions against Scripture and evidence."),
    ch("Why is it significant that Socrates, the midwives and Rosa Parks refused without violence and accepted the risk?", ["It shows their aim was to avoid doing wrong, not to seize power or to harm anyone.", "It shows that they were not really brave, since a brave person would have fought back against injustice.", "It shows that violence is always more effective, since their peaceful refusals changed nothing at the time.", "It shows that they agreed with the commands but simply did not have the strength to carry them out."], "What does openly accepting a penalty reveal about a person's motive?", "Peaceful refusal that accepts the risk shows that the aim is to keep one's own hands clean of wrong, not to gain power. (Rosa Parks's refusal was public; the midwives' was quiet; both were non-violent.)"),
    ch("A boy says, 'My conscience tells me I may lie to my teacher about homework.' What is the best response?", ["Test that conviction against Scripture and true reasoning; a conscience that approves convenient lies needs correcting.", "If his conscience truly says so, it must be right, since conscience is the final judge of every action.", "Consciences only speak about serious matters, so homework is outside its concern altogether.", "He should ask his classmates to vote, since the majority view is the best guide for conscience."], "Can 'my conscience says so' end every argument?", "Appeals to conscience must still pass the TRUTH rule. Conscience is a judge, but a judge can be misinformed."),
    ch("The midwives told Pharaoh that Hebrew women gave birth before the midwives arrived (Exodus 1:19). Christians have long debated whether this was an untruth. Which statement is most careful?", ["Scripture commends their fear of God and saving of the babies; whether their words were fully truthful is debated.", "Scripture explicitly praises their words to Pharaoh, so it teaches that lying is good when it helps.", "Scripture condemns the midwives for lying, which is why God punished them and their families.", "The passage shows that honesty does not matter when a king is wicked, so no debate is needed."], "Separate what the text clearly says from what it leaves unclear.", "Careful reading distinguishes what is commended (reverence and protecting life) from what is debated. We return to this hard question in lesson 31."),
    G.reason(),
  ],
  extend: "Read Exodus 1 and Acts 4–5 with a parent. Then read Plato's Apology 32a–e (Jowett translation, public domain), where Socrates tells of refusing the Thirty. Write a paragraph comparing the three refusals: who gave the command, why the person refused, and what it cost.",
  offline: "Interview a grown-up about a time their conscience told them not to go along with something. Then list three ways you can inform your own conscience this month. Explain it: in 2–4 sentences, explain why conscience is important and why it must be informed.",
}),

lesson({
  title: "Duty: doing what is owed", icon: "🎖️",
  learn: [
    { say: "A <b>duty</b> is something you owe: an act you are bound to do whether or not you feel like it. Duties come from God's commands, from promises, and from our roles: child, sibling, student, friend, citizen. Ecclesiastes ends by naming the deepest duty of all.", show: quote("Ecclesiastes 12:13") },
    { say: "The greatest example of duty chosen over desire is Jesus in the garden of Gethsemane on the night before the crucifixion. He was in anguish and asked that the 'cup' of suffering be removed, yet he chose the Father's will.", show: quote("Luke 22:42") },
    { say: "Jesus also taught that doing our duty earns no boast; it is simply what is owed. Paul adds the spirit in which to do it: wholeheartedly.", show: quotes(["Luke 17:10", "Colossians 3:23"]) },
    { say: "A Roman legend. In 458 BC, according to the historian Livy (writing more than 400 years later), <b>Cincinnatus</b> was ploughing his small farm when messengers made him dictator to rescue a trapped Roman army. He won, and after sixteen days gave up his power and returned to his plough. Treat the details as <b>tradition</b>.", show: tbl([["", "Cincinnatus", "George Washington"], ["Date", "458 BC (traditional)", "23 December 1783"], ["Source", "Livy, centuries later", "letters, records, eyewitnesses"], ["What he gave up", "the dictatorship", "command of the army"], ["Verdict", "legend or tradition", "documented history"]]) },
    { say: "A documented echo. On 23 December 1783, at Annapolis, <b>George Washington</b> resigned command of the Continental Army and went home, though many expected him to take power. King George III's admiring remark about this comes to us only <b>second-hand</b>, through the painter Benjamin West, so we hold it more loosely.", show: big("Power laid down:\nAnnapolis, 23 December 1783") },
    { say: "Before the Battle of Trafalgar on 21 October 1805, Admiral <b>Horatio Nelson</b> signalled to his fleet: 'England expects that every man will do his duty.' The British won, and Nelson was killed in the battle. The Romans had a word for faithful duty to God, family and country: <b>pietas</b>.", show: pas("Duty in three ideas", "Duty is owed, whether or not we feel like it.\n\nDuty is not the whole of goodness: kindness goes beyond what is owed.\n\nWhen duty and desire conflict, a mature person chooses duty, and often finds that the desire changes with practice.") },
    { say: "Review of our first five virtues, and a dilemma. Your duty is to practise piano before your friend arrives; your desire is to read your new book. Which virtues are involved? Self-control (waiting), honesty (not claiming you practised), gratitude (for the lessons), perhaps courage (if the piece is hard).", show: tbl([["Virtue", "Definition"], ["Honesty", DEF.honesty], ["Kindness", DEF.kindness], ["Courage", DEF.courage], ["Self-control", DEF["self-control"]], ["Gratitude", DEF.gratitude]]) },
    explain("What is the difference between a duty and an act of kindness? Use Luke 17:10 and the story of Boaz (lesson 6) in your answer."),
  ],
  practice: [
    ch("What is a duty?", ["something you owe, whether or not you feel like doing it", "something you choose to do because you enjoy it", "a reward that you receive for doing good work", "an extra kindness that goes beyond what is required"], "Duties are owed.", "A duty is an obligation: owed regardless of feelings."),
    ch("According to Ecclesiastes 12:13, what is 'the whole duty of man'?", ["Fear God, and keep his commandments.", "Become rich and famous.", "Build great cities.", "Eat, drink and be merry."], "It is the end of the matter.", "'Fear God, and keep his commandments; for this is the whole duty of man.' (WEB)"),
    ch("What did Jesus pray in Gethsemane (Luke 22:42)?", ["'Not my will, but yours, be done.'", "'Let me escape tonight.'", "'Punish my enemies.'", "'I will do as I please.'"], "He asked for the cup to be removed, but...", "He submitted his desire to the Father's will."),
    ch("Why is Gethsemane the clearest example of duty chosen over desire?", ["Jesus truly desired to be spared suffering, yet chose to obey the Father.", "Jesus felt no fear or sorrow at all, so obeying was simple for him.", "The disciples asked Jesus to stay in the garden, and he agreed.", "Jesus chose his own wishes over the plan his Father had made."], "Does choosing duty mean not feeling the pull of desire?", "The anguish was real; the choice was obedience. Duty is chosen, not merely felt."),
    ch("Luke 17:10 teaches that after doing what is commanded, we should say...", ["'We are unworthy servants. We have done our duty.'", "'We have done well, and now we deserve our reward.'", "'We have done more than was asked of us today.'", "'We are better servants than those who did nothing.'"], "Is doing what is owed a reason to boast?", "Duty done is simply what was owed: no grounds for boasting."),
    ch("Colossians 3:23 tells us to work...", ["heartily, as for the Lord", "only when watched", "as little as possible", "for praise from people"], "In what spirit should duty be done?", "'And whatever you do, work heartily, as for the Lord, and not for men […]' (WEB)"),
    ch("Who is our main source for the story of Cincinnatus?", ["Livy, writing more than 400 years later", "Cincinnatus, in letters to his son", "a Roman official who was present", "Plutarch, writing in the same year"], "Is the source close in time?", "Livy wrote centuries later, so the details are treated as tradition."),
    num("Cincinnatus is said to have been called to power in 458 BC. Livy was writing around 25 BC. About how many years apart is that?", 433, "Both dates are BC: subtract the smaller from the larger.", "458 − 25 = 433 years."),
    ch("Where and when did Washington resign his command?", ["Annapolis, 23 December 1783", "Philadelphia, 4 July 1776", "Mount Vernon, 1799", "London, 1805"], "He resigned before Congress, which was meeting in Maryland.", "Annapolis, 23 December 1783."),
    ch("King George III's remark about Washington comes from the painter Benjamin West. How should we treat it?", ["as reported second-hand: possible, but less certain than the resignation", "as certain fact, because a king's words are always written down", "as a fable, invented to teach children about giving up power", "as a lie, since a king would never praise an enemy general"], "Who heard it, and who wrote it down?", "A second-hand report is weaker evidence than official records of the resignation."),
    ch("What was Nelson's signal before Trafalgar?", ["England expects that every man will do his duty.", "England asks that every sailor will fight bravely.", "Engage the enemy, and every man do his best.", "Victory today, or every ship goes to the bottom."], "21 October 1805.", "The famous signal called on every sailor to do his duty."),
    ch("What happened to Nelson at Trafalgar?", ["The British won, but Nelson was killed in the battle.", "The British lost, and Nelson was taken prisoner.", "The British won, and Nelson retired the next year.", "The battle was a draw, and Nelson was wounded."], "Victory came at a great cost.", "Nelson was fatally wounded by a musket shot from a French ship; he died knowing the battle was won."),
    ch("The Roman word 'pietas' meant...", ["faithful duty to God, family and country", "pity and tenderness toward the poor", "skill and courage on the battlefield", "careful obedience to the written law"], "It is the root of 'piety'.", "Pietas meant dutiful devotion: to the gods, to family, to homeland."),
    ch("What is the difference between duty and kindness?", ["Duty is owed; kindness gives good that is not owed.", "There is no difference.", "Kindness is owed; duty is optional.", "Duty is only for adults."], "Recall Boaz and the extra grain.", "Allowing gleaning was owed (duty); dropping extra grain was not (kindness)."),
    ch("You promised to feed the neighbour's cat while they are away, but your friend invites you to the cinema at feeding time. What does duty require?", ["Feed the cat first, then go if there is time, or decline politely.", "Go to the cinema; a cat can easily manage for one evening alone.", "Go to the cinema and ask a younger brother to feed the cat.", "Feed the cat tomorrow morning instead, twice as much as usual."], "Where did the duty come from?", "Your promise created a duty; a living creature depends on you. Duty comes before entertainment."),
    G.virtue(14), G.virtue(14), G.choose(14), G.choose(14), G.reason(), G.legend(), G.verse(null, ["Ecclesiastes 12:13", "Luke 22:42", "Colossians 3:23"]), G.verse(["courage", "self-control", "gratitude", "honesty", "kindness"]), G.hero(["George Washington", "Horatio Nelson", "Benjamin Franklin", "Socrates"]), G.bible(), G.def(14),

  challenge: [
    ch("Washington's resignation is often compared to the story of Cincinnatus. Which statement is most accurate?", ["Washington's act is documented history and Cincinnatus's is tradition; Washington's generation admired the story.", "Both are equally legendary, since both were written down long after the events they describe.", "Both are equally documented, since Livy was as careful a historian as any modern biographer.", "The Cincinnatus story was invented after 1783 by admirers who wanted to praise Washington."], "Compare the evidence for each. Did Washington know the story?", "The officers' Society of the Cincinnati (1783), with Washington as its first president, was named after him. A legend can shape real history."),
    ch("Argument: 'Duty is whatever you feel you should do. Ella feels she should skip practice. So skipping is her duty.' What is wrong?", ["The first premise is false: duty is what is owed, not what is felt.", "The conclusion does not follow from the premises.", "Ella has no feelings.", "Nothing is wrong."], "Is the argument's form valid? Is its first premise true?", "The form is valid, but the first premise confuses duty with feeling, so the argument is unsound."),
    ch("Jesus' 'Not my will, but yours, be done' shows that obedience does not require pretending. Why?", ["He honestly expressed his desire to be spared, then chose obedience; honesty and duty went together.", "He pretended to be calm and happy so that the disciples would not be afraid for him.", "He felt nothing at all in the garden, so there was nothing to be honest about.", "He refused to pray about his fear, since obedience means keeping feelings hidden."], "Did Jesus hide his anguish?", "Duty can be done honestly: naming what we want, and still choosing what is right."),
    ch("Can duties conflict? Your duty to visit your sick grandmother clashes with your duty to attend a friend's birthday you promised to attend. What is the best approach?", ["Weigh which duty is weightier and more urgent, keep it, and honestly explain and make amends for the other.", "No, duties never truly conflict, so one of them must not be a real duty and can simply be ignored.", "Choose whichever event will be more enjoyable, since you will then do it more wholeheartedly.", "Do both by arriving late to each and leaving early, so that neither person can complain."], "Which need is greater? How do you honour the other?", "When duties conflict, prudence weighs them; honesty and repair limit the harm to the one you cannot keep."),
    ch("Luke 17:10 says we are 'unworthy servants' who have only done our duty. Does this mean duty does not matter?", ["No; duty is owed and gives no ground for boasting, but it is not unimportant.", "Yes; since servants are unworthy, their work has no real value to God.", "Yes; the verse teaches that obeying commands earns nothing and is pointless.", "No; it means that only those who do more than their duty are servants."], "What is the verse warning against?", "The verse addresses pride, not the value of obedience."),

  offline: "Duty chart: list your daily duties (things you owe your family, your teacher, your instrument) and, beside them, one act of kindness that would go beyond duty. Do both each day this week. Explain it: in 2–4 sentences, explain the difference between duty and kindness, with your own example.",

// ---------- Lesson 15 ----------
lesson({
  title: "Work before play: diligence", icon: "🐜",
  learn: [
    { say: "Self-control has a practical form: <b>work before play</b>. Doing the necessary task first is called <b>diligence</b> (steady, careful effort). Its opposite, in Proverbs, is the <b>sluggard</b>: a person who always means to start later.", show: big("Work first, then play:\ndiligence") },
    { say: "Proverbs sends the sluggard to a surprising teacher: the ant. No one commands her, yet she gathers food in summer, when it is available.", show: quote("Proverbs 6:6-8") },
    { say: "Proverbs contrasts the two kinds of desire: the sluggard wants things but does nothing; the diligent person's desire is satisfied. And Ecclesiastes reminds us that play has its proper time too.", show: quotes(["Proverbs 13:4", "Ecclesiastes 3:1"]) },
    { say: "Aesop's fable (a story invented to teach) 'The Ant and the Grasshopper' tells the same truth: the grasshopper sang all summer, the ant stored grain, and when winter came the grasshopper was hungry. Fables are not history, but their lessons can be true.", show: pas("The Ant and the Grasshopper (Aesop, retold)", "All summer the grasshopper sang while the ant carried grain to her nest.\n\n'Why work so hard?' laughed the grasshopper. 'There is food everywhere.'\n\nWinter came. The grasshopper, starving, begged the ant for food.\n\nMoral: there is a time for work and a time for play; work first prepares for need.") },
    { say: "The Greek orator <b>Demosthenes</b> (384–322 BC) was said to have had a weak voice and a stammer. According to Plutarch, writing about four hundred years later, he practised speaking with pebbles in his mouth, recited while running uphill, and built an underground study where he trained for months. The man is real; these details are <b>tradition</b>, perhaps embellished. He became the greatest orator of Athens.", show: tbl([["Claim", "Evidence", "Verdict"], ["Demosthenes was a great Athenian orator", "his own surviving speeches", "history"], ["He trained with pebbles in his mouth", "Plutarch, about 400 years later", "tradition"], ["He shaved half his head to stay indoors and practise", "Plutarch", "tradition"]]) },
    { say: "How to do work before play: make a <b>plan</b> in the form 'When X happens, I will do Y' (for example, 'When I finish breakfast, I will practise piano'). Researchers call these <b>implementation intentions</b>, and studies find they help people follow through. And remember Aristotle: each time you choose work first, the habit grows stronger.", show: S(svg(T(300, 45, "A plan that works", 26) + box(40, 90, 220, 110, "#fff7ed", "#b45309") + T(150, 135, "WHEN", 24, "#7c2d12", 800) + T(150, 170, "I finish breakfast", 21) + `<path d='M270 145 h50' stroke='#555' stroke-width='5'/><path d='M312 135 l12 10 l-12 10' fill='none' stroke='#555' stroke-width='5'/>` + box(340, 90, 220, 110, "#e0f2f1", "#0f766e") + T(450, 135, "I WILL", 24, "#0f4c45", 800) + T(450, 170, "practise piano", 21) + T(300, 260, "decide before the moment of temptation", 22, "#555"))) },
    { say: "Two feelings push us toward play too early: <b>boredom</b> (the task feels empty) and <b>restlessness</b> (the body wants to move). Name them. Then shrink the task: 'I will do just the first five minutes.' Starting is often the hardest part.", show: list(["Boredom: 'This feels pointless.' → Remind yourself of the purpose.", "Restlessness: 'I can't sit still.' → Stretch for one minute, then begin.", "Dread: 'It's too big.' → Do only the first small step."]) },
    explain("Explain what the ant teaches the sluggard, and describe your own 'When X, I will Y' plan for work before play."),
  ],
  practice: [
    ch("What is diligence?", ["steady, careful effort at necessary work", "working very fast so as to finish early", "working hard only when someone is watching", "doing as much work as possible every day"], "Think of the ant.", "Diligence is steady, careful, persistent work."),
    ch("Proverbs 6:6 tells the sluggard to go to...", ["the ant", "the lion", "the eagle", "the king"], "A small creature is the teacher.", "'Go to the ant, you sluggard. Consider her ways, and be wise.'"),
    ch("What is remarkable about the ant in Proverbs 6:7?", ["She has no chief, overseer or ruler, yet she works.", "She works only when the queen of the nest commands her.", "She is stronger than any other creature of her size.", "She stores more food than she could ever eat."], "Who makes her work?", "No one commands her; her diligence is self-directed."),
    ch("When does the ant gather her food (Proverbs 6:8)?", ["in summer and harvest, when food is available", "in winter, when other creatures are asleep", "only at night, when it is cool and safe", "whenever she happens to feel hungry"], "Timing matters.", "She prepares in the season of plenty for the season of need."),
    ch("Proverbs 13:4: 'The soul of the sluggard desires, and has nothing, but the desire of the diligent...'", ["shall be fully satisfied", "shall disappear", "shall be punished", "shall be forgotten"], "Both have desires; what differs is the result.", "The diligent person's desires are fulfilled, because effort accompanies them."),
    ch("'The Ant and the Grasshopper' is...", ["a fable attributed to Aesop", "a documented event", "a story from Genesis", "a Roman law"], "Talking animals and a moral.", "It is a fable: invented to teach."),
    ch("Can a fable teach something true even though it never happened?", ["Yes: a story can be invented and its lesson still be true.", "No: if a story did not happen, its lesson is false.", "Only if it is very old.", "Only if animals can talk."], "Separate 'did it happen?' from 'is the lesson true?'", "Jesus' parables and Aesop's fables are invented stories that teach true lessons."),
    ch("Who reports that Demosthenes practised with pebbles in his mouth?", ["Plutarch, about 400 years later", "Demosthenes in his own speeches", "a newspaper in Athens", "Aesop"], "Is the source close in time?", "Plutarch wrote centuries later, so the details are tradition."),
    num("Demosthenes lived from 384 to 322 BC. About how many years did he live?", 62, "BC years count down; subtract.", "384 − 322 = 62."),
    ch("What is an implementation intention?", ["a plan in the form 'When X happens, I will do Y'", "a promise made to another person about the future", "a strong wish to do better, held firmly in mind", "a list of goals for the whole year, written down"], "It ties an action to a moment.", "Deciding in advance, 'When X, I will Y', makes follow-through more likely."),
    ch("Which is the best 'When X, I will Y' plan for homework?", ["When I get home and have my snack, I will do homework at the kitchen table.", "When I feel like it later this evening, I will try to do some of my homework.", "I will do my homework at some point today, because homework is important to me.", "When my teacher reminds me tomorrow, I will remember to finish my homework."], "Which names a specific moment and action?", "A good plan names a trigger (snack finished) and an action (homework at the table)."),
    ch("You are bored by your writing exercise. What is a wise first step?", ["Name the boredom, remind yourself of the purpose, and start with just five minutes.", "Wait until you feel interested again, since good writing needs real enthusiasm.", "Decide that the exercise is pointless, since boredom shows it is not worth doing.", "Switch to a more exciting task for now and come back to the writing tomorrow."], "Name, then shrink the task.", "Naming the feeling and shrinking the task makes starting possible."),
    ch("According to Ecclesiastes 3:1, play...", ["has its proper season, like everything else", "is always wrong for those who are wise", "should come before every kind of work", "is a waste of the time God has given"], "'For everything there is a season.'", "Work before play does not mean no play: each has its time."),
    ch("In Aristotle's view, why does choosing work first get easier over time?", ["Repeated choices build a habit, which becomes part of your character.", "Work gets shorter each time, so there is less of it to do.", "Play becomes boring over time, so it is less tempting.", "Teachers notice your effort and set you easier work."], "How are virtues built?", "Virtue grows by repeated action; diligence becomes second nature."),
    G.virtue(15, ["self-control", "courage", "gratitude"]), G.choose(15, ["self-control"]), G.choose(15, ["self-control"]),
    { gen: () => { const total = 75 + 15 * R(4), a = 10 + 5 * R(4), b = 5 + 5 * R(4), c = 5 * (1 + R(3));
      return { q: `You have ${total} minutes before dinner. Piano practice takes ${a} minutes, reading takes ${b} minutes, and tidying your room takes ${c} minutes. If you do all the work first, how many minutes are left for play?`, type: "number", answer: total - a - b - c, hint: "Add up the work first, then subtract from the total.", why: `Work: ${a} + ${b} + ${c} = ${a + b + c} minutes. Play: ${total} − ${a + b + c} = ${total - a - b - c} minutes.` }; } },
    { gen: () => { const per = 10 + 5 * R(4), days = 3 + R(5);
      return { q: `Demosthenes-style training: you practise reciting a poem for ${per} minutes each day for ${days} days. How many minutes is that in total?`, type: "number", answer: per * days, hint: "Repeated equal amounts: multiply.", why: `${per} × ${days} = ${per * days} minutes. Small daily amounts add up.` }; } },
    G.reason(), G.legend(), G.verse(null, ["Proverbs 6:6", "Ecclesiastes 3:1", "Colossians 3:23", "Proverbs 16:32"]), G.think(["Aristotle", "Benjamin Franklin", "Socrates"]), G.feel(), G.def(15),
  ],
  challenge: [
    ch("The grasshopper might argue: 'Life is short, so enjoy today.' What is the best evaluation of this reason?", ["Partly true (life is short and joy is good), but it does not support neglecting work, since winter is certain.", "Entirely false: life is long, so there is always time later to prepare for any hardship.", "Entirely sound: the premise is true and so the conclusion follows, and the grasshopper was right.", "It is only a preference about how to live, so it cannot be judged as good or bad reasoning."], "Is the premise true? Does it support the conclusion?", "A true premise can still fail to support the conclusion drawn from it. Foreseeable needs make preparation wise."),
    ch("Someone says: 'The pebble story about Demosthenes is only tradition, so we should not believe he worked hard.' What is wrong?", ["His surviving speeches are strong evidence of great skill and effort, even if one anecdote is uncertain.", "Nothing is wrong: if one story about a person is doubtful, nothing else about him can be trusted.", "The pebble story is certainly true, since Plutarch was a careful and famous historian.", "Demosthenes probably never existed, since so many stories about him are uncertain."], "Does doubting a detail erase all other evidence?", "Weighing evidence claim by claim avoids throwing out what is well supported along with what is doubtful."),
    ch("Why might deciding 'When X, I will Y' in advance work better than deciding in the moment?", ["In the moment, desire is strong and reasoning weak; an advance plan makes the choice while calm.", "Writing a plan down removes every desire for play, so there is nothing left to resist.", "Plans made in advance are always kept, because the brain cannot break a written promise.", "Deciding early means you never have to think about the task again until it is done."], "Compare Odysseus, who had his crew tie him to the mast before he heard the Sirens (Homer, Odyssey 12).", "Precommitment lets your calm self guide your tempted self."),
    ch("Is 'work before play' always the right rule?", ["Usually, but prudence sees exceptions, such as helping someone in urgent need.", "Always: a good rule must be followed in every case without exception.", "Never: play is how children learn, so it should always come first.", "Only on school days; at weekends the order does not matter."], "Can a greater good interrupt a good habit?", "Good rules of thumb serve good ends; practical wisdom recognises when a weightier good comes first."),
    ch("Argument: 'Diligent people succeed. Mia succeeded. So Mia is diligent.' Is it valid?", ["No: success can have other causes (help, luck, talent), so the conclusion does not follow.", "Yes: the premises are true, so the conclusion that Mia is diligent must also be true.", "No: the first premise is false, because diligent people never succeed in anything.", "Yes: whenever someone succeeds, it proves that they must have worked diligently."], "Does the 'if... then' run in the direction needed?", "This reverses the conditional. Even if diligence leads to success, success does not prove diligence."),
    G.reason(),
  ],
  extend: "Read three of Aesop's fables (public domain): 'The Ant and the Grasshopper', 'The Tortoise and the Hare' and 'The Bundle of Sticks'. Write the moral of each in your own words, and judge whether each moral is true, with a reason.",
  offline: "Write three 'When X, I will Y' plans for this week (for practice, reading and tidying). Keep a tick chart: did you follow each plan? Explain it: in 2–4 sentences, explain to a grown-up why work before play is a form of self-control, and when an exception would be wise.",
}),
