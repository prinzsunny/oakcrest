// question builders: in ch() the FIRST option is the answer (the runner shuffles options on every attempt)

  { v: "honesty", s: "Your friend asks if you liked her poem. You found one line confusing.", good: "Say what you liked, and gently say which line confused you.", bad: ["Say it is the best poem you have ever read, every line.", "Say you have not read it yet, although you have.", "Change the subject so that you never have to answer."], w: "Honesty can be kind: you can tell the truth gently and specifically. Flattery and dodging are forms of pretending." },

  { v: "honesty", s: "You find you have won a game because the other player miscounted in your favour.", good: "Point out the mistake and count the points again.", bad: ["Accept the win quickly before anyone checks it.", "Tell the other player they are bad at counting.", "Laugh it off and say that games do not matter."], w: "Honesty applies even when the mistake helps you." },

  { v: "courage", s: "A group of older children are teasing a younger one.", good: "Tell them firmly to stop, and fetch a grown-up if they do not.", bad: ["Join in a little, so that the older children will like you.", "Watch quietly from a distance and hope that it stops soon.", "Walk away quickly and try to forget that you saw anything."], w: "Courage does the right thing even when it is scary." },
  { v: "courage", s: "You know you should apologise to a friend, but you feel embarrassed.", good: "Go to her and apologise plainly.", bad: ["Wait until she forgets all about it.", "Act as if nothing ever happened.", "Explain that it was really her fault."], w: "Facing an uncomfortable conversation to put something right takes courage." },
  { v: "courage", s: "You are asked to read aloud and you are nervous about stumbling.", good: "Take a breath and read, correcting yourself if you stumble.", bad: ["Say you feel ill so that someone else is asked instead.", "Refuse to read and sit with your arms folded until asked again.", "Read so quietly and quickly that no one can hear any mistakes."], w: "Courage acts rightly while still feeling afraid." },
  { v: "courage", s: "Your friends want to explore a building site with a 'Danger: Keep Out' sign.", good: "Say no clearly and suggest another game, even if they laugh.", bad: ["Go in first, to prove to everyone that you are not afraid.", "Go in last, so that if anyone is caught it will not be you.", "Dare the youngest child to go in first and test the way."], w: "Courage is doing the RIGHT thing when it is hard. Doing a dangerous, foolish thing is rashness, not courage." },
  { v: "self-control", s: "You are angry because your brother broke your pencil.", good: "Stop, breathe slowly, and tell him calmly how you feel.", bad: ["Break one of his pencils so that he knows how it feels.", "Shout at him until he says sorry for what he has done.", "Throw the broken pieces at him and storm off to your room."], w: "Self-control holds back the first angry impulse so that you can choose a good response." },
  { v: "self-control", s: "There is a plate of biscuits for guests, and you were told to wait.", good: "Wait until the guests arrive and are served.", bad: ["Take one when no one is looking at the plate.", "Take one and rearrange the rest to hide the gap.", "Ask again and again until someone finally gives in."], w: "Self-control chooses to wait even when you want to go ahead." },
  { v: "self-control", s: "You have homework to finish, and your favourite programme is starting.", good: "Finish the homework first, then watch.", bad: ["Watch first and then rush the homework.", "Do the homework with the programme on.", "Copy a friend's answers to save time."], w: "Work before play is a habit of self-control." },
  { v: "self-control", s: "Someone in your game is taking a long time on their turn.", good: "Wait patiently for them to finish.", bad: ["Grab the dice and take your own turn.", "Sigh loudly and roll your eyes at them.", "Tell them they are too slow to play."], w: "Self-control includes patience with others." },
  { v: "gratitude", s: "Your aunt sends you a book for your birthday.", good: "Write to thank her and mention what you liked about it.", bad: ["Tell her you already had a better book on the subject.", "Put it on a shelf and never mention it to her again.", "Ask her why she sent a book instead of a new toy."], w: "Gratitude notices and names the good thing you have been given." },
  { v: "gratitude", s: "A coach has stayed late every week to help your team.", good: "Thank him and tell him one thing he taught you.", bad: ["Assume it is simply his job and say nothing.", "Complain to him that the practices are too long.", "Leave as quickly as possible when practice ends."], w: "Gratitude is specific: it names the gift and the giver." },
  { v: "gratitude", s: "It is a rainy day and the trip is cancelled.", good: "Notice the good you still have: a warm house and time together.", bad: ["Sulk in your room for the rest of the day and refuse to play.", "Declare that the whole week is ruined and nothing is any good.", "Blame your parents for choosing a day when it was going to rain."], w: "Gratitude looks for the good that is truly there, even on a disappointing day." },
  { v: "perseverance", s: "You have failed to balance on your bicycle five times.", good: "Get up, adjust, and try again with someone holding the seat.", bad: ["Decide that you are simply not the kind of person who cycles.", "Kick the bicycle and leave it lying on the path for others.", "Announce that bicycles are pointless and walk home instead."], w: "Perseverance keeps working at what is good when progress is slow." },
  { v: "perseverance", s: "A long-term project is boring in the middle.", good: "Do a small part each day until it is finished.", bad: ["Start a more exciting new project instead.", "Hand in half and say that it is complete.", "Leave all of it until the night before."], w: "Perseverance carries on through the dull middle stretch." },

  { v: "justice", s: "You are cutting a cake to share between yourself and three friends, and all four of you have an equal claim.", good: "Cut it into four equal pieces.", bad: ["Cut a much larger piece for yourself.", "Give the biggest piece to your best friend.", "Keep the whole cake to eat later on."], w: "Justice gives people what they are owed; here everyone has an equal claim, so equal pieces are fair." },

  { v: "justice", s: "Your friend's idea won the class prize, but you got the praise.", good: "Tell the teacher the idea was your friend's.", bad: ["Accept the praise quietly and say nothing.", "Say you did more of the work than you did.", "Ask your friend to keep quiet about it."], w: "Credit rightly belongs to the person whose work it was." },

} });

    { say: "Now history, with a warning. The famous story of young George Washington confessing that he could not tell a lie about a chopped cherry tree first appeared in 1806, in a book by Mason Locke Weems, seven years after Washington died. There is no earlier source. Historians regard it as invented. An 'honesty' story that is not true is a lesson in the TRUTH rule.", show: tbl([["Question", "Cherry-tree story"], ["Who first told it?", "Mason Locke Weems, a biographer"], ["When?", "1806 edition of his book"], ["When did Washington die?", "1799"], ["Any earlier witness or letter?", "None known"], ["Verdict", "a legend, not history"]]) },

    ch("You tell your friend the museum opens at 9, believing it is true, but it actually opens at 10. Did you lie?", ["No; it was a mistake, because you believed it was true.", "Yes; any false statement is a lie.", "Yes, because your friend was disappointed.", "No, because museums don't matter."], "Did you believe it was false when you said it?", "A lie requires believing what you say is false. You should still correct it when you find out: that is honesty too."),
    ch("Which is the clearest example of 'pretending' (the second part of honesty)?", ["Nodding as if you understand when you don't", "Saying 'I don't know yet'", "Admitting you broke the cup", "Pointing out an error that gave you extra points"], "Pretending can be done without saying a word.", "Nodding falsely is pretending: it communicates something untrue, even without words."),
    ch("Which statement shows guilt rather than shame?", ["'I took his pencil; I'll return it and apologise.'", "'I'm a terrible person and everyone hates me.'", "'I'll hide so that no one sees what I did.'", "'I'm hopeless; I'll never try anything again.'"], "Guilt is about an act and points toward repair.", "Guilt names the act and seeks repair. Shame condemns the whole self and makes us hide."),
    ch("According to 1 John 1:9, what does God do when we confess our sins?", ["He is faithful and righteous to forgive and cleanse us", "He forgives us once we have repaid every wrong", "He forgives small sins but remembers the large ones", "He waits to see whether we sin again before forgiving"], "This is why honesty about wrongdoing is safe for a Christian.", "1 John 1:9 promises forgiveness and cleansing to those who confess."),
    ch("Grandmother knitted you a jumper that is rather scratchy. She asks, 'Do you like it?' Which answer is both honest and kind?", ["'Thank you for knitting it. I love the colour; the wool is a little scratchy on my neck, so I'll wear it over a shirt.'", "'I love it more than anything in the world!'", "'It's scratchy, so I won't be wearing it.'", "Say nothing and quickly change the subject."], "She asked a direct question. Can you answer it truthfully and still be warm?", "She asked whether you like it, so dodging would leave a false impression. The first answer is wholly true: it thanks her, names what you truly like, and mentions the scratchiness gently, with a way to wear it. Honesty and kindness together."),

  challenge: [
    ch("Nathan's honesty also required courage. Which fact shows this most clearly?", ["David had already arranged one man's death to hide his sin.", "Nathan was a prophet whom the people respected.", "The story Nathan told was about a little lamb.", "David enjoyed listening to stories at court."], "What might a king who had already killed to hide his sin do to an accuser?", "David had shown he would kill to keep his sin hidden; speaking to him was dangerous."),
    ch("Someone says: 'The cherry-tree story teaches honesty, so it doesn't matter whether it happened.' What is the best reply?", ["It matters: telling a legend as history misleads, though it may be told honestly as a legend.", "Agreed: a good lesson justifies any story, whether or not it happened.", "Legends are always lies, so the story should never be told at all.", "It matters only if the lesson of the story is false as well."], "Is there a difference between telling a legend as a legend and telling it as fact?", "Fables and legends can teach truly when labelled honestly. Presenting them as fact misleads people about what actually happened."),
    ch("Kant held that you must never lie. Using the three-part definition, which of these would Kant NOT count as a lie?", ["Choosing to stay silent rather than answer", "Saying something false to save yourself from trouble", "Saying something false to make someone feel good", "Saying something false as a joke while hoping to be believed"], "Which choice does not assert anything?", "Silence asserts nothing, so it is not a lie. (Whether silence is always right is a separate question.)"),
    ch("A friend whispers the answer during a test. Afterwards the teacher praises you for getting it right. What does honesty require?", ["Tell the teacher you heard the answer from your friend.", "Accept the praise; you didn't ask for the help.", "Blame your friend for cheating.", "Say nothing, but feel bad."], "Is accepting the praise a kind of pretending?", "Accepting praise for work that was not yours is pretending. Honesty means saying what really happened, even though it is uncomfortable."),
    ch("Argument: 'Honest people tell the truth. Grace told the truth once. So Grace is an honest person.' What is wrong with the reasoning?", ["One truthful act does not show the settled habit of an honest person.", "The first reason is false, since honest people sometimes lie.", "Nothing is wrong: the conclusion follows from the reasons.", "Grace cannot be honest, because she once told a lie."], "Recall Aristotle: one act or a habit?", "The conclusion claims a settled character; the evidence is one act. True reasons, but they do not fully support the conclusion."),

// ---------- Lesson 3 ----------
lesson({
  title: "Not pretending: the ring of Gyges", icon: "💍",
  learn: [
    { say: "Honesty is more than avoiding false words. Its second part is <b>not pretending</b>: not presenting yourself, by words, actions or silence, as something you are not. Today's question is ancient and searching: would you still be honest if no one could ever find out?", show: big("Would you be honest\nif you were invisible?") },
    { say: "In Plato's <i>Republic</i> (Book II), Glaucon tells of a shepherd named <b>Gyges</b> who found a gold ring. When he turned it, he became invisible. Using it, he committed terrible crimes and seized a kingdom. Glaucon's challenge: people are just only because they fear being caught. Give anyone the ring, and they will do as they please.", show: pas("The ring of Gyges (Plato, Republic II)", "A shepherd finds a ring in a cave opened by an earthquake. Turning its setting inward makes him invisible; turning it outward makes him visible again.\n\nGlaucon argues that no one would remain just with such a ring. Justice, he claims, is only a bargain we make because we fear punishment.\n\nSocrates spends the rest of the Republic answering him: injustice damages the soul of the one who does it, whether or not anyone sees.") },
    { say: "Scripture answers Glaucon's challenge in another way too: no one is ever truly invisible. Everything is open before God.", show: quotes(["Hebrews 4:13", "Proverbs 15:3"]) },
    { say: "A pretender in the Bible: with his mother Rebekah's help, <b>Jacob</b> wore his brother's clothes, with goatskins on his hands and neck, so that his blind father Isaac would bless him instead of Esau (Genesis 27). The deception worked, but it split the family. Jacob fled for his life and lived for twenty years in exile.", show: quote("Genesis 27:19") },
    { say: "A true historical example. Born into slavery in New York around 1797 as Isabella, she escaped to freedom in 1826. In 1843 she chose a new name, <b>Sojourner Truth</b>: a sojourner travels, and she would travel declaring the truth about slavery and about God. She could not read or write, yet she became one of the most powerful speakers of her century.", show: pas("Sojourner Truth (about 1797–1883)", "A TRUTH-rule puzzle about her: her famous 1851 speech in Akron, Ohio was reported in two different versions.\n\nA report printed in June 1851, weeks after the speech, gives one wording. A version published twelve years later, in 1863, by Frances Gage, adds the refrain 'Ain't I a woman?' and a Southern accent.\n\nBut Sojourner Truth grew up in New York speaking Dutch, not with a Southern accent. Historians therefore trust the 1851 report more: it is closer in time.") },
    { say: "A literary tale, not history: in Hans Christian Andersen's 'The Emperor's New Clothes' (1837), swindlers claim to weave cloth invisible to anyone foolish. Everyone pretends to see it, afraid of looking foolish, until a child says, 'But the Emperor has nothing at all on!' Pretending is often driven by a feeling: <b>fear of looking foolish</b>.", show: S(svg(T(300, 45, "Why do people pretend?", 26) + box(30, 80, 170, 120, "#fff7ed", "#b45309") + T(115, 130, "fear of", 22) + T(115, 160, "looking foolish", 22) + box(215, 80, 170, 120, "#fff7ed", "#b45309") + T(300, 130, "wanting", 22) + T(300, 160, "to fit in", 22) + box(400, 80, 170, 120, "#fff7ed", "#b45309") + T(485, 130, "wanting", 22) + T(485, 160, "praise", 22) + T(300, 250, "Name the feeling, then choose the truth.", 24, "#0f766e", 800))) },
    explain("What did Glaucon claim about the ring of Gyges, and what are two different answers to him (one from Socrates, one from Scripture)?"),
  ],
  practice: [
    ch("What are the two parts of honesty in our definition?", ["telling the truth even when it is uncomfortable, and not pretending", "speaking loudly and clearly", "never keeping a secret and never being silent", "agreeing with everyone"], "One part concerns words; the other concerns presenting yourself falsely.", "Honesty: telling the truth, even when it is uncomfortable; not pretending."),
    ch("In Plato's story, what did the ring of Gyges do?", ["made its wearer invisible", "made its wearer rich", "told its wearer the future", "made its wearer always truthful"], "Turning the setting inward did something remarkable.", "Turning the ring made Gyges invisible, so he could act without being seen."),
    ch("What was Glaucon's challenge?", ["People are just only because they fear being caught.", "People are always just, with or without the ring.", "Rings of power should be destroyed, not used.", "Shepherds should never be allowed to rule."], "Why does Glaucon think people obey the rules?", "Glaucon claims justice is only a bargain made out of fear; remove the fear and justice disappears."),
    ch("How does Socrates, in the rest of the Republic, answer Glaucon?", ["Injustice damages the doer's soul, seen or unseen.", "No one could ever really find such a ring.", "The gods would punish Gyges in the next life.", "Justice pays because people praise the just."], "Who is harmed most by doing wrong in secret?", "Socrates argues that justice is the health of the soul; the unjust person ruins himself even if never caught."),
    ch("What does Hebrews 4:13 add to the question?", ["No creature is hidden from God's sight.", "God sees only what is done in public.", "People who are invisible cannot sin.", "Doing wrong unseen does not count."], "Can anyone truly be invisible?", "Hebrews 4:13 (WEB): 'There is no creature that is hidden from his sight, but all things are naked and laid open before the eyes of him to whom we must give an account.'"),
    ch("In Genesis 27, how did Jacob pretend to be Esau?", ["He wore Esau's clothes and goatskins on his hands.", "He imitated Esau's voice so well that Isaac was fooled.", "He waited in Esau's tent until Isaac came to him.", "He sent a servant who claimed Esau was on his way."], "Isaac was blind, so he relied on touch and smell.", "Rebekah dressed Jacob in Esau's clothes and put goatskins on his hands and neck (Genesis 27:15–16)."),
    ch("What happened to Jacob after the deception?", ["He had to flee from Esau's anger and lived away from home for many years.", "Everyone was happy and the family stayed together.", "Esau thanked him.", "Isaac gave Esau the same blessing too."], "Did the deception bring peace?", "Esau planned to kill him, so Jacob fled to Haran and stayed about twenty years (Genesis 27–31)."),
    ch("Why did Isabella choose the name Sojourner Truth in 1843?", ["She would travel the land declaring the truth.", "It was the name of her mother and grandmother.", "A judge gave it to her when she won her case.", "Her former owner had chosen it for her."], "Think about the meaning of each word.", "She took the name to describe her calling: to travel and speak the truth."),
    num("Sojourner Truth was born around 1797 and chose her new name in 1843. About how old was she then?", 46, "Subtract the birth year from 1843.", "1843 − 1797 = 46."),
    ch("Two versions of Sojourner Truth's 1851 speech exist. Which do historians trust more, and why?", ["The June 1851 report, written weeks after the speech", "The 1863 version, because it became more famous", "The 1863 version, because it is longer and fuller", "The June 1851 report, because it is shorter"], "Which source is closer in time to the event?", "Sources written close to an event, by people who heard it, are usually more reliable than later retellings."),
    ch("What detail makes the 1863 version doubtful?", ["A Southern accent, though she grew up speaking Dutch", "It was printed in English rather than in Dutch", "It says the speech was given in Ohio in 1851", "It was published during the Civil War years"], "What do we know about where she grew up?", "A detail that conflicts with well-established facts is evidence that the later writer reshaped the speech."),
    ch("'The Emperor's New Clothes' (1837) is best described as...", ["a literary tale written by Hans Christian Andersen", "a documented event from Danish history", "a Bible story", "a newspaper report"], "Who wrote it, and was it meant as history?", "Andersen wrote it as a story to teach about pretending and fear of looking foolish."),
    ch("In the tale, why did the adults pretend to see the cloth?", ["They feared seeming foolish or unfit for office.", "The cloth was in fact beautiful and fine.", "The swindlers had paid them to praise it.", "Their eyesight was too poor to be sure."], "What did the swindlers claim about people who could not see it?", "The swindlers said only fools could not see the cloth, so everyone pretended. Fear drove the pretending."),
    ch("Which is an example of pretending without saying anything false?", ["Laughing at a joke you didn't get, so others think you did", "Saying 'I don't get it' when the joke confused you", "Asking a question about a word you didn't know", "Staying quiet because you have nothing to add"], "Pretending can be done with actions.", "A false laugh communicates 'I understood' without words. That is pretending."),
    ch("A friend says, 'Character is what you do when no one is watching.' How does this connect to Gyges?", ["The ring tests exactly that: conduct when unseen.", "It has nothing to do with the story of Gyges.", "It means that only public actions really count.", "It means we should try never to be watched."], "What does invisibility remove?", "The ring removes all observers; what remains is your real character."),
    G.virtue(3, ["honesty", "courage", "self-control"]), G.choose(3, ["honesty"]), G.reason(), G.legend(), G.legend(), G.bible(["honesty"]), G.verse(["honesty"]), G.verse(["honesty"]), G.hero(["Sojourner Truth", "Socrates", "Elizabeth Fry", "Harriet Tubman"]), G.feel(), G.think(["Plato", "Socrates", "Aristotle"]),
  ],
  challenge: [
    ch("Glaucon argues: 'Everyone with the ring would do wrong. So justice is only fear of punishment.' Which reply attacks a premise rather than the conclusion?", ["Many people do right in secret, so his first claim is untrue.", "That conclusion is depressing, so it cannot be true.", "Glaucon was Plato's brother, so his view is biased.", "Such rings do not exist, so the argument can be ignored."], "A premise is a reason given for the conclusion. Which reply tests whether a reason is true?", "The reply challenges the truth of the first premise with evidence. Disliking a conclusion, attacking the speaker, or noting that rings are imaginary does not answer the argument."),
    ch("Why is a thought experiment like the ring of Gyges useful, even though such rings do not exist?", ["It isolates one question: would you be just if never caught?", "It proves that rings of invisibility once really existed.", "It is useful only as an entertaining story for children.", "It shows that Plato himself believed in magic rings."], "What does imagining invisibility remove from the situation?", "By removing the possibility of being caught, the story tests whether our honesty depends on being watched."),
    ch("Jacob received the blessing by deception. A student says, 'It worked, so it was right.' What is the error?", ["Success does not decide rightness; the deception brought years of division.", "There is no error: success is the best evidence that an act was right.", "The error is that Jacob was the younger son and had no right to ask.", "The error is that the trick did not work: Isaac saw through it at once."], "Does 'it worked' answer 'was it right?'", "Success and rightness are different questions. Genesis records the painful results: Esau's fury, Jacob's flight, and long separation."),
    ch("A historian finds two reports of a speech: one written the next day by a reporter who was there, and one written 20 years later by someone who heard about it. They disagree. What is the most reasonable judgment?", ["Prefer the earlier, eyewitness report, while checking it against other evidence.", "Prefer the later one, because it has had time to improve.", "Average the two versions.", "Believe whichever is more exciting."], "Which source had better access to what happened?", "Closeness in time and direct witness usually make a source more reliable, though every source should still be checked."),
    ch("Argument: 'If people pretend, they fear looking foolish. Ben is afraid of looking foolish. So Ben is pretending.' Is the reasoning good?", ["No: fearing foolishness does not prove he is pretending.", "Yes: the conclusion follows from the two reasons.", "Yes, because fear always leads to pretending.", "No, because people who pretend never feel fear."], "The first sentence says pretending leads to fear. Does fear prove pretending?", "This reverses the 'if... then'. Even if every pretender fears looking foolish, a person can fear it without pretending."),
    G.reason(),
  ],
  extend: "Read Hans Christian Andersen's 'The Emperor's New Clothes' (public domain) in full. Then write a paragraph from the child's point of view: why was saying the truth easy for the child but hard for the adults?",
  offline: "The invisibility test: for one day, notice every time you do the right thing when no one is watching (tidying, telling the truth, finishing a task). Tally them on paper. Explain it: tell a grown-up, in 2–4 sentences, how you would answer Glaucon's challenge.",
}),

lesson({
  title: "Weighing evidence: is it true?", icon: "🔍",
  learn: [
    { say: "A review lesson with a new tool. Honest people want to <b>believe true things</b>, not only to say them. So we must learn to weigh <b>evidence</b>: the facts or observations that show whether a claim is true.", show: big("Honesty in the mind:\nwanting to believe what is TRUE") },
    { say: "Luke praises the Jews of Berea, who listened eagerly to Paul but then checked his teaching against the Scriptures every day. Paul himself told the Thessalonians to test all things.", show: quotes(["Acts 17:11", "1 Thessalonians 5:21"]) },
    { say: "Proverbs gives a principle every judge and scientist relies on: hear the other side before deciding.", show: quotes(["Proverbs 18:17", "Proverbs 18:13", "Proverbs 14:15"]) },
    { say: "Five questions for weighing a source: Was the writer <b>there</b>? Was it written <b>close in time</b> to the event? Do <b>independent</b> sources agree? Does the writer have <b>expertise</b>? Does the writer have a <b>motive</b> to deceive?", show: tbl([["Question", "Stronger evidence", "Weaker evidence"], ["Was the writer there?", "eyewitness", "heard it third-hand"], ["When was it written?", "at the time", "decades later"], ["Do others agree?", "several independent sources", "one source only"], ["Expertise?", "trained, careful", "guessing"], ["Motive to deceive?", "none apparent", "gains by the story"]]) },
    { say: "A true case. In 1912 fossils found at Piltdown, England, were announced as a 'missing link' in human history. For about forty years many experts accepted them. In 1953 scientists tested them with new methods and proved they were a <b>forgery</b>: a human skull joined with an orangutan's jaw, stained to look old. The evidence finally corrected the experts.", show: pas("The Piltdown forgery (1912–1953)", "1912: the 'Piltdown Man' fossils are announced in London.\n\nThe pieces never fitted well with later discoveries elsewhere, which made some scientists suspicious.\n\n1953: fluorine tests and close examination showed the jaw was from an orangutan, the teeth had been filed down, and the bones had been stained.\n\nLesson: even experts can be fooled; good evidence and honest testing correct mistakes.") },
    { say: "Not every statement is the same kind of claim. A <b>fact</b> can be checked with evidence. An <b>opinion</b> is a judgment that needs reasons. A <b>preference</b> is simply what someone likes. Moral claims, such as 'cruelty is wrong', are not mere preferences: we give reasons for them, and Christians believe they rest on God's character.", show: tbl([["Kind", "Example", "How to test it"], ["fact", "Spiders have eight legs.", "observe, measure, check records"], ["opinion", "This is the best book in the library.", "ask for reasons and weigh them"], ["preference", "I like green best.", "nothing to prove; just a taste"]]) },
    { say: "Review. Think of something hard that happened this month. Use three steps: <b>name</b> the feeling precisely, <b>notice</b> what it was telling you, and <b>choose</b> a good response. This is how feelings and truth work together.", show: list(["Name it: 'I felt frustrated, not just upset.'", "Notice it: 'I wanted to finish, and something blocked me.'", "Choose: 'I asked for a hint after ten minutes of trying.'"]) },
    explain("Describe two questions you would ask about any source, and explain why the Piltdown forgery shows that experts must still test evidence."),
  ],
  practice: [
    ch("What is evidence?", ["facts or observations that show whether a claim is true", "any claim that is stated confidently and clearly", "a claim that most well-informed people believe", "a strong inner feeling that something is certain"], "Evidence is what lets us check.", "Evidence is information that bears on whether a claim is true: observations, records, measurements, testimony."),
    ch("What did the Bereans do with Paul's teaching (Acts 17:11)?", ["Received it eagerly and checked the Scriptures daily", "Rejected it at once without listening to Paul", "Believed it at once without checking anything", "Asked the rulers in Thessalonica what to think"], "They were 'more noble'. Why?", "They combined eagerness with careful checking: a model of honest thinking."),
    ch("Which verse says 'Test all things, and hold firmly that which is good'?", ["1 Thessalonians 5:21", "Proverbs 12:22", "Philippians 4:8", "Psalm 100:4"], "Paul wrote it to the church in Thessalonica.", "1 Thessalonians 5:21 (WEB)."),
    ch("Proverbs 18:17 says the one who pleads his cause first seems right, until... what?", ["another comes and questions him", "the king arrives to judge the case", "he repeats his case a second time", "the crowd agrees with his account"], "Why should a judge hear both sides?", "The first story sounds convincing until it is questioned. Hear both sides before deciding."),
    ch("According to Proverbs 18:13, giving an answer before hearing is...", ["folly and shame", "wisdom and strength", "courage and honour", "kindness"], "What is it to judge before listening?", "Proverbs 18:13 (WEB): 'He who gives answer before he hears, that is folly and shame to him.'"),
    ch("Proverbs 14:15: 'A simple man believes everything, but the prudent man...'", ["carefully considers his ways", "believes nothing", "asks his friends", "trusts his feelings"], "A prudent person thinks before believing or acting.", "The prudent man carefully considers his ways (WEB)."),
    ch("Which source about a battle is usually strongest?", ["a soldier's letter written the next day, matching other reports", "a famous novel about the battle written 200 years later", "a story a neighbour heard from someone who was not there", "a film made recently for entertainment, with great detail"], "Use the five questions: there? close in time? independent agreement?", "An eyewitness account written at the time and confirmed by independent sources is strong evidence."),
    ch("A company says its own cereal is 'the healthiest in the world'. Which question matters most?", ["Does the writer have a motive to say this?", "Is the box colourful?", "Is the cereal crunchy?", "Is the claim printed in capital letters?"], "Who gains if you believe it?", "The company gains from your belief, so you need independent evidence."),
    ch("What were the Piltdown 'fossils' actually made from?", ["a human skull and an orangutan's jaw, stained", "the bones of a single ancient human ancestor", "plaster casts painted to look like old bone", "the skull of a chimpanzee and a bear's tooth"], "1953 tests revealed the forgery.", "The jaw was an orangutan's, the teeth were filed, and the bones were stained."),
    num("Piltdown Man was announced in 1912 and exposed as a forgery in 1953. How many years did the deception last?", 41, "Subtract.", "1953 − 1912 = 41 years."),
    ch("What lesson does the Piltdown case teach most clearly?", ["Experts can be fooled; honest testing corrects mistakes.", "Scientists can never be trusted about anything.", "Old bones are almost always forgeries.", "When many experts agree, they must be right."], "Who exposed the forgery, and how?", "Scientists using better tests found the truth. The answer to mistaken experts is better evidence, not distrust of all evidence."),
    ch("Classify: 'Mount Everest is the highest mountain above sea level.'", ["fact", "opinion", "preference"], "Can it be measured?", "It is a fact: it can be checked by measurement."),
    ch("Classify: 'I like strawberry jam best.'", ["preference", "fact", "opinion"], "Is there anything to prove, or is it a matter of taste?", "It reports a personal taste: there is nothing to prove or argue."),
    ch("Classify: 'This is the best-written book on our shelf.'", ["opinion", "fact", "preference"], "Can you give reasons for or against it? Could reasonable people disagree?", "It is a judgment that needs reasons (style, clarity, insight), so it is an opinion."),
    ch("Which is NOT one of the five source questions?", ["Is the writer famous?", "Was the writer there?", "Was it written close in time?", "Does the writer have a motive to deceive?"], "Does fame make a claim true?", "Fame is not evidence. The five questions concern witness, time, agreement, expertise and motive."),
    ord("Put the three steps for handling a hard feeling in order.", ["Name it precisely", "Notice what it is telling you", "Choose a good response"], "You cannot understand a feeling you have not named.", "Name, notice, choose."),
    G.fop(), G.fop(), G.reason(), G.reason(), G.legend(), G.virtue(4), G.choose(4), G.verse(["honesty", "prudence"]), G.feel(), G.def(4),
  ],
  challenge: [
    ch("Two independent reporters, who never met, describe a fire in almost the same words. A third account, written by the factory owner, blames lightning. Which is most reasonable?", ["Weigh the independent reports more; the owner may have a motive, so check his claim.", "Believe the owner, because it is his factory and he knows it best.", "Believe none of them, because the accounts disagree with each other.", "Believe the two reporters, because two accounts always beat one."], "Consider independence and motive.", "Independent agreement is strong evidence. A source with something to gain needs extra checking, though it is not automatically false."),
    ch("Someone says: 'Experts believed Piltdown Man for forty years, so we should never trust experts.' What is wrong with this reasoning?", ["Better evidence from experts exposed it; one error does not make all expertise worthless.", "Nothing is wrong: experts are usually mistaken about such things.", "Piltdown Man was real; the 1953 tests were themselves a forgery.", "Forty years is too short a time for a mistake to count as serious."], "Who corrected the error?", "The argument overgeneralises from one case. The same scientific methods that were fooled at first later found the truth."),
    ch("Which is the strongest reason to believe that Julius Caesar was killed in 44 BC?", ["Several independent ancient writers report it, with coins and inscriptions.", "It is shown in many plays and films, including Shakespeare's play.", "Almost every textbook and teacher today says that it happened.", "It is such a dramatic story that no one would have invented it."], "Which reason is about evidence, not popularity?", "Multiple independent sources and physical evidence from the time make the claim very well established."),
    ch("A friend argues: 'Lots of people believe it, so it must be true.' What do we call the problem with this reason?", ["Popularity is not evidence; many can believe a falsehood.", "It is good evidence, since crowds are rarely mistaken.", "It is a preference, so it cannot be judged at all.", "It is fine, as long as the people are sincere."], "Did many people once believe Piltdown Man was real?", "The number of believers does not make a claim true; the evidence does."),
    ch("Is 'Cruelty for fun is wrong' a mere preference, like 'I like green'?", ["No; true reasons support it (it harms a person who matters, and God commands love).", "Yes; it is exactly like liking green, a matter of personal taste.", "Yes; because people disagree about it, it must be a preference.", "No; it is a fact that can be measured, like the legs of a spider."], "Can you give reasons for it? Can you give reasons for liking green?", "Moral claims are argued with reasons and, for Christians, rest on God's character. They are not simply tastes."),
    G.reason(),
  ],
  extend: "Read Acts 17 (the whole chapter) with a parent. Compare the response in Thessalonica, Berea and Athens. Write a paragraph: what made the Bereans' approach to new teaching both open-minded and careful?",
  offline: "Source detective: choose one claim from a book, a sign, or an advertisement at home. Ask the five source questions about it and write your verdict (strong, weak, or needs more checking). Explain it: in 2–4 sentences, explain the difference between a fact, an opinion and a preference, with an example of each.",
}),
// ---------- Lesson 5 ----------
lesson({
  title: "Kindness and the Golden Rule", icon: "🤝",
  learn: [
    { say: "Our definition: kindness is <b>choosing to do something good for another person, especially when you don't have to</b>. Notice three parts: it is a <b>choice</b>, it <b>does</b> something, and it is most clearly seen when nothing obliges you.", show: big("Kindness:\nchoosing to do something good for another person,\nespecially when you don't have to") },
    { say: "Asked 'Who is my neighbor?' (Luke 10:29), Jesus told of a man beaten by robbers on the road from Jerusalem to Jericho. A priest and a Levite passed by on the other side. A <b>Samaritan</b>, from a people the Jews of that time despised, stopped and cared for him (Luke 10).", show: quote("Luke 10:33-34") },
    { say: "Then Jesus turned the question around: not 'who deserves my help?' but 'who acted as a neighbour?'", show: quote("Luke 10:36-37") },
    { say: "Jesus summed up the Law and the Prophets in one rule, which later Christians called the <b>Golden Rule</b>. It builds on Leviticus 19:18: 'love your neighbor as yourself'.", show: quotes(["Matthew 7:12", "Leviticus 19:18"]) },
    { say: "Other traditions express a related idea, and it is worth knowing them respectfully. <b>Confucius</b> in China (about 500 BC) taught: what you do not want done to yourself, do not do to others. The Jewish teacher <b>Hillel</b> (1st century BC) said: what is hateful to you, do not do to your fellow. These are <b>negative</b> forms (avoid harm). Jesus gives the <b>positive</b> form: actively do the good you would want.", show: tbl([["Teacher", "Approximate date", "Form", "Wording (paraphrased)"], ["Confucius", "c. 500 BC", "negative", "Do not do to others what you would not want."], ["Hillel", "1st century BC", "negative", "What is hateful to you, do not do to your fellow."], ["Jesus (Matthew 7:12)", "c. AD 30", "positive", "Whatever you desire others to do to you, do to them."]]) },
    { say: "A true example. In 1813 <b>Elizabeth Fry</b>, a Quaker mother in London, visited Newgate Prison and found about 300 women and their children crowded in filth. She returned with clothes, began a school for the children, and in 1817 founded an association to help women prisoners. Nothing obliged her: that is kindness.", show: pas("Elizabeth Fry (1780–1845)", "1813: first visit to the women's side of Newgate Prison.\n\n1817: she founds an association to improve conditions, with sewing work, reading and a school.\n\nShe later urged Parliament to reform prisons. Her portrait appeared on the Bank of England £5 note from 2002 to 2016.") },
    { say: "Applying the Golden Rule wisely: it asks what you would want <b>if you were in their place</b>, with their needs. If you love loud music, the rule does not mean blasting music for a sick neighbour; it means imagining what you would want if you were sick. This skill is <b>empathy</b>: imagining accurately what another person feels and needs.", show: S(svg(T(300, 45, "Golden Rule: put yourself in THEIR place", 24) + `<circle cx='150' cy='150' r='55' fill='#e0f2f1' stroke='#0f766e' stroke-width='4'/><circle cx='450' cy='150' r='55' fill='#fff7ed' stroke='#b45309' stroke-width='4'/>` + T(150, 158, "you", 26) + T(450, 158, "them", 26) + `<path d='M215 150 h160' stroke='#555' stroke-width='5'/><path d='M365 140 l14 10 l-14 10' fill='none' stroke='#555' stroke-width='5'/>` + T(300, 250, "What would I want, with their needs?", 24, "#0f766e", 800) + T(300, 290, "not: what do I happen to like?", 21, "#555"))) },
    explain("Explain the difference between the negative and positive forms of the Golden Rule, and why the Good Samaritan shows the positive form."),
  ],
  practice: [
    ch("Our definition says kindness is especially seen when...", ["you don't have to do it", "someone is watching", "you will be paid", "you are told to do it"], "Which kind of good deed shows most clearly that it was freely chosen?", "Kindness: choosing to do something good for another person, especially when you don't have to."),
    ch("In the parable (Luke 10), who passed by the wounded man on the other side?", ["a priest and a Levite", "a Samaritan and an innkeeper", "two robbers", "a king and a soldier"], "Two religious leaders went by first.", "A priest and then a Levite saw him and passed by on the other side."),
    ch("Why was it surprising that the helper was a Samaritan?", ["Jews and Samaritans were bitterly hostile.", "Samaritans were famous for their medicine.", "Samaritans were forbidden to travel.", "He was the wounded man's own brother."], "Who would Jesus' listeners have expected to be the hero?", "Jesus made the hero someone his listeners looked down on, which challenged their idea of who counts as a neighbour."),
    ch("What did the Samaritan do for the man?", ["bandaged him, took him to an inn, and paid for his care", "gave him directions to Jericho and went on his way", "ran to fetch the priest and the Levite to help", "prayed beside him and then reported the robbers"], "Luke 10:34–35.", "He poured oil and wine on his wounds, bandaged them, carried him to an inn and paid the innkeeper for his care."),
    ch("Jesus' question at the end was '[…] which of these three do you think seemed to be a neighbor to him who fell among the robbers?' (Luke 10:36) What did it change?", ["From 'Whom must I help?' to 'Am I acting as a neighbour?'", "From 'Who is rich?' to 'Who is poor?'", "From 'Where is Jericho?' to 'Where is Jerusalem?'", "Nothing; it repeated the question."], "Compare the lawyer's question in verse 29 with Jesus' question in verse 36.", "The lawyer wanted to limit his duty. Jesus asked him to become a neighbour to anyone in need."),
    ch("Which verse is called the Golden Rule?", ["Matthew 7:12", "Psalm 100:4", "Proverbs 12:22", "Genesis 9:13"], "It is in the Sermon on the Mount.", "Matthew 7:12 (and Luke 6:31)."),
    ch("Matthew 7:12 says the Golden Rule sums up...", ["the law and the prophets", "the kings of Israel", "the Psalms", "the history of Rome"], "Read the end of the verse.", "'For this is the law and the prophets.' Jesus treats it as a summary of the Scriptures' teaching on how to treat others."),
    ch("Which Old Testament command lies behind the Golden Rule?", ["love your neighbor as yourself (Leviticus 19:18)", "You shall not steal (Exodus 20:15)", "Honor your father and your mother", "Remember the Sabbath day"], "Jesus quoted it as the second great commandment.", "Leviticus 19:18 commands love of neighbour as oneself."),
    ch("Confucius taught: 'What you do not want done to yourself, do not do to others' (Analects 15.23, trans. James Legge). Is this the positive or the negative form?", ["negative", "positive"], "Does it tell you to do good, or to avoid harm?", "It tells us what NOT to do, so it is the negative form."),
    ch("Which person gave the positive form of the rule ('do to others what you would want')?", ["Jesus", "Confucius", "Hillel", "Aristotle"], "Positive means actively doing good.", "Jesus: whatever you desire for men to do to you, you shall also do to them."),
    ch("Why does the positive form ask more of us?", ["Avoiding harm can mean doing nothing; it requires doing good.", "It is longer, and so harder to remember and obey.", "It applies only to friends, not to strangers.", "It forbids every kind of harm, even accidental."], "Could the priest and Levite claim they had done no harm?", "The priest and Levite harmed no one, yet they failed the positive rule. It requires action."),
    ch("In what year did Elizabeth Fry first visit the women in Newgate Prison?", ["1813", "1620", "1903", "1066"], "She lived from 1780 to 1845.", "Her first visit was in 1813."),
    num("Elizabeth Fry was born in 1780 and first visited Newgate in 1813. How many years after her birth was that?", 33, "Subtract her birth year from 1813.", "1813 − 1780 = 33. (Her birthday was in May and the visit came early in 1813, so she was 32 at the time of the visit.)"),
    ch("Your friend loves surprise parties. Your other friend is very shy and hates attention. Using the Golden Rule wisely, how should you celebrate the shy friend's birthday?", ["Imagine her temperament: perhaps a quiet card and a gift.", "Throw a huge surprise party, since you would love one.", "Ignore her birthday, since she dislikes attention.", "Ask the whole class to sing to her at assembly."], "The rule asks: what would I want if I were in her place?", "The Golden Rule is applied with empathy: we imagine their situation and needs, not just our own tastes."),
    ch("What is empathy?", ["imagining accurately what another person feels and needs", "feeling exactly the same as everyone else", "agreeing with everyone", "being sad when others are sad, always"], "It is a skill that serves the Golden Rule.", "Empathy is the skill of understanding another's feelings and needs from their point of view."),
    G.virtue(5, ["kindness", "gratitude", "honesty"]), G.choose(5, ["kindness"]), G.choose(5, ["kindness"]), G.reason(), G.verse(["kindness"]), G.verse(null, ["Matthew 7:12", "Ephesians 4:32"]), G.bible(["kindness"]), G.think(["Confucius", "Hillel", "Socrates", "Aristotle"]), G.hero(["Elizabeth Fry", "Nicholas Winton", "Sojourner Truth", "Anne Sullivan"]), G.feel(), G.def(5),
  ],
  challenge: [
    ch("The priest might have argued: 'If the man is dead, touching him would make me ceremonially unclean, so I should pass by.' What is the best response to his reasoning?", ["The purity rule may be true, but it cannot outweigh a man's life and need.", "His reasoning is sound: religious rules must always come first.", "The rule did not exist, so he was simply lying to himself.", "He should have waited for the Levite to decide what to do."], "Is the reason true? Does it support passing by a dying man?", "A true reason can still fail to support a conclusion when a weightier duty is at stake. Jesus elsewhere teaches that mercy outweighs ritual (Matthew 9:13)."),
    ch("Someone says: 'The Golden Rule means I should give everyone exactly what I like.' What is the flaw?", ["It confuses my tastes with their needs; imagine being in their place.", "There is no flaw: my likes are the best guide to others' good.", "The Golden Rule applies only to gifts, not to how we treat people.", "The flaw is that the Golden Rule is only a negative rule."], "Would you want someone to force their tastes on you if you were ill or shy?", "The rule is about treating others as you would want to be treated in their place, which requires empathy."),
    ch("Confucius and Hillel give similar negative rules, and Jesus gives a positive one. Which conclusion is best supported?", ["Many traditions forbid treating others as we would hate; Jesus adds actively doing good.", "All three teachers used exactly the same words, so they mean the same.", "The similarity proves none of them really meant what they said.", "Only Jesus' rule is about others; the other two are about oneself."], "Look at what is shared and what is different.", "Respectful comparison notices both agreement (avoid harm) and the distinctive extra demand in Jesus' teaching (do good)."),
    ch("Elizabeth Fry's prison visits could be described as kindness, courage, or justice. Which fact best supports calling them courage?", ["Newgate was dangerous and disease-ridden, yet she went in.", "She was a Quaker with a large family in London.", "Her visits made the prisoners grateful to her.", "Her portrait later appeared on a banknote."], "Which detail shows that the act was scary or hard?", "Courage is doing right when it is scary or hard. The danger of the prison is the relevant fact."),
    ch("Argument: 'A neighbour is someone who lives next door. The wounded man did not live next door to the Samaritan. So the Samaritan had no duty to help him.' What does Jesus' parable do to this argument?", ["It rejects the first premise: a neighbour is anyone to whom we can show mercy.", "It accepts it completely.", "It shows the second premise is false: they were next-door neighbours.", "It shows the Samaritan was paid."], "Which premise does Jesus challenge?", "Jesus redefines 'neighbour'. Once the first premise is shown false, the conclusion is unsupported."),
    G.reason(),
  ],
  extend: "Read Luke 10:25–37 aloud with a parent, then read Leviticus 19:9–18. Find three commands in Leviticus that show kindness to the poor, the stranger or the disabled. Discuss: how does the parable deepen these commands?",
  offline: "Golden Rule challenge: do one kind act this week for someone who will not expect it and cannot repay you (a neighbour, a librarian, a younger child). Before you choose, imagine yourself in their place. Explain it: tell a grown-up, in 2–4 sentences, what made your act kindness rather than a duty.",
}),
// ---------- Lesson 6 ----------
lesson({
  title: "Kindness as service", icon: "🧺",
  learn: [
    { say: "Kindness grows into <b>service</b>: using your time and strength for someone else's good, often in small, unseen ways. At the Last Supper Jesus, the Teacher, took a towel and washed his disciples' feet, the work of the lowest servant (John 13).", show: quote("John 13:14-15") },
    { say: "In the book of Ruth, a rich landowner named <b>Boaz</b> noticed Ruth, a poor foreign widow gleaning (gathering leftover grain) in his field. He told his workers to let her glean freely and even to drop extra stalks for her. The Hebrew word for this generous loyalty is <b>hesed</b>, often translated 'loving kindness'.", show: quote("Ruth 2:12") },
    { say: "Scripture also cares about our <b>motives</b>. Jesus warned against doing good in order to be admired.", show: quotes(["Matthew 6:3-4", "Acts 9:36"]) },
    { say: "History and legend. <b>Nicholas</b> was a real bishop of Myra (in modern Turkey) in the 4th century. A famous story says he secretly threw bags of gold into a poor man's house so that his three daughters could marry. That story was written down centuries later and cannot be confirmed: it is a <b>legend</b>. Through the Dutch 'Sinterklaas', his name became 'Santa Claus'.", show: tbl([["Claim", "Evidence", "Verdict"], ["Nicholas was bishop of Myra", "early church records and traditions", "very likely history"], ["He secretly gave gold to three daughters", "written centuries later", "legend"], ["Santa Claus comes from his name", "Dutch 'Sinterklaas' tradition", "history of a custom"]]) },
    { say: "<b>Aristotle</b> taught that each virtue is a <b>mean</b> (a middle point) between two vices: one of too little and one of too much. In giving, the virtue of <b>generosity</b> sits between stinginess (giving too little) and wastefulness (giving recklessly, without thought).", show: S(meanSvg("stinginess", "generosity", "wastefulness", "Aristotle's mean: giving")) },
    { say: "A dilemma. Your class collects gifts for a shelter. You could give your best toy or a broken one you don't want. Generosity is not the same as giving away everything; but service gives something that truly helps, and that costs you something.", show: list(["Option A: a broken toy you don't want (costs nothing, helps little)", "Option B: a good toy you still enjoy (costs something, helps much)", "Option C: all your toys, without asking your parents (reckless)", "Which is the mean? Why?"]) },
    { say: "Feelings in service. Helping often brings <b>joy</b>. But watch for a quieter feeling: the wish to be <b>seen</b> and praised. It is natural to want thanks; the test is whether you would still serve if no one ever knew.", show: big("Would I still serve\nif no one ever knew?") },
    explain("Explain Aristotle's idea of the mean, using generosity as your example, and say which side of the mean the broken toy falls on."),
  ],
  practice: [
    ch("What is service?", ["using your time and strength for another's good", "being paid to do a useful job for someone", "telling others what they ought to be doing", "helping in order to be thanked and praised"], "Think of Jesus with the towel.", "Service puts your abilities to work for another person's good."),
    ch("Why was it remarkable that Jesus washed his disciples' feet?", ["It was the lowest servant's task, and he was their Teacher.", "Feet were never washed at meals in those days.", "It was a game the disciples often played together.", "The disciples had asked him to do it for them."], "Who normally did this task?", "The highest person present took the lowest task, giving an example to follow (John 13:14–15)."),
    ch("What did Jesus tell the disciples to do after he washed their feet?", ["wash one another's feet, following his example", "never let anyone wash their feet", "build a temple", "fast for forty days"], "John 13:14–15.", "'[…] you also ought to wash one another's feet. For I have given you an example, that you also should do as I have done to you.'"),
    ch("What was Ruth doing in Boaz's field?", ["gleaning the grain the harvesters left", "selling bread to the harvesters", "guarding the sheep for Naomi", "working as a hired reaper for wages"], "Israel's law let the poor collect what was left.", "Gleaning was God's provision for the poor and foreigners (Leviticus 19:9–10)."),
    ch("How did Boaz go beyond what the law required?", ["He had workers drop extra stalks for her.", "He let her glean at the edges of the field.", "He let her keep whatever grain she gathered.", "He told her she could glean after the reapers."], "Did he only allow gleaning, or more?", "The law allowed gleaning; Boaz deliberately left extra. That is kindness: good done when not required (Ruth 2:15–16)."),
    ch("The Hebrew word 'hesed' is often translated...", ["loving kindness", "anger", "harvest", "wisdom"], "Psalm 107:1 says his ___ endures forever.", "Hesed means loyal, generous love: loving kindness."),
    ch("According to Acts 9:36, Tabitha (Dorcas) was full of...", ["good works and acts of mercy", "complaints", "wealth and fame", "questions"], "She made clothes for widows.", "Acts 9:36 (WEB): 'full of good works and acts of mercy which she did.'"),
    ch("What does 'don't let your left hand know what your right hand does' mean (Matthew 6:3)?", ["Do good quietly, not to be admired.", "Use only one hand.", "Keep secrets from your family.", "Never give anything."], "Jesus is talking about motives.", "Give so quietly that it is almost hidden even from yourself: not for praise."),
    ch("Which part of the Saint Nicholas story is best called a legend?", ["the secret bags of gold for three daughters", "that he was a bishop of Myra", "that he lived in the 4th century", "that the Dutch called him Sinterklaas"], "Which part was written down centuries later with no earlier evidence?", "The gold story cannot be confirmed; the bishop himself is historical."),
    ch("In Aristotle's ethics, what is the 'mean'?", ["a virtue between too little and too much", "the average of two numbers in arithmetic", "the strictest rule, never broken", "a vice that lies between two virtues"], "Picture a line with a vice at each end.", "Each virtue is a mean between two extremes (Nicomachean Ethics, Book II)."),
    ch("Which is the mean between stinginess and wastefulness?", ["generosity", "greed", "laziness", "pride"], "It is the virtue of giving well.", "Generosity gives the right amount, to the right people, for the right reasons."),
    ch("Giving away all your family's food to strangers without asking is...", ["wastefulness, the excess", "generosity, the mean", "stinginess, the deficiency", "justice, giving what is owed"], "Is it too little, too much, or right?", "It gives recklessly, without prudence or regard for those depending on you: the excess."),
    ch("Giving only a broken toy you don't want to a shelter appeal leans toward...", ["stinginess: the deficiency", "wastefulness", "the mean", "justice"], "Does it cost anything or help much?", "It gives as little as possible. Generosity gives something that truly helps."),
    ch("What is the best test of whether you served for the right reason?", ["Would I still serve if no one ever knew?", "Did someone take a photograph?", "Was I thanked publicly?", "Did I get a reward?"], "Recall Matthew 6:3–4.", "Serving when unseen shows that the motive is love, not praise."),
    ch("Proverbs 19:17 says that one who has pity on the poor...", ["lends to Yahweh", "loses his money", "becomes poor", "should keep it secret from God"], "God regards kindness to the poor as done to him.", "'He who has pity on the poor lends to Yahweh; he will reward him.' (WEB)"),
    G.virtue(6, ["kindness", "gratitude", "self-control"]), G.choose(6, ["kindness"]), G.reason(), G.legend(), G.verse(["kindness"]), G.verse(["kindness"]), G.bible(["kindness"]), G.think(["Aristotle", "Confucius", "Seneca"]), G.feel(), G.def(6),
  ],
  challenge: [
    ch("Aristotle says the mean is not always the exact middle point between the two vices. Why not?", ["The mean is the right amount for the person and the situation, found by practical wisdom.", "Because Aristotle thought rashness was itself a kind of virtue.", "Because cowardice and rashness are really the same vice.", "Because the mean is always found by halving the two extremes."], "Is generosity always exactly half of what you own?", "Aristotle says the mean is 'relative to us' and to the situation; finding it requires prudence. (He also notes that rashness looks more like courage than cowardice does, Nicomachean Ethics II.8.)"),
    ch("Boaz could have said: 'The law lets her glean; I have done my duty.' Why is his extra generosity better described as kindness than as justice?", ["Justice gives what is owed; Boaz gave more than he owed.", "Because Boaz was rich.", "Because Ruth asked him to.", "Because justice and kindness are the same thing."], "What did the law require, and what did he do?", "Doing what is owed is justice; going beyond it freely is kindness."),
    ch("A student argues: 'Jesus told us to give in secret. Elizabeth Fry's work became famous. So Elizabeth Fry disobeyed Jesus.' What is wrong?", ["Jesus warned against doing good in order to be seen; being known for it is different.", "Nothing is wrong: anyone whose good deeds become known has disobeyed.", "Elizabeth Fry lived before Jesus, so his teaching did not apply to her.", "Jesus' teaching applies only to money, not to visiting prisoners."], "Does the verse forbid being known, or forbid a motive?", "The teaching targets motive (Matthew 6:1: 'to be seen by them'). Jesus also said 'let your light shine' (Matthew 5:16). Fame that follows service is not the same as seeking it."),
    ch("Which conclusion follows from the evidence about Saint Nicholas?", ["He was probably a real bishop, but the story of the gold should be told as a legend.", "He never existed.", "Every story about him is proven true.", "Santa Claus is a historical person who lives at the North Pole."], "Separate the claims and weigh the evidence for each.", "Good reasoning sorts claims: some are well supported, some are legend. One weak story does not erase the strong evidence for the bishop."),
    ch("Is helping someone in order to get a reward always wrong?", ["Not always wrong, but not yet the virtue of kindness.", "Yes: any reward makes a good act completely evil.", "No: wanting a reward makes every act kind.", "Only if the reward is money rather than praise."], "Is the act good? Is the motive the best one?", "An act can be good while the motive is mixed. Virtue aims at doing good because it is good for the other person; maturing in kindness purifies motives."),
    G.reason(),
  ],
  extend: "Read the whole book of Ruth (four short chapters). Each time someone shows hesed (loyal kindness), note the verse. Who shows it, to whom, and at what cost?",
  offline: "Secret service: this week, do two helpful tasks at home that no one asked for, and tell no one. At the end of the week, tell a grown-up what you did and how it felt to serve unseen. Explain it: in 2–4 sentences, explain what Aristotle means by the mean, with generosity as your example.",
}),
// ---------- Lesson 7 ----------
lesson({
  title: "Gratitude: noticing and naming", icon: "🌾",
  learn: [
    { say: "Gratitude is <b>noticing and naming the good things you have been given; receiving gifts as gifts</b>. Both verbs matter. To <b>notice</b> is to see a gift as a gift rather than taking it for granted; to <b>name</b> is to say specifically what it was, and who gave it. And to receive a gift as a gift is to take it gladly, not as a debt to be paid off or as something you were owed.", show: big("Gratitude:\nnoticing and naming\nthe good things you have been given;\nreceiving gifts as gifts") },
    { say: "On the border between Samaria and Galilee, ten men with leprosy cried out to Jesus. He sent them to show themselves to the priests, and on the way they were healed. Only one came back, praising God and falling at Jesus' feet, and he was a Samaritan (Luke 17:11–19).", show: quotes(["Luke 17:15-16", "Luke 17:17-18"]) },
    { say: "Scripture commands thanks not only for pleasant things but 'in everything', and calls us to remember God's benefits in detail.", show: quotes(["1 Thessalonians 5:18", "Psalm 103:2", "James 1:17"]) },
    { say: "History. In the autumn of 1621, the Plymouth colonists held a harvest celebration. Edward Winslow wrote in a letter that the Wampanoag leader <b>Massasoit</b> came with about ninety men, who stayed three days and brought five deer. The colonists had survived partly because a Wampanoag man, <b>Tisquantum</b> (Squanto), showed them how to plant corn. Half of those who sailed on the Mayflower had died in the first winter.", show: pas("The 1621 harvest (from Edward Winslow's letter of December 1621)", "The colonists gathered their first harvest and held a celebration.\n\nMassasoit and about ninety of his men joined them for three days; they went out and killed five deer, which they gave to the colonists.\n\nGovernor William Bradford also recorded that Tisquantum taught them to plant corn, fish, and find their way in the land.\n\nNote: Winslow does not call it 'Thanksgiving'; that name and the national holiday came later.") },
    { say: "The national holiday came later. For about seventeen years the editor <b>Sarah Josepha Hale</b> wrote letters urging a national day of thanksgiving. On 3 October 1863, in the middle of the Civil War, President <b>Abraham Lincoln</b> proclaimed one for the last Thursday of November.", show: tbl([["Year", "Event"], ["1621", "Plymouth harvest celebration (Winslow's letter)"], ["1846–1863", "Sarah Josepha Hale campaigns for a national day"], ["1863", "Lincoln's proclamation, 3 October"], ["1941", "Congress fixes the fourth Thursday of November"]]) },
    { say: "The Roman orator <b>Cicero</b> (106–43 BC) said of gratitude: 'this one virtue is not only the greatest, but is also the parent of all the other virtues' (For Plancius 80, trans. C. D. Yonge). Why might that be true? A grateful person notices how much has been given, which makes it easier to be humble, generous and content.", show: S(svg(T(300, 45, "Gratitude as a parent virtue (Cicero)", 24) + box(220, 70, 160, 60, "#0f766e", "#0f4c45") + T(300, 110, "gratitude", 24, "#fff") + `<path d='M300 130 L110 210 M300 130 L300 210 M300 130 L490 210' stroke='#555' stroke-width='4'/>` + box(30, 210, 160, 60, "#e0f2f1", "#0f766e") + T(110, 250, "humility", 22) + box(220, 210, 160, 60, "#e0f2f1", "#0f766e") + T(300, 250, "generosity", 22) + box(410, 210, 160, 60, "#e0f2f1", "#0f766e") + T(490, 250, "contentment", 22))) },
    { say: "Two feelings compete with each other. <b>Envy</b> notices what others have and resents it. <b>Contentment</b> notices what you have and rests in it. Paul wrote from prison that he had learned to be content in whatever state he was in (Philippians 4:11). Contentment is learned, like a skill.", show: tbl([["Envy", "Contentment"], ["looks at what others have", "looks at what I have been given"], ["resents", "rests and gives thanks"], ["'Why not me?'", "'Look at what I have received.'"]]) },
    explain("Why is it significant that only one of the ten healed men returned, and that he was a Samaritan? Then name three specific things you are grateful for and who gave them."),
  ],
  practice: [
    ch("Our definition of gratitude begins with two actions. What are they?", ["noticing and naming", "wanting and getting", "asking and receiving", "saving and spending"], "First you see the gift; then you say it.", "Gratitude: noticing and naming the good things you have been given; receiving gifts as gifts."),
    ch("How many men with leprosy were healed in Luke 17?", ["ten", "one", "nine", "twelve"], "Jesus asked, 'Where are the nine?'", "Ten were cleansed; only one returned."),
    num("Ten men were healed, and one returned to give thanks. How many did not return?", 9, "Subtract the one who came back.", "10 − 1 = 9. Jesus asked, 'But where are the nine?'"),
    ch("What was surprising about the man who returned?", ["He was a Samaritan, a foreigner.", "He was a priest of the temple.", "He was a Roman centurion.", "He had not been healed."], "Jesus called him 'this stranger'.", "Like the Good Samaritan, the outsider is the one who responds rightly."),
    ch("When were the ten men healed?", ["on the way, as they went to the priests", "before they ever met Jesus", "a year later, in the temple", "only after they returned to give thanks"], "Read Luke 17:14.", "They were cleansed as they went. All ten received; one gave thanks."),
    ch("1 Thessalonians 5:18 says: 'In everything give...'", ["thanks", "orders", "money", "warnings"], "It is about gratitude in all circumstances.", "'In everything give thanks, for this is the will of God in Christ Jesus toward you.' (WEB)"),
    ch("Psalm 103:2: 'Praise Yahweh, my soul, and don't forget all his...'", ["benefits", "laws", "enemies", "songs"], "The rest of the psalm lists them one by one.", "Remembering benefits specifically is the 'naming' part of gratitude."),
    ch("According to Edward Winslow's letter, who joined the Plymouth colonists for the 1621 harvest celebration?", ["Massasoit and about ninety Wampanoag men", "Governor Bradford's family from England", "the crew of a passing Spanish ship", "a hundred settlers from Virginia"], "The Wampanoag leader came with many men.", "Winslow records Massasoit and about ninety men, who stayed three days."),
    ch("Who taught the Plymouth colonists to plant corn?", ["Tisquantum (Squanto)", "Edward Winslow", "Sarah Josepha Hale", "William Bradford"], "Governor Bradford recorded it.", "Tisquantum, who had learned English after being kidnapped to Europe, helped the colonists survive."),
    ch("What did the Wampanoag bring to the 1621 celebration, according to Winslow?", ["five deer", "a turkey for each family", "gold coins", "nothing"], "Winslow's letter mentions a specific number.", "They killed five deer and gave them to the colonists. (Winslow mentions 'fowl' shot by the colonists, but he does not name turkey.)"),
    ch("Who campaigned for about seventeen years for a national Thanksgiving Day?", ["Sarah Josepha Hale", "Elizabeth Fry", "Massasoit", "George Washington"], "She was a magazine editor who wrote many letters to presidents.", "Sarah Josepha Hale's long campaign succeeded in 1863."),
    num("Lincoln proclaimed a national Thanksgiving in 1863. How many years was that after the 1621 harvest celebration?", 242, "Subtract 1621 from 1863.", "1863 − 1621 = 242 years."),
    ch("Cicero called gratitude 'the parent of all the other virtues' (For Plancius 80). Which reason best supports this?", ["Noticing gifts makes it easier to be humble, generous and content.", "Cicero was a famous Roman orator and statesman.", "Gratitude is the virtue that is easiest to practise.", "Parents are usually grateful for their children."], "Which reason connects gratitude to other virtues?", "A grateful person sees life as gift, which nourishes humility, generosity and contentment."),
    ch("Which statement shows envy rather than contentment?", ["'It isn't fair that she has a bigger room than me.'", "'I'm glad of my cosy room and the books on my shelf.'", "'Thank you for the new pencils.'", "'I enjoyed our walk.'"], "Envy looks at what others have, with resentment.", "Envy compares and resents; contentment notices and gives thanks."),
    ch("Philippians 4:11: Paul had learned 'in whatever state I am, to be...'", ["content in it", "angry about it", "rich in it", "silent in it"], "Contentment is learned.", "Paul learned contentment, even in prison."),
    G.virtue(7, ["gratitude", "kindness", "honesty"]), G.choose(7, ["gratitude"]), G.choose(7, ["gratitude"]), G.reason(), G.verse(["gratitude"]), G.verse(["gratitude"]), G.bible(["gratitude", "kindness"]), G.hero(["Marcus Aurelius", "Adam Smith", "Elizabeth Fry", "Socrates"]), G.feel(), G.def(7),
  ],
  challenge: [
    ch("All ten men were healed, but only one returned. What does this show about the difference between receiving and gratitude?", ["Receiving a gift is not the same as noticing and naming it.", "The nine were not really healed after all.", "Gratitude happens automatically when good things come.", "Only foreigners are capable of real gratitude."], "Did the nine receive less? What did they fail to do?", "All received the same gift; only one noticed and named it. Gratitude is a chosen response."),
    ch("A popular picture of 'the first Thanksgiving' shows the Wampanoag being invited, eating turkey and pumpkin pie. Which part is best supported by Winslow's 1621 letter?", ["Massasoit and about ninety men came for three days and brought deer.", "Pumpkin pie and cranberry sauce were served at the meal.", "Roast turkey was the main dish, carved by the governor.", "It was officially named Thanksgiving Day that year."], "Which details does the earliest source actually mention?", "Winslow mentions the visitors, the three days and the deer. Later pictures added details that the source does not support."),
    ch("1 Thessalonians 5:18 says to give thanks 'in everything'. Does this mean we must thank God that bad things happen?", ["No: 'in' everything, so we thank God for real goods even in hardship.", "Yes: we must be glad about every evil that happens to us.", "No: it means we give thanks only on days that go well.", "Yes: it means Christians should never feel sad at all."], "Read the preposition carefully: 'in' or 'for'?", "Careful reading matters: 'in everything' calls for thanks in all circumstances, which is different from calling evil good. Lament and gratitude can coexist (as in many Psalms)."),
    ch("Lincoln proclaimed a day of thanksgiving in October 1863, during a terrible war. Which reason best explains why gratitude in hard times is not foolish?", ["Real goods remain in hardship, and naming them gives strength.", "Hard times are not really as hard as they seem to be.", "Giving thanks was meant to end the war quickly.", "Lincoln did not yet know how serious the war was."], "Is gratitude pretending things are good, or noticing goods that are really there?", "Gratitude is honest: it names true goods. That is different from denial."),
    ch("Argument: 'Grateful people are happier. I want to be happy. So I should be grateful.' What is missing from the Christian view of gratitude in this argument?", ["It treats thanks as a tool; gratitude is owed to the Giver in justice and love.", "Nothing is missing: happiness is the only reason to be grateful.", "The argument is false, because grateful people are never happy.", "The argument is invalid, because it mentions feelings at all."], "Is gratitude only a technique, or also a response to a person?", "The argument may be valid, but it treats gratitude as a tool. Scripture presents thanks as rightly due to God and to those who give."),
    G.reason(),
  ],
  extend: "Read Luke 17:11–19 and Psalm 100 aloud. Then read (with a parent) Lincoln's Thanksgiving Proclamation of 3 October 1863, which is in the public domain. List three things Lincoln names to be thankful for, even in wartime.",
  offline: "At dinner this week, hold a gratitude round: each person names one SPECIFIC good thing and who gave it (not 'my family' but 'Dad drove me to my lesson in the rain'). Explain it: in 2–4 sentences, explain why naming the gift and the giver specifically makes gratitude stronger.",
