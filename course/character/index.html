    { say: "After Job and his friends had argued for many chapters, God answered with questions about creation that no human could answer. Job replied with intellectual honesty: he had spoken about things he did not understand.", show: quotes(["Job 38:4", "Job 42:3"]) },
    { say: "Paul warns that thinking you know is a sign that you do not yet know as you ought. Proverbs says the wise listen to counsel.", show: quotes(["1 Corinthians 8:2", "Proverbs 12:15"]) },
    { say: "History. In 1847 in Vienna, <b>Ignaz Semmelweis</b> noticed that far more mothers died in the clinic run by doctors than in the one run by midwives. He reasoned that doctors carried 'cadaverous particles' from dissections to mothers, required washing in chlorinated lime, and deaths fell sharply.", show: S(svg(T(300, 40, "Deaths of mothers (approximate rates)", 22) + `<rect x='120' y='70' width='120' height='170' fill='#b45309'/><rect x='360' y='215' width='120' height='25' fill='#0f766e'/><line x1='80' y1='240' x2='540' y2='240' stroke='#555' stroke-width='3'/>` + T(180, 270, "before washing", 20) + T(180, 298, "about 1 in 10", 20, "#7c2d12") + T(420, 270, "after washing", 20) + T(420, 298, "about 1 in 50", 20, "#0f4c45"))) },
    { say: "Yet most doctors rejected him. Admitting he was right meant admitting that they had been harming patients, and the idea of invisible germs was not yet understood. Semmelweis also published his evidence late (1861) and attacked his critics angrily, which did not help. He died in 1865. In the 1860s, Louis Pasteur's germ theory and Joseph Lister's antiseptic surgery showed that he had been right.", show: tbl([["Lesson", "From the Semmelweis story"], ["Follow the evidence", "Deaths fell when hands were washed."], ["Admit what you don't know", "Doctors could not explain the fever, yet resisted a new idea."], ["Communicate humbly and clearly", "Semmelweis's anger and late publishing slowed acceptance."]]) },
    { say: "A tool for testing reasoning. An argument is <b>valid</b> if, <b>supposing</b> its premises (reasons) are true, the conclusion <b>must</b> be true. It is <b>sound</b> if it is valid <b>and</b> its premises really are true. Only a sound argument proves its conclusion.", show: tbl([["Argument", "Valid?", "Premises true?", "Sound?"], ["All birds have feathers. A robin is a bird. So a robin has feathers.", "yes", "yes", "yes"], ["All fish can fly. A shark is a fish. So a shark can fly.", "yes", "no", "no"], ["Some birds swim. A penguin swims. So a penguin is a bird.", "no", "yes", "no (true conclusion, bad reasoning)"]]) },
    { say: "Change your mind when <b>true evidence and sound reasoning</b> show you were wrong, not merely because someone argues loudly or cleverly. The feeling that resists is often <b>embarrassment</b>. Name it, and remember: the person who says 'I was wrong' has just become wiser.", show: big("Change your mind for evidence,\nnot for pressure.") },
    explain("Explain the difference between a valid argument and a sound one, with your own example of each, and say what the Semmelweis story teaches about changing your mind."),
  ],
  practice: [
    ch("Why is saying 'I don't know yet' a form of honesty?", ["Pretending to know is a false claim about yourself.", "Because it avoids work.", "Because no one ever knows anything.", "Because it ends the conversation."], "Recall the second part of honesty: not pretending.", "Honesty includes not pretending to knowledge you lack."),
    ch("In Job 38:4, what does God ask Job?", ["Where were you when I laid the foundations of the earth?", "Why have you not offered sacrifices for your children?", "How many days did it take you to build your house?", "Who taught you to speak so wisely to your friends?"], "God's questions reveal the limits of human knowledge.", "'Where were you when I laid the foundations of the earth? Declare, if you have understanding.'"),
    ch("How did Job respond (Job 42:3)?", ["He admitted he had spoken of things he did not understand.", "He insisted that his friends had been right all along.", "He demanded that God explain the reason for his suffering.", "He said that he had understood everything from the start."], "Intellectual honesty before God.", "'I have uttered that which I did not understand, things too wonderful for me.'"),
    ch("1 Corinthians 8:2 says that if anyone thinks he knows anything...", ["he doesn't yet know as he ought to know", "he is the wisest of all", "he should teach everyone", "he never needs to learn again"], "Overconfidence is a sign of ignorance.", "Real knowledge is accompanied by awareness of its limits."),
    ch("What did Semmelweis notice in 1847?", ["Far more mothers died in the clinic run by doctors and students than in the midwives' clinic.", "Mothers in the midwives' clinic died more often than those cared for by doctors.", "Deaths were the same in both clinics, so the cause had to be the bad air of Vienna.", "Mothers who arrived in winter died far more often than those who arrived in summer."], "Comparing two groups is a powerful kind of evidence.", "The difference between the clinics was the clue."),
    ch("What did Semmelweis think doctors were carrying to mothers?", ["particles from the bodies they had dissected", "bad air from the streets of the city", "worries that made the mothers weak", "dust from the hospital's old wooden floors"], "His colleague died after an autopsy cut.", "He called them 'cadaverous particles'; we now know they were bacteria."),
    ch("What did Semmelweis require doctors to do?", ["wash their hands in chlorinated lime", "stop working", "wear gloves made of wool", "pray before every visit"], "A chemical wash.", "Chlorinated lime solution removed the smell and, as we now know, the germs."),

lesson({
  title: "Hope: an anchor that holds", icon: "🌅",
  learn: [
    { say: "Our definition: hope is <b>confidently expecting good from God, and so not giving up</b>. Hope looks forward, as faith trusts and love gives. Hebrews calls it 'an anchor of the soul', which holds when the storm is strongest.", show: quote("Hebrews 6:19") },
    { say: "Three attitudes are easily confused. <b>Wishful thinking</b> believes something because you want it. <b>Optimism</b> is a general expectation that things will turn out well. <b>Hope</b>, in the Christian sense, is a confident expectation <b>grounded in true reasons</b>: God's character and promises. Hope passes the TRUTH rule; wishful thinking does not.", show: tbl([["", "Basis", "Example"], ["Wishful thinking", "what I want", "'It won't rain, because I want to picnic.'"], ["Optimism", "a general mood", "'Things usually work out.'"], ["Hope", "true reasons: God's promises and character", "'God is faithful, so I will keep going.'"]]) },
    { say: "Lamentations was written after Jerusalem was destroyed by Babylon in 586 BC. In the middle of grief the poet deliberately calls something to mind, and hope returns. Hope is not denial; it remembers what is true.", show: quotes(["Lamentations 3:21", "Lamentations 3:22-23"]) },
    { say: "Paul explains how hope grows through hardship, link by link, and why it does not disappoint.", show: quote("Romans 5:3-5") },
    { say: "Beaten and locked in the inner prison at Philippi, with their feet in stocks, <b>Paul and Silas</b> were praying and singing hymns at midnight (Acts 16). That is hope in action: not pretending the prison was pleasant, but trusting that it was not the end.", show: quote("Acts 16:25") },
    { say: "History. In May 1940 British and French soldiers were trapped at <b>Dunkirk</b>. Planners hoped to rescue perhaps 45,000. From 26 May to 4 June, warships and hundreds of 'little ships' carried about 338,000 across the Channel: not a victory, but a reason to hope.", show: S(svg(T(300, 40, "Dunkirk 1940 (approximate numbers)", 24) + `<rect x='130' y='215' width='90' height='35' fill='#b45309'/><rect x='370' y='60' width='90' height='190' fill='#0f766e'/><line x1='80' y1='250' x2='540' y2='250' stroke='#555' stroke-width='3'/>` + T(175, 205, "45,000", 22, "#7c2d12") + T(175, 280, "hoped for", 20) + T(415, 100, "338,000", 22, "#fff") + T(415, 280, "rescued", 20))) },
    { say: "Year review: our virtues with an example of each. Disappointment is the feeling hope must face: a hope that does not come true. Name it honestly, grieve it if needed, and then ask what is still true and what is the next good step. That is <b>resilience</b>.", show: tbl([["Virtue", "An example from this course"], ["Honesty", "Nathan: 'You are the man.'"], ["Kindness", "the Good Samaritan; Elizabeth Fry"], ["Courage", "Esther; Nicholas Winton"], ["Self-control", "David sparing Saul; Lincoln's unsent letter"], ["Gratitude", "the one healed man who returned; Marcus Aurelius"], ["Hope", "Paul and Silas at midnight; Dunkirk"]]) },

    ch("Lamentations 3:21 says 'This I recall to my mind; therefore I have hope.' What does this show about where hope comes from?", ["Hope can be strengthened by deliberately remembering what is true.", "Hope comes only when circumstances improve and the trouble ends.", "Hope means forgetting the past so that it cannot hurt us any more.", "Hope is impossible while a person is grieving a great loss."], "What did the poet do?", "In the ruins of Jerusalem, remembering God's faithfulness renewed hope."),

lesson({
  title: "Love: the greatest of these", icon: "❤️",
  learn: [
    { say: "Paul names faith, hope and love, and says love is the greatest. Our definition: love is <b>willing the good of another person and acting on it, even at a cost to yourself</b>. Love is more than a feeling; it is a choice of the will, shown in action. Thomas Aquinas, following Aristotle, described love as willing the good of another (paraphrased).", show: quote("1 Corinthians 13:13") },
    { say: "Paul's portrait of love is a list of actions and refusals. Notice how many of our virtues appear inside it: patience (self-control), kindness, humility, honesty ('rejoices with the truth'), perseverance.", show: quote("1 Corinthians 13:4-7") },
    { say: "Jesus named love of God and love of neighbour as the two great commandments, and showed the greatest love by laying down his life. Christians love because God loved first.", show: quotes(["Matthew 22:37-39", "John 15:13", "Romans 5:8", "1 John 4:19"]) },
    { say: "Two pictures of love in Scripture. <b>Jonathan</b>, King Saul's son and heir, loved David 'as his own soul', protected him from his father, and made a covenant with him, though David would become king in his place (1 Samuel 18–20). And in Jesus' parable the <b>father of the prodigal son</b> ran to welcome the son who had wasted his inheritance (Luke 15).", show: quotes(["1 Samuel 18:1", "Luke 15:20"]) },
    { say: "History. <b>Father Damien</b> (1840–1889), a Belgian priest, went in 1873 to Kalaupapa on Molokai, where people with leprosy had been isolated. He built homes, dressed wounds and buried the dead. He caught the disease himself and died there in 1889.", show: tbl([["Year", "Event"], ["1840", "Born in Tremelo, Belgium"], ["1873", "Arrives at Kalaupapa, Molokai"], ["1884", "Diagnosed with leprosy"], ["1889", "Dies at Kalaupapa"], ["2009", "Recognised as a saint by the Catholic Church"]]) },
    { say: "Philosophy. Greek has several words for love: <b>storge</b> (family affection), <b>philia</b> (friendship), <b>eros</b> (romantic love) and <b>agape</b> (self-giving love, Paul's word in 1 Corinthians 13). <b>Aristotle</b> described three kinds of friendship; the table shows them.", show: tbl([["Friendship of...", "Why the friends like each other", "How long it lasts"], ["usefulness", "each gains something", "until the use ends"], ["pleasure", "it is fun together", "until the fun fades"], ["goodness", "each loves the other's good character", "long and steady"]]) },
    { say: "Feelings and love. <b>Affection</b> is a warm feeling; <b>loyalty</b> is faithfulness when feelings are low. Love includes both but depends on neither alone: Jesus commands love even for enemies (Luke 6:35), which shows that love is something we can choose.", show: quote("Luke 6:35") },
    explain("Explain why love is more than a feeling, using our definition, one example from Scripture and Father Damien. Then describe Aristotle's three kinds of friendship."),

  challenge: [
    ch("Someone says: 'Love just means making people feel good.' Using 1 Corinthians 13:6, what is wrong with this?", ["Love rejoices with the truth and wills a person's real good, which sometimes means hard words (like Nathan to David).", "Nothing is wrong with it: love is shown whenever someone feels happier after being with you.", "Love means making people feel bad, so that they learn to become stronger and more patient.", "Verse 6 is about faith rather than love, so it cannot help us to answer this question."], "Is a person's good always the same as their feelings in the moment?", "Love wills real good, which includes truth; pleasant feelings are not always good for someone."),
    ch("Argument: 'Love is a feeling. Feelings cannot be commanded. So love cannot be commanded.' Jesus commands love. What follows?", ["If Jesus' command is meaningful, the first premise is incomplete: love is more than a feeling.", "Jesus must have been mistaken, since the argument is sound and its conclusion true.", "The argument is invalid, because its conclusion does not follow from its premises.", "The second premise is false, because feelings can always be switched on by command."], "The argument is valid. Which premise must go?", "Since the conclusion conflicts with Jesus' command, a Christian rejects the first premise: love is chiefly a choice of will."),
    ch("Jonathan loved David, yet he also honoured his father Saul. When Saul sought to kill David, how did Jonathan's love act wisely?", ["He warned and protected David while speaking honestly to his father, refusing to join in injustice.", "He obeyed his father in everything, because a son's duty to a king outweighs friendship.", "He secretly plotted with David to overthrow Saul and take the throne for himself.", "He stayed out of the quarrel completely, so as not to upset either of them."], "Love, honesty and justice together.", "Jonathan defended David to Saul and warned David (1 Samuel 19–20): love joined with courage and honesty."),
    ch("Aristotle's friendship of goodness helps each friend become better. Which situation shows it?", ["A friend gently tells you that you were unkind and helps you apologise.", "A friend only visits when you have new toys.", "A friend laughs at everything you do, right or wrong.", "A friend copies your homework."], "Which friend wills your real good?", "A true friend helps you grow in virtue, even when it is uncomfortable."),
    ch("Is it possible to love someone you do not like?", ["Yes: you can will and work for their good without warm feelings.", "No: liking and loving are the same, so it is a contradiction.", "Only if they love you first and show it in some clear way.", "Only members of your family, never friends or strangers."], "Recall the definition and Luke 6:35.", "Love as willing the good can exist even when affection is weak; affection may grow later."),
    G.reason(),
  ],
  extend: "Read 1 Corinthians 13 and 1 Samuel 18–20 with a parent. Then read, with a parent, a short extract from Robert Louis Stevenson's 'Father Damien: An Open Letter to the Reverend Dr. Hyde' (1890, public domain). Discuss: what is Stevenson defending, and what evidence does he use?",
  offline: "Love in action: choose one family member and, for a week, do one thing each day that wills their good at some cost to you (your time, your preference, your comfort). Tell no one until the end of the week. Explain it: in 2–4 sentences, explain why love is more than a feeling, with one example from Scripture.",
}),
// ---------- Lesson 31 ----------
lesson({
  title: "When virtues seem to conflict", icon: "⚖️",
  learn: [
    { say: "Sometimes two goods seem to pull in opposite directions: honesty and kindness, a promise and someone's safety, loyalty to a friend and justice. These are the hardest moral questions. Today we will not pretend they are easy; we will weigh reasons carefully, as the TRUTH rule requires.", show: S(svg(T(300, 45, "When two goods seem to collide", 26) + box(40, 100, 200, 90, "#e0f2f1", "#0f766e") + T(140, 155, "honesty", 26) + box(360, 100, 200, 90, "#fff7ed", "#b45309") + T(460, 155, "protecting life", 24) + `<path d='M250 145 h100' stroke='#555' stroke-width='5'/>` + T(300, 130, "?", 30, "#555", 800) + T(300, 250, "prudence weighs: what is true, what is owed, what follows?", 20, "#0f766e", 800))) },
    { say: "In Jericho, <b>Rahab</b> hid two Israelite spies on her roof, sent the king's men away with a false account, and helped the spies escape, because she believed Israel's God is God of heaven and earth (Joshua 2). The New Testament commends her: Hebrews 11:31 for her faith, James 2:25 for protecting the messengers.", show: quote("Joshua 2:11") },
    { say: "We met the Hebrew midwives in lesson 13. When Pharaoh demanded why the boys were alive, they gave this answer. Scripture then says God dealt well with them (Exodus 1:20).", show: quote("Exodus 1:19") },
    { say: "Christians have long disagreed here. <b>Augustine</b> (about AD 395) and <b>Kant</b> (1797) held every lie wrong, even to a murderer at the door: refuse, keep silent or deflect, but do not lie. Others disagreed. <b>Benjamin Constant</b>, the writer Kant was answering, argued that no one has a right to a truth that harms others, and many Christians have held that a would-be murderer has no right to the truth. The German pastor <b>Dietrich Bonhoeffer</b>, who resisted the Nazis, argued that telling the truth means saying what is real in a way that fits the relationship and the situation, not merely matching words to facts.", show: tbl([["View", "Key reason", "What it would do at the door"], ["Never lie (Augustine, Kant)", "a lie is always wrong; we may not do evil that good may come", "stay silent, refuse, or deflect"], ["Deception may be permitted (Constant; many Christians)", "a would-be murderer has forfeited any right to the truth; protecting life is a grave duty", "deceive to protect the innocent"], ["Shared ground", "protecting innocent life is commanded (Proverbs 24:11)", "both views try to save the friend"]]) },
    { say: "Weigh the reasons carefully. It is <b>true</b> that Hebrews and James commend Rahab's faith and her protection of the spies. It is <b>also true</b> that they do not explicitly comment on her words. So these verses support the goodness of protecting the spies; whether they approve the false words is exactly what Christians debate. Notice what is not in doubt anywhere: both views agree that saving the innocent is right.", show: quotes(["Proverbs 24:11", "Matthew 10:16"]) },
    { say: "History. From 1940 to 1944 the French village of <b>Le Chambon-sur-Lignon</b> and the plateau around it, encouraged by Pastor <b>André Trocmé</b> and <b>Magda</b>, sheltered refugees, many of them Jewish children. Estimates vary; one museum estimate is about 5,000 refugees, including about 3,500 Jews, on the whole plateau. Some villagers made false papers, though Trocmé himself was known for his reluctance to lie. Yad Vashem honours the village as Righteous Among the Nations.", show: pas("Le Chambon-sur-Lignon (1940–1944)", "A Protestant farming village on a high plateau in southern France.\n\nFamilies took refugees, many of them children, into homes, farms and schools.\n\nWhen Vichy officials demanded cooperation, Trocmé refused to hand over or list the refugees. In February 1943 he was arrested and held for several weeks in an internment camp, then released.\n\nThe village was recognised as Righteous Among the Nations; André and Magda Trocmé were honoured individually.") },
    { say: "Two ideas help. The <b>unity of the virtues</b>: prudence joins them, so real honesty is never cruel and real kindness never false. And the <b>Golden Rule</b> (Matthew 7:12): what would you want if you were the hidden friend? If you feel <b>torn</b>, name it, pray, seek counsel, and honour every duty you can.", show: list(["Name every duty involved, not just one.", "Ask: which reasons are TRUE, and which actually support the action?", "Look for a third option that honours both goods (silence, deflection, seeking help).", "Apply the Golden Rule from each person's place.", "If a duty must yield, choose the weightier, and act with humility."]) },
    explain("Explain the two Christian views on lying to a murderer at the door, give the strongest true reason for each, and say what both views agree on."),
  ],
  practice: [
    ch("What makes a moral dilemma hard?", ["Two real goods or duties seem to require opposite actions.", "There is no right or wrong answer, only personal taste.", "Every choice available is equally wicked and harmful.", "The person deciding does not know any moral rules."], "Both sides have something good in them.", "A genuine dilemma sets real goods against each other; that is why it needs careful weighing."),
    ch("Where did Rahab hide the two spies?", ["on her roof, under stalks of flax", "in the city well", "in the king's palace", "in a cave outside Jericho"], "Joshua 2:6.", "She hid them under stalks of flax on her roof."),
    ch("What reason did Rahab give for helping the spies (Joshua 2:11)?", ["She believed Israel's God is God in heaven above and on earth beneath.", "The spies promised to pay her well in silver once Jericho had fallen.", "She was secretly an Israelite who had been born in the wilderness.", "The king of Jericho had told her to look after any visitors."], "Read Joshua 2:11.", "Her action came from faith in the God of Israel."),
    ch("For what does Hebrews 11:31 commend Rahab?", ["her faith, in receiving the spies in peace", "her clever words to the king's messengers", "her courage in fighting for Jericho's walls", "her wealth, which she gave to the Israelites"], "'By faith, Rahab...'", "Hebrews places her in the list of the faithful for receiving the spies."),
    ch("What does James 2:25 say Rahab did?", ["received the messengers and sent them out another way", "told the king of Jericho where the spies were hiding", "opened the city gate to let Joshua's army inside", "hid the spies' treasure until the war was over"], "James is discussing faith shown in action.", "James cites her deeds of receiving and sending out the messengers."),
    ch("Which statement about Hebrews 11:31 and James 2:25 is most accurate?", ["They commend Rahab's faith and protection of the spies, but do not explicitly comment on her false words.", "They explicitly praise her false words to the king's men as the clearest example of her faith.", "They condemn Rahab for lying, and mention her only as a warning to the early churches.", "They commend her for keeping Jericho safe from the Israelite army until the walls fell."], "Read exactly what the verses say, no more and no less.", "Careful reading separates what the text says from what readers infer."),
    ch("What did the midwives tell Pharaoh (Exodus 1:19)?", ["that Hebrew women were vigorous and gave birth before the midwife came", "that they had obeyed his order and that no Hebrew boys had survived", "that they feared God and would therefore refuse any order he gave", "that the Hebrew families had hidden their babies in the river"], "Read the verse.", "They claimed the births happened before they arrived."),
    ch("Which thinkers held that lying is always wrong, even to a murderer at the door?", ["Augustine and Kant", "Hillel and Confucius", "Aristotle and Plutarch", "Adam Smith and Franklin"], "One wrote On Lying around AD 395; the other wrote in 1797.", "Augustine and Kant both held the strict view."),
    num("Augustine wrote On Lying about AD 395, and Kant wrote his essay in 1797. About how many years apart?", 1402, "Subtract.", "1797 − 395 = 1402 years."),
    ch("What would the strict view (Augustine, Kant) do at the murderer's door?", ["refuse to answer, stay silent, or deflect, but not lie", "tell the truth plainly, since that is always required", "lie to protect the friend, since life matters most", "hand the friend over, since the law must be obeyed"], "Strict does not mean helping evil.", "They would protect the friend by every means short of lying."),
    ch("What is the key reason of those who say deceiving the murderer is permitted?", ["Someone seeking to murder has no right to the truth, and protecting innocent life is a grave duty.", "Lying is permitted whenever the person lying feels that it would lead to better results overall.", "Truth is only a matter of opinion, so no one can ever be blamed for saying something false.", "The murderer will probably not believe the answer anyway, so it makes no difference what is said."], "Whose right is at stake?", "This view holds that deception aimed at stopping murder is not the sin of lying."),
    ch("What do both views agree on?", ["Protecting the innocent friend is right.", "Lying is always good.", "The friend should be handed over.", "Nothing at all."], "Proverbs 24:11.", "Neither view would betray the friend; they differ only on the means."),
    ch("Proverbs 24:11 commands...", ["Rescue those who are being led away to death!", "Keep silent when you see others in trouble.", "Obey every command that a king gives you.", "Never speak to strangers at your door."], "Shared ground for both views.", "Rescuing the innocent is commanded."),
    ch("When were refugees sheltered at Le Chambon-sur-Lignon?", ["1940–1944", "1776–1783", "1914–1916", "1847–1865"], "During the Second World War.", "From 1940 to 1944, during the German occupation and Vichy rule."),
    ch("Who led the village of Le Chambon in sheltering refugees?", ["Pastor André Trocmé and his wife Magda, with many villagers", "Corrie ten Boom and her sister Betsie, from their home in Haarlem", "Nicholas Winton, who arranged trains from Prague to Britain", "the mayor of the village, acting on orders from the government"], "A Protestant pastor and his wife.", "André and Magda Trocmé encouraged and led the rescue, but it was the work of many families across the plateau."),
    ch("Jesus told his disciples to be 'wise as serpents, and harmless as doves' (Matthew 10:16). How does this help in dilemmas?", ["It calls for both shrewd prudence and innocence: clever in protecting good, without doing harm.", "It calls for suspicion of everyone, since the world is full of danger and no one can be trusted.", "It means that cleverness matters more than goodness when dealing with dangerous people.", "It means avoiding every hard situation, since doves fly away from danger rather than face it."], "Two animals, two qualities.", "Prudence and innocence must go together."),
    ch("What is the 'unity of the virtues'?", ["the idea that the virtues belong together, joined by prudence, so true honesty is never cruel and true kindness never false", "the idea that one virtue, such as kindness, is enough, because all the others can be reduced to it in the end", "the idea that virtues always compete, so a person must choose which few of them to practise and drop the rest", "the idea that a group of virtuous people working together can achieve more than one virtuous person alone"], "Can real kindness be dishonest?", "On this view, apparent conflicts are often resolved by finding the action prudence shows to honour both."),
    { gen: () => { const D = [
        { s: "Your friend shows you a drawing she worked on all week and asks if you like it. You find it rather messy.", good: "Name what is truly good in it (effort, colours, an idea) and gently offer one suggestion if she wants it.", bad: ["Tell her it is the best drawing you have ever seen, the finest in the whole class.", "Tell her plainly that it is messy, since honesty requires you to say what you think.", "Change the subject quickly so that you never have to give her any opinion at all."], w: "Honesty and kindness both survive: everything you say is true, and it is said for her good." },
        { s: "You promised to keep a friend's secret. She then tells you she is being hurt by an older child.", good: "Tell a trusted adult, and tell your friend you are doing so because her safety matters more than the secret.", bad: ["Keep the secret no matter what, because a promise must be kept whatever happens.", "Tell the whole class, so that everyone knows and can keep an eye on the older child.", "Confront the older child alone tomorrow, without telling any adult what you know."], w: "A promise of secrecy cannot oblige you to leave someone in danger; love for her outweighs the promise." },
        { s: "Your best friend cheated on a test, and the teacher is about to blame an innocent classmate.", good: "Urge your friend to own up; if he will not, tell the teacher the truth.", bad: ["Stay silent out of loyalty; it is not your job to report a friend.", "Let the classmate take the blame; it will soon be forgotten.", "Tell the teacher you saw the classmate cheat, to protect your friend."], w: "Loyalty to a friend cannot require an injustice to someone else; justice and honesty decide." },
        { s: "Your grandmother asks whether you enjoyed the long concert she took you to. You were bored for much of it.", good: "Thank her for taking you, say honestly that parts felt long to you, and tell her the part you truly enjoyed.", bad: ["Say it was the best day of your whole life, so she feels happy.", "Tell her honestly that it was boring and that you hated it.", "Shrug and say nothing, so that you neither lie nor upset her."], w: "She asked a direct question, so answer it truthfully, but gently: you can be grateful and honest at once by naming true goods and putting the rest kindly." },
        { s: "You promised to play with your friend, but your little brother has fallen and is hurt.", good: "Help your brother first, then explain to your friend and make another plan.", bad: ["Keep the promise and go to play, leaving your brother to manage alone.", "Help your brother and simply not turn up, without telling your friend why.", "Help your brother, then tell your friend it was his fault the game was off."], w: "An urgent duty of care outweighs a play date; honesty and repair handle the broken plan." },
        { s: "A classmate asks you to confirm to the teacher that he was with you when the window broke. He was not.", good: "Refuse to confirm a falsehood, and say only what you know.", bad: ["Confirm his story, because loyal friends always stand by each other.", "Say you cannot remember, although you know he was not with you.", "Say it was probably someone else from the other class who did it."], w: "Loyalty never requires false witness (Exodus 20:16). Tell only the truth you know." },
      ]; const d = pick(D);
      return { q: d.s + " Which response best honours all the goods involved?", options: [d.good, ...d.bad], answer: d.good, hint: "Name every duty involved. Is there an action that honours both?", why: d.w }; } },
    { gen: () => { const D = [
        { s: "honesty and kindness", ex: "telling a friend a hard truth gently", t: "Both can be honoured: say only true things, chosen and said for the other's good." },
        { s: "a promise and someone's safety", ex: "a secret that hides danger", t: "Safety outweighs a promise of secrecy; explain honestly why you must tell." },
        { s: "loyalty and justice", ex: "a friend's wrongdoing blamed on someone innocent", t: "Loyalty cannot require injustice to another; urge the friend to confess, or tell the truth yourself." },
        { s: "obedience and conscience", ex: "an adult commanding something clearly wrong", t: "'We must obey God rather than men' (Acts 5:29): refuse the wrong, respectfully." },
      ]; const d = pick(D), others = some(D.filter((x) => x !== d), 3);
      return { q: "Which principle best resolves a conflict between " + d.s + " (for example, " + d.ex + ")?", options: [d.t, ...others.map((x) => x.t)], answer: d.t, hint: "Match the principle to the two goods named.", why: d.t }; } },
    G.virtue(31), G.choose(31), G.reason(), G.reason(), G.bible(["faith", "courage", "honesty", "justice"]), G.verse(["honesty", "courage", "love", "justice"]), G.hero(["André and Magda Trocmé", "Corrie ten Boom", "Nicholas Winton", "Harriet Tubman"]), G.think(["Immanuel Kant", "Augustine", "Dietrich Bonhoeffer", "Confucius", "Hillel"]), G.def(31),

  challenge: [
    ch("Argument: 'Hebrews 11 commends Rahab. Rahab lied. So Hebrews 11 commends lying.' Evaluate it.", ["Invalid: commending a person for her faith does not commend every act she did; Hebrews names her faith.", "Valid and sound: if a book praises someone, it must approve of everything that person ever did.", "Valid but unsound: the premise that Rahab spoke falsely to the king's men is clearly untrue.", "It is a matter of preference, since Christians disagree, so it cannot be evaluated at all."], "Does praising a person mean praising everything about her?", "Hebrews 11 also commends Samson and Jacob, whose lives include serious sins. The conclusion does not follow."),
    ch("Kant argued you must not lie even to the murderer, partly because you cannot be sure of the consequences: the friend might have left, and your lie could send the murderer straight to him. Which response best weighs this reason?", ["The reason is true (consequences are uncertain), but it does not show that the truthful answer is safer, so it gives weak support.", "The reason proves Kant right beyond doubt, because any uncertainty about consequences makes every lie wrong.", "The reason is false, because a careful person can always know exactly what will happen after they speak.", "The reason is irrelevant, because consequences never matter at all when deciding what is right to do."], "Is the reason true? Does it actually support the conclusion?", "Uncertainty cuts both ways; this true premise only weakly supports the strict view, so his deeper argument rests on the duty never to lie."),
    ch("A student says: 'Christians disagree about Rahab, so there is no truth about it.' What is the error?", ["Disagreement does not show there is no truth; it shows the question is hard and needs careful study.", "There is no error: whenever thoughtful people disagree, each side's view is equally true.", "The error is that Christians have never disagreed about Rahab or about lying.", "The error is that truth is settled by counting how many Christians hold each view."], "Did people once disagree about Semmelweis?", "People disagreed about handwashing too; the truth did not depend on agreement."),
    ch("Trocmé was known for his reluctance to lie, while other villagers forged papers to save lives. What does this show most clearly?", ["Christians who agreed on protecting the innocent could differ on means, while all acted with courage and love.", "Trocmé cared more about his own reputation for honesty than about the refugees in his village.", "The villagers who forged papers must have rejected Christian teaching entirely.", "The disagreement shows that the village had no shared principles and acted at random."], "What did all of them agree on?", "Shared aim, differing judgments about means: a real example of the debate."),
    ch("Which is the best general method for an apparent conflict between honesty and kindness?", ["Find words that are wholly true and chosen for the person's good; you need not say everything, but must not say what is false.", "Choose kindness every time and say whatever will please the person, since hurt feelings matter more than accuracy.", "Choose honesty every time and say every critical thought bluntly, since kindness is only a polite form of pretending.", "Avoid the person until the situation has passed, since silence can never be either unkind or dishonest."], "Recall grandmother's jumper in lesson 2.", "Most honesty–kindness conflicts dissolve when we choose which truths to say and how to say them."),

  extend: "Read Joshua 2 and Joshua 6:22–25 (how Rahab was spared), then Hebrews 11:31 and James 2:25. With a parent, read a short account of Le Chambon-sur-Lignon. Discuss: which reasons on each side of the Rahab debate are true, and which actually support the conclusion?",
  offline: "Dilemma dinner: present one of today's dilemmas to your family and ask each person for their answer AND their reason. Note which reasons were true and relevant. Explain it: in 2–4 sentences, explain the two views on lying to a murderer at the door and what they share.",

// ---------- Lesson 32 ----------
lesson({
  title: "The examined life: a year of character", icon: "🎓",
  learn: [
    { say: "We began the year with Socrates: <b>the unexamined life is not worth living</b>. Now, at the end, it is time to examine your own year. Scripture calls for the same self-examination, not to make us anxious, but to lead us in the right way.", show: quotes(["Lamentations 3:40", "2 Corinthians 13:5", "Psalm 139:23-24"]) },
    { say: "Here are all thirteen virtues we studied, with their definitions. The first five were the year's focus; the four cardinal virtues (prudence, justice, courage, temperance) come from Plato and the classical tradition; faith, hope and love come from Paul (1 Corinthians 13:13).", show: tbl([["Virtue", "Definition"], ...INTRO.map(([v]) => [v, DEF[v]])]) },
    { say: "Micah summarises what God asks; Paul tells us what to fill our minds with. These two verses could serve as a creed for the whole course.", show: quotes(["Micah 6:8", "Philippians 4:8"]) },
    { say: "History as a mirror. The Greek writer <b>Plutarch</b> (about AD 46–after 119) wrote the <i>Parallel Lives</i>, pairing Greek and Roman figures. In the preface to his <i>Life of Aemilius Paulus</i>, he says that he uses history like a mirror, studying great lives in order to shape and improve his own. That is why we studied Socrates, Elizabeth Fry, Harriet Tubman, Wilberforce and the others: not as trivia, but as mirrors.", show: pas("Plutarch's mirror (paraphrased)", "I began writing these Lives for others, Plutarch says, but I continue for my own sake.\n\nI look into history as into a mirror, and try to arrange my own life in the likeness of the virtues I find there.\n\nThe question for us: which life you studied this year would you most like to resemble, and in which virtue?") },
    { say: "Practice, not perfection. Around 1730, in his mid-twenties, <b>Benjamin Franklin</b> made a chart of thirteen virtues and marked each day's faults, focusing on one virtue a week. He admitted he never reached perfection, but wrote that he was a better and happier man for the attempt. Aristotle would agree: virtues grow by repeated practice. Paul describes the same forward motion.", show: quote("Philippians 3:13-14") },
    { say: "Your creed. A <b>creed</b> (from Latin credo, 'I believe') is a short statement of what you hold to be true and how you mean to live. Write five sentences: what you believe about God, about truth, about other people, which virtue you will practise next, and how you will check yourself. Test each sentence with the TRUTH rule.", show: list(["I believe ... (about God)", "I will seek what is true by ... (how you will weigh evidence)", "I will treat others ... (Golden Rule)", "This year I will practise ... (one virtue, with a plan)", "I will examine myself by ... (a habit: notebook, prayer, chart)"]) },
    { say: "Feelings at the end of a year: <b>pride</b> in real growth (healthy satisfaction), <b>gratitude</b> to those who helped, and perhaps <b>regret</b> for mistakes. Name them all. Regret can turn into repair and resolve; and as Paul says, God who began a good work in you will complete it.", show: quote("Philippians 1:6") },
    explain("Choose one virtue and one life from this year's course, and explain how that life is a 'mirror' for you (Plutarch), with a specific plan to practise the virtue."),
  ],
  practice: [
    ch("Who said 'the unexamined life is not worth living', according to Plato's Apology?", ["Socrates", "Aristotle", "Plutarch", "Franklin"], "Lesson 1.", "Socrates at his trial in 399 BC (Apology 38a)."),
    ch("Lamentations 3:40: 'Let us search and try our ways, and...'", ["turn again to Yahweh", "hide them from everyone", "forget them", "boast about them"], "Self-examination has a purpose.", "Examination leads us back to God."),
    ch("2 Corinthians 13:5 tells believers to...", ["examine your own selves, whether you are in the faith", "examine other believers, to see whether they are faithful", "examine the Scriptures daily to see whether things are so", "examine the signs in the heavens to know the times"], "Paul's call to self-examination.", "'Examine your own selves... Test your own selves.'"),
    ch("Which three virtues does 1 Corinthians 13:13 name, calling the last the greatest?", ["faith, hope and love", "justice, prudence and courage", "honesty, kindness and gratitude", "wisdom, strength and beauty"], "'These three remain.'", "Faith, hope and love; the greatest is love."),
    ch("Which are the four cardinal virtues?", ["prudence, justice, courage, temperance", "faith, hope, love, joy", "honesty, kindness, gratitude, self-control", "wisdom, wealth, health, fame"], "From Plato's Republic and the classical tradition.", "The cardinal virtues: prudence, justice, courage (fortitude) and temperance."),
    ch("According to Micah 6:8, what does Yahweh require?", ["to act justly, to love mercy, and to walk humbly with your God", "to offer thousands of rams and rivers of oil on the altar", "to build a great temple and fill it with gold and cedar", "to keep every feast and fast at its appointed time"], "Three requirements.", "Justice, mercy and humility before God."),
    ch("Which word begins Paul's list in Philippians 4:8?", ["true", "famous", "rich", "easy"], "Lesson 1, and our TRUTH rule.", "'Whatever things are true...' The list begins with truth."),
    ch("What did Plutarch say he used history for?", ["as a mirror, to shape his own life by the virtues he found there", "to entertain his readers with exciting stories of war and adventure", "to prove that Rome was always right and Greece always wrong", "to earn money from the wealthy Romans who paid for his books"], "Preface to the Life of Aemilius Paulus.", "He studied lives to improve his own: history as a mirror."),
    ch("What was Plutarch's great work called?", ["Parallel Lives", "The Republic", "Meditations", "The Wealth of Nations"], "It pairs Greeks and Romans.", "Plutarch's Parallel Lives pairs Greek and Roman figures."),
    num("Franklin was born in January 1706 and began his virtue chart around 1730. About how old was he?", 24, "Subtract the birth year from 1730.", "1730 − 1706 = 24, so he was about twenty-four."),
    ch("What did Franklin conclude about his virtue chart?", ["He never reached perfection but was better and happier for trying.", "He reached moral perfection within a year and stopped the chart.", "The chart was useless, because habits cannot be changed by effort.", "He gave it up because humility was impossible to measure on paper."], "Practice, not perfection.", "Franklin judged that the effort itself improved him."),
    ch("Philippians 3:13–14: 'Forgetting the things which are behind, and stretching forward to the things which are before, I...'", ["press on toward the goal", "sit down and rest", "give up the race", "look back with regret"], "Paul's picture of a runner.", "'I press on toward the goal for the prize of the high calling of God in Christ Jesus.'"),
    ch("What is a creed?", ["a short statement of what you believe and how you mean to live", "a long history of a church, written by its leaders", "a legal contract between two parties about property", "a list of rules for a game, agreed before it begins"], "From Latin credo.", "Credo means 'I believe'; a creed states beliefs and commitments."),

          draw();
          if (picked.length === q.items.length) {
            const value = picked.map((k) => q.items[k]);
            picked = [];
            if (!check(value) && my === token && list.isConnected) draw();
          }
        }
      };
    } else {
      const host = panel(`<div data-pad></div>`);
      numpad($("[data-pad]", host), { onEnter: (v) => check(v), max: 7 });
    }
    prompt();
  });
}

const units = Object.fromEntries(
  COURSE.lessons.map((lesson, i) => [
    `l${i + 1}`,
    async () => {
      const my = token;
      const id = `l${i + 1}`;
      try {
        await learn(lesson, my);
        if (my !== token) return;
        let first = 0;
        const practice = drawSet(lesson.practice || [], lesson.practiceCount || 12);
        for (let k = 0; k < practice.length; k++) {
          if (await ask(practice[k], `Practice ${k + 1} of ${practice.length}`, my)) first += 1;
          if (my !== token) return;
        }
        const challenge = drawSet(lesson.challenge || [], lesson.challengeCount || 3);
        for (let k = 0; k < challenge.length; k++) {
          say("Challenge problem. Understand it, make a plan, carry it out, then check.");
          await wait(1200);
          if (my !== token) return;
          await ask(challenge[k], `⭐ Challenge ${k + 1} of ${challenge.length}`, my);
          if (my !== token) return;
        }
        shell.mark(id, { done: true, first, of: practice.length, doneAt: Date.now() });
        show({ type: "big", text: `${first} / ${practice.length}`, caption: "practice problems correct on the first attempt" });
        panel(`<div class="ap-buttons"><button type="button" class="primary" data-explain>🗣️ Explain it</button><button type="button" data-off>📝 Task</button>${lesson.extend ? `<button type="button" data-extend>🚀 Go further</button>` : ""}<button type="button" data-again>↺ Again</button></div>`);
        say(`Lesson complete. Now explain the main idea in your own words.`);
        $("[data-panel]").onclick = (e) => {
          if (e.target.closest("[data-again]")) shell.go(id);
          if (e.target.closest("[data-explain]")) {
            show({ type: "list", items: [`Explain to a grown-up, in 3 or 4 clear sentences, the main idea of "${lesson.title}".`, "Give one example of your own.", "Say one question you still have."] });
            say("Explain the main idea in three or four clear sentences, give an example of your own, and ask one question you still have.");
          }
          if (e.target.closest("[data-extend]")) {
            show({ type: "list", items: [lesson.extend] });
            say(esc(lesson.extend), { quiet: true });
          }
          if (e.target.closest("[data-off]")) {
            show({ type: "list", items: [lesson.offline || "Tell a grown-up what you learned today, in 5 sentences."] });
            say(esc(lesson.offline || "Tell a grown-up what you learned today."), { quiet: true });
          }
        };
      } catch (error) {
        console.error(error);
      }
    },
  ]),
);

const how = Object.fromEntries(UNITS.map((u) => [u.id, { icon: COURSE.icon, title: u.label.replace(/^\d+\.\s*/, ""), steps: ["Learn: study the lesson slides.", "Practice: solve each problem; a first miss gives a hint, a second shows the full reasoning.", "Challenge: contest-level problems. Then explain the main idea in your own words."] }]));
const fromHash = /^#l\d+$/.test(location.hash) && UNITS.some((u) => u.id === location.hash.slice(1)) ? location.hash.slice(1) : null;
const shell = SHELL({
  unitWord: "Lesson",
  units: UNITS,
  how,
  start: fromHash || UNITS[0].id,
  onStop() {
    token += 1;
    $("[data-panel]").onclick = null;
  },
  subject: COURSE.subject,
  activity: COURSE.title,
  onUnit(id) {
    token += 1;
    VOICE.hush();
    units[id]();
  },
});

// The shell's "turn sideways" tip normally floats at the bottom of the screen, over the answer buttons.
// Here it sits at the foot of the stage (never over a control) and a tap dismisses it.
const placeTip = () => {
  const tip = $(".ap-turn");
  if (!tip) return;
  if (!tip.dataset.placed) {
    tip.dataset.placed = "1";
    tip.classList.add("cr-turn");
    tip.insertAdjacentHTML("beforeend", ` <b aria-hidden="true">✕</b>`);
    tip.setAttribute("role", "button");
    tip.addEventListener("click", () => tip.remove());
  }
  const r = stage.getBoundingClientRect();
  tip.style.bottom = "auto";
  tip.style.top = `${Math.max(4, Math.round(r.bottom - tip.offsetHeight - 10))}px`;
};
placeTip();
addEventListener("resize", placeTip);
if (window.ResizeObserver) new ResizeObserver(placeTip).observe(stage);

.cr-table th{position:sticky;top:0;z-index:1}.cr-table.cr-squeeze th,.cr-table.cr-squeeze td{padding:3px 4px;hyphens:auto;-webkit-hyphens:auto;letter-spacing:-.01em}.cr-table.cr-turned th{position:static}

.cr-q+*{margin-top:calc(4px * var(--s))}

.ap-panel.cr-panel .ap-say{min-height:0;max-height:none;overflow:visible;font-size:max(14px,calc(var(--say) * var(--k)));line-height:1.38;max-width:36em;padding-top:12px;padding-bottom:12px}
