// ---------- Lesson 8 ----------
lesson({
  title: "Promises and trust", icon: "🌈",
  learn: [
    { say: "A <b>promise</b> is words that bind your future self: you give someone the right to expect that you will do something. <b>Trust</b> is what grows when promises are kept. Keeping your word is a form of honesty stretched across time.", show: big("A promise:\nwords that bind your future self") },
    { say: "Scripture's first explicit covenant (a solemn binding promise) is God's promise to Noah never again to destroy the earth by a flood, with the rainbow as its sign. God's faithfulness to his promises is the model for ours.", show: quote("Genesis 9:13") },
    { say: "A hard case: <b>Joshua 9</b>. The Gibeonites tricked Israel into a peace treaty by pretending they lived far away. When the truth came out, Israel's leaders still kept the oath. Psalm 15 praises the one who 'keeps an oath even when it hurts'.", show: quotes(["Joshua 9:19", "Psalm 15:4"]) },
    { say: "Jesus taught that our ordinary word should be as reliable as an oath, and Ecclesiastes warns against careless vows.", show: quotes(["Matthew 5:37", "Ecclesiastes 5:5"]) },
    { say: "A true example. In March 1621 the Plymouth colonists and <b>Massasoit</b> of the Wampanoag agreed a treaty of peace and mutual defence, and both sides kept it for over fifty years. Compare a <b>legend</b>: the Roman <b>Regulus</b> (about 255 BC), said to have returned to his captors to keep his oath.", show: tbl([["Story", "Date", "Evidence", "Verdict"], ["Plymouth–Wampanoag treaty", "1621", "written colonial records", "history"], ["Regulus returns to Carthage", "c. 250 BC", "told by much later writers", "legend or tradition"]]) },
    { say: "Philosophy: why do promises bind? A promise <b>creates</b> an obligation that did not exist before; the other person now relies on you. But a promise to do wrong does not bind you to do wrong. And trust, once broken, is rebuilt slowly, by many kept promises. Aesop's boy who cried 'Wolf!' is a fable about exactly this.", show: S(svg(T(300, 45, "Trust: built slowly, lost quickly", 24) + `<polyline points='40,270 100,250 160,230 220,205 280,185 340,160 400,140 430,128' fill='none' stroke='#0f766e' stroke-width='6'/><polyline points='430,128 440,265' fill='none' stroke='#b45309' stroke-width='6'/>` + T(230, 120, "kept promises", 22, "#0f4c45") + T(520, 210, "one broken", 22, "#7c2d12") + T(520, 238, "promise", 22, "#7c2d12") + `<line x1='30' y1='280' x2='570' y2='280' stroke='#555' stroke-width='3'/>`)) },
    { say: "Feelings. When someone breaks a promise to you, you may feel <b>let down</b>, <b>hurt</b> or <b>betrayed</b>. Name it honestly. Our family's four steps (name, understand, repair, forgive) still apply. Forgiving does not mean pretending it did not matter; it means releasing the wish to punish. Forgiveness is not withheld until an apology comes, but trust is rebuilt step by step.", show: list(["Name: 'I felt let down when you didn't come.'", "Understand: 'I had counted on you.'", "Repair: the promiser apologises and makes it right.", "Forgive: let go of revenge; trust grows again through kept promises."]) },
    explain("Should Israel have kept the oath to the Gibeonites, even though it was obtained by trickery? Give a reason that is true and relevant, and say what this teaches about promises."),
  ],
  practice: [
    ch("What is a promise?", ["words that bind you, giving others the right to rely on you", "a wish that something good will happen in the future", "a guess about what you will probably do later", "a secret that you share with one trusted friend"], "After a promise, the other person may rely on you.", "A promise creates an obligation and a right to rely on you."),
    ch("What is a covenant?", ["a solemn, binding agreement", "a kind of small sailing boat", "a song of praise and thanks", "a walled city with a gate"], "God made one with Noah.", "A covenant is a solemn, binding agreement, like God's covenant with Noah."),
    ch("What was the sign of God's covenant with Noah?", ["the rainbow", "a dove", "an olive branch", "the ark"], "Genesis 9:13.", "'I set my rainbow in the cloud, and it will be a sign of a covenant between me and the earth.' (WEB)"),
    ch("How did the Gibeonites trick Israel (Joshua 9)?", ["They pretended to come from far away, with worn clothes and dry bread.", "They hid soldiers in the camp disguised as Israelite shepherds.", "They sent a forged letter claiming to come from Pharaoh.", "They dressed as priests and claimed to bring a message from God."], "Their props were meant to show a long journey.", "They wore old sandals and clothes and carried dry bread to pretend they had travelled far."),
    ch("When Israel discovered the trick, what did the leaders do?", ["They kept the oath and did not attack the Gibeonites.", "They broke the treaty at once.", "They made the Gibeonites leave the land.", "They punished Joshua."], "Joshua 9:19.", "'We have sworn to them by Yahweh, the God of Israel. Now therefore we may not touch them.'"),
    ch("Psalm 15:4 praises the person who...", ["keeps an oath even when it hurts", "never makes any promises", "keeps promises only when convenient", "breaks promises to enemies"], "The psalm describes who may dwell with God.", "'He who keeps an oath even when it hurts, and doesn't change.' (WEB)"),
    ch("What did Jesus teach in Matthew 5:37?", ["Let your 'Yes' be 'Yes' and your 'No' be 'No.'", "Swear by heaven whenever you make a promise.", "Never say yes to anyone you do not know.", "Say whatever will please the person asking."], "Your plain word should be reliable.", "Our ordinary word should be trustworthy without needing extra oaths."),
    ch("Ecclesiastes 5:5 says it is better...", ["not to vow, than to vow and not pay", "to vow often, so that God hears you", "to vow only in the temple at feasts", "to vow, even if you may not pay"], "Is a careless promise wise?", "Better to make no promise than to break one."),
    ch("In what year did the Plymouth colonists and Massasoit agree their treaty?", ["1621", "1492", "1776", "1863"], "It was the colonists' first spring.", "March 1621."),
    num("The 1621 treaty held until the war of 1675. For how many years did it last?", 54, "Subtract.", "1675 − 1621 = 54 years."),
    ch("Why is the story of Regulus returning to Carthage labelled a legend or tradition?", ["It was told by much later writers, and historians doubt it.", "Carthage was a city invented by later Roman poets.", "Regulus was a character in a Greek play.", "Roman generals were never captured in war."], "When was it written down, and by whom?", "Regulus was real, but the heroic return comes from later writers without contemporary evidence."),
    ch("Does a promise to do something wrong bind you?", ["No: a promise cannot make a wrong act right.", "Yes, every promise must be kept no matter what.", "Only if you promised in writing.", "Only if the other person is older."], "Can a promise to steal oblige you to steal?", "A promise binds us only to what is lawful and good; a promise to do wrong should be broken and repented of."),
    ch("In Aesop's fable, why did no one come when the wolf really came?", ["He had lied so often that no one trusted him.", "The villagers were far away at the market.", "The wolf came silently and no one heard.", "The sheep had already run safely home."], "What happens to trust after repeated lies?", "Broken trust is lost quickly and rebuilt slowly."),
    ord("Put our family's four steps for a broken promise in order.", ["Name it", "Understand it", "Repair it", "Forgive"], "First say what happened; the family's pattern ends with forgiveness.", "Name, understand, repair, forgive. (Forgiveness is not held back as a bargaining chip; trust is what takes time to rebuild.)"),
    ch("Your friend promised to come to your recital but forgot. Which feeling word is most precise?", ["let down", "proud", "bored", "relieved"], "You had counted on her.", "Being 'let down' names the feeling of a broken expectation."),
    G.virtue(8), G.choose(8, ["honesty", "kindness"]), G.reason(), G.reason(), G.legend(), G.legend(), G.verse(["honesty"]), G.verse(null, ["Matthew 5:37", "Proverbs 12:22", "Luke 16:10"]), G.bible(["honesty", "justice"]), G.fop(), G.def(8),
  ],
  challenge: [
    ch("Israel kept its oath to the Gibeonites although it was obtained by deception. Which reason best supports keeping it?", ["The oath was sworn in God's name, and 2 Samuel 21 treats Saul's breaking of it as grave wrong.", "The Gibeonites were a powerful nation whom Israel could not have defeated anyway.", "Joshua had forgotten the deception by the time the truth came out.", "Promises obtained by deception are always more binding than ordinary ones."], "Which reason is both true and relevant? Look ahead to 2 Samuel 21.", "Generations later, Saul's violence against the Gibeonites was treated as bloodguilt, confirming that the oath bound Israel."),
    ch("Someone argues: 'The Gibeonites lied, so the promise was void; Israel had no duty to keep it.' What would be a thoughtful reply?", ["Deceit often voids promises, but Scripture shows this oath before God still bound Israel.", "The Gibeonites never lied; they really did live in a distant country.", "No promise is ever binding, so the question does not arise at all.", "Deception never makes any difference to whether a promise binds."], "Is the principle in the argument usually true? Is this case special?", "The general principle has merit; but the text gives evidence that this oath bound Israel. Good reasoning weighs both the general rule and the specific evidence."),
    ch("Why is trust described as 'built slowly, lost quickly'?", ["Each kept promise adds a little evidence; one broken promise is strong evidence.", "Because people are naturally suspicious of everyone they meet.", "Because trust is only a feeling, and feelings change quickly.", "Because promises are almost never kept by anyone."], "Think of trust as a conclusion based on evidence.", "Trust is a reasonable conclusion from a track record. A single serious failure changes the evidence sharply."),
    ch("You promised to help a friend paint on Saturday. On Friday your grandmother falls ill and needs you. What is the best reasoning?", ["Tell your friend at once, apologise, and offer another day: a weightier duty has arisen.", "Go painting as planned: a promise is a promise, whatever else happens.", "Say nothing and simply not arrive; she will understand later.", "Visit your grandmother, and tell your friend that you were ill."], "Which duties compete, and how can you honour both as far as possible?", "Promises can be outweighed by grave duties, but the promiser still owes honesty, apology and repair."),
    ch("Argument: 'Regulus kept his promise. The story of Regulus is legendary. So keeping promises is legendary.' What is wrong?", ["Whether a story happened says nothing about whether its lesson is true.", "Nothing is wrong; legendary stories teach legendary lessons.", "Regulus definitely existed, so the story must be true.", "Promises are not actually mentioned in the story."], "Does a doubtful story make the moral false?", "The historical question (did it happen?) and the ethical question (is promise-keeping good?) are separate. Mixing them is a reasoning error."),
    G.reason(),
  ],
  extend: "Read Joshua 9 and then 2 Samuel 21:1–14 with a parent. Discuss: what does the later chapter show about how seriously the oath to the Gibeonites was taken, generations later? Also read Aesop's 'The Shepherd Boy and the Wolf' (public domain).",
  offline: "Make one small, specific promise to a family member this week (for example, 'I will set the table every evening until Sunday') and keep it exactly. Mark each day on a chart. Explain it: in 2–4 sentences, explain why a promise binds you, and when a promise should not be kept.",
}),
// ---------- Lesson 9 ----------
lesson({
  title: "Self-control: the power to wait and to stop", icon: "🛑",
  learn: [
    { say: "<b>Self-control</b> is choosing to wait, to stop, to hold back, even when you want to go ahead. It is not the absence of wanting; it is a person ruling her wants instead of being ruled by them. Proverbs puts it in military terms.", show: quote("Proverbs 16:32") },
    { say: "The opposite is pictured as a ruined city. In the ancient world a city without walls could be entered by any raider. A person without self-control can be overrun by any passing impulse.", show: quote("Proverbs 25:28") },
    { say: "In 1 Samuel 24, King Saul was hunting David with three thousand chosen men. Saul entered a cave where David and his men were hiding. David's men whispered that God had delivered his enemy into his hand. David crept forward and cut off a corner of Saul's robe, and then even that troubled his conscience. He held back his men.", show: quote("1 Samuel 24:6") },
    { say: "Afterwards David called out to Saul and showed him the piece of robe as proof. Notice what self-control required: David had the opportunity, the power, and men urging him on. He stopped because the act was wrong, not because he was unable.", show: quote("1 Samuel 24:10") },
    { say: "Now a lesson in evidence. In the late 1960s and early 1970s, the psychologist Walter Mischel at Stanford offered nursery-school children one treat now, or two if they could wait alone for several minutes. Later follow-ups reported that children who waited longer did better, on average, years later. Many people concluded that one waiting test could predict a child's future.", show: tbl([["Study", "What it found"], ["Mischel, Stanford (from late 1960s)", "children who waited longer later did better on average; the samples were small and mostly from one university community"], ["Watts, Duncan & Quan (2018)", "a larger, more varied group of children: the link was much weaker, and most of it disappeared once family background and early abilities were taken into account"], ["Honest conclusion", "self-control matters, but a single test at age four does not decide anyone's future"]]) },
    { say: "Notice the TRUTH rule at work. The first conclusion sounded convincing and was widely repeated. Better evidence, from more children of more kinds, changed it. A wise thinker changes her mind because the evidence shows something different, not because a new claim is louder. Our reason for valuing self-control never rested on one experiment anyway: Scripture and long human experience both commend it.", show: big("better evidence → a changed conclusion\n(not a louder claim)") },
    { say: "Plato, in his dialogue <i>Phaedrus</i>, pictured the soul as a <b>charioteer</b> (reason) driving two horses: a noble one (the spirited love of honour) and an unruly one (raw appetite). Self-control is the charioteer keeping hold of the reins. Borrowing Aristotle's idea of the mean, we can add that the goal is not to act on every impulse, but not to be frozen and never act either.", show: S(meanSvg("acts on every impulse", "self-control", "never acts at all", "Waiting and stopping: finding the mean")) },
    { say: "A practical skill for strong feelings: <b>Stop</b> (freeze your hands and mouth), <b>Breathe</b> (slowly, three times), <b>Name</b> the feeling precisely, then <b>Choose</b> what to do. Naming puts a small space between the feeling and the action, and in that space you are free.", show: list(["STOP: hands still, mouth closed.", "BREATHE: three slow breaths, longer out than in.", "NAME: 'I feel furious, because my tower was knocked down.'", "CHOOSE: what would a self-controlled person do now?"]) },
  ],
  practice: [
    ch("Which is the family definition of self-control?", ["choosing to wait, to stop, to hold back, even when you want to go ahead", "never wanting anything, so that nothing can ever tempt you", "doing whatever you feel like, as long as nobody is harmed by it", "obeying the rules carefully whenever a grown-up is watching"], "Does a self-controlled person still feel wants?", "Self-control is choosing to wait, to stop, to hold back, even when you want to go ahead. The wanting is still there; the choosing rules it."),
    ch("According to Proverbs 16:32, who is better than 'he who takes a city'?", ["one who rules his spirit", "one who builds a city", "one who owns many horses", "one who never feels angry"], "The verse compares inner rule with outer conquest.", "Proverbs 16:32: one who rules his spirit is better than he who takes a city."),
    ch("Proverbs 25:28 compares a man without restraint to what?", ["a city that is broken down and without walls", "a strong tower standing on a high hill", "a river that has burst its banks in spring", "a lion pacing back and forth in its cage"], "What protected an ancient city?", "A city without walls has no defence; a person without restraint is overrun by every impulse."),
    ch("Why is a city without walls a fitting picture of a person without self-control?", ["Anything can get in: every passing impulse can take charge.", "Such a city is open and welcoming, as a generous person is.", "Walls take years to build, as good habits do in a child.", "A city without walls is poor, as foolish people often are."], "What do walls keep out?", "Walls let a city decide what enters. Self-control lets a person decide which wants to act on."),
    num("In 1 Samuel 24, how many chosen men did Saul take to hunt David?", 3000, "The number is in the second verse of the chapter: three thousand.", "1 Samuel 24:2 says Saul took three thousand chosen men out of all Israel."),
    ch("In the cave, what did David's men urge him to do?", ["kill Saul, saying God had delivered his enemy into his hand", "leave the cave quietly before Saul's soldiers found them", "go out and ask Saul to make peace and end the pursuit", "take Saul prisoner and bring him back to Jerusalem"], "Read 1 Samuel 24:4.", "His men said this was the day God had promised to deliver his enemy into his hand."),
    ch("What did David actually do?", ["He secretly cut off a corner of Saul's robe and spared his life.", "He attacked Saul.", "He fled before Saul arrived.", "He hid until Saul fell asleep and stole his spear."], "What did he later hold up as proof?", "He cut off the skirt of Saul's robe and spared him (1 Samuel 24:4, 24:10). The spear is a different occasion, in chapter 26."),
    ch("What reason did David give for not harming Saul?", ["Saul was Yahweh's anointed, so David would not stretch out his hand against him.", "Saul's army outnumbered his own, so killing Saul would bring certain defeat.", "David hoped that Saul would reward his mercy by giving him the throne at once.", "David's men were too tired after the long march to fight Saul's guards."], "1 Samuel 24:6.", "David refused because Saul was the anointed king; harming him would be wrong, whatever the opportunity."),
    ch("David's men told him this was the day of which Yahweh had said, 'Behold, I will deliver your enemy into your hand' (1 Samuel 24:4). Why was this not a good reason to kill Saul?", ["Having the opportunity to do something does not make it right.", "Their statement was completely untrue; Saul was not in the cave.", "David had no sword.", "Saul was not David's enemy."], "Is 'I can' the same as 'I may'?", "Saul really was in David's power, but opportunity is not permission. The reason was true about the situation yet did not support the conclusion that killing was right."),
    ch("In Mischel's studies, what choice were the children given?", ["one treat now, or two if they waited", "a treat or a toy", "a treat or a book", "one treat for each correct answer"], "The test measured waiting.", "Children could eat one treat at once or wait alone and receive two."),
    ch("What did the larger 2018 study by Watts, Duncan and Quan find?", ["The link between waiting and later success was much weaker, and mostly vanished once family background was considered.", "Children who waited for the second treat almost always became wealthy and successful adults, exactly as first reported.", "Waiting for a treat made children unhappy and anxious, so the test itself harmed the children who took part in it.", "Children from every kind of family waited equally long, so family background had no connection with waiting at all."], "Did the bigger, more varied sample confirm or weaken the original claim?", "With more children from more backgrounds, the association shrank sharply, which changes what we may honestly conclude."),
    ch("Why does a larger and more varied sample give better evidence?", ["It is less likely that the result comes from chance or from something special about one small group.", "Larger studies take longer to complete, and slower research is always more careful than quick research.", "Scientists respect large numbers, so a big study is more likely to be published and widely believed.", "A larger sample guarantees that the result is true, since errors cancel out once enough people are tested."], "If you tested only the children at one school, could something about that school explain the result?", "A small, similar group can mislead. More people from more backgrounds make it more likely that a pattern is real and general."),
    ch("In Plato's picture of the soul, what does the charioteer stand for?", ["reason", "anger", "hunger", "the body"], "Who holds the reins?", "The charioteer is reason, guiding the noble horse (spirit) and the unruly one (appetite)."),
    ord("Put the steps for handling a strong feeling in order.", ["Stop", "Breathe", "Name", "Choose"], "What must happen before you can think clearly?", "Stop the action, breathe to calm the body, name the feeling precisely, and then choose a response."),
    ch("Which of these is NOT listed as fruit of the Spirit in Galatians 5:22-23?", ["cleverness", "patience", "kindness", "self-control"], "The list ends with self-control.", "Galatians 5:22-23 lists love, joy, peace, patience, kindness, goodness, faith, gentleness and self-control. Cleverness is not in the list."),
    ch("Your sister has knocked over the block city you spent an hour building. Using Aristotle's mean, which response is the virtue?", ["Breathe, tell her calmly that you are upset, and ask her to help rebuild.", "Knock over something of hers, so that she understands how it feels.", "Say nothing at all, and pretend to her that you do not mind in the least.", "Shout at her loudly, since your anger is real and ought to be expressed."], "Avoid both extremes: acting on the impulse, and hiding the feeling entirely.", "Self-control holds back the impulse to retaliate, but it does not mean pretending. Speaking calmly and honestly is the mean."),
    G.virtue(9), G.virtue(9, ["self-control"]), G.choose(9, ["self-control"]), G.choose(9), G.reason(), G.verse(["self-control"]), G.verse(["self-control"]), G.bible(["self-control"]), G.think(["Plato", "Aristotle"]), G.feel(), G.def(9),
  ],
  challenge: [
    ch("Someone argues: 'Children who waited longer later did better. So the waiting itself caused their later success.' What is the strongest objection?", ["Something else, such as family background, could cause both the waiting and the later success.", "The premise is false, because no child in the studies managed to wait for the second treat.", "Later success cannot be measured in any way, so the conclusion could never be tested.", "The argument is right, since whatever happens first must always be the cause of what follows."], "When two things go together, must one cause the other?", "A correlation (two things going together) does not prove causation. The 2018 study found that background factors explained much of the link."),
    ch("In 1 Samuel 24:5, David's heart troubled him even for cutting Saul's robe. What does this show about self-control?", ["It includes stopping even small wrong acts, and listening to a conscience that says 'too far'.", "It shows that David regretted sparing Saul and wished he had followed his men's advice.", "It shows that self-control matters only in large decisions, not in small acts like this.", "It shows that David was ashamed of being seen by his men hiding in the dark cave."], "Was cutting the robe as serious as killing? Why might it still trouble him?", "David's conscience treated even a lesser act of disrespect toward the anointed king as wrong. Self-control works in small things as well as large."),
    ch("In Plato's image, which situation shows the unruly horse pulling the chariot off the road?", ["You eat the whole box of chocolates meant for the family, though you knew you should stop after one.", "You feel hungry before dinner, notice the feeling, and decide to wait until everyone sits down.", "You choose to finish your reading before playing, though the game outside looks exciting.", "You are angry at someone who mocks a friend, and you defend her firmly but calmly."], "The unruly horse is appetite.", "Eating the whole box is appetite overpowering reason, the charioteer losing the reins."),
    ch("Is 'never doing anything you want' the virtue of self-control?", ["No. It is the opposite extreme; the virtue acts on good wants at the right time and holds back wrong ones.", "Yes. The more a person denies himself, the more virtuous he becomes, so total denial is perfect virtue.", "Yes. Wanting things is always a sign of weakness, so the strongest person wants nothing at all.", "No. Self-control is not really a virtue, only a habit that some people happen to find easy."], "Recall Aristotle's mean: what are the two extremes?", "Aristotle's virtues lie between two vices. Refusing every good desire is a defect, just as yielding to every desire is an excess."),
    ch("A researcher says: 'My study proves self-control decides a child's whole future.' Which TRUTH-rule question should you ask first?", ["What is the evidence, and has it been confirmed by other, larger studies?", "Is the researcher famous and respected at a well-known university?", "Does the claim sound important enough to be reported in newspapers?", "How many people already believe this claim about self-control?"], "Fame and popularity are not evidence.", "Ask for the evidence and whether independent studies confirm it. In this case, the larger 2018 study weakened the claim considerably."),
    G.reason(),
  ],
  extend: "Read 1 Samuel 24 and 1 Samuel 26 with a parent. David spares Saul twice. Make a two-column table comparing the two accounts (where, what David took as proof, what he said, how Saul replied). Then discuss: why might Scripture tell the story twice?",
  offline: "Practise the waiting muscle: choose one thing this week you will deliberately wait for (a treat until after dinner, a book chapter until chores are done). Each time, use Stop, Breathe, Name, Choose, and record it in your Virtue Notebook. Explain it: in 2–4 sentences, explain why the 2018 study changed what we can honestly conclude from the marshmallow experiments.",
}),
// ---------- Lesson 10 ----------
lesson({
  title: "Appetite and resolve: Esau, Daniel and Franklin", icon: "🍲",
  learn: [
    { say: "Excitement and appetite are good gifts, but they are strong. The Bible lists self-control among the fruit of the Spirit, the qualities God grows in his people.", show: quote("Galatians 5:22-23") },
    { say: "In Genesis 25, Esau came in from the field famished. His brother Jacob was cooking lentil stew. Esau asked for some; Jacob demanded Esau's <b>birthright</b> (the eldest son's right to lead the family and receive a double share). Listen to Esau's reasoning.", show: quotes(["Genesis 25:32", "Genesis 25:34"]) },
    { say: "Esau exaggerated ('I am about to die'), traded something lasting for something momentary, and then walked away as if nothing had happened. Scripture's verdict is that he <b>despised</b> his birthright: he valued it too little. Appetite had made a small thing look enormous and a great thing look small.", show: tbl([["", "The stew", "The birthright"], ["How long it lasts", "one meal", "a lifetime and beyond"], ["How it looked to hungry Esau", "huge", "worthless"], ["Its true value", "small", "great"]]) },
    { say: "Contrast Daniel. Taken to Babylon as a young man, he was offered the king's rich food and wine. He resolved beforehand, and then asked respectfully for a ten-day test of vegetables and water. Note his method: a firm decision, a polite request, and a test with evidence.", show: quotes(["Daniel 1:8", "Daniel 1:12"]) },
    { say: "History. Around 1730, in his mid-twenties, Benjamin Franklin planned to build thirteen virtues, one a week, marking a black spot in a chart for each fault. Temperance came first; humility was added last, after a Quaker friend told him he was proud. He never reached perfection, but judged himself better for trying. (His Autobiography places the plan 'about this time', soon after his marriage in 1730; some books give 1726, the year of a shorter plan he wrote at sea.)", show: tbl([["Week", "Virtue", "Franklin's aim (paraphrased)"], ["1", "Temperance", "eat not to dullness; drink not to excess"], ["2", "Silence", "speak only what helps others or yourself"], ["3", "Order", "a place for everything; a time for each task"], ["4", "Resolution", "resolve to do what you ought; do what you resolve"], ["…", "…", "…"], ["13", "Humility", "imitate Jesus and Socrates"]], "From Franklin's Autobiography (public domain)") },
    { say: "As a teenager, around 1747, George Washington copied by hand 110 'Rules of Civility and Decent Behaviour', adapted from a French collection made in 1595. Rules such as one telling him, in every cause of passion, to let reason govern (paraphrased) trained self-control in small, daily things.", show: big("110 rules, copied by hand,\nabout 1747") },
    { say: "Philosophers argued about <b>akrasia</b> (Greek: 'lack of command'), or weakness of will. Socrates held that no one knowingly does wrong: wrongdoing is ignorance. Aristotle disagreed: a person can know what is best and still be overpowered by desire. Esau seems to prove Aristotle's point. The cure includes knowledge, but also trained habits and plans made in advance.", show: tbl([["Thinker", "Can you know the good and still not do it?"], ["Socrates", "No: if you really knew, you would do it."], ["Aristotle", "Yes: desire can overpower knowledge. That is akrasia."]]) },
    { say: "Excitement makes the gap between impulse and action very small. Three strategies widen it: <b>decide beforehand</b> (like Daniel), <b>put distance</b> between you and the temptation (out of sight), and <b>make an if-then plan</b>: 'If my friend calls during practice, then I will say I will come in ten minutes.'", show: list(["Decide beforehand, when you are calm.", "Put distance between you and the temptation.", "Make an if-then plan: 'If ___ happens, then I will ___.'"]) },
  ],
  practice: [
    ch("What did Esau trade his birthright for?", ["bread and a stew of lentils", "a flock of sheep", "a sword", "his father's blessing"], "Genesis 25:34.", "Jacob gave Esau bread and stew of lentils, and Esau gave up his birthright."),
    ch("What was a birthright?", ["the eldest son's right to lead the family and receive a double share of the inheritance", "the right of every child in Israel to a portion of land when they reached adulthood", "a written record of a child's birth, kept by the priests in the tabernacle", "the youngest son's right to stay at home and care for his parents in old age"], "Why would Jacob want it so much?", "The birthright carried leadership of the family and a double share; it was very valuable."),
    ch("Esau said, 'I am about to die. What good is the birthright to me?' What was wrong with this reasoning?", ["Most likely an exaggeration: he was famished, not dying, so the reason was untrue.", "It was true that he was dying, so selling the birthright was a sensible decision.", "The reason was true, but a birthright cannot legally be sold, so the sale was void.", "Lentils were known to be dangerous, so Esau was right to fear for his life."], "Was Esau truly at death's door, or very hungry?", "Genesis 25:29 says he was famished, and food was at hand. Most readers take his words as hunger speaking as if death were near: an untrue reason, which could not support the trade. (Some read him as meaning 'I will die someday anyway'; even then, the reason does not justify despising the birthright.)"),
    ch("What is Scripture's verdict on Esau in Genesis 25:34?", ["He despised his birthright.", "He was wise to eat.", "He was cheated and blameless.", "He became king."], "The chapter ends with a judgment.", "Genesis 25:34: 'So Esau despised his birthright.' He treated something great as worth less than a meal."),
    ch("How does appetite distort judgment, according to the Esau story?", ["It makes a small, immediate thing look huge and a great, lasting thing look small.", "It makes every choice look equally important, so no decision seems to matter.", "It makes distant rewards look larger than they are, so we wait too long.", "It has no real effect; Esau simply did not know what a birthright was."], "Compare how the stew and the birthright looked to hungry Esau.", "Strong desire magnifies the present and shrinks the future. Self-control sees things at their true size."),
    ch("What did Daniel do about the king's food?", ["He purposed not to defile himself, and asked for a ten-day test of vegetables and water.", "He ate the food to avoid trouble, but prayed afterwards for forgiveness in private.", "He secretly threw the food away each day so that the officials would not notice.", "He demanded that the king's cooks prepare food according to the law of Moses."], "Daniel 1:8 and 1:12.", "Daniel decided beforehand and then made a respectful request with a test."),
    num("For how many days did Daniel ask for the test of vegetables and water?", 10, "Daniel 1:12.", "He asked, 'Test your servants, I beg you, ten days.'"),
    ch("What made Daniel's approach wise as well as self-controlled?", ["He decided in advance, asked respectfully, and proposed a test anyone could see.", "He refused loudly in front of the court, so that everyone would know his faith.", "He waited until the officials had left and then quietly ate whatever he wished.", "He asked the king's permission in writing and waited months for a reply."], "Think of the TRUTH rule: what does a test provide?", "Daniel combined firmness with courtesy, and offered evidence rather than demands."),
    num("Franklin worked on one virtue each week and had 13 virtues. How many weeks did one full cycle take?", 13, "One virtue a week, thirteen virtues.", "13 virtues × 1 week each = 13 weeks."),
    num("If Franklin completed a 13-week cycle four times, how many weeks would that be?", 52, "Multiply the cycle length by the number of cycles.", "13 × 4 = 52 weeks: a whole year."),
    ch("Which virtue did Franklin put first in his list, and why?", ["Temperance, because he thought it made the others easier", "Humility, because a friend told him he was proud", "Order, because his printing shop was very untidy", "Silence, because he thought he talked too much"], "He placed it first deliberately.", "Franklin placed temperance first, reasoning that a clear head helps every other virtue."),
    ch("Why was humility added last to Franklin's list?", ["A Quaker friend told him that he was generally thought proud.", "He forgot it at first and found it in a dictionary.", "His father ordered him to add it.", "Humility was the easiest virtue."], "Someone gave him honest feedback.", "Franklin records that a Quaker friend kindly told him he was often proud, so he added humility."),
    num("Washington was born in 1732 and copied the Rules of Civility around 1747. About how old was he?", 15, "Subtract the birth year from the year of copying.", "1747 − 1732 = 15, so he was about fifteen."),
    ch("What is akrasia?", ["weakness of will: knowing what is best and failing to do it", "ignorance: doing wrong because you do not know what is best", "courage: doing what is best even when you are afraid", "temperance: enjoying good things in the right amount"], "The Greek word means 'lack of command'.", "Akrasia is weakness of will: the will is not in command of desire."),
    ch("Which thinker held that no one knowingly does wrong?", ["Socrates", "Aristotle", "Franklin", "Washington"], "He believed wrongdoing comes from ignorance.", "Socrates held that if you truly knew the good, you would do it. Aristotle disagreed."),
    ch("You know you should stop playing when the timer rings, but you keep going. Whose view does this support?", ["Aristotle's: you can know the good and still not do it", "Socrates': you must not really have known", "Neither: this never happens", "Franklin's: you should work on silence"], "Did you know what you should do?", "Knowing and still failing is akrasia, which Aristotle said is real."),
    ch("Which is an if-then plan?", ["'If my friend calls during practice, then I will say I will come in ten minutes.'", "'I am going to try very hard to be good and focused tomorrow morning.'", "'I really hope that nothing distracts me while I am practising today.'", "'Practice is important, so I always finish it, whatever happens.'"], "A plan names a situation and a response.", "An if-then plan links a specific trigger to a specific action, made while you are calm."),
    G.virtue(10), G.choose(10, ["self-control"]), G.choose(10), G.reason(), G.verse(["self-control"]), G.verse(null, ["Daniel 1:8", "Proverbs 16:32", "Galatians 6:9"]), G.bible(["self-control", "temperance"]), G.hero(["Benjamin Franklin", "George Washington", "Abraham Lincoln", "Eric Liddell"]), G.think(["Socrates", "Aristotle", "Benjamin Franklin"]), G.feel(),
  ],
  challenge: [
    ch("Socrates says: 'If Esau truly knew the birthright was worth more, he would not have sold it.' What could Aristotle reply?", ["Esau may have known, but hunger overpowered his knowledge in the moment; that is akrasia.", "Socrates is right: Esau must have been ignorant, since no one ever knowingly chooses worse.", "Esau was right to sell it, because a birthright was worth less than a meal to a hungry man.", "Aristotle would agree with Socrates, since he too held that knowledge always rules desire."], "Can strong desire cloud what you know?", "Aristotle held that desire can overwhelm knowledge temporarily. Esau's case suggests that knowing is necessary but not sufficient; habits and advance decisions matter too."),
    ch("Why did Daniel decide 'in his heart' before the food arrived, rather than at the table?", ["Decisions made in advance, while calm, are far easier to keep than decisions made facing temptation.", "He was not hungry at the time, so the decision cost him nothing and was not really self-control.", "The officials had told him to decide early so that the kitchen could prepare his meals.", "He did not yet know that food would be offered, so he was deciding about something else."], "When is it easier to say no: before the plate arrives, or with the smell in front of you?", "An advance decision removes the need to win the argument with appetite in the moment."),
    ch("Franklin wrote that he never achieved moral perfection. Does this mean his plan failed?", ["No. By his own account he became a better and happier man; the aim was growth, not perfection.", "Yes. Any plan for character that does not produce complete perfection has simply failed.", "Yes. He abandoned the chart after the first week, so it never had a chance to work.", "No. He did achieve perfection, but was too humble to admit it in his autobiography."], "Compare piano practice: is a plan useless if you never play perfectly?", "A plan can succeed by producing real progress. Aristotle would agree: virtue grows gradually through practice."),
    ch("Which reason for refusing a second helping of pudding passes both gates of the TRUTH rule?", ["'I have already eaten enough, and dinner is in an hour.'", "'Pudding turns into stone in the stomach.'", "'Pudding is yellow.'", "'Everyone else has refused, so I must.'"], "Gate 1: is it true? Gate 2: does it actually support refusing?", "The first is true and relevant. The second is false; the third is true but irrelevant; the fourth is about what others do, not about what is good."),
    ch("Esau 'ate and drank, rose up, and went his way.' Why might the writer include such a quick, flat list of actions?", ["To show how casually Esau treated a great loss, as if it meant nothing", "To show that the writer was hurrying on to the more important story", "To show that Esau was polite and thanked his brother for the meal", "To show that the lentil stew was a healthy and satisfying meal"], "Read it aloud. How does it sound?", "The quick list mirrors Esau's carelessness, which the writer then names: he despised his birthright."),
    G.reason(),
  ],
  extend: "Read the passage about the 'bold and arduous project of arriving at moral perfection' in Benjamin Franklin's Autobiography (Part Two; public domain). Copy his list of thirteen virtues with his short description of each. Which would you add or remove for your own list, and why?",
  offline: "Make your own chart in Franklin's style: choose three virtues, one per week, and mark a small dot each day you slip, and a tick each day you succeed. Write one if-then plan for each virtue. Explain it: in 2–4 sentences, explain the difference between Socrates and Aristotle on akrasia, using Esau as your example.",
}),
// ---------- Lesson 11 ----------
lesson({
  title: "Courage: doing right when it is frightening", icon: "🛡️",
  learn: [
    { say: "<b>Courage</b> is doing the right thing even when it is scary or hard. Notice what the definition does not say: it does not say 'feeling no fear'. A person who feels no fear has nothing to overcome. Courage is fear mastered for the sake of what is right.", show: big("Courage:\ndoing the right thing\neven when it is scary or hard") },
    { say: "In the book of Esther, a Persian official named Haman obtained a decree to destroy all the Jews of the empire. Queen Esther, herself secretly Jewish, could plead with King Ahasuerus, but anyone who approached the king uninvited could be put to death unless he held out his golden sceptre (Esther 4:11). Her cousin Mordecai sent her this message.", show: quote("Esther 4:14") },
    { say: "Esther's answer is one of the great sentences of courage in Scripture. She did not pretend the danger was small. She asked her people to fast with her for three days, and then she acted.", show: quote("Esther 4:16") },
    { say: "History. In December 1938, Nicholas Winton, a 29-year-old London stockbroker, visited Prague and saw refugee families in danger from the Nazis. Back in Britain he found foster families, raised money and filled in endless forms. Between March and August 1939, trains carried 669 mostly Jewish children to safety in Britain. A ninth train, due to leave on 1 September 1939, never departed: war had begun.", show: tbl([["Date", "Event"], ["Dec 1938", "Winton visits Prague and sees the refugee camps"], ["Mar–Aug 1939", "trains carry 669 children to Britain"], ["1 Sep 1939", "war begins; the last train cannot leave"], ["1988", "his wife finds his scrapbook; the story becomes public"], ["2015", "Winton dies, aged 106"]]) },
    { say: "Winton told almost no one for fifty years. In 1988 his wife found a scrapbook in their attic with the children's names, and a television programme reunited him with many of them. Winton himself always insisted that others, especially those who worked in Prague under the Nazis, took greater risks. Courage and humility often travel together.", show: pas("How do we know?", "The scrapbook survives, with lists and photographs of the children.\n\nHundreds of the rescued children, later adults, told their own stories.\n\nHistorians also emphasise the work of Winton's colleagues in Prague, such as Doreen Warriner and Trevor Chadwick. Honest history gives credit to all.") },
    { say: "Aristotle defined courage as the <b>mean</b> between two vices. Too little is <b>cowardice</b>: fear prevents you from doing what is right. Too much is <b>rashness</b>: you rush into danger for no good reason. The courageous person fears the right things, for the right reasons, and acts rightly anyway.", show: S(meanSvg("cowardice", "courage", "rashness", "Aristotle: courage is a mean")) },
    { say: "Fear comes in degrees, and precise words help. <b>Uneasy</b> is faint; <b>afraid</b> is clear fear; <b>terrified</b> is overwhelming. <b>Nervous</b> and <b>anxious</b> name fear about something still to come. Naming the level helps you choose: uneasiness may only need a breath; terror may need help from a grown-up. God's command to Joshua did not deny the fear; it gave a reason to act through it.", show: quote("Joshua 1:9") },
    explain("Explain why courage is not the same as feeling no fear, using Esther and Aristotle's mean."),
  ],
  practice: [
    ch("Which is the family definition of courage?", ["doing the right thing even when it is scary or hard", "never feeling afraid", "doing dangerous things to impress people", "winning every fight"], "Does the definition mention fear at all?", "Courage is doing the right thing even when it is scary or hard. Fear may be present; courage acts rightly anyway."),
    ch("Why was it dangerous for Esther to go to the king?", ["Anyone who approached the king uninvited could be put to death unless he held out his golden sceptre.", "The king had already ordered Esther to leave the palace, so returning would be seen as disobedience.", "Haman's guards stood at the door and had orders to stop any Jew from speaking to the king.", "The king was away at war, and the road to his camp was full of enemy soldiers and bandits."], "Esther 4:11.", "The law of the Persian court made an uninvited approach punishable by death unless the king extended his sceptre."),
    ch("Who sent Esther the message 'Who knows if you haven't come to the kingdom for such a time as this?'", ["Mordecai, her cousin", "Haman", "King Ahasuerus", "Nathan the prophet"], "He had raised her.", "Mordecai, her cousin and guardian, sent the message in Esther 4:14."),
    ch("What did Esther ask the Jews in Shushan to do before she went to the king?", ["fast for her for three days", "attack the palace", "leave the city", "write a letter to Haman"], "Esther 4:16.", "She asked them to fast for three days, night and day, and said she and her maidens would fast too."),
    ch("What did Esther say she would do, even though it was against the law?", ["go in to the king: 'if I perish, I perish'", "hide until the danger passed", "escape to another country", "ask Haman for mercy"], "Read the end of Esther 4:16.", "'Then I will go in to the king, which is against the law; and if I perish, I perish.'"),
    ch("Which part of Esther 4:16 shows that she understood the danger clearly?", ["'if I perish, I perish'", "'gather together all the Jews'", "'I and my maidens will also fast'", "'night or day'"], "Which words admit that death is possible?", "She names the possibility of death plainly. Courage does not pretend the danger is small."),
    num("How many children did Nicholas Winton's trains carry to safety in 1939?", 669, "The number appears in the history slide.", "669 children were brought from Czechoslovakia to Britain."),
    num("Winton was rescuing children in 1939; the story became public in 1988. How many years later was that?", 49, "Subtract 1939 from 1988.", "1988 − 1939 = 49 years."),
    ch("Why did the ninth train never leave Prague?", ["War began on 1 September 1939 and the borders closed.", "Not enough British families offered to foster the children.", "The Czech government refused to let the children leave.", "Winton ran out of money to pay for the tickets."], "What happened on 1 September 1939?", "Germany invaded Poland on 1 September 1939; the war began and the last train could not leave."),
    ch("How did the world learn of Winton's work?", ["In 1988 his wife found his scrapbook of the children's names, and a television programme reunited him with many of them.", "He wrote a best-selling book about the rescue in 1945, and it was read in schools across Britain and Europe.", "The children's parents wrote to newspapers after the war, and Winton was knighted the following year.", "It was announced on the radio in 1939, as each train arrived safely at Liverpool Street Station."], "He kept it quiet for decades.", "The scrapbook found in 1988 brought the story to light."),
    ch("Winton insisted that colleagues in Prague took greater risks than he did. Which virtue does this show alongside courage?", ["humility", "rashness", "temperance", "jealousy"], "He refused to take all the credit.", "Giving credit to others and not inflating your own part shows humility, and also honesty."),
    ch("According to Aristotle, what is the vice of too much 'confidence' in the face of danger?", ["rashness", "cowardice", "courage", "prudence"], "It is on the opposite side from cowardice.", "Rashness rushes into danger without good reason; it is the excess opposite cowardice."),
    ch("Which is an example of rashness rather than courage?", ["Jumping off a high wall to impress friends", "Telling the truth to a teacher when you are nervous", "Standing up for a boy being teased", "Going to the dentist though you are scared"], "Is the act right and needed, or merely dangerous?", "Risking injury to impress people serves no good end; that is rashness."),
    ord("Put these fear words in order from weakest to strongest.", ["uneasy", "afraid", "terrified"], "Which is the faintest feeling that something is wrong? Which is overwhelming?", "Uneasy is faint; afraid is clear fear; terrified is overwhelming. (Nervous and anxious are left out because they describe fear of something still to come, and people rank them differently.)"),
    ch("According to Joshua 1:9, why should Joshua not be afraid?", ["because Yahweh his God is with him wherever he goes", "because he was the strongest soldier", "because there was no danger", "because fear is a sin"], "Read the end of the verse.", "The reason given is God's presence: 'Yahweh your God is with you wherever you go.'"),
    ch("A classmate says, 'Brave people never feel scared.' Which is the best reply?", ["Esther was afraid and still went to the king; courage acts rightly while afraid.", "That is true: someone who feels fear has not yet become truly brave.", "Esther felt no fear at all, which is why her story is told as an example.", "Courage means hiding fear so well that nobody else can ever notice it."], "Did Esther feel fear?", "The claim is untrue. Esther clearly felt danger ('if I perish') and acted anyway, which is exactly what courage is."),
    G.virtue(11), G.virtue(11, ["courage"]), G.choose(11, ["courage"]), G.choose(11), G.reason(), G.verse(["courage"]), G.verse(["courage"]), G.bible(["courage"]), G.hero(["Nicholas Winton", "Harriet Tubman", "Socrates", "Rosa Parks", "Corrie ten Boom"]), G.feel(), G.def(11),
  ],
  challenge: [
    ch("Mordecai warned Esther: if she stayed silent, deliverance would come 'from another place', but she and her father's house would perish. What does this reasoning imply?", ["God's purposes will not fail, but Esther would lose her part in them by staying silent.", "Esther's choice did not matter at all, since deliverance would come whatever she did.", "Mordecai planned to raise an army himself and rescue the Jews by force of arms.", "Silence would keep Esther and her family safe, since she was the queen."], "Does Mordecai say the Jews depend on Esther alone?", "Mordecai trusts that deliverance will come, yet he insists Esther's choice matters. Silence would not even keep her safe."),
    ch("A boy climbs onto the roof to fetch a ball while his parents are out. 'That was brave,' says his friend. Using Aristotle, judge the claim.", ["It was rash, not brave: the danger was real and the goal did not justify it.", "It was brave, because anything that involves real danger shows courage.", "It was cowardly, because he waited until his parents had gone out.", "It was temperate, because he only wanted the ball, nothing more."], "Is every frightening act a courageous one? What was the good at stake?", "Courage faces danger for a worthy end, wisely. Risking a fall for a ball, without permission, is rashness."),
    ch("Which reason best explains why Esther fasted before acting, instead of rushing in at once?", ["Courage can be wise: she prepared, sought God and gathered her people's support before facing the danger.", "She was afraid and hoped that if she delayed long enough, someone else would go to the king instead.", "The law required three days of fasting before anyone could ask the king for a favour.", "She hoped the king would notice that she looked weak and would pity her when she arrived."], "Is preparation the opposite of courage?", "Courage joined with prudence prepares well; it is not hasty. She acted on the third day (Esther 5:1)."),
    ch("Winton said others took greater risks than he did. A historian finds this is true. Should we then say he was not courageous?", ["No: he still did right at great cost and against huge obstacles; another's greater courage does not cancel his.", "Yes: in any story only the person who faced the greatest danger can rightly be called courageous.", "Yes: working from an office in London involved no danger at all, so it required no courage.", "No: he must have been courageous because he became famous and was knighted for his work."], "Is courage a competition with one winner?", "Many people can show courage in the same rescue in different ways. Honest history credits all of them."),
    ch("Which of these is a TRUE reason that supports the conclusion 'Esther acted with courage'?", ["She went to the king uninvited, knowing the law could mean her death.", "She was the queen of Persia and lived in the royal palace at Shushan.", "Courage is always rewarded, and Esther was later greatly honoured.", "Shushan was a large city with many brave people living in it."], "Gate 1: true? Gate 2: does it support courage specifically?", "The first is true and directly shows acting rightly despite danger. Being queen and the size of Shushan are true but irrelevant; the last is false."),
    G.reason(),
  ],
  extend: "Read the whole book of Esther with a parent (it is ten short chapters). Notice that God's name is never mentioned in the book. Discuss: where do you nevertheless see God's providence (his care and guidance) in the story?",
  offline: "Make a 'courage ladder': write five things that feel scary to you, from slightly uneasy to very frightening, and next to each write the right thing that courage would do. Choose the lowest one and do it this week. Explain it: in 2–4 sentences, explain the difference between courage and rashness, with an example of each.",
}),
// ---------- Lesson 12 ----------
lesson({
  title: "A life of courage: Daniel and Harriet Tubman", icon: "🦁",
  learn: [
    { say: "Courage is easiest to understand in a whole life, not just a single moment. Today two lives: a statesman in ancient Babylon and a woman who escaped slavery in Maryland. Both said their courage came from trusting God.", show: big("courage in a whole life") },
    { say: "In Daniel 6, officials jealous of Daniel persuaded King Darius to sign a decree: for thirty days, anyone who prayed to any god or man except the king would be thrown into the lions' den. Read what Daniel did.", show: quote("Daniel 6:10") },
    { say: "Notice the last words: 'as he did before'. Daniel did not hide, and he did not make a show of defiance. He simply refused to change his faithful habit. He was thrown to the lions, and in the morning he told the anxious king what had happened.", show: quote("Daniel 6:22") },
    { say: "History. Araminta Ross was born into slavery in Dorchester County, Maryland, around 1822. As a girl she was struck on the head by a heavy weight thrown by an overseer, and suffered from the injury all her life. In 1849 she escaped to Philadelphia and took the name <b>Harriet Tubman</b>.", show: tbl([["Date", "Event"], ["about 1822", "born into slavery in Maryland"], ["1849", "escapes north to Philadelphia"], ["1850s", "about 13 trips back; guides about 70 people to freedom"], ["June 1863", "helps lead the Combahee River Raid; over 700 people freed"], ["1913", "dies in Auburn, New York"]]) },
    { say: "Instead of staying safe, Tubman returned again and again to guide family members and others north, at the risk of capture and re-enslavement. Historians estimate about 13 trips and about 70 people led to freedom. Late in life she said that she never lost a passenger. In the Civil War she served the Union army as a scout and spy, and helped lead the Combahee River Raid of 1863, which freed more than 700 people.", show: pas("How do we know?", "Letters from abolitionists who worked with her, army records from the Civil War, and her own interviews survive.\n\nSome early books exaggerated the numbers (claiming hundreds rescued on her trips). Careful historians, checking the records, give smaller, more reliable figures. The true story needs no exaggeration.") },
    { say: "Philosophers distinguish <b>physical courage</b> (facing bodily danger, like the lions' den or a night journey through swamps) from <b>moral courage</b> (facing disapproval, loss or ridicule to do what is right, like telling the truth when others will mock you). Daniel and Tubman showed both. Most of your courage, day to day, will be moral courage.", show: tbl([["Physical courage", "Moral courage"], ["facing danger to the body", "facing disapproval, ridicule or loss"], ["a firefighter entering a building", "admitting a mistake in front of the class"], ["Tubman crossing swamps at night", "Daniel praying with open windows"]]) },
    { say: "Two feelings are often confused. <b>Fear</b> responds to a danger that is present now. <b>Worry</b> runs over dangers that might happen later, often again and again. Three questions shrink worry: Is it true, or likely? What, if anything, can I do now? And what can I hand over to God in prayer, because it is not in my power?", show: list(["Is the thing I fear true, or likely?", "What can I do about it now?", "What is not in my power, to entrust to God?"]) },
    explain("Explain the difference between physical and moral courage, with one example from Daniel or Harriet Tubman and one from your own life."),
  ],
  practice: [
    ch("What did King Darius's decree forbid for thirty days?", ["praying to any god or man except the king", "worshipping in the temple at Jerusalem", "reading the law of Moses in public", "leaving the city of Babylon"], "Daniel 6:7 describes the decree; Daniel's response is in 6:10.", "No one could petition any god or man except the king for thirty days, on pain of the lions' den."),
    ch("When Daniel knew the decree was signed, what did he do?", ["went home and prayed three times a day with his windows open toward Jerusalem, as before", "closed his windows and prayed silently in an inner room so that no one would see him", "went to the king and asked him to cancel the decree before the thirty days began", "stopped praying for thirty days, trusting that God would understand his situation"], "Daniel 6:10.", "He kept his usual practice: kneeling three times a day by his open windows, giving thanks to God."),
    ch("What do the words 'as he did before' (Daniel 6:10) show?", ["Daniel neither hid nor made a show; he kept his faithful habit unchanged.", "Daniel prayed more loudly than usual to annoy the king.", "Daniel had never prayed before.", "Daniel had forgotten the decree."], "Did Daniel change anything?", "Courage here was steady faithfulness: refusing to stop doing right, without theatre."),
    num("How many times a day did Daniel pray, according to Daniel 6:10?", 3, "Read the verse.", "He kneeled on his knees three times a day."),
    ch("According to Daniel 6:22, why was Daniel unharmed?", ["God sent his angel and shut the lions' mouths.", "The king had ordered the lions to be well fed.", "Daniel calmed the lions by speaking softly.", "The lions were old and had lost their teeth."], "Daniel told the king himself.", "'My God has sent his angel, and has shut the lions' mouths.'"),
    ch("Why did Daniel's enemies choose prayer as the trap?", ["They knew he would remain faithful to God, so it was the only way to accuse him.", "Prayer was already forbidden throughout Babylon, so he was certain to be caught.", "They hoped the decree would teach him to pray more humbly to the king.", "They had evidence that he had stolen from the treasury, but needed another charge."], "Daniel 6:5: they could find no fault in him except concerning the law of his God.", "His integrity left them no other charge; they had to turn his faithfulness itself into a crime."),
    ch("What was Harriet Tubman's birth name?", ["Araminta Ross", "Sojourner Truth", "Rosa Parks", "Mary Ross"], "She changed her name after escaping.", "She was born Araminta Ross and took the name Harriet Tubman."),
    ch("In what year did Harriet Tubman escape from slavery?", ["1849", "1776", "1863", "1913"], "It was more than ten years before the Civil War.", "She escaped in 1849."),
    num("Tubman was born about 1822 and escaped in 1849. About how old was she?", 27, "Subtract 1822 from 1849.", "1849 − 1822 = 27."),
    ch("About how many people did Tubman guide to freedom on her trips, according to careful historians?", ["about 70", "about 7", "about 7,000", "about 300,000"], "Some early books exaggerated; historians checked the records.", "Historians estimate about 13 trips and about 70 people. Early claims of hundreds were exaggerations."),
    ch("Early books said Tubman rescued hundreds on her trips; historians now say about 70. Which response follows the TRUTH rule?", ["Accept the better-documented figure; the true story is impressive without exaggeration.", "Keep the bigger number, because it is more inspiring and does more good.", "Conclude that she rescued no one, since the early books were wrong.", "Take the average of the two numbers, as a fair compromise between them."], "Should inspiration decide what is true?", "We follow the best evidence. Exaggeration does not honour a hero; truth does."),
    num("The Combahee River Raid freed more than 700 people in 1863. Tubman's own trips freed about 70. About how many times as many is 700 as 70?", 10, "How many 70s make 700?", "700 ÷ 70 = 10."),
    ch("Which is an example of moral courage?", ["Telling your class the truth about a mistake, knowing some will laugh", "Climbing to the top of a tall ladder to fetch a cat from a roof", "Jumping into a cold lake on a winter morning for a charity swim", "Riding a bicycle down a steep hill without using the brakes"], "Moral courage faces disapproval rather than bodily danger.", "Facing ridicule to tell the truth is moral courage. The others involve physical difficulty or danger."),
    ch("Which kind of courage did Tubman show when she crossed swamps at night to reach people in slavery?", ["physical courage, facing bodily danger", "no courage, because she was not afraid", "only moral courage", "rashness"], "What was the danger: ridicule, or capture and harm?", "Night journeys risking capture and violence required physical courage, joined to moral courage in defying unjust laws."),
    ch("What is the difference between fear and worry?", ["Fear responds to a present danger; worry runs over possible future dangers.", "Worry responds to a present danger; fear runs over possible future dangers.", "Fear is about things that happened in the past; worry is about the present.", "They are the same feeling; worry is simply the grown-up word for fear."], "Is the danger here now, or might it come later?", "Fear is about what is present; worry loops over what might happen."),
    ord("Put the three worry questions in a sensible order.", ["Is it true, or likely?", "What can I do now?", "What can I entrust to God?"], "First check the facts. Then act where you can. Then entrust the rest.", "First test the fear against the truth, then do what is in your power, then hand over in prayer what is not."),
    G.virtue(12, ["courage", "honesty", "kindness"]), G.choose(12, ["courage"]), G.choose(12), G.reason(), G.verse(["courage"]), G.verse(["courage", "faith"]), G.bible(["courage", "faith"]), G.hero(["Harriet Tubman", "Nicholas Winton", "Sojourner Truth", "Rosa Parks", "Socrates", "Corrie ten Boom"]), G.legend(), G.feel(),
  ],
  challenge: [
    ch("Daniel could have closed his windows and prayed secretly, obeying the decree outwardly. Why might he have kept the windows open?", ["Hiding would have looked like obeying a decree that put the king in God's place; he would not pretend.", "He wanted to be caught and thrown to the lions, so that God could show his power to Babylon.", "Praying in the open air was required by the law of Moses, so closing the windows was forbidden.", "He had not heard about the decree, so he simply went on with his usual habit."], "Recall the second part of honesty: not pretending.", "Changing his habit to avoid notice would have signalled submission to an unjust law. Daniel's courage included refusing to pretend."),
    ch("Daniel obeyed the king in most things but not in this one. What principle explains this?", ["When a ruler commands what God forbids, or forbids what God commands, one must obey God.", "Rulers should never be obeyed by believers, since only God has any real authority.", "Rules apply to a person only when that person agrees that they are good rules.", "Rulers must be obeyed in everything, but one may break a rule if no one sees."], "Compare Acts 5:29.", "Daniel served faithfully, but would not let a human law override God's. This is not rebellion for its own sake; it is refusing a specific wrong command."),
    ch("A book says, 'Tubman rescued three hundred people on her trips.' Records support about seventy. A friend says, 'It doesn't matter; she was a hero either way.' What is the best reply?", ["She was a hero, but truth still matters: we should repeat the figure the evidence supports.", "Agreed: she was a hero, so the exact number does not matter and any figure will do.", "If one number in the book is wrong, the whole story of her rescues must be false.", "We should always use the larger number, since it honours her memory more."], "Does an exaggeration honour a person, or misrepresent them?", "Admiration does not excuse inaccuracy. One wrong figure does not make the whole story false; the documented story stands on its own."),
    ch("Which statement best compares Daniel and Tubman?", ["Both acted rightly in the face of real danger, and both said their strength came from trust in God.", "Both were officials in the government of a foreign king and used their position to help their people.", "Both escaped from captivity by night and led their families safely to a new country far away.", "Both were famous in their lifetimes mainly for their speeches and their written books."], "Look for a true similarity that matters.", "Different eras and circumstances, the same pattern: courage grounded in faith, doing right despite danger."),
    ch("A friend is worried every night that a storm will blow the roof off. Which response applies the three worry questions best?", ["Check the facts (roofs rarely blow off), make a simple plan for storms, and pray about what is beyond your control.", "Tell her that worrying is silly and that she should simply stop thinking about storms from now on.", "Agree with her that it will probably happen, so that she feels her worry has been taken seriously.", "Suggest that she stay awake every stormy night to watch the roof, so that she will feel more in control."], "Is it likely? What can be done? What can be entrusted?", "The response tests the fear against facts, offers a concrete action, and entrusts the rest to God."),
    G.reason(),
  ],
  extend: "Read Daniel 6 aloud with a parent, then read a careful children's or adult biography of Harriet Tubman (for example, one based on the work of historian Kate Clifford Larson). Make a two-column table of three ways their courage was similar and three ways their situations differed.",
  offline: "Interview a grown-up about a time they showed moral courage (facing disapproval to do right). Write three sentences about it in your Virtue Notebook. Explain it: in 2–4 sentences, explain why Daniel's words 'as he did before' are a picture of steady courage.",
}),
