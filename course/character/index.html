    { say: "<b>Fairness is not always equality.</b> Equal shares are fair when everyone has an equal claim. But sometimes what is due differs: by <b>need</b> (medicine goes to the sick child), by <b>work</b> (pay follows hours worked), or by <b>agreement</b> (a promised prize). Justice asks: what is each person's rightful claim here?", show: tbl([["Situation", "Fair rule", "Why"], ["12 biscuits, 3 children, all equally hungry", "equal: 4 each", "equal claims"], ["one child has a fever; one dose of medicine", "by need", "only one needs it"], ["two children rake leaves for 1 hour and 3 hours", "by work: 1 share and 3 shares", "unequal work"], ["a race with a promised prize", "by agreement: to the winner", "the promise"]]) },
    { say: "Feelings. Seeing injustice rightly produces <b>indignation</b>, anger at wrong done. Jesus was 'moved with indignation' when the disciples blocked the children (Mark 10:14). But indignation must not become <b>revenge</b>, the wish to make someone suffer for your own satisfaction. Scripture leaves vengeance to God and calls us to overcome evil with good.", show: quotes(["Romans 12:19", "Romans 12:21"]) },
    explain("Explain, with an example, why fairness is not always the same as equality."),
  ],
  practice: [
    ch("What is justice?", ["giving people what they are owed; treating people fairly even when they can't benefit you", "giving everyone exactly the same thing in every case", "punishing people harshly", "doing whatever the strongest person wants"], "Recall Justinian's definition: giving every man his due.", "Justice gives each their due; sometimes that is equal, sometimes not."),
    ch("Which law book of 533 AD defined justice as 'the set and constant purpose which gives to every man his due' (Institutes I.1, trans. J. B. Moyle)?", ["Justinian's Institutes", "the Magna Carta", "the Code of Hammurabi", "the Declaration of Independence"], "A Roman emperor of Constantinople.", "Justinian's Institutes, part of his great codification of Roman law."),
    ord("List the four cardinal virtues in the order Plato usually names them in Republic IV.", ["wisdom", "courage", "temperance", "justice"], "He begins with wisdom and ends with the virtue he is defining.", "Wisdom, courage, temperance, justice: justice comes last as the harmony of the others."),
    ch("Why are they called 'cardinal' virtues?", ["From Latin cardo, a hinge: the other virtues turn on them.", "From the cardinals of the Church, who first listed them.", "From Latin carus, dear: they are the most loved virtues.", "Because there are four of them, like the cardinal directions."], "Think of a door.", "A hinge holds the door; the cardinal virtues hold up the moral life."),
    ch("What did Solomon ask God for (1 Kings 3:9)?", ["an understanding heart to judge the people", "great riches to build a temple for God", "a long life and the death of his enemies", "a great army to defend Israel's borders"], "God was pleased because he did not ask for himself.", "'Give your servant therefore an understanding heart to judge your people.'"),
    ch("How did Solomon discover the real mother?", ["He ordered the child divided; the real mother begged him to spare the child even if she lost him.", "He questioned the neighbours, who all agreed about which woman had given birth to the child.", "He watched which woman the baby smiled at, and gave the child to the one he preferred.", "He asked each woman to swear an oath, and believed the one who swore most solemnly."], "Which woman's love showed itself?", "The test revealed the truth: real love wanted the child alive."),
    ch("Leviticus 19:15 forbids being partial to the poor and showing favouritism to the great. What principle does this teach?", ["Judgment must follow the truth and the right, not favour either the powerful or the weak.", "The poor must always win their cases, because they are weaker than the rich.", "The rich must usually win their cases, because they pay most of the taxes.", "Judges should avoid listening to either side, so that neither can influence them."], "Both directions are forbidden.", "Impartiality: justice weighs the case, not the person's status."),
    ch("When did the British Slave Trade Act pass?", ["1807", "1776", "1833", "1865"], "Twenty years after Wilberforce took up the cause.", "1807. Slavery itself was abolished in most of the Empire by the 1833 Act."),
    num("Wilberforce made his first great speech against the slave trade in 1789. The Slave Trade Act passed in 1807. How many years of effort was that?", 18, "Subtract.", "1807 − 1789 = 18 years."),
    ch("Why was Olaudah Equiano's 1789 Narrative powerful evidence?", ["It was a first-hand account by someone who had been enslaved.", "It was written by a member of Parliament after a long inquiry.", "It was a popular novel that many British readers enjoyed.", "It was approved by the king and printed by royal order."], "Recall the source questions: was the writer there?", "Eyewitness testimony from someone who suffered the trade carried great weight."),
    ch("A teacher has one bottle of medicine and a child with a fever. The fair way to distribute it is by...", ["need", "equality", "age", "alphabetical order"], "Who has a claim to medicine?", "Only the sick child needs it; giving it equally would be absurd."),
    ch("Two children rake leaves, one for 1 hour, one for 3 hours, and are paid together. A fair split is by...", ["work: 1 share and 3 shares", "equal halves", "whoever asks first", "age"], "What is each one's claim based on?", "Pay that follows work done gives each their due."),
    ch("What is the difference between indignation and revenge?", ["Indignation is anger at a wrong; revenge is wanting someone to suffer for your satisfaction.", "Indignation is anger at small wrongs; revenge is anger at large wrongs done to your family.", "They are the same feeling, but indignation is the polite word used by educated people.", "Indignation is always sinful, while revenge can be just if the wrong was serious enough."], "Jesus felt one of them (Mark 10:14).", "Indignation can be righteous; revenge takes judgment into our own hands (Romans 12:19)."),
    ch("Romans 12:21: 'Don't be overcome by evil, but overcome evil with...'", ["good", "evil", "anger", "silence"], "The way to win against evil.", "'...overcome evil with good.'"),
    { gen: () => {
      const n = 3 + R(6), each = 2 + R(9), item = pick(["pencils", "apples", "stickers", "marbles", "biscuits"]);
      return { q: `${n * each} ${item} are shared equally among ${n} children who all have an equal claim. How many does each child receive?`, type: "number", answer: each, hint: "Equal claims mean equal shares. Which operation splits a total into equal parts?", why: `${n * each} ÷ ${n} = ${each}. With equal claims, equality is fair.` };
    } },
    { gen: () => {
      const n = 3 + R(4), share = 2 + R(5), extra = 1 + R(4), total = n * share + extra;
      const askHungry = R(2) === 0;
      return { q: `There are ${total} biscuits for ${n} children. One child missed breakfast, so the teacher first gives that child ${extra} extra, then shares the rest equally among all ${n} children. How many biscuits does ${askHungry ? "the child who missed breakfast" : "each of the other children"} get in all?`, type: "number", answer: askHungry ? share + extra : share, hint: "First take away the extra. Then divide what is left equally. Who gets both?", why: `${total} − ${extra} = ${n * share}; ${n * share} ÷ ${n} = ${share} each. The hungry child gets ${share} + ${extra} = ${share + extra}; the others get ${share}. Need changed what was due.` };
    } },
    G.virtue(22, ["justice", "kindness", "honesty", "humility"]), G.choose(22, ["justice"]), G.choose(22, ["justice"]), G.reason(), G.verse(["justice"]), G.verse(["justice"]), G.bible(["justice"]), G.hero(["William Wilberforce", "Olaudah Equiano", "Rosa Parks", "Harriet Tubman"]), G.think(["Plato", "Aristotle", "Socrates"]), G.def(22),
  ],
  challenge: [
    { gen: () => {
      const a = 1 + R(4), b = a + 1 + R(4), unit = 2 + R(6), total = unit * (a + b), who = R(2);
      return { q: `Two children worked together: one for ${a} hours, the other for ${b} hours. They are paid ${total} coins in total, to be shared in proportion to the hours worked. How many coins should the child who worked ${who ? b : a} hours receive?`, type: "number", answer: unit * (who ? b : a), hint: "How many hours were worked in total? What is one hour worth?", why: `Total hours: ${a} + ${b} = ${a + b}. One hour is worth ${total} ÷ ${a + b} = ${unit} coins. So ${who ? b : a} hours earns ${unit} × ${who ? b : a} = ${unit * (who ? b : a)}.` };
    } },
    ch("Solomon's test depended on a true premise. Which?", ["A real mother would rather lose her child than see him killed.", "A guilty person always looks nervous when questioned by a king.", "Babies recognise their own mothers by the sound of their voices.", "A king's command is obeyed without question by every subject."], "Why would the test reveal the truth?", "The test worked because the premise about a mother's love was true; a test based on a false premise would have failed."),
    ch("Someone argues: 'Fairness means everyone gets the same. So the sick child and the healthy child should both get half the medicine.' What is wrong?", ["The first premise is false: fairness gives each their due, and the healthy child has no claim to medicine.", "Nothing is wrong: the argument is sound, so both children should receive the same amount.", "The conclusion follows from the premise, so it must be right, whatever the doctor says.", "The second child is not really healthy, so the argument does not apply to this case."], "Is the argument valid? Is the first premise true?", "The argument is valid but unsound: its first premise confuses fairness with equality."),
    ch("Wilberforce's bills were defeated many times between 1789 and 1807. Which virtues, besides justice, does his story most clearly show?", ["perseverance and courage", "temperance and gratitude", "humility and self-control only", "none"], "What does it take to keep going for 18 years against opposition?", "Justice was the aim; perseverance and courage carried it through years of defeat."),
    ch("Leviticus 19:15 forbids partiality to the poor. Does this contradict Proverbs 31:8–9, which says to open your mouth for the needy?", ["No: we must speak up so the poor get a fair hearing, but the judgment itself must follow the truth, not favour either side.", "Yes: the two passages contradict each other, so a reader must simply choose whichever one seems more loving.", "No, because Proverbs teaches that the poor are always right, which Leviticus also assumes.", "Yes, and the contradiction shows that neither passage should guide how we treat the poor."], "One verse is about defending a cause, the other about deciding a case.", "Advocacy for those unheard and impartiality in judgment work together to give each their due."),
    G.reason(),
  ],
  extend: "Read 1 Kings 3 with a parent. Then read a short extract from Olaudah Equiano's 'Interesting Narrative' (1789, public domain), chapter 2, about his capture as a child (a parent should choose the extract). Discuss: why does first-hand testimony matter so much in questions of justice?",
  offline: "Fair-share audit: next time something is shared at home (food, chores, screen time), ask which rule is fair here: equality, need, work or agreement? Explain your choice to the family. Explain it: tell a grown-up, in 2–4 sentences, why fairness is not always equality, with your own example.",
}),
// ---------- Lesson 23 ----------
lesson({
  title: "Kindness to the younger: encouragement and empathy", icon: "🧸",
  learn: [
    { say: "Kindness is choosing to do something good for another person, especially when you don't have to. One of its best forms is <b>helping someone younger or newer</b> than you: a sibling, a beginner, a newcomer. It costs patience, and it is rarely repaid.", show: big("Kindness to the younger:\npatience given\nwhere no one can repay it") },
    { say: "When people brought little children to Jesus, the disciples rebuked them. Jesus was indignant, welcomed the children, and blessed them. He even made a child the model of greatness.", show: quotes(["Mark 10:14", "Matthew 18:3-4"]) },
    { say: "<b>Barnabas</b> was nicknamed 'Son of Encouragement'. When the former persecutor Saul (Paul) came to Jerusalem, the disciples were afraid of him. Barnabas took him, vouched for him, and introduced him to the apostles. Later he gave the young John Mark a second chance when Paul would not (Acts 15:37–39).", show: quotes(["Acts 4:36", "Acts 9:27"]) },
    { say: "History. <b>Thomas Barnardo</b> (1845–1905), shocked by the homeless children of east London, opened his first home for destitute boys in 1870; his homes sheltered tens of thousands of children. Honest history includes criticism: sending many children overseas harmed some of them.", show: pas("Thomas Barnardo (1845–1905)", "1866: arrives in London to study medicine.\n\n1870: opens a home for destitute boys at Stepney Causeway.\n\nLater: homes for girls and many more children; the charity that bears his name still works with children today.\n\nA true account includes both his great kindness and the mistakes historians have identified, such as child emigration schemes.") },
    { say: "Philosophy from China. <b>Mencius</b> (about 372–289 BC) argued that anyone who suddenly saw a child about to fall into a well would feel alarm and compassion, simply from the heart (Mencius 2A:6): a 'sprout' to be cultivated. Christians add that we bear God's image, and that grace must heal and grow it.", show: S(svg(T(300, 40, "Mencius: the sprout of compassion", 24) + `<rect x='250' y='230' width='100' height='60' rx='8' fill='#d6d3d1' stroke='#555' stroke-width='4'/><ellipse cx='300' cy='230' rx='50' ry='12' fill='#57534e'/><circle cx='210' cy='170' r='20' fill='#fde7c8' stroke='#b45309' stroke-width='3'/><path d='M210 190 v40' stroke='#b45309' stroke-width='5'/><path d='M450 260 q0 -60 0 -80 M450 200 q-30 -20 -40 -40 M450 210 q30 -20 40 -40' fill='none' stroke='#0f766e' stroke-width='6'/>` + T(450, 300, "a sprout to grow", 20, "#0f4c45") + T(150, 300, "child near a well", 20, "#7c2d12"))) },
    { say: "Two words. <b>Sympathy</b> is feeling sorry <i>for</i> someone. <b>Empathy</b> is understanding what it is like <i>to be</i> them: seeing from their side. Teaching a younger child needs empathy: remembering what it was like not to know.", show: tbl([["Sympathy", "Empathy"], ["'Poor thing.'", "'That's hard. I remember finding it hard too.'"], ["feeling for", "understanding with"], ["stays outside", "steps inside"]]) },
    { say: "How to teach a younger child well: <b>I do</b> (show slowly), <b>we do</b> (do it together), <b>you do</b> (watch them try, and encourage). Watch for your own <b>impatience</b>: it is a feeling to notice and set aside, not to obey. Praise effort specifically: 'You kept trying the loop until it held.'", show: list(["I do: show it slowly and explain each step", "We do: try it together, your hands guiding", "You do: they try alone while you encourage", "Praise the effort, specifically and truthfully"]) },
    explain("Explain what Barnabas did for Saul and for John Mark, and why encouragement is a form of kindness."),
  ],
  practice: [
    ch("Which kind of help shows kindness most clearly, according to our definition?", ["helping a younger child patiently when no one requires you to", "helping a classmate because the teacher has told you to", "helping a neighbour because you will be paid for the work", "helping a friend so that others will see and praise you"], "Recall 'especially when you don't have to'.", "Kindness is most clearly seen where nothing obliges you and nothing repays you."),
    ch("When the disciples rebuked people for bringing children, how did Jesus respond (Mark 10:14)?", ["He was moved with indignation and said, 'Allow the little children to come to me!'", "He agreed with the disciples and asked the parents to come back another day.", "He said that children should wait until they were old enough to understand.", "He blessed the disciples for protecting him from the noise of the crowd."], "Read Mark 10:14.", "He was indignant at the disciples and welcomed the children."),
    ch("In Matthew 18:3–4, whom does Jesus call the greatest in the Kingdom of Heaven?", ["whoever humbles himself as this little child", "whoever keeps the law most perfectly", "whoever gives the most to the poor", "whoever leads the other disciples"], "Greatness, upside down.", "'Whoever therefore humbles himself as this little child, the same is the greatest.'"),
    ch("What does the name Barnabas mean, according to Acts 4:36?", ["Son of Encouragement", "Son of Thunder", "Rock", "Gift of God"], "It describes his character.", "The apostles called him Barnabas, 'Son of Encouragement'."),
    ch("Why were the disciples in Jerusalem afraid of Saul?", ["He had persecuted Christians before his conversion.", "He was a Roman officer sent to arrest them all.", "He had betrayed Jesus to the chief priests.", "He had stolen money from the common purse."], "Acts 9:1–2 and 9:26.", "Saul had hunted Christians; they doubted his change was real."),
    ch("What did Barnabas do for Saul (Acts 9:27)?", ["He brought him to the apostles and told how Saul had met the Lord and preached boldly.", "He warned the apostles to keep away from Saul until he had proved himself for years.", "He sent Saul back to Tarsus at once, because the apostles refused to meet him.", "He reported Saul to the high priest so that the persecution would stop."], "He vouched for him.", "Barnabas risked his own reputation to welcome a newcomer others feared."),
    ch("What happened with John Mark in Acts 15:37–39?", ["Paul would not take him, since he had left them before; Barnabas gave him a second chance and took him to Cyprus.", "Paul and Barnabas agreed to leave him behind, because he had returned to Jerusalem without permission.", "Barnabas refused to take him, so Paul took him on the journey through Syria and Cilicia instead.", "John Mark chose to stay in Antioch, and Paul and Barnabas travelled on together without him."], "Read Acts 15:37–39.", "Barnabas encouraged the younger man. (Later, Paul himself called Mark useful, 2 Timothy 4:11.)"),
    ch("In what year did Thomas Barnardo open his first home for destitute boys?", ["1870", "1066", "1776", "1950"], "Four years after arriving in London in 1866.", "1870, at Stepney Causeway in east London."),
    num("Barnardo arrived in London in 1866 and opened his first boys' home in 1870. How many years later?", 4, "Subtract.", "1870 − 1866 = 4 years."),
    ch("Why does an honest account of Barnardo mention child emigration?", ["A true history includes mistakes as well as good deeds; historians judge that these schemes harmed some children.", "Child emigration was his only real work, so leaving it out would leave nothing to say about him at all.", "It shows that he was a villain whose homes did no good, which is why his charity is criticised today.", "It should be mentioned only briefly, since honest history focuses on a person's good deeds."], "Does honesty allow us to tell only the flattering part?", "Truthful history includes both great kindness and real faults; this avoids legend-making."),
    ch("What example did Mencius use to show that people have a sprout of compassion?", ["anyone seeing a child about to fall into a well would feel alarm and distress", "a farmer who pulled on his crops to make them grow faster and killed them", "a king who fed his hungry army before he fed himself at the palace", "a mother who walked for days to find medicine for her sick child"], "Mencius 2A:6.", "The instant alarm, felt without thought of reward, shows compassion is natural to us."),
    ch("According to Mencius, why would a person feel alarm on seeing the child?", ["not to win the parents' favour or a reputation, but from compassion itself", "to win the gratitude and friendship of the child's parents afterwards", "to gain a good reputation in the village for being brave and kind", "because the law of the state punished anyone who failed to help"], "He rules out selfish motives.", "Mencius stresses that the feeling arises before any calculation of gain."),
    ch("What is the difference between sympathy and empathy?", ["Sympathy feels sorry for someone; empathy understands what it is like to be them.", "Sympathy understands someone's feelings; empathy is simply feeling sorry for them.", "They are the same, but empathy is used for people and sympathy for animals.", "Sympathy is for friends and family; empathy is only for strangers."], "'Feeling for' versus 'understanding with'.", "Empathy steps into the other's point of view; sympathy stays outside."),
    ord("Put the teaching method in order.", ["I do: show slowly", "We do: together", "You do: they try alone", "Praise the effort specifically"], "First the child must see it done.", "I do, we do, you do, then specific encouragement."),
    ch("You are teaching your younger brother to tie his shoes and he fails again. You feel impatient. What is wise?", ["Notice the impatience, breathe, and show the step again slowly.", "Tie them for him every time without explaining.", "Tell him he is hopeless.", "Walk away without a word."], "Is impatience a command?", "Name the feeling, set it aside, and keep teaching; that is kindness joined with self-control."),
    G.virtue(23, ["kindness", "humility", "justice", "perseverance"]), G.choose(23, ["kindness"]), G.choose(23, ["kindness"]), G.reason(), G.verse(["kindness"]), G.verse(["kindness"]), G.bible(["kindness"]), G.hero(["Thomas Barnardo", "Elizabeth Fry", "Anne Sullivan", "Nicholas Winton"]), G.think(["Mencius", "Confucius", "Hillel", "Aristotle"]), G.feel(), G.def(23),
  ],
  challenge: [
    ch("Mencius argued: 'Everyone would feel alarm at a child falling into a well. So everyone has a sprout of compassion.' What would make this argument stronger?", ["Evidence that the reaction is truly universal and arises before any thought of reward, from many observations.", "Stating the claim more forcefully and more often, so that readers are more likely to accept it.", "Adding that Mencius was a famous and respected teacher whose followers agreed with him.", "Removing the example of the well, so that the claim no longer depends on a single case."], "Which premise needs support, and what kind?", "The argument rests on an empirical claim about everyone; observation and testimony would support it."),
    ch("Barnabas vouched for Saul, a former persecutor. A critic says this was imprudent. Which fact best supports Barnabas's judgment?", ["He knew evidence of the change: Saul had seen the Lord and preached boldly at Damascus at risk to himself.", "Saul came from a wealthy family in Tarsus, so the apostles could trust that he had no reason to lie.", "Barnabas trusted everyone he met, so his judgment about Saul was simply consistent with his character.", "The apostles had already decided to accept Saul, so Barnabas was only following their instructions."], "Did Barnabas trust blindly, or on evidence?", "His kindness was grounded in true evidence of Saul's conversion; that is kindness joined with prudence."),
    ch("Can an act be kind if the helper feels impatient while doing it?", ["Yes: kindness is a choice to do good; impatience does not cancel the act, though growth makes it easier.", "No: an act is kind only when it is done with a cheerful feeling from beginning to end.", "No: feeling impatient while helping turns the act into a kind of pretending.", "Yes, but only if no one notices the impatience, since kindness is judged by appearances."], "Is kindness defined by a feeling or a choice?", "Our definition says 'choosing to do'. Feelings matter, but the choice is the core."),
    ch("Argument: 'Barnardo helped many children. Some of his schemes harmed children. So Barnardo was not kind.' What is the best evaluation?", ["The conclusion does not follow: a person can show great kindness and also make serious mistakes; judge carefully, not all-or-nothing.", "The argument is sound: anyone whose work harmed even one child cannot be called kind, however much good was done.", "Both premises are false, because Barnardo's homes helped very few children and his schemes harmed none.", "It shows that kindness is impossible, because everyone who tries to help others eventually harms someone."], "Does one fault cancel all good?", "All-or-nothing thinking ignores evidence on one side. Honest judgment holds both truths."),
    ch("Why might teaching a younger child also help the teacher?", ["Explaining a skill clearly forces you to understand it better, and practises patience.", "Teaching makes you look more grown-up, which earns the respect of adults around you.", "Teachers never need to learn anything new, so teaching is a chance to rest.", "It does not help the teacher; the benefit goes only to the younger child."], "What happens when you have to explain each step?", "Teaching requires precise understanding and builds virtues such as patience and humility."),
    G.reason(),
  ],
  extend: "Read Acts 9:1–31 and Acts 15:36–41 with a parent, then 2 Timothy 4:11. Trace John Mark's story: what difference did Barnabas's encouragement make? Also read the passage of Mencius about the child and the well (Book 2A, chapter 6, James Legge's public-domain translation).",
  offline: "Teach a younger child (or anyone learning something new) a skill this week using I do, we do, you do. Afterwards write down one moment you felt impatient and what you did with that feeling. Explain it: tell a grown-up, in 2–4 sentences, the difference between sympathy and empathy.",
}),
// ---------- Lesson 24 ----------
lesson({
  title: "Temperance: the right amount", icon: "🏃",
  learn: [
    { say: "Another cardinal virtue: <b>temperance</b>, enjoying good things in the right amount and at the right time. Food, play, screens and rest are good gifts; temperance keeps them in their place, so that they serve life rather than rule it.", show: big("Temperance:\nenjoying good things\nin the right amount and at the right time") },
    { say: "Aristotle drew a fine distinction. A <b>temperate</b> person's desires are already in order; she does not crave too much. A <b>self-controlled</b> person feels strong wrong desires but resists them. Self-control is good; temperance is the goal, when right choices become easy and natural through habit.", show: tbl([["", "Desire", "Action"], ["Temperate", "already moderate", "chooses well, easily"], ["Self-controlled", "strong, pulling the wrong way", "chooses well, with effort"], ["Weak-willed", "strong, pulling the wrong way", "gives in, and regrets it"], ["Self-indulgent", "excessive", "gives in, without regret"]]) },
    { say: "Paul lists self-control as a fruit of the Spirit and compares the Christian life to an athlete's training.", show: quotes(["Galatians 5:22-23", "1 Corinthians 9:25"]) },
    { say: "Recall <b>Daniel</b>: he resolved not to eat the king's rich food and asked for a ten-day trial of vegetables and water. Notice that it was a fair test with evidence at the end.", show: quotes(["Daniel 1:8", "Daniel 1:15"]) },
    { say: "History. <b>Eric Liddell</b> would not run on Sundays. Months before the 1924 Paris Olympics he saw that the 100 metres heats fell on a Sunday and withdrew. On 11 July 1924 he won the 400 metres in 47.6 seconds. He later served as a missionary in China and died in an internment camp in 1945.", show: tbl([["Claim", "Verdict"], ["Liddell refused to run the Sunday 100 m heats", "history"], ["He learned of it on the boat to Paris", "invented for the film"], ["He won the 400 m in 47.6 seconds", "history"], ["He died in an internment camp in China in 1945", "history"]]) },
    { say: "In Homer's <i>Odyssey</i> (Book 12), an epic poem, Odysseus must sail past the <b>Sirens</b>, whose song lures sailors to their deaths. He has his crew plug their ears with wax and tie him to the mast, with orders not to free him whatever he says. This is <b>precommitment</b>: deciding in a calm moment, and arranging things so that a later urge cannot win. Putting a tablet in another room before homework works the same way.", show: S(svg(T(300, 40, "Precommitment: Odysseus and the Sirens", 24) + `<path d='M120 230 h360 l-40 50 h-280 z' fill='#b45309' stroke='#7c2d12' stroke-width='4'/><line x1='300' y1='230' x2='300' y2='80' stroke='#555' stroke-width='8'/><circle cx='300' cy='120' r='18' fill='#fde7c8' stroke='#7c2d12' stroke-width='3'/><path d='M282 150 h36 M282 170 h36' stroke='#0f766e' stroke-width='6'/>` + T(470, 120, "decide early,", 22, "#0f4c45") + T(470, 150, "while calm", 22, "#0f4c45") + T(130, 120, "the urge", 22, "#7c2d12") + T(130, 150, "comes later", 22, "#7c2d12"))) },
    { say: "Feelings. A <b>craving</b> or <b>urge</b> rises, peaks and falls, like a wave. If you do not feed it, it passes. Name it ('I'm craving another episode'), notice it in your body, and ride the wave without obeying it. Scripture promises that God provides a way of escape in every temptation.", show: quote("1 Corinthians 10:13") },
    explain("Explain Aristotle's difference between a temperate person and a self-controlled person, and how Odysseus used precommitment."),
  ],
  practice: [
    ch("What is temperance?", ["enjoying good things in the right amount and at the right time", "refusing to enjoy pleasant things, so as to grow strong in will", "having as much of good things as you can, since they are good", "eating only plain food and avoiding every kind of treat"], "Temperance does not reject good things.", "Temperance enjoys good gifts in the right measure."),
    ch("According to Aristotle, how does a temperate person differ from a merely self-controlled one?", ["The temperate person's desires are already in order; the self-controlled person resists strong wrong desires.", "The self-controlled person's desires are already in order; the temperate person resists strong wrong desires.", "They are exactly the same, since Aristotle used the two words for one virtue throughout his book.", "The temperate person has no desires at all, while the self-controlled person has desires but ignores them."], "Which one has to fight?", "Self-control wins the battle; temperance has made the battle rare."),
    ch("A boy badly wants a third helping of pudding, feels the pull strongly, and says no. Which is he showing?", ["self-control", "temperance in Aristotle's full sense", "self-indulgence", "weakness of will"], "Is his desire already moderate, or is he resisting a strong one?", "He resists a strong desire: self-control, a step on the way to temperance."),
    ch("Which list contains three fruits of the Spirit from Galatians 5:22–23?", ["patience, kindness, self-control", "wealth, fame, power", "speed, strength, cleverness", "pride, envy, anger"], "Recall the verse.", "Love, joy, peace, patience, kindness, goodness, faith, gentleness, and self-control."),
    ch("In 1 Corinthians 9:25, why does Paul mention athletes?", ["They exercise self-control in all things for a perishable crown; Christians train for an imperishable one.", "He wanted the Corinthian Christians to enter the Isthmian Games and win prizes for the church.", "He wished to warn that sport is sinful, because athletes care only about winning crowns of leaves.", "He was describing his own career as a runner before he became an apostle of Christ."], "Compare the two crowns.", "Athletes' discipline is a picture of the Christian's training for something greater."),
    ch("What did Daniel propose instead of the king's food?", ["a ten-day trial of vegetables and water", "a forty-day fast from all food and drink", "eating the king's food only on feast days", "a meal of bread and wine from the temple"], "Daniel 1:12.", "He proposed a ten-day test, to be judged by the results."),
    ch("What was the result of Daniel's ten-day test (Daniel 1:15)?", ["They looked healthier and better nourished than the youths who ate the king's food.", "They looked thinner and weaker at first, but the steward allowed them to continue anyway.", "There was no visible difference, so the steward let them choose their own food.", "They became ill, and the king ordered them to eat the royal food from then on."], "Read Daniel 1:15.", "The evidence at the end of the trial supported Daniel's request."),
    ch("Why did Eric Liddell not run the 100 metres in Paris?", ["The heats were on a Sunday, and he would not race on Sundays because of his convictions.", "He was injured in training and could only run the longer race without pain in his leg.", "His coach thought he was too slow for the 100 metres and entered him in the 400 instead.", "He missed the boat to Paris and arrived too late for the first round of the 100 metres."], "It was a matter of conscience.", "He kept the Sabbath as a matter of Christian conviction."),
    ch("When did Liddell know that the 100 metres heats were on a Sunday?", ["months in advance, when the timetable was published", "on the boat to Paris, just before the Games began", "on the morning of the race, when he read the programme", "only after the Olympics, when he read the newspapers"], "Is the film's version history?", "The timetable was known months before; the boat scene was invented for the 1981 film."),
    ch("What was Liddell's winning time in the 400 metres?", ["47.6 seconds", "10.6 seconds", "4 minutes", "60 seconds"], "An Olympic record in 1924.", "47.6 seconds, on 11 July 1924."),
    num("Liddell won Olympic gold in 1924 and died in 1945. How many years later?", 21, "Subtract.", "1945 − 1924 = 21 years."),
    ch("Where did Eric Liddell die?", ["in the Weixian internment camp in China", "in Edinburgh, after returning from China", "in Paris, during the Olympic Games of 1924", "on a ship returning from his missionary work"], "He had gone to China as a missionary.", "He died in 1945 in a Japanese internment camp at Weixian, China."),
    ch("How did Odysseus get past the Sirens?", ["He had his crew plug their ears with wax and tie him to the mast, ordering them not to release him.", "He plugged his own ears with wax and steered the ship himself while his crew listened to the song.", "He sang louder than the Sirens so that his crew could not hear them as the ship sailed past.", "He sailed a much longer route around the island so that the Sirens' song could not reach the ship."], "Homer, Odyssey 12.", "He arranged his circumstances in advance so the later temptation could not win."),
    ch("Which is an example of precommitment?", ["Putting the tablet in another room before starting homework", "Deciding at bedtime whether to finish homework", "Keeping sweets in your pocket 'just in case'", "Promising yourself to stop and then not planning how"], "Decide early, arrange things so the urge cannot win.", "Arranging your surroundings in a calm moment is precommitment."),
    ch("How does an urge usually behave if you do not act on it?", ["It rises, peaks and then falls, like a wave.", "It grows forever.", "It disappears instantly.", "It always becomes stronger the next day."], "Picture a wave.", "Urges pass if not fed. Naming and riding them builds self-control."),
    G.virtue(24, ["temperance", "self-control", "justice", "courage"]), G.choose(24, ["temperance", "self-control"]), G.choose(24, ["temperance", "self-control"]), G.reason(), G.verse(["temperance", "self-control"]), G.verse(["temperance", "self-control"]), G.bible(["self-control", "temperance"]), G.hero(["Eric Liddell", "Benjamin Franklin", "Abraham Lincoln", "George Washington"]), G.legend(), G.think(["Aristotle", "Plato", "Epictetus"]), G.def(24),
  ],
  challenge: [
    ch("Daniel's ten-day test is like a simple experiment. What made it a fair test of his diet?", ["Two groups were compared over the same time, and the result was judged by an observer, the steward.", "Daniel decided in advance what the result would be, so there was no doubt about the outcome.", "Only Daniel's group ate anything, so there was nothing to compare their health against.", "The test lasted ten days, and any test longer than a week is automatically fair."], "Compare: who ate what, for how long, and who judged?", "A comparison group, a fixed period and an outside judge make the evidence meaningful."),
    ch("Someone says: 'Chariots of Fire is a film, so nothing about Eric Liddell can be trusted.' What is the error?", ["Films mix fact and invention; we check each claim against documented sources, which confirm his refusal, his gold medal and his missionary life.", "There is no error: once a film has invented one scene, every fact about the person it portrays becomes uncertain and should be doubted.", "Films about real people are always accurate, so the boat scene must have happened exactly as it is shown on screen.", "The error is that Eric Liddell is a fictional character created for the film, so there is nothing about him to check."], "Is the right response to reject everything, or to check?", "The TRUTH rule asks us to test each claim, not to accept or reject wholesale."),
    ch("Argument: 'If a person is temperate, she enjoys good things in moderation. Sophie enjoys good things in moderation today. So Sophie is temperate.' Is this valid?", ["No: one day's moderation does not prove the settled habit, and the form affirms the consequent.", "Yes: the argument is valid and sound, so Sophie's moderation today proves her temperance.", "Yes: anyone who enjoys good things in moderation, even once, has the virtue of temperance.", "No: the first premise is false, because temperate people never enjoy good things at all."], "Does 'if A then B' plus B prove A?", "The form is invalid, and a virtue is a settled habit, not a single day's behaviour."),
    ch("Why is precommitment wise rather than weak?", ["It uses prudence in a calm moment to protect a good choice from a predictable later urge; Odysseus still heard the song.", "It removes every desire forever, so a person never again has to struggle against temptation.", "It is a trick played on other people, so that they have to resist your temptations for you.", "Strong people never need it, so using it shows weakness, though weakness can sometimes be useful."], "When is judgment clearest?", "Knowing your weaknesses truthfully and planning around them is humility and prudence at work."),
    ch("Is temperance the same as giving up good things entirely?", ["No: it enjoys them in the right amount; Aristotle names a deficiency too, insensibility, failing to enjoy good pleasures.", "Yes: the less a person enjoys pleasant things, the more temperate and virtuous that person must be.", "Yes, for everyone at all times, since every pleasure eventually leads to some kind of excess.", "No: temperance means enjoying as much as possible, as long as no one else is harmed by it."], "Recall the mean: is there a vice of too little?", "Temperance is the mean between self-indulgence and insensibility; good gifts are meant to be enjoyed rightly."),
    G.reason(),
  ],
  extend: "Read Daniel 1 with a parent. Then read Book 12 of Homer's Odyssey (Samuel Butler's public-domain prose translation) up to the passing of the Sirens. Write a paragraph comparing Daniel's resolve with Odysseus's ropes.",
  offline: "Precommitment week: choose one urge that often wins (an extra episode, a snack, a game) and set up a plan in advance (a timer, an object in another room, a promise to a parent). Record each day whether the plan worked. Explain it: tell a grown-up, in 2–4 sentences, the difference between temperance and self-control.",
}),
// ---------- Lesson 25 ----------
lesson({
  title: "Gratitude for unseen workers", icon: "🧵",
  learn: [
    { say: "Look at your breakfast. Someone grew the wheat, someone milled it, someone baked the bread, someone drove it to the shop, and someone stacked the shelves. Gratitude grows when we <b>notice the unseen workers</b> whose labour reaches us every day.", show: S(svg(T(300, 40, "Who gave you your bread?", 26) + [["farmer", 60], ["miller", 175], ["baker", 290], ["driver", 405], ["grocer", 520]].map(([w, x]) => `<circle cx='${x}' cy='140' r='46' fill='#e0f2f1' stroke='#0f766e' stroke-width='4'/>` + T(x, 148, w, 20)).join("") + `<path d='M60 200 L520 200' stroke='#555' stroke-width='5'/><path d='M508 190 l14 10 l-14 10' fill='none' stroke='#555' stroke-width='5'/>` + T(300, 260, "+ whoever made the tractor, oven, lorry and road", 20, "#555"))) },
    { say: "Moses told Israel that when they had eaten and were full, they must bless God for the good land. And the psalmist sees God's provision working through the farmer's labour.", show: quotes(["Deuteronomy 8:10", "Psalm 104:14-15"]) },
    { say: "Scripture also honours the workers themselves. Jesus said the labourer deserves his wages, and Paul compared the church to a body in which no part may say to another, 'I have no need of you.'", show: quotes(["Luke 10:7", "1 Corinthians 12:21"]) },
    { say: "In 1776 the Scottish philosopher <b>Adam Smith</b> published <i>The Wealth of Nations</i>. In its first chapter he describes a small pin factory where ten workers, each doing one step, could make 'upwards of forty-eight thousand pins in a day'. Working alone, he says, each could perhaps not make even twenty. This is the <b>division of labour</b>.", show: tbl([["", "Ten workers, dividing the steps", "One worker alone"], ["Pins per day (Smith's estimate)", "upwards of 48,000", "perhaps not 20"], ["Pins per worker per day", "48,000 ÷ 10 = 4,800", "under 20"]]) },
    { say: "Smith then describes a poor labourer's simple woollen coat, and lists the many trades it required: the shepherd, the sorter of the wool, the spinner, the weaver, the dyer, the merchants and sailors who brought the dyes from far away, and the people who made all their tools. Even the humblest coat, he concludes, is the work of many thousands of people.", show: list(["shepherd → wool-sorter → comber or carder → dyer → scribbler → spinner → weaver → fuller → dresser", "plus merchants, sailors and ship-builders who carried the materials", "plus the smiths, miners and carpenters who made every tool", "Smith's point: a single coat joins thousands of strangers in cooperation"]) },
    { say: "The Roman emperor <b>Marcus Aurelius</b> (AD 121–180) began his private notebook, the <i>Meditations</i>, with a list of thanks: to his grandfather for good character and an even temper, to his mother for generosity and simple living, to his teacher Rusticus for lending him the writings of Epictetus, and to many others. The most powerful man in the world began by naming his debts.", show: pas("Meditations, Book 1 (summary)", "From my grandfather: good character and freedom from bad temper.\n\nFrom my mother: reverence for God, generosity, and a simple way of life.\n\nFrom Rusticus: the habit of examining my character, and the writings of Epictetus.\n\nFrom the gods: good grandparents, good parents, a good sister, good teachers, good friends.") },
    { say: "Two attitudes compete. <b>Entitlement</b> says, 'I deserve this; of course it is here.' <b>Contentment</b> with gratitude says, 'This came to me through many hands, and ultimately from God.' Entitlement makes us demanding; gratitude makes us generous and respectful toward every worker.", show: tbl([["Entitlement", "Grateful contentment"], ["'Of course the bus was on time.'", "'Thank you for driving us.'"], ["notices only what is missing", "notices the many hands"], ["demanding toward workers", "respectful toward workers"]]) },
    explain("Using Adam Smith's woollen coat, explain why even an ordinary object should make us grateful, and name five people who worked to give you something you used today."),
  ],
  practice: [
    ch("Why does noticing unseen workers deepen gratitude?", ["We see how many people's labour reaches us, so we can name the gifts and the givers.", "Because workers are always paid, so no thanks is needed.", "Because it makes us feel superior.", "Because we can then ask for more."], "Gratitude notices and names.", "Seeing the chain of workers turns ordinary things into recognised gifts."),
    ch("Deuteronomy 8:10: 'You shall eat and be full, and you shall...'", ["bless Yahweh your God for the good land which he has given you", "store the extra grain in barns so that you will never go hungry", "remember that your own strength and skill have won you this land", "share the food with the strangers who live among your people"], "Fullness should lead to thanks.", "Moses warns Israel to remember God precisely when they are well fed."),
    ch("According to Luke 10:7, the labourer is worthy of...", ["his wages", "nothing", "a crown", "a holiday"], "Jesus is speaking about those who work.", "'The laborer is worthy of his wages.' Fair pay is part of honouring workers."),
    ch("Paul's picture in 1 Corinthians 12:21 teaches that...", ["no part of a body can say to another, 'I have no need for you'", "the head should direct the body, since it is the most important part", "each part of the body should try to do every job by itself", "the weaker parts should be hidden so the strong can do the work"], "The eye cannot tell the hand...", "Every member is needed: a picture of mutual dependence."),
    ch("When did Adam Smith publish The Wealth of Nations?", ["1776", "1621", "1863", "1903"], "The same year as the American Declaration of Independence.", "It was published in 1776."),
    ch("What is the division of labour?", ["splitting a job into steps, with each worker specialising in one step", "paying each worker exactly the same wage, whatever the job", "letting each worker make the whole product from start to finish", "sharing out the profits of a factory among its owners"], "Think of the pin factory.", "Each worker does one step, becoming skilled and fast at it."),
    num("Smith's ten pin workers made about 48,000 pins a day. How many pins is that per worker?", 4800, "Divide the total by the number of workers.", "48,000 ÷ 10 = 4,800 pins each."),
    num("Working alone, Smith says, a worker could perhaps not make 20 pins a day. If one specialised worker's share is 4,800, how many times as many is that compared with 20?", 240, "Divide 4,800 by 20.", "4,800 ÷ 20 = 240 times as many."),
    ch("What was Smith's point about the labourer's woollen coat?", ["Even a humble coat is the work of thousands of people cooperating.", "Wool was the most valuable material in eighteenth-century Britain.", "Labourers in Scotland were too poor to own any warm clothing.", "A coat made by one skilled tailor is better than a factory coat."], "List the trades involved.", "Shepherds, spinners, weavers, dyers, sailors, toolmakers: the coat joins many strangers."),
    ch("How does Marcus Aurelius begin his Meditations?", ["by thanking, one by one, the people who shaped him", "with a record of his victories over Rome's enemies", "with instructions on how to govern an empire well", "with a prayer asking the gods for a long life"], "Book 1.", "He names what he learned from each grandparent, parent, teacher and friend."),
    ch("What did Marcus Aurelius thank his teacher Rusticus for?", ["the habit of examining his character, and lending him Epictetus' writings", "teaching him to command legions and win battles on the Danube frontier", "choosing him as heir to the throne and preparing him to be emperor", "giving him a library of Greek poetry and teaching him to write verse"], "A philosopher passing on a book.", "Rusticus introduced him to Epictetus and to self-examination."),
    ch("Marcus Aurelius lived from AD 121 to AD 180. About how long did he live?", ["about 59 years", "about 121 years", "about 80 years", "about 301 years"], "AD years count up; subtract.", "180 − 121 = 59, so about 59 years. (He was born in April and died in March, so he was in fact 58.)"),
    ch("Which statement shows entitlement?", ["'Of course dinner is ready. That's what parents do.'", "'Thank you for cooking; it smells wonderful.'", "'Can I help set the table?'", "'I noticed you bought my favourite bread.'"], "Entitlement takes the gift for granted.", "Entitlement treats gifts as automatic. Gratitude notices and names them."),
    ch("Why would a Christian thank both the farmer and God for bread?", ["God provides through the farmer's work; gratitude to both is fitting.", "The farmer deserves thanks only if the bread was given free of charge.", "God made the bread directly, so the farmer is merely a messenger.", "Thanking two givers makes the thanks twice as valuable to each one."], "Read Psalm 104:14.", "God causes the plants to grow 'for man to cultivate': divine gift and human labour together."),
    ch("Which worker did you probably NOT see today, though your life depended on them?", ["the person who keeps the water supply clean", "the teacher who taught your lesson today", "the parent who made your breakfast", "the friend you played with after lunch"], "Think of unseen services.", "Water engineers, electricity workers and many others serve us invisibly every day."),
    { gen: () => { const w = 2 + R(9), each = 50 * (2 + R(19)), total = w * each;
      return { q: `A workshop of ${w} workers divides a job into steps and makes ${total.toLocaleString("en-GB")} items a day. How many items is that per worker?`, type: "number", answer: each, hint: "Share the total equally among the workers: divide.", why: `${total.toLocaleString("en-GB")} ÷ ${w} = ${each} items per worker.` }; } },
    { gen: () => { const solo = 2 + R(9), w = 3 + R(8), each = solo * (5 + R(20)), together = w * each;
      return { q: `Working alone, each of ${w} workers makes ${solo} chairs a week. When they divide the work into steps, together they make ${together} chairs a week. How many more chairs a week is that than if they all worked alone?`, type: "number", answer: together - w * solo, hint: `First find how many they make working alone: ${w} workers × ${solo} chairs.`, why: `Alone: ${w} × ${solo} = ${w * solo}. Together: ${together}. Difference: ${together} − ${w * solo} = ${together - w * solo}.` }; } },
    G.virtue(25, ["gratitude", "humility", "justice", "kindness"]), G.choose(25, ["gratitude"]), G.reason(), G.verse(["gratitude"]), G.verse(["gratitude"]), G.hero(["Adam Smith", "Marcus Aurelius", "Benjamin Franklin", "Anne Sullivan"]), G.feel(), G.def(25),
  ],
  challenge: [
    ch("Someone argues: 'The baker was paid for my bread, so I owe no gratitude.' What is the best reply?", ["Payment satisfies justice, but the baker's skill and care still deserve recognition; justice and gratitude are not rivals.", "Correct: once a fair price is paid, nothing more is owed, so thanks would be an empty formality.", "Gratitude is owed only to God, so thanking the baker takes away the thanks that belongs to him.", "The baker should be thanked only if he gave a discount, since then he gave more than was owed."], "Is gratitude only about debts of money?", "Fair wages satisfy justice; gratitude recognises the good done and the person who did it. Both can be present."),
    ch("Smith's numbers (48,000 pins by ten workers) were an estimate from a small factory he had seen. How should we treat them?", ["As an illustrative estimate from observation; the principle (specialisation multiplies output) is well supported.", "As an exact measurement, since Smith counted the pins himself on one particular day.", "As worthless, since an estimate cannot support any conclusion about how work is done.", "As an invented fable, like Aesop's, meant to teach a moral rather than describe a factory."], "Distinguish a precise figure from an illustration of a principle.", "Careful readers notice the kind of evidence: Smith's figures illustrate; the principle has been confirmed many times since."),
    ch("Paul's body picture (1 Corinthians 12) and Smith's division of labour both describe interdependence. What important difference is there?", ["Paul speaks of members of Christ's church bound by love and the Spirit; Smith describes strangers cooperating through trade.", "There is no real difference: both describe a factory in which each worker is a different part of the body.", "Smith was describing the church, and Paul was describing the economy of the Roman Empire.", "Paul says every member should do the same work; Smith says each worker should do something different."], "Who are the members, and what binds them?", "The ideas rhyme, but the contexts differ: careful comparison names both the similarity and the difference."),
    ch("Argument: 'If I am grateful, I notice workers. I notice workers. So I am grateful.' Is it valid?", ["No: noticing workers does not prove gratitude (you might notice and resent them); it affirms the consequent.", "Yes: the conclusion follows, because noticing workers is exactly what being grateful means.", "No: the first premise is false, because grateful people never think about workers.", "Yes: both premises are true, so the argument must also be sound."], "If A then B; B; therefore A?", "From 'if A then B' and 'B' you cannot conclude 'A'. This fallacy is called affirming the consequent."),
    ch("Marcus Aurelius was emperor of Rome, yet he began his notebook with thanks. Which conclusion is best supported?", ["Gratitude is compatible with great power, and naming one's debts guards against pride.", "Emperors need no help from anyone.", "His thanks were only for show, since no one was meant to read it.", "Gratitude is only for the weak."], "The Meditations were private notes. What does that suggest about his motive?", "Because the notes were private, the thanks were not for show. Remembering our debts keeps power humble."),
    G.reason(),
  ],
  extend: "Read, with a parent, the first chapter of Adam Smith's 'The Wealth of Nations' (1776, public domain), at least the pin-factory paragraph and the final paragraph about the woollen coat. Then read Book 1 of Marcus Aurelius's Meditations (George Long's public-domain translation) and choose your favourite line of thanks.",
  offline: "Trace one object (a pencil, a loaf, a jumper) back as far as you can: list every kind of worker involved, at least ten. Then thank one worker you meet this week by name or in person. Explain it: in 2–4 sentences, explain the division of labour and why it should make us grateful.",
}),
// ---------- Lesson 26 ----------
lesson({
  title: "Prudence: practical wisdom", icon: "🦉",
  learn: [
    { say: "We now meet a cardinal virtue: <b>prudence</b>, or practical wisdom. Prudence is <b>knowing what to do in a given situation; wisdom that connects to action</b>. It sees clearly what is good here and how to do it well. It is not timidity: it is the virtue that guides all the others, finding the mean between too little and too much.", show: big("Prudence:\nknowing what to do in a given situation;\nwisdom that connects to action") },
    { say: "Jesus ended the Sermon on the Mount with two builders. Both heard his words; only one acted on them. Prudence is not merely knowing what is right; it is building your life on it before the storm comes.", show: quote("Matthew 7:24-27") },
    { say: "Proverbs is a handbook of prudence. Notice the pattern: the prudent person looks ahead, considers, and listens to both sides.", show: quotes(["Proverbs 22:3", "Proverbs 14:15", "Proverbs 18:17"]) },
    { say: "History. In 217 BC the Carthaginian general Hannibal crushed a Roman army at Lake Trasimene. Rome appointed <b>Quintus Fabius Maximus</b> as dictator. Knowing Hannibal could not be beaten in open battle yet, Fabius shadowed his army, cut off supplies, and refused a pitched battle. Romans mocked him as <b>Cunctator</b>, 'the Delayer'.", show: tbl([["Year", "Event"], ["217 BC", "Disaster at Lake Trasimene; Fabius made dictator; strategy of delay"], ["216 BC", "Rome abandons delay and fights at Cannae: a catastrophic defeat"], ["after 216 BC", "Rome returns to Fabius's strategy and slowly wears Hannibal down"], ["202 BC", "Scipio defeats Hannibal at Zama"]]) },
    { say: "In 216 BC, impatient Romans abandoned delay and attacked at <b>Cannae</b>. Hannibal surrounded them: it was one of the worst defeats in Roman history. Rome then returned to Fabius's approach. The poet Ennius later wrote that one man, by delaying, restored the state. Our source for much of this is <b>Plutarch's Life of Fabius</b>, written about three centuries later, drawing on earlier historians such as Polybius.", show: S(meanSvg("cowardice", "prudent courage", "rashness", "Fabius found the mean")) },
    { say: "<b>Aristotle</b> called practical wisdom <i>phronesis</i>. He taught that the other virtues need it: courage without prudence becomes rashness; generosity without prudence becomes wastefulness. Prudence asks three questions: What is truly good here? What are the facts? What will probably follow from each choice?", show: tbl([["Prudence asks", "Example: a stranger online offers a prize"], ["What is truly good here?", "my safety and my family's trust"], ["What are the facts?", "I do not know who this is; offers like this are often scams"], ["What will probably follow?", "replying could expose my address; telling a parent protects me"], ["Decision", "do not reply; tell a parent"]]) },
    { say: "Feelings and prudence. <b>Impatience</b> pushes us to act before thinking, as at Cannae. <b>Anxiety</b> can freeze us so we never act. Prudence names both feelings, gathers the facts, and then acts at the right time.", show: list(["Impatience: 'Do something now!' → Pause. What are the facts?", "Anxiety: 'What if everything goes wrong?' → Which risks are real? What can I do?", "Prudence: act at the right time, in the right way, for the right reason."]) },
    explain("Explain why Fabius's delay was prudence and not cowardice, using the idea of the mean, and say what happened at Cannae when Rome abandoned it."),
  ],
  practice: [
    ch("What is prudence?", ["knowing what to do in a given situation; wisdom that connects to action", "avoiding every risk, so that nothing can go wrong in any situation", "doing what most sensible people around you are already doing", "knowing a great many facts about history, science and Scripture"], "It is practical wisdom.", "Prudence is practical wisdom: right judgment about what to do here and now."),
    ch("In Matthew 7, what was the difference between the wise and foolish builders?", ["Both heard Jesus' words; only the wise man did them.", "The wise man heard Jesus' words; the foolish man never heard them.", "The wise man was richer and could afford better stone.", "The foolish man built quickly; the wise man built slowly."], "Both heard. What else?", "Hearing without doing is building on sand."),
    ch("What happened to the house built on the sand?", ["It fell, and great was its fall.", "It stood firm.", "It was sold.", "It floated away safely."], "Matthew 7:27.", "When the storm came, the house on sand collapsed."),
    ch("Proverbs 22:3: 'A prudent man sees danger, and hides himself; but the simple...'", ["pass on, and suffer for it", "hide too", "become rich", "warn everyone"], "The simple do not look ahead.", "Prudence foresees danger; simplicity walks into it."),
    ch("Proverbs 14:15 contrasts the simple man who believes everything with the prudent man who...", ["carefully considers his ways", "believes nothing at all", "follows the crowd", "asks no questions"], "Prudence thinks before believing or acting.", "The prudent man carefully considers his ways."),
    ch("Who was Fabius Maximus?", ["a Roman dictator who avoided pitched battle with Hannibal, nicknamed 'the Delayer'", "a Carthaginian general who crossed the Alps with elephants to attack Rome", "a Greek historian who wrote the lives of famous Greeks and Romans", "a Roman general who finally defeated Hannibal at Zama in 202 BC"], "His nickname was Cunctator.", "Fabius led Rome in 217 BC with a strategy of delay."),
    ch("Why did Fabius avoid a pitched battle?", ["Hannibal's army was too strong to beat in open battle then, so Fabius wore it down instead.", "Fabius was too old to fight and preferred to leave battles to younger commanders.", "The Senate had forbidden all fighting until a peace treaty could be agreed.", "He hoped Hannibal would grow bored and sail home to Carthage of his own accord."], "Prudence weighs the facts.", "He judged the facts correctly: delay protected Rome while weakening Hannibal."),
    ch("What happened at Cannae in 216 BC?", ["Rome abandoned delay, attacked, and suffered a catastrophic defeat.", "Rome followed Fabius's plan and forced Hannibal to retreat.", "Hannibal was surrounded and his army destroyed by the legions.", "The two sides agreed a truce that lasted for ten years."], "Impatience overruled prudence.", "Hannibal surrounded the Roman army: one of Rome's worst defeats."),
    num("Lake Trasimene was in 217 BC and Zama, where Hannibal was finally defeated, was in 202 BC. How many years apart were they?", 15, "BC years count down; subtract the smaller from the larger.", "217 − 202 = 15 years."),
    ch("Who wrote the Life of Fabius on which we rely?", ["Plutarch, about three centuries later, using earlier historians such as Polybius", "Fabius himself, in a memoir written after he retired to his farm", "Hannibal's secretary, who recorded the war from the Carthaginian side", "Livy, who was an eyewitness to the battles he described"], "A Greek biographer of the 1st–2nd century AD.", "Plutarch wrote it long after, drawing on earlier sources; Polybius wrote closer in time."),
    ch("Aristotle's word for practical wisdom is...", ["phronesis", "pietas", "hesed", "agape"], "It is Greek.", "Phronesis: the virtue of good practical judgment."),
    ch("Why does courage need prudence?", ["Without prudence, courage becomes rashness.", "It doesn't; courage is enough.", "Prudence makes people cowardly.", "Because courage is only for soldiers."], "Recall the mean.", "Prudence finds the right action; without it, boldness turns reckless."),
    ord("Put prudence's three questions in the order this lesson gives them.", ["What is truly good here?", "What are the facts?", "What will probably follow from each choice?"], "Start with the goal, then the facts, then the consequences.", "Goal, facts, consequences: then decide."),
    ch("A stranger online promises you a prize if you send your address. What would prudence do?", ["Not reply, and tell a parent.", "Send the address quickly before the prize is gone.", "Send a friend's address.", "Reply asking for the prize first."], "What are the facts? What could follow?", "Prudence recognises a likely scam and protects you and your family."),
    ch("Which feeling most pushed Rome toward disaster at Cannae?", ["impatience", "gratitude", "contentment", "boredom"], "Romans mocked Fabius's slowness.", "Impatience demanded action before the right time."),
    G.virtue(26, ["prudence", "courage", "self-control", "justice"]), G.choose(26, ["prudence"]), G.choose(26, ["prudence", "temperance"]), G.reason(), G.reason(), G.verse(["prudence"]), G.verse(["prudence"]), G.hero(["Fabius Maximus", "Abraham Lincoln", "George Washington", "Ernest Shackleton"]), G.legend(), G.def(26),
  ],
  challenge: [
    ch("The Romans mocked Fabius as a coward. Which evidence best shows his delay was prudence?", ["When Rome abandoned his strategy it suffered disaster at Cannae; when it returned to it, Hannibal was slowly worn down.", "His nickname, 'the Delayer', shows that the Romans themselves thought him wise.", "Plutarch admired Fabius, and Plutarch is a famous and respected writer.", "Fabius was an old and experienced man, and older people are generally prudent."], "Look for evidence about results, not reputation.", "Comparing outcomes with and without his strategy is strong evidence that his judgment was sound."),
    ch("Argument: 'Prudent people avoid danger. Fabius avoided battle. So Fabius was prudent.' What is wrong?", ["It affirms the consequent: avoiding danger can also come from cowardice, so we need evidence about his reasons and results.", "Nothing is wrong with it: the premises are true and the conclusion follows from them necessarily.", "The first premise is false, because prudent people always seek out danger to prove their courage.", "The second premise is false, because Fabius fought Hannibal in a pitched battle at Cannae."], "If A then B; B; therefore A?", "The form is invalid. The conclusion may be true, but these premises do not prove it."),
    ch("Both builders heard the same words. Which conclusion about prudence is best supported by the parable?", ["Knowing what is right is not enough; prudence includes acting on it before the test comes.", "Prudence means choosing the safest building site, so the parable is about architecture.", "The foolish builder simply lacked information that the wise builder had.", "Storms come only to foolish people, so the wise never face hardship."], "What did the wise man do that the foolish did not?", "The difference was doing, not knowing. Practical wisdom is practical."),
    ch("Proverbs 18:17 says the first to plead seems right until another questions him. How does this help a judge be prudent?", ["It reminds the judge to hear both sides and test the evidence before deciding.", "It tells the judge to trust the first speaker, who has had time to prepare.", "It tells the judge to believe the second speaker, who has the last word.", "It warns judges never to decide, since every case has two sides."], "Why does the first story seem right?", "Prudence delays judgment until both sides have been heard and tested."),
    ch("Is delay always prudent?", ["No: prudence acts at the right time; sometimes waiting is wise and sometimes it is negligence.", "Yes: Fabius shows that waiting is always safer than acting, whatever the situation.", "No: prudence always acts at once, because delay is a form of cowardice.", "Yes, unless an enemy is present, in which case one should always attack."], "Did Rome eventually need to fight Hannibal?", "Prudence is not a rule of 'always wait'; it judges the right time. Scipio later attacked and won at Zama."),
    G.reason(),
  ],
  extend: "Read, with a parent, selected chapters of Plutarch's 'Life of Fabius Maximus' (Dryden or Perrin translation, public domain), especially the part about his strategy and the mockery he endured. Then read Matthew 7:24–27 again and write how Fabius was a 'wise builder'.",
  offline: "Prudence practice: before one decision this week (what to buy, how to spend a free afternoon, how to answer a hard message), write the three questions and your answers, then decide. Explain it: in 2–4 sentences, explain why prudence is called the guide of the other virtues, with an example.",
}),
// ---------- Lesson 27 ----------
lesson({
  title: "Faith: trusting and acting", icon: "⚓",
  learn: [
    { say: "Christians name three virtues that come as gifts of God's grace: <b>faith, hope and love</b> (1 Corinthians 13:13). Our definition of faith: <b>trusting God, and acting on that trust</b>. Hebrews gives a famous description.", show: quote("Hebrews 11:1") },
    { say: "The great example is <b>Abraham</b> (then called Abram). God called him to leave his country and family for a land he had never seen. He went, at the age of seventy-five, 'not knowing where he went'.", show: quotes(["Genesis 12:1", "Genesis 12:4", "Hebrews 11:8"]) },
    { say: "Is faith believing without reasons? Not in the biblical sense. Luke says he investigated carefully so that his reader might know the <b>certainty</b> of what he had been taught. Faith is trust in a <b>Person</b> who has shown himself reliable, the way you trust a doctor whose skill you have good reason to believe in, even when you cannot check everything yourself.", show: quote("Luke 1:3-4") },
    { say: "When <b>Thomas</b> doubted the resurrection, Jesus did not scold him for wanting evidence; he offered it: 'Reach here your finger, and see my hands.' Then he blessed those who would believe through the testimony of others. A father who brought his son to Jesus cried out with honest, mixed faith: 'I believe. Help my unbelief!'", show: quotes(["John 20:27", "John 20:29", "Mark 9:24"]) },
    { say: "History. <b>George Müller</b> (1805–1898) opened a home for orphans in Bristol in 1836; over his life more than ten thousand orphans were cared for. He resolved never to ask anyone for money, only to pray, and published records of every gift. Some famous stories about him come from later retellings and are hard to verify.", show: tbl([["Claim about Müller", "Evidence", "Verdict"], ["Cared for over 10,000 orphans", "orphanage records", "history"], ["Never asked people for money", "his published reports and journals", "history"], ["Bread and milk arrived exactly at breakfast", "later retellings", "uncertain tradition"]]) },
    { say: "<b>Anselm</b> (1033–1109), Archbishop of Canterbury, described Christian thinking as <b>'faith seeking understanding'</b>: we trust God, and then use reason to understand more deeply what we believe. Peter tells Christians to be ready to give a <b>reason</b> for their hope. People of other faiths, and people without religious faith, also live by trust every day; respectful conversation asks what reasons each person has.", show: quote("1 Peter 3:15") },
    { say: "Faith and feelings. <b>Doubt</b> and <b>worry</b> are not the end of faith; the father in Mark 9 brought his doubt honestly to Jesus. Name the doubt, look at the reasons, and act on the trust you have.", show: list(["Name it: 'I'm worried God won't answer.'", "Remember reasons: what God has said and done; what you have seen.", "Act: pray, obey, take the next faithful step.", "Like Abraham: you need not see the whole road to take the next step."]) },
    explain("What is faith, according to our definition and Hebrews 11? Explain why biblical faith is not 'believing without any reasons', using Luke 1:3–4 or Thomas."),
  ],
  practice: [
    ch("What is our definition of faith?", ["trusting God, and acting on that trust", "believing anything you like", "feeling certain without reasons", "knowing everything about God"], "It has two parts: trusting and acting.", "Faith: trusting God, and acting on that trust."),
    ch("Hebrews 11:1: 'Now faith is assurance of things hoped for, proof of things...'", ["not seen", "already owned", "easily measured", "forgotten"], "Faith concerns what we cannot yet see.", "'Proof of things not seen.' (WEB)"),
    ch("What did God call Abram to do (Genesis 12:1)?", ["leave his country, relatives and father's house for a land God would show him", "build an ark of gopher wood and fill it with every kind of animal", "lead the descendants of Jacob out of slavery in the land of Egypt", "stay in Haran and build an altar there for the whole family"], "He did not know the destination.", "Abram was called to go to a land he had never seen."),
    num("How old was Abram when he left Haran (Genesis 12:4)?", 75, "Genesis 12:4 gives his age.", "'Abram was seventy-five years old when he departed from Haran.'"),
    ch("Hebrews 11:8 says Abraham went out...", ["not knowing where he went", "with a detailed map", "because he was forced", "to become rich"], "Faith acts without seeing the whole road.", "He obeyed without knowing the destination."),
    ch("Why did Luke write his Gospel, according to Luke 1:3–4?", ["so that Theophilus might know the certainty of what he had been taught", "so that the Roman emperor would stop persecuting the churches", "because the other apostles had asked him to write a hymn book", "so that readers would enjoy a well-told story about a teacher"], "He traced everything accurately.", "Luke investigated carefully so his reader could have certainty."),
    ch("How did Jesus respond to Thomas's doubt?", ["He offered Thomas evidence: 'Reach here your finger, and see my hands.'", "He rebuked Thomas and told him that asking questions shows a lack of faith.", "He sent Thomas away until he was ready to believe without any evidence.", "He told the other disciples to argue with Thomas until he was persuaded."], "John 20:27.", "Jesus met Thomas with evidence, and then called him to believe."),
    ch("Who cried, 'I believe. Help my unbelief!'?", ["the father of a suffering boy (Mark 9)", "Thomas, when he saw the risen Jesus", "Abraham, as he left his father's house", "Peter, as he sank beneath the waves"], "Mark 9:24.", "A father whose son was ill, honestly bringing mixed faith to Jesus."),
    ch("Which is the best analogy for biblical faith?", ["trusting a doctor whose skill you have good reason to believe in", "guessing the answer to a riddle with no clues", "believing something because it would be nice", "refusing to think about evidence"], "Faith is trust in a reliable person.", "Faith rests on reasons for trusting a person, even when we cannot check everything ourselves."),
    ch("In what year did George Müller open his first orphan home in Bristol?", ["1836", "1776", "1621", "1955"], "He lived 1805–1898.", "He opened the first home in 1836."),
    num("George Müller was born in September 1805 and died in March 1898. How old was he when he died?", 92, "Subtract the years, then check whether his birthday had come yet in 1898.", "1898 − 1805 = 93, but in March 1898 his September birthday had not yet come, so he was 92."),
    ch("Why are Müller's published records of gifts important evidence?", ["They were written at the time and can be checked, unlike later stories.", "They were written by famous authors who admired Müller's work greatly.", "They are very long, and long documents are more likely to be accurate.", "They were kept secret, so no one had any reason to change them later."], "Use the source questions: when, by whom?", "Records made at the time are stronger evidence than later retellings."),
    ch("Anselm's phrase 'faith seeking understanding' means...", ["we trust God and then use reason to understand more deeply", "faith and reason are enemies", "we must understand everything before trusting", "we should stop thinking once we believe"], "Faith is the start, not the end, of thinking.", "Anselm saw reason as serving faith's desire to understand."),
    ch("1 Peter 3:15 tells Christians to be ready to give...", ["a reason for the hope that is in them, with humility", "a generous gift to anyone who asks them for help", "a sermon whenever people gather in the market", "an answer only when they are sure of winning"], "Faith is not unable to give reasons.", "'[…] always be ready to give an answer to everyone who asks you a reason concerning the hope that is in you, with humility and fear' (WEB)."),
    ch("You are worried that you are not 'trusting enough'. What does Mark 9:24 suggest?", ["Bring your honest, mixed faith to God; he receives it.", "Hide the doubt until it disappears, since doubt is shameful.", "Wait until you feel completely certain before you pray.", "Decide that a person with doubts cannot have any faith."], "What did the father do?", "Honest faith with doubts is still faith; bring the doubt to God."),
    G.virtue(27, ["faith", "courage", "hope", "prudence"]), G.choose(27, ["faith"]), G.reason(), G.reason(), G.verse(["faith"]), G.verse(null, ["Hebrews 11:1", "Proverbs 3:5-6", "John 8:32"]), G.bible(["faith"]), G.hero(["George Müller", "Eric Liddell", "Corrie ten Boom", "Father Damien"]), G.think(["Anselm", "Augustine", "Socrates"]), G.def(27),
  ],
  challenge: [
    ch("Someone says: 'Faith means believing things with no evidence at all.' Which reply is most accurate to the Bible?", ["Biblical faith is trust in God based on reasons (his words and deeds, eyewitness testimony), reaching beyond what we see.", "Correct: the Bible teaches that looking for evidence is a sin, so the less evidence the stronger the faith.", "Faith means accepting only what you have personally seen, so the apostles had faith but we cannot.", "Faith is simply a strong feeling, so the question of evidence does not arise at all."], "Recall Luke 1:3–4 and John 20:27.", "The New Testament presents testimony and evidence, and calls for trust in what has been shown reliable."),
    ch("Jesus said to Thomas, 'Blessed are those who have not seen, and have believed' (John 20:29). John 20:31 says the signs 'are written, that you may believe'. How do these fit together?", ["Later believers rely on the written testimony of witnesses as their reason to trust.", "They contradict each other, so one of the two verses must be a later addition.", "They mean that reading the Gospels is unnecessary for anyone who truly believes.", "They mean that only those who saw Jesus, like Thomas, could believe for good reasons."], "What did John write his book for?", "Later believers rely on reliable testimony rather than personal sight: that is reasonable trust."),
    ch("A Müller story says the milkman's cart broke down outside the orphanage just as breakfast was needed. How should a careful historian treat it?", ["As a possibly true but unverified tradition, kept separate from the documented facts.", "As certainly false, because events that seem remarkable cannot really happen.", "As certainly true, because it is printed in a book about a famous Christian.", "As proof that all of Müller's own records are unreliable and invented."], "Separate documented records from later retellings.", "Good reasoning neither accepts nor rejects a story merely because it is remarkable; it asks for evidence."),
    ch("Argument: 'Everything we trust must be fully proven first. We trust our parents without fully proving their love. So we should not trust our parents.' What is the problem?", ["The first premise is false: reasonable trust rests on good evidence, not complete proof; so it is unsound.", "The argument is sound, so the wise course is to stop trusting anyone until they are proven.", "The conclusion does not follow, even if both premises are true, so the argument is invalid.", "The second premise is false, because we can fully prove our parents' love with experiments."], "Is the form valid? Is the first premise true?", "The form is valid, but the first premise sets an impossible standard; daily life rightly relies on well-grounded trust."),
    ch("Abraham obeyed without knowing where he would go. Was that unreasonable?", ["No: he trusted the One who called him, with good reason, even without knowing the details.", "Yes: a sensible person never sets out without first knowing the destination and route.", "Yes: faith always goes against reason, which is why it is called faith.", "No: God had already shown him a map of Canaan before he set out."], "Is trusting a reliable person without knowing every detail reasonable?", "Not knowing the route is different from having no reason to trust the guide."),
    G.reason(),
  ],
  extend: "Read Hebrews 11 in full with a parent. Make a table of every person named, what they did 'by faith', and what they could not see. Then read Genesis 12:1–9.",
  offline: "Write a thank-you letter to someone who helped you learn this year, naming three specific things (this is your gratitude task for the week). Then ask a grown-up to tell you about a time they trusted God without seeing the whole road. Explain it: in 2–4 sentences, explain the difference between faith and wishful thinking.",
}),
// ---------- Lesson 28 ----------
lesson({
  title: "'I don't know yet': honest thinking", icon: "🧪",
  learn: [
    { say: "Honesty includes saying <b>'I don't know yet'</b> when it is true. Pretending to know is a kind of lie about yourself. And the word <b>yet</b> matters: not knowing is the starting point of learning, not a disgrace.", show: big("'I don't know ... yet.'") },
