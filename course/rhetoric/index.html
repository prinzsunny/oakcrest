<script>// Rhetoric & Speaking: Year 1 (32 lessons): the progymnasmata with argument, evidence, clarity and delivery.
// Generated. RH holds the tagged pools and question generators; generator answers are computed from tags.
// Runtime pools and question generators for the rhetoric course (emitted verbatim into the data file).
const RH = (() => {
  const rnd = (n) => Math.floor(Math.random() * n);
  const pick = (a) => a[rnd(a.length)];
  const shuf = (a) => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = rnd(i + 1); [b[i], b[j]] = [b[j], b[i]]; } return b; };
  const sample = (a, n) => shuf(a).slice(0, n);
  const uniq = (a) => [...new Set(a)];
  const wc = (s) => s.trim().split(/[\s—]+/).filter((w) => /[A-Za-z0-9]/.test(w)).length;
  // choice with the right answer plus up to 3 distinct wrong options
  const mc = (q, answer, wrongs, hint, why, show) => {
    const w = sample(uniq(wrongs).filter((x) => x !== answer), 3);
    const o = { q, options: shuf([answer, ...w]), answer, hint, why };
    if (show) o.show = show;
    return o;
  };
  const big = (text) => ({ type: "big", text });

  // ── Glossary of terms used across the course
  const TERMS = {
    rhetoric: "the art of speaking and writing clearly, truthfully and persuasively",
    audience: "the people who hear or read a message",
    purpose: "what the speaker hopes the message will achieve",
    invention: "finding what to say: ideas, reasons and evidence",
    arrangement: "putting the material in the best order",
    style: "choosing the words and sentences",
    memory: "learning a speech so it can be given without reading",
    delivery: "using voice, posture, eyes and gesture well",
    fable: "a short invented story, often with animals, that teaches a moral",
    moral: "the lesson about life that a story teaches",
    narrative: "an account of events told in order",
    chreia: "a brief, memorable saying or action of a real person",
    maxim: "a short general saying about life, not necessarily tied to one speaker",
    refutation: "the exercise of showing that a story or claim is false or doubtful",
    confirmation: "the exercise of showing, with evidence, that a story or claim is true (the twin of refutation)",
    commonplace: "a speech that amplifies the case against a vice, or a type of wrongdoer, in general",
    encomium: "a speech of praise for a person, virtue or thing",
    vituperation: "a speech of blame for one particular subject, following the headings of the encomium",
    syncrisis: "a comparison of two people or things, weighing them against each other",
    ethopoeia: "a speech written in the voice of a character",
    ekphrasis: "a vivid description that brings a scene before the listener's eyes",
    thesis: "an argument on a general question that has two sides",
    "précis": "a short, exact summary in your own words",
    paraphrase: "the same meaning in your own words, at about the same length",
    claim: "the statement the speaker wants the audience to accept",
    reason: "the answer to 'Why should I accept the claim?'",
    evidence: "facts, data or testimony showing that a reason is true",
    warrant: "the general principle that connects evidence to claim",
    qualifier: "a word that shows how certain a claim is, such as 'probably'",
    "counter-argument": "the strongest case for the opposing side",
    rebuttal: "an answer showing why an objection does not defeat the claim",
    concession: "admitting that the other side is right about a point",
    ethos: "persuasion through the speaker's trustworthy character",
    pathos: "persuasion through the audience's emotions",
    logos: "persuasion through reasoning and evidence",
    valid: "describes an argument whose conclusion must follow from its premises",
    sound: "describes an argument that is valid and has all true premises",
    premise: "a statement an argument starts from",
    fallacy: "a mistake in reasoning that makes an argument seem stronger than it is",
    anaphora: "repeating the same words at the start of successive phrases",
    antithesis: "placing contrasting ideas side by side in balanced phrases",
    tricolon: "a series of three parallel words or phrases",
    "rhetorical question": "a question asked for effect, not for an answer",
    articulation: "pronouncing each sound clearly",
    register: "how formal or informal the language is",
    redundancy: "saying the same thing twice in different words",
    corroboration: "confirmation of a claim by independent sources",
    anecdote: "a single personal story used as an example",
    "primary source": "evidence from the time or from a direct witness",
    "secondary source": "a later account that interprets primary sources",
    resolution: "in a debate, the statement the two sides argue for and against",
    "burden of proof": "the duty to support a claim, resting on the one who makes it",
    "laconic": "using very few words",
    plausible: "believable, though not yet shown to be true",
    signpost: "a word or phrase telling listeners where they are in a speech",
  };
  const keysOf = (ks) => (ks && ks.length ? ks : Object.keys(TERMS));
  const termQ = (ks) => {
    const keys = keysOf(ks), t = pick(keys), others = Object.keys(TERMS).filter((k) => k !== t);
    const pool = keys.length >= 4 ? keys.filter((k) => k !== t) : others;
    if (Math.random() < 0.5)
      return mc(`What does '${t}' mean?`, TERMS[t], pool.map((k) => TERMS[k]), "Recall how the term was defined in the lessons.", `'${t[0].toUpperCase() + t.slice(1)}' means ${TERMS[t]}.`);
    return mc(`Which term means '${TERMS[t]}'?`, t, pool, "Read the definition slowly; which word was taught with it?", `That is the definition of '${t}'.`);
  };

  // ── Statements: fact / false factual claim / opinion / preference
  const K = { F: "A true factual claim (fact)", X: "A false factual claim", O: "An opinion (a judgement to argue)", P: "A preference (a matter of taste)" };
  const STMT = [
    ["Water freezes at 0 °C at sea level.", "F"], ["The Pacific is the largest ocean on Earth.", "F"], ["Spiders have eight legs.", "F"], ["Neil Armstrong walked on the Moon in 1969.", "F"],
    ["The Sun is a star.", "F"], ["Bats are mammals.", "F"], ["A triangle has three sides.", "F"], ["Honey is made by bees from nectar.", "F"],
    ["Whales are fish.", "X"], ["The Moon gives off its own light.", "X"], ["Spiders are insects.", "X"], ["Rome is the capital of Spain.", "X"],
    ["Penguins live at the North Pole.", "X"], ["Lightning never strikes the same place twice.", "X"], ["Sound travels faster than light.", "X"],
    ["Our town should build a new library.", "O"], ["Children should learn a musical instrument.", "O"], ["Homework should be limited to thirty minutes a night.", "O"],
    ["The school day should start later.", "O"], ["Zoos should only keep animals that cannot survive in the wild.", "O"], ["Every child should learn to swim.", "O"],
    ["Mint ice cream is the tastiest flavor.", "P"], ["I prefer rainy days to sunny ones.", "P"], ["Blue is the loveliest color.", "P"], ["I like reading in bed best.", "P"], ["Cats are more fun to watch than dogs.", "P"],
  ];
  const stmtQ = () => {
    const [s, k] = pick(STMT);
    const why = { F: "It can be checked against reliable sources, and it is true.", X: "It is about the world and can be checked, but it is false.", O: "It is a judgement about what ought to be; we can support or challenge it with reasons and evidence.", P: "It reports personal taste; it cannot be proved or disproved." }[k];
    return mc("What kind of statement is this?", K[k], Object.values(K), "Could it be checked? Is it true? Or is it a judgement, or a taste?", why, big(s));
  };

  // ── Arguments with tagged parts
  const ARGS = [
    { c: "We should leave for the station now", r: "the last train departs in twenty minutes", w: "Missing the last train would leave us stranded", k: "The timetable could be wrong; we should check it" },
    { c: "The class should plant a vegetable garden", r: "growing food teaches biology by observation", w: "Learning by direct observation helps pupils remember", k: "Someone must water it during the holidays" },
    { c: "You should wear a helmet when cycling", r: "helmets greatly reduce head injuries in crashes", w: "We should take simple precautions against serious harm", k: "Helmets can be uncomfortable in hot weather", g: "safety" },
    { c: "The library should stay open on Saturdays", r: "many families can visit only at weekends", w: "A public service should be available when the public can use it", k: "Weekend opening costs more in staff wages" },
    { c: "We should repair the old bridge rather than build a new one", r: "repair costs half as much and takes a third of the time", w: "When two options work equally well, choose the cheaper and quicker", k: "A new bridge might last much longer" },
    { c: "Our street needs a pedestrian crossing", r: "eleven near-misses were recorded there last year", w: "A place with many near-misses is likely to see a real accident", k: "A crossing might slow traffic on a busy road", g: "safety" },
    { c: "Children should learn to cook simple meals", r: "cooking teaches measurement, planning and independence", w: "Skills used for a lifetime are worth learning early", k: "Kitchens contain hot and sharp hazards for children" },
    { c: "The town should plant trees along Main Street", r: "shaded streets are several degrees cooler in summer", w: "Cooler streets are healthier and more pleasant in hot weather", k: "Tree roots can crack pavements" },
    { c: "You should check a quotation before you share it", r: "many famous quotations are misattributed", w: "We should not spread claims that may be false", k: "Checking takes time" },
    { c: "The museum should open in the evenings", r: "visitors queued for over an hour every afternoon last month", w: "When demand exceeds capacity, extending hours relieves crowding", k: "Evening staff would need to be paid" },
  ];
  const sentence = (a) => (Math.random() < 0.5 ? `${a.c}, because ${a.r}.` : `Since ${a.r}, ${a.c[0].toLowerCase() + a.c.slice(1)}.`);
  const cap = (s) => s[0].toUpperCase() + s.slice(1);
  const argQ = (part) => {
    const a = pick(ARGS), o = sample(ARGS.filter((x) => x !== a && !(x.g && x.g === a.g)), 2); // never offer an overlapping warrant as a distractor
    const s = sentence(a);
    if (part === "claim")
      return mc("Which part of this argument is the CLAIM?", a.c, [cap(a.r), o[0].c, cap(o[1].r)], "Which part is the speaker trying to convince you of? 'Because' and 'since' introduce the reason.", `The claim is what the speaker wants accepted: '${a.c}'. The reason is '${a.r}'.`, big(s));
    if (part === "reason")
      return mc("Which part of this argument is the REASON?", cap(a.r), [a.c, cap(o[0].r), o[1].c], "Which part answers 'Why?'", `'${cap(a.r)}' answers why we should accept '${a.c}'.`, big(s));
    if (part === "warrant")
      return mc("What is the unstated WARRANT (the general principle linking reason to claim)?", a.w, [o[0].w, o[1].w, "There is no link between them"], "What general rule must be true for this reason to support this claim?", `The bridge is: ${a.w[0].toLowerCase() + a.w.slice(1)}.`, big(s));
    return mc("Which is a fair COUNTER-ARGUMENT to this claim?", a.k, [o[0].k, "Anyone who says this is silly", o[1].k], "A counter-argument must be about THIS claim and be stated respectfully.", `'${a.k}' is a real, relevant objection to the claim. The others are about different claims, or are insults.`, big(s));
  };

  // ── Fallacies
  const FALL = {
    "Ad hominem (attacking the person)": ["You can't trust Ben's argument about the bridge; his handwriting is terrible.", "Why listen to her view on the bridge? She isn't even from this town.", "His plan for the library must be wrong; he's always so grumpy."],
    "Straw man (distorting the other view)": ["Maya wants less homework. So she thinks children should never learn anything!", "Dad suggested fewer candies. Apparently he wants us to eat nothing but cabbage.", "They want a crossing on our road, so they must want to ban cars entirely."],
    "Bandwagon (it's popular, so it's true)": ["Everyone in my class believes it, so it must be true.", "Millions of people bought this game, so it must be good for you.", "Nobody else is wearing a helmet, so helmets must be unnecessary."],
    "False authority": ["A famous footballer says this vitamin cures colds, so it does.", "My favorite singer says the Moon landing was faked, so it must have been.", "An actor who played a doctor on television recommends this medicine, so it must work."],
    "False dilemma (only two choices)": ["Either we cancel the trip or someone will get hurt.", "You're either with us completely or you're against us.", "We must either ban phones entirely or accept that no one will ever study."],
    "Slippery slope": ["If we let you stay up ten minutes later, soon you'll be up all night every night.", "If we allow one dog in the park, the park will be overrun by thousands of dogs.", "If you skip one practice, you'll give up piano forever."],
    "Hasty generalization": ["I met two rude tourists, so all tourists are rude.", "My first chess game was hard, so chess is impossible to learn.", "This apple from the bag is sour, so every apple in the shop is sour."],
    "Post hoc (after it, so because of it)": ["I wore my lucky socks and we won, so the socks made us win.", "The rooster crows, then the sun rises; so the rooster makes the sun rise.", "I took a vitamin and my cold went away the next week, so the vitamin cured it."],
    "Circular reasoning": ["This book is reliable because it says it is reliable.", "He is trustworthy because he is honest, and he is honest because he is trustworthy.", "Chocolate is the best flavor because no flavor is better."],
    "Red herring (changing the subject)": ["'Why haven't you tidied your room?' 'Did you know that octopuses have three hearts?'", "The council spent too much? Well, look how lovely the new flowers are!", "You ask whether I broke the vase, but have you seen how sunny it is?"],
    "Tu quoque (you do it too)": ["You say I shouldn't interrupt, but you interrupted yesterday!", "Why should I listen to a doctor who tells me to exercise when she never exercises herself?", "You can't tell me to save money; you bought a new coat last week."],
    "Appeal to emotion (instead of evidence)": ["Think of the poor, sad little puppies! So you must buy this dog food.", "Imagine your family's delight when you arrive in this gleaming car! Don't think; just buy it.", "Imagine how terrible you'll feel if you don't vote for me."],
  };
  const FWHY = {
    "Ad hominem (attacking the person)": "It attacks the person instead of the argument; a flawed person can still make a true point.",
    "Straw man (distorting the other view)": "It replaces the real view with an exaggerated version that is easier to knock down.",
    "Bandwagon (it's popular, so it's true)": "Popularity is not evidence; many people can be wrong.",
    "False authority": "The person is not an expert in this field, so their word is not good evidence here.",
    "False dilemma (only two choices)": "It pretends there are only two options when there are others.",
    "Slippery slope": "It claims one small step will lead to an extreme result, without evidence for each step.",
    "Hasty generalization": "It draws a sweeping conclusion from too few cases.",
    "Post hoc (after it, so because of it)": "One thing happening after another does not show that the first caused the second.",
    "Circular reasoning": "The conclusion is assumed in the reason; it proves nothing.",
    "Red herring (changing the subject)": "It distracts from the question instead of answering it.",
    "Tu quoque (you do it too)": "Someone's hypocrisy does not make their point false.",
    "Appeal to emotion (instead of evidence)": "It stirs feelings in place of giving true, relevant reasons.",
  };
  const fallQ = (names) => {
    const ns = names && names.length ? names.map((n) => Object.keys(FALL).find((k) => k.startsWith(n))) : Object.keys(FALL);
    const f = pick(ns), s = pick(FALL[f]);
    // Tu quoque is itself a kind of ad hominem, so never offer ad hominem as a "wrong" option for it.
    const wrong = (ns.length >= 4 ? ns : Object.keys(FALL)).filter((k) => !(f.startsWith("Tu quoque") && k.startsWith("Ad hominem")));
    return mc("Which fallacy is this?", f, wrong, "Ask: what is the reasoning doing instead of giving true, relevant evidence?", FWHY[f], big(s));
  };

  // ── Wordy → concise
  const WORDY = [
    ["Due to the fact that it was raining, we made the decision to stay indoors.", "Because it was raining, we stayed indoors.", "It rained.", "We stayed indoors, as is usual."],
    ["At this point in time, the library is currently closed for the purpose of cleaning.", "The library is closed now for cleaning.", "The library is closed forever.", "Cleaning."],
    ["In my personal opinion, I think that the bridge is in need of repair.", "I think the bridge needs repair.", "The bridge has collapsed.", "Bridges."],
    ["The meeting was attended by a total of twelve people in number.", "Twelve people attended the meeting.", "Some people attended.", "The meeting was canceled."],
    ["He gave a brief summary in short of the main and most important points.", "He briefly summarized the main points.", "He spoke.", "He summarized every detail at length."],
    ["Each and every pupil must, without exception, hand in the work by Friday.", "Every pupil must hand in the work by Friday.", "Pupils may hand in work whenever.", "Hand in."],
    ["It is absolutely essential and necessary that you water the seedlings daily.", "You must water the seedlings daily.", "Water the seedlings sometimes.", "Seedlings are plants."],
    ["The reason why the cake fell is because the oven door was opened too early.", "The cake fell because the oven door was opened too early.", "The cake fell.", "Ovens have doors."],
  ];
  const wordyQ = () => {
    const [w, c, ...bad] = pick(WORDY);
    return mc("Which version is clearest and most concise WITHOUT changing the meaning?", c, [w, ...bad], "Cut repeated ideas, but keep every fact.", `'${c}' keeps the whole meaning in ${wc(c)} words instead of ${wc(w)}. The others change the meaning or keep the padding.`, big(w));
  };
  const wordyNum = () => {
    const [w, c] = pick(WORDY);
    return { q: "How many words shorter is the concise version than the wordy one?", type: "number", answer: wc(w) - wc(c), hint: "Count the words in each sentence and subtract.", why: `The wordy version has ${wc(w)} words and the concise one ${wc(c)}: ${wc(w)} − ${wc(c)} = ${wc(w) - wc(c)}.`, show: { type: "table", rows: [["Wordy", w], ["Concise", c]] } };
  };
  const REDUND = ["free gift", "end result", "past history", "advance warning", "true fact", "return back", "unexpected surprise", "join together", "final outcome", "repeat again", "added bonus", "close proximity"];
  const NONRED = ["kind gift", "surprising result", "family history", "early warning", "useful fact", "come back", "pleasant surprise", "work together", "likely outcome", "say again", "small bonus", "close friend"];
  const redundQ = () => mc("Which phrase is REDUNDANT (says the same thing twice)?", pick(REDUND), NONRED, "In which phrase does one word already contain the meaning of the other?", "In a redundant phrase one word adds nothing: every gift is free, every result is at the end, all history is past.");

  // ── Active / passive
  const VOICE = [
    ["The committee rejected the plan.", "The plan was rejected by the committee."], ["The dog chased the ball.", "The ball was chased by the dog."],
    ["Archimedes discovered the principle of buoyancy.", "The principle of buoyancy was discovered by Archimedes."], ["The storm damaged the roof.", "The roof was damaged by the storm."],
    ["Carter found the tomb.", "The tomb was found by Carter."], ["I broke the window.", "The window was broken by me."], ["The council closed the library.", "The library was closed by the council."],
  ];
  const voiceQ = () => {
    const p = pick(VOICE), o = sample(VOICE.filter((x) => x !== p), 2);
    if (Math.random() < 0.5) return mc("Which sentence is in the ACTIVE voice?", p[0], [p[1], o[0][1], o[1][1]], "In the active voice, the subject does the action.", `In '${p[0]}' the subject performs the action.`);
    return mc("Rewrite in the active voice.", p[0], [p[1], o[0][0], p[1].replace(/ by .*$/, ".")], "Make the doer of the action the subject.", `The doer becomes the subject: '${p[0]}'.`, big(p[1]));
  };

  // ── Syllogisms
  const V = { s: "Valid and sound", u: "Valid but unsound (a false premise)", i: "Invalid (the conclusion does not follow)" };
  const SYLL = [
    ["All mammals breathe air.", "Whales are mammals.", "Whales breathe air.", "s"], ["All metals conduct electricity.", "Copper is a metal.", "Copper conducts electricity.", "s"],
    ["No reptiles have fur.", "All snakes are reptiles.", "No snakes have fur.", "s"], ["All squares have four sides.", "A chessboard is a square.", "A chessboard has four sides.", "s"],
    ["All birds can fly.", "Penguins are birds.", "Penguins can fly.", "u"], ["All fish can climb trees.", "A salmon is a fish.", "A salmon can climb trees.", "u"],
    ["All planets are made of cheese.", "Mars is a planet.", "Mars is made of cheese.", "u"], ["Every insect has eight legs.", "An ant is an insect.", "An ant has eight legs.", "u"],
    ["Some students like chess.", "Ada is a student.", "Ada likes chess.", "i"], ["All cats are animals.", "All dogs are animals.", "All dogs are cats.", "i"],
    ["If it rains, the ground is wet.", "The ground is wet.", "It rained.", "i"], ["All roses are flowers.", "Some flowers fade quickly.", "Some roses fade quickly.", "i"],
  ];
  const syllQ = () => {
    const [a, b, c, k] = pick(SYLL);
    const why = { s: "The conclusion follows necessarily, and both premises are true.", u: "The shape is valid, but a premise is false, so the conclusion is not guaranteed.", i: "Even if the premises were true, the conclusion would not have to be true." }[k];
    return mc("Judge this argument.", V[k], Object.values(V), "First: if the premises were true, MUST the conclusion be true? Then: are the premises actually true?", why, { type: "table", rows: [["Premise", a], ["Premise", b], ["Conclusion", "Therefore, " + c[0].toLowerCase() + c.slice(1)]] });
  };

  // ── Sources
  const SRC = [
    ["A traveler's letter written the day after a great storm", 1], ["The astronauts' radio recordings from the Moon landing", 1], ["A coin minted during Julius Caesar's life", 1],
    ["Howard Carter's excavation notebook from 1922", 1], ["A photograph taken at the opening of a bridge", 1], ["Benjamin Franklin's own Autobiography (begun in 1771)", 1],
    ["A modern encyclopedia article on ancient Egypt", 0], ["A textbook chapter about the Roman Empire", 0], ["A documentary film about the Greeks made last year", 0],
    ["A website summarizing Shakespeare's plays", 0], ["A biography of Archimedes written in 2010", 0],
  ];
  const srcQ = () => {
    const [d, p] = pick(SRC);

  const thesisQ = () => { const [s, t] = pick(THESIS); return mc("Which of the four heads of argument does this reason use?", t, uniq(THESIS.map((x) => x[1])), "Is it about right and wrong, usefulness, possibility, or nobility?", `This reason argues from what is ${t.split(" ")[0].toLowerCase()}.`, big(s)); };

  const PSALM = [

        { q: "Which is the best contracted (shortest accurate) version of the fable?", options: ["The Wind's force made a traveler grip his cloak; the Sun's warmth made him remove it.", "The Wind won because he was strong.", "There once was a wind.", "The Sun is hot and the Wind is cold, and a man had a cloak that was brown."], answer: "The Wind's force made a traveler grip his cloak; the Sun's warmth made him remove it.", hint: "A contracted version must still contain the turn and the outcome.", why: "Only the first keeps the whole shape (both attempts and the result) in one sentence. The last one is false.", show: { type: "passage", title: "The North Wind and the Sun (retold from Aesop)", text: "The North Wind and the Sun argued about which of them was stronger. They agreed that whoever could make a traveler take off his cloak would be the winner.\n\nThe Wind blew with all his might. But the harder he blew, the more tightly the traveler wrapped his cloak around himself.\n\nThen the Sun shone out warmly. The traveler grew hot, loosened his cloak, and at last took it off and rested in the shade.\n\nMoral: Gentle persuasion succeeds where force fails." } },
        { q: "Which is a fact about the fable rather than an opinion?", options: ["It is the best of Aesop's fables", "The Sun was the nicer character", "The traveler was foolish", "The Wind tried first"], answer: "The Wind tried first", hint: "A fact can be checked in the text.", why: "We can check in the text that the Wind tried first. The others are judgements.", show: { type: "passage", title: "The North Wind and the Sun (retold from Aesop)", text: "The North Wind and the Sun argued about which of them was stronger. They agreed that whoever could make a traveler take off his cloak would be the winner.\n\nThe Wind blew with all his might. But the harder he blew, the more tightly the traveler wrapped his cloak around himself.\n\nThen the Sun shone out warmly. The traveler grew hot, loosened his cloak, and at last took it off and rested in the shade.\n\nMoral: Gentle persuasion succeeds where force fails." } },
        { q: "Put the events of the fable in order.", type: "order", items: ["The Sun shines warmly", "The traveler removes his cloak", "The Wind and Sun agree on a contest", "The Wind blows hard", "The traveler grips his cloak"], answer: ["The Wind and Sun agree on a contest", "The Wind blows hard", "The traveler grips his cloak", "The Sun shines warmly", "The traveler removes his cloak"], hint: "Which event must happen before any contest can begin?", why: "The contest is agreed; then the first attempt, its failure, the second attempt, and its success.", show: { type: "passage", title: "The North Wind and the Sun (retold from Aesop)", text: "The North Wind and the Sun argued about which of them was stronger. They agreed that whoever could make a traveler take off his cloak would be the winner.\n\nThe Wind blew with all his might. But the harder he blew, the more tightly the traveler wrapped his cloak around himself.\n\nThen the Sun shone out warmly. The traveler grew hot, loosened his cloak, and at last took it off and rested in the shade.\n\nMoral: Gentle persuasion succeeds where force fails." } },
        { q: "A fable shows a fox failing to reach grapes and then calling them sour. What human habit does it describe?", options: ["Working hard until we succeed", "Telling the truth about our failures", "Sharing food with friends", "Pretending we did not want what we could not get"], answer: "Pretending we did not want what we could not get", hint: "Did the fox really believe the grapes were sour, before he failed?", why: "He wanted them; after failing, he despised them. We call this 'sour grapes'." },
        { q: "Why is a fable NOT good evidence that its moral is true?", options: ["It was written long ago", "It is too short", "It has animals in it", "It is an invented story"], answer: "It is an invented story", hint: "Did the events really happen?", why: "An invented story can illustrate any lesson, true or false. Evidence must come from real events." },
        { q: "Is 'gentle persuasion always succeeds where force fails' true in every case?", options: ["No; sometimes force is needed, as when stopping someone from harming another", "It cannot be thought about", "Yes, always and everywhere"], answer: "No; sometimes force is needed, as when stopping someone from harming another", hint: "Can you imagine one counter-example (a case where it is false)?", why: "A single counter-example shows a rule is not always true. Morals are usually generalizations: true often, not always." },
        { q: "You retell the fable from the traveler's point of view. Which sentence fits?", options: ["The traveler did not know what was happening.", "The Sun smiled at its victory.", "I, the North Wind, blew with all my might.", "First a bitter wind tore at me, so I held my cloak with both hands."], answer: "First a bitter wind tore at me, so I held my cloak with both hands.", hint: "Who is 'I' in the traveler's version?", why: "In the traveler's point of view, 'I' is the traveler, describing what he felt.", show: { type: "passage", title: "The North Wind and the Sun (retold from Aesop)", text: "The North Wind and the Sun argued about which of them was stronger. They agreed that whoever could make a traveler take off his cloak would be the winner.\n\nThe Wind blew with all his might. But the harder he blew, the more tightly the traveler wrapped his cloak around himself.\n\nThen the Sun shone out warmly. The traveler grew hot, loosened his cloak, and at last took it off and rested in the shade.\n\nMoral: Gentle persuasion succeeds where force fails." } },

        { q: "Why do fables often use animals instead of people?", options: ["Animals can stand for human types without offending any real person", "Aesop could not write about people", "People never act like that", "Animals are easier to draw"], answer: "Animals can stand for human types without offending any real person", hint: "Would the greedy dog remind you of a particular neighbor?", why: "Animals represent types (the proud, the greedy), so the lesson applies to everyone and accuses no one." },
        { q: "In a fable, the turn is:", options: ["The moral", "The first sentence", "The title", "The moment the situation reverses"], answer: "The moment the situation reverses", hint: "Think of the Sun shining out.", why: "The turn is where events change direction." },
        { q: "Which is an expanded retelling technique?", options: ["Changing the outcome", "Cutting the story to one sentence", "Adding dialogue between the Wind and the Sun", "Removing the moral"], answer: "Adding dialogue between the Wind and the Sun", hint: "Expansion adds; it never changes the outcome.", why: "Dialogue adds detail while keeping the same events and moral." },
        { q: "A student retells 'The Tortoise and the Hare' and lets the Hare win. What has she done wrong?", options: ["Made it too short", "Changed the outcome, so the moral no longer follows", "Nothing", "Used her own words"], answer: "Changed the outcome, so the moral no longer follows", hint: "Can the original moral still follow?", why: "Retelling may change the words and point of view, but not the events that prove the moral." },
        { q: "Order the parts of a fable's shape.", type: "order", items: ["Situation", "Resolution", "Conflict", "Moral", "Turn"], answer: ["Situation", "Conflict", "Turn", "Resolution", "Moral"], hint: "What comes after the problem appears?", why: "Situation, conflict, turn, resolution, then the moral." },

      ], challenge: [
        { q: "In 'The Tortoise and the Hare', the Hare loses because he naps. A student says the moral is 'slow is better than fast'. What is the strongest objection?", options: ["Hares never sleep", "The story is too old to matter", "The Tortoise was secretly fast", "The Hare lost by overconfidence and laziness, not by speed; the true moral concerns steady effort"], answer: "The Hare lost by overconfidence and laziness, not by speed; the true moral concerns steady effort", hint: "Did speed cause the Hare's loss, or something he chose to do?", why: "The cause of the loss was the nap. A moral must follow from what actually causes the outcome in the story, so 'slow is better' misreads the story." },
        { q: "A speaker uses 'The Boy Who Cried Wolf' to argue that a particular witness is lying today. What is wrong with this reasoning?", options: ["The fable shows liars lose trust, but gives no evidence that this witness lied", "Nothing; the fable proves it", "Fables can never be used in speeches", "The fable is about sheep"], answer: "The fable shows liars lose trust, but gives no evidence that this witness lied", hint: "Does a story about one invented boy tell us facts about a real person?", why: "The fable may illustrate a general truth, but whether this witness lied must be shown by evidence about the witness." },
        { q: "Arrange this expanded retelling into the correct fable shape.", type: "order", items: ["Moral: patience and ingenuity overcome difficulty.", "A crow found a jar with a little water at the bottom.", "The water rose, and she drank.", "Her beak could not reach the water.", "She dropped pebbles in, one by one."], answer: ["A crow found a jar with a little water at the bottom.", "Her beak could not reach the water.", "She dropped pebbles in, one by one.", "The water rose, and she drank.", "Moral: patience and ingenuity overcome difficulty."], hint: "Which sentence is the situation, and which is the turn?", why: "Situation (the jar), conflict (cannot reach), turn (pebbles), resolution (she drinks), moral." },
        { gen: () => RH.fableQ() },
        { q: "'The Fox and the Crow' warns against flattery. Which situation in a speech is closest to it?", options: ["A speaker thanks the audience sincerely", "A speaker pauses", "A speaker praises the audience lavishly so that they will stop checking his facts", "A speaker gives three reasons"], answer: "A speaker praises the audience lavishly so that they will stop checking his facts", hint: "Who is the fox, and what is the cheese?", why: "Lavish praise used to lower the audience's guard is the fox's trick: flattery to gain something." },
        { q: "A student claims that 'The Tortoise and the Hare' (slow and steady wins) and 'The Ant and the Grasshopper' (prepare early) teach conflicting morals. Do they?", options: ["Neither has a moral", "No: both praise patient, steady work over careless ease", "Yes, completely", "Only one can be true"], answer: "No: both praise patient, steady work over careless ease", hint: "What do the tortoise and the ant have in common?", why: "Both reward steady effort; the morals are compatible." }
      ], extend: "Read ten of Aesop's fables (Townsend's 1867 translation is public domain). For each, write the moral in under ten words, then mark it A (always true), U (usually true) or Q (questionable), with one sentence of reason.", offline: "Retell a fable of your choice to the family in exactly one minute (a grown-up times it), in your own words. Then retell it in 20 seconds. Which details did you keep, and why?" },
    { title: "Précis and paraphrase", icon: "✂️", learn: [
        { say: "To communicate clearly you must first understand clearly. Two essential tools are the <b>paraphrase</b> (saying the same idea in your own words, about the same length) and the <b>précis</b> (a short, exact summary; French for 'precise').", show: { type: "passage", title: "Tool · Length · Purpose", text: "Paraphrase — Length: About the same; Purpose: Prove you understood each idea\n\nPrécis (summary) — Length: Much shorter, often a third or less; Purpose: Keep only the main idea and key support\n\nQuotation — Length: Exact words, in quotation marks; Purpose: When the wording itself matters" } },
        { say: "Read this paragraph. Find its <b>main idea</b>: the one claim that all the other sentences support.", show: { type: "passage", title: "How bees make honey", text: "Bees do not make honey simply by collecting it. A worker bee sucks nectar from flowers and stores it in a special stomach. Back at the hive, she passes it to other bees, who chew it and add enzymes, chemicals that break the sugars into simpler ones. The bees then spread the liquid in wax cells and fan it with their wings until most of the water evaporates. Only then do they seal the cell with wax. Honey, in short, is nectar that bees have transformed." } },
        { say: "The main idea is often in the first or last sentence. Here the first says bees do not merely collect honey, and the last sums up: <b>honey is nectar that bees have transformed</b>. The middle sentences are the steps that support it.", show: { type: "big", text: "Main idea: honey is nectar\nthat bees transform." } },
        { say: "A précis follows strict rules: keep the main idea and essential steps; remove examples, repetitions and decoration; use your own words; never add anything that was not in the original; and never change its meaning.", show: { type: "list", items: ["Keep: main idea, essential support", "Cut: examples, repetition, decoration", "Use your own words", "Add nothing; change nothing"] } },
        { say: "A good précis of the bee paragraph: <b>Bees turn nectar into honey: they swallow it, pass it on, add enzymes, and evaporate its water before sealing it in wax.</b> That keeps every essential step in one sentence.", show: { type: "big", text: "Paragraph: 86 words\nPrécis: 22 words" } },
        { say: "A paraphrase must change the <b>words</b> but keep the <b>meaning</b>. Swapping a few words for synonyms while keeping the original's sentence pattern is not paraphrase; it is disguised copying. And if your version says something the original did not, it is a distortion (a twisting of the meaning).", show: { type: "table", rows: [
              ["Original", "A gentle answer turns away wrath, […] (Proverbs 15:1, WEB)"],
              ["Good paraphrase", "Replying softly can calm someone who is angry."],
              ["Distortion", "You should never be angry."]
            ] } },
        { say: "<b>Explain it.</b> What is the difference between a paraphrase and a précis? Then give a one-sentence précis of the bee paragraph without looking at it.", show: { type: "passage", title: "Explain it", text: "What is the difference between a paraphrase and a précis? Then give a one-sentence précis of the bee paragraph without looking at it.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise terms from this lesson." } }
      ], practice: [
        { q: "Which sentence best states the main idea of the bee paragraph?", options: ["Flowers make nectar", "Honey is nectar that bees transform", "Wax cells are sealed", "Bees have wings"], answer: "Honey is nectar that bees transform", hint: "Which sentence do all the others support?", why: "Every step in the paragraph explains how nectar becomes honey.", show: { type: "passage", title: "How bees make honey", text: "Bees do not make honey simply by collecting it. A worker bee sucks nectar from flowers and stores it in a special stomach. Back at the hive, she passes it to other bees, who chew it and add enzymes, chemicals that break the sugars into simpler ones. The bees then spread the liquid in wax cells and fan it with their wings until most of the water evaporates. Only then do they seal the cell with wax. Honey, in short, is nectar that bees have transformed." } },
        { q: "Which detail would you CUT first from a précis of the bee paragraph?", options: ["That bees change the nectar", "That water evaporates", "That enzymes are chemicals (a definition)", "That nectar is the starting material"], answer: "That enzymes are chemicals (a definition)", hint: "Which item explains a word rather than a step?", why: "The definition of enzymes helps a reader, but the essential process survives without it.", show: { type: "passage", title: "How bees make honey", text: "Bees do not make honey simply by collecting it. A worker bee sucks nectar from flowers and stores it in a special stomach. Back at the hive, she passes it to other bees, who chew it and add enzymes, chemicals that break the sugars into simpler ones. The bees then spread the liquid in wax cells and fan it with their wings until most of the water evaporates. Only then do they seal the cell with wax. Honey, in short, is nectar that bees have transformed." } },
        { q: "Which is a paraphrase of 'The bees fan the liquid with their wings until most of the water evaporates'?", options: ["Bees add water to the liquid", "By beating their wings over it, the bees dry the liquid out", "The bees fan the liquid with their wings until most water evaporates", "Bees like wind"], answer: "By beating their wings over it, the bees dry the liquid out", hint: "Which version uses new words but keeps the same meaning?", why: "The first keeps the meaning in new words. The second is copying; the last two change the meaning." },
        { q: "A student writes: 'Bees make honey by collecting it from flowers.' What is wrong with this as a summary?", options: ["It is too long", "It uses quotation marks", "It contradicts the paragraph, which says they do NOT merely collect it", "Nothing; it is perfect"], answer: "It contradicts the paragraph, which says they do NOT merely collect it", hint: "Read the paragraph's first sentence again.", why: "A summary must never change the original's meaning. This one states the very idea the paragraph denies." },
        { q: "How many words are in this sentence: 'Honey, in short, is nectar that bees have transformed.'?", type: "number", answer: 9, hint: "Count each word, ignoring punctuation.", why: "Honey(1) in(2) short(3) is(4) nectar(5) that(6) bees(7) have(8) transformed(9)." },
        { q: "Which is the best one-sentence précis? 'Lighthouses were built on dangerous coasts. Their lamps, magnified by lenses, warned ships of rocks at night. Before lighthouses, many ships were wrecked.'", options: ["Lighthouses are tall and beautiful.", "Lighthouses warned ships away from dangerous rocks at night, reducing wrecks.", "Many ships were wrecked.", "Lighthouses have lenses."], answer: "Lighthouses warned ships away from dangerous rocks at night, reducing wrecks.", hint: "Which version keeps the purpose of lighthouses and the result?", why: "It includes what lighthouses did and why it mattered; the others keep only a detail or add an opinion." },
        { q: "'Many hands make light work.' Which is an accurate paraphrase?", options: ["Work should be done in daylight", "Only big groups can work", "Hands are light", "When many people help, a task becomes easier"], answer: "When many people help, a task becomes easier", hint: "'Light' here means 'not heavy', not 'bright'.", why: "The proverb means a job is easier when shared." },
        { q: "Which rule of précis did this student break? Original: 'The village was small.' Précis: 'The tiny, poor village was small and sad.'", options: ["She used her own words", "She made it too short", "She added things that were not in the original", "She kept the main idea"], answer: "She added things that were not in the original", hint: "Does the original mention poverty or sadness?", why: "A précis may never add information. 'Poor' and 'sad' were invented." },
        { q: "Order the steps for writing a précis.", type: "order", items: ["Read the whole passage carefully", "Find the main idea", "Check it against the original", "Write it in your own words", "Mark the essential support"], answer: ["Read the whole passage carefully", "Find the main idea", "Mark the essential support", "Write it in your own words", "Check it against the original"], hint: "You cannot find a main idea before you have read.", why: "Read, identify, select, write, and finally check that nothing is added or changed." },
        { q: "When should you quote exact words instead of paraphrasing?", options: ["When you do not understand the text", "Never", "When the precise wording itself matters, as in a famous line or a law", "Always, so you never have to think"], answer: "When the precise wording itself matters, as in a famous line or a law", hint: "Why do we keep the exact words of a psalm we recite?", why: "Quote when the wording carries meaning or force; otherwise paraphrase to show understanding." },
        { q: "'He who gives answer before he hears, that is folly and shame to him.' (Proverbs 18:13, WEB). Which paraphrase is accurate?", options: ["Replying before you have listened is foolish and shameful", "Listening is shameful", "Shame makes people foolish", "Never answer any question"], answer: "Replying before you have listened is foolish and shameful", hint: "What does the person do too early?", why: "The proverb condemns answering before listening." },
        { q: "A paragraph's first sentence says 'Owls are remarkable night hunters.' Its other sentences describe their silent feathers, huge eyes and sharp hearing. What role do those other sentences play?", options: ["They support the main idea with evidence", "They begin a new topic", "They contradict the first sentence", "They are the conclusion"], answer: "They support the main idea with evidence", hint: "How do feathers, eyes and hearing relate to 'night hunters'?", why: "Each detail is evidence for the opening claim, which is the main idea." },

        { q: "Disguised copying is:", options: ["Quoting with quotation marks", "Keeping the original sentence pattern and swapping a few words", "Paraphrasing in new sentences", "Writing a précis"], answer: "Keeping the original sentence pattern and swapping a few words", hint: "Is it really your own expression?", why: "Changing a few words while keeping the structure is still copying." },

      ], challenge: [
        { q: "Original: 'Although the bridge looked solid, engineers found that its iron had rusted from within, and they closed it.' Which précis keeps the logic as well as the facts?", options: ["Engineers closed the bridge because hidden rust had weakened it, despite its solid look.", "Engineers like closing bridges.", "The bridge looked solid and was closed.", "Rust is made of iron."], answer: "Engineers closed the bridge because hidden rust had weakened it, despite its solid look.", hint: "A good précis keeps the 'because' and the 'although'.", why: "The original's meaning lies in the cause (hidden rust) and the contrast (looked solid). The second option drops the cause and so loses the meaning." },
        { q: "Which change turns an honest summary into a distortion? Original: 'Some doctors think the new medicine may help some patients.'", options: ["'Some doctors believe the medicine might help certain patients.'", "'Doctors say the new medicine works.'", "'A few doctors suspect the medicine could benefit some patients.'"], answer: "'Doctors say the new medicine works.'", hint: "Look for words that were made stronger than the original.", why: "'Some' became 'doctors' (all), and 'may help some' became 'works'. Strengthening a cautious claim is a distortion, even if every word sounds similar." },
        { q: "Count the words in this précis: 'Bees turn nectar into honey: they swallow it, pass it on, add enzymes, and evaporate its water before sealing it in wax.'", type: "number", answer: 22, hint: "Count carefully; 'it' appears more than once.", why: "There are 22 words, about a quarter of the original 86-word paragraph." },
        { gen: () => RH.precisQ() },
        { q: "Original: 'Few historians doubt that the Library of Alexandria declined over centuries, though popular stories blame a single great fire.' Which précis is faithful?", options: ["The Library of Alexandria burned in one great fire.", "Most historians think the Library declined gradually, not in one fire as legend says.", "Historians know nothing about the Library.", "The Library was destroyed by historians."], answer: "Most historians think the Library declined gradually, not in one fire as legend says.", hint: "What does the original say historians believe, and what does it say about the fire story?", why: "The original contrasts the historians' view (gradual decline) with the popular story (one fire); a faithful précis keeps that contrast." }

    { title: "Delivery: voice, posture and eyes", icon: "🎙️", learn: [
        { say: "Delivery is the fifth canon. A clear idea mumbled to the floor is lost. Shakespeare's Hamlet gives actors advice that every speaker can use.", show: { type: "passage", title: "Shakespeare, Hamlet, Act 3, Scene 2", text: "Speak the speech, I pray you, as I pronounced it to you, trippingly on the tongue. But if you mouth it, as many of your players do, I had as lief the town-crier spoke my lines. Nor do not saw the air too much with your hand, thus, but use all gently; […]\n\n[…] Suit the action to the word, the word to the action, […]" } },
        { say: "Hamlet means: speak lightly and clearly ('trippingly'), do not overact or wave your arms wildly ('saw the air'), and make your gestures match your words. 'I had as lief' means 'I would just as soon'.", show: { type: "passage", title: "Hamlet says · Meaning", text: "trippingly on the tongue: light, quick, clear\n\nmouth it: over-pronounce, ham it up\n\nsaw the air: wave your arms about\n\nsuit the action to the word: gestures match meaning" } },
        { say: "Six skills of delivery. <b>Posture</b>: stand tall, feet planted, weight even. <b>Eye contact</b>: look at people, one at a time. <b>Volume</b>: loud enough for the back row. <b>Pace</b>: unhurried. <b>Pauses</b>: silence before and after important ideas. <b>Articulation</b>: every consonant crisp.", show: { type: "list", items: ["Posture: tall, still, planted", "Eye contact: one face at a time", "Volume: reach the back wall", "Pace: about 130–150 words a minute", "Pauses: before and after key ideas", "Articulation: crisp consonants"] } },
        { say: "Pace can be measured. Many clear speakers talk at about 130 to 150 words per minute. Nervous speakers often race at 200 or more, and listeners cannot keep up.", show: { type: "bars", values: [
              ["Calm", 130],
              ["Clear", 150],
              ["Rushed", 200],
              ["Racing", 240]
            ], caption: "Words per minute" } },
        { say: "A pause is not empty; it is emphasis. Pause <b>before</b> a key word to build attention, and <b>after</b> it to let it sink in. Replace 'um' and 'like' with a silent breath.", show: { type: "big", text: "I have one request ... | ... tell the truth. | (pause)" } },
        { say: "Plutarch reports, on the word of Demetrius of Phalerum, that the great Athenian orator Demosthenes was born with a stammer and a weak voice, and overcame both by stubborn practice. Skill in delivery is built, not born.", show: { type: "passage", title: "Plutarch, Life of Demosthenes (Dryden translation, rev. A. H. Clough)", text: "[…] his inarticulate and stammering pronunciation he overcame and rendered more distinct by speaking with pebbles in his mouth; his voice he disciplined by declaiming and reciting speeches or verses when he was out of breath, while running or going up steep places; and that in his house he had a large looking-glass, before which he would stand and go through his exercises. […]" } },
        { say: "<b>Explain it.</b> Name the six skills of delivery, and explain which one you think is hardest for you and how you will practice it, as Demosthenes did.", show: { type: "passage", title: "Explain it", text: "Name the six skills of delivery, and explain which one you think is hardest for you and how you will practice it, as Demosthenes did.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise terms from this lesson." } }
      ], practice: [
        { q: "What did Hamlet mean by 'Nor do not saw the air too much with your hand'?", options: ["Do not wave your arms about wildly", "Speak more loudly", "Saw wood before speaking", "Never use your hands"], answer: "Do not wave your arms about wildly", hint: "Picture someone sawing: the arm goes back and forth, back and forth.", why: "He warns against wild, repetitive gestures; he still says 'use all gently', so some gesture is fine." },
        { q: "'Suit the action to the word' means:", options: ["Act first, then speak", "Wear a suit when speaking", "Make your gestures match what you are saying", "Speak without moving at all"], answer: "Make your gestures match what you are saying", hint: "'Suit' here is a verb, meaning 'make fit'.", why: "Gestures should fit the meaning: a small gesture for 'tiny', an open hand for 'welcome'." },
        { q: "Which posture is best for a speech?", options: ["Looking down at your shoes", "Swaying from side to side", "Standing tall, feet planted, hands relaxed", "Leaning on one leg with arms crossed"], answer: "Standing tall, feet planted, hands relaxed", hint: "Which posture shows confidence and lets you breathe well?", why: "An upright, still posture helps breathing and shows the audience you are confident." },
        { q: "How should you make eye contact with a group?", options: ["Stare at the ceiling", "Look at one person for a phrase or sentence, then another", "Glance quickly at everyone at once", "Look only at the friendliest person"], answer: "Look at one person for a phrase or sentence, then another", hint: "How do you speak to a friend at the table?", why: "Speaking to one face at a time makes each listener feel addressed." },
        { q: "Where should a pause go to give an important word the most emphasis?", options: ["In the middle of a word", "Nowhere; pauses waste time", "Just before and just after it", "Only at the end of the speech"], answer: "Just before and just after it", hint: "A pause makes listeners wait. What are they waiting for?", why: "Silence before a word builds attention; silence after lets it sink in." },
        { q: "A speaker reads 300 words in 2 minutes. How many words per minute is that?", type: "number", answer: 150, hint: "Divide words by minutes.", why: "300 ÷ 2 = 150 words per minute: a clear pace." },
        { q: "You want to give a 3-minute speech at 140 words per minute. About how many words should you write?", type: "number", answer: 420, hint: "Multiply words per minute by minutes.", why: "140 × 3 = 420 words." },
        { q: "A nervous speaker races at 220 words per minute. Which advice will help most?", options: ["Breathe and pause at each period", "Add more 'ums'", "Speak faster to finish sooner", "Look at the floor"], answer: "Breathe and pause at each period", hint: "What slows speech without making it sound strange?", why: "Pauses at periods lower the pace and give the audience time to understand." },
        { q: "Which is the best replacement for 'um' while thinking?", options: ["'You know'", "'Like'", "A silent pause", "Speaking faster"], answer: "A silent pause", hint: "What sounds confident to listeners?", why: "A short silence sounds thoughtful; fillers sound unsure." },
        { q: "'Articulation' means:", options: ["Speaking loudly", "Choosing long words", "Waving your arms", "Pronouncing each sound clearly"], answer: "Pronouncing each sound clearly", hint: "Think of the joints (articulations) of a finger: each part is distinct.", why: "Articulation is the clear forming of each sound, especially consonants." },
        { q: "Why did Demosthenes recite speeches while running or climbing steep places?", options: ["To learn geography", "To strengthen his voice and breath", "To hide from his audience", "Because he was late"], answer: "To strengthen his voice and breath", hint: "What is hard to do when you are out of breath?", why: "Speaking while short of breath trained his lungs and voice, so that ordinary speaking became easy." },
        { q: "Order these from slowest to fastest speaking rate.", type: "order", items: ["180 words per minute", "120 words per minute", "150 words per minute", "240 words per minute"], answer: ["120 words per minute", "150 words per minute", "180 words per minute", "240 words per minute"], hint: "Smaller number of words per minute means slower.", why: "120 < 150 < 180 < 240." },
        { q: "Which is the strongest evidence that a speaker's volume was right?", options: ["A listener in the back row repeats the key point correctly", "The speech was short", "The speaker felt loud", "The speaker's face was red"], answer: "A listener in the back row repeats the key point correctly", hint: "How can you test, not guess, whether people heard?", why: "The test is whether the farthest listener actually heard and understood. Feelings are not evidence." },

        { q: "Before a speech you feel nervous. Which is the most helpful thing to do?", options: ["Breathe slowly and remember your first sentence", "Look at the floor", "Speak faster to get it over with", "Tell the audience you are terrible"], answer: "Breathe slowly and remember your first sentence", hint: "What steadies the voice?", why: "Slow breathing calms the body, and a well-learned opening carries you into the speech." },

        { q: "A speaker shouts every sentence to show passion. Why does this weaken the speech?", options: ["When everything is loud, nothing stands out as important", "Audiences cannot hear loud voices", "Shouting is always against the rules", "Loudness makes words false"], answer: "When everything is loud, nothing stands out as important", hint: "Emphasis works by contrast. What happens if there is no contrast?", why: "Emphasis depends on variation; constant volume removes the contrast that marks key ideas." },

      ], extend: "Read Hamlet's full advice to the players (Act 3, Scene 2, from 'Speak the speech' to 'make the unskilful laugh'). Choose three pieces of advice and demonstrate each, doing it wrongly and then rightly, for a grown-up.", offline: "Recite Psalm 19:14 (WEB) to the family: 'Let the words of my mouth and the meditation of my heart be acceptable in your sight, Yahweh, my rock, and my redeemer.' Stand tall, look at three different people, pause before 'my rock', and speak slowly." },
    { title: "Narrative: telling what happened", icon: "📜", learn: [
        { say: "The second exercise in Aphthonius' ladder is <b>narrative</b> (Greek diegesis): an account of events, true or invented, told in order. The rhetoric teacher Theon said every narrative contains six elements.", show: { type: "passage", title: "Element · Question · Example", text: "Person — Question: Who?; Example: Howard Carter\n\nAction — Question: What?; Example: found a sealed tomb\n\nPlace — Question: Where?; Example: Valley of the Kings, Egypt\n\nTime — Question: When?; Example: November 1922\n\nManner — Question: How?; Example: by candlelight, through a small hole\n\nCause — Question: Why?; Example: after years of searching for it" } },
        { say: "Read this true narrative. Watch how each sentence moves forward in time, and how the most exciting detail is saved for the end.", show: { type: "passage", title: "Wonderful things (a narrative)", text: "In November 1922, in the Valley of the Kings in Egypt, the archaeologist Howard Carter reached a sealed doorway he had spent years searching for. He made a small hole in the top corner, held up a candle, and peered inside. At first the hot air rushing out made the flame flicker. Then, as his eyes grew used to the light, he saw strange animals, statues and gold, everywhere the glint of gold. His patron, Lord Carnarvon, asked whether he could see anything. Carter later wrote that he could only answer: 'Yes, wonderful things.' He had found the tomb of the boy-king Tutankhamun, almost untouched for more than three thousand years." } },
        { say: "Ancient teachers named three virtues of a narrative. <b>Clarity</b>: the listener never wonders who did what. <b>Brevity</b>: nothing irrelevant. <b>Plausibility</b>: it hangs together and fits what we know.", show: { type: "list", items: ["Clarity: who did what is never in doubt", "Brevity: every sentence earns its place", "Plausibility: consistent and believable"] } },
        { say: "Careful: plausibility is not the same as truth. A made-up story can sound believable; a true story can sound astonishing. For a narrative that claims to be <b>true</b>, we must ask for evidence: who saw it, and who recorded it?", show: { type: "big", text: "Plausible = it could be so.\nTrue = it is so.\nEvidence tells them apart." } },
        { say: "Notice the words 'Carter <b>later wrote</b>'. No recording exists; we know his reply from his own published account. An honest narrator names the source instead of pretending to have been there. Here are Carter's exact words.", show: { type: "passage", title: "Howard Carter and A. C. Mace, The Tomb of Tut.ankh.Amen, vol. I (1923)", text: "[…] With trembling hands I made a tiny breach in the upper left hand corner. Darkness and blank space, as far as an iron testing-rod could reach, showed that whatever lay beyond was empty, and not filled like the passage we had just cleared. Candle tests were applied as a precaution against possible foul gases, and then, widening the hole a little, I inserted the candle and peered in, Lord Carnarvon, Lady Evelyn and Callender standing anxiously beside me to hear the verdict. At first I could see nothing, the hot air escaping from the chamber causing the candle flame to flicker, but presently, as my eyes grew accustomed to the light, details of the room within emerged slowly from the mist, strange animals, statues, and gold—everywhere the glint of gold. For the moment—an eternity it must have seemed to the others standing by—I was struck dumb with amazement, and when Lord Carnarvon, unable to stand the suspense any longer, inquired anxiously, “Can you see anything?” it was all I could do to get out the words, “Yes, wonderful things.”" } },
        { say: "A narrative may be told in <b>chronological order</b> (the order things happened) or may begin at a dramatic moment and then go back (Latin <b>in medias res</b>, 'into the middle of things'). Chronological order is usually clearest.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0L10 5L0 10z' fill='#333'/></marker></defs><line x1='40' y1='160' x2='560' y2='160' stroke='#333' stroke-width='3' marker-end='url(#a)'/><circle cx='90' cy='160' r='12' fill='#e0a400'/><text x='90' y='120' font-size='20' text-anchor='middle' fill='#222' >years of search</text><circle cx='230' cy='160' r='12' fill='#e0a400'/><text x='230' y='120' font-size='20' text-anchor='middle' fill='#222' >the doorway</text><circle cx='360' cy='160' r='12' fill='#e0a400'/><text x='360' y='120' font-size='20' text-anchor='middle' fill='#222' >candle</text><circle cx='490' cy='160' r='12' fill='#e0a400'/><text x='490' y='120' font-size='20' text-anchor='middle' fill='#222' >gold!</text><text x='300' y='240' font-size='22' text-anchor='middle' fill='#222' font-weight='bold'>Chronological order: earliest → latest</text></svg>" } },
        { say: "<b>Explain it.</b> Name Theon's six elements of a narrative and the three virtues. Then tell the Tutankhamun story in four sentences, including all six elements.", show: { type: "passage", title: "Explain it", text: "Name Theon's six elements of a narrative and the three virtues. Then tell the Tutankhamun story in four sentences, including all six elements.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise terms from this lesson." } }
      ], practice: [
        { q: "In the Tutankhamun narrative, which element answers 'Where?'", options: ["By candlelight", "Howard Carter", "November 1922", "The Valley of the Kings, Egypt"], answer: "The Valley of the Kings, Egypt", hint: "Which answer is a place?", why: "Place is where the action happened.", show: { type: "passage", title: "Wonderful things (a narrative)", text: "In November 1922, in the Valley of the Kings in Egypt, the archaeologist Howard Carter reached a sealed doorway he had spent years searching for. He made a small hole in the top corner, held up a candle, and peered inside. At first the hot air rushing out made the flame flicker. Then, as his eyes grew used to the light, he saw strange animals, statues and gold, everywhere the glint of gold. His patron, Lord Carnarvon, asked whether he could see anything. Carter later wrote that he could only answer: 'Yes, wonderful things.' He had found the tomb of the boy-king Tutankhamun, almost untouched for more than three thousand years." } },
        { q: "Which element is 'by candlelight, through a small hole'?", options: ["Person (who)", "Time (when)", "Manner (how)", "Cause (why)"], answer: "Manner (how)", hint: "Does it tell when, why, who, or how?", why: "It describes how he looked into the tomb: manner." },
        { q: "Which detail did the narrator save for the end, for greatest effect?", options: ["That it was Tutankhamun's tomb, almost untouched", "That Carter used a candle", "That the air was hot", "That it was November"], answer: "That it was Tutankhamun's tomb, almost untouched", hint: "Which fact gives the whole story its meaning?", why: "Ending on the identity of the tomb makes the discovery land with full force." },
        { q: "Which sentence violates (breaks) the virtue of brevity in a narrative about Carter?", options: ["He saw statues and gold.", "He made a small hole and held up a candle.", "Carter's favorite color may have been blue, though nobody knows.", "It was the tomb of Tutankhamun."], answer: "Carter's favorite color may have been blue, though nobody knows.", hint: "Which sentence has nothing to do with the discovery?", why: "An irrelevant detail wastes the listener's attention.", show: { type: "passage", title: "Wonderful things (a narrative)", text: "In November 1922, in the Valley of the Kings in Egypt, the archaeologist Howard Carter reached a sealed doorway he had spent years searching for. He made a small hole in the top corner, held up a candle, and peered inside. At first the hot air rushing out made the flame flicker. Then, as his eyes grew used to the light, he saw strange animals, statues and gold, everywhere the glint of gold. His patron, Lord Carnarvon, asked whether he could see anything. Carter later wrote that he could only answer: 'Yes, wonderful things.' He had found the tomb of the boy-king Tutankhamun, almost untouched for more than three thousand years." } },
        { q: "Which sentence is unclear?", options: ["Carter answered Carnarvon.", "Carnarvon asked Carter what he saw.", "Carter and Carnarvon looked in, and he said he saw gold.", "Carter looked in and said he saw gold."], answer: "Carter and Carnarvon looked in, and he said he saw gold.", hint: "Who is 'he'?", why: "With two men named, 'he' could mean either. Clarity requires that the listener always knows who did what." },
        { q: "What does 'in medias res' mean?", options: ["In the Latin language", "In the right order", "At the very end", "Into the middle of things"], answer: "Into the middle of things", hint: "'Medias' is related to 'middle' and 'medium'.", why: "A story told in medias res opens at a dramatic moment, then fills in what came before." },
        { q: "Put these events in chronological order.", type: "order", items: ["He sees the glint of gold", "Carnarvon asks if he can see anything", "He finds a sealed doorway", "Carter searches the valley for years", "He makes a hole and holds up a candle"], answer: ["Carter searches the valley for years", "He finds a sealed doorway", "He makes a hole and holds up a candle", "He sees the glint of gold", "Carnarvon asks if he can see anything"], hint: "What must happen before he can look through the hole?", why: "Search, doorway, hole and candle, the sight, then Carnarvon's question." },
        { q: "Tutankhamun died about 1323 BC; Carter opened his tomb in AD 1922. Ignoring the missing year zero, add 1323 and 1922 to estimate the years between them.", type: "number", answer: 3245, hint: "Years before Christ count backwards from 1; years after count forwards. So the gap spans both.", why: "1323 + 1922 = 3245. Because there is no year zero, the exact gap is one less, but either way it is 'more than three thousand years', exactly as the narrative says.", show: { type: "passage", title: "Wonderful things (a narrative)", text: "In November 1922, in the Valley of the Kings in Egypt, the archaeologist Howard Carter reached a sealed doorway he had spent years searching for. He made a small hole in the top corner, held up a candle, and peered inside. At first the hot air rushing out made the flame flicker. Then, as his eyes grew used to the light, he saw strange animals, statues and gold, everywhere the glint of gold. His patron, Lord Carnarvon, asked whether he could see anything. Carter later wrote that he could only answer: 'Yes, wonderful things.' He had found the tomb of the boy-king Tutankhamun, almost untouched for more than three thousand years." } },
        { q: "Why does the narrative say 'Carter later wrote' rather than simply quoting him as if the narrator were present?", options: ["To confuse the reader", "Because Carter could not speak", "To show honestly where the quotation comes from", "To make the story longer"], answer: "To show honestly where the quotation comes from", hint: "Was the narrator in the tomb in 1922?", why: "Naming the source tells the reader how we know, and invites them to check.", show: { type: "passage", title: "Wonderful things (a narrative)", text: "In November 1922, in the Valley of the Kings in Egypt, the archaeologist Howard Carter reached a sealed doorway he had spent years searching for. He made a small hole in the top corner, held up a candle, and peered inside. At first the hot air rushing out made the flame flicker. Then, as his eyes grew used to the light, he saw strange animals, statues and gold, everywhere the glint of gold. His patron, Lord Carnarvon, asked whether he could see anything. Carter later wrote that he could only answer: 'Yes, wonderful things.' He had found the tomb of the boy-king Tutankhamun, almost untouched for more than three thousand years." } },
        { q: "A story is plausible. Does that prove it is true?", options: ["Only if it is long", "Yes, always", "No; believable stories can be invented"], answer: "No; believable stories can be invented", hint: "Could a skilled liar tell a believable story?", why: "Plausibility means it could be so; only evidence shows it is so." },
        { q: "Which is the best opening sentence for a narrative about a lost dog found by a neighbor?", options: ["It was a day.", "Dogs are wonderful animals.", "On Saturday morning, our neighbor Mrs Lee found our dog, Pepper, in her garden shed.", "There is something I want to say about something that happened."], answer: "On Saturday morning, our neighbor Mrs Lee found our dog, Pepper, in her garden shed.", hint: "Which sentence gives who, what, where and when immediately?", why: "It answers four of the six questions at once, so the listener is oriented." },
        { q: "Which element is missing from this narrative: 'Yesterday, in the park, my brother fell off his bike.'?", options: ["Person (who)", "Time (when)", "Place (where)", "Cause (why)"], answer: "Cause (why)", hint: "Check each of the six questions.", why: "We know who, what, where and when. We do not know why he fell (or exactly how)." },
        { q: "Which of the six elements is most often the hardest to know for certain in a true historical narrative?", options: ["Place: where it happened", "Cause: why it happened", "Time: when it happened"], answer: "Cause: why it happened", hint: "Which question asks about reasons inside people's minds?", why: "Places and dates can often be documented; causes and motives must be inferred from evidence, so they need the most care." },

        { q: "Which sentence breaks chronological order in a story about baking bread?", options: ["We kneaded the dough, then let it rise.", "We mixed the flour and water.", "We baked it and then ate it.", "We ate the warm loaf, and then we kneaded the dough."], answer: "We ate the warm loaf, and then we kneaded the dough.", hint: "Can you eat a loaf before kneading it?", why: "Telling the eating before the kneading, with 'then', reverses the real order and confuses the listener." },
        { q: "Why do most true accounts use chronological order?", options: ["It is the only legal order", "It hides the ending", "It matches how events happened, so listeners follow easily", "It makes stories longer"], answer: "It matches how events happened, so listeners follow easily", hint: "Which order needs no explaining?", why: "Chronological order mirrors reality, making it the clearest default." },
        { q: "Which of these narratives is the most plausible?", options: ["A boy found a dragon's egg in the park.", "A boy found a coin in the park and gave it to the lost-property office.", "A boy lifted a bus.", "A boy flew to school."], answer: "A boy found a coin in the park and gave it to the lost-property office.", hint: "Which could easily happen?", why: "Only the first fits ordinary experience; still, plausibility is not proof." },

      ], challenge: [
        { q: "Two accounts of the same event differ: a diary written that evening says 'I saw gold', and a book written three years later says 'I saw wonderful things'. Which statement is most reasonable?", options: ["Both must be lies", "The longer one is always more accurate", "The diary is closer in time, so it is usually the better guide to the exact words; the book may be polished", "The book must be right because it was published"], answer: "The diary is closer in time, so it is usually the better guide to the exact words; the book may be polished", hint: "Which record was made nearer the moment?", why: "Records made soon after an event are usually more reliable about exact details; later versions are often shaped for readers. Both still deserve checking." },
        { q: "Retell 'The Crow and the Pitcher' in medias res. Choose the order that opens at the dramatic moment and then explains.", type: "order", items: ["Now the water rose to the brim, and she drank.", "Pebble after pebble dropped into the jar.", "Her beak could not reach the water.", "The crow had found the jar an hour earlier, nearly dry."], answer: ["Pebble after pebble dropped into the jar.", "The crow had found the jar an hour earlier, nearly dry.", "Her beak could not reach the water.", "Now the water rose to the brim, and she drank."], hint: "In medias res opens in the middle of the action, then fills in the past, then continues.", why: "Open on the pebbles (middle), flash back to the finding and the problem, then finish with the result." },
        { q: "A narrator writes: 'The general, a cruel and greedy man, marched north.' What has the narrator done that a careful reader should notice?", options: ["Broken the rule of chronological order", "Left out the place", "Used in medias res", "Mixed judgement (opinion) into the narration without evidence"], answer: "Mixed judgement (opinion) into the narration without evidence", hint: "Is 'cruel and greedy' a fact we can check in this sentence?", why: "Judgements may be justified, but they need evidence. Slipping them into a narrative makes the reader accept them without noticing." },
