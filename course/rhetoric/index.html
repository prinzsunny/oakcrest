        { q: "A speaker has five reasons, but only 2 minutes. What should she do?", options: ["Pick five and drop the evidence", "Rush through all five", "Choose the three strongest, true reasons and develop them well", "Speak faster than 200 words per minute"], answer: "Choose the three strongest, true reasons and develop them well", hint: "Is it better to prove three or mention five?", why: "Depth beats breadth; three well-supported reasons persuade more honestly than five rushed ones." },
        { q: "A close says: 'So we must act now, or our town will be destroyed!' The speech gave evidence only of occasional flooding. What is wrong?", options: ["It is a call to action", "Nothing", "The close exaggerates beyond the evidence (a slippery slope)", "It is too short"], answer: "The close exaggerates beyond the evidence (a slippery slope)", hint: "Does the close match the body's evidence?", why: "A close must not claim more than the body showed." },
        { q: "Which hook is both arresting and honest for a speech about Eratosthenes?", options: ["'Eratosthenes was the smartest man who ever lived.'", "'Today: Eratosthenes.'", "'Did you know Eratosthenes invented the telescope?'", "'More than two thousand years ago, a librarian measured the Earth with a stick and a shadow.'"], answer: "'More than two thousand years ago, a librarian measured the Earth with a stick and a shadow.'", hint: "Which is true, specific, and surprising?", why: "The first is true and vivid. The second is unprovable flattery, the third false, the fourth dull." },

    { title: "Ethopoeia: speaking in character", icon: "🎭", learn: [
        { say: "<b>Ethopoeia</b> (Greek, 'character-making') asks: what words would a particular person say in a particular situation? It trains imagination, empathy and the precise fitting of words to a speaker.", show: { type: "big", text: "Who is speaking?\nTo whom? At what moment?\nFeeling what?" } },
        { say: "Ancient teachers suggested organizing a character speech by <b>time</b>: begin with the <b>present</b> situation, look back to the <b>past</b>, then forward to the <b>future</b>.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0L10 5L0 10z' fill='#333'/></marker></defs><rect x='20' y='110' width='170' height='80' rx='12' fill='#ffe6a6' stroke='#333' stroke-width='2'/><text x='105' y='146' font-size='24' text-anchor='middle' fill='#222' font-weight='bold'>Present</text><text x='105' y='172' font-size='18' text-anchor='middle' fill='#222' >what is happening</text><line x1='192' y1='150' x2='212' y2='150' stroke='#333' stroke-width='3' marker-end='url(#a)'/><rect x='214' y='110' width='170' height='80' rx='12' fill='#eef4fb' stroke='#333' stroke-width='2'/><text x='299' y='146' font-size='24' text-anchor='middle' fill='#222' font-weight='bold'>Past</text><text x='299' y='172' font-size='18' text-anchor='middle' fill='#222' >how it came to this</text><line x1='386' y1='150' x2='406' y2='150' stroke='#333' stroke-width='3' marker-end='url(#a)'/><rect x='408' y='110' width='172' height='80' rx='12' fill='#cdebd3' stroke='#333' stroke-width='2'/><text x='494' y='146' font-size='24' text-anchor='middle' fill='#222' font-weight='bold'>Future</text><text x='494' y='172' font-size='18' text-anchor='middle' fill='#222' >what will come</text></svg>" } },
        { say: "Consider Archimedes in Syracuse, in the 200s BC. Plutarch reports that he boasted to King Hiero that, given enough force, any weight could be moved, and then proved it by drawing a loaded ship onto land with pulleys. Plutarch introduces the boast with '<b>we are told</b>': a report, not a record.", show: { type: "passage", title: "Plutarch, Life of Marcellus (Dryden translation, rev. A. H. Clough)", text: "[…] Archimedes, however, in writing to King Hiero, whose friend and near relation he was, had stated that given the force, any given weight might be moved, and even boasted, we are told, relying on the strength of demonstration, that if there were another earth, by going into it he could remove this. […] he fixed accordingly upon a ship of burden out of the king's arsenal, which could not be drawn out of the dock without great labour and many men; and, loading her with many passengers and a full freight, sitting himself the while far off, with no great endeavour, but only holding the head of the pulley in his hand and drawing the cords by degrees, he drew the ship in a straight line, as smoothly and evenly as if she had been in the sea. […]\n\n(Summary) Later writers give the boast a famous short form: 'Give me a place to stand, and I will move the Earth.' Those exact words do not appear in Plutarch's account." } },
        { say: "So an ethopoeia of Archimedes must be honest about its nature: it is an <b>imagined</b> speech, faithful to what we know of his character, not a record of his words. Never present invented words as a real quotation.", show: { type: "table", rows: [
              ["Honest", "'Here is what Archimedes might have said, in my imagining.'"],
              ["Dishonest", "'Archimedes' exact words to the king were…' (inventing a quotation)"]
            ] } },
        { say: "Fitting words to a character means matching <b>vocabulary</b>, <b>rhythm</b> and <b>values</b>. A Spartan is laconic; a frightened child speaks in short bursts; a scholar uses exact terms.", show: { type: "passage", title: "Character · Fitting line", text: "A Spartan king, invited to hear a mimic: 'I have heard the nightingale itself.'\n\nArchimedes, absorbed: 'One moment more; the proof is nearly whole.'\n\nThe Tortoise, at the finish: 'I never ran fast; I simply never stopped.'" } },
        { say: "Ethopoeia builds <b>empathy</b> and is a powerful tool for fair argument: before you disagree with someone, try to speak their view as they would, in their best words. If they would say 'Yes, that is what I mean', you have understood them.", show: { type: "big", text: "Speak the other view\nas its holder would." } },
        { say: "<b>Explain it.</b> What is ethopoeia? Explain the present–past–future pattern and why an imagined speech must never be presented as a real quotation. Use Archimedes as your example.", show: { type: "passage", title: "Explain it", text: "What is ethopoeia? Explain the present–past–future pattern and why an imagined speech must never be presented as a real quotation. Use Archimedes as your example.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise terms from this lesson." } }
      ], practice: [
        { q: "What does 'ethopoeia' mean?", options: ["A poem about nature", "Character-making: a speech in someone's voice", "A list of facts", "A speech of blame"], answer: "Character-making: a speech in someone's voice", hint: "'Etho-' as in ethos (character).", why: "Ethopoeia creates words fitting a character in a situation." },
        { q: "What order did ancient teachers suggest for an ethopoeia?", options: ["Future, past, present", "Present, past, future", "Past only", "Alphabetical"], answer: "Present, past, future", hint: "Begin with what is happening now.", why: "Present situation, then how it came to be, then what lies ahead." },
        { q: "Which king asked Archimedes to prove his boast about moving great weights?", options: ["Hiero of Syracuse", "King Midas", "King Arthur", "King Solomon"], answer: "Hiero of Syracuse", hint: "Look at the slide.", why: "Plutarch says Archimedes wrote to King Hiero of Syracuse, his friend and relative." },
        { q: "Do the words 'Give me a place to stand, and I will move the Earth' appear in Plutarch's account?", options: ["Yes, in Archimedes' own book", "No; Plutarch does not report them", "Yes, in a Roman law", "Yes, in his main account"], answer: "No; Plutarch does not report them", hint: "Re-read the passage and the summary.", why: "Plutarch reports the boast in other words; this famous form comes from later writers. Treat it as tradition, not as a verified quotation." },
        { q: "Which is the honest way to present an ethopoeia of Archimedes?", options: ["'Historians agree he said this.'", "'Archimedes' exact last words were these.'", "'Here is what I imagine Archimedes might have said.'", "'Plutarch quotes him as saying this.'"], answer: "'Here is what I imagine Archimedes might have said.'", hint: "Is it invented or recorded?", why: "An imagined speech must be labeled as imagined." },
        { q: "In an imagined speech, which line best fits a laconic Spartan host welcoming guests?", options: ["'My dear guests, I have so very many things to say to you, and I shall say them all at length.'", "'Whatever.'", "'Please write long letters home.'", "'Welcome. Sit. Eat.'"], answer: "'Welcome. Sit. Eat.'", hint: "Spartans were famous for brevity.", why: "An invented line in the laconic style: brief, warm and clear. (Compare the real reply of King Agesilaus, 'I have heard the nightingale itself', reported by Plutarch.)" },
        { q: "Which line best fits the Hare after losing?", options: ["'Stand out of my sunlight.'", "'Persuasion beats force.'", "'I never stopped.'", "'I was so sure of winning that I forgot to run.'"], answer: "'I was so sure of winning that I forgot to run.'", hint: "Who is speaking, and what has just happened?", why: "The Hare regrets his overconfidence." },
        { q: "Why is ethopoeia useful in arguments?", options: ["It avoids evidence", "It makes speeches longer", "It helps you state the other side's view in their best words before answering it", "It lets you invent quotations"], answer: "It helps you state the other side's view in their best words before answering it", hint: "Recall: speak the other view as its holder would.", why: "Understanding others in their own terms prevents straw men." },
        { q: "Which detail of vocabulary suits Archimedes, a mathematician?", options: ["'Buy now!'", "'The proof is nearly whole.'", "'Once upon a time.'", "'Dude, chill.'"], answer: "'The proof is nearly whole.'", hint: "What words would a geometer use?", why: "Mathematical vocabulary fits his character." },
        { q: "In an ethopoeia of Howard Carter at the doorway, which belongs to the 'past' section?", options: ["'Tomorrow the world will know.'", "'My hand is trembling.'", "'Six seasons of digging, and nothing but rubble.'", "'I hold the candle to the hole.'"], answer: "'Six seasons of digging, and nothing but rubble.'", hint: "Which looks back?", why: "Years of digging lie in the past." },
        { q: "Which belongs to the 'future' section?", options: ["'The air is hot.'", "'I hold the candle.'", "'Tomorrow the world will know what lies here.'", "'Six seasons of digging.'"], answer: "'Tomorrow the world will know what lies here.'", hint: "Which looks ahead?", why: "It anticipates what is to come." },
        { q: "Order an ethopoeia of the North Wind after losing.", type: "order", items: ["Past: 'I blew until the trees bent, and he only held tighter.'", "Present: 'The traveler sits in the sun, cloak off.'", "Future: 'Next time I will remember: force breeds resistance.'"], answer: ["Present: 'The traveler sits in the sun, cloak off.'", "Past: 'I blew until the trees bent, and he only held tighter.'", "Future: 'Next time I will remember: force breeds resistance.'"], hint: "Present, past, future.", why: "The time pattern gives the speech a natural shape." },
        { q: "Plutarch introduces Archimedes' boast with 'we are told'. What should a careful historian conclude?", options: ["The most dramatic version is true", "All of it is false", "The exact words are uncertain, though Archimedes' work on levers and weights is well attested by his own writings", "Archimedes never lived"], answer: "The exact words are uncertain, though Archimedes' work on levers and weights is well attested by his own writings", hint: "What does 'we are told' signal?", why: "Plutarch signals a report, not a record. We report the uncertainty and hold to what is well attested: Archimedes' own book On the Equilibrium of Planes sets out the law of the lever." },

        { q: "A student writes an excellent ethopoeia of Shakespeare and posts it online as 'a newly discovered Shakespeare letter'. What has happened?", options: ["Nothing; it is just fun", "She has created a forgery: imagined words presented as real", "She has done fine historical work", "She has written a précis"], answer: "She has created a forgery: imagined words presented as real", hint: "What is the difference between imagining and claiming?", why: "Ethopoeia is honest only when labeled as imagined; presenting it as genuine deceives and pollutes the historical record." },
        { q: "You disagree with a friend who thinks zoos are cruel. Which shows ethopoeia used well before disagreeing?", options: ["'You just hate zoos.'", "'As I understand you: animals that roam huge distances suffer in small enclosures, and that suffering matters. Have I got that right?'", "'You think all animals should be set free in cities.'", "'Zoos are great, end of story.'"], answer: "'As I understand you: animals that roam huge distances suffer in small enclosures, and that suffering matters. Have I got that right?'", hint: "Which states her view as she would?", why: "Stating the view in its strongest form, and checking, earns the right to disagree." },
        { q: "Which ethopoeia of Diogenes is most faithful to his character as reported?", options: ["'I fear you, mighty king.'", "'Your Majesty, please give me gold.'", "'Let me join your court.'", "'You offer me a kingdom; I ask only that you not block the sun.'"], answer: "'You offer me a kingdom; I ask only that you not block the sun.'", hint: "What did Diogenes value?", why: "His recorded reply shows contempt for wealth and power; the others contradict the sources." },

    { title: "Ekphrasis: making listeners see", icon: "🖼️", learn: [
        { say: "<b>Ekphrasis</b> (Greek, 'speaking out') is vivid description: words that bring a person, place, object or event before the listener's eyes. The ancient goal was <b>enargeia</b>, vividness so strong the audience seems to see the thing.", show: { type: "big", text: "Enargeia: vividness\nso strong you seem to see it" } },
        { say: "Read this ekphrasis. Notice the <b>order</b>: from the rock, up the tower to the light, then down again to the waves and the rail. A description needs a path for the eye.", show: { type: "passage", title: "The lighthouse (an ekphrasis)", text: "The lighthouse stands on the last black rock before the open sea. Its white tower, streaked with rust beneath each window, narrows as it climbs. At the top, behind a cage of glass, the great lens turns, and every ten seconds a blade of gold light sweeps across the water.\n\nBelow, waves boom against the rock and fall back hissing. The air tastes of salt. On the iron rail by the door, cold and slick with spray, a gull waits out the wind." } },
        { say: "Five tools make description vivid.", show: { type: "passage", title: "Tool · Example from the passage", text: "Ordered path: rock → tower → lens → waves → rail\n\nPrecise nouns: lens, rail, gull (not 'thing', 'bird')\n\nStrong verbs: boom, sweeps, narrows\n\nAll senses: sight, sound, taste, touch\n\nExact numbers: every ten seconds" } },
        { say: "A famous ekphrasis in English poetry is John Keats's 'Ode on a Grecian Urn' (1819): on the painted urn are trees, a piper, young lovers, a procession and a quiet town. Keats describes the urn by <b>asking questions</b> as he looks, scene by scene.", show: { type: "list", items: ["A leafy border around the urn", "A piper playing under trees that never lose their leaves", "A young lover who can never quite reach his beloved", "A procession winding toward a green altar", "A little town, empty and quiet on a holy morning", "The whole urn: a 'Cold Pastoral' that outlasts its makers"] } },
        { say: "Description can also present a painting. Vincent van Gogh's The Starry Night (1889) shows a village under a sky of swirling stars, with a dark cypress tree like a flame in the foreground. A good ekphrasis would move from the dark tree, to the sleeping village, to the blazing sky.", show: { type: "table", rows: [
              ["Near", "A dark cypress, flickering upward like a flame"],
              ["Middle", "A quiet village; a church spire; lit windows"],
              ["Far", "Hills, then a sky of swirling stars and a crescent moon"]
            ] } },
        { say: "Ekphrasis has a truth rule too. When describing something real, describe what is <b>there</b>. Vividness may choose and arrange details, but must not invent them. When describing an imagined scene, say so.", show: { type: "big", text: "Vivid, and accurate." } },
        { say: "<b>Explain it.</b> What is ekphrasis, and what is enargeia? Name four tools of vivid description, and explain why an ordered path for the eye matters.", show: { type: "passage", title: "Explain it", text: "What is ekphrasis, and what is enargeia? Name four tools of vivid description, and explain why an ordered path for the eye matters.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise terms from this lesson." } }

        { q: "What is enargeia?", options: ["Energy for running", "A kind of argument", "Vividness so strong the audience seems to see the thing", "A short story"], answer: "Vividness so strong the audience seems to see the thing", hint: "The goal of ekphrasis.", why: "Enargeia is the vivid presence of the thing described." },
        { q: "What path does the lighthouse passage follow?", options: ["Rock, up the tower to the light, then down to the waves and rail", "Left to right", "Random", "Inside to outside only"], answer: "Rock, up the tower to the light, then down to the waves and rail", hint: "Re-read: where does it begin and end?", why: "It climbs and then descends, giving the eye a route.", show: { type: "passage", title: "The lighthouse (an ekphrasis)", text: "The lighthouse stands on the last black rock before the open sea. Its white tower, streaked with rust beneath each window, narrows as it climbs. At the top, behind a cage of glass, the great lens turns, and every ten seconds a blade of gold light sweeps across the water.\n\nBelow, waves boom against the rock and fall back hissing. The air tastes of salt. On the iron rail by the door, cold and slick with spray, a gull waits out the wind." } },
        { q: "Which is the most precise noun?", options: ["Animal", "Thing", "Gull", "Bird"], answer: "Gull", hint: "Which lets you picture exactly?", why: "'Gull' names the specific creature." },

        { q: "'The air tastes of salt' appeals to:", options: ["Touch", "Taste", "Hearing", "Sight"], answer: "Taste", hint: "Which sense tastes?", why: "Taste.", show: { type: "passage", title: "The lighthouse (an ekphrasis)", text: "The lighthouse stands on the last black rock before the open sea. Its white tower, streaked with rust beneath each window, narrows as it climbs. At the top, behind a cage of glass, the great lens turns, and every ten seconds a blade of gold light sweeps across the water.\n\nBelow, waves boom against the rock and fall back hissing. The air tastes of salt. On the iron rail by the door, cold and slick with spray, a gull waits out the wind." } },
        { q: "Keats describes the Grecian urn by:", options: ["Comparing it to a car", "Asking questions about each scene as he looks", "Saying it was beautiful", "Listing its weight"], answer: "Asking questions about each scene as he looks", hint: "How does the poem begin each scene?", why: "His questions ('What men or gods are these?') lead the eye from scene to scene, giving the description life." },
        { q: "Which shows the near–middle–far order for The Starry Night?", options: ["Sky → cypress → village", "Cypress tree → village → sky", "Only the sky", "Village → sky → cypress"], answer: "Cypress tree → village → sky", hint: "What is closest to the viewer?", why: "The dark cypress is in the foreground." },
        { q: "Which description breaks the truth rule when describing a real place?", options: ["Choosing to mention the old oak but not the bins", "Describing the park at dawn", "Using the word 'emerald' for green grass", "Adding a waterfall to a park that has none"], answer: "Adding a waterfall to a park that has none", hint: "Selecting is fine; inventing is not.", why: "Inventing features misrepresents a real place." },
        { q: "Which sentence is most vivid?", options: ["There was a bird.", "Something flew.", "A gull, wings tucked, rode the gale like a kite on a string.", "Birds are common near the sea."], answer: "A gull, wings tucked, rode the gale like a kite on a string.", hint: "Which creates a picture and movement?", why: "Precise noun, detail, strong comparison." },

    { title: "Listening, questions and disagreement", icon: "👂", learn: [
        { say: "Rhetoric is not only speaking. James 1:19 (WEB) says: 'So, then, my beloved brothers, let every man be swift to hear, slow to speak, and slow to anger; […]' Good listening is the first half of good conversation.", show: { type: "big", text: "Swift to hear,\nslow to speak,\nslow to anger." } },
        { say: "<b>Active listening</b> has three moves: attend (eyes, stillness, no interrupting); <b>summarize</b> ('So you think…'); and <b>check</b> ('Have I understood?'). Only then respond.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0L10 5L0 10z' fill='#333'/></marker></defs><rect x='20' y='110' width='170' height='80' rx='12' fill='#eef4fb' stroke='#333' stroke-width='2'/><text x='105' y='157' font-size='24' text-anchor='middle' fill='#222' font-weight='bold'>Attend</text><line x1='192' y1='150' x2='212' y2='150' stroke='#333' stroke-width='3' marker-end='url(#a)'/><rect x='214' y='110' width='170' height='80' rx='12' fill='#ffe6a6' stroke='#333' stroke-width='2'/><text x='299' y='157' font-size='24' text-anchor='middle' fill='#222' font-weight='bold'>Summarize</text><line x1='386' y1='150' x2='406' y2='150' stroke='#333' stroke-width='3' marker-end='url(#a)'/><rect x='408' y='110' width='172' height='80' rx='12' fill='#cdebd3' stroke='#333' stroke-width='2'/><text x='494' y='157' font-size='24' text-anchor='middle' fill='#222' font-weight='bold'>Check</text><text x='300' y='260' font-size='24' text-anchor='middle' fill='#222' font-weight='bold'>…then respond</text></svg>" } },
        { say: "Socrates, the philosopher of Athens, taught by asking questions. In Plato's Apology (trans. Benjamin Jowett) he says that 'the unexamined life is not worth living'. Socratic questions help both people find the truth.", show: { type: "passage", title: "Kind · Example question", text: "Clarify: What do you mean by 'fair'?\n\nEvidence: How do we know that is true?\n\nAssumption: What are we taking for granted?\n\nConsequence: If that is true, what follows?\n\nOther views: How might someone disagree?" } },
        { say: "<b>Respectful disagreement</b> attacks ideas, never persons; speaks to the strongest version of the other view; concedes what is true; and stays open to being wrong.", show: { type: "list", items: ["Restate their view fairly first", "Agree where you can, aloud", "Disagree with reasons and evidence", "Ask; don't accuse", "Change your mind if the evidence requires it"] } },
        { say: "A useful phrase: 'I see it differently, and here is why.' Compare it with 'You're wrong.' The first invites thought; the second invites a fight. Tone serves truth: an angry listener stops listening.", show: { type: "table", rows: [
              ["Closes minds", "'That's ridiculous.'"],
              ["Opens minds", "'I see it differently, and here is why…'"],
              ["Closes minds", "'You always say that.'"],
              ["Opens minds", "'What makes you think so?'"]
            ] } },
        { say: "Remember the goal: not to win, but to find what is true together. If the other person shows you are mistaken, they have given you a gift. Saying 'You're right, I was wrong' is a sign of strength.", show: { type: "big", text: "The goal is truth,\nnot victory." } },
        { say: "<b>Explain it.</b> Describe active listening and two kinds of Socratic question. Then explain how to disagree respectfully, and why changing your mind for good evidence is a strength.", show: { type: "passage", title: "Explain it", text: "Describe active listening and two kinds of Socratic question. Then explain how to disagree respectfully, and why changing your mind for good evidence is a strength.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise terms from this lesson." } }
      ], practice: [
        { q: "What are the three moves of active listening?", options: ["Listen, forget, reply", "Attend, summarize, check", "Nod, smile, leave", "Interrupt, argue, win"], answer: "Attend, summarize, check", hint: "What do you do before responding?", why: "Attend fully, summarize their point, and check you understood." },
        { q: "'Swift to hear, slow to speak, and slow to anger' comes from:", options: ["Benjamin Franklin", "James 1:19", "Shakespeare", "Aesop"], answer: "James 1:19", hint: "A New Testament letter.", why: "James 1:19 (WEB)." },
        { q: "Which is a clarifying question?", options: ["'Why are you so wrong?'", "'What do you mean by \"fair\"?'", "'Who cares?'", "'Can we stop now?'"], answer: "'What do you mean by \"fair\"?'", hint: "Which asks for the meaning of a word?", why: "Clarifying questions pin down meaning." },
        { q: "Which question asks for evidence?", options: ["'Do you like it?'", "'How do we know that is true?'", "'What time is it?'", "'Are you sure you're not silly?'"], answer: "'How do we know that is true?'", hint: "Which asks how we know?", why: "Evidence questions test the basis of a claim." },
        { q: "Which question probes an assumption?", options: ["'Why bother?'", "'What are we taking for granted here?'", "'Is that your final answer?'", "'Can you say it louder?'"], answer: "'What are we taking for granted here?'", hint: "Assumptions are unstated.", why: "It brings hidden premises into view." },
        { q: "Which is the most respectful way to disagree?", options: ["'I see it differently, and here is why…'", "'That's ridiculous.'", "'You always get things wrong.'", "'Only a fool would think that.'"], answer: "'I see it differently, and here is why…'", hint: "Which attacks the idea, not the person?", why: "It signals disagreement while inviting reasons." },
        { q: "Socrates said 'the unexamined life is not worth living' in:", options: ["The Odyssey", "The Tempest", "Aesop's Fables", "Plato's Apology"], answer: "Plato's Apology", hint: "Socrates' defense speech at his trial.", why: "Plato's Apology records his defense." },
        { q: "Before replying to someone's argument, you should:", options: ["Repeat your own view", "Plan your reply while they talk", "Summarize it fairly and check you understood", "Interrupt quickly"], answer: "Summarize it fairly and check you understood", hint: "Can you answer what you haven't understood?", why: "Summarizing first prevents straw men and shows respect." },
        { q: "A friend proves that your fact was wrong. Which reply shows strength?", options: ["'You're just jealous.'", "'Well, it doesn't matter.'", "'You're right; thank you. I'll correct it.'", "Change the subject."], answer: "'You're right; thank you. I'll correct it.'", hint: "What does the truth-seeker value?", why: "Accepting correction gracefully serves the truth." },
        { q: "Which is a 'consequence' question?", options: ["'What does that word mean?'", "'Who told you?'", "'If that is true, what follows?'", "'Do you agree?'"], answer: "'If that is true, what follows?'", hint: "It looks at implications.", why: "Tracing consequences tests whether a view holds up." },
        { q: "Order the steps of a respectful disagreement.", type: "order", items: ["Invite their response", "Summarize their view", "Give your different view with reasons", "Say where you agree", "Listen fully"], answer: ["Listen fully", "Summarize their view", "Say where you agree", "Give your different view with reasons", "Invite their response"], hint: "Understanding comes first.", why: "Listen, summarize, agree where possible, disagree with reasons, then invite reply." },
        { q: "Why does tone matter when disagreeing?", options: ["Loud voices are more correct", "It doesn't", "Tone changes the facts", "An angry listener stops listening, so the truth cannot be weighed"], answer: "An angry listener stops listening, so the truth cannot be weighed", hint: "What happens to a person who feels attacked?", why: "Defensiveness blocks thought; calm tone keeps attention on reasons." },
        { q: "Which response shows you are 'swift to hear'?", options: ["Preparing a counter-attack", "Letting the speaker finish, then asking a question about what they said", "Looking at your phone", "Finishing their sentences for them"], answer: "Letting the speaker finish, then asking a question about what they said", hint: "Who is doing the talking?", why: "Listening fully before speaking." },

        { q: "You realize mid-argument that you agree with 70% of the other person's view. What is the most honest move?", options: ["Say so, then focus the disagreement on the remaining 30%", "Leave", "Hide the agreement to keep winning", "Pretend to agree with everything"], answer: "Say so, then focus the disagreement on the remaining 30%", hint: "Does stating agreement weaken you?", why: "Naming agreement narrows the question and builds trust; the real disagreement becomes clear." },

    { title: "Thesis: arguing a general question", icon: "🏛️", learn: [
        { say: "The <b>thesis</b> was the thirteenth rung of Aphthonius' ladder, just below the last (proposing a law): an argument on a <b>general question</b> with no named persons, such as 'Should one marry?', 'Is the city better than the country?', or 'Should one study the stars?'.", show: { type: "table", rows: [
              ["Thesis (general)", "Should children learn a second language?"],
              ["Hypothesis (specific case)", "Should Anna learn French this year?"]
            ] } },
        { say: "Arguments for a thesis are drawn from <b>heads</b> (sources of argument). Ancient lists vary (some add 'Is it lawful?' and 'What will follow?'); we use four of the most important. Ask each one in turn.", show: { type: "passage", title: "Head · Question", text: "Just: Is it right? Is it fair to everyone?\n\nExpedient: Is it useful? What are the benefits and costs?\n\nPossible: Can it actually be done?\n\nHonourable: Is it noble and admirable?" } },
        { say: "Cicero trained himself to argue <b>in utramque partem</b>: 'on both sides'. Arguing both sides is not about having no opinion. It reveals the strongest reasons on each side, so that your final judgement rests on the whole truth, not half of it.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0L10 5L0 10z' fill='#333'/></marker></defs><rect x='20' y='40' width='250' height='70' rx='12' fill='#cdebd3' stroke='#333' stroke-width='2'/><text x='145' y='82' font-size='20' text-anchor='middle' fill='#222' font-weight='bold'>For: strongest reasons</text><rect x='330' y='40' width='250' height='70' rx='12' fill='#f6d0c8' stroke='#333' stroke-width='2'/><text x='455' y='82' font-size='20' text-anchor='middle' fill='#222' font-weight='bold'>Against: strongest reasons</text><line x1='145' y1='112' x2='270' y2='190' stroke='#333' stroke-width='3' marker-end='url(#a)'/><line x1='455' y1='112' x2='330' y2='190' stroke='#333' stroke-width='3' marker-end='url(#a)'/><rect x='175' y='195' width='250' height='70' rx='12' fill='#ffe6a6' stroke='#333' stroke-width='2'/><text x='300' y='237' font-size='24' text-anchor='middle' fill='#222' font-weight='bold'>Judgement</text><text x='300' y='300' font-size='20' text-anchor='middle' fill='#222' >weighed on true evidence</text></svg>" } },
        { say: "Here is a thesis argued on both sides: <b>Should one study the stars?</b>", show: { type: "passage", title: "Head · For · Against", text: "Expedient — For: Navigation, calendars and farming all depend on astronomy; Against: Time spent may be needed for more urgent work\n\nPossible — For: Anyone with eyes and patience can begin; Against: Advanced study needs instruments\n\nHonourable — For: It lifts the mind to wonder and order\n\nJust — For: Knowledge of the heavens benefits everyone" } },
        { say: "A thesis ends with a <b>judgement</b> that follows from the weighing. 'On balance, yes, because…', with a qualifier if the case is close. Be ready to change your verdict if new, true evidence changes the balance.", show: { type: "big", text: "'On balance, yes, because…'\n(and open to new evidence)" } },
        { say: "Theses connect every subject. 'Should a city build walls?' needs history; 'Should we eat less meat?' needs science; 'Should we always tell the truth?' needs ethics. The rhetorician must be an all-rounder.", show: { type: "list", items: ["History: lessons of what happened", "Science: what is actually true about the world", "Mathematics: costs, quantities, probabilities", "Ethics and Scripture: what is right and good"] } },
        { say: "<b>Explain it.</b> What is a thesis, and how is it different from a hypothesis? Name the four heads of argument, and explain why arguing both sides leads to a better final judgement.", show: { type: "passage", title: "Explain it", text: "What is a thesis, and how is it different from a hypothesis? Name the four heads of argument, and explain why arguing both sides leads to a better final judgement.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise terms from this lesson." } }
      ], practice: [
        { q: "Which is a THESIS (general question)?", options: ["Should the Smiths buy a dog this week?", "Did Tom feed the cat?", "Is Rover a good dog?", "Should people keep pets?"], answer: "Should people keep pets?", hint: "Which names no particular person?", why: "A thesis is general; the others concern particular cases." },
        { q: "Which is a HYPOTHESIS (specific case)?", options: ["Should people swim?", "Should our town build a pool on Mill Lane this year?", "Should towns build pools?", "Is exercise good?"], answer: "Should our town build a pool on Mill Lane this year?", hint: "Which names a particular place and time?", why: "A hypothesis applies the question to specific circumstances." },
        { q: "Which head asks 'Can it actually be done?'", options: ["Possible", "Just", "Expedient", "Honourable"], answer: "Possible", hint: "Think of possibility.", why: "The 'possible' head tests feasibility." },
        { q: "Which head asks 'Is it useful?'", options: ["Just", "Expedient", "Possible", "Honourable"], answer: "Expedient", hint: "'Expedient' means advantageous.", why: "Expediency weighs benefits and costs." },
        { q: "What does 'in utramque partem' mean?", options: ["In Latin only", "In the middle", "For the win", "On both sides"], answer: "On both sides", hint: "Cicero argued this way.", why: "Arguing on both sides reveals the strongest reasons for each." },
        { q: "Why argue both sides of a thesis?", options: ["To confuse listeners", "To make the speech longer", "To find the strongest reasons on each side before judging", "To avoid having any opinion"], answer: "To find the strongest reasons on each side before judging", hint: "What does a judge need before deciding?", why: "Judgement is best when it weighs all the true reasons." },
        { q: "'Studying astronomy helped sailors navigate.' Which head?", options: ["Expedient", "Honourable", "Possible", "Just"], answer: "Expedient", hint: "Is it about usefulness?", why: "Navigation is a practical benefit: expediency." },
        { q: "'Wonder at the heavens ennobles the mind.' Which head?", options: ["Just", "Expedient", "Possible", "Honourable"], answer: "Honourable", hint: "Is it about nobility?", why: "Ennobling the mind is honorable." },
        { q: "How should a thesis end?", options: ["With a new topic", "With no conclusion", "With an insult", "With a judgement that follows from the weighing, qualified if close"], answer: "With a judgement that follows from the weighing, qualified if close", hint: "What is the point of the weighing?", why: "A reasoned verdict, open to new evidence." },
        { q: "Which subject supplies evidence for 'Should we eat less sugar?'", options: ["Science (nutrition and medicine)", "Chess", "Music", "Poetry only"], answer: "Science (nutrition and medicine)", hint: "What would tell us the effects of sugar?", why: "Scientific evidence on health is needed." },
        { q: "Order the work of arguing a thesis.", type: "order", items: ["Give a qualified judgement", "State the general question", "Gather arguments against", "Weigh them", "Gather arguments for, by the four heads"], answer: ["State the general question", "Gather arguments for, by the four heads", "Gather arguments against", "Weigh them", "Give a qualified judgement"], hint: "Question, both sides, weigh, judge.", why: "This order prevents deciding before considering." },
        { q: "After arguing both sides, you find the evidence clearly supports 'no'. You had hoped for 'yes'. What should you conclude?", options: ["'No', because the evidence supports it", "Nothing", "'Yes', because you hoped so", "Both"], answer: "'No', because the evidence supports it", hint: "What decides: hope or evidence?", why: "Judgement follows the evidence, not the wish." },

        { q: "Thesis: 'Should a city build walls?' A student argues only from the head 'possible' (we have stone and builders) and concludes 'yes'. What is the main weakness?", options: ["Nothing", "Stone is expensive", "Possibility shows it can be done, not that it should be: justice, cost and honor are unweighed", "Walls are impossible"], answer: "Possibility shows it can be done, not that it should be: justice, cost and honor are unweighed", hint: "Does 'can' prove 'should'?", why: "A complete thesis weighs all four heads; feasibility alone never settles whether to act." },
        { q: "Which is the best qualified judgement on a close thesis?", options: ["'On balance, yes, though the cost argument is strong, and new figures could change my view.'", "'Obviously yes; only fools disagree.'", "'I refuse to decide.'", "'Yes, because I said so.'"], answer: "'On balance, yes, though the cost argument is strong, and new figures could change my view.'", hint: "Which is honest about the balance?", why: "It states a verdict, acknowledges the strongest counter-argument, and stays open to evidence." },
        { q: "Which thesis question can be largely settled by evidence rather than values?", options: ["Is it nobler to forgive?", "Is the country lovelier than the city?", "Does regular reading aloud improve children's vocabulary?", "Is it more honorable to be a poet or a doctor?"], answer: "Does regular reading aloud improve children's vocabulary?", hint: "Which could be tested by careful study?", why: "The effect of reading aloud is an empirical question; the others depend more on values, though still argued with reasons." },
        { gen: () => RH.thesisQ() },
        { gen: () => RH.sideQ() }
      ], extend: "Write a thesis (about 500 words) on 'Should every child learn to play an instrument?' Argue both sides under all four heads, using at least one fact from music history and one from science, then give a qualified judgement.", offline: "Argue a thesis at dinner on both sides: two minutes FOR, two minutes AGAINST, then one minute of honest judgement. Let the family choose the question (e.g. 'Is it better to live in the city or the country?')." },
    { title: "Style: the figures of speech", icon: "✨", learn: [
        { say: "The third canon, <b>style</b>, includes <b>figures of speech</b>: patterns of words that make ideas memorable. Great speakers use them to make truth stick, not to decorate emptiness.", show: { type: "passage", title: "Figure · Pattern", text: "Anaphora: Same words begin successive phrases\n\nTricolon: A series of three parallel parts\n\nAntithesis: Contrasting ideas in balanced phrases\n\nChiasmus: A B, B A: a reversal\n\nAlliteration: Repeated initial sounds\n\nRhetorical question: A question asked for effect" } },
        { say: "The Bible is full of the <b>tricolon</b> and <b>antithesis</b>. Notice the three great gifts, and the balanced pairs of opposites.", show: { type: "passage", title: "1 Corinthians 13:13 and Ecclesiastes 3:4 (WEB)", text: "But now faith, hope, and love remain—these three. The greatest of these is love.\n\n[…] a time to weep, and a time to laugh; a time to mourn, and a time to dance." } },
        { say: "Jesus used the <b>rhetorical question</b> with gentle force in the Sermon on the Mount, speaking to people who were worried about food and clothing.", show: { type: "passage", title: "Matthew 6:26–27 (WEB)", text: "See the birds of the sky, that they don't sow, neither do they reap, nor gather into barns. Your heavenly Father feeds them. Aren't you of much more value than they?\n\nWhich of you, by being anxious, can add one moment to his lifespan?" } },
        { say: "These questions work because their answers are <b>true</b>. If God feeds the birds, his children matter far more; and no one can add a moment to his life by worrying. Each listener answers in his own heart. A rhetorical question that assumes a false answer is merely a trick.", show: { type: "big", text: "A figure is strong\nwhen the truth behind it is strong." } },
        { say: "Hebrew poetry in the Psalms uses <b>parallelism</b>: the second line echoes, extends or contrasts the first. 'The heavens declare the glory of God. The expanse shows his handiwork.' (Psalm 19:1, WEB).", show: { type: "table", rows: [
              ["Line 1", "The heavens declare the glory of God."],
              ["Line 2 (echo)", "The expanse shows his handiwork."]
            ] } },
        { say: "Use figures sparingly and only where the idea deserves emphasis. One fine antithesis in a speech is remembered; ten become a jingle. And never let a pleasing pattern carry a claim you have not proved.", show: { type: "list", items: ["Use a figure where the idea matters most", "One or two per short speech", "Never let rhythm replace evidence"] } },
        { say: "<b>Explain it.</b> Define four figures of speech with an example of each. Explain why the rhetorical questions in Matthew 6 are powerful, and why a figure cannot make a false claim true.", show: { type: "passage", title: "Explain it", text: "Define four figures of speech with an example of each. Explain why the rhetorical questions in Matthew 6 are powerful, and why a figure cannot make a false claim true.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise terms from this lesson." } }
      ], practice: [
        { q: "'faith, hope, and love' is mainly a:", options: ["Simile", "Tricolon", "Alliteration", "Chiasmus"], answer: "Tricolon", hint: "How many parallel parts?", why: "Three parallel nouns: a tricolon." },
        { q: "'a time to weep, and a time to laugh' contrasts:", options: ["Sorrow and joy (antithesis)", "Past and future", "North and South", "Rich and poor"], answer: "Sorrow and joy (antithesis)", hint: "What is set against what?", why: "Weeping versus laughing: an antithesis." },
        { q: "A rhetorical question is:", options: ["A question with no answer", "A question asked for effect, not for an answer", "A rude question", "A question in a quiz"], answer: "A question asked for effect, not for an answer", hint: "Did Jesus want a show of hands?", why: "It makes the audience confront the answer themselves." },
        { q: "Why is the question 'Aren't you of much more value than they?' so powerful?", options: ["It is a joke", "Its true answer comforts worried listeners: if God feeds the birds, he cares far more for them", "It is long", "It uses big words"], answer: "Its true answer comforts worried listeners: if God feeds the birds, he cares far more for them", hint: "Is its answer true?", why: "The figure's force comes from the truth it reveals." },
        { q: "'Eat to live; do not live to eat' is:", options: ["Tricolon", "Anaphora", "Alliteration", "Chiasmus"], answer: "Chiasmus", hint: "Look at the word order: A B, B A.", why: "Eat–live, live–eat: a reversal." },
        { q: "Which is anaphora?", options: ["'Fair is foul.'", "'Is this fair?'", "'Peter Piper picked.'", "'Every day we waited. Every day we hoped.'"], answer: "'Every day we waited. Every day we hoped.'", hint: "Same words at the start of phrases.", why: "'Every day' begins each phrase." },
        { q: "Hebrew parallelism means:", options: ["Lines have the same number of letters", "Lines are in Latin", "The second line echoes, extends or contrasts the first", "Lines rhyme"], answer: "The second line echoes, extends or contrasts the first", hint: "Look at Psalm 19:1.", why: "Parallelism pairs lines in meaning." },
        { q: "Which is the best advice on using figures?", options: ["Use them sparingly, where the idea matters most", "Use one in every sentence", "Use them to hide weak evidence", "Never use them"], answer: "Use them sparingly, where the idea matters most", hint: "One antithesis or ten?", why: "Sparing use gives emphasis; overuse becomes a jingle." },
        { q: "A speaker says, 'Isn't it obvious that my plan is best?' when it is not obvious. What is wrong?", options: ["It uses anaphora", "Nothing", "The rhetorical question assumes an answer that is not true", "It is too short"], answer: "The rhetorical question assumes an answer that is not true", hint: "Is the answer really 'yes'?", why: "A rhetorical question is a trick when its implied answer is false or unproved." },
        { q: "In which book of the Bible are the questions about the birds and worry found?", options: ["Matthew", "Genesis", "Psalms", "Proverbs"], answer: "Matthew", hint: "They are part of the Sermon on the Mount.", why: "Matthew 6:26–27, part of the Sermon on the Mount (Matthew 5–7)." },
        { q: "How many times does the word 'time' appear in 'a time to weep, and a time to laugh; a time to mourn, and a time to dance'?", type: "number", answer: 4, hint: "Count.", why: "Four times: the repeated word gives the verse its steady rhythm." },
        { q: "Psalm 100 in this course has 86 words. Read slowly at 40 words per minute, about how many whole minutes does it take? (Round to the nearest minute.)", type: "number", answer: 2, hint: "Divide the words by 40 and round.", why: "86 ÷ 40 ≈ 2.15, which rounds to 2 minutes. Some of the most loved texts are also the shortest." },
        { q: "'The heavens declare the glory of God' uses which kind of figure?", options: ["Chiasmus", "Alliteration", "Rhetorical question", "Personification: the heavens are said to 'declare'"], answer: "Personification: the heavens are said to 'declare'", hint: "Can the sky literally speak?", why: "The heavens are given a speaker's action: personification." },

        { q: "A slogan is beautifully balanced: 'Strong roads, strong town; weak roads, weak town.' The council has no evidence that roads affect the town's prosperity. How should a voter respond?", options: ["Admire the antithesis, then ask for the evidence", "Reject roads entirely", "Accept it because it sounds true", "Repeat the slogan"], answer: "Admire the antithesis, then ask for the evidence", hint: "Does balance prove anything?", why: "Figures can make a claim memorable; only evidence makes it true." },
        { q: "Jesus asks, 'Which of you, by being anxious, can add one moment to his lifespan?' Why ask instead of simply saying 'Worrying does not help'?", options: ["Because he did not know the answer", "Because the listeners were not allowed to speak", "So that each listener reaches the true answer himself, which persuades more deeply than being told", "To make the sermon longer"], answer: "So that each listener reaches the true answer himself, which persuades more deeply than being told", hint: "Who supplies the answer to a rhetorical question?", why: "A rhetorical question lets the audience answer for themselves; a conclusion we reach ourselves is held more firmly." },

    { title: "Memory and recitation: Psalm 100", icon: "🧠", learn: [
        { say: "The fourth canon is <b>memory</b>. Cicero tells a story, probably legendary, of how the poet Simonides discovered a method. After he stepped out of a banquet, the roof of the hall fell in; afterward he could still name every guest, because he remembered <b>where each had sat</b>.", show: { type: "passage", title: "The story of Simonides (retold in our own words from Cicero, De Oratore, Book 2)", text: "Simonides was called outside during a banquet. While he was gone, the roof of the hall fell in, and no one could say who had been sitting where. Simonides named every guest, because he remembered the place where each had been reclining.\n\nFrom this he realized that orderly arrangement of places is the key to memory." } },
        { say: "This is the <b>method of loci</b> (Latin locus, 'place'), or memory palace. Picture a familiar route: your front door, the hall, the kitchen. Place one vivid image for each part of your speech in each place. To recall, walk the route in your mind.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0L10 5L0 10z' fill='#333'/></marker></defs><rect x='10' y='110' width='108' height='90' rx='12' fill='#ffe6a6' stroke='#333' stroke-width='2'/><text x='64' y='151' font-size='20' text-anchor='middle' fill='#222' font-weight='bold'>Door</text><text x='64' y='177' font-size='18' text-anchor='middle' fill='#222' >hook</text><line x1='118' y1='155' x2='128' y2='155' stroke='#333' stroke-width='3' marker-end='url(#a)'/><rect x='128' y='110' width='108' height='90' rx='12' fill='#cdebd3' stroke='#333' stroke-width='2'/><text x='182' y='151' font-size='20' text-anchor='middle' fill='#222' font-weight='bold'>Hall</text><text x='182' y='177' font-size='18' text-anchor='middle' fill='#222' >point 1</text><line x1='236' y1='155' x2='246' y2='155' stroke='#333' stroke-width='3' marker-end='url(#a)'/><rect x='246' y='110' width='108' height='90' rx='12' fill='#eef4fb' stroke='#333' stroke-width='2'/><text x='300' y='151' font-size='20' text-anchor='middle' fill='#222' font-weight='bold'>Kitchen</text><text x='300' y='177' font-size='18' text-anchor='middle' fill='#222' >point 2</text><line x1='354' y1='155' x2='364' y2='155' stroke='#333' stroke-width='3' marker-end='url(#a)'/><rect x='364' y='110' width='108' height='90' rx='12' fill='#f6d0c8' stroke='#333' stroke-width='2'/><text x='418' y='151' font-size='20' text-anchor='middle' fill='#222' font-weight='bold'>Garden</text><text x='418' y='177' font-size='18' text-anchor='middle' fill='#222' >point 3</text><line x1='472' y1='155' x2='482' y2='155' stroke='#333' stroke-width='3' marker-end='url(#a)'/><rect x='482' y='110' width='108' height='90' rx='12' fill='#ffe6a6' stroke='#333' stroke-width='2'/><text x='536' y='151' font-size='20' text-anchor='middle' fill='#222' font-weight='bold'>Gate</text><text x='536' y='177' font-size='18' text-anchor='middle' fill='#222' >close</text><text x='300' y='260' font-size='20' text-anchor='middle' fill='#222' font-weight='bold'>Walk the route; meet each point in its place</text></svg>" } },
        { say: "To memorize exact words, as with a recitation, combine methods: understand the meaning first, learn by <b>sentences</b> not by words, rehearse aloud, and review over several days. Spaced review beats a single long session.", show: { type: "list", items: ["1. Understand every sentence", "2. Learn one sentence at a time, adding the next", "3. Say it aloud, standing", "4. Sleep on it; review tomorrow, in three days, in a week", "5. Recite to a listener"] } },
        { say: "This week's recitation is Psalm 100, a short song of thanksgiving from the Bible. It is only five verses long, and it has been read and sung in worship for many centuries.", show: { type: "passage", title: "Psalm 100 (King James Version)", text: "Make a joyful noise unto the LORD, all ye lands. Serve the LORD with gladness: come before his presence with singing.\n\nKnow ye that the LORD he is God: it is he that hath made us, and not we ourselves; we are his people, and the sheep of his pasture.\n\nEnter into his gates with thanksgiving, and into his courts with praise: be thankful unto him, and bless his name.\n\nFor the LORD is good; his mercy is everlasting; and his truth endureth to all generations." } },
        { say: "The psalm has a clear structure: a <b>call</b> to praise, then the <b>reason</b>; a second <b>call</b>, then a second <b>reason</b>. Knowing the structure is itself a memory aid.", show: { type: "passage", title: "Paragraph · Part · Idea", text: "1 — Call: Make a joyful noise; serve; come with singing\n\n2 — Reason: The LORD is God; he made us; we are his people\n\n3 — Call: Enter with thanksgiving; be thankful; bless his name\n\n4 — Reason: The LORD is good; his mercy and truth last forever" } },
        { say: "Psalm 100 contains <b>seven</b> commands: make a joyful noise, serve, come, know, enter, be thankful, bless. Three come in the first call, one in the first reason, and three in the second call. Counting gives you a checklist: if you recite only six, you know one is missing.", show: { type: "big", text: "3 + 1 + 3 = 7\nseven commands" } },
        { say: "<b>Explain it.</b> Explain the method of loci and how Simonides discovered it. Then explain the call–reason structure of Psalm 100 and how it helps you recite it.", show: { type: "passage", title: "Explain it", text: "Explain the method of loci and how Simonides discovered it. Then explain the call–reason structure of Psalm 100 and how it helps you recite it.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise terms from this lesson." } }
      ], practice: [
        { q: "How did Simonides identify the guests?", options: ["By their clothes", "From a guest list", "He remembered where each had sat", "He guessed"], answer: "He remembered where each had sat", hint: "Re-read the story.", why: "Memory of places let him name each guest." },
        { q: "What does 'locus' mean?", options: ["Place", "Speech", "Memory", "Word"], answer: "Place", hint: "Think of 'location'.", why: "Locus is Latin for place." },
        { q: "In the method of loci, what do you put in each place?", options: ["The whole speech", "A vivid image standing for one part of the speech", "A real object", "Nothing"], answer: "A vivid image standing for one part of the speech", hint: "Imagined images, real route.", why: "Each place holds a memorable image linked to a point." },
        { q: "Which review schedule helps memory most?", options: ["Never review", "Review only once, months later", "Short reviews spread over several days", "One long session the night before"], answer: "Short reviews spread over several days", hint: "Spaced or crammed?", why: "Spaced review strengthens long-term memory." },
        { q: "What should you do FIRST when memorizing a speech?", options: ["Write it backwards", "Memorize the last word", "Understand the meaning of every sentence", "Speak as fast as possible"], answer: "Understand the meaning of every sentence", hint: "Meaning anchors words.", why: "Understanding makes the words logical to recall." },
        { q: "A score is 20. How many years is 'threescore years and ten' (Psalm 90:10, KJV)?", type: "number", answer: 70, hint: "3 × 20, then add 10.", why: "3 × 20 + 10 = 70." },
        { q: "Psalm 100 contains seven commands. If you recite it once a day for a week, how many commands do you say in all?", type: "number", answer: 49, hint: "7 × 7.", why: "7 × 7 = 49: seven commands, seven days." },
        { q: "What is the structure of Psalm 100?", options: ["Reason, call, reason, call", "Call, reason, call, reason", "Call only", "Reason only"], answer: "Call, reason, call, reason", hint: "Look for the commands, then for 'Know…' and 'For…'.", why: "Two calls to praise, each followed by the reason for praise.", show: { type: "passage", title: "Psalm 100 (King James Version)", text: "Make a joyful noise unto the LORD, all ye lands. Serve the LORD with gladness: come before his presence with singing.\n\nKnow ye that the LORD he is God: it is he that hath made us, and not we ourselves; we are his people, and the sheep of his pasture.\n\nEnter into his gates with thanksgiving, and into his courts with praise: be thankful unto him, and bless his name.\n\nFor the LORD is good; his mercy is everlasting; and his truth endureth to all generations." } },
        { q: "Which line gives a REASON for praise?", options: ["'Serve the LORD with gladness'", "'For the LORD is good; his mercy is everlasting'", "'Enter into his gates with thanksgiving'", "'Make a joyful noise unto the LORD'"], answer: "'For the LORD is good; his mercy is everlasting'", hint: "Which line begins with 'For'?", why: "'For' introduces the reason: the LORD is good, merciful and faithful.", show: { type: "passage", title: "Psalm 100 (King James Version)", text: "Make a joyful noise unto the LORD, all ye lands. Serve the LORD with gladness: come before his presence with singing.\n\nKnow ye that the LORD he is God: it is he that hath made us, and not we ourselves; we are his people, and the sheep of his pasture.\n\nEnter into his gates with thanksgiving, and into his courts with praise: be thankful unto him, and bless his name.\n\nFor the LORD is good; his mercy is everlasting; and his truth endureth to all generations." } },
        { q: "What does 'everlasting' mean?", options: ["Lasting forever", "Measured", "Forgotten", "Built"], answer: "Lasting forever", hint: "Ever + lasting.", why: "Everlasting means lasting forever: his mercy never ends.", show: { type: "passage", title: "Psalm 100 (King James Version)", text: "Make a joyful noise unto the LORD, all ye lands. Serve the LORD with gladness: come before his presence with singing.\n\nKnow ye that the LORD he is God: it is he that hath made us, and not we ourselves; we are his people, and the sheep of his pasture.\n\nEnter into his gates with thanksgiving, and into his courts with praise: be thankful unto him, and bless his name.\n\nFor the LORD is good; his mercy is everlasting; and his truth endureth to all generations." } },
        { q: "What does 'the sheep of his pasture' picture?", options: ["A long speech", "A final exam", "A measuring tape", "God caring for his people as a shepherd cares for his sheep"], answer: "God caring for his people as a shepherd cares for his sheep", hint: "Who looks after sheep in a pasture?", why: "The image shows God as a caring shepherd and his people as his flock.", show: { type: "passage", title: "Psalm 100 (King James Version)", text: "Make a joyful noise unto the LORD, all ye lands. Serve the LORD with gladness: come before his presence with singing.\n\nKnow ye that the LORD he is God: it is he that hath made us, and not we ourselves; we are his people, and the sheep of his pasture.\n\nEnter into his gates with thanksgiving, and into his courts with praise: be thankful unto him, and bless his name.\n\nFor the LORD is good; his mercy is everlasting; and his truth endureth to all generations." } },
        { q: "Which delivery choice suits Psalm 100?", options: ["Mumbled and rushed", "Shouted angrily throughout", "Joyful and clear, with a pause between verses", "Whispered"], answer: "Joyful and clear, with a pause between verses", hint: "It is a song of thanksgiving.", why: "A joyful psalm calls for a glad, clear voice, with pauses to mark each verse.", show: { type: "passage", title: "Psalm 100 (King James Version)", text: "Make a joyful noise unto the LORD, all ye lands. Serve the LORD with gladness: come before his presence with singing.\n\nKnow ye that the LORD he is God: it is he that hath made us, and not we ourselves; we are his people, and the sheep of his pasture.\n\nEnter into his gates with thanksgiving, and into his courts with praise: be thankful unto him, and bless his name.\n\nFor the LORD is good; his mercy is everlasting; and his truth endureth to all generations." } },
        { q: "Order the paragraphs' first words.", type: "order", items: ["Know ye that the LORD he is God", "Make a joyful noise unto the LORD", "Enter into his gates with thanksgiving"], answer: ["Make a joyful noise unto the LORD", "Know ye that the LORD he is God", "Enter into his gates with thanksgiving"], hint: "Call, reason, call.", why: "The first call, the first reason, then the second call.", show: { type: "passage", title: "Psalm 100 (King James Version)", text: "Make a joyful noise unto the LORD, all ye lands. Serve the LORD with gladness: come before his presence with singing.\n\nKnow ye that the LORD he is God: it is he that hath made us, and not we ourselves; we are his people, and the sheep of his pasture.\n\nEnter into his gates with thanksgiving, and into his courts with praise: be thankful unto him, and bless his name.\n\nFor the LORD is good; his mercy is everlasting; and his truth endureth to all generations." } },

    { title: "Introduction to debate", icon: "🗳️", learn: [
        { say: "A <b>debate</b> is a structured contest of arguments on a <b>resolution</b>: a clear statement one side defends (the <b>affirmative</b>) and the other opposes (the <b>negative</b>). Its purpose, rightly understood, is to test ideas in the open.", show: { type: "table", rows: [
              ["Resolution", "Resolved: Our town should build a public swimming pool."],
              ["Affirmative", "Argues for the resolution"],
              ["Negative", "Argues against it"]
            ] } },

// Course runner: turns COURSE data (one lesson per school week) into an app with the usual shell.
// Each lesson: Learn slides → Practice (hint after the first miss, worked answer after the second) →
// Challenge (contest level) → an off-screen task. No timers, no speed scoring.
// Layout: every screen must fit one screen. After each change the runner measures the panel and the stage
// and shrinks text step by step to a readable floor; only as a last resort does a long explanation or a
// long passage scroll inside its own box (with a fade at the bottom), never the page.
const { $, el, svg: makeSvg, text, panel, wait, confetti, PRAISE, numpad } = KIT;
const stage = $("[data-stage]");
let token = 0;

const UNITS = COURSE.lessons.map((l, i) => ({ id: `l${i + 1}`, label: `${i + 1}. ${l.title}`, icon: l.icon || COURSE.icon }));
const esc = (t) => String(t ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;");
const len = (t) => String(t ?? "").length;
const stop = (t) => (/[.!?…:;]["'”’)]?$/.test(String(t).trim()) ? String(t).trim() : `${String(t).trim()}.`);

// ---------- fitting ----------
let fitFrame = 0;
const refit = () => {
  cancelAnimationFrame(fitFrame);
  fitFrame = requestAnimationFrame(() => {
    fitPanel();
    fitStage();
  });
};
// The owl's bubble. `quiet` keeps the words (and the voice) but hides the bubble, used when the
// question is already printed on the stage so the panel is not spent on the same sentence twice.
function say(html, { quiet = false } = {}) {
  KIT.say(html);
  const box = $("[data-say]");
  if (box) {
    box.innerHTML = `<span class="cr-say-in">${box.innerHTML}</span>`;
    box.classList.toggle("cr-quiet", quiet);
  }
  refit();
}
const atEnd = (box) => box.scrollTop + box.clientHeight >= box.scrollHeight - 2;
const fadeCue = (box) => {
  if (!box) return;
  box.classList.toggle("cr-fade", box.scrollHeight > box.clientHeight + 2 && !atEnd(box));
  if (!box.dataset.cue) {
    box.dataset.cue = "1";
    box.addEventListener("scroll", () => box.classList.toggle("cr-fade", box.scrollHeight > box.clientHeight + 2 && !atEnd(box)), { passive: true });
  }
};
const singleColumn = () => getComputedStyle($(".ap-main") || document.body).gridTemplateColumns.trim().split(/\s+/).length < 2;

function fitPanel() {
  const host = $("[data-panel]");
  if (!host) return;
  const main = $(".ap-main");
  host.classList.add("cr-panel");
  const sayBox = $("[data-say]", host);
  const inner = sayBox && $(".cr-say-in", sayBox);
  host.style.removeProperty("max-height");
  main?.style.removeProperty("grid-template-columns");
  if (inner) inner.style.removeProperty("max-height");
  const over = () => host.scrollHeight - host.clientHeight;
  // A ladder of ever stronger measures; stop at the first that fits. Upright screens may give the panel
  // more height ("tall"); landscape phones give it a wider column ("wide").
  const steps = [
    { k: 1 },
    { k: 0.93 },
    { k: 0.86 },
    { k: 0.86, grow: 1 },
    { k: 0.86, grow: 1, dense: true },
    { k: 0.86, grow: 2, dense: true },
    { k: 0.8, grow: 2, dense: true },
    { k: 0.8, grow: 2, dense: true, scroll: true },
    { k: 0.74, grow: 2, dense: true, scroll: true },
  ];
  const upright = singleColumn();
  for (const s of steps) {
    host.style.setProperty("--k", s.k);
    host.classList.toggle("cr-tight", s.k < 0.9);
    host.classList.toggle("cr-dense", !!s.dense);
    if (s.grow && upright) host.style.maxHeight = s.grow > 1 ? "64vh" : "58vh";
    if (s.grow && !upright && main) main.style.gridTemplateColumns = s.grow > 1 ? "minmax(0, 1fr) minmax(260px, 1.45fr)" : "minmax(0, 1.2fr) minmax(260px, 1fr)";
    if (inner) inner.style.removeProperty("max-height");
    let o = over();
    if (o > 1 && s.scroll && inner && sayBox.offsetParent) {
      // Last resort: the explanation scrolls inside the bubble, never the page.
      const lh = parseFloat(getComputedStyle(inner).lineHeight) || 20;
      const room = inner.offsetHeight - o - 2;
      inner.style.maxHeight = `${Math.max(Math.round(lh * 2.2), room)}px`;
      o = over();
    }
    if (o <= 1) break;
  }
  const choiceList = $("[data-list]", host);
  if (over() > 1 && typeof choiceList?._crCompact === "function") {
    const compact = choiceList._crCompact;
    choiceList._crCompact = null;
    if (compact()) return fitPanel();
  }
  fadeCue(inner);
}

function fitStage() {
  const box = $(".cr-show", stage);
  const body = box && $(".cr-body", box);
  if (!body) return;
  const fits = () => body.scrollHeight <= body.clientHeight + 1 && body.scrollWidth <= body.clientWidth + 1;
  box.style.setProperty("--s", 1);
  if (!fits()) {
    let lo = 0.45, hi = 1;
    for (let n = 0; n < 7; n++) {
      const mid = (lo + hi) / 2;
      box.style.setProperty("--s", mid);
      if (fits()) lo = mid;
      else hi = mid;
    }
    box.style.setProperty("--s", lo);
  }
  // A long, flat table (a few rows, many columns) that is still too wide is turned on its side.
  const table = $(".cr-table", body);
  if (table && !table.dataset.turned && body.scrollWidth > body.clientWidth + 1 && table.rows.length < (table.rows[0]?.cells.length || 0)) {
    const grid = [...table.rows].map((r) => [...r.cells]);
    table.dataset.turned = "1";
    table.innerHTML = grid[0].map((_, c) => `<tr>${grid.map((r) => (r[c] ? r[c].outerHTML : "<td></td>")).join("")}</tr>`).join("");
    table.classList.add("cr-turned");
    return fitStage();
  }
  // Still too wide: tighter cells, and long words may hyphenate.
  if (table && !table.classList.contains("cr-squeeze") && body.scrollWidth > body.clientWidth + 1) {
    table.classList.add("cr-squeeze");
    return fitStage();
  }
  fadeCue(body);
}
addEventListener("resize", refit);
if (window.ResizeObserver) new ResizeObserver(() => requestAnimationFrame(fitStage)).observe(stage);
document.fonts?.ready?.then(refit);
