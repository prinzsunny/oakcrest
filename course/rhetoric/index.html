        { q: "Suppose a newspaper report printed Carter's reply as 'Yes, it is wonderful,' while Carter's own book (1923) gives 'Yes, wonderful things.' Which version should a careful narrator quote?", options: ["A better-sounding one of her own", "Carter's own published words, noting that the newspaper differs", "Neither; quotations are impossible", "The newspaper's, because it is printed"], answer: "Carter's own published words, noting that the newspaper differs", hint: "Which source comes from Carter himself?", why: "The speaker's own account is closer to the words spoken than a reporter's version; an honest narrator also notes any discrepancy." }
      ], extend: "Read Herodotus' story of how the Egyptian king Psammetichus tried to discover the oldest language (Histories, Book 2, chapter 2; Macaulay translation, public domain). Identify the six elements, and then explain why the experiment does not prove what the king concluded.", offline: "Tell the family a true narrative from your own week in under 90 seconds. Before you begin, write the six elements on a card. Afterwards, ask: Was anything unclear? Which detail could I have cut?" },
    { title: "Clarity and concision", icon: "💎", learn: [
        { say: "<b>Clarity</b> means the listener understands exactly what you mean. <b>Concision</b> means using no more words than the meaning needs. They are allies: extra words hide ideas.", show: { type: "passage", title: "Wordy (20 words) · Due to the fact that it was raining, we made the decision to postpone the picnic until a later date.", text: "Concise (8 words): Because it was raining, we postponed the picnic." } },
        { say: "The Spartans of ancient Greece were famous for brevity; our word <b>laconic</b> (very brief) comes from their region, Laconia. Plutarch tells how the Spartan king Agesilaus was once invited to hear a man who could imitate a nightingale's song, and how he answered in a few words.", show: { type: "passage", title: "Plutarch, Life of Agesilaus (retold in our own words)", text: "Someone invited King Agesilaus to come and hear a man who imitated the nightingale wonderfully well. The king declined, saying only: \"I have heard the nightingale itself.\"" } },
        { say: "Five tools of clear prose. Prefer the <b>plain word</b> (use, not utilize). Cut <b>redundancy</b> (saying the same thing twice). Prefer the <b>active voice</b>. Put the <b>main idea first</b>. Use <b>concrete</b> words (oak tree, not vegetation).", show: { type: "list", items: ["Plain words: 'use', not 'utilize'", "Cut redundancy: 'free gift' → 'gift'", "Active voice: 'The dog bit Sam'", "Main idea first", "Concrete, specific nouns"] } },
        { say: "In the <b>active voice</b> the subject does the action: 'The committee rejected the plan.' In the <b>passive</b>, the subject receives it: 'The plan was rejected.' The passive can hide who acted, which is sometimes useful but often evasive (avoiding responsibility).", show: { type: "table", rows: [
              ["Active", "I broke the vase."],
              ["Passive", "The vase was broken by me."],
              ["Passive, actor hidden", "Mistakes were made."]
            ] } },
        { say: "Redundancies are phrases that repeat themselves. Every word in the left column is wasted.", show: { type: "passage", title: "Redundant · Concise", text: "free gift: gift\n\nend result: result\n\npast history: history\n\neach and every: each\n\nin order to: to\n\nat this point in time: now" } },
        { say: "Concision is not the same as leaving things out. If removing a word changes or blurs the meaning, keep it. Proverbs says: 'A word fitly spoken is like apples of gold in settings of silver' (Proverbs 25:11, WEB). The aim is the fitting word, not merely the fewest words.", show: { type: "big", text: "Clear first.\nThen short." } },
        { say: "<b>Explain it.</b> Explain the difference between clarity and concision, and why the passive sentence 'Mistakes were made' can be evasive. Give your own example of a redundant phrase and fix it.", show: { type: "passage", title: "Explain it", text: "Explain the difference between clarity and concision, and why the passive sentence 'Mistakes were made' can be evasive. Give your own example of a redundant phrase and fix it.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise terms from this lesson." } }
      ], practice: [
        { q: "Which is the most concise version that keeps the meaning?", options: ["The picnic was postponed by us owing to the rain that fell.", "Rain.", "We postponed the picnic because of rain.", "Due to the fact that there was rain, we decided to postpone."], answer: "We postponed the picnic because of rain.", hint: "Which keeps the full meaning in the fewest words?", why: "It is active, short and complete. 'Rain.' alone loses the meaning." },
        { q: "How many words can you cut from 'He returned back to the house' without changing the meaning?", type: "number", answer: 1, hint: "What does 're-' in 'returned' already mean?", why: "'Returned' already means 'went back', so 'back' is redundant: one word." },
        { q: "Which phrase is redundant?", options: ["Weekly planning", "Planning ahead for winter", "Advance planning", "Careful planning"], answer: "Advance planning", hint: "Can planning ever happen afterwards?", why: "All planning is in advance, so 'advance' adds nothing." },
        { q: "Which sentence is in the active voice?", options: ["The cat chased the mouse.", "The mouse was chased.", "Chasing was done.", "The mouse was chased by the cat."], answer: "The cat chased the mouse.", hint: "In which sentence does the subject do the action?", why: "'The cat' is the subject and does the chasing." },
        { q: "Rewrite in active voice: 'The window was broken by the ball.'", options: ["The ball broke the window.", "The window broke.", "Broken was the window.", "The window was broken."], answer: "The ball broke the window.", hint: "Who or what did the breaking?", why: "Make the doer (the ball) the subject." },
        { q: "Why might someone say 'Mistakes were made' instead of 'I made mistakes'?", options: ["Because it is more honest", "Because it is shorter", "Because it is the active voice", "To avoid saying who is responsible"], answer: "To avoid saying who is responsible", hint: "Who made the mistakes, according to the sentence?", why: "The passive hides the actor, so it can be used to dodge responsibility." },
        { q: "Which is the plainest replacement for 'utilize'?", options: ["Make utilization of", "Use", "Employ", "Exploit"], answer: "Use", hint: "Which is the simplest everyday word?", why: "'Use' says exactly the same, more simply." },
        { q: "Which is more concrete?", options: ["An animal moved across an area.", "A red fox crossed the frozen pond.", "Wildlife was observed.", "Something happened outside."], answer: "A red fox crossed the frozen pond.", hint: "Which one lets you see a picture?", why: "Specific nouns (fox, pond) and details (red, frozen) create a clear picture." },
        { q: "'In order to win, each and every player must practice.' Concise version: 'To win, every player must practice.' How many words were removed?", type: "number", answer: 4, hint: "Count the words in both sentences.", why: "10 − 6 = 4. 'In order' and 'each and' were cut." },
        { q: "What does 'laconic' mean?", options: ["Very loud", "Rude", "From Athens", "Using very few words"], answer: "Using very few words", hint: "The Spartans lived in Laconia.", why: "Laconic speech is brief and pointed, like the Spartan king's reply 'I have heard the nightingale itself.'" },
        { q: "Which cut would DAMAGE the meaning? Original: 'Do not touch the wire unless the power is off.'", options: ["Changing 'Do not' to 'Never'", "Cutting nothing", "Cutting 'unless the power is off'"], answer: "Cutting 'unless the power is off'", hint: "Which version could become dangerous?", why: "Without the condition, the instruction changes meaning completely. Concision must never sacrifice accuracy." },
        { q: "Which sentence puts the main idea first?", options: ["The bridge is closed: engineers found cracks on Monday.", "On Monday, after a long day of tests involving many engineers, cracks were found and so the bridge is closed.", "Cracks, Monday.", "Engineers, on Monday, tests."], answer: "The bridge is closed: engineers found cracks on Monday.", hint: "What does the reader most need to know?", why: "The key fact (the bridge is closed) comes first; the reason follows." },
        { q: "Order these from wordiest to most concise.", type: "order", items: ["We are waiting now.", "At this point in time, we are currently waiting.", "At this time we are waiting.", "We wait."], answer: ["At this point in time, we are currently waiting.", "At this time we are waiting.", "We are waiting now.", "We wait."], hint: "Count the words in each.", why: "Fewer words each time, though 'We wait' slightly changes the meaning; 'We are waiting now' is the clearest concise version." },

        { q: "Which is the most concrete version?", options: ["Things were made in a place.", "Baking activity occurred.", "The baker pulled six golden loaves from the oven.", "Food was produced."], answer: "The baker pulled six golden loaves from the oven.", hint: "Which can you picture?", why: "Specific nouns and numbers paint a picture." },

      ], challenge: [
        { q: "The king's reply 'I have heard the nightingale itself' is laconic. Why is it also clear, despite being so short?", options: ["The context (the invitation) supplies the missing meaning: 'why hear a copy when I know the real thing?'", "It is not clear at all", "Short answers are always clear", "Because the king spoke Spartan"], answer: "The context (the invitation) supplies the missing meaning: 'why hear a copy when I know the real thing?'", hint: "What was he invited to hear?", why: "Concision works when the listener can supply the rest from context. Here the reply means 'The real bird is better than any imitation.'" },
        { q: "Which sentence is concise but MISLEADING? Original data: 'In a test of 20 children, 3 got ill after eating the berries.'", options: ["The berries make children ill.", "3 of 20 tested children fell ill after eating the berries.", "Some tested children (3 of 20) became ill after eating the berries."], answer: "The berries make children ill.", hint: "Which short version claims more than the data show?", why: "'The berries make children ill' is short but implies that they always do, and that the berries were the cause. The data show only that 3 of 20 fell ill afterwards." },
        { q: "Cut every redundant word from: 'The end result of the past history is that each and every free gift was totally destroyed.' The concise version is 'The result of the history is that every gift was destroyed.' How many words were cut?", type: "number", answer: 6, hint: "Count each sentence's words.", why: "Cut: end, past, each, and, free, totally = 6 words." },
        { gen: () => RH.wordyNum() },
        { q: "Pascal once ended a long letter by apologizing that he had not had time to make it shorter. What does he mean?", options: ["Writing concisely takes MORE effort than writing at length", "Short letters are rude", "He was too busy to write", "Long letters are better"], answer: "Writing concisely takes MORE effort than writing at length", hint: "Which is harder: to pour out words, or to choose the essential ones?", why: "Cutting to the essential takes extra thought and revision; concision is work." }
      ], extend: "Read Psalm 100 (only five verses). Find three places where the writer could have used more words but chose fewer. Then write one paragraph explaining how its brevity adds to its power.", offline: "Write a one-paragraph description of your morning. Then cut it to half the words without losing any important fact. Read both versions aloud to a grown-up and ask which is clearer." },
    { title: "Audience and purpose: a speech of thanks", icon: "🙏", learn: [
        { say: "Before you choose a single word, ask two questions. <b>Who</b> is listening? And <b>what</b> do I want them to understand, feel or do? The answers decide your vocabulary, length, examples and tone (attitude in the voice).", show: { type: "passage", title: "Audience · How you explain the heart", text: "A four-year-old: Your heart is a strong pump that pushes blood all around you.\n\nA classmate: The heart has four chambers that pump blood through two loops.\n\nA doctor: The left ventricle pumps oxygenated blood into the aorta." } },
        { say: "<b>Register</b> is how formal your language is. A speech at a ceremony needs a higher register than a chat at breakfast. Neither is better; each must fit the occasion.", show: { type: "table", rows: [
              ["Informal", "Thanks a lot for the help!"],
              ["Neutral", "Thank you for helping me."],
              ["Formal", "I am deeply grateful for your generous assistance."]
            ] } },
        { say: "This week's speech is the speech of <b>thanks</b>. A vague thank-you ('Thanks for everything') is forgettable. A specific one names the gift, the effort it cost, and its effect.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0L10 5L0 10z' fill='#333'/></marker></defs><rect x='20' y='110' width='170' height='90' rx='12' fill='#ffe6a6' stroke='#333' stroke-width='2'/><text x='105' y='151' font-size='22' text-anchor='middle' fill='#222' font-weight='bold'>The gift</text><text x='105' y='177' font-size='18' text-anchor='middle' fill='#222' >what they did</text><line x1='192' y1='155' x2='212' y2='155' stroke='#333' stroke-width='3' marker-end='url(#a)'/><rect x='214' y='110' width='170' height='90' rx='12' fill='#cdebd3' stroke='#333' stroke-width='2'/><text x='299' y='151' font-size='22' text-anchor='middle' fill='#222' font-weight='bold'>The cost</text><text x='299' y='177' font-size='18' text-anchor='middle' fill='#222' >effort it took</text><line x1='386' y1='155' x2='406' y2='155' stroke='#333' stroke-width='3' marker-end='url(#a)'/><rect x='408' y='110' width='172' height='90' rx='12' fill='#f6d0c8' stroke='#333' stroke-width='2'/><text x='494' y='151' font-size='22' text-anchor='middle' fill='#222' font-weight='bold'>The effect</text><text x='494' y='177' font-size='18' text-anchor='middle' fill='#222' >what it changed</text></svg>" } },
        { say: "Compare these. The second is no longer; it is simply more specific.", show: { type: "table", rows: [
              ["Vague", "Thank you, Grandpa, for everything you do."],
              ["Specific", "Thank you, Grandpa, for spending Saturday mornings teaching me chess; because of you, I won my first game."]
            ] } },
        { say: "Truth applies here too. Gratitude must be <b>sincere</b> (genuinely meant). Flattery is praise that is untrue or exaggerated to gain favor. A true, specific thank-you honors the person far more than inflated praise.", show: { type: "big", text: "Sincere thanks: true and specific.\nFlattery: exaggerated and self-serving." } },
        { say: "A short speech of thanks has a simple structure: <b>address</b> the person, <b>name</b> the gift, <b>show</b> its effect, and <b>close</b> with thanks once more.", show: { type: "list", items: ["Address: 'Grandma,'", "Name the gift: what she did", "Show the effect: what it meant to you", "Close: 'Thank you.'"] } },
        { say: "<b>Explain it.</b> Why must a speaker know the audience and purpose before choosing words? Explain the difference between sincere thanks and flattery, with an example of each.", show: { type: "passage", title: "Explain it", text: "Why must a speaker know the audience and purpose before choosing words? Explain the difference between sincere thanks and flattery, with an example of each.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise terms from this lesson." } }
      ], practice: [
        { q: "Which explanation of rain suits a three-year-old?", options: ["Tiny drops of water in clouds join together until they are heavy enough to fall.", "Condensation nuclei facilitate droplet coalescence.", "Ask a meteorologist.", "Rain is precipitation."], answer: "Tiny drops of water in clouds join together until they are heavy enough to fall.", hint: "Which uses words a small child knows?", why: "It is accurate and uses simple, concrete words." },
        { q: "You are writing to the mayor asking for a new crossing near the school. Which register fits?", options: ["Text-message style", "Very informal", "Formal"], answer: "Formal", hint: "Who is the reader, and how well do you know her?", why: "An official letter calls for a formal, respectful register." },
        { q: "Which thank-you is most specific?", options: ["Thank you for driving me to swimming every Tuesday in the rain; I have now passed my test.", "Thank you so much, really.", "You're the best!", "Thanks for everything!"], answer: "Thank you for driving me to swimming every Tuesday in the rain; I have now passed my test.", hint: "Which names the gift, the effort and the effect?", why: "It names the gift (driving), the cost (every Tuesday, in the rain) and the effect (passed the test)." },
        { q: "Which is flattery rather than sincere thanks?", options: ["'You are the greatest teacher who has ever lived in the whole world!' (said to get a better mark)", "'Thank you for explaining fractions again until I understood.'", "'Your patience helped me.'"], answer: "'You are the greatest teacher who has ever lived in the whole world!' (said to get a better mark)", hint: "Which is exaggerated and serves the speaker?", why: "Exaggerated praise offered to gain something is flattery; the others are true and specific." },
        { q: "What is a speaker's purpose in a speech of thanks?", options: ["To tell a joke", "To show off vocabulary", "To express genuine gratitude and honor the giver", "To ask for another gift"], answer: "To express genuine gratitude and honor the giver", hint: "What should the giver feel afterwards?", why: "The purpose is to honor the giver truthfully." },
        { q: "Order the parts of a short speech of thanks.", type: "order", items: ["Show its effect", "Close with thanks", "Name the gift", "Address the person"], answer: ["Address the person", "Name the gift", "Show its effect", "Close with thanks"], hint: "How do you begin speaking to someone?", why: "Address, name, effect, close." },
        { q: "A scientist explains her discovery to a room of eight-year-olds. What should she change most?", options: ["Whether the discovery is true", "The facts of the discovery", "Her vocabulary and examples", "Nothing at all"], answer: "Her vocabulary and examples", hint: "What may change, and what may never change?", why: "Words and examples adapt to the audience; the facts and their truth do not." },
        { q: "Which sentence is in a formal register?", options: ["Come along if you fancy it!", "Be there or be square.", "We request your attendance at the ceremony.", "Wanna come?"], answer: "We request your attendance at the ceremony.", hint: "Which would appear on an official invitation?", why: "Formal register uses complete, polite, careful phrasing." },
        { q: "Which detail best shows the EFFECT of a gift of books?", options: ["You bought them on a Wednesday.", "They came in a box.", "The books were heavy.", "I have read all six and now want to be an astronomer."], answer: "I have read all six and now want to be an astronomer.", hint: "Effect means what changed because of the gift.", why: "Only the first shows what the gift changed in the receiver." },
        { q: "Why should a speech to the whole family at a dinner be short?", options: ["Long speeches are rude by law", "Short speeches are always better", "The audience is at a meal and a toast is expected to be brief", "Families dislike speeches"], answer: "The audience is at a meal and a toast is expected to be brief", hint: "Think about the occasion and what the audience expects.", why: "Length must suit the occasion; a dinner toast is brief by custom." },
        { q: "A toast should last about 1 minute. At 130 words per minute, about how many words should it be?", type: "number", answer: 130, hint: "Words per minute × minutes.", why: "130 × 1 = 130 words." },
        { q: "Which change of audience requires the GREATEST change of words? Topic: how vaccines work.", options: ["From doctors to kindergarten children", "From one doctor to another doctor", "From nurses to doctors"], answer: "From doctors to kindergarten children", hint: "Which two audiences know the most different amounts?", why: "Doctors and young children differ most in background knowledge, so the explanation must change most." },
        { q: "'The audience is not only who hears you but what they already know and believe.' Why does that matter?", options: ["You must start from what they know and answer what they doubt", "You should ignore their beliefs", "You should tell them only what they want to hear", "It does not matter"], answer: "You must start from what they know and answer what they doubt", hint: "If they already doubt you, what must you supply?", why: "Knowing their starting point tells you what to explain and which doubts to answer with evidence. It never means telling them only what pleases them." },
        { gen: () => RH.termQ(["audience", "purpose", "register", "rhetoric", "delivery"]) },

        { q: "Which is the best opening for a speech of thanks to a teacher, given at a school assembly?", options: ["Hey, so, um, yeah, thanks.", "I have many things to say about many things.", "Mrs Okafor, on behalf of our class, I want to thank you.", "Teachers are paid to teach."], answer: "Mrs Okafor, on behalf of our class, I want to thank you.", hint: "Which addresses the person and states the purpose?", why: "It addresses her directly, names who is speaking for whom, and states the purpose at once." },
        { q: "Which closing line of a thank-you speech is strongest?", options: ["Any questions?", "So, yeah, that's it.", "For your patience and your example, thank you.", "Anyway, I'm done now."], answer: "For your patience and your example, thank you.", hint: "Which line returns to gratitude and is memorable?", why: "It sums up the gifts and closes with thanks, in a balanced phrase." },
        { q: "Explaining fractions to a five-year-old, which example fits best?", options: ["Sharing a pizza equally among four people", "Percent interest", "Algebraic expressions", "The ratio of a circle's circumference to its diameter"], answer: "Sharing a pizza equally among four people", hint: "What does a five-year-old already know?", why: "Begin from familiar experience: sharing food fairly." },
        { q: "A speaker uses many technical words with a young audience. What has she misjudged?", options: ["The date", "The truth of her facts", "The audience", "The purpose"], answer: "The audience", hint: "Who is listening?", why: "Her words did not fit her listeners' knowledge." },
        { q: "Which register suits a note to a close friend?", options: ["Informal", "Highly formal", "Legal"], answer: "Informal", hint: "How do you speak to a friend?", why: "Informal language fits close relationships." },
        { q: "A good speaker asks 'What does my audience already believe?' because:", options: ["She can then address their real doubts with evidence", "She wants to flatter them", "It does not matter", "She will change her facts to match"], answer: "She can then address their real doubts with evidence", hint: "What will they need to hear?", why: "Knowing their beliefs lets her answer their questions honestly, not tell them what they want." },
        { q: "Which detail best shows the COST of a gift?", options: ["It came in a bag.", "The scarf is red.", "She knitted the scarf over three months of evenings.", "It has stripes."], answer: "She knitted the scarf over three months of evenings.", hint: "Cost means what the giver gave up.", why: "Months of evenings show the effort it took." }
      ], challenge: [
        { q: "A politician gives two speeches on the same day: to farmers he promises that food prices will rise; to shoppers he promises that food prices will fall. What is wrong?", options: ["Nothing; good speakers please every audience", "He changed the substance of his promises, not just his words, to please each audience", "He adapted his vocabulary, which is always wrong", "He spoke twice in one day"], answer: "He changed the substance of his promises, not just his words, to please each audience", hint: "Is it possible for both promises to be kept at once?", why: "Adapting style to an audience is good rhetoric; changing the truth to please each audience is dishonest. Both promises cannot simply be true together." },
        { q: "A speaker gives a talk at the opening of a new children's library. Which purpose fits that audience and occasion?", options: ["To advertise a product", "To celebrate the new library and encourage children to read", "To explain the rules of farming", "To complain about the weather"], answer: "To celebrate the new library and encourage children to read", hint: "What does the opening of a library call for?", why: "The occasion is a happy one: celebrating the library and giving the children a reason to use it." },
        { q: "Which is the strongest test of whether you adapted to your audience well?", options: ["Check how long it took", "See whether you enjoyed giving it", "Ask a listener to explain the idea back, and check it is accurate", "Count how many big words you used"], answer: "Ask a listener to explain the idea back, and check it is accurate", hint: "How do you know they understood, rather than guess?", why: "The best evidence of clarity is the audience's accurate restatement of your idea." },
        { gen: () => RH.respQ() },
        { q: "You must explain the same scientific finding to (a) a newspaper's readers and (b) a scientific journal. Which may change between the two, and which may NOT?", options: ["Everything may change", "Vocabulary and detail may change; the finding and its uncertainty may not", "The finding may change; the words may not", "Nothing may change"], answer: "Vocabulary and detail may change; the finding and its uncertainty may not", hint: "What belongs to style, and what belongs to truth?", why: "Style adapts to audience; the facts, including how certain they are, stay the same." }
      ], extend: "Write a formal letter of thanks to someone who helped you learn something this year. Draft it, then cut every vague word. Ask a grown-up to check the register, then post or deliver it.", offline: "At a family meal this week, give a one-minute speech of thanks to one person: address them, name a specific gift, show its effect, and close. Stand, look at them, and speak slowly." },
    { title: "Fact, opinion and preference", icon: "🔎", learn: [
        { say: "Before we argue, we must sort statements. A <b>fact</b> is a statement that can be checked and is true. An <b>opinion</b> is a judgement that can be supported or challenged with reasons and evidence. A <b>preference</b> is a matter of personal taste.", show: { type: "passage", title: "Kind · Example · How we test it", text: "Factual claim — Example: Water boils at 100 °C at sea level.; How we test it: Measure; check reliable sources\n\nOpinion (judgement) — Example: Our school should start later.; How we test it: Weigh reasons and evidence\n\nPreference — Example: I like mint ice cream best.; How we test it: Not argued; simply reported" } },
        { say: "Careful: a <b>factual claim</b> can be false. 'The Moon is made of cheese' is a factual claim (it is about the world and can be checked) but it is false. We call a checked, true claim a <b>fact</b>.", show: { type: "big", text: "Factual claim: checkable.\nFact: checked and true." } },
        { say: "Opinions are not all equal. 'Smoking should be banned in playgrounds' rests on a true reason: overwhelming evidence that smoke harms children. An opinion is only as strong as its true reasons, and how well they support it.", show: { type: "list", items: ["Strong opinion: true reasons, good evidence", "Weak opinion: few or false reasons", "'It's just my opinion' does not end the discussion"] } },
        { say: "To test any claim, ask four questions: <b>Is it true?</b> <b>How do we know?</b> <b>What is the evidence?</b> <b>Is the source reliable?</b>", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0L10 5L0 10z' fill='#333'/></marker></defs><rect x='20' y='30' width='270' height='110' rx='12' fill='#eef4fb' stroke='#333' stroke-width='2'/><text x='155' y='92' font-size='24' text-anchor='middle' fill='#222' font-weight='bold'>Is it true?</text><rect x='310' y='30' width='270' height='110' rx='12' fill='#ffe6a6' stroke='#333' stroke-width='2'/><text x='445' y='92' font-size='24' text-anchor='middle' fill='#222' font-weight='bold'>How do we know?</text><rect x='20' y='175' width='270' height='110' rx='12' fill='#cdebd3' stroke='#333' stroke-width='2'/><text x='155' y='237' font-size='22' text-anchor='middle' fill='#222' font-weight='bold'>What is the evidence?</text><rect x='310' y='175' width='270' height='110' rx='12' fill='#f6d0c8' stroke='#333' stroke-width='2'/><text x='445' y='237' font-size='22' text-anchor='middle' fill='#222' font-weight='bold'>Is the source reliable?</text></svg>" } },
        { say: "Preferences cannot be wrong; you cannot be mistaken about liking mint. But a preference is not a reason for others: 'I like it' tells us about you, not about whether something is good, true or wise.", show: { type: "table", rows: [
              ["Preference", "I prefer cats."],
              ["Opinion", "Cats make better pets for small flats than dogs, because they need no walks."],
              ["Factual claim", "Cats sleep for many hours each day."]
            ] } },
        { say: "Wise people change their minds when evidence and sound reasoning show they were wrong, and not merely because someone argued loudly or cleverly. Proverbs 14:15 (WEB): 'A simple man believes everything, but the prudent man carefully considers his ways.'", show: { type: "big", text: "Change your mind for evidence,\nnot for pressure." } },
        { say: "<b>Explain it.</b> Explain the difference between a fact, an opinion and a preference, with one example of each. Then explain why 'that's just my opinion' does not make all opinions equally good.", show: { type: "passage", title: "Explain it", text: "Explain the difference between a fact, an opinion and a preference, with one example of each. Then explain why 'that's just my opinion' does not make all opinions equally good.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise terms from this lesson." } }
      ], practice: [
        { q: "'The Nile is the longest river in Africa.' What kind of statement is this?", options: ["Preference", "Opinion", "Factual claim"], answer: "Factual claim", hint: "Can it be checked by measurement?", why: "It can be checked against measurements, so it is a factual claim (and a true one)." },
        { q: "'Chocolate is the best flavor.' What kind of statement is this?", options: ["Preference", "Factual claim", "Fact"], answer: "Preference", hint: "Is this about the world, or about the speaker's taste?", why: "It reports a taste. Saying 'best' does not make it a fact." },
        { q: "'Every child should learn to swim.' What kind of statement is this?", options: ["Opinion (a judgement that can be argued)", "Fact", "Preference"], answer: "Opinion (a judgement that can be argued)", hint: "Could you give reasons for and against it?", why: "It is a judgement about what ought to happen, supported or challenged by reasons." },
        { q: "'Spiders are insects.' This is:", options: ["A false factual claim", "A preference", "A true fact"], answer: "A false factual claim", hint: "How many legs do spiders have? And insects?", why: "It is checkable, and false: spiders have eight legs and are arachnids, not insects." },
        { q: "Which is a fact?", options: ["A week has seven days.", "Mondays are horrible.", "Weekends are the best part of the week.", "I like Tuesdays."], answer: "A week has seven days.", hint: "Which can be checked and found true?", why: "By definition, a week has seven days." },
        { q: "Your friend says, 'Dogs are smarter than cats, and that's just my opinion, so you can't argue.' What is the best response?", options: ["You're right; opinions can't be discussed", "Cats are smarter, and that is my opinion", "Walk away", "Opinions can be argued; what evidence supports it?"], answer: "Opinions can be argued; what evidence supports it?", hint: "Does calling something an opinion protect it from questions?", why: "Opinions are claims that need reasons; asking for evidence is fair and respectful." },
        { q: "Which question tests whether a source is reliable?", options: ["Does it agree with me?", "Does the writer have expert knowledge and no reason to mislead?", "Is the website colorful?", "Is it popular?"], answer: "Does the writer have expert knowledge and no reason to mislead?", hint: "What makes a witness trustworthy?", why: "Reliability depends on knowledge, honesty and freedom from conflicts of interest, not looks or popularity." },
        { q: "When should a careful thinker change her mind?", options: ["Never", "Whenever someone argues loudly", "Whenever a friend disagrees", "When evidence and sound reasoning show her view is false"], answer: "When evidence and sound reasoning show her view is false", hint: "What should move a mind: pressure or proof?", why: "Truth-seekers yield to evidence and sound reasoning, not to pressure or volume." },
        { q: "Which statement is an opinion supported by evidence?", options: ["Exercise is fun.", "Exercise is good for children, as many careful studies show it strengthens heart and bones.", "Running is the best sport ever.", "I like football."], answer: "Exercise is good for children, as many careful studies show it strengthens heart and bones.", hint: "Which gives a reason that can be checked?", why: "It is a judgement backed by checkable evidence; the others are preferences or unsupported." },
        { q: "Order the four testing questions as you would ask them.", type: "order", items: ["What is the evidence?", "How do we know?", "Is the source reliable?", "Is it true?"], answer: ["Is it true?", "How do we know?", "What is the evidence?", "Is the source reliable?"], hint: "Begin with the claim itself.", why: "Ask whether it is true, then how we could know, what the evidence is, and whether its source is trustworthy." },
        { q: "'Most people believe it, so it must be true.' What is wrong with this?", options: ["Many people can be wrong; belief is not evidence", "It is a preference", "Nothing", "Only scientists can believe things"], answer: "Many people can be wrong; belief is not evidence", hint: "Did most people once believe the Earth stood still?", why: "Popularity is not evidence. Many widely held beliefs have proved false." },
        { q: "Which is a preference that is being disguised as a fact?", options: ["'Blue light has a shorter wavelength than red light.'", "'I like blue.'", "'Blue is objectively the best color.'"], answer: "'Blue is objectively the best color.'", hint: "Which statement uses the language of fact for a matter of taste?", why: "'Objectively best' pretends that a taste is a checkable fact." },
        { q: "Of these statements, how many are factual claims? (1) The Sun is a star. (2) Pizza is delicious. (3) Frogs are amphibians. (4) Homework should be banned. (5) Paris is the capital of France.", type: "number", answer: 3, hint: "Which ones could be checked against reliable sources?", why: "Statements 1, 3 and 5 are checkable (and true). Statement 2 is a preference and 4 is an opinion." },

        { q: "Which statement turns a preference into an opinion that can be argued?", options: ["Adventure stories exist.", "Adventure stories are yummy.", "Our class should read more adventure stories, because they keep reluctant readers going.", "I like adventure stories."], answer: "Our class should read more adventure stories, because they keep reluctant readers going.", hint: "Which gives a reason others could weigh?", why: "It claims what should happen and gives a reason that can be examined." },
        { q: "Two people disagree about whether a bridge is safe. What should settle it?", options: ["A vote", "Whoever is louder", "Whoever is older", "An engineer's measurement and inspection"], answer: "An engineer's measurement and inspection", hint: "Is this a matter of taste or of fact?", why: "Safety is a factual question; evidence settles it." },
        { q: "Which is the best response to 'I read it online, so it's true'?", options: ["Agree to avoid an argument.", "Then it must be true.", "The internet is always false.", "Which website, who wrote it, and what is their evidence?"], answer: "Which website, who wrote it, and what is their evidence?", hint: "What are the four testing questions?", why: "Online claims are tested like any other: source, author, evidence." }
      ], challenge: [
        { q: "'It is wrong to tell lies to hurt people.' Some say this is 'just an opinion'. What is the best description?", options: ["A false claim", "A preference, like liking a color", "A scientific fact checked by measurement", "A moral claim that can be supported with strong reasons, not a mere preference"], answer: "A moral claim that can be supported with strong reasons, not a mere preference", hint: "Is this like 'I like mint', or is it something we can reason about?", why: "Moral claims are not measured like temperatures, but they are also not mere tastes: we can give reasons, and some moral claims are far better supported than others." },
        { q: "A newspaper says, 'Scientists have proved that chocolate makes you clever.' The study tested 12 people for one day. Which response is wisest?", options: ["Believe it, because a newspaper printed it", "Decide it is false, because you dislike chocolate", "Believe it, because scientists did it", "Withhold belief: the evidence is too small to support such a strong claim"], answer: "Withhold belief: the evidence is too small to support such a strong claim", hint: "Does the strength of the claim match the strength of the evidence?", why: "A tiny, short study cannot prove a sweeping claim. The wise response is to suspend judgement, neither believing nor rejecting it because of feelings." },
        { q: "Which statement is a factual claim that is very hard to check, yet still either true or false?", options: ["'Exactly 4,000 people watched the first Olympic Games.'", "'The Olympic Games are exciting.'", "'I prefer swimming to running.'"], answer: "'Exactly 4,000 people watched the first Olympic Games.'", hint: "Is there a definite answer even if no one recorded it?", why: "There was a definite number of spectators at the first Games, even though we may never know it. Hard to know is not the same as being mere opinion." },
        { gen: () => RH.corrQ() },
        { q: "Is 'Mozart was the greatest composer' a preference, an opinion, or a fact?", options: ["An opinion: it can be argued with reasons (influence, skill), though not proved like a measurement", "A pure preference that cannot be discussed", "A false factual claim", "A fact"], answer: "An opinion: it can be argued with reasons (influence, skill), though not proved like a measurement", hint: "Can people give reasons for and against it?", why: "It is a judgement supported or challenged by reasons such as his influence and craft. Saying 'I enjoy Mozart most' would be a preference." }
      ], extend: "Collect ten statements from a newspaper, a cereal box, a book and a conversation. Sort them into factual claims, opinions and preferences. For each factual claim, write how you could check it, and actually check two.", offline: "At dinner, play 'Fact, Opinion, Preference': each person says a statement and the others classify it, giving a reason. If a factual claim is disputed, decide together how you could check it." },
    { title: "The chreia: elaborating a saying", icon: "💬", learn: [
        { say: "A <b>chreia</b> (KRAY-uh; Greek for 'useful') is a brief, memorable saying or action of a real person. Students learned to <b>elaborate</b> it: to explain and support it in a short essay with set steps.", show: { type: "passage", title: "Diogenes Laertius, Life of Aristotle (trans. C. D. Yonge)", text: "It was a saying of his that the roots of education were bitter, but the fruit sweet.\n\n(The ancient teacher Aphthonius used a version of this saying, credited to Isocrates, as his model chreia; ancient writers disagree about who first said it.)" } },
        { say: "Chreiai come in three kinds: a <b>saying</b>, an <b>action</b>, or a <b>mixed</b> one. Plutarch tells a famous mixed chreia: Alexander the Great found the philosopher Diogenes lying in the sun and kindly asked whether he wanted anything.", show: { type: "passage", title: "Kind · Example", text: "Saying: Aristotle: the roots of education are bitter, the fruit sweet.\n\nAction: Demosthenes practiced speaking with pebbles in his mouth.\n\nMixed: Diogenes, asked by Alexander whether he wanted anything: \"Yes,\" said he, \"I would have you stand from between me and the sun.\" (Plutarch, Life of Alexander, Dryden trans.)" } },
        { say: "The teacher Aphthonius gave eight steps for elaborating a chreia. Together they make a complete short argument: a claim, explained, supported several ways, and concluded.", show: { type: "list", items: ["1. Praise the speaker", "2. Paraphrase the saying", "3. Give the cause", "4. Argue from the opposite", "5. Give an analogy", "6. Give an example", "7. Cite testimony", "8. Conclude briefly"] } },
        { say: "Here is the Aristotle chreia elaborated, step by step.", show: { type: "passage", title: "Step · Example", text: "Praise: Aristotle taught Alexander the Great and founded the Lyceum in Athens.\n\nParaphrase: Learning is hard at first but brings great rewards.\n\nCause: Skill requires effort, and effort is uncomfortable.\n\nOpposite: One who avoids hard study gains no lasting skill.\n\nAnalogy: Like a farmer who labors in spring to harvest in autumn.\n\nExample: Demosthenes labored over his voice and became Athens' greatest orator.\n\nTestimony: 'Whatever your hand finds to do, do it with your might; […]' (Ecclesiastes 9:10, WEB)\n\nConclusion: So we should endure the bitter root for the sweet fruit." } },
        { say: "Notice that each step must be <b>true</b>. An example that never happened, or a cause that is false, weakens the whole. The analogy (a comparison between two similar cases) must be genuinely similar in the way that matters.", show: { type: "big", text: "Every step must be true\nand must support the saying." } },
        { say: "Elaboration is not padding. Each step answers a reader's question: What does it mean? Why is it so? What if we did the opposite? What is it like? Has it happened? Who agrees? So what?", show: { type: "passage", title: "Step · Reader's question", text: "Paraphrase: What does it mean?\n\nCause: Why is it so?\n\nOpposite: What if we did the reverse?\n\nAnalogy: What is it like?\n\nExample: Has it really happened?\n\nTestimony: Who else agrees?\n\nConclusion: So what should we do?" } },
        { say: "<b>Explain it.</b> What is a chreia, and what are the eight steps of elaboration? Choose one step and explain which question it answers for the reader.", show: { type: "passage", title: "Explain it", text: "What is a chreia, and what are the eight steps of elaboration? Choose one step and explain which question it answers for the reader.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise terms from this lesson." } }
      ], practice: [
        { q: "What does 'chreia' mean in Greek?", options: ["Short", "Wise", "Ancient", "Useful"], answer: "Useful", hint: "Why would teachers collect these sayings?", why: "Chreiai were 'useful': short, memorable, and good material for teaching and speeches." },
        { q: "Diogenes, asked by Alexander whether he wanted anything, asked him to stand from between him and the sun. What kind of chreia is this?", options: ["A fable", "A saying only", "Mixed (an action with a saying)", "An action only"], answer: "Mixed (an action with a saying)", hint: "Is there both an event and words?", why: "There is a situation (Alexander's offer) and a reply in words: a mixed chreia." },
        { q: "What does the Diogenes chreia most likely teach?", options: ["Kings should stand still", "Sunlight is dangerous", "Wealth and power cannot give some things a wise person values more", "Be rude to rulers"], answer: "Wealth and power cannot give some things a wise person values more", hint: "What did Diogenes refuse, and what did he want instead?", why: "He was offered anything a king could give, and wanted only what no king can give or take: sunlight and simplicity." },
        { q: "In 'the roots of education were bitter, but the fruit sweet', what are the 'roots'?", options: ["The hard early work of learning", "A plant", "The teacher", "The school building"], answer: "The hard early work of learning", hint: "This is a metaphor: what is the beginning of learning like?", why: "The roots are the difficult beginning; the fruit is the reward of knowledge." },
        { q: "Which is an accurate PARAPHRASE of the Aristotle chreia?", options: ["Learning takes difficult effort, but its rewards are delightful", "Fruit is better than roots", "Education tastes bad", "Never study"], answer: "Learning takes difficult effort, but its rewards are delightful", hint: "A paraphrase keeps the meaning in new words.", why: "It keeps both halves of the contrast in plain words." },
        { q: "Which step answers 'What if we did the reverse?'", options: ["Argue from the opposite", "Paraphrase", "Give an example", "Praise the speaker"], answer: "Argue from the opposite", hint: "Which step imagines the contrary case?", why: "Arguing from the opposite shows what happens without the advice." },
        { q: "Which is the best ANALOGY for 'the roots are bitter, the fruit sweet'?", options: ["A cat sleeps in the sun", "Rain falls in winter", "An athlete trains painfully for months and then wins the race", "A shop sells apples"], answer: "An athlete trains painfully for months and then wins the race", hint: "Which case has hard effort first and reward later?", why: "The athlete's case matches the structure: discomfort now, reward later." },
        { q: "Which is a real EXAMPLE (from history) rather than an analogy?", options: ["Demosthenes trained his weak voice and became Athens' greatest orator", "It is like a seed growing", "It is like climbing a hill", "Imagine a student who works hard"], answer: "Demosthenes trained his weak voice and became Athens' greatest orator", hint: "An example is an actual case that happened.", why: "Demosthenes really lived, and Plutarch reports this of him: a historical case. The others are comparisons or imagined cases." },
        { q: "Order the eight steps of the chreia.", type: "order", items: ["Give the cause", "Praise the speaker", "Give an analogy", "Conclude briefly", "Cite testimony", "Argue from the opposite", "Paraphrase the saying", "Give an example"], answer: ["Praise the speaker", "Paraphrase the saying", "Give the cause", "Argue from the opposite", "Give an analogy", "Give an example", "Cite testimony", "Conclude briefly"], hint: "It begins by honoring the speaker and ends with a brief conclusion.", why: "Praise, paraphrase, cause, opposite, analogy, example, testimony, conclusion." },
        { q: "A student's 'example' step says: 'Isaac Newton studied hard as a boy and invented the telephone.' What is wrong?", options: ["Newton is not famous", "It is false: Newton did not invent the telephone", "It is too short", "Examples are not allowed"], answer: "It is false: Newton did not invent the telephone", hint: "Check the facts in the example.", why: "A false example weakens the whole elaboration. (The telephone is usually credited to Alexander Graham Bell, in 1876.)" },
        { q: "Which is the best 'cause' step for the maxim 'A soft answer turns away anger'?", options: ["Anger is bad", "Solomon was wise", "A calm reply gives the angry person nothing to push against, so their anger cools", "It is in the Bible"], answer: "A calm reply gives the angry person nothing to push against, so their anger cools", hint: "The cause step explains WHY the saying is true.", why: "It explains the mechanism (how and why it works)." },
        { q: "A student writes two sentences for each of the eight steps. How many sentences is her elaboration?", type: "number", answer: 16, hint: "Two for each step.", why: "8 × 2 = 16 sentences." },
        { q: "What is 'testimony' in the chreia?", options: ["A respected authority who says the same thing", "A question", "A joke", "Your own feeling"], answer: "A respected authority who says the same thing", hint: "In a courtroom, who gives testimony?", why: "Testimony cites another wise voice in agreement. It supports the claim, but is weaker than evidence and reasons." },

        { q: "Which is a chreia of ACTION (not a saying)?", options: ["Demosthenes shaved half his head so he would be too embarrassed to go out, and stayed home to practice.", "A stitch in time saves nine.", "'Know thyself.'", "Aristotle said the roots of education were bitter."], answer: "Demosthenes shaved half his head so he would be too embarrassed to go out, and stayed home to practice.", hint: "Which reports a deed rather than words?", why: "Plutarch tells this deed of Demosthenes: an action chreia." },
        { q: "Why should the 'praise the speaker' step be TRUE praise?", options: ["False praise misleads the audience and weakens trust", "Praise must always be long", "Speakers like flattery", "It does not matter"], answer: "False praise misleads the audience and weakens trust", hint: "What happens to your credibility if the praise is inflated?", why: "Exaggerated praise is flattery; it misleads and undermines the speaker's honesty." },
        { q: "The conclusion of a chreia elaboration should:", options: ["List every step again", "Introduce a new saying", "Ask the audience to vote", "Draw the practical lesson briefly"], answer: "Draw the practical lesson briefly", hint: "Aphthonius called it 'a brief epilogue'.", why: "A short exhortation applying the saying ends the piece." },
        { q: "Which is the best 'cause' step for 'Actions speak louder than words'?", options: ["Because words are quiet", "Because deeds cost effort, they show what a person truly values", "Because Aesop said so", "Because actions are loud"], answer: "Because deeds cost effort, they show what a person truly values", hint: "Why would deeds reveal more than words?", why: "Words are cheap to give; deeds require effort and so reveal real priorities." },
        { q: "If each of the eight steps takes about 20 seconds to say, how many seconds does the whole elaboration take?", type: "number", answer: 160, hint: "Multiply.", why: "8 × 20 = 160 seconds (2 minutes 40 seconds)." }
      ], challenge: [
        { q: "Why is 'testimony of the ancients' usually the WEAKEST support in an elaboration?", options: ["It always comes last", "It is the longest step", "Ancient people were never wise", "An authority can be mistaken; the strongest support is true reasons and real examples"], answer: "An authority can be mistaken; the strongest support is true reasons and real examples", hint: "If a respected person said something false, would it become true?", why: "Testimony tells us someone wise agreed; it is valuable, but authorities can err. Reasons and evidence can be checked directly." },
        { q: "A student's analogy for 'Practice makes perfect' is: 'Just as a river carves a canyon by flowing for a million years, practice shapes skill.' What is the analogy's main WEAKNESS?", options: ["Rivers are not real", "It is too short", "The river does not choose or improve by learning; only the 'repeated small effort' part matches", "Canyons are too big"], answer: "The river does not choose or improve by learning; only the 'repeated small effort' part matches", hint: "In what way are the two cases similar, and in what way different?", why: "Analogies hold only in specific respects. Repetition over time matches; deliberate learning from mistakes does not. A careful speaker says where the likeness lies." },
        { q: "Which conclusion follows best from the elaboration of 'the roots of education were bitter, but the fruit sweet'?", options: ["Therefore, eat more fruit", "Therefore, Aristotle was the best teacher", "Therefore, endure the difficult early stages of learning for the sake of its rewards", "Therefore, avoid difficult subjects"], answer: "Therefore, endure the difficult early stages of learning for the sake of its rewards", hint: "The conclusion should apply the saying to action.", why: "A conclusion draws the practical lesson from the argument, without adding a new, unsupported claim." },
        { gen: () => RH.stepQ() },
        { q: "A student's testimony step quotes 'Be the change you wish to see in the world' and credits Gandhi. Researchers have not found these exact words in Gandhi's writings. What should she do?", options: ["Remove all testimony forever", "Keep it; it sounds like him", "Use a verified quotation, or note honestly that the attribution is doubtful", "Credit it to someone else"], answer: "Use a verified quotation, or note honestly that the attribution is doubtful", hint: "Is testimony valid if the witness never said it?", why: "A misattributed quotation is false testimony. Use the verified words, or none." }
      ], extend: "Elaborate this chreia in eight short paragraphs: 'Benjamin Franklin wrote that an investment in knowledge pays the best interest.' (Check first: is this exact wording reliably attributed to Franklin? Find out, and say honestly what you discovered.)", offline: "Give a two-minute spoken elaboration of the Diogenes chreia to the family, using all eight steps. A grown-up holds up a finger for each step they hear." },
    { title: "The maxim: testing proverbs", icon: "📏", learn: [
        { say: "A <b>maxim</b> (Greek gnome) is a short general statement about life, like a proverb. Unlike a chreia, which is always credited to a particular person, a maxim need not be tied to any speaker or event. The Book of Proverbs is a great collection of maxims.", show: { type: "passage", title: "Proverbs (World English Bible)", text: "A gentle answer turns away wrath, but a harsh word stirs up anger. (15:1)\n\nHe who pleads his cause first seems right; until another comes and questions him. (18:17)\n\nA simple man believes everything, but the prudent man carefully considers his ways. (14:15)" } },
        { say: "Proverbs 18:17 is a maxim about rhetoric itself. The first speaker always <b>seems</b> right, until someone questions him. Hearing only one side is a recipe for error.", show: { type: "big", text: "First speaker: seems right.\nThen: questions and evidence." } },
        { say: "Maxims are elaborated with the same eight steps as the chreia. The first step praises the author if one is known (Aphthonius' model maxim, from the poet Theognis, begins by praising Theognis); otherwise, praise the maxim or the tradition it comes from.", show: { type: "list", items: ["1. Praise the maxim", "2. Paraphrase", "3. Cause", "4. Opposite", "5. Analogy", "6. Example", "7. Testimony", "8. Conclusion"] } },
        { say: "Some maxims seem to contradict each other. 'Look before you leap' warns against haste; 'He who hesitates is lost' warns against delay. Both can be true, but in <b>different circumstances</b>. A wise speaker states the conditions.", show: { type: "table", rows: [
              ["Maxim", "True when…"],
              ["Look before you leap", "the risk is great and time allows thought"],
              ["He who hesitates is lost", "the chance is brief and the risk is small"]
            ] } },
        { say: "Most maxims are <b>generalizations</b>: they are usually, not always, true. Careful speakers use <b>qualifiers</b> (limiting words) such as 'usually', 'often', 'most' and 'in general'. A qualifier makes a claim more modest, and more likely to be true.", show: { type: "table", rows: [
              ["Sweeping", "Qualified"],
              ["Gentle answers stop anger.", "Gentle answers often calm anger."],
              ["Exercise makes you happy.", "Regular exercise tends to improve mood."]
            ] } },
        { say: "So test a maxim like any claim: Is it true? Always, or only usually? In which conditions? What examples support it, and are there counter-examples (cases where it fails)?", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0L10 5L0 10z' fill='#333'/></marker></defs><rect x='180' y='20' width='240' height='60' rx='12' fill='#ffe6a6' stroke='#333' stroke-width='2'/><text x='300' y='57' font-size='22' text-anchor='middle' fill='#222' font-weight='bold'>A maxim</text><line x1='260' y1='82' x2='160' y2='140' stroke='#333' stroke-width='3' marker-end='url(#a)'/><line x1='340' y1='82' x2='440' y2='140' stroke='#333' stroke-width='3' marker-end='url(#a)'/><rect x='20' y='145' width='260' height='70' rx='12' fill='#cdebd3' stroke='#333' stroke-width='2'/><text x='150' y='187' font-size='20' text-anchor='middle' fill='#222' font-weight='bold'>Examples: true when…</text><rect x='320' y='145' width='260' height='70' rx='12' fill='#f6d0c8' stroke='#333' stroke-width='2'/><text x='450' y='187' font-size='20' text-anchor='middle' fill='#222' font-weight='bold'>Counter-examples</text><text x='300' y='280' font-size='22' text-anchor='middle' fill='#222' font-weight='bold'>→ State the conditions honestly</text></svg>" } },
        { say: "<b>Explain it.</b> Explain what a maxim is and why two proverbs can seem to contradict each other yet both be wise. Use 'Look before you leap' and 'He who hesitates is lost'.", show: { type: "passage", title: "Explain it", text: "Explain what a maxim is and why two proverbs can seem to contradict each other yet both be wise. Use 'Look before you leap' and 'He who hesitates is lost'.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise terms from this lesson." } }
      ], practice: [
        { q: "What is the difference between a maxim and a chreia?", options: ["There is no difference", "A chreia has no words", "A maxim is a general saying that need not be tied to a particular person or event", "A maxim is always longer"], answer: "A maxim is a general saying that need not be tied to a particular person or event", hint: "Does 'A stitch in time saves nine' belong to a famous speaker?", why: "A chreia belongs to a named person; a maxim is a general saying." },
        { q: "'He who pleads his cause first seems right; until another comes and questions him.' What does this teach a listener?", options: ["Hear both sides before judging", "Never ask questions", "The first speaker is always right", "Speak first to win"], answer: "Hear both sides before judging", hint: "What happens when 'another comes'?", why: "The first account seems convincing only until it is questioned. Wait for both sides." },
        { q: "'A gentle answer turns away wrath, […]' What does 'wrath' mean?", options: ["A kind of food", "Intense anger", "A soft voice", "A long journey"], answer: "Intense anger", hint: "The second half of the verse says 'a harsh word stirs up anger'.", why: "Wrath is intense anger; the verse contrasts calming and inflaming it." },
        { q: "Which is a qualified (limited) version of 'Practice makes perfect'?", options: ["Practice always makes everyone perfect", "Practice is pointless", "Careful practice usually improves skill", "Perfect people practice"], answer: "Careful practice usually improves skill", hint: "Which version uses a limiting word and a modest claim?", why: "'Usually improves' is modest and true; 'perfect' is rarely reached." },
        { q: "'Look before you leap' is wisest when:", options: ["Any decision at all", "The risk is great and there is time to think", "Never", "A ball is flying at your face"], answer: "The risk is great and there is time to think", hint: "When does thinking first prevent harm?", why: "When mistakes are costly and time permits, thinking first is wise." },
        { q: "Which is a counter-example to 'Birds can fly'?", options: ["Sparrows", "Owls", "Eagles", "Penguins"], answer: "Penguins", hint: "A counter-example is a case where the statement fails.", why: "Penguins are birds that cannot fly, so 'all birds can fly' is false; 'most birds can fly' is true." },
        { q: "Which word is a qualifier?", options: ["Usually", "Every", "Always", "Never"], answer: "Usually", hint: "Which word limits a claim rather than making it total?", why: "'Usually' limits the claim; 'always', 'every' and 'never' make it absolute." },
        { q: "A friend says, 'Too many cooks spoil the broth, so we should work alone.' You reply, 'Many hands make light work.' What is the wisest next step?", options: ["Count the proverbs on each side", "Give up", "Repeat your proverb more loudly", "Ask which applies to this particular task, and why"], answer: "Ask which applies to this particular task, and why", hint: "Can a proverb settle the question by itself?", why: "Each proverb fits some situations. The real question is the facts of this task." },
        { q: "Which sentence is the 'opposite' step for the maxim 'Honesty is the best policy'?", options: ["George Washington was honest", "Honesty is a virtue", "Honest means truthful", "A liar must remember every lie, and once caught, is never trusted again"], answer: "A liar must remember every lie, and once caught, is never trusted again", hint: "The opposite step describes what happens when we do the reverse.", why: "It shows the consequences of dishonesty, which supports the maxim from the other side." },
        { q: "'A simple man believes everything, […]' In this verse, 'simple' means:", options: ["Quiet", "Clever", "Plain and modest", "Naive, easily misled"], answer: "Naive, easily misled", hint: "The verse contrasts him with 'the prudent man'.", why: "Here 'simple' means naive, the opposite of prudent." },
        { q: "Order from most sweeping to most qualified.", type: "order", items: ["Some dogs are friendly.", "All dogs are friendly.", "Most dogs are friendly.", "Many dogs are friendly."], answer: ["All dogs are friendly.", "Most dogs are friendly.", "Many dogs are friendly.", "Some dogs are friendly."], hint: "Which word claims the most?", why: "All > most > many > some: each claim is more modest than the last." },
        { q: "Of these, how many are absolute words (allowing no exceptions)? always, usually, never, often, all, some, every", type: "number", answer: 4, hint: "Which words leave no room for exceptions?", why: "Always, never, all and every are absolute (4); usually, often and some are qualifiers." },
        { q: "Why are absolute claims ('always', 'never') risky in an argument?", options: ["They are too short", "Audiences dislike them", "They are grammatically wrong", "One counter-example disproves them"], answer: "One counter-example disproves them", hint: "How many penguins does it take to disprove 'all birds fly'?", why: "A single counter-example defeats an absolute claim, so careful speakers use them only when they are certain." },

        { q: "'Absence makes the heart grow fonder' vs 'Out of sight, out of mind.' What makes the difference?", options: ["Nothing; one is simply false", "Which proverb is older", "Which is shorter", "The strength of the relationship and the length of the absence"], answer: "The strength of the relationship and the length of the absence", hint: "When does missing someone grow, and when does it fade?", why: "Strong bonds and short absences tend to deepen affection; weak bonds and long absences fade. The facts decide which fits." },
        { q: "Which maxim is wise advice for listeners of rhetoric?", options: ["He who pleads his cause first seems right; until another comes and questions him.", "Speak first to win.", "Believe whoever is loudest.", "Never ask questions."], answer: "He who pleads his cause first seems right; until another comes and questions him.", hint: "Which warns against judging too early?", why: "Proverbs 18:17 (WEB) urges hearing both sides and questioning." },
        { q: "Which qualifier fits best? '____ volcanoes are found near the edges of tectonic plates.'", options: ["No", "All", "Exactly half of", "Most"], answer: "Most", hint: "Are there any volcanoes away from plate edges? (Hawaii is one.)", why: "Most volcanoes lie near plate edges, but hotspots like Hawaii are exceptions, so 'most', not 'all'." },
        { q: "What is the 'example' step for 'Pride goes before destruction'?", options: ["Pride is a feeling.", "The 'unsinkable' Titanic sailed with too few lifeboats and sank in 1912.", "Like a balloon that bursts.", "Proverbs is a book of the Bible."], answer: "The 'unsinkable' Titanic sailed with too few lifeboats and sank in 1912.", hint: "Which is a real event?", why: "A real historical case is an example; the balloon is an analogy." }
      ], challenge: [
        { q: "Which statement is BOTH absolute and true?", options: ["It never rains in summer.", "Every child likes candy.", "All rivers flow south.", "Every square has four sides."], answer: "Every square has four sides.", hint: "Some absolutes are true by definition.", why: "A square is defined as having four equal sides, so 'every square has four sides' admits no exceptions." },
        { q: "'Proverbs 18:17 shows that the first speaker is always wrong.' What is the error?", options: ["The verse is about cooking", "The first speaker is always right", "There is no error", "The verse says the first speaker SEEMS right until questioned, not that he is wrong"], answer: "The verse says the first speaker SEEMS right until questioned, not that he is wrong", hint: "Read the verb carefully: 'seems'.", why: "The verse warns against judging early. After questioning, the first speaker may prove right or wrong; the point is to examine." },
        { q: "A speaker elaborates 'Early to bed and early to rise makes a man healthy, wealthy and wise' with the example: 'My uncle goes to bed early and is rich.' What is the main weakness?", options: ["The uncle is not famous", "The maxim is too old", "One case cannot show that early sleep CAUSES wealth", "Examples are not allowed"], answer: "One case cannot show that early sleep CAUSES wealth", hint: "Could the uncle be rich for a different reason?", why: "A single example shows only that the two things happened together once. It does not show one caused the other." },

      ], extend: "Collect six pairs of proverbs that seem to contradict each other (e.g. 'Absence makes the heart grow fonder' / 'Out of sight, out of mind'). For each pair, write when each is true. Then write a qualified maxim of your own.", offline: "Choose one maxim from Proverbs (WEB). Elaborate it aloud for the family in eight steps, in under three minutes. Include at least one honest counter-example and say what conditions make the maxim true." },
    { title: "Argument I: claim, reason, evidence", icon: "🧱", learn: [
        { say: "In rhetoric, an <b>argument</b> is not a quarrel. It is a <b>claim</b> supported by <b>reasons</b>, which are in turn supported by <b>evidence</b>.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0L10 5L0 10z' fill='#333'/></marker></defs><rect x='170' y='20' width='260' height='60' rx='12' fill='#ffe6a6' stroke='#333' stroke-width='2'/><text x='300' y='57' font-size='24' text-anchor='middle' fill='#222' font-weight='bold'>CLAIM</text><line x1='300' y1='150' x2='300' y2='84' stroke='#333' stroke-width='3' marker-end='url(#a)'/><rect x='170' y='150' width='260' height='60' rx='12' fill='#cdebd3' stroke='#333' stroke-width='2'/><text x='300' y='187' font-size='24' text-anchor='middle' fill='#222' font-weight='bold'>REASON</text><line x1='300' y1='250' x2='300' y2='214' stroke='#333' stroke-width='3' marker-end='url(#a)'/><rect x='170' y='250' width='260' height='60' rx='12' fill='#eef4fb' stroke='#333' stroke-width='2'/><text x='300' y='287' font-size='24' text-anchor='middle' fill='#222' font-weight='bold'>EVIDENCE</text></svg>" } },
        { say: "The <b>claim</b> is what you want the audience to accept. The <b>reason</b> answers 'Why?'. The <b>evidence</b> answers 'How do you know the reason is true?'.", show: { type: "passage", title: "Part · Example", text: "Claim: Our town should plant more trees on Main Street.\n\nReason: Trees make streets cooler in summer.\n\nEvidence: On a hot day last July, our thermometer read 6 °C cooler under the oaks than in the open parking lot." } },
        { say: "Words called <b>indicators</b> signal the parts. 'Because', 'since' and 'for' introduce reasons. 'Therefore', 'so', 'thus' and 'hence' introduce claims (conclusions).", show: { type: "table", rows: [
              ["Reason indicators", "because · since · for · as shown by"],
              ["Claim indicators", "therefore · so · thus · hence · consequently"]
            ] } },
        { say: "Evidence comes in several kinds. Each has strengths and weaknesses.", show: { type: "passage", title: "Kind · Example · Watch out for", text: "Data (measurements) — Example: 6 °C cooler under trees; Watch out for: Small or careless samples\n\nExamples — Example: Three streets that planted trees; Watch out for: Unusual cases\n\nExpert testimony — Example: A city forester's report; Watch out for: Experts outside their field\n\nObservation — Example: I saw people sit in the shade; Watch out for: Memory and bias" } },
        { say: "Two tests for every reason: Is it <b>true</b>? And is it <b>relevant</b> (does it actually bear on the claim)? 'Trees are green' is true but irrelevant to whether we should plant them. 'Trees cause earthquakes' is relevant but false. Both fail.", show: { type: "table", rows: [
              ["Reason", "True?", "Relevant?", "Good?"],
              ["Trees cool streets", "Yes", "Yes", "Yes"],
              ["Trees are green", "Yes", "No", "No"],
              ["Trees cause earthquakes", "No", "Yes", "No"]
            ] } },
        { say: "Not every sentence is an argument. A report, a description or a story may contain no claim at all. Ask: Is someone trying to convince me that something is so?", show: { type: "table", rows: [
              ["Not an argument", "The museum opens at nine."],
              ["Argument", "You should arrive at nine, because the queue grows quickly after ten."]
            ] } },
        { say: "<b>Explain it.</b> Explain the difference between a claim, a reason and evidence, using your own example. Then explain why a reason must be both true and relevant.", show: { type: "passage", title: "Explain it", text: "Explain the difference between a claim, a reason and evidence, using your own example. Then explain why a reason must be both true and relevant.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise terms from this lesson." } }
      ], practice: [
        { q: "Find the CLAIM: 'We should leave early, because the roads will be busy.'", options: ["There is no claim", "The roads will be busy", "Because", "We should leave early"], answer: "We should leave early", hint: "Which part is the speaker trying to convince you of?", why: "'We should leave early' is the claim; 'because…' introduces the reason." },
        { q: "Find the REASON: 'Since the river is flooding, the bridge is closed.'", options: ["There is no reason", "Since", "The bridge is closed", "The river is flooding"], answer: "The river is flooding", hint: "'Since' introduces which part?", why: "'Since' signals the reason: the river is flooding." },
        { q: "Which word introduces a conclusion (claim)?", options: ["Since", "Because", "For", "Therefore"], answer: "Therefore", hint: "Which word comes before what follows from the reasons?", why: "'Therefore' signals the conclusion." },
        { q: "Claim: 'Owls hunt well at night.' Which is the best EVIDENCE?", options: ["Studies show barn owls can catch mice in total darkness using hearing alone", "I like owls", "Owls are beautiful", "Owls are birds"], answer: "Studies show barn owls can catch mice in total darkness using hearing alone", hint: "Which statement can be checked and directly supports the claim?", why: "It is specific, checkable and directly relevant." },
        { q: "Which reason is TRUE but IRRELEVANT to the claim 'You should wear a helmet when cycling'?", options: ["Helmets come in many colors", "Helmets reduce head injuries in crashes", "Cycling can be dangerous", "Helmets cause crashes"], answer: "Helmets come in many colors", hint: "Which reason is true yet has nothing to do with safety?", why: "Color choice is true but does not support wearing one." },
        { q: "Which reason is RELEVANT but FALSE?", options: ["'You should drink water because the body needs it.'", "'You should drink water because water makes you invisible.'", "'You should drink water because it is wet.'"], answer: "'You should drink water because water makes you invisible.'", hint: "Which reason would matter if it were true, but is not true?", why: "Invisibility would certainly be relevant, but water does no such thing." },
        { q: "Is this an argument? 'The library has 4,000 books.'", options: ["Yes", "No, it is a statement of fact with no claim being argued", "Yes, the claim is 4,000"], answer: "No, it is a statement of fact with no claim being argued", hint: "Is anyone trying to convince you of something with reasons?", why: "It is a report, not an argument: there is no claim supported by reasons." },
        { q: "What kind of evidence is: 'In a survey of 500 families, 70% said they read together weekly'?", options: ["Data", "A preference", "A single example", "Expert testimony"], answer: "Data", hint: "Is it numbers gathered systematically?", why: "Measurements and counts are data." },
        { q: "A famous footballer says a certain medicine cures colds. What is the weakness of this evidence?", options: ["There is no weakness", "Footballers never get colds", "He is an expert in football, not medicine", "He is famous"], answer: "He is an expert in football, not medicine", hint: "In which field is he an expert?", why: "Testimony is only strong within the witness's expertise." },
        { q: "Build the argument from the bottom up: evidence first, then reason, then claim.", type: "order", items: ["Our tomato plants in the sun grew twice as tall as those in the shade.", "Therefore, we should plant tomatoes in the sunny bed.", "Tomatoes grow better with more sunlight."], answer: ["Our tomato plants in the sun grew twice as tall as those in the shade.", "Tomatoes grow better with more sunlight.", "Therefore, we should plant tomatoes in the sunny bed."], hint: "Which statement is the observation, which is the general reason, and which is the conclusion?", why: "The measurement supports the reason, which supports the claim." },
        { q: "How many reasons are given? 'We should adopt a dog, because it will get us walking, it will guard the house, and it will teach us responsibility.'", type: "number", answer: 3, hint: "Count the separate 'whys'.", why: "Walking, guarding, responsibility: three reasons." },
        { q: "Which reason best supports 'Children should learn a second language'?", options: ["Learning a language early is often easier, and it opens new friendships and books", "Some languages are old", "My friend speaks French", "Languages have words"], answer: "Learning a language early is often easier, and it opens new friendships and books", hint: "Which reason is true and directly relevant?", why: "It gives true, relevant benefits. The others are irrelevant or merely an anecdote." },
        { q: "'Lena is the best runner in the class, so she must be the best swimmer.' What is wrong?", options: ["Skill at running does not show skill at swimming; the reason does not support the claim", "Lena is not a runner", "Runners never swim", "Nothing"], answer: "Skill at running does not show skill at swimming; the reason does not support the claim", hint: "Does the reason connect to the claim?", why: "The reason may be true, but it is not relevant to swimming. Truth alone is not enough; the reason must support the claim." },
