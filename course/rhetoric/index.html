        { q: "Which word introduces a reason?", options: ["Thus", "Therefore", "So", "Since"], answer: "Since", hint: "Which word answers 'why'?", why: "'Since' introduces a reason; the others introduce conclusions." },
        { q: "Which is NOT an argument?", options: ["The train leaves at noon, so we must hurry.", "We should leave now, since the train leaves at noon.", "Because the train leaves at noon, we should pack tonight.", "The train leaves at noon."], answer: "The train leaves at noon.", hint: "Which gives no claim supported by a reason?", why: "A bare report of the timetable makes no argument." },
        { q: "Which piece of evidence is the most specific?", options: ["The river rose 2 meters in 6 hours on 3 March.", "There was some water.", "The river rose a lot.", "It was bad."], answer: "The river rose 2 meters in 6 hours on 3 March.", hint: "Which could be checked exactly?", why: "Specific numbers, dates and places can be verified." }
      ], challenge: [
        { q: "Which is the CLAIM in this passage? 'The museum's Egyptian rooms were crowded all week. Visitors waited an hour. The museum should open the rooms in the evenings too. Staff have offered to work late.'", options: ["Visitors waited an hour", "Staff have offered to work late", "The museum should open the rooms in the evenings too", "The Egyptian rooms were crowded all week"], answer: "The museum should open the rooms in the evenings too", hint: "Which sentence do the other three support? It need not be first.", why: "Crowding and waiting show the need; staff willingness shows it is possible. All support the proposal, which is the claim." },
        { q: "Claim: 'Ancient Egyptians had advanced mathematics.' Which is the strongest evidence?", options: ["I read it somewhere", "Egypt is a famous country", "The Rhind papyrus (about 1550 BC) records methods for areas, volumes and fractions", "The pyramids look impressive"], answer: "The Rhind papyrus (about 1550 BC) records methods for areas, volumes and fractions", hint: "Which piece of evidence directly shows mathematical methods, and can be checked?", why: "A surviving mathematical text is direct, checkable evidence. Impressive buildings suggest skill, but do not show the methods themselves." },
        { q: "'Since every swan I have ever seen is white, all swans are white.' What happened when Europeans reached Australia?", options: ["They found black swans, showing that many examples cannot prove an absolute claim", "Nothing; the claim was proved", "Swans stopped existing", "They found only white swans"], answer: "They found black swans, showing that many examples cannot prove an absolute claim", hint: "How many counter-examples defeat 'all'?", why: "Black swans exist in Australia. However many confirming examples you have, an absolute claim can be overturned by one counter-example." },
        { gen: () => RH.argQ("warrant") },
        { q: "'We should ban bicycles from the park, because a cyclist hit a bench last week.' Which is the strongest criticism?", options: ["The park is big", "One incident is weak evidence for a ban affecting everyone; we need to know how often accidents happen", "Benches are not important", "Cyclists are rude"], answer: "One incident is weak evidence for a ban affecting everyone; we need to know how often accidents happen", hint: "How much evidence does such a large claim need?", why: "The reason is true but too weak for a sweeping claim; a single anecdote cannot establish a pattern." }
      ], extend: "Read an editorial or letter in a newspaper with a grown-up. Underline the main claim in one color, the reasons in another and the evidence in a third. Then judge each reason: true? relevant?", offline: "Make a one-minute argument to the family for something you would truly like (a trip, a book, a new rule). State one claim, give two reasons, and support each with evidence. The family must judge: true? relevant?" },
    { title: "Argument II: warrant and rebuttal", icon: "🌉", learn: [
        { say: "The philosopher Stephen Toulmin noticed that every argument has a hidden bridge. The <b>warrant</b> is the general principle that connects the evidence to the claim. It is often unstated, so we must find it.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0L10 5L0 10z' fill='#333'/></marker></defs><rect x='10' y='40' width='200' height='80' rx='12' fill='#eef4fb' stroke='#333' stroke-width='2'/><text x='110' y='87' font-size='24' text-anchor='middle' fill='#222' font-weight='bold'>Evidence</text><line x1='212' y1='80' x2='386' y2='80' stroke='#333' stroke-width='3' marker-end='url(#a)'/><rect x='390' y='40' width='200' height='80' rx='12' fill='#ffe6a6' stroke='#333' stroke-width='2'/><text x='490' y='87' font-size='24' text-anchor='middle' fill='#222' font-weight='bold'>Claim</text><path d='M110 125 Q300 260 490 125' fill='none' stroke='#2f9e5f' stroke-width='4' stroke-dasharray='10 6'/><text x='300' y='230' font-size='22' text-anchor='middle' fill='#222' font-weight='bold' fill='#2f9e5f'>Warrant: the bridge</text><text x='300' y='290' font-size='20' text-anchor='middle' fill='#222' >(a general rule, often unstated)</text></svg>" } },
        { say: "Example. Evidence: <b>the ground is wet</b>. Claim: <b>it rained last night</b>. Warrant: <b>when the ground is wet in the morning, it has usually rained</b>. If the warrant is false or weak, the bridge collapses: perhaps someone ran the sprinkler.", show: { type: "passage", title: "Evidence · The ground is wet this morning.", text: "Warrant (unstated): Wet ground in the morning usually means rain.\n\nClaim: So it probably rained last night.\n\nQualifier: probably\n\nRebuttal: unless the sprinkler was on" } },
        { say: "A <b>qualifier</b> (probably, likely, in most cases) states how strong the claim is. Honest arguers match the qualifier to the strength of their evidence.", show: { type: "list", items: ["certainly: when the evidence leaves no doubt", "very probably: strong evidence", "possibly: some evidence", "no claim at all: no evidence"] } },
        { say: "A <b>counter-argument</b> is the best case for the other side. A strong speaker states it <b>fairly</b> (as its supporters would) and then gives a <b>rebuttal</b>: a reason it fails, or a concession that it is partly right.", show: { type: "passage", title: "Claim · We should keep a class pet.", text: "Counter-argument: Pets need care during holidays, when no one is at school.\n\nRebuttal: Families can take turns, as the class next door has done for three years." } },
        { say: "Sometimes the honest response to a counter-argument is <b>concession</b>: 'That is true.' If the counter-argument is stronger than your case, the honest speaker changes her claim, or her mind.", show: { type: "big", text: "Rebut what is false.\nConcede what is true.\nChange your mind if it wins." } },
        { say: "Toulmin's own six parts are claim, data, warrant, <b>backing</b> (support for the warrant), qualifier and rebuttal (the 'unless' exceptions). We add the debater's counter-argument and answer. Here is our adapted pattern.", show: { type: "passage", title: "Part · Question it answers", text: "Claim: What do you want me to believe?\n\nReason / evidence: Why? How do you know?\n\nWarrant: Why does that evidence support that claim?\n\nQualifier: How sure are you?\n\nCounter-argument: What would the other side say?\n\nRebuttal: Why does that not defeat your claim?" } },
        { say: "<b>Explain it.</b> Explain what a warrant is, using the wet-ground example, and why an honest arguer states the strongest counter-argument fairly before answering it.", show: { type: "passage", title: "Explain it", text: "Explain what a warrant is, using the wet-ground example, and why an honest arguer states the strongest counter-argument fairly before answering it.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise terms from this lesson." } }
      ], practice: [
        { q: "Evidence: 'Sam has a cast on his arm.' Claim: 'Sam broke his arm.' What is the warrant?", options: ["People usually wear a cast because a bone is broken", "Casts are white", "Sam likes casts", "Arms are bones"], answer: "People usually wear a cast because a bone is broken", hint: "What general rule connects a cast to a broken bone?", why: "The warrant links the evidence to the claim: casts are usually worn for broken bones." },
        { q: "What is a qualifier?", options: ["A word showing how certain the claim is", "The conclusion", "The other side's argument", "The strongest piece of evidence"], answer: "A word showing how certain the claim is", hint: "Think of 'probably' or 'certainly'.", why: "Qualifiers state the strength of a claim." },
        { q: "Which is the best qualifier for: 'Dark clouds are gathering, so it ____ rain'?", options: ["has already", "cannot", "will probably", "will certainly"], answer: "will probably", hint: "Do dark clouds guarantee rain?", why: "Dark clouds make rain likely, not certain." },
        { q: "What is a counter-argument?", options: ["The strongest case for the opposing side", "A mistake in grammar", "An argument shouted loudly", "Your own best reason"], answer: "The strongest case for the opposing side", hint: "'Counter' means against.", why: "A counter-argument is the case against your claim." },
        { q: "Claim: 'Our school should have a garden.' Which is a fair counter-argument?", options: ["People who want gardens are silly", "Gardens are ugly", "A garden needs regular care, including in the summer holidays", "Nobody has ever had a garden"], answer: "A garden needs regular care, including in the summer holidays", hint: "Which is a real, reasonable concern stated respectfully?", why: "It is true and relevant. The others are insults or false." },
        { q: "Which is a REBUTTAL to that counter-argument?", options: ["I disagree", "Gardens are nice", "Parent volunteers could take turns watering it during the holidays", "That's a silly objection"], answer: "Parent volunteers could take turns watering it during the holidays", hint: "A rebuttal gives a reason the objection does not defeat the claim.", why: "It answers the specific concern with a practical solution." },
        { q: "Evidence: 'Every time I wear my red socks, our team wins.' Claim: 'My red socks make us win.' What is the hidden warrant, and is it true?", options: ["'Socks affect football': true", "'Red is a winning color': true", "There is no warrant", "'Things that happen together cause each other': false"], answer: "'Things that happen together cause each other': false", hint: "What rule would have to be true for the evidence to support the claim?", why: "The warrant would be that coincidence proves cause. It is false: things can happen together by chance." },
        { q: "Order the parts of a full argument as a speaker would present them.", type: "order", items: ["Counter-argument", "Rebuttal", "Reason and evidence", "Conclusion", "Claim"], answer: ["Claim", "Reason and evidence", "Counter-argument", "Rebuttal", "Conclusion"], hint: "State your position first; answer objections near the end.", why: "Claim, support, the other side, your answer, and a conclusion that restates the claim." },
        { q: "A speaker finds that the counter-argument is stronger than her own case. What should she do?", options: ["Change or withdraw her claim", "Hide the counter-argument", "Insult the other side", "Speak more confidently"], answer: "Change or withdraw her claim", hint: "What does a truth-seeker do when the evidence goes against her?", why: "Honest reasoning follows the evidence, even when it means changing her mind." },
        { q: "What does it mean to concede a point?", options: ["To admit that the other side is right about it", "To repeat it", "To win the argument", "To ignore it"], answer: "To admit that the other side is right about it", hint: "Concede comes from Latin 'to yield'.", why: "Conceding admits a true point. It builds trust and keeps the argument honest." },
        { q: "Evidence: 'The streets are wet.' Which possibility is a rebuttal to the claim 'It rained'?", options: ["The street-cleaning truck passed at dawn", "The sky is blue now", "Rain is wet", "It is Tuesday"], answer: "The street-cleaning truck passed at dawn", hint: "What else could explain wet streets?", why: "An alternative explanation is a rebuttal: the claim holds 'unless' this is so." },
        { q: "The pattern in this lesson (adapted from Toulmin) has six parts: claim, reason or evidence, warrant, qualifier, counter-argument, rebuttal. How many of them are usually LEFT UNSTATED by careless arguers, if they state only the claim and evidence?", type: "number", answer: 4, hint: "Subtract the parts they state from the total.", why: "6 − 2 = 4 parts unstated: warrant, qualifier, counter-argument and rebuttal." },
        { q: "Which argument states its warrant openly?", options: ["The bread is mouldy, so do not eat it.", "The bread is old.", "The bread is mouldy, and mold can make you ill, so do not eat it.", "Do not eat it."], answer: "The bread is mouldy, and mold can make you ill, so do not eat it.", hint: "Which version says the general rule linking evidence to claim?", why: "'Mold can make you ill' is the warrant, stated openly." },
        { gen: () => RH.argQ("warrant") },

        { q: "Which is a concession?", options: ["'It is true that a garden needs care in the holidays.'", "'You are wrong.'", "'Gardens are always good.'", "'Next point.'"], answer: "'It is true that a garden needs care in the holidays.'", hint: "Which sentence admits the other side's point?", why: "Conceding a true point keeps the argument honest and builds trust." },
        { q: "Evidence: 'The baby is crying.' Claim: 'She is hungry.' Which is the best rebuttal (an 'unless')?", options: ["Unless it is Tuesday", "Unless she is tired or uncomfortable instead", "Unless she is a baby", "Unless crying is loud"], answer: "Unless she is tired or uncomfortable instead", hint: "What else makes babies cry?", why: "Other causes of crying are real alternative explanations." },

      ], challenge: [
        { q: "Evidence: 'Eratosthenes measured that at noon on the summer solstice, the Sun cast no shadow in Syene but a shadow of about 7° in Alexandria.' Claim: 'The Earth is curved.' What is the WARRANT?", options: ["Egypt is hot", "Eratosthenes was a librarian", "Shadows are dark", "The Sun's rays reach Earth almost parallel, so different shadow angles mean the ground itself is tilted differently"], answer: "The Sun's rays reach Earth almost parallel, so different shadow angles mean the ground itself is tilted differently", hint: "Why would shadows differ in two cities at the same moment?", why: "If the Sun's rays are nearly parallel, only a curved Earth makes the same rays strike two places at different angles. That principle is the bridge." },
        { q: "Which is the most HONEST statement of a counter-argument to 'Children should have no homework'?", options: ["'Homework supporters hate children.'", "'Only mean teachers like homework.'", "'Some teachers argue that short, regular practice at home helps memory, and there is some evidence for this.'", "'Nobody could possibly disagree with me.'"], answer: "'Some teachers argue that short, regular practice at home helps memory, and there is some evidence for this.'", hint: "Would a supporter of homework accept your description of their view?", why: "A fair counter-argument is one its own supporters would recognize. Caricatures (distorted versions) are dishonest and easy to knock down, which proves nothing." },
        { q: "An argument's evidence is true and its warrant is true, but the claim says 'certainly' when the evidence shows only 'probably'. What is wrong?", options: ["The qualifier overstates the claim", "The evidence is false", "The warrant is false", "Nothing"], answer: "The qualifier overstates the claim", hint: "Which part says how sure we should be?", why: "The qualifier must match the evidence. Overstating certainty is a common, subtle form of untruth." },
        { gen: () => RH.argQ("warrant") },
        { q: "A detective reasons: 'The thief's footprints are size 5; the butler wears size 10; so the butler is not the thief.' What hidden warrant does this rely on, and is it safe?", options: ["That butlers are honest; certainly", "That the thief wore his own shoes; probably, but a clever thief could wear other shoes", "There is no warrant", "That footprints are always size 5"], answer: "That the thief wore his own shoes; probably, but a clever thief could wear other shoes", hint: "What must be true for the footprints to belong to the thief's own feet?", why: "The warrant is that a person's footprints match his own shoe size. Usually true, but it can be defeated; a good detective qualifies the conclusion." }
      ], extend: "Take a short argument from a book or newspaper. Draw it as a Toulmin diagram: claim, evidence, warrant (write it out), qualifier, counter-argument and rebuttal. Mark any part that is missing, and write the strongest counter-argument yourself.", offline: "Argue for one side of 'Should children choose their own bedtime?' for one minute. Then argue the OTHER side's strongest case for one minute, fairly. Finally say which side the evidence favors, and why." },
    { title: "Weighing evidence and sources", icon: "⚖️", learn: [
        { say: "A reason is only as strong as the evidence for it, and evidence is only as strong as its <b>source</b>. A <b>primary source</b> comes from the time or from a direct witness: a diary, a letter, a photograph, a measurement. A <b>secondary source</b> describes or interprets primary sources later: a textbook, an encyclopedia.", show: { type: "table", rows: [
              ["Primary", "Carter's own excavation notes, 1922"],
              ["Primary", "The Rhind mathematical papyrus"],
              ["Secondary", "A modern history of ancient Egypt"],
              ["Secondary", "A website summarizing the discovery"]
            ] } },
        { say: "Five questions test a source. Remember them as <b>K-C-I-C-D</b>.", show: { type: "passage", title: "Test · Question", text: "Knowledge: Is the author an expert in this field, or a direct witness?\n\nCloseness: How near in time and place was the source to the events?\n\nInterest: Does the author gain from our believing it?\n\nCorroboration: Do independent sources agree?\n\nDate and context: When was it written, and for whom?" } },
        { say: "A widely shared picture shows William Shakespeare with the words: 'Don't believe everything you read on the internet.' Shakespeare lived from 1564 to 1616, long before the internet existed. The joke is a reminder: <b>a famous name attached to a quotation is not evidence that the person said it</b>.", show: { type: "big", text: "“Don't believe everything you read\non the internet.” — William Shakespeare\n\n(He lived 1564–1616.)" } },
        { say: "Misattributions (quotations credited to the wrong person) are common. 'Everybody is a genius, but if you judge a fish by its ability to climb a tree, it will live its whole life believing that it is stupid' is often credited to Albert Einstein, but it has not been found in his writings. In an interview printed in LIFE magazine (1955) he was reported as saying, 'The important thing is not to stop questioning.' Always trace a quotation to its source.", show: { type: "passage", title: "Checking a quotation", text: "Claim: Einstein said: 'Everybody is a genius…' (the fish-and-tree quotation)\n\nCheck: Search his published writings and letters: not found\n\nWhat he was reported as saying: 'The important thing is not to stop questioning.' (LIFE, 1955)\n\nVerdict: Misattributed; quote the real words instead" } },
        { say: "Beware the <b>anecdote</b> (a single personal story) used as proof. 'My grandmother smoked and lived to 95' does not show smoking is safe. One case can be unusual; we need systematic evidence from many cases.", show: { type: "table", rows: [
              ["Anecdote", "One story; vivid but possibly unusual"],
              ["Data", "Many cases, counted carefully; less vivid, more reliable"]
            ] } },
        { say: "Finally, two things happening together (a <b>correlation</b>) does not prove one causes the other. Ice-cream sales and sunburns both rise in summer; ice cream does not cause sunburn. The hidden cause is hot, sunny weather.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0L10 5L0 10z' fill='#333'/></marker></defs><rect x='200' y='20' width='200' height='60' rx='12' fill='#ffe6a6' stroke='#333' stroke-width='2'/><text x='300' y='57' font-size='22' text-anchor='middle' fill='#222' font-weight='bold'>Sunny weather</text><line x1='260' y1='82' x2='140' y2='170' stroke='#333' stroke-width='3' marker-end='url(#a)'/><line x1='340' y1='82' x2='460' y2='170' stroke='#333' stroke-width='3' marker-end='url(#a)'/><rect x='30' y='175' width='220' height='60' rx='12' fill='#eef4fb' stroke='#333' stroke-width='2'/><text x='140' y='212' font-size='20' text-anchor='middle' fill='#222' font-weight='bold'>Ice-cream sales</text><rect x='350' y='175' width='220' height='60' rx='12' fill='#f6d0c8' stroke='#333' stroke-width='2'/><text x='460' y='212' font-size='20' text-anchor='middle' fill='#222' font-weight='bold'>Sunburns</text><line x1='252' y1='205' x2='348' y2='205' stroke='#c00' stroke-width='3' stroke-dasharray='8 6'/><text x='300' y='275' font-size='22' text-anchor='middle' fill='#222' font-weight='bold'>Together ≠ one causes the other</text></svg>" } },
        { say: "<b>Explain it.</b> Name the five tests of a source and explain, with the Shakespeare or Einstein example, why a quotation must be traced to its original.", show: { type: "passage", title: "Explain it", text: "Name the five tests of a source and explain, with the Shakespeare or Einstein example, why a quotation must be traced to its original.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise terms from this lesson." } }
      ], practice: [
        { q: "Which is a PRIMARY source about the first Moon landing?", options: ["A film made in 2018", "A children's encyclopedia from 2010", "A website summary", "The astronauts' recorded radio messages from 1969"], answer: "The astronauts' recorded radio messages from 1969", hint: "Which comes directly from the event?", why: "Recordings made during the event are primary." },
        { q: "Which is a SECONDARY source about ancient Rome?", options: ["A modern history book about Julius Caesar", "An inscription on a Roman arch", "A coin minted in Caesar's lifetime", "A letter written by Cicero in Caesar's lifetime"], answer: "A modern history book about Julius Caesar", hint: "Which was written long after, interpreting older evidence?", why: "A modern history interprets primary sources, so it is secondary." },
        { q: "A toothpaste company's own study says its toothpaste is best. Which test raises a concern?", options: ["None", "Interest: the company gains if we believe it", "Closeness", "Date"], answer: "Interest: the company gains if we believe it", hint: "Who benefits from the result?", why: "When the source profits from a conclusion, we need independent corroboration." },
        { q: "Why is the 'Shakespeare internet quote' obviously false?", options: ["It has no source", "The internet did not exist in Shakespeare's lifetime", "It is too short", "Shakespeare never wrote"], answer: "The internet did not exist in Shakespeare's lifetime", hint: "When did Shakespeare live?", why: "Shakespeare lived from 1564 to 1616; the internet came more than three centuries later. This is an anachronism (something out of its proper time)." },
        { q: "A quotation is credited to a famous person on a poster. What should you do before using it in a speech?", options: ["Make the quotation longer", "Trace it to the person's actual writings or a reliable record", "Change the name to someone else", "Use it; posters are reliable"], answer: "Trace it to the person's actual writings or a reliable record", hint: "How do we know the person said it?", why: "Find the original source; misattributions are common." },
        { q: "What does 'corroboration' mean?", options: ["Confirmation by independent sources", "A famous quotation", "An opinion", "A kind of evidence that is always false"], answer: "Confirmation by independent sources", hint: "Think of two witnesses who did not talk to each other.", why: "Independent sources agreeing make a claim much more trustworthy." },
        { q: "'My cousin ate carrots and now sees in the dark.' What kind of evidence is this?", options: ["Expert testimony", "A primary scientific source", "An anecdote", "Systematic data"], answer: "An anecdote", hint: "How many cases does it describe?", why: "It is a single story: an anecdote, which cannot establish a general rule." },
        { q: "In summer, more people swim and more people buy fans. Does swimming cause fan-buying?", options: ["We cannot think about it", "Fans cause swimming", "No; hot weather causes both", "Yes"], answer: "No; hot weather causes both", hint: "What do both have in common?", why: "A third factor (heat) explains the correlation." },
        { q: "Which source is most reliable on the question 'How tall is Mount Everest?'", options: ["A cartoon", "A friend who climbed a hill", "An advertisement for climbing boots", "A national survey agency that measured it with satellite instruments"], answer: "A national survey agency that measured it with satellite instruments", hint: "Who has the knowledge and the best method?", why: "Expert measurement with good instruments is the most reliable." },
        { q: "Rank these sources on a great storm, from closest to the events to furthest.", type: "order", items: ["A newspaper report a week later", "A history book fifty years later", "A fisherman's letter written the next day", "A film made a century later"], answer: ["A fisherman's letter written the next day", "A newspaper report a week later", "A history book fifty years later", "A film made a century later"], hint: "Closeness in time is the key here.", why: "The closer the source to the events, the fewer chances for distortion, though closeness is only one test." },
        { q: "Two sources agree, but the second simply copied the first. Is this corroboration?", options: ["Yes, if both are printed", "Yes, two sources agree", "Only if both are long", "No; corroboration requires independent sources"], answer: "No; corroboration requires independent sources", hint: "If B copied A, how many separate witnesses are there really?", why: "Copied agreement adds nothing; it is still one source." },
        { q: "A survey asked 8 people. Another asked 800. How many times larger was the second sample?", type: "number", answer: 100, hint: "Divide 800 by 8.", why: "800 ÷ 8 = 100. Larger, well-chosen samples give more reliable results." },
        { q: "Which is the strongest evidence that Einstein did NOT write 'Everybody is a genius…' (the fish-and-tree quotation)?", options: ["It sounds too modern to some people", "Searches of his full published writings and letters do not find it", "It is short", "It is on many posters"], answer: "Searches of his full published writings and letters do not find it", hint: "What is the most direct check?", why: "Searching the actual texts is direct evidence. A 'modern sound' is only a hint." },

        { q: "What is the best first step to check a statistic you heard?", options: ["Count how many people repeat it", "Find the original study or data", "Decide whether you like it", "Assume it is true"], answer: "Find the original study or data", hint: "Where did the number come from?", why: "Trace the number to its source; only then can you judge how it was gathered." },
        { q: "An eyewitness was 200 meters away at night. What does this affect?", options: ["Date", "Interest", "Knowledge: how well the witness could actually see", "Nothing"], answer: "Knowledge: how well the witness could actually see", hint: "Could the witness see clearly?", why: "Distance and darkness limit what the witness could know." }
      ], challenge: [
        { q: "A study finds that children who eat breakfast get better marks. A cereal company says: 'Our cereal makes children clever!' Name TWO problems.", options: ["The study is primary, and breakfast is a meal", "There are no problems", "Correlation is not causation, and the company has an interest in the claim", "Children are not clever, and cereal is food"], answer: "Correlation is not causation, and the company has an interest in the claim", hint: "Could something else explain both? Who benefits from the claim?", why: "Families who serve breakfast may differ in other ways (sleep, routine), and the company profits from the conclusion. The leap from 'breakfast' to 'our cereal' is also unsupported." },
        { q: "Herodotus, writing about 430 BC, reports what Egyptian priests told him about kings who lived 2,000 years earlier. How should a historian treat this?", options: ["As a primary eyewitness account", "As a valuable but second-hand report, to be checked against inscriptions and archaeology", "As perfectly accurate because it is ancient", "As worthless because it is old"], answer: "As a valuable but second-hand report, to be checked against inscriptions and archaeology", hint: "Was Herodotus a witness to those kings, or to the priests' stories?", why: "He is a primary source for what priests said in his day, but a distant secondary source for the old kings. Archaeology can corroborate or correct him." },
        { q: "You find a quotation on 30 websites, all credited to Shakespeare. None gives the play, act or scene. What is the best judgement?", options: ["Probably by Dickens", "Unverified: popularity of a quotation is not evidence of its source; search the plays", "Certainly Shakespeare, because 30 sites agree", "Certainly false"], answer: "Unverified: popularity of a quotation is not evidence of its source; search the plays", hint: "Are 30 websites independent witnesses, or copies of each other?", why: "Many copies of one unchecked claim are not corroboration. Shakespeare's complete works are searchable; check them." },

        { q: "A charity's report says 'Our program raised reading scores by 20%.' The scores were measured by the charity, with no comparison group. Which is the most important missing evidence?", options: ["More photographs", "A bigger font", "Scores of similar children NOT in the program over the same time", "The charity's founding date"], answer: "Scores of similar children NOT in the program over the same time", hint: "Children's reading improves over a year anyway. How would we know the program caused the rise?", why: "Without a comparison group, normal growth could explain the rise; and the charity has an interest in the result." }
      ], extend: "Choose a famous quotation you like. Trace it: find the original book, speech or letter, with page or chapter. Write a short report: Did the person really say it? Were the words exactly as quoted? What was the context?", offline: "At home, find one claim on a food packet (e.g. 'healthy', 'natural', 'scientifically proven'). Apply the five tests aloud to a grown-up in two minutes, and give your verdict honestly, including 'I cannot tell yet' if that is the truth." },
    { title: "Refutation: testing a story", icon: "🛡️", learn: [
        { say: "<b>Refutation</b> (Greek anaskeue, 'tearing down') is the exercise of showing that a widely told story or claim is false or doubtful. Students used six tests, each a question.", show: { type: "passage", title: "Test · Question", text: "Unclear: Is the account vague or confused?\n\nImplausible: Is it unlikely, given what we know?\n\nImpossible: Could it not have happened at all?\n\nInconsistent: Does it contradict itself or other facts?\n\nUnfitting: Is it out of character or improper?\n\nUnprofitable: Does believing it lead to harm or no good?" } },
        { say: "A famous American story says that the young George Washington damaged his father's cherry tree with a new hatchet and confessed, saying that he could not tell a lie. Let us test it as a historian would.", show: { type: "passage", title: "The cherry-tree story: what we know", text: "The story first appeared in the fifth edition (1806) of a popular biography of Washington by Mason Locke Weems, seven years after Washington's death.\n\nWeems said he heard it from an unnamed 'aged lady' who was a relative of the family.\n\nNo letter, diary or record from Washington's lifetime mentions it. Weems was known for adding moral stories to make his books sell and to teach children." } },
        { say: "Apply the tests. The story is <b>not impossible</b>, but its source is weak: it appeared late, from an unnamed witness, in a book by an author with an <b>interest</b> in moral tales, with <b>no corroboration</b>. So historians judge it <b>very probably invented</b>.", show: { type: "passage", title: "Test · Finding", text: "Clear?: Yes, the story itself is clear\n\nPlausible?: Possible, but its source is late and anonymous\n\nConsistent with records?: No record from his lifetime mentions it\n\nAuthor's interest?: Weems added moral tales to teach and sell\n\nVerdict: Very probably invented" } },
        { say: "Notice the irony (an outcome opposite to what was expected): a story invented to teach honesty is itself untrue. A good refutation is fair. It does not say 'Washington was dishonest'; it says only that <b>this story</b> lacks good evidence.", show: { type: "big", text: "Refute the claim,\nnot the person." } },
        { say: "Refute with the <b>strongest</b> test available. 'Impossible' is decisive (settles the matter); 'implausible' only lowers probability. 'Unfitting' and 'unprofitable' never prove a story false: a true story can be unwelcome. Build from weakest to strongest.", show: { type: "list", items: ["Impossible: decisive", "Inconsistent with reliable records: very strong", "Late, anonymous or interested source: strong", "Implausible: suggestive", "Unclear: weak alone", "Unfitting, unprofitable: never proof of falsehood"] } },
        { say: "Refutation must be honest in both directions. If the tests show that a story is well supported, a fair thinker says so, even if she hoped to refute it.", show: { type: "big", text: "Test honestly.\nAccept the result." } },
        { say: "<b>Explain it.</b> Explain the six tests of refutation, and use the cherry-tree story to show the difference between 'impossible' and 'poorly supported'.", show: { type: "passage", title: "Explain it", text: "Explain the six tests of refutation, and use the cherry-tree story to show the difference between 'impossible' and 'poorly supported'.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise terms from this lesson." } }
      ], practice: [
        { q: "What does 'refutation' (anaskeue) aim to show?", options: ["That a person is bad", "That a story or claim is false or doubtful", "That a story is long", "That a story is true"], answer: "That a story or claim is false or doubtful", hint: "'Anaskeue' means tearing down.", why: "Refutation tears down a claim that lacks good support." },
        { q: "When did the cherry-tree story first appear in print?", options: ["In Washington's diary", "In 1776", "During Washington's childhood", "In 1806, seven years after Washington died"], answer: "In 1806, seven years after Washington died", hint: "Check the source passage.", why: "It appeared in Weems's fifth edition, 1806; Washington died in 1799." },
        { q: "Washington died in 1799. The story first appeared in 1806. How many years later is that?", type: "number", answer: 7, hint: "Subtract.", why: "1806 − 1799 = 7 years after his death." },
        { q: "Which test is MOST decisive in refuting a claim?", options: ["Impossible", "Unclear", "Unfitting", "Implausible"], answer: "Impossible", hint: "Which test settles the matter completely if it applies?", why: "If something could not have happened, the claim is refuted outright." },
        { q: "'A man in a story lifts a whole mountain with one hand.' Which test applies most directly?", options: ["Unprofitable", "Unfitting", "Impossible", "Unclear"], answer: "Impossible", hint: "Could this happen at all?", why: "It contradicts what is physically possible." },
        { q: "A witness says the robber was tall, then later says he was short. Which test applies?", options: ["Unprofitable", "Impossible", "Fitting", "Inconsistent"], answer: "Inconsistent", hint: "Does the account contradict itself?", why: "Self-contradiction is inconsistency." },
        { q: "Why does it matter that Weems's witness was an unnamed 'aged lady'?", options: ["Old people always lie", "We cannot check or question her, so the claim cannot be corroborated", "It does not matter", "Ladies cannot be witnesses"], answer: "We cannot check or question her, so the claim cannot be corroborated", hint: "How would you check her story?", why: "An anonymous witness cannot be questioned or verified. That weakens the evidence, without insulting anyone." },
        { q: "Which is a FAIR conclusion of the refutation?", options: ["Washington was a liar", "All biographies are false", "Washington never existed", "The cherry-tree story is very probably invented"], answer: "The cherry-tree story is very probably invented", hint: "Refute the claim, not the person.", why: "The evidence shows only that this story is poorly supported." },
        { q: "'Ostriches bury their heads in sand when frightened.' Which response is best?", options: ["Ask for evidence: observers report ostriches lie low or run, rather than burying their heads", "Refuse to discuss it", "Believe it; everyone says so", "Say ostriches are silly"], answer: "Ask for evidence: observers report ostriches lie low or run, rather than burying their heads", hint: "What do actual observations show?", why: "Refute with evidence from observers, not with popularity or mockery." },
        { q: "Order these refutation arguments from weakest to strongest.", type: "order", items: ["The story contradicts reliable records", "The story is physically impossible", "The story seems unlikely", "The story is a bit vague"], answer: ["The story is a bit vague", "The story seems unlikely", "The story contradicts reliable records", "The story is physically impossible"], hint: "Which settles the question completely?", why: "Unclear < implausible < inconsistent with records < impossible." },
        { q: "A student refutes a claim by saying, 'Only silly people believe that.' What is wrong?", options: ["It attacks the believers instead of testing the claim", "It is too polite", "It uses the impossible test", "Nothing"], answer: "It attacks the believers instead of testing the claim", hint: "Which of the six tests did the student use?", why: "Mockery is not a test; it says nothing about whether the claim is true." },
        { q: "After testing, a student finds that a surprising legend is well supported by records. What should she do?", options: ["Say honestly that it appears to be true", "Hide the records", "Refute it anyway", "Change the topic"], answer: "Say honestly that it appears to be true", hint: "What is the purpose of testing?", why: "The aim is truth, not winning. Honest testing can confirm as well as refute." },
        { q: "'Unfitting' means a story is:", options: ["Written badly", "Physically impossible", "Out of character or improper for the person or situation", "Too long"], answer: "Out of character or improper for the person or situation", hint: "Would the person really act like that?", why: "A tale in which a famously gentle person does something cruel and unlike himself may be unfitting, a reason for doubt but not proof." },

        { q: "A story says Napoleon was extremely short. Records give his height as about 5 feet 7 inches in English measure, average for his time. Which test applies?", options: ["Impossible", "Unfitting", "Unclear", "Inconsistent with reliable records"], answer: "Inconsistent with reliable records", hint: "What do the records show?", why: "The story conflicts with documented measurements. (Confusion between French and English inches helped the myth.)" },
        { q: "Which sentence refutes the CLAIM rather than attacking a PERSON?", options: ["'Only fools believe this.'", "'The storyteller was rude.'", "'This story first appears 200 years later, with no source.'", "'The author was a greedy man.'"], answer: "'This story first appears 200 years later, with no source.'", hint: "Which sentence is about the evidence?", why: "It examines the story's source; the others attack people, which proves nothing about the story." },
        { q: "Refutation should begin by:", options: ["Declaring it false", "Stating fairly the story or claim you will test", "Mocking it", "Changing the subject"], answer: "Stating fairly the story or claim you will test", hint: "Can you test something you haven't stated?", why: "State the claim fairly first, then apply the tests." },
        { q: "Which is the strongest kind of refuting evidence?", options: ["A feeling that it is wrong", "The fact that it is old", "A joke about it", "A reliable record made at the time that contradicts the story"], answer: "A reliable record made at the time that contradicts the story", hint: "Which is checkable and close to the events?", why: "Contemporary records that contradict a later story are powerful evidence." }
      ], challenge: [
        { q: "A legend says Archimedes ran naked through Syracuse shouting 'Eureka!' The earliest account we have is in Vitruvius, writing about 200 years later. What is the most accurate verdict?", options: ["Certainly a lie by Vitruvius", "Proven impossible", "Proven true", "Possible but unconfirmed: the source is late and gives no witness"], answer: "Possible but unconfirmed: the source is late and gives no witness", hint: "Is it impossible, or just poorly evidenced?", why: "Nothing in the story is impossible, but a single source two centuries later cannot confirm it. Honest verdicts can be 'unconfirmed'." },
        { q: "Which refutation commits a reasoning error?", options: ["'This story first appears 200 years after the event, with no source.'", "'This story contradicts the ship's log written that day.'", "'This story appears in a book for children, so it must be false.'", "'This story requires a man to fly unaided, which is impossible.'"], answer: "'This story appears in a book for children, so it must be false.'", hint: "Is every story in a children's book false?", why: "Where a story appears is a clue, not proof. The others give real reasons (contradiction, impossibility, late unsupported source)." },
        { q: "Why is it valuable for a speaker to refute a story she once believed herself?", options: ["It shows she was foolish", "It shows she follows evidence even against her own earlier view, which strengthens her trustworthiness", "It makes the speech longer", "It never helps"], answer: "It shows she follows evidence even against her own earlier view, which strengthens her trustworthiness", hint: "What does it tell the audience about how she reasons?", why: "Changing your mind for good evidence is a mark of honesty. Audiences rightly trust a speaker who follows the truth." },
        { gen: () => RH.refQ() },
        { q: "Vikings are often pictured with horned helmets. The only Viking-age helmet found nearly complete (from Gjermundbu, Norway) has no horns, and the horned image became popular through 19th-century art and opera costumes. Verdict?", options: ["Certainly true", "True, because it is in many pictures", "Very probably false: physical evidence lacks horns and the image arose much later", "Impossible to discuss"], answer: "Very probably false: physical evidence lacks horns and the image arose much later", hint: "When did the horned image appear, and what do finds show?", why: "Archaeology contradicts it, and its origin is late and artistic. Many pictures of the same idea are not evidence." }
      ], extend: "Research one more popular legend (e.g. that Vikings wore horned helmets, or that goldfish remember things for only three seconds). Write a six-test refutation, citing your sources, and give an honest verdict: refuted, doubtful, or confirmed.", offline: "Deliver a two-minute refutation of the cherry-tree story to the family. Use at least three tests, end with a fair verdict, and then answer one question from the audience." },
    { title: "Confirmation: building the case", icon: "🏗️", learn: [
        { say: "<b>Confirmation</b> (Greek kataskeue, 'building up') is the twin of refutation. You show that a claim is true, using the same tests turned around: it is clear, plausible, possible, consistent, fitting and well supported.", show: { type: "passage", title: "Refutation asks · Confirmation shows", text: "Unclear?: Clear\n\nImplausible?: Plausible\n\nImpossible?: Possible\n\nInconsistent?: Consistent with the evidence\n\nUnfitting?: Fitting\n\nUnprofitable?: Useful to know" } },
        { say: "Our claim: <b>the Greek alphabet descends from the Phoenician alphabet</b>. The Phoenicians were seafaring traders of the eastern Mediterranean who wrote with about twenty-two letters, all consonants.", show: { type: "big", text: "Claim: the Greek alphabet\ncame from the Phoenician alphabet." } },
        { say: "Evidence one: the <b>letter names</b>. Phoenician aleph, beth, gimel, daleth became Greek alpha, beta, gamma, delta. In Phoenician the names were real words ('ox', 'house'); in Greek they mean nothing, a sign of borrowing.", show: { type: "table", rows: [
              ["Phoenician", "Meaning", "Greek"],
              ["aleph", "ox", "alpha"],
              ["beth", "house", "beta"],
              ["gimel", "camel (probably)", "gamma"],
              ["daleth", "door", "delta"]
            ] } },
        { say: "Evidence two: the <b>shapes and order</b> of the letters match closely, and the earliest Greek inscriptions, like Phoenician, were often written right to left. Evidence three: <b>testimony</b>. The Greek historian Herodotus wrote that the Phoenicians brought letters to Greece.", show: { type: "list", items: ["Matching letter names", "Matching shapes and alphabetical order", "Early Greek written right to left, like Phoenician", "Herodotus (Histories, Book 5) says the Phoenicians brought letters", "Greeks traded with Phoenicians for centuries"] } },
        { say: "A strong confirmation also states what is <b>uncertain</b>. Herodotus credits a legendary Phoenician named Cadmus; that detail is doubtful. And the Greeks changed the system: they turned some unneeded consonant signs into <b>vowels</b>, such as aleph into A.", show: { type: "table", rows: [
              ["Well established", "Greek letters descend from Phoenician letters"],
              ["Uncertain", "Exactly when and where the borrowing happened"],
              ["Probably legend", "That one man, Cadmus, brought them"]
            ] } },
        { say: "The strength of a confirmation is <b>convergence</b>: several independent lines of evidence pointing to the same conclusion. One clue could be coincidence; four independent clues agreeing is very hard to explain any other way.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0L10 5L0 10z' fill='#333'/></marker></defs><rect x='200' y='130' width='200' height='70' rx='12' fill='#ffe6a6' stroke='#333' stroke-width='2'/><text x='300' y='172' font-size='22' text-anchor='middle' fill='#222' font-weight='bold'>Conclusion</text><rect x='20' y='20' width='160' height='56' rx='12' fill='#cdebd3' stroke='#333' stroke-width='2'/><text x='100' y='55' font-size='20' text-anchor='middle' fill='#222' font-weight='bold'>Names</text><line x1='100' y1='78' x2='210' y2='128' stroke='#333' stroke-width='3' marker-end='url(#a)'/><rect x='420' y='20' width='160' height='56' rx='12' fill='#cdebd3' stroke='#333' stroke-width='2'/><text x='500' y='55' font-size='20' text-anchor='middle' fill='#222' font-weight='bold'>Shapes</text><line x1='500' y1='78' x2='390' y2='128' stroke='#333' stroke-width='3' marker-end='url(#a)'/><rect x='20' y='250' width='160' height='56' rx='12' fill='#cdebd3' stroke='#333' stroke-width='2'/><text x='100' y='285' font-size='20' text-anchor='middle' fill='#222' font-weight='bold'>Direction</text><line x1='100' y1='248' x2='210' y2='202' stroke='#333' stroke-width='3' marker-end='url(#a)'/><rect x='420' y='250' width='160' height='56' rx='12' fill='#cdebd3' stroke='#333' stroke-width='2'/><text x='500' y='285' font-size='20' text-anchor='middle' fill='#222' font-weight='bold'>Testimony</text><line x1='500' y1='248' x2='390' y2='202' stroke='#333' stroke-width='3' marker-end='url(#a)'/></svg>" } },
        { say: "<b>Explain it.</b> Explain how confirmation differs from refutation, and why several independent pieces of evidence are stronger than one. Use the alphabet example.", show: { type: "passage", title: "Explain it", text: "Explain how confirmation differs from refutation, and why several independent pieces of evidence are stronger than one. Use the alphabet example.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise terms from this lesson." } }
      ], practice: [
        { q: "What does 'kataskeue' (confirmation) mean?", options: ["Building up", "Telling a story", "Praising", "Tearing down"], answer: "Building up", hint: "It is the twin of anaskeue, 'tearing down'.", why: "Confirmation builds up a claim with evidence." },
        { q: "Which evidence suggests the Greeks BORROWED the letter names?", options: ["The Greeks liked oxen", "Herodotus was Greek", "Greek has more letters", "In Phoenician they were real words; in Greek they meant nothing"], answer: "In Phoenician they were real words; in Greek they meant nothing", hint: "Why would a word have meaning in one language but not another?", why: "Names meaningful in the source language but meaningless in the borrower's are a classic sign of borrowing." },
        { q: "Phoenician 'beth' meant 'house'. Which Greek letter came from it?", options: ["Delta", "Beta", "Gamma", "Alpha"], answer: "Beta", hint: "Listen to the first sound.", why: "Beth became beta." },
        { q: "What change did the Greeks make to the Phoenician letters?", options: ["They removed all vowels", "They wrote only in pictures", "They made no change", "They used some consonant signs as vowels"], answer: "They used some consonant signs as vowels", hint: "Phoenician had no vowel letters.", why: "The Greeks adapted unneeded consonant signs to write vowels, such as A from aleph." },
        { q: "What does 'convergence' of evidence mean?", options: ["Clues that contradict each other", "Independent clues all pointing to the same conclusion", "Evidence from one source copied many times", "One very loud clue"], answer: "Independent clues all pointing to the same conclusion", hint: "Think of roads meeting at one town.", why: "Several independent lines arriving at one conclusion make it far more likely to be true." },
        { q: "Herodotus says a man called Cadmus brought the letters. How should we treat this detail?", options: ["As proof that the whole claim is false", "As a primary source", "As certain", "As probably legendary, while the general borrowing is well supported"], answer: "As probably legendary, while the general borrowing is well supported", hint: "Is one part of a source less reliable than another?", why: "Sources can be reliable on some points and doubtful on others; we weigh each detail." },
        { q: "Order the Greek letters as they come in the alphabet.", type: "order", items: ["gamma", "alpha", "delta", "beta"], answer: ["alpha", "beta", "gamma", "delta"], hint: "The order matches aleph, beth, gimel, daleth.", why: "Alpha, beta, gamma, delta, matching the Phoenician order." },
        { q: "Which would WEAKEN the confirmation, if it were found?", options: ["Phoenician coins in Greece", "Greek alphabetic inscriptions much older than any Phoenician alphabetic writing", "More matching letter shapes", "Another Greek author agreeing with Herodotus"], answer: "Greek alphabetic inscriptions much older than any Phoenician alphabetic writing", hint: "Can a child be older than its parent?", why: "If Greek alphabetic writing were older, it could not have come from the Phoenician alphabet. (An older Greek script, Linear B, did exist, but it is a different system of syllable signs, not an alphabet.) A careful confirmer asks what evidence would disprove her claim." },
        { q: "The Phoenician alphabet had 22 letters. The classical Greek alphabet has 24. How many more letters does Greek have?", type: "number", answer: 2, hint: "Subtract.", why: "24 − 22 = 2 (the Greeks added some letters and dropped others, so the net change is 2)." },
        { q: "Which statement shows honest confirmation?", options: ["'I have no evidence, but I am sure.'", "'Everything about this is certain.'", "'Anyone who doubts this is foolish.'", "'The borrowing is well established, though exactly when it happened is debated.'"], answer: "'The borrowing is well established, though exactly when it happened is debated.'", hint: "Which separates what is known from what is uncertain?", why: "Honest confirmation marks the limits of the evidence." },
        { q: "Why are the letter names AND the letter shapes better together than either alone?", options: ["They are the same clue", "Two is a lucky number", "They are independent clues; coincidence in both is very unlikely", "Shapes are always better"], answer: "They are independent clues; coincidence in both is very unlikely", hint: "Could both match by chance?", why: "One match might be coincidence; two independent matches make chance very unlikely." },
        { q: "The English word 'alphabet' comes from:", options: ["Alpha + beta, the first two Greek letters", "The word 'alpine'", "The name of a Phoenician king", "A Latin word for writing"], answer: "Alpha + beta, the first two Greek letters", hint: "Say the first two Greek letters together.", why: "Alpha + beta = alphabet, a living trace of this history." },
        { q: "A confirmation should end by:", options: ["Insulting doubters", "Adding a new, unsupported claim", "Stating the claim and the strength of the evidence", "Asking the audience to vote"], answer: "Stating the claim and the strength of the evidence", hint: "What should the listener remember?", why: "Restate the claim with an honest measure of confidence." },
        { gen: () => RH.termQ(["confirmation", "refutation", "corroboration", "evidence", "claim"]) },
        { gen: () => RH.evQ() },
        { gen: () => RH.srcQ() },
        { gen: () => RH.corrQ() },
        { gen: () => RH.stmtQ() },
        { gen: () => RH.progQ() },
        { q: "Phoenician 'daleth' meant 'door'. Which Greek letter descends from it?", options: ["Beta", "Gamma", "Alpha", "Delta"], answer: "Delta", hint: "Listen to the first sound.", why: "Daleth became delta (Δ), a triangle, perhaps once the shape of a tent door." },
        { q: "Which is the best order for a confirmation?", options: ["Insult the doubters", "Give only testimony", "Conclude first, then never give evidence", "State the claim, give evidence building to the strongest, note uncertainty, conclude"], answer: "State the claim, give evidence building to the strongest, note uncertainty, conclude", hint: "How does a strong case build?", why: "Claim, evidence building in strength, honest limits, then the conclusion." },
        { q: "Which piece of evidence is INDEPENDENT of Herodotus?", options: ["A summary of Herodotus", "A translation of Herodotus", "Inscriptions showing matching letter shapes", "A later writer who copied Herodotus"], answer: "Inscriptions showing matching letter shapes", hint: "Which does not depend on his book?", why: "Inscriptions are physical evidence, independent of any author." },
        { q: "What makes a confirmation stronger than a single piece of testimony?", options: ["A longer speech", "Several independent lines of evidence agreeing", "Repeating the testimony often", "A louder voice"], answer: "Several independent lines of evidence agreeing", hint: "Recall convergence.", why: "Independent evidence converging is hard to explain any other way." },
        { q: "Order the letters as they appear in the English alphabet, which inherited the order: A, B, C/G, D.", type: "order", items: ["D (from delta)", "A (from alpha)", "B (from beta)", "C (from gamma, through Etruscan)"], answer: ["A (from alpha)", "B (from beta)", "C (from gamma, through Etruscan)", "D (from delta)"], hint: "Our alphabet kept the ancient order.", why: "A, B, C, D preserve the Phoenician order aleph, beth, gimel, daleth." }
      ], challenge: [
        { q: "A student confirms 'Vikings reached North America' with: (1) Norse sagas describing 'Vinland', (2) a Norse settlement excavated at L'Anse aux Meadows in Newfoundland, (3) Norse-style metal-working remains there. Which item is the STRONGEST evidence?", options: ["The sagas, because they are stories", "The metal-working alone, without the settlement", "None of them", "The excavated settlement, because physical remains can be dated and examined"], answer: "The excavated settlement, because physical remains can be dated and examined", hint: "Which item could not have been invented later by a storyteller?", why: "Physical remains dated to about AD 1000 are direct evidence; the sagas, written down centuries later, are supported by them rather than the other way round." },
        { q: "Which question should a confirmer ask herself FIRST to stay honest?", options: ["What evidence would show my claim is false, and have I looked for it?", "How can I make the audience agree quickly?", "How can I sound certain?", "Which facts should I hide?"], answer: "What evidence would show my claim is false, and have I looked for it?", hint: "A claim that survives a real attempt to disprove it is stronger.", why: "Seeking disconfirming evidence is the mark of an honest investigator." },
        { q: "Four websites say the Greek alphabet came from Egypt, not Phoenicia. All four quote the same one blog post. How should this affect the confirmation?", options: ["It counts as four strong sources", "Very little: it is one unsupported source repeated, not four independent ones", "It proves both claims", "It refutes the claim completely"], answer: "Very little: it is one unsupported source repeated, not four independent ones", hint: "How many independent sources are there really?", why: "Repetition is not corroboration. The evidence of names, shapes and direction is unaffected." },
        { gen: () => RH.corrQ() },
        { q: "Which question would most directly TEST the claim that the Greeks borrowed from the Phoenicians rather than the reverse?", options: ["Which people were richer?", "Which language is spoken today?", "Which alphabet is prettier?", "Which alphabet's earliest dated inscriptions are older?"], answer: "Which alphabet's earliest dated inscriptions are older?", hint: "Borrowing requires the source to exist first.", why: "Dated inscriptions show which writing came first; Phoenician inscriptions are older." }
      ], extend: "Make a table of all 22 Phoenician letter names with their Greek descendants and modern English letters. Then write a one-page confirmation that the Latin alphabet (our alphabet) descends from the Greek one, through the Etruscans.", offline: "Give a two-minute confirmation to the family that the Greek alphabet came from the Phoenicians. Show three pieces of evidence on a card, then state one thing that remains uncertain." },
    { title: "Logos: valid and sound arguments", icon: "🧮", learn: [
        { say: "Aristotle named three means of persuasion. <b>Logos</b> (reason) persuades by argument and evidence. It is the backbone of honest rhetoric. This lesson studies the logic of arguments.", show: { type: "big", text: "Logos = persuasion by reasoning\nfrom true premises" } },
        { say: "A <b>deductive</b> argument draws a conclusion that must follow from its <b>premises</b> (starting statements). The classic form is the <b>syllogism</b>: two premises and a conclusion.", show: { type: "table", rows: [
              ["Major premise", "All mammals breathe air."],
              ["Minor premise", "Whales are mammals."],
              ["Conclusion", "Therefore, whales breathe air."]
            ] } },
        { say: "An argument is <b>valid</b> if the conclusion must be true <b>whenever</b> the premises are true. Validity is about the shape, not the facts. This argument is valid, yet its conclusion is false, because a premise is false.", show: { type: "table", rows: [
              ["Premise", "All birds can fly. (false)"],
              ["Premise", "Penguins are birds. (true)"],
              ["Conclusion", "Penguins can fly. (false)"],
              ["Verdict", "Valid shape, false premise: UNSOUND"]
            ] } },
        { say: "An argument is <b>sound</b> if it is valid <b>and</b> all its premises are true. Only a sound argument guarantees a true conclusion. This is the heart of the truth rule: a good argument needs true reasons <b>and</b> correct reasoning.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><rect x='20' y='30' width='260' height='80' rx='12' fill='#cdebd3' stroke='#333' stroke-width='2'/><text x='150' y='66' font-size='24' text-anchor='middle' fill='#222' font-weight='bold'>Valid</text><text x='150' y='92' font-size='18' text-anchor='middle' fill='#222' >conclusion follows</text><text x='300' y='80' font-size='40' text-anchor='middle' fill='#222' font-weight='bold'>+</text><rect x='320' y='30' width='260' height='80' rx='12' fill='#eef4fb' stroke='#333' stroke-width='2'/><text x='450' y='66' font-size='22' text-anchor='middle' fill='#222' font-weight='bold'>True premises</text><text x='450' y='92' font-size='18' text-anchor='middle' fill='#222' >every reason is true</text><text x='300' y='170' font-size='40' text-anchor='middle' fill='#222' font-weight='bold'>=</text><rect x='150' y='200' width='300' height='80' rx='12' fill='#ffe6a6' stroke='#333' stroke-width='2'/><text x='300' y='236' font-size='28' text-anchor='middle' fill='#222' font-weight='bold'>SOUND</text><text x='300' y='262' font-size='18' text-anchor='middle' fill='#222' >conclusion guaranteed</text></svg>" } },
        { say: "An argument can also have true premises and a true conclusion but be <b>invalid</b>: the conclusion does not follow. 'All dogs are animals. All cats are animals. So all cats are... ' Nothing follows about cats from facts about dogs.", show: { type: "passage", title: "Premise · All roses are flowers. (true)", text: "Premise: Some flowers are red. (true)\n\nConclusion: So some roses are red. (true, as it happens)\n\nVerdict: INVALID: the red flowers might not be roses" } },
        { say: "<b>Inductive</b> arguments reason from many cases to a probable conclusion: 'Every observed copper wire conducts electricity, so copper probably conducts.' Induction gives probability, not certainty, so its conclusions need qualifiers.", show: { type: "passage", title: "Deduction · The conclusion must follow: certain if sound (often, but not always, from general to particular)", text: "Induction: The conclusion is probable, never certain (often from observed cases to a rule or prediction)" } },
        { say: "<b>Explain it.</b> Explain the difference between a valid argument and a sound argument, with an example of an argument that is valid but unsound. Why is a convincing-looking argument not enough?", show: { type: "passage", title: "Explain it", text: "Explain the difference between a valid argument and a sound argument, with an example of an argument that is valid but unsound. Why is a convincing-looking argument not enough?\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise terms from this lesson." } }
      ], practice: [
        { q: "'All metals conduct electricity. Copper is a metal. So copper conducts electricity.' This argument is:", options: ["Valid but unsound", "Not an argument", "Valid and sound", "Invalid"], answer: "Valid and sound", hint: "Does the conclusion follow? Are both premises true?", why: "The shape is valid and both premises are true, so it is sound." },
        { q: "'All fish can climb trees. A salmon is a fish. So a salmon can climb trees.' This argument is:", options: ["Invalid", "Valid and sound", "True", "Valid but unsound"], answer: "Valid but unsound", hint: "If the premises were true, would the conclusion follow?", why: "The shape is valid, but the first premise is false, so the argument is unsound." },
        { q: "What makes an argument VALID?", options: ["If the premises were true, the conclusion would have to be true", "It is long", "Many people accept it", "Every sentence is true"], answer: "If the premises were true, the conclusion would have to be true", hint: "Validity is about the connection, not the facts.", why: "Validity means the conclusion follows necessarily from the premises." },
        { q: "What makes an argument SOUND?", options: ["It sounds convincing", "It has three sentences", "It is valid and all its premises are true", "Its conclusion is popular"], answer: "It is valid and all its premises are true", hint: "Two conditions are needed.", why: "Sound = valid + true premises. Only then is the conclusion guaranteed." },
        { q: "'Some students like chess. Ada is a student. So Ada likes chess.' What is wrong?", options: ["A premise is false", "Nothing", "It is invalid: 'some' does not tell us about Ada", "Chess is a game"], answer: "It is invalid: 'some' does not tell us about Ada", hint: "Does 'some' include everyone?", why: "Ada might be one of the students who do not like chess, so the conclusion does not follow." },
        { q: "Which is an INDUCTIVE argument?", options: ["All triangles have three sides.", "I like squares.", "All squares have four sides; this is a square; so it has four sides.", "The Sun has risen every morning in recorded history, so it will probably rise tomorrow."], answer: "The Sun has risen every morning in recorded history, so it will probably rise tomorrow.", hint: "Which reasons from many observed cases to a probable conclusion?", why: "It reasons from past cases to a probable generalization: induction." },
        { q: "Complete the valid syllogism: 'All planets orbit a star. Mars is a planet. Therefore…'", options: ["Some planets are Mars", "Mars orbits a star", "All stars are planets", "Mars is a star"], answer: "Mars orbits a star", hint: "What does the general rule say about anything that is a planet?", why: "Whatever is true of all planets is true of Mars." },
        { q: "An argument has a false conclusion. What can we be sure of?", options: ["Every premise is false", "It is valid", "Nothing at all", "Either it is invalid or at least one premise is false"], answer: "Either it is invalid or at least one premise is false", hint: "A sound argument cannot have a false conclusion.", why: "If it were both valid and had true premises, the conclusion would be true. So one of those must fail." },
        { q: "'If it is raining, the ground is wet. The ground is wet. So it is raining.' This is:", options: ["Inductive and certain", "Valid but unsound", "Valid and sound", "Invalid: something else could wet the ground"], answer: "Invalid: something else could wet the ground", hint: "Could the ground be wet without rain?", why: "This is the error called 'affirming the consequent'. A sprinkler could wet the ground." },
        { q: "'If it is raining, the ground is wet. It is raining. So the ground is wet.' This is:", options: ["Valid", "Not an argument", "A preference", "Invalid"], answer: "Valid", hint: "If both premises are true, must the conclusion be true?", why: "This valid form is called modus ponens: if P then Q; P; so Q." },
        { q: "Which word should qualify an inductive conclusion?", options: ["Probably", "Proven", "Necessarily", "Certainly"], answer: "Probably", hint: "Induction can be overturned by a new case.", why: "Induction gives probability, so 'probably' is honest." },
        { q: "A syllogism has two premises and one conclusion. How many statements are there in 4 syllogisms?", type: "number", answer: 12, hint: "How many statements in one syllogism?", why: "3 statements each × 4 = 12." },
        { q: "Order the parts of a syllogism.", type: "order", items: ["Conclusion", "Minor premise (a particular case)", "Major premise (a general rule)"], answer: ["Major premise (a general rule)", "Minor premise (a particular case)", "Conclusion"], hint: "Begin with the general rule.", why: "General rule, particular case, conclusion." },
        { gen: () => RH.syllQ() },
        { gen: () => RH.syllQ() },

        { gen: () => RH.termQ(["valid", "sound", "premise", "logos", "fallacy"]) },
        { gen: () => RH.fallQ(["Circular", "Post hoc", "Hasty"]) },
        { q: "If an argument is sound, its conclusion is:", options: ["Certainly true", "An opinion", "Possibly false", "Probably true"], answer: "Certainly true", hint: "Valid + true premises means…", why: "A sound argument guarantees a true conclusion." },
        { q: "An inductive conclusion is best described as:", options: ["Always false", "A preference", "Probable, given the evidence", "Certain"], answer: "Probable, given the evidence", hint: "Can new cases overturn it?", why: "Induction gives probability that grows with good evidence but never reaches certainty." },
        { q: "'All A are B. All B are C. So all A are C.' Is this form valid?", options: ["No", "Yes"], answer: "Yes", hint: "Draw A inside B, and B inside C.", why: "If A is inside B and B is inside C, A must be inside C. The form is valid." },
        { q: "'All A are B. All C are B. So all A are C.' Is this form valid?", options: ["No", "Yes"], answer: "No", hint: "Try A = cats, B = animals, C = dogs.", why: "All cats are animals and all dogs are animals, but cats are not dogs. The form is invalid." },
        { q: "How many of these are valid forms? (1) If P then Q; P; so Q. (2) If P then Q; Q; so P. (3) If P then Q; not Q; so not P. (4) If P then Q; not P; so not Q.", type: "number", answer: 2, hint: "Test each with P = 'it rains', Q = 'the ground is wet'.", why: "Forms 1 (modus ponens) and 3 (modus tollens) are valid. Form 2 affirms the consequent and form 4 denies the antecedent: both invalid." }
      ], challenge: [
        { q: "Which argument is valid, has a TRUE conclusion, yet is UNSOUND?", options: ["All squares are shapes; so all shapes are squares.", "Some cats are black; so all cats are black.", "All mammals are animals; all dogs are mammals; so all dogs are animals.", "All birds are mammals; all bats are birds; so all bats are mammals."], answer: "All birds are mammals; all bats are birds; so all bats are mammals.", hint: "Look for a valid shape with false premises that accidentally reaches a true conclusion.", why: "The shape is valid, and bats ARE mammals, but both premises are false. A true conclusion from false premises is luck, not proof." },
        { q: "'If a number is divisible by 4, it is even. 18 is even. So 18 is divisible by 4.' What is the error, and what shows it?", options: ["Affirming the consequent; 18 ÷ 4 is not a whole number", "18 is odd", "No error; 18 is divisible by 4", "The first premise is false"], answer: "Affirming the consequent; 18 ÷ 4 is not a whole number", hint: "Check 18 ÷ 4.", why: "Being even does not make a number divisible by 4. 18 ÷ 4 = 4.5. The form is invalid, and this counter-example proves it." },
        { q: "Valid or invalid? 'No reptiles have fur. All snakes are reptiles. So no snakes have fur.'", options: ["Valid but unsound", "Valid (and sound)", "Invalid"], answer: "Valid (and sound)", hint: "If no reptiles have fur, and all snakes are among the reptiles…", why: "Snakes are entirely inside the group 'reptiles', which has no furry members. The conclusion must follow, and the premises are true." },
        { q: "How many of these arguments are SOUND? (A) All humans are mortal; Socrates is human; so Socrates is mortal. (B) All cats can fly; Tom is a cat; so Tom can fly. (C) Some dogs bark; Rex is a dog; so Rex barks. (D) All even numbers are divisible by 2; 10 is even; so 10 is divisible by 2.", type: "number", answer: 2, hint: "Test each: valid? premises true?", why: "A and D are valid with true premises. B has a false premise; C is invalid. Two are sound." },

        { q: "'If it rains, the match is canceled. The match was not canceled. So it did not rain.' Valid?", options: ["Valid (modus tollens)", "Invalid", "Neither valid nor invalid"], answer: "Valid (modus tollens)", hint: "If it had rained, what would have happened?", why: "Had it rained, the match would have been canceled; it was not, so it did not rain. This is modus tollens." },
