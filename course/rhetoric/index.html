  else if (v.type === "emoji") html = `<div class="cr-emoji">${esc(v.text)}</div>`;
  else if (v.type === "table")
    html = `<table class="cr-table">${(v.rows || []).map((r, i) => `<tr>${r.map((c) => (i === 0 && v.header !== false ? `<th>${esc(c)}</th>` : `<td>${esc(c)}</td>`)).join("")}</tr>`).join("")}</table>`;
  else if (v.type === "list") html = `<ul class="cr-list">${(v.items || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
  else if (v.type === "bars") {
    const max = Math.max(...(v.values || []).map((x) => x[1]), 1);
    html = `<div class="cr-bars">${(v.values || []).map(([k, n]) => `<div><span style="height:${Math.round((n / max) * 100)}%"></span><b>${esc(n)}</b><small>${esc(k)}</small></div>`).join("")}</div>`;
  } else if (v.type === "passage") html = `<div class="cr-passage">${v.title ? `<h3>${esc(v.title)}</h3>` : ""}${String(v.text || "").split(/\n\n+/).map((p) => `<p>${esc(p)}</p>`).join("")}</div>`;
  else if (v.type === "prompt") html = `<div class="cr-prompt${len(v.text) > 160 ? " cr-long" : ""}">${String(v.text || "").replace(/<(?!\/?b>)[^>]*>/g, "")}</div>`;
  else html = `<div class="cr-big">${esc(v.text || "")}</div>`;
  const question = q ? `<div class="cr-q">${esc(q)}</div>` : "";
  const cap = v.caption ? `<p class="cr-cap">${esc(v.caption)}</p>` : "";
  box.innerHTML = `${tag ? `<p class="cr-tag">${tag}</p>` : ""}<div class="cr-body cr-${v.type || "big"}-body">${question}${html}${cap}</div>`;
  stage.appendChild(box);
  refit();
}

async function learn(lesson, my) {
  const slides = lesson.learn || [];
  let i = 0;
  return new Promise((resolve) => {
    const host = panel(`<div class="kt-steps"><button type="button" class="kt-step-btn" data-back aria-label="Back">◀</button><span class="kt-step-dots" data-dots></span><button type="button" class="kt-step-btn kt-step-next" data-next>Next ▶</button></div>`);
    const render = () => {
      if (my !== token) return;
      const s = slides[i];
      show(s.show);
      $("[data-dots]", host).innerHTML = slides.map((_, k) => `<i class="${k === i ? "on" : k < i ? "seen" : ""}"></i>`).join("") + `<small>Learn ${i + 1} of ${slides.length}</small>`;
      $("[data-back]", host).disabled = i === 0;
      $("[data-next]", host).textContent = i === slides.length - 1 ? "✏️ Practice" : "Next ▶";
      say(`${i === 0 ? `<b>${stop(esc(lesson.title))}</b> ` : ""}${s.say}`);
    };
    host.onclick = (event) => {
      if (event.target.closest("[data-back]") && i > 0) (i -= 1), render();
      else if (event.target.closest("[data-next]")) {
        if (i < slides.length - 1) (i += 1), render();
        else {
          VOICE.hush();
          resolve();
        }
      }
    };
    if (slides.length) render();
    else resolve();
  });
}

// One question; resolves with true if right on the first try.
// Make every attempt different: generator questions build fresh numbers, choices are shuffled.
const shuffled = (list) => {
  const out = [...list];
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
};
function fresh(q) {
  let made = q;
  if (typeof q.gen === "function") {
    try {
      made = { ...q, ...q.gen() };
    } catch (error) {
      console.error("question generator failed", error);
    }
  }
  if (made.options && !made.keepOrder) made = { ...made, options: shuffled(made.options) };
  if (made.items && !made.keepOrder) made = { ...made, items: shuffled(made.items) };
  return made;
}
// Draw a set: keep the first (warm-up) question, sample the rest from the bank, keep easy-to-hard roughly by position.
function drawSet(bank, n) {
  if (bank.length <= n) return bank;
  const picks = new Set([0]);
  while (picks.size < n) picks.add(1 + Math.floor(Math.random() * (bank.length - 1)));
  return [...picks].sort((a, b) => a - b).map((k) => bank[k]);
}

// Choice and ordering lists: short words stay as chips; sentence-length entries become a calm grid of cards.
function listClass(list) {
  const longest = Math.max(0, ...list.map(len));
  const total = list.reduce((a, o) => a + len(o), 0);
  if (longest > 34 || (list.length <= 4 && total > 110)) return "cr-cards cr-wide";
  if (longest > 14 || list.length > 4) return "cr-cards";
  return "";
}

// Questions missed on the first try are kept with the lesson's progress (at most 20, newest last) for the
// parent's weekly report and for review warm-ups in later lessons. `src` says where the question lives
// ({ lesson, bank, k }), so a review can ask it again (a generated question comes back with new numbers).
// One answered right on the first try later is taken off the list.
const srcKey = (src) => (src ? `${src.lesson}:${src.bank}:${src.k}` : "");
function remember(q, missed, src) {
  try {
    const id = src ? `l${src.lesson + 1}` : shell.current();
    const text = String(q.q || "").replace(/<[^>]*>/g, "").trim();
    if (!id || !text) return;
    const key = srcKey(src);
    const was = shell.progress()[id]?.missed || [];
    const rest = was.filter((m) => (key && m.src ? m.src !== key : m.q !== text));
    if (!missed && rest.length === was.length) return;
    const answer = Array.isArray(q.answer) && q.answerText == null ? q.answer.join(" → ") : String(q.answerText ?? q.answer);
    shell.mark(id, { missed: missed ? [...rest, { q: text, a: answer.replace(/<[^>]*>/g, ""), at: Date.now(), ...(key ? { src: key } : {}) }].slice(-20) : rest });
  } catch (error) {}
}

// Spaced review: up to three questions missed in EARLIER lessons of this course, at least a day ago,
// oldest first. Each is asked again at the start of the lesson; a first-try answer clears it.
const REVIEW_MAX = 3;
const REVIEW_GAP = 20 * 3600 * 1000;
function reviewFor(index) {
  const found = [];
  const progress = shell.progress();
  for (let i = 0; i < index; i++)
    for (const m of progress[`l${i + 1}`]?.missed || []) {
      if (!m.src || Date.now() - m.at < REVIEW_GAP) continue;
      const [lesson, bank, k] = m.src.split(":");
      const q = COURSE.lessons[Number(lesson)]?.[bank]?.[Number(k)];
      if (q) found.push({ q, at: m.at, src: { lesson: Number(lesson), bank, k: Number(k) } });
    }
  return found.sort((a, b) => a.at - b.at).slice(0, REVIEW_MAX);
}

function ask(q0, label, my, src) {
  const q = fresh(q0);
  return new Promise((resolve) => {
    let tries = 0;
    const type = q.type || (q.options ? "choice" : q.items ? "order" : "number");
    const tag = `${esc(label)}${type === "order" ? ` · <span>tap in order, first to last</span>` : ""}`;
    if (q.show || q.big) show(q.show || { type: "big", text: q.big }, { tag, q: q.q });
    else show({ type: "prompt", text: q.q }, { tag });
    const finish = (right) => {
      if (my !== token) return;
      panel(`<div class="ap-buttons"><button type="button" class="primary" data-go>Next ▶</button></div>`);
      const why = q.why ? `<small>${esc(q.why)}</small>` : "";
      say(right ? `Correct. ${q.why ? esc(q.why) : ""}` : `The answer is <b>${stop(esc(Array.isArray(q.answer) && q.answerText == null ? q.answer.join(" → ") : q.answerText ?? q.answer))}</b> ${why}`);
      $("[data-panel]").onclick = (e) => e.target.closest("[data-go]") && resolve(tries === 1 && right);
    };
    const check = (value) => {
      if (my !== token) return false;
      tries += 1;
      const want = Array.isArray(q.answer) ? q.answer.join("|") : String(q.answer).trim().toLowerCase();
      const got = Array.isArray(value) ? value.join("|") : String(value).trim().toLowerCase();
      if (got === want) {
        if (tries === 1) remember(q, false, src);
        MUSIC.chime();
        window.OC?.count("problems solved");
        finish(true);
        return true;
      }
      MUSIC.oops();
      if (tries === 1) remember(q, true, src);
      if (tries === 1) say(`Not quite. ${q.hint ? esc(q.hint) : "Reconsider the question carefully."}`);
      else finish(false);
      return false;
    };
    // The question is already on the stage, so the owl reads it aloud with the bubble hidden.
    const prompt = () => say(esc(q.q), { quiet: true });
    if (type === "choice") {
      const host = panel(`<div class="ap-chips cr-choices ${listClass(q.options)}" data-list>${q.options.map((o, k) => `<button type="button" data-c="${k}">${esc(o)}</button>`).join("")}</div>`);
      // If even the tightest layout cannot hold these answers, print them on the stage as A, B, C…
      // (which may scroll there) and keep only large lettered buttons in the panel.
      const letter = (k) => String.fromCharCode(65 + k);
      const choiceList = $("[data-list]", host);
      choiceList._crCompact = () => {
        const list = choiceList, body = $(".cr-body", stage);
        // Only for genuinely long answer sets; short ones always fit the card layout.
        if (!list.isConnected || q.options.reduce((a, o) => a + len(o), 0) < 200) return false;
        if (!list || !body || q.options.length > 8) return false;
        const missed = new Set([...list.querySelectorAll(".cr-miss")].map((b) => b.dataset.c));
        list.className = "ap-chips cr-choices cr-letters";
        list.innerHTML = q.options.map((o, k) => `<button type="button" data-c="${k}" aria-label="${letter(k)}: ${esc(o).replace(/"/g, "&quot;")}" ${missed.has(String(k)) ? `disabled class="cr-miss"` : ""}>${letter(k)}</button>`).join("");
        body.insertAdjacentHTML("beforeend", `<ol class="cr-opts">${q.options.map((o, k) => `<li data-li="${k}" class="${missed.has(String(k)) ? "cr-miss" : ""}"><b>${letter(k)}</b><span>${esc(o)}</span></li>`).join("")}</ol>`);
        return true;
      };
      host.onclick = (e) => {
        const b = e.target.closest("[data-c]");
        if (!b || b.disabled) return;
        const ok = check(q.options[Number(b.dataset.c)]);
        if (!ok && my === token && b.isConnected) {
          b.disabled = true;
          b.classList.add("cr-miss");
          $(`.cr-opts [data-li="${b.dataset.c}"]`, stage)?.classList.add("cr-miss");
        }
      };
    } else if (type === "order") {
      let picked = [];
      const host = panel(`<div class="ap-chips cr-choices cr-ordering ${listClass(q.items)}" data-list></div><div class="ap-buttons cr-undo"><button type="button" data-undo>↺ Start over</button></div>`);
      const list = $("[data-list]", host);
      const draw = () => {
        list.innerHTML = q.items
          .map((o, k) => {
            const at = picked.indexOf(k);
            return `<button type="button" data-o="${k}" ${at >= 0 ? `disabled aria-pressed="true"` : ""}><i>${at >= 0 ? at + 1 : ""}</i><span>${esc(o)}</span></button>`;
          })
          .join("");
        $(".cr-undo", host).style.display = picked.length ? "" : "none";
        refit();
      };
      draw();
      host.onclick = (e) => {
        const b = e.target.closest("[data-o]");
        if (e.target.closest("[data-undo]")) (picked = []), draw();
        else if (b && !b.disabled) {
          picked.push(Number(b.dataset.o));
          draw();
          if (picked.length === q.items.length) {
            const value = picked.map((k) => q.items[k]);
            picked = [];
            if (!check(value) && my === token && list.isConnected) draw();
          }
        }
      };
    } else {
      const host = panel(`<div data-pad></div>`);
      numpad($("[data-pad]", host), { onEnter: (v) => check(v), max: 7 });
    }
    prompt();
  });
}

const units = Object.fromEntries(
  COURSE.lessons.map((lesson, i) => [
    `l${i + 1}`,
    async () => {
      const my = token;
      const id = `l${i + 1}`;
      try {
        await learn(lesson, my);
        if (my !== token) return;
        let first = 0;
        const review = reviewFor(i);
        if (review.length) {
          say(`First, a short review: ${review.length === 1 ? "one question" : `${review.length} questions`} missed in an earlier lesson.`);
          await wait(1400);
          if (my !== token) return;
        }
        for (let k = 0; k < review.length; k++) {
          await ask(review[k].q, `🔁 Review ${k + 1} of ${review.length}`, my, review[k].src);
          if (my !== token) return;
        }
        const bankOf = (name) => (lesson[name] || []).map((q, k) => ({ q, k }));
        const practice = drawSet(bankOf("practice"), lesson.practiceCount || 12);
        for (let k = 0; k < practice.length; k++) {
          if (await ask(practice[k].q, `Practice ${k + 1} of ${practice.length}`, my, { lesson: i, bank: "practice", k: practice[k].k })) first += 1;
          if (my !== token) return;
        }
        const challenge = drawSet(bankOf("challenge"), lesson.challengeCount || 3);
        for (let k = 0; k < challenge.length; k++) {
          say("Challenge problem. Understand it, make a plan, carry it out, then check.");
          await wait(1200);
          if (my !== token) return;
          await ask(challenge[k].q, `⭐ Challenge ${k + 1} of ${challenge.length}`, my, { lesson: i, bank: "challenge", k: challenge[k].k });
          if (my !== token) return;
        }
        shell.mark(id, { done: true, first, of: practice.length, doneAt: Date.now() });
        show({ type: "big", text: `${first} / ${practice.length}`, caption: "practice problems correct on the first attempt" });
        panel(`<div class="ap-buttons"><button type="button" class="primary" data-explain>🗣️ Explain it</button><button type="button" data-off>📝 Task</button>${lesson.extend ? `<button type="button" data-extend>🚀 Go further</button>` : ""}<button type="button" data-again>↺ Again</button></div>`);
        say(`Lesson complete. Now explain the main idea in your own words.`);
        $("[data-panel]").onclick = (e) => {
          if (e.target.closest("[data-again]")) shell.go(id);
          if (e.target.closest("[data-explain]")) {
            show({ type: "list", items: [`Explain to a grown-up, in 3 or 4 clear sentences, the main idea of "${lesson.title}".`, "Give one example of your own.", "Say one question you still have."] });
            say("Explain the main idea in three or four clear sentences, give an example of your own, and ask one question you still have.");
          }
          if (e.target.closest("[data-extend]")) {
            show({ type: "list", items: [lesson.extend] });
            say(esc(lesson.extend), { quiet: true });
          }
          if (e.target.closest("[data-off]")) {
            show({ type: "list", items: [lesson.offline || "Tell a grown-up what you learned today, in 5 sentences."] });
            say(esc(lesson.offline || "Tell a grown-up what you learned today."), { quiet: true });
          }
        };
      } catch (error) {
        console.error(error);
      }
    },
  ]),
);

const how = Object.fromEntries(UNITS.map((u) => [u.id, { icon: COURSE.icon, title: u.label.replace(/^\d+\.\s*/, ""), steps: ["Learn: study the lesson slides.", "Practice: solve each problem; a first miss gives a hint, a second shows the full reasoning.", "Challenge: contest-level problems. Then explain the main idea in your own words."] }]));
const fromHash = /^#l\d+$/.test(location.hash) && UNITS.some((u) => u.id === location.hash.slice(1)) ? location.hash.slice(1) : null;
const shell = SHELL({
  unitWord: "Lesson",
  units: UNITS,
  how,
  start: fromHash || UNITS[0].id,
  onStop() {
    token += 1;
    $("[data-panel]").onclick = null;
  },
  subject: COURSE.subject,
  activity: COURSE.title,
  onUnit(id) {
    token += 1;
    VOICE.hush();
    units[id]();
  },
});

// The shell's "turn sideways" tip normally floats at the bottom of the screen, over the answer buttons.
// Here it sits at the foot of the stage (never over a control) and a tap dismisses it.
const placeTip = () => {
  const tip = $(".ap-turn");
  if (!tip) return;
  if (!tip.dataset.placed) {
    tip.dataset.placed = "1";
    tip.classList.add("cr-turn");
    tip.insertAdjacentHTML("beforeend", ` <b aria-hidden="true">✕</b>`);
    tip.setAttribute("role", "button");
    tip.addEventListener("click", () => tip.remove());
  }
  const r = stage.getBoundingClientRect();
  tip.style.bottom = "auto";
  tip.style.top = `${Math.max(4, Math.round(r.bottom - tip.offsetHeight - 10))}px`;
};
placeTip();
addEventListener("resize", placeTip);
if (window.ResizeObserver) new ResizeObserver(placeTip).observe(stage);

.ap-panel.cr-panel.cr-tight .cr-choices.cr-cards button{padding-top:6px;padding-bottom:6px;min-height:44px}
.ap-panel.cr-panel .cr-choices button.cr-miss{opacity:.5;background:#f6e9e4;box-shadow:0 0 0 1px #e4b9a8;text-decoration:line-through;text-decoration-color:rgba(160,70,40,.45)}
.ap-panel.cr-panel .cr-ordering button{display:flex;align-items:center;justify-content:flex-start;gap:10px;text-align:left}
.ap-panel.cr-panel .cr-choices.cr-ordering.cr-cards{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.ap-panel.cr-panel.cr-dense .cr-choices.cr-cards:not(.cr-wide){grid-template-columns:repeat(auto-fit,minmax(min(100%,138px),1fr))}
.ap-panel.cr-panel.cr-dense .cr-choices.cr-ordering.cr-cards:not(.cr-wide) button{padding-left:8px;padding-right:8px;gap:7px}
.ap-panel.cr-panel .cr-ordering button i{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--paper,#f6efe4);box-shadow:inset 0 0 0 2px #e2d6c4;font:900 14px/1 var(--sans);font-style:normal;color:#fff}
.ap-panel.cr-panel .cr-ordering button[aria-pressed="true"]{opacity:1;background:var(--accent-soft);color:var(--ink);box-shadow:0 0 0 2px var(--accent);cursor:default}
.ap-panel.cr-panel .cr-ordering button[aria-pressed="true"] i{background:var(--accent);box-shadow:none}
.ap-panel.cr-panel .cr-ordering.cr-wide button span{flex:1}
.ap-panel.cr-panel .cr-ordering button span{text-align:left}
.ap-panel.cr-panel .cr-undo button{min-height:44px;font-size:15px;padding:0 16px}
@media (max-height:700px),(max-width:420px){.ap-panel.cr-panel .cr-choices.cr-cards button,.ap-panel.cr-panel .cr-ordering button{min-height:44px}.ap-panel.cr-panel .cr-choices{gap:6px}}

.ap-turn.cr-turn{pointer-events:auto;cursor:pointer;width:max-content;max-width:calc(100vw - 32px);white-space:normal;text-align:center;font-size:14px;padding:8px 14px}
.ap-turn.cr-turn b{margin-left:6px;opacity:.7}

/* lettered answers: the full texts on the stage, big A/B/C buttons in the panel */
.cr-opts{list-style:none;margin:0;padding:0;display:grid;gap:calc(8px * var(--s));width:100%;max-width:40em;text-align:left;font:650 max(13.5px,calc(clamp(15px,2vw,19px) * var(--s)))/1.4 var(--sans);color:var(--ink)}
.cr-opts li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:calc(8px * var(--s)) 12px;border-radius:14px;background:var(--accent-soft)}
.cr-opts li b{display:grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;background:var(--accent);color:#fff;font-weight:900}
.cr-opts li.cr-miss{opacity:.45;text-decoration:line-through}
.ap-panel.cr-panel .cr-choices.cr-letters{display:flex;flex-wrap:nowrap;justify-content:center;gap:10px}
.ap-panel.cr-panel .cr-choices.cr-letters button{flex:1 1 0;max-width:110px;min-height:52px;font-size:22px;font-weight:900;text-decoration:none}

/* tap targets stay at least 44 px even on short landscape phones */
.ap-panel.cr-panel .ap-buttons button,.ap-panel.cr-panel .kt-step-btn{min-height:46px}
@media (max-height:460px),(max-width:420px) and (max-height:720px){.ap-panel.cr-panel{--say:15.5px}.ap-panel.cr-panel .kt-keys button{min-height:44px !important}.ap-panel.cr-panel .kt-entry{min-height:40px !important}}
@media (max-height:460px){.ap-panel.cr-panel .ap-buttons button,.ap-panel.cr-panel .kt-step-btn{min-height:44px}.ap-panel.cr-panel .cr-choices button{min-height:44px}.cr-show{padding:8px 10px}.cr-tag{font-size:12.5px;padding:3px 10px}}
`;
document.head.appendChild(style);
</script>
