    { title: "Ethos and pathos, used and misused", icon: "🎭", learn: [
        { say: "Aristotle named three means of persuasion. You have studied <b>logos</b>. The other two are <b>ethos</b>, the trust the audience places in the speaker's character, and <b>pathos</b>, the emotions the speech arouses.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><polygon points='300,30 80,290 520,290' fill='#eef4fb' stroke='#333' stroke-width='3'/><rect x='215' y='10' width='170' height='56' rx='12' fill='#ffe6a6' stroke='#333' stroke-width='2'/><text x='300' y='45' font-size='24' text-anchor='middle' fill='#222' font-weight='bold'>ETHOS</text><rect x='20' y='262' width='180' height='56' rx='12' fill='#f6d0c8' stroke='#333' stroke-width='2'/><text x='110' y='297' font-size='24' text-anchor='middle' fill='#222' font-weight='bold'>PATHOS</text><rect x='400' y='262' width='180' height='56' rx='12' fill='#cdebd3' stroke='#333' stroke-width='2'/><text x='490' y='297' font-size='24' text-anchor='middle' fill='#222' font-weight='bold'>LOGOS</text><text x='300' y='175' font-size='22' text-anchor='middle' fill='#222' font-weight='bold'>character · emotion · reason</text></svg>" } },
        { say: "Aristotle said ethos rests on three things: <b>good sense</b> (practical wisdom), <b>good character</b> (honesty and virtue) and <b>goodwill</b> toward the audience. A speaker earns ethos by being knowledgeable, honest about limits, and fair to opponents.", show: { type: "passage", title: "Source of ethos · How a speaker shows it", text: "Good sense: Accurate facts; sound judgement\n\nGood character: Admits uncertainty; corrects mistakes\n\nGoodwill: Speaks for the audience's real good" } },
        { say: "Pathos is not wrong in itself. Grief at a funeral, alarm at a real danger, compassion for real suffering: these are <b>fitting</b> emotions, matched to true facts. Pathos is <b>misused</b> when emotion replaces evidence or is stirred by falsehood.", show: { type: "passage", title: "Fitting pathos · Misused pathos", text: "Feeling matches true facts: Feeling built on falsehood or exaggeration\n\nRelevant to the decision: Irrelevant to the decision\n\nLeaves room to think: Rushes the audience past thinking" } },
        { say: "In Hans Christian Andersen's tale The Emperor's New Clothes (1837), two swindlers persuade a whole city of something false. Listen to how they do it.", show: { type: "passage", title: "Hans Christian Andersen, The Emperor's New Clothes (1837), retold", text: "Two swindlers came to the city and said they could weave a marvelous cloth. They claimed it was invisible to anyone who was unfit for his job or very foolish. The Emperor paid them richly. His ministers saw nothing on the empty looms, but each feared being thought foolish, so each praised the cloth. At last the Emperor walked in a procession wearing his 'new clothes', and the whole crowd praised them, until a little child said: 'But he hasn't got anything on!'" } },
        { say: "The swindlers borrow <b>ethos</b> they have not earned: they claim to be master weavers. Then they misuse <b>pathos</b>, the fear of looking foolish, so that no one dares to trust his own eyes. Everyone repeats the praise because everyone else does. Only a child, with nothing to lose, says what is true.", show: { type: "passage", title: "The trick, step by step", text: "False ethos: 'We are master weavers.'\n\nMisused pathos: 'Only fools cannot see the cloth.'\n\nThe crowd: each person praises what he cannot see.\n\nThe truth: 'But he hasn't got anything on!'" } },
        { say: "Ethos can be misused too. A speaker may borrow trust he has not earned: a famous name, a uniform, a confident tone. Ask: Is this person actually expert here? Has he been honest before? Does he gain from my belief?", show: { type: "list", items: ["Borrowed ethos: fame outside the field", "False ethos: a pretended credential", "Earned ethos: real knowledge + honesty + goodwill"] } },
        { say: "<b>Explain it.</b> Explain ethos, pathos and logos. Then explain the difference between fitting and manipulative pathos, using The Emperor's New Clothes or an example of your own.", show: { type: "passage", title: "Explain it", text: "Explain ethos, pathos and logos. Then explain the difference between fitting and manipulative pathos, using The Emperor's New Clothes or an example of your own.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise terms from this lesson." } }
      ], practice: [
        { q: "What is ethos?", options: ["A kind of fallacy", "Persuasion through the speaker's trustworthy character", "Persuasion through emotion", "Persuasion through numbers"], answer: "Persuasion through the speaker's trustworthy character", hint: "Think of the word 'ethics'.", why: "Ethos is the audience's trust in the speaker's character, sense and goodwill." },
        { q: "What is pathos?", options: ["A logical proof", "The speaker's honesty", "Persuasion through the audience's emotions", "The arrangement of a speech"], answer: "Persuasion through the audience's emotions", hint: "Think of 'sympathy' and 'empathy'.", why: "Pathos appeals to feeling." },
        { q: "Which of Aristotle's three sources of ethos is shown when a speaker says, 'I may be wrong about the date; let me check'?", options: ["Good character (honesty about limits)", "Good sense alone", "Goodwill", "Pathos"], answer: "Good character (honesty about limits)", hint: "Which quality admits uncertainty honestly?", why: "Admitting limits shows honesty, part of good character." },
        { q: "The swindlers say the cloth cannot be seen by anyone foolish or unfit for his job. Which appeal is this?", options: ["Logos: a sound proof", "Pathos: it plays on the fear of looking foolish", "Fitting pathos based on true facts", "Ethos earned by honest work"], answer: "Pathos: it plays on the fear of looking foolish", hint: "What feeling stops the ministers from speaking up?", why: "The claim is false; it works only by making people afraid to look foolish. That is misused pathos.", show: { type: "passage", title: "Hans Christian Andersen, The Emperor's New Clothes (1837), retold", text: "Two swindlers came to the city and said they could weave a marvelous cloth. They claimed it was invisible to anyone who was unfit for his job or very foolish. The Emperor paid them richly. His ministers saw nothing on the empty looms, but each feared being thought foolish, so each praised the cloth. At last the Emperor walked in a procession wearing his 'new clothes', and the whole crowd praised them, until a little child said: 'But he hasn't got anything on!'" } },
        { q: "Why does each minister praise cloth he cannot see?", options: ["He can truly see it", "He forgot his glasses", "He is afraid of being thought foolish or unfit for his job", "He has studied weaving for years"], answer: "He is afraid of being thought foolish or unfit for his job", hint: "What did the swindlers say about people who cannot see the cloth?", why: "Fear of looking foolish outweighs the evidence of his own eyes; the false praise then spreads from person to person.", show: { type: "passage", title: "Hans Christian Andersen, The Emperor's New Clothes (1837), retold", text: "Two swindlers came to the city and said they could weave a marvelous cloth. They claimed it was invisible to anyone who was unfit for his job or very foolish. The Emperor paid them richly. His ministers saw nothing on the empty looms, but each feared being thought foolish, so each praised the cloth. At last the Emperor walked in a procession wearing his 'new clothes', and the whole crowd praised them, until a little child said: 'But he hasn't got anything on!'" } },
        { q: "'Swindlers' (in 'Two swindlers came to the city') means:", options: ["Cheats", "Tailors", "Kings", "Children"], answer: "Cheats", hint: "Were they honest weavers?", why: "A swindler is a cheat who tricks people out of their money.", show: { type: "passage", title: "Hans Christian Andersen, The Emperor's New Clothes (1837), retold", text: "Two swindlers came to the city and said they could weave a marvelous cloth. They claimed it was invisible to anyone who was unfit for his job or very foolish. The Emperor paid them richly. His ministers saw nothing on the empty looms, but each feared being thought foolish, so each praised the cloth. At last the Emperor walked in a procession wearing his 'new clothes', and the whole crowd praised them, until a little child said: 'But he hasn't got anything on!'" } },
        { q: "Which is FITTING pathos?", options: ["Describing truthfully the hunger of real families to raise food for them", "Inventing a tragic story to sell toothpaste", "Frightening children with false monsters to make them obey", "Making people angry to stop them thinking"], answer: "Describing truthfully the hunger of real families to raise food for them", hint: "Which emotion matches true, relevant facts?", why: "Real need, truthfully described, justly stirs compassion." },
        { q: "A celebrity chef recommends a heart medicine. What kind of ethos is this?", options: ["Logos", "Earned ethos", "Borrowed ethos: fame outside his field", "Fitting pathos"], answer: "Borrowed ethos: fame outside his field", hint: "Is cooking expertise relevant to medicine?", why: "His trustworthiness about cooking does not transfer to medicine." },
        { q: "Which statement builds ethos honestly?", options: ["'Don't ask where I got this.'", "'Trust me, I'm always right.'", "'Everybody knows I'm clever.'", "'I have studied rivers for twelve years, and here is the data.'"], answer: "'I have studied rivers for twelve years, and here is the data.'", hint: "Which offers real experience and evidence?", why: "Relevant experience plus open evidence earns trust." },
        { q: "When does pathos become manipulation?", options: ["When emotion replaces or distorts the true reasons", "Whenever a speech makes anyone feel anything", "Never", "Only when the speaker cries"], answer: "When emotion replaces or distorts the true reasons", hint: "Is all feeling bad?", why: "Emotion is fine when it fits the truth; manipulation uses it to bypass truth." },
        { q: "In the procession, the whole crowd praises the Emperor's clothes. What does this show about persuasion?", options: ["The cloth was real", "The swindlers were poor speakers", "They gave sound logical proof", "Fear and the crowd's example can carry people past what their own eyes tell them"], answer: "Fear and the crowd's example can carry people past what their own eyes tell them", hint: "Did the crowd weigh the evidence calmly?", why: "Powerful feeling without careful reasoning led a whole city to praise nothing. Persuasion and wisdom are not the same.", show: { type: "passage", title: "Hans Christian Andersen, The Emperor's New Clothes (1837), retold", text: "Two swindlers came to the city and said they could weave a marvelous cloth. They claimed it was invisible to anyone who was unfit for his job or very foolish. The Emperor paid them richly. His ministers saw nothing on the empty looms, but each feared being thought foolish, so each praised the cloth. At last the Emperor walked in a procession wearing his 'new clothes', and the whole crowd praised them, until a little child said: 'But he hasn't got anything on!'" } },
        { q: "Which is the strongest logos (evidence) in the story?", options: ["The child's plain report: there is no cloth to be seen", "'Only fools cannot see it'", "The swindlers call themselves master weavers", "Everyone else is praising it"], answer: "The child's plain report: there is no cloth to be seen", hint: "Which statement rests on what can actually be observed?", why: "The child reports what anyone could check with his own eyes; the others are borrowed trust, fear or the crowd.", show: { type: "passage", title: "Hans Christian Andersen, The Emperor's New Clothes (1837), retold", text: "Two swindlers came to the city and said they could weave a marvelous cloth. They claimed it was invisible to anyone who was unfit for his job or very foolish. The Emperor paid them richly. His ministers saw nothing on the empty looms, but each feared being thought foolish, so each praised the cloth. At last the Emperor walked in a procession wearing his 'new clothes', and the whole crowd praised them, until a little child said: 'But he hasn't got anything on!'" } },
        { q: "Order the events of the story.", type: "order", items: ["The ministers praise cloth they cannot see", "The swindlers claim to weave a magic cloth", "A child says the Emperor has nothing on", "The Emperor pays them richly", "The Emperor walks in the procession"], answer: ["The swindlers claim to weave a magic cloth", "The Emperor pays them richly", "The ministers praise cloth they cannot see", "The Emperor walks in the procession", "A child says the Emperor has nothing on"], hint: "Follow the story from beginning to end.", why: "A false claim, the payment, fearful praise, the procession, and at last the plain truth." },

        { q: "A speaker has excellent ethos: a famous scientist. She speaks on economics, outside her field, and offers no evidence. How much should her ethos count?", options: ["Not at all, ever, about anything", "More than evidence", "Little: trust in one field does not transfer to another without evidence", "Fully: she is famous"], answer: "Little: trust in one field does not transfer to another without evidence", hint: "Is ethos field-specific?", why: "Ethos depends on relevant knowledge. Outside her field, her claims need evidence like anyone else's." },

    { title: "Fallacies I: attacks and crowds", icon: "🚩", learn: [
        { say: "A <b>fallacy</b> (from Latin fallere, 'to deceive') is an error in reasoning that makes an argument seem stronger than it is. Knowing fallacies protects you from being misled and keeps your own arguments honest.", show: { type: "big", text: "Fallacy = a mistake in reasoning\nthat looks like a good argument" } },
        { say: "The first family of fallacies attacks or flatters <b>people</b> instead of examining <b>reasons</b>.", show: { type: "passage", title: "Fallacy · What it does · Example", text: "Ad hominem — What it does: Attacks the person; Example: 'Ignore him; he's rude.'\n\nTu quoque (a kind of ad hominem) — What it does: 'You do it too'; Example: 'You eat candy too, so don't tell me to stop.'\n\nStraw man — What it does: Distorts the other view; Example: 'She wants less homework, so she hates learning.'" } },
        { say: "The second family leans on <b>crowds and authorities</b> instead of evidence.", show: { type: "passage", title: "Fallacy · What it does · Example", text: "Bandwagon — What it does: Popular, so true; Example: 'Everyone believes it.'\n\nFalse authority — What it does: Expert in the wrong field; Example: 'A singer says this cures colds.'\n\nAppeal to emotion — What it does: Feeling replaces reasons; Example: 'Think of the sad puppies: buy this!'" } },
        { say: "Careful: not every mention of a person is ad hominem. If a witness has lied before about this very matter, that is <b>relevant</b> to how far we trust his testimony. The fallacy is attacking the person <b>instead of</b> answering the argument.", show: { type: "table", rows: [
              ["Fallacy", "'Her argument for the park is wrong; she wears silly hats.'"],
              ["Relevant", "'This witness was paid by the company; we need independent evidence.'"]
            ] } },
        { say: "Likewise, a <b>real</b> expert speaking in her own field is good evidence (though experts can err). And emotion fitted to true facts is not a fallacy. The question is always: are the reasons true, and do they support the claim?", show: { type: "big", text: "Real expert, own field: good evidence.\nFame elsewhere: false authority." } },
        { say: "When you spot a fallacy, name the error politely and return to the question: 'That may be true of him, but is his argument right?' A fallacy shows the argument is weak, <b>not</b> that its conclusion is false.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0L10 5L0 10z' fill='#333'/></marker></defs><rect x='20' y='40' width='250' height='80' rx='12' fill='#f6d0c8' stroke='#333' stroke-width='2'/><text x='145' y='87' font-size='22' text-anchor='middle' fill='#222' font-weight='bold'>Fallacy spotted</text><line x1='272' y1='80' x2='328' y2='80' stroke='#333' stroke-width='3' marker-end='url(#a)'/><rect x='330' y='40' width='250' height='80' rx='12' fill='#cdebd3' stroke='#333' stroke-width='2'/><text x='455' y='87' font-size='22' text-anchor='middle' fill='#222' font-weight='bold'>Back to the question</text><text x='300' y='210' font-size='24' text-anchor='middle' fill='#222' font-weight='bold'>Weak argument ≠ false conclusion</text><text x='300' y='260' font-size='20' text-anchor='middle' fill='#222' >Look for better evidence either way.</text></svg>" } },
        { say: "<b>Explain it.</b> Explain what a fallacy is, and describe ad hominem, straw man and bandwagon with your own examples. Why does spotting a fallacy not prove the conclusion false?", show: { type: "passage", title: "Explain it", text: "Explain what a fallacy is, and describe ad hominem, straw man and bandwagon with your own examples. Why does spotting a fallacy not prove the conclusion false?\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise terms from this lesson." } }

        { q: "What is a fallacy?", options: ["A rude remark", "An error in reasoning that makes an argument seem stronger than it is", "A false fact", "Any argument you disagree with"], answer: "An error in reasoning that makes an argument seem stronger than it is", hint: "Latin fallere means to deceive.", why: "A fallacy is faulty reasoning disguised as good reasoning." },
        { q: "'Don't listen to Tom's idea for the fête; he failed his math test.' Which fallacy?", options: ["False dilemma", "Straw man", "Ad hominem", "Bandwagon"], answer: "Ad hominem", hint: "Is the reply about the idea or about Tom?", why: "It attacks Tom, not his idea." },
        { q: "'You say we should save water, but you had a bath yesterday!' Which fallacy?", options: ["Straw man", "Bandwagon", "False authority", "Tu quoque"], answer: "Tu quoque", hint: "'You do it too.'", why: "Even if the speaker is inconsistent, the argument for saving water can still be right." },
        { q: "Ella: 'We should have fewer candies in the house.' Max: 'So Ella wants us never to enjoy anything!' Which fallacy?", options: ["Straw man", "Tu quoque", "Bandwagon", "Ad hominem"], answer: "Straw man", hint: "Did Ella say that?", why: "Max distorted Ella's modest view into an extreme one." },
        { q: "'Ten million people have bought this book, so everything in it is true.' Which fallacy?", options: ["Ad hominem", "Bandwagon", "Straw man", "Tu quoque"], answer: "Bandwagon", hint: "Does popularity prove truth?", why: "Sales show popularity, not accuracy." },
        { q: "Which is NOT a fallacy?", options: ["'A pop star says the bridge is unsafe.'", "'Everyone says the bridge is unsafe.'", "'The mayor is boring, so the bridge is safe.'", "'The bridge engineer, after inspecting it, says it is unsafe.'"], answer: "'The bridge engineer, after inspecting it, says it is unsafe.'", hint: "Which uses a real expert in her own field?", why: "An engineer's inspection is relevant expert evidence." },
        { q: "Which is a RELEVANT point about a person, not ad hominem?", options: ["'She is from another town.'", "'The scientist has a funny laugh.'", "'He is too young to have opinions.'", "'The study was paid for by the company selling the product, so we need independent checks.'"], answer: "'The study was paid for by the company selling the product, so we need independent checks.'", hint: "Which point bears on how far to trust the evidence?", why: "A conflict of interest is relevant to reliability." },
        { q: "You spot a fallacy in someone's argument. What follows?", options: ["Their conclusion is false", "They are a bad person", "You win", "Their argument is weak, but their conclusion might still be true"], answer: "Their argument is weak, but their conclusion might still be true", hint: "Can a true conclusion be argued badly?", why: "A bad argument for a true conclusion is still possible; look for better evidence." },
        { q: "'If you don't vote for me, you don't care about children.' This mainly misuses:", options: ["Emotion (and a false choice)", "Expert evidence", "Statistics", "Etymology"], answer: "Emotion (and a false choice)", hint: "Is a reason given, or a feeling stirred?", why: "It pressures feeling instead of giving reasons, and pretends caring requires one vote." },
        { q: "How do you politely answer an ad hominem?", options: ["Agree with the insult", "Say nothing ever again", "'Well, you're worse!'", "'That may be so, but what about the argument itself?'"], answer: "'That may be so, but what about the argument itself?'", hint: "Return to the question.", why: "Redirect to the reasons without counter-attacking." },

        { q: "Is a doctor's advice about medicine an example of false authority?", options: ["No; it is real expertise in her own field", "Yes, always", "Only if she is famous"], answer: "No; it is real expertise in her own field", hint: "Does her expertise match the question?", why: "Real expertise in the relevant field is good (though not infallible) evidence." },

        { q: "'Professor Grant's study on sleep must be wrong: she drinks five cups of coffee a day!' Which response is BEST?", options: ["Her habits don't affect whether her data are correct; examine the study's method and results", "She must be wrong, since coffee affects sleep", "Then all sleep studies are wrong", "Coffee drinkers can't be scientists"], answer: "Her habits don't affect whether her data are correct; examine the study's method and results", hint: "Is the study's truth affected by her coffee?", why: "That is ad hominem. The study stands or falls by its evidence." },
        { q: "A witness in court once lied under oath about this same case. The lawyer says, 'We should not rely on his testimony without corroboration.' Is this ad hominem?", options: ["Yes: lawyers always use fallacies", "Yes: it mentions the person", "It is a straw man", "No: his record of lying on this matter is relevant to how far we trust his testimony"], answer: "No: his record of lying on this matter is relevant to how far we trust his testimony", hint: "Is the point about his argument, or about his reliability as a witness?", why: "When a person's testimony is itself the evidence, his reliability is relevant. Ad hominem is attacking the person instead of a reasoned argument." },
        { q: "Which is a SUBTLE straw man? Original: 'Some sugar in moderation is fine.'", options: ["'You think some sugar is acceptable.'", "'So you're saying sugar is healthy.'", "'So you're saying sugar in moderation is fine.'"], answer: "'So you're saying sugar is healthy.'", hint: "Which restatement changes 'some is fine' into a bigger claim?", why: "'Fine in moderation' is not 'healthy'. The subtle shift makes the view easier to attack." },

    { title: "Fallacies II: faulty logic", icon: "🧩", learn: [
        { say: "The second family of fallacies hides errors in the <b>structure</b> of reasoning. These are harder to spot because each sentence may be true.", show: { type: "passage", title: "Fallacy · The hidden error", text: "False dilemma: Only two options are offered when there are more\n\nSlippery slope: One step is said to lead inevitably to disaster\n\nHasty generalization: A rule drawn from too few cases\n\nPost hoc: After, therefore because of\n\nCircular reasoning: The conclusion is assumed in a premise\n\nRed herring: A distraction from the real question" } },
        { say: "<b>False dilemma</b>: 'Either we cancel the trip or someone gets hurt.' There may be other options: more adults, a safer route. Ask: Are these really the only possibilities?", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0L10 5L0 10z' fill='#333'/></marker></defs><rect x='220' y='20' width='160' height='56' rx='12' fill='#ffe6a6' stroke='#333' stroke-width='2'/><text x='300' y='55' font-size='22' text-anchor='middle' fill='#222' font-weight='bold'>Problem</text><line x1='260' y1='78' x2='110' y2='150' stroke='#333' stroke-width='3' marker-end='url(#a)'/><line x1='340' y1='78' x2='490' y2='150' stroke='#333' stroke-width='3' marker-end='url(#a)'/><line x1='300' y1='78' x2='300' y2='150' stroke='#333' stroke-width='3' marker-end='url(#a)'/><rect x='20' y='155' width='170' height='56' rx='12' fill='#f6d0c8' stroke='#333' stroke-width='2'/><text x='105' y='190' font-size='20' text-anchor='middle' fill='#222' font-weight='bold'>Option A</text><rect x='410' y='155' width='170' height='56' rx='12' fill='#f6d0c8' stroke='#333' stroke-width='2'/><text x='495' y='190' font-size='20' text-anchor='middle' fill='#222' font-weight='bold'>Option B</text><rect x='215' y='155' width='170' height='56' rx='12' fill='#cdebd3' stroke='#333' stroke-width='2'/><text x='300' y='190' font-size='20' text-anchor='middle' fill='#222' font-weight='bold'>Option C?</text><text x='300' y='280' font-size='22' text-anchor='middle' fill='#222' font-weight='bold'>Look for the options left out</text></svg>" } },
        { say: "<b>Slippery slope</b>: 'If we allow one dog in the park, soon there will be thousands.' Some chains of events are real; the fallacy is claiming each step is certain <b>without evidence</b>.", show: { type: "big", text: "Step 1 → Step 2 → … → Disaster?\nIs each step actually likely?" } },
        { say: "<b>Post hoc</b> (Latin post hoc, ergo propter hoc: 'after this, therefore because of this'): the rooster crows and the sun rises; the rooster does not cause sunrise. Sequence is not cause. Linked to it is <b>hasty generalization</b>: two rude tourists do not prove all tourists rude.", show: { type: "table", rows: [
              ["Post hoc", "B came after A, so A caused B"],
              ["Hasty generalization", "A few cases, so all cases"],
              ["The cure", "More cases, comparison groups, and a known mechanism"]
            ] } },
        { say: "<b>Circular reasoning</b> assumes what it should prove: 'This book is true because the book says so.' <b>Red herring</b> drags the conversation elsewhere. The name was made popular by the journalist William Cobbett (1807), who told of using a strong-smelling smoked herring to draw hounds off a hare's trail.", show: { type: "passage", title: "Circular · 'He's trustworthy because he's honest, and honest because he's trustworthy.'", text: "Red herring: 'Why haven't you tidied your room?' 'Did you know octopuses have three hearts?'" } },
        { say: "A useful habit: when you hear a strong conclusion, slow down and ask four questions. Are there other options? Is each step likely? Are there enough cases? Is the cause shown, or only the sequence?", show: { type: "list", items: ["Other options?", "Each step likely?", "Enough cases?", "Cause, or only sequence?", "Does it assume what it proves?", "Is it still on the question?"] } },
        { say: "<b>Explain it.</b> Choose three fallacies from this lesson. For each, give the definition, an example of your own, and the question that exposes it.", show: { type: "passage", title: "Explain it", text: "Choose three fallacies from this lesson. For each, give the definition, an example of your own, and the question that exposes it.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise terms from this lesson." } }
      ], practice: [
        { q: "'Either you play football or you're lazy.' Which fallacy?", options: ["False dilemma", "Post hoc", "Circular reasoning", "Red herring"], answer: "False dilemma", hint: "Are there only two possibilities?", why: "One can be active in many other ways." },
        { q: "'If you get one bad mark, you'll fail school, never get a job and be miserable forever.' Which fallacy?", options: ["Slippery slope", "Tu quoque", "Bandwagon", "Straw man"], answer: "Slippery slope", hint: "Is each step really certain?", why: "A chain of unlikely steps is presented as inevitable." },
        { q: "'I ate fish and then had a headache, so fish gives me headaches.' Which fallacy?", options: ["False dilemma", "Post hoc", "Red herring", "Circular reasoning"], answer: "Post hoc", hint: "Did the fish cause it, or just come before?", why: "One event after another is not proof of cause." },
        { q: "'The two Dutch people I've met were tall, so all Dutch people are tall.' Which fallacy?", options: ["Red herring", "Slippery slope", "Circular reasoning", "Hasty generalization"], answer: "Hasty generalization", hint: "How many cases?", why: "Two cases cannot support a rule about millions." },
        { q: "'Mr Lee is the best teacher because no teacher is better than him.' Which fallacy?", options: ["False dilemma", "Circular reasoning", "Post hoc", "Hasty generalization"], answer: "Circular reasoning", hint: "Does the reason say anything new?", why: "The reason just restates the conclusion." },
        { q: "Asked why homework was late, a pupil says, 'Did you know that the school's heating is broken?' Which fallacy?", options: ["Post hoc", "Red herring", "Slippery slope", "Hasty generalization"], answer: "Red herring", hint: "Did he answer the question?", why: "He changed the subject." },
        { q: "What question best exposes a false dilemma?", options: ["Are there other options?", "Is it long?", "Who said it?", "How many people agree?"], answer: "Are there other options?", hint: "The fallacy hides options.", why: "Looking for the missing options reveals it." },
        { q: "What question best exposes post hoc?", options: ["Is the speaker an expert?", "Is there evidence of cause, or only of sequence?", "Is it popular?", "Are there other options?"], answer: "Is there evidence of cause, or only of sequence?", hint: "Before does not mean because.", why: "Cause needs evidence beyond timing." },
        { q: "Which slippery-slope argument is REASONABLE (not a fallacy)?", options: ["'If you have one sweet, you'll become a sweet monster.'", "'If we let one cat in, the house will be full of cats.'", "'If we stop treating the infected wound, the infection will likely spread, as doctors have observed many times.'"], answer: "'If we stop treating the infected wound, the infection will likely spread, as doctors have observed many times.'", hint: "Which chain is supported by evidence?", why: "Each step of the infection chain is well documented; a chain is a fallacy only when it lacks evidence." },
        { q: "What does 'post hoc, ergo propter hoc' mean?", options: ["Before this, therefore not this", "After this, therefore because of this", "With this, therefore because of this", "Because of this, therefore after this"], answer: "After this, therefore because of this", hint: "'Post' means after.", why: "It names the error of treating sequence as cause." },
        { q: "Why is a red herring called that?", options: ["Red means danger", "It was invented by fishermen", "A strong-smelling smoked fish dragged across a trail could draw hounds away from it", "Herrings are red"], answer: "A strong-smelling smoked fish dragged across a trail could draw hounds away from it", hint: "What would a dog follow?", why: "The image (made popular by William Cobbett in 1807) is of a smell pulling hounds off the real trail, as the fallacy pulls attention off the real question." },
        { q: "A study tests a medicine on 2 people; both recover. What is the problem?", options: ["The patients were too healthy", "Medicines never work", "Nothing", "Far too few cases, and no comparison group"], answer: "Far too few cases, and no comparison group", hint: "Would they have recovered anyway?", why: "Tiny samples without comparison cannot show the medicine works." },
        { q: "A survey of 4 pupils in a school of 600 is used to describe the whole school. What fraction of the school, as '1 in how many', was surveyed?", type: "number", answer: 150, hint: "600 ÷ 4.", why: "600 ÷ 4 = 150: only 1 pupil in 150 was asked, far too few, and not chosen at random." },

        { q: "'Since the school introduced chess club, math scores have risen. So chess raised math scores.' What would most help test this?", options: ["Asking the head teacher's opinion", "Comparing chess-club members with similar non-members over the same period", "Asking the chess club if they like chess", "Counting chessboards"], answer: "Comparing chess-club members with similar non-members over the same period", hint: "How do we separate cause from sequence?", why: "A comparison group shows whether the rise is connected to chess rather than to something else that changed." },
        { q: "'The Bible is God's word because it says so, and what it says is true because it is God's word.' A thoughtful believer would note that this argument, as stated, is:", options: ["A slippery slope", "Circular; reasons for trust must come from somewhere outside the claim itself", "Valid and sound by itself", "A red herring"], answer: "Circular; reasons for trust must come from somewhere outside the claim itself", hint: "Does the argument go round in a circle?", why: "Stated this way, it assumes what it seeks to prove. Believers and non-believers alike can see that a circular argument does not persuade anyone not already convinced; other reasons (history, witnesses, fulfilled words, experience) must carry the case." },

    { title: "The commonplace: against a vice", icon: "🔥", learn: [
        { say: "The <b>commonplace</b> (Greek koinos topos) is a speech that <b>amplifies</b> (enlarges and intensifies) the case against a wrongdoing that everyone already agrees is wrong, such as lying, theft or cruelty. It is aimed at the vice, or at a type of wrongdoer in general (Aphthonius' model is 'Against a tyrant', meaning any tyrant), never at a particular named person.", show: { type: "big", text: "Against LYING (and any liar),\nnever against a named person." } },
        { say: "Why argue against what everyone already condemns? Because people agree in general but excuse themselves in particular. The commonplace makes the wrong <b>vivid</b> so that listeners feel its weight and resolve to avoid it.", show: { type: "table", rows: [
              ["Agree in general", "'Lying is wrong.'"],
              ["Excuse in particular", "'But my little lie didn't hurt anyone.'"],
              ["Commonplace", "Shows how even small lies harm"]
            ] } },
        { say: "Aphthonius gave the commonplace a set of steps.", show: { type: "list", items: ["1. Introduction: why this matters", "2. Contrary: the virtue opposed to the vice (honesty)", "3. Exposition: how the vice works and grows", "4. Comparison: worse than something already condemned", "5. Intention: what the wrongdoer wants", "6. Digression: a look back at how such wrongdoers live", "7. Rejection of pity: why excuses fail", "8. Final heads: is it lawful? just? useful? possible? decent? what follows?"] } },
        { say: "Here is part of a commonplace against lying. Notice that every claim it makes is true and can be supported. Amplification may intensify feeling, but <b>it may never exaggerate the facts</b>.", show: { type: "passage", title: "Against lying (a commonplace)", text: "Every friendship, every market and every court depends on one thing: that words match the world. The liar breaks that bond.\n\nA lie never travels alone. To protect it, the liar must tell a second lie, and a third, until he lives in a house of cards that the smallest breath can topple.\n\nAnd when he is found out, he loses something harder to rebuild than any house: the trust of those who believed him. Even his true words are now doubted, like the boy who cried 'Wolf!'" } },
        { say: "The commonplace connects to Scripture's view of speech: 'Lying lips are an abomination to Yahweh, but those who do the truth are his delight' (Proverbs 12:22, WEB). Honesty is the virtue that every true rhetoric rests on.", show: { type: "big", text: "Honesty is the foundation\nof all true rhetoric." } },
        { say: "Two rules keep the commonplace just. Attack the <b>vice</b>, not a named person. And never invent harms; real consequences are strong enough. A commonplace that lies about lying defeats itself.", show: { type: "passage", title: "Just · 'Lies destroy trust, as the boy who cried wolf discovered.'", text: "Unjust: 'Every liar ends up in prison.' (false exaggeration)\n\nUnjust: 'People like Sam are liars.' (attacks a person)" } },
        { say: "<b>Explain it.</b> What is a commonplace, and why do we amplify the case against a vice that everyone already agrees is wrong? Explain the two rules that keep it just.", show: { type: "passage", title: "Explain it", text: "What is a commonplace, and why do we amplify the case against a vice that everyone already agrees is wrong? Explain the two rules that keep it just.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise terms from this lesson." } }
      ], practice: [
        { q: "A commonplace speech is aimed at:", options: ["A vice or wrongdoing in general", "A scientific fact", "A happy event", "A particular named person"], answer: "A vice or wrongdoing in general", hint: "Against lying, or against a liar?", why: "The commonplace attacks the vice, not individuals." },
        { q: "What does 'amplify' mean in rhetoric?", options: ["Make something louder with a microphone", "Contradict", "Shorten", "Enlarge and intensify the importance of something"], answer: "Enlarge and intensify the importance of something", hint: "Think of an amplifier, but for ideas.", why: "Amplification shows how serious a matter is, using true detail." },
        { q: "Why write a commonplace against a vice everyone already condemns?", options: ["People agree in general but excuse themselves in particular", "Because no one condemns it", "To fill time", "To attack enemies"], answer: "People agree in general but excuse themselves in particular", hint: "Do people ever make exceptions for themselves?", why: "The commonplace makes the general truth vivid enough to apply personally." },
        { q: "In a commonplace against lying, what is the 'contrary'?", options: ["Honesty", "Cleverness", "Stealing", "Silence"], answer: "Honesty", hint: "The virtue opposed to the vice.", why: "Honesty is the contrary of lying." },
        { q: "Which sentence BREAKS the rule against exaggeration?", options: ["'Liars lose the trust of those they deceive.'", "'One lie often requires another to protect it.'", "'Every person who tells a lie is caught by the police.'", "'Trust, once broken, is hard to rebuild.'"], answer: "'Every person who tells a lie is caught by the police.'", hint: "Which claim is false?", why: "Most lies are not police matters; inventing harms is itself dishonest." },
        { q: "Which sentence BREAKS the rule against attacking a person?", options: ["'Honesty builds trust.'", "'A liar must remember every lie.'", "'Lies corrode friendships.'", "'My neighbor Mr Brown is a liar, as everyone knows.'"], answer: "'My neighbor Mr Brown is a liar, as everyone knows.'", hint: "Which names a real individual?", why: "The commonplace condemns the vice, not a named person." },
        { q: "'A lie never travels alone.' What does this mean?", options: ["Lying is lonely", "One lie usually needs more lies to protect it", "Lies are told by groups", "Lies travel by post"], answer: "One lie usually needs more lies to protect it", hint: "What does the liar do when questioned?", why: "To keep a lie hidden, more lies are needed." },
        { q: "Which is the best 'comparison' step in a commonplace against theft?", options: ["'Theft happens at night.'", "'Thieves have hands.'", "'Theft is a crime.'", "'The thief is worse than the beggar, for the beggar asks while the thief takes.'"], answer: "'The thief is worse than the beggar, for the beggar asks while the thief takes.'", hint: "The comparison shows the vice is worse than something already disliked.", why: "Comparing to begging shows theft adds force and deceit to need." },
        { q: "Which is the 'rejection of pity' step?", options: ["'Honesty is a virtue.'", "'Let us all be honest.'", "'Some say he lied only to avoid trouble; but trouble avoided by deceit returns doubled.'", "'Lying is bad.'"], answer: "'Some say he lied only to avoid trouble; but trouble avoided by deceit returns doubled.'", hint: "This step answers excuses.", why: "It anticipates the excuse and shows why it fails." },
        { q: "Proverbs 12:22 (WEB) says 'Lying lips are an abomination to Yahweh, […]' What does 'abomination' mean?", options: ["Something deeply hated", "A song", "A small mistake", "A kind of plant"], answer: "Something deeply hated", hint: "It is the opposite of 'delight' in the same verse.", why: "An abomination is something regarded with intense loathing; the verse contrasts it with delight." },
        { q: "Order the first four steps of the commonplace.", type: "order", items: ["Contrary", "Introduction", "Exposition", "Comparison"], answer: ["Introduction", "Contrary", "Exposition", "Comparison"], hint: "Begin by saying why it matters; then set the virtue beside the vice.", why: "Introduction, contrary, exposition, comparison." },
        { q: "A commonplace against cruelty to animals would most powerfully use:", options: ["Insults about particular farmers", "Statistics you made up", "True, vivid examples of real harm and its effects", "Invented horror stories"], answer: "True, vivid examples of real harm and its effects", hint: "Truth is strong enough.", why: "Real examples amplify honestly; inventions destroy trust." },
        { q: "This week's virtue is honesty. Which example shows owning a mistake well?", options: ["'I broke it. I'm sorry. Let me help fix it.'", "'It was already broken.'", "'Someone else did it.'", "'It broke itself.'"], answer: "'I broke it. I'm sorry. Let me help fix it.'", hint: "Name it, understand it, repair it.", why: "Admitting, apologizing and repairing is honesty in action." },

        { q: "A commonplace against 'gossip' says: 'Gossip spreads faster than truth, and those it touches cannot answer, for they are absent.' What makes this effective?", options: ["It uses statistics", "It gives a true, specific harm and a reason it is unjust", "It names a gossip", "It is short"], answer: "It gives a true, specific harm and a reason it is unjust", hint: "What injustice does it identify?", why: "The absent cannot defend themselves; naming that true injustice amplifies honestly." },
        { q: "Which commonplace topic would be INAPPROPRIATE for the exercise?", options: ["'Against cruelty'", "'Against people who wear glasses'", "'Against laziness'", "'Against theft'"], answer: "'Against people who wear glasses'", hint: "Is wearing glasses a vice?", why: "The commonplace targets genuine wrongdoing; a neutral trait is not a vice, and attacking it is unjust." },

    { title: "Encomium: the speech of praise", icon: "🏅", learn: [
        { say: "An <b>encomium</b> is a speech of praise for a person, a virtue, a place or even a thing. Praise teaches: by showing what is admirable, it invites the audience to imitate it.", show: { type: "big", text: "Praise shows what is worth imitating." } },
        { say: "The classical encomium of a person follows a pattern. Deeds are the heart of it, because character is shown by choices.", show: { type: "passage", title: "Part · Content", text: "Introduction: Why this person deserves praise\n\nOrigin: Family, city, nation\n\nUpbringing: Education and early habits\n\nDeeds: Of mind (courage, wisdom), body (strength, endurance) and fortune (friends, position)\n\nComparison: Set beside another admired figure\n\nConclusion: Call to imitate" } },
        { say: "A virtue can be praised too. In Shakespeare's The Merchant of Venice, Portia praises mercy in a courtroom. Notice the images: rain falling freely, a double blessing, a crown.", show: { type: "passage", title: "Shakespeare, The Merchant of Venice, Act 4, Scene 1", text: "The quality of mercy is not strain’d, / It droppeth as the gentle rain from heaven / Upon the place beneath. It is twice blest, / It blesseth him that gives and him that takes. / ’Tis mightiest in the mightiest; it becomes / The throned monarch better than his crown." } },
        { say: "Portia's praise works through true observations. Mercy cannot be forced ('strain'd'); it blesses both giver and receiver; and it suits the powerful best, because only the powerful could choose to punish instead.", show: { type: "passage", title: "Line · Meaning", text: "not strain'd: not forced; freely given\n\ntwice blest: it benefits the giver and the receiver\n\nmightiest in the mightiest: most impressive when the strong choose it\n\nbecomes the throned monarch: suits a king better than his crown" } },
        { say: "Here is the truth rule applied to praise: an encomium must praise only what is <b>true</b>. Inflated praise is flattery, and it insults the subject by implying their real achievements were not enough. Choose real deeds; let them speak.", show: { type: "table", rows: [
              ["True praise", "'Nightingale's statistics showed that cleanliness saved many patients' lives.'"],
              ["Flattery", "'Nightingale was the greatest human who ever lived.'"]
            ] } },
        { say: "Praise of origin needs care. A person does not earn their birthplace or family; ancient writers praised them, but we rightly give most weight to what a person <b>chose</b> and <b>did</b>.", show: { type: "big", text: "Most praise for choices,\nleast for luck." } },
        { say: "<b>Explain it.</b> Describe the parts of an encomium, and explain why praise must be true and why deeds deserve more praise than birth. Use Portia's speech or Florence Nightingale as your example.", show: { type: "passage", title: "Explain it", text: "Describe the parts of an encomium, and explain why praise must be true and why deeds deserve more praise than birth. Use Portia's speech or Florence Nightingale as your example.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise terms from this lesson." } }
      ], practice: [
        { q: "What is an encomium?", options: ["A story with a moral", "A speech of blame", "A speech of praise", "A summary"], answer: "A speech of praise", hint: "Think of 'compliment'.", why: "An encomium praises a person, virtue, place or thing." },
        { q: "Which part of an encomium is its heart?", options: ["Origin", "Deeds", "Comparison", "Introduction"], answer: "Deeds", hint: "What shows character most clearly?", why: "Choices and actions reveal character, so deeds carry the most weight." },
        { q: "'The quality of mercy is not strain'd' means mercy:", options: ["Is only for kings", "Is weak", "Cannot be forced; it is freely given", "Is tired"], answer: "Cannot be forced; it is freely given", hint: "What does 'strained' mean when something is forced through?", why: "Mercy is not compelled; it falls freely, like rain." },
        { q: "Why is mercy 'twice blest'?", options: ["It happens twice", "Two kings gave it", "It blesses the one who gives it and the one who receives it", "It rains twice"], answer: "It blesses the one who gives it and the one who receives it", hint: "Read the next line.", why: "'It blesseth him that gives and him that takes.'" },
        { q: "Why is mercy 'mightiest in the mightiest'?", options: ["Mighty people are always merciful", "Only the powerful can choose to punish, so their mercy is most striking", "Mercy makes people strong", "Kings wear crowns"], answer: "Only the powerful can choose to punish, so their mercy is most striking", hint: "Who has the power to be merciless?", why: "Mercy means something when one could do otherwise; the powerful have most choice." },
        { q: "Which is true praise rather than flattery?", options: ["'She stayed with the sick through the night, every night, for months.'", "'No one has ever been as good.'", "'She was the best person in all history.'", "'She was perfect in every way.'"], answer: "'She stayed with the sick through the night, every night, for months.'", hint: "Which is specific and checkable?", why: "Specific, true deeds honor a person; vague superlatives flatter." },
        { q: "Why should deeds earn more praise than birthplace?", options: ["Deeds are longer", "Birthplaces are boring", "We choose our deeds, but not our birth", "Ancient writers said so"], answer: "We choose our deeds, but not our birth", hint: "Did anyone choose where they were born?", why: "Praise is most deserved for what a person chose and accomplished." },
        { q: "In an encomium of courage, which sentence is the best 'comparison' (setting it beside something else admired, to show it is greater)?", options: ["Courage has seven letters", "Strength is admired, but courage is greater: strength serves the body, while courage steadies the whole person in danger", "Courage was praised by many", "Courage is a word"], answer: "Strength is admired, but courage is greater: strength serves the body, while courage steadies the whole person in danger", hint: "The comparison step weighs the subject against something else that is admired.", why: "Showing that courage surpasses strength, itself admired, magnifies the praise." },
        { q: "Order the parts of an encomium of a person.", type: "order", items: ["Introduction", "Upbringing", "Comparison", "Deeds", "Conclusion", "Origin"], answer: ["Introduction", "Origin", "Upbringing", "Deeds", "Comparison", "Conclusion"], hint: "Life order: birth, growing up, adult deeds.", why: "Introduction, origin, upbringing, deeds, comparison, conclusion." },
        { q: "Which is a deed of MIND?", options: ["Being named after a city", "Being born in Florence", "Walking the wards at night", "Using statistics to prove that hospitals needed sanitation"], answer: "Using statistics to prove that hospitals needed sanitation", hint: "Which used intelligence?", why: "Statistical reasoning is a deed of the mind." },
        { q: "What should the conclusion of an encomium do?", options: ["Introduce a new person", "Call the audience to imitate the virtue praised", "Criticize the subject", "List the subject's faults"], answer: "Call the audience to imitate the virtue praised", hint: "Why do we praise at all?", why: "Praise ends by inviting imitation." },
        { q: "Which person deserves praise for courage?", options: ["A woman who hides from responsibility", "A man who shouts at a small child", "A boy who climbs a dangerous roof to show off", "A girl who tells the truth knowing she will be punished"], answer: "A girl who tells the truth knowing she will be punished", hint: "Courage serves the good, at real cost.", why: "True courage faces cost for the sake of what is right; recklessness for show is not the same." },

    { title: "Vituperation: condemning a vice", icon: "⚔️", learn: [
        { say: "<b>Vituperation</b> (Latin vituperare, 'to find fault') is the twin of encomium: a speech of blame (Aphthonius calls it psogos, 'invective'). Like encomium, it could target a person or a thing; his model attacks a real man, Philip of Macedon. In this course we practice it in its fairest form: condemning a <b>vice</b>, often personified (spoken of as if it were a person), rather than a real individual.", show: { type: "big", text: "Blame the vice:\nGreed, Envy, Cruelty" } },
        { say: "Why? Blame aimed at people easily becomes cruelty, and it rarely helps them change. Blame aimed at a vice helps everyone, including the speaker, to recognize and resist it.", show: { type: "table", rows: [
              ["Unjust", "'Jake is a greedy pig.'"],
              ["Just", "'Greed is a thief that steals from its own master.'"]
            ] } },
        { say: "Vituperation uses the encomium's headings in reverse. Here Greed is personified: its 'origin', its 'upbringing', its 'deeds'.", show: { type: "passage", title: "Heading · Against Greed", text: "Origin: Greed is born of fear that there will never be enough.\n\nUpbringing: It is fed by comparison, always measuring what others have.\n\nDeeds: It cost the farmer the goose that laid the golden eggs.\n\nComparison: It is worse than hunger, for hunger is satisfied by bread.\n\nConclusion: Starve it with gratitude and generosity." } },
        { say: "The Greek myth of King Midas, retold by the Roman poet Ovid, is an ancient story often used to condemn greed. Midas wished that all he touched would turn to gold, and then could not eat, for his bread became metal.", show: { type: "passage", title: "King Midas (retold from Ovid's Metamorphoses)", text: "Midas asked the god for a gift: that everything he touched might turn to gold. At first he delighted in golden twigs and stones.\n\nBut when he sat to eat, the bread hardened into gold against his teeth, and the wine flowed into his mouth as liquid metal. The richest man in the world was starving.\n\nHe begged for the gift to be taken away, and washed it off in a river." } },
        { say: "Even blaming a vice, you must stay <b>truthful</b> and <b>proportionate</b>: the blame must fit the wrong. Calling a small fault a monstrous crime is exaggeration, and a careful audience stops trusting you.", show: { type: "list", items: ["True: every harm named is real", "Proportionate: blame matches the size of the wrong", "Aimed at the vice, not a person", "Ends with the remedy: the opposing virtue"] } },
        { say: "Jesus taught that before correcting a speck in another's eye, we should remove the beam from our own (Matthew 7:3–5). A good vituperation is spoken first to oneself.", show: { type: "big", text: "Condemn the vice in yourself first." } },
        { say: "<b>Explain it.</b> What is vituperation, and why do we aim it at a vice rather than a person? Give two rules that keep it just, and one sentence of your own against Envy.", show: { type: "passage", title: "Explain it", text: "What is vituperation, and why do we aim it at a vice rather than a person? Give two rules that keep it just, and one sentence of your own against Envy.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise terms from this lesson." } }
      ], practice: [
        { q: "Vituperation is:", options: ["A speech of praise", "A comparison", "A speech of blame", "A summary"], answer: "A speech of blame", hint: "It is the twin of encomium.", why: "Vituperation finds fault; encomium praises." },
        { q: "In this course we aim vituperation at:", options: ["A classmate", "A vice, such as Greed or Envy", "A family member", "A teacher"], answer: "A vice, such as Greed or Envy", hint: "Blame the vice, not the person.", why: "Aiming at vices teaches without wounding people." },
        { q: "What does 'personified' mean?", options: ["Spoken of as if it were a person", "Very personal", "Forgotten", "Made into a photograph"], answer: "Spoken of as if it were a person", hint: "'Greed is a thief…'", why: "Personification gives a vice human qualities so we can 'blame' it vividly." },
        { q: "Which sentence is a just vituperation?", options: ["'Sarah is envious and horrible.'", "'Envy is a thief that steals our joy in our own gifts.'", "'People from that street are envious.'", "'All envious people should be punished.'"], answer: "'Envy is a thief that steals our joy in our own gifts.'", hint: "Which targets the vice?", why: "It condemns Envy itself and names a true harm." },
        { q: "In the Midas story, what does his golden bread show?", options: ["Gold is tasty", "Kings never eat", "Rivers are magical", "Greed can destroy the very things that make life good"], answer: "Greed can destroy the very things that make life good", hint: "Could he live on gold?", why: "Greed turned the necessities of life into useless metal." },
        { q: "Which is DISPROPORTIONATE blame?", options: ["'Forgetting to say thank you can hurt a giver's feelings.'", "'Ingratitude makes kindness harder to give.'", "'Forgetting to say thank you is the worst crime in history.'"], answer: "'Forgetting to say thank you is the worst crime in history.'", hint: "Does the blame fit the size of the wrong?", why: "A small fault called the worst crime is an exaggeration." },
        { q: "What should a vituperation end with?", options: ["More insults", "A joke about the audience", "The remedy: the opposing virtue", "A new vice"], answer: "The remedy: the opposing virtue", hint: "What should the audience do next?", why: "Ending with the virtue turns blame into help." },
        { q: "Which is the opposing virtue of Greed?", options: ["Speed", "Bravery", "Cleverness", "Generosity"], answer: "Generosity", hint: "What is the opposite of grasping?", why: "Generosity gives freely; greed grasps." },
        { q: "Which is the opposing virtue of Envy?", options: ["Anger", "Silence", "Pride", "Gratitude and goodwill"], answer: "Gratitude and goodwill", hint: "Envy resents others' good. What rejoices in it?", why: "Gratitude for one's own gifts and goodwill toward others' good." },
        { q: "What does Jesus' teaching about the speck and the beam suggest for vituperation?", options: ["Wear glasses", "Always blame others", "Examine and correct the vice in yourself first", "Never speak about vices"], answer: "Examine and correct the vice in yourself first", hint: "Whose eye has the beam?", why: "Self-examination first keeps blame humble and honest." },
        { q: "'Greed cost the farmer the goose that laid the golden eggs.' Which heading is this?", options: ["Upbringing", "Origin", "Conclusion", "Deeds"], answer: "Deeds", hint: "What did Greed DO?", why: "It is a 'deed' of the personified vice." },
        { q: "Order a short vituperation against Envy.", type: "order", items: ["Conclusion: answer it with gratitude", "Deeds: it turns friends into rivals", "Origin: Envy is born of comparison", "Comparison: it is worse than poverty, which at least can be relieved"], answer: ["Origin: Envy is born of comparison", "Deeds: it turns friends into rivals", "Comparison: it is worse than poverty, which at least can be relieved", "Conclusion: answer it with gratitude"], hint: "Origin, deeds, comparison, conclusion.", why: "The reversed encomium pattern." },
        { q: "Which word comes from Latin 'vituperare'?", options: ["Vituperation", "Vitamin", "Vital", "Virtue"], answer: "Vituperation", hint: "Look at the first letters carefully.", why: "Vituperation keeps the Latin root for finding fault." },

        { q: "A student writes, 'Laziness is the cause of every failure in the world.' What is the best criticism?", options: ["It is too kind to laziness", "It is disproportionate and false: failures have many causes", "It should name a lazy person", "It is perfect"], answer: "It is disproportionate and false: failures have many causes", hint: "Is 'every' true?", why: "Exaggeration weakens blame; honest vituperation is proportionate." },
        { q: "Why might condemning a vice in general be more persuasive to the person who has it than condemning them by name?", options: ["They can recognize themselves without feeling attacked, so they are freer to change", "They will not notice", "It is not more persuasive", "It is quieter"], answer: "They can recognize themselves without feeling attacked, so they are freer to change", hint: "When are people defensive?", why: "Personal attack provokes defense; general blame invites self-examination, as Nathan's parable of the rich man and the poor man's lamb did for King David (2 Samuel 12): David judged the wrong before he saw it was his own." },

    { title: "Syncrisis: the fair comparison", icon: "⚖️", learn: [
        { say: "<b>Syncrisis</b> (Greek, 'comparison') weighs two people or things against each other to judge which is better in some respect, or to show how they illuminate each other.", show: { type: "big", text: "Syncrisis = weighing two things\non the same scales" } },
        { say: "The master of syncrisis was Plutarch, whose Parallel Lives pairs a famous Greek with a famous Roman and, in many pairs, ends with a formal comparison. He paired <b>Demosthenes</b>, often judged the greatest Athenian orator, with <b>Cicero</b>, often judged the greatest Roman orator.", show: { type: "passage", title: "Demosthenes · Cicero", text: "City — Demosthenes: Athens; Cicero: Rome\n\nLived — Demosthenes: 384–322 BC; Cicero: 106–43 BC\n\nNatural gift — Demosthenes: Weak voice; trained hard; Cicero: Fluent from youth\n\nGreat opponent — Demosthenes: Philip of Macedon; Cicero: Mark Antony\n\nWritings that survive — Demosthenes: about sixty speeches; Cicero: speeches, letters and books on oratory" } },
        { say: "Cicero named his speeches against Antony the <b>Philippics</b>, after Demosthenes' speeches against Philip: a Roman deliberately comparing himself with a Greek three centuries earlier.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><circle cx='225' cy='180' r='125' fill='#2e86ab' fill-opacity='0.18' stroke='#2e86ab' stroke-width='3'/><circle cx='375' cy='180' r='125' fill='#e4572e' fill-opacity='0.18' stroke='#e4572e' stroke-width='3'/><text x='170' y='34' font-size='22' text-anchor='middle' fill='#222' font-weight='bold'>Demosthenes</text><text x='440' y='34' font-size='22' text-anchor='middle' fill='#222' font-weight='bold'>Cicero</text><text x='160' y='170' font-size='20' text-anchor='middle' fill='#222' >trained a</text><text x='160' y='195' font-size='20' text-anchor='middle' fill='#222' >weak voice</text><text x='300' y='160' font-size='19' text-anchor='middle' fill='#222' >orators;</text><text x='300' y='184' font-size='19' text-anchor='middle' fill='#222' >opposed</text><text x='300' y='208' font-size='19' text-anchor='middle' fill='#222' >a ruler</text><text x='442' y='170' font-size='20' text-anchor='middle' fill='#222' >philosopher</text><text x='442' y='195' font-size='20' text-anchor='middle' fill='#222' >and writer</text></svg>" } },
        { say: "A fair syncrisis follows three rules. Use the <b>same criteria</b> for both. Give <b>evidence</b> for each judgement. And judge each <b>in context</b>: what each faced, not just what each achieved.", show: { type: "list", items: ["Same criteria for both", "Evidence for every judgement", "Judge in context: what each faced", "Admit where they are equal"] } },
        { say: "Plutarch judges that Demosthenes put all his skill into oratory, while Cicero had wider learning; but he criticizes Cicero for excessive <b>self-praise</b>, a flaw Demosthenes avoided. Notice that a comparison can honor both and still reach a judgement.", show: { type: "passage", title: "Criterion · Judgement (after Plutarch)", text: "Range of learning: Cicero wider\n\nConcentration on oratory: Demosthenes deeper\n\nModesty: Demosthenes; Cicero praised himself too much\n\nLegacy: Cicero's books on oratory teach widely; Demosthenes' speeches remain the model of force" } },
        { say: "Syncrisis is everywhere in thinking: comparing two plans, two explanations, two books. Make a table, choose the criteria first, then fill it with evidence. The conclusion should follow from the table, not from which one you liked before you began.", show: { type: "table", rows: [
              ["Criterion", "Plan A", "Plan B"],
              ["Cost", "", ""],
              ["Time", "", ""],
              ["Safety", "", ""],
              ["Verdict", "follows from the evidence", ""]
            ] } },
        { say: "<b>Explain it.</b> What is syncrisis? Explain the three rules of a fair comparison, and compare Demosthenes and Cicero on two criteria with evidence.", show: { type: "passage", title: "Explain it", text: "What is syncrisis? Explain the three rules of a fair comparison, and compare Demosthenes and Cicero on two criteria with evidence.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise terms from this lesson." } }
      ], practice: [
        { q: "What does 'syncrisis' mean?", options: ["Praise", "Comparison", "Blame", "Description"], answer: "Comparison", hint: "Plutarch's Parallel Lives use it.", why: "Syncrisis is the rhetorical comparison of two subjects." },
        { q: "Who wrote the Parallel Lives?", options: ["Plutarch", "Cicero", "Aesop", "Shakespeare"], answer: "Plutarch", hint: "A Greek writer under the Roman Empire.", why: "Plutarch paired Greek and Roman lives and compared them." },
        { q: "Why did Cicero call his speeches against Antony the 'Philippics'?", options: ["To compare himself with Demosthenes, who spoke against Philip", "Because they were about horses", "Because Antony's name was Philip", "By accident"], answer: "To compare himself with Demosthenes, who spoke against Philip", hint: "Who first gave speeches against Philip?", why: "Demosthenes' speeches against Philip of Macedon were the Philippics; Cicero borrowed the name." },
        { q: "Which is the FIRST rule of fair comparison?", options: ["Describe only one", "Use different criteria for each", "Decide the winner first", "Use the same criteria for both"], answer: "Use the same criteria for both", hint: "Can you compare a runner's speed with a swimmer's kindness?", why: "Only shared criteria allow a fair weighing." },
        { q: "Which comparison is UNFAIR?", options: ["Judging one musician by her best concert and the other by his worst", "Judging both by their best concerts", "Judging both over a whole career", "Judging both on technique and expression"], answer: "Judging one musician by her best concert and the other by his worst", hint: "Is the same standard used?", why: "Comparing best with worst is biased." },
        { q: "Demosthenes was born with a weak voice; Cicero was fluent from youth. What does 'judge in context' mean here?", options: ["Cicero must be better", "Weigh what each had to overcome, not only what each achieved", "Voices don't matter", "Neither achieved anything"], answer: "Weigh what each had to overcome, not only what each achieved", hint: "Consider what each had to overcome.", why: "Context weighs the obstacles each faced: Demosthenes' success cost him a harder struggle against his natural weakness." },
        { q: "What fault did Plutarch find in Cicero?", options: ["Excessive self-praise", "A weak voice", "Laziness", "Cowardice"], answer: "Excessive self-praise", hint: "Look at the table.", why: "Plutarch criticized Cicero's boasting." },
        { q: "Order the steps of a fair syncrisis.", type: "order", items: ["Choose the criteria", "Draw a conclusion from the table", "Gather evidence for each subject", "Judge each criterion"], answer: ["Choose the criteria", "Gather evidence for each subject", "Judge each criterion", "Draw a conclusion from the table"], hint: "Criteria must come before judgements.", why: "Criteria, evidence, judgements, then the conclusion that follows." },
        { q: "Demosthenes was born in 384 BC and Cicero in 106 BC. How many years apart were they born?", type: "number", answer: 278, hint: "Both are BC; subtract.", why: "384 − 106 = 278 years." },
        { q: "Cicero lived from 106 BC to 43 BC. About how many years did he live?", type: "number", answer: 63, hint: "Counting down in BC: subtract.", why: "106 − 43 = 63 years." },
        { q: "Which criterion is MOST relevant for comparing two bridges' designs?", options: ["Day they opened", "Load they can safely carry", "Name of the designer", "Color of the paint"], answer: "Load they can safely carry", hint: "Which bears on what bridges are for?", why: "Criteria must fit the purpose of the things compared." },
        { q: "A student compares two books and concludes, 'Book A is better because I liked it more.' What is missing?", options: ["Criteria and evidence", "Nothing", "A title", "A longer sentence"], answer: "Criteria and evidence", hint: "Is 'I liked it more' a reason for others?", why: "Preference reports taste; a syncrisis needs shared criteria and evidence." },
        { q: "Which is a fair conclusion of a syncrisis?", options: ["'Demosthenes was perfect.'", "'Cicero was useless.'", "'Both opposed powerful men at great risk; Demosthenes worked harder against nature, and Cicero ranged more widely in learning.'", "'They were exactly identical.'"], answer: "'Both opposed powerful men at great risk; Demosthenes worked harder against nature, and Cicero ranged more widely in learning.'", hint: "Which balances honest judgements?", why: "Fair syncrisis honors both and judges each criterion." },

    { title: "Building a speech: hook, three, close", icon: "🧭", learn: [
        { say: "Listeners cannot reread a speech, so its structure must be audible. A short speech has a simple frame: an <b>opening</b> that wins attention and states the point, a <b>body</b> of three points, and a <b>close</b> that sums up and calls to action.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0L10 5L0 10z' fill='#333'/></marker></defs><rect x='180' y='10' width='240' height='54' rx='12' fill='#ffe6a6' stroke='#333' stroke-width='2'/><text x='300' y='44' font-size='20' text-anchor='middle' fill='#222' font-weight='bold'>Opening: hook + preview</text><line x1='300' y1='66' x2='300' y2='86' stroke='#333' stroke-width='3' marker-end='url(#a)'/><rect x='30' y='90' width='170' height='60' rx='12' fill='#cdebd3' stroke='#333' stroke-width='2'/><text x='115' y='127' font-size='22' text-anchor='middle' fill='#222' font-weight='bold'>Point 1</text><rect x='215' y='90' width='170' height='60' rx='12' fill='#cdebd3' stroke='#333' stroke-width='2'/><text x='300' y='127' font-size='22' text-anchor='middle' fill='#222' font-weight='bold'>Point 2</text><rect x='400' y='90' width='170' height='60' rx='12' fill='#cdebd3' stroke='#333' stroke-width='2'/><text x='485' y='127' font-size='22' text-anchor='middle' fill='#222' font-weight='bold'>Point 3</text><line x1='300' y1='152' x2='300' y2='182' stroke='#333' stroke-width='3' marker-end='url(#a)'/><rect x='180' y='186' width='240' height='54' rx='12' fill='#f6d0c8' stroke='#333' stroke-width='2'/><text x='300' y='220' font-size='20' text-anchor='middle' fill='#222' font-weight='bold'>Close: sum up + act</text><text x='300' y='290' font-size='20' text-anchor='middle' fill='#222' font-weight='bold'>Tell them · Tell them · Tell them again</text></svg>" } },
        { say: "The <b>hook</b> is your first sentence. It must be true and relevant. Good hooks include a question, a short true story, a surprising fact, or a quotation.", show: { type: "passage", title: "Hook type · Example", text: "Question: 'Have you ever wondered why the sea is salty?'\n\nStory: 'Last spring, our street flooded twice in one week.'\n\nSurprising fact: 'Your body contains enough iron to make a small nail.'\n\nQuotation: '…brevity is the soul of wit…', says Polonius, a famously long-winded character in Hamlet." } },
        { say: "Then the <b>preview</b> (or thesis statement) tells the audience your claim and your map: 'I will give you three reasons we should plant trees.' Now they know where you are going.", show: { type: "big", text: "Claim + map:\n'Three reasons we should plant trees.'" } },
        { say: "Why three points? Three is enough to show a pattern and few enough to remember. Order them deliberately: often the strongest <b>last</b>, so the speech builds; or chronologically; or from problem to solution.", show: { type: "list", items: ["Strongest last (climax)", "Chronological (first, then, finally)", "Problem → cause → solution", "Near → far, small → large"] } },
        { say: "<b>Signposts</b> tell listeners where they are: 'First…', 'Second…', 'Finally…', 'So…'. <b>Transitions</b> link points: 'Cool streets are pleasant, but trees do more than cool us.'", show: { type: "table", rows: [
              ["Signposts", "First · Second · Third · Finally · In conclusion"],
              ["Transitions", "Not only… but also · Even more important · For this reason"]
            ] } },
        { say: "The <b>close</b> sums up the three points in one sentence and ends with a call to action or a return to the hook. Never introduce a new point in the close.", show: { type: "passage", title: "A close that returns to the hook", text: "So: roots that drink the rain, shade that cools our summers, and branches that shelter birds. Last spring our street flooded twice. Let us plant ten trees this autumn, and let next spring be different." } },
        { say: "<b>Explain it.</b> Describe the structure of a short speech and explain why signposts matter more in speaking than in writing. Give an example of a hook, a preview and a close for a topic of your own.", show: { type: "passage", title: "Explain it", text: "Describe the structure of a short speech and explain why signposts matter more in speaking than in writing. Give an example of a hook, a preview and a close for a topic of your own.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise terms from this lesson." } }
      ], practice: [
        { q: "What is the job of the hook?", options: ["To win attention with something true and relevant", "To end the speech", "To list all the points", "To thank the audience"], answer: "To win attention with something true and relevant", hint: "It is the first sentence.", why: "The hook draws the audience in." },
        { q: "What does the preview do?", options: ["Tells a joke", "Ends the speech", "States the claim and the map of the speech", "Gives every detail"], answer: "States the claim and the map of the speech", hint: "Where are we going?", why: "The preview tells listeners what to expect." },
        { q: "Why are signposts more important in a speech than in an essay?", options: ["Speeches are longer", "Essays have no structure", "Listeners cannot look back or see paragraphs", "Signposts are louder"], answer: "Listeners cannot look back or see paragraphs", hint: "Can a listener reread?", why: "A listener depends on spoken cues for structure." },
        { q: "Which is a signpost?", options: ["'Beautiful'", "'Trees'", "'Rain'", "'Second,'"], answer: "'Second,'", hint: "Which word tells you where you are?", why: "'Second' marks the next point." },
        { q: "Which is the best close?", options: ["'Also, trees are tall, which I forgot to say.'", "'Any questions? No? OK.'", "'So: water, shade and shelter. Let us plant ten trees this autumn.'", "'That's it, I guess.'"], answer: "'So: water, shade and shelter. Let us plant ten trees this autumn.'", hint: "A close sums up and calls to action.", why: "It summarizes the three points and ends with a clear action. Introducing a new point at the end confuses." },
        { q: "Which hook is best for a speech on honesty?", options: ["'Today I will talk about honesty.'", "'Honesty is a word.'", "'A boy once cried \"Wolf!\" for fun; when the wolf truly came, no one believed him.'", "'Um, hello.'"], answer: "'A boy once cried \"Wolf!\" for fun; when the wolf truly came, no one believed him.'", hint: "Which is vivid, true to its source, and relevant?", why: "A well-known fable makes an immediate, relevant hook." },
        { q: "Why put the strongest point last?", options: ["To hide it", "It doesn't matter", "The speech builds to a climax, and the last point is remembered best", "Because it is longest"], answer: "The speech builds to a climax, and the last point is remembered best", hint: "Which point is freshest in memory when you finish?", why: "Recency and climax make the final point most memorable." },
        { q: "A hook says, 'Scientists say 99% of children hate vegetables!' with no source. What is wrong?", options: ["The hook must be true; an invented statistic breaks the truth rule", "It is too short", "Nothing", "It has a number"], answer: "The hook must be true; an invented statistic breaks the truth rule", hint: "Is the statistic real?", why: "Hooks must be true; inventing facts destroys trust." },
        { q: "Order the parts of a short speech.", type: "order", items: ["Second point", "First point", "Third point", "Close", "Preview", "Hook"], answer: ["Hook", "Preview", "First point", "Second point", "Third point", "Close"], hint: "Win attention, give the map, follow it, end.", why: "Hook, preview, three points, close." },
        { q: "A 3-minute speech: 30 seconds for the opening, 30 seconds for the close, and the rest shared equally by three points. How many seconds per point?", type: "number", answer: 40, hint: "180 seconds total; subtract the opening and close.", why: "180 − 30 − 30 = 120; 120 ÷ 3 = 40 seconds per point." },
        { q: "At 130 words per minute, how many words is a 40-second point? (Round to the nearest whole number.)", type: "number", answer: 87, hint: "130 words per 60 seconds.", why: "130 × 40 ÷ 60 ≈ 86.7, so about 87 words." },
        { q: "Which is a transition (not just a signpost)?", options: ["'Second.'", "'First.'", "'Cool streets are pleasant, but trees do even more: they shelter life.'", "'Finally.'"], answer: "'Cool streets are pleasant, but trees do even more: they shelter life.'", hint: "A transition links one idea to the next.", why: "It connects the previous point to the next, showing the relation." },
        { q: "Which order suits a speech explaining how bread is made?", options: ["Chronological", "Alphabetical", "Random", "Strongest last"], answer: "Chronological", hint: "Is it a process?", why: "A process is clearest step by step, in time order." },
