<script>// Math: Year 1 Advanced — 32 weekly lessons. Generated from scratch parts: MG holds the question generators.
const MG = (() => {
// Helpers available to the part files (evaluated by build.js). Output is plain data + SVG strings.
const INK = "#1f2937", BLUE = "#2563eb", ORANGE = "#ea580c", GREEN = "#16a34a", LB = "#dbeafe", LO = "#fed7aa", LG = "#dcfce7", GRAY = "#6b7280", PURPLE = "#7c3aed";
const W = (body) => `<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'>${body}</svg>`;
const T = (x, y, s, size = 24, fill = INK, anchor = "middle", weight = 700) =>
  `<text x='${x}' y='${y}' font-size='${size}' fill='${fill}' text-anchor='${anchor}' font-weight='${weight}'>${String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")}</text>`;
const r1 = (n) => Math.round(n * 10) / 10;

const S = (say, show) => ({ say, show });
const cap = (o, caption) => (caption ? { ...o, caption } : o);
const big = (text, caption) => cap({ type: "big", text }, caption);
const emo = (text, caption) => cap({ type: "emoji", text }, caption);
const tbl = (rows, caption, header) => cap(header === false ? { type: "table", rows, header: false } : { type: "table", rows }, caption);
const list = (items, caption) => cap({ type: "list", items }, caption);
const bars = (values, caption) => cap({ type: "bars", values }, caption);
// SVG captions are drawn inside the picture (extra 40px band) so they never get pushed off the stage.
const svg = (markup, caption) => ({ type: "svg", markup: caption ? markup.replace("viewBox='0 0 600 320'", "viewBox='0 0 600 360'").replace(/<\/svg>$/, T(300, 348, caption, caption.length > 40 ? 18 : 21, GRAY, "middle", 700) + "</svg>") : markup });
const passage = (title, text) => ({ type: "passage", title, text });
// The closing "Explain it" slide every lesson ends its Learn section with.
const X = (prompt) => S(`<b>Explain it.</b> ${prompt}`, list(["Say it in 2–4 complete sentences.", "Use the precise words from this lesson.", "Give one example of your own."], "Explain it — to a grown-up or in writing"));
const add = (o, show) => (show ? { ...o, show } : o);
const N = (q, answer, hint, why, show) => add({ q, type: "number", answer, hint, why }, show);
const C = (q, options, answer, hint, why, show) => add({ q, options, answer, hint, why }, show);
const scramble = (a) => { const r = a.slice().reverse(); return r.slice(1).concat(r[0]); };
const O = (q, answer, hint, why, show) => add({ q, type: "order", items: scramble(answer), answer, hint, why }, show);

// Number line: jumps equal steps from min to max. opts: labels "ends" | "all" | array of tick indexes; mark (value, arrow "?"); point (value, dot); arcs [[a,b,text]].
function nl(min, max, jumps, o = {}) {
  const x0 = 50, x1 = 550, y = 190, step = (max - min) / jumps;
  const X = (v) => r1(x0 + ((v - min) / (max - min)) * (x1 - x0));
  let b = `<line x1='${x0 - 20}' y1='${y}' x2='${x1 + 20}' y2='${y}' stroke='${INK}' stroke-width='4'/>`;
  const lab = o.labels || "all";
  for (let i = 0; i <= jumps; i++) {
    const v = min + i * step, x = X(v);
    b += `<line x1='${x}' y1='${y - 14}' x2='${x}' y2='${y + 14}' stroke='${INK}' stroke-width='3'/>`;
    const show = lab === "all" || (lab === "ends" && (i === 0 || i === jumps)) || (Array.isArray(lab) && lab.includes(i));
    if (show) b += T(x, y + 44, o.fmt ? o.fmt(v) : String(v).replace("-", "−"), o.size || 22);
  }
  for (const [a, c, t] of o.arcs || []) {
    const xa = X(a), xc = X(c), h = Math.max(36, Math.min(90, Math.abs(xc - xa) * 0.5));
    b += `<path d='M${xa} ${y - 8} Q${r1((xa + xc) / 2)} ${y - 8 - h * 2} ${xc} ${y - 8}' fill='none' stroke='${ORANGE}' stroke-width='3'/>` + T(r1((xa + xc) / 2), y - 8 - h - 10, t, 22, ORANGE);
  }
  if (o.mark !== undefined) { const x = X(o.mark); b += `<path d='M${x - 14} ${y - 60} L${x + 14} ${y - 60} L${x} ${y - 24} Z' fill='${ORANGE}'/>` + T(x, y - 72, o.markText || "?", 30, ORANGE); }
  if (o.point !== undefined) { const x = X(o.point); b += `<circle cx='${x}' cy='${y}' r='11' fill='${BLUE}'/>` + T(x, y - 30, o.pointText ?? String(o.point), 26, BLUE); }
  if (o.title) b += T(300, 40, o.title, 24);
  return W(b);
}

// Balance scale with text in each pan.
function balance(left, right, note) {
  let b = `<path d='M300 170 L270 290 L330 290 Z' fill='${GRAY}'/><rect x='240' y='286' width='120' height='12' rx='4' fill='${GRAY}'/>`;
  b += `<line x1='90' y1='170' x2='510' y2='170' stroke='${INK}' stroke-width='8' stroke-linecap='round'/>`;
  for (const [x, t] of [[150, left], [450, right]]) {
    b += `<line x1='${x}' y1='170' x2='${x - 70}' y2='120' stroke='${GRAY}' stroke-width='2'/><line x1='${x}' y1='170' x2='${x + 70}' y2='120' stroke='${GRAY}' stroke-width='2'/>`;
    b += `<rect x='${x - 115}' y='60' width='230' height='62' rx='14' fill='${LB}' stroke='${BLUE}' stroke-width='3'/>` + T(x, 102, t, t.length > 12 ? 24 : 30, INK);
  }
  b += T(300, 140, "=", 40, GREEN);
  if (note) b += T(300, 40, note, 22, GRAY);
  return W(b);
}

// Column arithmetic: rows right-aligned, op on the last row, a rule, the result, optional carries row.
function column(rows, result, op = "+", carries = "") {
  const right = 430, fs = 46, lh = 56;
  let y = carries ? 74 : 60, b = "";
  const cw = fs * 0.6;
  if (carries) [...carries].forEach((ch, i) => { if (ch !== " ") b += `<text x='${r1(right - (carries.length - 1 - i) * cw - cw / 2)}' y='46' font-size='28' fill='${ORANGE}' text-anchor='middle' font-family='monospace' font-weight='700'>${ch}</text>`; });
  rows.forEach((r, i) => {
    y += lh;
    b += `<text x='${right}' y='${y - lh + 50}' font-size='${fs}' fill='${INK}' text-anchor='end' font-family='monospace' font-weight='700'>${r}</text>`;
    if (i === rows.length - 1) b += T(right - 300, y - lh + 50, op, fs, BLUE);
  });
  const ly = y + 6;
  b += `<line x1='${right - 310}' y1='${ly}' x2='${right + 10}' y2='${ly}' stroke='${INK}' stroke-width='4'/>`;
  b += `<text x='${right}' y='${ly + 54}' font-size='${fs}' fill='${GREEN}' text-anchor='end' font-family='monospace' font-weight='800'>${result}</text>`;
  return W(b);
}

// Dot array rows x cols.
function dots(rows, cols, label) {
  const gap = Math.min(52, 440 / cols, 230 / rows), w = gap * (cols - 1), h = gap * (rows - 1);
  const ox = 300 - w / 2, oy = 160 - h / 2 + (label ? 14 : 0);
  let b = "";
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) b += `<circle cx='${r1(ox + c * gap)}' cy='${r1(oy + r * gap)}' r='${r1(gap * 0.32)}' fill='${r % 2 ? ORANGE : BLUE}'/>`;
  if (label) b += T(300, 36, label, 26);
  return W(b);
}

// Area model: height label a, parts [[len, topLabel, insideLabel], ...].
function areaModel(a, parts) {
  const tot = parts.reduce((s, p) => s + p[0], 0), ws = 440 / tot, x0 = 110, y0 = 70, h = 170;
  let x = x0, b = T(x0 - 26, y0 + h / 2 + 10, a, 30, ORANGE);
  const fills = [LB, LO, LG];
  parts.forEach(([len, top, inside], i) => {
    const w = len * ws;
    b += `<rect x='${r1(x)}' y='${y0}' width='${r1(w)}' height='${h}' fill='${fills[i % 3]}' stroke='${INK}' stroke-width='3'/>`;
    b += T(r1(x + w / 2), y0 - 14, top, 28, BLUE) + T(r1(x + w / 2), y0 + h / 2 + 10, inside, w < 120 ? 22 : 28);
    x += w;
  });
  return W(b);
}

// Rectangle with side labels, optional unit grid (cols x rows), optional diagonal (right triangle).
function rect(wl, hl, o = {}) {
  const cols = o.cols || 0, rows = o.rows || 0;
  const unit = cols ? Math.min(400 / cols, 220 / rows) : 0;
  const w = cols ? cols * unit : o.w || 360, h = rows ? rows * unit : o.h || 180;
  const x0 = r1(300 - w / 2), y0 = r1(175 - h / 2);
  let b = `<rect x='${x0}' y='${y0}' width='${r1(w)}' height='${r1(h)}' fill='${o.fill || LB}' stroke='${BLUE}' stroke-width='4'/>`;
  if (cols) {
    for (let i = 1; i < cols; i++) b += `<line x1='${r1(x0 + i * unit)}' y1='${y0}' x2='${r1(x0 + i * unit)}' y2='${r1(y0 + h)}' stroke='${BLUE}' stroke-width='1.5'/>`;
    for (let j = 1; j < rows; j++) b += `<line x1='${x0}' y1='${r1(y0 + j * unit)}' x2='${r1(x0 + w)}' y2='${r1(y0 + j * unit)}' stroke='${BLUE}' stroke-width='1.5'/>`;
  }
  if (o.diag) b += `<path d='M${x0} ${y0} L${r1(x0 + w)} ${y0} L${x0} ${r1(y0 + h)} Z' fill='${LO}' stroke='${ORANGE}' stroke-width='4'/>`;
  b += T(300, y0 - 14, wl, 26, ORANGE) + T(r1(x0 + w + 14), 175 + 9, hl, 26, ORANGE, "start");
  if (o.inside) b += T(300, 185, o.inside, 28);
  return W(b);
}

// Bar model rows: [label, units, colour "b"|"o"|"g", text per unit]; o.total adds a brace with text.
function barModel(rows, o = {}) {
  const u = o.unit || 90, x0 = 130;
  let b = "", y = o.top || 60;
  for (const [label, n, col, txt] of rows) {
    b += T(x0 - 14, y + 40, label, 24, INK, "end");
    for (let i = 0; i < n; i++) b += `<rect x='${x0 + i * u}' y='${y}' width='${u}' height='56' fill='${col === "o" ? LO : col === "g" ? LG : LB}' stroke='${INK}' stroke-width='3'/>` + (txt ? T(x0 + i * u + u / 2, y + 37, txt, 22) : "");
    y += 80;
  }
  if (o.total) {
    const max = Math.max(...rows.map((r) => r[1]));
    const xr = x0 + max * u + 16;
    b += `<path d='M${xr} ${(o.top || 60)} q14 0 14 14 V${y - 40} q0 14 -14 14' fill='none' stroke='${ORANGE}' stroke-width='3'/>`;
    b += T(xr + 24, ((o.top || 60) + y - 24) / 2 + 8, o.total, 26, ORANGE, "start");
  }
  if (o.title) b += T(300, 32, o.title, 22, GRAY);
  return W(b);
}

// Fraction strips for denominators, `shade` pieces shaded (number or array per strip).
function strips(denoms, shade = 1) {
  const x0 = 110, w = 440, h = Math.min(56, 260 / denoms.length - 8);
  let b = "", y = 20;
  denoms.forEach((d, k) => {
    const pw = w / d, sh = Array.isArray(shade) ? shade[k] : shade;
    for (let i = 0; i < d; i++) b += `<rect x='${r1(x0 + i * pw)}' y='${y}' width='${r1(pw)}' height='${r1(h)}' fill='${i < sh ? LO : "#fff"}' stroke='${INK}' stroke-width='2.5'/>`;
    b += T(x0 - 16, r1(y + h / 2 + 9), `${sh}/${d}`, 24, ORANGE, "end");
    y += h + 10;
  });
  return W(b);
}

// Analog clock.
function clock(h, m) {
  const cx = 300, cy = 160, R = 140;
  let b = `<circle cx='${cx}' cy='${cy}' r='${R}' fill='#fff' stroke='${INK}' stroke-width='6'/>`;
  for (let i = 1; i <= 12; i++) {
    const a = (i / 12) * 2 * Math.PI;
    b += T(r1(cx + Math.sin(a) * (R - 30)), r1(cy - Math.cos(a) * (R - 30) + 9), i, 26);
  }
  for (let i = 0; i < 60; i += 5) {
    const a = (i / 60) * 2 * Math.PI;
    b += `<line x1='${r1(cx + Math.sin(a) * (R - 14))}' y1='${r1(cy - Math.cos(a) * (R - 14))}' x2='${r1(cx + Math.sin(a) * (R - 3))}' y2='${r1(cy - Math.cos(a) * (R - 3))}' stroke='${INK}' stroke-width='3'/>`;
  }
  const ha = (((h % 12) + m / 60) / 12) * 2 * Math.PI, ma = (m / 60) * 2 * Math.PI;
  b += `<line x1='${cx}' y1='${cy}' x2='${r1(cx + Math.sin(ha) * 70)}' y2='${r1(cy - Math.cos(ha) * 70)}' stroke='${INK}' stroke-width='10' stroke-linecap='round'/>`;
  b += `<line x1='${cx}' y1='${cy}' x2='${r1(cx + Math.sin(ma) * 112)}' y2='${r1(cy - Math.cos(ma) * 112)}' stroke='${BLUE}' stroke-width='6' stroke-linecap='round'/><circle cx='${cx}' cy='${cy}' r='9' fill='${INK}'/>`;
  return W(b);
}

// Centimetre ruler 0-10 cm with mm ticks and a pencil `mm` long.
function ruler(mm) {
  const x0 = 50, pxmm = 5;
  let b = `<rect x='30' y='170' width='540' height='90' rx='6' fill='#fef9c3' stroke='${INK}' stroke-width='3'/>`;
  let minor = "", major = "";
  for (let i = 0; i <= 100; i++) { const x = x0 + i * pxmm, l = i % 10 ? (i % 5 ? 14 : 22) : 34; if (i % 10) minor += `M${x} 170v${l}`; else { major += `M${x} 170v${l}`; b += T(x, 236, i / 10, 22); } }
  b += `<path d='${minor}' stroke='${INK}' stroke-width='1.2'/><path d='${major}' stroke='${INK}' stroke-width='2.5'/>`;
  b += T(540, 254, "cm", 18, GRAY);
  const pe = x0 + mm * pxmm;
  b += `<rect x='${x0}' y='112' width='${pe - x0 - 34}' height='34' fill='#facc15' stroke='${INK}' stroke-width='3'/><path d='M${pe - 34} 112 L${pe} 129 L${pe - 34} 146 Z' fill='#fde68a' stroke='${INK}' stroke-width='3'/>`;
  b += `<line x1='${pe}' y1='146' x2='${pe}' y2='176' stroke='${ORANGE}' stroke-width='2' stroke-dasharray='4 3'/>`;
  return W(b);
}

// Square grid n x n (o.streets marks start/end corners).
function grid(n, o = {}) {
  const s = Math.min(240 / n, 70), w = s * n, x0 = r1(300 - w / 2), y0 = r1(160 - w / 2);
  let b = "";
  for (let i = 0; i <= n; i++) b += `<line x1='${r1(x0 + i * s)}' y1='${y0}' x2='${r1(x0 + i * s)}' y2='${r1(y0 + w)}' stroke='${INK}' stroke-width='${o.streets ? 5 : 3}'/><line x1='${x0}' y1='${r1(y0 + i * s)}' x2='${r1(x0 + w)}' y2='${r1(y0 + i * s)}' stroke='${INK}' stroke-width='${o.streets ? 5 : 3}'/>`;
  if (o.streets) b += `<circle cx='${x0}' cy='${r1(y0 + w)}' r='12' fill='${GREEN}'/><circle cx='${r1(x0 + w)}' cy='${y0}' r='12' fill='${ORANGE}'/>` + T(x0 - 20, r1(y0 + w + 8), "Start", 22, GREEN, "end") + T(r1(x0 + w + 20), y0 + 8, "End", 22, ORANGE, "start");
  return W(b);
}

// Boxes joined by arrows; `back` adds reverse arrows with inverse operations.
function flow(boxes, ops, back) {
  const n = boxes.length, bw = 90, gap = (560 - n * bw) / (n - 1);
  let b = `<defs><marker id='a' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto'><path d='M0 0 L8 4 L0 8 Z' fill='${BLUE}'/></marker><marker id='b' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto'><path d='M0 0 L8 4 L0 8 Z' fill='${ORANGE}'/></marker></defs>`;
  boxes.forEach((t, i) => {
    const x = 20 + i * (bw + gap);
    b += `<rect x='${r1(x)}' y='120' width='${bw}' height='70' rx='12' fill='${i === 0 ? LO : LB}' stroke='${INK}' stroke-width='3'/>` + T(r1(x + bw / 2), 166, t, 30);
    if (i < n - 1) {
      const xa = x + bw + 4, xb = x + bw + gap - 6;
      b += `<line x1='${r1(xa)}' y1='138' x2='${r1(xb)}' y2='138' stroke='${BLUE}' stroke-width='3' marker-end='url(#a)'/>` + T(r1((xa + xb) / 2), 108, ops[i], 24, BLUE);
      if (back) b += `<line x1='${r1(xb)}' y1='174' x2='${r1(xa)}' y2='174' stroke='${ORANGE}' stroke-width='3' marker-end='url(#b)'/>` + T(r1((xa + xb) / 2), 222, back[i], 24, ORANGE);
    }
  });
  return W(b);
}

// Question generators (shipped inside the data file as MG). Every generator returns a normal question plus
// `fam` (family) and `v` (the raw case) so the build check can recompute the answer independently.
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const P = (arr) => arr[Math.floor(Math.random() * arr.length)];
const SH = (arr) => { const o = arr.slice(); for (let i = o.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; } return o; };
const f = (n) => (n < 0 ? "−" : "") + Math.abs(n).toLocaleString("en-US");
const G = (a, b) => (b ? G(b, a % b) : Math.abs(a));
const SUP = (n) => String(n).split("").map((c) => "⁰¹²³⁴⁵⁶⁷⁸⁹"[+c]).join("");
const fr = (a, b) => { const g = G(a, b); return b / g === 1 ? String(a / g) : `${a / g}/${b / g}`; };
const NQ = (fam, v, q, answer, hint, why, show) => ({ fam, v, q, type: "number", answer, hint, why, ...(show ? { show } : {}) });
// choice with distinct options; `cands` are distractor values, `fmt` formats values to strings.
function CQ(fam, v, q, ans, cands, hint, why, fmt = (x) => String(x), show) {
  const a = fmt(ans), seen = new Set([a]), out = [a];
  for (const c of SH(cands)) { const s = fmt(c); if (!seen.has(s) && out.length < 4) { seen.add(s); out.push(s); } }
  return { fam, v, q, options: out, answer: a, hint, why, ...(show ? { show } : {}) };
}
const near = (n, ds) => ds.map((d) => n + d).filter((x) => x >= 0 && x !== n);
const rndNum = (len, zeros = 0.25) => { let s = String(R(1, 9)); for (let i = 1; i < len; i++) s += Math.random() < zeros ? "0" : String(R(0, 9)); return +s; };

// and shrinks text step by step to a readable floor; only as a last resort does a long explanation or a
// long passage scroll inside its own box (with a fade at the bottom), never the page.
const { $, el, svg: makeSvg, text, panel, wait, confetti, PRAISE, numpad } = KIT;
const stage = $("[data-stage]");
let token = 0;

const UNITS = COURSE.lessons.map((l, i) => ({ id: `l${i + 1}`, label: `${i + 1}. ${l.title}`, icon: l.icon || COURSE.icon }));
const esc = (t) => String(t ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;");
const len = (t) => String(t ?? "").length;
const stop = (t) => (/[.!?…:;]["'”’)]?$/.test(String(t).trim()) ? String(t).trim() : `${String(t).trim()}.`);

// ---------- fitting ----------
let fitFrame = 0;
const refit = () => {
  cancelAnimationFrame(fitFrame);
  fitFrame = requestAnimationFrame(() => {
    fitPanel();
    fitStage();
  });
};
// The owl's bubble. `quiet` keeps the words (and the voice) but hides the bubble, used when the
// question is already printed on the stage so the panel is not spent on the same sentence twice.
function say(html, { quiet = false } = {}) {
  KIT.say(html);
  const box = $("[data-say]");
  if (box) {
    box.innerHTML = `<span class="cr-say-in">${box.innerHTML}</span>`;
    box.classList.toggle("cr-quiet", quiet);
  }
  refit();
}
const atEnd = (box) => box.scrollTop + box.clientHeight >= box.scrollHeight - 2;
const fadeCue = (box) => {
  if (!box) return;
  box.classList.toggle("cr-fade", box.scrollHeight > box.clientHeight + 2 && !atEnd(box));
  if (!box.dataset.cue) {
    box.dataset.cue = "1";
    box.addEventListener("scroll", () => box.classList.toggle("cr-fade", box.scrollHeight > box.clientHeight + 2 && !atEnd(box)), { passive: true });
  }
};
const singleColumn = () => getComputedStyle($(".ap-main") || document.body).gridTemplateColumns.trim().split(/\s+/).length < 2;

function fitPanel() {
  const host = $("[data-panel]");
  if (!host) return;
  const main = $(".ap-main");
  host.classList.add("cr-panel");
  const sayBox = $("[data-say]", host);
  const inner = sayBox && $(".cr-say-in", sayBox);
  host.style.removeProperty("max-height");
  main?.style.removeProperty("grid-template-columns");
  if (inner) inner.style.removeProperty("max-height");
  const over = () => host.scrollHeight - host.clientHeight;
  // A ladder of ever stronger measures; stop at the first that fits. Upright screens may give the panel
  // more height ("tall"); landscape phones give it a wider column ("wide").
  const steps = [
    { k: 1 },
    { k: 0.93 },
    { k: 0.86 },
    { k: 0.86, grow: 1 },
    { k: 0.86, grow: 1, dense: true },
    { k: 0.86, grow: 2, dense: true },
    { k: 0.8, grow: 2, dense: true },
    { k: 0.8, grow: 2, dense: true, scroll: true },
    { k: 0.74, grow: 2, dense: true, scroll: true },
  ];
  const upright = singleColumn();
  for (const s of steps) {
    host.style.setProperty("--k", s.k);
    host.classList.toggle("cr-tight", s.k < 0.9);
    host.classList.toggle("cr-dense", !!s.dense);
    if (s.grow && upright) host.style.maxHeight = s.grow > 1 ? "64vh" : "58vh";
    if (s.grow && !upright && main) main.style.gridTemplateColumns = s.grow > 1 ? "minmax(0, 1fr) minmax(260px, 1.45fr)" : "minmax(0, 1.2fr) minmax(260px, 1fr)";
    if (inner) inner.style.removeProperty("max-height");
    let o = over();
    if (o > 1 && s.scroll && inner && sayBox.offsetParent) {
      // Last resort: the explanation scrolls inside the bubble, never the page.
      const lh = parseFloat(getComputedStyle(inner).lineHeight) || 20;
      const room = inner.offsetHeight - o - 2;
      inner.style.maxHeight = `${Math.max(Math.round(lh * 2.2), room)}px`;
      o = over();
    }
    if (o <= 1) break;
  }
  const choiceList = $("[data-list]", host);
  if (over() > 1 && typeof choiceList?._crCompact === "function") {
    const compact = choiceList._crCompact;
    choiceList._crCompact = null;
    if (compact()) return fitPanel();
  }
  fadeCue(inner);
}

function fitStage() {
  const box = $(".cr-show", stage);
  const body = box && $(".cr-body", box);
  if (!body) return;
  const fits = () => body.scrollHeight <= body.clientHeight + 1 && body.scrollWidth <= body.clientWidth + 1;
  box.style.setProperty("--s", 1);
  if (!fits()) {
    let lo = 0.45, hi = 1;
    for (let n = 0; n < 7; n++) {
      const mid = (lo + hi) / 2;
      box.style.setProperty("--s", mid);
      if (fits()) lo = mid;
      else hi = mid;
    }
    box.style.setProperty("--s", lo);
  }
  // A long, flat table (a few rows, many columns) that is still too wide is turned on its side.
  const table = $(".cr-table", body);
  if (table && !table.dataset.turned && body.scrollWidth > body.clientWidth + 1 && table.rows.length < (table.rows[0]?.cells.length || 0)) {
    const grid = [...table.rows].map((r) => [...r.cells]);
    table.dataset.turned = "1";
    table.innerHTML = grid[0].map((_, c) => `<tr>${grid.map((r) => (r[c] ? r[c].outerHTML : "<td></td>")).join("")}</tr>`).join("");
    table.classList.add("cr-turned");
    return fitStage();
  }
  // Still too wide: tighter cells, and long words may hyphenate.
  if (table && !table.classList.contains("cr-squeeze") && body.scrollWidth > body.clientWidth + 1) {
    table.classList.add("cr-squeeze");
    return fitStage();
  }
  fadeCue(body);
}
addEventListener("resize", refit);
if (window.ResizeObserver) new ResizeObserver(() => requestAnimationFrame(fitStage)).observe(stage);
document.fonts?.ready?.then(refit);

// ---------- the stage ----------
// A slide or question picture: big text, emoji row, a small table, a list, bars, a passage, the lesson's own SVG,
// or (for questions without a picture) the question itself. `tag` is the progress label; `q` prints the question
// above a picture so it stays visible while hints are shown.
function show(visual, { tag = "", q = "" } = {}) {
  stage.innerHTML = "";
  const box = document.createElement("div");
  box.className = "cr-show";
  const v = visual || {};
  let html = "";
  if (v.type === "svg") html = `<div class="cr-svg">${v.markup}</div>`;
  else if (v.type === "emoji") html = `<div class="cr-emoji">${esc(v.text)}</div>`;
  else if (v.type === "table")
    html = `<table class="cr-table">${(v.rows || []).map((r, i) => `<tr>${r.map((c) => (i === 0 && v.header !== false ? `<th>${esc(c)}</th>` : `<td>${esc(c)}</td>`)).join("")}</tr>`).join("")}</table>`;
  else if (v.type === "list") html = `<ul class="cr-list">${(v.items || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
  else if (v.type === "bars") {
    const max = Math.max(...(v.values || []).map((x) => x[1]), 1);
    html = `<div class="cr-bars">${(v.values || []).map(([k, n]) => `<div><span style="height:${Math.round((n / max) * 100)}%"></span><b>${esc(n)}</b><small>${esc(k)}</small></div>`).join("")}</div>`;
  } else if (v.type === "passage") html = `<div class="cr-passage">${v.title ? `<h3>${esc(v.title)}</h3>` : ""}${String(v.text || "").split(/\n\n+/).map((p) => `<p>${esc(p)}</p>`).join("")}</div>`;
  else if (v.type === "prompt") html = `<div class="cr-prompt${len(v.text) > 160 ? " cr-long" : ""}">${String(v.text || "").replace(/<(?!\/?b>)[^>]*>/g, "")}</div>`;
  else html = `<div class="cr-big">${esc(v.text || "")}</div>`;
  const question = q ? `<div class="cr-q">${esc(q)}</div>` : "";
  const cap = v.caption ? `<p class="cr-cap">${esc(v.caption)}</p>` : "";
  box.innerHTML = `${tag ? `<p class="cr-tag">${tag}</p>` : ""}<div class="cr-body cr-${v.type || "big"}-body">${question}${html}${cap}</div>`;
  stage.appendChild(box);
  refit();
}

async function learn(lesson, my) {
  const slides = lesson.learn || [];
  let i = 0;
  return new Promise((resolve) => {
    const host = panel(`<div class="kt-steps"><button type="button" class="kt-step-btn" data-back aria-label="Back">◀</button><span class="kt-step-dots" data-dots></span><button type="button" class="kt-step-btn kt-step-next" data-next>Next ▶</button></div>`);
    const render = () => {
      if (my !== token) return;
      const s = slides[i];
      show(s.show);
      $("[data-dots]", host).innerHTML = slides.map((_, k) => `<i class="${k === i ? "on" : k < i ? "seen" : ""}"></i>`).join("") + `<small>Learn ${i + 1} of ${slides.length}</small>`;
      $("[data-back]", host).disabled = i === 0;
      $("[data-next]", host).textContent = i === slides.length - 1 ? "✏️ Practice" : "Next ▶";
      say(`${i === 0 ? `<b>${stop(esc(lesson.title))}</b> ` : ""}${s.say}`);
    };
    host.onclick = (event) => {
      if (event.target.closest("[data-back]") && i > 0) (i -= 1), render();
      else if (event.target.closest("[data-next]")) {
        if (i < slides.length - 1) (i += 1), render();
        else {
          VOICE.hush();
          resolve();
        }
      }
    };
    if (slides.length) render();
    else resolve();
  });
}

// One question; resolves with true if right on the first try.
// Make every attempt different: generator questions build fresh numbers, choices are shuffled.
const shuffled = (list) => {
  const out = [...list];
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
};
function fresh(q) {
  let made = q;
  if (typeof q.gen === "function") {
    try {
      made = { ...q, ...q.gen() };
    } catch (error) {
      console.error("question generator failed", error);
    }
  }
  if (made.options && !made.keepOrder) made = { ...made, options: shuffled(made.options) };
  if (made.items && !made.keepOrder) made = { ...made, items: shuffled(made.items) };
  return made;
}
// Draw a set: keep the first (warm-up) question, sample the rest from the bank, keep easy-to-hard roughly by position.
function drawSet(bank, n) {
  if (bank.length <= n) return bank;
  const picks = new Set([0]);
  while (picks.size < n) picks.add(1 + Math.floor(Math.random() * (bank.length - 1)));
  return [...picks].sort((a, b) => a - b).map((k) => bank[k]);
}

// Choice and ordering lists: short words stay as chips; sentence-length entries become a calm grid of cards.
function listClass(list) {
  const longest = Math.max(0, ...list.map(len));
  const total = list.reduce((a, o) => a + len(o), 0);
  if (longest > 34 || (list.length <= 4 && total > 110)) return "cr-cards cr-wide";
  if (longest > 14 || list.length > 4) return "cr-cards";
  return "";
}

// Questions missed on the first try are kept with the lesson's progress (at most 20, newest last) for the
// parent's weekly report and for review warm-ups in later lessons. `src` says where the question lives
// ({ lesson, bank, k }), so a review can ask it again (a generated question comes back with new numbers).
// One answered right on the first try later is taken off the list.
const srcKey = (src) => (src ? `${src.lesson}:${src.bank}:${src.k}` : "");
function remember(q, missed, src) {
  try {
    const id = src ? `l${src.lesson + 1}` : shell.current();
    const text = String(q.q || "").replace(/<[^>]*>/g, "").trim();
    if (!id || !text) return;
    const key = srcKey(src);
    const was = shell.progress()[id]?.missed || [];
    const rest = was.filter((m) => (key && m.src ? m.src !== key : m.q !== text));
    if (!missed && rest.length === was.length) return;
    const answer = Array.isArray(q.answer) && q.answerText == null ? q.answer.join(" → ") : String(q.answerText ?? q.answer);
    shell.mark(id, { missed: missed ? [...rest, { q: text, a: answer.replace(/<[^>]*>/g, ""), at: Date.now(), ...(key ? { src: key } : {}) }].slice(-20) : rest });
  } catch (error) {}
}

// Spaced review: up to three questions missed in EARLIER lessons of this course, at least a day ago,
// oldest first. Each is asked again at the start of the lesson; a first-try answer clears it.
const REVIEW_MAX = 3;
const REVIEW_GAP = 20 * 3600 * 1000;
function reviewFor(index) {
  const found = [];
  const progress = shell.progress();
  for (let i = 0; i < index; i++)
    for (const m of progress[`l${i + 1}`]?.missed || []) {
      if (!m.src || Date.now() - m.at < REVIEW_GAP) continue;
      const [lesson, bank, k] = m.src.split(":");
      const q = COURSE.lessons[Number(lesson)]?.[bank]?.[Number(k)];
      if (q) found.push({ q, at: m.at, src: { lesson: Number(lesson), bank, k: Number(k) } });
    }
  return found.sort((a, b) => a.at - b.at).slice(0, REVIEW_MAX);
}

function ask(q0, label, my, src) {
  const q = fresh(q0);
  return new Promise((resolve) => {
    let tries = 0;
    const type = q.type || (q.options ? "choice" : q.items ? "order" : "number");
    const tag = `${esc(label)}${type === "order" ? ` · <span>tap in order, first to last</span>` : ""}`;
    if (q.show || q.big) show(q.show || { type: "big", text: q.big }, { tag, q: q.q });
    else show({ type: "prompt", text: q.q }, { tag });
    const finish = (right) => {
      if (my !== token) return;
      panel(`<div class="ap-buttons"><button type="button" class="primary" data-go>Next ▶</button></div>`);
      const why = q.why ? `<small>${esc(q.why)}</small>` : "";
      say(right ? `Correct. ${q.why ? esc(q.why) : ""}` : `The answer is <b>${stop(esc(Array.isArray(q.answer) && q.answerText == null ? q.answer.join(" → ") : q.answerText ?? q.answer))}</b> ${why}`);
      $("[data-panel]").onclick = (e) => e.target.closest("[data-go]") && resolve(tries === 1 && right);
    };
    const check = (value) => {
      if (my !== token) return false;
      tries += 1;
      const want = Array.isArray(q.answer) ? q.answer.join("|") : String(q.answer).trim().toLowerCase();
      const got = Array.isArray(value) ? value.join("|") : String(value).trim().toLowerCase();
      if (got === want) {
        if (tries === 1) remember(q, false, src);
        MUSIC.chime();
        window.OC?.count("problems solved");
        finish(true);
        return true;
      }
      MUSIC.oops();
      if (tries === 1) remember(q, true, src);
      if (tries === 1) say(`Not quite. ${q.hint ? esc(q.hint) : "Reconsider the question carefully."}`);
      else finish(false);
      return false;
    };
    // The question is already on the stage, so the owl reads it aloud with the bubble hidden.
    const prompt = () => say(esc(q.q), { quiet: true });
    if (type === "choice") {
      const host = panel(`<div class="ap-chips cr-choices ${listClass(q.options)}" data-list>${q.options.map((o, k) => `<button type="button" data-c="${k}">${esc(o)}</button>`).join("")}</div>`);
      // If even the tightest layout cannot hold these answers, print them on the stage as A, B, C…
      // (which may scroll there) and keep only large lettered buttons in the panel.
      const letter = (k) => String.fromCharCode(65 + k);
      const choiceList = $("[data-list]", host);
      choiceList._crCompact = () => {
        const list = choiceList, body = $(".cr-body", stage);
        // Only for genuinely long answer sets; short ones always fit the card layout.
        if (!list.isConnected || q.options.reduce((a, o) => a + len(o), 0) < 200) return false;
        if (!list || !body || q.options.length > 8) return false;
        const missed = new Set([...list.querySelectorAll(".cr-miss")].map((b) => b.dataset.c));
        list.className = "ap-chips cr-choices cr-letters";
        list.innerHTML = q.options.map((o, k) => `<button type="button" data-c="${k}" aria-label="${letter(k)}: ${esc(o).replace(/"/g, "&quot;")}" ${missed.has(String(k)) ? `disabled class="cr-miss"` : ""}>${letter(k)}</button>`).join("");
        body.insertAdjacentHTML("beforeend", `<ol class="cr-opts">${q.options.map((o, k) => `<li data-li="${k}" class="${missed.has(String(k)) ? "cr-miss" : ""}"><b>${letter(k)}</b><span>${esc(o)}</span></li>`).join("")}</ol>`);
        return true;
      };
      host.onclick = (e) => {
        const b = e.target.closest("[data-c]");
        if (!b || b.disabled) return;
        const ok = check(q.options[Number(b.dataset.c)]);
        if (!ok && my === token && b.isConnected) {
          b.disabled = true;
          b.classList.add("cr-miss");
          $(`.cr-opts [data-li="${b.dataset.c}"]`, stage)?.classList.add("cr-miss");
        }
      };
    } else if (type === "order") {
      let picked = [];
      const host = panel(`<div class="ap-chips cr-choices cr-ordering ${listClass(q.items)}" data-list></div><div class="ap-buttons cr-undo"><button type="button" data-undo>↺ Start over</button></div>`);
      const list = $("[data-list]", host);
      const draw = () => {
        list.innerHTML = q.items
          .map((o, k) => {
            const at = picked.indexOf(k);
            return `<button type="button" data-o="${k}" ${at >= 0 ? `disabled aria-pressed="true"` : ""}><i>${at >= 0 ? at + 1 : ""}</i><span>${esc(o)}</span></button>`;
          })
          .join("");
        $(".cr-undo", host).style.display = picked.length ? "" : "none";
        refit();
      };
      draw();
      host.onclick = (e) => {
        const b = e.target.closest("[data-o]");
        if (e.target.closest("[data-undo]")) (picked = []), draw();
        else if (b && !b.disabled) {
          picked.push(Number(b.dataset.o));
          draw();
          if (picked.length === q.items.length) {
            const value = picked.map((k) => q.items[k]);
            picked = [];
            if (!check(value) && my === token && list.isConnected) draw();
          }
        }
      };
    } else {
      const host = panel(`<div data-pad></div>`);
      numpad($("[data-pad]", host), { onEnter: (v) => check(v), max: 7 });
    }
    prompt();
  });
}

const units = Object.fromEntries(
  COURSE.lessons.map((lesson, i) => [
    `l${i + 1}`,
    async () => {
      const my = token;
      const id = `l${i + 1}`;
      try {
        await learn(lesson, my);
        if (my !== token) return;
        let first = 0;
        const review = reviewFor(i);
        if (review.length) {
          say(`First, a short review: ${review.length === 1 ? "one question" : `${review.length} questions`} missed in an earlier lesson.`);
          await wait(1400);
          if (my !== token) return;
        }
        for (let k = 0; k < review.length; k++) {
          await ask(review[k].q, `🔁 Review ${k + 1} of ${review.length}`, my, review[k].src);
          if (my !== token) return;
        }
        const bankOf = (name) => (lesson[name] || []).map((q, k) => ({ q, k }));
        const practice = drawSet(bankOf("practice"), lesson.practiceCount || 12);
        for (let k = 0; k < practice.length; k++) {
          if (await ask(practice[k].q, `Practice ${k + 1} of ${practice.length}`, my, { lesson: i, bank: "practice", k: practice[k].k })) first += 1;
          if (my !== token) return;
        }
        const challenge = drawSet(bankOf("challenge"), lesson.challengeCount || 3);
        for (let k = 0; k < challenge.length; k++) {
          say("Challenge problem. Understand it, make a plan, carry it out, then check.");
          await wait(1200);
          if (my !== token) return;
          await ask(challenge[k].q, `⭐ Challenge ${k + 1} of ${challenge.length}`, my, { lesson: i, bank: "challenge", k: challenge[k].k });
          if (my !== token) return;
        }
        shell.mark(id, { done: true, first, of: practice.length, doneAt: Date.now() });
        show({ type: "big", text: `${first} / ${practice.length}`, caption: "practice problems correct on the first attempt" });
        panel(`<div class="ap-buttons"><button type="button" class="primary" data-explain>🗣️ Explain it</button><button type="button" data-off>📝 Task</button>${lesson.extend ? `<button type="button" data-extend>🚀 Go further</button>` : ""}<button type="button" data-again>↺ Again</button></div>`);
        say(`Lesson complete. Now explain the main idea in your own words.`);
        $("[data-panel]").onclick = (e) => {
          if (e.target.closest("[data-again]")) shell.go(id);
          if (e.target.closest("[data-explain]")) {
            show({ type: "list", items: [`Explain to a grown-up, in 3 or 4 clear sentences, the main idea of "${lesson.title}".`, "Give one example of your own.", "Say one question you still have."] });
            say("Explain the main idea in three or four clear sentences, give an example of your own, and ask one question you still have.");
          }
          if (e.target.closest("[data-extend]")) {
            show({ type: "list", items: [lesson.extend] });
            say(esc(lesson.extend), { quiet: true });
          }
          if (e.target.closest("[data-off]")) {
            show({ type: "list", items: [lesson.offline || "Tell a grown-up what you learned today, in 5 sentences."] });
            say(esc(lesson.offline || "Tell a grown-up what you learned today."), { quiet: true });
          }
        };
      } catch (error) {
        console.error(error);
      }
    },
  ]),
);

const how = Object.fromEntries(UNITS.map((u) => [u.id, { icon: COURSE.icon, title: u.label.replace(/^\d+\.\s*/, ""), steps: ["Learn: study the lesson slides.", "Practice: solve each problem; a first miss gives a hint, a second shows the full reasoning.", "Challenge: contest-level problems. Then explain the main idea in your own words."] }]));
const fromHash = /^#l\d+$/.test(location.hash) && UNITS.some((u) => u.id === location.hash.slice(1)) ? location.hash.slice(1) : null;
const shell = SHELL({
  unitWord: "Lesson",
  units: UNITS,
  how,
  start: fromHash || UNITS[0].id,
  onStop() {
    token += 1;
    $("[data-panel]").onclick = null;
  },
  subject: COURSE.subject,
  activity: COURSE.title,
  onUnit(id) {
    token += 1;
    VOICE.hush();
    units[id]();
  },
});

// The shell's "turn sideways" tip normally floats at the bottom of the screen, over the answer buttons.
// Here it sits at the foot of the stage (never over a control) and a tap dismisses it.
const placeTip = () => {
  const tip = $(".ap-turn");
  if (!tip) return;
  if (!tip.dataset.placed) {
    tip.dataset.placed = "1";
    tip.classList.add("cr-turn");
    tip.insertAdjacentHTML("beforeend", ` <b aria-hidden="true">✕</b>`);
    tip.setAttribute("role", "button");
    tip.addEventListener("click", () => tip.remove());
  }
  const r = stage.getBoundingClientRect();
  tip.style.bottom = "auto";
  tip.style.top = `${Math.max(4, Math.round(r.bottom - tip.offsetHeight - 10))}px`;
};
placeTip();
addEventListener("resize", placeTip);
if (window.ResizeObserver) new ResizeObserver(placeTip).observe(stage);

const style = document.createElement("style");
style.textContent = `
/* stage: progress tag on top, content centerd below and shrunk to fit (--s) */
.cr-show{--s:1;width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 16px;overflow:hidden}
.cr-tag{flex:none;margin:0;padding:4px 12px;border-radius:12px;background:var(--accent-soft);color:var(--accent-dark);font:800 13.5px/1.3 var(--sans);font-variant-numeric:tabular-nums;max-width:100%;text-align:center}
.cr-tag span{font-weight:700;opacity:.85}
.cr-body{flex:1 1 0;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;gap:calc(10px * var(--s));overflow:auto;overscroll-behavior:contain;scrollbar-width:thin}
.cr-body>:first-child{margin-top:auto}.cr-body>:last-child{margin-bottom:auto}
.cr-big{font:900 max(22px,calc(clamp(26px,5vw,56px) * var(--s)))/1.2 var(--sans);color:var(--ink);text-align:center;white-space:pre-line;overflow-wrap:anywhere}
.cr-emoji{font-size:max(26px,calc(clamp(34px,6vw,64px) * var(--s)));line-height:1.3;text-align:center;letter-spacing:4px;word-break:break-word}
.cr-svg{flex:1 1 0;min-height:90px;width:100%;display:grid;place-items:center}.cr-svg svg{width:100%;height:100%;max-width:100%;max-height:100%}
.cr-svg-body>.cr-svg:first-child{margin-top:0}.cr-svg-body>.cr-svg:last-child{margin-bottom:0}
.cr-table{border-collapse:collapse;font:800 max(12.5px,calc(clamp(15px,2.3vw,23px) * var(--s)))/1.25 var(--sans);color:var(--ink);max-width:100%}
.cr-table th{position:sticky;top:0;z-index:1}.cr-table.cr-squeeze th,.cr-table.cr-squeeze td{padding:3px 4px;hyphens:auto;-webkit-hyphens:auto;letter-spacing:-.01em}.cr-table.cr-turned th{position:static}
.cr-table th,.cr-table td{border:2px solid var(--line);padding:calc(7px * var(--s)) calc(12px * var(--s));text-align:center;overflow-wrap:break-word}.cr-table th{background:var(--accent-soft)}
.cr-list{margin:0;padding-left:1.3em;font:700 max(14px,calc(clamp(17px,2.4vw,24px) * var(--s)))/1.45 var(--sans);color:var(--ink);max-width:40em;text-align:left}
.cr-list li+li{margin-top:.25em}
.cr-bars{flex:1 1 0;min-height:110px;max-height:340px;display:flex;align-items:flex-end;gap:12px;width:min(640px,96%)}
.cr-bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.cr-bars span{width:100%;background:var(--accent);border-radius:8px 8px 0 0}.cr-bars b{font-weight:900}.cr-bars small{font-weight:800;color:var(--muted);text-align:center;overflow-wrap:anywhere;font-size:max(12px,calc(14px * var(--s)))}
.cr-passage{max-width:44em;font:600 max(13.5px,calc(clamp(16px,2.1vw,20px) * var(--s)))/1.55 var(--sans);color:var(--ink);text-align:left}
.cr-passage h3{margin:0 0 6px;font-size:1.15em}.cr-passage p{margin:0 0 .6em}.cr-passage p:last-child{margin-bottom:0}
.cr-prompt{max-width:34em;font:700 max(16px,calc(clamp(19px,2.6vw,28px) * var(--s)))/1.45 var(--sans);color:var(--ink);text-align:center;overflow-wrap:break-word}
.cr-prompt.cr-long{text-align:left;font-weight:650}
.cr-q{max-width:38em;font:800 max(15px,calc(clamp(17px,2.2vw,24px) * var(--s)))/1.4 var(--sans);color:var(--ink);text-align:center;overflow-wrap:break-word}
.cr-q+*{margin-top:calc(4px * var(--s))}
.cr-cap{margin:0;color:var(--muted);font:800 max(13px,calc(clamp(14px,2vw,18px) * var(--s))) var(--sans);text-align:center}
.cr-fade{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 36px),transparent)}

/* panel (selectors carry .ap-panel.cr-panel so per-course style tweaks cannot undo the fit):
   children never squash (that hides text); content is centerd but never cut at the top */
.ap-panel.cr-panel{--k:1;--say:clamp(15.5px,2.3vw,21px);justify-content:flex-start}
.ap-panel.cr-panel>*{flex-shrink:0}
.ap-panel.cr-panel>:first-child:not(.cr-quiet),.ap-panel.cr-panel>.cr-quiet+*{margin-top:auto}.ap-panel.cr-panel>:last-child{margin-bottom:auto}
.ap-panel.cr-panel .ap-say{min-height:0;max-height:none;overflow:visible;font-size:max(14px,calc(var(--say) * var(--k)));line-height:1.38;max-width:36em;padding-top:12px;padding-bottom:12px}
.ap-panel.cr-panel .ap-say.cr-quiet{display:none}
.ap-panel.cr-panel .cr-say-in{display:block;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.ap-panel.cr-panel .cr-say-in small{display:block;margin-top:.3em}
.ap-panel.cr-panel.cr-tight .ap-say{padding-top:8px;padding-bottom:8px}

/* answer buttons: short answers are chips; long ones are cards in a grid; ordering shows the position picked */
.ap-panel.cr-panel .cr-choices{width:100%;max-width:52em;gap:8px}
.ap-panel.cr-panel .cr-choices button{min-height:48px;font-size:max(14px,calc(17px * var(--k)));max-width:100%;white-space:normal;line-height:1.25;padding:8px 16px}
.ap-panel.cr-panel .cr-choices.cr-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:calc(8px * var(--k))}
.ap-panel.cr-panel .cr-choices.cr-wide{grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr))}
.ap-panel.cr-panel .cr-choices.cr-cards button{min-height:46px;border-radius:16px;padding:calc(9px * var(--k)) 14px;text-align:center;font-weight:750}
.ap-panel.cr-panel .cr-choices.cr-wide button{text-align:left;line-height:1.3}
.ap-panel.cr-panel.cr-tight .cr-choices.cr-cards button{padding-top:6px;padding-bottom:6px;min-height:44px}
.ap-panel.cr-panel .cr-choices button.cr-miss{opacity:.5;background:#f6e9e4;box-shadow:0 0 0 1px #e4b9a8;text-decoration:line-through;text-decoration-color:rgba(160,70,40,.45)}
.ap-panel.cr-panel .cr-ordering button{display:flex;align-items:center;justify-content:flex-start;gap:10px;text-align:left}
.ap-panel.cr-panel .cr-choices.cr-ordering.cr-cards{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.ap-panel.cr-panel.cr-dense .cr-choices.cr-cards:not(.cr-wide){grid-template-columns:repeat(auto-fit,minmax(min(100%,138px),1fr))}
.ap-panel.cr-panel.cr-dense .cr-choices.cr-ordering.cr-cards:not(.cr-wide) button{padding-left:8px;padding-right:8px;gap:7px}
.ap-panel.cr-panel .cr-ordering button i{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--paper,#f6efe4);box-shadow:inset 0 0 0 2px #e2d6c4;font:900 14px/1 var(--sans);font-style:normal;color:#fff}
.ap-panel.cr-panel .cr-ordering button[aria-pressed="true"]{opacity:1;background:var(--accent-soft);color:var(--ink);box-shadow:0 0 0 2px var(--accent);cursor:default}
.ap-panel.cr-panel .cr-ordering button[aria-pressed="true"] i{background:var(--accent);box-shadow:none}
.ap-panel.cr-panel .cr-ordering.cr-wide button span{flex:1}
.ap-panel.cr-panel .cr-ordering button span{text-align:left}
.ap-panel.cr-panel .cr-undo button{min-height:44px;font-size:15px;padding:0 16px}
@media (max-height:700px),(max-width:420px){.ap-panel.cr-panel .cr-choices.cr-cards button,.ap-panel.cr-panel .cr-ordering button{min-height:44px}.ap-panel.cr-panel .cr-choices{gap:6px}}

.ap-turn.cr-turn{pointer-events:auto;cursor:pointer;width:max-content;max-width:calc(100vw - 32px);white-space:normal;text-align:center;font-size:14px;padding:8px 14px}
.ap-turn.cr-turn b{margin-left:6px;opacity:.7}

/* lettered answers: the full texts on the stage, big A/B/C buttons in the panel */
.cr-opts{list-style:none;margin:0;padding:0;display:grid;gap:calc(8px * var(--s));width:100%;max-width:40em;text-align:left;font:650 max(13.5px,calc(clamp(15px,2vw,19px) * var(--s)))/1.4 var(--sans);color:var(--ink)}
.cr-opts li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:calc(8px * var(--s)) 12px;border-radius:14px;background:var(--accent-soft)}
.cr-opts li b{display:grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;background:var(--accent);color:#fff;font-weight:900}
.cr-opts li.cr-miss{opacity:.45;text-decoration:line-through}
.ap-panel.cr-panel .cr-choices.cr-letters{display:flex;flex-wrap:nowrap;justify-content:center;gap:10px}
.ap-panel.cr-panel .cr-choices.cr-letters button{flex:1 1 0;max-width:110px;min-height:52px;font-size:22px;font-weight:900;text-decoration:none}

/* tap targets stay at least 44 px even on short landscape phones */
.ap-panel.cr-panel .ap-buttons button,.ap-panel.cr-panel .kt-step-btn{min-height:46px}
@media (max-height:460px),(max-width:420px) and (max-height:720px){.ap-panel.cr-panel{--say:15.5px}.ap-panel.cr-panel .kt-keys button{min-height:44px !important}.ap-panel.cr-panel .kt-entry{min-height:40px !important}}
@media (max-height:460px){.ap-panel.cr-panel .ap-buttons button,.ap-panel.cr-panel .kt-step-btn{min-height:44px}.ap-panel.cr-panel .cr-choices button{min-height:44px}.cr-show{padding:8px 10px}.cr-tag{font-size:12.5px;padding:3px 10px}}
`;
document.head.appendChild(style);
</script>
</body>
</html>
