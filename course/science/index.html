<script>// Science: Year 1 — 32 weekly lessons: zoology of flying creatures, physics and chemistry labs, the story of science.
// Generated from scratch parts. Generator questions ({gen}) build fresh numbers on every attempt.
const COURSE = (() => {
// Runtime helpers for the science course. This file is shipped INSIDE science.data.js (generators call these at runtime).
const INK = "#1f2937", BLUE = "#2563eb", ORANGE = "#ea580c", GREEN = "#16a34a", LB = "#dbeafe", LO = "#fed7aa", LG = "#dcfce7", GRAY = "#6b7280", PURPLE = "#7c3aed", RED = "#dc2626", YEL = "#fef9c3";
const W = (body, vh) => `<svg viewBox='0 0 600 ${vh || 320}' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'>${body}</svg>`;
const T = (x, y, s, size = 24, fill = INK, anchor = "middle", weight = 700) =>
  `<text x='${x}' y='${y}' font-size='${Math.max(18, size)}' fill='${fill}' text-anchor='${anchor}' font-weight='${weight}'>${String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")}</text>`;
const r1 = (n) => Math.round(n * 10) / 10;
const r2 = (n) => Math.round(n * 100) / 100;
// Number formatting: 12345 -> "12,345"; decimals kept as given.
const fmt = (n) => { const [a, b] = String(n).split("."); return a.replace(/\B(?=(\d{3})+(?!\d))/g, ",") + (b ? "." + b : ""); };

// ---- randomness ----
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));            // integer in [a, b]
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const shuffle = (arr) => { const o = arr.slice(); for (let i = o.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; } return o; };
const pickN = (arr, n) => shuffle(arr).slice(0, n);
// Four distinct options containing `answer`: takes distractors in order, skipping duplicates of the answer or each other.
const opts = (answer, distractors, n = 4) => { const out = [answer]; for (const d of distractors) { if (out.length >= n) break; if (!out.includes(d)) out.push(d); } return out; };
// Numeric options with a unit: answer plus nearby wrong values (positive, distinct).
const numOpts = (ans, wrongs, unit = "") => opts(fmt(ans) + unit, wrongs.filter((w) => w > 0 && w !== ans).map((w) => fmt(w) + unit));

// Grammar helpers: "an" before vowel sounds (incl. 8, 11, 18, 80…), and plural nouns for counts other than 1.
const an = (w) => { const s = String(w).replace(/,/g, ""); if (/^\d/.test(s)) { const d = s.match(/^\d+/)[0]; return d[0] === "8" || (/^1[18]/.test(d) && d.length % 3 === 2) ? "an" : "a"; } return /^[aeiou]/i.test(s) ? "an" : "a"; };
const An = (w) => (an(w) === "an" ? "An" : "A");
const pl = (n, one, many) => `${fmt(n)} ${n === 1 ? one : many || one + "s"}`;

// ---- slides ----
const S = (say, show) => ({ say, show });
const cap = (o, caption) => (caption ? { ...o, caption } : o);
const big = (text, caption) => cap({ type: "big", text }, caption);
const emo = (text, caption) => cap({ type: "emoji", text }, caption);
// Tables: plain HTML when small; drawn as a self-scaling SVG when they would overflow a small screen.
const tblHeight = (rows, caption) => rows.reduce((h, r) => h + 40 * (1 + Math.floor(r.join("").length / 40)), 0) + (caption ? 34 : 0);
function svgTable(rows, caption, header = true) {
  const n = rows[0].length, lens = rows[0].map((_, c) => Math.max(4, ...rows.map((r) => String(r[c]).length)));
  const tot = lens.reduce((a, b) => a + b, 0);
  const minw = rows[0].map((_, c) => Math.max(70, ...rows.map((r) => Math.max(...String(r[c]).split(" ").map((w) => w.length * 11.5 + 18)))));
  let ws = lens.map((l, c) => Math.max(minw[c], (580 * l) / tot));
  for (let it = 0; it < 4; it++) { const extra = ws.reduce((a, b) => a + b, 0) - 580; if (extra <= 0) break; const flex = ws.map((w, c) => Math.max(0, w - minw[c])), fs = flex.reduce((a, b) => a + b, 0) || 1; ws = ws.map((w, c) => w - (extra * flex[c]) / fs); }
  const total = ws.reduce((a, b) => a + b, 0); if (total > 580) ws = ws.map((w) => (w * 580) / total);
  const wrap = (t, w) => { const per = Math.max(6, Math.floor((w - 16) / 11)), out = []; let line = ""; for (const word of String(t).split(" ")) { if ((line + " " + word).trim().length > per && line) { out.push(line); line = word; } else line = (line + " " + word).trim(); } out.push(line); return out; };
  let y = 10, b = "";
  rows.forEach((r, i) => {
    const cells = r.map((c, j) => wrap(c, ws[j])), h = Math.max(...cells.map((c) => c.length)) * 25 + 16;
    let x = 10;
    cells.forEach((lines, j) => { b += `<rect x='${r1(x)}' y='${y}' width='${r1(ws[j])}' height='${h}' fill='${header && i === 0 ? LB : "#fff"}' stroke='#d6c7a8' stroke-width='2'/>`; lines.forEach((ln, m) => (b += T(r1(x + ws[j] / 2), y + 27 + m * 25, ln, 20, INK, "middle", header && i === 0 ? 800 : 700))); x += ws[j]; });
    y += h;
  });
  return svg(W(b, Math.ceil(y + 10)), caption);
}
const tbl = (rows, caption) => (tblHeight(rows, caption) > 250 ? svgTable(rows, caption) : cap({ type: "table", rows }, caption));
const list = (items, caption) => cap({ type: "list", items }, caption);
const bars = (values, caption) => cap({ type: "bars", values }, caption);
const passage = (title, text) => ({ type: "passage", title, text });
// SVG: captions are drawn inside the picture (extra 40px band).
const svg = (markup, caption) => ({ type: "svg", markup: caption ? markup.replace(/viewBox='0 0 600 (\d+)'/, (m, h) => `viewBox='0 0 600 ${+h + 40}'`).replace(/<\/svg>$/, T(300, +(markup.match(/viewBox='0 0 600 (\d+)'/) || [0, 320])[1] + 28, caption, caption.length > 44 ? 18 : 21, GRAY) + "</svg>") : markup });
// Closing "Explain it" slide (every lesson ends Learn with one).
const X = (prompt) => S(`<b>Explain it.</b> ${prompt}`, list(["Say it in 2–4 complete sentences.", "Give the evidence or the reasoning, not just the answer.", "Use the precise words from this lesson."], "Explain it — to a grown-up or in writing"));
// "Design the fair test" slide (every lesson has one): question, then the plan's parts.
const F = (question, change, measure, keep, say) => S(say || `<b>Design the fair test.</b> ${question} Decide what you will change (the independent variable), what you will measure (the dependent variable), and what you must keep the same (the controlled variables).`, (() => { const rows = [["Change", change], ["Measure", measure], ["Keep the same", keep]]; return tblHeight(rows) > 260 ? svgTable(rows, null, false) : { type: "table", header: false, rows }; })());

// ---- questions ----
const add = (o, show) => (show ? { ...o, show } : o);
const N = (q, answer, hint, why, show) => add({ q, type: "number", answer, hint, why }, show);
const C = (q, options, answer, hint, why, show) => add({ q, options, answer, hint, why }, show);
const O = (q, answer, hint, why, show) => add({ q, type: "order", items: answer.slice().reverse(), answer, hint, why }, show);
const G = (gen) => ({ gen });

// ---- data questions with random data (bars or table) ----
// spec: { title, labels:[...] (2-6 short), lo, hi, step=1, unit:"cm", noun:"distance", more:"farthest"/"largest", less:"shortest"/"smallest", table:false }
// Returns a generated question of one of several kinds; answers computed.
function dataQ(spec) {
  const step = spec.step || 1, labels = spec.labels;
  // spec.ranges: optional [lo, hi] per label (realistic values); spec.order: "asc" | "desc" keeps the values in the
  // physically expected order along the labels, so random data never teach a false relationship.
  const genVals = () => {
    let v;
    do { v = labels.map((_, i) => { const [a, b] = spec.ranges ? spec.ranges[i] : [spec.lo, spec.hi]; return ri(Math.ceil(a / step), Math.floor(b / step)) * step; }); } while (new Set(v).size !== v.length);
    if (spec.order === "asc") v.sort((x, y) => x - y);
    if (spec.order === "desc") v.sort((x, y) => y - x);
    return v;
  };
  let vals = genVals();
  const kinds = spec.kinds || ["max", "min", "diff", "total", "range", "mean"];
  const kind = pick(kinds);
  const u0 = spec.unit ? " " + spec.unit : "";
  const u = u0; // unit after a number; singular for 1 (e.g. "1 bird")
  const uN = (x) => (x === 1 && spec.unit && spec.unit.length > 2 && spec.unit.endsWith("s") ? u0.slice(0, -1) : u0);
  const show = spec.table ? tbl([[spec.colA || "Trial", spec.colB || spec.noun + (spec.unit ? ` (${spec.unit})` : "")], ...labels.map((l, i) => [l, fmt(vals[i])])], spec.title) : bars(labels.map((l, i) => [l, vals[i]]), spec.title);
  const iMax = vals.indexOf(Math.max(...vals)), iMin = vals.indexOf(Math.min(...vals));
  const meta = { kind: "data", vals: vals.slice(), labels: labels.slice(), q: kind };
  if (kind === "max" || kind === "min") {
    const i = kind === "max" ? iMax : iMin;
    return { q: `${spec.title}. Which had the ${kind === "max" ? spec.more || "largest " + spec.noun : spec.less || "smallest " + spec.noun}?`, options: labels.slice(), answer: labels[i], hint: "Read every value before choosing. Which number is " + (kind === "max" ? "greatest" : "least") + "?", why: `The values are ${labels.map((l, k) => `${l} ${fmt(vals[k])}`).join(", ")}; the ${kind === "max" ? "greatest" : "least"} is ${fmt(vals[i])}${uN(vals[i])} (${labels[i]}).`, show, meta };
  }
  if (kind === "diff") {
    const [a, b] = pickN([...labels.keys()], 2), hi = vals[a] > vals[b] ? a : b, lo = hi === a ? b : a;
    meta.a = hi; meta.b = lo;
    return { q: `${spec.title}. How much greater was the ${spec.noun} for ${labels[hi]} than for ${labels[lo]}?${u ? ` (in${u})` : ""}`, type: "number", answer: vals[hi] - vals[lo], hint: "Find both values, then subtract the smaller from the larger.", why: `${fmt(vals[hi])} − ${fmt(vals[lo])} = ${fmt(vals[hi] - vals[lo])}${uN(vals[hi] - vals[lo])}.`, show, meta };
  }
  if (kind === "total") return { q: `${spec.title}. What is the total of all the values?${u ? ` (in${u})` : ""}`, type: "number", answer: vals.reduce((s, x) => s + x, 0), hint: "Add the values one at a time and keep a running total.", why: `${vals.map(fmt).join(" + ")} = ${fmt(vals.reduce((s, x) => s + x, 0))}${uN(vals.reduce((s, x) => s + x, 0))}.`, show, meta };
  if (kind === "range") return { q: `${spec.title}. What is the range (largest value minus smallest value)?`, type: "number", answer: vals[iMax] - vals[iMin], hint: "Find the largest and the smallest value first.", why: `Range = ${fmt(vals[iMax])} − ${fmt(vals[iMin])} = ${fmt(vals[iMax] - vals[iMin])}${uN(vals[iMax] - vals[iMin])}. The range measures how spread out the results are.`, show, meta };
  // mean: rebuild values so the mean is a whole number (last value chosen to make the sum divisible), distinct and in range.
  const n = vals.length;
  if (spec.ranges || spec.order) { for (let tries = 0; tries < 3000 && vals.reduce((a, x) => a + x, 0) % n; tries++) vals = genVals(); }
  else for (let tries = 0; tries < 400; tries++) {
    const head = vals.slice(0, n - 1), mu = ri(Math.ceil(spec.lo / step), Math.floor(spec.hi / step)) * step, last = n * mu - head.reduce((a, x) => a + x, 0);
    if (last >= spec.lo && last <= spec.hi && last % step === 0 && !head.includes(last)) { vals[n - 1] = last; break; }
    vals = labels.map(() => ri(Math.ceil(spec.lo / step), Math.floor(spec.hi / step)) * step);
  }
  const s = vals.reduce((a, x) => a + x, 0);
  if (s % n !== 0 || new Set(vals).size !== n) return dataQ({ ...spec, kinds: ["total", "diff", "max"] });
  meta.vals = vals.slice();
  const show2 = spec.table ? tbl([[spec.colA || "Trial", spec.colB || spec.noun + (spec.unit ? ` (${spec.unit})` : "")], ...labels.map((l, i) => [l, fmt(vals[i])])], spec.title) : bars(labels.map((l, i) => [l, vals[i]]), spec.title);
  return { q: `${spec.title}. What is the mean (average) of these ${n} values?${u ? ` (in${u})` : ""}`, type: "number", answer: s / n, hint: "Add all the values, then divide by how many values there are.", why: `(${vals.map(fmt).join(" + ")}) ÷ ${n} = ${fmt(s)} ÷ ${n} = ${fmt(s / n)}${uN(s / n)}.`, show: show2, meta };
}

// ---- physics/chemistry formula families (meta lets the checker recompute independently) ----
// density = mass / volume (g, cm³)
function densityQ(ctx) {
  const d = pick(ctx?.ds || [1, 2, 3, 4, 5, 7, 8, 9, 11, 13, 19]), v = ri(2, 30), m = d * v;
  const want = pick(["d", "m", "v"]);
  const meta = { kind: "density", d, v, m, want };
  if (want === "d") return { q: `A solid block has a mass of ${m} g and a volume of ${v} cm³. What is its density, in g/cm³?`, type: "number", answer: d, hint: "Density = mass ÷ volume. Which number goes on top?", why: `Density = ${m} g ÷ ${v} cm³ = ${d} g/cm³.${d > 1 ? " It is denser than water (1 g/cm³), so it sinks in water." : ""}`, meta };
  if (want === "m") return { q: `A material has a density of ${d} g/cm³. What is the mass of ${v} cm³ of it, in grams?`, type: "number", answer: m, hint: "If density = mass ÷ volume, then mass = density × volume.", why: `Mass = ${d} g/cm³ × ${v} cm³ = ${m} g.`, meta };
  return { q: `An object of density ${d} g/cm³ has a mass of ${m} g. What is its volume, in cm³?`, type: "number", answer: v, hint: "Rearrange: volume = mass ÷ density.", why: `Volume = ${m} g ÷ ${d} g/cm³ = ${v} cm³.`, meta };
}
// echo: distance = speed × time ÷ 2 (sound in air ≈ 343 m/s at 20 °C)
function echoQ() {
  const t = pick([2, 4, 6, 8, 10, 12]), v = 343, dist = (v * t) / 2;
  return { q: `You shout towards a cliff and hear the echo ${t} seconds later. Sound travels about 343 m/s in air at 20 °C. How far away is the cliff, in metres?`, type: "number", answer: dist, hint: "The sound travels to the cliff AND back. How far does it travel in total?", why: `Total path = 343 × ${t} = ${fmt(v * t)} m. That is there and back, so the cliff is ${fmt(v * t)} ÷ 2 = ${fmt(dist)} m away.`, meta: { kind: "echo", v, t } };
}
// lever balance: F1 × d1 = F2 × d2
function leverQ(units = "N") {
  let F1, d1, d2, F2;
  do { F1 = ri(2, 30) * 10; d1 = ri(1, 12) * 10; d2 = ri(1, 12) * 10; F2 = (F1 * d1) / d2; } while (!Number.isInteger(F2) || d1 === d2 || F2 > 2000);
  return { q: `A lever balances. On one side ${an(F1)} ${F1} ${units} load sits ${d1} cm from the fulcrum. On the other side the effort is applied ${d2} cm from the fulcrum. How large is the effort, in ${units}?`, type: "number", answer: F2, hint: "Law of the lever: force × distance on one side = force × distance on the other.", why: `${F1} × ${d1} = ${fmt(F1 * d1)}. Effort × ${d2} must also equal ${fmt(F1 * d1)}, so effort = ${fmt(F1 * d1)} ÷ ${d2} = ${fmt(F2)} ${units}.`, meta: { kind: "lever", F1, d1, d2 } };
}
// Ohm's law: V = I × R (I in amperes, whole numbers)
function ohmQ() {
  const want = pick(["V", "I", "R"]); const I = ri(1, 6), R = pick([2, 3, 4, 5, 6, 10, 12, 20]), V = I * R;
  const meta = { kind: "ohm", I, R, V, want };
  if (want === "V") return { q: `A current of ${I} A flows through ${an(R)} ${R} Ω resistor. What voltage is across it, in volts?`, type: "number", answer: V, hint: "Ohm's law: V = I × R.", why: `V = ${I} A × ${R} Ω = ${V} V.`, meta };
  if (want === "I") return { q: `${An(V)} ${V} V supply is connected across ${an(R)} ${R} Ω resistor. What current flows, in amperes?`, type: "number", answer: I, hint: "Rearrange V = I × R to find I.", why: `I = V ÷ R = ${V} ÷ ${R} = ${I} A.`, meta };
  return { q: `A current of ${I} A flows when ${V} V is across a component. What is its resistance, in ohms?`, type: "number", answer: R, hint: "Rearrange V = I × R to find R.", why: `R = V ÷ I = ${V} ÷ ${I} = ${R} Ω.`, meta };
}
// pH: each step of 1 = 10× change in acidity (hydrogen-ion concentration)
function phQ() {
  const a = ri(1, 6), b = a + ri(1, 4), f = 10 ** (b - a);
  return { q: `Solution A has pH ${a}. Solution B has pH ${b}. How many times more acidic is A than B (in hydrogen-ion concentration)?`, type: "number", answer: f, hint: "Each 1-step drop in pH means 10 times more hydrogen ions. How many steps apart are they?", why: `The pH values differ by ${b - a}, so A has ${b - a > 1 ? "10" + " × 10".repeat(b - a - 1) + " = " : ""}${fmt(f)} times the hydrogen-ion concentration of B.`, meta: { kind: "ph", a, b } };
}
// speed = distance / time
function speedQ(ctx) {
  const v = ctx?.v || pick([2, 3, 4, 5, 6, 8, 10, 12, 15, 20, 25]), t = ri(2, 30), d = v * t;
  return { q: `${ctx?.who || "An object"} travels ${fmt(d)} m in ${t} s at a steady speed. What is its speed, in m/s?`, type: "number", answer: v, hint: "Speed = distance ÷ time.", why: `${fmt(d)} m ÷ ${t} s = ${v} m/s.`, meta: { kind: "speed", d, t } };
}
// weight on Earth: W = m × g with g ≈ 10 N/kg (simplification of 9.8)
function weightQ() {
  const m = ri(1, 60);
  return { q: `Using the classroom approximation g ≈ 10 N/kg, what is the weight, in newtons, of ${an(m)} ${m} kg object on Earth?`, type: "number", answer: m * 10, hint: "Weight (a force) = mass × gravitational field strength.", why: `W = ${m} kg × 10 N/kg = ${m * 10} N. (The more precise value of g is 9.8 N/kg, which gives ${r1(m * 9.8)} N.)`, meta: { kind: "weight", m } };
}

const lessons = [];
const L = (lesson) => lessons.push(lesson);
// ---- part1.js ----
(() => {
// Lessons 1-8. Lesson 1: how science knows.
{
  const EXPTS = [
    { d: "You test whether the height of a ramp changes how far a toy car rolls.", ind: "the height of the ramp", dep: "the distance the car rolls", ctrl: "the same car released the same way", other: "the colour of the floor tiles" },
    { d: "You test whether the amount of water changes how tall bean plants grow in three weeks.", ind: "the amount of water given", dep: "the height of each plant after three weeks", ctrl: "the same kind of seed and the same amount of light", other: "the name written on each pot" },
    { d: "You test whether the temperature of water changes how fast sugar dissolves.", ind: "the temperature of the water", dep: "the time for the sugar to disappear", ctrl: "the same mass of sugar and the same volume of water", other: "the day of the week" },

  const LIQ = [["honey", 1.42], ["corn syrup", 1.37], ["dish soap", 1.06], ["water", 1.0], ["vegetable oil", 0.92], ["isopropyl alcohol", 0.79]];
  const tower = W(LIQ.map(([n, d], i) => `<rect x='200' y='${40 + (5 - i) * 44}' width='200' height='44' fill='${["#b45309", "#f59e0b", "#22c55e", "#3b82f6", "#facc15", "#e5e7eb"][i]}' stroke='${INK}' stroke-width='1.5'/>` + T(420, 68 + (5 - i) * 44, `${n} ${d}`, 20, INK, "start")).join("") + `<rect x='200' y='40' width='200' height='264' fill='none' stroke='${INK}' stroke-width='4'/>` + T(100, 70, "least dense", 20, GRAY) + T(100, 290, "densest", 20, GRAY));

    title: "The density tower: layers of liquid", icon: "🌈",
    learn: [
      S("Pour honey, washing-up liquid, water and oil carefully into a tall glass and they form separate <b>layers</b>. Each liquid settles according to its <b>density</b>: the densest sinks to the bottom, the least dense floats on top.", svg(tower, "Density tower (g/cm³, approximate)")),
      S("The values are approximate: brands, temperature and water content change them. Note that 1 mL = 1 cm³, so the density in g/mL is the same number as in g/cm³.", tbl([["Liquid", "Density (g/cm³, approx.)"], ...LIQ.map((x) => [x[0], String(x[1])])])),
      S("A solid object dropped into the tower sinks until it reaches a liquid denser than itself. So it comes to rest at the boundary between a liquid less dense than it and one denser than it. A grape or a plastic bead can 'hover' in the middle of the column.", big("an object rests where\nliquid above < object < liquid below")),
      S("To measure a liquid's density: weigh an empty measuring cylinder, add a known volume of liquid, weigh again, and divide the liquid's mass by its volume.", tbl([["Measurement", "Example"], ["empty cylinder", "60 g"], ["cylinder + 50 mL of syrup", "128.5 g"], ["mass of syrup", "68.5 g"], ["density", "68.5 ÷ 50 = 1.37 g/cm³"]])),
      S("Liquids that <b>dissolve</b> in each other, such as water and alcohol, mix instead of layering unless poured very gently, and then they slowly blend. Oil and water do not mix at all: they are <b>immiscible</b>. Temperature matters too: warm water is slightly less dense than cold, which is why a hot drop rises in cold water.", list(["Water + oil: immiscible, stay in layers", "Water + alcohol: miscible, slowly mix", "Warm water floats on cold water (briefly)", "Salt water is denser than fresh water"], "Layers and mixing")),

      S("Between about 600 and 200 BC, Greek thinkers began asking natural questions and arguing about the answers. Some guessed brilliantly; some measured. The difference between those two habits is the heart of science.", tbl([["Thinker", "Born", "Known for"], ...GREEKS.map((g) => [g[0], `${-g[1]} BC`, g[3]])])),
      S("<b>Aristotle</b> was a superb observer of animals, but he also taught that a heavier body falls faster, in proportion to its weight. There is no record that he tested it. John Philoponus (6th century AD) and Simon Stevin (1586) dropped unequal weights and found them landing almost together; Galileo's famous drop from the Leaning Tower of Pisa is probably a legend, but his ramp experiments and arguments settled the question. Authority, however great, must yield to evidence.", big("authority yields\nto evidence")),
      S("<b>Archimedes' principle</b>: an object in a fluid is pushed up by a force equal to the <b>weight of the fluid it displaces</b>. A stone of volume 100 cm³ under water displaces 100 g of water, so it is pushed up by about 1 N (using g ≈ 10 N/kg). The famous 'Eureka' bath story comes from Vitruvius, two centuries later, and may be legend; the principle is certainly in Archimedes' own book On Floating Bodies.", tbl([["Displaced water", "Mass", "Buoyant force (g ≈ 10 N/kg)"], ["100 cm³", "100 g", "1 N"], ["500 cm³", "500 g", "5 N"], ["2,000 cm³", "2 kg", "20 N"]])),

// Course runner: turns COURSE data (one lesson per school week) into an app with the usual shell.
// Each lesson: Learn slides → Practice (hint after the first miss, worked answer after the second) →
// Challenge (contest level) → an off-screen task. No timers, no speed scoring.
// Layout: every screen must fit one screen. After each change the runner measures the panel and the stage
// and shrinks text step by step to a readable floor; only as a last resort does a long explanation or a
// long passage scroll inside its own box (with a fade at the bottom), never the page.
const { $, el, svg: makeSvg, text, panel, wait, confetti, PRAISE, numpad } = KIT;
const stage = $("[data-stage]");
let token = 0;

const UNITS = COURSE.lessons.map((l, i) => ({ id: `l${i + 1}`, label: `${i + 1}. ${l.title}`, icon: l.icon || COURSE.icon }));
const esc = (t) => String(t ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;");
const len = (t) => String(t ?? "").length;
const stop = (t) => (/[.!?…:;]["'”’)]?$/.test(String(t).trim()) ? String(t).trim() : `${String(t).trim()}.`);

// ---------- fitting ----------
let fitFrame = 0;
const refit = () => {
  cancelAnimationFrame(fitFrame);
  fitFrame = requestAnimationFrame(() => {
    fitPanel();
    fitStage();
  });
};
// The owl's bubble. `quiet` keeps the words (and the voice) but hides the bubble, used when the
// question is already printed on the stage so the panel is not spent on the same sentence twice.
function say(html, { quiet = false } = {}) {
  KIT.say(html);
  const box = $("[data-say]");
  if (box) {
    box.innerHTML = `<span class="cr-say-in">${box.innerHTML}</span>`;
    box.classList.toggle("cr-quiet", quiet);
  }
  refit();
}
const atEnd = (box) => box.scrollTop + box.clientHeight >= box.scrollHeight - 2;
const fadeCue = (box) => {
  if (!box) return;
  box.classList.toggle("cr-fade", box.scrollHeight > box.clientHeight + 2 && !atEnd(box));
  if (!box.dataset.cue) {
    box.dataset.cue = "1";
    box.addEventListener("scroll", () => box.classList.toggle("cr-fade", box.scrollHeight > box.clientHeight + 2 && !atEnd(box)), { passive: true });
  }
};
const singleColumn = () => getComputedStyle($(".ap-main") || document.body).gridTemplateColumns.trim().split(/\s+/).length < 2;

function fitPanel() {
  const host = $("[data-panel]");
  if (!host) return;
  const main = $(".ap-main");
  host.classList.add("cr-panel");
  const sayBox = $("[data-say]", host);
  const inner = sayBox && $(".cr-say-in", sayBox);
  host.style.removeProperty("max-height");
  main?.style.removeProperty("grid-template-columns");
  if (inner) inner.style.removeProperty("max-height");
  const over = () => host.scrollHeight - host.clientHeight;
  // A ladder of ever stronger measures; stop at the first that fits. Upright screens may give the panel
  // more height ("tall"); landscape phones give it a wider column ("wide").
  const steps = [
    { k: 1 },
    { k: 0.93 },
    { k: 0.86 },
    { k: 0.86, grow: 1 },
    { k: 0.86, grow: 1, dense: true },
    { k: 0.86, grow: 2, dense: true },
    { k: 0.8, grow: 2, dense: true },
    { k: 0.8, grow: 2, dense: true, scroll: true },
    { k: 0.74, grow: 2, dense: true, scroll: true },
  ];
  const upright = singleColumn();
  for (const s of steps) {
    host.style.setProperty("--k", s.k);
    host.classList.toggle("cr-tight", s.k < 0.9);
    host.classList.toggle("cr-dense", !!s.dense);
    if (s.grow && upright) host.style.maxHeight = s.grow > 1 ? "64vh" : "58vh";
    if (s.grow && !upright && main) main.style.gridTemplateColumns = s.grow > 1 ? "minmax(0, 1fr) minmax(260px, 1.45fr)" : "minmax(0, 1.2fr) minmax(260px, 1fr)";
    if (inner) inner.style.removeProperty("max-height");
    let o = over();
    if (o > 1 && s.scroll && inner && sayBox.offsetParent) {
      // Last resort: the explanation scrolls inside the bubble, never the page.
      const lh = parseFloat(getComputedStyle(inner).lineHeight) || 20;
      const room = inner.offsetHeight - o - 2;
      inner.style.maxHeight = `${Math.max(Math.round(lh * 2.2), room)}px`;
      o = over();
    }
    if (o <= 1) break;
  }
  const choiceList = $("[data-list]", host);
  if (over() > 1 && typeof choiceList?._crCompact === "function") {
    const compact = choiceList._crCompact;
    choiceList._crCompact = null;
    if (compact()) return fitPanel();
  }
  fadeCue(inner);
}

function fitStage() {
  const box = $(".cr-show", stage);
  const body = box && $(".cr-body", box);
  if (!body) return;
  const fits = () => body.scrollHeight <= body.clientHeight + 1 && body.scrollWidth <= body.clientWidth + 1;
  box.style.setProperty("--s", 1);
  if (!fits()) {
    let lo = 0.45, hi = 1;
    for (let n = 0; n < 7; n++) {
      const mid = (lo + hi) / 2;
      box.style.setProperty("--s", mid);
      if (fits()) lo = mid;
      else hi = mid;
    }
    box.style.setProperty("--s", lo);
  }
  // A long, flat table (a few rows, many columns) that is still too wide is turned on its side.
  const table = $(".cr-table", body);
  if (table && !table.dataset.turned && body.scrollWidth > body.clientWidth + 1 && table.rows.length < (table.rows[0]?.cells.length || 0)) {
    const grid = [...table.rows].map((r) => [...r.cells]);
    table.dataset.turned = "1";
    table.innerHTML = grid[0].map((_, c) => `<tr>${grid.map((r) => (r[c] ? r[c].outerHTML : "<td></td>")).join("")}</tr>`).join("");
    table.classList.add("cr-turned");
    return fitStage();
  }
  // Still too wide: tighter cells, and long words may hyphenate.
  if (table && !table.classList.contains("cr-squeeze") && body.scrollWidth > body.clientWidth + 1) {
    table.classList.add("cr-squeeze");
    return fitStage();
  }
  fadeCue(body);
}
addEventListener("resize", refit);
if (window.ResizeObserver) new ResizeObserver(() => requestAnimationFrame(fitStage)).observe(stage);
document.fonts?.ready?.then(refit);

// ---------- the stage ----------
// A slide or question picture: big text, emoji row, a small table, a list, bars, a passage, the lesson's own SVG,
// or (for questions without a picture) the question itself. `tag` is the progress label; `q` prints the question
// above a picture so it stays visible while hints are shown.
function show(visual, { tag = "", q = "" } = {}) {
  stage.innerHTML = "";
  const box = document.createElement("div");
  box.className = "cr-show";
  const v = visual || {};
  let html = "";
  if (v.type === "svg") html = `<div class="cr-svg">${v.markup}</div>`;
  else if (v.type === "emoji") html = `<div class="cr-emoji">${esc(v.text)}</div>`;
  else if (v.type === "table")
    html = `<table class="cr-table">${(v.rows || []).map((r, i) => `<tr>${r.map((c) => (i === 0 && v.header !== false ? `<th>${esc(c)}</th>` : `<td>${esc(c)}</td>`)).join("")}</tr>`).join("")}</table>`;
  else if (v.type === "list") html = `<ul class="cr-list">${(v.items || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
  else if (v.type === "bars") {
    const max = Math.max(...(v.values || []).map((x) => x[1]), 1);
    html = `<div class="cr-bars">${(v.values || []).map(([k, n]) => `<div><span style="height:${Math.round((n / max) * 100)}%"></span><b>${esc(n)}</b><small>${esc(k)}</small></div>`).join("")}</div>`;
  } else if (v.type === "passage") html = `<div class="cr-passage">${v.title ? `<h3>${esc(v.title)}</h3>` : ""}${String(v.text || "").split(/\n\n+/).map((p) => `<p>${esc(p)}</p>`).join("")}</div>`;
  else if (v.type === "prompt") html = `<div class="cr-prompt${len(v.text) > 160 ? " cr-long" : ""}">${String(v.text || "").replace(/<(?!\/?b>)[^>]*>/g, "")}</div>`;
  else html = `<div class="cr-big">${esc(v.text || "")}</div>`;
  const question = q ? `<div class="cr-q">${esc(q)}</div>` : "";
  const cap = v.caption ? `<p class="cr-cap">${esc(v.caption)}</p>` : "";
  box.innerHTML = `${tag ? `<p class="cr-tag">${tag}</p>` : ""}<div class="cr-body cr-${v.type || "big"}-body">${question}${html}${cap}</div>`;
  stage.appendChild(box);
  refit();
}

    const render = () => {

      const s = slides[i];
      show(s.show);
      $("[data-dots]", host).innerHTML = slides.map((_, k) => `<i class="${k === i ? "on" : k < i ? "seen" : ""}"></i>`).join("") + `<small>Learn ${i + 1} of ${slides.length}</small>`;
      $("[data-back]", host).disabled = i === 0;
      $("[data-next]", host).textContent = i === slides.length - 1 ? "✏️ Practice" : "Next ▶";
      say(`${i === 0 ? `<b>${stop(esc(lesson.title))}</b> ` : ""}${s.say}`);
    };
    host.onclick = (event) => {
      if (event.target.closest("[data-back]") && i > 0) (i -= 1), render();
      else if (event.target.closest("[data-next]")) {
        if (i < slides.length - 1) (i += 1), render();
        else {
          VOICE.hush();
          resolve();
        }
      }
    };
    if (slides.length) render();
    else resolve();
  });
}

// One question; resolves with true if right on the first try.
// Make every attempt different: generator questions build fresh numbers, choices are shuffled.
const shuffled = (list) => {
  const out = [...list];
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
};
function fresh(q) {
  let made = q;
  if (typeof q.gen === "function") {
    try {
      made = { ...q, ...q.gen() };
    } catch (error) {
      console.error("question generator failed", error);
    }
  }
  if (made.options && !made.keepOrder) made = { ...made, options: shuffled(made.options) };
  if (made.items && !made.keepOrder) made = { ...made, items: shuffled(made.items) };
  return made;
}
// Draw a set: keep the first (warm-up) question, sample the rest from the bank, keep easy-to-hard roughly by position.
function drawSet(bank, n) {
  if (bank.length <= n) return bank;
  const picks = new Set([0]);
  while (picks.size < n) picks.add(1 + Math.floor(Math.random() * (bank.length - 1)));
  return [...picks].sort((a, b) => a - b).map((k) => bank[k]);
}

// Choice and ordering lists: short words stay as chips; sentence-length entries become a calm grid of cards.
function listClass(list) {
  const longest = Math.max(0, ...list.map(len));
  const total = list.reduce((a, o) => a + len(o), 0);
  if (longest > 34 || (list.length <= 4 && total > 110)) return "cr-cards cr-wide";
  if (longest > 14 || list.length > 4) return "cr-cards";
  return "";
}

// Questions missed on the first try are kept with the lesson's progress (at most 20, newest last) for the
// parent's weekly report and for review warm-ups in later lessons. `src` says where the question lives
// ({ lesson, bank, k }), so a review can ask it again (a generated question comes back with new numbers).
// One answered right on the first try later is taken off the list.
const srcKey = (src) => (src ? `${src.lesson}:${src.bank}:${src.k}` : "");
function remember(q, missed, src) {
  try {
    const id = src ? `l${src.lesson + 1}` : shell.current();
    const text = String(q.q || "").replace(/<[^>]*>/g, "").trim();
    if (!id || !text) return;
    const key = srcKey(src);
    const was = shell.progress()[id]?.missed || [];
    const rest = was.filter((m) => (key && m.src ? m.src !== key : m.q !== text));
    if (!missed && rest.length === was.length) return;
    const answer = Array.isArray(q.answer) && q.answerText == null ? q.answer.join(" → ") : String(q.answerText ?? q.answer);
    shell.mark(id, { missed: missed ? [...rest, { q: text, a: answer.replace(/<[^>]*>/g, ""), at: Date.now(), ...(key ? { src: key } : {}) }].slice(-20) : rest });
  } catch (error) {}
}

// Spaced review: up to three questions missed in EARLIER lessons of this course, at least a day ago,
// oldest first. Each is asked again at the start of the lesson; a first-try answer clears it.
const REVIEW_MAX = 3;
const REVIEW_GAP = 20 * 3600 * 1000;
function reviewFor(index) {
  const found = [];
  const progress = shell.progress();
  for (let i = 0; i < index; i++)
    for (const m of progress[`l${i + 1}`]?.missed || []) {
      if (!m.src || Date.now() - m.at < REVIEW_GAP) continue;
      const [lesson, bank, k] = m.src.split(":");
      const q = COURSE.lessons[Number(lesson)]?.[bank]?.[Number(k)];
      if (q) found.push({ q, at: m.at, src: { lesson: Number(lesson), bank, k: Number(k) } });
    }
  return found.sort((a, b) => a.at - b.at).slice(0, REVIEW_MAX);
}

function ask(q0, label, my, src) {
  const q = fresh(q0);
  return new Promise((resolve) => {
    let tries = 0;
    const type = q.type || (q.options ? "choice" : q.items ? "order" : "number");
    const tag = `${esc(label)}${type === "order" ? ` · <span>tap in order, first to last</span>` : ""}`;
    if (q.show || q.big) show(q.show || { type: "big", text: q.big }, { tag, q: q.q });
    else show({ type: "prompt", text: q.q }, { tag });
    const finish = (right) => {
      if (my !== token) return;
      panel(`<div class="ap-buttons"><button type="button" class="primary" data-go>Next ▶</button></div>`);
      const why = q.why ? `<small>${esc(q.why)}</small>` : "";
      say(right ? `Correct. ${q.why ? esc(q.why) : ""}` : `The answer is <b>${stop(esc(Array.isArray(q.answer) && q.answerText == null ? q.answer.join(" → ") : q.answerText ?? q.answer))}</b> ${why}`);
      $("[data-panel]").onclick = (e) => e.target.closest("[data-go]") && resolve(tries === 1 && right);
    };
    const check = (value) => {
      if (my !== token) return false;
      tries += 1;
      const want = Array.isArray(q.answer) ? q.answer.join("|") : String(q.answer).trim().toLowerCase();
      const got = Array.isArray(value) ? value.join("|") : String(value).trim().toLowerCase();
      if (got === want) {
        if (tries === 1) remember(q, false, src);
        MUSIC.chime();
        window.OC?.count("problems solved");
        finish(true);
        return true;
      }
      MUSIC.oops();
      if (tries === 1) remember(q, true, src);
      if (tries === 1) say(`Not quite. ${q.hint ? esc(q.hint) : "Reconsider the question carefully."}`);
      else finish(false);
      return false;
    };
    // The question is already on the stage, so the owl reads it aloud with the bubble hidden.
    const prompt = () => say(esc(q.q), { quiet: true });
    if (type === "choice") {
      const host = panel(`<div class="ap-chips cr-choices ${listClass(q.options)}" data-list>${q.options.map((o, k) => `<button type="button" data-c="${k}">${esc(o)}</button>`).join("")}</div>`);
      // If even the tightest layout cannot hold these answers, print them on the stage as A, B, C…
      // (which may scroll there) and keep only large lettered buttons in the panel.
      const letter = (k) => String.fromCharCode(65 + k);
      const choiceList = $("[data-list]", host);
      choiceList._crCompact = () => {
        const list = choiceList, body = $(".cr-body", stage);
        // Only for genuinely long answer sets; short ones always fit the card layout.
        if (!list.isConnected || q.options.reduce((a, o) => a + len(o), 0) < 200) return false;
        if (!list || !body || q.options.length > 8) return false;
        const missed = new Set([...list.querySelectorAll(".cr-miss")].map((b) => b.dataset.c));
        list.className = "ap-chips cr-choices cr-letters";
        list.innerHTML = q.options.map((o, k) => `<button type="button" data-c="${k}" aria-label="${letter(k)}: ${esc(o).replace(/"/g, "&quot;")}" ${missed.has(String(k)) ? `disabled class="cr-miss"` : ""}>${letter(k)}</button>`).join("");
        body.insertAdjacentHTML("beforeend", `<ol class="cr-opts">${q.options.map((o, k) => `<li data-li="${k}" class="${missed.has(String(k)) ? "cr-miss" : ""}"><b>${letter(k)}</b><span>${esc(o)}</span></li>`).join("")}</ol>`);
        return true;
      };
      host.onclick = (e) => {
        const b = e.target.closest("[data-c]");
        if (!b || b.disabled) return;
        const ok = check(q.options[Number(b.dataset.c)]);
        if (!ok && my === token && b.isConnected) {
          b.disabled = true;
          b.classList.add("cr-miss");
          $(`.cr-opts [data-li="${b.dataset.c}"]`, stage)?.classList.add("cr-miss");
        }
      };
    } else if (type === "order") {
      let picked = [];
      const host = panel(`<div class="ap-chips cr-choices cr-ordering ${listClass(q.items)}" data-list></div><div class="ap-buttons cr-undo"><button type="button" data-undo>↺ Start over</button></div>`);
      const list = $("[data-list]", host);
      const draw = () => {
        list.innerHTML = q.items
          .map((o, k) => {
            const at = picked.indexOf(k);
            return `<button type="button" data-o="${k}" ${at >= 0 ? `disabled aria-pressed="true"` : ""}><i>${at >= 0 ? at + 1 : ""}</i><span>${esc(o)}</span></button>`;
          })
          .join("");
        $(".cr-undo", host).style.display = picked.length ? "" : "none";
        refit();
      };
      draw();
      host.onclick = (e) => {
        const b = e.target.closest("[data-o]");
        if (e.target.closest("[data-undo]")) (picked = []), draw();
        else if (b && !b.disabled) {
          picked.push(Number(b.dataset.o));
          draw();
          if (picked.length === q.items.length) {
            const value = picked.map((k) => q.items[k]);
            picked = [];
            if (!check(value) && my === token && list.isConnected) draw();
          }
        }
      };
    } else {
      const host = panel(`<div data-pad></div>`);
      numpad($("[data-pad]", host), { onEnter: (v) => check(v), max: 7 });
    }
    prompt();
  });
}

const units = Object.fromEntries(
  COURSE.lessons.map((lesson, i) => [
    `l${i + 1}`,
    async () => {
      const my = token;
      const id = `l${i + 1}`;
      try {
        await learn(lesson, my);
        if (my !== token) return;
        let first = 0;
        const review = reviewFor(i);
        if (review.length) {
          say(`First, a short review: ${review.length === 1 ? "one question" : `${review.length} questions`} missed in an earlier lesson.`);
          await wait(1400);
          if (my !== token) return;
        }
        for (let k = 0; k < review.length; k++) {
          await ask(review[k].q, `🔁 Review ${k + 1} of ${review.length}`, my, review[k].src);
          if (my !== token) return;
        }
        const bankOf = (name) => (lesson[name] || []).map((q, k) => ({ q, k }));
        const practice = drawSet(bankOf("practice"), lesson.practiceCount || 12);
        for (let k = 0; k < practice.length; k++) {
          if (await ask(practice[k].q, `Practice ${k + 1} of ${practice.length}`, my, { lesson: i, bank: "practice", k: practice[k].k })) first += 1;
          if (my !== token) return;
        }
        const challenge = drawSet(bankOf("challenge"), lesson.challengeCount || 3);
        for (let k = 0; k < challenge.length; k++) {
          say("Challenge problem. Understand it, make a plan, carry it out, then check.");
          await wait(1200);
          if (my !== token) return;
          await ask(challenge[k].q, `⭐ Challenge ${k + 1} of ${challenge.length}`, my, { lesson: i, bank: "challenge", k: challenge[k].k });
          if (my !== token) return;
        }
        shell.mark(id, { done: true, first, of: practice.length, doneAt: Date.now() });
        show({ type: "big", text: `${first} / ${practice.length}`, caption: "practice problems correct on the first attempt" });
        panel(`<div class="ap-buttons"><button type="button" class="primary" data-explain>🗣️ Explain it</button><button type="button" data-off>📝 Task</button>${lesson.extend ? `<button type="button" data-extend>🚀 Go further</button>` : ""}<button type="button" data-again>↺ Again</button></div>`);
        say(`Lesson complete. Now explain the main idea in your own words.`);
        $("[data-panel]").onclick = (e) => {
          if (e.target.closest("[data-again]")) shell.go(id);
          if (e.target.closest("[data-explain]")) {
            show({ type: "list", items: [`Explain to a grown-up, in 3 or 4 clear sentences, the main idea of "${lesson.title}".`, "Give one example of your own.", "Say one question you still have."] });
            say("Explain the main idea in three or four clear sentences, give an example of your own, and ask one question you still have.");
          }
          if (e.target.closest("[data-extend]")) {
            show({ type: "list", items: [lesson.extend] });
            say(esc(lesson.extend), { quiet: true });
          }
          if (e.target.closest("[data-off]")) {
            show({ type: "list", items: [lesson.offline || "Tell a grown-up what you learned today, in 5 sentences."] });
            say(esc(lesson.offline || "Tell a grown-up what you learned today."), { quiet: true });
          }
        };
      } catch (error) {
        console.error(error);
      }
    },
  ]),
);

const how = Object.fromEntries(UNITS.map((u) => [u.id, { icon: COURSE.icon, title: u.label.replace(/^\d+\.\s*/, ""), steps: ["Learn: study the lesson slides.", "Practice: solve each problem; a first miss gives a hint, a second shows the full reasoning.", "Challenge: contest-level problems. Then explain the main idea in your own words."] }]));
const fromHash = /^#l\d+$/.test(location.hash) && UNITS.some((u) => u.id === location.hash.slice(1)) ? location.hash.slice(1) : null;
const shell = SHELL({
  unitWord: "Lesson",
  units: UNITS,
  how,
  start: fromHash || UNITS[0].id,
  onStop() {
    token += 1;
    $("[data-panel]").onclick = null;
  },
  subject: COURSE.subject,
  activity: COURSE.title,
  onUnit(id) {
    token += 1;

});

// The shell's "turn sideways" tip normally floats at the bottom of the screen, over the answer buttons.
// Here it sits at the foot of the stage (never over a control) and a tap dismisses it.
const placeTip = () => {
  const tip = $(".ap-turn");
  if (!tip) return;
  if (!tip.dataset.placed) {
    tip.dataset.placed = "1";
    tip.classList.add("cr-turn");
    tip.insertAdjacentHTML("beforeend", ` <b aria-hidden="true">✕</b>`);
    tip.setAttribute("role", "button");
    tip.addEventListener("click", () => tip.remove());
  }
  const r = stage.getBoundingClientRect();
  tip.style.bottom = "auto";
  tip.style.top = `${Math.max(4, Math.round(r.bottom - tip.offsetHeight - 10))}px`;
};
placeTip();
addEventListener("resize", placeTip);
if (window.ResizeObserver) new ResizeObserver(placeTip).observe(stage);

.cr-opts{list-style:none;margin:0;padding:0;display:grid;gap:calc(8px * var(--s));width:100%;max-width:40em;text-align:left;font:650 max(13.5px,calc(clamp(15px,2vw,19px) * var(--s)))/1.4 var(--sans);color:var(--ink)}
.cr-opts li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:calc(8px * var(--s)) 12px;border-radius:14px;background:var(--accent-soft)}
.cr-opts li b{display:grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;background:var(--accent);color:#fff;font-weight:900}
.cr-opts li.cr-miss{opacity:.45;text-decoration:line-through}
.ap-panel.cr-panel .cr-choices.cr-letters{display:flex;flex-wrap:nowrap;justify-content:center;gap:10px}
.ap-panel.cr-panel .cr-choices.cr-letters button{flex:1 1 0;max-width:110px;min-height:52px;font-size:22px;font-weight:900;text-decoration:none}

/* tap targets stay at least 44 px even on short landscape phones */
.ap-panel.cr-panel .ap-buttons button,.ap-panel.cr-panel .kt-step-btn{min-height:46px}
@media (max-height:460px),(max-width:420px) and (max-height:720px){.ap-panel.cr-panel{--say:15.5px}.ap-panel.cr-panel .kt-keys button{min-height:44px !important}.ap-panel.cr-panel .kt-entry{min-height:40px !important}}
@media (max-height:460px){.ap-panel.cr-panel .ap-buttons button,.ap-panel.cr-panel .kt-step-btn{min-height:44px}.ap-panel.cr-panel .cr-choices button{min-height:44px}.cr-show{padding:8px 10px}.cr-tag{font-size:12.5px;padding:3px 10px}}
