    { q: "How many times does “thin” appear in “a little thin face and a little thin body, thin light hair”?", type: "number", answer: 3, hint: "Count them.", why: "thin face, thin body, thin hair: 3. The repetition stresses how frail and unloved she seems." },
    { q: "Which word has the SAME morpheme pattern (prefix + root + -able) as “disagreeable”?", options: ["uncomfortable", "comfort", "agreement", "disagree"], answer: "uncomfortable", hint: "Look for prefix, root, and -able.", why: "un + comfort + able, just like dis + agree + able." },
    { q: "The prefix “dis-” in disagreeable means...", options: ["not", "very", "again", "before"], answer: "not", hint: "disagree = not agree.", why: "dis- reverses or negates the root." },
    { q: "Where is Misselthwaite Manor?", options: ["Yorkshire, England", "India", "London", "Scotland"], answer: "Yorkshire, England", hint: "Look at the vocabulary table.", why: "Her uncle’s house is on the Yorkshire moors in England." },
    { q: "Put Mary’s early life in order.", type: "order", items: ["She is sent to Misselthwaite Manor", "She is born in India", "She is handed to an Ayah"], answer: ["She is born in India", "She is handed to an Ayah", "She is sent to Misselthwaite Manor"], hint: "The novel begins near the end of this sequence and looks back.", why: "Born in India, given to an Ayah, later sent to England." },
  ],
  challenge: [
    { q: "Why might Burnett begin with an UNLIKEABLE heroine?", options: ["So that her transformation will be greater and more moving", "Because she disliked Mary", "To make readers stop reading", "Because all heroines are unlikeable"], answer: "So that her transformation will be greater and more moving", hint: "Remember Scrooge.", why: "Like Dickens with Scrooge, Burnett starts low so that the change, as Mary grows healthy and kind, is dramatic and earned." },
    { q: "The first chapter is titled “There Is No One Left.” Combining that title with this opening, what can you predict?", options: ["Mary will be left alone and must learn to live and love without her parents", "Mary will become a queen", "Mary will return to India happily", "Her parents will become kind"], answer: "Mary will be left alone and must learn to live and love without her parents", hint: "Why would she be sent to her uncle?", why: "The title and her being sent to an uncle signal that her parents are gone; she must find connection anew." },
    { q: "Burnett writes that Mary’s face was yellow “because she had been born in India,” and explains how her parents neglected her. What narrative stance do these explanations show?", options: ["The narrator judges Mary honestly but also wants us to understand the causes", "The narrator hates Mary completely", "The narrator knows nothing about Mary", "The narrator is Mary"], answer: "The narrator judges Mary honestly but also wants us to understand the causes", hint: "Does the narrator only criticise, or also explain?", why: "The narrator is honest (“It was true, too”) but fair, giving reasons. This balance invites sympathy without sentimentality." },
  ],
  extend: "Read Chapters 1–4 of The Secret Garden. Keep a “Mary log”: every time she does or says something sour, or something new and better, note it with the page number. You will use it in later lessons.",
  offline: "Begin The Secret Garden (shorter sittings). Do the baking-soda fizz lab. Written response: write 5 sentences describing a character who seems unpleasant but whose past explains them, modelled on Burnett’s honest-but-fair narrator.",
},
],
[
// ═════════ Lesson 17 — Rhythm: From a Railway Carriage ═════════
{
  title: "Rhythm and metre: the railway poem", icon: "🚂",
  learn: [
    { say: "<b>Metre</b> is the pattern of stressed and unstressed syllables in a line of verse. Poets choose a metre to make the <b>sound</b> of a poem act out its <b>sense</b>.", show: { type: "table", rows: [["Foot", "Pattern", "Example"], ["iamb", "da-DUM", "a-BOVE"], ["trochee", "DUM-da", "HEDG-es"], ["dactyl", "DUM-da-da", "FAST-er than"], ["anapest", "da-da-DUM", "in the WINK"]] } },
    { say: "Robert Louis Stevenson, <b>A Child’s Garden of Verses</b> (1885). Read it aloud as quickly as you can while staying clear.", show: { type: "passage", title: "From a Railway Carriage — Robert Louis Stevenson (1885)", text: "Faster than fairies, faster than witches, / Bridges and houses, hedges and ditches; / And charging along like troops in a battle, / All through the meadows the horses and cattle: / All of the sights of the hill and the plain / Fly as thick as driving rain; / And ever again, in the wink of an eye, / Painted stations whistle by." } }, { say: "The second stanza. Keep the same quick beat.", show: { type: "passage", title: "From a Railway Carriage (continued)", text: "Here is a child who clambers and scrambles, / All by himself and gathering brambles; / Here is a tramp who stands and gazes; / And there is the green for stringing the daisies! / Here is a cart run away in the road / Lumping along with man and load; / And here is a mill, and there is a river: / Each a glimpse and gone for ever!" } },
    { say: "The opening line falls into <b>dactyls</b>: DUM-da-da, DUM-da-da. Like the wheels of a train, the beat goes <b>clickety, clickety</b>.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif' font-weight='800' text-anchor='middle'><g font-size='26' fill='#0f172a'><text x='70' y='120'>FAST</text><text x='140' y='120'>er</text><text x='200' y='120'>than</text><text x='280' y='120'>FAIR</text><text x='350' y='120'>ies,</text></g><g font-size='26' fill='#0f172a'><text x='70' y='220'>FAST</text><text x='140' y='220'>er</text><text x='200' y='220'>than</text><text x='280' y='220'>WITCH</text><text x='350' y='220'>es</text></g><g fill='#b91c1c'><circle cx='70' cy='70' r='12'/><circle cx='280' cy='70' r='12'/><circle cx='70' cy='170' r='12'/><circle cx='280' cy='170' r='12'/></g><g fill='#94a3b8'><circle cx='140' cy='70' r='7'/><circle cx='200' cy='70' r='7'/><circle cx='350' cy='70' r='7'/><circle cx='140' cy='170' r='7'/><circle cx='200' cy='170' r='7'/><circle cx='350' cy='170' r='7'/></g><text x='490' y='120' font-size='22' fill='#b91c1c'>● stressed</text><text x='490' y='160' font-size='22' fill='#64748b'>● unstressed</text><text x='300' y='290' font-size='22' fill='#334155'>DUM-da-da | DUM-da (dactyl, then trochee)</text></svg>" } },
    { say: "Notice the <b>catalogue</b> (a rapid list) of things seen from the window, each appearing for an instant. The final line states the poem’s insight: <b>“Each a glimpse and gone for ever!”</b>", show: { type: "list", items: ["Sound: fast dactyls imitate the wheels", "Structure: a list of flashing images", "Rhyme: couplets (witches/ditches) snap shut quickly", "Insight: experience passes, never to return"] } },
    { say: "Connection to this week’s history. At the first Olympic Games, traditionally dated to 776 BC, the one event was a sprint of one <b>stadion</b>, about 192 metres at Olympia. Our word <b>stadium</b> comes from it.", show: { type: "big", text: "stadion (Greek race length)\n→ stadium" } },
    { say: "Word study. Greek <b>metron</b> means “measure.” A poem’s metre measures its beats, just as a thermometer measures heat.", show: { type: "table", rows: [["Word", "Parts", "Meaning"], ["metre / meter", "metron", "a measure (of length, or of verse)"], ["thermometer", "thermo (heat) + metron", "heat-measurer"], ["symmetry", "sym (together) + metron", "matching measure on both sides"], ["metronome", "metron + nomos (law)", "a device that keeps the beat for musicians"]] } },
  ],
  practice: [
    { q: "What is the speaker doing?", options: ["Looking out of a fast-moving train window", "Running through a meadow", "Riding a horse in battle", "Painting a station"], answer: "Looking out of a fast-moving train window", hint: "Read the title.", why: "The title and the rushing images show a view from a railway carriage." },
    { q: "Why does Stevenson use a fast, galloping rhythm?", options: ["To imitate the speed and sound of the train", "To make the poem sad", "Because slow poems are wrong", "To imitate rain"], answer: "To imitate the speed and sound of the train", hint: "Read it aloud. What does the beat sound like?", why: "The rapid dactyls sound like wheels on rails: sound echoes sense." },
    { q: "“Faster than fairies” has which stress pattern at the start?", options: ["DUM-da-da (a dactyl)", "da-DUM (an iamb)", "da-da-DUM (an anapest)", "no stresses"], answer: "DUM-da-da (a dactyl)", hint: "FAST-er-than…", why: "FAST-er-than: one stressed and two unstressed syllables, a dactyl." },
    { q: "“Charging along like troops in a battle” is a...", options: ["simile", "metaphor", "personification", "onomatopoeia"], answer: "simile", hint: "Look for like or as.", why: "It compares the animals’ apparent rush to troops, using “like.”" },
    { q: "Why do the horses and cattle SEEM to charge, though they may be standing still?", options: ["The train’s motion makes the landscape appear to rush past", "They are frightened of the train", "They are racing the train", "They are in a battle"], answer: "The train’s motion makes the landscape appear to rush past", hint: "Who is really moving?", why: "Relative motion: from the moving train, still fields seem to charge by." },
    { q: "“Painted stations whistle by.” What really makes the whistling sound?", options: ["the speeding train and the rushing air", "the station-masters", "birds on the platforms", "the paint on the stations"], answer: "the speeding train and the rushing air", hint: "Who is really moving: the stations or the passenger?", why: "Stations cannot whistle or move. The poem gives the stations the sound and speed of the train, so they seem to fly past like something whistling through the air." },
    { q: "Which line states the poem’s central INSIGHT?", options: ["Each a glimpse and gone for ever!", "Faster than fairies, faster than witches,", "Here is a tramp who stands and gazes;", "Lumping along with man and load;"], answer: "Each a glimpse and gone for ever!", hint: "Which line sums up everything seen?", why: "Every sight is glimpsed only once and lost: the poem’s reflection on fleeting experience." },
    { q: "What does the word “catalogue” mean in poetry?", options: ["a rapid list of images or items", "a shop’s book of products", "a rhyme scheme", "a type of foot"], answer: "a rapid list of images or items", hint: "Stanza 2 lists child, tramp, green, cart, mill, river.", why: "A catalogue is a list in verse, creating abundance and speed." },
    { q: "How many lines are in each stanza?", type: "number", answer: 8, hint: "Count the slashes plus one.", why: "Two stanzas of 8 lines each." },
    { q: "How many separate sights does the second stanza list (child, tramp, green, cart, mill, river)?", type: "number", answer: 6, hint: "Count each “Here is” or “there is.”", why: "child, tramp, green, cart, mill, river: 6." },
    { q: "The first Olympic race was one stadion long, about how many metres at Olympia?", type: "number", answer: 192, hint: "See the history slide.", why: "About 192 metres." },
    { q: "Thermometer means...", options: ["heat-measurer", "fast-runner", "sound-maker", "light-bender"], answer: "heat-measurer", hint: "thermo + metron.", why: "thermo (heat) + metron (measure)." },
    { q: "Symmetry means...", options: ["having matching measure on both sides", "measuring heat", "a fast poem", "a musical beat"], answer: "having matching measure on both sides", hint: "sym = together; metron = measure.", why: "Symmetry: parts that measure alike on either side of a line." },
    { q: "Match the order of the opening images.", type: "order", items: ["horses and cattle", "painted stations", "bridges and houses", "driving rain"], answer: ["bridges and houses", "horses and cattle", "driving rain", "painted stations"], hint: "Read stanza 1 again.", why: "Bridges and houses, horses and cattle, sights like driving rain, then stations." },
  ],
  challenge: [
    { q: "The poem ends with “gone for ever.” How does this change the MOOD of a poem that began so excitedly?", options: ["It adds a note of wistfulness: the thrill of speed comes with loss", "It makes the poem angry", "It has no effect", "It shows the train has crashed"], answer: "It adds a note of wistfulness: the thrill of speed comes with loss", hint: "How do you feel about something you will never see again?", why: "Speed is thrilling, but everything glimpsed is lost. The last line turns excitement into a quiet reflection on transience." },
    { q: "Why might Stevenson have chosen RHYMING COUPLETS, which close every two lines, for this poem?", options: ["Each quick rhyme snaps shut like a passing view, keeping pace with the train", "Couplets are the slowest form", "To make the poem harder to read", "Because trains rhyme"], answer: "Each quick rhyme snaps shut like a passing view, keeping pace with the train", hint: "How long does each pair last before a new rhyme starts?", why: "Each two-line unit is a quick flash that is completed and replaced, mirroring the flickering scenes." },
    { q: "A “metronome” helps a pianist keep a steady beat. Which root pair builds it?", options: ["metron (measure) + nomos (law, rule)", "metro (city) + gnome", "meter (poem) + home", "mater (mother) + nome"], answer: "metron (measure) + nomos (law, rule)", hint: "It rules the measure of the music.", why: "metron + nomos: “measure-law,” an instrument that governs tempo." },
  ],
  extend: "Read W. H. Davies’s short poem “Leisure” (1911), which asks what life is worth if we have no time to stand and stare, and compare it with Stevenson’s poem: one celebrates speed, the other stillness. Write a paragraph on which you agree with, and why.",
  offline: "Continue The Secret Garden and your Story of the World chapter on the early Greeks and the first Olympics. Do the density-tower lab. Oral response: recite “From a Railway Carriage” while tapping the beat; then explain to a grown-up why its rhythm suits its subject.",
},
// ═════════ Lesson 18 — Review: Lear ═════════
{
  title: "Review: The Owl and the Pussy-cat", icon: "🦉",
  learn: [
    { say: "Review lesson. Edward Lear published <b>“The Owl and the Pussy-cat”</b> in 1871. It is nonsense, but carefully crafted nonsense. Use every tool so far: plot, character, rhythm, rhyme, invented words.", show: { type: "list", items: ["Internal rhyme: a rhyme inside a single line", "Refrain: words repeated at the end of each stanza", "Nonsense word: an invented word that sounds meaningful", "Ballad-like narrative: a story told in song-like stanzas"] } },
    { say: "Stanza 1.", show: { type: "passage", title: "The Owl and the Pussy-cat — Edward Lear (1871)", text: "The Owl and the Pussy-Cat went to sea / In a beautiful pea-green boat: / They took some honey, and plenty of money / Wrapped up in a five-pound note. / The Owl looked up to the stars above, / And sang to a small guitar, / “O lovely Pussy, O Pussy, my love, / What a beautiful Pussy you are, / You are, / You are! / What a beautiful Pussy you are!”" } },
    { say: "Stanza 2.", show: { type: "passage", title: "The Owl and the Pussy-cat (continued)", text: "Pussy said to the Owl, “You elegant fowl, / How charmingly sweet you sing! / Oh! let us be married; too long we have tarried: / But what shall we do for a ring?” / They sailed away, for a year and a day, / To the land where the bong-tree grows; / And there in a wood a Piggy-wig stood, / With a ring at the end of his nose, / His nose, / His nose, / With a ring at the end of his nose." } },
    { say: "Stanza 3.", show: { type: "passage", title: "The Owl and the Pussy-cat (end)", text: "“Dear Pig, are you willing to sell for one shilling / Your ring?” Said the Piggy, “I will.” / So they took it away, and were married next day / By the Turkey who lives on the hill. / They dined on mince and slices of quince, / Which they ate with a runcible spoon; / And hand in hand, on the edge of the sand, / They danced by the light of the moon, / The moon, / The moon, / They danced by the light of the moon." } },
    { say: "Lear’s craft. <b>Internal rhymes</b> inside lines (honey/money, Owl/fowl, married/tarried, mince/quince, hand/sand) make the verse bounce. The <b>refrain</b> echoes the last words of each stanza, like a song.", show: { type: "table", rows: [["Line", "Internal rhyme"], ["They took some honey, and plenty of money", "honey / money"], ["Oh! let us be married; too long we have tarried", "married / tarried"], ["They dined on mince and slices of quince", "mince / quince"], ["And hand in hand, on the edge of the sand", "hand / sand"]] } },
    { say: "Word study and money. Before 1971, British money used pounds and shillings: <b>20 shillings = 1 pound</b>. And “runcible” is Lear’s invention; no one knows exactly what a runcible spoon is, which is the joke.", show: { type: "table", rows: [["Old British money", "Value"], ["1 pound (£1)", "20 shillings"], ["1 shilling", "12 pence"], ["a five-pound note", "100 shillings"]] } },
  ],
  practice: [
    { q: "In what did the Owl and the Pussy-cat go to sea?", options: ["a beautiful pea-green boat", "a five-pound note", "a bong-tree", "a runcible spoon"], answer: "a beautiful pea-green boat", hint: "Line 2.", why: "“In a beautiful pea-green boat.”" },
    { q: "“They took some honey, and plenty of money” contains...", options: ["internal rhyme", "a simile", "a metaphor", "no rhyme"], answer: "internal rhyme", hint: "Do two words rhyme INSIDE the line?", why: "honey / money rhyme within one line: internal rhyme." },
    { q: "What is the PROBLEM in stanza 2?", options: ["They want to marry but have no ring", "Their boat sinks", "They run out of honey", "The Owl cannot sing"], answer: "They want to marry but have no ring", hint: "“But what shall we do for a ring?”", why: "The conflict is the missing ring." },
    { q: "How is the problem SOLVED?", options: ["They buy the Piggy-wig’s nose-ring for one shilling", "The Owl makes a ring", "The Turkey gives them one", "They find one in the sea"], answer: "They buy the Piggy-wig’s nose-ring for one shilling", hint: "Stanza 3, first lines.", why: "“Are you willing to sell for one shilling your ring?” “I will.”" },
    { q: "How long did they sail?", options: ["a year and a day", "a week", "one night", "ten years"], answer: "a year and a day", hint: "Stanza 2.", why: "“They sailed away, for a year and a day.” (A traditional fairy-tale span.)" },
    { q: "Who married them?", options: ["the Turkey who lives on the hill", "the Piggy-wig", "the moon", "a sailor"], answer: "the Turkey who lives on the hill", hint: "Stanza 3.", why: "“married next day / By the Turkey who lives on the hill.”" },
    { q: "How many shillings were in a five-pound note?", type: "number", answer: 100, hint: "1 pound = 20 shillings.", why: "5 × 20 = 100 shillings." },
    { q: "The ring cost one shilling. How many pence was that?", type: "number", answer: 12, hint: "1 shilling = ? pence.", why: "1 shilling = 12 pence." },
    { q: "What is the purpose of the REFRAIN (“You are, / You are!”; “His nose, / His nose”)?", options: ["It creates a song-like echo and closes each stanza playfully", "It corrects a mistake", "It introduces a new character", "It explains the plot"], answer: "It creates a song-like echo and closes each stanza playfully", hint: "What do choruses do in songs?", why: "Repeating the last phrase twice gives a musical, comic ending to each stanza." },
    { q: "“Runcible” is...", options: ["a nonsense word invented by Lear", "a type of metal", "an old word for silver", "a French word for spoon"], answer: "a nonsense word invented by Lear", hint: "See the word-study slide.", why: "Lear invented it; its vagueness is part of the charm." },
    { q: "“Too long we have tarried.” Tarried means...", options: ["delayed, waited", "travelled", "argued", "eaten"], answer: "delayed, waited", hint: "If you have waited too long to marry…", why: "To tarry is to linger or delay." },
    { q: "Which pair of characters is the most UNLIKELY couple, and why does it matter?", options: ["An owl and a cat: a bird courted by the kind of animal that hunts birds, which makes their love comic and sweet", "A pig and a turkey", "The moon and the sand", "Two owls"], answer: "An owl and a cat: a bird courted by the kind of animal that hunts birds, which makes their love comic and sweet", hint: "Would an owl and a cat normally be friends?", why: "A cat, which hunts birds, and a bird becoming a devoted couple is the central nonsense joke, and it is tender too." },
    { q: "Put the story events in order.", type: "order", items: ["They dance by the light of the moon", "The Owl sings to a small guitar", "They buy the ring", "They sail for a year and a day"], answer: ["The Owl sings to a small guitar", "They sail for a year and a day", "They buy the ring", "They dance by the light of the moon"], hint: "Song, voyage, ring, celebration.", why: "Stanza 1 song, stanza 2 voyage, stanza 3 ring and wedding dance." },
  ],
  challenge: [
    { q: "Lear’s poem follows the shape of a classic love story: courtship, a quest, an obstacle, a wedding. Why does using that serious shape make the nonsense FUNNIER?", options: ["The familiar love-story shape makes the absurd details stand out", "Because love stories are always funny", "It makes the poem serious", "It hides the plot"], answer: "The familiar love-story shape makes the absurd details stand out", hint: "Compare with Jabberwocky’s hero quest.", why: "As in Jabberwocky, a solemn form filled with absurd content creates comedy through contrast." },
    { q: "Which line BEST shows that Lear’s nonsense still has warmth and genuine feeling?", options: ["And hand in hand, on the edge of the sand, / They danced by the light of the moon", "Wrapped up in a five-pound note", "Which they ate with a runcible spoon", "By the Turkey who lives on the hill"], answer: "And hand in hand, on the edge of the sand, / They danced by the light of the moon", hint: "Which image is tender rather than silly?", why: "The moonlit dance hand in hand is a sincerely romantic image; it gives the poem its lasting tenderness." },
    { q: "The five-pound note held 100 shillings, and the ring cost 1. What fraction of their money did the ring cost?", options: ["one hundredth", "one fifth", "one twentieth", "one half"], answer: "one hundredth", hint: "1 out of how many shillings?", why: "1 shilling out of 100 = 1/100: a bargain, which adds to the comedy." },
  ],
  extend: "Read Lear’s “The Jumblies” and “The Pobble Who Has No Toes.” Make a glossary of every nonsense word, with your best guess at its meaning and the clue that led you there.",
  offline: "Continue The Secret Garden and read a chapter book alone. Portfolio: a dated narration. Written response: write a third stanza for a nonsense poem of your own, using at least two internal rhymes, one invented word and a refrain.",
},
// ═════════ Lesson 19 — Athens and Sparta: rhetoric and style ═════════
{
  title: "Two styles of speech: Athens and Sparta", icon: "🏛️",
  learn: [
    { say: "<b>Style</b> is how something is said; <b>rhetoric</b> is the art of using language to persuade. Athens and Sparta, rival Greek city-states, were famous for opposite styles.", show: { type: "table", rows: [["", "Athens", "Sparta"], ["Government", "democracy (rule by citizens)", "kings, elders, a warrior state"], ["Valued", "debate, art, philosophy", "discipline, endurance, war"], ["Style of speech", "eloquent, elaborate", "laconic: brief and blunt"]] } },
    { say: "Spartans were famous for answers of a word or two. The writer Plutarch (about AD 46–120) collected their sayings centuries after the events, so treat them as famous reports, not recordings: some may be legend. Here are three, retold for this course.", show: { type: "passage", title: "Spartan sayings reported by Plutarch (Moralia), retold", text: "Philip of Macedon threatened the Spartans: “If I bring my army into your land, I will destroy you.” The Spartans replied with one word: “If.”\n\nAt Thermopylae, the Persian king Xerxes demanded that the Spartans hand over their weapons. King Leonidas answered: “Come and take them.”\n\nA Spartan mother, handing her son his shield before battle, said: “Either with this, or on this.”" } },
    { say: "Now hear Athens. The historian Thucydides records a funeral speech given by the Athenian leader Pericles in 431 BC. Thucydides himself warns (Book 1, chapter 22) that he could not recall speeches word for word, so he made speakers say what the occasion demanded, “adhering as closely as possible to the general sense of what they really said.” So this is Thucydides’ version of Pericles. This is the 1874 translation by Richard Crawley.", show: { type: "passage", title: "Pericles’ Funeral Oration — Thucydides, History of the Peloponnesian War, 2.37 (trans. Richard Crawley, 1874)", text: "Our constitution does not copy the laws of neighbouring states; we are rather a pattern to others than imitators ourselves. Its administration favours the many instead of the few; this is why it is called a democracy." } },
    { say: "Pericles uses <b>antithesis</b>: balanced opposites in parallel form. <b>a pattern</b> vs <b>imitators</b>; <b>the many</b> vs <b>the few</b>. The balance makes the claim sound inevitable.", show: { type: "list", items: ["“a pattern to others” ↔ “imitators ourselves”", "“the many” ↔ “the few”", "Antithesis: contrasting ideas in balanced phrases", "Effect: confident, memorable, persuasive"] } },
    { say: "Each style suits its city. Sparta’s brevity projects discipline and fearlessness: wasting no words, as soldiers waste no movements. Athens’ eloquence projects a confident, argumentative democracy, where citizens must persuade one another.", show: { type: "big", text: "Style reflects values." } },
    { say: "Word study. Sparta’s region was <b>Laconia</b>, so brief speech is <b>laconic</b>. Greek <b>demos</b> (people) + <b>kratos</b> (power) gives <b>democracy</b>, and -cracy gives other forms of rule.", show: { type: "table", rows: [["Word", "Parts", "Meaning"], ["democracy", "demos + kratos", "rule by the people"], ["aristocracy", "aristos (best) + kratos", "rule by a noble few"], ["autocracy", "autos (self) + kratos", "rule by one person"], ["laconic", "Lakōn (a Spartan)", "using very few words"]] } },
  ],
  practice: [
    { q: "Why is the Spartans’ reply “If” so effective?", options: ["In one word it mocks the threat and shows they are unafraid", "It shows they did not understand Philip", "It is a polite agreement", "It asks a question about the army"], answer: "In one word it mocks the threat and shows they are unafraid", hint: "What does “If” suggest about whether Philip will succeed?", why: "“If” implies Philip may never manage it: a cool, defiant reply that turns his threat back on him." },
    { q: "“Laconic” means...", options: ["using very few words", "very loud", "very long-winded", "from Athens"], answer: "using very few words", hint: "It comes from Laconia, Sparta’s region.", why: "Spartans were famous for brevity, so laconic = terse." },
    { q: "“Come and take them.” What attitude does Leonidas show?", options: ["Defiant courage", "Fear", "Polite agreement", "Confusion"], answer: "Defiant courage", hint: "Is he handing over the weapons?", why: "He refuses and dares the enemy to try: defiance in four words." },
    { q: "“Either with this, or on this.” What does the mother mean?", options: ["Come home victorious with your shield, or be carried home dead on it", "Carry two shields", "Leave your shield behind", "Sell the shield"], answer: "Come home victorious with your shield, or be carried home dead on it", hint: "Fallen Spartans were carried home on their shields. Who dropped a shield? Someone fleeing.", why: "Returning with it means victory; on it means honourable death; losing it meant running away in disgrace." },
    { q: "What does Pericles say is the relation between Athens and its neighbours’ laws?", options: ["Athens is a pattern for others rather than an imitator", "Athens copies its neighbours", "Athens has no laws", "Athens obeys Sparta"], answer: "Athens is a pattern for others rather than an imitator", hint: "Read the first sentence.", why: "“we are rather a pattern to others than imitators ourselves.”" },
    { q: "According to Pericles, why is Athens called a democracy?", options: ["Its administration favours the many instead of the few", "It has a king", "It has the best army", "It copies Sparta"], answer: "Its administration favours the many instead of the few", hint: "Find “this is why.”", why: "“Its administration favours the many instead of the few; this is why it is called a democracy.”" },
    { q: "“The many instead of the few” is an example of...", options: ["antithesis", "onomatopoeia", "simile", "a laconic reply"], answer: "antithesis", hint: "Two opposites in a balanced phrase.", why: "Many ↔ few, set in parallel: antithesis." },
    { q: "Which form of government is “rule by one person”?", options: ["autocracy", "democracy", "aristocracy", "theocracy"], answer: "autocracy", hint: "autos = self.", why: "auto (self) + cracy (rule)." },
    { q: "“Aristocracy” originally meant rule by...", options: ["the best", "the oldest", "the richest only", "the people"], answer: "the best", hint: "aristos = best.", why: "aristos (best) + kratos: rule by those considered best, in practice a noble class." },
    { q: "Which word BEST describes the Athenian style shown here?", options: ["eloquent and balanced", "laconic", "silent", "rude"], answer: "eloquent and balanced", hint: "Compare the length and shaping of Pericles’ sentences with the Spartan replies.", why: "Pericles builds polished, balanced sentences: eloquence." },
    { q: "In what year (BC) did Pericles give the Funeral Oration?", type: "number", answer: 431, hint: "Look at the introduction to the passage.", why: "431 BC, in the first year of the Peloponnesian War." },
    { q: "In English, how many words are in Leonidas’ reported reply, “Come and take them”?", type: "number", answer: 4, hint: "Count them.", why: "Come / and / take / them: 4. (In Plutarch’s Greek it is only two: molōn labe.)" },
    { q: "Put these in order from FEWEST to MOST words.", type: "order", items: ["“Come and take them.”", "“If.”", "“Either with this, or on this.”"], answer: ["“If.”", "“Come and take them.”", "“Either with this, or on this.”"], hint: "Count each.", why: "1 word, 4 words, 6 words." },
  ],
  challenge: [
    { q: "Why might a society of soldiers value LACONIC speech?", options: ["Brevity shows self-control and calm under threat, the virtues a warrior state prized", "Spartans could not read", "Long speeches were illegal everywhere", "They spoke a different language"], answer: "Brevity shows self-control and calm under threat, the virtues a warrior state prized", hint: "Connect the style to the values in the table.", why: "Saying little, coolly, signals discipline and fearlessness. Style mirrors a culture’s ideals." },
    { q: "Why does a DEMOCRACY need eloquence more than a warrior kingdom does?", options: ["In a democracy, decisions are made by persuading many citizens in open debate", "Democracies have no soldiers", "Kings never speak", "Eloquence is required by law"], answer: "In a democracy, decisions are made by persuading many citizens in open debate", hint: "Who has to be convinced in Athens?", why: "Where the many decide, leaders must persuade them; rhetoric became an essential civic skill in Athens." },
    { q: "Which modern sentence uses ANTITHESIS most like Pericles?", options: ["“It was the best of times, it was the worst of times.” (Dickens, 1859)", "“It was a nice day.”", "“Stop!”", "“The cat sat on the mat.”"], answer: "“It was the best of times, it was the worst of times.” (Dickens, 1859)", hint: "Look for balanced opposites in parallel phrases.", why: "The opening of A Tale of Two Cities sets best against worst in identical, balanced clauses: the antithetical style Pericles used." },
  ],
  extend: "Read Pericles’ whole Funeral Oration (Thucydides, Book 2, chapters 35–46, Crawley translation, free online). Highlight every antithesis you find. Then write a short paragraph: which values of Athens does Pericles praise most?",
  offline: "Continue The Secret Garden; read your Story of the World chapter on Athens and Sparta. Make the needle-and-cork compass with a grown-up. Oral response: hold a two-minute debate in which one person speaks only laconically and the other eloquently. Then discuss which persuaded better and why.",
},
// ═════════ Lesson 20 — Hawthorne, The Golden Touch ═════════
{
  title: "Myth retold: The Golden Touch", icon: "👑",
  learn: [
    { say: "Myths are retold in every age, and each reteller changes them. Nathaniel Hawthorne retold Greek myths for children in <b>A Wonder-Book</b> (1851). His King Midas story adds something the ancient versions do not have.", show: { type: "list", items: ["Source: the Midas story from the Roman poet Ovid’s Metamorphoses", "Hawthorne’s addition: a beloved little daughter", "Intrusive narrator: a narrator who comments on the story directly", "Theme: the true value of things"] } },
    { say: "Read Hawthorne’s opening. Listen for the narrator’s personality.", show: { type: "passage", title: "The Golden Touch — Nathaniel Hawthorne, A Wonder-Book (1851)", text: "Once upon a time, there lived a very rich man, and a king besides, whose name was Midas; and he had a little daughter, whom nobody but myself ever heard of, and whose name I either never knew, or have entirely forgotten. So, because I love odd names for little girls, I choose to call her Marygold.\n\nThis King Midas was fonder of gold than of anything else in the world. He valued his royal crown chiefly because it was composed of that precious metal. If he loved anything better, or half so well, it was the one little maiden who played so merrily around her father’s footstool." } },
    { say: "The rest of the story, summarised. Midas is granted the <b>Golden Touch</b>. At first he is delighted. Then his breakfast turns to metal in his mouth. Weeping, Marygold runs to comfort him, and as he kisses her, she becomes a golden statue.", show: { type: "list", items: ["Morning: his bed-covering, his spectacles, his garden roses turn to gold", "Breakfast: trout, hot cakes and coffee become gold; he cannot eat", "Marygold embraces him and turns to gold", "Midas begs to lose the gift; he washes in a river and sprinkles its water to restore her"] } },
    { say: "Hawthorne’s narrator is <b>intrusive</b>: he jokes that he alone knew of the daughter and that he chose her name. This playful voice tells us he is shaping an old story, and it makes the tale feel personal.", show: { type: "big", text: "“whom nobody but myself\never heard of”" } },
    { say: "Why add Marygold? Because a story about loving gold needs something more precious than gold to lose. Her name, <b>Mary-gold</b>, even holds the word. The addition sharpens the <b>theme</b>.", show: { type: "table", rows: [["Golden object", "Real value to Midas"], ["golden roses", "lose their scent"], ["golden trout and cakes", "cannot feed him"], ["golden coffee", "cannot quench thirst"], ["golden Marygold", "loses all that made her dear"]] } },
    { say: "Word study. Many English words come from Greek and Roman myths.", show: { type: "table", rows: [["Word", "From", "Meaning"], ["the Midas touch", "King Midas", "a talent for making money"], ["tantalise", "Tantalus, tormented by food he could not reach", "to tease with something unattainable"], ["panic", "Pan, god of the wild", "sudden wild fear"], ["echo", "Echo, a nymph who could only repeat", "a repeated sound"], ["herculean", "Hercules", "needing enormous strength"]] } },
  ],
  practice: [
    { q: "What is unusual about how the narrator introduces Marygold?", options: ["He says nobody but he knew of her and that he chose her name", "He says she is a goddess", "He says she was born of gold", "He does not mention her"], answer: "He says nobody but he knew of her and that he chose her name", hint: "Read the end of the first paragraph.", why: "The narrator playfully admits he invented her name, and implies he invented her." },
    { q: "A narrator who comments directly on the story and on himself is called...", options: ["an intrusive narrator", "a silent narrator", "a character", "an omniscient god"], answer: "an intrusive narrator", hint: "He keeps stepping into the story.", why: "He interrupts with his own views and choices: intrusive." },
    { q: "Why did Midas value his crown?", options: ["Chiefly because it was made of gold", "Because he was king", "Because Marygold liked it", "Because it was ancient"], answer: "Chiefly because it was made of gold", hint: "Find “chiefly because.”", why: "“He valued his royal crown chiefly because it was composed of that precious metal.”" },
    { q: "“If he loved anything better, or half so well, it was the one little maiden.” What does this reveal?", options: ["He loved gold so much that even his daughter barely competes with it", "He did not love his daughter at all", "He loved her far more than gold", "He had many daughters"], answer: "He loved gold so much that even his daughter barely competes with it", hint: "“If… better, or half so well”: is the narrator sure?", why: "The hedging shows the troubling truth: his love of gold rivals his love for his child." },
    { q: "Which event is the CLIMAX of the story?", options: ["Marygold turns to gold when Midas kisses her", "His bedclothes turn to gold", "He wakes up", "He washes in the river"], answer: "Marygold turns to gold when Midas kisses her", hint: "Which moment is the turning point, the worst and most intense?", why: "Losing his daughter is the peak of the conflict, which forces his change of heart." },
    { q: "Why can’t Midas eat his breakfast?", options: ["The food turns to gold at his touch", "He is not hungry", "Marygold eats it", "It is too hot"], answer: "The food turns to gold at his touch", hint: "What does his touch do?", why: "The trout, the hot cakes and the coffee become metal: the gift starves him." },
    { q: "What is the THEME of the story?", options: ["The things that truly matter cannot be measured in gold", "Gold is the best metal", "Kings should eat more", "Never wake early"], answer: "The things that truly matter cannot be measured in gold", hint: "What does Midas learn when he loses Marygold?", why: "Love, food, water and life outvalue gold; Midas learns this only by losing them." },
    { q: "Why is the name MARYGOLD especially fitting?", options: ["It contains “gold,” linking her to the treasure Midas must learn to value less", "It was a common Greek name", "It means silver", "It rhymes with Midas"], answer: "It contains “gold,” linking her to the treasure Midas must learn to value less", hint: "Look inside the name.", why: "She is his true gold; when she becomes literal gold, the gift destroys what is truly precious." },
    { q: "“Tantalise” comes from Tantalus, who in myth was punished with...", options: ["food and water always just out of reach", "turning things to gold", "a talking echo", "great strength"], answer: "food and water always just out of reach", hint: "To tantalise is to tease with what you cannot have.", why: "Tantalus stood in water that drew back when he stooped, beneath fruit that rose out of reach." },
    { q: "A “herculean” task is...", options: ["one needing enormous strength or effort", "an easy task", "a golden task", "a frightening task"], answer: "one needing enormous strength or effort", hint: "Hercules performed twelve impossible labours.", why: "From Hercules, the strongest of heroes." },
    { q: "“Panic” comes from Pan. Why?", options: ["Pan was said to cause sudden terror in lonely places", "Pan was a cooking pot", "Pan was always calm", "Pan invented money"], answer: "Pan was said to cause sudden terror in lonely places", hint: "Panic is sudden, wild fear.", why: "Greeks blamed Pan, the wild god, for sudden unreasoning terror." },
    { q: "Put the story in order.", type: "order", items: ["Marygold becomes gold", "Midas is granted the Golden Touch", "His breakfast turns to gold", "He washes in the river and restores her"], answer: ["Midas is granted the Golden Touch", "His breakfast turns to gold", "Marygold becomes gold", "He washes in the river and restores her"], hint: "Wish, problem, crisis, resolution.", why: "Gift, the first trouble, the climax, and the resolution." },
    { q: "Hawthorne’s Wonder-Book was published in 1851. How many years before 1911 (The Secret Garden) is that?", type: "number", answer: 60, hint: "1911 − 1851.", why: "1911 − 1851 = 60 years." },
  ],
  challenge: [
    { q: "In Ovid’s version, Midas has no daughter; his problem is only that he cannot eat or drink. What does Hawthorne GAIN by adding Marygold?", options: ["The loss becomes emotional, not just physical, so the lesson about value strikes the heart", "The story becomes shorter", "The story becomes more historically accurate", "Nothing changes"], answer: "The loss becomes emotional, not just physical, so the lesson about value strikes the heart", hint: "Which loss would a reader feel more: a meal, or a child?", why: "Hunger is a practical problem; losing a child is a moral and emotional one. The addition deepens the theme." },
    { q: "Midas wished for gold and got exactly what he wished. What kind of irony is this?", options: ["Situational: getting your wish becomes the punishment", "Verbal irony", "No irony", "Dramatic irony only"], answer: "Situational: getting your wish becomes the punishment", hint: "Is the outcome what Midas expected?", why: "His granted wish ruins him: the opposite of what he expected, situational irony." },
    { q: "Compare Midas with Scrooge. Which statement is BEST supported?", options: ["Both value money above people, and both are changed by facing what that costs them", "Both are kings", "Neither changes", "Both are happy at the start and sad at the end"], answer: "Both value money above people, and both are changed by facing what that costs them", hint: "Think about each one’s beginning and ending.", why: "Both are misers whose eyes are opened (by ghosts, or by a golden child) and who end more loving." },
  ],
  extend: "Read “The Golden Touch” in full in A Wonder-Book (free online), then Ovid’s version of Midas (Metamorphoses Book 11, in an old translation such as Brookes More’s). Write a paragraph on two other changes Hawthorne made and why.",
  offline: "Finish The Secret Garden. Oral response: “How did Mary change?” Use your Mary log to give three pieces of evidence. Do the circuits lab with a grown-up. Written response: what would YOU wish to turn everything into, and what could go wrong? Write a short myth-style tale with a moral.",

// ═════════ Lesson 21 — Homer's Odyssey ═════════
{
  title: "Epic: the opening of the Odyssey", icon: "⛵",
  learn: [
    { say: "An <b>epic</b> is a long narrative poem about a hero whose deeds matter to a whole people. Homer’s <b>Odyssey</b>, composed perhaps around 700 BC, tells of Odysseus’ ten-year voyage home after the Trojan War.", show: { type: "table", rows: [["Epic convention", "Meaning"], ["Invocation", "the poet calls on the Muse for inspiration"], ["In medias res", "Latin: “into the middle of things”: the story starts mid-way"], ["Epithet", "a fixed descriptive phrase (rosy-fingered Dawn)"], ["Epic simile", "a long, detailed comparison"]] } },
    { say: "Read the opening in the 1879 prose translation by S. H. Butcher and Andrew Lang.", show: { type: "passage", title: "The Odyssey, Book 1 — Homer (trans. Butcher and Lang, 1879)", text: "Tell me, Muse, of that man, so ready at need, who wandered far and wide, after he had sacked the sacred citadel of Troy, and many were the men whose towns he saw and whose mind he learnt, yea, and many the woes he suffered in his heart upon the deep, striving to win his own life and the return of his company.\n\nNay, but even so he saved not his company, though he desired it sore. For through the blindness of their own hearts they perished, fools, who devoured the oxen of Helios Hyperion: but the god took from them their day of returning." } },
    { say: "Notice the poet does not name the hero. He is “that man, <b>so ready at need</b>”, which translates the Greek <b>polytropos</b>: “of many turns”, resourceful, versatile, cunning.", show: { type: "big", text: "polytropos\n= “of many turns”" } },
    { say: "Homer’s <b>epithets</b> are fixed phrases that helped the oral poet compose and the listener remember. They also shape how we see each figure.", show: { type: "table", rows: [["Epithet", "Belongs to"], ["rosy-fingered Dawn", "the dawn"], ["the wine-dark sea", "the sea"], ["grey-eyed Athene", "the goddess Athene"], ["Odysseus of many devices", "Odysseus"]] } },
    { say: "The opening is also a <b>summary</b> and a <b>judgment</b>. It previews the whole journey and already blames the crew: “fools,” who ate the sacred cattle of the sun god.", show: { type: "list", items: ["Who: a resourceful man", "What: wandering, suffering, striving", "Goal: his life and his men’s return", "Outcome foreshadowed: the crew perish through their own folly"] } },
    { say: "Word study. Two everyday English words come from the Odyssey. An <b>odyssey</b> is any long, eventful journey. A <b>mentor</b> is a wise guide: in the poem, the goddess Athene disguises herself as Mentor, an old friend, to guide Odysseus’ son Telemachus.", show: { type: "table", rows: [["Word", "Source in the poem", "Modern meaning"], ["odyssey", "Odysseus’ journey", "a long, adventurous journey"], ["mentor", "Mentor, Athene’s disguise", "a trusted advisor"], ["siren (song)", "the Sirens, whose song lures sailors", "a dangerous temptation"], ["Trojan horse", "the trick that took Troy", "a hidden threat inside a gift"]] } },
  ],
  practice: [
    { q: "Whom does the poet address in the first words?", options: ["the Muse", "Odysseus", "the reader’s mother", "Zeus"], answer: "the Muse", hint: "“Tell me, ___”", why: "“Tell me, Muse”: the invocation of the goddess of poetic inspiration." },
    { q: "This opening call for divine inspiration is called...", options: ["an invocation", "an epithet", "an epic simile", "a refrain"], answer: "an invocation", hint: "To invoke is to call upon.", why: "Calling on the Muse at the start is the epic invocation." },
    { q: "Which city did Odysseus sack?", options: ["Troy", "Athens", "Sparta", "Rome"], answer: "Troy", hint: "Read the first sentence.", why: "“after he had sacked the sacred citadel of Troy.”" },
    { q: "“So ready at need” translates a Greek word meaning...", options: ["of many turns: resourceful, cunning", "very strong", "very old", "always angry"], answer: "of many turns: resourceful, cunning", hint: "polytropos: poly = many.", why: "polytropos describes a versatile, resourceful man who always finds a way." },
    { q: "Why did the crew perish, according to the opening?", options: ["They foolishly devoured the sacred cattle of the sun god", "A storm sank them by chance", "Odysseus abandoned them", "They stayed in Troy"], answer: "They foolishly devoured the sacred cattle of the sun god", hint: "Read the second paragraph.", why: "“through the blindness of their own hearts they perished, fools, who devoured the oxen of Helios Hyperion.”" },
    { q: "“Through the blindness of their own hearts” means...", options: ["through their own foolishness and lack of judgment", "they lost their eyesight", "they had heart disease", "it was dark"], answer: "through their own foolishness and lack of judgment", hint: "Is this literal blindness?", why: "It is a metaphor: their folly, not fate alone, destroyed them." },
    { q: "“Rosy-fingered Dawn” is an example of...", options: ["an epithet", "an invocation", "a laconic reply", "an anapest"], answer: "an epithet", hint: "A fixed descriptive phrase repeated through the poem.", why: "Homer attaches “rosy-fingered” to Dawn again and again." },
    { q: "What might “rosy-fingered” picture?", options: ["Streaks of pink light spreading across the sky at sunrise like fingers", "A goddess with sore hands", "Roses in a garden", "A sunset"], answer: "Streaks of pink light spreading across the sky at sunrise like fingers", hint: "What does the sky look like at dawn?", why: "Rays of pink light stretch up from the horizon like fingers." },
    { q: "Why were epithets useful to a poet who composed ALOUD?", options: ["Ready-made phrases helped fit the metre and remember the long poem", "They made the poem shorter", "They were required by law", "They hid the hero’s name"], answer: "Ready-made phrases helped fit the metre and remember the long poem", hint: "Imagine reciting thousands of lines from memory.", why: "Formulaic phrases supported oral composition in fixed metre." },
    { q: "Someone who guides a younger person wisely is called a...", options: ["mentor", "siren", "muse", "titan"], answer: "mentor", hint: "Athene disguised herself as him.", why: "From Mentor in the Odyssey." },
    { q: "“Their journey home became a real odyssey.” This means the journey was...", options: ["long and full of adventures and setbacks", "short and easy", "by aeroplane", "about poetry"], answer: "long and full of adventures and setbacks", hint: "What was Odysseus’ journey like?", why: "An odyssey is a long, eventful wandering." },
    { q: "How many years did Odysseus’ voyage home take?", type: "number", answer: 10, hint: "See the first slide.", why: "Ten years (after ten years of war at Troy)." },
    { q: "Put the opening’s content in order.", type: "order", items: ["the crew perish for eating the sun-god’s cattle", "he sacked Troy", "the poet calls on the Muse", "he wandered and saw many men’s towns"], answer: ["the poet calls on the Muse", "he sacked Troy", "he wandered and saw many men’s towns", "the crew perish for eating the sun-god’s cattle"], hint: "Follow the passage.", why: "Invocation, Troy, wanderings, and the crew’s fate." },
  ],
  challenge: [
    { q: "The opening never names Odysseus, calling him only “that man.” What is the most likely EFFECT?", options: ["It defines him by his character and suffering first, creating curiosity about who he is", "Homer forgot his name", "It shows he is unimportant", "It means the poem is about the Muse"], answer: "It defines him by his character and suffering first, creating curiosity about who he is", hint: "What do we learn about him before his name?", why: "We know he is resourceful, much-travelled and much-suffering before we know his name; identity through deeds. (Disguise and hidden identity also become major themes.)" },
    { q: "The opening tells us the crew will die and why. Why reveal the outcome at the start?", options: ["Ancient audiences knew the story; the interest lies in how it unfolds and what it means", "To spoil the poem on purpose", "Because Homer forgot the ending", "Epics never have suspense"], answer: "Ancient audiences knew the story; the interest lies in how it unfolds and what it means", hint: "Recall Jim Hawkins revealing he survived.", why: "Like Treasure Island’s retrospective narrator, the epic shifts suspense from “what” to “how” and “why,” and frames a moral: folly destroys." },
    { q: "Which modern phrase uses an epic reference to mean “a hidden danger disguised as a gift”?", options: ["a Trojan horse", "a siren song", "a mentor", "a herculean task"], answer: "a Trojan horse", hint: "How did the Greeks finally enter Troy?", why: "The Greeks hid soldiers inside a wooden horse left as a gift; today the phrase also names hidden computer threats." },
  ],
  extend: "Read Book 9 of the Odyssey (Odysseus and the Cyclops) in the Butcher and Lang translation. Find two examples of Odysseus being “of many turns” (resourceful), and write how each saves him.",
  offline: "Begin a new read-aloud after The Secret Garden, and read your Story of the World chapter on the Greek gods and the wars of the Greeks. Test 5 kitchen liquids in the acid–base lab. Written response: invent three Homeric epithets for members of your family, and explain each in a sentence.",

// ═════════ Lesson 22 — Review: Troy and Tennyson's Ulysses ═════════
{
  title: "Review: Troy, Virgil and Tennyson", icon: "🐴",
  learn: [
    { say: "Review lesson. One story, three ages: Homer (Greek, about 700 BC), Virgil (Roman, written 29–19 BC), Tennyson (Victorian, written 1833, published 1842). Each reteller shapes the material to his own purpose.", show: { type: "table", rows: [["Author", "Work", "Angle"], ["Homer", "Odyssey", "Odysseus’ cunning and return"], ["Virgil", "Aeneid", "Troy’s fall seen by the Trojans"], ["Tennyson", "“Ulysses”", "the old hero longing for one last voyage"]] } },
    { say: "First, the wooden horse, retold in this course’s own words from Virgil’s <b>Aeneid</b>, Book 2.", show: { type: "passage", title: "The Wooden Horse — retold from Virgil, Aeneid, Book 2", text: "After ten years of siege, the Greeks pretended to sail for home, leaving behind a huge wooden horse. The Trojans streamed out of their gates to stare at it. Some wanted to drag it inside as a trophy.\n\nBut the priest Laocoön ran down from the citadel, shouting a warning: “Do you think any gift of the Greeks is free of treachery? Whatever it is, I fear the Greeks, even when they bring gifts.” He hurled his spear into the horse’s side, and the hollow belly groaned.\n\nThe Trojans did not listen. That night, Greek soldiers climbed out of the horse and opened the gates." } },
    { say: "Laocoön’s line in Virgil’s Latin is famous: <b>Timeo Danaos et dona ferentes</b>, “I fear the Greeks even bearing gifts.” It is still quoted as a warning against suspicious generosity.", show: { type: "big", text: "Timeo Danaos et dona ferentes.\n“I fear the Greeks, even bearing gifts.”" } },
    { say: "Now Tennyson’s old Ulysses (the Latin name for Odysseus), home at last, but restless. These are the poem’s final lines (written 1833, published 1842).", show: { type: "passage", title: "Ulysses — Alfred, Lord Tennyson (1842), closing lines", text: "Tho’ much is taken, much abides; and tho’ / We are not now that strength which in old days / Moved earth and heaven; that which we are, we are; / One equal temper of heroic hearts, / Made weak by time and fate, but strong in will / To strive, to seek, to find, and not to yield." } },
    { say: "Tennyson’s last line builds a <b>tricolon</b> (three parallel items: strive, seek, find), then a final, emphatic negative: <b>and not to yield</b>. The rhythm itself refuses to give up.", show: { type: "list", items: ["Antithesis: “much is taken” ↔ “much abides”", "Antithesis: “weak by time and fate” ↔ “strong in will”", "Tricolon: to strive, to seek, to find", "Climax: and not to yield"] } },
    { say: "Word study. Latin <b>ferre</b> means “to carry, bear,” as in <b>ferentes</b> (bearing). It lives on in many English words.", show: { type: "table", rows: [["Word", "Parts", "Meaning"], ["transfer", "trans (across) + fer", "carry across"], ["fertile", "fer + -tile", "bearing crops"], ["conifer", "conus (cone) + fer", "cone-bearing tree"], ["infer", "in + fer", "carry a conclusion in from evidence"]] } },
  ],
  practice: [
    { q: "Why did the Greeks leave a wooden horse?", options: ["As a trick: soldiers were hidden inside", "As a real gift of peace", "Because it was too heavy to carry", "As a religious statue for Troy"], answer: "As a trick: soldiers were hidden inside", hint: "What happened that night?", why: "Greek soldiers climbed out at night and opened the gates." },
    { q: "Who warned the Trojans?", options: ["Laocoön, a priest", "Odysseus", "Ulysses", "Homer"], answer: "Laocoön, a priest", hint: "Read paragraph 2.", why: "The priest Laocoön ran down shouting his warning." },
    { q: "What did the horse do when Laocoön’s spear struck it?", options: ["Its hollow belly groaned", "It fell over", "It caught fire", "It ran away"], answer: "Its hollow belly groaned", hint: "Look at the end of paragraph 2.", why: "“the hollow belly groaned”: a clue that it was hollow and full." },
    { q: "This is an example of DRAMATIC IRONY because...", options: ["readers know soldiers are inside, but the Trojans do not", "Laocoön is joking", "the horse is real", "the Greeks are honest"], answer: "readers know soldiers are inside, but the Trojans do not", hint: "Who knows more, the audience or the Trojans?", why: "We know the danger; they do not. Their celebration becomes painful to watch." },
    { q: "“I fear the Greeks, even when they bring gifts” means...", options: ["Do not trust an enemy’s generosity", "Greek gifts are always cheap", "Laocoön dislikes presents", "Never accept anything"], answer: "Do not trust an enemy’s generosity", hint: "Why might an enemy suddenly give you something?", why: "An enemy’s gift likely hides a trap." },
    { q: "In Tennyson’s poem, “Ulysses” is...", options: ["the Latin name for Odysseus", "a different hero", "Odysseus’ son", "a Trojan king"], answer: "the Latin name for Odysseus", hint: "See the slide introducing the poem.", why: "Ulysses (from Latin Ulixes) is the Roman name for Odysseus." },
    { q: "“Tho’ much is taken, much abides.” What device balances these phrases?", options: ["antithesis", "onomatopoeia", "a laconic reply", "an epithet"], answer: "antithesis", hint: "taken ↔ abides.", why: "Loss and endurance are set in balanced opposition." },
    { q: "“Abides” means...", options: ["remains", "leaves", "grows", "breaks"], answer: "remains", hint: "Contrasted with “taken.”", why: "To abide is to remain, endure." },
    { q: "What does the old Ulysses admit he has LOST?", options: ["the physical strength of his youth", "his courage", "his will", "his friends’ love"], answer: "the physical strength of his youth", hint: "“We are not now that strength which in old days…”", why: "He admits their old strength is gone, but insists their will is strong." },
    { q: "Which three verbs form the tricolon in the last line?", options: ["strive, seek, find", "taken, abides, moved", "weak, strong, will", "heaven, earth, fate"], answer: "strive, seek, find", hint: "“To ___, to ___, to ___, and not to yield.”", why: "Three parallel infinitives: strive, seek, find." },
    { q: "How many words long is the final line “To strive, to seek, to find, and not to yield”?", type: "number", answer: 10, hint: "Count every word, including “to” and “and.”", why: "To / strive / to / seek / to / find / and / not / to / yield = 10." },
    { q: "A “conifer” is a tree that...", options: ["bears cones", "carries water", "is very old", "has no leaves"], answer: "bears cones", hint: "fer = bear.", why: "conus (cone) + fer (bearing)." },
    { q: "To “infer” is literally to...", options: ["carry a conclusion in from the evidence", "carry something across", "bear fruit", "refuse"], answer: "carry a conclusion in from the evidence", hint: "in + fer.", why: "Inference brings (carries) a conclusion in from evidence, the skill of lesson 9." },
    { q: "Order the three works by date of composition.", type: "order", items: ["Tennyson’s “Ulysses”", "Virgil’s Aeneid", "Homer’s Odyssey"], answer: ["Homer’s Odyssey", "Virgil’s Aeneid", "Tennyson’s “Ulysses”"], hint: "about 700 BC; 29–19 BC; AD 1833.", why: "Homer, then Virgil, then Tennyson." },
  ],
  challenge: [
    { q: "Homer celebrates Odysseus’ cunning; Virgil tells the horse story from the Trojan side. How does the SAME trick look different from each side?", options: ["To the Greeks it is brilliant strategy; to the Trojans it is a treacherous betrayal", "It looks the same to both", "Both call it cowardly", "Neither mentions it"], answer: "To the Greeks it is brilliant strategy; to the Trojans it is a treacherous betrayal", hint: "Point of view changes judgement.", why: "Perspective shapes moral meaning. Virgil, writing for Romans who claimed descent from Troy, stresses Greek treachery." },
    { q: "Tennyson’s Ulysses is old, yet longs to sail again. What THEME do the closing lines express?", options: ["Human will can remain heroic even when strength fades", "Old age is hopeless", "One should stay at home", "Adventures are foolish"], answer: "Human will can remain heroic even when strength fades", hint: "Weak by time and fate, but…?", why: "Loss of strength is admitted, but the will to strive endures: a theme of persistence." },
    { q: "Why does ending on “and not to yield” have more force than ending on “and to win”?", options: ["Not yielding is within one’s power whatever happens; winning is not", "“Win” does not fit the metre", "Ulysses expects to lose", "It is a translation"], answer: "Not yielding is within one’s power whatever happens; winning is not", hint: "Which can an old man always choose?", why: "Victory is uncertain; refusing to give up is a choice of will. The ending celebrates what one can control." },
  ],
  extend: "Read Tennyson’s whole “Ulysses” (70 lines). Then read Book 2 of Virgil’s Aeneid in John Dryden’s or another older public-domain translation. Write a page comparing Tennyson’s Ulysses with Homer’s Odysseus.",

// ═════════ Lesson 23 — Plutarch's Alexander ═════════
{
  title: "Biography as character: Plutarch’s Alexander", icon: "🐎",
  learn: [
    { say: "A <b>biography</b> tells a life. But what is a biography <b>for</b>? Plutarch, a Greek writer of the late first and early second centuries AD, wrote paired lives of famous Greeks and Romans, and stated his purpose plainly. This is the 17th-century translation published under John Dryden’s editorship (several translators shared the work), as revised by Arthur Hugh Clough (1859).", show: { type: "passage", title: "Plutarch, Life of Alexander (the “Dryden” translation, rev. A. H. Clough, 1859)", text: "[…] It must be borne in mind that my design is not to write histories, but lives. And the most glorious exploits do not always furnish us with the clearest discoveries of virtue or vice in men; sometimes a matter of less moment, an expression or a jest, informs us better of their characters and inclinations, than the most famous sieges, the greatest armaments, or the bloodiest battles whatsoever.\n\nTherefore as portrait-painters are more exact in the lines and features of the face in which the character is seen, than in the other parts of the body, so I must be allowed to give my more particular attention to the marks and indications of the souls of men […]." } },
    { say: "Plutarch’s claim: a small <b>anecdote</b> (a short, revealing incident) can show character better than a great battle. His most famous anecdote about Alexander is the taming of the horse Bucephalas (often spelled Bucephalus).", show: { type: "passage", title: "Plutarch, Life of Alexander (continued)", text: "[…] Philonicus the Thessalian brought the horse Bucephalas to Philip, offering to sell him for thirteen talents; but when they went into the field to try him, they found him so very vicious and unmanageable, that he reared up when they endeavored to mount him, and would not so much as endure the voice of any of Philip’s attendants. Upon which, as they were leading him away as wholly useless and untractable, Alexander, who stood by, said, “What an excellent horse do they lose, for want of address and boldness to manage him!” […] “I will pay,” answered Alexander, “the whole price of the horse.”" } },
    { say: "Now watch how Alexander does it. Notice the one thing he has observed.", show: { type: "passage", title: "Plutarch, Life of Alexander (continued)", text: "[…] he immediately ran to the horse, and taking hold of the bridle, turned him directly towards the sun, having, it seems, observed that he was disturbed at and afraid of the motion of his own shadow; then letting him go forward a little, still keeping the reins in his hand, and stroking him gently when he found him begin to grow eager and fiery, he let fall his upper garment softly, and with one nimble leap securely mounted him […]." } },
    { say: "The ending of the anecdote.", show: { type: "passage", title: "Plutarch, Life of Alexander (continued)", text: "[…] Philip and his friends looked on at first in silence and anxiety for the result, till seeing him turn at the end of his career, and come back rejoicing and triumphing for what he had performed, they all burst out into acclamations of applause; and his father, shedding tears, it is said, for joy, kissed him as he came down from his horse, and in his transport, said, “O my son, look thee out a kingdom equal to and worthy of thyself, for Macedonia is too little for thee.”" } },
    { say: "Recall lesson 13: a shadow falls <b>away</b> from the light. Facing the sun, the horse saw no shadow ahead. Alexander solved the problem by <b>observation</b>, not force.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif' font-weight='700' text-anchor='middle'><line x1='20' y1='250' x2='580' y2='250' stroke='#475569' stroke-width='4'/><circle cx='560' cy='70' r='26' fill='#f59e0b'/><text x='560' y='130' font-size='20' fill='#92400e'>sun</text><ellipse cx='330' cy='200' rx='60' ry='26' fill='#1e293b'/><rect x='290' y='215' width='10' height='35' fill='#1e293b'/><rect x='360' y='215' width='10' height='35' fill='#1e293b'/><path d='M385 190 L420 150 L432 160 L400 205 Z' fill='#1e293b'/><ellipse cx='170' cy='254' rx='120' ry='9' fill='#94a3b8'/><text x='170' y='290' font-size='20' fill='#475569'>shadow falls behind</text><text x='420' y='290' font-size='20' fill='#0f766e'>horse faces the sun</text><text x='300' y='40' font-size='22' fill='#334155'>Alexander turns the horse toward the light</text></svg>" } },
    { say: "What does the anecdote reveal? Plutarch lets the incident speak, and we infer character from it.", show: { type: "table", rows: [["Detail", "Character trait"], ["noticed the shadow", "sharp observation"], ["challenged his father", "boldness, confidence"], ["staked his own money", "willingness to take risks"], ["stroked him gently", "patience, understanding"]] } },
    { say: "Word study. <b>Bucephalus</b> means “ox-head”: Greek <b>bous</b> (ox) + <b>kephalē</b> (head). Both roots live in science words.", show: { type: "table", rows: [["Word", "Parts", "Meaning"], ["cephalopod", "kephalē + pod (foot)", "head-foot: octopus, squid"], ["encephalitis", "en (in) + kephalē + -itis", "inflammation of the brain"], ["bovine (Latin bos)", "bos, bovis (ox)", "relating to cattle"], ["hippopotamus", "hippos (horse) + potamos (river)", "river-horse"]] } },
  ],
  practice: [
    { q: "What does Plutarch say he is writing?", options: ["lives, not histories", "histories, not lives", "poems", "laws"], answer: "lives, not histories", hint: "Find “my design is…”", why: "“It must be borne in mind that my design is not to write histories, but lives.”" },
    { q: "According to Plutarch, what can reveal character better than great battles?", options: ["a matter of less moment, an expression or a jest", "the number of soldiers", "the most famous sieges", "the greatest armaments"], answer: "a matter of less moment, an expression or a jest", hint: "Read the middle of his sentence.", why: "Small words and jokes often reveal character more than famous sieges or the bloodiest battles." },
    { q: "An “anecdote” is...", options: ["a short, revealing story about an incident", "a long history", "a battle plan", "a medicine"], answer: "a short, revealing story about an incident", hint: "The Bucephalus story is one.", why: "An anecdote is a brief narrative of a particular incident." },
    { q: "Why did Philip want the horse led away?", options: ["No one could ride him; he seemed wild and useless", "He was too old", "He was too expensive", "Alexander asked him to"], answer: "No one could ride him; he seemed wild and useless", hint: "Read paragraph 1.", why: "He reared when they tried to mount him and would not bear even the voice of Philip’s attendants." },
    { q: "What did Alexander notice that others did not?", options: ["The horse was frightened by his own shadow", "The horse was hungry", "The horse was lame", "The horse was blind"], answer: "The horse was frightened by his own shadow", hint: "Read the start of the continuation.", why: "The leaping shadow on the ground frightened him." },
    { q: "Why did turning the horse toward the sun calm him?", options: ["His shadow fell behind him, out of sight", "The sun made him sleepy", "He liked warmth", "The sun blinded him"], answer: "His shadow fell behind him, out of sight", hint: "Use the diagram and lesson 13.", why: "Shadows fall away from the light, so facing the sun put the shadow behind him." },
    { q: "Which trait does the anecdote MOST clearly show?", options: ["sharp observation and problem-solving", "cruelty", "laziness", "fear of horses"], answer: "sharp observation and problem-solving", hint: "How did he succeed where others failed?", why: "He solved the problem by noticing its cause, not by force." },
    { q: "What did Alexander risk if he failed?", options: ["Paying the horse’s price himself", "His kingdom", "His life only", "Nothing"], answer: "Paying the horse’s price himself", hint: "End of the first passage.", why: "He offered to pay the price of the horse if he failed." },
    { q: "“Macedonia is too little for thee.” What does Philip mean?", options: ["Alexander is destined to rule something far greater", "Macedonia is a small country to live in", "Alexander should leave home now", "Alexander is too big for his horse"], answer: "Alexander is destined to rule something far greater", hint: "Alexander later conquered an empire from Greece to India.", why: "Philip sees greatness in his son; the line foreshadows Alexander’s vast conquests." },
    { q: "“Bucephalus” means...", options: ["ox-head", "black horse", "brave runner", "king’s horse"], answer: "ox-head", hint: "bous + kephalē.", why: "bous (ox) + kephalē (head)." },
    { q: "Why is an octopus called a CEPHALOPOD?", options: ["Its arms (feet) grow from its head", "It has a big brain", "It lives near the head of rivers", "It has no head"], answer: "Its arms (feet) grow from its head", hint: "kephalē + pod.", why: "head + foot: the arms are attached directly to the head." },
    { q: "Hippopotamus means...", options: ["river-horse", "huge pig", "water-cow", "fat horse"], answer: "river-horse", hint: "hippos + potamos.", why: "hippos (horse) + potamos (river)." },
    { q: "Put the anecdote in order.", type: "order", items: ["Philip weeps for joy", "Alexander turns the horse toward the sun", "Philip orders the horse led away", "Alexander protests and stakes the price"], answer: ["Philip orders the horse led away", "Alexander protests and stakes the price", "Alexander turns the horse toward the sun", "Philip weeps for joy"], hint: "Problem, challenge, solution, reaction.", why: "Rejected horse, bold challenge, clever solution, father’s joy." },
  ],
  challenge: [
    { q: "How does the Bucephalus anecdote PROVE Plutarch’s own claim about biography?", options: ["A small incident reveals Alexander’s character better than his battles", "It describes a great battle", "It shows horses matter more than kings", "It contradicts his claim"], answer: "A small incident reveals Alexander’s character better than his battles", hint: "Plutarch said small things reveal more than battles. Is this a battle?", why: "The anecdote shows observation, daring, patience and ambition: Plutarch practises what he preaches." },
    { q: "Plutarch wrote about 400 years after Alexander’s death and says Philip shed tears “it is said, for joy.” What should a careful reader conclude?", options: ["The story may be partly legend; Plutarch signals some uncertainty", "Plutarch watched it happen", "The story is certainly false", "Philip wrote it down himself"], answer: "The story may be partly legend; Plutarch signals some uncertainty", hint: "Why would an honest writer say “is said to”?", why: "“Is said to” marks a report, not a certainty. Distance in time calls for caution: the story is plausible but cannot be verified." },
    { q: "The horse feared his own shadow; Alexander removed the fear by changing the horse’s position, not the horse. Which lesson about leadership does this suggest?", options: ["Understand the cause of a problem before trying to force a solution", "Always use force", "Never ride horses", "Avoid the sun"], answer: "Understand the cause of a problem before trying to force a solution", hint: "What did everyone else try, and what did Alexander do instead?", why: "Others fought the symptom (wildness); Alexander found the cause (the shadow). Insight beats force: the North Wind and the Sun again." },
  ],
  extend: "Read Plutarch’s Life of Alexander, chapters 1–10 (the Dryden–Clough translation, free on Project Gutenberg). Choose another anecdote that reveals character and write a paragraph explaining what it reveals.",
  offline: "Begin Mary Poppins (or My Father’s Dragon). Read your Story of the World chapter on Alexander. Grow sugar crystals (a grown-up handles the hot water). Written response: write a 6–8 sentence anecdote about someone you know that reveals their character without naming the trait.",
},
// ═════════ Lesson 24 — Herodotus ═════════
{
  title: "The first historian: Herodotus", icon: "📯",
  learn: [
    { say: "Herodotus of Halicarnassus (about 484–425 BC) is called the <b>Father of History</b>, a title first given him by the Roman orator Cicero. His work is called the <b>Histories</b>, from Greek <b>historia</b>, meaning “inquiry” or “research.” Read his opening statement of purpose.", show: { type: "passage", title: "Herodotus, Histories, opening (trans. G. C. Macaulay, 1890)", text: "This is the Showing forth of the Inquiry of Herodotus of Halicarnassos, to the end that neither the deeds of men may be forgotten by lapse of time, nor the works great and marvellous, which have been produced some by Hellenes and some by Barbarians, may lose their renown; and especially that the causes may be remembered for which these waged war with one another." } },
    { say: "His purposes: to preserve memory, to honour great deeds of <b>both</b> sides, and to explain <b>causes</b>. “Barbarians” here simply meant non-Greek speakers, including the Persians.", show: { type: "list", items: ["Preserve: so deeds are not forgotten", "Honour: great works of Greeks AND non-Greeks", "Explain: the causes of the war", "Method: inquiry, travel, questioning witnesses"] } },
    { say: "Herodotus describes the Persian royal messengers, who carried the king’s orders along the <b>Royal Road</b> by relays of riders.", show: { type: "passage", title: "Herodotus, Histories 8.98 (trans. G. C. Macaulay, 1890)", text: "[…] Now there is nothing mortal which accomplishes a journey with more speed than these messengers, so skilfully has this been invented by the Persians: for they say that according to the number of days of which the entire journey consists, so many horses and men are set at intervals, each man and horse appointed for a day’s journey. These neither snow nor rain nor heat nor darkness of night prevents from accomplishing each one the task proposed to him, with the very utmost speed." } },
    { say: "The relay system: each rider covers one day’s stage, then hands the message to a fresh rider and horse. The <b>message</b> never rests, though each rider does.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif' font-weight='700' text-anchor='middle'><line x1='40' y1='170' x2='560' y2='170' stroke='#a16207' stroke-width='8' stroke-linecap='round'/><g fill='#fef3c7' stroke='#a16207' stroke-width='3'><rect x='20' y='130' width='60' height='60' rx='8'/><rect x='150' y='130' width='60' height='60' rx='8'/><rect x='280' y='130' width='60' height='60' rx='8'/><rect x='410' y='130' width='60' height='60' rx='8'/><rect x='520' y='130' width='60' height='60' rx='8'/></g><g font-size='20' fill='#78350f'><text x='50' y='167'>1</text><text x='180' y='167'>2</text><text x='310' y='167'>3</text><text x='440' y='167'>4</text><text x='550' y='167'>…</text></g><g font-size='19' fill='#334155'><text x='115' y='110'>day 1</text><text x='245' y='110'>day 2</text><text x='375' y='110'>day 3</text><text x='300' y='240'>fresh horse and rider at every station</text><text x='300' y='275'>the message never stops</text></g><text x='50' y='60' font-size='20' fill='#0f766e'>Sardis</text><text x='550' y='60' font-size='20' fill='#0f766e'>Susa</text></svg>" }, caption: "The Royal Road ran more than 2,500 km from Sardis to Susa." },
    { say: "Notice <b>“they say that”</b>. Herodotus often reports what he was told, sometimes adding whether he believes it. A careful reader tracks the difference between what a historian <b>saw</b>, what he <b>heard</b>, and what he <b>concludes</b>.", show: { type: "table", rows: [["Signal phrase", "Status of the claim"], ["“I saw…”", "eyewitness"], ["“they say…” / “it is said…”", "report, hearsay"], ["“I do not believe…”", "the historian’s judgment"]] } },
    { say: "Word study. Greek <b>historia</b> (inquiry) gives <b>history</b> and <b>story</b>. Greek <b>angelos</b> (messenger) gives <b>angel</b>. Greek <b>-logy</b> (study, account) names many sciences.", show: { type: "table", rows: [["Word", "Root", "Meaning"], ["history", "historia (inquiry)", "an account found by inquiry"], ["angel", "angelos (messenger)", "a messenger (of God)"], ["evangelist", "eu (good) + angelos", "one who brings good news"], ["chronology", "chronos (time) + logy", "the ordering of events in time"]] } },
  ],
  practice: [
    { q: "What does Greek “historia” mean?", options: ["inquiry, research", "old stories", "war", "kings"], answer: "inquiry, research", hint: "Herodotus calls his book an “Inquiry.”", why: "historia = inquiry; history began as research, not just storytelling." },
    { q: "Which is NOT one of Herodotus’ stated purposes?", options: ["To prove the Greeks were always right", "To keep great deeds from being forgotten", "To preserve the renown of great works", "To record the causes of the war"], answer: "To prove the Greeks were always right", hint: "Whose works does he want remembered?", why: "He honours both Hellenes and “Barbarians”; he does not claim to prove one side right." },
    { q: "Why is it notable that Herodotus honours deeds of “Barbarians” as well as Greeks?", options: ["He aims to be fair to the enemy, not merely to praise his own people", "He was a Persian", "He disliked Greeks", "It was required by law"], answer: "He aims to be fair to the enemy, not merely to praise his own people", hint: "Who was the enemy in the war he describes?", why: "Honouring the Persians’ great works shows an aim at fairness unusual for a war history." },
    { q: "What does Herodotus call “especially” important to remember?", options: ["the causes of the war", "the names of every soldier", "the weather", "the gods’ names"], answer: "the causes of the war", hint: "Read the end of the opening.", why: "“and especially that the causes may be remembered for which these waged war.”" },
    { q: "How were the Persian messengers so swift?", options: ["Relays: a fresh horse and man waited at every day’s stage", "One rider rode without stopping", "They used ships", "They used carrier pigeons"], answer: "Relays: a fresh horse and man waited at every day’s stage", hint: "Read “each man and horse appointed for a day’s journey.”", why: "Fresh riders at each stage kept the message moving continuously." },
