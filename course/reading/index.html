    { q: "Which phrase shows Mary’s mother’s NEGLECT most clearly?", options: ["keep the child out of sight as much as possible", "a great beauty", "go to parties", "under the English Government"], answer: "keep the child out of sight as much as possible", hint: "Which phrase is about how Mary herself was treated?", why: "Ordering servants to keep her daughter out of sight is deliberate neglect." },
    { q: "Burnett’s narrator says Mary’s face was yellow “because she had been born in India.” How should a modern reader treat such statements?", options: ["Note them as reflecting the beliefs of 1911, and read critically", "Accept them as medical fact", "Ignore the whole book", "Assume the narrator is lying on purpose"], answer: "Note them as reflecting the beliefs of 1911, and read critically", hint: "Books carry the assumptions of their time.", why: "Careful readers notice period attitudes and weigh them, rather than absorbing them uncritically." },
    { q: "What kind of character do you predict Mary will be: static or dynamic?", options: ["dynamic: she will change", "static: she will stay the same", "she will vanish", "she will become the narrator"], answer: "dynamic: she will change", hint: "Why would an author start with such a sour heroine?", why: "An unpleasant start sets up change; Mary becomes healthier, kinder and more alive." },
    { q: "“Disagreeable-looking” uses a hyphen to...", options: ["join two words into one adjective before a noun", "show a pause", "split a word at the line end", "show subtraction"], answer: "join two words into one adjective before a noun", hint: "What job does “disagreeable-looking” do in the sentence?", why: "A compound adjective is hyphenated: a disagreeable-looking child." },
  ],
  20: [
    { q: "“He valued his royal crown chiefly because it was composed of that precious metal.” What does this reveal about Midas?", options: ["He cares more for gold than for being king", "He is a humble ruler", "He dislikes his crown", "He prefers silver"], answer: "He cares more for gold than for being king", hint: "Why does he value the crown?", why: "Not for royalty, but for gold: his values are upside down." },
    { q: "Hawthorne says “because I love odd names for little girls.” What does this aside do?", options: ["It makes the narrator a warm, personal storyteller", "It explains Greek history", "It names the gods", "It ends the story"], answer: "It makes the narrator a warm, personal storyteller", hint: "Who is speaking to us here?", why: "The playful aside establishes an intimate, chatty narrative voice." },
    { q: "What does Midas’s request to LOSE the Golden Touch show?", options: ["He has learned that love and life matter more than gold", "He wants more gold", "He is angry with Marygold", "He is tired"], answer: "He has learned that love and life matter more than gold", hint: "Why would anyone give up such power?", why: "Giving up the gift shows his changed values: character change." },
  ],
  21: [
    { q: "“Many the woes he suffered in his heart upon the deep.” “The deep” means...", options: ["the sea", "a well", "his mind", "a cave"], answer: "the sea", hint: "Odysseus wandered by ship.", why: "“The deep” is a traditional poetic name for the sea." },
    { q: "Why does the opening list so many of Odysseus’ experiences (towns seen, minds learnt, woes suffered)?", options: ["To show the vast scope of his journey and his hard-won wisdom", "To make the poem shorter", "To hide his name", "To list his enemies"], answer: "To show the vast scope of his journey and his hard-won wisdom", hint: "What does a man gain from seeing many towns and minds?", why: "The catalogue establishes an epic scale of travel, suffering and learning." },
    { q: "Butcher and Lang use words like “yea” and “nay.” Why would 1879 translators choose such archaic words?", options: ["To give Homer’s ancient poem a dignified, old-world tone", "Because everyone spoke that way in 1879", "To make it funny", "By mistake"], answer: "To give Homer’s ancient poem a dignified, old-world tone", hint: "Did Victorians normally say “yea”?", why: "Archaic diction signals antiquity and solemnity, suited to an epic." },

  24: [

[
// ═════════ Lesson 1 — Kipling, The Elephant's Child ═════════
{
  title: "The storyteller's voice: Kipling", icon: "🐘",
  learn: [
    { say: "Welcome to literary study. A great reader notices not only <b>what</b> a text says but <b>how</b> it says it. Today we study <b>narrative voice</b>: the personality of the one telling the story.", show: { type: "list", items: ["Narrator: the voice that tells the story", "Voice: the narrator’s personality, heard in word choice and rhythm", "Audience: the person the narrator speaks to", "Pourquoi tale (French, “why”): a story that explains how something came to be"] } },
    { say: "Rudyard Kipling published the <b>Just So Stories</b> in 1902, after first telling them aloud to his daughter. Read the opening of “The Elephant’s Child” slowly. Listen for the voice.", show: { type: "passage", title: "The Elephant’s Child — Rudyard Kipling, Just So Stories (1902)", text: "In the High and Far-Off Times the Elephant, O Best Beloved, had no trunk. He had only a blackish, bulgy nose, as big as a boot, that he could wriggle about from side to side; but he couldn’t pick up things with it.\n\nBut there was one Elephant—a new Elephant—an Elephant’s Child—who was full of ’satiable curtiosity, and that means he asked ever so many questions. And he lived in Africa, and he filled all Africa with his ’satiable curtiosities." } },
    { say: "Notice the pattern in what follows. Kipling repeats a structure, like a song.", show: { type: "passage", title: "The Elephant’s Child (continued)", text: "He asked his tall aunt, the Ostrich, why her tail-feathers grew just so, and his tall aunt the Ostrich spanked him with her hard, hard claw. He asked his tall uncle, the Giraffe, what made his skin spotty, and his tall uncle, the Giraffe, spanked him with his hard, hard hoof. And still he was full of ’satiable curtiosity!\n\n[…] Then Kolokolo Bird said, with a mournful cry, “Go to the banks of the great grey-green, greasy Limpopo River, all set about with fever-trees, and find out.”" } },
    { say: "Kipling’s voice sounds <b>spoken</b>, not written. Each feature below is a deliberate choice.", show: { type: "table", rows: [["Feature", "Example", "Effect"], ["Direct address", "O Best Beloved", "Intimate; a parent at bedtime"], ["Repetition", "tall aunt… tall uncle…", "Rhythm; easy to remember"], ["Alliteration", "blackish, bulgy… boot", "Musical, comic sound"], ["Child’s mispronunciation", "’satiable curtiosity", "Playful; shows affection"]] } },
    { say: "Even the title of the collection is a clue: Kipling’s daughter wanted each story told <b>“just so”</b>, exactly the same words each time. Oral stories rely on fixed phrases so they can be remembered.", show: { type: "big", text: "“just so”\n= exactly the same, every telling" } },
    { say: "Word study. Kipling’s joke-word <b>’satiable</b> is short for <b>insatiable</b>. The Latin root <b>sat</b> means <b>enough</b>; the prefix <b>in-</b> means <b>not</b>. So insatiable means “never having enough.”", show: { type: "table", rows: [["Word", "Parts", "Meaning"], ["satisfy", "sat + facere (make)", "to make enough"], ["satiate", "sat + -ate", "to satisfy an appetite fully"], ["saturate", "satur (full)", "to soak until no more fits"], ["insatiable", "in + sat + able", "impossible to satisfy"]] } },
  ],
  practice: [
    { q: "Who is “Best Beloved”?", options: ["The listener, a child the narrator loves", "The Elephant’s Child", "The Kolokolo Bird", "Kipling’s aunt"], answer: "The listener, a child the narrator loves", hint: "Is “Best Beloved” a character who acts in the story, or someone being spoken to?", why: "The narrator addresses “Best Beloved” directly. It is the audience, originally Kipling’s own daughter, not a character." },
    { q: "Which phrase BEST describes the narrator’s voice?", options: ["Playful and affectionate, like a parent telling a bedtime story", "Cold and scientific", "Frightened and nervous", "Angry and bitter"], answer: "Playful and affectionate, like a parent telling a bedtime story", hint: "Listen to “O Best Beloved” and the silly word “curtiosity.” What mood do they create?", why: "Direct address to a loved child and joke words make the voice warm and playful." },
    { q: "“’Satiable curtiosity” is a playful version of which phrase?", options: ["insatiable curiosity", "satisfied curiosity", "sad curiosity", "curious satisfaction"], answer: "insatiable curiosity", hint: "Which real words do these sound like, with a few letters changed?", why: "’Satiable = insatiable (never satisfied); curtiosity = curiosity. The mispronunciation sounds like a child’s." },
    { q: "Using the root, “insatiable” curiosity means curiosity that...", options: ["can never be satisfied", "is very small", "is dangerous", "ends quickly"], answer: "can never be satisfied", hint: "in- = not; sat = enough; -able = able to be.", why: "Not able to be made enough: an insatiable curiosity is never satisfied." },
    { q: "Why does Kipling repeat “his tall aunt, the Ostrich” and “his tall uncle, the Giraffe” in the same pattern?", options: ["To create a rhythm, like an oral tale, and build up comic expectation", "Because he forgot he had written it", "To teach facts about ostriches", "To make the story shorter"], answer: "To create a rhythm, like an oral tale, and build up comic expectation", hint: "What happens to a listener when a pattern repeats? What do they begin to expect?", why: "Repetition gives the tale a song-like rhythm and makes the listener expect each new spanking, which is funny." },
    { q: "What does each relative do when the Elephant’s Child asks a question?", options: ["Spanks him", "Answers patiently", "Asks him a question back", "Sends him to the river"], answer: "Spanks him", hint: "Find the repeated verb.", why: "The aunt spanks him with her claw; the uncle spanks him with his hoof." },
    { q: "“And still he was full of ’satiable curtiosity!” What does the word STILL reveal about the Elephant’s Child?", options: ["Punishment does not stop his curiosity", "He stopped asking questions", "He stood very still", "He was finally satisfied"], answer: "Punishment does not stop his curiosity", hint: "Still = even after what?", why: "Even after the spankings, his curiosity remains. “Still” signals persistence." },
    { q: "Which phrase is an example of ALLITERATION (repeated first consonant sounds)?", options: ["grey-green, greasy", "tall aunt", "find out", "pick up things"], answer: "grey-green, greasy", hint: "Which phrase repeats the same opening sound?", why: "grey, green, greasy all begin with the /g/ sound." },
    { q: "This kind of story, which explains how something came to be (the elephant’s trunk), is called a...", options: ["pourquoi tale", "biography", "tragedy", "news report"], answer: "pourquoi tale", hint: "The French word for “why.”", why: "A pourquoi (why) tale explains an origin, here of the elephant’s trunk." },
    { q: "How many alliterating words begin with “b” in “blackish, bulgy nose, as big as a boot”?", type: "number", answer: 4, hint: "Count each word that starts with b.", why: "blackish, bulgy, big, boot: 4." },
    { q: "Before the story, the elephant “couldn’t pick up things with it.” What does this suggest the story will explain?", options: ["How the elephant got a trunk that can pick things up", "Why elephants live in Africa", "Why ostriches have claws", "How giraffes got spots"], answer: "How the elephant got a trunk that can pick things up", hint: "Pourquoi tales explain a change. What is missing at the start?", why: "Starting with “had no trunk” sets up the change the tale will explain." },
    { q: "Which word means “to soak something until it cannot hold any more”?", options: ["saturate", "satisfy", "sanitise", "satellite"], answer: "saturate", hint: "Look for the root meaning full.", why: "saturate, from Latin satur (full): to fill completely. (Satisfy shares the root but means “to make enough”; sanitise and satellite come from different roots.)" },
    { q: "Put the opening events in order.", type: "order", items: ["The Kolokolo Bird gives directions", "The Giraffe spanks him", "The Ostrich spanks him", "We learn the Elephant had no trunk"], answer: ["We learn the Elephant had no trunk", "The Ostrich spanks him", "The Giraffe spanks him", "The Kolokolo Bird gives directions"], hint: "The story first sets the scene, then the questions begin.", why: "Setting (no trunk), aunt Ostrich, uncle Giraffe, then the Kolokolo Bird’s advice." },
  ],
  challenge: [
    { q: "Kipling describes the Limpopo as “grey-green, greasy… all set about with fever-trees.” What is the MOST likely purpose of this unusual description?", options: ["To make the river sound strange, a little dangerous and unforgettable to a listener", "To give an accurate scientific map", "To show the river is clean and safe", "To make the story end quickly"], answer: "To make the river sound strange, a little dangerous and unforgettable to a listener", hint: "Think about sound (alliteration) and meaning (fever, grease). What feeling is created?", why: "The repeated g sounds make the phrase memorable when spoken, and “greasy” and “fever-trees” hint at danger. It suits an oral tale." },
    { q: "Curiosity gets the Elephant’s Child spanked, yet his curiosity is what eventually earns him a trunk. What THEME does this set up?", options: ["Curiosity may bring trouble, but it also leads to growth", "Children should never ask questions", "Relatives are always right", "Rivers are dangerous"], answer: "Curiosity may bring trouble, but it also leads to growth", hint: "Weigh the cost and the reward of his curiosity.", why: "The tale honours curiosity despite its cost: the questioning child is the one who changes and gains something new." },
    { q: "A “satiety” point in nutrition is the point at which you...", options: ["feel full and want no more", "feel hungry", "begin to cook", "fall asleep"], answer: "feel full and want no more", hint: "Same root, sat = enough.", why: "Satiety is the state of being satisfied, having had enough." },
  ],
  extend: "Read the whole of “The Elephant’s Child” and “How the Whale Got His Throat” in Kipling’s Just So Stories (free on Project Gutenberg). Make a list of every repeated phrase in “The Elephant’s Child” and explain what each repetition does.",
  offline: "Read The Lion, the Witch and the Wardrobe, chapters 1–3, and narrate each chapter in 3–5 sentences. Written response: copy C. S. Lewis’s first sentence and Kipling’s first sentence side by side, then write 3 sentences comparing the two narrators’ voices.",
},
// ═════════ Lesson 2 — Rikki-tikki-tavi ═════════
{
  title: "Characterisation: Rikki-tikki-tavi", icon: "🐍",
  learn: [
    { say: "<b>Characterisation</b> is how an author reveals who a character is. <b>Direct</b> characterisation tells us (“he was brave”). <b>Indirect</b> characterisation shows us, and we infer.", show: { type: "table", rows: [["Clue", "Ask"], ["Speech", "What does the character say, and how?"], ["Thoughts", "What do we learn of the inner life?"], ["Effect on others", "How do others react?"], ["Actions", "What does the character do?"], ["Looks", "How is the character described?"]] }, caption: "Remember S-T-E-A-L." },
    { say: "Read the opening of Kipling’s story from <b>The Jungle Book</b> (1894). Rikki-tikki-tavi is a mongoose living in India.", show: { type: "passage", title: "Rikki-Tikki-Tavi — Rudyard Kipling, The Jungle Book (1894)", text: "This is the story of the great war that Rikki-tikki-tavi fought single-handed, through the bath-rooms of the big bungalow in Segowlee cantonment.\n\nHe was a mongoose, rather like a little cat in his fur and his tail, but quite like a weasel in his head and his habits. His eyes and the end of his restless nose were pink. He could scratch himself anywhere he pleased with any leg, front or back, that he chose to use. He could fluff up his tail till it looked like a bottle brush, and his war cry as he scuttled through the long grass was: “Rikk-tikk-tikki-tikki-tchk!”" } },
    { say: "Notice the first sentence. It is grand, “the great war”, yet the battlefield is the <b>bath-rooms</b> of a house. That gap between grand words and a small subject is <b>mock-heroic</b> humour.", show: { type: "big", text: "“the great war” … “through the bath-rooms”" } },
    { say: "Later, the narrator states a rule of his nature: <b>“It is the hardest thing in the world to frighten a mongoose, because he is eaten up from nose to tail with curiosity.”</b> The motto of all the mongoose family, Kipling says, is <b>“Run and find out.”</b>", show: { type: "passage", title: "From the same story", text: "It is the hardest thing in the world to frighten a mongoose, because he is eaten up from nose to tail with curiosity. The motto of all the mongoose family is “Run and find out,” and Rikki-tikki was a true mongoose." } },
    { say: "Let us sort the clues about Rikki.", show: { type: "table", rows: [["Text evidence", "Type of clue", "Inference"], ["“restless nose”", "Looks", "Alert, always investigating"], ["“war-cry”", "Speech", "Bold; sees himself as a warrior"], ["“Run and find out”", "Direct statement", "Curious and fearless"], ["fought “single-handed”", "Actions", "Brave and independent"]] } },
    { say: "Word study. English borrowed many words from Hindi and other languages of India during British rule. Kipling’s <b>bungalow</b> is one.", show: { type: "table", rows: [["English word", "From", "Original meaning"], ["bungalow", "Hindi banglā", "a house in the Bengal style"], ["jungle", "Hindi jangal", "wild, uncultivated land"], ["shampoo", "Hindi chāmpo", "press, massage"], ["pyjamas", "Persian/Hindi pāy-jāma", "leg garment"]] } },
  ],
  practice: [
    { q: "“He was a mongoose, rather like a little cat in his fur and his tail.” This is mainly characterisation through...", options: ["looks", "speech", "thoughts", "effect on others"], answer: "looks", hint: "Is this about what he says, does, or how he appears?", why: "It describes his appearance: physical description." },
    { q: "Which detail BEST suggests that Rikki is alert and investigative?", options: ["“the end of his restless nose”", "“rather like a little cat”", "“the big bungalow”", "“front or back”"], answer: "“the end of his restless nose”", hint: "Which body part, described with which adjective, suggests always searching?", why: "A restless nose is always sniffing and searching, which suggests alertness and curiosity." },
    { q: "Why is it funny that “the great war” was fought “through the bath-rooms”?", options: ["Grand, heroic language is applied to a small household setting", "Wars are always fought in bathrooms", "The narrator is confused", "Mongooses like water"], answer: "Grand, heroic language is applied to a small household setting", hint: "Compare the size of the words with the size of the place.", why: "The mismatch between epic language and a humble setting is mock-heroic humour; yet to Rikki, the war is truly great." },
    { q: "“The motto of all the mongoose family is ‘Run and find out.’” This is which kind of characterisation?", options: ["Direct: the narrator tells us his nature", "Indirect: through his actions", "Through his effect on others", "Through his thoughts"], answer: "Direct: the narrator tells us his nature", hint: "Does the narrator SHOW us, or simply TELL us?", why: "The narrator states the mongoose nature outright: direct characterisation." },
    { q: "According to the narrator, why is a mongoose so hard to frighten?", options: ["He is eaten up with curiosity", "He is bigger than snakes", "He has sharp claws", "He sleeps all day"], answer: "He is eaten up with curiosity", hint: "Find the word “because.”", why: "“...because he is eaten up from nose to tail with curiosity.” Curiosity overpowers fear." },
    { q: "“Eaten up from nose to tail with curiosity” is a figure of speech meaning...", options: ["completely filled with curiosity", "literally eaten by something", "hungry", "injured"], answer: "completely filled with curiosity", hint: "Is anything actually eating him?", why: "It is an idiom (hyperbole): curiosity fills him entirely, from one end to the other." },
    { q: "“Single-handed” means...", options: ["alone, without help", "with one paw injured", "using a weapon", "quickly"], answer: "alone, without help", hint: "If you do something “single-handed,” how many helpers do you have?", why: "Single-handed means without help from anyone else, which emphasises his courage." },
    { q: "What does Rikki’s war cry, “Rikk-tikk-tikki-tikki-tchk!”, show?", options: ["He sees himself as a bold fighter", "He is afraid", "He is singing for fun", "He is calling his mother"], answer: "He sees himself as a bold fighter", hint: "What is a war-cry for?", why: "A war-cry is shouted before battle; he announces himself as a warrior. It is also onomatopoeia that gives him his name." },
    { q: "A mongoose is compared to two animals. Which two?", options: ["a cat and a weasel", "a dog and a rat", "a snake and a bird", "a cat and a dog"], answer: "a cat and a weasel", hint: "Read the second sentence.", why: "“rather like a little cat in his fur and his tail, but quite like a weasel in his head and his habits.”" },
    { q: "The word “bungalow” comes from Hindi and originally meant...", options: ["a house in the Bengal style", "a large palace", "a tent", "a garden"], answer: "a house in the Bengal style", hint: "Look at the word study table.", why: "bungalow < Hindi banglā, “of Bengal”: a low house of the type built in Bengal." },
    { q: "Which English word also comes from Hindi?", options: ["jungle", "castle", "library", "window"], answer: "jungle", hint: "Think of the title of Kipling’s book.", why: "jungle < Hindi jangal, wild land." },
    { q: "Kipling says Rikki was “a true mongoose.” What does the word TRUE add?", options: ["Rikki has the family’s curiosity in its fullest form", "Rikki is not a fake animal", "Rikki always tells the truth", "Rikki is the oldest mongoose"], answer: "Rikki has the family’s curiosity in its fullest form", hint: "True to what? Read the sentence just before.", why: "He perfectly embodies the family motto “Run and find out.”" },
    { q: "How many syllables are there in “Rikki-tikki-tavi”?", type: "number", answer: 6, hint: "Clap it slowly.", why: "Rik-ki-tik-ki-ta-vi: 6 syllables." },
  ],
  challenge: [
    { q: "Both the Elephant’s Child and Rikki-tikki-tavi are defined by curiosity. What is the KEY difference in how their curiosity is treated?", options: ["The elephant is punished for it; Rikki’s makes him fearless", "Both are punished", "Neither is curious", "Rikki is punished; the elephant is praised"], answer: "The elephant is punished for it; Rikki’s makes him fearless", hint: "How do others respond to each one’s questions?", why: "The elephant’s relatives spank him for asking; Rikki’s curiosity is presented as the source of his courage." },
    { q: "Why might Kipling announce “the great war” in the very FIRST sentence, before we meet any snake?", options: ["To create suspense and tell us the story’s scale before the details arrive", "Because he forgot to introduce the snakes", "To confuse the reader", "To show the war was unimportant"], answer: "To create suspense and tell us the story’s scale before the details arrive", hint: "What does a reader want to know after reading “the great war”?", why: "Announcing the conflict at once makes readers ask who the enemy is and how the war is won: suspense." },
    { q: "Which pair are BOTH examples of indirect characterisation?", options: ["his restless nose; his war cry", "“Rikki-tikki was a true mongoose”; his war cry", "“It is the hardest thing in the world to frighten a mongoose”; his tail", "the motto; the narrator’s statement"], answer: "his restless nose; his war cry", hint: "Indirect means we infer; we are not told outright.", why: "From the nose (looks) and the war-cry (speech) we infer his nature. The others are the narrator telling us directly." },
  ],
  extend: "Read the complete story “Rikki-Tikki-Tavi” in The Jungle Book. Make a STEAL chart for Rikki and for the cobra Nag, with one quotation for each letter.",
  offline: "Read The Lion, the Witch and the Wardrobe, chapters 4–7, with narration. Written response: choose Edmund or Lucy and write 4 sentences of indirect characterisation evidence (one each: speech, actions, looks, effect on others), with a short quotation for each.",

// ═════════ Lesson 3 — The Wind in the Willows ═════════
{
  title: "Setting and mood: The Wind in the Willows", icon: "🛶",
  learn: [
    { say: "<b>Setting</b> is where and when a story happens. <b>Mood</b> is the feeling the text creates in the reader. Authors build mood through <b>diction</b> (word choice), sentence rhythm and imagery.", show: { type: "list", items: ["Setting: place + time + conditions", "Mood: the reader’s feeling (cosy, tense, joyful)", "Diction: the author’s choice of words", "Imagery: language that appeals to the senses"] } },
    { say: "Kenneth Grahame published <b>The Wind in the Willows</b> in 1908. Read how the Mole begins his adventure.", show: { type: "passage", title: "The Wind in the Willows — Kenneth Grahame (1908), Chapter 1", text: "The Mole had been working very hard all the morning, spring-cleaning his little home. First with brooms, then with dusters; then on ladders and steps and chairs, with a brush and a pail of whitewash; till he had dust in his throat and eyes, and splashes of whitewash all over his black fur, and an aching back and weary arms." } },
    { say: "Now the turn. Watch how the sentence about spring changes the mood.", show: { type: "passage", title: "Chapter 1 (continued)", text: "Spring was moving in the air above and in the earth below and around him, penetrating even his dark and lowly little house with its spirit of divine discontent and longing. It was small wonder, then, that he suddenly flung down his brush on the floor, said “Bother!” and “O blow!” and also “Hang spring-cleaning!” and bolted out of the house without even waiting to put on his coat." } },
    { say: "The first sentence <b>piles up</b> tasks with semicolons and “then”, so it feels long and tiring, like the work. The second shifts to energetic verbs: flung, bolted. The rhythm itself creates the mood.", show: { type: "table", rows: [["Paragraph 1", "Paragraph 2"], ["dust, aching, weary", "spring, moving, longing"], ["long list of chores", "sudden verbs: flung, bolted"], ["mood: tired, stuffy", "mood: restless, joyful release"]] } },
    { say: "Later the Mole meets the Water Rat by the river, who declares his philosophy of life.", show: { type: "passage", title: "Chapter 1 — the Water Rat speaks", text: "“Believe me, my young friend, there is nothing—absolute nothing—half so much worth doing as simply messing about in boats.”" } },
    { say: "Word study. <b>Discontent</b> = dis- (not, apart) + content. Grahame’s phrase <b>“divine discontent”</b> is an <b>oxymoron</b>-like pairing: discontent is usually bad, but this restless longing is holy, good, the push toward new life.", show: { type: "table", rows: [["Prefix", "Meaning", "Examples"], ["dis-", "not, apart, reverse", "discontent, disagree, disappear"], ["pen- (Latin paene)", "almost", "peninsula (almost an island), penultimate (almost the last)"], ["con-/com-", "with, together", "content, combine, connect"]] } },
  ],
  practice: [
    { q: "What is the SETTING at the start?", options: ["The Mole’s little underground home in spring", "A river at night", "A city in winter", "A boat in summer"], answer: "The Mole’s little underground home in spring", hint: "Where is the Mole working, and what season is it?", why: "He is spring-cleaning his “dark and lowly little house” as spring begins." },
    { q: "What MOOD does the first paragraph create?", options: ["Weary and stuffy", "Terrifying", "Peaceful and sleepy", "Triumphant"], answer: "Weary and stuffy", hint: "Look at the words dust, aching, weary.", why: "Dust in his throat, an aching back and weary arms make the reader feel tired and cooped up." },
    { q: "Why does Grahame make the first sentence so long, with item after item?", options: ["The long list mirrors the endless, tiring work", "He did not know how to end it", "To teach how to clean", "To confuse the reader"], answer: "The long list mirrors the endless, tiring work", hint: "How does reading the sentence feel? How does the Mole feel?", why: "Form matches content: the reader trudges through the sentence as the Mole trudges through chores." },
    { q: "What causes the Mole to throw down his brush?", options: ["The restless spirit of spring", "He finished the cleaning", "The Rat called him", "He broke his ladder"], answer: "The restless spirit of spring", hint: "Read the sentence that begins “Spring was moving…”", why: "Spring’s “divine discontent and longing” penetrates his house, and so it is “small wonder” that he bolts." },
    { q: "Which verb shows the Mole’s SUDDEN energy?", options: ["bolted", "working", "waiting", "moving"], answer: "bolted", hint: "Which verb means to run off very fast?", why: "To bolt is to dash away suddenly, like a horse breaking loose." },
    { q: "“Penetrating even his dark and lowly little house.” Penetrating means...", options: ["getting inside, going through", "cleaning", "darkening", "leaving"], answer: "getting inside, going through", hint: "Spring is outside. What does it do to his underground house?", why: "Spring reaches into even his underground home: penetrate means to pass into or through." },
    { q: "Why does the Mole leave “without even waiting to put on his coat”?", options: ["His longing is so strong he cannot wait a moment", "He has no coat", "It is very hot", "He is angry at his coat"], answer: "His longing is so strong he cannot wait a moment", hint: "What does forgetting a coat tell you about someone’s hurry?", why: "Forgetting the coat shows impulsive urgency: he simply must get out." },
    { q: "The Mole says “Bother!”, “O blow!” and “Hang spring-cleaning!” What do these mild exclamations reveal?", options: ["He is exasperated, but gentle and respectable", "He is violent", "He is sad", "He is lying"], answer: "He is exasperated, but gentle and respectable", hint: "Are these strong words or polite, old-fashioned ones?", why: "They are very mild exclamations of annoyance; they make him comic and endearing." },
    { q: "In the Rat’s speech, why repeat “nothing—absolute nothing”?", options: ["For emphasis: he feels passionately about boats", "He forgot the word", "Because he is unsure", "To make the Mole sad"], answer: "For emphasis: he feels passionately about boats", hint: "What do we do with words when we feel strongly?", why: "Repeating the word, with “absolute” added, intensifies his enthusiasm. (In the book, Grahame also italicises “nothing.”)" },
    { q: "Which word in “divine discontent” has a prefix meaning “not”?", options: ["discontent", "divine", "neither"], answer: "discontent", hint: "dis- …", why: "dis- + content: not content, restless." },
    { q: "A peninsula is “almost an island.” Which part means “almost”?", options: ["pen-", "-insula", "-a"], answer: "pen-", hint: "Insula means island in Latin.", why: "paene (almost) + insula (island) = peninsula." },
    { q: "Put the Mole’s actions in order.", type: "order", items: ["He bolts out of the house", "He says “Hang spring-cleaning!”", "He works hard all morning", "He flings down his brush"], answer: ["He works hard all morning", "He flings down his brush", "He says “Hang spring-cleaning!”", "He bolts out of the house"], hint: "Follow the second paragraph closely.", why: "Work, fling the brush, exclaim, bolt out." },
    { q: "How many separate items of cleaning equipment does the first sentence name: brooms, dusters, ladders, steps, chairs, brush, pail?", type: "number", answer: 7, hint: "Count them one by one.", why: "brooms, dusters, ladders, steps, chairs, brush, pail: 7." },
  ],
  challenge: [
    { q: "Grahame writes of spring’s “divine discontent.” Why is this pairing surprising, and what does it mean?", options: ["Discontent is usually bad, but here restlessness is a holy, good urge toward life", "It means God is unhappy with the Mole", "It means spring is boring", "It means the Mole is content"], answer: "Discontent is usually bad, but here restlessness is a holy, good urge toward life", hint: "Is discontent normally praised? What does “divine” add?", why: "Pairing a negative word with a holy one reframes restlessness as a good, life-giving force that pushes the Mole into the world." },
    { q: "Which statement BEST describes how the passage’s structure supports its meaning?", options: ["Long, heavy chores give way to quick actions as the Mole breaks free", "Every sentence is the same length", "It begins with action and ends with chores", "It is written as a list of facts"], answer: "Long, heavy chores give way to quick actions as the Mole breaks free", hint: "Compare the rhythm of paragraph 1 with the verbs at the end of paragraph 2.", why: "The prose speeds up as he escapes. Structure enacts the story." },
    { q: "The Rat calls the Mole “my young friend.” What does this suggest about their relationship at this point?", options: ["The Rat is the experienced guide; the Mole is the newcomer", "They are enemies", "The Mole is older", "They are brothers"], answer: "The Rat is the experienced guide; the Mole is the newcomer", hint: "Who knows the river? Who has just arrived?", why: "The Rat speaks like a mentor to a beginner; the Mole has never been in a boat." },
  ],
  extend: "Read Chapter 1, “The River Bank,” of The Wind in the Willows in full. Find three sentences that create mood and write the mood beside each, with the key words underlined.",
  offline: "Read The Lion, the Witch and the Wardrobe, chapters 8–11. Written response: describe the mood of the endless winter in Narnia and the mood when the thaw begins. Quote two words from each part that create the mood.",
},
// ═════════ Lesson 4 — Review: Aesop ═════════
{
  title: "Review: Aesop’s fables", icon: "🦊",
  learn: [
    { say: "Review lesson. <b>Fables</b> are very short stories, often with animals, that end in a <b>moral</b>: a lesson stated outright. The fables credited to <b>Aesop</b>, said to have lived in Greece about 2,600 years ago, are among the oldest stories still told.", show: { type: "table", rows: [["Moral", "Theme"], ["Stated directly", "Usually implied"], ["A rule for behaviour", "An insight about life"], ["“Slow and steady wins the race.”", "Persistence can overcome talent."]] } },
    { say: "Here are two fables, retold in this course’s own words. Read the first.", show: { type: "passage", title: "The Fox and the Grapes — after Aesop (retold)", text: "A hungry Fox saw a bunch of ripe purple grapes hanging from a vine high on a trellis. He leapt for them and missed. He backed away, ran, and leapt again, higher, and missed again. He tried until his legs ached.\n\nAt last he sat down, looked up at the grapes, and sniffed. “They are probably sour anyway,” he said, and trotted off with his nose in the air.\n\nMoral: It is easy to scorn what you cannot have." } },
    { say: "Now the second fable.", show: { type: "passage", title: "The North Wind and the Sun — after Aesop (retold)", text: "The North Wind and the Sun argued about which of them was stronger. Seeing a traveller on the road, they agreed: whoever could make him take off his cloak would win.\n\nThe Wind blew first, with all his might. But the harder he blew, the more tightly the traveller wrapped his cloak around himself.\n\nThen the Sun shone gently and steadily. The traveller grew warm, then hot, and at last he took off his cloak and sat in the shade.\n\nMoral: Gentleness can succeed where force fails." } },
    { say: "Review of our tools so far: voice, characterisation and mood. Even a tiny fable uses them.", show: { type: "table", rows: [["Tool", "In the fables"], ["Characterisation", "The Fox’s sniff and nose in the air reveal pride"], ["Mood", "The Wind’s blasts feel harsh; the Sun’s warmth feels calm"], ["Structure", "Problem → attempts → result → moral"]] } },
    { say: "Word study. Fables gave English many <b>idioms</b>, fixed phrases whose meaning is not literal.", show: { type: "table", rows: [["Idiom", "Source", "Meaning"], ["sour grapes", "The Fox and the Grapes", "pretending not to want what you failed to get"], ["to cry wolf", "The Boy Who Cried Wolf", "to raise false alarms"], ["the lion’s share", "The Lion’s Share", "the largest part"], ["a wolf in sheep’s clothing", "Matthew 7:15 (later also told as a fable)", "an enemy pretending to be harmless"]] } },
  ],
  practice: [
    { q: "Why does the Fox say the grapes are probably sour?", options: ["To comfort his pride after failing", "He tasted them", "He saw a sign", "He does not like purple"], answer: "To comfort his pride after failing", hint: "Did he know they were sour? When did he decide so?", why: "He only calls them sour after he fails. It soothes his pride." },
    { q: "Which detail reveals the Fox’s PRIDE through action?", options: ["He trotted off with his nose in the air", "He leapt for the grapes", "His legs ached", "He saw the grapes"], answer: "He trotted off with his nose in the air", hint: "Which gesture shows someone acting superior?", why: "Nose in the air is a gesture of disdain and pride: indirect characterisation." },
    { q: "Someone loses a race and says, “I didn’t want that silly medal anyway.” This is...", options: ["sour grapes", "crying wolf", "the lion’s share", "a wolf in sheep’s clothing"], answer: "sour grapes", hint: "Which idiom means scorning what you could not get?", why: "Dismissing what you failed to win is exactly the Fox’s “sour grapes.”" },
    { q: "In “The North Wind and the Sun,” what happens when the Wind blows harder?", options: ["The traveller holds his cloak more tightly", "The cloak flies away", "The traveller runs home", "The Sun gives up"], answer: "The traveller holds his cloak more tightly", hint: "Find “the harder he blew…”", why: "“The harder he blew, the more tightly the traveller wrapped his cloak around himself.”" },
    { q: "What is the MORAL of “The North Wind and the Sun”?", options: ["Gentleness can succeed where force fails", "The Sun is stronger than the Wind in summer", "Always wear a cloak", "Never argue"], answer: "Gentleness can succeed where force fails", hint: "It is stated at the end.", why: "The moral is stated directly: gentleness succeeds where force fails." },
    { q: "Which is a THEME (an insight) rather than the plot?", options: ["Persuasion works better than pressure", "The Sun shone on a traveller", "The Wind blew hard", "The traveller took off his cloak"], answer: "Persuasion works better than pressure", hint: "Which statement is a general truth about life?", why: "It is a general insight that applies beyond this story." },
    { q: "Put the North Wind fable in order.", type: "order", items: ["The Sun shines gently", "The Wind blows with all his might", "They argue about strength", "The traveller removes his cloak"], answer: ["They argue about strength", "The Wind blows with all his might", "The Sun shines gently", "The traveller removes his cloak"], hint: "Problem, attempt one, attempt two, result.", why: "Argument, the Wind’s attempt, the Sun’s attempt, the result." },
    { q: "Which word BEST describes the Sun’s method?", options: ["patient", "violent", "lazy", "boastful"], answer: "patient", hint: "The Sun shone “gently and steadily.”", why: "Steady, gentle shining over time: patience." },
    { q: "A person who pretends to be your friend while plotting against you is...", options: ["a wolf in sheep’s clothing", "sour grapes", "the lion’s share", "crying wolf"], answer: "a wolf in sheep’s clothing", hint: "Which idiom involves a disguise?", why: "An enemy disguised as harmless." },
    { q: "Why do fables usually use ANIMALS instead of people?", options: ["Animals stand for types of human behaviour, so the lesson feels general and safe", "Animals can really talk", "People did not exist then", "Animals are funnier than people in every case"], answer: "Animals stand for types of human behaviour, so the lesson feels general and safe", hint: "Is the fable really about foxes?", why: "The fox stands for any proud person. Using animals makes the lesson universal and lets listeners laugh at a fault without feeling accused." },
    { q: "How many separate times does the passage explicitly say the Fox leapt?", type: "number", answer: 2, hint: "Count the word “leapt.”", why: "“He leapt for them” and “leapt again”: 2 explicit leaps (then he kept trying)." },
    { q: "Which tool did the author use in “his legs ached”?", options: ["A detail that shows effort", "A moral", "An idiom", "A rhyme"], answer: "A detail that shows effort", hint: "What does aching tell us about how hard he tried?", why: "Aching legs show he tried very hard, which makes his excuse afterwards more revealing." },
  ],
  challenge: [
    { q: "The Fox’s excuse is an example of what psychologists call “rationalising.” What does rationalising mean?", options: ["Inventing a reasonable-sounding excuse to protect your feelings", "Thinking very logically", "Dividing food fairly", "Telling a story about animals"], answer: "Inventing a reasonable-sounding excuse to protect your feelings", hint: "Did the Fox have a real reason, or a convenient one?", why: "He invents a reason (sourness) after the fact to avoid admitting failure: rationalising." },
    { q: "Both fables show an attempt that fails. What is the KEY difference in how each character responds to failure?", options: ["The Wind’s failure leads to a better method; the Fox only makes excuses", "Both give up and make excuses", "The Fox tries a new method; the Wind makes an excuse", "Neither fails"], answer: "The Wind’s failure leads to a better method; the Fox only makes excuses", hint: "In one fable a better method wins; in the other, what does the loser do?", why: "One fable shows a better approach succeeding; the other shows a character covering failure with pride." },
    { q: "Which modern situation BEST illustrates “The North Wind and the Sun”?", options: ["A teacher wins over a stubborn student with patience rather than shouting", "A runner loses and blames the shoes", "A boy pretends there is a fire", "A lion takes most of the food"], answer: "A teacher wins over a stubborn student with patience rather than shouting", hint: "Which example shows gentleness beating force?", why: "Patience succeeding where pressure would make the student resist matches the fable." },
  ],
  extend: "Read twenty of Aesop’s fables (the 1867 George Fyler Townsend translation is free online). For five of them, write the moral in your own words and then a deeper theme in one sentence.",
  offline: "Read The Lion, the Witch and the Wardrobe, chapters 12–14. Read a Magic Tree House chapter aloud with expression. Oral response: compose your own fable (with animals and a stated moral) and tell it to the family. Portfolio: choose and date your best copywork page and narration.",
},
// ═════════ Lesson 5 — Treasure Island ═════════
{
  title: "Point of view: Treasure Island", icon: "🏴‍☠️",
  learn: [
    { say: "<b>Point of view</b> is the position from which a story is told. In <b>first person</b>, the narrator is a character (“I”). A <b>retrospective</b> first-person narrator tells events from later in life, looking back.", show: { type: "table", rows: [["Point of view", "Pronouns", "What we can know"], ["First person", "I, we", "Only what the narrator saw, thought, or learned"], ["Third person limited", "he, she", "One character’s thoughts"], ["Third person omniscient", "he, she, they", "Anyone’s thoughts; an all-knowing narrator"]] } },
    { say: "Robert Louis Stevenson’s <b>Treasure Island</b> (1883) is narrated by Jim Hawkins. Read his opening sentence. It is a single, very long sentence.", show: { type: "passage", title: "Treasure Island — Robert Louis Stevenson (1883), Chapter 1", text: "Squire Trelawney, Dr. Livesey, and the rest of these gentlemen having asked me to write down the whole particulars about Treasure Island, from the beginning to the end, keeping nothing back but the bearings of the island, and that only because there is still treasure not yet lifted, I take up my pen in the year of grace 17—, and go back to the time when my father kept the Admiral Benbow inn and the brown old seaman with the sabre cut first took up his lodging under our roof." } },
    { say: "Now Jim describes the old seaman’s arrival. Notice <b>“I remember him as if it were yesterday”</b>: we hear the older Jim remembering.", show: { type: "passage", title: "Treasure Island, Chapter 1 (continued)", text: "I remember him as if it were yesterday, as he came plodding to the inn door, his sea-chest following behind him in a hand-barrow—a tall, strong, heavy, nut-brown man, his tarry pigtail falling over the shoulder of his soiled blue coat, his hands ragged and scarred, with black, broken nails, and the sabre cut across one cheek, a dirty, livid white." } },
    { say: "The first sentence quietly tells us a great deal. Read it as a detective would.", show: { type: "table", rows: [["Clue in the sentence", "What we infer"], ["“asked me to write down”", "Jim survives the adventure"], ["“keeping nothing back but the bearings”", "He knows where the island is"], ["“treasure not yet lifted”", "Some treasure is still there: a hook for the reader"], ["“17—”", "He hides the exact year: secrecy, or caution"]] } },
    { say: "Stevenson’s description uses precise, physical adjectives. Each one hints at a hard, violent past.", show: { type: "list", items: ["plodding: slow, heavy steps", "tarry pigtail: a sailor’s hair dressed with tar", "ragged and scarred hands: years of hard labour, perhaps fighting", "sabre cut … livid white: an old sword wound, pale and ugly"] } },
    { say: "Word study. <b>Livid</b> comes from Latin <b>lividus</b>, “bluish, lead-coloured.” It once meant the pale or bruised colour of a scar; today it often means “furious” (as if pale with rage). Words drift in meaning over time.", show: { type: "table", rows: [["Word", "Older meaning", "Common modern meaning"], ["livid", "bluish-grey, pale (like a bruise or scar)", "furiously angry"], ["particulars", "details", "details (still used formally)"], ["bearings", "position and direction (navigation)", "also: sense of where you are"]] } },
  ],
  practice: [
    { q: "From which point of view is Treasure Island told?", options: ["First person, by Jim Hawkins", "Third person omniscient", "Third person, by the Squire", "Second person"], answer: "First person, by Jim Hawkins", hint: "Look at the pronouns: “asked me,” “I take up my pen.”", why: "The narrator uses I and me and is a character in the story: first person." },
    { q: "What can we infer from the fact that Jim is writing the story down?", options: ["He survived the adventure", "He died on the island", "He never went to the island", "He is a pirate"], answer: "He survived the adventure", hint: "Can someone write about events after they happened if they did not survive?", why: "A retrospective narrator must have lived through the events to tell them." },
    { q: "Why does Jim keep back “the bearings of the island”?", options: ["There is still treasure not yet lifted", "He forgot them", "The Squire lost the map", "The island sank"], answer: "There is still treasure not yet lifted", hint: "Read the phrase right after “bearings.”", why: "“...and that only because there is still treasure not yet lifted.” Revealing the position would let others take it." },
    { q: "What does “bearings” mean here?", options: ["The exact position and direction for finding the island", "Ball bearings in a machine", "Bears on the island", "The way someone behaves"], answer: "The exact position and direction for finding the island", hint: "Think of navigation at sea.", why: "In navigation, bearings are directions and positions: how to find the island." },
    { q: "Who asked Jim to write the story?", options: ["Squire Trelawney, Dr. Livesey and other gentlemen", "His father", "The old seaman", "His mother"], answer: "Squire Trelawney, Dr. Livesey and other gentlemen", hint: "The first words of the sentence.", why: "“Squire Trelawney, Dr. Livesey, and the rest of these gentlemen having asked me…”" },
    { q: "Where did Jim’s father work?", options: ["The Admiral Benbow inn", "A ship", "A bank", "A farm"], answer: "The Admiral Benbow inn", hint: "Find “my father kept…”", why: "“...when my father kept the Admiral Benbow inn.”" },
    { q: "“I remember him as if it were yesterday.” What does this sentence show about the narrator?", options: ["He is older now, looking back on a vivid memory", "The events happened yesterday", "He has a poor memory", "He is still a child as he writes"], answer: "He is older now, looking back on a vivid memory", hint: "“As if” it were yesterday: so was it actually yesterday?", why: "“As if” shows it was long ago, yet the memory is vivid. This is the retrospective narrator’s voice." },
    { q: "Which detail BEST suggests the seaman has a violent past?", options: ["the sabre cut across one cheek", "his blue coat", "his sea-chest", "his tall height"], answer: "the sabre cut across one cheek", hint: "A sabre is a sword.", why: "A sword scar strongly suggests he has been in fights." },
    { q: "“Plodding” describes a walk that is...", options: ["slow and heavy", "light and quick", "silent", "skipping"], answer: "slow and heavy", hint: "He is heavy and pulling a sea-chest.", why: "To plod is to walk slowly and heavily." },
    { q: "Why might Stevenson leave the year as “17—”?", options: ["To make the narrator seem secretive and the tale seem real", "He did not know the century", "It was a printing mistake", "To show the story is in the future"], answer: "To make the narrator seem secretive and the tale seem real", hint: "What else is Jim keeping back in the same sentence?", why: "Like the hidden bearings, the hidden date suits a cautious narrator and makes the account feel like a true memoir." },
    { q: "The old meaning of LIVID describes a colour that is...", options: ["pale bluish-grey, like a bruise", "bright red", "golden", "green as grass"], answer: "pale bluish-grey, like a bruise", hint: "Latin lividus = lead-coloured.", why: "Livid originally meant bluish, leaden, the colour of a bruise or old scar." },
    { q: "Put these in the order they happen in TIME (not in the telling).", type: "order", items: ["Jim writes down the story", "The seaman arrives at the inn", "Jim’s father keeps the inn"], answer: ["Jim’s father keeps the inn", "The seaman arrives at the inn", "Jim writes down the story"], hint: "Which happened first in Jim’s life? Which happened last?", why: "His father keeps the inn, the seaman arrives, and years later Jim writes the account." },
    { q: "How many separate adjectives describe the man in “a tall, strong, heavy, nut-brown man”?", type: "number", answer: 4, hint: "Count the describing words before “man.”", why: "tall, strong, heavy, nut-brown: 4." },
  ],
  challenge: [
    { q: "A retrospective first-person narrator knows how the story ends. Which effect does Stevenson create by letting Jim hint at the ending in the first sentence?", options: ["Suspense of a special kind: we know Jim survives, so we read to learn HOW", "No suspense at all, because we know everything", "Confusion about who the narrator is", "A sense that Jim is lying"], answer: "Suspense of a special kind: we know Jim survives, so we read to learn HOW", hint: "If you know a hero survives, what question still drives you on?", why: "Knowing the outcome shifts suspense from “whether” to “how,” and the unlifted treasure adds a new mystery." },
    { q: "Which change would MOST alter the opening if the story were told by an omniscient narrator?", options: ["We could learn the seaman’s own secret thoughts as he arrived", "The inn would have a different name", "The seaman would have no scar", "Jim would be older"], answer: "We could learn the seaman’s own secret thoughts as he arrived", hint: "What can an omniscient narrator know that Jim cannot?", why: "An omniscient narrator could reveal the seaman’s mind; Jim can only describe what he saw, which keeps the seaman mysterious." },
    { q: "Stevenson’s opening sentence has about 90 words. What is the BEST reason for its length?", options: ["It imitates a formal old memoir, setting up Jim’s situation in one sweep", "Long sentences are always better", "Stevenson was paid by the sentence", "It is a list of treasure"], answer: "It imitates a formal old memoir, setting up Jim’s situation in one sweep", hint: "Who is Jim writing for, and in what century?", why: "The long, formal sentence suits an 18th-century memoir written at the request of gentlemen, and gives who, why, when and where at once." },
  ],
  extend: "Read Chapters 1–3 of Treasure Island. Each time Jim says something like “I remember” or reveals knowledge from later, note the page. Write a paragraph: what does the older Jim know that the younger Jim did not?",
  offline: "Finish The Lion, the Witch and the Wardrobe (chapters 15–17). Written response: Lewis’s narrator sometimes speaks to the reader directly. Find one example and compare it with Jim Hawkins’s voice in 4 sentences.",
},
// ═════════ Lesson 6 — Parody: Watts and Carroll ═════════
{
  title: "Parody: the bee and the crocodile", icon: "🐊",
  learn: [
    { say: "A <b>parody</b> imitates the form of another work to change its meaning, usually for humour. To appreciate a parody, you must know the original.", show: { type: "list", items: ["Parody: an imitation that copies form but changes meaning", "Tone: the author’s attitude (earnest, ironic, playful)", "Irony: a gap between what is said and what is meant", "Didactic: written to teach a moral lesson"] } },
    { say: "First, the original. Isaac Watts wrote this <b>didactic</b> poem for children in 1715. Line breaks are shown with a slash (/).", show: { type: "passage", title: "Against Idleness and Mischief — Isaac Watts (1715), first stanza", text: "How doth the little busy bee / Improve each shining hour, / And gather honey all the day / From every opening flower!" } },
    { say: "In <b>Alice’s Adventures in Wonderland</b> (1865), Alice tries to recite Watts’s poem, but different words come out. Lewis Carroll turned the busy bee into a crocodile in the Nile.", show: { type: "passage", title: "How Doth the Little Crocodile — Lewis Carroll, Alice’s Adventures in Wonderland (1865)", text: "How doth the little crocodile / Improve his shining tail, / And pour the waters of the Nile / On every golden scale!\n\nHow cheerfully he seems to grin, / How neatly spread his claws, / And welcome little fishes in / With gently smiling jaws!" } },
    { say: "Compare them line by line. The <b>form</b> is identical; the <b>meaning</b> is reversed.", show: { type: "table", rows: [["Watts", "Carroll"], ["the little busy bee", "the little crocodile"], ["improve each shining hour", "improve his shining tail"], ["gather honey (useful work)", "pour water on his scales (vanity)"], ["a model of virtue", "a smiling predator"]] } },
    { say: "Carroll’s tone is <b>ironic</b>. Words like “cheerfully”, “neatly”, “welcome” and “gently smiling” sound kind, but the fish are being welcomed into the jaws of a predator. The polite words hide a menace.", show: { type: "big", text: "“And welcome little fishes in\nWith gently smiling jaws!”" } },
    { say: "Word study. Both poems use <b>archaic</b> (old-fashioned) verb forms. In older English, <b>-th</b> or <b>-eth</b> marked the third person singular, where we now use <b>-s</b>.", show: { type: "table", rows: [["Archaic", "Modern"], ["doth", "does"], ["hath", "has"], ["he improveth", "he improves"], ["thou art", "you are"]] } },
  ],
  practice: [
    { q: "What is a parody?", options: ["An imitation that copies a work’s form but changes its meaning", "A poem about animals", "A true story", "A list of morals"], answer: "An imitation that copies a work’s form but changes its meaning", hint: "Carroll keeps the shape of Watts’s poem. What does he change?", why: "A parody imitates the original’s form and turns its meaning, often for comedy." },
    { q: "What is the PURPOSE of Watts’s original poem?", options: ["To teach children to be busy and use their time well", "To make fun of bees", "To describe the Nile", "To warn about crocodiles"], answer: "To teach children to be busy and use their time well", hint: "The poem’s title is “Against Idleness and Mischief.”", why: "It is didactic: the bee is a model of diligence for children." },
    { q: "In Carroll’s version, how does the crocodile “improve his shining tail”?", options: ["By pouring Nile water over his golden scales", "By working hard", "By gathering honey", "By catching flowers"], answer: "By pouring Nile water over his golden scales", hint: "Read lines 3–4 of the first stanza.", why: "“And pour the waters of the Nile / On every golden scale!” He is polishing himself, not working." },
    { q: "What is the TONE of “And welcome little fishes in / With gently smiling jaws”?", options: ["Ironic: friendly words describe a predator eating", "Sincere and gentle", "Angry", "Sad"], answer: "Ironic: friendly words describe a predator eating", hint: "What really happens to fishes welcomed into a crocodile’s jaws?", why: "The kind words contrast with the deadly action: verbal irony with a darkly comic tone." },
    { q: "Which word from Watts’s poem does Carroll keep exactly?", options: ["shining", "honey", "flower", "hour"], answer: "shining", hint: "Compare line 2 of each poem.", why: "“Improve each shining hour” becomes “Improve his shining tail.”" },
    { q: "“Doth” is the archaic form of...", options: ["does", "do", "did", "done"], answer: "does", hint: "How doth = How ___ the bee…?", why: "doth = does (third person singular)." },
    { q: "The modern form of “hath” is...", options: ["has", "have", "had", "hate"], answer: "has", hint: "Same pattern as doth/does.", why: "hath = has." },
    { q: "Why does Carroll set his crocodile in the NILE?", options: ["Nile crocodiles are famous, and the exotic setting fits Wonderland’s strangeness", "Bees live in the Nile", "Alice lived in Egypt", "Watts mentioned the Nile"], answer: "Nile crocodiles are famous, and the exotic setting fits Wonderland’s strangeness", hint: "What animal is the Nile famous for?", why: "The Nile is the classic home of crocodiles; it adds an exotic, comic contrast to an English nursery poem." },
    { q: "What is the rhyme scheme of each stanza of Carroll’s poem?", options: ["ABAB", "AABB", "ABCD", "AAAA"], answer: "ABAB", hint: "Do lines 1 and 3 rhyme? Lines 2 and 4?", why: "crocodile/Nile (A), tail/scale (B); grin/in, claws/jaws: ABAB. (Watts’s first stanza rhymes only lines 2 and 4, hour/flower: ABCB.)" },
    { q: "Which pair rhymes in Carroll’s first stanza?", options: ["tail / scale", "crocodile / tail", "Nile / scale", "grin / claws"], answer: "tail / scale", hint: "Lines 2 and 4.", why: "tail and scale rhyme (B); crocodile and Nile rhyme (A)." },
    { q: "In Watts, the bee is a model of diligence. In Carroll, the crocodile is a model of...", options: ["vanity and sly menace", "hard work", "kindness", "honesty"], answer: "vanity and sly menace", hint: "He polishes himself and smiles at fish he will eat.", why: "Self-polishing shows vanity; the smiling jaws show hidden menace." },
    { q: "How many lines are in each stanza?", type: "number", answer: 4, hint: "Count the slashes plus one.", why: "Each stanza is a quatrain: 4 lines." },
    { q: "Put Carroll’s images in the order they appear.", type: "order", items: ["welcome little fishes", "pours the waters of the Nile", "spread his claws", "improves his shining tail"], answer: ["improves his shining tail", "pours the waters of the Nile", "spread his claws", "welcome little fishes"], hint: "Read the poem from the top.", why: "Tail, Nile water, claws, fishes." },
  ],
  challenge: [
    { q: "Why might Carroll have had ALICE accidentally recite the parody?", options: ["To show Wonderland twists even the lessons she learned by heart", "Because Alice could not read", "To praise Watts", "To teach facts about crocodiles"], answer: "To show Wonderland twists even the lessons she learned by heart", hint: "In Wonderland, does anything stay as it should?", why: "Her schoolroom poem comes out wrong, showing Wonderland upsetting the moral order of the nursery, which is also a gentle joke at preachy children’s verse." },
    { q: "A reader who has never heard Watts’s poem reads Carroll’s. What do they MOST likely miss?", options: ["The joke that a hard-working moral bee has become a vain, sly predator", "That the poem rhymes", "That crocodiles have claws", "That the Nile is a river"], answer: "The joke that a hard-working moral bee has become a vain, sly predator", hint: "A parody depends on knowledge of…?", why: "Parody works through contrast with the original; without Watts, the reversal of the moral is lost." },
    { q: "Which word in Carroll’s poem MOST strongly creates the irony?", options: ["gently", "Nile", "scale", "tail"], answer: "gently", hint: "Which word is most at odds with what is actually happening?", why: "“Gently smiling jaws” is the sharpest contradiction: nothing about being eaten is gentle." },
  ],
  extend: "Read Chapter 2 of Alice’s Adventures in Wonderland, where the crocodile poem appears. Then read “You Are Old, Father William” (Chapter 5) and find the original it parodies, Robert Southey’s “The Old Man’s Comforts.”",
  offline: "Read Charlotte’s Web, chapters 1–4, and find the Nile on a map with your Story of the World chapter. Written response: write your own parody of a short rhyme you know by heart (for example “Twinkle, Twinkle”), keeping its rhythm and rhyme but changing its meaning. Read both versions aloud and explain your joke.",
},
// ═════════ Lesson 7 — Primary sources: Thanksgiving (light week) ═════════
{
  title: "Primary sources: giving thanks", icon: "🌾",
  learn: [
    { say: "A <b>primary source</b> was created at the time, by someone who was there or involved. A <b>secondary source</b> is written later, about those events. Historians read primary sources closely, asking who wrote it, when, for whom, and why.", show: { type: "table", rows: [["Ask", "Why it matters"], ["Who wrote it?", "Their position shapes what they notice"], ["When?", "Close in time usually means more detail"], ["For whom (audience)?", "Writers shape words for their readers"], ["Why (purpose)?", "To inform, persuade, record, or praise"]] } },
    { say: "In December 1621, the Pilgrim Edward Winslow wrote a letter to a friend in England. It is the only surviving eyewitness description of the harvest celebration we now call the first Thanksgiving. (Modernised spelling, as printed in <b>A Journal of the Pilgrims at Plymouth: Mourt’s Relation</b>, first published 1622.)", show: { type: "passage", title: "Edward Winslow, letter of 11 December 1621", text: "Our harvest being gotten in, our governor sent four men on fowling, that so we might after a special manner rejoice together after we had gathered the fruit of our labors. They four in one day killed as much fowl as, with a little help beside, served the company almost a week. At which time, amongst other recreations, we exercised our arms, many of the Indians coming amongst us, and among the rest their greatest king Massasoit, with some ninety men, whom for three days we entertained and feasted, and they went out and killed five deer, which they brought to the plantation and bestowed on our governor, and upon the captain and others." } },
    { say: "Two hundred and forty-two years later, during the Civil War, President Abraham Lincoln proclaimed a national day of Thanksgiving. The text was drafted by his Secretary of State, William H. Seward, and issued over Lincoln’s signature. Here is its opening.", show: { type: "passage", title: "Abraham Lincoln, Thanksgiving Proclamation, 3 October 1863", text: "The year that is drawing towards its close has been filled with the blessings of fruitful fields and healthful skies. To these bounties, which are so constantly enjoyed that we are prone to forget the source from which they come, others have been added which are of so extraordinary a nature that they cannot fail to penetrate and soften even the heart which is habitually insensible to the ever-watchful providence of Almighty God." } },
    { say: "Two primary sources, two very different purposes.", show: { type: "table", rows: [["", "Winslow (1621)", "Lincoln (1863)"], ["Form", "private letter", "public proclamation"], ["Audience", "a friend in England", "the whole nation"], ["Purpose", "report news; encourage settlers", "call a divided nation to gratitude"], ["Style", "plain, factual", "formal, rhythmic, elevated"]] } },
    { say: "Word study. Latin <b>gratia</b> means thanks or favour. It gives us a whole family of words.", show: { type: "table", rows: [["Word", "Meaning"], ["gratitude", "thankfulness"], ["gratis", "free (as a favour)"], ["gratuitous", "given freely; also, unnecessary"], ["congratulate", "to share thanks/joy with someone (con- = with)"], ["ingrate", "an ungrateful person (in- = not)"]] } },
  ],
  practice: [
    { q: "Why is Winslow’s letter a PRIMARY source?", options: ["He was there and wrote at the time", "It was written by a historian later", "It is in a textbook", "It is very short"], answer: "He was there and wrote at the time", hint: "Primary = created by someone involved, at the time.", why: "Winslow took part in the harvest celebration and wrote about it within weeks." },
    { q: "How many men did the governor send “fowling” (hunting birds)?", type: "number", answer: 4, hint: "Read the first sentence.", why: "“our governor sent four men on fowling.”" },
    { q: "About how many men came with Massasoit?", type: "number", answer: 90, hint: "Find “with some … men.”", why: "“their greatest king Massasoit, with some ninety men.”" },
    { q: "How many days did the feasting last?", type: "number", answer: 3, hint: "Find “for … days we entertained and feasted.”", why: "“whom for three days we entertained and feasted.”" },
    { q: "What did Massasoit’s men contribute?", options: ["Five deer", "Four turkeys", "Ninety fish", "Corn bread"], answer: "Five deer", hint: "Read the end of the passage.", why: "“they went out and killed five deer, which they brought to the plantation.”" },
    { q: "How many years passed between Winslow’s letter (1621) and Lincoln’s proclamation (1863)?", type: "number", answer: 242, hint: "Subtract 1621 from 1863.", why: "1863 − 1621 = 242 years." },
    { q: "Who was Lincoln’s AUDIENCE?", options: ["The whole nation", "A single friend", "The Pilgrims", "The army only"], answer: "The whole nation", hint: "Is a proclamation private or public?", why: "A presidential proclamation is addressed to all citizens." },
    { q: "Lincoln says the blessings are “so constantly enjoyed that we are prone to forget the source.” What does “prone to” mean?", options: ["likely to", "unable to", "afraid to", "forbidden to"], answer: "likely to", hint: "If you are prone to colds, you often…", why: "Prone to = inclined or likely to. We easily forget the giver of things we always have." },
    { q: "Which word BEST describes Lincoln’s style compared with Winslow’s?", options: ["more formal and elevated", "more casual", "shorter and plainer", "humorous"], answer: "more formal and elevated", hint: "Compare “fowling” with “the ever-watchful providence of Almighty God.”", why: "Lincoln’s long, rhythmic sentences and lofty vocabulary suit a solemn public occasion." },
    { q: "“Gratis” means...", options: ["free of charge", "grateful", "very large", "angry"], answer: "free of charge", hint: "Given as a favour (gratia).", why: "Gratis: done as a favour, so free." },
    { q: "An “ingrate” is...", options: ["an ungrateful person", "a fireplace", "a grateful guest", "a farmer"], answer: "an ungrateful person", hint: "in- = not; grat = thanks.", why: "in + grat: someone who does not give thanks." },
    { q: "Lincoln wrote during the Civil War. Why might it be striking that he called for thanks THEN?", options: ["The nation was suffering, yet he asked people to notice their blessings", "The war had ended", "Everyone was already celebrating", "He wanted to start a war"], answer: "The nation was suffering, yet he asked people to notice their blessings", hint: "What was happening in 1863?", why: "In the middle of a terrible war, gratitude was a deliberate, unifying act." },
  ],
  challenge: [
    { q: "Winslow wrote to someone in England, where people were deciding whether to join the colony. How might this audience have shaped his letter?", options: ["He emphasised plenty and friendship to encourage others to come", "He described only hardships to discourage them", "He wrote in Latin", "He hid the harvest from them"], answer: "He emphasised plenty and friendship to encourage others to come", hint: "If you wanted friends to join you, what would you stress?", why: "Historians note the letter promotes the colony; a good harvest and peaceful neighbours would encourage settlers. Purpose shapes content." },
    { q: "Which question would a careful historian ask about Winslow’s account?", options: ["What might the Wampanoag guests have recorded differently, had they written it down?", "What colour was Winslow’s coat?", "Did Winslow like poetry?", "How many letters are in Massasoit?"], answer: "What might the Wampanoag guests have recorded differently, had they written it down?", hint: "Every source has a point of view. Whose view is missing?", why: "Only the English side was written down. A good historian asks whose perspective is missing." },
    { q: "Lincoln’s sentence says the blessings could “soften even the heart which is habitually insensible.” Which device is he using?", options: ["Metaphor: a hard heart that can be softened", "Simile with “like”", "Onomatopoeia", "Alliteration only"], answer: "Metaphor: a hard heart that can be softened", hint: "Is a heart literally hard or soft here?", why: "A “hard” heart that can be “softened” is a metaphor for an unfeeling person becoming grateful." },
  ],
  extend: "Read the whole of Lincoln’s 1863 Thanksgiving Proclamation (it is short). List every blessing he names despite the war, then write one paragraph on why he included them.",
  offline: "Read Charlotte’s Web, chapters 5–8. Write a thank-you card to someone who serves your family, copying two sentences in your best handwriting. Oral response at dinner: each person names one specific blessing, as Lincoln did.",
},
// ═════════ Lesson 8 — Review: Dickinson and Tennyson ═════════
{
  title: "Review: poems of feathers", icon: "🦅",
  learn: [
    { say: "Review lesson, with poetry. A <b>metaphor</b> states that one thing <b>is</b> another. An <b>extended metaphor</b> continues the comparison through a whole poem. <b>Personification</b> gives human qualities to non-human things.", show: { type: "list", items: ["Metaphor: “Hope is the thing with feathers”", "Extended metaphor: the comparison continues stanza after stanza", "Personification: the sea “crawls”", "Alliteration: “clasps the crag with crooked hands”"] } },
    { say: "Emily Dickinson wrote this poem around 1861; it was first published in 1891, after her death, by editors who changed her many dashes into ordinary punctuation. This is the 1891 text.", show: { type: "passage", title: "Hope is the thing with feathers — Emily Dickinson, Poems, Second Series (1891)", text: "Hope is the thing with feathers / That perches in the soul, / And sings the tune without the words, / And never stops at all,\n\nAnd sweetest in the gale is heard; / And sore must be the storm / That could abash the little bird / That kept so many warm.\n\nI ’ve heard it in the chillest land, / And on the strangest sea; / Yet, never, in extremity, / It asked a crumb of me." } },
    { say: "Alfred, Lord Tennyson first published this short poem in 1851. Six lines, one eagle.", show: { type: "passage", title: "The Eagle — Alfred, Lord Tennyson (1851; text of the Poetical Works, 1873)", text: "He clasps the crag with crooked hands; / Close to the sun in lonely lands, / Ring’d with the azure world, he stands.\n\nThe wrinkled sea beneath him crawls; / He watches from his mountain walls, / And like a thunderbolt he falls." } },
    { say: "Track Dickinson’s extended metaphor: every detail of the bird is also a truth about hope.", show: { type: "table", rows: [["The bird…", "So hope…"], ["perches in the soul", "lives inside us"], ["sings without words", "needs no reasons to be felt"], ["sings sweetest in the gale", "is strongest in hard times"], ["never asked a crumb", "asks nothing in return"]] } },
    { say: "Tennyson packs sound into six lines: hard <b>c/k</b> sounds in line 1, a single rhyme sound in each stanza (hands/lands/stands; crawls/walls/falls), and a final <b>simile</b> that strikes like the eagle itself.", show: { type: "big", text: "“And like a thunderbolt he falls.”" } },
    { say: "Word study. Greek <b>ornis/ornith-</b> means bird; Greek <b>pteron</b> means wing or feather; Latin <b>avis</b> means bird.", show: { type: "table", rows: [["Word", "Parts", "Meaning"], ["ornithology", "ornith + logy (study)", "the study of birds"], ["pterodactyl", "ptero + dactyl (finger)", "wing-finger"], ["helicopter", "helix (spiral) + pter", "spiral wing"], ["aviary", "avis + -ary (place)", "a place for birds"]] } },
  ],
  practice: [
    { q: "In Dickinson’s poem, what is “the thing with feathers”?", options: ["Hope", "A real bird", "A storm", "The soul"], answer: "Hope", hint: "Read the first line again.", why: "“Hope is the thing with feathers”: hope is compared to a bird." },
    { q: "Why is it an EXTENDED metaphor?", options: ["The bird comparison continues through all three stanzas", "It is very long", "It uses “like”", "It has many birds"], answer: "The bird comparison continues through all three stanzas", hint: "Does Dickinson drop the bird after line 1?", why: "The bird perches, sings, keeps others warm and never asks a crumb: the metaphor is extended across the poem." },
    { q: "“And sweetest in the gale is heard.” What does this suggest about hope?", options: ["It is most precious and strongest in hard times", "It disappears in storms", "It only exists in good weather", "It is loud"], answer: "It is most precious and strongest in hard times", hint: "A gale is a fierce wind. When would hope matter most?", why: "Hope sounds sweetest in the storm: it matters most when life is hardest." },
    { q: "“Abash” means to make someone feel embarrassed or...", options: ["silenced and subdued", "very happy", "warm", "hungry"], answer: "silenced and subdued", hint: "A storm would have to be terrible to stop the bird singing.", why: "To abash is to disconcert and silence; only a terrible storm could silence hope." },
    { q: "“It asked a crumb of me.” What does the last stanza say hope asks in return?", options: ["Nothing at all", "A crumb of bread", "A song", "Warmth"], answer: "Nothing at all", hint: "Look at “never” before this line.", why: "“Yet, never, in extremity, / It asked a crumb of me.” Hope gives and asks nothing." },
    { q: "In “The Eagle,” “crooked hands” refers to...", options: ["the eagle’s talons", "an old man’s hands", "the mountain", "the waves"], answer: "the eagle’s talons", hint: "Who is “he” in the poem?", why: "Calling the talons “hands” is personification: it makes the eagle seem human, even kingly." },
    { q: "“The wrinkled sea beneath him crawls.” Why does the sea look WRINKLED and seem to CRAWL?", options: ["From so high up, great waves look like small wrinkles moving slowly", "The sea is old", "The sea is a giant animal", "It is a dream"], answer: "From so high up, great waves look like small wrinkles moving slowly", hint: "Where is the eagle standing?", why: "From a great height, huge waves shrink to wrinkles that seem to creep. The image shows the eagle’s height." },
    { q: "Which line contains a SIMILE?", options: ["And like a thunderbolt he falls.", "He clasps the crag with crooked hands;", "He watches from his mountain walls,", "Close to the sun in lonely lands,"], answer: "And like a thunderbolt he falls.", hint: "A simile uses like or as.", why: "“like a thunderbolt” compares the eagle’s dive to lightning." },
    { q: "Which sound is repeated in “clasps the crag with crooked hands”?", options: ["the hard k sound", "the s sound only", "the long o", "the m sound"], answer: "the hard k sound", hint: "Say it aloud: cl-, cr-, cr-.", why: "clasps, crag, crooked: hard /k/ alliteration that sounds rugged like rock." },
    { q: "How many lines in each stanza of “The Eagle” rhyme with each other?", type: "number", answer: 3, hint: "hands / lands / stands.", why: "Each stanza is a triplet with one rhyme sound: 3 rhyming lines." },
    { q: "“Azure” means...", options: ["sky-blue", "dark grey", "golden", "stormy"], answer: "sky-blue", hint: "Ring’d with the azure world: what colour surrounds a high peak?", why: "Azure is a bright sky-blue." },
    { q: "Ornithology is the study of...", options: ["birds", "wings of insects", "flowers", "storms"], answer: "birds", hint: "ornith = ?", why: "ornith (bird) + logy (study)." },
    { q: "Pterodactyl means...", options: ["wing-finger", "bird-lizard", "flying tooth", "big wing"], answer: "wing-finger", hint: "ptero = wing; dactyl = ?", why: "ptero (wing) + dactyl (finger): its wing stretched from one long finger." },
  ],
  challenge: [
    { q: "Dickinson calls hope “the little bird / That kept so many warm.” What does the word LITTLE add to the meaning?", options: ["Hope seems small and fragile, yet it sustains many people", "Hope is unimportant", "The bird is a baby", "Only children have hope"], answer: "Hope seems small and fragile, yet it sustains many people", hint: "Compare little with “so many.”", why: "The contrast between a small bird and the many it warms shows hope’s surprising strength." },
    { q: "Both poems describe a bird, but their PURPOSES differ. Which is most accurate?", options: ["Dickinson’s bird explains an idea (hope); Tennyson’s eagle is a real bird", "Both are about hope", "Both are scientific descriptions", "Tennyson’s is about hope; Dickinson’s about eagles"], answer: "Dickinson’s bird explains an idea (hope); Tennyson’s eagle is a real bird", hint: "Is each poem’s bird literal or a symbol?", why: "Dickinson’s bird is a metaphor for an abstract idea; Tennyson’s eagle is a literal creature made grand by imagery." },
    { q: "Tennyson ends with “he falls.” Why is FALLS a more powerful final word than “flies” or “dives” might be?", options: ["It suggests a sudden, unstoppable drop and ends the poem abruptly", "Because the eagle is hurt", "Because it rhymes with nothing", "Because eagles cannot fly"], answer: "It suggests a sudden, unstoppable drop and ends the poem abruptly", hint: "How does a thunderbolt move? And how does the poem itself end?", why: "“Falls” evokes sheer, sudden speed like lightning, and the poem stops at that instant, as the eagle vanishes from view." },
  ],
  extend: "Read five more poems by Emily Dickinson (for example “A Bird came down the Walk” and “I’m Nobody! Who are you?”). Choose one and explain, in a paragraph, how one image works. Then compare the 1891 text of “Hope” with a modern edition that restores her dashes: what changes?",
