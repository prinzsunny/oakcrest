  offline: "Read Charlotte’s Web, chapters 9–12, and your Story of the World chapter on hieroglyphs. Memorise “The Eagle” and recite it with expression. Written response for the portfolio: “What is hope like?” Write your own extended metaphor of 4–6 lines, choosing a different creature.",
},
],
[
// ═════════ Lesson 9 — Rossetti and Wilbur Wright ═════════
{
  title: "Inference: seeing the invisible", icon: "🌬️",
  learn: [
    { say: "An <b>inference</b> is a conclusion drawn from evidence plus reasoning. Poets and scientists share this skill: both reason from <b>visible effects</b> to <b>invisible causes</b>.", show: { type: "big", text: "evidence + reasoning\n= inference" } },
    { say: "Christina Rossetti published this poem in <b>Sing-Song</b> (1872). Notice how it answers its own question.", show: { type: "passage", title: "Who Has Seen the Wind? — Christina Rossetti (1872)", text: "Who has seen the wind? / Neither I nor you: / But when the leaves hang trembling / The wind is passing thro’.\n\nWho has seen the wind? / Neither you nor I: / But when the trees bow down their heads / The wind is passing by." } },
    { say: "The poem’s logic: nobody sees the wind, but we <b>infer</b> it from its effects: trembling leaves, bowing trees. Science reasons the same way about air flowing over a wing.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif' font-weight='700'><defs><marker id='m' markerUnits='userSpaceOnUse' markerWidth='16' markerHeight='16' refX='13' refY='8' orient='auto'><path d='M0 0L16 8L0 16Z' fill='#0e7490'/></marker><marker id='r' markerUnits='userSpaceOnUse' markerWidth='20' markerHeight='20' refX='16' refY='10' orient='auto'><path d='M0 0L20 10L0 20Z' fill='#b91c1c'/></marker></defs><path d='M150 190 C 220 120 380 120 470 180 C 380 195 230 200 150 190 Z' fill='#cbd5e1' stroke='#334155' stroke-width='3'/><g stroke='#0e7490' stroke-width='3' fill='none' marker-end='url(#m)'><path d='M40 160 C 160 90 380 80 560 150'/><path d='M40 215 C 200 215 380 210 560 205'/></g><line x1='310' y1='132' x2='310' y2='30' stroke='#b91c1c' stroke-width='6' marker-end='url(#r)'/><text x='325' y='50' font-size='22' fill='#b91c1c'>LIFT</text><text x='30' y='70' font-size='19' fill='#0e7490'>faster air, lower pressure</text><text x='40' y='255' font-size='19' fill='#0e7490'>slower air, higher pressure</text><text x='250' y='300' font-size='20' fill='#334155'>a wing (airfoil)</text></svg>" }, caption: "We never see the air; we infer its forces from what the wing does." },
    { say: "In 1899 a young bicycle-maker from Ohio wrote to the Smithsonian Institution asking for everything published on flight. Read his letter closely: what can you infer about the writer?", show: { type: "passage", title: "Wilbur Wright, letter to the Smithsonian Institution, 30 May 1899", text: "I have been interested in the problem of mechanical and human flight ever since as a boy I constructed a number of bats of various sizes after the style of Cayley’s and Penaud’s machines. My observations since have only convinced me more firmly that human flight is possible and practicable. It is only a question of knowledge and skill just as in all acrobatic feats." } }, { say: "Wright continues. What does this paragraph reveal about how he intends to work?", show: { type: "passage", title: "Wilbur Wright’s letter (continued)", text: "[…] I am an enthusiast, but not a crank in the sense that I have some pet theories as to the proper construction of a flying machine. I wish to avail myself of all that is already known and then if possible add my mite to help on the future workers who will attain final success." } },
    { say: "Inferences from the letter, each anchored to words in the text.", show: { type: "table", rows: [["Text evidence", "Inference"], ["“constructed… bats” as a boy", "a lifelong, hands-on interest"], ["“not a crank”", "he expects to be doubted and wants to be taken seriously"], ["“avail myself of all that is already known”", "a careful learner who builds on others’ work"], ["“add my mite to help on the future workers”", "humble: he expects someone else may finish the job"]] }, caption: "Four and a half years later, on 17 December 1903, the Wright brothers made the first powered, controlled aeroplane flights." },
    { say: "Word study. Latin <b>videre / visum</b> means “to see.” The wind is <b>in-vis-ible</b>: not able to be seen.", show: { type: "table", rows: [["Word", "Parts", "Meaning"], ["invisible", "in + vis + ible", "not able to be seen"], ["evident", "e (out) + vid", "plainly seen"], ["provide", "pro (ahead) + vid", "to see to it beforehand"], ["revise", "re (again) + vis", "to look at again"]] } },
  ],
  practice: [
    { q: "What is the answer to the poem’s question, “Who has seen the wind?”", options: ["No one", "Only the poet", "The trees", "Everyone"], answer: "No one", hint: "Read the second line of each stanza.", why: "“Neither I nor you”: nobody has seen it." },
    { q: "How do we know the wind is there, according to the poem?", options: ["We see its effects on leaves and trees", "We can see its colour", "The poet tells us she saw it", "We hear it sing"], answer: "We see its effects on leaves and trees", hint: "Look at what follows the word “But.”", why: "Trembling leaves and bowing trees are visible effects from which we infer the invisible wind." },
    { q: "“The trees bow down their heads.” What device is this?", options: ["personification", "simile", "alliteration", "onomatopoeia"], answer: "personification", hint: "Do trees have heads? Who bows?", why: "Giving trees heads and the human action of bowing is personification." },
    { q: "How do the two stanzas differ?", options: ["Small changes: “I nor you” becomes “you nor I”; leaves tremble, then whole trees bow", "They are completely different poems", "The second has no question", "The first is about rain"], answer: "Small changes: “I nor you” becomes “you nor I”; leaves tremble, then whole trees bow", hint: "Compare them line by line.", why: "The structure repeats with variation, and the effect grows from leaves to whole trees, suggesting a stronger wind." },
    { q: "Why might the wind be stronger in stanza 2?", options: ["Leaves only tremble, but whole trees bow", "The poem says it is a storm", "It is night", "There are more leaves"], answer: "Leaves only tremble, but whole trees bow", hint: "Which effect needs more force?", why: "Bending entire trees requires more force than shaking leaves: an inference from evidence." },
    { q: "According to the lift diagram, where is the air moving FASTER?", options: ["Over the curved top of the wing", "Under the wing", "Behind the wing only", "Nowhere"], answer: "Over the curved top of the wing", hint: "Read the label above the wing.", why: "Air flows faster over the top, where pressure is lower; higher pressure below helps push the wing up." },
    { q: "Wilbur Wright built “bats” as a boy. From context, these were most likely...", options: ["small flying toys", "real animals", "cricket bats", "kites shaped like birds only"], answer: "small flying toys", hint: "He built them “after the style of Cayley’s and Penaud’s machines.”", why: "He calls them machines in a letter about flight: they were small flying models (toy helicopters)." },
    { q: "Why does Wright say he is “not a crank”?", options: ["He expects some people to think flight is a foolish dream, so he shows he is serious", "He has a sore neck", "He dislikes machines", "He is joking about bicycles"], answer: "He expects some people to think flight is a foolish dream, so he shows he is serious", hint: "What is a crank? Why say you are NOT one?", why: "A crank holds odd ideas stubbornly. Wright anticipates that objection and presents himself as a careful student." },
    { q: "“Avail myself of” means...", options: ["make use of", "argue against", "throw away", "keep secret"], answer: "make use of", hint: "He wants to ___ all that is already known.", why: "To avail yourself of something is to use it to your advantage." },
    { q: "“Add my mite” means to contribute...", options: ["a small amount", "an insect", "a fortune", "a final answer"], answer: "a small amount", hint: "A mite is something tiny.", why: "A mite is a very small contribution; the phrase shows humility." },
    { q: "Which word from the letter BEST shows Wright believed flight could really happen?", options: ["practicable", "crank", "mite", "bats"], answer: "practicable", hint: "Which word means “able to be done in practice”?", why: "He calls human flight “possible and practicable”: achievable, not just imaginable." },
    { q: "How many years passed between this letter (1899) and the first powered flight (1903)?", type: "number", answer: 4, hint: "1903 − 1899.", why: "1903 − 1899 = 4 years (four and a half, counting months)." },
    { q: "“Evident” means...", options: ["plainly seen", "hidden", "seen again", "seen beforehand"], answer: "plainly seen", hint: "e (out) + vid (see).", why: "Something evident can be clearly seen." },
    { q: "Put the steps of inference in order.", type: "order", items: ["Draw a conclusion", "Observe an effect", "Reason about what could cause it"], answer: ["Observe an effect", "Reason about what could cause it", "Draw a conclusion"], hint: "What must you notice first?", why: "Observe, reason, conclude: the method of the poem and of science." },
  ],
  challenge: [
    { q: "Rossetti’s poem and Wright’s letter both deal with something invisible. Which statement BEST connects them?", options: ["Both reason from visible evidence to an unseen force", "Both are poems", "Both claim to have seen the wind", "Both are about trees"], answer: "Both reason from visible evidence to an unseen force", hint: "What can neither writer see, and how do they know it is real?", why: "The poem infers wind from leaves; Wright infers flight is possible from observation and models. Both trust evidence over sight." },
    { q: "Wright says flight is “only a question of knowledge and skill just as in all acrobatic feats.” What does the comparison to ACROBATICS suggest?", options: ["Flying is a skill of balance and control that can be learned through practice", "Flying is a circus trick", "Only acrobats can fly", "Flying is impossible"], answer: "Flying is a skill of balance and control that can be learned through practice", hint: "What must an acrobat master?", why: "Acrobats master balance through practice. The Wrights’ great insight was indeed control and balance, which they learned by practising with gliders." },
    { q: "In the word “revise,” the prefix re- means “again.” Which of these ALSO contains the root meaning “see”?", options: ["supervisor", "revenge", "devise", "reverse"], answer: "supervisor", hint: "Look for vis meaning see, and super- meaning over.", why: "super (over) + vis (see): one who oversees. Devise and reverse come from other roots." },
  ],
  extend: "Read the rest of Christina Rossetti’s Sing-Song (free on Project Gutenberg) and choose three poems that teach something about nature. Then read about the Wright brothers’ glider experiments at Kitty Hawk (1900–1902) and list three things they learned by observation.",
  offline: "Read Charlotte’s Web, chapters 13–17, and your Story of the World chapter on Sumer. Do the ramps-and-friction lab. Written response: write a short paragraph proving something invisible exists (air, magnetism, or friction) using only effects you can observe.",
},
// ═════════ Lesson 10 — A Christmas Carol ═════════
{
  title: "Characterisation through diction: Scrooge", icon: "🕯️",
  learn: [
    { say: "<b>Diction</b> is an author’s choice of words. Charles Dickens is a master of characterising through diction: the words he chooses for Scrooge do as much work as any action.", show: { type: "list", items: ["Diction: deliberate word choice", "Connotation: the feelings a word carries beyond its dictionary meaning", "Asyndeton: a list without “and” between items, which speeds it up", "Simile: a comparison using like or as"] } },
    { say: "Charles Dickens published <b>A Christmas Carol</b> in December 1843. Read its famous opening.", show: { type: "passage", title: "A Christmas Carol — Charles Dickens (1843), Stave One", text: "Marley was dead: to begin with. There is no doubt whatever about that. The register of his burial was signed by the clergyman, the clerk, the undertaker, and the chief mourner. Scrooge signed it: and Scrooge’s name was good upon ’Change, for anything he chose to put his hand to.\n\nOld Marley was as dead as a door-nail." } },
    { say: "Now Dickens introduces Scrooge himself. Read this slowly; it rewards rereading.", show: { type: "passage", title: "Stave One (continued)", text: "[…] Oh! But he was a tight-fisted hand at the grind-stone, Scrooge! a squeezing, wrenching, grasping, scraping, clutching, covetous, old sinner! Hard and sharp as flint, from which no steel had ever struck out generous fire; secret, and self-contained, and solitary as an oyster.\n\nThe cold within him froze his old features, nipped his pointed nose, shrivelled his cheek, stiffened his gait; made his eyes red, his thin lips blue; and spoke out shrewdly in his grating voice." } },
    { say: "Dickens fires seven descriptive words in a row, every one about holding money tightly. The rhythm itself feels like a clenching hand.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif' font-weight='800' text-anchor='middle'><g font-size='24' fill='#1e293b'><text x='300' y='40'>squeezing</text><text x='300' y='76'>wrenching</text><text x='300' y='112'>grasping</text><text x='300' y='148'>scraping</text><text x='300' y='184'>clutching</text><text x='300' y='220'>covetous</text></g><text x='300' y='268' font-size='30' fill='#b91c1c'>old sinner!</text><path d='M120 30 L120 250 L150 250' fill='none' stroke='#94a3b8' stroke-width='4'/><text x='70' y='150' font-size='20' fill='#475569'>grip</text><text x='70' y='175' font-size='20' fill='#475569'>tightens</text><path d='M480 30 L480 250 L450 250' fill='none' stroke='#94a3b8' stroke-width='4'/><text x='530' y='150' font-size='20' fill='#475569'>no</text><text x='530' y='175' font-size='20' fill='#475569'>“and”</text></svg>" }, caption: "Asyndeton: no “and” between the words, so they pile up like a tightening fist." },
    { say: "Two images carry Scrooge’s nature. <b>Flint</b>: struck with steel, flint gives sparks, but no one has ever struck “generous fire” from him. <b>Oyster</b>: shut tight in its shell, alone. And the cold inside him shows on his body.", show: { type: "table", rows: [["Image", "What it reveals"], ["hard and sharp as flint", "unyielding; no warmth can be struck from him"], ["solitary as an oyster", "closed off, alone, hiding anything precious"], ["the cold within him froze his features", "his inner coldness is visible outside"]] } },
    { say: "Word study. <b>Solitary</b> comes from Latin <b>solus</b>, “alone.” <b>Covetous</b> comes from Latin <b>cupiditas</b>, “desire,” through Old French.", show: { type: "table", rows: [["Word", "Root", "Meaning"], ["solitary", "solus (alone)", "being alone"], ["solo", "solus", "performed alone"], ["desolate", "de + solus", "bleak and empty; abandoned"], ["covetous", "cupiditas (desire)", "greedily wanting what belongs to others"]] } },
  ],
  practice: [
    { q: "Why does Dickens insist so strongly that Marley was dead?", options: ["Because Marley’s ghost will appear, and the reader must believe he is truly dead", "Because the story is about funerals", "Because Scrooge killed him", "To make the story sad"], answer: "Because Marley’s ghost will appear, and the reader must believe he is truly dead", hint: "The narrator says “to begin with.” What might come later?", why: "Dickens later says this must be understood or nothing wonderful can come of the story: the ghost’s visit depends on Marley being truly dead." },
    { q: "“As dead as a door-nail” is...", options: ["a simile and an idiom", "a metaphor about doors", "personification", "an exact medical fact"], answer: "a simile and an idiom", hint: "Look for “as … as.”", why: "It compares using “as … as” and is a common idiom meaning completely dead." },
    { q: "“Tight-fisted” means...", options: ["stingy with money", "very strong", "angry", "good at boxing"], answer: "stingy with money", hint: "Picture a fist clamped around coins.", why: "A tight fist never opens to give: tight-fisted means miserly." },
    { q: "What do squeezing, wrenching, grasping, scraping and clutching have in common?", options: ["They all describe gripping or taking hard", "They are all colours", "They describe cooking", "They are all kind actions"], answer: "They all describe gripping or taking hard", hint: "Act each one out with your hand.", why: "Each word is a forceful grabbing action, so together they show greed." },
    { q: "“Hard and sharp as flint, from which no steel had ever struck out generous fire.” What does this mean?", options: ["Nothing has ever made Scrooge generous or warm", "Scrooge collects flint", "Scrooge likes fire", "Scrooge is a blacksmith"], answer: "Nothing has ever made Scrooge generous or warm", hint: "Flint and steel make sparks. What spark has never come from Scrooge?", why: "Flint normally sparks when struck; no one has ever struck “generous fire” (kindness) out of him." },
    { q: "Why compare Scrooge to an OYSTER?", options: ["He is closed, shut away, and alone", "He lives by the sea", "He is wealthy like a pearl", "He is slimy"], answer: "He is closed, shut away, and alone", hint: "What does an oyster do with its shell?", why: "An oyster stays clamped shut and solitary: secret, self-contained." },
    { q: "“The cold within him froze his old features.” What kind of cold is this?", options: ["His inner coldness of heart, showing on his face", "Winter weather only", "An illness", "A cold drink"], answer: "His inner coldness of heart, showing on his face", hint: "Is the cold “within” or outside?", why: "The cold is “within him”: his unfeeling nature is so strong it shows physically." },
    { q: "Which word means “greedily wanting what others have”?", options: ["covetous", "solitary", "shrewdly", "generous"], answer: "covetous", hint: "Its root means desire.", why: "Covetous: eager desire for possessions, especially others’." },
    { q: "“Solitary as an oyster”: solitary means...", options: ["alone", "salty", "stubborn", "sunny"], answer: "alone", hint: "solus = ?", why: "From solus, alone." },
    { q: "A “desolate” landscape is...", options: ["bleak and empty", "crowded", "sunny", "full of gold"], answer: "bleak and empty", hint: "de + solus: thoroughly alone.", why: "Desolate means empty, abandoned, bleak." },
    { q: "How many -ing words appear in “a squeezing, wrenching, grasping, scraping, clutching, covetous, old sinner”?", type: "number", answer: 5, hint: "Covetous does not end in -ing.", why: "squeezing, wrenching, grasping, scraping, clutching: 5." },
    { q: "Which item is characterisation through LOOKS?", options: ["his pointed nose and thin blue lips", "his covetousness", "his signature on the register", "his business"], answer: "his pointed nose and thin blue lips", hint: "Which detail describes his body?", why: "The pinched nose and thin lips are physical appearance, which mirrors his pinched character." },
    { q: "Put the opening in order.", type: "order", items: ["Scrooge is described as tight-fisted", "Marley was dead", "The register was signed", "Marley was as dead as a door-nail"], answer: ["Marley was dead", "The register was signed", "Marley was as dead as a door-nail", "Scrooge is described as tight-fisted"], hint: "Dickens starts with Marley, then turns to Scrooge.", why: "Marley dead, the register, the door-nail, then Scrooge." },
  ],
  challenge: [
    { q: "A Christmas Carol is a story of character CHANGE. Why must Dickens make Scrooge so extreme at the beginning?", options: ["The greater the coldness at the start, the more powerful his transformation will be", "Because all old men are cold", "To make the book longer", "So readers will dislike Christmas"], answer: "The greater the coldness at the start, the more powerful his transformation will be", hint: "How do we measure a change? From where to where?", why: "A transformation is measured by distance travelled; an extreme start makes the redemption dramatic and convincing." },
    { q: "The flint image says no steel had EVER struck generous fire from him. What hope does the image secretly leave open?", options: ["Flint CAN give fire; it simply has not been struck the right way yet", "None: flint never burns", "That he will become a blacksmith", "That Marley will return as flint"], answer: "Flint CAN give fire; it simply has not been struck the right way yet", hint: "What does flint do when struck correctly with steel?", why: "Flint is made to give sparks. The image hints that warmth is possible in Scrooge, foreshadowing his change." },
    { q: "Why does Dickens write “Scrooge’s name was good upon ’Change”?", options: ["The ’Change is the Exchange, where merchants trade; his credit was trusted in business", "Scrooge changed his name", "He gave change to the poor", "He was known for small coins"], answer: "The ’Change is the Exchange, where merchants trade; his credit was trusted in business", hint: "The apostrophe shows letters are missing from a word.", why: "’Change is short for the Royal Exchange: Scrooge was respected as a businessman even while unloved as a man." },
  ],
  extend: "Read Stave One of A Christmas Carol in full (about 30 minutes). Track every detail of COLD and WARMTH. Then read Stave Five and find three images that reverse the cold images of Stave One.",
  offline: "Finish Charlotte’s Web (chapters 18–22). Oral response: “What made Charlotte a true friend?” Then write 4–6 sentences contrasting Charlotte with Scrooge at the start of A Christmas Carol, using at least two quotations.",
},
// ═════════ Lesson 11 — Tom Sawyer ═════════
{
  title: "Irony and persuasion: Tom Sawyer", icon: "🖌️",
  learn: [
    { say: "<b>Irony</b> is a gap between what is said or expected and what is really true. In <b>situational irony</b>, the outcome is the opposite of what we expect. In <b>verbal irony</b>, a speaker says something different from what is meant.", show: { type: "table", rows: [["Type", "Definition", "Example"], ["Verbal irony", "saying something other than (often the opposite of) what you mean", "“Lovely weather!” in a storm"], ["Situational irony", "an outcome sharply contrary to what is expected", "a punishment becomes a prize"], ["Dramatic irony", "the reader knows what a character does not", "we see the trap; the character does not"]] } },
    { say: "In Mark Twain’s <b>The Adventures of Tom Sawyer</b> (1876), Tom is punished: he must whitewash a long fence on a Saturday. His friend Ben arrives to tease him.", show: { type: "passage", title: "The Adventures of Tom Sawyer — Mark Twain (1876), Chapter 2", text: "“Say—I’m going in a-swimming, I am. Don’t you wish you could? But of course you’d druther work—wouldn’t you? Course you would!”\n\nTom contemplated the boy a bit, and said: “What do you call work?”\n\n“Why, ain’t that work?”\n\nTom resumed his whitewashing, and answered carelessly: “Well, maybe it is, and maybe it ain’t. All I know, is, it suits Tom Sawyer.”\n\n“Oh come, now, you don’t mean to let on that you like it?”\n\nThe brush continued to move.\n\n“Like it? Well, I don’t see why I oughtn’t to like it. Does a boy get a chance to whitewash a fence every day?”" } },
    { say: "By afternoon, boys are giving Tom their treasures for a turn with the brush. Then the narrator steps in to comment.", show: { type: "passage", title: "Chapter 2 (the narrator’s comment)", text: "Tom said to himself that it was not such a hollow world, after all. He had discovered a great law of human action, without knowing it—namely, that in order to make a man or a boy covet a thing, it is only necessary to make the thing difficult to attain.\n\nIf he had been a great and wise philosopher, like the writer of this book, he would now have comprehended that Work consists of whatever a body is obliged to do, and that Play consists of whatever a body is not obliged to do." } },
    { say: "Tom never says “Please help me.” He persuades by making the job look rare and desirable. Notice his methods.", show: { type: "list", items: ["He pretends not to notice Ben (acts absorbed)", "He answers “carelessly”: indifference makes the work seem valuable", "He reframes work as a rare privilege: “every day?”", "He refuses at first, making the brush “difficult to attain”"] } },
    { say: "Twain’s narrator calls himself “a great and wise philosopher.” This is <b>verbal irony</b> and gentle self-mockery: Twain is laughing at grand, preachy narrators, and at himself.", show: { type: "big", text: "“like the writer of this book”\n= a wink at the reader" } },
    { say: "Word study. <b>Obliged</b> comes from Latin <b>ob</b> (toward) + <b>ligare</b> (to bind). To be obliged is to be bound to do something.", show: { type: "table", rows: [["Word", "Meaning", "Connection to “bind”"], ["obligation", "a duty", "something that binds you"], ["ligament", "tissue joining bones", "it binds bones together"], ["league", "an alliance", "members bound together"], ["oblige", "to require; to do a favour", "to bind by duty or kindness"]] } },
  ],
  practice: [
    { q: "Why is Tom’s situation an example of SITUATIONAL IRONY?", options: ["A punishment becomes something other boys pay to do", "Tom loves painting", "Ben goes swimming", "The fence is short"], answer: "A punishment becomes something other boys pay to do", hint: "What would you expect boys to think about whitewashing?", why: "We expect the chore to be avoided; instead, boys trade treasures for the chance to do it." },
    { q: "What does Ben expect Tom to feel?", options: ["Envious of Ben’s swimming", "Happy to be working", "Angry at the fence", "Proud of the paint"], answer: "Envious of Ben’s swimming", hint: "“Don’t you wish you could?”", why: "Ben teases him, expecting Tom to wish he could swim instead of work." },
    { q: "How does Tom answer Ben at first?", options: ["Carelessly, as if he hardly cares", "Angrily", "With tears", "By begging for help"], answer: "Carelessly, as if he hardly cares", hint: "Find the adverb before his answer.", why: "“answered carelessly”: his calm indifference makes the work look desirable." },
    { q: "“Does a boy get a chance to whitewash a fence every day?” What is Tom suggesting?", options: ["That whitewashing is a rare privilege", "That he paints every day", "That fences are boring", "That Ben should go swimming"], answer: "That whitewashing is a rare privilege", hint: "Rare things seem…?", why: "By calling it a rare chance, he makes the chore seem special and valuable." },
    { q: "According to the narrator, what is the “great law of human action”?", options: ["People want a thing more when it is hard to get", "Work is always bad", "Boys love fences", "Everyone should be a philosopher"], answer: "People want a thing more when it is hard to get", hint: "Read “namely…”", why: "“to make a man or a boy covet a thing, it is only necessary to make the thing difficult to attain.”" },
    { q: "According to the narrator, what is the difference between Work and Play?", options: ["Work is what we are obliged to do; play is what we are not obliged to do", "Work is outside; play is inside", "Work is for adults; play is for children", "Work is painting; play is swimming"], answer: "Work is what we are obliged to do; play is what we are not obliged to do", hint: "Find the definitions in the last sentence.", why: "The difference is obligation, not the activity itself." },
    { q: "“If he had been a great and wise philosopher, like the writer of this book.” What is the narrator doing?", options: ["Making a joke at his own expense (verbal irony)", "Seriously boasting", "Apologising", "Describing Tom"], answer: "Making a joke at his own expense (verbal irony)", hint: "Would a truly wise writer call himself “great and wise”?", why: "The grand self-praise is tongue-in-cheek: self-mocking verbal irony." },
    { q: "“Covet” means...", options: ["to desire strongly", "to cover", "to hate", "to paint"], answer: "to desire strongly", hint: "We met covetous in A Christmas Carol.", why: "To covet is to want something intensely, often something that belongs to another." },
    { q: "“Druther” in Ben’s speech is dialect for...", options: ["would rather", "brother", "drink", "dread"], answer: "would rather", hint: "Say “you’d rather” quickly with a Missouri accent.", why: "“You’d druther” = you’d rather. Twain writes dialect to capture real speech." },
    { q: "Why does Twain write dialect (ain’t, druther, a-swimming)?", options: ["To make the characters sound like real Missouri boys of their time", "Because he could not spell", "To confuse readers", "To show the boys are foolish"], answer: "To make the characters sound like real Missouri boys of their time", hint: "How did boys in a Mississippi River town actually talk?", why: "Dialect brings authenticity and regional character." },
    { q: "Which word shares the root of “obliged” (ligare, to bind)?", options: ["ligament", "light", "legend", "lighthouse"], answer: "ligament", hint: "Which one binds things together in your body?", why: "A ligament binds bone to bone." },
    { q: "“The brush continued to move.” Why does Twain put this sentence in a paragraph by itself?", options: ["To show Tom’s calm, deliberate act of ignoring Ben’s doubt", "Because the brush is magic", "To end the chapter", "To show Tom is tired"], answer: "To show Tom’s calm, deliberate act of ignoring Ben’s doubt", hint: "What is Tom NOT doing while the brush moves?", why: "The isolated line creates a pause: Tom’s silent, steady work is itself persuasion." },
    { q: "Put Tom’s persuasion in order.", type: "order", items: ["Ben asks to try", "Tom calls whitewashing a rare chance", "Tom answers carelessly", "Ben teases Tom about work"], answer: ["Ben teases Tom about work", "Tom answers carelessly", "Tom calls whitewashing a rare chance", "Ben asks to try"], hint: "Who speaks first?", why: "Ben teases, Tom shrugs, Tom reframes the chore, Ben wants a turn." },
  ],
  challenge: [
    { q: "Twain says Tom discovered the great law “without knowing it.” What is the irony?", options: ["Tom uses a deep principle of human nature perfectly, while understanding it not at all", "Tom knew everything", "Tom forgot the law", "The law is false"], answer: "Tom uses a deep principle of human nature perfectly, while understanding it not at all", hint: "Compare what Tom DOES with what he UNDERSTANDS.", why: "His instinct is brilliant but unconscious; it takes the “philosopher” narrator to name the law." },
    { q: "Which modern example BEST shows Tom’s “law of human action”?", options: ["A shop advertises “Only 5 left! Limited edition!”", "A teacher sets homework", "A boy goes swimming", "A friend shares lunch"], answer: "A shop advertises “Only 5 left! Limited edition!”", hint: "Which one makes a thing seem difficult to attain?", why: "Scarcity marketing makes people covet things that seem hard to get: Tom’s law exactly." },
    { q: "By Twain’s definition, could the SAME activity be work for one person and play for another?", options: ["Yes: it depends on whether the person is obliged to do it", "No: activities are always one or the other", "Only if it involves paint", "Only on Saturdays"], answer: "Yes: it depends on whether the person is obliged to do it", hint: "The definition depends on obligation, not on the activity.", why: "Tom is obliged, so it is work for him; the boys choose freely, so it is play for them. Same fence, different status." },
    { q: "Which choice correctly pairs each passage feature with the type of irony?", options: ["Boys paying to work: situational; the “wise philosopher”: verbal", "Boys paying to work: verbal; the “wise philosopher”: dramatic", "Both are dramatic irony", "Neither is irony"], answer: "Boys paying to work: situational; the “wise philosopher”: verbal", hint: "Which is an unexpected outcome? Which is saying what you don’t mean?", why: "The reversed outcome is situational irony; the mock self-praise is verbal irony." },
  ],
  extend: "Read Chapters 1 and 2 of The Adventures of Tom Sawyer. List every treasure the boys give Tom for a turn at the fence, and write a paragraph: is Tom a hero, a trickster, or both?",
  offline: "Finish Stuart Little and begin Little House in the Big Woods. Do the rubber-band guitar lab. Oral response: persuade a grown-up to try a chore you dislike, using Tom’s method, then explain to them exactly which technique you used.",
},
// ═════════ Lesson 12 — Alice: sentences and syntax ═════════
{
  title: "Syntax: how sentences think (Alice)", icon: "🐇",
  learn: [
    { say: "<b>Syntax</b> is the arrangement of words into sentences. Great writers use punctuation as instruments: the <b>colon</b> introduces, the <b>semicolon</b> balances, the <b>dash</b> interrupts.", show: { type: "table", rows: [["Mark", "Job", "Example"], ["Colon :", "introduces an explanation or list", "She had one wish: to read."], ["Semicolon ;", "joins two balanced, related sentences", "It rained; we stayed in."], ["Dash —", "a sudden turn or interruption", "I opened the door—empty!"]] } },
    { say: "Lewis Carroll, a mathematics lecturer at Oxford, wrote <b>Alice’s Adventures in Wonderland</b> (1865). Its first sentence is long and finely built. Read it twice.", show: { type: "passage", title: "Alice’s Adventures in Wonderland — Lewis Carroll (1865), Chapter 1", text: "Alice was beginning to get very tired of sitting by her sister on the bank, and of having nothing to do: once or twice she had peeped into the book her sister was reading, but it had no pictures or conversations in it, “and what is the use of a book,” thought Alice “without pictures or conversations?”" } },
    { say: "The sentence moves from <b>outside</b> (what we see Alice doing) to <b>inside</b> (her own thoughts in her own words). Watch how the colon opens the door to the reason.", show: { type: "list", items: ["Part 1: the situation (tired, nothing to do)", "Colon: “here is why”", "Part 2: the evidence (the dull book)", "Part 3: Alice’s own thought, quoted"] } },
    { say: "A few paragraphs later, Alice falls down the rabbit-hole. Notice the logical structure “Either… or…”, a mathematician’s joke.", show: { type: "passage", title: "Chapter 1 (continued)", text: "[…] Either the well was very deep, or she fell very slowly, for she had plenty of time as she went down to look about her and to wonder what was going to happen next." } },
    { say: "Later, the Mock Turtle describes his school lessons: “Reeling and Writhing, of course, to begin with,” the Mock Turtle replied; “and then the different branches of Arithmetic—Ambition, Distraction, Uglification, and Derision.” Each is a pun on a real subject.", show: { type: "table", rows: [["Carroll’s pun", "Real subject"], ["Reeling and Writhing", "Reading and Writing"], ["Ambition", "Addition"], ["Distraction", "Subtraction"], ["Uglification", "Multiplication"], ["Derision", "Division"]] } },
    { say: "Word study. The suffix <b>-ify</b> means “to make,” and <b>-ification</b> means “the process of making.” Carroll’s <b>uglification</b> is “the process of making ugly.”", show: { type: "table", rows: [["Base", "-ify (verb)", "-ification (noun)"], ["simple", "simplify", "simplification"], ["class", "classify", "classification"], ["pure", "purify", "purification"], ["ugly", "uglify", "uglification"]] } },
  ],
  practice: [
    { q: "What does the colon in the first sentence introduce?", options: ["The reason Alice is bored: the book has no pictures or conversations", "A list of animals", "The rabbit", "Her sister’s name"], answer: "The reason Alice is bored: the book has no pictures or conversations", hint: "What comes right after the colon?", why: "The colon opens an explanation: she had peeped into the dull book." },
    { q: "Why is Alice tired?", options: ["She has nothing to do", "She ran a long way", "She was reading all night", "She was falling"], answer: "She has nothing to do", hint: "Read the first clause.", why: "“tired of sitting by her sister… and of having nothing to do.”" },
    { q: "Which words are Alice’s own THOUGHTS?", options: ["“and what is the use of a book … without pictures or conversations?”", "“Alice was beginning to get very tired”", "“once or twice she had peeped”", "“the book her sister was reading”"], answer: "“and what is the use of a book … without pictures or conversations?”", hint: "Look for “thought Alice.”", why: "The quoted words are her thoughts, marked by “thought Alice.”" },
    { q: "What does Alice’s thought reveal about her character?", options: ["She values imagination and talk over dull facts", "She hates all books", "She is a slow reader", "She is afraid of her sister"], answer: "She values imagination and talk over dull facts", hint: "What does she want books to have?", why: "She wants pictures and conversations: liveliness and imagination." },
    { q: "Why is Alice’s complaint IRONIC, given the book we are reading?", options: ["Alice’s own book is full of pictures and conversations", "Alice cannot read", "Carroll hated pictures", "The book has no words"], answer: "Alice’s own book is full of pictures and conversations", hint: "What is Alice’s Adventures in Wonderland full of?", why: "Carroll’s book (with Tenniel’s illustrations and endless dialogue) is exactly what Alice wishes for." },
    { q: "“Either the well was very deep, or she fell very slowly.” What is the logical structure?", options: ["Two possible explanations, at least one of which must be true", "A cause and its effect", "A list of three things", "A comparison"], answer: "Two possible explanations, at least one of which must be true", hint: "Either… or…", why: "“Either A or B” offers alternatives; the evidence (plenty of time) fits both." },
    { q: "What EVIDENCE supports “Either the well was very deep, or she fell very slowly”?", options: ["She had plenty of time to look about her while falling", "She landed softly", "The rabbit told her", "Her sister saw her"], answer: "She had plenty of time to look about her while falling", hint: "Find the word “for,” meaning because.", why: "“for she had plenty of time as she went down”: a long fall supports both possibilities." },
    { q: "In the Mock Turtle’s list, “Distraction” is a pun on...", options: ["Subtraction", "Addition", "Division", "Fractions"], answer: "Subtraction", hint: "Which subject rhymes with it?", why: "Distraction / Subtraction." },
    { q: "“Derision” is a pun on Division. Derision means...", options: ["mockery, scornful laughter", "dividing", "a decision", "a vision"], answer: "mockery, scornful laughter", hint: "If someone treats your idea with derision, are they kind?", why: "Derision is contemptuous ridicule; the pun suggests school can feel like being laughed at." },
    { q: "“Simplify” means...", options: ["to make simple", "simple", "a simple thing", "simply"], answer: "to make simple", hint: "-ify = to make.", why: "simple + -ify: to make simple." },
    { q: "Which suffix turns “classify” into a NOUN meaning “the process of classifying”?", options: ["-ication", "-ly", "-er", "-ed"], answer: "-ication", hint: "classify → class…", why: "classify → classification." },
    { q: "Which punctuation mark BEST joins two balanced, closely related sentences?", options: ["semicolon", "colon", "question mark", "comma alone"], answer: "semicolon", hint: "Look at the table from the first slide.", why: "A semicolon joins two complete, related statements of equal weight." },
    { q: "How many times does the phrase “pictures or conversations” appear in Carroll’s first sentence?", type: "number", answer: 2, hint: "Read the whole sentence again, to the question mark.", why: "Twice: once in the narrator’s words (“no pictures or conversations in it”) and once in Alice’s thought. The echo carries us from the narrator’s voice into Alice’s own." },
  ],
  challenge: [
    { q: "The first sentence begins in the narrator’s voice and ends in Alice’s voice. What is the EFFECT of this movement?", options: ["It draws the reader from outside Alice into her mind, so we share her boredom and wish", "It confuses who is speaking", "It shows Alice is the narrator", "It hides Alice’s feelings"], answer: "It draws the reader from outside Alice into her mind, so we share her boredom and wish", hint: "Where are we at the start of the sentence, and where at the end?", why: "The syntax moves us from observing Alice to hearing her think, establishing intimacy before the adventure begins." },
    { q: "Carroll was a mathematician. How does “Either the well was very deep, or she fell very slowly” reflect logical thinking?", options: ["It reasons from evidence to two possible explanations without choosing one too soon", "It solves an equation", "It counts the seconds", "It is a contradiction"], answer: "It reasons from evidence to two possible explanations without choosing one too soon", hint: "Is Alice sure which is true? What does a careful thinker do?", why: "Alice reasons like a scientist: one observation, two hypotheses, both still possible. It is comic because she is calmly reasoning while falling." },
    { q: "Why are the Mock Turtle’s puns FUNNY rather than random?", options: ["Each pun sounds like a real subject but names what school can feel like", "They are random nonsense", "They teach real arithmetic", "They rhyme with animals"], answer: "Each pun sounds like a real subject but names what school can feel like", hint: "Ambition, distraction, derision: what do these words mean about school life?", why: "The puns work on two levels: sound (Addition → Ambition) and meaning (school can bring distraction and derision). That double meaning is wit." },
  ],
  extend: "Read Chapters 1–3 of Alice’s Adventures in Wonderland. Copy three sentences that use a colon, a semicolon or a dash, and explain what each mark does. Then read Chapter 9 for the Mock Turtle’s full list of lessons.",
  offline: "Read Little House in the Big Woods, chapters 1–3, and your Story of the World chapter on ancient China. Written response: write one long, well-built sentence (30+ words) about something that bored you, using a colon to introduce the reason, as Carroll does.",
},
// ═════════ Lesson 13 — Stevenson, My Shadow ═════════
{
  title: "The speaker of a poem: My Shadow", icon: "👤",
  learn: [
    { say: "The <b>speaker</b> of a poem is the voice that says “I”. It is not always the poet. Robert Louis Stevenson was an adult when he wrote <b>A Child’s Garden of Verses</b> (1885), but the speaker is a child.", show: { type: "table", rows: [["Poet", "Speaker"], ["Robert Louis Stevenson, aged about 35", "a young child"], ["understands light and shadow", "is puzzled by the shadow"], ["chooses every word", "seems to speak naturally"]] } },
    { say: "Read the first two stanzas. Each line is long: seven strong beats.", show: { type: "passage", title: "My Shadow — Robert Louis Stevenson, A Child’s Garden of Verses (1885)", text: "I have a little shadow that goes in and out with me, / And what can be the use of him is more than I can see. / He is very, very like me from the heels up to the head; / And I see him jump before me, when I jump into my bed.\n\nThe funniest thing about him is the way he likes to grow— / Not at all like proper children, which is always very slow; / For he sometimes shoots up taller like an india-rubber ball, / And he sometimes gets so little that there’s none of him at all." } },
    { say: "Now the last two stanzas.", show: { type: "passage", title: "My Shadow (continued)", text: "He hasn’t got a notion of how children ought to play, / And can only make a fool of me in every sort of way. / He stays so close beside me, he’s a coward you can see; / I’d think shame to stick to nursie as that shadow sticks to me!\n\nOne morning, very early, before the sun was up, / I rose and found the shining dew on every buttercup; / But my lazy little shadow, like an arrant sleepy-head, / Had stayed at home behind me and was fast asleep in bed." } },
    { say: "Here is the science the child does not yet understand. A shadow’s length depends on the angle of the light. A low light makes a long shadow; a high light makes a short one; no light, no shadow.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif' font-weight='700'><line x1='20' y1='260' x2='580' y2='260' stroke='#475569' stroke-width='4'/><circle cx='60' cy='190' r='22' fill='#f59e0b'/><line x1='80' y1='196' x2='545' y2='258' stroke='#f59e0b' stroke-width='2' stroke-dasharray='6 6'/><rect x='240' y='200' width='16' height='60' fill='#0f766e'/><rect x='256' y='252' width='290' height='8' fill='#1e293b'/><text x='300' y='295' font-size='20' fill='#1e293b'>low light: long shadow</text><circle cx='470' cy='40' r='22' fill='#f59e0b'/><line x1='466' y1='62' x2='436' y2='196' stroke='#f59e0b' stroke-width='2' stroke-dasharray='6 6'/><rect x='420' y='196' width='16' height='60' fill='#0f766e' opacity='.6'/><text x='380' y='110' font-size='19' fill='#92400e'>high light:</text><text x='380' y='134' font-size='19' fill='#92400e'>short shadow</text><text x='40' y='40' font-size='20' fill='#334155'>no sun yet: no shadow</text></svg>" }, caption: "The “lazy” shadow in stanza 4: before sunrise there is no direct light, so there is no shadow." },
    { say: "The humour is <b>dramatic irony</b>: we, the readers, understand why the shadow grows, shrinks and vanishes; the child speaker does not, and so invents personal explanations: he is a coward, lazy, asleep in bed.", show: { type: "table", rows: [["The child says", "The real reason"], ["he shoots up taller", "the light source moves lower"], ["he sticks close to me", "a shadow is always attached to its object"], ["he stayed asleep in bed", "no direct sunlight before sunrise, so no shadow"]] } },
    { say: "Word study. Words change meaning. <b>Arrant</b> began as a form of <b>errant</b> (wandering) and came to mean “utter, complete” (an arrant sleepy-head = a complete sleepy-head). <b>Notion</b> (from Latin <b>noscere</b>, to know) means an idea.", show: { type: "table", rows: [["Word", "Earlier use", "Later use"], ["arrant", "wandering (errant)", "utter, out-and-out"], ["nice", "foolish, ignorant (Latin nescius)", "pleasant"], ["silly", "blessed, innocent", "foolish"], ["notion", "knowledge, concept", "an idea"]] } },
  ],
  practice: [
    { q: "Who is the SPEAKER of “My Shadow”?", options: ["A young child", "Robert Louis Stevenson as an adult", "The shadow", "A nurse"], answer: "A young child", hint: "Who would mention “nursie” and jumping into bed?", why: "The speaker’s puzzlement and references to a nurse show a young child, though the poet was an adult." },
    { q: "“What can be the use of him is more than I can see.” What does the speaker mean?", options: ["The speaker cannot understand what the shadow is for", "The speaker cannot see the shadow", "The speaker wants a new shadow", "The shadow is useful"], answer: "The speaker cannot understand what the shadow is for", hint: "“More than I can see” here means more than I can understand.", why: "It is an idiom: the speaker cannot work out the shadow’s purpose. (There is also a pun: shadows are about seeing!)" },
    { q: "“Like an india-rubber ball” is a...", options: ["simile", "metaphor", "personification", "rhyme"], answer: "simile", hint: "Look for like or as.", why: "It compares using “like”: the shadow bounces up suddenly." },
    { q: "Why does the shadow sometimes “shoot up taller”?", options: ["The light source is lower, which stretches the shadow", "The shadow is growing up", "The child is jumping", "It is raining"], answer: "The light source is lower, which stretches the shadow", hint: "Look at the diagram.", why: "A low light (early or late sun, or a candle near the floor) casts a long shadow." },
    { q: "Why does the speaker call the shadow a coward?", options: ["It stays so close beside the speaker", "It runs away", "It is afraid of the dark", "It hides behind trees"], answer: "It stays so close beside the speaker", hint: "Read line 3 of stanza 3.", why: "“He stays so close beside me, he’s a coward you can see”: the child interprets clinging as fear." },
    { q: "What does “I’d think shame to stick to nursie” reveal about the speaker?", options: ["The speaker is proud of being independent and brave", "The speaker loves the nurse most", "The speaker is a coward", "The speaker is a baby"], answer: "The speaker is proud of being independent and brave", hint: "The child would be ashamed to cling to the nurse. What does that show about how the child sees themselves?", why: "The child would be ashamed to cling, and so sees themselves as brave and grown-up, unlike the “cowardly” shadow." },
    { q: "In stanza 4, why is there no shadow?", options: ["It is before sunrise, so there is no direct sunlight", "The shadow is asleep", "The child is invisible", "It is midday"], answer: "It is before sunrise, so there is no direct sunlight", hint: "“before the sun was up”…", why: "Without a light source, no shadow forms. The child explains it as the shadow sleeping in." },
    { q: "This poem’s humour depends on DRAMATIC IRONY. Which statement explains why?", options: ["Readers understand shadows, but the speaker does not", "The shadow speaks", "The speaker lies on purpose", "The poem is sad"], answer: "Readers understand shadows, but the speaker does not", hint: "Who knows more, the reader or the speaker?", why: "Dramatic irony: the audience knows what the character doesn’t, so the child’s explanations are funny." },
    { q: "What is the rhyme pattern of each stanza?", options: ["AABB (rhyming couplets)", "ABAB", "ABCB", "no rhyme"], answer: "AABB (rhyming couplets)", hint: "me / see, head / bed.", why: "Lines rhyme in pairs: me/see, head/bed: couplets." },
    { q: "How many stanzas does the poem have?", type: "number", answer: 4, hint: "Count the groups.", why: "Four quatrains." },
    { q: "How many strong beats are in “I HAVE a LITtle SHADow THAT goes IN and OUT with ME”?", type: "number", answer: 7, hint: "Count the capitalised syllables.", why: "HAVE, LIT, SHAD, THAT, IN, OUT, ME: 7 stresses, a long, skipping line." },
    { q: "“Arrant sleepy-head” means...", options: ["a complete sleepy-head", "a wandering sleepy-head", "a nice sleepy-head", "a dangerous sleepy-head"], answer: "a complete sleepy-head", hint: "Arrant came to mean utter, out-and-out.", why: "Arrant = utter, thoroughgoing." },
    { q: "The word “nice” once meant...", options: ["foolish or ignorant", "kind", "delicious", "beautiful"], answer: "foolish or ignorant", hint: "Latin nescius = not knowing.", why: "From nescius (ignorant), “nice” meant foolish before drifting to its modern sense." },
  ],
  challenge: [
    { q: "Why might an adult poet choose a CHILD speaker for this poem?", options: ["To recapture a child’s fresh, imaginative way of seeing ordinary things", "Because adults cannot write about shadows", "Because children wrote the poem", "To teach physics directly"], answer: "To recapture a child’s fresh, imaginative way of seeing ordinary things", hint: "What does the child notice that an adult would ignore?", why: "A child sees a shadow as a companion with moods. The child speaker renews our wonder at something ordinary." },
    { q: "The speaker calls the shadow lazy and cowardly, the very faults a child is told not to have. What does this suggest?", options: ["The child projects the grown-ups’ lessons onto the shadow, judging it as the child is judged", "The shadow really is lazy", "The child is lazy", "Nurses are cowards"], answer: "The child projects the grown-ups’ lessons onto the shadow, judging it as the child is judged", hint: "Where would a child learn words like “proper children” and “coward”?", why: "The child applies adult rules (“how children ought to play”) to the shadow: a sweet, comic glimpse of how children absorb adult judgments." },
    { q: "At noon in summer, the sun is high. Compared with sunrise, a person’s shadow at noon is...", options: ["much shorter", "much longer", "the same length", "invisible"], answer: "much shorter", hint: "Use the diagram: high light gives what kind of shadow?", why: "A high sun gives a short shadow; a low sun gives a long one." },
  ],
  extend: "Read twenty poems from A Child’s Garden of Verses, including “Bed in Summer,” “The Land of Counterpane” and “The Lamplighter.” Choose one and write a paragraph on the difference between the poet and the speaker.",
  offline: "Read Little House in the Big Woods, chapters 4–6. Do the light-and-shadows lab: mark your shadow’s length with chalk at three times of day. Written response: write 4 lines in the voice of the shadow, answering the child.",
},
// ═════════ Lesson 14 — Review: Jabberwocky ═════════
{
  title: "Review: Jabberwocky", icon: "🗡️",
  learn: [
    { say: "Review lesson. Lewis Carroll’s <b>“Jabberwocky”</b> appears in <b>Through the Looking-Glass</b> (1871). Many of its words are invented, yet we understand the story. How? Through <b>syntax</b>, <b>sound</b> and <b>context</b>.", show: { type: "list", items: ["Syntax tells us the part of speech (noun, verb, adjective)", "Sound suggests meaning (snicker-snack sounds sharp)", "Context tells us the plot (a hero slays a monster)", "Morphology: invented words built from real ones"] } },
    { say: "Read the first half aloud, boldly.", show: { type: "passage", title: "Jabberwocky — Lewis Carroll, Through the Looking-Glass (1871)", text: "’Twas brillig, and the slithy toves / Did gyre and gimble in the wabe: / All mimsy were the borogoves, / And the mome raths outgrabe.\n\n“Beware the Jabberwock, my son! / The jaws that bite, the claws that catch! / Beware the Jubjub bird, and shun / The frumious Bandersnatch!”\n\nHe took his vorpal sword in hand: / Long time the manxome foe he sought— / So rested he by the Tumtum tree, / And stood awhile in thought." } },
    { say: "Now the second half.", show: { type: "passage", title: "Jabberwocky (continued)", text: "And as in uffish thought he stood, / The Jabberwock, with eyes of flame, / Came whiffling through the tulgey wood, / And burbled as it came!\n\nOne, two! One, two! And through and through / The vorpal blade went snicker-snack! / He left it dead, and with its head / He went galumphing back.\n\n“And hast thou slain the Jabberwock? / Come to my arms, my beamish boy! / O frabjous day! Callooh! Callay!” / He chortled in his joy.\n\n’Twas brillig, and the slithy toves / Did gyre and gimble in the wabe: / All mimsy were the borogoves, / And the mome raths outgrabe." } },
    { say: "Later, Humpty Dumpty explains: <b>“Well, ‘slithy’ means ‘lithe and slimy.’ […] You see it’s like a portmanteau—there are two meanings packed up into one word.”</b> A portmanteau was a suitcase opening into two halves.", show: { type: "table", rows: [["Portmanteau word", "Packed from"], ["slithy (Carroll)", "lithe + slimy"], ["mimsy (Carroll)", "flimsy + miserable"], ["chortle (Carroll, now in dictionaries)", "chuckle + snort (the usual explanation)"], ["brunch", "breakfast + lunch"], ["smog", "smoke + fog"]] } },
    { say: "The poem has <b>ring structure</b>: the first and last stanzas are identical. The heroic deed happens in the middle, and the world returns to its strange calm.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif' font-weight='700' font-size='22'><path d='M60 250 Q 300 -60 540 250' fill='none' stroke='#0f766e' stroke-width='5'/><g fill='#0f766e'><circle cx='60' cy='250' r='10'/><circle cx='180' cy='134' r='8'/><circle cx='252' cy='101' r='8'/><circle cx='300' cy='95' r='10' fill='#b91c1c'/><circle cx='420' cy='134' r='8'/><circle cx='540' cy='250' r='10'/></g><g fill='#334155'><text x='166' y='126' text-anchor='end'>2 warning</text><text x='240' y='90' text-anchor='end'>3 quest</text><text x='432' y='126'>6 joy</text></g><text x='300' y='70' text-anchor='middle' fill='#b91c1c'>4–5 battle</text><text x='20' y='295' fill='#134e4a'>1 ’Twas brillig</text><text x='580' y='295' text-anchor='end' fill='#134e4a'>7 ’Twas brillig</text></svg>" }, caption: "Seven stanzas; the first and last are the same." },
  ],
  practice: [
    { q: "In “the slithy toves,” what part of speech is “toves”?", options: ["a noun", "a verb", "an adverb", "a preposition"], answer: "a noun", hint: "It comes after “the” and an adjective.", why: "“the slithy ___” is the pattern article + adjective + noun." },
    { q: "In “Did gyre and gimble in the wabe,” what are “gyre” and “gimble”?", options: ["verbs", "nouns", "adjectives", "names"], answer: "verbs", hint: "They follow “Did,” as in “did run and jump.”", why: "“Did ___ and ___” takes verbs: the toves are doing something." },
    { q: "What is the basic PLOT of the poem?", options: ["A young man is warned of a monster, hunts it, slays it, and returns in triumph", "A family has a picnic", "A bird builds a nest", "A boy loses his sword"], answer: "A young man is warned of a monster, hunts it, slays it, and returns in triumph", hint: "Follow the stanzas: warning, quest, battle, return.", why: "Despite the invented words, syntax and context make the heroic plot clear." },
    { q: "“The vorpal blade went snicker-snack!” What device is “snicker-snack”?", options: ["onomatopoeia", "simile", "metaphor", "a portmanteau of two animals"], answer: "onomatopoeia", hint: "Does it imitate a sound?", why: "It imitates the quick slicing sound of the blade: onomatopoeia." },
    { q: "According to Humpty Dumpty, a portmanteau word is...", options: ["two meanings packed into one word", "a very long word", "a French word", "a word with no meaning"], answer: "two meanings packed into one word", hint: "A portmanteau suitcase has two halves.", why: "“there are two meanings packed up into one word.”" },
    { q: "“Slithy” packs together...", options: ["lithe and slimy", "slow and slippery", "silly and thin", "slithering and shy"], answer: "lithe and slimy", hint: "Humpty Dumpty explains it directly.", why: "slithy = lithe + slimy." },
    { q: "“Chortled” (a word Carroll invented, now in dictionaries) combines...", options: ["chuckle and snort", "chat and hurtle", "cheer and bottle", "chop and startle"], answer: "chuckle and snort", hint: "What sounds do you make when laughing with delight?", why: "Dictionaries usually explain chortle as chuckle + snort; Carroll himself did not explain this one." },
    { q: "Which modern word is a portmanteau of “smoke” and “fog”?", options: ["smog", "frog", "smoky", "fogbank"], answer: "smog", hint: "Take the start of one and the end of the other.", why: "sm(oke) + (f)og = smog." },
    { q: "What is the effect of repeating the FIRST stanza at the END?", options: ["It frames the heroic deed and returns the world to its strange calm", "It shows the poet ran out of ideas", "It shows the monster is still alive", "It confuses the plot"], answer: "It frames the heroic deed and returns the world to its strange calm", hint: "Think of the ring diagram.", why: "Ring structure frames the action: the world before and after is the same, giving the poem a ballad-like completeness." },
    { q: "How many stanzas does “Jabberwocky” have?", type: "number", answer: 7, hint: "Use the ring diagram.", why: "Seven stanzas, with 1 and 7 identical." },
    { q: "“Come to my arms, my beamish boy!” The speaker is most likely...", options: ["the hero’s father, who warned him earlier", "the Jabberwock", "the Bandersnatch", "Alice"], answer: "the hero’s father, who warned him earlier", hint: "Who called him “my son” in stanza 2?", why: "The same voice that said “my son” now welcomes him home." },
    { q: "“Beamish” most likely means...", options: ["radiant with joy and pride", "made of wood", "angry", "sleepy"], answer: "radiant with joy and pride", hint: "Think of a beaming smile.", why: "Beamish suggests beaming: shining with happiness." },
    { q: "Put the story in order.", type: "order", items: ["He rests by the Tumtum tree", "The father warns his son", "The Jabberwock comes whiffling through the wood", "He returns galumphing with the head"], answer: ["The father warns his son", "He rests by the Tumtum tree", "The Jabberwock comes whiffling through the wood", "He returns galumphing with the head"], hint: "Warning, quest, battle, return.", why: "Warning → seeking and resting → the monster arrives → triumphant return." },
  ],
  challenge: [
    { q: "Why can we understand a poem full of invented words?", options: ["Real grammar, sound-symbolism and a familiar story pattern carry the meaning", "Because the words are in the dictionary", "Because Carroll explains every word in the poem", "We cannot understand it at all"], answer: "Real grammar, sound-symbolism and a familiar story pattern carry the meaning", hint: "What in the poem is NOT invented?", why: "The function words (the, did, and), the syntax, the sounds and the monster-slaying plot are all familiar, so meaning comes through." },
    { q: "“Galumphing” is believed to blend “gallop” and “triumphant.” What does it suggest about how the hero walks home?", options: ["Heavily and exuberantly, bounding with triumph", "Sadly and slowly", "Silently on tiptoe", "Limping"], answer: "Heavily and exuberantly, bounding with triumph", hint: "Unpack both halves.", why: "Gallop (bounding, heavy) + triumphant (victorious): a clumsy, joyful march." },
    { q: "Which statement BEST describes the TONE of the whole poem?", options: ["Mock-heroic and playful: the form of a serious ballad filled with nonsense", "Tragic", "Purely scientific", "Angry and bitter"], answer: "Mock-heroic and playful: the form of a serious ballad filled with nonsense", hint: "Is the poem solemn, or having fun with solemnity?", why: "It borrows the solemn ballad and hero-quest form but fills it with delightful invented words: mock-heroic play." },
  ],
  extend: "Read Chapter 6 of Through the Looking-Glass (“Humpty Dumpty”), where he explains the first stanza. Then invent five portmanteau words of your own, define each, and use all five in a short stanza.",
  offline: "Read Little House in the Big Woods, chapters 7–9. Make a timeline strip of everything studied so far. Memorise and recite “Jabberwocky” with dramatic expression. Portfolio: a dated written narration plus your best copywork.",
},
// ═════════ Lesson 15 — Psalm 23 and the alphabet ═════════
{
  title: "Hebrew poetry: Psalm 23", icon: "📜",
  learn: [
    { say: "English poetry usually rhymes sounds. Ancient Hebrew poetry rhymes <b>ideas</b>. This is <b>parallelism</b>: a second line echoes, extends, or contrasts the first.", show: { type: "table", rows: [["Type", "What the second line does"], ["Synonymous", "restates the first in new words"], ["Synthetic (building)", "adds to or completes it"], ["Antithetic", "states the opposite"]] } },
    { say: "Psalm 23 is one of the most famous poems in the world. Here it is in the <b>World English Bible</b> (public domain).", show: { type: "passage", title: "Psalm 23 — World English Bible", text: "Yahweh is my shepherd; I shall lack nothing. He makes me lie down in green pastures. He leads me beside still waters. He restores my soul. He guides me in the paths of righteousness for his name’s sake.\n\nEven though I walk through the valley of the shadow of death, I will fear no evil, for you are with me. Your rod and your staff, they comfort me.\n\nYou prepare a table before me in the presence of my enemies. You anoint my head with oil. My cup runs over. Surely goodness and loving kindness shall follow me all the days of my life, and I will dwell in Yahweh’s house forever." } },
    { say: "The psalm is built on an <b>extended metaphor</b>: God as a shepherd, the speaker as a sheep. Then, in the last part, the image shifts to God as a generous <b>host</b>.", show: { type: "table", rows: [["Image", "Meaning for a sheep", "Meaning for a person"], ["green pastures, still waters", "food and safe drinking", "provision and peace"], ["rod and staff", "the shepherd’s tools to guide and defend", "protection and guidance"], ["a table, oil, overflowing cup", "(the image shifts to a host)", "honour, welcome, abundance"]] } },
    { say: "Notice the <b>shift in pronoun</b>. The psalm begins speaking <b>about</b> God (“He leads me”), then in the dark valley turns to speak <b>to</b> him (“you are with me”). The danger brings the speaker closer.", show: { type: "big", text: "“He leads me…”\n→ “for you are with me”" } },
    { say: "Word study and history. The Phoenicians, a seafaring people, spread an alphabet of about 22 letters. Their letter names became the Greek ones, and Greek gave us the word itself: <b>alpha + beta = alphabet</b>.", show: { type: "table", rows: [["Phoenician / Hebrew name", "Meaning", "Greek", "Our letter"], ["aleph", "ox", "alpha", "A"], ["beth", "house", "beta", "B"], ["gimel", "camel (perhaps)", "gamma", "C, G"], ["daleth", "door", "delta", "D"]] }, caption: "Turn a capital A upside down to see the ox’s head and horns." },
  ],
  practice: [
    { q: "What is the main METAPHOR at the start of Psalm 23?", options: ["God is a shepherd and the speaker is a sheep", "God is a king", "Life is a river", "The speaker is a soldier"], answer: "God is a shepherd and the speaker is a sheep", hint: "Read the first sentence.", why: "“Yahweh is my shepherd”: everything that follows (pastures, waters, rod) belongs to the shepherd’s world." },
    { q: "Why does the speaker say “I shall lack nothing”?", options: ["A good shepherd provides everything the sheep needs", "He is very rich", "He has no needs at all", "He is a shepherd himself"], answer: "A good shepherd provides everything the sheep needs", hint: "What does a shepherd do for the flock?", why: "Under such a shepherd, nothing needed will be missing." },
    { q: "“Green pastures” and “still waters” suggest...", options: ["provision and peace", "danger and fear", "hard work", "winter"], answer: "provision and peace", hint: "What does a sheep need, and what would calm it?", why: "Pasture is food; still (calm) water is safe to drink. Both suggest care and rest." },
    { q: "Why might a good shepherd lead the flock to STILL waters rather than rushing ones?", options: ["Calm water is safer and easier to drink from than a fast stream", "Still water is warmer", "Sheep cannot see rushing water", "Rushing water is salty"], answer: "Calm water is safer and easier to drink from than a fast stream", hint: "Think about a heavy, woolly animal at the edge of a fast stream.", why: "The Hebrew phrase means literally “waters of rest.” Calm water is a safe place for a flock to drink, so the detail shows how carefully the shepherd provides." },
    { q: "What is the effect of the change from “He” to “you” in the valley?", options: ["In danger, the speaker turns to speak to God directly, showing closeness", "The speaker is now talking about a different person", "It is a translation error", "The speaker is angry"], answer: "In danger, the speaker turns to speak to God directly, showing closeness", hint: "When are you most likely to speak directly to someone who protects you?", why: "In the darkest moment, description becomes address: the shift expresses intimacy and trust." },
    { q: "“Your rod and your staff, they comfort me.” A shepherd used the rod to...", options: ["defend the sheep from wild animals", "beat the sheep", "measure the field", "fish"], answer: "defend the sheep from wild animals", hint: "Why would a weapon COMFORT a sheep?", why: "The rod drove off predators; the staff guided and rescued sheep. Both mean protection." },
    { q: "In the final part, the image shifts. What is God pictured as?", options: ["A generous host who prepares a feast", "A judge", "A builder", "A traveller"], answer: "A generous host who prepares a feast", hint: "A table, oil for the head, a full cup…", why: "Preparing a table, anointing the guest’s head with oil and filling the cup were acts of an honouring host." },
    { q: "“My cup runs over” means...", options: ["I have more than enough", "I spilled my drink", "I am thirsty", "My cup is broken"], answer: "I have more than enough", hint: "What does an overflowing cup suggest?", why: "An overflowing cup is an image of abundance." },
    { q: "“He makes me lie down in green pastures. He leads me beside still waters.” What kind of parallelism is this?", options: ["Synonymous: the second line echoes the first in new words", "Antithetic: opposites", "No parallelism", "Rhyme"], answer: "Synonymous: the second line echoes the first in new words", hint: "Do the two lines say similar things in different words?", why: "Both lines express the shepherd’s gentle provision: synonymous parallelism." },
    { q: "The word ALPHABET comes from...", options: ["the first two Greek letters, alpha and beta", "the Latin for letters", "a Phoenician king", "the English word “alphabetical”"], answer: "the first two Greek letters, alpha and beta", hint: "Say the first two Greek letters together.", why: "alpha + beta = alphabet." },
    { q: "The letter A descends from the Phoenician “aleph,” which meant...", options: ["ox", "house", "door", "water"], answer: "ox", hint: "Turn A upside down: horns!", why: "Aleph = ox; the letter began as a picture of an ox’s head." },
    { q: "Beth (B) meant “house.” Which place name contains it? (Bethlehem = “house of bread”)", options: ["Bethlehem", "Babylon", "Boston", "Egypt"], answer: "Bethlehem", hint: "Look for beth at the start.", why: "Beth-lehem: house (beth) of bread (lehem)." },
    { q: "About how many letters were in the Phoenician alphabet?", type: "number", answer: 22, hint: "Look at the word-study slide.", why: "About 22 letters, all consonants." },
    { q: "Put the psalm’s images in order.", type: "order", items: ["a table prepared before enemies", "green pastures", "the valley of the shadow of death", "dwelling in Yahweh’s house forever"], answer: ["green pastures", "the valley of the shadow of death", "a table prepared before enemies", "dwelling in Yahweh’s house forever"], hint: "The poem moves like a journey.", why: "Pastures → dark valley → banquet → home forever." },
  ],
  challenge: [
    { q: "The psalm moves from pastures, through a dark valley, to a feast and a house. What larger STRUCTURE does this create?", options: ["A journey from peace, through danger, to welcome and a permanent home", "A list of unrelated images", "A story told backwards", "An argument with two sides"], answer: "A journey from peace, through danger, to welcome and a permanent home", hint: "Map the places in order.", why: "The images form a journey: rest, threat, honour, and finally a home “forever.”" },
    { q: "“Goodness and loving kindness shall FOLLOW me.” In a poem about sheep, why is “follow” a striking verb?", options: ["Sheep are usually pursued by danger; here goodness pursues the speaker instead", "Sheep follow shepherds", "It means goodness is behind him and lost", "It is a mistake"], answer: "Sheep are usually pursued by danger; here goodness pursues the speaker instead", hint: "What usually follows a sheep in the wild?", why: "Predators normally follow sheep; the psalm reverses that, so that goodness and kindness chase after the speaker. (The Hebrew verb can even mean “pursue.”)" },
    { q: "Which pair of images forms the psalm’s sharpest CONTRAST?", options: ["the valley of the shadow of death / dwelling in Yahweh’s house forever", "green pastures / still waters", "rod / staff", "oil / cup"], answer: "the valley of the shadow of death / dwelling in Yahweh’s house forever", hint: "Which two images are most opposite: darkness and death versus…?", why: "The shadow of death contrasts with dwelling in God’s house forever: the poem’s deepest opposition. (This is a contrast of images across the psalm, not antithetic parallelism, which sets two consecutive lines against each other.)" },
  ],
  extend: "Read Psalms 1, 8 and 121 in the World English Bible. For each, identify one example of parallelism and name its type. Then read about the Phoenician alphabet and draw the 22 letters next to their Greek descendants.",
  offline: "Finish Little House in the Big Woods (chapters 10–13) and read your Story of the World chapter on the Phoenicians. Do the red-cabbage acid–base lab. Memorise Psalm 23 and recite it. Written response: explain in 4 sentences how the shepherd metaphor makes the psalm comforting.",
},
// ═════════ Lesson 16 — The Secret Garden ═════════
{
  title: "An unlikeable heroine: The Secret Garden", icon: "🗝️",
  learn: [
    { say: "Most books make us like the main character at once. Frances Hodgson Burnett’s <b>The Secret Garden</b> (1911) does the opposite. Why would an author take that risk?", show: { type: "list", items: ["Protagonist: the main character", "Narrator’s judgment: when the narrator openly evaluates a character", "Backstory: the past that explains the present", "Dynamic character: one who changes"] } },
    { say: "Read the opening. It is blunt.", show: { type: "passage", title: "The Secret Garden — Frances Hodgson Burnett (1911), Chapter 1", text: "When Mary Lennox was sent to Misselthwaite Manor to live with her uncle everybody said she was the most disagreeable-looking child ever seen. It was true, too. She had a little thin face and a little thin body, thin light hair and a sour expression. Her hair was yellow, and her face was yellow because she had been born in India and had always been ill in one way or another." } },
    { say: "Now the narrator explains why Mary is as she is.", show: { type: "passage", title: "Chapter 1 (continued)", text: "Her father had held a position under the English Government and had always been busy and ill himself, and her mother had been a great beauty who cared only to go to parties and amuse herself with gay people. She had not wanted a little girl at all, and when Mary was born she handed her over to the care of an Ayah, who was made to understand that if she wished to please the Mem Sahib she must keep the child out of sight as much as possible." } },
    { say: "The narrator does not excuse Mary, but she does <b>explain</b> her. Cause and effect connect her past to her character.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif' font-weight='700' text-anchor='middle'><defs><marker id='k' markerWidth='10' markerHeight='10' refX='8' refY='5' orient='auto'><path d='M0 0L10 5L0 10Z' fill='#64748b'/></marker></defs><g stroke-width='3'><rect x='20' y='30' width='240' height='70' rx='12' fill='#fee2e2' stroke='#b91c1c'/><rect x='20' y='125' width='240' height='70' rx='12' fill='#fee2e2' stroke='#b91c1c'/><rect x='20' y='220' width='240' height='70' rx='12' fill='#fee2e2' stroke='#b91c1c'/><rect x='360' y='110' width='220' height='100' rx='14' fill='#e0f2fe' stroke='#0369a1'/></g><g font-size='19' fill='#7f1d1d'><text x='140' y='60'>father: busy, ill</text><text x='140' y='85'>(absent)</text><text x='140' y='155'>mother: did not</text><text x='140' y='180'>want a girl</text><text x='140' y='250'>kept “out of sight”</text><text x='140' y='275'>by servants</text></g><g stroke='#64748b' stroke-width='4' marker-end='url(#k)'><line x1='262' y1='65' x2='356' y2='140'/><line x1='262' y1='160' x2='356' y2='160'/><line x1='262' y1='255' x2='356' y2='180'/></g><text x='470' y='150' font-size='22' fill='#0c4a6e'>Mary: sour,</text><text x='470' y='178' font-size='22' fill='#0c4a6e'>“disagreeable”</text></svg>" }, caption: "A neglected child becomes a disagreeable one." },
    { say: "Note the colonial setting: India under British rule. <b>Ayah</b> was the word for a nursemaid; <b>Mem Sahib</b> was a respectful term servants were expected to use for a European lady. The book reflects the attitudes of its time, which a careful reader notices rather than simply accepts.", show: { type: "table", rows: [["Term", "Meaning in the novel"], ["Ayah", "an Indian nursemaid"], ["Mem Sahib", "“lady,” used for a European woman"], ["Misselthwaite Manor", "her uncle’s great house in Yorkshire, England"]] } },
    { say: "Word study. <b>Disagreeable</b> is built in layers: <b>dis-</b> (not) + <b>agree</b> + <b>-able</b> (able to be). Morphemes stack like bricks.", show: { type: "table", rows: [["Word", "Prefix", "Root", "Suffix"], ["disagreeable", "dis-", "agree", "-able"], ["unbreakable", "un-", "break", "-able"], ["reconsideration", "re-", "consider", "-ation"], ["uncomfortable", "un-", "comfort", "-able"]] } },
  ],
  practice: [
    { q: "What did everybody say about Mary when she arrived?", options: ["She was the most disagreeable-looking child ever seen", "She was beautiful", "She was very clever", "She was very kind"], answer: "She was the most disagreeable-looking child ever seen", hint: "First sentence.", why: "“everybody said she was the most disagreeable-looking child ever seen.”" },
    { q: "“It was true, too.” What is surprising about this sentence?", options: ["The narrator openly agrees with the harsh judgment of the main character", "The narrator lies", "The narrator defends Mary", "It is said by Mary"], answer: "The narrator openly agrees with the harsh judgment of the main character", hint: "Do narrators usually insult their heroine?", why: "The narrator bluntly confirms the criticism: an unusual, honest choice that makes us curious." },
    { q: "According to the narrator, why was Mary’s face yellow?", options: ["She was born in India and had always been ill", "She ate too many lemons", "She was angry", "She painted it"], answer: "She was born in India and had always been ill", hint: "Find “because.”", why: "“because she had been born in India and had always been ill in one way or another.”" },
    { q: "Which word in the first paragraph describes Mary’s expression?", options: ["sour", "thin", "yellow", "light"], answer: "sour", hint: "What does her face look like, as a feeling?", why: "“a sour expression”: bitter, unpleasant." },
    { q: "What did Mary’s mother care about?", options: ["Going to parties and amusing herself", "Her daughter", "Her garden", "Her work"], answer: "Going to parties and amusing herself", hint: "Read the description of her mother.", why: "“cared only to go to parties and amuse herself with gay people.”" },
    { q: "In 1911, “gay people” in this sentence meant...", options: ["cheerful, pleasure-seeking people", "sad people", "relatives", "servants"], answer: "cheerful, pleasure-seeking people", hint: "Words change meaning. What fits a party?", why: "In Burnett’s day, gay meant merry and carefree. Always read old texts in their own vocabulary." },
    { q: "What instructions was the Ayah given?", options: ["Keep the child out of sight as much as possible", "Teach her to read", "Take her to parties", "Make her happy"], answer: "Keep the child out of sight as much as possible", hint: "Last line of the passage.", why: "“she must keep the child out of sight as much as possible.”" },
    { q: "What can you infer about why Mary is “disagreeable”?", options: ["She has been neglected and unloved all her life", "She was born unkind", "She has too many friends", "She likes being sour"], answer: "She has been neglected and unloved all her life", hint: "Look at the cause-and-effect diagram.", why: "Absent, uncaring parents and being kept out of sight have shaped her: neglect explains (without excusing) her sourness." },
