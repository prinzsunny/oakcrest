// ═════════ Lesson 32 — The Road Not Taken ═════════
{
  title: "Capstone: The Road Not Taken", icon: "🌲",
  learn: [
    { say: "Our final lesson brings every tool together on one of the most quoted, and most often misread, poems in English: Robert Frost’s <b>“The Road Not Taken,”</b> first printed in 1915 and placed first in his collection <b>Mountain Interval</b> (1916). Read with the care of a scholar.", show: { type: "list", items: ["Speaker and voice", "Symbol and extended metaphor", "Structure and rhyme", "Tone and irony", "Close reading: what the words actually say"] } },
    { say: "Stanzas 1 and 2.", show: { type: "passage", title: "The Road Not Taken — Robert Frost, Mountain Interval (1916)", text: "Two roads diverged in a yellow wood, / And sorry I could not travel both / And be one traveler, long I stood / And looked down one as far as I could / To where it bent in the undergrowth;\n\nThen took the other, as just as fair, / And having perhaps the better claim, / Because it was grassy and wanted wear; / Though as for that the passing there / Had worn them really about the same," } },
    { say: "Stanzas 3 and 4.", show: { type: "passage", title: "The Road Not Taken (continued)", text: "And both that morning equally lay / In leaves no step had trodden black. / Oh, I kept the first for another day! / Yet knowing how way leads on to way, / I doubted if I should ever come back.\n\nI shall be telling this with a sigh / Somewhere ages and ages hence: / Two roads diverged in a wood, and I— / I took the one less traveled by, / And that has made all the difference." } },
    { say: "Read closely. The famous last stanza says the speaker took the road “less traveled by.” But stanzas 2 and 3 say the roads were worn <b>“really about the same”</b> and <b>“both that morning equally lay.”</b> The difference was not real at the time of choosing.", show: { type: "table", rows: [["What the speaker observed then", "What he will say “ages hence”"], ["the roads were “about the same”", "“I took the one less traveled by”"], ["both lay “equally”", "“that has made all the difference”"], ["his reason: “perhaps the better claim”", "a confident story of a bold choice"]] } },
    { say: "So the final stanza, in the <b>future tense</b>, is the speaker imagining how he will one day <b>tell</b> the story, turning a near-arbitrary choice into a tale of destiny. The <b>sigh</b> is ambiguous: regret? nostalgia? self-mockery? A great poem holds several meanings at once.", show: { type: "big", text: "“I shall be telling this with a sigh”\n= the story we tell about our choices" } },
    { say: "Frost’s own comments support this close reading, though they do not settle every question. While living in England (1912–1915), he often walked the countryside with his friend, the poet <b>Edward Thomas</b>, who would choose a path and afterwards regret not taking the other. In 1915 Frost sent him this poem as a gentle joke. Thomas at first read it seriously and warned that readers would miss the joke. Frost later liked to warn audiences: <b>“you have to be careful of that one; it’s a tricky poem—very tricky.”</b> A joke can still carry real feeling; the poem is playful and serious at once.", show: { type: "list", items: ["Frost and Edward Thomas walk together in England", "1915: Frost sends Thomas the poem; it is first printed in The Atlantic Monthly that August", "Thomas replies that readers will not “see the fun of the thing” unless they are shown", "Frost answers that the closing sigh is “a mock sigh”", "1916: the poem opens Frost’s collection Mountain Interval"] } },
    { say: "Form: five lines per stanza, rhymed <b>ABAAB</b>, four beats per line. Every stanza holds the same pattern, a steady walk; but the speaker’s certainty grows only in the retelling.", show: { type: "table", rows: [["Line ending", "Rhyme"], ["wood", "A"], ["both", "B"], ["stood", "A"], ["could", "A"], ["undergrowth", "B"]] } },
    { say: "Word study, and the year’s summary. <b>Diverge</b> is Latin <b>dis-</b> (apart) + <b>vergere</b> (to turn, incline); <b>converge</b> (con-, together) is its opposite. Like the roads, this course diverges now into all the books you will read next.", show: { type: "table", rows: [["Skill this year", "First met in"], ["narrative voice", "Kipling"], ["characterisation and diction", "Rikki-tikki-tavi, Scrooge"], ["irony and persuasion", "Tom Sawyer, Antony"], ["metre and sound", "Stevenson, Tennyson"], ["rhetoric and structure", "Pericles, Lincoln"], ["frames and ambiguity", "Ozymandias, Frost"]] } },
  ],
  practice: [
    { q: "What literal situation does the poem describe?", options: ["A traveller in an autumn wood must choose between two paths", "A man builds a road", "Two travellers race", "A wood catches fire"], answer: "A traveller in an autumn wood must choose between two paths", hint: "Stanza 1.", why: "“Two roads diverged in a yellow wood”: yellow leaves suggest autumn." },
    { q: "What do the two roads SYMBOLISE?", options: ["life choices: paths that lead to different futures", "only real roads", "two friends", "summer and winter"], answer: "life choices: paths that lead to different futures", hint: "Why would anyone remember a choice of path “ages and ages hence”?", why: "A fork in the road is a classic symbol of a decision that shapes one’s life." },
    { q: "Why does the speaker feel “sorry”?", options: ["He cannot travel both roads and be one traveller", "He is lost", "He is tired", "He dislikes yellow"], answer: "He cannot travel both roads and be one traveller", hint: "Lines 2–3.", why: "Choosing one path means giving up the other: the cost of every choice." },
    { q: "According to stanza 2, how worn were the two roads?", options: ["really about the same", "one was far more worn", "neither had ever been walked", "one was paved"], answer: "really about the same", hint: "“Though as for that the passing there…”", why: "“Had worn them really about the same.”" },
    { q: "“Both that morning equally lay / In leaves no step had trodden black.” What does this confirm?", options: ["Neither road showed recent footsteps; they were equally untravelled that day", "One road was black", "Many people walked that morning", "The leaves were burned"], answer: "Neither road showed recent footsteps; they were equally untravelled that day", hint: "“Equally.”", why: "Fresh leaves lay untrodden on both: no real difference." },
    { q: "“Yet knowing how way leads on to way, / I doubted if I should ever come back.” What does the speaker understand?", options: ["One choice leads to others, so you rarely return to try the other path", "He will return tomorrow", "Roads are circular", "He is lost forever"], answer: "One choice leads to others, so you rarely return to try the other path", hint: "Where does each road lead? To more roads.", why: "Each decision opens further decisions; the untaken road is usually gone for good." },
    { q: "What TENSE is the final stanza in, and why does it matter?", options: ["future: the speaker imagines how he will tell the story later", "past: it already happened", "present: he is choosing now", "no tense"], answer: "future: the speaker imagines how he will tell the story later", hint: "“I shall be telling this.”", why: "He predicts his future retelling, which may differ from what actually happened." },
    { q: "Why is “I took the one less traveled by” surprising, given stanzas 2 and 3?", options: ["The speaker had said the roads were about the same", "He took the more travelled road", "He never chose", "It is not surprising"], answer: "The speaker had said the roads were about the same", hint: "Compare the last stanza with stanzas 2–3.", why: "The future storyteller claims a difference the present observer denied: the poem’s central irony." },
    { q: "Which word in the last stanza is most AMBIGUOUS in feeling?", options: ["sigh", "wood", "two", "roads"], answer: "sigh", hint: "A sigh can express several different emotions.", why: "A sigh may mean regret, contentment, nostalgia or wry self-awareness; Frost leaves it open." },
    { q: "What is the rhyme scheme of each stanza?", options: ["ABAAB", "ABAB", "AABB", "ABCBA"], answer: "ABAAB", hint: "wood/both/stood/could/undergrowth.", why: "wood (A), both (B), stood (A), could (A), undergrowth (B)." },
    { q: "How many lines are in the whole poem?", type: "number", answer: 20, hint: "Four stanzas of how many lines?", why: "4 × 5 = 20 lines." },
    { q: "“Diverged” means...", options: ["went apart in different directions", "came together", "turned back", "ended"], answer: "went apart in different directions", hint: "dis = apart; vergere = turn.", why: "To diverge is to separate and go different ways; to converge is to come together." },
    { q: "Put the speaker’s actions in order.", type: "order", items: ["He took the other road", "He imagines telling the story with a sigh", "He looked down one road as far as he could", "He kept the first for another day"], answer: ["He looked down one road as far as he could", "He took the other road", "He kept the first for another day", "He imagines telling the story with a sigh"], hint: "Follow the stanzas.", why: "Looked, took the other, saved the first, imagined the retelling." },
    { q: "The poem was first printed in 1915. How many years before this course year (2026) is that?", type: "number", answer: 111, hint: "2026 − 1915.", why: "2026 − 1915 = 111 years." },
  ],
  challenge: [
    { q: "Many people quote the last lines as praise of bold nonconformity. Based on close reading, which interpretation is BEST supported?", options: ["We later tell our choices as more decisive than they really were", "The poem simply tells everyone to be different", "The poem says choices do not matter at all", "The poem is about building roads"], answer: "We later tell our choices as more decisive than they really were", hint: "Weigh stanzas 2–3 against stanza 4.", why: "The roads were equal; only the future telling makes one “less traveled.” The poem is about memory and self-narration, with layers of irony and real feeling." },
    { q: "Frost said the poem began as a gentle joke about a friend, and called the closing sigh “a mock sigh.” Which conclusion is BEST supported?", options: ["The poem is playful about how we retell our choices, yet it can still carry real feeling", "The poem is only a joke and means nothing serious", "Frost’s comments prove that the speaker deeply regrets his choice", "The poem tells readers always to choose the less-travelled road"], answer: "The poem is playful about how we retell our choices, yet it can still carry real feeling", hint: "An author’s comment is evidence. Does it cancel the words on the page, or support one reading of them?", why: "Frost’s remarks and the text agree that “less traveled” is a story told later. They do not make the poem empty: whether the sigh is wry, wistful or both is still left open. Weigh the author’s comments as evidence, alongside the words themselves." },
    { q: "Frost’s speaker, Jim Hawkins and the Ozymandias frame all involve a story told LATER. What do they have in common?", options: ["Each reminds us that a retelling is shaped by the teller and by time", "Each is about treasure", "Each speaker is a king", "None involves memory"], answer: "Each reminds us that a retelling is shaped by the teller and by time", hint: "Retrospective narrator; the traveller’s report; the future sigh.", why: "Jim writes years later; the king’s words come through a traveller; Frost’s speaker predicts his future story. Narrative distance shapes meaning." },
    { q: "Which pair of lines BEST shows the gap between experience and the story told about it?", options: ["“Had worn them really about the same” / “I took the one less traveled by”", "“in a yellow wood” / “in a wood, and I”", "“long I stood” / “as far as I could”", "“wanted wear” / “another day”"], answer: "“Had worn them really about the same” / “I took the one less traveled by”", hint: "Find a statement of fact and a later claim that contradicts it.", why: "The observed equality versus the remembered difference is the poem’s ironic centre." },
    { q: "In the final stanza Frost repeats “Two roads diverged in a wood,” but drops one word from line 1. Which word, and what is the effect?", options: ["“yellow”: the vivid detail fades as the memory becomes a simplified story", "“two”: there is now only one road", "“roads”: he forgets the roads", "“wood”: the forest is gone"], answer: "“yellow”: the vivid detail fades as the memory becomes a simplified story", hint: "Compare line 1 with line 3 of stanza 4.", why: "The colour vanishes in the retelling: the lived moment becomes a tidier, symbolic tale." },

// ── Question generators: every attempt asks about a different line, word or fact. ──
  const rnd = (n) => Math.floor(Math.random() * n);
  const pick = (a) => a[rnd(a.length)];
  const sample = (a, k) => { const c = [...a], out = []; while (out.length < k && c.length) out.push(c.splice(rnd(c.length), 1)[0]); return out; };
  const words = (s) => s.split(/\s+/).filter(Boolean).length;
  const STOP = new Set("about above after again against their there these those which while would could should shall where whose being every other under until never often still since though through before because between little great without within".split(" "));
  const S = (a) => (/Bible/.test(a) ? "the " + a : a);
  const norm = (x) => x.toLowerCase().replace(/[^a-z ]/g, "").replace(/\s+/g, " ").trim();
  const isPoem = (t) => t.includes(" / ");
  const unitsOf = (t) => (isPoem(t) ? t.split(/\s*\/\s*|\n\n+/) : t.split(/\n\n+/).flatMap((p) => p.split(/(?<=[.!?][”’]?)(?<!\b(?:Dr|Mr|Mrs|St)\.)\s+(?=[“‘A-Z])/)))
    .map((u) => u.trim()).filter((u) => u && !/^\d+$/.test(u));
  // Parse each passage's source; continuations inherit; retold or translated-by-us passages are not quoted.
  const sourcesOf = (lesson) => {
    const groups = [];
    let cur = null, seg = 0;
    for (const s of lesson.learn) {
      const v = s.show;
      if (!v || v.type !== "passage") continue;
      const t = v.title || "";
      let author = null, own = /retold|translated|after Aesop|after Cleomedes/i.test(t);
      const dash = t.split(" — ")[1];
      if (dash && /^[A-Z]/.test(dash) && !/continued/i.test(t)) author = dash.replace(/\s*\(.*$/, "").match(/^(Alfred, Lord Tennyson|[^,]+)/)[1].trim();
      else if (!dash && !/continued/i.test(t) && t.includes(",") && /^[A-Z][a-z]+/.test(t) && !/^(Chapter|Stave|Act|From)/.test(t)) author = t.split(",")[0].trim();
      if (!author && cur) { author = cur.author; own = own || cur.own; }
      if (!cur || cur.author !== author || cur.own !== own) { cur = { author: author || (own ? "this lesson’s retelling" : lesson.title), own, poem: isPoem(v.text), units: [], seg: [], tr: /trans\.|translation/i.test(t) }; groups.push(cur); }
      // A new excerpt (title without “continued”) or an omission mark starts a new segment:
      // “next line” and “order” questions never cross a gap in the original text.
      unitsOf(v.text).forEach((u, k) => { if ((k === 0 && !/continued/i.test(t)) || u.startsWith("[…]")) seg++; cur.units.push(u); cur.seg.push(seg); });
    }
    return groups;
  };
  const gapGen = (groups) => {
    const pool = [];
    for (const g of groups) for (const u of g.units) {
      if (words(u) < 6) continue;
      const toks = (u.match(/[A-Za-z’']+/g) || []).filter((w) => w.length >= 5 && /^[a-z]/.test(w) && !STOP.has(w.toLowerCase()));
      const once = toks.filter((w) => toks.filter((x) => x.toLowerCase() === w.toLowerCase()).length === 1 && u.split(w).length === 2);
      if (once.length) pool.push({ g, u, once });
    }
    const all = [...new Set(groups.flatMap((g) => g.units.join(" ").match(/\b[a-z][a-z’']{4,}\b/g) || []))].filter((w) => !STOP.has(w));
    if (!pool.length || all.length < 8) return null;
    return () => {
      const { g, u: full, once } = pick(pool);
      const w = pick(once);
      // Long sentences: quote a window of about 24 words around the missing word.
      let u = full;

// Course runner: turns COURSE data (one lesson per school week) into an app with the usual shell.
// Each lesson: Learn slides → Practice (hint after the first miss, worked answer after the second) →
// Challenge (contest level) → an off-screen task. No timers, no speed scoring.
// Layout: every screen must fit one screen. After each change the runner measures the panel and the stage
// and shrinks text step by step to a readable floor; only as a last resort does a long explanation or a

// The owl's bubble. `quiet` keeps the words (and the voice) but hides the bubble, used when the

  if (!box.dataset.cue) {

const singleColumn = () => getComputedStyle($(".ap-main") || document.body).gridTemplateColumns.trim().split(/\s+/).length < 2;

function fitPanel() {
  const host = $("[data-panel]");
  if (!host) return;
  const main = $(".ap-main");
  host.classList.add("cr-panel");
  const sayBox = $("[data-say]", host);
  const inner = sayBox && $(".cr-say-in", sayBox);
  host.style.removeProperty("max-height");
  main?.style.removeProperty("grid-template-columns");
  if (inner) inner.style.removeProperty("max-height");
  const over = () => host.scrollHeight - host.clientHeight;
  // A ladder of ever stronger measures; stop at the first that fits. Upright screens may give the panel
  // more height ("tall"); landscape phones give it a wider column ("wide").
  const steps = [
    { k: 1 },
    { k: 0.93 },
    { k: 0.86 },
    { k: 0.86, grow: 1 },
    { k: 0.86, grow: 1, dense: true },
    { k: 0.86, grow: 2, dense: true },
    { k: 0.8, grow: 2, dense: true },
    { k: 0.8, grow: 2, dense: true, scroll: true },

function fitStage() {

      const mid = (lo + hi) / 2;
      box.style.setProperty("--s", mid);

    }
    box.style.setProperty("--s", lo);

  const table = $(".cr-table", body);

    const grid = [...table.rows].map((r) => [...r.cells]);

// ---------- the stage ----------
// A slide or question picture: big text, emoji row, a small table, a list, bars, a passage, the lesson's own SVG,
// or (for questions without a picture) the question itself. `tag` is the progress label; `q` prints the question
// above a picture so it stays visible while hints are shown.

  else if (v.type === "list") html = `<ul class="cr-list">${(v.items || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;

async function learn(lesson, my) {

// Make every attempt different: generator questions build fresh numbers, choices are shuffled.
const shuffled = (list) => {

      draw();
      host.onclick = (e) => {
        const b = e.target.closest("[data-o]");
        if (e.target.closest("[data-undo]")) (picked = []), draw();
        else if (b && !b.disabled) {
          picked.push(Number(b.dataset.o));
          draw();
          if (picked.length === q.items.length) {
            const value = picked.map((k) => q.items[k]);
            picked = [];
            if (!check(value) && my === token && list.isConnected) draw();
          }
        }
      };
    } else {
      const host = panel(`<div data-pad></div>`);
      numpad($("[data-pad]", host), { onEnter: (v) => check(v), max: 7 });
    }
    prompt();
  });
}

const units = Object.fromEntries(
  COURSE.lessons.map((lesson, i) => [
    `l${i + 1}`,
    async () => {
      const my = token;
      const id = `l${i + 1}`;
      try {
        await learn(lesson, my);
        if (my !== token) return;
        let first = 0;
        const practice = drawSet(lesson.practice || [], lesson.practiceCount || 12);
        for (let k = 0; k < practice.length; k++) {
          if (await ask(practice[k], `Practice ${k + 1} of ${practice.length}`, my)) first += 1;
          if (my !== token) return;
        }
        const challenge = drawSet(lesson.challenge || [], lesson.challengeCount || 3);
        for (let k = 0; k < challenge.length; k++) {
          say("Challenge problem. Understand it, make a plan, carry it out, then check.");
          await wait(1200);
          if (my !== token) return;
          await ask(challenge[k], `⭐ Challenge ${k + 1} of ${challenge.length}`, my);
          if (my !== token) return;
        }
        shell.mark(id, { done: true, first, of: practice.length });
        show({ type: "big", text: `${first} / ${practice.length}`, caption: "practice problems correct on the first attempt" });
        panel(`<div class="ap-buttons"><button type="button" class="primary" data-explain>🗣️ Explain it</button><button type="button" data-off>📝 Task</button>${lesson.extend ? `<button type="button" data-extend>🚀 Go further</button>` : ""}<button type="button" data-again>↺ Again</button></div>`);
        say(`Lesson complete. Now explain the main idea in your own words.`);
        $("[data-panel]").onclick = (e) => {
          if (e.target.closest("[data-again]")) shell.go(id);
          if (e.target.closest("[data-explain]")) {
            show({ type: "list", items: [`Explain to a grown-up, in 3 or 4 clear sentences, the main idea of "${lesson.title}".`, "Give one example of your own.", "Say one question you still have."] });
            say("Explain the main idea in three or four clear sentences, give an example of your own, and ask one question you still have.");
          }
          if (e.target.closest("[data-extend]")) {
            show({ type: "list", items: [lesson.extend] });
            say(esc(lesson.extend), { quiet: true });
          }
          if (e.target.closest("[data-off]")) {
            show({ type: "list", items: [lesson.offline || "Tell a grown-up what you learned today, in 5 sentences."] });
            say(esc(lesson.offline || "Tell a grown-up what you learned today."), { quiet: true });
          }
        };
      } catch (error) {
        console.error(error);
      }
    },
  ]),
);

const how = Object.fromEntries(UNITS.map((u) => [u.id, { icon: COURSE.icon, title: u.label.replace(/^\d+\.\s*/, ""), steps: ["Learn: study the lesson slides.", "Practice: solve each problem; a first miss gives a hint, a second shows the full reasoning.", "Challenge: contest-level problems. Then explain the main idea in your own words."] }]));
const fromHash = /^#l\d+$/.test(location.hash) && UNITS.some((u) => u.id === location.hash.slice(1)) ? location.hash.slice(1) : null;
const shell = SHELL({
  unitWord: "Lesson",
  units: UNITS,
  how,
  start: fromHash || UNITS[0].id,
  onStop() {
    token += 1;
    $("[data-panel]").onclick = null;
  },
  subject: COURSE.subject,
  activity: COURSE.title,
  onUnit(id) {
    token += 1;
    VOICE.hush();
    units[id]();
  },
});

// The shell's "turn sideways" tip normally floats at the bottom of the screen, over the answer buttons.
// Here it sits at the foot of the stage (never over a control) and a tap dismisses it.
const placeTip = () => {
  const tip = $(".ap-turn");
  if (!tip) return;
  if (!tip.dataset.placed) {
    tip.dataset.placed = "1";
    tip.classList.add("cr-turn");
    tip.insertAdjacentHTML("beforeend", ` <b aria-hidden="true">✕</b>`);
    tip.setAttribute("role", "button");
    tip.addEventListener("click", () => tip.remove());
  }
  const r = stage.getBoundingClientRect();
  tip.style.bottom = "auto";
  tip.style.top = `${Math.max(4, Math.round(r.bottom - tip.offsetHeight - 10))}px`;
};
placeTip();
addEventListener("resize", placeTip);
if (window.ResizeObserver) new ResizeObserver(placeTip).observe(stage);

.cr-q+*{margin-top:calc(4px * var(--s))}

.ap-panel.cr-panel .ap-say{min-height:0;max-height:none;overflow:visible;font-size:max(14px,calc(var(--say) * var(--k)));line-height:1.38;max-width:36em;padding-top:12px;padding-bottom:12px}
