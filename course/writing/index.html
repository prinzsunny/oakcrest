<script>// Writing & Grammar: Year 1 Advanced — 32 weekly lessons (run by course/runner.js).
// Literary models are quoted from public-domain works and cited; Bible text is from the World English Bible.
// Everything lives inside one function so that no helper name can collide with the page's globals.
const COURSE = (() => {
// ───────── Shared pools and question generators (every answer is computed from tagged data) ─────────
const R = (a) => a[Math.floor(Math.random() * a.length)];
const SH = (a) => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const PICK = (a, n) => SH(a).slice(0, n);
const UNIQ = (a) => { const seen = new Set(); return a.filter((x) => { const k = String(x).toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; }); };
const OPTS = (answer, pool, n = 3) => [answer, ...PICK(UNIQ(pool).filter((x) => String(x).toLowerCase() !== String(answer).toLowerCase()), n)];
const CAP = (s) => s.charAt(0).toUpperCase() + s.slice(1);

// Sentence boundaries
const FRAG = [
  ["The lamp-post glowed in the falling snow.", "Sentence"], ["Listen carefully.", "Sentence"], ["Snow fell, and the wood grew silent.", "Sentence"],
  ["The faun hurried home with his parcels.", "Sentence"], ["When the thaw came, the rivers roared.", "Sentence"], ["Stop.", "Sentence"],
  ["The beavers' dam held firm all winter.", "Sentence"], ["Lucy trusted what she had seen.", "Sentence"], ["The sledge raced; the bells jingled.", "Sentence"],
  ["Because the wardrobe door was open.", "Fragment"], ["The tall faun with the red scarf.", "Fragment"], ["Running through the frozen wood.", "Fragment"],
  ["After the long winter in Narnia.", "Fragment"], ["Which frightened the children.", "Fragment"], ["Under the old stone table.", "Fragment"],
  ["While the Witch slept in her castle.", "Fragment"], ["Hoping to find the lamp-post again.", "Fragment"], ["The sound of sleigh bells in the distance.", "Fragment"],
  ["The ice cracked the river began to flow.", "Run-on"], ["Lucy knocked nobody answered.", "Run-on"], ["The wolves howled the children ran.", "Run-on"],
  ["Mr. Tumnus wept he had betrayed his friend.", "Run-on"], ["The sledge stopped the dwarf cracked his whip.", "Run-on"],
  ["The ice cracked, the river began to flow.", "Comma splice"], ["Lucy knocked, nobody answered.", "Comma splice"], ["The robin flew ahead, the children followed.", "Comma splice"],
  ["Edmund lied, Peter believed him.", "Comma splice"], ["The snow melted, however, the cold remained.", "Comma splice"],
];
const FRAG_WHY = { Sentence: "It has a subject and a predicate and expresses a complete thought (a command has the understood subject 'you').", Fragment: "It lacks a subject, a complete verb, or completeness: it leaves the reader waiting.", "Run-on": "Two independent clauses are fused with no punctuation or conjunction between them.", "Comma splice": "Two independent clauses are joined by only a comma (a conjunctive adverb such as 'however' does not help)." };
function genFrag(kinds) {
  return { gen: () => { const it = R(FRAG.filter((f) => kinds.includes(f[1]))); return { q: `Classify: '${it[0]}'`, options: kinds.slice(), answer: it[1], hint: "Find each subject–verb pair. How many independent clauses are there, and what joins them?", why: FRAG_WHY[it[1]] }; } };
}

// Sentence purposes
const KIND = [
  ["Where does the river begin", "interrogative", "?"], ["The Nile flows north", "declarative", "."], ["Close the wardrobe door", "imperative", "."],
  ["How bright the stars are tonight", "exclamatory", "!"], ["She asked where the river began", "declarative", "."], ["Did the faun keep his promise", "interrogative", "?"],
  ["What a cold wind that is", "exclamatory", "!"], ["Bring the lantern to the cave", "imperative", "."], ["I wonder whether the ice will hold", "declarative", "."],
  ["Who carved these symbols", "interrogative", "?"], ["Please wipe your boots", "imperative", "."], ["Beavers build dams of mud and sticks", "declarative", "."],
  ["Can you hear the bells", "interrogative", "?"], ["What an enormous lion he is", "exclamatory", "!"], ["Tell me what you saw", "imperative", "."],
  ["He wondered why the snow never melted", "declarative", "."],
];
function genKind() {
  return { gen: () => { const it = R(KIND); return { q: `What kind of sentence is this? '${it[0]}'`, options: ["declarative", "interrogative", "imperative", "exclamatory"], answer: it[1], hint: "Does it state, ask, command or exclaim? Watch for indirect questions and exclamations that begin with 'What' or 'How'.", why: it[1] === "imperative" ? `It is imperative; a command usually ends with a period (an exclamation mark if it is forceful): ${it[0]}.` : `It is ${it[1]}, so it ends with '${it[2]}': ${it[0]}${it[2]}` }; } };
}

// Nouns
const NOUNS = {
  abstract: ["courage", "loyalty", "freedom", "honesty", "patience", "wisdom", "grief", "curiosity", "justice", "friendship", "hope", "envy"],
  concrete: ["lantern", "river", "sledge", "beaver", "wardrobe", "castle", "scarf", "umbrella", "apple", "mountain", "robin", "sword"],
  collective: ["flock", "herd", "pack", "jury", "committee", "swarm", "crew", "choir", "fleet", "orchestra"],
  proper: ["Narnia", "Cairo", "Nile", "Tuesday", "October", "Aslan", "Egypt", "Babylon"],
};
function genNounKind() {
  return { gen: () => { const kind = R(["abstract", "collective", "proper"]); const ans = R(NOUNS[kind]); const others = kind === "abstract" ? NOUNS.concrete : kind === "collective" ? [...NOUNS.concrete, ...NOUNS.abstract] : [...NOUNS.concrete, ...NOUNS.abstract];
    const def = { abstract: "names an idea or quality, not something perceived by the senses", collective: "names a group as a single unit", proper: "names one particular person, place or thing and is capitalized" }[kind];
    return { q: `Which noun is ${kind}?`, options: OPTS(ans, others), answer: ans, hint: `What does a ${kind} noun name?`, why: `'${ans}' ${def}.` }; } };
}
const PLURALS = [
  ["fox", "foxes", "add -es after x", ["foxs", "foxen", "foxies"]], ["church", "churches", "add -es after ch", ["churchs", "churchies", "churchen"]], ["dish", "dishes", "add -es after sh", ["dishs", "dishies", "dishen"]], ["bus", "buses", "add -es after s", ["buss", "busies", "bus'"]],
  ["story", "stories", "consonant + y → ies", ["storys", "storyes", "storyies"]], ["city", "cities", "consonant + y → ies", ["citys", "cityes", "cityies"]], ["butterfly", "butterflies", "consonant + y → ies", ["butterflys", "butterflyes", "butterflyies"]],
  ["valley", "valleys", "vowel + y → add -s", ["vallies", "valleyes", "valleies"]], ["monkey", "monkeys", "vowel + y → add -s", ["monkies", "monkeyes", "monkeies"]], ["journey", "journeys", "vowel + y → add -s", ["journies", "journeyes", "journeies"]],
  ["wolf", "wolves", "f → ves", ["wolfs", "wolfes", "wolvs"]], ["knife", "knives", "fe → ves", ["knifes", "knifves", "knivs"]], ["leaf", "leaves", "f → ves", ["leafs", "leafes", "leavs"]], ["calf", "calves", "f → ves", ["calfs", "calfes", "calvs"]],
  ["roof", "roofs", "an exception: just add -s", ["roofen", "roofes", "rovs"]], ["chief", "chiefs", "an exception: just add -s", ["chieves", "chiefes", "chiefies"]], ["hero", "heroes", "consonant + o → -es", ["heros", "heroies", "heroen"]],
  ["potato", "potatoes", "consonant + o → -es", ["potatos", "potatoies", "potatoe"]], ["piano", "pianos", "an exception: just add -s", ["pianoes", "pianoies", "pianoen"]], ["mouse", "mice", "irregular", ["mousen", "mices", "meese"]],
  ["goose", "geese", "irregular", ["gooses", "geeses", "geesen"]], ["tooth", "teeth", "irregular", ["tooths", "teeths", "toothes"]], ["child", "children", "irregular", ["childs", "childrens", "childes"]], ["ox", "oxen", "irregular", ["oxes", "oxs", "oxens"]],
  ["sheep", "sheep", "unchanged", ["sheeps", "sheepes", "sheepen"]], ["deer", "deer", "unchanged", ["deers", "deeres", "deeren"]], ["cactus", "cacti", "Latin -us → -i", ["cactusses", "cactis", "cactae"]], ["fungus", "fungi", "Latin -us → -i", ["fungusses", "fungis", "fungae"]],
  ["larva", "larvae", "Latin -a → -ae", ["larvaes", "larvi", "larvies"]], ["crisis", "crises", "Greek -is → -es", ["crisises", "crisi", "crisiss"]], ["analysis", "analyses", "Greek -is → -es", ["analysises", "analysi", "analysiss"]],
  ["phenomenon", "phenomena", "Greek -on → -a", ["phenomenons", "phenomenae", "phenomeni"]], ["criterion", "criteria", "Greek -on → -a", ["criterions", "criteriae", "criterii"]], ["brother-in-law", "brothers-in-law", "pluralise the principal word", ["brother-in-laws", "brothers-in-laws", "brother-ins-law"]],
  ["passerby", "passersby", "pluralise the principal word", ["passerbys", "passersbys", "passerbies"]],
];
function genPlural(filter) {
  return { gen: () => { const it = R(filter ? PLURALS.filter(filter) : PLURALS); const s = it[0];
    const wrong = it[3];
    return { q: `What is the plural of '${s}'?`, options: OPTS(it[1], wrong), answer: it[1], hint: "Look at how the word ends, and ask whether it is irregular or borrowed from Latin or Greek.", why: `${s} → ${it[1]} (${it[2]}).` }; } };
}
const OWNERS = [["farmer", "farmers"], ["child", "children"], ["witch", "witches"], ["beaver", "beavers"], ["boss", "bosses"], ["mouse", "mice"], ["goose", "geese"], ["princess", "princesses"], ["wolf", "wolves"], ["sailor", "sailors"], ["fox", "foxes"], ["woman", "women"], ["scribe", "scribes"], ["man", "men"]];
const THINGS = ["shields", "voices", "tracks", "footprints", "lanterns", "cloaks"];
function genPossessive() {
  return { gen: () => { const [one, many] = R(OWNERS); const plural = Math.random() < 0.5; const owner = plural ? many : one; const ans = plural && owner.endsWith("s") ? owner + "'" : owner + "'s"; const thing = R(THINGS);
    return { q: `Write the possessive: 'the ${thing} of the ${owner}' (${plural ? "more than one owner" : "one owner"}).`, options: OPTS(`the ${ans} ${thing}`, [`the ${one}'s ${thing}`, `the ${many}'s ${thing}`, `the ${many}' ${thing}`, `the ${many} ${thing}`, `the ${one}s' ${thing}`]), answer: `the ${ans} ${thing}`, hint: "First write the owner (singular or plural). Does that form already end in s?", why: plural && owner.endsWith("s") ? `'${owner}' is plural and ends in s, so add only an apostrophe: ${ans}.` : `'${owner}' does not end in a plural s, so add 's: ${ans}.` }; } };
}

// Pronoun case
const PRON = [["I", "me"], ["he", "him"], ["she", "her"], ["we", "us"], ["they", "them"]];
const PRON_T = [
  ["___ and the dwarf crossed the frozen river.", 0], ["The faun invited Lucy and ___ to tea.", 1], ["The letter was addressed to ___ and Susan.", 1],
  ["Peter and ___ found the horn in the snow.", 0], ["Mrs. Beaver gave ___ a basket of food.", 1], ["The robin flew ahead of ___.", 1],
  ["Neither Edmund nor ___ saw the wolf.", 0], ["The Professor listened to the children and ___.", 1], ["Everyone except ___ heard the bells.", 1],
  ["When ___ and the beavers arrived, the dam was finished.", 0], ["The Witch watched Peter and ___ from her sledge.", 1], ["It was ___ who rang the bell. (formal)", 0],
];
function genPronounCase() {
  return { gen: () => { const [t, c] = R(PRON_T); const p = R(PRON); const ans = p[c];
    return { q: `Choose the pronoun: '${t}'`, options: [p[0], p[1]], answer: ans, hint: "Remove any other name joined by 'and' or 'nor'. Is the pronoun a subject (or predicate nominative), or an object?", why: c === 0 ? `The pronoun is a subject (or follows a linking verb in formal English), so it takes the subjective case: ${ans}.` : `The pronoun is an object (of a verb or preposition), so it takes the objective case: ${ans}.` }; } };
}

// Verbs
const IRR = [["go", "went", "gone"], ["see", "saw", "seen"], ["write", "wrote", "written"], ["take", "took", "taken"], ["bring", "brought", "brought"], ["sing", "sang", "sung"],
  ["swim", "swam", "swum"], ["ring", "rang", "rung"], ["drink", "drank", "drunk"], ["begin", "began", "begun"], ["break", "broke", "broken"], ["choose", "chose", "chosen"],
  ["drive", "drove", "driven"], ["eat", "ate", "eaten"], ["fall", "fell", "fallen"], ["fly", "flew", "flown"], ["freeze", "froze", "frozen"], ["give", "gave", "given"],
  ["grow", "grew", "grown"], ["know", "knew", "known"], ["ride", "rode", "ridden"], ["rise", "rose", "risen"], ["speak", "spoke", "spoken"], ["steal", "stole", "stolen"],
  ["throw", "threw", "thrown"], ["wear", "wore", "worn"], ["catch", "caught", "caught"], ["teach", "taught", "taught"], ["think", "thought", "thought"], ["buy", "bought", "bought"],
  ["lie (recline)", "lay", "lain"], ["lay (put)", "laid", "laid"], ["sit", "sat", "sat"], ["tear", "tore", "torn"], ["shake", "shook", "shaken"], ["hide", "hid", "hidden"],
  ["bite", "bit", "bitten"], ["draw", "drew", "drawn"], ["forget", "forgot", "forgotten"], ["come", "came", "come"], ["run", "ran", "run"], ["do", "did", "done"]];
const ED = (b) => (b.endsWith("e") ? b + "d" : /[^aeiou]y$/.test(b) ? b.slice(0, -1) + "ied" : b + "ed");
function verbWrong(v) { const b = v[0].split(" ")[0]; return [v[1], v[2], ED(b), b, b + "en", v[1] + "ed", b + "s", b + "ing"]; }
function genPast() {
  return { gen: () => { const v = R(IRR); const b = v[0].split(" ")[0];
    return { q: `What is the simple past tense of '${v[0]}'?  (Yesterday they ___.)`, options: OPTS(v[1], verbWrong(v)), answer: v[1], hint: "Say: Today they ___; yesterday they ___; they have ___.", why: `${b}, ${v[1]}, (have) ${v[2]}. The simple past needs no helping verb.` }; } };
}
function genParticiple() {
  return { gen: () => { const v = R(IRR); const b = v[0].split(" ")[0];
    return { q: `Complete with the past participle of '${v[0]}': 'By noon they had ___.'`, options: OPTS(v[2], verbWrong(v)), answer: v[2], hint: "After has, have or had, use the third principal part.", why: `${b}, ${v[1]}, (had) ${v[2]}.` }; } };
}
const TVERBS = [["carve", "carves", "carved", "carved", "carving"], ["plant", "plants", "planted", "planted", "planting"], ["build", "builds", "built", "built", "building"],
  ["write", "writes", "wrote", "written", "writing"], ["sail", "sails", "sailed", "sailed", "sailing"], ["study", "studies", "studied", "studied", "studying"],
  ["copy", "copies", "copied", "copied", "copying"], ["sing", "sings", "sang", "sung", "singing"], ["guard", "guards", "guarded", "guarded", "guarding"]];
const TENSES = { "simple present": (v) => v[1], "simple past": (v) => v[2], "simple future": (v) => "will " + v[0], "present progressive": (v) => "is " + v[4], "past progressive": (v) => "was " + v[4], "future progressive": (v) => "will be " + v[4],
  "present perfect": (v) => "has " + v[3], "past perfect": (v) => "had " + v[3], "future perfect": (v) => "will have " + v[3], "present perfect progressive": (v) => "has been " + v[4], "past perfect progressive": (v) => "had been " + v[4], "future perfect progressive": (v) => "will have been " + v[4] };
function genTenseName(names) {
  return { gen: () => { const v = R(TVERBS); const t = R(names); const form = TENSES[t](v);
    return { q: `Name the tense: 'The scribe ${form}.'`, options: OPTS(t, names), answer: t, hint: "Look at the helping verbs: will (future), has/had (perfect), a form of be + -ing (progressive).", why: `'${form}' is the ${t}.` }; } };
}
function genTenseForm(names) {
  return { gen: () => { const v = R(TVERBS); const t = R(names); const form = TENSES[t](v);
    return { q: `Write the ${t} of '${v[0]}' for the subject 'the scribe'.`, options: OPTS(form, names.map((n) => TENSES[n](v))), answer: form, hint: "Perfect = has/had/will have + past participle; progressive = be + -ing.", why: `The ${t} is 'the scribe ${form}'.` }; } };
}

// Subject–verb agreement
const SVA_S = [["The box of old scrolls", "s", "The subject is 'box'; the prepositional phrase does not change it."], ["The scrolls in the box", "p", "The subject is 'scrolls'."],
  ["Each of the tombs", "s", "'Each' is always singular."], ["Both of the sphinxes", "p", "'Both' is always plural."], ["Neither the priests nor the king", "s", "With 'nor', the verb agrees with the nearer subject, 'king'."],
  ["Neither the king nor the priests", "p", "With 'nor', the verb agrees with the nearer subject, 'priests'."], ["Either the scribe or his students", "p", "With 'or', the nearer subject, 'students', decides."],
  ["The pharaoh and his queen", "p", "Subjects joined by 'and' are plural."], ["Everyone in the two villages", "s", "'Everyone' is singular."], ["One of the pyramids", "s", "The subject is 'one'."],
  ["Several of the workers", "p", "'Several' is always plural."], ["The committee", "s", "A collective noun acting as one unit is singular (in American usage; British writers often treat it as plural)."], ["Some of the water", "s", "'Some' follows its noun; 'water' is uncountable."],
  ["Some of the jars", "p", "'Some' follows its noun; 'jars' is plural."], ["None of the grain", "s", "'None' follows its noun; 'grain' is uncountable here."], ["All of the sailors", "p", "'All' follows its noun; 'sailors' is plural."],
  ["The number of visitors", "s", "'The number' is a single quantity."], ["A number of visitors", "p", "'A number of' means 'several'."], ["The teacher, along with her students,", "s", "'Along with' does not create a compound subject; the subject is 'teacher'."],
  ["The students, as well as their teacher,", "p", "'As well as' does not change the subject, 'students'."]];
const SVA_P = [["is", "are", "described in the scroll."], ["was", "were", "recorded in the ledger."], ["has", "have", "been mentioned twice."], ["appears", "appear", "in the report."]];
function genSVA() {
  return { gen: () => { const s = R(SVA_S); const p = R(SVA_P); const ans = s[1] === "s" ? p[0] : p[1];
    return { q: `Choose the verb: '${s[0]} ___ ${p[2]}'`, options: [p[0], p[1]], answer: ans, hint: "Find the true subject: cross out phrases, check indefinite pronouns, and with or/nor look at the nearer subject.", why: `${s[2]} So: ${s[0]} ${ans} ${p[2]}` }; } };
}

// Comparison
const COMP = [["long", "longer", "longest"], ["tall", "taller", "tallest"], ["narrow", "narrower", "narrowest"], ["heavy", "heavier", "heaviest"], ["big", "bigger", "biggest"],
  ["good", "better", "best"], ["bad", "worse", "worst"], ["far", "farther", "farthest"], ["ancient", "more ancient", "most ancient"], ["famous", "more famous", "most famous"],
  ["dangerous", "more dangerous", "most dangerous"], ["brave", "braver", "bravest"], ["wise", "wiser", "wisest"], ["powerful", "more powerful", "most powerful"], ["busy", "busier", "busiest"]];
function genCompare() {
  return { gen: () => { const c = R(COMP); const n = R(["two", "three", "four", "five", "two", "seven"]); const noun = R(["bridges", "rivers", "temples", "roads", "cities", "towers"]); const ans = n === "two" ? c[1] : c[2];
    const wrong = c[1].startsWith("more") ? [c[1], c[2], c[0] + "er", c[0] + "est"] : [c[1], c[2], "more " + c[1], "most " + c[2]];
    return { q: `Of the ${n} ${noun}, this one is the ___ (${c[0]}).`, options: OPTS(ans, wrong), answer: ans, hint: "In formal writing, two items take the comparative; three or more take the superlative. Never double a comparison.", why: `${n === "two" ? "Two items" : "More than two items"} → ${n === "two" ? "comparative" : "superlative"}: ${ans}.` }; } };

function moveOpts(seq, cur) {

    const label = j === 0 ? `Move sentence ${i + 1} to the beginning.` : `Move sentence ${i + 1} so that it follows sentence ${cur.indexOf(rest[j - 1]) + 1}.`;
    moves.push({ label, res });

      const why = q.why ? `<small>${esc(q.why)}</small>` : "";
      say(right ? `Correct. ${q.why ? esc(q.why) : ""}` : `The answer is <b>${stop(esc(Array.isArray(q.answer) && q.answerText == null ? q.answer.join(" → ") : q.answerText ?? q.answer))}</b> ${why}`);
      $("[data-panel]").onclick = (e) => e.target.closest("[data-go]") && resolve(tries === 1 && right);
    };
    const check = (value) => {
      if (my !== token) return false;
      tries += 1;
      const want = Array.isArray(q.answer) ? q.answer.join("|") : String(q.answer).trim().toLowerCase();
      const got = Array.isArray(value) ? value.join("|") : String(value).trim().toLowerCase();
      if (got === want) {
        if (tries === 1) remember(q, false, src);
        MUSIC.chime();
        window.OC?.count("problems solved");
        finish(true);
        return true;
      }
      MUSIC.oops();
      if (tries === 1) remember(q, true, src);
      if (tries === 1) say(`Not quite. ${q.hint ? esc(q.hint) : "Reconsider the question carefully."}`);
      else finish(false);
      return false;
    };
    // The question is already on the stage, so the owl reads it aloud with the bubble hidden.
    const prompt = () => say(esc(q.q), { quiet: true });
    if (type === "choice") {
      const host = panel(`<div class="ap-chips cr-choices ${listClass(q.options)}" data-list>${q.options.map((o, k) => `<button type="button" data-c="${k}">${esc(o)}</button>`).join("")}</div>`);
      // If even the tightest layout cannot hold these answers, print them on the stage as A, B, C…
      // (which may scroll there) and keep only large lettered buttons in the panel.
      const letter = (k) => String.fromCharCode(65 + k);
      const choiceList = $("[data-list]", host);
      choiceList._crCompact = () => {
        const list = choiceList, body = $(".cr-body", stage);
        // Only for genuinely long answer sets; short ones always fit the card layout.
        if (!list.isConnected || q.options.reduce((a, o) => a + len(o), 0) < 200) return false;
        if (!list || !body || q.options.length > 8) return false;
        const missed = new Set([...list.querySelectorAll(".cr-miss")].map((b) => b.dataset.c));
        list.className = "ap-chips cr-choices cr-letters";
        list.innerHTML = q.options.map((o, k) => `<button type="button" data-c="${k}" aria-label="${letter(k)}: ${esc(o).replace(/"/g, "&quot;")}" ${missed.has(String(k)) ? `disabled class="cr-miss"` : ""}>${letter(k)}</button>`).join("");
        body.insertAdjacentHTML("beforeend", `<ol class="cr-opts">${q.options.map((o, k) => `<li data-li="${k}" class="${missed.has(String(k)) ? "cr-miss" : ""}"><b>${letter(k)}</b><span>${esc(o)}</span></li>`).join("")}</ol>`);
        return true;
      };
      host.onclick = (e) => {
        const b = e.target.closest("[data-c]");
        if (!b || b.disabled) return;
        const ok = check(q.options[Number(b.dataset.c)]);
        if (!ok && my === token && b.isConnected) {
          b.disabled = true;
          b.classList.add("cr-miss");
          $(`.cr-opts [data-li="${b.dataset.c}"]`, stage)?.classList.add("cr-miss");
        }
      };
    } else if (type === "order") {
      let picked = [];
      const host = panel(`<div class="ap-chips cr-choices cr-ordering ${listClass(q.items)}" data-list></div><div class="ap-buttons cr-undo"><button type="button" data-undo>↺ Start over</button></div>`);
      const list = $("[data-list]", host);
      const draw = () => {
        list.innerHTML = q.items
          .map((o, k) => {
            const at = picked.indexOf(k);
            return `<button type="button" data-o="${k}" ${at >= 0 ? `disabled aria-pressed="true"` : ""}><i>${at >= 0 ? at + 1 : ""}</i><span>${esc(o)}</span></button>`;
          })
          .join("");
        $(".cr-undo", host).style.display = picked.length ? "" : "none";
        refit();
      };
      draw();
      host.onclick = (e) => {
        const b = e.target.closest("[data-o]");
        if (e.target.closest("[data-undo]")) (picked = []), draw();
        else if (b && !b.disabled) {
          picked.push(Number(b.dataset.o));
          draw();
          if (picked.length === q.items.length) {
            const value = picked.map((k) => q.items[k]);
            picked = [];
            if (!check(value) && my === token && list.isConnected) draw();
          }
        }
      };
    } else {
      const host = panel(`<div data-pad></div>`);
      numpad($("[data-pad]", host), { onEnter: (v) => check(v), max: 7 });
    }
    prompt();
  });
}

const units = Object.fromEntries(
  COURSE.lessons.map((lesson, i) => [
    `l${i + 1}`,
    async () => {
      const my = token;
      const id = `l${i + 1}`;
      try {
        await learn(lesson, my);
        if (my !== token) return;
        let first = 0;
        const review = reviewFor(i);
        if (review.length) {
          say(`First, a short review: ${review.length === 1 ? "one question" : `${review.length} questions`} missed in an earlier lesson.`);
          await wait(1400);
          if (my !== token) return;
        }
        for (let k = 0; k < review.length; k++) {
          await ask(review[k].q, `🔁 Review ${k + 1} of ${review.length}`, my, review[k].src);
          if (my !== token) return;
        }
        const bankOf = (name) => (lesson[name] || []).map((q, k) => ({ q, k }));
        const practice = drawSet(bankOf("practice"), lesson.practiceCount || 12);
        for (let k = 0; k < practice.length; k++) {
          if (await ask(practice[k].q, `Practice ${k + 1} of ${practice.length}`, my, { lesson: i, bank: "practice", k: practice[k].k })) first += 1;
          if (my !== token) return;
        }
        const challenge = drawSet(bankOf("challenge"), lesson.challengeCount || 3);
        for (let k = 0; k < challenge.length; k++) {
          say("Challenge problem. Understand it, make a plan, carry it out, then check.");
          await wait(1200);
          if (my !== token) return;
          await ask(challenge[k].q, `⭐ Challenge ${k + 1} of ${challenge.length}`, my, { lesson: i, bank: "challenge", k: challenge[k].k });
          if (my !== token) return;
        }
        shell.mark(id, { done: true, first, of: practice.length, doneAt: Date.now() });
        show({ type: "big", text: `${first} / ${practice.length}`, caption: "practice problems correct on the first attempt" });
        panel(`<div class="ap-buttons"><button type="button" class="primary" data-explain>🗣️ Explain it</button><button type="button" data-off>📝 Task</button>${lesson.extend ? `<button type="button" data-extend>🚀 Go further</button>` : ""}<button type="button" data-again>↺ Again</button></div>`);
        say(`Lesson complete. Now explain the main idea in your own words.`);
        $("[data-panel]").onclick = (e) => {
          if (e.target.closest("[data-again]")) shell.go(id);
          if (e.target.closest("[data-explain]")) {
            show({ type: "list", items: [`Explain to a grown-up, in 3 or 4 clear sentences, the main idea of "${lesson.title}".`, "Give one example of your own.", "Say one question you still have."] });
            say("Explain the main idea in three or four clear sentences, give an example of your own, and ask one question you still have.");
          }
          if (e.target.closest("[data-extend]")) {
            show({ type: "list", items: [lesson.extend] });
            say(esc(lesson.extend), { quiet: true });
          }
          if (e.target.closest("[data-off]")) {
            show({ type: "list", items: [lesson.offline || "Tell a grown-up what you learned today, in 5 sentences."] });
            say(esc(lesson.offline || "Tell a grown-up what you learned today."), { quiet: true });
          }
        };
      } catch (error) {
        console.error(error);
      }
    },
  ]),
);

const how = Object.fromEntries(UNITS.map((u) => [u.id, { icon: COURSE.icon, title: u.label.replace(/^\d+\.\s*/, ""), steps: ["Learn: study the lesson slides.", "Practice: solve each problem; a first miss gives a hint, a second shows the full reasoning.", "Challenge: contest-level problems. Then explain the main idea in your own words."] }]));
const fromHash = /^#l\d+$/.test(location.hash) && UNITS.some((u) => u.id === location.hash.slice(1)) ? location.hash.slice(1) : null;
const shell = SHELL({
  unitWord: "Lesson",
  units: UNITS,
  how,
  start: fromHash || UNITS[0].id,
  onStop() {
    token += 1;
    $("[data-panel]").onclick = null;
  },
  subject: COURSE.subject,
  activity: COURSE.title,
  onUnit(id) {
    token += 1;
    VOICE.hush();
    units[id]();
  },
});

// The shell's "turn sideways" tip normally floats at the bottom of the screen, over the answer buttons.
// Here it sits at the foot of the stage (never over a control) and a tap dismisses it.
const placeTip = () => {
  const tip = $(".ap-turn");
  if (!tip) return;
  if (!tip.dataset.placed) {
    tip.dataset.placed = "1";
    tip.classList.add("cr-turn");
    tip.insertAdjacentHTML("beforeend", ` <b aria-hidden="true">✕</b>`);
    tip.setAttribute("role", "button");
    tip.addEventListener("click", () => tip.remove());
  }
  const r = stage.getBoundingClientRect();
  tip.style.bottom = "auto";
  tip.style.top = `${Math.max(4, Math.round(r.bottom - tip.offsetHeight - 10))}px`;
};
placeTip();
addEventListener("resize", placeTip);
if (window.ResizeObserver) new ResizeObserver(placeTip).observe(stage);

.cr-q+*{margin-top:calc(4px * var(--s))}
.cr-cap{margin:0;color:var(--muted);font:800 max(13px,calc(clamp(14px,2vw,18px) * var(--s))) var(--sans);text-align:center}
.cr-fade{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 36px),transparent)}

/* panel (selectors carry .ap-panel.cr-panel so per-course style tweaks cannot undo the fit):
   children never squash (that hides text); content is centerd but never cut at the top */

.ap-panel.cr-panel .ap-say{min-height:0;max-height:none;overflow:visible;font-size:max(14px,calc(var(--say) * var(--k)));line-height:1.38;max-width:36em;padding-top:12px;padding-bottom:12px}
.ap-panel.cr-panel .ap-say.cr-quiet{display:none}
.ap-panel.cr-panel .cr-say-in{display:block;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}

@media (max-height:460px){.ap-panel.cr-panel .ap-buttons button,.ap-panel.cr-panel .kt-step-btn{min-height:44px}.ap-panel.cr-panel .cr-choices button{min-height:44px}.cr-show{padding:8px 10px}.cr-tag{font-size:12.5px;padding:3px 10px}}
`;
