  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  // Build a choice question: the answer plus 3 distinct wrong options taken in order of preference.
  function mc(q, answer, wrongLists, hint, why, extra) {
    const wrong = [];
    for (const list of wrongLists) for (const w of shuffle(list)) { if (wrong.length < 3 && w !== answer && !wrong.includes(w)) wrong.push(w); }

        { say: "An <b>autobiography</b> is a life story written by its own subject: self, life, write.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><g font-size='34' font-weight='800' text-anchor='middle'><rect x='20' y='60' width='170' height='86' rx='12' fill='#d6f0ec' stroke='#0f766e' stroke-width='4'/><text x='105' y='115' fill='#0f4c45'>auto</text><rect x='215' y='60' width='170' height='86' rx='12' fill='#fde7c8' stroke='#b45309' stroke-width='4'/><text x='300' y='115' fill='#7c2d12'>bio</text><rect x='410' y='60' width='170' height='86' rx='12' fill='#e5e0fa' stroke='#6d28d9' stroke-width='4'/><text x='495' y='115' fill='#4c1d95'>graph</text></g><g font-size='26' text-anchor='middle' fill='#333'><text x='105' y='186'>self</text><text x='300' y='186'>life</text><text x='495' y='186'>write</text></g><text x='300' y='265' font-size='28' font-weight='800' text-anchor='middle' fill='#222'>a life, written by oneself</text></svg>" } },
        { say: "The suffix <b>-logy</b> names a field of study, and <b>-logist</b> names the person who pursues it.", show: { type: "list", items: ["biology / biologist — the study of life", "geology / geologist — the study of the earth's rocks and history", "geography — writing (describing, mapping) the earth", "photosynthesis — plants 'putting together' food using light", "autonomy — self-law: the right to govern oneself"] } },
        { say: "<b>Autonomous</b> means self-governing. An autonomous country makes its own laws; an autonomous robot makes its own decisions.", show: { type: "big", text: "auto + nom + ous\nself + law\n= self-governing" } },
        { say: "Now begin Latin pronunciation. We use church (ecclesiastical) Latin. Its vowels are pure and steady: each keeps essentially one sound (e varies only slightly, between ay and eh).", show: { type: "table", rows: [["Letter", "Sound", "Latin word"], ["a", "ah", "aqua (AH-kwah) water"], ["e", "ay or eh", "mare (MAH-ray) sea"], ["i", "ee", "via (VEE-ah) road"], ["o", "oh", "sol (sohl) sun"], ["u", "oo", "luna (LOO-nah) moon"]] } },
        { say: "Note: the name George comes from Greek georgos, 'earth-worker', meaning a farmer. Roots hide in names as well as in science.", show: { type: "big", text: "George = geo + ergon\nearth + work" } },
      ],
      practice: [
        { q: "What does the root 'photo' mean?", options: ["light", "life", "earth", "self"], answer: "light", hint: "What must a camera capture to make an image?", why: "Photo means light; a photograph is 'written with light'." },
        { q: "A biography is...", options: ["an account of a person's life", "a study of rocks", "a map of the earth", "a book of laws"], answer: "an account of a person's life", hint: "Bio + graph.", why: "Bio (life) + graph (write)." },
        { q: "An autobiography is written by...", options: ["the person it describes", "a biologist", "a historian centuries later", "a machine"], answer: "the person it describes", hint: "What does auto add to biography?", why: "Auto (self): the subject writes their own life story." },
        { q: "Geology is the study of...", options: ["the earth's rocks and history", "living things", "light", "the stars"], answer: "the earth's rocks and history", hint: "Geo + logy.", why: "Geo (earth) + logy (study of)." },
        { q: "Build 'autobiography' from its parts.", type: "order", items: ["graph", "bio", "auto", "y"], answer: ["auto", "bio", "graph", "y"], hint: "Self, life, write, then the noun ending.", why: "auto + bio + graph + y." },
        { q: "In 'photosynthesis', synthesis means 'putting together'. What do plants use to put their food together?", options: ["light", "soil alone", "sound", "heat from rocks"], answer: "light", hint: "Translate photo.", why: "Plants use the energy of light to make sugar from water and carbon dioxide." },
        { q: "An 'autonomous' region...", options: ["governs itself", "has no people", "is ruled from far away", "is very large"], answer: "governs itself", hint: "Auto + nom: self + law.", why: "Autonomy is self-rule: making one's own laws." },
        { q: "Astronomy contains astr (star) + nom (law, arrangement). It is...", options: ["the science of the stars and their motions", "the study of rocks", "fortune-telling", "the study of weather"], answer: "the science of the stars and their motions", hint: "The 'laws' of the stars.", why: "Astronomy studies the arrangement and laws of the heavens. (Astrology, fortune-telling by stars, is not a science.)" },
        { q: "'Photomicrograph' = photo + micro + graph. How many Greek roots?", type: "number", answer: 3, hint: "Count photo, micro, graph.", why: "Three roots: a photograph taken through a microscope." },
        { q: "How is the Latin word 'luna' (moon) pronounced?", options: ["LOO-nah", "LUH-nuh", "LIE-nay", "LOON-ee"], answer: "LOO-nah", hint: "Latin u says oo; a says ah.", why: "u = oo, a = ah: LOO-nah." },
        { q: "In Latin, the vowel i always sounds like...", options: ["ee as in see", "eye as in kite", "ih as in sit", "ay as in day"], answer: "ee as in see", hint: "Recall via, VEE-ah.", why: "Latin i is ee." },
        { q: "A 'dialogue' is a conversation. Dia means 'through' or 'between'. Which part means 'word'?", options: ["logue", "dia", "di", "gue"], answer: "logue", hint: "Logos means word.", why: "Dia (between) + logue (word): words passing between speakers." },
        { q: "Which person studies living organisms?", options: ["a biologist", "a geologist", "a geographer", "an astronomer"], answer: "a biologist", hint: "Which root means life?", why: "Bio (life) + logist (one who studies)." },
      ],
      challenge: [
        { q: "Analogy — biology : life :: geology : ___", options: ["earth", "light", "self", "law"], answer: "earth", hint: "Each is the study of something. Of what?", why: "Biology studies life; geology studies the earth." },
        { q: "Words in context: 'Though the colony still flew the empire's flag, it had won autonomy over its schools, courts and taxes.' Autonomy means...", options: ["self-government", "great wealth", "a royal crown", "a new flag"], answer: "self-government", hint: "What can the colony now control?", why: "Auto (self) + nomy (law): it governs its own schools, courts and taxes." },
        { q: "Geothermal (therm = heat) energy comes from...", options: ["heat within the earth", "sunlight", "wind", "burning wood"], answer: "heat within the earth", hint: "Combine geo and therm.", why: "Geo (earth) + therm (heat): hot springs and geysers carry it to the surface." },
      ],
      extend: "Read about the photosynthesis experiment of Jan Ingenhousz (1779), who showed that plants make oxygen only in light. With a grown-up, place a water-plant sprig in a glass of water in bright sun and watch for tiny bubbles. Write a 4-sentence report using the words photosynthesis and biologist.",
      offline: "Write your autograph in three styles, then write a 5-sentence autobiography. Explain it: tell a grown-up why autobiography needs all three roots (auto, bio, graph) — what would each word mean with one root missing?",
    },
    // ---------- Lesson 3 ----------
    {
      title: "Time, heat, water, stars", icon: "⏳",
      learn: [
        { say: "Six Greek roots: <b>chron</b> time, <b>therm</b> heat, <b>hydr</b> water, <b>astr/aster</b> star, <b>metr/meter</b> measure, and <b>syn/sym</b> together.", show: { type: "table", rows: [["Root", "Meaning", "Example"], ["chron", "time", "chronological"], ["therm", "heat", "thermal"], ["hydr", "water", "hydrant"], ["astr / aster", "star", "asterisk"], ["metr / meter", "measure", "perimeter"], ["syn / sym", "together", "synchronize"]] } },
        { say: "A <b>thermometer</b> measures heat: therm plus meter.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><rect x='270' y='30' width='60' height='210' rx='30' fill='#fff' stroke='#444' stroke-width='5'/><circle cx='300' cy='260' r='42' fill='#dc2626' stroke='#444' stroke-width='5'/><rect x='288' y='110' width='24' height='150' fill='#dc2626'/><g stroke='#444' stroke-width='3'><line x1='330' y1='70' x2='350' y2='70'/><line x1='330' y1='110' x2='350' y2='110'/><line x1='330' y1='150' x2='350' y2='150'/><line x1='330' y1='190' x2='350' y2='190'/></g><text x='130' y='120' font-size='40' font-weight='800' text-anchor='middle' fill='#b91c1c'>therm</text><text x='130' y='160' font-size='26' text-anchor='middle' fill='#333'>heat</text><text x='470' y='120' font-size='40' font-weight='800' text-anchor='middle' fill='#1d4ed8'>meter</text><text x='470' y='160' font-size='26' text-anchor='middle' fill='#333'>measure</text></svg>" } },
        { say: "These roots combine into many precise words.", show: { type: "list", items: ["chronological = arranged in order of time", "synchronize = make happen at the same time (syn + chron)", "dehydrated = with the water removed", "astronaut = star-sailor; asterisk = little star (*)", "perimeter = the measure around a shape (peri = around)", "symmetry = 'measured together': matching halves"] } },
        { say: "Mathematics is full of these roots: <b>symmetry</b>, <b>perimeter</b>, <b>diameter</b> (the measure through a circle), and <b>geometry</b>, literally 'earth-measuring', because it began with surveying fields.", show: { type: "big", text: "geo + metry\nearth-measuring" } },
        { say: "Latin consonants. In church Latin, <b>c</b> before e, i, ae or oe sounds like ch; elsewhere it is a hard k.", show: { type: "table", rows: [["Latin", "Say it", "Meaning"], ["caelum", "CHAY-loom", "sky"], ["decem", "DEH-chem", "ten"], ["canis", "KAH-nees", "dog"], ["corpus", "KOHR-poos", "body"]] } },
        { say: "Two more rules: <b>ae</b> sounds like ay, and <b>gn</b> sounds like ny. So Agnus Dei, 'Lamb of God', is AH-nyoos DAY-ee. And <b>g</b> before e or i is soft, as in gemma (JEM-mah), a jewel.", show: { type: "big", text: "Agnus Dei\nAH-nyoos DAY-ee" } },
      ],
      practice: [
        { q: "What does the root 'chron' mean?", options: ["time", "heat", "water", "star"], answer: "time", hint: "A chronological account is arranged by...", why: "Chron means time (Greek chronos)." },
        { q: "Dehydrated fruit has had its ___ removed.", options: ["water", "seeds", "sugar", "skin"], answer: "water", hint: "De means away; hydr means...", why: "De (away) + hydr (water)." },
        { q: "Which part of 'astronaut' means sailor?", options: ["naut", "astro", "astr", "ro"], answer: "naut", hint: "Remove the star root. What remains?", why: "Astro (star) + naut (sailor)." },
        { q: "To synchronize watches means to...", options: ["set them to show the same time", "break them", "measure heat", "wind them up"], answer: "set them to show the same time", hint: "Syn (together) + chron (time).", why: "Making times agree: together + time." },
        { q: "Put these in chronological order, earliest first.", type: "order", items: ["first Moon landing", "dinosaurs", "today", "ancient Rome"], answer: ["dinosaurs", "ancient Rome", "first Moon landing", "today"], hint: "Which existed before any human?", why: "Dinosaurs (over 66 million years ago), Rome (about 2,000 years ago), the Moon landing (1969), today." },
        { q: "Perimeter means 'measure around'. A square field has sides of 25 meters. What is its perimeter in meters?", type: "number", answer: 100, hint: "How many sides does the square have?", why: "4 × 25 = 100 meters." },
        { q: "A circle's diameter is 'the measure through' it. If its radius (center to edge) is 7 cm, how long is the diameter in cm?", type: "number", answer: 14, hint: "The diameter crosses the whole circle: two radii.", why: "2 × 7 = 14 cm." },
        { q: "The mark * is an asterisk. Its name means...", options: ["little star", "little water", "little time", "little heat"], answer: "little star", hint: "Look at its shape. Aster means...", why: "Aster (star) + isk (little)." },
        { q: "Hydrogen (hydr + gen, 'water-producer') was so named because burning it produces...", options: ["water", "smoke", "salt", "light only"], answer: "water", hint: "Translate the first root.", why: "Hydrogen combines with oxygen when it burns, forming water." },
        { q: "In church Latin, 'caelum' (sky) begins with which sound?", options: ["ch", "k", "s", "g"], answer: "ch", hint: "What follows the c?", why: "C before ae is ch: CHAY-loom." },
        { q: "Which Latin word begins with a hard K sound?", options: ["canis", "caelum", "certus", "circus"], answer: "canis", hint: "C is hard before a, o and u.", why: "Canis: c before a. The others have c before e, i or ae." },
        { q: "How is 'magnus' (great) pronounced in church Latin?", options: ["MAH-nyoos", "MAG-nus", "MAG-noos", "MAN-gus"], answer: "MAH-nyoos", hint: "What sound does gn make?", why: "gn = ny, u = oo: MAH-nyoos." },
        { q: "Geometry literally means...", options: ["earth-measuring", "star-writing", "time-keeping", "water-study"], answer: "earth-measuring", hint: "Geo + metr.", why: "Geo (earth) + metr (measure). The Greek word first meant land-surveying; the historian Herodotus said the Greeks learned the art from Egyptian surveyors who re-measured fields after the Nile floods." },
      ],
      challenge: [
        { q: "Analogy — thermometer : heat :: chronometer : ___", options: ["time", "water", "stars", "sound"], answer: "time", hint: "What does each instrument measure?", why: "A chronometer is a precision clock: it measures time." },
        { q: "Words in context: 'The cost of the new space telescope was astronomical, more than ten billion dollars.' Astronomical here means...", options: ["enormous", "related to stars", "tiny", "on schedule"], answer: "enormous", hint: "Distances between stars are vast. How is the word extended?", why: "Because star distances are immense, 'astronomical' also means extremely large." },
        { q: "An 'anachronism' (ana = against, back) is something placed in the wrong time. Which is an anachronism?", options: ["a Roman senator wearing a wristwatch in a painting", "a dinosaur in a museum", "an astronaut on the Moon in 1969", "a calendar on a wall"], answer: "a Roman senator wearing a wristwatch in a painting", hint: "Which object does not belong to its era?", why: "Wristwatches did not exist in ancient Rome, so the watch is out of its time." },
        { q: "Which word means 'having matching halves'?", options: ["symmetrical", "synchronous", "thermal", "hydraulic"], answer: "symmetrical", hint: "Together + measure.", why: "Sym (together) + metr (measure): the halves measure the same." },
      ],
      extend: "Investigate symmetry: fold paper and cut out 3 shapes with one line of symmetry and 1 with two lines. Then find 5 capital letters of the alphabet that are symmetrical (A, H, M...). Label each fold line 'axis of symmetry'.",
      offline: "With a grown-up, read an outdoor thermometer in the morning, at noon and in the evening; record the readings in chronological order. Explain it: describe how therm, meter and chron helped you name what you did.",
    },

        { say: "Pronunciation review: vowels a ah, e ay, i ee, o oh, u oo; c before e or i is ch; gn is ny; ae is ay.", show: { type: "big", text: "decem = DEH-chem\ncaelum = CHAY-loom\nmagnus = MAH-nyoos" } },

        { say: "This week in mathematics you compare numbers, so we study the Latin roots of comparison: <b>magn</b> great, <b>maxim</b> greatest, <b>minim/minu</b> least or small, <b>equ</b> equal, <b>multi</b> many, and <b>anim</b> mind or spirit.", show: { type: "table", rows: [["Root", "Meaning", "Example"], ["magn", "great", "magnify"], ["maxim", "greatest", "maximum"], ["minim / minu", "least, small", "minimum, diminish"], ["equ (aequus)", "equal", "equation"], ["multi", "many", "multiply"], ["anim", "mind, spirit, life", "animate"]] } },
        { say: "These are the Latin adjectives behind the roots. Notice that the comparisons climb in steps.", show: { type: "table", rows: [["Latin", "Say it", "Meaning"], ["magnus", "MAH-nyoos", "great, big"], ["maximus", "MAHK-see-moos", "greatest"], ["parvus", "PAHR-voos", "small"], ["minimus", "MEE-nee-moos", "smallest"], ["aequus", "AY-kwoos", "equal, level"]] } },
        { say: "Latin <b>aequus</b> gives English 'equal'. An <b>equation</b> states that two quantities are equal; the <b>equator</b> divides the Earth into two equal halves.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><polygon points='300,250 270,300 330,300' fill='#555'/><line x1='300' y1='250' x2='300' y2='120' stroke='#555' stroke-width='8'/><line x1='120' y1='120' x2='480' y2='120' stroke='#555' stroke-width='8'/><rect x='70' y='60' width='120' height='60' rx='8' fill='#d6f0ec' stroke='#0f766e' stroke-width='4'/><text x='130' y='102' font-size='32' font-weight='800' text-anchor='middle' fill='#0f4c45'>8 + 5</text><rect x='410' y='60' width='120' height='60' rx='8' fill='#fde7c8' stroke='#b45309' stroke-width='4'/><text x='470' y='102' font-size='32' font-weight='800' text-anchor='middle' fill='#7c2d12'>13</text><text x='300' y='95' font-size='44' font-weight='900' text-anchor='middle' fill='#222'>=</text><text x='300' y='205' font-size='28' font-weight='800' text-anchor='middle' fill='#222'>aequus = equal, level</text></svg>" } },
        { say: "<b>Anim</b> means mind or spirit. A <b>magnanimous</b> person is 'great-spirited': generous, especially toward a rival. An <b>unanimous</b> vote is 'one-minded': everyone agrees.", show: { type: "list", items: ["magnanimous = great + spirit: generous, forgiving", "unanimous = one + mind: in complete agreement", "animated = full of life and spirit", "magnitude = greatness, size", "diminish = make smaller", "multitude = a great number", "equinox = equal night (nox = night)"] } },
        { say: "Your first Latin sentence uses <b>est</b>, meaning 'is'. Latin often places the verb last.", show: { type: "big", text: "Sol magnus est.\nThe sun is great.\nLuna parva est.\nThe moon is small." } },
        { say: "False friend: <b>magnet</b> does not come from magnus. It comes from Magnesia, a region of Greece where lodestone, a naturally magnetic rock, was found. Always confirm a derivation before trusting it.", show: { type: "big", text: "magnet ✗ magnus\nMagnesia ✔" } },
      ],
      practice: [
        { q: "What does the root 'magn' mean?", options: ["great", "small", "equal", "many"], answer: "great", hint: "A magnifying glass makes objects look...", why: "Magn comes from magnus, great." },
        { q: "Type the maximum of these numbers: 4,707; 4,770; 4,077; 7,044.", type: "number", answer: 7044, hint: "Compare the thousands digit first.", why: "7,044 has 7 thousands, more than any other: it is the maximum." },
        { q: "Type the minimum of these numbers: 3,009; 3,090; 903; 3,900.", type: "number", answer: 903, hint: "Which has the fewest digits?", why: "903 has only three digits, so it is least." },
        { q: "A magnanimous winner...", options: ["is generous to the person who lost", "boasts loudly", "refuses to play again", "cheats"], answer: "is generous to the person who lost", hint: "Magn (great) + anim (spirit).", why: "A great-spirited person is generous and forgiving, especially to a defeated rival." },
        { q: "The committee's vote was unanimous. This means...", options: ["every member agreed", "most members agreed", "no one voted", "the vote was secret"], answer: "every member agreed", hint: "Un (one) + anim (mind).", why: "All voters were of one mind." },
        { q: "To 'diminish' something is to...", options: ["make it smaller", "make it equal", "make it greater", "multiply it"], answer: "make it smaller", hint: "Minu means small.", why: "Diminish: to reduce or make less." },
        { q: "Which word is NOT derived from Latin magnus?", options: ["magnet", "magnify", "magnitude", "magnificent"], answer: "magnet", hint: "Recall the Greek region of lodestone.", why: "Magnet comes from Magnesia; the others from magnus." },
        { q: "Order these Latin words from least to greatest.", type: "order", items: ["maximus", "parvus", "magnus", "minimus"], answer: ["minimus", "parvus", "magnus", "maximus"], hint: "Smallest, small, great, greatest.", why: "minimus < parvus < magnus < maximus." },
        { q: "An equilateral triangle (lateral = side) has a perimeter of 27 cm. How long is each side, in cm?", type: "number", answer: 9, hint: "Equal sides: how many, and what must each be?", why: "Three equal sides: 27 ÷ 3 = 9 cm." },
        { q: "Translate: 'Sol magnus est.'", options: ["The sun is great.", "The sun is small.", "The moon is great.", "The star is great."], answer: "The sun is great.", hint: "Sol = sun; est = is.", why: "Sol (the sun) magnus (great) est (is)." },
        { q: "Which statement is a true equation?", options: ["7 × 8 = 56", "7 × 8 = 54", "7 × 8 > 56", "7 × 8 < 56"], answer: "7 × 8 = 56", hint: "An equation asserts equality. Which one is actually equal?", why: "7 × 8 is exactly 56." },
        { q: "An animated conversation is...", options: ["lively", "silent", "angry", "short"], answer: "lively", hint: "Anim = spirit, life.", why: "Full of spirit: lively." },
        { q: "The equator divides the Earth into how many equal parts?", type: "number", answer: 2, hint: "Northern and...", why: "Two hemispheres: northern and southern." },
      ],
      challenge: [
        { q: "Words in context: 'The magnitude of the earthquake surprised scientists; it was the strongest recorded in fifty years.' Magnitude means...", options: ["size or strength", "location", "date", "sound"], answer: "size or strength", hint: "Magn is great. The sentence says 'strongest'.", why: "Magnitude means greatness: size or strength." },
        { q: "Analogy — maximum : minimum :: magnanimous : ___", options: ["petty", "generous", "unanimous", "enormous"], answer: "petty", hint: "The first pair are opposites. What is the opposite of great-spirited?", why: "Magnanimous (generous) and petty (small-minded) are opposites." },
        { q: "Equinox means 'equal night'. On an equinox, day and night are each about how many hours long?", type: "number", answer: 12, hint: "A full day has 24 hours.", why: "24 ÷ 2 = 12 hours each, around March 20 and September 22." },
        { q: "Words in context: 'Rather than gloat, the champion praised her opponent's courage — a magnanimous gesture.' Which phrase gives the strongest clue?", options: ["Rather than gloat", "the champion", "her opponent", "a gesture"], answer: "Rather than gloat", hint: "Which phrase shows what she chose NOT to do?", why: "Refusing to gloat and praising a rival shows a great, generous spirit." },
      ],
      extend: "Measure the magnitude of things at home: find the maximum and minimum of five measurements (heights of family members, or lengths of five spoons). Write them in a table and compute the range (maximum − minimum).",
      offline: "With a grown-up, use a magnifying glass (or a clear glass of water) to magnify a leaf, a coin and your fingerprint. Explain it: say in 2–4 sentences why 'magnanimous' means generous, using both of its roots.",
    },
    // ---------- Lesson 6 ----------
    {
      title: "Latin begins: one to five", icon: "🖐️",
      learn: [
        { say: "Latin was the language of ancient Rome, whose empire surrounded the Mediterranean Sea. Latin developed into Italian, Spanish, French, Portuguese and Romanian, the <b>Romance</b> languages, and it supplied English with a vast share of its vocabulary.", show: { type: "list", items: ["Latin → Italian, Spanish, French, Portuguese, Romanian", "Latin was the language of science, law and the Western church for over 1,000 years", "English took Latin words directly and through French after 1066"] } },
        { say: "Count in Latin: unus, duo, tres, quattuor, quinque. Romans wrote I, II, III, IV, V.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><line x1='40' y1='150' x2='560' y2='150' stroke='#333' stroke-width='4'/><g text-anchor='middle'><g font-size='34' font-weight='900' fill='#0f766e'><text x='60' y='130'>I</text><text x='180' y='130'>II</text><text x='300' y='130'>III</text><text x='420' y='130'>IV</text><text x='540' y='130'>V</text></g><g font-size='24' font-weight='800' fill='#222'><text x='60' y='190'>unus</text><text x='180' y='190'>duo</text><text x='300' y='190'>tres</text><text x='420' y='190'>quattuor</text><text x='540' y='190'>quinque</text></g><g font-size='18' fill='#555'><text x='60' y='222'>OO-noos</text><text x='180' y='222'>DOO-oh</text><text x='300' y='222'>trays</text><text x='420' y='222'>KWAHT-too-ohr</text><text x='540' y='222'>KWEEN-kweh</text></g><g font-size='22' fill='#b45309' font-weight='800'><text x='60' y='270'>1</text><text x='180' y='270'>2</text><text x='300' y='270'>3</text><text x='420' y='270'>4</text><text x='540' y='270'>5</text></g></g></svg>" } },
        { say: "Number roots usually come in Latin and Greek pairs.", show: { type: "table", rows: [["#", "Latin root", "Greek root"], ["1", "uni", "mono"], ["2", "bi, du", "di"], ["3", "tri", "tri"], ["4", "quadr, quart", "tetra"], ["5", "quint", "penta"]] } },
        { say: "Now the roots appear everywhere, from simple words to sophisticated ones.", show: { type: "list", items: ["unicorn, uniform, unanimous (of one mind), unison", "monologue (one speaker), monotonous (one tone: dull)", "biped, bilingual, duet, duplicate (make a double)", "trilogy (three connected books), tripod, trident", "quadrilateral, quadruped, quadrennial (every 4 years)", "tetrahedron (4 faces), pentagon, quintet"] } },
        { say: "Roman numerals: a smaller numeral written BEFORE a larger one is subtracted; written AFTER, it is added.", show: { type: "big", text: "IV = 5 − 1 = 4\nVI = 5 + 1 = 6" } },
        { say: "Two warnings. <b>Bible</b> does not contain bi; it is from Greek biblia, books. But <b>cookie</b> really is 'twice-cooked', from bis coctus.", show: { type: "big", text: "Bible ✗ bi\nbiscuit ✔ bis coctus" } },
      ],
      practice: [
        { q: "What is 'tres' (trays)?", options: ["3", "2", "4", "5"], answer: "3", hint: "Compare tricycle.", why: "Tres = 3." },
        { q: "Put the Latin numbers in order from 1 to 5.", type: "order", items: ["tres", "unus", "quinque", "duo", "quattuor"], answer: ["unus", "duo", "tres", "quattuor", "quinque"], hint: "Uni-, du-, tri-, quadr-, quint-.", why: "unus, duo, tres, quattuor, quinque." },
        { q: "What number is the Roman numeral IV?", type: "number", answer: 4, hint: "Is the I before or after the V?", why: "Before: subtract. 5 − 1 = 4." },
        { q: "What number is the Roman numeral XIV? (X = 10)", type: "number", answer: 14, hint: "Read X, then IV.", why: "10 + 4 = 14." },
        { q: "A tetrahedron is a solid with how many faces?", type: "number", answer: 4, hint: "Tetra is Greek for...", why: "Tetra (four) + hedron (face, seat): 4 triangular faces." },
        { q: "Which word does NOT contain a root meaning two?", options: ["Bible", "bicycle", "duet", "duplicate"], answer: "Bible", hint: "Recall the Greek for books.", why: "Bible is from biblia, books." },
        { q: "A 'trilogy' is...", options: ["a set of three related works", "a three-sided shape", "a three-legged stand", "a group of three singers"], answer: "a set of three related works", hint: "Tri + logy (word, account).", why: "Three connected books, plays or films." },
        { q: "A quadrennial election happens every how many years?", type: "number", answer: 4, hint: "Quadr + enn (year).", why: "Quadr (four) + ennial (years): every 4 years." },
        { q: "A monotonous lecture is...", options: ["dull, all in one tone", "exciting", "very short", "spoken by two people"], answer: "dull, all in one tone", hint: "Mono + tone.", why: "One unchanging tone: tedious." },
        { q: "To 'duplicate' a key is to...", options: ["make a copy", "break it", "lose it", "make it smaller"], answer: "make a copy", hint: "Du = two.", why: "To make it double: a second identical one." },
        { q: "What is 'duo' + 'tres' in Latin?", options: ["quinque", "quattuor", "unus", "tres"], answer: "quinque", hint: "2 + 3 = ?", why: "5 = quinque." },
        { q: "The choir sang in unison. This means...", options: ["all on the same notes together", "each singer separately", "in two parts", "very softly"], answer: "all on the same notes together", hint: "Uni + son (sound).", why: "One sound: everyone sings the same melody." },
        { q: "How many feet do 3 bipeds and 2 quadrupeds have altogether?", type: "number", answer: 14, hint: "Bi = 2 feet, quadr = 4 feet.", why: "3 × 2 + 2 × 4 = 6 + 8 = 14." },
      ],
      challenge: [
        { q: "A pentathlon has 5 events and a triathlon 3. How many events are in a heptathlon if hept is Greek for 7?", type: "number", answer: 7, hint: "Translate the number root.", why: "Hept = 7 events." },
        { q: "Words in context: 'The bilingual guide explained the cathedral first in English and then in Spanish.' Bilingual (lingua = tongue, language) means...", options: ["speaking two languages", "speaking loudly", "having two tongues", "speaking slowly"], answer: "speaking two languages", hint: "What did the guide demonstrate?", why: "Bi (two) + lingua (language)." },
        { q: "Analogy — unanimous : one :: bipartisan : ___ (partisan = of a party)", options: ["two", "three", "many", "none"], answer: "two", hint: "Translate the number root in bipartisan.", why: "Unanimous involves one mind; bipartisan involves two parties." },
        { q: "Write MCMXLIV as a number (M = 1000, C = 100, X = 10, L = 50, V = 5, I = 1).", type: "number", answer: 1944, hint: "Split into M, CM, XL, IV.", why: "M = 1000, CM = 900, XL = 40, IV = 4: 1,944." },
      ],
      extend: "Find Roman numerals in the world: clocks, book chapters, building cornerstones, film credits. Photograph or copy five and translate each. Then write your birth year in Roman numerals.",
      offline: "Count to five in Latin while doing five jumps, then search the house for uni-, bi-, tri-, quad- and pent- objects. Explain it: tell a grown-up why IV is 4 but VI is 6.",
    },
    // ---------- Lesson 7 ----------
    {
      title: "Gratias: thanks and giving", icon: "🙏",
      learn: [
        { say: "This is Thanksgiving week. Latin <b>gratia</b> (GRAHT-see-ah) means thanks, favor and grace; Romans said <b>Gratias!</b> (GRAHT-see-ahs) for 'Thanks!'.", show: { type: "big", text: "Gratias!\nGRAHT-see-ahs = Thanks!" } },
        { say: "Two phrases worth memorizing: <b>Gratias tibi ago</b>, 'I give thanks to you', and <b>Deo gratias</b>, 'Thanks be to God'.", show: { type: "table", rows: [["Latin", "Say it", "Meaning"], ["Gratias tibi ago", "GRAHT-see-ahs TEE-bee AH-goh", "I give thanks to you"], ["Deo gratias", "DAY-oh GRAHT-see-ahs", "Thanks be to God"]] } },
        { say: "The root <b>grat/grac</b> means thanks or favor.", show: { type: "list", items: ["gratitude = thankfulness; ingratitude = its absence", "gracious = kind and courteous", "congratulate = rejoice with someone (con = with)", "gratis = free of charge", "gratuitous = given freely; also, unnecessary ('gratuitous rudeness')"] } },
        { say: "Three more giving roots: <b>don/donat</b> give (donum, gift), <b>carit/char</b> dear, love (caritas, carus), and <b>fest</b> feast (festum).", show: { type: "table", rows: [["Root", "Meaning", "Words"], ["don, donat", "give, gift", "donate, donor, condone, pardon"], ["carit, char", "love, dear", "charity, cherish"], ["fest", "feast, festival", "festival, festive, festoon"]] } },
        { say: "<b>Condone</b> means to forgive or overlook a wrong — to 'give it away'. <b>Pardon</b> means to forgive completely (per + donare). Both are giving words.", show: { type: "big", text: "pardon = per + donare\nto give thoroughly" } },
        { say: "False friend: to <b>grate</b> cheese comes from an old Germanic word for scraping, not from gratia.", show: { type: "big", text: "grate (cheese) ✗\ngrateful ✔" } },
      ],
      practice: [
        { q: "What does 'Deo gratias' mean?", options: ["Thanks be to God", "God is great", "Hello, God", "Give to God"], answer: "Thanks be to God", hint: "Deo = to God.", why: "Deo (to God) gratias (thanks)." },
        { q: "Put the words in the order of the phrase you learned for 'I give thanks to you'.", type: "order", items: ["ago", "Gratias", "tibi"], answer: ["Gratias", "tibi", "ago"], hint: "Thanks — to you — I give.", why: "Gratias tibi ago; the verb ago comes last. (Because Latin endings carry the meaning, Tibi gratias ago is also correct.)" },
        { q: "Gratitude means...", options: ["thankfulness", "generosity", "festivity", "forgiveness"], answer: "thankfulness", hint: "Grat = thanks.", why: "From gratia, thanks." },
        { q: "A donor is someone who...", options: ["gives", "receives", "forgives", "celebrates"], answer: "gives", hint: "Donum = gift.", why: "Don (give) + or (person)." },
        { q: "Which word does NOT come from gratia?", options: ["grate (cheese)", "grateful", "gracious", "congratulate"], answer: "grate (cheese)", hint: "Which concerns scraping?", why: "Grating cheese is from a Germanic scraping word." },
        { q: "Charity comes from Latin caritas. Its root meaning is...", options: ["love", "money", "thanks", "food"], answer: "love", hint: "Carus means dear.", why: "Caritas: love, dearness. Charity is love shown by giving." },
        { q: "To 'cherish' a gift is to...", options: ["hold it dear", "return it", "sell it", "forget it"], answer: "hold it dear", hint: "Char/cher: dear.", why: "From French cher, from Latin carus, dear." },
        { q: "A festive table is...", options: ["decorated for a celebration", "empty", "broken", "small"], answer: "decorated for a celebration", hint: "Fest = feast.", why: "Festive: suited to a feast." },
        { q: "To condone cheating means to...", options: ["overlook or accept it", "punish it", "report it", "prevent it"], answer: "overlook or accept it", hint: "Con + donare: to give it away, let it pass.", why: "Condoning a wrong means treating it as acceptable." },
        { q: "A museum ticket that is 'gratis' costs...", options: ["nothing", "a little", "double", "a donation"], answer: "nothing", hint: "Given as a favor.", why: "Gratis means free." },
        { q: "How many syllables are in 'Gratias tibi ago' (GRAHT-see-ahs TEE-bee AH-goh)?", type: "number", answer: 7, hint: "Count each word: 3 + 2 + 2.", why: "3 + 2 + 2 = 7 syllables." },
        { q: "A family donates 4 boxes of food, each with 12 cans. How many cans are donated?", type: "number", answer: 48, hint: "Equal groups: multiply.", why: "4 × 12 = 48 cans." },
        { q: "Which sentence uses 'gratuitous' correctly?", options: ["The film's gratuitous violence added nothing to the story.", "She was gratuitous for the gift.", "The gratuitous cheese was grated.", "He gratuitous the prize."], answer: "The film's gratuitous violence added nothing to the story.", hint: "Gratuitous describes something given freely — and often unnecessarily.", why: "Gratuitous means unnecessary, uncalled-for; 'grateful' would fit the second sentence." },
      ],
      challenge: [
        { q: "Words in context: 'Although the guest had been rude, the host received him graciously and offered him the best seat.' Graciously means...", options: ["with kindness and courtesy", "with anger", "in a hurry", "with suspicion"], answer: "with kindness and courtesy", hint: "Contrast: 'although... rude'. How did the host respond?", why: "Gracious behavior answers rudeness with kindness." },
        { q: "Analogy — grateful : ungrateful :: generous : ___", options: ["stingy", "gracious", "festive", "thankful"], answer: "stingy", hint: "Find the opposite.", why: "Each pair is a quality and its opposite." },
        { q: "The king 'pardoned' the prisoner. Using per (thoroughly) + donare (give), the best meaning is...", options: ["forgave him fully and released him from punishment", "gave him a gift", "sent him away", "made him a knight"], answer: "forgave him fully and released him from punishment", hint: "What does a ruler 'give away' in a pardon?", why: "A pardon gives up the right to punish entirely." },
      ],
      extend: "Read Psalm 100 in the World English Bible (a psalm of thanksgiving). Copy one verse in your best handwriting, and beneath it write 'Deo gratias'. Then list three words in the psalm related to thanks or joy.",
      offline: "Write five thank-you notes this week, each ending with 'Gratias tibi ago!'. Explain it: describe to a grown-up how gratitude, gracious and congratulate share one root, and how each word adds something different.",
    },
    // ---------- Lesson 8 ----------
    {
      title: "Review: feet and going", icon: "🦶",
      learn: [
        { say: "Latin <b>pes, pedis</b> (pays) means foot; its root is <b>ped</b>. Greek has <b>pod</b> or <b>pus</b>.", show: { type: "table", rows: [["Latin ped", "Greek pod / pus"], ["pedal, pedestrian", "tripod, podium"], ["biped, quadruped", "octopus (eight feet)"], ["centipede (100 feet)", "platypus (flat foot)"], ["impede, expedition", "arthropod (jointed foot)"]] } },
        { say: "Two elegant pairs: to <b>impede</b> is to hinder, as if the feet were shackled (in + ped); an <b>expedition</b> is a journey with the feet set free (ex + ped). <b>Expedite</b> means to speed something up.", show: { type: "big", text: "impede = feet caught\nexpedite = feet freed" } },
        { say: "False friend: a <b>pediatrician</b> is a children's doctor, from Greek pais, paidos, child. It has nothing to do with feet.", show: { type: "big", text: "pediatrician ✗ foot\npais = child ✔" } },
        { say: "Two roots of going: <b>ced/cess</b> means go or yield (cedere), and <b>migr</b> means move from place to place (migrare).", show: { type: "list", items: ["precede = go before; recede = go back", "exceed = go beyond; procession = a going forward", "intercede = go between (to plead for someone)", "migrate = move regularly from one region to another", "emigrate = move out of a country; immigrant = one who moves in"] } },
        { say: "Note the direction: you <b>emigrate from</b> a country (e = out) and <b>immigrate to</b> one (im = in). The same traveler is an emigrant to the land she leaves and an immigrant to the land she enters.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><rect x='20' y='80' width='210' height='150' rx='16' fill='#fde7c8' stroke='#b45309' stroke-width='4'/><rect x='370' y='80' width='210' height='150' rx='16' fill='#d6f0ec' stroke='#0f766e' stroke-width='4'/><text x='125' y='165' font-size='26' font-weight='800' text-anchor='middle' fill='#7c2d12'>Old land</text><text x='475' y='165' font-size='26' font-weight='800' text-anchor='middle' fill='#0f4c45'>New land</text><line x1='235' y1='155' x2='355' y2='155' stroke='#333' stroke-width='6'/><polygon points='365,155 345,143 345,167' fill='#333'/><text x='125' y='275' font-size='24' text-anchor='middle' fill='#7c2d12'>e-migrate (out of)</text><text x='475' y='275' font-size='24' text-anchor='middle' fill='#0f4c45'>im-migrate (into)</text><text x='300' y='50' font-size='26' font-weight='800' text-anchor='middle' fill='#222'>migr = move</text></svg>" } },
        { say: "Review your Latin so far: numbers one to five, great and small, thanks, and foot.", show: { type: "table", rows: [["Latin", "Meaning"], ["unus, duo, tres, quattuor, quinque", "1–5"], ["magnus / parvus", "great / small"], ["aequus", "equal"], ["gratias", "thanks"], ["donum", "gift"], ["pes", "foot"]] } },
      ],
      practice: [
        { q: "A pedestrian is a person who travels...", options: ["on foot", "by car", "by air", "by sea"], answer: "on foot", hint: "Ped = foot.", why: "Pedestrians walk." },
        { q: "Which word does NOT contain a foot root?", options: ["pediatrician", "pedal", "podium", "octopus"], answer: "pediatrician", hint: "One concerns children.", why: "Greek pais, child." },
        { q: "Deep mud impeded the hikers. Impeded means...", options: ["hindered", "helped", "carried", "warmed"], answer: "hindered", hint: "In + ped: feet caught.", why: "To impede is to obstruct or slow." },
        { q: "To 'expedite' an order is to...", options: ["speed it up", "cancel it", "delay it", "lose it"], answer: "speed it up", hint: "Ex + ped: feet freed.", why: "Freed feet move quickly: expedite means hasten." },
        { q: "To 'recede' means to...", options: ["go back", "go before", "go beyond", "go between"], answer: "go back", hint: "Re = back; cede = go.", why: "Floodwaters recede: they go back." },
        { q: "To 'exceed' the speed limit means to...", options: ["go beyond it", "stay under it", "reach it exactly", "ignore signs"], answer: "go beyond it", hint: "Ex = out, beyond.", why: "Ex + cedere: to go beyond." },
        { q: "Birds that fly south each autumn...", options: ["migrate", "emigrate", "recede", "impede"], answer: "migrate", hint: "Regular movement between regions.", why: "Migration is regular seasonal movement." },
        { q: "Your great-grandfather left Italy to live in America. To Italians, he was an...", options: ["emigrant", "immigrant", "pedestrian", "expedition"], answer: "emigrant", hint: "From Italy's point of view, he moved OUT.", why: "E (out) + migrant: he left Italy." },
        { q: "Three quadrupeds, two bipeds and one tripod stand in a room. How many feet touch the floor?", type: "number", answer: 19, hint: "4, 2 and 3 feet each.", why: "3 × 4 + 2 × 2 + 1 × 3 = 12 + 4 + 3 = 19." },
        { q: "A 'procession' is...", options: ["a line of people moving forward", "a group standing still", "a backward march", "a meeting"], answer: "a line of people moving forward", hint: "Pro = forward; cess = go.", why: "Pro + cess: a going forward, as in a parade." },
        { q: "Order these words from fewest feet to most.", type: "order", items: ["octopus", "biped", "tripod", "quadruped"], answer: ["biped", "tripod", "quadruped", "octopus"], hint: "Turn each root into a number.", why: "2, 3, 4, 8." },
        { q: "'Platypus' means flat foot. Which part means foot?", options: ["pus", "platy", "plat", "typ"], answer: "pus", hint: "Compare octopus.", why: "Platy (flat) + pus (foot)." },
        { q: "To intercede means to...", options: ["go between two parties to plead for one", "go first", "go beyond the limit", "leave forever"], answer: "go between two parties to plead for one", hint: "Inter = between.", why: "Inter + cedere: to step in between on someone's behalf." },
      ],
      challenge: [
        { q: "Centipedes always have an odd number of pairs of legs. Could a centipede have exactly 100 legs?", options: ["No: 100 legs is 50 pairs, and 50 is even", "Yes: centi means 100", "Only when young", "Yes, all do"], answer: "No: 100 legs is 50 pairs, and 50 is even", hint: "How many pairs is 100 legs? Is that number odd?", why: "100 ÷ 2 = 50 pairs, which is even; so no centipede has exactly 100 legs." },
        { q: "Analogy — precede : before :: recede : ___", options: ["back", "beyond", "between", "forward"], answer: "back", hint: "What does each prefix contribute?", why: "Pre = before; re = back." },
        { q: "Words in context: 'Lack of funding impeded the expedition, which finally departed a year late.' Which pairing is correct?", options: ["impeded = hindered; expedition = journey", "impeded = hastened; expedition = delay", "impeded = funded; expedition = map", "impeded = canceled; expedition = parade"], answer: "impeded = hindered; expedition = journey", hint: "The expedition left late. Why?", why: "Missing money hindered (impeded) the journey (expedition)." },
        { q: "Unprecedented means 'never having gone before'. Which sentence uses it correctly?", options: ["The flood reached an unprecedented height, higher than any on record.", "The bus was unprecedented, as it came every day.", "She unprecedented the race.", "The ordinary rain was unprecedented."], answer: "The flood reached an unprecedented height, higher than any on record.", hint: "Un + pre + ced: nothing like it has gone before.", why: "Unprecedented means without earlier example: never happened before." },
      ],
      extend: "Research one animal migration (Arctic tern, monarch butterfly, or humpback whale). Find the distance traveled each year and mark the route on a printed map. Write 5 sentences using migrate, expedition and recede.",
      offline: "Take a pedestrian expedition around your neighborhood with a grown-up. Count bipeds and quadrupeds and total their feet. Explain it: tell the grown-up the difference between emigrate and immigrate, and why the same person can be both.",
    },

    // ---------- Lesson 9 ----------
    {
      title: "Numbers six to ten", icon: "🔟",
      learn: [
        { say: "Continue counting in Latin: sex, septem, octo, novem, decem. Romans wrote VI, VII, VIII, IX, X.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><line x1='40' y1='150' x2='560' y2='150' stroke='#333' stroke-width='4'/><g text-anchor='middle'><g font-size='34' font-weight='900' fill='#0f766e'><text x='60' y='130'>VI</text><text x='180' y='130'>VII</text><text x='300' y='130'>VIII</text><text x='420' y='130'>IX</text><text x='540' y='130'>X</text></g><g font-size='26' font-weight='800' fill='#222'><text x='60' y='190'>sex</text><text x='180' y='190'>septem</text><text x='300' y='190'>octo</text><text x='420' y='190'>novem</text><text x='540' y='190'>decem</text></g><g font-size='19' fill='#555'><text x='60' y='222'>sehks</text><text x='180' y='222'>SEHP-tehm</text><text x='300' y='222'>OHK-toh</text><text x='420' y='222'>NOH-vehm</text><text x='540' y='222'>DEH-chem</text></g><g font-size='24' fill='#b45309' font-weight='800'><text x='60' y='270'>6</text><text x='180' y='270'>7</text><text x='300' y='270'>8</text><text x='420' y='270'>9</text><text x='540' y='270'>10</text></g></g></svg>" } },
        { say: "A puzzle: why is October, 'the eighth', our tenth month? According to Roman writers, the earliest Roman calendar (traditionally credited to Romulus) began in <b>March</b> and had ten months, so September was the seventh, October the eighth, November the ninth and December the tenth.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><g font-size='22' font-weight='800' text-anchor='middle'><g fill='#eef2f7' stroke='#94a3b8' stroke-width='3'><rect x='10' y='40' width='108' height='90' rx='10'/><rect x='128' y='40' width='108' height='90' rx='10'/><rect x='246' y='40' width='108' height='90' rx='10'/><rect x='364' y='40' width='108' height='90' rx='10'/><rect x='482' y='40' width='108' height='90' rx='10'/></g><g fill='#d6f0ec' stroke='#0f766e' stroke-width='4'><rect x='10' y='170' width='108' height='90' rx='10'/><rect x='128' y='170' width='108' height='90' rx='10'/><rect x='246' y='170' width='108' height='90' rx='10'/><rect x='364' y='170' width='108' height='90' rx='10'/><rect x='482' y='170' width='108' height='90' rx='10'/></g><g fill='#333'><text x='64' y='80'>March</text><text x='182' y='80'>April</text><text x='300' y='80'>May</text><text x='418' y='80'>June</text><text x='536' y='80'>July</text><text x='64' y='210'>Aug</text><text x='182' y='210'>Sept</text><text x='300' y='210'>Oct</text><text x='418' y='210'>Nov</text><text x='536' y='210'>Dec</text></g><g fill='#b45309' font-size='30'><text x='64' y='118'>1</text><text x='182' y='118'>2</text><text x='300' y='118'>3</text><text x='418' y='118'>4</text><text x='536' y='118'>5</text><text x='64' y='248'>6</text><text x='182' y='248'>7</text><text x='300' y='248'>8</text><text x='418' y='248'>9</text><text x='536' y='248'>10</text></g></g><text x='300' y='300' font-size='20' text-anchor='middle' fill='#555'>The earliest Roman year: ten months, beginning in March</text></svg>" } },
        { say: "Each number has a Latin root and often a Greek one.", show: { type: "table", rows: [["#", "Latin", "Greek", "Words"], ["6", "sex", "hex", "sextet, semester, hexagon"], ["7", "sept", "hept", "September, heptagon"], ["8", "oct", "oct", "octave, octagon, octogenarian"], ["9", "nov, non", "—", "November, nonagon"], ["10", "dec", "dec", "decimal, decade, decathlon"]] } },
        { say: "Larger numbers: <b>centum</b> (CHEN-toom) is 100, written C; <b>mille</b> (MEEL-lay) is 1,000, written M.", show: { type: "list", items: ["century = 100 years; centennial = a 100th anniversary", "sesquicentennial = 150th anniversary (sesqui = one and a half)", "percent = per hundred; centimeter = a hundredth of a meter", "millennium = 1,000 years (annus = year)", "mile = mille passus, 'a thousand paces' (a Roman pace was two steps)", "octogenarian = a person in their eighties"] } },
        { say: "Hidden numbers: a <b>dime</b> is a tenth of a dollar, from decima, a tenth. A <b>semester</b> is six months, from sex + mensis, month. A <b>siesta</b> is a midday rest, from Latin sexta hora, the sixth hour after sunrise.", show: { type: "big", text: "dime = a tenth\nsemester = six months\nsiesta = the sixth hour" } },
        { say: "False friend: a grain <b>mill</b> is not from mille. It comes from Latin molina, a grinding place.", show: { type: "big", text: "mill ✗ mille\nmolina ✔" } },
      ],
      practice: [
        { q: "Put the Latin numbers in order from 6 to 10.", type: "order", items: ["novem", "sex", "decem", "octo", "septem"], answer: ["sex", "septem", "octo", "novem", "decem"], hint: "Recall Sept-, Oct-, Nov-, Dec-.", why: "sex, septem, octo, novem, decem." },
        { q: "What number is IX?", type: "number", answer: 9, hint: "I before X.", why: "10 − 1 = 9." },
        { q: "What number is CXL? (C = 100, X = 10, L = 50)", type: "number", answer: 140, hint: "Read C, then XL.", why: "C = 100; XL = 50 − 10 = 40; total 140." },
        { q: "In the early ten-month Roman calendar described by Roman writers, which month number was December?", type: "number", answer: 10, hint: "Decem.", why: "The year began in March, so December was the tenth month." },
        { q: "How many years are in three centuries?", type: "number", answer: 300, hint: "One century is how many years?", why: "3 × 100 = 300." },
        { q: "A town founded in 1876 celebrated its sesquicentennial in which year?", type: "number", answer: 2026, hint: "Sesqui-centennial = 150 years.", why: "1876 + 150 = 2026." },
        { q: "An octogenarian is a person aged...", options: ["80 to 89", "8 to 9", "18", "800"], answer: "80 to 89", hint: "Octo = 8; genarian refers to tens of years.", why: "Octogenarians are in their eighties." },
        { q: "Which word does NOT come from mille?", options: ["mill (for grain)", "millennium", "millipede", "mile"], answer: "mill (for grain)", hint: "Which concerns grinding?", why: "Mill comes from molina." },
        { q: "What part of a dollar is a dime?", options: ["one tenth", "one hundredth", "one half", "one fifth"], answer: "one tenth", hint: "Decima.", why: "Ten dimes make a dollar." },
        { q: "A semester lasts about how many months, according to its roots?", type: "number", answer: 6, hint: "Sex + mensis.", why: "Six months." },
        { q: "What is 35 percent of 200?", type: "number", answer: 70, hint: "Percent means per hundred. How many hundreds are in 200?", why: "35 per hundred × 2 hundreds = 70." },
        { q: "An octave spans eight notes, from one C to the next C. Its name means...", options: ["eighth", "ninth", "tenth", "hundredth"], answer: "eighth", hint: "Oct-.", why: "Octava, the eighth: the eighth note repeats the first letter name." },
        { q: "A heptagon has how many sides?", type: "number", answer: 7, hint: "Hept is the Greek root for...", why: "Hept = 7." },
        { q: "Why does 'siesta' mean a midday rest?", options: ["it comes from sexta hora, the sixth hour after sunrise, around noon", "it means six people", "it is a Greek word for sleep", "it means a short walk"], answer: "it comes from sexta hora, the sixth hour after sunrise, around noon", hint: "Romans counted the hours of daylight from sunrise.", why: "Six hours after a 6 a.m. sunrise is noon: the sexta hora." },
      ],
      challenge: [
        { q: "July was once called Quintilis (fifth) and August Sextilis (sixth). If the year began in March, which month number was Sextilis?", type: "number", answer: 6, hint: "Count from March as 1.", why: "March 1, April 2, May 3, June 4, Quintilis 5, Sextilis 6. Later they were renamed for Julius Caesar and Augustus." },
        { q: "The leggiest millipede known (described by scientists in 2021) has 1,306 legs. How many more than 1,000 is that?", type: "number", answer: 306, hint: "Subtract.", why: "1,306 − 1,000 = 306." },
        { q: "Write MMXXVI as a number.", type: "number", answer: 2026, hint: "MM, XX, VI.", why: "2,000 + 20 + 6 = 2,026 — this year." },
        { q: "Analogy — decade : ten :: millennium : ___", options: ["one thousand", "one hundred", "one million", "fifty"], answer: "one thousand", hint: "Count the years.", why: "A decade is 10 years; a millennium is 1,000 years." },
      ],
      extend: "Investigate the Roman calendar reform of Julius Caesar (the Julian calendar, 46 BC) and of Pope Gregory XIII (1582). Write a paragraph explaining why we have leap years, and calculate how many leap years occur in a century under the Julian rule (every 4th year).",
      offline: "Make a strip calendar of the old ten-month Roman year starting in March, and label September to December with their Latin numbers. Explain it: tell a grown-up why the names of our last four months no longer match their positions.",
    },
    // ---------- Lesson 10 ----------
    {
      title: "Salve et vale", icon: "👋",
      learn: [
        { say: "Roman greetings change with the number of people addressed: <b>Salve</b> to one, <b>Salvete</b> to several; <b>Vale</b> to one, <b>Valete</b> to several.", show: { type: "table", rows: [["Latin", "Say it", "Meaning"], ["Salve!", "SAHL-vay", "Hello! (to one)"], ["Salvete!", "sahl-VAY-tay", "Hello! (to many)"], ["Vale!", "VAH-lay", "Goodbye! (to one)"], ["Valete!", "vah-LAY-tay", "Goodbye! (to many)"]] } },
        { say: "Ask a name: <b>Quod nomen tibi est?</b> 'What is your name?' Reply: <b>Mihi nomen est</b> … , 'My name is …'. Literally: 'To me the name is …'.", show: { type: "big", text: "Quod nomen tibi est?\nkwohd NOH-men TEE-bee ehst\nMihi nomen est ___.\nMEE-kee NOH-men ehst" } },
        { say: "Salve means 'be well'; vale means 'be strong'. Both seeded English roots.", show: { type: "list", items: ["salv / salu (health, safety): salute, salutation, salvage, salubrious (health-giving)", "val (be strong, be worth): valid, value, valiant, valor, evaluate, prevail", "valediction = a farewell speech (vale + dicere, to say)", "valedictorian = the graduate who gives it"] } },
        { say: "<b>Nomen</b> means name, <b>bene</b> well, <b>male</b> badly, and <b>dict</b> say.", show: { type: "table", rows: [["Root", "Meaning", "Words"], ["nomen, nomin", "name", "noun, nominate, nominal, ignominy"], ["bene", "well", "benefit, benevolent, benign, benediction"], ["mal", "badly, evil", "malice, malevolent, malign, malady"], ["dict", "say", "diction, predict, valediction"]] } },
        { say: "Matched pairs reward attention. <b>Benevolent</b> means wishing well; <b>malevolent</b>, wishing harm (volo = I wish). <b>Benign</b> means gentle and harmless; <b>malignant</b> means harmful.", show: { type: "big", text: "bene + volent = well-wishing\nmale + volent = ill-wishing" } },
        { say: "<b>Ignominy</b> is public disgrace: the loss of one's good name (in = not + nomen). <b>Malaria</b> is from Italian mala aria, 'bad air', once wrongly blamed for the disease that mosquitoes carry.", show: { type: "emoji", text: "🦟" , caption: "mala aria = bad air" } },
        { say: "False friends: a <b>valley</b> comes from vallis; the <b>salve</b> rubbed on a wound is an Old English word. Neither belongs to these roots.", show: { type: "big", text: "valley ✗ vale\nsalve (ointment) ✗ salve" } },
      ],
      practice: [
        { q: "You enter a room with three friends. Which greeting is correct?", options: ["Salvete!", "Salve!", "Vale!", "Valete!"], answer: "Salvete!", hint: "Hello to more than one.", why: "Salvete addresses several people." },
        { q: "You leave your one teacher. What do you say?", options: ["Vale!", "Valete!", "Salve!", "Gratias!"], answer: "Vale!", hint: "Goodbye to one.", why: "Vale: singular farewell." },
        { q: "Order the words to say 'My name is Livia'.", type: "order", items: ["est", "Mihi", "Livia", "nomen"], answer: ["Mihi", "nomen", "est", "Livia"], hint: "To me — the name — is — Livia.", why: "Mihi nomen est Livia." },
        { q: "A benevolent ruler...", options: ["wishes good for the people", "wishes harm", "has no name", "rules briefly"], answer: "wishes good for the people", hint: "Bene + vol.", why: "Benevolent: well-wishing, kind." },
        { q: "Malevolent means...", options: ["wishing harm to others", "wishing good", "very healthy", "tired"], answer: "wishing harm to others", hint: "Mal + vol.", why: "Ill-wishing, spiteful." },
        { q: "The doctor said the lump was benign. This is...", options: ["good news: it is harmless", "bad news: it is harmful", "a joke", "a greeting"], answer: "good news: it is harmless", hint: "Bene = well.", why: "Benign means gentle, not dangerous." },
        { q: "A noun is a word that...", options: ["names a person, place, thing or idea", "shows action", "describes", "joins clauses"], answer: "names a person, place, thing or idea", hint: "From nomen.", why: "Nomen means name." },
        { q: "Which word does NOT come from valere (be strong)?", options: ["valley", "valid", "valiant", "prevail"], answer: "valley", hint: "Which is a landform?", why: "Valley comes from vallis." },
        { q: "Mountain air was once thought salubrious. Salubrious means...", options: ["health-giving", "dangerous", "cold", "thin"], answer: "health-giving", hint: "Salu = health.", why: "Salubrious: promoting health." },
        { q: "Caught cheating in the race, the runner left the field in ignominy. Ignominy means...", options: ["public disgrace", "great honor", "a new name", "secret joy"], answer: "public disgrace", hint: "In (not) + nomen (name): loss of good name.", why: "Ignominy: shame, dishonor." },
        { q: "A 'nominal' fee is...", options: ["very small, a fee in name only", "very large", "illegal", "doubled"], answer: "very small, a fee in name only", hint: "Nominal: existing in name rather than reality.", why: "A nominal fee is tiny, almost symbolic." },
        { q: "To 'prevail' means to...", options: ["win out, prove stronger", "say goodbye", "lose", "rename"], answer: "win out, prove stronger", hint: "Pre + valere.", why: "To be stronger: to win." },
        { q: "How many syllables does 'valedictorian' have (val-e-dic-to-ri-an)?", type: "number", answer: 6, hint: "Clap each part.", why: "val-e-dic-to-ri-an: 6." },
      ],
      challenge: [
        { q: "Analogy — benefactor : good :: malefactor : ___", options: ["evil", "health", "names", "strength"], answer: "evil", hint: "Bene vs mal.", why: "A benefactor does good; a malefactor does evil." },
        { q: "Words in context: 'Calling a whale a fish is a misnomer, because whales are mammals.' A misnomer is...", options: ["a wrong name", "a long name", "a secret name", "a scientific name"], answer: "a wrong name", hint: "Mis = wrongly.", why: "Mis + nomen: a misapplied name." },
        { q: "Words in context: 'Her benign smile reassured the nervous children; even the strict principal seemed less intimidating beside her.' Benign means...", options: ["gentle and kindly", "fierce", "puzzling", "false"], answer: "gentle and kindly", hint: "What effect did the smile have?", why: "A reassuring smile is gentle: benign." },
        { q: "Which pair are antonyms (opposites)?", options: ["benevolent / malevolent", "valid / valiant", "salute / salutation", "nominal / noun"], answer: "benevolent / malevolent", hint: "Look for bene and mal.", why: "Well-wishing vs ill-wishing." },
      ],
      extend: "Read the benediction in Numbers 6:24–26 in the World English Bible ('Yahweh bless you, and keep you...'). Explain in writing why the word 'benediction' fits it, using both roots.",
      offline: "Greet your family only in Latin today (Salve, Salvete, Vale, Valete) and teach one person 'Quod nomen tibi est?'. Explain it: tell a grown-up why benevolent and malevolent are opposites, root by root.",
    },
    // ---------- Lesson 11 ----------
    {
      title: "Family words and gender", icon: "👨‍👩‍👧",
      learn: [
        { say: "Latin family words: <b>mater</b> mother, <b>pater</b> father, <b>frater</b> brother, <b>soror</b> sister, <b>filius</b> son, <b>filia</b> daughter, <b>familia</b> household.", show: { type: "table", rows: [["Latin", "Say it", "Meaning"], ["mater", "MAH-tehr", "mother"], ["pater", "PAH-tehr", "father"], ["frater", "FRAH-tehr", "brother"], ["soror", "SOH-rohr", "sister"], ["filius / filia", "FEE-lee-oos / FEE-lee-ah", "son / daughter"]] } },
        { say: "Every Latin noun has a <b>gender</b>: masculine, feminine or neuter. Gender is partly about meaning and partly about the ending. Most nouns ending in <b>-a</b> are feminine; most ending in <b>-us</b> are masculine.", show: { type: "table", rows: [["Ending", "Gender", "Example"], ["-a", "usually feminine", "filia, familia"], ["-us", "usually masculine", "filius, amicus (friend)"], ["-um", "neuter", "donum (gift)"]] } },
        { say: "Plurals change the ending. First-declension <b>-a</b> becomes <b>-ae</b>; second-declension <b>-us</b> becomes <b>-i</b>.", show: { type: "table", rows: [["Singular", "Plural", "Meaning"], ["filia", "filiae (FEE-lee-ay)", "daughter / daughters"], ["filius", "filii (FEE-lee-ee)", "son / sons"], ["amica", "amicae", "female friend(s)"], ["amicus", "amici", "male friend(s)"]] } },
        { say: "Family roots fill English, often in formal vocabulary.", show: { type: "list", items: ["maternal, matriarch (a woman who heads a family), matrimony", "paternal, patron, patrimony (property inherited from a father)", "fraternal, fraternize (associate as brothers), friar", "sorority (a sisterhood)", "filial (owed by a son or daughter: filial duty), affiliate"] } },
        { say: "Two more roots: <b>sen</b> old (senex) and <b>juven</b> young (iuvenis). The Roman <b>senate</b> was literally a council of elders.", show: { type: "list", items: ["senior, senate, senescence (the process of growing old)", "juvenile, junior, rejuvenate (make young again)"] } },
        { say: "Here is a family drawn in Latin.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><g stroke='#555' stroke-width='4' fill='none'><line x1='190' y1='80' x2='410' y2='80'/><line x1='300' y1='80' x2='300' y2='160'/><line x1='120' y1='160' x2='480' y2='160'/><line x1='120' y1='160' x2='120' y2='200'/><line x1='300' y1='160' x2='300' y2='200'/><line x1='480' y1='160' x2='480' y2='200'/></g><g font-weight='800' text-anchor='middle'><rect x='80' y='45' width='150' height='70' rx='12' fill='#fde7c8' stroke='#b45309' stroke-width='3'/><text x='155' y='90' font-size='30' fill='#7c2d12'>pater</text><rect x='370' y='45' width='150' height='70' rx='12' fill='#fde7c8' stroke='#b45309' stroke-width='3'/><text x='445' y='90' font-size='30' fill='#7c2d12'>mater</text><rect x='40' y='200' width='160' height='70' rx='12' fill='#d6f0ec' stroke='#0f766e' stroke-width='3'/><text x='120' y='245' font-size='28' fill='#0f4c45'>filius</text><rect x='220' y='200' width='160' height='70' rx='12' fill='#d6f0ec' stroke='#0f766e' stroke-width='3'/><text x='300' y='245' font-size='28' fill='#0f4c45'>filia</text><rect x='400' y='200' width='160' height='70' rx='12' fill='#d6f0ec' stroke='#0f766e' stroke-width='3'/><text x='480' y='245' font-size='28' fill='#0f4c45'>filia</text></g><text x='300' y='305' font-size='20' text-anchor='middle' fill='#555'>one filius + two filiae: the son is frater; each girl is soror</text></svg>" } },
        { say: "<b>Pater Noster</b>, 'Our Father', are the opening words of the Lord's Prayer in Latin, prayed in that language for many centuries.", show: { type: "big", text: "Pater Noster\n= Our Father" } },
      ],
      practice: [

        { q: "What is the nominative plural of 'filia' (daughter)?", options: ["filiae", "filii", "filias", "filiai"], answer: "filiae", hint: "First declension: -a becomes...", why: "-a → -ae: filiae." },
        { q: "What is the nominative plural of 'amicus' (friend)?", options: ["amici", "amicae", "amicus", "amicos"], answer: "amici", hint: "Second declension: -us becomes...", why: "-us → -i: amici." },
        { q: "What gender is 'familia'?", options: ["feminine", "masculine", "neuter"], answer: "feminine", hint: "Look at the ending.", why: "Most -a nouns are feminine." },
        { q: "A matriarch is...", options: ["a woman who heads a family", "a man who heads a family", "a baby", "a sister"], answer: "a woman who heads a family", hint: "Matr + arch (ruler).", why: "Mater (mother) + Greek arch (ruler)." },
        { q: "His patrimony was a farm. Patrimony means...", options: ["property inherited from a father", "a fatherly hug", "a holiday", "a debt"], answer: "property inherited from a father", hint: "Patr = father.", why: "Patrimonium: the father's estate passed to children." },
        { q: "Filial duty is the duty owed by...", options: ["a son or daughter to parents", "parents to children", "a citizen to the state", "a teacher to students"], answer: "a son or daughter to parents", hint: "Fili = son, daughter.", why: "Filial: of a child toward its parents." },
        { q: "A family has 2 filiae and 3 filii. How many sorores does each son have?", type: "number", answer: 2, hint: "How many daughters are there?", why: "Each son has both daughters as sisters: 2." },
        { q: "In that same family, how many fratres does each daughter have?", type: "number", answer: 3, hint: "Count the sons.", why: "All 3 sons are her brothers." },
        { q: "Senescence is...", options: ["the process of growing old", "growing young", "being senior class president", "a council"], answer: "the process of growing old", hint: "Sen = old.", why: "From senescere, to grow old." },
        { q: "The spa promised to rejuvenate its guests. Rejuvenate means...", options: ["make young and fresh again", "make older", "make brotherly", "send home"], answer: "make young and fresh again", hint: "Re + juven.", why: "Re (again) + juven (young)." },
        { q: "Order these from youngest to oldest stage of life.", type: "order", items: ["senior", "infant", "juvenile"], answer: ["infant", "juvenile", "senior"], hint: "Juven = young; sen = old.", why: "Infant, juvenile, senior." },
        { q: "Translate: 'Filiae sunt.' (sunt = they are)", options: ["They are daughters.", "She is a daughter.", "They are sons.", "He is a son."], answer: "They are daughters.", hint: "Is filiae singular or plural?", why: "Filiae is plural; sunt means 'they are'." },

      challenge: [
        { q: "Analogy — maternal : mother :: fraternal : ___", options: ["brother", "sister", "father", "family"], answer: "brother", hint: "Frater.", why: "Fraternal: brotherly." },
        { q: "Words in context: 'The new pupils were shy at first, but by lunchtime they had begun to fraternize with the older children, sharing songs and games.' Fraternize means...", options: ["associate in a friendly way", "fight fiercely", "hide", "spy"], answer: "associate in a friendly way", hint: "Frater: to behave like brothers.", why: "Fraternizing is friendly mixing — sharing songs and games is an example." },
        { q: "Which Latin noun is the odd one out by gender? filia, familia, amica, filius", options: ["filius", "filia", "familia", "amica"], answer: "filius", hint: "Compare endings.", why: "Filius (-us) is masculine; the others (-a) are feminine." },
        { q: "Words in context: 'In old age the famous pianist seemed rejuvenated whenever she sat at the keyboard, playing with youthful fire.' The best synonym for rejuvenated is...", options: ["revitalized", "exhausted", "aged", "silenced"], answer: "revitalized", hint: "Youthful fire. Made young again.", why: "Rejuvenated: restored to youthful energy; revitalized means the same." },

    // ---------- Lesson 12 ----------
    {

        { say: "Latin nature words. Each is a first-declension noun except caelum (second declension, which you meet soon) and sol and mare (third declension, for next year).", show: { type: "table", rows: [["Latin", "Say it", "Meaning"], ["aqua", "AH-kwah", "water"], ["terra", "TEHR-rah", "earth, land"], ["luna", "LOO-nah", "moon"], ["stella", "STEHL-lah", "star"], ["sol", "sohl", "sun"], ["mare", "MAH-ray", "sea"], ["caelum", "CHAY-loom", "sky, heaven"]] } },
        { say: "Romans built <b>aqueducts</b>, channels and tall arched bridges that led water to their cities: aqua (water) + duct (lead).", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><rect x='30' y='70' width='540' height='26' fill='#c9a66b' stroke='#7a5a2b' stroke-width='3'/><rect x='30' y='58' width='540' height='14' fill='#3b82f6'/><g fill='#e4cfa2' stroke='#7a5a2b' stroke-width='3'><path d='M30 96 H120 V250 H105 V170 A30 30 0 0 0 45 170 V250 H30 Z'/><path d='M120 96 H240 V250 H225 V170 A45 45 0 0 0 135 170 V250 H120 Z'/><path d='M240 96 H360 V250 H345 V170 A45 45 0 0 0 255 170 V250 H240 Z'/><path d='M360 96 H480 V250 H465 V170 A45 45 0 0 0 375 170 V250 H360 Z'/><path d='M480 96 H570 V250 H555 V170 A30 30 0 0 0 495 170 V250 H480 Z'/></g><line x1='10' y1='252' x2='590' y2='252' stroke='#4d7c0f' stroke-width='6'/><text x='300' y='40' font-size='28' font-weight='800' text-anchor='middle' fill='#1e3a8a'>aqua + duct = water + lead</text><text x='300' y='295' font-size='22' text-anchor='middle' fill='#333'>Gravity carried the water gently downhill along the top.</text></svg>" } },
        { say: "Derivatives range from familiar to scholarly.", show: { type: "list", items: ["aquatic, aquifer (rock that 'carries' water underground)", "terrain, territory, subterranean (under the earth), Mediterranean (middle of the lands)", "lunar; stellar, constellation, interstellar (between the stars)", "solar, solstice (the sun 'stands still')", "marine, maritime (of the sea), submarine", "celestial (heavenly); duct, conduct, aqueduct"] } },
        { say: "Grammar: <b>est</b> means 'is' and <b>sunt</b> means 'are'. An adjective must match its noun. With a feminine first-declension noun, use <b>-a</b> in the singular and <b>-ae</b> in the plural.", show: { type: "table", rows: [["Latin", "English"], ["Stella est parva.", "The star is small."], ["Stellae sunt parvae.", "The stars are small."], ["Terra est magna.", "The earth is great."], ["Aquae sunt altae.", "The waters are deep."]] } },
        { say: "Latin has no word for 'the' or 'a'. You supply them in English as the sense requires: <b>stella</b> may mean 'a star' or 'the star'.", show: { type: "big", text: "stella = a star / the star\nstellae = stars / the stars" } },
        { say: "False friends: <b>solo</b> and <b>solitary</b> come from solus, alone. <b>Terrible</b> and <b>terrify</b> come from terreo, I frighten. <b>Marry</b> comes from maritus, husband, not mare.", show: { type: "big", text: "solo ✗ sol · terrible ✗ terra\nmarry ✗ mare" } },

      practice: [

        { q: "Translate: 'Stellae sunt parvae.'", options: ["The stars are small.", "The star is small.", "The stars are great.", "The moon is small."], answer: "The stars are small.", hint: "Are stellae and sunt singular or plural?", why: "Stellae (stars) sunt (are) parvae (small)." },
        { q: "Choose the correct Latin for 'The moon is great.'", options: ["Luna est magna.", "Luna sunt magna.", "Lunae est magna.", "Luna est magnae."], answer: "Luna est magna.", hint: "One moon: singular noun, verb and adjective.", why: "Singular luna, singular est, matching magna." },
        { q: "Choose the correct Latin for 'The lands are great.'", options: ["Terrae sunt magnae.", "Terra est magna.", "Terrae est magnae.", "Terrae sunt magna."], answer: "Terrae sunt magnae.", hint: "Plural noun, plural verb, plural adjective.", why: "Terrae, sunt, magnae all plural." },
        { q: "Subterranean means...", options: ["underground", "underwater", "above the clouds", "between stars"], answer: "underground", hint: "Sub (under) + terra.", why: "Beneath the earth." },
        { q: "Interstellar space lies...", options: ["between the stars", "inside the Earth", "under the sea", "on the Moon"], answer: "between the stars", hint: "Inter + stell.", why: "Inter (between) + stella." },
        { q: "Maritime law governs...", options: ["the sea and shipping", "mountains", "the sky", "farms"], answer: "the sea and shipping", hint: "Mare = sea.", why: "Maritime: relating to the sea." },
        { q: "Which word does NOT come from sol?", options: ["solitary", "solar", "solstice", "parasol"], answer: "solitary", hint: "Which means alone?", why: "Solitary comes from solus." },

        { q: "The Mediterranean was named 'middle of the...'", options: ["lands", "seas", "stars", "suns"], answer: "lands", hint: "Medius + terra.", why: "It lies among Europe, Asia and Africa." },
        { q: "An aquifer is a layer of rock that...", options: ["holds and carries groundwater", "blocks sunlight", "glows at night", "floats"], answer: "holds and carries groundwater", hint: "Aqua + fer (carry).", why: "Aqua (water) + ferre (to carry)." },
        { q: "Celestial bodies are found...", options: ["in the sky", "in the sea", "underground", "in caves"], answer: "in the sky", hint: "Caelum.", why: "Celestial: of the sky or heavens." },
        { q: "How many words in 'Aquae sunt altae' are plural?", type: "number", answer: 3, hint: "Check every ending.", why: "Aquae (-ae), sunt (are), altae (-ae): all three." },

      challenge: [

        { q: "Translate into Latin: 'The waters are small.'", options: ["Aquae sunt parvae.", "Aqua est parva.", "Aquae est parvae.", "Aquae sunt parva."], answer: "Aquae sunt parvae.", hint: "Make all three words plural.", why: "Plural noun aquae, plural verb sunt, plural adjective parvae." },

    // ---------- Lesson 13 ----------
    {
      title: "Animal Latin", icon: "🐎",
      learn: [
        { say: "Latin animal words have given English a family of precise adjectives ending in <b>-ine</b>, meaning 'like or relating to'.", show: { type: "table", rows: [["Latin", "Say it", "Meaning", "English adjective"], ["canis", "KAH-nees", "dog", "canine"], ["felis", "FAY-lees", "cat", "feline"], ["equus", "EH-kwoos", "horse", "equine"], ["lupus", "LOO-poos", "wolf", "lupine"], ["ursus", "OOR-soos", "bear", "ursine"], ["porcus", "POHR-koos", "pig", "porcine"]] } },
        { say: "Birds and fish: <b>avis</b> (AH-vees) bird gives aviary, aviation and avian; <b>piscis</b> (PEE-shees) fish gives Pisces and piscine. A <b>porcupine</b> is a 'spiny pig' (porcus + spina), and a <b>porpoise</b> a 'pig-fish' (porcus + piscis).", show: { type: "big", text: "porcupine = pig + spine\nporpoise = pig + fish" } },
        { say: "<b>Vor</b> means devour (vorare). With it, scientists classify animals by diet. The Greek root <b>zoo</b> means animal.", show: { type: "list", items: ["carnivore = flesh-eater (caro, carnis = flesh)", "herbivore = plant-eater; omnivore = eats everything (omnis = all)", "insectivore = insect-eater; voracious = greedy, ravenous", "zoology = the study of animals; zodiac = a 'circle of little animals'"] } },
        { say: "Grammar: the <b>second declension</b>. Masculine nouns end in <b>-us</b>, plural <b>-i</b>. Neuter nouns end in <b>-um</b>, plural <b>-a</b>. Adjectives match: magnus, magni; magnum, magna.", show: { type: "table", rows: [["Singular", "Plural", "Gender"], ["equus magnus", "equi magni", "masculine"], ["lupus parvus", "lupi parvi", "masculine"], ["ovum parvum (egg)", "ova parva", "neuter"]] } },
        { say: "Now read real sentences. Check that noun, verb and adjective agree in number.", show: { type: "table", rows: [["Latin", "English"], ["Equus est magnus.", "The horse is big."], ["Equi sunt magni.", "The horses are big."], ["Ovum est parvum.", "The egg is small."], ["Ova sunt parva.", "The eggs are small."]] } },
        { say: "Canis, felis, avis and piscis belong to another pattern, the third declension, which you will study next year. Their plurals are canes, feles, aves, pisces — which is why the constellation is Pisces, 'the Fishes'.", show: { type: "big", text: "piscis → pisces\none fish → fishes" } },
        { say: "False friends: <b>equal</b> is from aequus, not equus. <b>Avid</b> (eager) is from avidus, not avis. <b>Canteen</b> is from Italian cantina, a cellar, not canis or canto.", show: { type: "big", text: "equal ✗ equus\navid ✗ avis" } },
      ],

        { q: "What is the plural of 'lupus' (wolf)?", options: ["lupi", "lupae", "lupa", "lupus"], answer: "lupi", hint: "-us becomes...", why: "Second declension: -us → -i." },
        { q: "What is the plural of 'ovum' (egg)?", options: ["ova", "ovi", "ovae", "ovums"], answer: "ova", hint: "Neuter -um becomes...", why: "Neuter: -um → -a." },

        { q: "Choose the correct Latin: 'The bear is small.'", options: ["Ursus est parvus.", "Ursus est parva.", "Ursi est parvus.", "Ursus sunt parvi."], answer: "Ursus est parvus.", hint: "Masculine singular throughout.", why: "Ursus (m. sg.), est, parvus (m. sg.)." },
        { q: "Choose the correct Latin: 'The eggs are big.'", options: ["Ova sunt magna.", "Ova sunt magni.", "Ovum est magnum.", "Ova est magna."], answer: "Ova sunt magna.", hint: "Neuter plural adjective ends in -a.", why: "Ova (n. pl.), sunt, magna (n. pl.)." },
