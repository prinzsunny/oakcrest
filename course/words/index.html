    // ---------- Lesson 15 ----------
    {
      title: "Derivative detective", icon: "🔍",
      learn: [
        { say: "A <b>derivative</b> is an English word descended from a Latin or Greek word. Today you will analyze derivatives of the Latin verb <b>porto</b>, I carry, and of <b>duco</b>, I lead.", show: { type: "table", rows: [["Root", "Meaning", "Latin source"], ["port", "carry", "porto, portare"], ["duc / duct", "lead", "duco, ducere"], ["trans", "across", "trans"], ["e / ex", "out of", "ex"], ["in / im", "in, into; or not", "in"], ["re", "back, again", "re-"], ["de", "down, away from", "de"]] } },
        { say: "One root, many prefixes: each prefix redirects the carrying.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><circle cx='300' cy='160' r='62' fill='#d6f0ec' stroke='#0f766e' stroke-width='5'/><text x='300' y='158' font-size='34' font-weight='900' text-anchor='middle' fill='#0f4c45'>port</text><text x='300' y='188' font-size='20' text-anchor='middle' fill='#0f4c45'>carry</text><g stroke='#555' stroke-width='4'><line x1='245' y1='130' x2='140' y2='70'/><line x1='355' y1='130' x2='460' y2='70'/><line x1='240' y1='175' x2='130' y2='200'/><line x1='360' y1='175' x2='470' y2='200'/><line x1='300' y1='222' x2='300' y2='265'/></g><g font-size='24' font-weight='800' text-anchor='middle' fill='#7c2d12'><text x='110' y='60'>trans-port</text><text x='490' y='60'>ex-port</text><text x='105' y='225'>im-port</text><text x='495' y='225'>de-port</text><text x='300' y='298'>re-port</text></g></svg>" } },
        { say: "The detective method, applied: split, define, combine, check.", show: { type: "list", items: ["transport = carry across", "export = carry out (of a country); import = carry in", "deport = carry away (expel from a country)", "report = carry back (news)", "portable = able to be carried; portfolio = a case for carrying papers", "rapport = a 'carrying back and forth' of sympathy: a close understanding"] } },
        { say: "Duc/duct means lead. Prefixes again set the direction.", show: { type: "list", items: ["conduct = lead together; conductor", "deduce = lead down from evidence to a conclusion", "induce = lead into; persuade or cause", "reduce = lead back (to a smaller amount)", "conducive = leading toward, helpful: 'quiet is conducive to study'", "educate = from educare, to bring up, a close relative of educere, to lead out (e + ducere)"] } },
        { say: "Two more: <b>transient</b> (trans + ire, go) means passing quickly, temporary. <b>Deportment</b> means the way one carries oneself: bearing and manners.", show: { type: "big", text: "transient = going across\ndeportment = how one carries oneself" } },
        { say: "False friends: a <b>portrait</b> comes from protrahere, to draw forth. A <b>port</b> (harbor) comes from portus, and a <b>portal</b> (gateway) from porta, door — different Latin words from porto.", show: { type: "big", text: "portrait ✗ porto\nport (harbor) = portus" } },
      ],
      practice: [
        { q: "To export goods is to carry them...", options: ["out of a country", "into a country", "back again", "across a river"], answer: "out of a country", hint: "Ex = out.", why: "Ex + porto." },
        { q: "What does 'portable' mean?", options: ["able to be carried", "able to be read", "made of wood", "very heavy"], answer: "able to be carried", hint: "Port + able.", why: "Carry + able." },
        { q: "A government may deport a person. This means...", options: ["send the person out of the country", "welcome the person", "carry the person's luggage", "elect the person"], answer: "send the person out of the country", hint: "De = away.", why: "Carry away: expel." },
        { q: "The detective deduced who stole the jewels. Deduce means...", options: ["reach a conclusion by reasoning from evidence", "guess randomly", "steal", "lead a parade"], answer: "reach a conclusion by reasoning from evidence", hint: "De + ducere: lead down from evidence.", why: "Deduction leads from facts to a conclusion." },
        { q: "A quiet, well-lit room is conducive to reading. Conducive means...", options: ["helpful, tending to bring about", "harmful", "noisy", "unrelated"], answer: "helpful, tending to bring about", hint: "Con + duc: leading toward.", why: "Conducive: contributing to a result." },
        { q: "Build 'transportation'.", type: "order", items: ["ation", "port", "trans"], answer: ["trans", "port", "ation"], hint: "Across + carry + noun ending.", why: "trans + port + ation." },
        { q: "Which word is NOT derived from porto?", options: ["portrait", "porter", "portfolio", "support"], answer: "portrait", hint: "Which concerns drawing?", why: "Portrait comes from protrahere, to draw forth." },
        { q: "Transient visitors...", options: ["stay only briefly", "stay forever", "carry heavy loads", "lead tours"], answer: "stay only briefly", hint: "Trans + ire: passing across.", why: "Transient: temporary, passing." },
        { q: "A country imports 1,250 cars and exports 875. How many more cars come in than go out?", type: "number", answer: 375, hint: "Import = in; export = out. Subtract.", why: "1,250 − 875 = 375." },
        { q: "To reduce a recipe is to...", options: ["make it smaller", "make it larger", "cook it", "carry it"], answer: "make it smaller", hint: "Re + ducere: lead back.", why: "To bring back to a smaller amount." },
        { q: "Her excellent deportment impressed the judges. Deportment means...", options: ["the way she carried herself", "her deportation", "her portfolio", "her singing"], answer: "the way she carried herself", hint: "How does one 'carry' oneself?", why: "Deportment: posture and manners." },
        { q: "Aqueduct is aqua + duct. Viaduct (via = road) is a bridge that...", options: ["carries a road across a valley", "carries water", "leads ships", "leads horses"], answer: "carries a road across a valley", hint: "What does via mean?", why: "Via (road) + duct (lead): a road-bearing bridge." },
        { q: "Educate comes from Latin educare (to bring up), a close relative of educere (e + ducere). The root picture of educere is...", options: ["leading out", "pushing down", "carrying across", "writing again"], answer: "leading out", hint: "E = out; duc = lead.", why: "E (out) + ducere (lead): leading out. People often say education 'draws out' abilities, but educare itself meant to bring up, rear." },
      ],
      challenge: [
        { q: "Analogy — import : export :: induce : ___", options: ["educe", "deduce", "reduce", "conduce"], answer: "educe", hint: "Import/export differ by in/ex. Find the ex- form of duce.", why: "In vs out: induce (lead in) / educe (lead out, draw forth)." },
        { q: "Words in context: 'A strong rapport between teacher and student made even difficult lessons enjoyable.' Rapport means...", options: ["a close, sympathetic understanding", "a written report", "a strict rule", "a long delay"], answer: "a close, sympathetic understanding", hint: "What made lessons enjoyable?", why: "Rapport (re + ad + portare, via French) is a harmonious relationship." },
        { q: "Words in context: 'The singer's fame proved transient: within a year, no one remembered his name.' Transient means...", options: ["short-lived", "permanent", "dangerous", "deserved"], answer: "short-lived", hint: "Within a year, forgotten.", why: "Transient: passing quickly." },
        { q: "Which word means 'to lead into a belief by evidence, from particular cases to a general rule'?", options: ["induce (induction)", "export", "deport", "transport"], answer: "induce (induction)", hint: "In + ducere: lead into.", why: "Induction leads from examples to a general rule; deduction leads from a rule to a particular conclusion." },
      ],
      extend: "Choose any five English words containing port or duc/duct. For each, write the prefix, root and suffix, the literal meaning, and a sentence. Then check each etymology in a print dictionary and correct any that surprised you.",
      offline: "Act out port words with a grown-up: carry a book across the room (transport), out the door (export), back (report). Explain it: describe the difference between deduce and induce in 2–4 sentences.",

    // ---------- Lesson 16 ----------
    {
      title: "Latin verbs: the first conjugation", icon: "🏃",
      learn: [
        { say: "A Latin verb's ending tells you who is acting, so a Latin verb can be a whole sentence. <b>Amo</b> means 'I love'.", show: { type: "table", rows: [["Latin", "Say it", "Meaning"], ["amo", "AH-moh", "I love"], ["porto", "POHR-toh", "I carry"], ["specto", "SPEHK-toh", "I look at"], ["ambulo", "AHM-boo-loh", "I walk"], ["laudo", "LOW-doh", "I praise"], ["voco", "VOH-koh", "I call"], ["laboro", "lah-BOH-roh", "I work"], ["navigo", "NAH-vee-goh", "I sail"]] } },
        { say: "These verbs share one pattern, the <b>first conjugation</b>, marked by the vowel a. Learn the six present-tense endings: -o, -s, -t, -mus, -tis, -nt.", show: { type: "table", rows: [["Person", "Singular", "Plural"], ["1st", "amo — I love", "amamus — we love"], ["2nd", "amas — you love", "amatis — you (all) love"], ["3rd", "amat — he, she, it loves", "amant — they love"]] } },
        { say: "Now sentences: a subject in the nominative, and a verb that agrees with it in number.", show: { type: "table", rows: [["Latin", "English"], ["Puella ambulat.", "The girl walks."], ["Puellae ambulant.", "The girls walk."], ["Agricola laborat.", "The farmer works."], ["Nautae navigant.", "The sailors sail."], ["Laudamus.", "We praise."]] } },
        { say: "Note that agricola, farmer, and nauta, sailor, end in -a yet are masculine. They follow the first declension anyway.", show: { type: "big", text: "agricola, nauta, poeta\n-a nouns that are masculine" } },
        { say: "These verbs fill English with derivatives.", show: { type: "list", items: ["amicable (friendly), amateur (one who does it for love)", "spectator, spectacle, inspect, retrospect", "ambulance, ambulatory (able to walk), preamble (a 'walking before': an introduction)", "laudable (praiseworthy), laudatory", "vocation (a calling), advocate, invoke", "collaborate (work together), elaborate, laborious", "navigable, navigate; orator, oracle (oro, I speak, pray); incantation (canto, I sing)"] } },
        { say: "False friends: <b>applaud</b> comes from plaudere, to clap, not laudo. <b>Navel</b> is Old English, not navis.", show: { type: "big", text: "applaud ✗ laudo\nnavel ✗ navigo" } },

      practice: [
        { q: "What does 'portat' mean?", options: ["he/she carries", "I carry", "they carry", "we carry"], answer: "he/she carries", hint: "The -t ending.", why: "-t: third person singular." },

        { q: "Order the endings: I, you, he/she, we, you all, they.", type: "order", items: ["-nt", "-mus", "-o", "-t", "-tis", "-s"], answer: ["-o", "-s", "-t", "-mus", "-tis", "-nt"], hint: "Begin with the 'I' ending.", why: "-o, -s, -t, -mus, -tis, -nt." },
        { q: "Translate: 'Puellae ambulant.'", options: ["The girls walk.", "The girl walks.", "The girls are walking to school.", "We walk."], answer: "The girls walk.", hint: "Plural subject, -nt verb.", why: "Puellae (girls) ambulant (walk)." },
        { q: "Translate into Latin: 'The sailor sails.'", options: ["Nauta navigat.", "Nautae navigant.", "Nauta navigant.", "Nautae navigat."], answer: "Nauta navigat.", hint: "Singular noun, -t verb.", why: "Nauta (sg.) navigat (sg.)." },
        { q: "Translate: 'Spectatis.'", options: ["You all watch.", "You watch.", "They watch.", "I watch."], answer: "You all watch.", hint: "-tis.", why: "-tis is 'you' plural." },

        { q: "Which word is NOT from laudo (I praise)?", options: ["applaud", "laudable", "laudatory", "laud"], answer: "applaud", hint: "Which comes from 'clapping'?", why: "Applaud is from plaudere." },

      learn: [
        { say: "Six roots of physical action, each a Latin verb: build, pull, break (two ways), throw and drive.", show: { type: "table", rows: [["Root", "Meaning", "Latin source"], ["struct", "build", "struo, struere"], ["tract", "pull, drag", "traho, trahere"], ["rupt", "break, burst", "rumpo, rumpere"], ["fract / frag", "break, shatter", "frango, frangere"], ["ject", "throw", "iacio, iacere"], ["pel / puls", "drive, push", "pello, pellere"]] } },
        { say: "A <b>fraction</b> is literally a broken number: a whole broken into equal parts. A <b>fracture</b> is a broken bone, and something <b>fragile</b> breaks easily.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><circle cx='170' cy='160' r='110' fill='#fde7c8' stroke='#b45309' stroke-width='5'/><g stroke='#b45309' stroke-width='5'><line x1='170' y1='50' x2='170' y2='270'/><line x1='60' y1='160' x2='280' y2='160'/></g><path d='M170 160 L170 50 A110 110 0 0 1 280 160 Z' fill='#0f766e' opacity='0.85'/><text x='430' y='130' font-size='64' font-weight='900' text-anchor='middle' fill='#222'>1/4</text><text x='430' y='200' font-size='28' font-weight='800' text-anchor='middle' fill='#0f4c45'>frangere</text><text x='430' y='240' font-size='24' text-anchor='middle' fill='#333'>to break</text></svg>" } },
        { say: "Derivatives to master.", show: { type: "list", items: ["construct, obstruct, infrastructure, construe (interpret)", "attract, distract, protracted (drawn out), intractable (stubborn, hard to manage)", "erupt, abrupt (broken off: sudden), disrupt, corrupt", "projectile, trajectory (path 'thrown across'), conjecture (a guess), dejected", "propel, compel, repel, expel, impulse, compulsory", "fraction, fracture, fragile, fragment, refract (bend light)"] } },
        { say: "Hidden root: the English word <b>route</b> comes, through French, from Latin via rupta, a 'broken road', a way forced through forest or rock.", show: { type: "big", text: "route = via rupta\na broken-through road" } },
        { say: "Grammar review: nominative for the subject, accusative for the object. Because endings carry the meaning, you translate by endings, not by order.", show: { type: "table", rows: [["Latin", "Subject", "Object", "English"], ["Nauta puellam spectat.", "nauta", "puellam", "The sailor looks at the girl."], ["Nautam puella spectat.", "puella", "nautam", "The girl looks at the sailor."]] } },
        { say: "Translating into Latin, work in three steps: find the subject and make it nominative; find the object and make it accusative; choose the verb ending that agrees with the subject.", show: { type: "big", text: "subject → nominative\nobject → accusative\nverb → agrees with subject" } },
      ],
      practice: [
        { q: "A fraction is, by its roots, a...", options: ["broken number", "pulled number", "thrown number", "built number"], answer: "broken number", hint: "Frangere.", why: "Fract = break." },
        { q: "What fraction of a pizza remains if it is broken into 8 equal slices and 5 are eaten? Type the number of slices left.", type: "number", answer: 3, hint: "8 − 5.", why: "3 slices, or 3/8." },
        { q: "To obstruct a road is to...", options: ["block it", "build it", "pave it", "map it"], answer: "block it", hint: "Ob (against) + struct (build).", why: "To build something against it: block." },
        { q: "Protracted negotiations are...", options: ["long and drawn out", "brief", "friendly", "secret"], answer: "long and drawn out", hint: "Pro + tract.", why: "Pulled forward in time: prolonged." },
        { q: "An abrupt ending is...", options: ["sudden", "gradual", "happy", "predictable"], answer: "sudden", hint: "Ab + rupt: broken off.", why: "Broken off suddenly." },
        { q: "A projectile is something...", options: ["thrown or fired forward", "built", "broken", "pulled"], answer: "thrown or fired forward", hint: "Pro + ject.", why: "Thrown forward." },
        { q: "A dejected student feels...", options: ["discouraged", "excited", "curious", "proud"], answer: "discouraged", hint: "De (down) + ject: thrown down.", why: "Cast down in spirit." },
        { q: "A magnet will ___ another magnet if like poles face each other.", options: ["repel", "attract", "compel", "expel"], answer: "repel", hint: "Re (back) + pel (drive).", why: "Like poles drive each other back." },
        { q: "School attendance is compulsory. This means...", options: ["required", "optional", "forbidden", "rare"], answer: "required", hint: "Com + puls: driven together, forced.", why: "Compulsory: mandatory." },
        { q: "Translate: 'Nautam puella spectat.'", options: ["The girl looks at the sailor.", "The sailor looks at the girl.", "The sailors look at the girl.", "The girl is a sailor."], answer: "The girl looks at the sailor.", hint: "Which word ends in -am? That is the object.", why: "Nautam (object) puella (subject) spectat." },
        { q: "Choose the Latin for 'The horses carry the farmer.'", options: ["Equi agricolam portant.", "Equos agricola portant.", "Equi agricola portat.", "Equum agricolae portant."], answer: "Equi agricolam portant.", hint: "Horses = subject (nominative plural).", why: "Equi (nom. pl.) agricolam (acc. sg.) portant." },
        { q: "Light bends, or refracts, when it passes from air into water. Refract means...", options: ["break back, bend", "pull forward", "throw away", "build up"], answer: "break back, bend", hint: "Re + fract.", why: "The light's path is 'broken' at the surface." },
        { q: "How many of these words contain a root meaning 'break': fracture, erupt, fragile, eject, corrupt?", type: "number", answer: 4, hint: "Eject has ject.", why: "Fracture, erupt, fragile and corrupt: 4. Eject means throw out." },
        { q: "The word 'route' comes from via rupta. What does that mean?", options: ["a broken-through road", "a straight line", "a river", "a map"], answer: "a broken-through road", hint: "Via + rupt.", why: "A path forced open." },
      ],
      challenge: [
        { q: "Analogy — attract : pull toward :: repel : ___", options: ["drive back", "build up", "break apart", "throw down"], answer: "drive back", hint: "Re + pel.", why: "Attract pulls in; repel drives back." },
        { q: "Words in context: 'Despite hours of mediation, the dispute remained intractable; neither side would yield an inch.' Intractable means...", options: ["stubbornly resistant to solution", "easily settled", "unimportant", "loud"], answer: "stubbornly resistant to solution", hint: "In (not) + tract (handle, draw).", why: "Not able to be drawn or managed." },
        { q: "Words in context: 'Lacking evidence, the historian could offer only a conjecture about the king's final days.' Conjecture means...", options: ["an opinion formed without proof", "a proven fact", "a royal decree", "a long journey"], answer: "an opinion formed without proof", hint: "Con + ject: ideas 'thrown together'.", why: "A guess based on incomplete information." },
        { q: "Translate into Latin: 'The poets praise the stars.'", options: ["Poetae stellas laudant.", "Poeta stellam laudat.", "Poetae stellae laudant.", "Poetas stellas laudant."], answer: "Poetae stellas laudant.", hint: "Nominative plural subject; accusative plural object.", why: "Poetae (nom. pl.), stellas (acc. pl.), laudant." },
      ],
      extend: "Investigate refraction: put a pencil in a glass of water and sketch how it appears broken at the surface. Read a short explanation of refraction, then write a paragraph explaining why the word 'refract' fits.",
      offline: "With a grown-up, cut a paper circle into equal fractions (halves, quarters, eighths) and name each. Explain it: tell the grown-up why a fraction is a 'broken' number and name three other fract/frag words.",
    },
    // ---------- Lesson 19 ----------
    {
      title: "Derivative detective II", icon: "🕵️",
      learn: [
        { say: "Six roots of turning, belief and time: <b>vert/vers</b> turn, <b>cred</b> believe, <b>fid</b> trust, <b>ver</b> true, <b>annu/enn</b> year, and <b>dub</b> doubt.", show: { type: "table", rows: [["Root", "Meaning", "Latin source"], ["vert / vers", "turn", "verto, vertere"], ["cred", "believe", "credo, credere"], ["fid", "faith, trust", "fides"], ["ver", "true", "verus"], ["annu / enn", "year", "annus"], ["dub", "doubt", "dubius"]] } },
        { say: "<b>Credo</b>, 'I believe', is the first word of the Creed. The English word <b>creed</b> comes from it.", show: { type: "big", text: "Credo = I believe\n→ creed, credible, credit" } },
        { say: "A crucial pair: <b>credulous</b> means too ready to believe; <b>incredulous</b> means unwilling to believe, showing disbelief. A <b>credible</b> claim deserves belief.", show: { type: "table", rows: [["Word", "Meaning"], ["credible", "believable"], ["credulous", "believing too easily, gullible"], ["incredulous", "disbelieving, skeptical"], ["credentials", "documents that earn belief or trust"]] } },
        { say: "Turning and truth.", show: { type: "list", items: ["versatile = able to turn to many tasks; adversary = one turned against you", "avert = turn away; inadvertent = not turning attention to: accidental", "anniversary = the year turning round (annus + vertere); universe = turned into one", "verify = make sure it is true; verdict = a 'true saying'; veracity = truthfulness", "verisimilitude = the appearance of truth (verus + similis)"] } },
        { say: "Faith, year and doubt.", show: { type: "list", items: ["fidelity = faithfulness; confide; diffident = lacking self-trust, shy", "bona fide = 'in good faith': genuine", "annual, biennial (every two years), perennial (lasting through the years)", "dubious = doubtful; indubitably = beyond doubt"] } },
        { say: "Grammar: because endings mark subject and object, Latin word order is free. These three sentences all mean 'The farmer praises the sailor.'", show: { type: "table", rows: [["Latin", "Emphasis"], ["Agricola nautam laudat.", "normal order"], ["Nautam agricola laudat.", "stress on the sailor"], ["Laudat agricola nautam.", "stress on the praising"]] } },
        { say: "False friend: <b>annoy</b> does not come from annus. It comes, through French, from the Latin phrase in odio, 'in hatred'.", show: { type: "big", text: "annoy ✗ annus\nin odio ✔" } },
      ],
      practice: [
        { q: "An incredulous listener...", options: ["refuses to believe", "believes everything", "cannot hear", "is faithful"], answer: "refuses to believe", hint: "In (not) + cred + ulous.", why: "Showing disbelief." },
        { q: "A credulous person is...", options: ["too easily convinced", "very doubtful", "dishonest", "forgetful"], answer: "too easily convinced", hint: "Contrast with incredulous.", why: "Credulous: gullible." },
        { q: "To verify a fact is to...", options: ["confirm it is true", "invent it", "forget it", "turn it around"], answer: "confirm it is true", hint: "Verus = true.", why: "Make true: confirm." },
        { q: "A perennial plant...", options: ["lives for many years", "lives one year", "never flowers", "grows in water"], answer: "lives for many years", hint: "Per (through) + enn (year).", why: "Lasting through the years." },
        { q: "A biennial festival held in 2026 will next be held in...", type: "number", answer: 2028, hint: "Bi + enn.", why: "Every 2 years: 2026 + 2 = 2028." },
        { q: "A couple married in 1991 celebrate which anniversary in 2026?", type: "number", answer: 35, hint: "Subtract the years.", why: "2026 − 1991 = 35." },
        { q: "Which word does NOT come from annus (year)?", options: ["annoy", "annual", "anniversary", "annals"], answer: "annoy", hint: "In odio.", why: "Annoy derives from in odio." },
        { q: "A versatile musician...", options: ["plays many instruments and styles", "plays one note", "dislikes music", "is a poet"], answer: "plays many instruments and styles", hint: "Vers = turn: able to turn to many things.", why: "Versatile: adaptable." },
        { q: "An inadvertent mistake is...", options: ["accidental", "deliberate", "serious", "true"], answer: "accidental", hint: "In (not) + ad + vert: not turning one's mind to it.", why: "Unintentional." },
        { q: "A diffident student...", options: ["lacks confidence", "is arrogant", "is faithful", "is talkative"], answer: "lacks confidence", hint: "Dis (not) + fid (trust): not trusting oneself.", why: "Shy, lacking self-trust." },
        { q: "Translate: 'Nautam agricola laudat.'", options: ["The farmer praises the sailor.", "The sailor praises the farmer.", "The sailors praise the farmer.", "The farmer is a sailor."], answer: "The farmer praises the sailor.", hint: "Find the -am ending.", why: "Nautam is the object; agricola the subject." },
        { q: "Translate into Latin: 'The sailor praises the farmer.'", options: ["Nauta agricolam laudat.", "Nautam agricola laudat.", "Nauta agricola laudat.", "Nautae agricolam laudant."], answer: "Nauta agricolam laudat.", hint: "Farmer is now the object.", why: "Nauta (nom.) agricolam (acc.) laudat." },
        { q: "A dubious claim is...", options: ["doubtful", "proven", "kind", "annual"], answer: "doubtful", hint: "Dub.", why: "Open to doubt." },
        { q: "Bona fide means...", options: ["genuine, in good faith", "fake", "good night", "faithful dog"], answer: "genuine, in good faith", hint: "Bona = good; fide = faith.", why: "Made in good faith: real." },
      ],
      challenge: [
        { q: "Analogy — credible : believe :: dubious : ___", options: ["doubt", "trust", "turn", "verify"], answer: "doubt", hint: "Which response does each invite?", why: "A credible claim invites belief; a dubious one invites doubt." },
        { q: "Words in context: 'The novel's verisimilitude was remarkable: readers wrote to the author asking whether its village was real.' Verisimilitude means...", options: ["the appearance of being true or real", "a happy ending", "great length", "a hidden meaning"], answer: "the appearance of being true or real", hint: "Verus (true) + similis (like).", why: "Readers thought it real: it looked true." },
        { q: "Words in context: 'The salesman's credulous customers bought his miracle tonic, though a moment's thought would have exposed the fraud.' The customers were...", options: ["too ready to believe", "deeply skeptical", "dishonest", "wealthy"], answer: "too ready to believe", hint: "Could a moment's thought have saved them?", why: "They believed too easily: credulous." },
        { q: "Translate into Latin: 'The girls love the horses.'", options: ["Puellae equos amant.", "Puella equum amat.", "Puellae equi amant.", "Puellas equos amant."], answer: "Puellae equos amant.", hint: "Nominative plural; accusative plural masculine.", why: "Puellae (nom. pl.) equos (acc. pl.) amant." },
      ],
      extend: "Read the Apostles' Creed in Latin and English (the opening 'Credo in Deum'). List every English derivative you can find of its Latin words, and verify three in a dictionary.",
      offline: "Make three Latin sentence cards and rearrange each into three different word orders; read them to a grown-up. Explain it: tell the grown-up why 'credulous' and 'incredulous' are nearly opposites despite sharing a root.",
    },
    // ---------- Lesson 20 ----------
    {
      title: "Body, place and a.m./p.m.", icon: "🕛",
      learn: [
        { say: "Body words in Latin: <b>manus</b> hand, <b>caput</b> head, <b>cor</b> heart, <b>dens</b> tooth, <b>corpus</b> body, <b>oculus</b> eye. Their roots are manu, capit, cord, dent, corpor and ocul.", show: { type: "table", rows: [["Latin", "Say it", "Meaning", "Root"], ["manus", "MAH-noos", "hand", "manu"], ["caput", "KAH-poot", "head", "capit"], ["cor", "kohr", "heart", "cord"], ["dens", "dehns", "tooth", "dent"], ["corpus", "KOHR-poos", "body", "corpor"], ["oculus", "OH-koo-loos", "eye", "ocul"]] } },
        { say: "Derivatives, many of them formal.", show: { type: "list", items: ["manual, manuscript (written by hand), manufacture (originally, make by hand), emancipate (free from another's hand)", "capital (head city), captain, chapter (a little head), precipitate (headlong)", "cordial (warm-hearted), concord, discord, courage", "dental, trident, dandelion (French dent de lion, lion's tooth)", "corporal, corporation, incorporate, corpulent (fleshy)", "ocular, binoculars, monocle"] } },
        { say: "Beware two look-alike roots. <b>Capit</b> is head (caput). <b>Cap/capt/cept</b> is take (capere): capture, captive, capacity, accept. And a rope's <b>cord</b> is from Greek chorde, not cor.", show: { type: "table", rows: [["Root", "Meaning", "Words"], ["capit (caput)", "head", "capital, captain, chapter"], ["cap / capt (capere)", "take, hold", "capture, captive, capacity"]] } },
        { say: "Place words: <b>via</b> road gives obvious (in the way), deviate (go off the road), trivial (from trivium, a place where three roads meet: common talk), previous (going before) and viaduct.", show: { type: "big", text: "trivial = tri + via\nwhere three roads meet" } },
        { say: "<b>a.m.</b> means ante meridiem, before midday; <b>p.m.</b> means post meridiem, after midday. Meridies, midday, is medius (middle) + dies (day).", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><rect x='40' y='130' width='260' height='40' fill='#dbeafe' stroke='#1d4ed8' stroke-width='3'/><rect x='300' y='130' width='260' height='40' fill='#fde7c8' stroke='#b45309' stroke-width='3'/><line x1='300' y1='100' x2='300' y2='200' stroke='#222' stroke-width='5'/><text x='300' y='88' font-size='24' font-weight='800' text-anchor='middle' fill='#222'>meridies (noon)</text><text x='170' y='158' font-size='22' font-weight='800' text-anchor='middle' fill='#1e3a8a'>a.m.</text><text x='430' y='158' font-size='22' font-weight='800' text-anchor='middle' fill='#7c2d12'>p.m.</text><text x='170' y='230' font-size='22' text-anchor='middle' fill='#1e3a8a'>ante meridiem</text><text x='430' y='230' font-size='22' text-anchor='middle' fill='#7c2d12'>post meridiem</text><text x='170' y='262' font-size='20' text-anchor='middle' fill='#333'>before midday</text><text x='430' y='262' font-size='20' text-anchor='middle' fill='#333'>after midday</text><text x='40' y='118' font-size='20' fill='#333'>midnight</text><text x='560' y='118' font-size='20' text-anchor='end' fill='#333'>midnight</text></svg>" } },
        { say: "Grammar: the <b>genitive case</b> shows possession, translated 'of' or with an apostrophe. First declension: -ae (sg), -arum (pl). Second declension: -i (sg), -orum (pl).", show: { type: "table", rows: [["Latin", "English"], ["filia agricolae", "the farmer's daughter"], ["equi nautarum", "the sailors' horses"], ["caput lupi", "the wolf's head"], ["dona amicorum", "the friends' gifts"]] } },
        { say: "Other ante and post words: <b>antecedent</b> (going before), <b>anteroom</b>; <b>postpone</b> (put after), <b>posterity</b> (later generations), <b>postscript</b> (P.S., written after).", show: { type: "big", text: "ante = before\npost = after" } },
      ],
      practice: [
        { q: "10:30 in the morning is written...", options: ["10:30 a.m.", "10:30 p.m.", "10:30 m.", "10:30 n."], answer: "10:30 a.m.", hint: "Before or after midday?", why: "Ante meridiem: before noon." },
        { q: "How many hours pass from 9 a.m. to 4 p.m.?", type: "number", answer: 7, hint: "Count 9 a.m. to noon, then noon to 4 p.m.", why: "3 hours to noon + 4 hours after = 7." },
        { q: "A manuscript was originally...", options: ["written by hand", "printed by machine", "spoken aloud", "drawn on stone"], answer: "written by hand", hint: "Manu + script.", why: "Manus (hand) + scriptus (written)." },

        { q: "Which word comes from caput (head), not capere (take)?", options: ["captain", "capture", "captive", "capacity"], answer: "captain", hint: "A captain is the head of a crew.", why: "Captain derives from caput; the others from capere." },
        { q: "A cordial welcome is...", options: ["warm and friendly", "cold", "brief", "written"], answer: "warm and friendly", hint: "Cor = heart.", why: "From the heart." },

        { q: "A trident has how many prongs (teeth)?", type: "number", answer: 3, hint: "Tri + dent.", why: "Three teeth." },

        { q: "Words in context: 'The argument was trivial — a quarrel over whose turn it was to choose dessert — yet it lasted an hour.' Trivial means...", options: ["of little importance", "very serious", "ancient", "about roads"], answer: "of little importance", hint: "Trivium: everyday talk at a crossroads.", why: "A petty quarrel: trivial." },

        { say: "Many Latin prefixes are really prepositions that describe position. Picture each one around a box.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><ellipse cx='300' cy='165' rx='165' ry='120' fill='none' stroke='#6d28d9' stroke-width='3' stroke-dasharray='10 7'/><rect x='240' y='125' width='120' height='80' rx='10' fill='#d6f0ec' stroke='#0f766e' stroke-width='4'/><text x='300' y='173' font-size='22' font-weight='800' text-anchor='middle' fill='#0f4c45'>intra</text><g font-size='24' font-weight='800' text-anchor='middle'><text x='300' y='105' fill='#1d4ed8'>super ↑</text><text x='300' y='240' fill='#b45309'>sub ↓</text><text x='68' y='173' fill='#b91c1c'>pre ←</text><text x='532' y='173' fill='#b91c1c'>→ post</text><text x='300' y='35' fill='#6d28d9'>circum (around)</text><text x='470' y='305' fill='#333'>extra (outside)</text><text x='125' y='305' fill='#333'>inter (between)</text></g></svg>" } },
        { say: "Each prefix with sophisticated derivatives.", show: { type: "table", rows: [["Prefix", "Meaning", "Words"], ["sub", "under", "submerge, subordinate, subterfuge"], ["super", "over, above", "superfluous, superlative"], ["inter", "between", "interlude, intermittent, interrogate"], ["intra", "within", "intramural, intravenous"], ["circum", "around", "circumspect, circumvent"], ["pre", "before", "preclude, precocious, premonition"], ["extra", "outside, beyond", "extraordinary, extravagant"]] } },
        { say: "Look closely at three. <b>Circumspect</b>: looking around, so cautious. <b>Circumlocution</b>: talking around a point instead of stating it. <b>Superfluous</b>: overflowing, so more than is needed.", show: { type: "list", items: ["circumspect = circum + spect: cautious, wary", "circumlocution = circum + locut: roundabout speech", "superfluous = super + fluere (flow): unnecessary", "subterfuge = subter (beneath) + fugere (flee): a deceptive trick", "precocious = prae + coquere (ripen): developed unusually early"] } },
        { say: "Grammar: Latin prepositions take a case. Some always take the <b>accusative</b>, others the <b>ablative</b>.", show: { type: "table", rows: [["+ accusative", "+ ablative"], ["ad (to, toward)", "in (in, on)"], ["ante, post (before, after)", "sub (under)"], ["circum (around)", "cum (with)"], ["inter (between)", "e / ex (out of)"], ["per (through), trans (across)", "a / ab (from), de (down from, about)"]] } },
        { say: "Ablative endings: first declension <b>-a</b> (sg), <b>-is</b> (pl); second declension <b>-o</b> (sg), <b>-is</b> (pl). Note the key contrast: <b>in</b> + ablative means 'in'; <b>in</b> + accusative means 'into'. (The mark over ā shows the long vowel of the ablative.) <b>Sub</b> works the same way: ablative for position, accusative for motion.", show: { type: "table", rows: [["Latin", "English"], ["Puella in silvā ambulat.", "The girl walks in the forest."], ["Puella in silvam ambulat.", "The girl walks into the forest."], ["Nauta cum amicis navigat.", "The sailor sails with friends."], ["Ad villam ambulamus.", "We walk to the farmhouse."], ["Equus sub caelo stat.", "The horse stands under the sky."]] } },
        { say: "False friends: <b>supper</b> comes from French souper, not super. <b>Precious</b> comes from pretium, price, not prae.", show: { type: "big", text: "supper ✗ super\nprecious ✗ pre" } },
      ],
      practice: [
        { q: "To submerge is to...", options: ["put under water", "rise above", "go around", "come before"], answer: "put under water", hint: "Sub + mergere (dip).", why: "Under + dip." },
        { q: "A circumspect explorer is...", options: ["cautious, looking around before acting", "reckless", "lost", "talkative"], answer: "cautious, looking around before acting", hint: "Circum + spect.", why: "Looking around: wary." },
        { q: "Superfluous decorations are...", options: ["more than needed", "essential", "underneath", "ancient"], answer: "more than needed", hint: "Super + fluere: overflowing.", why: "Excess, unnecessary." },
        { q: "An intramural competition takes place...", options: ["within one school", "between schools", "outdoors", "overseas"], answer: "within one school", hint: "Intra + murus (wall).", why: "Within the walls." },
        { q: "An intermittent signal...", options: ["stops and starts at intervals", "never stops", "is very loud", "comes from underground"], answer: "stops and starts at intervals", hint: "Inter + mittere (send): sent between gaps.", why: "Occurring at intervals." },
        { q: "Bad weather may preclude a picnic. Preclude means...", options: ["prevent in advance", "encourage", "follow", "surround"], answer: "prevent in advance", hint: "Prae + claudere (shut).", why: "Shut out beforehand." },
        { q: "Which preposition takes the ablative?", options: ["cum", "ad", "circum", "trans"], answer: "cum", hint: "Check the two columns.", why: "Cum (with) takes the ablative." },
        { q: "Translate: 'Puella in silvam ambulat.'", options: ["The girl walks into the forest.", "The girl walks in the forest.", "The girl walks around the forest.", "The girls walk in the forest."], answer: "The girl walks into the forest.", hint: "Silvam is accusative. What does in + accusative mean?", why: "In + acc. = into." },
        { q: "Choose the Latin for 'with the sailors'.", options: ["cum nautis", "cum nautas", "cum nautae", "cum nautam"], answer: "cum nautis", hint: "Cum + ablative plural.", why: "First declension ablative plural: -is." },
        { q: "Choose the Latin for 'around the farmhouse'.", options: ["circum villam", "circum villā", "circum villis", "circum villae"], answer: "circum villam", hint: "Circum takes the accusative.", why: "Villam: accusative singular." },
        { q: "Which word is NOT formed with the prefix super?", options: ["supper", "superfluous", "superlative", "supervise"], answer: "supper", hint: "French souper.", why: "Supper comes from souper, to sup." },
        { q: "A precocious child...", options: ["develops abilities unusually early", "is late to learn", "is very tall", "is rude"], answer: "develops abilities unusually early", hint: "Prae + coquere: ripened early.", why: "Precocious: early-maturing." },
        { q: "Circumnavigate the globe once along a route of about 40,000 km. If a ship sails 400 km a day, how many days does it take?", type: "number", answer: 100, hint: "Divide total distance by daily distance.", why: "40,000 ÷ 400 = 100 days." },
        { q: "Put the prefixes in order from lowest to highest position.", type: "order", items: ["super", "sub", "inter (between two floors)"], answer: ["sub", "inter (between two floors)", "super"], hint: "Under, between, over.", why: "Sub (under), inter (between), super (above)." },
      ],
      challenge: [
        { q: "Analogy — circumspect : cautious :: superfluous : ___", options: ["excessive", "careful", "hidden", "early"], answer: "excessive", hint: "Translate super + fluous.", why: "Circumspect means cautious; superfluous means excessive." },
        { q: "Words in context: 'Rather than admit he had lost the map, the guide resorted to circumlocution, speaking vaguely of \"alternative routes\" and \"scenic delays\".' Circumlocution means...", options: ["evasive, roundabout speech", "a short cut", "a precise answer", "a round map"], answer: "evasive, roundabout speech", hint: "Circum + locut: talking around.", why: "He talked around the problem instead of stating it." },
        { q: "Translate into Latin: 'The girls walk with the farmer into the forest.'", options: ["Puellae cum agricolā in silvam ambulant.", "Puellae cum agricolam in silvā ambulant.", "Puella cum agricolā in silvam ambulat.", "Puellae cum agricolis in silvā ambulant."], answer: "Puellae cum agricolā in silvam ambulant.", hint: "Cum + ablative singular; in + accusative for 'into'.", why: "Cum agricolā (abl.), in silvam (acc. = into), ambulant (plural)." },
        { q: "Words in context: 'The spy's cover story was a clever subterfuge that fooled the guards for weeks.' Subterfuge means...", options: ["a deceptive trick", "an underground tunnel", "a loyal friend", "a coded letter"], answer: "a deceptive trick", hint: "Subter + fugere: escaping secretly.", why: "A stratagem of deception." },
      ],
      extend: "Read the account of Magellan's expedition (1519–1522), the first circumnavigation of the globe. Trace the route on a map and write a summary using circumnavigate, intermittent, extraordinary and precluded.",
      offline: "Use a box and a toy to act out prepositions with a grown-up: in arcā (in the box), sub arcā (under), circum arcam (around), ad arcam (toward). Explain it: tell the grown-up why 'in silvā' and 'in silvam' mean different things.",
    },
    // ---------- Lesson 22 ----------
    {
      title: "Review: for, against, with, apart", icon: "⚔️",
      learn: [
        { say: "Five prefixes of stance and relation: <b>anti</b> against (Greek), <b>pro</b> forward or for, <b>con/com/col</b> with or together, <b>contra</b> against (Latin), and <b>dis</b> apart or not.", show: { type: "table", rows: [["Prefix", "Meaning", "Words"], ["anti", "against", "antidote, antipathy, antithesis"], ["pro", "forward, for", "proponent, prolong, procrastinate"], ["con / com / col", "with, together", "companion, compassion, concur, consensus"], ["contra", "against", "contrary, contravene, controversy"], ["dis", "apart, not", "discord, dissent, disrupt"]] } },
        { say: "Do not confuse Greek <b>anti</b> (against) with Latin <b>ante</b> (before). An antidote works against poison; an antecedent comes before. <b>Antique</b> belongs to ante: it is from an earlier time.", show: { type: "big", text: "anti = against (Greek)\nante = before (Latin)" } },
        { say: "Several words hide surprising pictures.", show: { type: "list", items: ["companion = com + panis: one who shares bread with you", "compassion = com + pati: suffering with someone", "procrastinate = pro + crastinus: putting forward to tomorrow", "controversy = contra + versus: turned against: a dispute", "antagonist = one who struggles against (Greek agon, contest)"] } },
        { say: "False friends: <b>protagonist</b>, the main character, comes from Greek protos, first, not pro. <b>Antelope</b> has nothing to do with anti.", show: { type: "big", text: "protagonist = protos (first)\n✗ pro" } },
        { say: "Grammar: the <b>dative case</b> marks the indirect object, translated 'to' or 'for'. With it, you now have the full first declension.", show: { type: "table", rows: [["Case", "Use", "Singular", "Plural"], ["Nominative", "subject", "puella", "puellae"], ["Genitive", "of", "puellae", "puellarum"], ["Dative", "to, for", "puellae", "puellis"], ["Accusative", "object", "puellam", "puellas"], ["Ablative", "by, with, from, in", "puellā", "puellis"]] } },
        { say: "Read the dative in action with <b>do, dare</b>, to give, a first-conjugation verb.", show: { type: "table", rows: [["Latin", "English"], ["Puella agricolae aquam dat.", "The girl gives water to the farmer."], ["Nautae poetis dona dant.", "The sailors give gifts to the poets."], ["Rosas reginae damus.", "We give roses to the queen."]] } },
      ],
      practice: [
        { q: "An antidote works...", options: ["against a poison", "before a meal", "with a friend", "for a contest"], answer: "against a poison", hint: "Anti + dotos (given).", why: "Given against poison." },
        { q: "Which word belongs to Latin ante (before), not Greek anti (against)?", options: ["antique", "antidote", "antibiotic", "antifreeze"], answer: "antique", hint: "Which concerns earlier times?", why: "Antique: from an earlier age." },
        { q: "A companion is literally someone who...", options: ["shares bread with you", "argues with you", "walks before you", "rules you"], answer: "shares bread with you", hint: "Com + panis.", why: "With + bread." },
        { q: "To procrastinate is to...", options: ["put things off until later", "act immediately", "argue", "agree"], answer: "put things off until later", hint: "Pro + crastinus (of tomorrow).", why: "Pushing forward to tomorrow." },
        { q: "Compassion means...", options: ["sympathy for another's suffering", "hostility", "great speed", "a contest"], answer: "sympathy for another's suffering", hint: "Com + pati (suffer).", why: "Suffering with." },
        { q: "The protagonist of a story is...", options: ["the main character", "the villain", "a supporter", "the narrator only"], answer: "the main character", hint: "Protos = first.", why: "The first actor: the central character." },
        { q: "Which word does NOT contain the Latin prefix pro?", options: ["protagonist", "proponent", "prolong", "proclaim"], answer: "protagonist", hint: "Greek protos.", why: "Protagonist is from Greek protos, first." },
        { q: "Which form is dative plural of 'puella'?", options: ["puellis", "puellae", "puellas", "puellarum"], answer: "puellis", hint: "To/for the girls.", why: "Dative plural: -is." },
        { q: "Translate: 'Puella agricolae aquam dat.'", options: ["The girl gives water to the farmer.", "The farmer gives water to the girl.", "The girl gives water to the farmers.", "The girls give water to the farmers."], answer: "The girl gives water to the farmer.", hint: "Agricolae here is dative: to the farmer.", why: "Puella (subj.), agricolae (dat.), aquam (obj.), dat." },
        { q: "Choose the Latin for 'We give gifts to the sailors.'", options: ["Nautis dona damus.", "Nautas dona damus.", "Nautae dona dant.", "Nautis donum dat."], answer: "Nautis dona damus.", hint: "Dative plural for 'to the sailors'; -mus for 'we'.", why: "Nautis (dat. pl.), dona (acc. pl.), damus (we give)." },
        { q: "Order the first-declension singular cases: nominative, genitive, dative, accusative, ablative.", type: "order", items: ["puellam", "puellae (of)", "puella", "puellā", "puellae (to)"], answer: ["puella", "puellae (of)", "puellae (to)", "puellam", "puellā"], hint: "Nominative first; accusative ends in -m.", why: "puella, puellae, puellae, puellam, puellā." },
        { q: "To dissent is to...", options: ["disagree", "agree", "sing together", "go before"], answer: "disagree", hint: "Dis (apart) + sentire (feel).", why: "To feel apart: disagree." },
        { q: "A consensus is...", options: ["general agreement", "a quarrel", "a count of people", "a secret"], answer: "general agreement", hint: "Con + sentire: feeling together.", why: "Shared opinion." },
        { q: "Of 30 students, 18 support a proposal and the rest oppose it. How many more proponents than opponents are there?", type: "number", answer: 6, hint: "Find the opponents first.", why: "30 − 18 = 12 opponents; 18 − 12 = 6." },
      ],
      challenge: [
        { q: "Analogy — antagonist : opposes :: proponent : ___", options: ["supports", "delays", "shares", "rules"], answer: "supports", hint: "Pro + ponere: put forward.", why: "An antagonist opposes; a proponent puts forward and supports." },
        { q: "Words in context: 'The new rule proved so controversial that the town meeting lasted until midnight.' Controversial means...", options: ["causing strong disagreement", "widely accepted", "very old", "boring"], answer: "causing strong disagreement", hint: "Contra + vertere: turned against.", why: "A long meeting suggests heated dispute." },
        { q: "Words in context: 'Her antipathy toward cruelty was evident; she could not watch even a fictional villain mistreat an animal.' Antipathy means...", options: ["strong dislike", "affection", "indifference", "curiosity"], answer: "strong dislike", hint: "Anti + pathos (feeling).", why: "Feeling against: aversion." },
        { q: "Translate into Latin: 'The farmer's daughter gives roses to the girls.'", options: ["Filia agricolae puellis rosas dat.", "Filia agricolae puellas rosas dat.", "Filiae agricola puellis rosas dant.", "Filia agricolam puellis rosam dat."], answer: "Filia agricolae puellis rosas dat.", hint: "Genitive for 'farmer's', dative for 'to the girls', accusative for 'roses'.", why: "Filia (nom.), agricolae (gen.), puellis (dat.), rosas (acc.), dat." },
      ],
      extend: "Read the parable of the Good Samaritan (Luke 10:25–37, World English Bible). Write a paragraph analyzing the protagonist and showing how compassion drives the story; use four words from this lesson.",
      offline: "Decline 'rosa' (rose) aloud through all ten forms while tapping the table, then decline 'stella'. Explain it: tell a grown-up how you can tell the genitive singular puellae from the nominative plural puellae in a sentence.",
    },
    // ---------- Lesson 23 ----------
    {
      title: "Measuring words", icon: "📏",
      learn: [
        { say: "This week's mathematics is measurement, and Latin named many of our units. <b>Uncia</b> meant a twelfth part; from it come both <b>inch</b> (a twelfth of a foot) and <b>ounce</b> (originally a twelfth of a Roman pound).", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><rect x='30' y='110' width='540' height='70' fill='#fde68a' stroke='#92400e' stroke-width='4'/><g stroke='#92400e' stroke-width='3'><line x1='75' y1='110' x2='75' y2='150'/><line x1='120' y1='110' x2='120' y2='150'/><line x1='165' y1='110' x2='165' y2='150'/><line x1='210' y1='110' x2='210' y2='150'/><line x1='255' y1='110' x2='255' y2='150'/><line x1='300' y1='110' x2='300' y2='160'/><line x1='345' y1='110' x2='345' y2='150'/><line x1='390' y1='110' x2='390' y2='150'/><line x1='435' y1='110' x2='435' y2='150'/><line x1='480' y1='110' x2='480' y2='150'/><line x1='525' y1='110' x2='525' y2='150'/></g><text x='300' y='80' font-size='28' font-weight='800' text-anchor='middle' fill='#222'>1 foot = 12 inches</text><text x='52' y='220' font-size='22' text-anchor='middle' fill='#92400e'>1</text><text x='300' y='230' font-size='26' font-weight='800' text-anchor='middle' fill='#92400e'>uncia = one twelfth</text><text x='548' y='220' font-size='22' text-anchor='middle' fill='#92400e'>12</text></svg>" } },
        { say: "More measuring roots: <b>mens</b> measure, <b>grad/gress</b> step, <b>pond/pend</b> weigh or hang, and <b>libr</b> balance or pound.", show: { type: "table", rows: [["Root", "Meaning", "Words"], ["mens", "measure", "dimension, immense, commensurate"], ["grad / gress", "step, go", "gradual, degree, digress, ingredient"], ["pond / pend", "weigh, hang", "ponder, ponderous, pendulum, impending"], ["libr", "balance, pound", "equilibrium, deliberate, lb."], ["mille passus", "a thousand paces", "mile"]] } },
        { say: "Why is pound abbreviated <b>lb.</b>? Because it stands for Latin <b>libra</b>, a pound and also a balance scale. To <b>deliberate</b> is to weigh a decision carefully; <b>equilibrium</b> is a state of balance.", show: { type: "big", text: "lb. = libra\nequilibrium = equal balance" } },
        { say: "Weighing the mind: to <b>ponder</b> is to weigh in thought; <b>ponderous</b> means heavy and slow; a <b>preponderance</b> is a greater weight or number. Things that <b>impend</b> 'hang over' us.", show: { type: "list", items: ["ponder = weigh mentally", "ponderous = heavy, labored", "preponderance = the greater part by weight or number", "impending = about to happen, hanging over", "commensurate = of matching measure: 'pay commensurate with skill'", "digress = step aside from the main subject"] } },
        { say: "Grammar: the full <b>second declension</b>, masculine and neuter. Note that neuter nominative and accusative are always identical, and neuter plurals end in -a.", show: { type: "table", rows: [["Case", "equus (m.) sg", "pl", "donum (n.) sg", "pl"], ["Nom.", "equus", "equi", "donum", "dona"], ["Gen.", "equi", "equorum", "doni", "donorum"], ["Dat.", "equo", "equis", "dono", "donis"], ["Acc.", "equum", "equos", "donum", "dona"], ["Abl.", "equo", "equis", "dono", "donis"]] } },
        { say: "A Roman pace, passus, was a double step, about five Roman feet. A thousand paces made a Roman mile, a little shorter than the modern mile of 5,280 feet.", show: { type: "big", text: "1,000 passus × 5 feet\n≈ 5,000 Roman feet" } },
      ],
      practice: [
        { q: "How many inches are in 3 feet?", type: "number", answer: 36, hint: "12 inches per foot.", why: "3 × 12 = 36." },
        { q: "Inch and ounce both come from uncia, which means...", options: ["a twelfth part", "a thousand", "a balance", "a step"], answer: "a twelfth part", hint: "How many inches make a foot?", why: "Uncia = one twelfth." },
        { q: "The abbreviation lb. stands for the Latin word...", options: ["libra", "liber", "lux", "locus"], answer: "libra", hint: "A balance, and a pound.", why: "Libra: pound." },
        { q: "A Roman mile was 1,000 paces of 5 Roman feet each. How many Roman feet is that?", type: "number", answer: 5000, hint: "Multiply.", why: "1,000 × 5 = 5,000." },
        { q: "To digress is to...", options: ["stray from the main topic", "go straight to the point", "measure", "weigh"], answer: "stray from the main topic", hint: "Di (apart) + gress (step).", why: "Step aside." },
        { q: "An ingredient is literally something that...", options: ["steps in", "weighs a pound", "hangs down", "measures"], answer: "steps in", hint: "In + gred.", why: "It goes into the mixture." },

        { q: "Which form is dative singular of 'donum'?", options: ["dono", "doni", "donum", "donis"], answer: "dono", hint: "To or for the gift.", why: "Dative singular: -o." },

        { q: "Put these in order from smallest to largest: mile, inch, foot, yard.", type: "order", items: ["mile", "inch", "foot", "yard"], answer: ["inch", "foot", "yard", "mile"], hint: "A yard is 3 feet.", why: "Inch < foot < yard < mile." },

      challenge: [
        { q: "Analogy — ponderous : heavy :: immense : ___", options: ["huge", "light", "quick", "balanced"], answer: "huge", hint: "In (not) + mensus (measured): too large to measure.", why: "Ponderous means heavy; immense means immeasurably large." },
        { q: "Words in context: 'Her salary was not commensurate with her responsibilities; she managed forty people but earned less than her assistant.' Commensurate means...", options: ["proportionate, of matching measure", "higher", "secret", "late"], answer: "proportionate, of matching measure", hint: "Com + mensura: measured together.", why: "Her pay did not match the measure of her duties." },

    // ---------- Lesson 24 ----------
    {
      title: "Mottos and phrases", icon: "📜",
      learn: [
        { say: "Nations, schools and families have chosen Latin mottos for their brevity and dignity. You can now parse many of them yourself.", show: { type: "table", rows: [["Motto", "Translation", "Whose"], ["E pluribus unum", "Out of many, one", "Great Seal of the U.S."], ["Fiat lux", "Let there be light", "Genesis 1:3 in Latin"], ["Ora et labora", "Pray and work", "Benedictine monks"], ["Semper fidelis", "Always faithful", "U.S. Marine Corps"], ["Ad astra per aspera", "To the stars through difficulties", "Kansas"], ["Lux et veritas", "Light and truth", "Yale University"]] } },
        { say: "Parse <b>E pluribus unum</b>: e (out of) takes the ablative; pluribus is the ablative plural of plus, 'many'; unum is 'one'. Out of many states, one nation.", show: { type: "big", text: "E   pluribus   unum\nout of   many   one" } },
        { say: "<b>Ora et labora</b> uses imperatives, commands, of first-conjugation verbs: ora (pray!) and labora (work!). <b>Ad astra</b> uses ad with the accusative plural of astrum, star.", show: { type: "list", items: ["ora! labora! = pray! work! (singular commands)", "ad astra = to the stars (ad + accusative)", "per aspera = through rough things (per + accusative)", "Carpe diem = Seize the day (Horace, Odes 1.11)", "Pax vobiscum = Peace be with you"] } },
        { say: "Roots from mottos: <b>plur/plus</b> more, <b>temp/tempor</b> time, <b>di</b> day (dies), <b>luc/lum</b> light, <b>firm</b> strong, and <b>pac</b> peace.", show: { type: "table", rows: [["Root", "Meaning", "Words"], ["plur / plus", "more", "plural, plurality, surplus"], ["tempor", "time", "temporary, contemporary, extemporaneous"], ["di (dies)", "day", "diary, quotidian, per diem"], ["luc / lum", "light", "lucid, elucidate, translucent, illuminate"], ["firm", "strong", "affirm, infirm, firmament"], ["pac", "peace", "pacify, pacifist, Pacific"]] } },
        { say: "Three advanced words. <b>Quotidian</b> means daily, ordinary. <b>Extemporaneous</b> means spoken without preparation, 'out of the time'. To <b>elucidate</b> is to make clear, to bring into the light.", show: { type: "list", items: ["quotidian = quotidie, every day: ordinary", "extemporaneous = ex tempore: improvised", "elucidate = e + lux: shed light on, explain", "contemporary = living or happening at the same time", "Pacific = named 'peaceful' by Magellan for its calm waters"] } },
        { say: "Common phrases now in English: <b>status quo</b> (the existing state), <b>terra firma</b> (solid ground), <b>vice versa</b> (the order turned), <b>per se</b> (in itself), <b>bona fide</b> (in good faith).", show: { type: "big", text: "status quo · terra firma\nvice versa · per se" } },
      ],
      practice: [
        { q: "E pluribus unum means...", options: ["Out of many, one", "One for all", "Many are one", "Always faithful"], answer: "Out of many, one", hint: "E = out of; unum = one.", why: "Out of many (states), one (nation)." },
        { q: "In 'Ora et labora', ora and labora are...", options: ["commands", "nouns", "questions", "past tense"], answer: "commands", hint: "Pray! Work!", why: "They are imperatives." },
        { q: "What is the plural command for 'Work!' (to several people)?", options: ["Laborate!", "Labora!", "Laborant!", "Laboramus!"], answer: "Laborate!", hint: "Add -te.", why: "Plural imperative: labora + te." },
        { q: "Semper fidelis means...", options: ["always faithful", "seize the day", "out of many, one", "light and truth"], answer: "always faithful", hint: "Fid = faith.", why: "Semper (always) fidelis (faithful)." },
        { q: "A temporary bridge...", options: ["lasts only a short time", "lasts forever", "is made of light", "is peaceful"], answer: "lasts only a short time", hint: "Tempor.", why: "For a time only." },
        { q: "Mozart and Haydn were contemporaries. This means they...", options: ["lived at the same time", "were brothers", "wrote the same music", "never met"], answer: "lived at the same time", hint: "Con + tempor.", why: "Together in time." },
        { q: "A lucid explanation is...", options: ["clear", "confusing", "lengthy", "loud"], answer: "clear", hint: "Luc = light.", why: "Full of light: clear." },
        { q: "To pacify an angry crowd is to...", options: ["calm it", "anger it", "count it", "lead it away"], answer: "calm it", hint: "Pac = peace.", why: "Make peaceful." },
        { q: "Quotidian chores are...", options: ["everyday and ordinary", "rare", "dangerous", "ancient"], answer: "everyday and ordinary", hint: "Dies = day.", why: "Daily." },
        { q: "In an election, candidate A gets 14 votes, B gets 11 and C gets 9. A wins a plurality (the most votes) but not a majority of the 34 votes. By how many votes does A fall short of a majority (18)?", type: "number", answer: 4, hint: "More than half of 34 is at least 18.", why: "18 − 14 = 4." },
        { q: "Parse 'ad astra': astra is...", options: ["accusative plural of astrum", "nominative singular", "ablative plural", "a verb"], answer: "accusative plural of astrum", hint: "Ad takes which case? Neuter plurals end in -a.", why: "Ad + accusative; astrum, astra (n. pl.)." },
        { q: "Translate: 'Lux et veritas.'", options: ["Light and truth", "Peace and light", "Out of many, one", "Let there be light"], answer: "Light and truth", hint: "Veritas: verus = true.", why: "Lux (light) et (and) veritas (truth)." },
        { q: "Terra firma means...", options: ["solid ground", "the firm earth's sky", "a farm", "dry water"], answer: "solid ground", hint: "Terra + firma.", why: "Firm land." },
        { q: "Order the words: 'To the stars through difficulties'.", type: "order", items: ["aspera", "astra", "per", "Ad"], answer: ["Ad", "astra", "per", "aspera"], hint: "To — the stars — through — difficulties.", why: "Ad astra per aspera." },
      ],
      challenge: [
        { q: "Analogy — lucid : clear :: quotidian : ___", options: ["ordinary", "bright", "peaceful", "temporary"], answer: "ordinary", hint: "Daily things are...", why: "Lucid means clear; quotidian means everyday, ordinary." },
        { q: "Words in context: 'Asked to speak without notice, the senator delivered an extemporaneous address so polished that many assumed she had rehearsed it.' Extemporaneous means...", options: ["unprepared, improvised", "lengthy", "written", "dishonest"], answer: "unprepared, improvised", hint: "Ex tempore: out of the moment. 'Without notice'.", why: "Spoken on the spot." },
        { q: "Words in context: 'The professor's diagram elucidated a theory that had baffled the class for weeks.' Elucidated means...", options: ["made clear", "confused", "disproved", "copied"], answer: "made clear", hint: "E + lux: brought into light.", why: "To elucidate is to explain." },
        { q: "Translate into Latin: 'Girls, pray and work!' (girls addressed directly: puellae)", options: ["Puellae, orate et laborate!", "Puellae, ora et labora!", "Puella, orate et laborate!", "Puellae orant et laborant."], answer: "Puellae, orate et laborate!", hint: "Several people: plural commands end in -te.", why: "Plural imperatives orate and laborate." },
      ],
      extend: "Research the motto of your state, city or a school you admire. Translate it word by word, identify each word's case or form, and design a coat of arms with the motto on a ribbon.",
      offline: "Choose a family motto in Latin (from this lesson or of your own composition, e.g. 'Ora et labora') and write it on a card for the fridge. Explain it: parse your motto for a grown-up word by word and say why you chose it.",
    },

    // ---------- Lesson 25 ----------
    {
      title: "Everyday Latin: a.m., e.g., i.e.", icon: "🗓️",
      learn: [
        { say: "English writers use Latin abbreviations daily, often without knowing their meaning. Learn the full Latin behind each.", show: { type: "table", rows: [["Abbreviation", "Latin", "Meaning"], ["a.m. / p.m.", "ante / post meridiem", "before / after midday"], ["A.D.", "anno Domini", "in the year of the Lord"], ["etc.", "et cetera", "and the rest"], ["e.g.", "exempli gratia", "for the sake of example"], ["i.e.", "id est", "that is"], ["vs.", "versus", "against"], ["P.S.", "post scriptum", "written after"], ["N.B.", "nota bene", "note well"]] } },
        { say: "Writers often confuse <b>e.g.</b> and <b>i.e.</b>. Use e.g. to introduce examples from a larger set; use i.e. to restate exactly what you mean.", show: { type: "list", items: ["I enjoy citrus fruits, e.g., lemons and limes. (some examples)", "I visited the capital, i.e., Washington. (that is: the only one)", "More: lb. = libra (pound); No. = numero (by number)", "cf. = confer (compare); et al. = et alii (and others)"] } },
        { say: "Latin also gave us the vocabulary of money. Roman wealth was once counted in cattle, <b>pecus</b>, hence <b>pecunia</b>, money.", show: { type: "table", rows: [["Latin", "Meaning", "English"], ["pecunia (from pecus, cattle)", "money", "pecuniary, impecunious (penniless)"], ["Moneta", "title of Juno, at whose temple coins were minted", "money, monetary, mint"], ["salarium (from sal, salt)", "an allowance or stipend (why it is named for salt is debated)", "salary"], ["debeo, debitum", "owe", "debt, debit, due, duty"], ["fiscus", "basket; treasury", "fiscal, confiscate"]] } },
        { say: "<b>Confiscate</b> literally means 'to put into the treasury basket': con + fiscus. When a teacher confiscates a toy, it goes into her 'treasury'.", show: { type: "big", text: "confiscate = con + fiscus\ninto the treasury" } },
        { say: "Grammar: the full present tense of <b>sum</b>, 'I am'. It is irregular, so memorize it as a chant.", show: { type: "table", rows: [["Person", "Singular", "Plural"], ["1st", "sum — I am", "sumus — we are"], ["2nd", "es — you are", "estis — you (all) are"], ["3rd", "est — he, she, it is", "sunt — they are"]] } },
        { say: "With sum, the noun after the verb is <b>nominative</b>, not accusative, because it names the same person as the subject.", show: { type: "table", rows: [["Latin", "English"], ["Agricolae sumus.", "We are farmers."], ["Nauta es.", "You are a sailor."], ["Puellae bonae estis.", "You (all) are good girls."], ["Pecunia non est magna.", "The money is not great."]] } },
      ],
      practice: [
        { q: "What does 'e.g.' stand for?", options: ["exempli gratia — for the sake of example", "id est — that is", "et cetera — and the rest", "ergo — therefore"], answer: "exempli gratia — for the sake of example", hint: "Examples.", why: "e.g. introduces examples." },
        { q: "Choose the correct abbreviation: 'The tallest mountain on Earth, ___ Everest, is in the Himalayas.'", options: ["i.e.", "e.g.", "etc.", "N.B."], answer: "i.e.", hint: "There is only one tallest mountain.", why: "i.e. restates exactly: that is, Everest." },
        { q: "Choose the correct abbreviation: 'Bring a fruit, ___ an apple or a pear.'", options: ["e.g.", "i.e.", "P.S.", "vs."], answer: "e.g.", hint: "Are apple and pear the only fruits?", why: "They are examples: e.g." },
        { q: "A.D. 476 means...", options: ["in the year of the Lord 476", "after death 476", "476 years ago", "476 before Christ"], answer: "in the year of the Lord 476", hint: "Anno Domini.", why: "Anno Domini: in the year of the Lord." },
        { q: "How many years passed from A.D. 476 to A.D. 2026?", type: "number", answer: 1550, hint: "Subtract.", why: "2026 − 476 = 1,550." },
        { q: "Impecunious means...", options: ["having little money", "very rich", "owning cattle", "honest"], answer: "having little money", hint: "Im (not) + pecunia.", why: "Without money." },
        { q: "The word 'mint' (where coins are made) comes from...", options: ["Moneta, a title of Juno", "the mint plant", "mens, mind", "minimus"], answer: "Moneta, a title of Juno", hint: "Rome's coins were struck at her temple.", why: "Moneta → Old English mynet → mint." },
        { q: "Salary comes from Latin sal, meaning...", options: ["salt", "silver", "sugar", "safe"], answer: "salt", hint: "Salarium.", why: "Salarium is derived from sal, salt; exactly why is debated." },
        { q: "Which form of sum means 'we are'?", options: ["sumus", "sunt", "estis", "sum"], answer: "sumus", hint: "-mus = we.", why: "sumus." },
        { q: "Translate: 'Nautae estis.'", options: ["You (all) are sailors.", "They are sailors.", "We are sailors.", "You are a sailor."], answer: "You (all) are sailors.", hint: "-tis.", why: "Estis: you plural." },
        { q: "Translate into Latin: 'I am a farmer.'", options: ["Agricola sum.", "Agricolam sum.", "Agricola est.", "Agricolae sumus."], answer: "Agricola sum.", hint: "Sum takes the nominative.", why: "Predicate nominative: agricola." },
        { q: "Order the forms of sum: I am, you are, he is, we are, you all are, they are.", type: "order", items: ["sunt", "est", "sum", "estis", "es", "sumus"], answer: ["sum", "es", "est", "sumus", "estis", "sunt"], hint: "Start with 'I am'.", why: "sum, es, est, sumus, estis, sunt." },
        { q: "Confiscate originally meant to...", options: ["put into the treasury", "count cattle", "pay a salary", "owe money"], answer: "put into the treasury", hint: "Con + fiscus.", why: "Seized for the treasury." },
        { q: "A fiscal year concerns...", options: ["finances and budgets", "fishing", "farming", "holidays"], answer: "finances and budgets", hint: "Fiscus = treasury.", why: "Fiscal: relating to public money." },
      ],
      challenge: [
        { q: "Analogy — e.g. : example :: i.e. : ___", options: ["restatement", "addition", "comparison", "warning"], answer: "restatement", hint: "What does id est do?", why: "e.g. introduces examples; i.e. restates precisely." },
        { q: "Words in context: 'The impecunious poet traded verses for bread and slept in a friend's attic.' The poet was...", options: ["poor", "famous", "lazy", "rich"], answer: "poor", hint: "Trading verses for bread.", why: "Impecunious: lacking money." },
        { q: "Translate into Latin: 'We are not sailors; we are farmers.'", options: ["Nautae non sumus; agricolae sumus.", "Nautas non sumus; agricolas sumus.", "Nauta non sum; agricola sum.", "Nautae non sunt; agricolae sunt."], answer: "Nautae non sumus; agricolae sumus.", hint: "Plural nominatives; sumus for 'we are'; non for 'not'.", why: "Predicate nominatives with sumus." },
        { q: "Words in context: 'The dispute was purely pecuniary; no one questioned his honesty, only the amount he was owed.' Pecuniary means...", options: ["relating to money", "relating to honesty", "violent", "legal"], answer: "relating to money", hint: "Pecunia.", why: "Concerned with money." },
      ],
      extend: "Read about Roman coins (the denarius and sestertius) and the temple of Juno Moneta. If a Roman worker earned 225 denarii a year, how much did he earn in 8 years? Write a paragraph tracing the path from Moneta to 'money' and 'mint'.",
      offline: "Collect five real uses of Latin abbreviations (on clocks, in books, on food labels) and write each in full Latin. Explain it: teach a grown-up the difference between e.g. and i.e. with your own two example sentences.",
    },
    // ---------- Lesson 26 ----------
    {
      title: "Review: adjectives that agree", icon: "🌐",
      learn: [
        { say: "Latin adjectives of the first and second declensions have three genders. Learn <b>bonus, bona, bonum</b>, 'good', as your model.", show: { type: "table", rows: [["Case", "m. sg", "f. sg", "n. sg", "m. pl", "f. pl", "n. pl"], ["Nom.", "bonus", "bona", "bonum", "boni", "bonae", "bona"], ["Gen.", "boni", "bonae", "boni", "bonorum", "bonarum", "bonorum"], ["Dat.", "bono", "bonae", "bono", "bonis", "bonis", "bonis"], ["Acc.", "bonum", "bonam", "bonum", "bonos", "bonas", "bona"], ["Abl.", "bono", "bonā", "bono", "bonis", "bonis", "bonis"]] } },
        { say: "An adjective agrees with its noun in gender, number and case, but not necessarily in ending. <b>Agricola bonus</b>, a good farmer, pairs an -a noun with an -us adjective because agricola is masculine.", show: { type: "big", text: "agricola bonus ✔\nagricola bona ✗" } },
        { say: "Agreement in sentences.", show: { type: "table", rows: [["Latin", "English"], ["Puella bona rosam pulchram portat.", "The good girl carries a beautiful rose."], ["Agricola equo bono aquam dat.", "The farmer gives water to the good horse."], ["Filiae nautarum bonorum cantant.", "The daughters of the good sailors sing."]] } },
        { say: "Geography uses adjective roots: <b>latus</b> wide gives latitude; <b>longus</b> long gives longitude; <b>altus</b> high or deep gives altitude.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><circle cx='170' cy='160' r='120' fill='#dbeafe' stroke='#1d4ed8' stroke-width='4'/><g fill='none' stroke='#1d4ed8' stroke-width='2'><ellipse cx='170' cy='160' rx='120' ry='30'/><ellipse cx='170' cy='100' rx='104' ry='22'/><ellipse cx='170' cy='220' rx='104' ry='22'/></g><g fill='none' stroke='#b45309' stroke-width='2'><ellipse cx='170' cy='160' rx='40' ry='120'/><ellipse cx='170' cy='160' rx='85' ry='120'/><line x1='170' y1='40' x2='170' y2='280'/></g><text x='330' y='110' font-size='26' font-weight='800' fill='#1d4ed8'>latitude</text><text x='330' y='140' font-size='20' fill='#333'>latus = wide (east–west lines)</text><text x='330' y='200' font-size='26' font-weight='800' fill='#b45309'>longitude</text><text x='330' y='230' font-size='20' fill='#333'>longus = long (north–south)</text></svg>" } },
        { say: "More adjective roots: <b>bon</b> good, <b>nov</b> new, <b>clar</b> clear.", show: { type: "list", items: ["bonus, bounty, bona fide", "novel (new), novice (a beginner), innovate, renovate", "clarify, clarity, declare (make clear)", "altitude, exalt (raise high); longevity (long life), elongate", "Caution: nov = new (novus) differs from novem = nine"] } },
        { say: "Parsing method for any adjective: find its noun, then confirm gender, number and case match. If two nouns are possible, the endings decide.", show: { type: "big", text: "adjective ↔ noun\ngender · number · case" } },

      practice: [
        { q: "Which adjective agrees with 'agricola' (masculine, nominative singular)?", options: ["bonus", "bona", "bonum", "boni"], answer: "bonus", hint: "Agricola is masculine despite its ending.", why: "Masculine nominative singular: bonus." },
        { q: "Which adjective agrees with 'dona' (neuter, accusative plural)?", options: ["bona", "bonas", "bonos", "bonum"], answer: "bona", hint: "Neuter plurals end in -a.", why: "Neuter acc. pl.: bona." },
        { q: "Which form is feminine genitive plural?", options: ["bonarum", "bonorum", "bonis", "bonas"], answer: "bonarum", hint: "First-declension genitive plural.", why: "-arum." },
        { q: "Translate: 'Puella bona rosam pulchram portat.'", options: ["The good girl carries a beautiful rose.", "The beautiful girl carries a good rose.", "The good girls carry beautiful roses.", "The girl carries a good, beautiful rose."], answer: "The good girl carries a beautiful rose.", hint: "Bona agrees with puella; pulchram with rosam.", why: "Match each adjective to the noun with the same case." },
        { q: "Choose the Latin for 'to the good horse'.", options: ["equo bono", "equum bonum", "equi boni", "equo bona"], answer: "equo bono", hint: "Dative singular masculine.", why: "Equo bono." },
        { q: "Choose the Latin for 'the good sailors' (subject).", options: ["nautae boni", "nautae bonae", "nautas bonos", "nauta bonus"], answer: "nautae boni", hint: "Nauta is masculine: nominative plural.", why: "Masculine nom. pl.: boni." },
        { q: "Latitude lines run...", options: ["east–west, measuring north or south", "north–south", "diagonally", "only at the poles"], answer: "east–west, measuring north or south", hint: "Like rungs on a ladder.", why: "Parallels of latitude measure distance from the equator." },
        { q: "The equator has latitude 0°. The North Pole has latitude...", type: "number", answer: 90, hint: "A quarter turn of a circle.", why: "90° north." },

      offline: "Make adjective-noun cards (agricola, puella, equus, donum; bonus/bona/bonum, magnus/magna/magnum) and pair them correctly in all three genders. Explain it: tell a grown-up why 'agricola bonus' is correct even though the endings do not match.",
