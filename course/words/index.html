    // ---------- Lesson 27 ----------
    {
      title: "Many, all, both, bend", icon: "🔀",
      learn: [
        { say: "Six roots of quantity and flexibility: Latin <b>multi</b> many and <b>omni</b> all; Greek <b>poly</b> many and <b>pan</b> all; Latin <b>ambi</b> both; and Latin <b>flex/flect</b> bend.", show: { type: "table", rows: [["Root", "Meaning", "Words"], ["multi", "many", "multitude, multilateral, multifarious"], ["omni", "all", "omniscient, omnipotent, omnivorous"], ["poly", "many (Greek)", "polygon, polyglot, polymath"], ["pan", "all (Greek)", "panorama, pantheon, panacea"], ["ambi", "both, around", "ambidextrous, ambivalent, ambiguous"], ["flex / flect", "bend", "inflexible, reflect, genuflect"]] } },
        { say: "Precise distinctions: <b>omniscient</b> means all-knowing; <b>omnipotent</b> all-powerful. A <b>polyglot</b> speaks many languages; a <b>polymath</b> has learned many subjects. A <b>panacea</b> is a supposed cure for all ills.", show: { type: "list", items: ["omniscient = omni + sciens (knowing)", "omnipotent = omni + potens (powerful)", "polyglot = poly + glotta (tongue)", "polymath = poly + mathe (learning)", "panacea = pan + akos (cure)", "omnibus = 'for all' — shortened to bus!"] } },
        { say: "<b>Ambivalent</b> means having mixed feelings, pulled both ways. <b>Ambiguous</b> means open to more than one interpretation. <b>Ambidextrous</b> means equally skilled with both hands (dexter = right hand).", show: { type: "big", text: "ambivalent = feelings both ways\nambiguous = meanings both ways" } },
        { say: "False friends: <b>pancake</b> is an English compound of pan (the cooking vessel) and cake. In <b>monopoly</b>, poly comes from polein, to sell: a monopoly is the sole right to sell. <b>Police</b> and <b>politics</b> come from polis, city.", show: { type: "big", text: "pancake ✗ pan (all)\nmonopoly = mono + polein (sell)" } },
        { say: "Grammar: <b>commands</b>. Singular imperative is the verb stem: ama! Plural adds -te: amate! Negate a statement with <b>non</b> before the verb.", show: { type: "table", rows: [["Latin", "English"], ["Ambula!", "Walk! (to one)"], ["Ambulate!", "Walk! (to many)"], ["Puella non cantat.", "The girl does not sing."], ["Specta stellas!", "Look at the stars!"]] } },
        { say: "Yes-or-no questions attach <b>-ne</b> to the first word. Answer <b>Ita</b> or <b>Ita vero</b> (yes) and <b>Minime</b> (no, not at all).", show: { type: "table", rows: [["Question", "Answer"], ["Cantatne puella?", "Ita, puella cantat."], ["Estne nauta bonus?", "Minime, nauta non est bonus."], ["Amasne rosas?", "Ita vero, rosas amo."]] } },
      ],
      practice: [
        { q: "An omniscient narrator...", options: ["knows everything about all characters", "knows nothing", "speaks many languages", "is very old"], answer: "knows everything about all characters", hint: "Omni + scient.", why: "All-knowing." },
        { q: "A polyglot...", options: ["speaks many languages", "draws many shapes", "eats everything", "is all-powerful"], answer: "speaks many languages", hint: "Poly + glot (tongue).", why: "Many tongues." },
        { q: "A polygon with 12 sides has how many angles?", type: "number", answer: 12, hint: "Every polygon has as many angles as sides.", why: "12 sides, 12 angles." },
        { q: "Ambidextrous means...", options: ["skilled with both hands", "right-handed", "left-handed", "clumsy"], answer: "skilled with both hands", hint: "Ambi + dexter.", why: "Both hands as 'right hands'." },
        { q: "She was ambivalent about moving. This means she...", options: ["had mixed feelings", "was thrilled", "refused", "had no feelings"], answer: "had mixed feelings", hint: "Ambi + valere: strong both ways.", why: "Pulled in two directions." },
        { q: "Which word does NOT contain Greek pan (all)?", options: ["pancake", "panorama", "pantheon", "panacea"], answer: "pancake", hint: "Which concerns a frying pan?", why: "Pancake = pan (vessel) + cake." },
        { q: "In 'monopoly', poly comes from polein, which means...", options: ["to sell", "many", "city", "all"], answer: "to sell", hint: "A monopoly is the sole right to...", why: "Mono (one) + polein (sell)." },
        { q: "To genuflect is to...", options: ["bend the knee", "bend a rule", "look back", "raise hands"], answer: "bend the knee", hint: "Genu (knee) + flect.", why: "Bending the knee in reverence." },
        { q: "What is the plural command for 'Sing!'?", options: ["Cantate!", "Canta!", "Cantant!", "Cantamus!"], answer: "Cantate!", hint: "Add -te.", why: "Canta + te." },
        { q: "Translate: 'Puella non ambulat.'", options: ["The girl does not walk.", "The girl walks.", "Walk, girl!", "Does the girl walk?"], answer: "The girl does not walk.", hint: "Non.", why: "Non negates the verb." },
        { q: "Translate: 'Cantatne nauta?'", options: ["Does the sailor sing?", "The sailor sings.", "Sing, sailor!", "The sailor does not sing."], answer: "Does the sailor sing?", hint: "-ne makes a question.", why: "Cantat + ne." },
        { q: "How would a Roman answer 'no' to 'Estne luna magna?' most emphatically?", options: ["Minime", "Ita", "Non est", "Sum"], answer: "Minime", hint: "Not at all.", why: "Minime: by no means." },
        { q: "An omnibus was a vehicle 'for all'. What modern word comes from it?", options: ["bus", "omelette", "ambulance", "taxi"], answer: "bus", hint: "Drop the first two syllables.", why: "Omnibus → bus." },
        { q: "An inflexible rule...", options: ["cannot be bent or changed", "changes daily", "is optional", "is ambiguous"], answer: "cannot be bent or changed", hint: "In + flex.", why: "Unbending." },
      ],
      challenge: [
        { q: "Analogy — omniscient : knowledge :: omnipotent : ___", options: ["power", "sight", "language", "hunger"], answer: "power", hint: "Potens.", why: "All-knowing vs all-powerful." },
        { q: "Words in context: 'The contract's wording was so ambiguous that both companies claimed it supported their position.' Ambiguous means...", options: ["open to more than one interpretation", "clear", "illegal", "very long"], answer: "open to more than one interpretation", hint: "Both sides read it their own way.", why: "Two meanings are possible." },
        { q: "Words in context: 'Leonardo da Vinci, painter, engineer, anatomist and inventor, is the archetypal polymath.' A polymath is...", options: ["a person learned in many fields", "a mathematician only", "a painter", "a person who speaks many languages"], answer: "a person learned in many fields", hint: "Poly + math (learning). Note the list.", why: "Many fields of learning." },
        { q: "Translate into Latin: 'Girls, sing and look at the stars!'", options: ["Puellae, cantate et spectate stellas!", "Puellae, canta et specta stellas!", "Puella, cantat et spectat stellas!", "Puellae cantant et stellas spectant."], answer: "Puellae, cantate et spectate stellas!", hint: "Several girls are addressed: plural commands in -te; stellas is accusative.", why: "Puellae (addressed), cantate and spectate (plural imperatives), stellas (object)." },

      ],
      extend: "Research a polymath (Leonardo da Vinci, Hildegard of Bingen or Benjamin Franklin). Write a one-page profile listing their fields, and use omnivorous, versatile and polymath correctly.",
      offline: "Play 'Latin commands' with a grown-up: give commands in Latin (Ambula! Canta! Specta lunam! Ambulate!) and answer -ne questions with Ita or Minime. Explain it: describe the difference between ambivalent and ambiguous with an example of each.",
    },
    // ---------- Lesson 28 ----------
    {
      title: "First, second, middle", icon: "🥇",
      learn: [
        { say: "Latin ordinal numbers are first- and second-declension adjectives, so they agree with their nouns like bonus, bona, bonum.", show: { type: "table", rows: [["Ordinal", "Meaning", "Ordinal", "Meaning"], ["primus", "first", "sextus", "sixth"], ["secundus", "second", "septimus", "seventh"], ["tertius", "third", "octavus", "eighth"], ["quartus", "fourth", "nonus", "ninth"], ["quintus", "fifth", "decimus", "tenth"]] } },
        { say: "<b>Secundus</b> comes from sequi, to follow: the second is 'the one following'. That verb gives a whole family of sequence words.", show: { type: "list", items: ["sequence, sequel, consecutive (following one after another)", "subsequent (following after), consequence", "non sequitur = 'it does not follow': an illogical remark", "second, secondary"] } },
        { say: "Primus gives words of firstness, and medius of middleness.", show: { type: "table", rows: [["Root", "Meaning", "Words"], ["prim", "first", "primary, primeval, primordial, prince (princeps)"], ["terti / quart", "third / fourth", "tertiary, quart, quarter, quartet"], ["medi", "middle", "median, mediate, intermediate, medieval, mediocre"]] } },
        { say: "<b>Primordial</b> means existing from the very beginning. <b>Mediocre</b>, literally 'halfway up the mountain', means only ordinary. <b>Medieval</b> describes the Middle Ages, medium aevum.", show: { type: "big", text: "primordial = from the first beginning\nmediocre = only middling" } },
        { say: "In mathematics, the <b>median</b> is the middle value of an ordered list.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><g font-size='34' font-weight='800' text-anchor='middle'><rect x='30' y='110' width='90' height='90' rx='12' fill='#eef2f7' stroke='#64748b' stroke-width='3'/><text x='75' y='168' fill='#333'>3</text><rect x='140' y='110' width='90' height='90' rx='12' fill='#eef2f7' stroke='#64748b' stroke-width='3'/><text x='185' y='168' fill='#333'>7</text><rect x='250' y='110' width='100' height='90' rx='12' fill='#d6f0ec' stroke='#0f766e' stroke-width='5'/><text x='300' y='168' fill='#0f4c45'>9</text><rect x='370' y='110' width='90' height='90' rx='12' fill='#eef2f7' stroke='#64748b' stroke-width='3'/><text x='415' y='168' fill='#333'>12</text><rect x='480' y='110' width='90' height='90' rx='12' fill='#eef2f7' stroke='#64748b' stroke-width='3'/><text x='525' y='168' fill='#333'>20</text></g><text x='300' y='70' font-size='26' font-weight='800' text-anchor='middle' fill='#222'>ordered list</text><text x='300' y='250' font-size='26' font-weight='800' text-anchor='middle' fill='#0f766e'>median = 9 (medius = middle)</text></svg>" } },
        { say: "Grammar in context: ordinals and family words in full sentences.", show: { type: "table", rows: [["Latin", "English"], ["Filia secunda agricolae aquam portat.", "The farmer's second daughter carries water."], ["Primus nauta stellas spectat.", "The first sailor looks at the stars."], ["Filio tertio dona damus.", "We give gifts to the third son."]] } },
      ],
      practice: [
        { q: "What does 'tertius' mean?", options: ["third", "fourth", "second", "tenth"], answer: "third", hint: "Tertiary.", why: "Tertius = third." },
        { q: "Order the ordinals from first to fifth.", type: "order", items: ["quartus", "primus", "quintus", "tertius", "secundus"], answer: ["primus", "secundus", "tertius", "quartus", "quintus"], hint: "Begin with prim-.", why: "primus, secundus, tertius, quartus, quintus." },
        { q: "Find the median of 4, 15, 8, 23, 11.", type: "number", answer: 11, hint: "Order the list first.", why: "4, 8, 11, 15, 23: the middle is 11." },
        { q: "Find the median of 30, 2, 18, 9, 41, 25, 7.", type: "number", answer: 18, hint: "Order seven numbers; the 4th is the middle.", why: "2, 7, 9, 18, 25, 30, 41: the median is 18." },
        { q: "Secundus derives from sequi, meaning...", options: ["to follow", "to cut", "to see", "to hold"], answer: "to follow", hint: "Sequence, sequel.", why: "The second follows the first." },
        { q: "Three consecutive days are...", options: ["days in a row", "random days", "holidays", "the first days of a month"], answer: "days in a row", hint: "Con + sequi: following together.", why: "One following another." },
        { q: "A non sequitur is a remark that...", options: ["does not follow logically", "follows perfectly", "is a sequel", "is a second opinion"], answer: "does not follow logically", hint: "It does not follow.", why: "An illogical jump." },
        { q: "A mediocre performance is...", options: ["only ordinary", "excellent", "terrible", "medieval"], answer: "only ordinary", hint: "Halfway up the mountain.", why: "Middling." },
        { q: "Primordial means...", options: ["existing from the very beginning", "second-rate", "royal", "middle"], answer: "existing from the very beginning", hint: "Primus + ordiri (begin).", why: "From the first beginning." },
        { q: "The word 'prince' comes from princeps, which means...", options: ["one who takes first place", "son of a king", "the second", "the middle"], answer: "one who takes first place", hint: "Primus + capere.", why: "Princeps: first + take." },
        { q: "Choose the Latin for 'the fourth daughter' (subject).", options: ["filia quarta", "filia quartus", "filiae quartae", "filium quartum"], answer: "filia quarta", hint: "Feminine nominative singular.", why: "Quarta agrees with filia." },
        { q: "Translate: 'Primus nauta stellas spectat.'", options: ["The first sailor looks at the stars.", "The sailor looks at the first stars.", "The first sailors look at the star.", "The sailor is first."], answer: "The first sailor looks at the stars.", hint: "Primus agrees with nauta.", why: "Primus (m. nom.) with nauta." },
        { q: "A mediator...", options: ["helps two sides reach agreement", "starts arguments", "comes first", "follows orders"], answer: "helps two sides reach agreement", hint: "Medius: in the middle.", why: "One who stands in the middle." },
        { q: "How many musicians are in a quartet and a quintet together?", type: "number", answer: 9, hint: "4 + 5.", why: "4 + 5 = 9." },
      ],
      challenge: [
        { q: "Analogy — primary : first :: tertiary : ___", options: ["third", "second", "fourth", "last"], answer: "third", hint: "Tertius.", why: "Primary is first; tertiary is third." },
        { q: "Words in context: 'The first storm flooded the road, and subsequent storms washed away the bridge entirely.' Subsequent means...", options: ["following later", "earlier", "smaller", "unrelated"], answer: "following later", hint: "Sub + sequi.", why: "Those that followed." },
        { q: "Translate into Latin: 'We give roses to the farmer's second daughter.'", options: ["Filiae secundae agricolae rosas damus.", "Filiam secundam agricolae rosas damus.", "Filia secunda agricolae rosas damus.", "Filiae secundae agricolam rosas damus."], answer: "Filiae secundae agricolae rosas damus.", hint: "'To the daughter' is dative; 'farmer's' is genitive.", why: "Filiae secundae (dat. sg.), agricolae (gen.), rosas (acc.), damus." },
        { q: "The median of five different whole numbers is 10, the smallest is 2 and the largest is 30. What is the smallest possible sum of all five?", type: "number", answer: 56, hint: "Make the 2nd and 4th numbers as small as the order allows; all five must be different.", why: "The 2nd must lie between 2 and 10: smallest is 3. The 4th must lie between 10 and 30: smallest is 11. So 2 + 3 + 10 + 11 + 30 = 56." },
      ],
      extend: "Read about the medieval trivium and quadrivium — the 'three roads' (grammar, logic, rhetoric) and 'four roads' (arithmetic, geometry, music, astronomy) of a classical education. Write which subjects you study today that match each.",
      offline: "With a grown-up, measure the heights of five family members or toys, order them and find the median. Explain it: tell the grown-up how secundus, sequence and consecutive are related, and why that makes 'second' a fitting word.",
    },

    // ---------- Lesson 29 ----------
    {
      title: "Pairs, odds, empty, full", icon: "⚖️",
      learn: [
        { say: "This week you study odds and evens. Latin <b>par</b> means equal, and in mathematics <b>parity</b> is whether a number is odd or even, that is, whether it splits into equal pairs.", show: { type: "svg", markup: "<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><text x='150' y='50' font-size='26' font-weight='800' text-anchor='middle' fill='#0f766e'>8: even</text><text x='450' y='50' font-size='26' font-weight='800' text-anchor='middle' fill='#b45309'>7: odd</text><g fill='#0f766e'><circle cx='90' cy='110' r='18'/><circle cx='90' cy='160' r='18'/><circle cx='90' cy='210' r='18'/><circle cx='90' cy='260' r='18'/><circle cx='150' cy='110' r='18'/><circle cx='150' cy='160' r='18'/><circle cx='150' cy='210' r='18'/><circle cx='150' cy='260' r='18'/></g><g fill='#b45309'><circle cx='390' cy='110' r='18'/><circle cx='390' cy='160' r='18'/><circle cx='390' cy='210' r='18'/><circle cx='450' cy='110' r='18'/><circle cx='450' cy='160' r='18'/><circle cx='450' cy='210' r='18'/><circle cx='520' cy='260' r='18'/></g><text x='300' y='300' font-size='22' text-anchor='middle' fill='#333'>par = equal: every counter has a partner</text></svg>" } },
        { say: "The par family: <b>pair</b> and <b>peer</b> (an equal) both descend from par, and so do <b>compare</b>, <b>parity</b> and <b>disparity</b> (inequality). Even <b>umpire</b> belongs here: Old French nonper, 'not equal', meant the odd third person who settles a tie.", show: { type: "list", items: ["par (golf: the 'equal' standard score), pair, peer", "compare = set side by side as equals", "parity = equality; odd/even status of a number", "disparity = a great difference, inequality", "umpire = a noumpere → an oumpere: the 'odd one' who judges"] } },
        { say: "Two Latin words look identical: <b>liber</b>, free, and <b>liber</b>, book. Each has its own English family.", show: { type: "table", rows: [["liber = free", "liber = book"], ["liberty, liberate", "library"], ["liberal (generous, free-minded)", "libretto (the 'little book' of an opera)"], ["deliver (set free, hand over)", "libel (from libellus, little book)"]] } },
        { say: "Roots of emptiness and fullness: <b>sol</b> alone (solus), <b>nihil</b> nothing, <b>vac</b> empty, and <b>plen/plet</b> full.", show: { type: "table", rows: [["Root", "Meaning", "Words"], ["sol (solus)", "alone", "solitude, desolate, sole, solitaire"], ["nihil, nil", "nothing", "nil, annihilate (reduce to nothing)"], ["vac", "empty", "vacant, vacuum, evacuate, vacuous"], ["plen / plet", "full, fill", "plenty, replete, deplete, complete"]] } },
        { say: "Composition workshop: translating English into Latin. Follow these five steps for every sentence.", show: { type: "list", items: ["1. Find the verb and its subject; choose the verb ending (-o, -s, -t, -mus, -tis, -nt).", "2. Put the subject in the nominative.", "3. Put the direct object in the accusative.", "4. 'Of' → genitive; 'to/for' → dative; after a preposition → its case.", "5. Make adjectives agree; place the verb last."] } },
        { say: "A worked example: 'The sailors give the queen's roses to the good girls.'", show: { type: "table", rows: [["English", "Role", "Latin"], ["the sailors", "subject, plural", "nautae"], ["give", "they give", "dant"], ["the roses", "object, plural", "rosas"], ["the queen's", "genitive", "reginae"], ["to the good girls", "dative plural", "puellis bonis"], ["Result", "", "Nautae rosas reginae puellis bonis dant."]] } },
      ],
      practice: [
        { q: "In mathematics, the parity of 47 is...", options: ["odd", "even"], answer: "odd", hint: "Can 47 be split into equal pairs?", why: "47 = 23 pairs + 1, so it is odd." },
        { q: "Is the sum of two odd numbers odd or even?", options: ["always even", "always odd", "sometimes odd"], answer: "always even", hint: "Each odd number has one counter without a partner.", why: "The two leftover counters pair with each other." },
        { q: "A peer is...", options: ["an equal", "a superior", "a servant", "a stranger"], answer: "an equal", hint: "Par.", why: "From par: a person of equal standing." },
        { q: "A disparity in wealth is...", options: ["a great inequality", "an equal share", "a pair of coins", "a tax"], answer: "a great inequality", hint: "Dis + par.", why: "Not equal." },
        { q: "A library holds...", options: ["books", "free people", "prisoners", "pairs"], answer: "books", hint: "Which liber?", why: "Liber = book." },
        { q: "Which word comes from liber = free, not liber = book?", options: ["liberate", "library", "libretto", "libel"], answer: "liberate", hint: "Setting free.", why: "Liberate: set free." },
        { q: "To annihilate is to...", options: ["destroy completely, reduce to nothing", "build", "free", "fill"], answer: "destroy completely, reduce to nothing", hint: "Ad + nihil.", why: "To bring to nothing." },
        { q: "A vacant house is...", options: ["empty", "full", "lonely", "new"], answer: "empty", hint: "Vac.", why: "Vacare: to be empty." },
        { q: "The pantry was replete with food. Replete means...", options: ["well filled", "empty", "cold", "locked"], answer: "well filled", hint: "Re + plet.", why: "Filled up." },
        { q: "To deplete supplies is to...", options: ["use them up", "fill them", "pair them", "free them"], answer: "use them up", hint: "De (away) + plere (fill): un-fill.", why: "Empty out." },
        { q: "Translate into Latin: 'The girls love the books.' (liber, libri: 2nd decl. masculine; accusative plural libros)", options: ["Puellae libros amant.", "Puella libros amat.", "Puellae libri amant.", "Puellae libros amat."], answer: "Puellae libros amant.", hint: "Plural subject; object accusative; -nt verb.", why: "Puellae (nom. pl.), libros (acc. pl.), amant." },
        { q: "Translate into Latin: 'We walk with the sailor to the farmhouse.'", options: ["Cum nautā ad villam ambulamus.", "Cum nautam ad villā ambulamus.", "Cum nautā ad villam ambulant.", "Nauta ad villam ambulat."], answer: "Cum nautā ad villam ambulamus.", hint: "Cum + ablative; ad + accusative; 'we' = -mus.", why: "Cum nautā (abl.), ad villam (acc.), ambulamus." },
        { q: "How many odd numbers are there from 1 to 49 inclusive?", type: "number", answer: 25, hint: "1, 3, 5, ... 49. Pair them up with the evens.", why: "From 1 to 49 the odds are 1, 3, ..., 49: (49 + 1) ÷ 2 = 25." },
        { q: "Put the composition steps in order.", type: "order", items: ["make adjectives agree", "find the verb and subject", "put the object in the accusative", "put the subject in the nominative"], answer: ["find the verb and subject", "put the subject in the nominative", "put the object in the accusative", "make adjectives agree"], hint: "Start with the verb.", why: "Verb and subject first, then cases, then agreement." },
      ],
      challenge: [
        { q: "Analogy — replete : full :: vacuous : ___", options: ["empty", "alone", "equal", "free"], answer: "empty", hint: "Vac.", why: "Replete means full; vacuous means empty — often of thought." },
        { q: "Words in context: 'After the factory closed, the once-busy town became desolate, its streets silent and its shops boarded up.' Desolate means...", options: ["empty and forlorn", "crowded", "wealthy", "noisy"], answer: "empty and forlorn", hint: "De + solus: left alone.", why: "Abandoned and lonely." },
        { q: "Translate into Latin: 'The farmer's daughters give water to the tired horses.' (fessus, -a, -um = tired)", options: ["Filiae agricolae equis fessis aquam dant.", "Filia agricolae equos fessos aquam dat.", "Filiae agricolae equis fessis aquam dat.", "Filiae agricolarum equi fessi aquam dant."], answer: "Filiae agricolae equis fessis aquam dant.", hint: "To the horses = dative plural; adjectives agree; plural verb.", why: "Filiae (nom. pl.), agricolae (gen.), equis fessis (dat. pl.), aquam (acc.), dant." },
        { q: "Words in context: 'Critics dismissed the speech as vacuous: polished in delivery but empty of ideas.' Vacuous means...", options: ["lacking thought or substance", "very loud", "too long", "offensive"], answer: "lacking thought or substance", hint: "'Empty of ideas'.", why: "Vacuous: empty, especially of intelligence." },
      ],
      extend: "Investigate parity: prove, using pairs of counters or drawings, that (a) even + even is even, (b) odd + odd is even, (c) odd + even is odd. Write each proof in 3–4 sentences, using the words parity and pair.",
      offline: "Compose five original Latin sentences using the five-step method, then read them to a grown-up with your English translation. Explain it: tell the grown-up why 'liberty' and 'library' look related but descend from two different Latin words.",
    },

    { k: 0.86, grow: 1, dense: true },
    { k: 0.86, grow: 2, dense: true },
    { k: 0.8, grow: 2, dense: true },
    { k: 0.8, grow: 2, dense: true, scroll: true },
    { k: 0.74, grow: 2, dense: true, scroll: true },
  ];
  const upright = singleColumn();
  for (const s of steps) {
    host.style.setProperty("--k", s.k);
    host.classList.toggle("cr-tight", s.k < 0.9);
    host.classList.toggle("cr-dense", !!s.dense);
    if (s.grow && upright) host.style.maxHeight = s.grow > 1 ? "64vh" : "58vh";
    if (s.grow && !upright && main) main.style.gridTemplateColumns = s.grow > 1 ? "minmax(0, 1fr) minmax(260px, 1.45fr)" : "minmax(0, 1.2fr) minmax(260px, 1fr)";
    if (inner) inner.style.removeProperty("max-height");
    let o = over();
    if (o > 1 && s.scroll && inner && sayBox.offsetParent) {
      // Last resort: the explanation scrolls inside the bubble, never the page.
      const lh = parseFloat(getComputedStyle(inner).lineHeight) || 20;
      const room = inner.offsetHeight - o - 2;
      inner.style.maxHeight = `${Math.max(Math.round(lh * 2.2), room)}px`;
      o = over();
    }
    if (o <= 1) break;
  }
  const choiceList = $("[data-list]", host);
  if (over() > 1 && typeof choiceList?._crCompact === "function") {
    const compact = choiceList._crCompact;
    choiceList._crCompact = null;
    if (compact()) return fitPanel();
  }
  fadeCue(inner);
}

function fitStage() {
  const box = $(".cr-show", stage);
  const body = box && $(".cr-body", box);
  if (!body) return;
  const fits = () => body.scrollHeight <= body.clientHeight + 1 && body.scrollWidth <= body.clientWidth + 1;
  box.style.setProperty("--s", 1);
  if (!fits()) {
    let lo = 0.45, hi = 1;
    for (let n = 0; n < 7; n++) {
      const mid = (lo + hi) / 2;
      box.style.setProperty("--s", mid);
      if (fits()) lo = mid;
      else hi = mid;
    }
    box.style.setProperty("--s", lo);
  }
  // A long, flat table (a few rows, many columns) that is still too wide is turned on its side.
  const table = $(".cr-table", body);
  if (table && !table.dataset.turned && body.scrollWidth > body.clientWidth + 1 && table.rows.length < (table.rows[0]?.cells.length || 0)) {
    const grid = [...table.rows].map((r) => [...r.cells]);
    table.dataset.turned = "1";
    table.innerHTML = grid[0].map((_, c) => `<tr>${grid.map((r) => (r[c] ? r[c].outerHTML : "<td></td>")).join("")}</tr>`).join("");
    table.classList.add("cr-turned");
    return fitStage();
  }
  // Still too wide: tighter cells, and long words may hyphenate.
  if (table && !table.classList.contains("cr-squeeze") && body.scrollWidth > body.clientWidth + 1) {
    table.classList.add("cr-squeeze");
    return fitStage();
  }
  fadeCue(body);
}
addEventListener("resize", refit);
if (window.ResizeObserver) new ResizeObserver(() => requestAnimationFrame(fitStage)).observe(stage);
document.fonts?.ready?.then(refit);

// ---------- the stage ----------
// A slide or question picture: big text, emoji row, a small table, a list, bars, a passage, the lesson's own SVG,
// or (for questions without a picture) the question itself. `tag` is the progress label; `q` prints the question
// above a picture so it stays visible while hints are shown.
function show(visual, { tag = "", q = "" } = {}) {
  stage.innerHTML = "";
  const box = document.createElement("div");
  box.className = "cr-show";
  const v = visual || {};
  let html = "";
  if (v.type === "svg") html = `<div class="cr-svg">${v.markup}</div>`;
  else if (v.type === "emoji") html = `<div class="cr-emoji">${esc(v.text)}</div>`;
  else if (v.type === "table")
    html = `<table class="cr-table">${(v.rows || []).map((r, i) => `<tr>${r.map((c) => (i === 0 && v.header !== false ? `<th>${esc(c)}</th>` : `<td>${esc(c)}</td>`)).join("")}</tr>`).join("")}</table>`;
  else if (v.type === "list") html = `<ul class="cr-list">${(v.items || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
  else if (v.type === "bars") {
    const max = Math.max(...(v.values || []).map((x) => x[1]), 1);
    html = `<div class="cr-bars">${(v.values || []).map(([k, n]) => `<div><span style="height:${Math.round((n / max) * 100)}%"></span><b>${esc(n)}</b><small>${esc(k)}</small></div>`).join("")}</div>`;
  } else if (v.type === "passage") html = `<div class="cr-passage">${v.title ? `<h3>${esc(v.title)}</h3>` : ""}${String(v.text || "").split(/\n\n+/).map((p) => `<p>${esc(p)}</p>`).join("")}</div>`;
  else if (v.type === "prompt") html = `<div class="cr-prompt${len(v.text) > 160 ? " cr-long" : ""}">${String(v.text || "").replace(/<(?!\/?b>)[^>]*>/g, "")}</div>`;
  else html = `<div class="cr-big">${esc(v.text || "")}</div>`;
  const question = q ? `<div class="cr-q">${esc(q)}</div>` : "";
  const cap = v.caption ? `<p class="cr-cap">${esc(v.caption)}</p>` : "";
  box.innerHTML = `${tag ? `<p class="cr-tag">${tag}</p>` : ""}<div class="cr-body cr-${v.type || "big"}-body">${question}${html}${cap}</div>`;
  stage.appendChild(box);
  refit();
}

async function learn(lesson, my) {
  const slides = lesson.learn || [];
  let i = 0;
  return new Promise((resolve) => {
    const host = panel(`<div class="kt-steps"><button type="button" class="kt-step-btn" data-back aria-label="Back">◀</button><span class="kt-step-dots" data-dots></span><button type="button" class="kt-step-btn kt-step-next" data-next>Next ▶</button></div>`);
    const render = () => {
      if (my !== token) return;
      const s = slides[i];
      show(s.show);
      $("[data-dots]", host).innerHTML = slides.map((_, k) => `<i class="${k === i ? "on" : k < i ? "seen" : ""}"></i>`).join("") + `<small>Learn ${i + 1} of ${slides.length}</small>`;
      $("[data-back]", host).disabled = i === 0;
      $("[data-next]", host).textContent = i === slides.length - 1 ? "✏️ Practice" : "Next ▶";
      say(`${i === 0 ? `<b>${stop(esc(lesson.title))}</b> ` : ""}${s.say}`);
    };
    host.onclick = (event) => {
      if (event.target.closest("[data-back]") && i > 0) (i -= 1), render();
      else if (event.target.closest("[data-next]")) {
        if (i < slides.length - 1) (i += 1), render();
        else {
          VOICE.hush();
          resolve();
        }
      }
    };
    if (slides.length) render();
    else resolve();
  });
}

// One question; resolves with true if right on the first try.
// Make every attempt different: generator questions build fresh numbers, choices are shuffled.
const shuffled = (list) => {
  const out = [...list];
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
};
function fresh(q) {
  let made = q;
  if (typeof q.gen === "function") {
    try {
      made = { ...q, ...q.gen() };
    } catch (error) {
      console.error("question generator failed", error);
    }
  }
  if (made.options && !made.keepOrder) made = { ...made, options: shuffled(made.options) };
  if (made.items && !made.keepOrder) made = { ...made, items: shuffled(made.items) };
  return made;
}
// Draw a set: keep the first (warm-up) question, sample the rest from the bank, keep easy-to-hard roughly by position.
function drawSet(bank, n) {
  if (bank.length <= n) return bank;
  const picks = new Set([0]);
  while (picks.size < n) picks.add(1 + Math.floor(Math.random() * (bank.length - 1)));
  return [...picks].sort((a, b) => a - b).map((k) => bank[k]);
}

// Choice and ordering lists: short words stay as chips; sentence-length entries become a calm grid of cards.
function listClass(list) {
  const longest = Math.max(0, ...list.map(len));
  const total = list.reduce((a, o) => a + len(o), 0);
  if (longest > 34 || (list.length <= 4 && total > 110)) return "cr-cards cr-wide";
  if (longest > 14 || list.length > 4) return "cr-cards";
  return "";
}

// Questions missed on the first try are kept with the lesson's progress (at most 20, newest last) for the
// parent's weekly report and for review warm-ups in later lessons. `src` says where the question lives
// ({ lesson, bank, k }), so a review can ask it again (a generated question comes back with new numbers).
// One answered right on the first try later is taken off the list.
const srcKey = (src) => (src ? `${src.lesson}:${src.bank}:${src.k}` : "");
function remember(q, missed, src) {
  try {
    const id = src ? `l${src.lesson + 1}` : shell.current();
    const text = String(q.q || "").replace(/<[^>]*>/g, "").trim();
    if (!id || !text) return;
    const key = srcKey(src);
    const was = shell.progress()[id]?.missed || [];
    const rest = was.filter((m) => (key && m.src ? m.src !== key : m.q !== text));
    if (!missed && rest.length === was.length) return;
    const answer = Array.isArray(q.answer) && q.answerText == null ? q.answer.join(" → ") : String(q.answerText ?? q.answer);
    shell.mark(id, { missed: missed ? [...rest, { q: text, a: answer.replace(/<[^>]*>/g, ""), at: Date.now(), ...(key ? { src: key } : {}) }].slice(-20) : rest });
  } catch (error) {}
}

// Spaced review: up to three questions missed in EARLIER lessons of this course, at least a day ago,
// oldest first. Each is asked again at the start of the lesson; a first-try answer clears it.
const REVIEW_MAX = 3;
const REVIEW_GAP = 20 * 3600 * 1000;
function reviewFor(index) {
  const found = [];
  const progress = shell.progress();
  for (let i = 0; i < index; i++)
    for (const m of progress[`l${i + 1}`]?.missed || []) {
      if (!m.src || Date.now() - m.at < REVIEW_GAP) continue;
      const [lesson, bank, k] = m.src.split(":");
      const q = COURSE.lessons[Number(lesson)]?.[bank]?.[Number(k)];
      if (q) found.push({ q, at: m.at, src: { lesson: Number(lesson), bank, k: Number(k) } });
    }
  return found.sort((a, b) => a.at - b.at).slice(0, REVIEW_MAX);
}

function ask(q0, label, my, src) {
  const q = fresh(q0);
  return new Promise((resolve) => {
    let tries = 0;
    const type = q.type || (q.options ? "choice" : q.items ? "order" : "number");
    const tag = `${esc(label)}${type === "order" ? ` · <span>tap in order, first to last</span>` : ""}`;
    if (q.show || q.big) show(q.show || { type: "big", text: q.big }, { tag, q: q.q });
    else show({ type: "prompt", text: q.q }, { tag });
    const finish = (right) => {
      if (my !== token) return;
      panel(`<div class="ap-buttons"><button type="button" class="primary" data-go>Next ▶</button></div>`);
      const why = q.why ? `<small>${esc(q.why)}</small>` : "";
      say(right ? `Correct. ${q.why ? esc(q.why) : ""}` : `The answer is <b>${stop(esc(Array.isArray(q.answer) && q.answerText == null ? q.answer.join(" → ") : q.answerText ?? q.answer))}</b> ${why}`);
      $("[data-panel]").onclick = (e) => e.target.closest("[data-go]") && resolve(tries === 1 && right);
    };
    const check = (value) => {
      if (my !== token) return false;
      tries += 1;
      const want = Array.isArray(q.answer) ? q.answer.join("|") : String(q.answer).trim().toLowerCase();
      const got = Array.isArray(value) ? value.join("|") : String(value).trim().toLowerCase();
      if (got === want) {
        if (tries === 1) remember(q, false, src);
        MUSIC.chime();
        window.OC?.count("problems solved");
        finish(true);
        return true;
      }
      MUSIC.oops();
      if (tries === 1) remember(q, true, src);
      if (tries === 1) say(`Not quite. ${q.hint ? esc(q.hint) : "Reconsider the question carefully."}`);
      else finish(false);
      return false;
    };
    // The question is already on the stage, so the owl reads it aloud with the bubble hidden.
    const prompt = () => say(esc(q.q), { quiet: true });
    if (type === "choice") {
      const host = panel(`<div class="ap-chips cr-choices ${listClass(q.options)}" data-list>${q.options.map((o, k) => `<button type="button" data-c="${k}">${esc(o)}</button>`).join("")}</div>`);
      // If even the tightest layout cannot hold these answers, print them on the stage as A, B, C…
      // (which may scroll there) and keep only large lettered buttons in the panel.
      const letter = (k) => String.fromCharCode(65 + k);
      const choiceList = $("[data-list]", host);
      choiceList._crCompact = () => {
        const list = choiceList, body = $(".cr-body", stage);
        // Only for genuinely long answer sets; short ones always fit the card layout.
        if (!list.isConnected || q.options.reduce((a, o) => a + len(o), 0) < 200) return false;
        if (!list || !body || q.options.length > 8) return false;
        const missed = new Set([...list.querySelectorAll(".cr-miss")].map((b) => b.dataset.c));
        list.className = "ap-chips cr-choices cr-letters";
        list.innerHTML = q.options.map((o, k) => `<button type="button" data-c="${k}" aria-label="${letter(k)}: ${esc(o).replace(/"/g, "&quot;")}" ${missed.has(String(k)) ? `disabled class="cr-miss"` : ""}>${letter(k)}</button>`).join("");
        body.insertAdjacentHTML("beforeend", `<ol class="cr-opts">${q.options.map((o, k) => `<li data-li="${k}" class="${missed.has(String(k)) ? "cr-miss" : ""}"><b>${letter(k)}</b><span>${esc(o)}</span></li>`).join("")}</ol>`);
        return true;
      };
      host.onclick = (e) => {
        const b = e.target.closest("[data-c]");
        if (!b || b.disabled) return;
        const ok = check(q.options[Number(b.dataset.c)]);
        if (!ok && my === token && b.isConnected) {
          b.disabled = true;
          b.classList.add("cr-miss");
          $(`.cr-opts [data-li="${b.dataset.c}"]`, stage)?.classList.add("cr-miss");
        }
      };
    } else if (type === "order") {
      let picked = [];
      const host = panel(`<div class="ap-chips cr-choices cr-ordering ${listClass(q.items)}" data-list></div><div class="ap-buttons cr-undo"><button type="button" data-undo>↺ Start over</button></div>`);
      const list = $("[data-list]", host);
      const draw = () => {
        list.innerHTML = q.items
          .map((o, k) => {
            const at = picked.indexOf(k);
            return `<button type="button" data-o="${k}" ${at >= 0 ? `disabled aria-pressed="true"` : ""}><i>${at >= 0 ? at + 1 : ""}</i><span>${esc(o)}</span></button>`;
          })
          .join("");
        $(".cr-undo", host).style.display = picked.length ? "" : "none";
        refit();
      };
      draw();
      host.onclick = (e) => {
        const b = e.target.closest("[data-o]");
        if (e.target.closest("[data-undo]")) (picked = []), draw();
        else if (b && !b.disabled) {
          picked.push(Number(b.dataset.o));
          draw();
          if (picked.length === q.items.length) {
            const value = picked.map((k) => q.items[k]);
            picked = [];
            if (!check(value) && my === token && list.isConnected) draw();
          }
        }
      };
    } else {
      const host = panel(`<div data-pad></div>`);
      numpad($("[data-pad]", host), { onEnter: (v) => check(v), max: 7 });
    }
    prompt();
  });
}

const units = Object.fromEntries(
  COURSE.lessons.map((lesson, i) => [
    `l${i + 1}`,
    async () => {
      const my = token;
      const id = `l${i + 1}`;
      try {
        await learn(lesson, my);
        if (my !== token) return;
        let first = 0;
        const review = reviewFor(i);
        if (review.length) {
          say(`First, a short review: ${review.length === 1 ? "one question" : `${review.length} questions`} missed in an earlier lesson.`);
          await wait(1400);
          if (my !== token) return;
        }
        for (let k = 0; k < review.length; k++) {
          await ask(review[k].q, `🔁 Review ${k + 1} of ${review.length}`, my, review[k].src);
          if (my !== token) return;
        }
        const bankOf = (name) => (lesson[name] || []).map((q, k) => ({ q, k }));
        const practice = drawSet(bankOf("practice"), lesson.practiceCount || 12);
        for (let k = 0; k < practice.length; k++) {
          if (await ask(practice[k].q, `Practice ${k + 1} of ${practice.length}`, my, { lesson: i, bank: "practice", k: practice[k].k })) first += 1;
          if (my !== token) return;
        }
        const challenge = drawSet(bankOf("challenge"), lesson.challengeCount || 3);
        for (let k = 0; k < challenge.length; k++) {
          say("Challenge problem. Understand it, make a plan, carry it out, then check.");
          await wait(1200);
          if (my !== token) return;
          await ask(challenge[k].q, `⭐ Challenge ${k + 1} of ${challenge.length}`, my, { lesson: i, bank: "challenge", k: challenge[k].k });
          if (my !== token) return;
        }
        shell.mark(id, { done: true, first, of: practice.length, doneAt: Date.now() });
        show({ type: "big", text: `${first} / ${practice.length}`, caption: "practice problems correct on the first attempt" });
        panel(`<div class="ap-buttons"><button type="button" class="primary" data-explain>🗣️ Explain it</button><button type="button" data-off>📝 Task</button>${lesson.extend ? `<button type="button" data-extend>🚀 Go further</button>` : ""}<button type="button" data-again>↺ Again</button></div>`);
        say(`Lesson complete. Now explain the main idea in your own words.`);
        $("[data-panel]").onclick = (e) => {
          if (e.target.closest("[data-again]")) shell.go(id);
          if (e.target.closest("[data-explain]")) {
            show({ type: "list", items: [`Explain to a grown-up, in 3 or 4 clear sentences, the main idea of "${lesson.title}".`, "Give one example of your own.", "Say one question you still have."] });
            say("Explain the main idea in three or four clear sentences, give an example of your own, and ask one question you still have.");
          }
          if (e.target.closest("[data-extend]")) {
            show({ type: "list", items: [lesson.extend] });
            say(esc(lesson.extend), { quiet: true });
          }
          if (e.target.closest("[data-off]")) {
            show({ type: "list", items: [lesson.offline || "Tell a grown-up what you learned today, in 5 sentences."] });
            say(esc(lesson.offline || "Tell a grown-up what you learned today."), { quiet: true });
          }
        };
      } catch (error) {
        console.error(error);
      }
    },
  ]),
);

const how = Object.fromEntries(UNITS.map((u) => [u.id, { icon: COURSE.icon, title: u.label.replace(/^\d+\.\s*/, ""), steps: ["Learn: study the lesson slides.", "Practice: solve each problem; a first miss gives a hint, a second shows the full reasoning.", "Challenge: contest-level problems. Then explain the main idea in your own words."] }]));
const fromHash = /^#l\d+$/.test(location.hash) && UNITS.some((u) => u.id === location.hash.slice(1)) ? location.hash.slice(1) : null;
const shell = SHELL({
  unitWord: "Lesson",
  units: UNITS,
  how,
  start: fromHash || UNITS[0].id,
  onStop() {
    token += 1;
    $("[data-panel]").onclick = null;
  },
  subject: COURSE.subject,
  activity: COURSE.title,
  onUnit(id) {
    token += 1;
    VOICE.hush();
    units[id]();
  },
});

// The shell's "turn sideways" tip normally floats at the bottom of the screen, over the answer buttons.
// Here it sits at the foot of the stage (never over a control) and a tap dismisses it.
const placeTip = () => {
  const tip = $(".ap-turn");
  if (!tip) return;
  if (!tip.dataset.placed) {
    tip.dataset.placed = "1";
    tip.classList.add("cr-turn");
    tip.insertAdjacentHTML("beforeend", ` <b aria-hidden="true">✕</b>`);
    tip.setAttribute("role", "button");
    tip.addEventListener("click", () => tip.remove());
  }
  const r = stage.getBoundingClientRect();
  tip.style.bottom = "auto";
  tip.style.top = `${Math.max(4, Math.round(r.bottom - tip.offsetHeight - 10))}px`;
};
placeTip();
addEventListener("resize", placeTip);
if (window.ResizeObserver) new ResizeObserver(placeTip).observe(stage);

.cr-bars{flex:1 1 0;min-height:110px;max-height:340px;display:flex;align-items:flex-end;gap:12px;width:min(640px,96%)}
.cr-bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.cr-bars span{width:100%;background:var(--accent);border-radius:8px 8px 0 0}.cr-bars b{font-weight:900}.cr-bars small{font-weight:800;color:var(--muted);text-align:center;overflow-wrap:anywhere;font-size:max(12px,calc(14px * var(--s)))}
.cr-passage{max-width:44em;font:600 max(13.5px,calc(clamp(16px,2.1vw,20px) * var(--s)))/1.55 var(--sans);color:var(--ink);text-align:left}
.cr-passage h3{margin:0 0 6px;font-size:1.15em}.cr-passage p{margin:0 0 .6em}.cr-passage p:last-child{margin-bottom:0}
.cr-prompt{max-width:34em;font:700 max(16px,calc(clamp(19px,2.6vw,28px) * var(--s)))/1.45 var(--sans);color:var(--ink);text-align:center;overflow-wrap:break-word}
.cr-prompt.cr-long{text-align:left;font-weight:650}
.cr-q{max-width:38em;font:800 max(15px,calc(clamp(17px,2.2vw,24px) * var(--s)))/1.4 var(--sans);color:var(--ink);text-align:center;overflow-wrap:break-word}
.cr-q+*{margin-top:calc(4px * var(--s))}
.cr-cap{margin:0;color:var(--muted);font:800 max(13px,calc(clamp(14px,2vw,18px) * var(--s))) var(--sans);text-align:center}
.cr-fade{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 36px),transparent)}

/* panel (selectors carry .ap-panel.cr-panel so per-course style tweaks cannot undo the fit):
   children never squash (that hides text); content is centerd but never cut at the top */
.ap-panel.cr-panel{--k:1;--say:clamp(15.5px,2.3vw,21px);justify-content:flex-start}
.ap-panel.cr-panel>*{flex-shrink:0}
.ap-panel.cr-panel>:first-child:not(.cr-quiet),.ap-panel.cr-panel>.cr-quiet+*{margin-top:auto}.ap-panel.cr-panel>:last-child{margin-bottom:auto}
.ap-panel.cr-panel .ap-say{min-height:0;max-height:none;overflow:visible;font-size:max(14px,calc(var(--say) * var(--k)));line-height:1.38;max-width:36em;padding-top:12px;padding-bottom:12px}
.ap-panel.cr-panel .ap-say.cr-quiet{display:none}
.ap-panel.cr-panel .cr-say-in{display:block;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.ap-panel.cr-panel .cr-say-in small{display:block;margin-top:.3em}
.ap-panel.cr-panel.cr-tight .ap-say{padding-top:8px;padding-bottom:8px}

/* answer buttons: short answers are chips; long ones are cards in a grid; ordering shows the position picked */
.ap-panel.cr-panel .cr-choices{width:100%;max-width:52em;gap:8px}
.ap-panel.cr-panel .cr-choices button{min-height:48px;font-size:max(14px,calc(17px * var(--k)));max-width:100%;white-space:normal;line-height:1.25;padding:8px 16px}
.ap-panel.cr-panel .cr-choices.cr-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:calc(8px * var(--k))}
.ap-panel.cr-panel .cr-choices.cr-wide{grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr))}
.ap-panel.cr-panel .cr-choices.cr-cards button{min-height:46px;border-radius:16px;padding:calc(9px * var(--k)) 14px;text-align:center;font-weight:750}
.ap-panel.cr-panel .cr-choices.cr-wide button{text-align:left;line-height:1.3}
.ap-panel.cr-panel.cr-tight .cr-choices.cr-cards button{padding-top:6px;padding-bottom:6px;min-height:44px}
.ap-panel.cr-panel .cr-choices button.cr-miss{opacity:.5;background:#f6e9e4;box-shadow:0 0 0 1px #e4b9a8;text-decoration:line-through;text-decoration-color:rgba(160,70,40,.45)}
.ap-panel.cr-panel .cr-ordering button{display:flex;align-items:center;justify-content:flex-start;gap:10px;text-align:left}
.ap-panel.cr-panel .cr-choices.cr-ordering.cr-cards{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.ap-panel.cr-panel.cr-dense .cr-choices.cr-cards:not(.cr-wide){grid-template-columns:repeat(auto-fit,minmax(min(100%,138px),1fr))}
.ap-panel.cr-panel.cr-dense .cr-choices.cr-ordering.cr-cards:not(.cr-wide) button{padding-left:8px;padding-right:8px;gap:7px}
.ap-panel.cr-panel .cr-ordering button i{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--paper,#f6efe4);box-shadow:inset 0 0 0 2px #e2d6c4;font:900 14px/1 var(--sans);font-style:normal;color:#fff}
.ap-panel.cr-panel .cr-ordering button[aria-pressed="true"]{opacity:1;background:var(--accent-soft);color:var(--ink);box-shadow:0 0 0 2px var(--accent);cursor:default}
.ap-panel.cr-panel .cr-ordering button[aria-pressed="true"] i{background:var(--accent);box-shadow:none}
.ap-panel.cr-panel .cr-ordering.cr-wide button span{flex:1}
.ap-panel.cr-panel .cr-ordering button span{text-align:left}
.ap-panel.cr-panel .cr-undo button{min-height:44px;font-size:15px;padding:0 16px}
@media (max-height:700px),(max-width:420px){.ap-panel.cr-panel .cr-choices.cr-cards button,.ap-panel.cr-panel .cr-ordering button{min-height:44px}.ap-panel.cr-panel .cr-choices{gap:6px}}

.ap-turn.cr-turn{pointer-events:auto;cursor:pointer;width:max-content;max-width:calc(100vw - 32px);white-space:normal;text-align:center;font-size:14px;padding:8px 14px}
.ap-turn.cr-turn b{margin-left:6px;opacity:.7}

/* lettered answers: the full texts on the stage, big A/B/C buttons in the panel */
.cr-opts{list-style:none;margin:0;padding:0;display:grid;gap:calc(8px * var(--s));width:100%;max-width:40em;text-align:left;font:650 max(13.5px,calc(clamp(15px,2vw,19px) * var(--s)))/1.4 var(--sans);color:var(--ink)}
.cr-opts li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:calc(8px * var(--s)) 12px;border-radius:14px;background:var(--accent-soft)}
.cr-opts li b{display:grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;background:var(--accent);color:#fff;font-weight:900}
.cr-opts li.cr-miss{opacity:.45;text-decoration:line-through}
.ap-panel.cr-panel .cr-choices.cr-letters{display:flex;flex-wrap:nowrap;justify-content:center;gap:10px}
.ap-panel.cr-panel .cr-choices.cr-letters button{flex:1 1 0;max-width:110px;min-height:52px;font-size:22px;font-weight:900;text-decoration:none}

/* tap targets stay at least 44 px even on short landscape phones */
.ap-panel.cr-panel .ap-buttons button,.ap-panel.cr-panel .kt-step-btn{min-height:46px}
@media (max-height:460px),(max-width:420px) and (max-height:720px){.ap-panel.cr-panel{--say:15.5px}.ap-panel.cr-panel .kt-keys button{min-height:44px !important}.ap-panel.cr-panel .kt-entry{min-height:40px !important}}
@media (max-height:460px){.ap-panel.cr-panel .ap-buttons button,.ap-panel.cr-panel .kt-step-btn{min-height:44px}.ap-panel.cr-panel .cr-choices button{min-height:44px}.cr-show{padding:8px 10px}.cr-tag{font-size:12.5px;padding:3px 10px}}
`;
document.head.appendChild(style);
</script>
</body>
</html>
