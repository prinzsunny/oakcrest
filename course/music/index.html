const INK = "#1f2937", BLUE = "#2563eb", ORANGE = "#ea580c", GREEN = "#16a34a", GRAY = "#6b7280", RED = "#dc2626", PURPLE = "#7c3aed", LB = "#dbeafe", LO = "#fed7aa", LG = "#dcfce7", YEL = "#fef9c3";

// ---- randomness ----
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const shuffle = (arr) => { const o = arr.slice(); for (let i = o.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; } return o; };
const pickN = (arr, n) => shuffle(arr).slice(0, n);
// Options list containing `answer` plus distinct distractors (in the order given), n in total.
const opts = (answer, distractors, n = 4) => { const out = [answer]; for (const d of distractors) { if (out.length >= n) break; if (!out.includes(d)) out.push(d); } return out; };
// Indefinite article ("an octave", "an eighth note"); cap = capitalise.
const art = (s, cap) => ((/^[aeio]/i.test(String(s)) || /^(8|11|18)\b/.test(String(s)) ? "an " : "a ").replace(/^a/, (m) => (cap ? m.toUpperCase() : m))) + s;
const ord = (n) => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th");

// ---- slides ----
const S = (say, show) => ({ say, show });
const cap = (o, caption) => (caption ? { ...o, caption } : o);

const emo = (text, caption) => cap({ type: "emoji", text }, caption);

// Closing "Explain it" slide (every lesson ends Learn with one).
const X = (prompt) => S(`<b>Explain it.</b> ${prompt}`, list(["Say it in 2–4 complete sentences.", "Give the reason or the evidence, not only the answer.", "Use the precise words from this lesson."], "Explain it — to a grown-up or in writing"));

// ---- questions ----
const add = (o, show) => (show ? { ...o, show } : o);
const N = (q, answer, hint, why, show) => add({ q, type: "number", answer, hint, why }, show);
const C = (q, options, answer, hint, why, show) => add({ q, options, answer, hint, why }, show);
const O = (q, answer, hint, why, show) => add({ q, type: "order", items: answer.slice().reverse(), answer, hint, why }, show);
const G = (gen) => ({ gen });
// Bank-driven choice generator: rows = [[prompt-key, answer], ...]; asks one row, distractors from other answers.
const bankQ = (rows, make) => G(() => { const r = pick(rows); const others = shuffle(rows.filter((x) => x[1] !== r[1]).map((x) => x[1])); const m = make(r); return { q: m.q, options: opts(r[1], others), answer: r[1], hint: m.hint, why: m.why, ...(m.show ? { show: m.show } : {}) }; });

// =====================================================================
// MUSIC THEORY CORE
// A pitch's staff position is its diatonic number d = octave*7 + letter index (C=0 … B=6). Middle C = C4 = 28.
// =====================================================================
const LET = "CDEFGAB";
const NAT = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const BASE = { treble: 30, bass: 18 }; // bottom line: E4 (treble), G2 (bass)
const letterOf = (d) => LET[((d % 7) + 7) % 7];
const octOf = (d) => Math.floor(d / 7);
const sciName = (d) => letterOf(d) + octOf(d);
const dOf = (s) => LET.indexOf(s[0]) + 7 * +s.slice(-1); // "C4" -> 28
const stepOf = (clef, d) => d - BASE[clef]; // 0 = bottom line, 1 = bottom space, …
const ACC = { "-2": "𝄫", "-1": "♭", 0: "", 1: "♯", 2: "𝄪" };
const accName = { "♭": "flat", "♯": "sharp", "♮": "natural" };
// Line/space wording for step s on a staff (0..8 inside the staff).
const placeOf = (s) => (s % 2 === 0 ? `line ${s / 2 + 1}` : `space ${(s + 1) / 2}`);
// Semitone value (pitch class + octave) of letter-with-accidental at diatonic d with alteration a.
const semis = (d, a = 0) => 12 * octOf(d) + NAT[letterOf(d)] + a;

// Major scale spelled correctly from a tonic (letter + alteration). Returns [{l, a, name}] for 8 degrees.
const MAJ = [0, 2, 4, 5, 7, 9, 11, 12];
function majorScale(tonic) {
  const l0 = LET.indexOf(tonic[0]), a0 = tonic.includes("♭") ? -1 : tonic.includes("♯") ? 1 : 0;
  const start = NAT[tonic[0]] + a0;
  return MAJ.map((iv, k) => {
    const l = LET[(l0 + k) % 7];
    let a = (((start + iv - NAT[l]) % 12) + 12) % 12; if (a > 6) a -= 12;
    return { l, a, name: l + ACC[a] };
  });
}
const KEYS = ["C", "G", "D", "A", "E", "B", "F♯", "F", "B♭", "E♭", "A♭", "D♭"];
const keySig = (k) => majorScale(k).slice(0, 7).filter((x) => x.a !== 0).map((x) => x.name);
const SHARP_ORDER = ["F♯", "C♯", "G♯", "D♯", "A♯", "E♯", "B♯"], FLAT_ORDER = ["B♭", "E♭", "A♭", "D♭", "G♭", "C♭", "F♭"];
const sigInOrder = (k) => { const s = keySig(k); return s.length && s[0].includes("♭") ? FLAT_ORDER.slice(0, s.length) : SHARP_ORDER.slice(0, s.length); };
const sigText = (k) => { const n = keySig(k).length; return n === 0 ? "no sharps or flats" : `${n} ${keySig(k)[0].includes("♭") ? "flat" : "sharp"}${n > 1 ? "s" : ""}`; };
const triad = (k) => { const s = majorScale(k); return [s[0].name, s[2].name, s[4].name]; };
const DEG = ["tonic", "supertonic", "mediant", "subdominant", "dominant", "submediant", "leading note"];

// Intervals: number from two diatonic numbers; quality from number + semitones.
const ivNum = (d1, d2) => Math.abs(d2 - d1) + 1;
const IVN = { 1: "unison", 2: "2nd", 3: "3rd", 4: "4th", 5: "5th", 6: "6th", 7: "7th", 8: "octave" };
function ivQuality(num, st) {
  const perf = { 1: 0, 4: 5, 5: 7, 8: 12 }, maj = { 2: 2, 3: 4, 6: 9, 7: 11 };
  if (num in perf) return st === perf[num] ? "perfect" : st === perf[num] + 1 ? "augmented" : st === perf[num] - 1 ? "diminished" : "?";
  return st === maj[num] ? "major" : st === maj[num] - 1 ? "minor" : st === maj[num] + 1 ? "augmented" : st === maj[num] - 2 ? "diminished" : "?";
}

// Durations measured in sixteenth notes (semiquavers).
const DUR = { w: 16, h: 8, q: 4, e: 2, s: 1 };
const durOf = (t) => DUR[t[0]] * (t.includes(".") ? 1.5 : 1);
const DNAME = { w: "whole note (semibreve)", h: "half note (minim)", q: "quarter note (crotchet)", e: "eighth note (quaver)", s: "sixteenth note (semiquaver)" };
const DPLUR = { w: "whole notes (semibreves)", h: "half notes (minims)", q: "quarter notes (crotchets)", e: "eighth notes (quavers)", s: "sixteenth notes (semiquavers)" };
const dname = (t) => (t.includes(".") ? "dotted " + DNAME[t[0]].replace("(", "(dotted ") : DNAME[t[0]]);
const dnames = (t) => (t.includes(".") ? "dotted " + DPLUR[t[0]].replace("(", "(dotted ") : DPLUR[t[0]]);

// ---- staff drawing ----
// Staff: 5 lines 20 apart; bottom line at y = yb; step s sits at y = yb - 10*s.
const GLYPH = { treble: "𝄞", bass: "𝄢" };
function staffLines(x1, x2, yb) { let o = ""; for (let i = 0; i < 5; i++) o += `M${x1} ${yb - 20 * i}H${x2}`; return `<path d='${o}' stroke='${INK}' stroke-width='2'/>`; }
// Clef glyph, calibrated so the treble curl circles the G line and the bass dots straddle the F line.
function clefGlyph(clef, x, yb) {
  return `<text x='${x}' y='${clef === "bass" ? yb - 8 : yb}' font-size='80' font-family="${MFONT}" fill='${INK}'>${GLYPH[clef]}</text>`;
}
function ledgers(x, s, yb) { let o = ""; for (let k = -2; k >= s; k -= 2) o += `M${x - 17} ${yb - 10 * k}h34`; for (let k = 10; k <= s; k += 2) o += `M${x - 17} ${yb - 10 * k}h34`; return o ? `<path d='${o}' stroke='${INK}' stroke-width='2'/>` : ""; }
// Accidental glyph centred on step s.
const accGlyph = (x, s, yb, a, col = INK) => `<text x='${x}' y='${yb - 10 * s + (a === "♭" ? 7 : 10.5)}' font-size='80' font-family="${MFONT}" text-anchor='middle' fill='${col}'>${a}</text>`;
// One note. dur token like "q", "h.", "e"; stem: "up" | "down" | auto; flags drawn unless beamed.
function noteGlyph(x, s, yb, dur, o = {}) {
  const col = o.col || INK, y = yb - 10 * s, hollow = dur[0] === "w" || dur[0] === "h";
  let g = ledgers(x, s, yb);

  const up = o.stem ? o.stem === "up" : s < 4;
  if (dur[0] !== "w") {
    const sx = up ? x + 10 : x - 10, sy2 = o.stemTo ?? (up ? y - 64 : y + 64);
    g += `<path d='M${sx} ${y + (up ? -2 : 2)}V${sy2}' stroke='${col}' stroke-width='2.5'/>`;
    if (!o.beamed && (dur[0] === "e" || dur[0] === "s")) {
      const n = dur[0] === "e" ? 1 : 2;
      for (let k = 0; k < n; k++) { const fy = sy2 + (up ? 12 * k : -12 * k); g += up ? `<path d='M${sx} ${fy}c4 14 18 18 14 36c0-12-6-18-14-22z' fill='${col}'/>` : `<path d='M${sx} ${fy}c4 -14 18 -18 14 -36c0 12-6 18-14 22z' fill='${col}'/>`; }
    }
  }
  if (dur.includes(".")) g += `<circle cx='${x + 19}' cy='${s % 2 === 0 ? y - 6 : y}' r='3.5' fill='${col}'/>`;
  if (o.acc) g += accGlyph(x - 30, s, yb, o.acc, col);
  if (o.lab) g += T(x, o.labY || Math.max(yb + 62, y + 36), o.lab, o.labSize || 22, o.labCol || BLUE);
  return g;
}

function restGlyph(x, yb, dur) {
  const t = dur[0];
  let g = "";
  if (t === "w") g = `<rect x='${x - 9}' y='${yb - 60}' width='18' height='9' fill='${INK}'/>`;
  else if (t === "h") g = `<rect x='${x - 9}' y='${yb - 49}' width='18' height='9' fill='${INK}'/>`;
  else if (t === "q") g = `<path d='M${x - 4} ${yb - 64}l10 13l-8 10l9 12c-8-4-14-1-9 8c-9-6-8-14 0-12l-9-11l8-9z' fill='${INK}' stroke='${INK}' stroke-width='2' stroke-linejoin='round'/>`;
  else { const n = t === "e" ? 1 : 2; g = `<path d='M${x + 6} ${yb - 52}L${x - 3} ${yb - (n === 1 ? 22 : 12)}' stroke='${INK}' stroke-width='3'/>`; for (let k = 0; k < n; k++) g += `<circle cx='${x - 4 + 3 * k}' cy='${yb - 50 + 12 * k}' r='4.5' fill='${INK}'/><path d='M${x - 4 + 3 * k} ${yb - 46 + 12 * k}q6 2 ${10 - 3 * k} -6' stroke='${INK}' stroke-width='2.5' fill='none'/>`; }
  if (dur.includes(".")) g += `<circle cx='${x + 16}' cy='${yb - 50}' r='3.5' fill='${INK}'/>`;
  return g;
}
// Key signature glyphs for key k on a clef at x; returns [markup, width].
const SHARP_STEPS = [8, 5, 9, 6, 3, 7, 4], FLAT_STEPS = [4, 7, 3, 6, 2, 5, 1];
function keyGlyphs(k, clef, x, yb) {
  if (!k) return ["", 0];
  const sig = keySig(k), flats = sig.length && sig[0].includes("♭"), steps = flats ? FLAT_STEPS : SHARP_STEPS, sh = clef === "bass" ? -2 : 0;
  let g = ""; sig.forEach((_, i) => (g += accGlyph(x + 14 + 15 * i, steps[i] + sh, yb, flats ? "♭" : "♯")));
  return [g, sig.length ? sig.length * 15 + 12 : 0];
}
const timeGlyph = (x, yb, t) => `<g font-family='Georgia,serif' font-weight='900' font-size='44' text-anchor='middle' fill='${INK}'><text x='${x}' y='${yb - 43}'>${t[0]}</text><text x='${x}' y='${yb - 3}'>${t[1]}</text></g>`;

// stave({clef, key, time, items, h, yb, x0, gap, end}) -> full SVG markup.

    C("A website states that the Parthenon was designed with the golden ratio. What is the best response?", ["Check the evidence: measurements are inconclusive and no ancient source says so", "Accept it because it is repeated so often", "Reject all websites", "Accept it because it sounds elegant"], "Check the evidence: measurements are inconclusive and no ancient source says so", "Is repetition evidence?", "Popularity is not evidence. The claim fails careful measurement and lacks ancient documentary support."),
    C("Classical Greek statues originally looked…", ["painted in color", "pure white", "covered in gold leaf only", "black"], "painted in color", "What have scientists found on their surfaces?", "Traces of pigment show the statues and temples were painted; the white is the result of weathering."),
    C("A veristic Roman portrait shows…", ["the sitter truthfully, including wrinkles and age", "an idealized young god", "only the eyes", "an abstract pattern"], "the sitter truthfully, including wrinkles and age", "'Verus' is Latin for true.", "Veristic portraits emphasize real, aged features — a value placed on experience and dignity."),

    G(() => { const h = pick([7, 8]) * pick([20, 25, 30]), n = h % 7 === 0 ? 7 : 8; return { q: `In a figure drawn ${n} heads tall, the whole figure is ${h} cm. How tall is one head, in cm?`, type: "number", answer: h / n, hint: "Divide the height by the number of heads.", why: `${h} ÷ ${n} = ${h / n} cm.`, meta: { kind: "check", value: h / n } }; }),

    C("Byzantine figures compared with Classical Greek figures are…", ["flatter and more frontal", "more muscular and three-dimensional", "always shown in contrapposto", "carved in marble"], "flatter and more frontal", "Think of the San Vitale mosaics.", "Byzantine art cared more for spiritual presence than for natural anatomy, so figures face us, flat and still."),

    G(() => { const y = pick([-447, -440, -480, -600, 79, 537, 547]); const c = y < 0 ? Math.floor((-y - 1) / 100) + 1 : Math.floor((y - 1) / 100) + 1; const ans = `${ord(c)} century ${y < 0 ? "BC" : "AD"}`; return { q: `In which century is the year ${y < 0 ? -y + " BC" : "AD " + y}?`, options: opts(ans, shuffle([`${ord(c + 1)} century ${y < 0 ? "BC" : "AD"}`, `${ord(Math.max(1, c - 1))} century ${y < 0 ? "BC" : "AD"}`, `${ord(c)} century ${y < 0 ? "AD" : "BC"}`])), answer: ans, hint: "Years 401–500 BC are the 5th century BC; AD 501–600 is the 6th century AD.", why: `${y < 0 ? -y + " BC" : "AD " + y} falls in the ${ans}.`, meta: { kind: "check", value: `${ord(y < 0 ? Math.ceil(-y / 100) : Math.ceil(y / 100))} century ${y < 0 ? "BC" : "AD"}` } }; }),

// ---------------------------------------------------------------- L13 (music): tones, semitones, accidentals
const ENH = [["C♯", "D♭"], ["D♯", "E♭"], ["F♯", "G♭"], ["G♯", "A♭"], ["A♯", "B♭"], ["E♯", "F"], ["B♯", "C"], ["F♭", "E"], ["C♭", "B"]];
L({
  n: 13, title: "Tones, semitones and accidentals", icon: "♯",
  learn: [
    S("On the keyboard, the distance from any key to the very next key — black or white — is a <b>semitone</b> (half step), the smallest step in Western music. Two semitones make a <b>tone</b> (whole step).", svg(keyboard({ mark: { 0: BLUE, 1: ORANGE, 4: BLUE, 6: ORANGE }, tags: { 0: "C", 1: "C♯", 4: "E", 6: "F♯" }, extra: T(300, 30, "C→C♯: semitone · E→F♯: tone", 20, GRAY), h: 280 }))),
    S("Between most neighboring white keys lies a black key, so they are a tone apart. But <b>E–F</b> and <b>B–C</b> have no black key between them: these white-key pairs are only a <b>semitone</b> apart. Twelve semitones make an octave.", svg(keyboard({ mark: { 4: ORANGE, 5: ORANGE, 11: ORANGE, 12: ORANGE }, extra: T(300, 30, "E–F and B–C: natural semitones", 20, ORANGE) }))),
    S("<b>Accidentals</b> alter a note. A <b>sharp</b> (♯) raises it a semitone; a <b>flat</b> (♭) lowers it a semitone; a <b>natural</b> (♮) cancels a sharp or flat. The sign is written before the note, on the same line or space.", svg(stave({ clef: "treble", items: [{ n: "F4", acc: "♯", lab: "F♯" }, { n: "B4", acc: "♭", lab: "B♭" }, { n: "B4", acc: "♮", lab: "B♮" }, { n: "C5", acc: "♯", lab: "C♯" }], gap: 105, x0: 30 }))),
    S("An accidental lasts <b>until the end of the bar</b>, for that pitch. In the next bar, the note returns to normal unless marked again. Composers sometimes add a reminder ('courtesy') accidental to prevent errors.", svg(stave({ clef: "treble", time: [4, 4], items: [{ n: "F4", acc: "♯", lab: "F♯" }, { n: "G4", lab: "G" }, { n: "F4", lab: "still F♯" }, { n: "E4", lab: "E" }, { bar: 1 }, { n: "F4", dur: "w", lab: "F♮ again" }], gap: 72, x0: 0, end: 1 }))),
    S("One key can have two names: the black key between C and D is both <b>C♯</b> and <b>D♭</b>. Such names are <b>enharmonic equivalents</b> — same sound, different spelling. Even white keys have them: E♯ is the same key as F.", tbl([["Key", "Sharp name", "Flat name"], ["between C and D", "C♯", "D♭"], ["between F and G", "F♯", "G♭"], ["between A and B", "A♯", "B♭"], ["the white key F", "E♯", "F (natural)"]])),
    S("The semitone is a physical ratio. Each semitone up multiplies the frequency by about 1.0595 (the twelfth root of 2), so twelve semitones exactly double it — the octave. Modern pianos use this <b>equal temperament</b>.", big("12 equal semitones = 1 octave = frequency × 2")),
    X("Explain why E to F is a semitone but F to G is a tone, using the layout of the keyboard as your evidence."),
  ],
  practice: [
    C("How many semitones make one tone?", ["2", "1", "3", "12"], "2", "A tone skips exactly one key.", "A tone (whole step) is two semitones (half steps)."),
    gSemis({ mode: "ts" }), gSemis({ mode: "ts" }), gSemis({ mode: "ts" }),
    gSemis({ max: 7 }), gSemis({ acc: true, max: 9 }), gSemis({ acc: true, max: 12 }),
    bankQ(ENH, (r) => ({ q: `Which note is the enharmonic equivalent of ${r[0]}?`, hint: "Find the key on the keyboard, then name it from the other side.", why: `${r[0]} and ${r[1]} are the same key: enharmonic equivalents.` })),
    bankQ(ENH.map(([a, b]) => [b, a]), (r) => ({ q: `Which note is the same key as ${r[0]} (enharmonic)?`, hint: "Same key, different letter.", why: `${r[0]} = ${r[1]}.` })),
    C("Which pair of white keys is only a semitone apart?", ["E and F", "F and G", "C and D", "G and A"], "E and F", "Which white keys have no black key between them?", "E–F and B–C have no black key between them, so they are semitones."),
    C("A sharp sign…", ["raises a note by a semitone", "lowers a note by a semitone", "cancels a flat only", "makes a note louder"], "raises a note by a semitone", "Sharp = up.", "♯ raises the pitch one semitone."),
    C("A natural sign…", ["cancels a previous sharp or flat", "raises a note", "lowers a note", "means play naturally loud"], "cancels a previous sharp or flat", "It restores the 'natural' white-key note.", "♮ cancels an accidental (or a key signature's sharp or flat) for that bar."),

// Mondrian-style grid: v full vertical lines, h full horizontal lines; some cells filled with primaries.
function mondrian(v, h, seed = 0) {
  const xs = [40], ys = [20];
  for (let i = 1; i <= v; i++) xs.push(40 + Math.round((520 * i) / (v + 1)) + ((i * 37 + seed) % 23) - 11);
  for (let j = 1; j <= h; j++) ys.push(20 + Math.round((260 * j) / (h + 1)) + ((j * 29 + seed) % 17) - 8);
  xs.push(560); ys.push(280);
  let g = "", k = 0;
  for (let i = 0; i < xs.length - 1; i++) for (let j = 0; j < ys.length - 1; j++) { const c = (i * 7 + j * 5 + seed) % 6; g += `<rect x='${xs[i]}' y='${ys[j]}' width='${xs[i + 1] - xs[i]}' height='${ys[j + 1] - ys[j]}' fill='${c === 0 ? "#d62828" : c === 2 ? "#1d4ed8" : c === 4 && k++ < 2 ? "#facc15" : "#f8f8f4"}'/>`; }
  g += xs.map((x) => `<path d='M${x} 20V280' stroke='#111' stroke-width='8'/>`).join("") + ys.map((y) => `<path d='M40 ${y}H560' stroke='#111' stroke-width='8'/>`).join("");
  return W(g, 300);
}

const periodOf = (y) => (y < 1750 ? "Baroque" : y < 1820 ? "Classical" : y < 1900 ? "Romantic" : "20th century");
L({

    S("Historians divide Western classical music into <b>periods</b> by style. The dates are approximate — styles change gradually — but they organize four centuries of music: <b>Baroque</b> (about 1600–1750), <b>Classical</b> (about 1750–1820), <b>Romantic</b> (about 1820–1900) and the <b>20th century</b>.", svg(timeline)),
    S("<b>Baroque</b>: ornate, energetic, built on a steady bass line and interweaving melodies (counterpoint). <b>Johann Sebastian Bach</b> (1685–1750) and <b>George Frideric Handel</b> (1685–1759) were born the same year, less than a month apart, in German towns about 130 km apart. Handel composed <b>Messiah</b> in 1741; it was first performed in Dublin in 1742. 1750, the year of Bach's death, conventionally ends the period.", tbl([["Composer", "Lived", "Known for"], ["J. S. Bach", "1685–1750", "Brandenburg Concertos, fugues, cantatas"], ["G. F. Handel", "1685–1759", "Messiah, Water Music"]])),
    S("<b>Classical</b>: clarity, balance and elegant melody, with forms such as the symphony and the sonata. <b>Joseph Haydn</b> (1732–1809) wrote 104 numbered symphonies; <b>Wolfgang Amadeus Mozart</b> (1756–1791) composed from early childhood and died at 35; <b>Ludwig van Beethoven</b> (1770–1827) carried the style into the Romantic age.", tbl([["Composer", "Lived", "Known for"], ["Haydn", "1732–1809", "symphonies, string quartets"], ["Mozart", "1756–1791", "operas, concertos, symphonies"], ["Beethoven", "1770–1827", "nine symphonies, 32 piano sonatas"]])),
    S("Beethoven began losing his hearing in his late twenties. By the first performance of his <b>Ninth Symphony</b> in 1824 he was almost completely deaf; he composed by inner hearing and knowledge of harmony. It is a striking case of skill built on understanding rather than on the senses alone.", big("Ninth Symphony, 1824 — composed by a deaf composer")),
    S("<b>Romantic</b>: personal emotion, rich harmony, larger orchestras and dazzling soloists. <b>Franz Schubert</b> (1797–1828) wrote over 600 songs; <b>Frédéric Chopin</b> (1810–1849) wrote almost entirely for the piano; <b>Pyotr Ilyich Tchaikovsky</b> (1840–1893) wrote ballets including Swan Lake and <b>The Nutcracker</b> (1892).", tbl([["Composer", "Lived", "Known for"], ["Schubert", "1797–1828", "songs (Lieder), the 'Unfinished' Symphony"], ["Chopin", "1810–1849", "nocturnes, waltzes, études"], ["Tchaikovsky", "1840–1893", "ballets, symphonies, concertos"]])),
    S("<b>Claude Debussy</b> (1862–1918) dissolved Romantic harmony into color and atmosphere; his <b>Prélude à l'après-midi d'un faune</b> (1894) is often called the beginning of modern music. Critics labeled him an 'Impressionist', after the painters — a label Debussy himself disliked. A label applied by others is a claim to test, not a fact about the artist.", big("Debussy, 1894: the door to modern music")),

    G(() => { const [a, b] = pickN(COMPOSERS.filter((c) => c[2] > 1700), 2).sort((x, y) => x[1] - y[1]); const overlap = Math.min(a[2], b[2]) - b[1]; if (overlap <= 0) return { q: `Mozart (1756–1791) and Haydn (1732–1809): for how many years were both alive, from Mozart's birth year to Mozart's death year?`, type: "number", answer: 35, hint: "Mozart's whole life fell inside Haydn's.", why: "1791 − 1756 = 35 years.", meta: { kind: "check", value: 1791 - 1756 } }; return { q: `${surname(a[0])} lived ${a[1]}–${a[2]}; ${surname(b[0])} lived ${b[1]}–${b[2]}. For how many years (counted from the later birth year to the earlier death year) were both alive?`, type: "number", answer: overlap, hint: "Overlap = earlier death year − later birth year.", why: `${Math.min(a[2], b[2])} − ${b[1]} = ${overlap} years.`, meta: { kind: "check", value: Math.min(a[2], b[2]) - Math.max(a[1], b[1]) } }; }),
    C("Which two major composers were both born in 1685?", ["Bach and Handel", "Haydn and Mozart", "Chopin and Schubert", "Mozart and Beethoven"], "Bach and Handel", "Both Baroque, both German-born.", "J. S. Bach and G. F. Handel were both born in 1685 in Germany."),
    C("How did Beethoven compose his late works, including the Ninth Symphony?", ["by inner hearing and his knowledge of harmony, being almost totally deaf", "by listening to an orchestra rehearse each bar", "by copying Mozart", "he did not write them"], "by inner hearing and his knowledge of harmony, being almost totally deaf", "What happened to his hearing?", "Beethoven's hearing declined from his late twenties; by 1824 he was nearly deaf, composing from inner hearing."),

    C("Debussy's music was labeled 'Impressionist'. What did Debussy think of the label?", ["he disliked it", "he invented it", "he painted Impressionist pictures", "he never heard it"], "he disliked it", "A label from critics, borrowed from painting.", "Debussy objected to the label; it is a critics' comparison with painting, useful but not his own description."),

    G(() => { const p = pick(COMPOSERS.filter((c) => c[2] - c[1] < 60)); return { q: `${surname(p[0])} was born in ${p[1]} and died in ${p[2]}. Roughly how many years did he live? (Use death year − birth year.)`, type: "number", answer: p[2] - p[1], hint: "Subtract.", why: `${p[2]} − ${p[1]} = ${p[2] - p[1]} — a short life for a great body of work.`, meta: { kind: "span", name: p[0] } }; }),

    S("<b>Katsushika Hokusai</b> (1760–1849), a Japanese artist, made <b>The Great Wave off Kanagawa</b> (about 1831) as a color <b>woodblock print</b> in his series <b>Thirty-six Views of Mount Fuji</b>. A huge clawing wave dwarfs three boats while tiny Mount Fuji sits calmly in the distance.", passage("Woodblock printing", "The artist drew the design; a carver cut it into blocks of cherry wood, one block for each color; a printer inked the blocks and pressed paper onto them by hand, one color at a time. Thousands of copies could be made, so the prints were affordable — and Hokusai's Great Wave became one of the most reproduced images in the world.")),
    S("After Japan opened to Western trade in the 1850s, Japanese prints reached Europe. Their flat color, bold outlines, high viewpoints and cropped compositions fascinated French artists — a craze called <b>Japonisme</b>. Monet collected Japanese prints; Van Gogh copied prints by Hiroshige in 1887.", list(["flat areas of color", "strong outlines", "unusual, high viewpoints", "objects cut off by the edge"], "What Europeans learned from Japanese prints")),
    S("<b>Claude Monet</b> (1840–1926) painted <b>Impression, Sunrise</b> (1872): the harbor at Le Havre in quick strokes. Shown at an independent exhibition in Paris in 1874, it gave a mocking critic, Louis Leroy, the word for his review — and the group adopted the name <b>Impressionists</b>. They painted outdoors, chasing changing light.", big("Impression, Sunrise (1872) → the name 'Impressionism' (1874)")),

    S("<b>Vincent van Gogh</b> (1853–1890), Dutch, painted for only about ten years yet produced around 900 paintings. <b>The Starry Night</b> (1889) was painted at the asylum in Saint-Rémy-de-Provence: swirling sky, flaming cypress, quiet village. He sold very few paintings in his lifetime; his fame came after his death.", tbl([["Artist", "Lived", "Key work"], ["Hokusai", "1760–1849", "The Great Wave (c. 1831)"], ["Monet", "1840–1926", "Impression, Sunrise (1872)"], ["Seurat", "1859–1891", "La Grande Jatte (1884–86)"], ["Van Gogh", "1853–1890", "The Starry Night (1889)"]])),
    S("An evidence note: it is often said that Van Gogh sold <b>only one</b> painting in his life. Only one sale is firmly documented (The Red Vineyard, 1890), but letters suggest a few other works were sold or traded. The careful statement is 'very few' — precision matters even in well-loved stories.", list(["Popular claim: exactly one painting sold", "Evidence: one well-documented sale, hints of others", "Careful conclusion: very few sold in his lifetime"], "Precise claims")),

    G(() => { const a = pick([[4, 8, "green"], [0, 4, "orange"], [0, 8, "violet"]]); return { q: `Seurat places tiny dots of ${HUES[a[0]]} and ${HUES[a[1]]} side by side. Seen from a distance, roughly what color do they suggest?`, options: opts(a[2], shuffle(["green", "orange", "violet", "brown", "white"].filter((x) => x !== a[2]))), answer: a[2], hint: "The eye blends neighboring dots.", why: `${HUES[a[0]]} and ${HUES[a[1]]} dots read together as ${a[2]} — optical mixing, often livelier than mixed paint.`, meta: { kind: "check", value: { 4: { 8: "green" }, 0: { 4: "orange", 8: "violet" } }[a[0]][a[1]] } }; }),

const FORMS = { binary: [["A", "B"], ["A", "A", "B", "B"]], ternary: [["A", "B", "A"], ["A", "A", "B", "A"]], rondo: [["A", "B", "A", "C", "A"], ["A", "B", "A", "C", "A", "B", "A"], ["A", "B", "A", "C", "A", "D", "A"]], "theme and variations": [["A", "A1", "A2", "A3"], ["A", "A1", "A2", "A3", "A4", "A5"]] };

const formBoxes = (seq) => { const w = Math.min(90, Math.floor(520 / seq.length)), x0 = (600 - w * seq.length) / 2; return W(seq.map((L2, i) => { const base = L2[0], col = { A: LB, B: LO, C: LG, D: YEL }[base]; return `<rect x='${x0 + i * w + 3}' y='60' width='${w - 6}' height='90' rx='12' fill='${col}' stroke='${INK}' stroke-width='2'/>` + T(x0 + i * w + w / 2, 115, L2, 28); }).join("") + T(300, 200, "each box = one section", 20, GRAY), 220); };
L({
  n: 29, title: "Musical form and the orchestra", icon: "🎺",
  learn: [
    S("<b>Form</b> is the architecture of music: how sections are arranged, repeated and contrasted. The smallest building block is a <b>motif</b> (a short, recognisable idea, like the four notes opening Beethoven's Fifth Symphony); motifs grow into <b>phrases</b>, and phrases into <b>sections</b>, labeled with letters.", list(["motif: a few notes", "phrase: a musical 'sentence', often 4 bars", "section: several phrases, labeled A, B, C …", "form: the plan of the sections"], "From small to large")),
    S("<b>Binary form</b> (AB) has two contrasting sections, each often repeated (AABB) — common in Baroque dances. <b>Ternary form</b> (ABA) states a section, contrasts it, then returns: the return gives a satisfying sense of home. A minuet with its trio (minuet–trio–minuet) is ternary on a large scale.", svg(W([["binary", ["A", "A", "B", "B"], 40], ["ternary", ["A", "B", "A"], 160]].map(([nm, seq, y]) => T(110, y + 52, nm, 22, INK, "end") + seq.map((L2, k) => `<rect x='${140 + k * 90}' y='${y + 10}' width='80' height='70' rx='12' fill='${L2 === "A" ? LB : LO}' stroke='${INK}' stroke-width='2'/>` + T(180 + k * 90, y + 55, L2, 28)).join("")).join(""), 260))),
    S("<b>Rondo</b> keeps returning to its main theme between contrasting <b>episodes</b>: ABACA. Beethoven's Für Elise is a well-known rondo. In <b>theme and variations</b> a theme is stated and then transformed again and again — Mozart's twelve variations on the tune we know as 'Twinkle, Twinkle, Little Star' are a famous example.", svg(formBoxes(["A", "B", "A", "C", "A"]))),
    S("The symphony <b>orchestra</b> has four <b>families</b>, grouped by how the sound is made: <b>strings</b> (bowed or plucked strings), <b>woodwind</b> (air through a tube, with reeds or across an edge), <b>brass</b> (lips buzzing in a cup mouthpiece) and <b>percussion</b> (struck, shaken or scraped).", tbl([["Family", "Instruments", "Sound source"], ["strings", "violin, viola, cello, double bass", "vibrating strings"], ["woodwind", "flute, oboe, clarinet, bassoon", "air column (reed or edge)"], ["brass", "horn, trumpet, trombone, tuba", "buzzing lips"], ["percussion", "timpani, drums, cymbals", "struck or shaken"]])),
    S("The <b>conductor</b> sets the tempo, shapes dynamics and balance, and cues entries, using the beat patterns you learned. The physics is consistent: in every family, a <b>longer or larger</b> vibrating body gives a <b>lower</b> pitch — double bass below violin, tuba below trumpet.", big("bigger / longer vibrating body → lower pitch")),
    S("Two works teach the orchestra. In Sergei Prokofiev's <b>Peter and the Wolf</b> (1936) each character has an instrument: Peter the strings, the bird the flute, the duck the oboe, the cat the clarinet, Grandfather the bassoon, the wolf three French horns. Benjamin Britten's <b>Young Person's Guide to the Orchestra</b> (1945, first performed 1946) presents each family in turn through variations on a theme by Henry Purcell.", tbl([["Character", "Instrument"], ["bird", "flute"], ["duck", "oboe"], ["cat", "clarinet"], ["Grandfather", "bassoon"], ["wolf", "three French horns"]])),

L({
  n: 30, title: "Matisse, Kahlo, Kusama: modern color and self", icon: "✂️",
  learn: [
    S("<b>Henri Matisse</b> (1869–1954) led the painters whom a critic in 1905 called <b>Fauves</b> ('wild beasts'), because of their unnatural, blazing color: a green stripe down a face, a red tree. Color was freed from describing objects and used for expression.", svg(swatches([["#e63946", "red"], ["#2a9d8f", "green"], ["#f4a261", "orange"], ["#264653", "deep blue"], ["#e9c46a", "yellow"]]))),
    S("In his last years, after major surgery in 1941, Matisse often worked from a bed or wheelchair. He turned to <b>paper cut-outs</b>: assistants painted sheets with gouache, and he cut shapes directly with scissors — 'drawing with scissors', he called it. Works include the book <b>Jazz</b> (1947) and <b>The Snail</b> (1953).", svg(W(`<path d='M300 60C380 60 420 130 380 180C340 230 260 200 270 150C280 110 330 115 330 150' fill='none' stroke='${HEX[0]}' stroke-width='18'/><rect x='80' y='50' width='90' height='70' fill='${HEX[8]}' transform='rotate(-8 125 85)'/><rect x='440' y='170' width='100' height='80' fill='${HEX[2]}' transform='rotate(10 490 210)'/><rect x='120' y='190' width='80' height='70' fill='${HEX[6]}'/><rect x='440' y='50' width='70' height='70' fill='${HEX[4]}'/>` + T(300, 290, "cut shapes of painted paper, arranged and pinned", 18, GRAY), 300))),
    S("<b>Frida Kahlo</b> (1907–1954), Mexican, was badly injured in a bus accident at 18 and began painting during her long recovery, using a mirror fixed above her bed. Many of her paintings are <b>self-portraits</b> combining her face with symbols of pain, Mexican culture and nature; she was often alone, and was her own nearest model.", big("Self-portrait: the artist as subject and evidence")),
    S("<b>Yayoi Kusama</b> (1929–2026), Japanese, who worked into her late nineties, moved to New York in 1958. Her trademark <b>polka dots</b> cover canvases, objects and whole rooms; her <b>Infinity Mirror Rooms</b>, begun in 1965, use mirrors to make a small room of lights or dots seem endless.", svg(W(`<rect x='40' y='20' width='520' height='260' fill='#fde047'/>` + Array.from({ length: 24 }, (_, i) => `<circle cx='${80 + (i % 6) * 80 + (Math.floor(i / 6) % 2) * 40}' cy='${55 + Math.floor(i / 6) * 62}' r='${16 + (i % 3) * 5}' fill='#111'/>`).join(""), 300))),
    S("The mathematics of the mirror room: two parallel mirrors facing each other reflect reflections, producing images that recede into the distance — in principle without end, though each reflection loses some light. The 'infinity' is an <b>optical effect</b> with a physical explanation.", list(["One mirror: one image", "Two facing mirrors: reflections of reflections", "Each bounce loses a little light", "Result: a corridor of images fading into distance"], "How the infinity works")),
    S("Talking about art needs clear categories. A <b>fact</b> can be checked (dates, materials, what is depicted). An <b>opinion</b> is a judgement that can be argued with reasons but not proved (whether a work is moving or great). A <b>preference</b> is simply what you like. Good criticism uses facts as evidence for opinions, and does not confuse either with preference.", tbl([["Type", "Example", "Can it be checked?"], ["fact", "The Snail was made in 1953", "yes"], ["opinion", "The Snail is joyful", "argued, not proved"], ["preference", "I like red best", "no — personal"]])),

    S("This year you met art from the caves of Lascaux to the mirror rooms of Kusama. A trained viewer can now place a work in time, name its methods, and judge it with reasons. The art educator Edmund Burke Feldman set out a four-step method of criticism: <b>describe, analyze, interpret, judge</b>.", tbl([["Step", "Question", "Kind of statement"], ["describe", "What do I see?", "facts"], ["analyse", "How is it organized (line, color, value, composition)?", "facts and observations"], ["interpret", "What does it mean or express?", "reasoned opinion"], ["judge", "Is it successful, and why?", "reasoned opinion"]])),

// Course runner: turns COURSE data (one lesson per school week) into an app with the usual shell.
// Each lesson: Learn slides → Practice (hint after the first miss, worked answer after the second) →
// Challenge (contest level) → an off-screen task. No timers, no speed scoring.
// Layout: every screen must fit one screen. After each change the runner measures the panel and the stage

function fitPanel() {
  const host = $("[data-panel]");
  if (!host) return;
  const main = $(".ap-main");
  host.classList.add("cr-panel");
  const sayBox = $("[data-say]", host);
  const inner = sayBox && $(".cr-say-in", sayBox);
  host.style.removeProperty("max-height");
  main?.style.removeProperty("grid-template-columns");
  if (inner) inner.style.removeProperty("max-height");
  const over = () => host.scrollHeight - host.clientHeight;
  // A ladder of ever stronger measures; stop at the first that fits. Upright screens may give the panel
  // more height ("tall"); landscape phones give it a wider column ("wide").
  const steps = [
    { k: 1 },
    { k: 0.93 },
    { k: 0.86 },
    { k: 0.86, grow: 1 },
    { k: 0.86, grow: 1, dense: true },
    { k: 0.86, grow: 2, dense: true },
    { k: 0.8, grow: 2, dense: true },
    { k: 0.8, grow: 2, dense: true, scroll: true },
    { k: 0.74, grow: 2, dense: true, scroll: true },
  ];

  for (const s of steps) {
    host.style.setProperty("--k", s.k);
    host.classList.toggle("cr-tight", s.k < 0.9);
    host.classList.toggle("cr-dense", !!s.dense);
    if (s.grow && upright) host.style.maxHeight = s.grow > 1 ? "64vh" : "58vh";

function fitStage() {

    box.style.setProperty("--s", lo);

  const table = $(".cr-table", body);
  if (table && !table.dataset.turned && body.scrollWidth > body.clientWidth + 1 && table.rows.length < (table.rows[0]?.cells.length || 0)) {
    const grid = [...table.rows].map((r) => [...r.cells]);

    if (!id || !text) return;
    const key = srcKey(src);
    const was = shell.progress()[id]?.missed || [];
    const rest = was.filter((m) => (key && m.src ? m.src !== key : m.q !== text));
    if (!missed && rest.length === was.length) return;
    const answer = Array.isArray(q.answer) && q.answerText == null ? q.answer.join(" → ") : String(q.answerText ?? q.answer);
    shell.mark(id, { missed: missed ? [...rest, { q: text, a: answer.replace(/<[^>]*>/g, ""), at: Date.now(), ...(key ? { src: key } : {}) }].slice(-20) : rest });
  } catch (error) {}
}

// Spaced review: up to three questions missed in EARLIER lessons of this course, at least a day ago,
// oldest first. Each is asked again at the start of the lesson; a first-try answer clears it.
const REVIEW_MAX = 3;
const REVIEW_GAP = 20 * 3600 * 1000;
function reviewFor(index) {
  const found = [];
  const progress = shell.progress();
  for (let i = 0; i < index; i++)
    for (const m of progress[`l${i + 1}`]?.missed || []) {
      if (!m.src || Date.now() - m.at < REVIEW_GAP) continue;
      const [lesson, bank, k] = m.src.split(":");
      const q = COURSE.lessons[Number(lesson)]?.[bank]?.[Number(k)];
      if (q) found.push({ q, at: m.at, src: { lesson: Number(lesson), bank, k: Number(k) } });
    }
  return found.sort((a, b) => a.at - b.at).slice(0, REVIEW_MAX);
}

function ask(q0, label, my, src) {
  const q = fresh(q0);
  return new Promise((resolve) => {
    let tries = 0;
    const type = q.type || (q.options ? "choice" : q.items ? "order" : "number");
    const tag = `${esc(label)}${type === "order" ? ` · <span>tap in order, first to last</span>` : ""}`;
    if (q.show || q.big) show(q.show || { type: "big", text: q.big }, { tag, q: q.q });
    else show({ type: "prompt", text: q.q }, { tag });
    const finish = (right) => {
      if (my !== token) return;
      panel(`<div class="ap-buttons"><button type="button" class="primary" data-go>Next ▶</button></div>`);
      const why = q.why ? `<small>${esc(q.why)}</small>` : "";
      say(right ? `Correct. ${q.why ? esc(q.why) : ""}` : `The answer is <b>${stop(esc(Array.isArray(q.answer) && q.answerText == null ? q.answer.join(" → ") : q.answerText ?? q.answer))}</b> ${why}`);
      $("[data-panel]").onclick = (e) => e.target.closest("[data-go]") && resolve(tries === 1 && right);
    };
    const check = (value) => {
      if (my !== token) return false;
      tries += 1;
      const want = Array.isArray(q.answer) ? q.answer.join("|") : String(q.answer).trim().toLowerCase();
      const got = Array.isArray(value) ? value.join("|") : String(value).trim().toLowerCase();
      if (got === want) {
        if (tries === 1) remember(q, false, src);
        MUSIC.chime();
        window.OC?.count("problems solved");
        finish(true);
        return true;
      }
      MUSIC.oops();
      if (tries === 1) remember(q, true, src);
      if (tries === 1) say(`Not quite. ${q.hint ? esc(q.hint) : "Reconsider the question carefully."}`);
      else finish(false);
      return false;
    };
    // The question is already on the stage, so the owl reads it aloud with the bubble hidden.
    const prompt = () => say(esc(q.q), { quiet: true });
    if (type === "choice") {
      const host = panel(`<div class="ap-chips cr-choices ${listClass(q.options)}" data-list>${q.options.map((o, k) => `<button type="button" data-c="${k}">${esc(o)}</button>`).join("")}</div>`);
      // If even the tightest layout cannot hold these answers, print them on the stage as A, B, C…
      // (which may scroll there) and keep only large lettered buttons in the panel.
      const letter = (k) => String.fromCharCode(65 + k);
      const choiceList = $("[data-list]", host);
      choiceList._crCompact = () => {
        const list = choiceList, body = $(".cr-body", stage);
        // Only for genuinely long answer sets; short ones always fit the card layout.
        if (!list.isConnected || q.options.reduce((a, o) => a + len(o), 0) < 200) return false;
        if (!list || !body || q.options.length > 8) return false;
        const missed = new Set([...list.querySelectorAll(".cr-miss")].map((b) => b.dataset.c));
        list.className = "ap-chips cr-choices cr-letters";
        list.innerHTML = q.options.map((o, k) => `<button type="button" data-c="${k}" aria-label="${letter(k)}: ${esc(o).replace(/"/g, "&quot;")}" ${missed.has(String(k)) ? `disabled class="cr-miss"` : ""}>${letter(k)}</button>`).join("");
        body.insertAdjacentHTML("beforeend", `<ol class="cr-opts">${q.options.map((o, k) => `<li data-li="${k}" class="${missed.has(String(k)) ? "cr-miss" : ""}"><b>${letter(k)}</b><span>${esc(o)}</span></li>`).join("")}</ol>`);
        return true;
      };
      host.onclick = (e) => {
        const b = e.target.closest("[data-c]");
        if (!b || b.disabled) return;
        const ok = check(q.options[Number(b.dataset.c)]);
        if (!ok && my === token && b.isConnected) {
          b.disabled = true;
          b.classList.add("cr-miss");
          $(`.cr-opts [data-li="${b.dataset.c}"]`, stage)?.classList.add("cr-miss");
        }
      };
    } else if (type === "order") {
      let picked = [];
      const host = panel(`<div class="ap-chips cr-choices cr-ordering ${listClass(q.items)}" data-list></div><div class="ap-buttons cr-undo"><button type="button" data-undo>↺ Start over</button></div>`);
      const list = $("[data-list]", host);
      const draw = () => {
        list.innerHTML = q.items
          .map((o, k) => {
            const at = picked.indexOf(k);
            return `<button type="button" data-o="${k}" ${at >= 0 ? `disabled aria-pressed="true"` : ""}><i>${at >= 0 ? at + 1 : ""}</i><span>${esc(o)}</span></button>`;
          })
          .join("");
        $(".cr-undo", host).style.display = picked.length ? "" : "none";
        refit();
      };
      draw();
      host.onclick = (e) => {
        const b = e.target.closest("[data-o]");
        if (e.target.closest("[data-undo]")) (picked = []), draw();
        else if (b && !b.disabled) {
          picked.push(Number(b.dataset.o));
          draw();
          if (picked.length === q.items.length) {
            const value = picked.map((k) => q.items[k]);
            picked = [];
            if (!check(value) && my === token && list.isConnected) draw();
          }
        }
      };
    } else {
      const host = panel(`<div data-pad></div>`);
      numpad($("[data-pad]", host), { onEnter: (v) => check(v), max: 7 });
    }
    prompt();
  });
}

const units = Object.fromEntries(
  COURSE.lessons.map((lesson, i) => [
    `l${i + 1}`,
    async () => {
      const my = token;
      const id = `l${i + 1}`;
      try {
        await learn(lesson, my);
        if (my !== token) return;
        let first = 0;
        const review = reviewFor(i);
        if (review.length) {
          say(`First, a short review: ${review.length === 1 ? "one question" : `${review.length} questions`} missed in an earlier lesson.`);
          await wait(1400);
          if (my !== token) return;
        }
        for (let k = 0; k < review.length; k++) {
          await ask(review[k].q, `🔁 Review ${k + 1} of ${review.length}`, my, review[k].src);
          if (my !== token) return;
        }
        const bankOf = (name) => (lesson[name] || []).map((q, k) => ({ q, k }));
        const practice = drawSet(bankOf("practice"), lesson.practiceCount || 12);
        for (let k = 0; k < practice.length; k++) {
          if (await ask(practice[k].q, `Practice ${k + 1} of ${practice.length}`, my, { lesson: i, bank: "practice", k: practice[k].k })) first += 1;
          if (my !== token) return;
        }
        const challenge = drawSet(bankOf("challenge"), lesson.challengeCount || 3);
        for (let k = 0; k < challenge.length; k++) {
          say("Challenge problem. Understand it, make a plan, carry it out, then check.");
          await wait(1200);
          if (my !== token) return;
          await ask(challenge[k].q, `⭐ Challenge ${k + 1} of ${challenge.length}`, my, { lesson: i, bank: "challenge", k: challenge[k].k });
          if (my !== token) return;
        }
        shell.mark(id, { done: true, first, of: practice.length, doneAt: Date.now() });
        show({ type: "big", text: `${first} / ${practice.length}`, caption: "practice problems correct on the first attempt" });
        panel(`<div class="ap-buttons"><button type="button" class="primary" data-explain>🗣️ Explain it</button><button type="button" data-off>📝 Task</button>${lesson.extend ? `<button type="button" data-extend>🚀 Go further</button>` : ""}<button type="button" data-again>↺ Again</button></div>`);
        say(`Lesson complete. Now explain the main idea in your own words.`);
        $("[data-panel]").onclick = (e) => {
          if (e.target.closest("[data-again]")) shell.go(id);
          if (e.target.closest("[data-explain]")) {
            show({ type: "list", items: [`Explain to a grown-up, in 3 or 4 clear sentences, the main idea of "${lesson.title}".`, "Give one example of your own.", "Say one question you still have."] });
            say("Explain the main idea in three or four clear sentences, give an example of your own, and ask one question you still have.");
          }
          if (e.target.closest("[data-extend]")) {
            show({ type: "list", items: [lesson.extend] });
            say(esc(lesson.extend), { quiet: true });
          }
          if (e.target.closest("[data-off]")) {
            show({ type: "list", items: [lesson.offline || "Tell a grown-up what you learned today, in 5 sentences."] });
            say(esc(lesson.offline || "Tell a grown-up what you learned today."), { quiet: true });
          }
        };
      } catch (error) {
        console.error(error);
      }
    },
  ]),
);

const how = Object.fromEntries(UNITS.map((u) => [u.id, { icon: COURSE.icon, title: u.label.replace(/^\d+\.\s*/, ""), steps: ["Learn: study the lesson slides.", "Practice: solve each problem; a first miss gives a hint, a second shows the full reasoning.", "Challenge: contest-level problems. Then explain the main idea in your own words."] }]));
const fromHash = /^#l\d+$/.test(location.hash) && UNITS.some((u) => u.id === location.hash.slice(1)) ? location.hash.slice(1) : null;
const shell = SHELL({
  unitWord: "Lesson",
  units: UNITS,
  how,
  start: fromHash || UNITS[0].id,
  onStop() {
    token += 1;
    $("[data-panel]").onclick = null;
  },
  subject: COURSE.subject,
  activity: COURSE.title,
  onUnit(id) {
    token += 1;
    VOICE.hush();
    units[id]();
  },
});

// The shell's "turn sideways" tip normally floats at the bottom of the screen, over the answer buttons.
// Here it sits at the foot of the stage (never over a control) and a tap dismisses it.
const placeTip = () => {
  const tip = $(".ap-turn");
  if (!tip) return;
  if (!tip.dataset.placed) {
    tip.dataset.placed = "1";
    tip.classList.add("cr-turn");
    tip.insertAdjacentHTML("beforeend", ` <b aria-hidden="true">✕</b>`);
    tip.setAttribute("role", "button");
    tip.addEventListener("click", () => tip.remove());
  }
  const r = stage.getBoundingClientRect();
  tip.style.bottom = "auto";
  tip.style.top = `${Math.max(4, Math.round(r.bottom - tip.offsetHeight - 10))}px`;
};
placeTip();
addEventListener("resize", placeTip);
if (window.ResizeObserver) new ResizeObserver(placeTip).observe(stage);
