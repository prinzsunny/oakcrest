ions by their consequences and rejecting those that lead to contradiction","Because real people are knights or knaves","Because lying is good","They teach that every speaker is honest"],"answer":"They train testing assumptions by their consequences and rejecting those that lead to contradiction","hint":"What method did every solution use?","why":"The puzzles are exercises in hypothetical reasoning: assume, deduce, check for contradiction.","show":{"type":"passage","title":"","text":"Why do knight–knave puzzles help with real reasoning?"}},{gen:() => (gKnk(3))},{gen:() => (gKnk(3))},{gen:() => (gKnk(3))},{gen:() => (gKnk(3))},{gen:() => (gKnk(3))},{gen:() => (gKnk(3))},{gen:() => (gKnk(3))},{gen:() => (gKnk(3))},{gen:() => (gKnk(2))},{gen:() => (gKnk(2))},{gen:() => (gKnk(2))},{gen:() => (gCondInfer())},{gen:() => (gCondInfer())}],"challenge":[{"q":"A guard is a knight or a knave; you do not know which. One road leads to the city. Which single question to this guard reveals the road?","options":["'If I asked you whether the left road leads to the city, would you say yes?'","'Does the left road lead to the city?'","'Are you a knave?'","'Is two plus two four?'"],"answer":"'If I asked you whether the left road leads to the city, would you say yes?'","hint":"Design a question in which a knave lies twice.","why":"A knight answers truthfully. A knave, asked what he WOULD say, must lie about his lie, so his answer is also the truth. Either way 'yes' means the left road leads to the city.","show":{"type":"passage","title":"","text":"A guard is a knight or a knave; you do not know which. One road leads to the city. Which single question to this guard reveals the road?"}},{"q":"Four islanders each say: 'Exactly one of us is a knave.' How many knights are there?","type":"number","answer":0,"hint":"They all say the same thing, so they are all the same kind.","why":"Identical statements have the same truth value, so all four are knights or all are knaves. If all were knights, there would be no knave, making the statement false: impossible. So all four are knaves (and indeed 'exactly one knave' is false): 0 knights.","show":{"type":"passage","title":"","text":"Four islanders each say: 'Exactly one of us is a knave.' How many knights are there?"}},{"q":"A says: 'B is a knight.' B says: 'A and I are different kinds.' What are they?","options":["Both knaves","Both knights","A knight, B knave","A knave, B knight"],"answer":"Both knaves","hint":"If A is a knight, what is B? Then test B's statement.","why":"If A were a knight, B would be a knight, but then B's statement 'we are different' would be false: contradiction. So A is a knave, and B is not a knight: B is a knave. Check: B's statement is false (they are the same kind), as required.","show":{"type":"passage","title":"","text":"A says: 'B is a knight.' B says: 'A and I are different kinds.' What are they?"}},{gen:() => (gKnk(3))},{gen:() => (gKnk(3))}],"extend":"Write a short story (half a page) in which a traveler on the island must reach a city using knight–knave questions. Include at least one conditional statement and prove, at the end of the story, that the traveler's conclusion was forced by the evidence.","offline":"With two grown-ups, play a three-person knight–knave round: each secretly draws 'knight' or 'knave' from a hat and makes one statement about the group. Solve it together on paper with a case table of 8 rows."},
    {"title":"Truth tables","icon":"📊","learn":[{"say":"In formal logic we combine statements P and Q with <b>connectives</b>: NOT, AND, OR, and IF … THEN. A <b>truth table</b> lists every combination of truth values and computes the result.","show":{"type":"table","rows":[["P","Q","NOT P","P AND Q","P OR Q"],["T","T","F","T","T"],["T","F","F","F","T"],["F","T","T","F","T"],["F","F","T","F","F"]]}},{"say":"Logical <b>OR</b> is inclusive: 'P OR Q' is true when at least one is true, including both. Everyday 'or' sometimes means 'one but not both'; logicians call that <b>exclusive or</b>.","show":{"type":"table","rows":[["P","Q","P OR Q","(P OR Q) AND NOT (P AND Q)"],["T","T","T","F"],["T","F","T","T"],["F","T","T","T"],["F","F","F","F"]]}},{"say":"<b>IF P THEN Q</b> is false in exactly one row: P true and Q false. Its contrapositive has the same column; its converse does not.","show":{"type":"table","rows":[["P","Q","IF P THEN Q","IF (NOT Q) THEN (NOT P)","IF Q THEN P"],["T","T","T","T","T"],["T","F","F","F","T"],["F","T","T","T","F"],["F","F","T","T","T"]]}},{"say":"<b>De Morgan's laws</b> (Augustus De Morgan, 1847): NOT (P AND Q) is equivalent to (NOT P) OR (NOT Q); NOT (P OR Q) is equivalent to (NOT P) AND (NOT Q).","show":{"type":"table","rows":[["P","Q","NOT (P AND Q)","(NOT P) OR (NOT Q)"],["T","T","F","F"],["T","F","T","T"],["F","T","T","T"],["F","F","T","T"]]}},{"say":"A <b>tautology</b> is true in every row ('P OR NOT P'); a <b>contradiction</b> is false in every row ('P AND NOT P'). Two statements are <b>equivalent</b> when their columns match in every row. (One more connective: 'P IF AND ONLY IF Q' is true exactly when P and Q have the same truth value.)","show":{"type":"table","rows":[["P","Q","P OR (NOT P)","P AND (NOT P)"],["T","T","T","F"],["T","F","T","F"],["F","T","T","F"],["F","F","T","F"]]}},{"say":"With three letters P, Q, R there are 2 × 2 × 2 = 8 rows. In general, n letters give 2ⁿ rows: the same doubling as the subsets of a set.","show":{"type":"big","text":"2 letters → 4 rows\n3 letters → 8 rows\nn letters → 2ⁿ rows"}},{"say":"<b>Explain it.</b> Explain why 'If P then Q' is true when P is false, using the promise 'If you finish your work, you may go outside.' Then state one of De Morgan's laws in everyday words.","show":{"type":"passage","title":"Explain it","text":"Explain why 'If P then Q' is true when P is false, using the promise 'If you finish your work, you may go outside.' Then state one of De Morgan's laws in everyday words.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise words from this lesson."}}],"practice":[{"q":"P is true and Q is false. What is the value of P AND Q?","options":["False","True"],"answer":"False","hint":"AND needs both.","why":"AND is true only when both parts are true; Q is false, so P AND Q is false.","show":{"type":"passage","title":"","text":"P is true and Q is false. What is the value of P AND Q?"}},{"q":"P is false and Q is true. What is the value of P OR Q?","options":["True","False"],"answer":"True","hint":"OR needs at least one.","why":"Q is true, so P OR Q is true.","show":{"type":"passage","title":"","text":"P is false and Q is true. What is the value of P OR Q?"}},{"q":"P is false and Q is false. What is the value of IF P THEN Q?","options":["True","False"],"answer":"True","hint":"When is a conditional false?","why":"A conditional is false only when P is true and Q is false. Here P is false, so the conditional is true (the promise was not broken).","show":{"type":"passage","title":"","text":"P is false and Q is false. What is the value of IF P THEN Q?"}},{"q":"P is true and Q is false. What is the value of IF P THEN Q?","options":["False","True"],"answer":"False","hint":"This is the one row that breaks a conditional.","why":"P true and Q false is exactly the case that makes the conditional false.","show":{"type":"passage","title":"","text":"P is true and Q is false. What is the value of IF P THEN Q?"}},{"q":"In how many of the 4 rows is P AND Q true?","type":"number","answer":1,"hint":"Only one combination makes both true.","why":"Only the row P = T, Q = T: 1 row.","show":{"type":"table","rows":[["P","Q","P AND Q"],["T","T","T"],["T","F","F"],["F","T","F"],["F","F","F"]]}},{"q":"In how many of the 4 rows is IF P THEN Q true?","type":"number","answer":3,"hint":"It fails in exactly one row.","why":"It is false only for P = T, Q = F, so it is true in 3 rows.","show":{"type":"passage","title":"","text":"In how many of the 4 rows is IF P THEN Q true?"}},{"q":"Which statement is equivalent to NOT (P AND Q)?","options":["(NOT P) OR (NOT Q)","(NOT P) AND (NOT Q)","P OR Q","NOT P"],"answer":"(NOT P) OR (NOT Q)","hint":"De Morgan: negating AND gives OR of negations.","why":"Their columns are F, T, T, T in both cases, so they are equivalent (De Morgan's law).","show":{"type":"passage","title":"","text":"Which statement is equivalent to NOT (P AND Q)?"}},{"q":"Which statement is equivalent to NOT (P OR Q)?","options":["(NOT P) AND (NOT Q)","(NOT P) OR (NOT Q)","P AND Q","IF P THEN Q"],"answer":"(NOT P) AND (NOT Q)","hint":"Negating OR gives AND of negations.","why":"Both are true only when P and Q are both false: equivalent (De Morgan).","show":{"type":"passage","title":"","text":"Which statement is equivalent to NOT (P OR Q)?"}},{"q":"Which statement is equivalent to IF P THEN Q?","options":["IF (NOT Q) THEN (NOT P)","IF Q THEN P","IF (NOT P) THEN (NOT Q)","P AND Q"],"answer":"IF (NOT Q) THEN (NOT P)","hint":"Which related conditional always agrees with the original?","why":"The contrapositive has the same column (T, F, T, T); the converse and inverse do not.","show":{"type":"passage","title":"","text":"Which statement is equivalent to IF P THEN Q?"}},{"q":"Is 'P OR (NOT P)' a tautology, a contradiction, or neither?","options":["Tautology","Contradiction","Neither"],"answer":"Tautology","hint":"Check both rows of P.","why":"Whether P is true or false, one of P and NOT P is true, so it is true in every row: a tautology.","show":{"type":"passage","title":"","text":"Is 'P OR (NOT P)' a tautology, a contradiction, or neither?"}},{"q":"In everyday words, which is the negation of 'It is cold and it is raining'?","options":["It is not cold, or it is not raining (or both)","It is not cold and it is not raining","It is warm and sunny","It is cold or raining"],"answer":"It is not cold, or it is not raining (or both)","hint":"Use De Morgan's law.","why":"NOT (cold AND raining) = (NOT cold) OR (NOT raining). A warm rainy day already makes the original false.","show":{"type":"passage","title":"","text":"In everyday words, which is the negation of 'It is cold and it is raining'?"}},{"q":"How many rows does a truth table with the four letters P, Q, R, S have?","type":"number","answer":16,"hint":"Each letter doubles the number of rows.","why":"2 × 2 × 2 × 2 = 16.","show":{"type":"passage","title":"","text":"How many rows does a truth table with the four letters P, Q, R, S have?"}},{"q":"In how many of the 8 rows is (P AND Q) OR R true?","type":"number","answer":5,"hint":"R true makes it true at once (4 rows). Then add rows with R false.","why":"When R is true (4 rows) it is true; when R is false it needs P and Q both true (1 more row). Total 5.","show":{"type":"passage","title":"","text":"In how many of the 8 rows is (P AND Q) OR R true?"}},{gen:() => (gTruth(1))},{gen:() => (gTruth(1))},{gen:() => (gTruth(1))},{gen:() => (gTruth(1))},{gen:() => (gTruth(2))},{gen:() => (gTruth(2))},{gen:() => (gTruth(2))},{gen:() => (gTruth(2))},{gen:() => (gTruth(2))},{gen:() => (gTruth(3))},{gen:() => (gTruth(3))},{gen:() => (gTruth(3))},{gen:() => (gTruth(3))}],"challenge":[{"q":"In how many of the 8 rows is IF (P AND Q) THEN R true?","type":"number","answer":7,"hint":"It is false only when its IF part is true and R is false.","why":"The IF part (P AND Q) is true in 2 rows, and in one of those R is false. So exactly 1 row is false and 7 are true.","show":{"type":"passage","title":"","text":"In how many of the 8 rows is IF (P AND Q) THEN R true?"}},{"q":"Is 'IF (P AND (IF P THEN Q)) THEN Q' a tautology?","options":["Yes","No"],"answer":"Yes","hint":"Look for a row where the IF part is true and Q false.","why":"Whenever P and 'if P then Q' are both true, Q must be true, so no row makes it false. This tautology is the logical law behind modus ponens.","show":{"type":"passage","title":"","text":"Is 'IF (P AND (IF P THEN Q)) THEN Q' a tautology?"},"keepOrder":true},{"q":"Is 'IF (Q AND (IF P THEN Q)) THEN P' a tautology?","options":["No","Yes"],"answer":"No","hint":"Try P false and Q true.","why":"With P false and Q true, the IF part is true but P is false, so the statement fails in that row. This is the formal shape of the fallacy of affirming the consequent.","show":{"type":"passage","title":"","text":"Is 'IF (Q AND (IF P THEN Q)) THEN P' a tautology?"}},{gen:() => (gTruth(3))},{gen:() => (gTruth(3))}],"extend":"Read about George Boole, whose 'Laws of Thought' (1854) turned logic into algebra, and about how his ideas are used in every digital computer. Then build a truth table for 'exclusive or' and explain where it appears in binary addition (1 + 1 gives 0, carry 1).","offline":"Make truth-table cards: write T or F on cards for P and Q, deal them out, and race a grown-up (accuracy first, not speed) to evaluate AND, OR and IF … THEN. Then test De Morgan's law on all four rows with your cards."},
    {"title":"Ordering and transitivity","icon":"📏","learn":[{"say":"Comparisons such as 'taller than' are <b>transitive</b>: if A is taller than B and B is taller than C, then A is taller than C. This lets us chain clues into a single order.","show":{"type":"big","text":"A > B and B > C\n⇒ A > C"}},{"say":"Not every relation is transitive. 'Is a friend of' is not: my friend's friend need not be my friend. In games, 'beats' may not be transitive: rock beats scissors, scissors beat paper, yet paper beats rock.","show":{"type":"table","rows":[["Relation","Transitive?"],["is taller than","yes"],["is older than","yes"],["is a friend of","no"],["beats (rock–paper–scissors)","no"]]}},{"say":"Method: draw a vertical line (a number line for height), place each name as clues allow, and keep uncertain names in a bracket until a later clue fixes them.","show":{"type":"list","items":["1. Write each clue as an arrow: taller → shorter","2. Chain arrows: A → B → C","3. Place definite names; bracket the uncertain","4. Check every clue against the final order"]}},{"say":"If clues do not decide everything, several orders remain. Counting them is a useful skill: with 'A before B' and 'C before D' among four people, half of each pair's orders survive.","show":{"type":"big","text":"24 orders × ½ × ½ = 6 orders"}},{"say":"Measurement connects here: comparing lengths in different units requires converting first. 1 m 20 cm is longer than 115 cm, because 1 m 20 cm = 120 cm.","show":{"type":"table","rows":[["Length","In cm"],["1 m 20 cm","120"],["115 cm","115"],["1.1 m","110"]]}},{"say":"<b>Explain it.</b> Explain what a transitive relation is, give one example and one non-example, and show how transitivity let you solve an ordering puzzle.","show":{"type":"passage","title":"Explain it","text":"Explain what a transitive relation is, give one example and one non-example, and show how transitivity let you solve an ordering puzzle.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise words from this lesson."}}],"practice":[{"q":"Ana is shorter than Bram but taller than Cora. Dax is taller than Bram. Order them from TALLEST to SHORTEST.","type":"order","items":["Ana","Cora","Bram","Dax"],"answer":["Dax","Bram","Ana","Cora"],"hint":"Chain the clues: Dax > Bram > Ana > Cora.","why":"Dax is taller than Bram, Bram than Ana, and Ana than Cora: Dax, Bram, Ana, Cora.","show":{"type":"passage","title":"","text":"Ana is shorter than Bram but taller than Cora. Dax is taller than Bram. Order them from TALLEST to SHORTEST."}},{"q":"Same clues: who is the second tallest?","options":["Bram","Ana","Dax","Cora"],"answer":"Bram","hint":"Write the chain first.","why":"The order is Dax, Bram, Ana, Cora, so the second tallest is Bram.","show":{"type":"passage","title":"","text":"Same clues: who is the second tallest?"}},{"q":"Hugo is the oldest. Finn is older than Esme. Gita is younger than Esme. Iris is younger than Gita. Order them from OLDEST to YOUNGEST.","type":"order","items":["Esme","Finn","Gita","Hugo","Iris"],"answer":["Hugo","Finn","Esme","Gita","Iris"],"hint":"Place Hugo first, then build the chain Finn → Esme → Gita → Iris.","why":"Hugo first; then Finn > Esme > Gita > Iris: Hugo, Finn, Esme, Gita, Iris.","show":{"type":"passage","title":"","text":"Hugo is the oldest. Finn is older than Esme. Gita is younger than Esme. Iris is younger than Gita. Order them from OLDEST to YOUNGEST."}},{"q":"In a race of four, Kai finished second. Milo finished ahead of Lena. Jon finished ahead of Milo. Who won?","options":["Jon","Kai","Milo","Lena"],"answer":"Jon","hint":"Jon, Milo and Lena must appear in that order. Where can they go if Kai holds second place?","why":"Jon, Milo and Lena finish in that order, and the only places left are 1st, 3rd and 4th. So the result is Jon, Kai, Milo, Lena: Jon won.","show":{"type":"passage","title":"","text":"In a race of four, Kai finished second. Milo finished ahead of Lena. Jon finished ahead of Milo. Who won?"}},{"q":"Is 'is exactly the same height as' a transitive relation?","options":["Yes","No"],"answer":"Yes","hint":"If A and B are the same height, and B and C are the same height…","why":"If A is the same height as B, and B the same height as C, then A and C are the same height: equal measurements chain together, so the relation is transitive.","show":{"type":"passage","title":"","text":"Is 'is exactly the same height as' a transitive relation?"},"keepOrder":true},{"q":"Is 'beats' in rock–paper–scissors transitive?","options":["No","Yes"],"answer":"No","hint":"Rock beats scissors; scissors beat paper. Does rock beat paper?","why":"Paper beats rock, so the chain fails: the relation is not transitive. This is why there is no 'best' choice in the game.","show":{"type":"passage","title":"","text":"Is 'beats' in rock–paper–scissors transitive?"}},{"q":"Four runners A, B, C, D. We know only that A finished ahead of B and C ahead of D. How many finishing orders are possible?","type":"number","answer":6,"hint":"Without clues there are 24 orders. How many keep A ahead of B? Of those, how many keep C ahead of D?","why":"Half of the 24 orders have A ahead of B (12), and half of those have C ahead of D: 6.","show":{"type":"passage","title":"","text":"Four runners A, B, C, D. We know only that A finished ahead of B and C ahead of D. How many finishing orders are possible?"}},{"q":"Which is longest?","options":["1 m 20 cm","115 cm","1.1 m","1 m 5 cm"],"answer":"1 m 20 cm","hint":"Convert everything to centimeters.","why":"1 m 20 cm = 120 cm; 115 cm; 1.1 m = 110 cm; 1 m 5 cm = 105 cm. The longest is 1 m 20 cm.","show":{"type":"passage","title":"","text":"Which is longest?"}},{"q":"Order from shortest to longest: 2.5 m, 240 cm, 2 m 45 cm, 2,600 mm.","type":"order","items":["2,600 mm","2 m 45 cm","240 cm","2.5 m"],"answer":["240 cm","2 m 45 cm","2.5 m","2,600 mm"],"hint":"Convert to centimeters.","why":"240 cm, 245 cm, 250 cm, 260 cm.","show":{"type":"passage","title":"","text":"Order from shortest to longest: 2.5 m, 240 cm, 2 m 45 cm, 2,600 mm."}},{"q":"'Pat is taller than Quinn, and Quinn is taller than Rae.' Someone concludes 'Rae is taller than Pat'. What is wrong?","options":["It contradicts transitivity: Pat is taller than Rae","Nothing","We cannot compare Pat and Rae"],"answer":"It contradicts transitivity: Pat is taller than Rae","hint":"Chain the two clues.","why":"By transitivity Pat > Quinn > Rae, so Pat is taller than Rae; the conclusion is the reverse.","show":{"type":"passage","title":"","text":"'Pat is taller than Quinn, and Quinn is taller than Rae.' Someone concludes 'Rae is taller than Pat'. What is wrong?"}},{"q":"Five friends are ordered by age, and the clues fix only the oldest and the youngest. How many orders are possible?","options":["6","24","120","1"],"answer":"6","hint":"How many people remain for the middle three places?","why":"The three middle people can be arranged in 3 × 2 × 1 = 6 ways.","show":{"type":"passage","title":"","text":"Five friends are ordered by age, and the clues fix only the oldest and the youngest. How many orders are possible?"}},{"q":"Which statement can be concluded from 'X is heavier than Y' and 'Z is lighter than Y'?","options":["X is heavier than Z","Z is heavier than X","X and Z weigh the same","Nothing"],"answer":"X is heavier than Z","hint":"Rewrite 'Z is lighter than Y' as 'Y is heavier than Z'.","why":"X > Y and Y > Z, so X > Z by transitivity.","show":{"type":"passage","title":"","text":"Which statement can be concluded from 'X is heavier than Y' and 'Z is lighter than Y'?"}},{gen:() => (gOrder(4))},{gen:() => (gOrder(4))},{gen:() => (gOrder(4))},{gen:() => (gOrder(4))},{gen:() => (gOrder(4))},{gen:() => (gOrder(5))},{gen:() => (gOrder(5))},{gen:() => (gOrder(5))},{gen:() => (gOrder(5, "order"))},{gen:() => (gOrder(5, "order"))},{gen:() => (gOrder(4, "order"))},{gen:() => (gOrder(4, "order"))},{gen:() => (gKnk(2))}],"challenge":[{"q":"Six runners finish a race. A beats B, B beats C, D beats E, and E beats F. How many finishing orders are consistent with this?","type":"number","answer":20,"hint":"Choose which 3 of the 6 positions belong to A, B, C; their order is then fixed.","why":"Choosing 3 positions out of 6 for A, B, C can be done in 20 ways, and then everything is determined: 20 orders.","show":{"type":"passage","title":"","text":"Six runners finish a race. A beats B, B beats C, D beats E, and E beats F. How many finishing orders are consistent with this?"}},{"q":"Three dice: die A beats die B more often than not, B beats C more often than not, and C beats A more often than not. Is this possible?","options":["Yes: such 'non-transitive dice' exist","No: it would break transitivity"],"answer":"Yes: such 'non-transitive dice' exist","hint":"Must 'beats more often' be transitive?","why":"'Beats more often than not' is not a transitive relation. Non-transitive dice (for example Efron's dice) really exist: each die beats the next in a cycle.","show":{"type":"passage","title":"","text":"Three dice: die A beats die B more often than not, B beats C more often than not, and C beats A more often than not. Is this possible?"}},{"q":"Clues: Uma is older than Vera. Wes is younger than Vera but older than Theo. Theo is older than Suki. Order from OLDEST to YOUNGEST.","type":"order","items":["Theo","Suki","Vera","Wes","Uma"],"answer":["Uma","Vera","Wes","Theo","Suki"],"hint":"Build one long chain.","why":"Uma > Vera > Wes > Theo > Suki.","show":{"type":"passage","title":"","text":"Clues: Uma is older than Vera. Wes is younger than Vera but older than Theo. Theo is older than Suki. Order from OLDEST to YOUNGEST."}},{gen:() => (gOrder(6))},{gen:() => (gOrder(5, "order"))}],"extend":"Investigate non-transitive dice: make three paper dice with these faces: A: 2, 2, 4, 4, 9, 9; B: 1, 1, 6, 6, 8, 8; C: 3, 3, 5, 5, 7, 7. Roll each pair 30 times and record who wins. Then compute the exact probabilities (out of 36 pairings) and compare them with your evidence.","offline":"Measure the heights of five family members or toys, record them in centimeters, and write four comparison clues from which someone else could reconstruct the full order. Test your clues on a grown-up: are they sufficient? Are any unnecessary?"},
    {"title":"Review: weighing and balance","icon":"⚖️","learn":[{"say":"A balanced scale is an <b>equation</b>: both sides weigh the same. Removing the same objects from both pans, or replacing an object with something of equal weight (<b>substitution</b>), keeps the balance.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><polygon points='300,180 270,300 330,300' fill='#8d6e63'/><line x1='120' y1='180' x2='480' y2='180' stroke='#5d4037' stroke-width='8' stroke-linecap='round'/><line x1='130' y1='180' x2='130' y2='150' stroke='#5d4037' stroke-width='4'/><line x1='470' y1='180' x2='470' y2='150' stroke='#5d4037' stroke-width='4'/><rect x='40' y='140' width='180' height='12' rx='6' fill='#5d4037'/><rect x='380' y='140' width='180' height='12' rx='6' fill='#5d4037'/><text x='130' y='128' font-size='34' font-weight='700' text-anchor='middle' fill='#222'>▲ ▲</text><text x='470' y='128' font-size='34' font-weight='700' text-anchor='middle' fill='#222'>■ ■ ■ ■ ■ ■</text></svg>"}},{"say":"So 2 ▲ = 6 ■ means 1 ▲ = 3 ■ (halve both sides). From there, any number of triangles can be converted to squares.","show":{"type":"big","text":"2 ▲ = 6 ■\n1 ▲ = 3 ■\n4 ▲ = 12 ■"}},{"say":"The counterfeit-coin puzzle: one coin among several is heavier. A balance has <b>three</b> outcomes: left heavier, right heavier, or level. So each weighing can split the suspects into three groups.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><polygon points='300,180 270,300 330,300' fill='#8d6e63'/><line x1='120' y1='180' x2='480' y2='180' stroke='#5d4037' stroke-width='8' stroke-linecap='round'/><line x1='130' y1='180' x2='130' y2='150' stroke='#5d4037' stroke-width='4'/><line x1='470' y1='180' x2='470' y2='150' stroke='#5d4037' stroke-width='4'/><rect x='40' y='140' width='180' height='12' rx='6' fill='#5d4037'/><rect x='380' y='140' width='180' height='12' rx='6' fill='#5d4037'/><text x='130' y='128' font-size='30' font-weight='700' text-anchor='middle' fill='#222'>1 2 3</text><text x='470' y='128' font-size='30' font-weight='700' text-anchor='middle' fill='#222'>4 5 6</text><text x='300' y='310' font-size='20' font-weight='700' text-anchor='middle' fill='#222'>Coins 7 8 9 wait on the table</text></svg>"}},{"say":"With 9 coins: weigh 3 against 3. If one side is heavier, the fake is among those 3; if level, among the other 3. A second weighing (1 against 1) finishes. In general k weighings handle up to <b>3ᵏ</b> coins.","show":{"type":"table","rows":[["Weighings","1","2","3","4"],["Coins (one known to be heavier)","3","9","27","81"]]}},{"say":"This is an information argument: k weighings have only 3ᵏ possible result sequences, so they cannot distinguish more than 3ᵏ possibilities. A lower bound like this proves that no cleverer method exists.","show":{"type":"big","text":"k weighings → at most 3ᵏ outcomes\n→ at most 3ᵏ coins"}},{"say":"<b>Explain it.</b> Explain why each weighing can divide the suspects into THREE groups, and why this shows that 9 coins need 2 weighings and no fewer.","show":{"type":"passage","title":"Explain it","text":"Explain why each weighing can divide the suspects into THREE groups, and why this shows that 9 coins need 2 weighings and no fewer.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise words from this lesson."}}],"practice":[{"q":"2 ▲ balance 6 ■. How many ■ balance 4 ▲?","type":"number","answer":12,"hint":"First find how many ■ balance one ▲.","why":"1 ▲ = 3 ■, so 4 ▲ = 12 ■.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><polygon points='300,180 270,300 330,300' fill='#8d6e63'/><line x1='120' y1='180' x2='480' y2='180' stroke='#5d4037' stroke-width='8' stroke-linecap='round'/><line x1='130' y1='180' x2='130' y2='150' stroke='#5d4037' stroke-width='4'/><line x1='470' y1='180' x2='470' y2='150' stroke='#5d4037' stroke-width='4'/><rect x='40' y='140' width='180' height='12' rx='6' fill='#5d4037'/><rect x='380' y='140' width='180' height='12' rx='6' fill='#5d4037'/><text x='130' y='128' font-size='34' font-weight='700' text-anchor='middle' fill='#222'>▲ ▲</text><text x='470' y='128' font-size='34' font-weight='700' text-anchor='middle' fill='#222'>■ ■ ■ ■ ■ ■</text></svg>"}},{"q":"3 ● + 2 ■ balance 2 ● + 6 ■. How many ■ balance one ●?","type":"number","answer":4,"hint":"Remove the same things from both pans.","why":"Remove 2 ● and 2 ■ from each side: 1 ● = 4 ■.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><polygon points='300,180 270,300 330,300' fill='#8d6e63'/><line x1='120' y1='180' x2='480' y2='180' stroke='#5d4037' stroke-width='8' stroke-linecap='round'/><line x1='130' y1='180' x2='130' y2='150' stroke='#5d4037' stroke-width='4'/><line x1='470' y1='180' x2='470' y2='150' stroke='#5d4037' stroke-width='4'/><rect x='40' y='140' width='180' height='12' rx='6' fill='#5d4037'/><rect x='380' y='140' width='180' height='12' rx='6' fill='#5d4037'/><text x='130' y='128' font-size='30' font-weight='700' text-anchor='middle' fill='#222'>●●● ■■</text><text x='470' y='128' font-size='30' font-weight='700' text-anchor='middle' fill='#222'>●● ■■■■■■</text></svg>"}},{"q":"1 ▲ = 2 ●, and 1 ● = 3 ■. How many ■ balance 2 ▲?","type":"number","answer":12,"hint":"Substitute step by step.","why":"2 ▲ = 4 ● = 12 ■.","show":{"type":"passage","title":"","text":"1 ▲ = 2 ●, and 1 ● = 3 ■. How many ■ balance 2 ▲?"}},{"q":"One coin among 3 is heavier. How many weighings are needed to be sure which?","type":"number","answer":1,"hint":"Weigh one against one. What do the three outcomes tell you?","why":"Weigh coin 1 against coin 2: the heavier side is the fake, and if level, coin 3 is. 1 weighing.","show":{"type":"passage","title":"","text":"One coin among 3 is heavier. How many weighings are needed to be sure which?"}},{"q":"One coin among 9 is heavier. What is the fewest number of weighings that guarantees finding it?","type":"number","answer":2,"hint":"Split into three groups of three.","why":"Weigh 3 against 3 to find the heavy group, then 1 against 1 within it: 2 weighings. One weighing has only 3 outcomes, which cannot distinguish 9 coins.","show":{"type":"passage","title":"","text":"One coin among 9 is heavier. What is the fewest number of weighings that guarantees finding it?"}},{"q":"One coin among 27 is heavier. Fewest weighings that guarantee finding it?","type":"number","answer":3,"hint":"Each weighing divides the suspects by three.","why":"27 → 9 → 3 → 1: 3 weighings, and 3² = 9 < 27 shows 2 are not enough.","show":{"type":"passage","title":"","text":"One coin among 27 is heavier. Fewest weighings that guarantee finding it?"}},{"q":"One coin among 10 is heavier. Fewest weighings that guarantee finding it?","type":"number","answer":3,"hint":"Is 10 more than 3²?","why":"Two weighings give at most 9 outcomes, fewer than 10 coins, so at least 3 are needed; 3 suffice (split 3, 3, 4).","show":{"type":"passage","title":"","text":"One coin among 10 is heavier. Fewest weighings that guarantee finding it?"}},{"q":"With 9 coins, how many coins should go on EACH pan in the first weighing?","type":"number","answer":3,"hint":"You want three equal groups.","why":"Put 3 on each pan and keep 3 aside, so every outcome leaves exactly 3 suspects.","show":{"type":"passage","title":"","text":"With 9 coins, how many coins should go on EACH pan in the first weighing?"}},{"q":"Coins 1–9; one is heavier. You weigh {1, 2, 3} against {4, 5, 6} and the scale balances. Where is the heavy coin?","options":["Among 7, 8, 9","Among 1, 2, 3","Among 4, 5, 6","It cannot be found"],"answer":"Among 7, 8, 9","hint":"What does 'level' tell you about the coins on the pans?","why":"A level scale means none of coins 1–6 is heavier, so the fake is among 7, 8, 9.","show":{"type":"passage","title":"","text":"Coins 1–9; one is heavier. You weigh {1, 2, 3} against {4, 5, 6} and the scale balances. Where is the heavy coin?"}},{"q":"You weigh {1, 2, 3} against {4, 5, 6} and the LEFT pan is heavier. Where is the heavy coin?","options":["Among 1, 2, 3","Among 4, 5, 6","Among 7, 8, 9"],"answer":"Among 1, 2, 3","hint":"The heavy coin pulls its pan down.","why":"The heavier pan holds the heavy coin: among 1, 2, 3.","show":{"type":"passage","title":"","text":"You weigh {1, 2, 3} against {4, 5, 6} and the LEFT pan is heavier. Where is the heavy coin?"}},{"q":"Review: A says 'B is a knight.' B says 'I am a knave.' What follows?","options":["B's statement is impossible, so this situation cannot occur","A is a knight","B is a knave"],"answer":"B's statement is impossible, so this situation cannot occur","hint":"Can anyone say 'I am a knave'?","why":"No islander can say 'I am a knave', so this conversation cannot happen on the island.","show":{"type":"passage","title":"","text":"Review: A says 'B is a knight.' B says 'I am a knave.' What follows?"}},{"q":"Review: which is equivalent to 'IF P THEN Q'?","options":["(NOT P) OR Q","P OR Q","P AND Q","(NOT Q) OR P"],"answer":"(NOT P) OR Q","hint":"When is each false?","why":"Both are false only when P is true and Q is false, so their truth tables match.","show":{"type":"passage","title":"","text":"Review: which is equivalent to 'IF P THEN Q'?"}},{gen:() => (gBalanceEq())},{gen:() => (gBalanceEq())},{gen:() => (gBalanceEq())},{gen:() => (gBalanceEq())},{gen:() => (gBalanceEq())},{gen:() => (gCoins())},{gen:() => (gCoins())},{gen:() => (gCoins())},{gen:() => (gCoins())},{gen:() => (gKnk(2))},{gen:() => (gTruth(2))},{gen:() => (gVenn3())},{gen:() => (gParity())}],"challenge":[{"q":"Using weights of 1 g, 3 g and 9 g, placed on EITHER pan, what is the largest whole number of grams N such that every weight from 1 g up to N g can be measured?","type":"number","answer":13,"hint":"A weight on the same pan as the object counts as subtracting.","why":"Each weight can be on the left (−), off (0) or on the right (+). The combinations give every whole number from −13 to 13, so every weight from 1 to 13 g can be measured (for example 2 = 3 − 1, and 5 = 9 − 3 − 1).","show":{"type":"passage","title":"","text":"Using weights of 1 g, 3 g and 9 g, placed on EITHER pan, what is the largest whole number of grams N such that every weight from 1 g up to N g can be measured?"}},{"q":"One coin among 81 is heavier. Fewest weighings to be sure?","type":"number","answer":4,"hint":"81 is a power of 3.","why":"81 = 3⁴: 4 weighings, each dividing the suspects by three.","show":{"type":"passage","title":"","text":"One coin among 81 is heavier. Fewest weighings to be sure?"}},{"q":"There are 12 coins; one is fake but you do not know whether it is heavier or lighter. Is it possible to find it, and say whether it is heavier or lighter, in 3 weighings?","options":["Yes","No"],"answer":"Yes","hint":"Count the possibilities: 12 coins × 2 (heavier or lighter). Compare with 3³.","why":"There are 24 possibilities and 3 weighings give 27 outcomes, so the counting argument allows it, and a clever scheme achieves it. This famous puzzle has a solution in exactly 3 weighings.","show":{"type":"passage","title":"","text":"There are 12 coins; one is fake but you do not know whether it is heavier or lighter. Is it possible to find it, and say whether it is heavier or lighter, in 3 weighings?"},"keepOrder":true},{gen:() => (gCoins())},{gen:() => (gBalanceEq())}],"extend":"Work out a complete 3-weighing strategy for the 12-coin problem (heavier or lighter unknown), writing a decision tree on paper. Then read about how the same counting idea (information measured in outcomes) underlies Claude Shannon's information theory.","offline":"Make a balance from a coat hanger, string and two cups. Use identical coins and one coin taped with a paper clip (the 'fake'). Have a grown-up hide the fake among 9 coins and find it in two weighings, explaining each step aloud."},
    {"title":"Binary numbers and other bases","icon":"💡","learn":[{"say":"Our numerals are <b>base ten</b>: each place is worth ten times the place to its right (ones, tens, hundreds). The idea of place value, with a symbol for zero, came to Europe from India through Arabic scholars.","show":{"type":"table","rows":[["Thousands","Hundreds","Tens","Ones"],["2","0","2","6"]],"caption":"2026 = 2 × 1000 + 0 × 100 + 2 × 10 + 6"}},{"say":"In <b>base two</b> (binary) each place is worth twice the place to its right: 1, 2, 4, 8, 16… and the only digits are 0 and 1. Switched-on cards below show 22.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><g font-size='26' font-weight='800' text-anchor='middle'><rect x='40' y='70' width='90' height='120' rx='12' fill='#ffe9a8' stroke='#999' stroke-width='2'/><text x='85' y='140'>16</text><text x='85' y='240' fill='#2e86ab'>1</text><rect x='148' y='70' width='90' height='120' rx='12' fill='#eee' stroke='#999' stroke-width='2'/><text x='193' y='140'>8</text><text x='193' y='240' fill='#2e86ab'>0</text><rect x='256' y='70' width='90' height='120' rx='12' fill='#ffe9a8' stroke='#999' stroke-width='2'/><text x='301' y='140'>4</text><text x='301' y='240' fill='#2e86ab'>1</text><rect x='364' y='70' width='90' height='120' rx='12' fill='#ffe9a8' stroke='#999' stroke-width='2'/><text x='409' y='140'>2</text><text x='409' y='240' fill='#2e86ab'>1</text><rect x='472' y='70' width='90' height='120' rx='12' fill='#eee' stroke='#999' stroke-width='2'/><text x='517' y='140'>1</text><text x='517' y='240' fill='#2e86ab'>0</text></g><text x='300' y='300' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>16 + 4 + 2 = 22 → binary 10110</text></svg>"}},{"say":"To convert to binary, take the largest power of two that fits, subtract, and repeat. To convert from binary, add the place values of the 1s.","show":{"type":"table","rows":[["Number","Powers of two","Binary"],["13","8 + 4 + 1","1101"],["22","16 + 4 + 2","10110"],["31","16 + 8 + 4 + 2 + 1","11111"]]}},{"say":"Computers use binary because a switch is either off or on. Each binary digit is a <b>bit</b>; 8 bits can represent 2⁸ = 256 different values. A truth table's T and F are bits too.","show":{"type":"big","text":"off/on = 0/1 = false/true"}},{"say":"Other bases appear in history. The Babylonians used <b>base sixty</b>, which survives in 60 seconds and 60 minutes. Roman numerals are not a place-value system at all: they add and subtract symbols (XIV = 10 + 4).","show":{"type":"table","rows":[["System","Example","Value"],["Roman","XIV","14"],["Roman","MCMXC","1990"],["base 5","34","3 × 5 + 4 = 19"],["base 60 (time)","1:30:00","5,400 seconds"]]}},{"say":"<b>Explain it.</b> Explain how place value works in base ten and in base two, and why Roman numerals make written calculation so much harder.","show":{"type":"passage","title":"Explain it","text":"Explain how place value works in base ten and in base two, and why Roman numerals make written calculation so much harder.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise words from this lesson."}}],"practice":[{"q":"What number is the binary numeral 1101?","type":"number","answer":13,"hint":"Places from the right: 1, 2, 4, 8.","why":"8 + 4 + 0 + 1 = 13.","show":{"type":"big","text":"1101₂"}},{"q":"What number is the binary numeral 10110?","type":"number","answer":22,"hint":"Places from the right: 1, 2, 4, 8, 16.","why":"16 + 0 + 4 + 2 + 0 = 22.","show":{"type":"big","text":"10110₂"}},{"q":"Write 19 in binary. Type the binary digits.","type":"number","answer":10011,"hint":"19 = 16 + ?","why":"19 = 16 + 2 + 1, so binary 10011.","show":{"type":"passage","title":"","text":"Write 19 in binary. Type the binary digits."}},{"q":"Write 40 in binary. Type the binary digits.","type":"number","answer":101000,"hint":"Which powers of two make 40?","why":"40 = 32 + 8, so binary 101000.","show":{"type":"passage","title":"","text":"Write 40 in binary. Type the binary digits."}},{"q":"What is the largest number that can be written with 6 binary digits?","type":"number","answer":63,"hint":"All six digits are 1.","why":"111111₂ = 32 + 16 + 8 + 4 + 2 + 1 = 63 (one less than 64 = 2⁶).","show":{"type":"passage","title":"","text":"What is the largest number that can be written with 6 binary digits?"}},{"q":"Using the five fingers of one hand as binary digits (up = 1, down = 0), how many different numbers can you show, including zero?","type":"number","answer":32,"hint":"Each finger doubles the possibilities.","why":"2⁵ = 32 different patterns, from 0 to 31.","show":{"type":"passage","title":"","text":"Using the five fingers of one hand as binary digits (up = 1, down = 0), how many different numbers can you show, including zero?"}},{"q":"How can you tell from its binary form whether a number is odd?","options":["Its last digit is 1","Its first digit is 1","It has an odd number of digits","It contains a 0"],"answer":"Its last digit is 1","hint":"Every place except the last is worth an even amount.","why":"All places except the ones place are even (2, 4, 8, …), so the number is odd exactly when the last digit is 1.","show":{"type":"passage","title":"","text":"How can you tell from its binary form whether a number is odd?"}},{"q":"What number does XIV represent?","type":"number","answer":14,"hint":"X = 10, and IV = 5 − 1.","why":"X + IV = 10 + 4 = 14.","show":{"type":"passage","title":"","text":"What number does XIV represent?"}},{"q":"What number does MCMXC represent?","type":"number","answer":1990,"hint":"M = 1000, CM = 900, XC = 90.","why":"1000 + 900 + 90 = 1990.","show":{"type":"passage","title":"","text":"What number does MCMXC represent?"}},{"q":"What number is 34 in base 5?","type":"number","answer":19,"hint":"The places are 1 and 5.","why":"3 × 5 + 4 = 19.","show":{"type":"passage","title":"","text":"What number is 34 in base 5?"}},{"q":"What number is 212 in base 3?","type":"number","answer":23,"hint":"The places are 9, 3 and 1.","why":"2 × 9 + 1 × 3 + 2 = 23.","show":{"type":"passage","title":"","text":"What number is 212 in base 3?"}},{"q":"How many seconds are in 2 hours, using the Babylonian base sixty?","type":"number","answer":7200,"hint":"Hours → minutes → seconds, multiplying by 60 each time.","why":"2 × 60 × 60 = 7,200 seconds.","show":{"type":"passage","title":"","text":"How many seconds are in 2 hours, using the Babylonian base sixty?"}},{"q":"Order from smallest to largest: 1010₂, 12 (base ten), 1111₂, 100₂.","type":"order","items":["1111₂","100₂","1010₂","12 (base ten)"],"answer":["100₂","1010₂","12 (base ten)","1111₂"],"hint":"Convert each binary numeral to base ten.","why":"100₂ = 4, 1010₂ = 10, then 12, then 1111₂ = 15.","show":{"type":"passage","title":"","text":"Order from smallest to largest: 1010₂, 12 (base ten), 1111₂, 100₂."}},{gen:() => (gBinary(1))},{gen:() => (gBinary(1))},{gen:() => (gBinary(1))},{gen:() => (gBinary(1))},{gen:() => (gBinary(1))},{gen:() => (gBinary(1))},{gen:() => (gBinary(2))},{gen:() => (gBinary(2))},{gen:() => (gBinary(2))},{gen:() => (gBinary(2))},{gen:() => (gBinary(2))},{gen:() => (gBinary(2))},{gen:() => (gBinary(2))}],"challenge":[{"q":"What is 1111111₂ in base ten?","type":"number","answer":127,"hint":"It is one less than the next power of two.","why":"1111111₂ = 2⁷ − 1 = 128 − 1 = 127.","show":{"type":"passage","title":"","text":"What is 1111111₂ in base ten?"}},{"q":"How many binary digits are needed to write 1000?","type":"number","answer":10,"hint":"Find the largest power of two not exceeding 1000.","why":"512 = 2⁹ ≤ 1000 < 1024 = 2¹⁰, so 1000 needs 10 binary digits (1111101000).","show":{"type":"passage","title":"","text":"How many binary digits are needed to write 1000?"}},{"q":"What is 2101 in base 3, written in base ten?","type":"number","answer":64,"hint":"The places are 27, 9, 3, 1.","why":"2 × 27 + 1 × 9 + 0 × 3 + 1 = 64.","show":{"type":"passage","title":"","text":"What is 2101 in base 3, written in base ten?"}},{gen:() => (gBinary(2))},{gen:() => (gBinary(2))}],"extend":"Make the five binary 'magic cards' (card k lists every number from 1 to 31 whose binary form has a 1 in place k). Ask someone to think of a number and say which cards show it; add the first numbers on those cards to read their mind. Then write a paragraph explaining exactly why the trick works.","offline":"Count to 31 on one hand in binary with a grown-up (thumb = 1, index = 2, middle = 4, ring = 8, little = 16). Then write the year you were born in binary, in Roman numerals and in base five."},
    {"title":"Sudoku reasoning","icon":"🔢","learn":[{"say":"A Sudoku is a <b>constraint puzzle</b>: every row, column and box contains each digit exactly once. Solving it is pure deduction; guessing is unnecessary in a well-made puzzle.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><rect x='168' y='28' width='264' height='264' fill='#fff'/><text x='201' y='71' font-size='32' font-weight='800' text-anchor='middle' fill='#222'>1</text><text x='267' y='71' font-size='32' font-weight='800' text-anchor='middle' fill='#222'>2</text><text x='333' y='137' font-size='32' font-weight='800' text-anchor='middle' fill='#222'>1</text><text x='267' y='203' font-size='32' font-weight='800' text-anchor='middle' fill='#222'>3</text><text x='399' y='269' font-size='32' font-weight='800' text-anchor='middle' fill='#222'>4</text><line x1='168' y1='28' x2='168' y2='292' stroke='#333' stroke-width='4'/><line x1='168' y1='28' x2='432' y2='28' stroke='#333' stroke-width='4'/><line x1='234' y1='28' x2='234' y2='292' stroke='#333' stroke-width='1.5'/><line x1='168' y1='94' x2='432' y2='94' stroke='#333' stroke-width='1.5'/><line x1='300' y1='28' x2='300' y2='292' stroke='#333' stroke-width='4'/><line x1='168' y1='160' x2='432' y2='160' stroke='#333' stroke-width='4'/><line x1='366' y1='28' x2='366' y2='292' stroke='#333' stroke-width='1.5'/><line x1='168' y1='226' x2='432' y2='226' stroke='#333' stroke-width='1.5'/><line x1='432' y1='28' x2='432' y2='292' stroke='#333' stroke-width='4'/><line x1='168' y1='292' x2='432' y2='292' stroke='#333' stroke-width='4'/></svg>"}},{"say":"A <b>naked single</b>: a cell whose row, column and box together already contain every digit but one. In the first row above, only 3 and 4 are missing; the columns and boxes then decide which goes where.","show":{"type":"list","items":["List the digits already in the cell's row","Add those in its column","Add those in its box","If only one digit is left, write it"],"caption":"Naked single"}},{"say":"A <b>hidden single</b>: within one row (or column or box), a digit that has only one possible cell. Ask 'where can the 3 go in this box?' rather than 'what can go in this cell?'","show":{"type":"big","text":"Ask both questions:\nWhat can go HERE?\nWhere can THIS digit go?"}},{"say":"A <b>6×6</b> Sudoku uses boxes of 2 rows by 3 columns. The same two techniques apply; the larger grid simply requires more careful bookkeeping.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><rect x='156' y='16' width='288' height='288' fill='#fff'/><text x='180' y='50' font-size='28' font-weight='800' text-anchor='middle' fill='#222'>4</text><text x='228' y='50' font-size='28' font-weight='800' text-anchor='middle' fill='#222'>3</text><text x='276' y='50' font-size='28' font-weight='800' text-anchor='middle' fill='#222'>6</text><text x='324' y='50' font-size='28' font-weight='800' text-anchor='middle' fill='#222'>5</text><text x='324' y='98' font-size='28' font-weight='800' text-anchor='middle' fill='#222'>3</text><text x='180' y='146' font-size='28' font-weight='800' text-anchor='middle' fill='#222'>5</text><text x='276' y='146' font-size='28' font-weight='800' text-anchor='middle' fill='#222'>4</text><text x='372' y='146' font-size='28' font-weight='800' text-anchor='middle' fill='#222'>3</text><text x='324' y='194' font-size='28' font-weight='800' text-anchor='middle' fill='#222'>2</text><text x='180' y='242' font-size='28' font-weight='800' text-anchor='middle' fill='#222'>2</text><text x='228' y='242' font-size='28' font-weight='800' text-anchor='middle' fill='#222'>4</text><text x='276' y='242' font-size='28' font-weight='800' text-anchor='middle' fill='#222'>3</text><text x='372' y='242' font-size='28' font-weight='800' text-anchor='middle' fill='#222'>6</text><text x='420' y='242' font-size='28' font-weight='800' text-anchor='middle' fill='#222'>5</text><t s.","why":"4 × 4 = 16 cells.","show":{"type":"passage","title":"","text":"In a 4×4 Sudoku, how many cells in total must be filled in the completed grid?"}},{"q":"A cell's row contains 1 and 3, and its column contains 2. Which digit must go in the cell (4×4 Sudoku)?","options":["4","1","2","3"],"answer":"4","hint":"Which digit is in neither the row nor the column?","why":"1, 2 and 3 are excluded, so the cell must be 4: a naked single.","show":{"type":"passage","title":"","text":"A cell's row contains 1 and 3, and its column contains 2. Which digit must go in the cell (4×4 Sudoku)?"}},{gen:() => (gSudoku(4))},{gen:() => (gSudoku(4))},{gen:() => (gSudoku(4))},{gen:() => (gSudoku(4))},{gen:() => (gSudoku(4))},{gen:() => (gSudoku(4))},{gen:() => (gSudoku(6))},{gen:() => (gSudoku(6))},{gen:() => (gSudoku(6))},{gen:() => (gSudoku(6))},{gen:() => (gSudoku(6))},{gen:() => (gSudoku(6))},{gen:() => (gSudoku(6))}],"challenge":[{"q":"Every row, column and 2×3 box must contain 1–6 exactly once. What number goes in the starred cell?","type":"number","answer":5,"hint":"List the digits already in the star's row, column and box. Which digit is missing from all three? If several are, ask where each of them can go in the box.","why":"The puzzle has exactly one solution (verified by exhaustive search). Completed, row 4 reads 3 6 2 1 5 4, so the star is 5. Check it against its column and box.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><rect x='156' y='16' width='288' height='288' fill='#fff'/><text x='324' y='50' font-size='28' font-weight='800' text-anchor='middle' fill='#222'>4</text><text x='372' y='50' font-size='28' font-weight='800' text-anchor='middle' fill='#222'>2</text><text x='420' y='50' font-size='28' font-weight='800' text-anchor='middle' fill='#222'>6</text><text x='228' y='98' font-size='28' font-weight='800' text-anchor='middle' fill='#222'>2</text><text x='372' y='98' font-size='28' font-weight=
