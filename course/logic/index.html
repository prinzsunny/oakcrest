 the 7 could have a vowel behind it: both could break the rule. The K is irrelevant (not a vowel), and the 4 cannot break the rule whatever is behind it (the rule does not say only vowels have even numbers). This is the famous Wason selection task.","show":{"type":"passage","title":"","text":"Four cards show: A, K, 4, 7. Each card has a letter on one side and a number on the other. Rule: 'If a card has a vowel on one side, then it has an even number on the other.' Which cards MUST you turn over to test the rule?"}},{"q":"Statement: 'If n is divisible by 6, then n is divisible by 3.' Which of these is TRUE?","options":["The contrapositive","The converse","The inverse","None of them"],"answer":"The contrapositive","hint":"Test the converse with 9.","why":"The original is true, so its contrapositive is true. The converse ('divisible by 3 → divisible by 6') fails for 9, and so does the inverse (its equivalent).","show":{"type":"passage","title":"","text":"Statement: 'If n is divisible by 6, then n is divisible by 3.' Which of these is TRUE?"}},{"q":"Consider: 'If I study, I pass. If I pass, I celebrate. I did not celebrate.' What follows?","options":["I did not study","I studied","I passed","Nothing"],"answer":"I did not study","hint":"Chain, then use the contrapositive.","why":"Chaining gives 'if I study, I celebrate'. Not celebrating gives, by the contrapositive, not studying.","show":{"type":"passage","title":"","text":"Consider: 'If I study, I pass. If I pass, I celebrate. I did not celebrate.' What follows?"}},{gen:() => (gCondInfer())},{gen:() => (gCondInfer())}],"extend":"Find three conditionals in everyday life (a shop sign, a game rule, a recipe). For each, write the converse, inverse and contrapositive, and decide with evidence which are true. Then read about the Wason selection task and explain in writing why most adults answer it incorrectly.","offline":"Play 'Break the rule' with a grown-up: one person states an if–then rule about objects in a box (for example 'if it is red, it is round'); the other may inspect only the objects they name, and must name exactly those that could break the rule."},
    {"title":"Review: all, some, none","icon":"🔵","learn":[{"say":"Review: statements and conditionals. Extension: the four <b>categorical statements</b> of classical logic, first studied systematically by Aristotle about 2,350 years ago.","show":{"type":"table","rows":[["Form","Pattern","Example"],["A (universal yes)","All S are P","All cats are mammals."],["E (universal no)","No S are P","No fish are mammals."],["I (particular yes)","Some S are P","Some birds are swimmers."],["O (particular no)","Some S are not P","Some birds are not fliers."]]}},{"say":"Venn diagrams make these exact. <b>Shading</b> a region means it is empty. 'All cats are mammals' shades the part of the cat circle outside the mammal circle.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><rect x='20' y='10' width='560' height='300' rx='16' fill='#fafafa' stroke='#bbb' stroke-width='2'/><defs><pattern id='hz' width='10' height='10' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='4' height='10' fill='#999'/></pattern></defs><circle cx='230' cy='170' r='115' fill='url(#hz)' stroke='#2e86ab' stroke-width='4'/><circle cx='370' cy='170' r='115' fill='#fafafa' stroke='#e4572e' stroke-width='4'/><circle cx='230' cy='170' r='115' fill='none' stroke='#2e86ab' stroke-width='4'/><text x='200' y='46' font-size='22' font-weight='700' text-anchor='middle' fill='#2e86ab'>cats</text><text x='400' y='46' font-size='22' font-weight='700' text-anchor='middle' fill='#e4572e'>mammals</text><text x='300' y='300' font-size='20' font-weight='700' text-anchor='middle' fill='#222'>Shaded = empty: no cat outside 'mammals'</text></svg>"}},{"say":"A cross <b>✕</b> means 'at least one thing is here'. 'Some swans are white' puts a cross in the overlap. In logic, 'some' means <b>at least one</b>, possibly all.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><rect x='20' y='10' width='560' height='300' rx='16' fill='#fafafa' stroke='#bbb' stroke-width='2'/><circle cx='230' cy='170' r='115' fill='#2e86ab' fill-opacity='0.18' stroke='#2e86ab' stroke-width='4'/><circle cx='370' cy='170' r='115' fill='#e4572e' fill-opacity='0.18' stroke='#e4572e' stroke-width='4'/><text x='200' y='46' font-size='22' font-weight='700' text-anchor='middle' fill='#2e86ab'>swans</text><text x='400' y='46' font-size='22' font-weight='700' text-anchor='middle' fill='#e4572e'>white things</text><text x='175' y='180' font-size='30' font-weight='700' text-anchor='middle' fill='#222'></text><text x='300' y='180' font-size='30' font-weight='700' text-anchor='middle' fill='#222'>✕</text><text x='425' y='180' font-size='30' font-weight='700' text-anchor='middle' fill='#222'></text><text x='300' y='300' font-size='20' font-weight='700' text-anchor='middle' fill='#222'>✕ = at least one member here</text></svg>"}},{"say":"<b>Contradictory</b> pairs: 'All S are P' and 'Some S are not P' can never both be true, and can never both be false; exactly one is true. The same holds for 'No S are P' and 'Some S are P'.","show":{"type":"table","rows":[["Statement","Its contradictory"],["All S are P","Some S are not P"],["No S are P","Some S are P"]]}},{"say":"Evidence differs by form. One example proves 'some'. One counter-example disproves 'all'. To establish 'all', you need either every case checked or a <b>reason</b> (a proof) that covers every case.","show":{"type":"list","items":["Prove 'some': find one example","Disprove 'all': find one counter-example","Prove 'all': check every case, or give a proof","A thousand examples do not prove 'all'"],"caption":"What counts as evidence"}},{"say":"<b>Explain it.</b> Explain why one white swan proves 'some swans are white', but a thousand white swans do not prove 'all swans are white'. (Black swans live in Australia.)","show":{"type":"passage","title":"Explain it","text":"Explain why one white swan proves 'some swans are white', but a thousand white swans do not prove 'all swans are white'. (Black swans live in Australia.)\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise words from this lesson."}}],"practice":[{"q":"Which form is 'No reptiles have fur'?","options":["E: No S are P","A: All S are P","I: Some S are P","O: Some S are not P"],"answer":"E: No S are P","hint":"Is it universal or particular? Affirmative or negative?","why":"It denies the predicate of every reptile: a universal negative, form E.","show":{"type":"passage","title":"","text":"Which form is 'No reptiles have fur'?"}},{"q":"Which form is 'Some planets are not rocky'?","options":["O: Some S are not P","E: No S are P","I: Some S are P","A: All S are P"],"answer":"O: Some S are not P","hint":"Particular (some) and negative (not).","why":"'Some … are not …' is form O.","show":{"type":"passage","title":"","text":"Which form is 'Some planets are not rocky'?"}},{"q":"'Some cats are mammals.' Is this statement true in logic?","options":["Yes: 'some' means at least one, and it is true even though all cats are mammals","No: it should say 'all'","No: it is an opinion"],"answer":"Yes: 'some' means at least one, and it is true even though all cats are mammals","hint":"Does 'some' rule out 'all'?","why":"In logic 'some' means 'at least one'. Since at least one cat is a mammal, the statement is true. It would merely be less informative than 'all'.","show":{"type":"passage","title":"","text":"'Some cats are mammals.' Is this statement true in logic?"}},{"q":"'All S are P' is true. Which statement must be FALSE?","options":["Some S are not P","Some S are P","No S are not P","All S are S"],"answer":"Some S are not P","hint":"Which is its contradictory?","why":"'Some S are not P' is the contradictory of 'All S are P', so exactly one of them is true.","show":{"type":"passage","title":"","text":"'All S are P' is true. Which statement must be FALSE?"}},{"q":"'Some S are P' is false. What do you know about 'No S are P'?","options":["It is true","It is false","We cannot tell"],"answer":"It is true","hint":"These two are contradictories.","why":"'Some S are P' false means not even one S is P, which is exactly 'No S are P'.","show":{"type":"passage","title":"","text":"'Some S are P' is false. What do you know about 'No S are P'?"}},{"q":"In the Venn diagram for 'All cats are mammals', which region is shaded (empty)?","options":["Cats that are not mammals","Mammals that are not cats","Cats that are mammals","Things that are neither"],"answer":"Cats that are not mammals","hint":"Which kind of thing does the statement say cannot exist?","why":"The statement rules out a cat outside the mammals, so that region is empty.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><rect x='20' y='10' width='560' height='300' rx='16' fill='#fafafa' stroke='#bbb' stroke-width='2'/><defs><pattern id='hz' width='10' height='10' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='4' height='10' fill='#999'/></pattern></defs><circle cx='230' cy='170' r='115' fill='url(#hz)' stroke='#2e86ab' stroke-width='4'/><circle cx='370' cy='170' r='115' fill='#fafafa' stroke='#e4572e' stroke-width='4'/><circle cx='230' cy='170' r='115' fill='none' stroke='#2e86ab' stroke-width='4'/><text x='200' y='46' font-size='22' font-weight='700' text-anchor='middle' fill='#2e86ab'>cats</text><text x='400' y='46' font-size='22' font-weight='700' text-anchor='middle' fill='#e4572e'>mammals</text><text x='300' y='300' font-size='20' font-weight='700' text-anchor='middle' fill='#222'>Shaded = empty: no cat outside 'mammals'</text></svg>"}},{"q":"How many counter-examples are needed to disprove 'All prime numbers are odd'?","type":"number","answer":1,"hint":"What does one even prime do to the claim?","why":"One counter-example suffices: 2 is prime and even, so the universal claim is false.","show":{"type":"passage","title":"","text":"How many counter-examples are needed to disprove 'All prime numbers are odd'?"}},{"q":"A scientist has seen 5,000 swans in Europe, all white. What may she correctly conclude?","options":["Many swans are white; she has not shown that all are","All swans are white","No swans are black","Swans are white by definition"],"answer":"Many swans are white; she has not shown that all are","hint":"Does 5,000 cases cover every swan?","why":"Her evidence establishes 'some' (indeed many) but not 'all'. Europeans believed all swans were white until black swans were recorded in Australia in 1697.","show":{"type":"passage","title":"","text":"A scientist has seen 5,000 swans in Europe, all white. What may she correctly conclude?"}},{"q":"Which statement is the contradictory of 'No fish can fly'?","options":["Some fish can fly","All fish can fly","Some fish cannot fly","No birds can swim"],"answer":"Some fish can fly","hint":"Which statement is true exactly when this one is false?","why":"'No S are P' and 'Some S are P' are contradictories. (In fact flying fish glide long distances, so 'Some fish can fly' is arguably the true one.)","show":{"type":"passage","title":"","text":"Which statement is the contradictory of 'No fish can fly'?"}},{"q":"Review: 'If the plant gets no water, it wilts.' The plant wilted. What follows?","options":["Nothing certain about the water","It got no water","It got water"],"answer":"Nothing certain about the water","hint":"Is this reasoning from the conclusion back to the condition?","why":"A plant can wilt from heat, disease or other causes. Concluding 'no water' would be affirming the consequent.","show":{"type":"passage","title":"","text":"Review: 'If the plant gets no water, it wilts.' The plant wilted. What follows?"}},{"q":"Review: among living animals, having wings is ___ for being a bird.","options":["necessary but not sufficient","sufficient but not necessary","both necessary and sufficient","neither necessary nor sufficient"],"answer":"necessary but not sufficient","hint":"Does every bird have wings? Does everything with wings count as a bird?","why":"Every living bird has wings, even flightless ones such as penguins, ostriches and kiwis (whose wings are tiny), so wings are necessary. Bats and bees have wings but are not birds, so wings are not sufficient.","show":{"type":"passage","title":"","text":"Review: among living animals, having wings is ___ for being a bird."}},{"q":"Which piece of evidence would PROVE 'Some metals are liquid at room temperature'?","options":["Mercury is a metal that is liquid at room temperature","Most metals are solid","Iron is solid","Metals are shiny"],"answer":"Mercury is a metal that is liquid at room temperature","hint":"To prove 'some', what do you need?","why":"One genuine example establishes 'some'. Mercury is such an example.","show":{"type":"passage","title":"","text":"Which piece of evidence would PROVE 'Some metals are liquid at room temperature'?"}},{gen:() => (gNegate())},{gen:() => (gNegate())},{gen:() => (gNegate())},{gen:() => (gNegate())},{gen:() => (gSyllogism(1))},{gen:() => (gSyllogism(1))},{gen:() => (gSyllogism(1))},{gen:() => (gVenn2(1))},{gen:() => (gVenn2(1))},{gen:() => (gKind())},{gen:() => (gKind())},{gen:() => (gNecSuff())},{gen:() => (gNecSuff())}],"challenge":[{"q":"If 'Some S are not P' is false, which statement must be true?","options":["All S are P","No S are P","Some S are P","All P are S"],"answer":"All S are P","hint":"Find its contradictory.","why":"'Some S are not P' false means there is no S outside P: All S are P.","show":{"type":"passage","title":"","text":"If 'Some S are not P' is false, which statement must be true?"}},{"q":"Can 'All S are P' and 'No S are P' both be true?","options":["Yes, if there are no S at all","Never","Always"],"answer":"Yes, if there are no S at all","hint":"What if the group S is empty?","why":"If nothing is an S, both universal statements are 'vacuously' true: there is no S to break either one. That is why, in modern logic, 'all' does not by itself assert that anything exists.","show":{"type":"passage","title":"","text":"Can 'All S are P' and 'No S are P' both be true?"}},{"q":"A class of 30 is surveyed. 'Some students walk to school' is true and 'Some students do not walk to school' is also true. At least how many students walk?","type":"number","answer":1,"hint":"What is the smallest number that makes 'some' true?","why":"'Some' means at least one, so at least 1 walks (and at least 1 does not).","show":{"type":"passage","title":"","text":"A class of 30 is surveyed. 'Some students walk to school' is true and 'Some students do not walk to school' is also true. At least how many students walk?"}},{gen:() => (gSyllogism(2))},{gen:() => (gVenn2(2))}],"extend":"Read about the 'black swan' and the philosopher Karl Popper's idea of falsification: scientific claims of the form 'all' can be refuted by one observation but never finally proved by examples. Write a paragraph giving a scientific claim, the observation that would refute it, and why that makes it a good scientific claim.","offline":"With a grown-up, write five 'all', 'some' and 'no' statements about your home (all chairs have four legs, some books are red…). Then investigate: find an example for each 'some' and search for a counter-example to each 'all'. Record what you found."},
    {"title":"Harder grids and two-move combinations","icon":"🔎","learn":[{"say":"Harder grid puzzles use <b>compound clues</b>: 'either … or …', 'neither … nor …', and 'if … then …'. Each must be translated precisely before use.","show":{"type":"table","rows":[["Clue","Meaning in the grid"],["Either Ana or Ben plays chess","the chess ✓ is in Ana's row or Ben's row"],["Ben plays neither chess nor rowing","two ✗ in Ben's row"],["If Cai plays tennis, Dot plays judo","if you ever place Cai–tennis, you must place Dot–judo"]]}},{"say":"A conditional clue is often used <b>backwards, by its contrapositive</b>. If we learn that Dot does not play judo, then Cai cannot play tennis.","show":{"type":"big","text":"If Cai–tennis then Dot–judo\n≡ If NOT Dot–judo then NOT Cai–tennis"}},{"say":"When stuck, use <b>case analysis</b>: suppose one possibility, follow the consequences, and see whether a contradiction appears. If it does, that possibility is eliminated.","show":{"type":"list","items":["Suppose: Gil owns the cat.","Then (clue 4) Fay likes green.","Follow every consequence…","Contradiction? Eliminate the supposition.","No contradiction? Keep it as possible."]}},{"say":"Chess: a <b>combination</b> is a forcing sequence of moves. The strongest players also see <b>quiet moves</b>, moves that give no check but leave the opponent no good reply.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g font-size='30' text-anchor='middle' stroke='#111'><text x='277.5' y='35' fill='#111' stroke-width='0.4'>♚&#xFE0E;</text><text x='211.5' y='101' fill='#fff' stroke-width='1.2'>♔&#xFE0E;</text><text x='46.5' y='68' fill='#fff' stroke-width='1.2'>♖&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g><text x='330' y='60' font-size='22' font-weight='700' text-anchor='start' fill='#222'>White to move.</text><text x='330' y='96' font-size='22' font-weight='700' text-anchor='start' fill='#222'>Mate in two:</text><text x='330' y='132' font-size='22' font-weight='700' text-anchor='start' fill='#222'>what is the key?</text></svg>"}},{"say":"Here 1. Kg6! takes the h7 and g7 squares. Black's only move is Kg8, and then Ra8 is checkmate. Checking first (Ra8+?) lets the king escape to h7.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g opacity='0.85'><circle cx='46.5' cy='24.5' r='9' fill='#e4572e'/></g><g font-size='30' text-anchor='middle' stroke='#111'><text x='244.5' y='35' fill='#111' stroke-width='0.4'>♚&#xFE0E;</text><text x='244.5' y='101' fill='#fff' stroke-width='1.2'>♔&#xFE0E;</text><text x='46.5' y='68' fill='#fff' stroke-width='1.2'>♖&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g><text x='330' y='60' font-size='22' font-weight='700' text-anchor='start' fill='#222'>After 1. Kg6 Kg8,</text><text x='330' y='96' font-size='22' font-weight='700' text-anchor='start' fill='#222'>2. Ra8 is mate.</text></svg>"}},{"say":"<b>Explain it.</b> Explain how a conditional clue can be used 'backwards' through its contrapositive, using the clue 'If Cai plays tennis, then Dot plays judo'.","show":{"type":"passage","title":"Explain it","text":"Explain how a conditional clue can be used 'backwards' through its contrapositive, using the clue 'If Cai plays tennis, then Dot plays judo'.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise words from this lesson."}}],"practice":[{"q":"Who plays chess?","options":["Ana","Ben","Cai","Dot"],"answer":"Ana","hint":"Clue 1 offers two candidates. Does clue 3 eliminate one?","why":"Clue 3 says Ben does not play chess, so by clue 1 Ana does.","show":{"type":"list","items":["People: Ana, Ben, Cai, Dot","Sports: chess, tennis, judo, rowing (one each)","1. Either Ana or Ben plays chess.","2. If Cai plays tennis, then Dot plays judo.","3. Ben plays neither chess nor rowing.","4. Dot plays neither tennis nor judo.","5. Cai does not row."],"caption":"Clues"}},{"q":"Same puzzle: what does Dot play?","options":["rowing","tennis","judo","chess"],"answer":"rowing","hint":"Dot is excluded from tennis and judo; chess is Ana's.","why":"Dot plays neither tennis nor judo, and chess belongs to Ana, so Dot rows.","show":{"type":"list","items":["People: Ana, Ben, Cai, Dot","Sports: chess, tennis, judo, rowing (one each)","1. Either Ana or Ben plays chess.","2. If Cai plays tennis, then Dot plays judo.","3. Ben plays neither chess nor rowing.","4. Dot plays neither tennis nor judo.","5. Cai does not row."],"caption":"Clues"}},{"q":"Same puzzle: what does Cai play?","options":["judo","tennis","rowing","chess"],"answer":"judo","hint":"Use clue 2 backwards: does Dot play judo?","why":"Dot rows, so Dot does not play judo. By the contrapositive of clue 2, Cai does not play tennis. Cai does not row (clue 5), so Cai plays judo, and Ben plays tennis.","show":{"type":"list","items":["People: Ana, Ben, Cai, Dot","Sports: chess, tennis, judo, rowing (one each)","1. Either Ana or Ben plays chess.","2. If Cai plays tennis, then Dot plays judo.","3. Ben plays neither chess nor rowing.","4. Dot plays neither tennis nor judo.","5. Cai does not row."],"caption":"Clues"}},{"q":"Same puzzle: who plays tennis?","options":["Ben","Cai","Ana","Dot"],"answer":"Ben","hint":"After Cai's sport is fixed, who is left?","why":"Ana chess, Dot rowing, Cai judo, so Ben plays tennis. Check every clue: all hold.","show":{"type":"list","items":["People: Ana, Ben, Cai, Dot","Sports: chess, tennis, judo, rowing (one each)","1. Either Ana or Ben plays chess.","2. If Cai plays tennis, then Dot plays judo.","3. Ben plays neither chess nor rowing.","4. Dot plays neither tennis nor judo.","5. Cai does not row."],"caption":"Clues"}},{"q":"Who owns the owl?","options":["Eli","Fay","Gil"],"answer":"Fay","hint":"Which people are excluded from the owl by clues 1, 2 and 7?","why":"Eli likes blue, so by clue 1 Eli cannot own the owl. Gil does not own the owl (clue 7). So Fay owns it.","show":{"type":"list","items":["People: Eli, Fay, Gil","Pets: cat, dog, owl","Colors: red, blue, green (one each)","1. The owl's owner likes either red or green.","2. Eli likes blue.","3. Fay does not own the dog.","4. If Gil owns the cat, then Fay likes green.","5. The dog's owner does not like red.","6. Fay does not like red.","7. Gil does not own the owl."],"caption":"Clues"}},{"q":"Same puzzle: who owns the dog?","options":["Eli","Fay","Gil"],"answer":"Eli","hint":"Fay has the owl. Of Eli and Gil, who may own the dog? Use clue 4 or clue 5.","why":"Suppose Gil owns the dog; then Eli owns the cat. Fay must like green (owl owner: red or green, and clue 6 forbids red), so Gil likes red. But the dog's owner may not like red (clue 5): contradiction. So Eli owns the dog and Gil the cat.","show":{"type":"list","items":["People: Eli, Fay, Gil","Pets: cat, dog, owl","Colors: red, blue, green (one each)","1. The owl's owner likes either red or green.","2. Eli likes blue.","3. Fay does not own the dog.","4. If Gil owns the cat, then Fay likes green.","5. The dog's owner does not like red.","6. Fay does not like red.","7. Gil does not own the owl."],"caption":"Clues"}},{"q":"Same puzzle: which color does Gil like?","options":["red","blue","green"],"answer":"red","hint":"Eli's color is given. Which color must Fay take?","why":"Eli likes blue. Fay, the owl owner, likes red or green, but not red (clue 6), so green. Gil likes red.","show":{"type":"list","items":["People: Eli, Fay, Gil","Pets: cat, dog, owl","Colors: red, blue, green (one each)","1. The owl's owner likes either red or green.","2. Eli likes blue.","3. Fay does not own the dog.","4. If Gil owns the cat, then Fay likes green.","5. The dog's owner does not like red.","6. Fay does not like red.","7. Gil does not own the owl."],"caption":"Clues"}},{"q":"Translate the clue: 'Ben plays neither chess nor rowing.'","options":["Ben does not play chess, and Ben does not play rowing","Ben plays chess or rowing","Ben plays chess but not rowing","Ben does not play both"],"answer":"Ben does not play chess, and Ben does not play rowing","hint":"'Neither … nor' denies both.","why":"'Neither A nor B' means not A and not B: two ✗ marks.","show":{"type":"passage","title":"","text":"Translate the clue: 'Ben plays neither chess nor rowing.'"}},{"q":"A clue says 'Either Ana or Ben plays chess.' We discover Ana plays tennis. What follows?","options":["Ben plays chess","Ben does not play chess","Nothing"],"answer":"Ben plays chess","hint":"One of the two options is eliminated.","why":"With only two candidates, eliminating Ana leaves Ben. This is called disjunctive syllogism.","show":{"type":"passage","title":"","text":"A clue says 'Either Ana or Ben plays chess.' We discover Ana plays tennis. What follows?"}},{"q":"A clue says 'If Cai plays tennis, then Dot plays judo.' We learn Dot plays chess. What follows?","options":["Cai does not play tennis","Cai plays tennis","Nothing certain"],"answer":"Cai does not play tennis","hint":"Use the contrapositive.","why":"Dot does not play judo; by the contrapositive, Cai does not play tennis (modus tollens).","show":{"type":"passage","title":"","text":"A clue says 'If Cai plays tennis, then Dot plays judo.' We learn Dot plays chess. What follows?"}},{"q":"White to move and mate in two. What is the key move?","options":["King to g6","Rook to a8","Rook to h7","King to f7"],"answer":"King to g6","hint":"Is the check Ra8 immediately decisive, or does the king escape?","why":"1. Kg6 takes g7 and h7 away from the black king (the rook already guards the seventh rank). Black's only legal move is Kg8, and 2. Ra8 is checkmate. The tempting check 1. Ra8+ lets the king escape to h7.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g font-size='30' text-anchor='middle' stroke='#111'><text x='277.5' y='35' fill='#111' stroke-width='0.4'>♚&#xFE0E;</text><text x='211.5' y='101' fill='#fff' stroke-width='1.2'>♔&#xFE0E;</text><text x='46.5' y='68' fill='#fff' stroke-width='1.2'>♖&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g></svg>"}},{"q":"White to move and mate in two. What is the key move?","options":["King to f6","Rook to d8","King to d6","Rook to e1"],"answer":"King to f6","hint":"Which squares can the black king use now? After which quiet move does it have only one?","why":"1. Kf6 covers e7, f7 and g7, and the rook controls the d-file, so Black's only move is Kf8; then 2. Rd8 is checkmate. The immediate check 1. Rd8+ fails because the king simply captures the undefended rook.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g font-size='30' text-anchor='middle' stroke='#111'><text x='178.5' y='35' fill='#111' stroke-width='0.4'>♚&#xFE0E;</text><text x='178.5' y='101' fill='#fff' stroke-width='1.2'>♔&#xFE0E;</text><text x='145.5' y='266' fill='#fff' stroke-width='1.2'>♖&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g></svg>"}},{gen:() => (gGrid(4, 1))},{gen:() => (gGrid(4, 1))},{gen:() => (gGrid(4, 1))},{gen:() => (gGrid(4, 1))},{gen:() => (gGrid(3, 2))},{gen:() => (gGrid(3, 2))},{gen:() => (gGrid(3, 2))},{gen:() => (gGrid(3, 2))},{gen:() => (gMate2())},{gen:() => (gMate2())},{gen:() => (gMate2())},{gen:() => (gCondInfer())},{gen:() => (gCondInfer())}],"challenge":[{"q":"A grid puzzle has 4 people and 4 sports. Clue: 'Either Ana or Ben plays chess.' Before this clue, how many of the 24 possible matchings had Ana or Ben playing chess?","type":"number","answer":12,"hint":"In how many matchings does Ana play chess? Ben?","why":"Ana plays chess in 6 matchings (the other three sports can be arranged 3 × 2 × 1 ways), and Ben in 6 more. These cannot overlap, so 12 matchings survive this clue.","show":{"type":"passage","title":"","text":"A grid puzzle has 4 people and 4 sports. Clue: 'Either Ana or Ben plays chess.' Before this clue, how many of the 24 possible matchings had Ana or Ben playing chess?"}},{"q":"Three boxes are labeled 'apples', 'oranges' and 'mixed', and every label is wrong. You may take one fruit from one box. From which box should you draw to relabel all three correctly?","options":["The box labeled 'mixed'","The box labeled 'apples'","The box labeled 'oranges'"],"answer":"The box labeled 'mixed'","hint":"The 'mixed' box cannot be mixed. What does one fruit from it tell you?","why":"The box labeled 'mixed' must contain only apples or only oranges, so one fruit reveals its true contents. Say it is apples. The box labeled 'oranges' cannot be oranges and cannot be apples (taken), so it is mixed, and the box labeled 'apples' holds oranges.","show":{"type":"passage","title":"","text":"Three boxes are labeled 'apples', 'oranges' and 'mixed', and every label is wrong. You may take one fruit from one box. From which box should you draw to relabel all three correctly?"}},{"q":"'Either the key is in the drawer or it is in the coat.' 'If it is in the coat, the coat is heavy.' The coat is not heavy. Where is the key?","options":["In the drawer","In the coat","Cannot be determined"],"answer":"In the drawer","hint":"Chain modus tollens with disjunctive syllogism.","why":"The coat is not heavy, so (modus tollens) the key is not in the coat. Then (disjunctive syllogism) it is in the drawer.","show":{"type":"passage","title":"","text":"'Either the key is in the drawer or it is in the coat.' 'If it is in the coat, the coat is heavy.' The coat is not heavy. Where is the key?"}},{gen:() => (gGrid(4, 2))},{gen:() => (gMate2())}],"extend":"Read a chapter of a Sherlock Holmes story (Arthur Conan Doyle's stories are in the public domain, for example 'The Adventure of the Blue Carbuncle'). Identify three deductions Holmes makes. For each, write the premises he uses and decide whether his conclusion truly follows or merely seems likely.","offline":"Set up the two mate-in-two positions on a real board and play them against a grown-up who defends as well as possible. Then try to compose your own mate-in-two with king and rook against king, and test it by trying every Black reply."},
    {"title":"Turn and fold: rotation, reflection, nets","icon":"🧊","learn":[{"say":"A <b>rotation</b> turns a figure about a point; a <b>reflection</b> flips it over a line, like a mirror. Rotation keeps 'handedness'; reflection reverses it.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><rect x='114' y='111' width='26' height='26' fill='#2e86ab' stroke='#fff' stroke-width='2'/><rect x='114' y='137' width='26' height='26' fill='#2e86ab' stroke='#fff' stroke-width='2'/><rect x='114' y='163' width='26' height='26' fill='#2e86ab' stroke='#fff' stroke-width='2'/><rect x='140' y='163' width='26' height='26' fill='#2e86ab' stroke='#fff' stroke-width='2'/><rect x='313' y='124' width='26' height='26' fill='#2e86ab' stroke='#fff' stroke-width='2'/><rect x='287' y='124' width='26' height='26' fill='#2e86ab' stroke='#fff' stroke-width='2'/><rect x='261' y='124' width='26' height='26' fill='#2e86ab' stroke='#fff' stroke-width='2'/><rect x='261' y='150' width='26' height='26' fill='#2e86ab' stroke='#fff' stroke-width='2'/><rect x='460' y='111' width='26' height='26' fill='#2e86ab' stroke='#fff' stroke-width='2'/><rect x='460' y='137' width='26' height='26' fill='#2e86ab' stroke='#fff' stroke-width='2'/><rect x='460' y='163' width='26' height='26' fill='#2e86ab' stroke='#fff' stroke-width='2'/><rect x='434' y='163' width='26' height='26' fill='#2e86ab' stroke='#fff' stroke-width='2'/><text x='140' y='270' font-size='20' font-weight='700' text-anchor='middle' fill='#222'>original</text><text x='300' y='270' font-size='20' font-weight='700' text-anchor='middle' fill='#222'>rotated</text><text x='460' y='270' font-size='20' font-weight='700' text-anchor='middle' fill='#222'>reflected</text></svg>"}},{"say":"Some shapes are <b>chiral</b> (from the Greek for 'hand'): their mirror image cannot be obtained by turning. Your left and right hands are the classic example; no rotation turns a left glove into a right glo do the remaining two squares go?","why":"The row of four wraps around to form four sides; the two remaining squares close the top and the bottom.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><rect x='208' y='91' width='46' height='46' fill='#e8f2fb' stroke='#2e86ab' stroke-width='2.5'/><rect x='208' y='137' width='46' height='46' fill='#e8f2fb' stroke='#2e86ab' stroke-width='2.5'/><rect x='254' y='137' width='46' height='46' fill='#e8f2fb' stroke='#2e86ab' stroke-width='2.5'/><rect x='300' y='137' width='46' height='46' fill='#e8f2fb' stroke='#2e86ab' stroke-width='2.5'/><rect x='346' y='137' width='46' height='46' fill='#e8f2fb' stroke='#2e86ab' stroke-width='2.5'/><rect x='254' y='183' width='46' height='46' fill='#e8f2fb' stroke='#2e86ab' stroke-width='2.5'/></svg>"},"keepOrder":true},{"q":"Does this 2-by-3 block fold into a closed cube?","options":["Yes","No"],"answer":"No","hint":"What happens to the squares when the block is folded?","why":"Folding a 2-by-3 block makes two squares overlap and leaves faces open, so it is not a cube net.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><rect x='225' y='110' width='50' height='50' fill='#e8f2fb' stroke='#2e86ab' stroke-width='2.5'/><rect x='275' y='110' width='50' height='50' fill='#e8f2fb' stroke='#2e86ab' stroke-width='2.5'/><rect x='325' y='110' width='50' height='50' fill='#e8f2fb' stroke='#2e86ab' stroke-width='2.5'/><rect x='225' y='160' width='50' height='50' fill='#e8f2fb' stroke='#2e86ab' stroke-width='2.5'/><rect x='275' y='160' width='50' height='50' fill='#e8f2fb' stroke='#2e86ab' stroke-width='2.5'/><rect x='325' y='160' width='50' height='50' fill='#e8f2fb' stroke='#2e86ab' stroke-width='2.5'/></svg>"},"keepOrder":true},{"q":"Which capital letter does NOT look the same after a half turn (180°)?","options":["E","N","S","Z"],"answer":"E","hint":"Turn the page upside down in your mind.","why":"N, S and Z have half-turn symmetry. E turned upside down faces the wrong way.","show":{"type":"passage","title":"","text":"Which capital letter does NOT look the same after a half turn (180°)?"}},{"q":"Which capital letter is unchanged by a left–right mirror?","options":["A","B","F","R"],"answer":"A","hint":"Does the letter have a vertical line of symmetry?","why":"A has a vertical line of symmetry. B, F and R are reversed by a left–right mirror.","show":{"type":"passage","title":"","text":"Which capital letter is unchanged by a left–right mirror?"}},{"q":"On a standard die, opposite faces add to 7. Which number is opposite 2?","type":"number","answer":5,"hint":"What must be added to 2 to make 7?","why":"7 − 2 = 5.","show":{"type":"passage","title":"","text":"On a standard die, opposite faces add to 7. Which number is opposite 2?"}},{"q":"How many different positions can the L-shaped tetromino take in the plane if it may be rotated AND flipped?","type":"number","answer":8,"hint":"Count the rotations first; then count the rotations of its mirror image.","why":"It has 4 rotations, and its mirror image has 4 more that are all different, so 8 positions.","show":{"type":"passage","title":"","text":"How many different positions can the L-shaped tetromino take in the plane if it may be rotated AND flipped?"}},{"q":"A clock hand points at 3. It turns three-quarters of a full turn clockwise. Where does it point?","options":["12","6","9","3"],"answer":"12","hint":"A quarter turn moves the hand three hours.","why":"Three quarter turns move it 9 hours: from 3 to 12.","show":{"type":"passage","title":"","text":"A clock hand points at 3. It turns three-quarters of a full turn clockwise. Where does it point?"}},{gen:() => (gRotate())},{gen:() => (gRotate())},{gen:() => (gRotate())},{gen:() => (gRotate())},{gen:() => (gRotate())},{gen:() => (gNetOpp())},{gen:() => (gNetOpp())},{gen:() => (gNetOpp())},{gen:() => (gNetOpp())},{gen:() => (gNetFolds())},{gen:() => (gNetFolds())},{gen:() => (gNetFolds())},{gen:() => (gSeqFig(2))}],"challenge":[{"q":"A 3×3×3 cube is painted on the outside and cut into 27 small cubes. How many small cubes have exactly TWO painted faces?","type":"number","answer":12,"hint":"Where on the big cube are the small cubes with two painted faces?","why":"They are the middle cubes of the 12 edges: one per edge, 12 in total.","show":{"type":"passage","title":"","text":"A 3×3×3 cube is painted on the outside and cut into 27 small cubes. How many small cubes have exactly TWO painted faces?"}},{"q":"A 4×4×4 painted cube is cut into 64 small cubes. How many have exactly ONE painted face?","type":"number","answer":24,"hint":"One-face cubes sit in the middle of each face, away from the edges.","why":"Each face has a 2×2 block of such cubes: 6 × 4 = 24.","show":{"type":"passage","title":"","text":"A 4×4×4 painted cube is cut into 64 small cubes. How many have exactly ONE painted face?"}},{"q":"How many different nets does a cube have (counting rotations and reflections of a net as the same net)?","type":"number","answer":11,"hint":"This is a known result; you can try to find them all.","why":"There are exactly 11: six have a central row of four (pattern 1–4–1), three have the pattern 1–3–2, one is the 2–2–2 staircase and one is the 3–3 pattern.","show":{"type":"passage","title":"","text":"How many different nets does a cube have (counting rotations and reflections of a net as the same net)?"}},{gen:() => (gRotate())},{gen:() => (gNetOpp())}],"extend":"Find all 11 nets of a cube on squared paper, cut them out and fold each one to check. Then investigate: how many of the 12 pentominoes (five-square shapes) can be folded into an open-topped box? Record your evidence for each.","offline":"Make a paper die from a net, numbering the faces so that opposite faces add to 7. Before folding, predict where each number will go, then fold and check. Also stand in front of a mirror and raise your right hand: which     {"title":"Venn diagrams and syllogisms","icon":"⭕","learn":[{"say":"A <b>Venn diagram</b> (after the logician John Venn, 1880) shows sets as overlapping circles. Every region stands for one combination of 'in' and 'out'.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><rect x='20' y='5' width='560' height='310' rx='16' fill='#fafafa' stroke='#bbb' stroke-width='2'/><g fill-opacity='0.16' stroke-width='4'><circle cx='240' cy='125' r='95' fill='#2e86ab' stroke='#2e86ab'/><circle cx='360' cy='125' r='95' fill='#e4572e' stroke='#e4572e'/><circle cx='300' cy='215' r='95' fill='#2f9e5f' stroke='#2f9e5f'/></g><text x='150' y='40' font-size='20' font-weight='700' text-anchor='middle' fill='#2e86ab'>A</text><text x='450' y='40' font-size='20' font-weight='700' text-anchor='middle' fill='#e4572e'>B</text><text x='300' y='305' font-size='20' font-weight='700' text-anchor='middle' fill='#2f9e5f'>C</text></svg>"}},{"say":"Two sets: |A or B| = |A| + |B| − |A and B|. We subtract the overlap because adding the two circles counts it twice. This is the <b>principle of inclusion–exclusion</b>.","show":{"type":"big","text":"|A ∪ B| = |A| + |B| − |A ∩ B|"}},{"say":"Three sets: add the three circles, subtract the three pairwise overlaps, then add back the center, which was added three times and subtracted three times.","show":{"type":"big","text":"|A ∪ B ∪ C| = |A| + |B| + |C|\n − |A∩B| − |A∩C| − |B∩C| + |A∩B∩C|"}},{"say":"Venn diagrams also test <b>syllogisms</b> (arguments with two premises about three groups). Draw the premises only; if the conclusion is then forced to be visible in the diagram, the argument is <b>valid</b>.","show":{"type":"list","items":["Premise 1: All mammals are animals.","Premise 2: All dogs are mammals.","Conclusion: All dogs are animals. (valid)"],"caption":"A valid syllogism"}},{"say":"<b>Validity is about form, not truth.</b> 'All dogs are mammals; all cats are mammals; so all cats are dogs' has true premises and a false conclusion, so its form is invalid. A valid form can never lead from true premises to a false conclusion.","show":{"type":"big","text":"true premises + valid form\n→ true conclusion, guaranteed"}},{"say":"<b>Explain it.</b> Explain why inclusion–exclusion subtracts the overlap, and why an argument can have true premises and still be invalid.","show":{"type":"passage","title":"Explain it","text":"Explain why inclusion–exclusion subtracts the overlap, and why an argument can have true premises and still be invalid.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise words from this lesson."}}],"practice":[{"q":"Using the diagram, how many students study French?","type":"number","answer":12,"hint":"Add every region inside the French circle.","why":"6 + 3 + 2 + 1 = 12.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><rect x='20' y='5' width='560' height='310' rx='16' fill='#fafafa' stroke='#bbb' stroke-width='2'/><g fill-opacity='0.16' stroke-width='4'><circle cx='240' cy='125' r='95' fill='#2e86ab' stroke='#2e86ab'/><circle cx='360' cy='125' r='95' fill='#e4572e' stroke='#e4572e'/><circle cx='300' cy='215' r='95' fill='#2f9e5f' stroke='#2f9e5f'/></g><text x='150' y='40' font-size='20' font-weight='700' text-anchor='middle' fill='#2e86ab'>French</text><text x='450' y='40' font-size='20' font-weight='700' text-anchor='middle' fill='#e4572e'>Spanish</text><text x='300' y='305' font-size='20' font-weight='700' text-anchor='middle' fill='#2f9e5f'>Latin</text><text x='200' y='110' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>6</text><text x='400' y='110' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>5</text><text x='300' y='270' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>7</text><text x='300' y='95' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>3</text><text x='245' y='195' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>2</text><text x='355' y='195' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>4</text><text x='300' y='160' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>1</text><text x='540' y='290' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>4</text></svg>"}},{"q":"How many study exactly one of the three languages?","type":"number","answer":18,"hint":"Only the outer region of each circle counts.","why":"6 + 5 + 7 = 18.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><rect x='20' y='5' width='560' height='310' rx='16' fill='#fafafa' stroke='#bbb' stroke-width='2'/><g fill-opacity='0.16' stroke-width='4'><circle cx='240' cy='125' r='95' fill='#2e86ab' stroke='#2e86ab'/><circle cx='360' cy='125' r='95' fill='#e4572e' stroke='#e4572e'/><circle cx='300' cy='215' r='95' fill='#2f9e5f' stroke='#2f9e5f'/></g><text x='150' y='40' font-size='20' font-weight='700' text-anchor='middle' fill='#2e86ab'>French</text><text x='450' y='40' font-size='20' font-weight='700' text-anchor='middle' fill='#e4572e'>Spanish</text><text x='300' y='305' font-size='20' font-weight='700' text-anchor='middle' fill='#2f9e5f'>Latin</text><text x='200' y='110' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>6</text><text x='400' y='110' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>5</text><text x='300' y='270' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>7</text><text x='300' y='95' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>3</text><text x='245' y='195' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>2</text><text x='355' y='195' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>4</text><text x='300' y='160' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>1</text><text x='540' y='290' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>4</text></svg>"}},{"q":"How many study French AND Spanish (including those who also study Latin)?","type":"number","answer":4,"hint":"Which regions lie in both the blue and the red circles?","why":"3 + 1 = 4.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><rect x='20' y='5' width='560' height='310' rx='16' fill='#fafafa' stroke='#bbb' stroke-width='2'/><g fill-opacity='0.16' stroke-width='4'><circle cx='240' cy='125' r='95' fill='#2e86ab' stroke='#2e86ab'/><circle cx='360' cy='125' r='95' fill='#e4572e' stroke='#e4572e'/><circle cx='300' cy='215' r='95' fill='#2f9e5f' stroke='#2f9e5f'/></g><text x='150' y='40' font-size='20' font-weight='700' text-anchor='middle' fill='#2e86ab'>French</text><text x='450' y='40' font-size='20' font-weight='700' text-anchor='middle' fill='#e4572e'>Spanish</text><text x='300' y='305' font-size='20' font-weight='700' text-anchor='middle' fill='#2f9e5f'>Latin</text><text x='200' y='110' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>6</text><text x='400' y='110' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>5</text><text x='300' y='270' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>7</text><text x='300' y='95' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>3</text><text x='245' y='195' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>2</text><text x='355' y='195' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>4</text><text x='300' y='160' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>1</text><text x='540' y='290' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>4</text></svg>"}},{"q":"How many students are in the group altogether?","type":"number","answer":32,"hint":"Add every region, including those outside all circles.","why":"All seven inner regions total 28, plus 4 outside: 32.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><rect x='20' y='5' width='560' height='310' rx='16' fill='#fafafa' stroke='#bbb' stroke-width='2'/><g fill-opacity='0.16' stroke-width='4'><circle cx='240' cy='125' r='95' fill='#2e86ab' stroke='#2e86ab'/><circle cx='360' cy='125' r='95' fill='#e4572e' stroke='#e4572e'/><circle cx='300' cy='215' r='95' fill='#2f9e5f' stroke='#2f9e5f'/></g><text x='150' y='40' font-size='20' font-weight='700' text-anchor='middle' fill='#2e86ab'>French</text><text x='450' y='40' font-size='20' font-weight='700' text-anchor='middle' fill='#e4572e'>Spanish</text><text x='300' y='305' font-size='20' font-weight='700' text-anchor='middle' fill='#2f9e5f'>Latin</text><text x='200' y='110' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>6</text><text x='400' y='110' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>5</text><text x='300' y='270' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>7</text><text x='300' y='95' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>3</text><text x='245' y='195' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>2</text><text x='355' y='195' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>4</text><text x='300' y='160' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>1</text><text x='540' y='290' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>4</text></svg>"}},{"q":"Check by inclusion–exclusion: |French| + |Spanish| + |Latin| − (pairs) + (all three). How many study at least one language?","type":"number","answer":28,"hint":"Compute each total from the diagram first.","why":"12 + 13 + 14 − 4 − 3 − 5 + 1 = 28, which matches the sum of the inner regions.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><rect x='20' y='5' width='560' height='310' rx='16' fill='#fafafa' stroke='#bbb' stroke-width='2'/><g fill-opacity='0.16' stroke-width='4'><circle cx='240' cy='125' r='95' fill='#2e86ab' stroke='#2e86ab'/><circle cx='360' cy='125' r='95' fill='#e4572e' stroke='#e4572e'/><circle cx='300' cy='215' r='95' fill='#2f9e5f' stroke='#2f9e5f'/></g><text x='150' y='40' font-size='20' font-weight='700' text-anchor='middle' fill='#2e86ab'>French</text><text x='450' y='40' font-size='20' font-weight='700' text-anchor='middle' fill='#e4572e'>Spanish</text><text x='300' y='305' font-size='20' font-weight='700' text-anchor='middle' fill='#2f9e5f'>Latin</text><text x='200' y='110' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>6</text><text x='400' y='110' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>5</text><text x='300' y='270' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>7</text><text x='300' y='95' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>3</text><text x='245' y='195' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>2</text><text x='355' y='195' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>4</text><text x='300' y='160' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>1</text><text x='540' y='290' font-size='22' font-weight='700' text-anchor='middle' fill='#222'>4</text></svg>"}},{"q":"In a class of 30, 18 play an instrument, 14 play a sport and 7 do both. How many do neither?","type":"number","answer":5,"hint":"First find how many do at least one.","why":"At least one: 18 + 14 − 7 = 25. Neither: 30 − 25 = 5.","show":{"type":"passage","title":"","text":"In a class of 30, 18 play an instrument, 14 play a sport and 7 do both. How many do neither?"}},{"q":"All mammals are animals. All dogs are mammals. Therefore all dogs are animals. Is this valid?","options":["Valid","Invalid"],"answer":"Valid","hint":"Draw dogs inside mammals, and mammals inside animals.","why":"The dog circle lies inside the mammal circle, which lies inside the animal circle, so dogs must lie inside animals. Valid.","show":{"type":"passage","title":"","text":"All mammals are animals. All dogs are mammals. Therefore all dogs are animals. Is this valid?"}},{"q":"All dogs are mammals. All cats are mammals. Therefore all cats are dogs. Is this valid?","options":["Invalid","Valid"],"answer":"Invalid","hint":"Can you draw the premises so that cats and dogs do not overlap?","why":"Both circles may sit inside 'mammals' without touching each other. The premises never link cats to dogs (the middle term is 'undistributed'). Invalid.","show":{"type":"passage","title":"","text":"All dogs are mammals. All cats are mammals. Therefore all cats are dogs. Is this valid?"}},{"q":"No reptiles are mammals. All snakes are reptiles. Therefore no snakes are mammals. Is this valid?","options":["Valid","Invalid"],"answer":"Valid","hint":"Snakes lie inside reptiles; what about the region shared by reptiles and mammals?","why":"The reptile–mammal overlap is empty, and snakes lie inside reptiles, so no snake is in the mammal circle. Valid.","show":{"type":"passage","title":"","text":"No reptiles are mammals. All snakes are reptiles. Therefore no snakes are mammals. Is this valid?"}},{"q":"Some musicians are poets. All musicians are listeners. Therefore some listeners are poets. Is this valid?","options":["Valid","Invalid"],"answer":"Valid","hint":"The poet-musicians: where must they be?","why":"At least one musician is a poet, and every musician is a listener, so that person is a listener who is a poet. Valid.","show":{"type":"passage","title":"","text":"Some musicians are poets. All musicians are listeners. Therefore some listeners are poets. Is this valid?"}},{"q":"All poets are dreamers. Some painters are not poets. Therefore some painters are not dreamers. Is this valid?","options":["Invalid","Valid"],"answer":"Invalid","hint":"Could the painters who are not poets still be dreamers?","why":"The painters outside 'poets' may still lie inside 'dreamers'; the premises say nothing about dreamers who are not poets. Invalid.","show":{"type":"passage","title":"","text":"All poets are dreamers. Some painters are not poets. Therefore some painters are not dreamers. Is this valid?"}},{"q":"An argument has true premises and a false conclusion. What can be concluded about its form?","options":["It is invalid","It is valid","Nothing"],"answer":"It is invalid","hint":"What does validity guarantee?","why":"A valid form guarantees a true conclusion whenever the premises are true. True premises with a false conclusion therefore prove the form invalid.","show":{"type":"passage","title":"","text":"An argument has true premises and a false conclusion. What can be concluded about its form?"}},{"q":"In a Venn diagram for 'No A are B', which region is empty?","options":["The overlap of A and B","A outside B","B outside A","Outside both"],"answer":"The overlap of A and B","hint":"What does 'no A are B' forbid?","why":"Nothing may be in both A and B, so the overlap is shaded as empty.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><rect x='20' y='10' width='560' height='300' rx='16' fill='#fafafa' stroke='#bbb' stroke-width='2'/><circle cx='230' cy='170' r='115' fill='#2e86ab' fill-opacity='0.18' stroke='#2e86ab' stroke-width='4'/><circle cx='370' cy='170' r='115' fill='#e4572e' fill-opacity='0.18' stroke='#e4572e' stroke-width='4'/><text x='200' y='46' font-size='22' font-weight='700' text-anchor='middle' fill='#2e86ab'>A</text><text x='400' y='46' font-size='22' font-weight='700' text-anchor='middle' fill='#e4572e'>B</text><text x='175' y='180' font-size='26' font-weight='700' text-anchor='middle' fill='#222'></text><text x='300' y='180' font-size='26' font-weight='700' text-anchor='middle' fill='#222'>empty</text><text x='425' y='180' font-size='26' font-weight='700' text-anchor='middle' fill='#222'></text></svg>"}},{gen:() => (gVenn2(2))},{gen:() => (gVenn2(2))},{gen:() => (gVenn2(2))},{gen:() => (gVenn3())},{gen:() => (gVenn3())},{gen:() => (gVenn3())},{gen:() => (gSyllogism(1))},{gen:() => (gSyllogism(1))},{gen:() => (gSyllogism(1))},{gen:() => (gSyllogism(1))},{gen:() => (gIncExc())},{gen:() => (gIncExc())},{gen:() => (gIncExc())}],"challenge":[{"q":"Of 100 people, 60 like tea, 50 like coffee and 30 like both. How many like neither?","type":"number","answer":20,"hint":"Inclusion–exclusion first.","why":"At least one: 60 + 50 − 30 = 80. Neither: 100 − 80 = 20.","show":{"type":"passage","title":"","text":"Of 100 people, 60 like tea, 50 like coffee and 30 like both. How many like neither?"}},{"q":"Of 40 students, 20 study French, 18 Spanish, 15 Latin; 7 study French and Spanish, 6 French and Latin, 5 Spanish and Latin, and 3 study all three. How many study none?","type":"number","answer":2,"hint":"Use the three-set formula.","why":"At least one: 20 + 18 + 15 − 7 − 6 − 5 + 3 = 38. None: 40 − 38 = 2.","show":{"type":"passage","title":"","text":"Of 40 students, 20 study French, 18 Spanish, 15 Latin; 7 study French and Spanish, 6 French and Latin, 5 Spanish and Latin, and 3 study all three. How many study none?"}},{"q":"In a group of 50, 30 have a cat and 25 have a dog. What is the SMALLEST possible number who have both?","type":"number","answer":5,"hint":"If nobody had both, how many people would be needed?","why":"30 + 25 = 55 exceeds 50 by 5, so at least 5 people must have both (at least one has to be counted twice for every person beyond 50).","show":{"type":"passage","title":"","text":"In a group of 50, 30 have a cat and 25 have a dog. What is the SMALLEST possible number who have both?"}},{"q":"All Ws are Xs. Some Ys are Ws. Therefore some Ys are Xs. Is this valid?","options":["Valid","Invalid"],"answer":"Valid","hint":"Locate the Ys that are Ws.","why":"Those Ys that are Ws lie inside X, because every W does. So some Ys are Xs. Valid.","show":{"type":"passage","title":"","text":"All Ws are Xs. Some Ys are Ws. Therefore some Ys are Xs. Is this valid?"}},{gen:() => (gSyllogism(2))},{gen:() => (gVenn3())}],"extend":"Read about John Venn and Leonhard Euler, who drew logic diagrams a century earlier. Then design a survey of 10 family members or friends with three yes/no questions, draw the three-circle Venn diagram of the results, and verify the inclusion–exclusion formula with your real data.","offline":"Draw two large overlapping circles with string or chalk. Sort 20 objects by two properties (for example 'metal' and 'smaller than my hand'). Count each region and check: |A or B| = |A| + |B| − |A and B|."},
    {"title":"Review: truth-tellers and liars","icon":"🎭","learn":[{"say":"Review: statements are true or false, and a reason must be both <b>true</b> and <b>relevant</b>. Extension: on an imaginary island, <b>knights</b> always tell the truth and <b>knaves</b> always lie. These puzzles were popularised by the logician Raymond Smullyan.","show":{"type":"big","text":"knight: every statement true\nknave: every statement false"}},{"say":"Method: <b>suppose</b> a speaker is a knight. Then the statement is true; follow its consequences. Then suppose the speaker is a knave: the statement is false. Any supposition that leads to a contradiction is eliminated.","show":{"type":"table","rows":[["Suppose A is…","Then A's statement is…","Consequences…"],["a knight","true","check for contradiction"],["a knave","false","check for contradiction"]]}},{"say":"Example: A says 'We are both knaves.' If A were a knight, the statement would be true, making A a knave: impossible. So A is a knave, the statement is false, and therefore not both are knaves: B is a knight.","show":{"type":"list","items":["Islanders: A, B (B says nothing)","A: \"We are both knaves.\""],"caption":"Knights always tell the truth; knaves always lie."}},{"say":"No islander can say 'I am a knave'. A knight would be lying, and a knave would be telling the truth. Some sentences reveal information simply because they can or cannot be said.","show":{"type":"big","text":"'I am a knave'\ncannot be said by anyone"}},{"say":"Real sources are not knights or knaves: reliable sources are <b>usually</b> right, not always. So we ask for <b>corroboration</b> (independent confirmation) and for the evidence behind a claim, not only for the speaker's reputation.","show":{"type":"list","items":["Who says it? What is their expertise?","What evidence do they give?","Do independent sources agree?","Do they gain by my believing it?"],"caption":"Weighing testimony"}},{"say":"<b>Explain it.</b> Explain why nobody on the island can say 'I am a knave', and why real-life sources must be checked by evidence rather than sorted simply into truth-tellers and liars.","show":{"type":"passage","title":"Explain it","text":"Explain why nobody on the island can say 'I am a knave', and why real-life sources must be checked by evidence rather than sorted simply into truth-tellers and liars.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise words from this lesson."}}],"practice":[{"q":"A says: 'We are both knaves.' What is A?","options":["A knave","A knight"],"answer":"A knave","hint":"Suppose A is a knight. Is the statement then true?","why":"If A were a knight, the statement 'we are both knaves' would be true, contradicting A being a knight. So A is a knave.","show":{"type":"list","items":["Islanders: A, B (B says nothing)","A: \"We are both knaves.\""],"caption":"Knights always tell the truth; knaves always lie."}},{"q":"Same puzzle: what is B?","options":["A knight","A knave"],"answer":"A knight","hint":"A is a knave, so the statement is false. What does 'not both knaves' tell you?","why":"The statement 'we are both knaves' is false, but A is a knave, so B must be a knight.","show":{"type":"list","items":["Islanders: A, B (B says nothing)","A: \"We are both knaves.\""],"caption":"Knights always tell the truth; knaves always lie."}},{"q":"A says: 'At least one of us is a knave.' What is A?","options":["A knight","A knave"],"answer":"A knight","hint":"If A were a knave, would 'at least one of us is a knave' be true or false?","why":"If A were a knave, the statement would be true (A is a knave), but knaves cannot speak truly. So A is a knight.","show":{"type":"list","items":["Islanders: A, B (B says nothing)","A: \"At least one of us is a knave.\""],"caption":"Knights always tell the truth; knaves always lie."}},{"q":"Same puzzle: what is B?","options":["A knave","A knight"],"answer":"A knave","hint":"A is a knight, so the statement is true. Who is the knave?","why":"The statement is true, so at least one is a knave; A is a knight, so B is the knave.","show":{"type":"list","items":["Islanders: A, B (B says nothing)","A: \"At least one of us is a knave.\""],"caption":"Knights always tell the truth; knaves always lie."}},{"q":"A says: 'B is a knave.' B says: 'We are both knights.' What is A?","options":["A knight","A knave"],"answer":"A knight","hint":"Can B be a knight? If B were a knight, what would A be?","why":"If B were a knight, B's statement would make A a knight too; but then A's statement 'B is a knave' would be a false statement from a knight: contradiction. So B is a knave, A's statement is true, and A is a knight.","show":{"type":"list","items":["Islanders: A, B","A: \"B is a knave.\"","B: \"We are both knights.\""],"caption":"Knights always tell the truth; knaves always lie."}},{"q":"A says: 'B and I are the same kind.' B says: 'A is a knave.' What is B?","options":["A knight","A knave"],"answer":"A knight","hint":"Suppose B is a knight: then A is a knave. Check A's statement.","why":"If B is a knight, A is a knave, so A's statement 'we are the same kind' must be false; indeed they differ. Consistent. If B were a knave, A would be a knight, and A's statement would claim A and B are the same kind, but they are not: contradiction. So B is a knight and A a knave.","show":{"type":"list","items":["Islanders: A, B","A: \"B and I are the same kind.\"","B: \"A is a knave.\""],"caption":"Knights always tell the truth; knaves always lie."}},{"q":"Can any islander truthfully or falsely say 'I am a knave'?","options":["No one can say it","Only a knight","Only a knave"],"answer":"No one can say it","hint":"Test a knight saying it, then a knave.","why":"A knight saying it would be lying; a knave saying it would be telling the truth. Both are impossible.","show":{"type":"passage","title":"","text":"Can any islander truthfully or falsely say 'I am a knave'?"}},{"q":"What can a knave say about himself?","options":["'I am a knight.'","'I am a knave.'","'I always lie.'"],"answer":"'I am a knight.'","hint":"A knave's statements must be false.","why":"'I am a knight' is false for a knave, so he can say it. (So can a knight: this statement reveals nothing.)","show":{"type":"passage","title":"","text":"What can a knave say about himself?"}},{"q":"A usually reliable encyclopedia makes a surprising claim. What is the most reasonable response?","options":["Treat it as probably true and seek the evidence or an independent source","Treat it as certainly true","Reject it because it is surprising"],"answer":"Treat it as probably true and seek the evidence or an independent source","hint":"Are real sources perfect knights?","why":"Reliable sources make mistakes occasionally. A surprising claim deserves corroboration, but reliability is a good reason to take it seriously.","show":{"type":"passage","title":"","text":"A usually reliable encyclopedia makes a surprising claim. What is the most reasonable response?"}},{"q":"Review: All squares are rectangles. Some rectangles are red. Therefore some squares are red. Is this valid?","options":["Invalid","Valid"],"answer":"Invalid","hint":"Could the red rectangles all be non-squares?","why":"The red rectangles might all be non-square rectangles, so the conclusion does not follow.","show":{"type":"passage","title":"","text":"Review: All squares are rectangles. Some rectangles are red. Therefore some squares are red. Is this valid?"}},{"q":"Review: what is the contrapositive of 'If it is a knight, it tells the truth'?","options":["If it does not tell the truth, it is not a knight.","If it tells the truth, it is a knight.","If it is not a knight, it does not tell the truth.","Knights tell the truth."],"answer":"If it does not tell the truth, it is not a knight.","hint":"Swap and negate.","why":"Swap the parts and negate both.","show":{"type":"passage","title":"","text":"Review: what is the contrapositive of 'If it is a knight, it tells the truth'?"}},{"q":"Review: in a class of 28, 15 like poetry, 12 like puzzles and 5 like both. How many like neither?","type":"number","answer":6,"hint":"Inclusion–exclusion.","why":"At least one: 15 + 12 − 5 = 22. Neither: 28 − 22 = 6.","show":{"type":"passage","title":"","text":"Review: in a class of 28, 15 like poetry, 12 like puzzles and 5 like both. How many like neither?"}},{gen:() => (gKnk(2))},{gen:() => (gKnk(2))},{gen:() => (gKnk(2))},{gen:() => (gKnk(2))},{gen:() => (gKnk(2))},{gen:() => (gKnk(2))},{gen:() => (gKnk(2))},{gen:() => (gSyllogism(1))},{gen:() => (gCondForm())},{gen:() => (gVenn2(2))},{gen:() => (gNegate())},{gen:() => (gKind())},{gen:() => (gGrid(3, 2))}],"challenge":[{"q":"A says: 'If I am a knight, then B is a knight.' What are A and B?","options":["Both knights","A knight, B knave","A knave, B knight","Both knaves"],"answer":"Both knights","hint":"Could A be a knave? A false 'if–then' needs a true IF part.","why":"If A were a knave, the statement would be false; but a conditional is false only when its IF part is true, i.e. A is a knight: contradiction. So A is a knight, the statement is true, and since its IF part holds, B is a knight.","show":{"type":"passage","title":"","text":"A says: 'If I am a knight, then B is a knight.' What are A and B?"}},{"q":"Two guards stand at two doors; one door leads to freedom. One guard is a knight, the other a knave, and you do not know which. With ONE yes/no question to one guard, which question finds the door?","options":["'If I asked the other guard whether your door leads to freedom, would he say yes?' — then choose the opposite","'Are you a knight?'","'Does your door lead to freedom?'","'Is the sky blue?'"],"answer":"'If I asked the other guard whether your door leads to freedom, would he say yes?' — then choose the opposite","hint":"You need a question whose answer is false whichever guard you ask.","why":"The answer passes through exactly one liar either way (the knave lies about the knight's truth, or the knight truthfully reports the knave's lie), so the answer is always wrong; do the opposite.","show":{"type":"passage","title":"","text":"Two guards stand at two doors; one door leads to freedom. One guard is a knight, the other a knave, and you do not know which. With ONE yes/no question to one guard, which question finds the door?"}},{"q":"Three islanders. A says: 'All of us are knaves.' B says: 'Exactly one of us is a knight.' How many knights are there?","type":"number","answer":1,"hint":"A cannot be a knight. What does A's lie tell you?","why":"A cannot be a knight (the statement would then be false), so A is a knave and not everyone is a knave. Suppose B is a knave too; then C must be the knight, so there is exactly one knight, which makes B's statement true: contradiction. So B is a knight; by B's true statement B is the only knight, and C is a knave. One knight.","show":{"type":"passage","title":"","text":"Three islanders. A says: 'All of us are knaves.' B says: 'Exactly one of us is a knight.' How many knights are there?"}},{gen:() => (gKnk(3))},{gen:() => (gKnk(3))}],"extend":"Read the opening chapter of Raymond Smullyan's 'What Is the Name of This Book?' if available, or invent five knight–knave puzzles of your own. For each, write a full proof that the solution is unique by checking every assignment in a table.","offline":"Play 'Knight or knave' with a grown-up: one person secretly chooses to be a knight or a knave and makes one statement about the other; the listener must deduce the role and explain the deduction aloud."},
    {"title":"Knights and knaves: advanced","icon":"🛡️","learn":[{"say":"With three islanders, organize the work. A <b>case table</b> lists all 8 possible assignments; each statement eliminates the rows in which it would be spoken falsely by a knight or truly by a knave.","show":{"type":"table","rows":[["A","B","C","consistent?"],["knight","knight","knight","?"],["knight","knight","knave","?"],["…","…","…","…"],["knave","knave","knave","?"]],"caption":"2 × 2 × 2 = 8 cases"}},{"say":"Chains of accusations alternate. If A says 'B is a knave' and B says 'C is a knave', then A and B are of <b>opposite</b> kinds, and so are B and C.","show":{"type":"big","text":"A: 'B is a knave'  →  A and B differ\nB: 'C is a knave'  →  B and C differ"}},{"say":"Statements about the whole group are powerful. 'All of us are knaves' can never be said by a knight (it would include the speaker). So whoever says it is a knave, and the statement is false: at least one knight exists.","show":{"type":"list","items":["Islanders: A, B (B says nothing)","A: \"All of us are knaves.\""],"caption":"Knights always tell the truth; knaves always lie."}},{"say":"Conditional statements follow the truth table: 'If P then Q' is false only when P is true and Q is false. A knave's conditional must be false, so its IF part must be true.","show":{"type":"table","rows":[["P","Q","If P then Q"],["T","T","T"],["T","F","F"],["F","T","T"],["F","F","T"]]}},{"say":"These puzzles train a habit that matters outside puzzles: test each assumption by its <b>consequences</b>, and abandon any assumption that leads to a contradiction, however attractive it was.","show":{"type":"big","text":"assume → deduce → contradiction?\n→ reject the assumption"}},{"say":"<b>Explain it.</b> Explain how a case table with 8 rows guarantees that you have found the ONLY solution of a three-person puzzle, and why 'All of us are knaves' must be spoken by a knave.","show":{"type":"passage","title":"Explain it","text":"Explain how a case table with 8 rows guarantees that you have found the ONLY solution of a three-person puzzle, and why 'All of us are knaves' must be spoken by a knave.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise words from this lesson."}}],"practice":[{"q":"A: 'B is a knave.' B: 'C is a knave.' C: 'A and B are both knaves.' What is C?","options":["A knave","A knight"],"answer":"A knave","hint":"If C were a knight, A and B would both be knaves. Is that consistent with A's statement?","why":"If C were a knight, A and B would be knaves; but then A's statement 'B is a knave' would be true, impossible for a knave. So C is a knave.","show":{"type":"list","items":["Islanders: A, B, C","A: \"B is a knave.\"","B: \"C is a knave.\"","C: \"A and B are both knaves.\""],"caption":"Knights always tell the truth; knaves always lie."}},{"q":"Same puzzle: what is B?","options":["A knight","A knave"],"answer":"A knight","hint":"C is a knave. What does that make B's statement?","why":"C is a knave, so B's statement 'C is a knave' is true and B is a knight.","show":{"type":"list","items":["Islanders: A, B, C","A: \"B is a knave.\"","B: \"C is a knave.\"","C: \"A and B are both knaves.\""],"caption":"Knights always tell the truth; knaves always lie."}},{"q":"Same puzzle: what is A?","options":["A knave","A knight"],"answer":"A knave","hint":"B is a knight. What is A's statement worth?","why":"A says B is a knave, but B is a knight, so A's statement is false and A is a knave. Check C: 'A and B are both knaves' is false (B is a knight), as a knave's statement must be.","show":{"type":"list","items":["Islanders: A, B, C","A: \"B is a knave.\"","B: \"C is a knave.\"","C: \"A and B are both knaves.\""],"caption":"Knights always tell the truth; knaves always lie."}},{"q":"A: 'All of us are knaves.' B: 'Exactly one of us is a knight.' What is B?","options":["A knight","A knave"],"answer":"A knight","hint":"A must be a knave. Now test B as a knave: who would be the knight?","why":"A is a knave, so at least one knight exists. If B were a knave, A and B would be knaves, so C would be the only knight, making B's statement true: contradiction. So B is a knight.","show":{"type":"list","items":["Islanders: A, B, C (C says nothing)","A: \"All of us are knaves.\"","B: \"Exactly one of us is a knight.\""],"caption":"Knights always tell the truth; knaves always lie."}},{"q":"Same puzzle: what is C?","options":["A knave","A knight"],"answer":"A knave","hint":"B is a knight, so exactly one knight exists.","why":"B is the one knight, so C is a knave.","show":{"type":"list","items":["Islanders: A, B, C (C says nothing)","A: \"All of us are knaves.\"","B: \"Exactly one of us is a knight.\""],"caption":"Knights always tell the truth; knaves always lie."}},{"q":"A: 'B or C is a knave.' B: 'A and C are the same kind.' What is A?","options":["A knight","A knave"],"answer":"A knight","hint":"Suppose A is a knave: then B and C are both knights. Check B's statement.","why":"If A were a knave, B and C would both be knights; then B's statement 'A and C are the same kind' would be false (A knave, C knight) though B is a knight: contradiction. So A is a knight.","show":{"type":"list","items":["Islanders: A, B, C (C says nothing)","A: \"B or C is a knave.\"","B: \"A and C are the same kind.\""],"caption":"Knights always tell the truth; knaves always lie."}},{"q":"Same puzzle: what is C?","options":["A knave","A knight"],"answer":"A knave","hint":"A is a knight, so B or C is a knave. Test B as a knight.","why":"If B were a knight, A and C would be the same kind, so C a knight; but then neither B nor C is a knave, contradicting A. So B is a knave; B's statement is false, so C differs from A: C is a knave.","show":{"type":"list","items":["Islanders: A, B, C (C says nothing)","A: \"B or C is a knave.\"","B: \"A and C are the same kind.\""],"caption":"Knights always tell the truth; knaves always lie."}},{"q":"A: 'At least one of us is a knave.' B: 'A is a knave.' How many knights are there?","type":"number","answer":1,"hint":"Who can say 'at least one of us is a knave'?","why":"A knave cannot say it (it would be true), so A is a knight and at least one is a knave: B. B's statement 'A is a knave' is indeed false. One knight.","show":{"type":"passage","title":"","text":"A: 'At least one of us is a knave.' B: 'A is a knave.' How many knights are there?"}},{"q":"A knave says: 'If I am a knight, then the moon is made of cheese.' Is this possible?","options":["No","Yes"],"answer":"No","hint":"When is an if–then statement false?","why":"A knave's statement must be false, but 'If P then Q' is false only if P is true. Here P ('I am a knight') is false for a knave, so the statement would be true. A knave cannot say it.","show":{"type":"passage","title":"","text":"A knave says: 'If I am a knight, then the moon is made of cheese.' Is this possible?"}},{"q":"In how many of the 8 possible assignments for three islanders is 'Exactly one of us is a knight' TRUE?","type":"number","answer":3,"hint":"Count the assignments with exactly one knight.","why":"The single knight can be A, B or C: 3 assignments.","show":{"type":"passage","title":"","text":"In how many of the 8 possible assignments for three islanders is 'Exactly one of us is a knight' TRUE?"}},{"q":"A says: 'I am a knight and B is a knave.' B says nothing. Which is possible?","options":["A is a knight and B a knave, or A is a knave","Only A is a knight","Only A is a knave"],"answer":"A is a knight and B a knave, or A is a knave","hint":"Test all four combinations.","why":"If A is a knight, the statement must be true: B is a knave. If A is a knave, the statement is false whatever B is (its first half fails). So several assignments survive: the puzzle has no unique answer.","show":{"type":"passage","title":"","text":"A says: 'I am a knight and B is a knave.' B says nothing. Which is possible?"}},{"q":"Why do knight–knave puzzles help with real reasoning?","options":["They train testing assumpt
