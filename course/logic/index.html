<script>// Logic & Thinking: Year 1 Advanced (32 lessons). Generated from the course sources.
// The runtime library below draws figures and boards and SOLVES every generated puzzle (grids, ordering, knights and knaves,

const COURSE = (() => {

// Chess board 8x8 (left part of the 600x320 box). pos: {e4:"N", d5:"k"} uppercase white, lowercase black. marks: {sq: colour}

  let s = `<rect x='${x0}' y='${y0}' width='${8 * S}' height='${8 * S}' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/>`;
  const xy = (sq) => [x0 + "abcdefgh".indexOf(sq[0]) * S, y0 + (8 - +sq[1]) * S];

// text lines to the right of a board
const side = (lines, x = 330, y = 60, fs = 22) => lines.map((l, i) => T(x, y + i * (fs + 14), l, { fs, a: "start" })).join("");

rners: 4 squares × 2 moves = 8. Edge squares next to a corner: 8 × 3 = 24. Other edge squares: 16 × 4 = 64. The four squares diagonally inside the corners: 4 × 4 = 16. The rest of the second ring: 16 × 6 = 96. The central 16 squares: 16 × 8 = 128. Total 8 + 24 + 64 + 16 + 96 + 128 = 336. (Each knight move is counted from both ends, so there are 168 different knight moves on the board.)","show":{"type":"passage","title":"","text":"Add up, over all 64 squares, the number of moves a lone knight has from that square. What is the total?"}},{gen:() => (gExactlyK(true))},{gen:() => (gTwoRooks())},{gen:() => (gUnion(true))}],"extend":"Invent a 'figure language': choose 3 shapes, 3 colors and 2 sizes, and write a code (for example R-T-B = red triangle big). Write 10 codes for a grown-up to draw, then check their drawings attribute by attribute. How many different codes exist in your language? Prove your count with the multiplication principle.","offline":"Gather 15 small objects (buttons, spoons, toys). Sort them by one attribute, then re-sort them by a different attribute, stating the rule aloud each time. Then set up a real chessboard and demonstrate each piece's movement rule to a grown-up."},

le must hold for <b>every</b> member of the group, not merely most. One exception is enough to reject a proposed rule.","show":{"type":"table","rows":[["Proposed rule","Box 1","Box 2","Box 3","Verdict"],["contains 3 figures","yes","yes","yes","accept"],["figures are solid","yes","no","yes","reject"]]}},{"say":"Chess pieces can be compared too. Rook and bishop share one attribute (both <b>slide</b> any distance) and differ in another (direction: straight versus diagonal).","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g opacity='0.85'><circle cx='145.5' cy='189.5' r='9' fill='#2e86ab'/><circle cx='178.5' cy='189.5' r='9' fill='#2e86ab'/><circle cx='211.5' cy='189.5' r='9' fill='#2e86ab'/><circle cx='244.5' cy='189.5' r='9' fill='#2e86ab'/><circle cx='277.5' cy='189.5' r='9' fill='#2e86ab'/><circle cx='79.5' cy='189.5' r='9' fill='#2e86ab'/><circle cx='46.5' cy='189.5' r='9' fill='#2e86ab'/><circle cx='112.5' cy='156.5' r='9' fill='#2e86ab'/><circle cx='112.5' cy='123.5' r='9' fill='#2e86ab'/><circle cx='112.5' cy='90.5' r='9' fill='#2e86ab'/><circle cx='112.5' cy='57.5' r='9' fill='#2e86ab'/><circle cx='112.5' cy='24.5' r='9' fill='#2e86ab'/><circle cx='112.5' cy='222.5' r='9' fill='#2e86ab'/><circle cx='112.5' cy='255.5' r='9' fill='#2e86ab'/><circle cx='244.5' cy='57.5' r='9' fill='#e4572e'/><circle cx='277.5' cy='24.5' r='9' fill='#e4572e'/><circle cx='244.5' cy='123.5' r='9' fill='#e4572e'/><circle cx='277.5' cy='156.5' r='9' fill='#e4572e'/><circle cx='178.5' cy='57.5' r='9' fill='#e4572e'/><circle cx='145.5' cy='24.5' r='9' fill='#e4572e'/><circl oke-width='1.2'>♗&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g><text x='320' y='60' font-size='20' font-weight='700' text-anchor='start' fill='#222'>c1 bishop: dark only</text><text x='320' y='94' font-size='20' font-weight='700' text-anchor='start' fill='#222'>f1 bishop: light only</text></svg>"}},{"say":"Invariants also settle questions of <b>exactly</b> so many moves. A knight changes square color on every move, so after an even number of moves it stands on its starting color and after an odd number on the other color. Extra moves can only be added in pairs (away and back).","show":{"type":"big","text":"same color → even number of moves\ndifferent color → odd number of moves"}},{"say":"<b>Explain it.</b> What is the difference between a feature that SOME members of a group share and a RULE for the group? Use the four-cornered figures as your example.","show":{"type":"passage","title":"Explain it","text":"What is the difference between a feature that SOME members of a group share and a RULE for the group? Use the four-cornered figures as your example.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise words from this lesson."}}],"practice":[{"q":"What do all of these figures have in common?","options":["All are small","All are solid","All are blue","All are circles"],"answer":"All are small","hint":"Test each attribute across all four.","why":"Shape, color and shading vary; the size is constant. All are small."  x='46.5' y='266' fill='#fff' stroke-width='1.2'>♖&#xFE0E;</text><text x='277.5' y='266' fill='#fff' stroke-width='1.2'>♗&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g></svg>"}},{"q":"Someone proposes: 'All four figures are blue.' Three are blue and one is green. What is the correct verdict?","options":["The rule is false","The rule is mostly true, so accept it","The rule is true","We cannot tell"],"answer":"The rule is false","hint":"Does 'all' allow even one exception?","why":"A universal claim ('all') is refuted by a single counter-example. Three out of four is not all.","show":{"type":"passage","title":"","text":"Someone proposes: 'All four figures are blue.' Three are blue and one is green. What is the correct verdict?"}},{gen:() => (gRuleFit())},{gen:() => (gRuleFit())},{gen:() => (gRuleFit())},{gen:() => (gRuleFit())},{gen:() => (gRuleFit())},{gen:() => (gKingRoutes())},{gen:() => (gKingRoutes())},{gen:() => (gKingRoutes())},{gen:() => (gRookTwo())},{gen:() => (gRookTwo())},{gen:() => (gRookTwo())},{gen:() => (gKnightExact())},{gen:() => (gKnightExact())},{gen:() => (gKnightExact())},{gen:() => (gKnightExact())},{gen:() => (gKnight2())},{gen:() => (gKnight2())},{gen:() => (gKnight2())},{gen:() => (gPieceDist("B"))},{gen:() => (gPieceDist("B"))}],"challenge":[{"q":"A bishop on c1 must reach h8. What is the fewest number of moves?","type":"number","answer":2,"hint":"Is h8 the same color as c1? Which squares lie on the long diagonal through h8?","why":"Both squares are dark, so it is possible. c1 → b2 is one move, and b2 lies on the a1–h8 diagonal, so b2 → h8 completes it in 2.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g opacity='0.85'><circle cx='277.5' cy='24.5' r='9' fill='#2f9e5f'/></g><g font-size='30' text-anchor='middle' stroke='#111'><text x='112.5' y='266' fill='#fff' stroke-width='1.2'>♗&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g></svg>"}},{"q":"A lone knight stands on a1. What is the greatest number of moves it ever needs to reach a square of the board (choosing the best route each time)?","type":"number","answer":6,"hint":"Which squares look farthest? Remember the color invariant: h8 is the same color as a1.","why":"Every square can be reached in at most 6 moves, and h8 needs all 6: it is 14 steps away (7 files + 7 ranks) while a knight move covers at most 3, so at least 5 moves; a1 and h8 are the same color, so the number of moves is even: 6. A full breadth-first search confirms no square needs more.","show":{"type":"passage","title":"","text":"A lone knight stands on a1. What is the greatest number of moves it ever needs to reach a square of the board (choosing the best route each time)?"}},{gen:() => (gKingRoutes(true))},{gen:() => (gKnightExact(true))},{gen:() => (gRookTwo())},{gen:() => (gKingRoutes(true))}],"extend":"Investigate the king's distance rule: on graph paper, mark a king's start square and write in every other square the fewest king moves needed to reach it. Describe the pattern you see in one precise sentence, then test your sentence on three squares you have not yet filled in.","offline":"Play 'Same and different' with a grown-up: choose two objects (a spoon and a fork, a pencil and a crayon) and take turns naming one shared attribute and one difference. Five rounds each, no repeats, and every claim must be checkable by looking."},

ch rule do the other three ALL share?' settles it.","show":{"type":"passage","title":"Explain it","text":"Why can a distractor make an odd-one-out puzzle seem to have two answers? Explain how checking 'which rule do the other three ALL share?' settles it.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise words from this lesson."}}],"practice":[{"q":"Which is the odd one out?","options":["A","B","C","D"],"answer":"B","hint":"Three figures agree on every attribute.","why":"All are big solid stars; A, C and D are red, and B alone is blue.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><rect x='10' y='75' width='130' height='130' rx='14' fill='#fff' stroke='#bbb' stroke-width='2'/><polygon points='75,96 86,125 117,126 92,146 101,176 75,158 49,176 58,146 33,126 64,125' fill='#e4572e' stroke='#e4572e' stroke-width='2' stroke-linejoin='round'/><text x='75' y='245' font-size='24' font-weight='700' text-anchor='middle' fill='#222'>A</text><rect x='160' y='75' width='130' height='130' rx='14' fill='#fff' stroke='#bbb' stroke-width='2'/><polygon points='225,96 236,125 267,126 242,146 251,176 225,158 199,176 208,146 183,126 214,125' fill='#2e86ab' stroke='#2e86ab' stroke-width='2' stroke-linejoin='round'/><text x='225' y='245' font-size='24' font-weight='700' text-anchor='middle' fill='#222'>B</text><rect x='310' y='75' width='130' height='130' rx='14' fill='#fff' stroke='#bbb' stroke-width='2'/><polygon points='375,96 386,125 417,126 392,146 401,176 375,158 349,176 358,146 333,126 364,125' fill='#e4572e' stroke='#e4572e' stroke-width='2' stroke-linejoin='round'/><text x='375' y='245' font-size='24' font-weight='700' text-anchor='middle' fill='#222'>C</text><rect x='460' y='75' width='130' height='130' rx='14' fill='#fff' stroke='#bbb' stroke-width='2'/><polygon points='525,96 536,125 567,126 542,146 551,176 525,158 499,176 508,146 483,126 514,125' fill='#e4572e' stroke='#e4572e' stroke-width='2' stroke-linejoin='round'/><text x='525' y='245' font-size='24' font-weight='700' text-anchor='middle' fill='#222'>D</text></svg>"},"keepOrder":true},{"q":"Which is the odd one out?","options":["A","B","C","D"],"answer":"C","hint":"Examine direction.","why":"A, B and D point right; C points down.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><rect x='10' y='75' width='130' height='130' rx='14' fill='#fff' stroke='#bbb' stroke-width='2'/><polygon points='35,128 83,128 83,110 115,140 83,170 83,152 35,152' fill='#7b5ea7' stroke='#7b5ea7' stroke-width='2' stroke-linejoin='round'/><text x='75' y='245' font-size='24' font-weight='700' text-anchor='middle' fill='#222'>A</text><rect x='160' y='75' width='130' height='130' rx='14' fill='#fff' stroke='#bbb' stroke-width='2'/><polygon points='185,128 233,128 233,110 265,140 233,170 233,152 185,152' fill='#7b5ea7' stroke='#7b5ea7' stroke-width='2' stroke-linejoin='round'/><text x='225' y='245' font-size='24' font-weight='700' text-anchor='middle' fill='#222'>B</text><rect x='310' y='75' width='130' height='130' rx='14' fill='#fff' stroke='#bbb' stroke-width='2'/><polygon points='387,100 387,148 405,148 375,180 345,148 363,148 363,100' fill='#7b5ea7' stroke='#7b5ea7' stroke-width='2' stroke-linejoin='round'/><text x='375' y='245' font-size='24' font-weight='700' text-anchor='middle' fill='#222'>C</text><rect x='460' y='75' width='130' height='130' rx='14' fill='#fff' stroke='#bbb' stroke-width='2'/><polygon points='485,128 533,128 533,110 565,140 533,170 533,152 485,152' fill='#7b5ea7' stroke='#7b5ea7' stroke-width='2' stroke-linejoin='round'/><text x='525' y='245' font-size='24' font-weight='700' text-anchor='middle' fill='#222'>D</text></svg>"},"keepOrder":true},{"q":"What changed from figure 1 to figure 2?","options":["Shape and color","Color and size","Size and shading","Only color"],"answer":"Color and size","hint":"Run through the checklist: shape, color, size, shading.","why":"Both are empty triangles. The color changed (blue to red) and the size changed (big to small).","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><rect x='85' y='75' width='130' height='130' rx='14' fill='#fff' stroke='#bbb' stroke-width='2'/><polygon points='150,96 188,162 112,162' fill='#fff' stroke='#2e86ab' stroke-width='5' stroke-linejoin='round'/><text x='150' y='245' font-size='24' font-weight='700' text-anchor='middle' fill='#222'>1</text><rect x='385' y='75' width='130' height='130' rx='14' fill='#fff' stroke='#bbb' stroke-width='2'/><polygon points='450,116 471,152 429,152' fill='#fff' stroke='#e4572e' stroke-width='5' stroke-linejoin='round'/><text x='450' y='245' font-size='24' font-weight='700' text-anchor='middle' fill='#222'>2</text></svg>"}},{"q":"Odd one out, by a property you must count: corners.","options":["A","B","C","D"],"answer":"C","hint":"Count the corners of each figure. Is each count odd or even?","why":"A has 4 corners, B has 6, C has 3 and D has 4. C alone has an odd number of corners; color and size are distractors.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='sred' width='10' height='10' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'><rect width='10' height='10' fill='#fff'/><rect width='5' height='10' fill='#e4572e'/></pattern></defs><rect x='10' y='75' width='130' height='130' rx='14' fill='#fff' stroke='#bbb' stroke-width='2'/><polygon points='108,107 108,173 42,173 42,107' fill='url(#sred)' stroke='#e4572e' stroke-width='4' stroke-linejoin='round'/><text x='75' y='245' font-size='24' font-weight='700' text-anchor='middle' fill='#222'>A</text><rect x='160' y='75' width='130' height='130' rx='14' fill='#fff' stroke='#bbb' stroke-width='2'/><polygon points='225,118 244,129 244,151 225,162 206,151 206,129' fill='#2e86ab' stroke='#2e86ab' stroke-width='2' stroke-linejoin='round'/><text x='225' y='245' font-size='24' font-weight='700' text-anchor='middle' fill='#222'>B</text><rect x='310' y='75' width='130' height='130' rx='14' fill='#fff' stroke='#bbb' stroke-width='2'/><polygon points='375,96 413,162 337,162' fill='#e4572e' stroke='#e4572e' stroke-width='2' stroke-linejoin='round'/><text x='375' y='245' font-size='24' font-weight='700' text-anchor='middle' fill='#222'>C</text><rect x='460' y='75' width='130' height='130' rx='14' fill='#fff' stroke='#bbb' stroke-width='2'/><polygon points='525,114 542,140 525,166 508,140' fill='#fff' stroke='#2f9e5f' stroke-width='5' stroke-linejoin='round'/><text x='525' y='245' font-size='24' font-weight='700' text-anchor='middle' fill='#222'>D</text></svg>"},"keepOrder":true},{"q":"White to move. How many legal squares does the white king on e1 have?","type":"number","answer":2,"hint":"Which squares does the queen on d8 control? Which does the bishop on h4 control?","why":"The king is in check from the bishop on h4 (along h4–g3–f2–e1), so it must move. d1 and d2 are controlled by the queen on the d-file, and f2 lies on the bishop's diagonal. Only e2 and f1 remain: 2 legal squares.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g font-size='30' text-anchor='middle' stroke='#111'><text x='178.5' y='266' fill='#fff' stroke-width='1.2'>♔&#xFE0E;</text><text x='178.5' y='35' fill='#111' stroke-width='0.4'>♚&#xFE0E;</text><text x='145.5' y='35' fill='#111' stroke-width='0.4'>♛&#xFE0E;</text><text x='277.5' y='167' fill='#111' stroke-width='0.4'>♝&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g></svg>"}},{"q":"A puzzle-setter claims D is the odd one out because it is the only green figure. But A and C are both red, and B is blue. Is the claim well-founded?","options":["Yes: D is the only green one","No: B is also the only blue one, so color does not single out one figure","Yes: green is a special color","No: there is never an odd one out"],"answer":"No: B is also the only blue one, so color does not single out one figure","hint":"Does the color attribute isolate exactly one figure?","why":"If B is the only blue figure and D the only green one, color gives two 'unique' figures, so color cannot be the deciding rule. A proper odd-one-out rule must be shared by the other three.","show":{"type":"passage","title":"","text":"A puzzle-setter claims D is the odd one out because it is the only green figure. But A and C are both red, and B is blue. Is the claim well-founded?"}},{"q":"A lone queen stands on each square in turn. Order the squares from FEWEST to MOST squares she controls.","type":"order","items":["d4","a1","b2"],"answer":["a1","b2","d4"],"hint":"The closer to the center, the longer her diagonals.","why":"a1: 21, b2: 23, d4: 27. Her rook-like squares are always 14; only the diagonals grow toward the center.","show":{"type":"passage","title":"","text":"A lone queen stands on each square in turn. Order the squares from FEWEST to MOST squares she controls."}},{gen:() => (gHiddenOdd())},{gen:() => (gHiddenOdd())},{gen:() => (gHiddenOdd())},{gen:() => (gHiddenOdd())},{gen:() => (gHiddenOdd())},{gen:() => (gOddOne(2))},{gen:() => (gOddOne(2))},{gen:() => (gOddOne(2))},{gen:() => (gKingLegal2())},{gen:() => (gKingLegal2())},{gen:() => (gKingLegal2())},{gen:() => (gKingLegal2())},{gen:() => (gKingLegal2())},{gen:() => (gQueenBlocked())},{gen:() => (gQueenBlocked())},{gen:() => (gQueenBlocked())},{gen:() => (gQueenBlocked())},{gen:() => (gQueenBoard())},{gen:() => (gQueenBoard())},{gen:() => (gQueenBoard())}],"challenge":[{"q":"Four figures: a red square, a red circle, a blue square and a blue circle. Which is the odd one out?","options":["The red square","The blue circle","There is no single odd one out","The red circle"],"answer":"There is no single odd one out","hint":"For each figure, is there a rule shared by the other three but not by it?","why":"The four figures are perfectly balanced: two colors and two shapes, each pair crossed. Any rule that excludes one figure (for example 'red or square') is an artificial combination, not a shared attribute. A good thinker recognizes when a puzzle has no unique answer.","show":{"type":"passage","title":"","text":"Four figures: a red square, a red circle, a blue square and a blue circle. Which is the odd one out?"}},{"q":"Place queens on a 4 × 4 board so that no two attack each other, using as many queens as possible. In how many different ways can this be done?","type":"number","answer":2,"hint":"No two queens may share a row or column, so at most 4 fit, one per row. Try placing them row by row and backtrack.","why":"One per row and per column; a queen in a corner fails quickly, and a systematic search finds exactly two arrangements, (2, 4, 1, 3) and (3, 1, 4, 2) by column in rows 1–4. Each is the mirror image of the other.","show":{"type":"passage","title":"","text":"Place queens on a 4 × 4 board so that no two attack each other, using as many queens as possible. In how many different ways can this be done?"}},{gen:() => (gQueenBoard())},{gen:() => (gUnion(true))},{gen:() => (gQueenBoard())}],"extend":"Design three odd-one-out puzzles of your own, each with a distractor that makes a careless solver choose wrongly. Write the intended rule on the back. Test them on a grown-up and record whether the distractor worked.","offline":"Play 'What changed?': lay out 6 objects, close your eyes while a grown-up changes exactly ONE attribute (position, orientation, or swaps one object), then identify the change and name the attribute. Exchange roles."},
    {"title":"Review: attacked, defended, hanging","icon":"🛡️","learn":[{"say":"Review. A logician <b>describes</b> every attribute, <b>compares</b> one attribute at a time, and accepts a rule only if it holds for <b>every</b> member.","show":{"type":"list","items":["Describe: shape, color, size, shading, number, direction","Compare: build a change table","Rule: true for all members; one counter-example refutes it"]}},{"say":"Extension. A square is <b>attacked</b> if an enemy piece could capture there. A piece that is attacked and has <b>no defender</b> is <b>hanging</b>: it can be captured for free.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g font-size='30' text-anchor='middle' stroke='#111'><text x='112.5' y='200' fill='#fff' stroke-width='1.2'>♘&#xFE0E;</text><text x='211.5' y='167' fill='#fff' stroke-width='1.2'>♗&#xFE0E;</text><text x='145.5' y='134' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='178.5' y='101' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='277.5' y='101' fill='#111' stroke-width='0.4'>♞&#xFE0E;</text><text x='79.5' y='167' fill='#111' stroke-width='0.4'>♜&#xFE0E;</text><text x='178.5' y='35' fill='#111' stroke-width='0.4'>♚&#xFE0E;</text><text x='178.5' y='266' fill='#fff' stroke-width='1.2'>♔&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g><text x='330' y='80' font-size='22' font-weight='700' text-anchor='start' fill='#222'>Which black piece</text><text x='330' y='116' font-size='22' font-weight='700' text-anchor='start' fill='#222'>is hanging?</text></svg>"}},{"say":"Analysis: the knight on h6 is attacked by the bishop on f4 and nothing defends it, so it hangs. The pawn on d5 is attacked by the knight, but the pawn on e6 defends it.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g font-size='30' text-anchor='middle' stroke='#111'><text x='112.5' y='200' fill='#fff' stroke-width='1.2'>♘&#xFE0E;</text><text x='211.5' y='167' fill='#fff' stroke-width='1.2'>♗&#xFE0E;</text><text x='145.5' y='134' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='178.5' y='101' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='277.5' y='101' fill='#111' stroke-width='0.4'>♞&#xFE0E;</text><text x='79.5' y='167' fill='#111' stroke-width='0.4'>♜&#xFE0E;</text><text x='178.5' y='35' fill='#111' stroke-width='0.4'>♚&#xFE0E;</text><text x='178.5' y='266' fill='#fff' stroke-width='1.2'>♔&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g><text x='330' y='60' font-size='22' font-weight='700' text-anchor='start' fill='#222'>h6: attacked,</text><text x='330' y='96' font-size='22' font-weight='700' text-anchor='start' fill='#222'>undefended</text><text x='330' y='132' font-size='22' font-weight='700' text-anchor='start' fill='#222'>d5: attacked,</text><text x='330' y='168' font-size='22' font-weight='700' text-anchor='start' fill='#222'>defended by e6</text></svg>"}},{"say":"Before every move, strong players ask three <b>safety questions</b>. This is a discipline: the same questions, every move, without exception.","show":{"type":"list","items":["1. What does my opponent threaten?","2. Will my piece be safe on its new square?","3. Can I capture anything for free?"]}},{"say":"Count <b>attackers and defenders</b>. If you attack a piece twice and it is defended once, you can usually win it, provided the exchanges do not cost you more than you gain.","show":{"type":"table","rows":[["Attackers","Defenders","Can you win it?"],["1","0","Yes: it is hanging"],["2","1","Usually, if your attackers are not worth more"],["1","1","Only if it is worth more than your attacker"]]}},{"say":"Notice that these chess claims are <b>checkable facts</b>: anyone who looks at the board can verify whether a piece is attacked. A strong claim is one you can check; 'I feel it is safe' is not evidence.","show":{"type":"big","text":"Claim → check the board → verified or refuted"}},{"say":"Knight attacks are <b>symmetric</b>: a knight on X attacks Y exactly when a knight on Y would attack X. So to find a square from which a knight attacks two targets at once (a fork), list the knight squares around each target and intersect the lists.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g opacity='0.85'><circle cx='145.5' cy='90.5' r='9' fill='#2f9e5f'/></g><g font-size='30' text-anchor='middle' stroke='#111'><text x='178.5' y='35' fill='#111' stroke-width='0.4'>♚&#xFE0E;</text><text x='112.5' y='35' fill='#111' stroke-width='0.4'>♜&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g><text x='330' y='60' font-size='22' font-weight='700' text-anchor='start' fill='#222'>Green: a knight there</text><text x='330' y='96' font-size='22' font-weight='700' text-anchor='start' fill='#222'>attacks both e8</text><text x='330' y='132' font-size='22' font-weight='700' text-anchor='start' fill='#222'>and c8.</text></svg>"}},{"say":"<b>Explain it.</b> Define 'hanging' precisely, and explain how you would PROVE to someone that a particular piece is hanging, rather than just saying so.","show":{"type":"passage","title":"Explain it","text":"Define 'hanging' precisely, and explain how you would PROVE to someone that a particular piece is hanging, rather than just saying so.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise words from this lesson."}}],"practice":[{"q":"Which black piece is hanging (attacked and undefended)?","options":["Knight on h6","Pawn on d5","Rook on b4","None"],"answer":"Knight on h6","hint":"For each black piece: is it attacked? If so, is it defended?","why":"The bishop on f4 attacks h6, and nothing defends h6. The knight attacks d5, but the e6 pawn defends it. Nothing attacks the rook on b4.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g font-size='30' text-anchor='middle' stroke='#111'><text x='112.5' y='200' fill='#fff' stroke-width='1.2'>♘&#xFE0E;</text><text x='211.5' y='167' fill='#fff' stroke-width='1.2'>♗&#xFE0E;</text><text x='145.5' y='134' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='178.5' y='101' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='277.5' y='101' fill='#111' stroke-width='0.4'>♞&#xFE0E;</text><text x='79.5' y='167' fill='#111' stroke-width='0.4'>♜&#xFE0E;</text><text x='178.5' y='35' fill='#111' stroke-width='0.4'>♚&#xFE0E;</text><text x='178.5' y='266' fill='#fff' stroke-width='1.2'>♔&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g></svg>"}},{"q":"How many black pieces (excluding the king) does the white knight on e5 attack?","type":"number","answer":4,"hint":"List all eight knight squares from e5.","why":"From e5 the knight attacks c6 (queen), d7 (rook), f7 (bishop) and g6 (pawn): four pieces at once.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g font-size='30' text-anchor='middle' stroke='#111'><text x='178.5' y='134' fill='#fff' stroke-width='1.2'>♘&#xFE0E;</text><text x='112.5' y='101' fill='#111' stroke-width='0.4'>♛&#xFE0E;</text><text x='145.5' y='68' fill='#111' stroke-width='0.4'>♜&#xFE0E;</text><text x='211.5' y='68' fill='#111' stroke-width='0.4'>♝&#xFE0E;</text><text x='244.5' y='101' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='244.5' y='35' fill='#111' stroke-width='0.4'>♚&#xFE0E;</text><text x='46.5' y='266' fill='#fff' stroke-width='1.2'>♔&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g></svg>"}},{"q":"A player says, 'My bishop is safe on b5, I just know it.' What is the logician's reply?","options":["Check: list every enemy piece that attacks b5","Agree: confidence is enough","Disagree: bishops are never safe","Ask someone older"],"answer":"Check: list every enemy piece that attacks b5","hint":"What would count as evidence here?","why":"Feeling sure is not evidence. The claim can be tested directly by checking every enemy piece that could reach b5.","show":{"type":"passage","title":"","text":"A player says, 'My bishop is safe on b5, I just know it.' What is the logician's reply?"}},{"q":"Consider the black pawn on d4. How many WHITE pieces attack it?","type":"number","answer":1,"hint":"Test each white piece: could it capture on d4?","why":"Only the pawn on e3 attacks d4. The knight on c3 does not reach d4, and the bishop on f2 is blocked by its own pawn on e3.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g font-size='30' text-anchor='middle' stroke='#111'><text x='145.5' y='167' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='112.5' y='200' fill='#fff' stroke-width='1.2'>♘&#xFE0E;</text><text x='211.5' y='233' fill='#fff' stroke-width='1.2'>♗&#xFE0E;</text><text x='178.5' y='200' fill='#fff' stroke-width='1.2'>♙&#xFE0E;</text><text x='244.5' y='35' fill='#111' stroke-width='0.4'>♚&#xFE0E;</text><text x='244.5' y='266' fill='#fff' stroke-width='1.2'>♔&#xFE0E;</text><text x='112.5' y='134' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g></svg>"}},{"q":"Consider the black pawn on e4. How many white pieces attack it?","type":"number","answer":2,"hint":"Check each knight's eight jumps.","why":"The knights on c3 and d2 both reach e4: 2 attackers.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g font-size='30' text-anchor='middle' stroke='#111'><text x='178.5' y='167' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='145.5' y='233' fill='#fff' stroke-width='1.2'>♘&#xFE0E;</text><text x='112.5' y='200' fill='#fff' stroke-width='1.2'>♘&#xFE0E;</text><text x='244.5' y='35' fill='#111' stroke-width='0.4'>♚&#xFE0E;</text><text x='244.5' y='266' fill='#fff' stroke-width='1.2'>♔&#xFE0E;</text><text x='145.5' y='134' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g></svg>"}},{"q":"Is the black knight on c6 hanging?","options":["No: two pawns defend it","Yes: nothing defends it","No: the king defends it","It is not attacked at all"],"answer":"No: two pawns defend it","hint":"Which black pawns could capture on c6?","why":"Black pawns capture diagonally downward, so both b7 and d7 defend c6. It is attacked by the bishop but defended twice.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g font-size='30' text-anchor='middle' stroke='#111'><text x='79.5' y='134' fill='#fff' stroke-width='1.2'>♗&#xFE0E;</text><text x='112.5' y='101' fill='#111' stroke-width='0.4'>♞&#xFE0E;</text><text x='46.5' y='68' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='79.5' y='68' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='145.5' y='68' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='178.5' y='35' fill='#111' stroke-width='0.4'>♚&#xFE0E;</text><text x='244.5' y='266' fill='#fff' stroke-width='1.2'>♔&#xFE0E;</text><text x='277.5' y='35' fill='#111' stroke-width='0.4'>♜&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g></svg>"}},{gen:() => (gHanging())},{gen:() => (gHanging())},{gen:() => (gHanging())},{gen:() => (gHanging())},{gen:() => (gHanging())},{gen:() => (gAttDef())},{gen:() => (gAttDef())},{gen:() => (gAttDef())},{gen:() => (gAttDef())},{gen:() => (gForkSquares())},{gen:() => (gForkSquares())},{gen:() => (gForkSquares())},{gen:() => (gForkSquares())},{gen:() => (gPieceDist("N"))},{gen:() => (gPieceDist("N"))},{gen:() => (gOddOne(2))},{gen:() => (gOddOne(2))},{gen:() => (gMinAttrs())},{gen:() => (gRuleFit())},{gen:() => (gKnightExact())}],"challenge":[{"q":"A knight on a1 must reach h8, the opposite corner. What is the fewest number of moves?","type":"number","answer":6,"hint":"Estimate the distance; then use the color invariant.","why":"h8 is 7 files and 7 ranks away: 14 steps, and a knight move covers at most 3, so at least 5 moves. Every knight move changes color, and a1 and h8 are both dark, so the number of moves must be even: at least 6. Six suffices: a1 → b3 → c5 → d7 → f8 → g6 → h8.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g opacity='0.85'><circle cx='277.5' cy='24.5' r='9' fill='#2f9e5f'/></g><g font-size='30' text-anchor='middle' stroke='#111'><text x='46.5' y='266' fill='#fff' stroke-width='1.2'>♘&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text>     {"title":"Figural sequences and remainders","icon":"➡️","learn":[{"say":"A <b>sequence</b> is an ordered list generated by a rule. To predict the next term, describe precisely how each term is obtained from the one before.","show":{"type":"list","items":["Rotation (turning by a fixed angle)","Growth (adding a fixed amount)","Alternation (taking turns)","Cycling through a repeating core","Two or more rules acting at once"],"caption":"Common generating rules"}},{"say":"Here each arrow turns a <b>quarter turn clockwise</b>: right, down, left, up. After four quarter turns the arrow has completed a full turn, so the fifth term points right again.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><rect x='7' y='75' width='106' height='130' rx='14' fill='#fff' stroke='#bbb' stroke-width='2'/><polygon points='20,128 68,128 68,110 100,140 68,170 68,152 20,152' fill='#e4572e' stroke='#e4572e' stroke-width='2' stroke-linejoin='round'/><rect x='127' y='75' width='106' height='130' rx='14' fill='#fff' stroke='#bbb' stroke-width='2'/><polygon points='192,100 192,148 210,148 180,180 150,148 168,148 168,100' fill='#e4572e' stroke='#e4572e' stroke-width='2' stroke-linejoin='round'/><rect x='247' y='75' width='106' height='130' rx='14' fill='#fff' stroke='#bbb' stroke-width='2'/><polygon points='340,152 292,152 292,170 260,140 292,110 292,128 340,128' fill='#e4572e' stroke='#e4572e' stroke-width='2' stroke-linejoin='round'/><rect x='367' y='75' width='106' height='130' rx='14' fill='#fff' stroke='#bbb' stroke-width='2'/><polygon points='408,180 408,132 390,132 420,100 450,132 432,132 432,180' fill='#e4572e' stroke='#e4572e' stroke-width='2' stroke-linejoin='round'/><rect x='487' y='75' width='106' height='130' rx='14' fill='#fff7d6' stroke='#c99a00' stroke-width='3' stroke-dasharray='8 6'/><text x='540' y='156' font-size='52' font-weight='700' text-anchor='middle' fill='#a77f00'>?</text></svg>"}},{"say":"Rules c
