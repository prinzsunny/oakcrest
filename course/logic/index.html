2a' stroke-width='2'/><g font-size='30' text-anchor='middle' stroke='#111'><text x='46.5' y='266' fill='#fff' stroke-width='1.2'>♘&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g></svg>"}},{"q":"Which square can the knight on g1 reach?","options":["g3","f3","e1","h2"],"answer":"f3","hint":"Two squares up and one sideways, or one up and two sideways.","why":"From g1 the knight reaches e2, f3 and h3. Of the options, only f3.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g font-size='30' text-anchor='middle' stroke='#111'><text x='244.5' y='266' fill='#fff' stroke-width='1.2'>♘&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g></svg>"}},{"q":"Order these squares from FEWEST to MOST knight moves available.","type":"order","items":["c2","a1","b2","b1"],"answer":["a1","b1","b2","c2"],"hint":"The nearer the edge, the fewer the moves.","why":"a1: 2, b1: 3, b2: 4, c2: 6. Knights are weakest at the edge, hence the saying 'a knight on the rim is dim'.","show":{"type":"passage","title":"","text":"Order these squares from FEWEST to MOST knight moves available."}},{"q":"A knight starts on a light square and makes 5 moves. On which color does it finish?","options":["Dark","Light","It depends on the moves chosen"],"answer":"Dark","hint":"Every move switches the color. What happens after an odd number of switches?","why":"After moves 1, 3 and 5 it stands on dark; after 2 and 4 on light. Five is odd, so it finishes on dark, whichever moves are chosen. This is an invariant argument.","show":{"type":"passage","title":"","text":"A knight starts on a light square and makes 5 moves. On which color does it finish?"}},{gen:() => (gSeqFig(1))},{gen:() => (gSeqFig(1))},{gen:() => (gSeqFig(1))},{gen:() => (gSeqFig(1))},{gen:() => (gSeqFig(2))},{gen:() => (gSeqFig(2))},{gen:() => (gSeqFig(2))},{gen:() => (gCore(1))},{gen:() => (gCore(1))},{gen:() => (gCore(1))},{gen:() => (gCore(2))},{gen:() => (gCore(2))},{gen:() => (gPieceDist("N"))},{gen:() => (gPieceDist("N"))}],"challenge":[{"q":"The pattern ▲ ■ ● ★ repeats. How many ★ appear among the first 30 symbols?","type":"number","answer":7,"hint":"How many complete cores fit in 30, and do the leftovers include a ★?","why":"30 = 4 × 7 + 2: seven complete cores (seven stars) and two leftover symbols, ▲ ■, which contain no star. Answer: 7.","show":{"type":"passage","title":"","text":"The pattern ▲ ■ ● ★ repeats. How many ★ appear among the first 30 symbols?"}},{"q":"A clock hand starts pointing up and turns one eighth of a turn clockwise per step. Where does it point after 100 steps?","options":["up","right","down","left"],"answer":"down","hint":"Eight steps complete a full turn. What remains after 100 steps?","why":"100 = 8 × 12 + 4. Twelve full turns change nothing; the remaining 4 eighths are a half turn, so the hand points down.","show":{"type":"passage","title":"","text":"A clock hand starts pointing up and turns one eighth of a turn clockwise per step. Where does it point after 100 steps?"}},{"q":"A knight on d4 must reach d5, the square directly above it. What is the fewest number of moves?","type":"number","answer":3,"hint":"d4 is dark and d5 is light. What does that imply about the number of moves?","why":"Each move changes color, so dark to light needs an odd number of moves. One move cannot reach d5, so at least 3; and 3 suffice: d4 → e6 → c7 → d5.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g opacity='0.85'><circle cx='145.5' cy='123.5' r='9' fill='#2f9e5f'/></g><g font-size='30' text-anchor='middle' stroke='#111'><text x='145.5' y='167' fill='#fff' stroke-width='1.2'>♘&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g></svg>"}},{"q":"Place a knight on each of the 64 squares in turn and count its available moves each time. What is the total of all 64 counts?","type":"number","answer":336,"hint":"Use symmetry: count the moves from the 10 squares of one corner region carefully, or count pairs of squares a knight-move apart.","why":"Count pairs of squares joined by a knight move. Moves of the shape 2-across-1-up fit in 6 × 7 positions in each of 4 orientations: 4 × 42 = 168 pairs. Each pair is counted from both ends, so the total is 2 × 168 = 336.","show":{"type":"passage","title":"","text":"Place a knight on each of the 64 squares in turn and count its available moves each time. What is the total of all 64 counts?"}},{gen:() => (gCore(2))},{gen:() => (gSeqFig(2))},{gen:() => (gPieceDist("N"))}],"extend":"Investigate 'knight's tours': a knight visits every square of a board exactly once. Try to find a tour of a 5×5 board starting in a corner (number the squares 1 to 25 as you go). Then explain in writing why no closed tour (ending a knight's move from the start) can exist on a 5×5 board. Hint: consider colors.","offline":"Build a pattern of beads, pasta or coins that follows TWO rules at once (for example color cycles every 2, shape every 3). Ask a grown-up to predict the 12th and the 30th items using remainders, then verify by extending the pattern."},
    {"title":"Number patterns and the nth term","icon":"🔢","learn":[{"say":"Number sequences are governed by rules. The first tool is the <b>difference</b> between consecutive terms (terms that are next to each other).","show":{"type":"table","rows":[["3","7","11","15","?"],["+4","+4","+4","+4",""]],"caption":"Constant difference: an arithmetic sequence. Next term 19."}},{"say":"An <b>arithmetic sequence</b> adds the same amount each time. Its nth term is: first term + (n − 1) × difference. From the 1st term to the 50th there are 49 steps, not 50.","show":{"type":"big","text":"nth term = a + (n − 1) × d\n3, 7, 11, … 50th = 3 + 49 × 4 = 199"}},{"say":"A <b>geometric sequence</b> multiplies by the same amount (the <b>ratio</b>) each time. With a ratio greater than 1 (and a positive first term), geometric growth eventually overtakes any arithmetic growth.","show":{"type":"table","rows":[["n","1","2","3","4","5","6","7","8"],["+10 each step","10","20","30","40","50","60","70","80"],["×2 each step","1","2","4","8","16","32","64","128"]],"caption":"At step 8 the doubling sequence overtakes (128 > 80), and it stays ahead for ever."}},{"say":"If the differences themselves change, compute the <b>second differences</b>. The square numbers have first differences 3, 5, 7, 9 (the odd numbers) and constant second differences of 2.","show":{"type":"table","rows":[["1","4","9","16","25"],["","+3","+5","+7","+9"],["","","+2","+2","+2"]]}},{"say":"In the <b>Fibonacci sequence</b>, each term is the sum of the two before. It was described in Europe by Leonardo of Pisa in 1202, and it appears in the spirals of sunflowers and pinecones.","show":{"type":"big","text":"1, 1, 2, 3, 5, 8, 13, 21, 34, …\n13 + 21 = 34"}},{"say":"Two sequences can be <b>interleaved</b> (woven together). Separate the odd-numbered positions from the even-numbered ones and solve each.","show":{"type":"big","text":"1, 10, 2, 20, 3, 30, …\n→ 1, 2, 3, …  and  10, 20, 30, …"}},{"say":"Chess: <b>pawns</b> move straight forward one square (two on their first move) but <b>capture diagonally forward</b>. A pawn directly blocked by any piece cannot advance.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g opacity='0.85'><circle cx='178.5' cy='189.5' r='9' fill='#2f9e5f'/><circle cx='211.5' cy='123.5' r='9' fill='#e4572e'/></g><g font-size='30' text-anchor='middle' stroke='#111'><text x='178.5' y='233' fill='#fff' stroke-width='1.2'>♙&#xFE0E;</text><text x='145.5' y='134' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='178.5' y='167' fill='#fff' stroke-width='1.2'>♙&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g><text x='320' y='60' font-size='20' font-weight='700' text-anchor='start' fill='#222'>e2 may advance.</text><text x='320' y='94' font-size='20' font-weight='700' text-anchor='start' fill='#222'>e4 may capture d5</text><text x='320' y='128' font-size='20' font-weight='700' text-anchor='start' fill='#222'>(diagonally forward).</text></svg>"}},{"say":"<b>Explain it.</b> Explain why the 50th term of an arithmetic sequence uses 49 differences, not 50. Use a short sequence you can check by hand, such as 2, 5, 8, 11.","show":{"type":"passage","title":"Explain it","text":"Explain why the 50th term of an arithmetic sequence uses 49 differences, not 50. Use a short sequence you can check by hand, such as 2, 5, 8, 11.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise words from this lesson."}}],"practice":[{"q":"What comes next? 5, 9, 13, 17, …","type":"number","answer":21,"hint":"What is the difference between consecutive terms?","why":"The difference is +4: 17 + 4 = 21.","show":{"type":"big","text":"5, 9, 13, 17, ?"}},{"q":"What comes next? 3, 6, 12, 24, …","type":"number","answer":48,"hint":"Is the rule additive or multiplicative?","why":"The ratio is 2: 24 × 2 = 48.","show":{"type":"big","text":"3, 6, 12, 24, ?"}},{"q":"What comes next? 1, 4, 9, 16, 25, …","type":"number","answer":36,"hint":"Examine the differences: +3, +5, +7…","why":"These are square numbers: 6 × 6 = 36. Equivalently, the next difference is +11, and 25 + 11 = 36.","show":{"type":"big","text":"1, 4, 9, 16, 25, ?"}},{"q":"Fibonacci: what comes next? 1, 1, 2, 3, 5, 8, 13, …","type":"number","answer":21,"hint":"Add the two preceding terms.","why":"8 + 13 = 21.","show":{"type":"big","text":"1, 1, 2, 3, 5, 8, 13, ?"}},{"q":"What comes next? 100, 93, 86, 79, …","type":"number","answer":72,"hint":"In which direction, and by how much?","why":"The difference is −7: 79 − 7 = 72.","show":{"type":"big","text":"100, 93, 86, 79, ?"}},{"q":"Interleaved: what comes next? 2, 20, 4, 40, 6, 60, …","type":"number","answer":8,"hint":"Consider every other term.","why":"The odd positions read 2, 4, 6, so the 7th term is 8.","show":{"type":"big","text":"2, 20, 4, 40, 6, 60, ?"}},{"q":"Find the missing term: 7, ?, 19, 25","type":"number","answer":13,"hint":"The gap from 19 to 25 reveals the difference.","why":"The difference is 6, so the missing term is 7 + 6 = 13; check: 13 + 6 = 19.","show":{"type":"big","text":"7, ?, 19, 25"}},{"q":"Which rule generates 2, 6, 18, 54, …?","options":["×3","+4","+12","×2"],"answer":"×3","hint":"A rule must work for every step, not only the first.","why":"2 × 3 = 6, 6 × 3 = 18, 18 × 3 = 54. '+4' fits only the first step.","show":{"type":"big","text":"2, 6, 18, 54"}},{"q":"Triangle numbers 1, 3, 6, 10, 15, … What is the next term?","type":"number","answer":21,"hint":"The differences are 2, 3, 4, 5…","why":"The next difference is 6: 15 + 6 = 21.","show":{"type":"big","text":"1, 3, 6, 10, 15, ?"}},{"q":"What is the 20th term of 3, 7, 11, 15, …?","type":"number","answer":79,"hint":"How many differences of 4 separate the 1st and the 20th term?","why":"3 + 19 × 4 = 3 + 76 = 79.","show":{"type":"passage","title":"","text":"What is the 20th term of 3, 7, 11, 15, …?"}},{"q":"What comes next? 1, 2, 6, 24, 120, …","type":"number","answer":720,"hint":"Divide each term by the one before it.","why":"The multipliers are ×2, ×3, ×4, ×5, so next is ×6: 120 × 6 = 720. (These are the factorials: 1 × 2 × 3 × … × n.)","show":{"type":"big","text":"1, 2, 6, 24, 120, ?"}},{"q":"Which black piece can the white pawn on e4 capture?","options":["Knight on d5","Pawn on e5","Bishop on f4","Nothing"],"answer":"Knight on d5","hint":"Pawns capture one square diagonally FORWARD.","why":"White pawns advance up the board, so the capture squares are d5 and f5. The knight on d5 can be taken; e5 merely blocks the pawn, and f4 is beside it, not in front.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g font-size='30' text-anchor='middle' stroke='#111'><text x='178.5' y='167' fill='#fff' stroke-width='1.2'>♙&#xFE0E;</text><text x='145.5' y='134' fill='#111' stroke-width='0.4'>♞&#xFE0E;</text><text x='178.5' y='134' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='211.5' y='167' fill='#111' stroke-width='0.4'>♝&#xFE0E;</text><text x='46.5' y='266' fill='#fff' stroke-width='1.2'>♔&#xFE0E;</text><text x='277.5' y='35' fill='#111' stroke-width='0.4'>♚&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g></svg>"}},{"q":"The white pawn on c2 is blocked by a knight on c3. Which squares can it move to?","options":["b3 and d3","c3 and c4","b3 only","None"],"answer":"b3 and d3","hint":"It cannot advance into an occupied square. Can it capture?","why":"c3 is occupied, so the pawn cannot advance at all. It can capture either black pawn diagonally: b3 or d3.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g font-size='30' text-anchor='middle' stroke='#111'><text x='112.5' y='233' fill='#fff' stroke-width='1.2'>♙&#xFE0E;</text><text x='79.5' y='200' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='145.5' y='200' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='112.5' y='200' fill='#111' stroke-width='0.4'>♞&#xFE0E;</text><text x='46.5' y='266' fill='#fff' stroke-width='1.2'>♔&#xFE0E;</text><text x='277.5' y='35' fill='#111' stroke-width='0.4'>♚&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g></svg>"}},{"q":"A white pawn on e2 has not yet moved, and nothing is in front of it. How many squares can it move to?","type":"number","answer":2,"hint":"On its first move a pawn has an extra option.","why":"It may advance to e3 or, on its first move only, to e4: 2 squares.","show":{"type":"passage","title":"","text":"A white pawn on e2 has not yet moved, and nothing is in front of it. How many squares can it move to?"}},{gen:() => (gArith(1))},{gen:() => (gArith(1))},{gen:() => (gArith(2))},{gen:() => (gArith(2))},{gen:() => (gArith(3))},{gen:() => (gArith(3))},{gen:() => (gGeom())},{gen:() => (gGeom())},{gen:() => (gSecond())},{gen:() => (gSecond())},{gen:() => (gFibLike())},{gen:() => (gFibLike())},{gen:() => (gInterleave())},{gen:() => (gInterleave())}],"challenge":[{"q":"What is the 50th term of 4, 7, 10, 13, …?","type":"number","answer":151,"hint":"From the 1st term to the 50th, how many steps of +3?","why":"49 steps: 4 + 49 × 3 = 4 + 147 = 151.","show":{"type":"passage","title":"","text":"What is the 50th term of 4, 7, 10, 13, …?"}},{"q":"What is the 10th term of 1, 2, 4, 7, 11, 16, …?","type":"number","answer":46,"hint":"The differences are 1, 2, 3, … Which differences are added between the 1st and 10th terms?","why":"Term 10 = 1 + (1 + 2 + … + 9) = 1 + 45 = 46.","show":{"type":"passage","title":"","text":"What is the 10th term of 1, 2, 4, 7, 11, 16, …?"}},{"q":"How many of the first 15 Fibonacci numbers (1, 1, 2, 3, 5, …) are even?","type":"number","answer":5,"hint":"Look at the pattern of odd and even.","why":"Odd + odd = even, odd + even = odd, even + odd = odd. So the parities run odd, odd, even, odd, odd, even, … with every third term even. Among 15 terms: 5 are even.","show":{"type":"passage","title":"","text":"How many of the first 15 Fibonacci numbers (1, 1, 2, 3, 5, …) are even?"}},{"q":"A sequence starts 2, 5 and each later term is the sum of ALL the terms before it. What is the 6th term?","type":"number","answer":56,"hint":"Compute term 3, then notice how each later term relates to the one before.","why":"Term 3 = 2 + 5 = 7. Term 4 = 2 + 5 + 7 = 14. From then on each term doubles the previous (it adds the previous term to the sum that produced it): 28, 56. The 6th term is 56.","show":{"type":"passage","title":"","text":"A sequence starts 2, 5 and each later term is the sum of ALL the terms before it. What is the 6th term?"}},{gen:() => (gArith(3))},{gen:() => (gSecond())}],"extend":"Read about Leonardo of Pisa (Fibonacci) and his rabbit problem from the book Liber Abaci (1202). Then investigate: add the first n Fibonacci numbers for n = 1 to 8 and compare each total with the Fibonacci numbers. State the pattern you find as a precise rule, and test it on n = 9.","offline":"Find Fibonacci numbers in nature with a grown-up: count the petals of several flowers, or the spirals on a pinecone or pineapple in each direction. Record your counts in a table and state which are Fibonacci numbers and which are not. Evidence, not expectation, decides."},
    {"title":"Fact, opinion and preference","icon":"🦃","learn":[{"say":"Not every sentence makes a claim that can be <b>true or false</b>. Logicians first ask: what kind of statement is this?","show":{"type":"table","rows":[["Kind","Example","Can it be checked?"],["Fact (claim)","The turkey weighs 6 kg.","Yes: weigh it."],["Opinion (judgement)","This is the best recipe.","Partly: give reasons and evidence."],["Preference (taste)","I like pie more than cake.","It reports a taste."]]}},{"say":"A <b>factual claim</b> is true or false whether or not anyone believes it. We test it by asking: <b>Is it true? How do we know? What is the evidence?</b>","show":{"type":"list","items":["Is it true?","How do we know?","What is the evidence?","Is the source reliable?"],"caption":"Four questions for every claim"}},{"say":"Warning: a claim can be <b>false</b> even if it sounds confident or many people repeat it. And a fact stays true even if it is unpopular. Evidence decides, not volume.","show":{"type":"big","text":"Sounds convincing ≠ true"}},{"say":"Counting is a source of certain facts. Three guests can sit in three chairs in <b>3 × 2 × 1 = 6</b> ways: three choices for the first chair, then two, then one.","show":{"type":"list","items":["A B C","A C B","B A C","B C A","C A B","C B A"],"caption":"All 6 arrangements"}},{"say":"Seating puzzles are deductions from facts. If Grandma sits at neither end of three chairs, she must sit in the <b>middle</b>; that is not a guess, it is forced.","show":{"type":"table","rows":[["Left","Middle","Right"],["?","Grandma","?"]]}},{"say":"<b>Explain it.</b> Give one fact, one opinion and one preference about your favorite meal. For the fact, say exactly how someone could check it.","show":{"type":"passage","title":"Explain it","text":"Give one fact, one opinion and one preference about your favorite meal. For the fact, say exactly how someone could check it.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise words from this lesson."}}],"practice":[{"q":"'The pie has 8 slices.' What kind of statement is this?","options":["Fact (checkable claim)","Opinion","Preference"],"answer":"Fact (checkable claim)","hint":"Could someone check it by looking and counting?","why":"It can be verified by counting, so it is a factual claim. It is true or false regardless of anyone's feelings.","show":{"type":"passage","title":"","text":"'The pie has 8 slices.' What kind of statement is this?"}},{"q":"'I like pumpkin pie more than apple pie.' What kind of statement is this?","options":["Preference","Fact (checkable claim)","A false statement"],"answer":"Preference","hint":"Is there a measurement that settles it for everyone?","why":"It reports a taste. People may differ without either being mistaken about a fact.","show":{"type":"passage","title":"","text":"'I like pumpkin pie more than apple pie.' What kind of statement is this?"}},{"q":"'Thanksgiving in the United States is celebrated on the fourth Thursday of November.' What kind of statement is this?","options":["Fact (checkable claim)","Opinion","Preference"],"answer":"Fact (checkable claim)","hint":"Could you check it in a reliable reference?","why":"It can be checked against a calendar or official records, so it is a factual claim (and it is true).","show":{"type":"passage","title":"","text":"'Thanksgiving in the United States is celebrated on the fourth Thursday of November.' What kind of statement is this?"}},{"q":"'Our family's recipe is the best in the world.' What is the most accurate description?","options":["An opinion: a judgement that would need evidence and criteria","A proven fact","A preference that can never be discussed"],"answer":"An opinion: a judgement that would need evidence and criteria","hint":"What would 'best' be measured by?","why":"It is a judgement. To support it you would need criteria (taste tests, awards) and evidence; even then 'best in the world' is very hard to establish.","show":{"type":"passage","title":"","text":"'Our family's recipe is the best in the world.' What is the most accurate description?"}},{"q":"A friend says, 'Everyone says turkeys can fly, so it must be true.' What is wrong with this reasoning?","options":["Many people saying something is not evidence that it is true","Nothing: if everyone says it, it is true","Turkeys are birds, so the conclusion is certain","Friends are always right"],"answer":"Many people saying something is not evidence that it is true","hint":"What would actually settle whether turkeys can fly?","why":"Popularity is not evidence. The claim should be checked against reliable observations. (In fact, wild turkeys can fly short distances; most farm-raised turkeys are too heavy to.)","show":{"type":"passage","title":"","text":"A friend says, 'Everyone says turkeys can fly, so it must be true.' What is wrong with this reasoning?"}},{"q":"Which source is MOST reliable for the claim 'a turkey must be cooked to a safe internal temperature'?","options":["A government food-safety guide","A stranger's comment online","A cartoon about turkeys","A guess"],"answer":"A government food-safety guide","hint":"Which source has expertise and is accountable for accuracy?","why":"An official food-safety guide is written by experts and checked; the others have no reason to be accurate.","show":{"type":"passage","title":"","text":"Which source is MOST reliable for the claim 'a turkey must be cooked to a safe internal temperature'?"}},{"q":"How many different ways can 4 guests sit in a row of 4 chairs?","type":"number","answer":24,"hint":"First chair: 4 choices. Then?","why":"4 × 3 × 2 × 1 = 24.","show":{"type":"passage","title":"","text":"How many different ways can 4 guests sit in a row of 4 chairs?"}},{"q":"Four people each shake hands once with every other person. How many handshakes?","type":"number","answer":6,"hint":"Each person shakes 3 hands, but every handshake involves two people.","why":"4 × 3 = 12 counts each handshake twice, so 12 ÷ 2 = 6.","show":{"type":"passage","title":"","text":"Four people each shake hands once with every other person. How many handshakes?"}},{"q":"Five people each shake hands once with everyone else. How many handshakes?","type":"number","answer":10,"hint":"Each person shakes 4 hands. Correct for double counting.","why":"5 × 4 = 20, halved: 10.","show":{"type":"passage","title":"","text":"Five people each shake hands once with everyone else. How many handshakes?"}},{"q":"Grandma, Uncle and Cousin sit in a row. Grandma sits at neither end. Uncle sits somewhere to Grandma's right. Order them from LEFT to RIGHT.","type":"order","items":["Uncle","Cousin","Grandma"],"answer":["Cousin","Grandma","Uncle"],"hint":"Which clue forces a position immediately?","why":"Grandma must be in the middle. Uncle is to her right, so Cousin takes the left: Cousin, Grandma, Uncle.","show":{"type":"passage","title":"","text":"Grandma, Uncle and Cousin sit in a row. Grandma sits at neither end. Uncle sits somewhere to Grandma's right. Order them from LEFT to RIGHT."}},{"q":"Ann, Ben, Cal and Dee sit in a row. Ben is at the left end. Dee sits next to Ben. Ann does not sit next to Dee. Order them LEFT to RIGHT.","type":"order","items":["Ann","Ben","Cal","Dee"],"answer":["Ben","Dee","Cal","Ann"],"hint":"Fix Ben, then Dee. Which seat may Ann take?","why":"Ben is first and Dee second. Seat 3 touches Dee, so Ann takes seat 4 and Cal seat 3: Ben, Dee, Cal, Ann.","show":{"type":"passage","title":"","text":"Ann, Ben, Cal and Dee sit in a row. Ben is at the left end. Dee sits next to Ben. Ann does not sit next to Dee. Order them LEFT to RIGHT."}},{"q":"Ann, Ben and Cal each bring one dish: pie, rolls or salad. Ann did not bring pie. Ben brought rolls. Who brought the pie?","options":["Ann","Ben","Cal"],"answer":"Cal","hint":"Ben's dish is known. Who remains for the pie?","why":"Ben brought rolls, so the pie is Ann's or Cal's; Ann did not bring it, so Cal did (and Ann brought the salad).","show":{"type":"passage","title":"","text":"Ann, Ben and Cal each bring one dish: pie, rolls or salad. Ann did not bring pie. Ben brought rolls. Who brought the pie?"}},{gen:() => (gKind())},{gen:() => (gKind())},{gen:() => (gKind())},{gen:() => (gKind())},{gen:() => (gKind())},{gen:() => (gArrange())},{gen:() => (gArrange())},{gen:() => (gArrange())},{gen:() => (gHands())},{gen:() => (gHands())},{gen:() => (gHands())},{gen:() => (gOrder(3))},{gen:() => (gOrder(3))},{gen:() => (gOrder(3))}],"challenge":[{"q":"How many ways can 6 guests sit in a row of 6 chairs?","type":"number","answer":720,"hint":"6 choices for the first chair, then…","why":"6 × 5 × 4 × 3 × 2 × 1 = 720.","show":{"type":"passage","title":"","text":"How many ways can 6 guests sit in a row of 6 chairs?"}},{"q":"At a party of 8 people, everyone clinks glasses once with everyone else. How many clinks?","type":"number","answer":28,"hint":"Each person clinks 7 glasses. Then correct for double counting.","why":"8 × 7 = 56, and each clink is counted twice: 28.","show":{"type":"passage","title":"","text":"At a party of 8 people, everyone clinks glasses once with everyone else. How many clinks?"}},{"q":"Five guests sit in a row, but two of them (siblings) insist on sitting next to each other. How many arrangements are possible?","type":"number","answer":48,"hint":"Glue the siblings together into one 'block'. How many objects are being arranged? In how many orders can the siblings sit within their block?","why":"Treat the pair as one block: 4 objects in a row give 4 × 3 × 2 × 1 = 24 arrangements. Inside the block the siblings can sit in 2 orders. 24 × 2 = 48.","show":{"type":"passage","title":"","text":"Five guests sit in a row, but two of them (siblings) insist on sitting next to each other. How many arrangements are possible?"}},{gen:() => (gHands())},{gen:() => (gOrder(4))}],"extend":"Collect ten statements from a newspaper headline, an advertisement and a conversation. Sort them into facts, opinions and preferences. For each fact, write how it could be checked and which source would be reliable. For each opinion, write what evidence would strengthen or weaken it.","offline":"At a family meal, play the gratitude round: each person names one SPECIFIC thing they are thankful for. Then play 'Fact, opinion or preference?': take turns saying a sentence about the food while the others classify it and, for facts, say how to check."},
    {"title":"Review: growing patterns and formulas","icon":"🌱","learn":[{"say":"Review: sequences may consist of pictures, numbers or moves. Describe the change, propose a rule, <b>test it on every term</b>, and only then predict.","show":{"type":"list","items":["1. Observe what changes","2. Propose a rule","3. Test it on EVERY term","4. Predict and verify"]}},{"say":"Extension: <b>growing patterns</b>. These L-shapes grow by 2 squares per step: 1, 3, 5, 7.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><rect x='40' y='200' width='22' height='22' fill='#2e86ab' stroke='#fff'/><text x='70' y='262' font-size='20' font-weight='700' text-anchor='middle' fill='#222'>step 1: 1</text><rect x='180' y='200' width='22' height='22' fill='#2e86ab' stroke='#fff'/><rect x='180' y='178' width='22' height='22' fill='#2e86ab' stroke='#fff'/><rect x='202' y='200' width='22' height='22' fill='#2e86ab' stroke='#fff'/><text x='210' y='262' font-size='20' font-weight='700' text-anchor='middle' fill='#222'>step 2: 3</text><rect x='320' y='200' width='22' height='22' fill='#2e86ab' stroke='#fff'/><rect x='320' y='178' width='22' height='22' fill='#2e86ab' stroke='#fff'/><rect x='320' y='156' width='22' height='22' fill='#2e86ab' stroke='#fff'/><rect x='342' y='200' width='22' height='22' fill='#2e86ab' stroke='#fff'/><rect x='364' y='200' width='22' height='22' fill='#2e86ab' stroke='#fff'/><text x='350' y='262' font-size='20' font-weight='700' text-anchor='middle' fill='#222'>step 3: 5</text><rect x='460' y='200' width='22' height='22' fill='#2e86ab' stroke='#fff'/><rect x='460' y='178' width='22' height='22' fill='#2e86ab' stroke='#fff'/><rect x='460' y='156' width='22' height='22' fill='#2e86ab' stroke='#fff'/><rect x='460' y='134' width='22' height='22' fill='#2e86ab' stroke='#fff'/><rect x='482' y='200' width='22' height='22' fill='#2e86ab' stroke='#fff'/><rect x='504' y='200' width='22' height='22' fill='#2e86ab' stroke='#fff'/><rect x='526' y='200' width='22' height='22' fill='#2e86ab' stroke='#fff'/><text x='490' y='262' font-size='20' font-weight='700' text-anchor='middle' fill='#222'>step 4: 7</text></svg>"}},{"say":"A <b>formula</b> lets you jump to any step without drawing. Step n has one corner square plus two arms of n − 1 squares: 1 + 2 × (n − 1) = 2n − 1. Step 10 has 19 squares.","show":{"type":"table","rows":[["Step n","1","2","3","4","…","10","n"],["Squares","1","3","5","7","…","19","2n − 1"]]}},{"say":"A formula should be <b>justified</b> by the structure of the picture, not only fitted to a few numbers. Several different rules can fit the first three terms of a sequence.","show":{"type":"big","text":"1, 2, 4, …  next: 8 (doubling)?\nor 7 (add 1, 2, 3, …)?\nThree terms do not decide."}},{"say":"<b>Triangle numbers</b>: each step adds a row one dot longer. Two copies of triangle n fit together into an n by (n + 1) rectangle, so triangle n = n × (n + 1) ÷ 2.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><circle cx='75' cy='120' r='8' fill='#e4572e'/><text x='75' y='250' font-size='24' font-weight='700' text-anchor='middle' fill='#222'>1</text><circle cx='225' cy='120' r='8' fill='#e4572e'/><circle cx='214' cy='142' r='8' fill='#e4572e'/><circle cx='236' cy='142' r='8' fill='#e4572e'/><text x='225' y='250' font-size='24' font-weight='700' text-anchor='middle' fill='#222'>3</text><circle cx='375' cy='120' r='8' fill='#e4572e'/><circle cx='364' cy='142' r='8' fill='#e4572e'/><circle cx='386' cy='142' r='8' fill='#e4572e'/><circle cx='353' cy='164' r='8' fill='#e4572e'/><circle cx='375' cy='164' r='8' fill='#e4572e'/><circle cx='397' cy='164' r='8' fill='#e4572e'/><text x='375' y='250' font-size='24' font-weight='700' text-anchor='middle' fill='#222'>6</text><circle cx='525' cy='120' r='8' fill='#e4572e'/><circle cx='514' cy='142' r='8' fill='#e4572e'/><circle cx='536' cy='142' r='8' fill='#e4572e'/><circle cx='503' cy='164' r='8' fill='#e4572e'/><circle cx='525' cy='164' r='8' fill='#e4572e'/><circle cx='547' cy='164' r='8' fill='#e4572e'/><circle cx='492' cy='186' r='8' fill='#e4572e'/><circle cx='514' cy='186' r='8' fill='#e4572e'/><circle cx='536' cy='186' r='8' fill='#e4572e'/><circle cx='558' cy='186' r='8' fill='#e4572e'/><text x='525' y='250' font-size='24' font-weight='700' text-anchor='middle' fill='#222'>10</text></svg>"}},{"say":"Chess review: Black has pushed a pawn to e5, attacking the knight. Apply safety question 1, <b>what does my opponent threaten?</b>, and then find a square where the knight is truly safe.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g font-size='30' text-anchor='middle' stroke='#111'><text x='145.5' y='167' fill='#fff' stroke-width='1.2'>♘&#xFE0E;</text><text x='178.5' y='134' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='178.5' y='35' fill='#111' stroke-width='0.4'>♚&#xFE0E;</text><text x='145.5' y='68' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='79.5' y='68' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='244.5' y='101' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='178.5' y='266' fill='#fff' stroke-width='1.2'>♔&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</te ll='#2e86ab' stroke='#fff'/><rect x='342' y='200' width='22' height='22' fill='#2e86ab' stroke='#fff'/><rect x='364' y='200' width='22' height='22' fill='#2e86ab' stroke='#fff'/><text x='350' y='262' font-size='20' font-weight='700' text-anchor='middle' fill='#222'>step 3: 5</text><rect x='460' y='200' width='22' height='22' fill='#2e86ab' stroke='#fff'/><rect x='460' y='178' width='22' height='22' fill='#2e86ab' stroke='#fff'/><rect x='460' y='156' width='22' height='22' fill='#2e86ab' stroke='#fff'/><rect x='460' y='134' width='22' height='22' fill='#2e86ab' stroke='#fff'/><rect x='482' y='200' width='22' height='22' fill='#2e86ab' stroke='#fff'/><rect x='504' y='200' width='22' height='22' fill='#2e86ab' stroke='#fff'/><rect x='526' y='200' width='22' height='22' fill='#2e86ab' stroke='#fff'/><text x='490' y='262' font-size='20' font-weight='700' text-anchor='middle' fill='#222'>step 4: 7</text></svg>"}},{"q":"What is the 6th triangle number?","type":"number","answer":21,"hint":"Add a row of 5, then a row of 6, to 10.","why":"10 + 5 + 6 = 21, or 6 × 7 ÷ 2 = 21.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><circle cx='75' cy='120' r='8' fill='#e4572e'/><text x='75' y='250' font-size='24' font-weight='700' text-anchor='middle' fill='#222'>1</text><circle cx='225' cy='120' r='8' fill='#e4572e'/><circle cx='214' cy='142' r='8' fill='#e4572e'/><circle cx='236' cy='142' r='8' fill='#e4572e'/><text x='225' y='250' font-size='24' font-weight='700' text-anchor='middle' fill='#222'>3</text><circle cx='375' cy='120' r='8' fill='#e4572e'/><circle cx='364' cy='142' r='8' fill='#e4572e'/><circle cx='386' cy='142' r='8' fill='#e4572e'/><circle cx='353' cy='164' r='8' fill='#e4572e'/><circle cx='375' cy='164' r='8' fill='#e4572e'/><circle cx='397' cy='164' r='8' fill='#e4572e'/><text x='375' y='250' font-size='24' font-weight='700' text-anchor='middle' fill='#222'>6</text><circle cx='525' cy='120' r='8' fi
