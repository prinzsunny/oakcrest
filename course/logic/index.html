'url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g font-size='30' text-anchor='middle' stroke='#111'><text x='277.5' y='35' fill='#111' stroke-width='0.4'>♚&#xFE0E;</text><text x='244.5' y='35' fill='#111' stroke-width='0.4'>♜&#xFE0E;</text><text x='244.5' y='68' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='277.5' y='68' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='211.5' y='68' fill='#fff' stroke-width='1.2'>♘&#xFE0E;</text><text x='46.5' y='266' fill='#fff' stroke-width='1.2'>♔&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g><text x='320' y='60' font-size='22' font-weight='700' text-anchor='start' fill='#222'>Nf7: smothered</text><text x='320' y='96' font-size='22' font-weight='700' text-anchor='start' fill='#222'>mate. The king's</text><text x='320' y='132' font-size='22' font-weight='700' text-anchor='start' fill='#222'>own pieces trap it.</text></svg>"}},{"say":"<b>Explain it.</b> Explain why, in a one-to-one grid, a single ✓ lets you write several ✗s. Then explain what you should conclude if your grid finishes with two possible answers.","show":{"type":"passage","title":"Explain it","text":"Explain why, in a one-to-one grid, a single ✓ lets you write several ✗s. Then explain what you should conclude if your grid finishes with two possible answers.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise words from this lesson."}}],"practice":[{"q":"Ava, Ben and Cy each own one pet: a cat, a dog or a fish. Ava does not own the dog. Ben owns the fish. Who owns the dog?","options":["Ava","Ben","Cy"],"answer":"Cy","hint":"Mark Ben's ✓, then look at Ava's row.","why":"Ben owns the fish. Ava cannot own the dog or the fish, so she owns the cat. The dog is left for Cy.","show":{"type":"list","items":["1. Ava does not own the dog.","2. Ben owns the fish."],"caption":"Clues"}},{"q":"Same puzzle: which pet does Ava own?","options":["cat","dog","fish"],"answer":"cat","hint":"After Ben's ✓, how many options remain in Ava's row?","why":"Ava's row excludes the dog (clue 1) and the fish (Ben's), leaving the cat.","show":{"type":"table","rows":[["","cat","dog","fish"],["Ava","","✗",""],["Ben","","","✓"],["Cy","","",""]]}},{"q":"Gus, Hal and Ivy each play one game: chess, tennis or swimming. Gus does not swim. Hal plays neither chess nor swimming. Ivy does not play chess. Who swims?","options":["Gus","Hal","Ivy"],"answer":"Ivy","hint":"Hal's row has only one option left. Use it.","why":"Hal must play tennis. Ivy is not the chess player and tennis is taken, so Ivy swims; Gus plays chess.","show":{"type":"list","items":["1. Gus does not swim.","2. Hal plays neither chess nor swimming.","3. Ivy does not play chess."],"caption":"Clues"}},{"q":"Kim, Lee, Max and Nia each play one instrument: piano, violin, flute or drums. Who plays the drums?","options":["Kim","Lee","Max","Nia"],"answer":"Max","hint":"Start with the certain clue (2). Then which row has only one option?","why":"Lee plays violin. Kim plays neither piano nor drums, so flute. Nia is not the flautist, so piano or drums; Max is not the pianist, so Max takes the drums and Nia the piano.","show":{"type":"list","items":["1. Kim plays neither piano nor drums.","2. Lee plays the violin.","3. Nia does not play the flute.","4. Max does not play the piano."],"caption":"Clues"}},{"q":"Same puzzle: what does Nia play?","options":["piano","violin","flute","drums"],"answer":"piano","hint":"Once Max's instrument is fixed, what remains for Nia?","why":"Kim has the flute and Lee the violin. Max cannot have the piano, so Max has the drums, leaving the piano for Nia.","show":{"type":"list","items":["1. Kim plays neither piano nor drums.","2. Lee plays the violin.","3. Nia does not play the flute.","4. Max does not play the piano."],"caption":"Clues"}},{"q":"Oda, Pia, Quin and Rex each read one kind of book: poetry, history, science or mystery. Who reads mystery?","options":["Oda","Pia","Quin","Rex"],"answer":"Rex","hint":"Place Pia first. Who is excluded from mystery?","why":"Pia reads science. Oda and Quin are excluded from mystery, so Rex reads mystery. Then Oda (not poetry) reads history, and Quin reads poetry.","show":{"type":"list","items":["1. Oda reads neither poetry nor mystery.","2. Pia reads science.","3. Rex does not read history.","4. Quin does not read mystery."],"caption":"Clues"}},{"q":"Same puzzle: who reads poetry?","options":["Oda","Pia","Quin","Rex"],"answer":"Quin","hint":"Rex has mystery and Pia science. Oda is excluded from poetry.","why":"With mystery (Rex) and science (Pia) settled, Oda and Quin share history and poetry. Oda does not read poetry, so Quin does.","show":{"type":"list","items":["1. Oda reads neither poetry nor mystery.","2. Pia reads science.","3. Rex does not read history.","4. Quin does not read mystery."],"caption":"Clues"}},{"q":"Kim, Lee, Max and Nia each visited one city: Rome, Cairo, Lima or Oslo. Who visited Rome?","options":["Kim","Lee","Max","Nia"],"answer":"Nia","hint":"Three people are excluded from Rome. Who remains?","why":"Kim, Lee and Max are all excluded from Rome, so Nia visited Rome.","show":{"type":"list","items":["1. Kim visited neither Rome nor Oslo.","2. Lee visited neither Rome, Cairo nor Oslo.","3. Max did not visit Rome."],"caption":"Clues"}},{"q":"Same puzzle: who visited Oslo?","options":["Kim","Lee","Max","Nia"],"answer":"Max","hint":"Lee's row has a single option. Then Kim's.","why":"Lee must have visited Lima. Kim (not Rome, not Oslo, not Lima) visited Cairo. Nia has Rome, so Max visited Oslo.","show":{"type":"list","items":["1. Kim visited neither Rome nor Oslo.","2. Lee visited neither Rome, Cairo nor Oslo.","3. Max did not visit Rome."],"caption":"Clues"}},{"q":"In a one-to-one grid of 4 people and 4 items, how many ✓ marks does the finished grid contain?","type":"number","answer":4,"hint":"How many ✓ per row?","why":"Exactly one ✓ per row, and there are 4 rows: 4 ✓ marks (and 12 ✗ marks).","show":{"type":"passage","title":"","text":"In a one-to-one grid of 4 people and 4 items, how many ✓ marks does the finished grid contain?"}},{"q":"Before any clue, how many different complete matchings of 4 people with 4 items are possible?","type":"number","answer":24,"hint":"The first person has 4 choices, the next 3…","why":"4 × 3 × 2 × 1 = 24. Each clue eliminates some of these 24 possibilities until one remains.","show":{"type":"passage","title":"","text":"Before any clue, how many different complete matchings of 4 people with 4 items are possible?"}},{"q":"White to move. Which move is checkmate?","options":["Rook to a8","Rook to a7","Rook to e1","King to f1"],"answer":"Rook to a8","hint":"The black king is walled in by its own pawns.","why":"Ra8+ checks along the back rank; f7, g7 and h7 are occupied by Black's own pawns and nothing can block or capture: back-rank mate.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g font-size='30' text-anchor='middle' stroke='#111'><text x='244.5' y='35' fill='#111' stroke-width='0.4'>♚&#xFE0E;</text><text x='211.5' y='68' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='244.5' y='68' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='277.5' y='68' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='46.5' y='266' fill='#fff' stroke-width='1.2'>♖&#xFE0E;</text><text x='244.5' y='266' fill='#fff' stroke-width='1.2'>♔&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g></svg>"}},{"q":"White to move. Which move is checkmate?","options":["Knight to f7","Knight to h7","Knight to e6","Knight to f3"],"answer":"Knight to f7","hint":"Which squares can the king move to? None at all. So any undefended check is mate.","why":"Nf7+ checks the king, which has no free square (rook g8, pawns g7, h7); a knight's check cannot be blocked, and nothing can capture on f7. Smothered mate.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g font-size='30' text-anchor='middle' stroke='#111'><text x='277.5' y='35' fill='#111' stroke-width='0.4'>♚&#xFE0E;</text><text x='244.5' y='35' fill='#111' stroke-width='0.4'>♜&#xFE0E;</text><text x='244.5' y='68' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='277.5' y='68' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='244.5' y='134' fill='#fff' stroke-width='1.2'>♘&#xFE0E;</text><text x='46.5' y='266' fill='#fff' stroke-width='1.2'>♔&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g></svg>"}},{gen:() => (gGrid(3, 1))},{gen:() => (gGrid(3, 1))},{gen:() => (gGrid(3, 1))},{gen:() => (gGrid(3, 1))},{gen:() => (gGrid(3, 1))},{gen:() => (gGrid(4, 1))},{gen:() => (gGrid(4, 1))},{gen:() => (gGrid(4, 1))},{gen:() => (gGrid(4, 1))},{gen:() => (gGrid(4, 1))},{gen:() => (gMate1("R"))},{gen:() => (gMate1("R"))},{gen:() => (gMate1("Q"))}],"challenge":[{"q":"Ana, Bo, Cal and Di each have a different number from 1 to 4. What is Ana's number?","options":["2","4","1","3"],"answer":"2","hint":"Ana's number is 2 or 4. Test the case Ana = 4 against the clues about Bo and Cal.","why":"Suppose Ana = 4. Cal is odd, so Cal = 1 or 3, and Bo = Cal + 1 gives Bo = 2 (forbidden) or Bo = 4 (taken). So Ana ≠ 4, and Ana = 2. Then Di < 2 gives Di = 1, leaving 3 and 4: Cal = 3, Bo = 4. Every clue checks.","show":{"type":"list","items":["1. Ana's number is even.","2. Bo's number is one more than Cal's.","3. Di's number is smaller than Ana's.","4. Cal's number is odd.","5. Bo's number is not 2."],"caption":"Clues"}},{"q":"A grid matches 5 people with 5 items. How many possible matchings exist before any clues?","type":"number","answer":120,"hint":"Multiply the choices.","why":"5 × 4 × 3 × 2 × 1 = 120.","show":{"type":"passage","title":"","text":"A grid matches 5 people with 5 items. How many possible matchings exist before any clues?"}},{"q":"Ann, Bea and Cleo are a doctor, a pilot and a teacher (in some order). The doctor is an only child. Bea is Cleo's sister. Cleo is not the teacher. Who is the pilot?","options":["Ann","Bea","Cleo"],"answer":"Cleo","hint":"Which two people cannot be an only child? What does that tell you about the doctor?","why":"Bea and Cleo are sisters, so neither is an only child; neither can be the doctor, so Ann is. Cleo is not the teacher, so Cleo is the pilot and Bea the teacher. The clue about sisters carries hidden information: that is the art of these puzzles.","show":{"type":"passage","title":"","text":"Ann, Bea and Cleo are a doctor, a pilot and a teacher (in some order). The doctor is an only child. Bea is Cleo's sister. Cleo is not the teacher. Who is the pilot?"}},{gen:() => (gGrid(4, 1))},{gen:() => (gGrid(3, 2))}],"extend":"Design your own 4×4 logic grid puzzle about your family or favorite books, with four clues. Then test it rigorously: solve it from the clues alone, and check that removing any one clue makes the solution non-unique. Explain in writing why each clue is necessary.","offline":"Solve a logic grid from a puzzle book with a grown-up, writing a short justification next to each ✓ ('because clue 2 and Ben's row'). Then play a chess game and look for back-rank weaknesses on both sides."},
    {"title":"Review: three-category grids","icon":"🧮","learn":[{"say":"Review: a logic grid records ✓ and ✗, and every ✓ produces ✗s across its row and column. Extension: puzzles with <b>three categories</b> (for example person, pet and color).","show":{"type":"table","rows":[["","cat","dog","parrot","red","green","blue"],["Ari","","","","","",""],["Bel","","","","","",""],["Cas","","","","","",""]]}},{"say":"Some clues link two <b>non-person</b> categories: 'The dog's owner likes green.' Keep such a clue in mind as a <b>pairing</b>: whoever turns out to own the dog must like green, and nobody else may.","show":{"type":"big","text":"dog ⟷ green\n(whoever owns one has the other)"}},{"say":"Combine clues. Ari owns the parrot, so the dog belongs to Bel or Cas. Bel does not like green, so Bel cannot own the dog. Hence Cas owns the dog and likes green.","show":{"type":"table","rows":[["","pet","colour"],["Ari","parrot","not red, not green"],["Bel","cat","not green"],["Cas","dog","green"]]}},{"say":"Finally Ari is neither red nor green, so blue; Bel takes red. A three-category puzzle is solved by the same rule as always: <b>use only what is forced</b>.","show":{"type":"table","rows":[["","pet","colour"],["Ari","parrot","blue"],["Bel","cat","red"],["Cas","dog","green"]],"caption":"Solved"}},{"say":"Some clues compare: 'Hana is younger than the violinist' tells you several things at once. Extract <b>every</b> consequence of a clue before moving on.","show":{"type":"list","items":["Hana is not the violinist","Hana is not the oldest","The violinist is not the youngest"],"caption":"Consequences of one clue"}},{"say":"<b>Explain it.</b> Explain how a clue such as 'the dog's owner likes green' can be used before you know who owns the dog. Then list every consequence of 'Hana is younger than the violinist'.","show":{"type":"passage","title":"Explain it","text":"Explain how a clue such as 'the dog's owner likes green' can be used before you know who owns the dog. Then list every consequence of 'Hana is younger than the violinist'.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise words from this lesson."}}],"practice":[{"q":"Who likes red?","options":["Ari","Bel","Cas"],"answer":"Bel","hint":"First decide who owns the dog, using clues 1 and 3.","why":"Ari owns the parrot, so the dog is Bel's or Cas's. The dog's owner likes green, and Bel does not, so Cas owns the dog and likes green. Ari is not red, so blue; Bel likes red.","show":{"type":"list","items":["People: Ari, Bel, Cas","Pets: cat, dog, parrot","Colors: red, green, blue","1. The dog's owner likes green.","2. Ari owns the parrot.","3. Bel does not like green.","4. Ari does not like red."],"caption":"Clues"}},{"q":"Same puzzle: which pet does Bel own?","options":["cat","dog","parrot"],"answer":"cat","hint":"Ari's pet is given and Cas's is deduced.","why":"Ari has the parrot and Cas the dog, so Bel has the cat.","show":{"type":"list","items":["People: Ari, Bel, Cas","Pets: cat, dog, parrot","Colors: red, green, blue","1. The dog's owner likes green.","2. Ari owns the parrot.","3. Bel does not like green.","4. Ari does not like red."],"caption":"Clues"}},{"q":"Same puzzle: which color does Ari like?","options":["blue","red","green"],"answer":"blue","hint":"Green belongs to the dog owner; red is excluded by clue 4.","why":"Green goes with the dog (Cas), and clue 4 rules out red, so Ari likes blue.","show":{"type":"list","items":["People: Ari, Bel, Cas","Pets: cat, dog, parrot","Colors: red, green, blue","1. The dog's owner likes green.","2. Ari owns the parrot.","3. Bel does not like green.","4. Ari does not like red."],"caption":"Clues"}},{"q":"Who drinks tea?","options":["Dov","Eva","Fin","Gia"],"answer":"Gia","hint":"Dov's drink is forced first. Then use the snack clues.","why":"Eva has juice; Dov has neither tea nor milk, so cocoa. Fin eats the pear, and the milk drinker eats the pear, so Fin drinks milk. Gia drinks tea.","show":{"type":"list","items":["People: Dov, Eva, Fin, Gia","Drinks: tea, cocoa, juice, milk","Snacks: apple, pear, plum, fig","1. Eva drinks juice.","2. The tea drinker eats the plum.","3. Fin eats the pear.","4. Dov drinks neither tea nor milk.","5. The milk drinker eats the pear.","6. Dov does not eat the apple."],"caption":"Clues"}},{"q":"Same puzzle: what does Dov eat?","options":["fig","apple","pear","plum"],"answer":"fig","hint":"Gia (tea) eats the plum and Fin the pear. What is left for Dov?","why":"Gia eats the plum and Fin the pear. Dov and Eva share the apple and the fig; Dov does not eat the apple, so he eats the fig.","show":{"type":"list","items":["People: Dov, Eva, Fin, Gia","Drinks: tea, cocoa, juice, milk","Snacks: apple, pear, plum, fig","1. Eva drinks juice.","2. The tea drinker eats the plum.","3. Fin eats the pear.","4. Dov drinks neither tea nor milk.","5. The milk drinker eats the pear.","6. Dov does not eat the apple."],"caption":"Clues"}},{"q":"Same puzzle: what does Eva eat?","options":["apple","fig","pear","plum"],"answer":"apple","hint":"Once Dov's snack is known…","why":"Dov eats the fig, so Eva eats the apple.","show":{"type":"list","items":["People: Dov, Eva, Fin, Gia","Drinks: tea, cocoa, juice, milk","Snacks: apple, pear, plum, fig","1. Eva drinks juice.","2. The tea drinker eats the plum.","3. Fin eats the pear.","4. Dov drinks neither tea nor milk.","5. The milk drinker eats the pear.","6. Dov does not eat the apple."],"caption":"Clues"}},{"q":"Who is the pianist?","options":["Hana","Ilo","Jun"],"answer":"Jun","hint":"Who is the youngest? Use clues 3 and 4.","why":"Ilo is the oldest and Hana is older than Jun, so Jun is the youngest. The pianist is the youngest, so Jun plays piano.","show":{"type":"list","items":["People: Hana, Ilo, Jun (all different ages)","Instruments: violin, piano, cello","1. Hana is younger than the violinist.","2. The pianist is the youngest.","3. Ilo is the oldest.","4. Hana is older than Jun."],"caption":"Clues"}},{"q":"Same puzzle: who plays the violin?","options":["Hana","Ilo","Jun"],"answer":"Ilo","hint":"Hana is younger than the violinist. Who is older than Hana?","why":"Only Ilo is older than Hana, so Ilo is the violinist. Jun plays piano, leaving the cello for Hana.","show":{"type":"list","items":["People: Hana, Ilo, Jun (all different ages)","Instruments: violin, piano, cello","1. Hana is younger than the violinist.","2. The pianist is the youngest.","3. Ilo is the oldest.","4. Hana is older than Jun."],"caption":"Clues"}},{"q":"Review (classification): which word does not belong: copper, iron, wood, silver?","options":["wood","copper","iron","silver"],"answer":"wood","hint":"What are three of them?","why":"Copper, iron and silver are metals; wood is not.","show":{"type":"passage","title":"","text":"Review (classification): which word does not belong: copper, iron, wood, silver?"}},{"q":"Review (analogy): thermometer : temperature :: scale : ?","options":["weight","fish","kitchen","number"],"answer":"weight","hint":"Bridge sentence: 'A thermometer measures temperature.'","why":"A scale measures weight.","show":{"type":"passage","title":"","text":"Review (analogy): thermometer : temperature :: scale : ?"}},{"q":"Review (sequences): what comes next? 1, 3, 7, 15, 31, …","type":"number","answer":63,"hint":"Look at the differences, or double each term and compare.","why":"Each term is double the previous plus 1: 31 × 2 + 1 = 63. (The differences 2, 4, 8, 16 double.)","show":{"type":"big","text":"1, 3, 7, 15, 31, ?"}},{"q":"Review (chess): White to move. Which move is checkmate?","options":["Knight to f7","Knight to e6","Knight to h3","Knight to f3"],"answer":"Knight to f7","hint":"The king has no free square at all.","why":"Nf7+ is smothered mate: the king is surrounded by its own rook and pawns, and nothing can capture the knight.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g font-size='30' text-anchor='middle' stroke='#111'><text x='277.5' y='35' fill='#111' stroke-width='0.4'>♚&#xFE0E;</text><text x='244.5' y='35' fill='#111' stroke-width='0.4'>♜&#xFE0E;</text><text x='244.5' y='68' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='277.5' y='68' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='244.5' y='134' fill='#fff' stroke-width='1.2'>♘&#xFE0E;</text><text x='46.5' y='266' fill='#fff' stroke-width='1.2'>♔&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g></svg>"}},{gen:() => (gGrid(3, 2))},{gen:() => (gGrid(3, 2))},{gen:() => (gGrid(3, 2))},{gen:() => (gGrid(3, 2))},{gen:() => (gGrid(3, 2))},{gen:() => (gGrid(3, 2))},{gen:() => (gGrid(4, 1))},{gen:() => (gGrid(4, 1))},{gen:() => (gGrid(4, 1))},{gen:() => (gOddWord())},{gen:() => (gAnalogyWord())},{gen:() => (gArith(2))},{gen:() => (gMate1("Q"))}],"challenge":[{"q":"The puzzle about Hana, Ilo and Jun contains one clue that is not needed. Which one?","options":["Hana is younger than the violinist.","The pianist is the youngest.","Ilo is the oldest.","Hana is older than Jun."],"answer":"Ilo is the oldest.","hint":"Remove each clue in turn: does exactly one solution remain?","why":"Clues 1 and 4 already force the ages: the violinist is older than Hana, who is older than Jun, so the violinist must be Ilo and the order is Ilo, Hana, Jun. 'Ilo is the oldest' therefore adds nothing. Removing any other clue allows a second solution.","show":{"type":"passage","title":"","text":"The puzzle about Hana, Ilo and Jun contains one clue that is not needed. Which one?"}},{"q":"A puzzle matches 3 people with 3 pets and 3 colors. Before any clues, how many complete solutions are possible?","type":"number","answer":36,"hint":"Count pet assignments, then color assignments.","why":"Pets can be assigned in 3 × 2 × 1 = 6 ways and colors independently in 6 ways: 6 × 6 = 36.","show":{"type":"passage","title":"","text":"A puzzle matches 3 people with 3 pets and 3 colors. Before any clues, how many complete solutions are possible?"}},{"q":"A puzzle matches 4 people with 4 drinks and 4 snacks. How many complete solutions are possible before any clues?","type":"number","answer":576,"hint":"Each category independently gives 4 × 3 × 2 × 1 arrangements.","why":"24 × 24 = 576 possibilities. A good set of clues cuts these down to exactly one.","show":{"type":"passage","title":"","text":"A puzzle matches 4 people with 4 drinks and 4 snacks. How many complete solutions are possible before any clues?"}},{gen:() => (gGrid(4, 2))},{gen:() => (gGrid(4, 2))}],"extend":"Write a three-category puzzle (3 people, 3 pets, 3 colors) with as FEW clues as you can while keeping the solution unique. Prove uniqueness by solving it step by step, writing which clue justifies each ✓. What is the smallest number of clues you managed?","offline":"Solve a three-category logic puzzle from a book with a grown-up, using a large hand-drawn grid. At the end, each of you must justify one ✓ aloud by naming the clues it came from."},
    {"title":"Precise meaning: necessary and sufficient","icon":"📖","learn":[{"say":"Clear thinking requires precise words. A good <b>definition</b> includes everything that belongs and excludes everything that does not: it is neither too broad nor too narrow.","show":{"type":"table","rows":[["Definition of 'bird'","Problem"],["an animal that flies","too broad (bats, bees) and too narrow (penguins)"],["an animal with feathers","accurate among living animals: all birds, and only birds, have feathers"]]}},{"say":"A condition is <b>necessary</b> if the thing cannot happen without it. Having four sides is necessary for being a square: no four sides, no square.","show":{"type":"big","text":"Necessary: without it, impossible.\n4 sides is necessary for a square."}},{"say":"A condition is <b>sufficient</b> if it guarantees the thing. Being a square is sufficient for being a rectangle: every square is a rectangle.","show":{"type":"big","text":"Sufficient: with it, guaranteed.\nBeing a square is sufficient\nfor being a rectangle."}},{"say":"Necessary is not the same as sufficient. Oxygen is necessary for a fire but not sufficient: you also need fuel and heat. Confusing the two is one of the most common reasoning errors.","show":{"type":"table","rows":[["Condition","Necessary for fire?","Sufficient for fire?"],["oxygen","yes","no"],["oxygen + fuel + heat","yes","yes"]]}},{"say":"Words can be <b>similar</b> without being identical. 'Big' and 'huge' differ in degree; 'look' and 'stare' differ in duration. Precise writers choose the exact word.","show":{"type":"list","items":["glance → look → stare (duration)","cool → cold → freezing (degree)","walk → stride → march (manner)"]}},{"say":"Chess: <b>protect your pieces</b>. A piece is <b>loose</b> if no friendly piece defends it. Loose pieces are targets for forks and double attacks: 'loose pieces drop off'.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g font-size='30' text-anchor='middle' stroke='#111'><text x='244.5' y='266' fill='#fff' stroke-width='1.2'>♔&#xFE0E;</text><text x='145.5' y='266' fill='#fff' stroke-width='1.2'>♕&#xFE0E;</text><text x='112.5' y='266' fill='#fff' stroke-width='1.2'>♗&#xFE0E;</text><text x='112.5' y='200' fill='#fff' stroke-width='1.2'>♘&#xFE0E;</text><text x='46.5' y='233' fill='#fff' stroke-width='1.2'>♙&#xFE0E;</text><text x='79.5' y='200' fill='#fff' stroke-width='1.2'>♙&#xFE0E;</text><text x='178.5' y='35' fill='#111' stroke-width='0.4'>♚&#xFE0E;</text><text x='79.5' y='167' fill='#111' stroke-width='0.4'>♝&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g><text x='330' y='60' font-size='22' font-weight='700' text-anchor='start' fill='#222'>The knight on c3</text><text x='330' y='96' font-size='22' font-weight='700' text-anchor='start' fill='#222'>is attacked by the</text><text x='330' y='132' font-size='22' font-weight='700' text-anchor='start' fill='#222'>bishop and has</text><text x='330' y='168' font-size='22' font-weight='700' text-anchor='start' fill='#222'>no defender.</text></svg>"}},{"say":"<b>Explain it.</b> Explain the difference between a necessary and a sufficient condition, with one example of each that is not from this lesson.","show":{"type":"passage","title":"Explain it","text":"Explain the difference between a necessary and a sufficient condition, with one example of each that is not from this lesson.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise words from this lesson."}}],"practice":[{"q":"Which definition of 'triangle' is precise?","options":["A closed shape with exactly three straight sides","A shape with corners","A pointy shape","A shape with three sides, some of which may be curved"],"answer":"A closed shape with exactly three straight sides","hint":"Which definition includes every triangle and nothing else?","why":"'A shape with corners' includes squares (too broad). 'Pointy' is vague. Curved sides are not allowed. A triangle is a closed figure with exactly three straight sides.","show":{"type":"passage","title":"","text":"Which definition of 'triangle' is precise?"}},{"q":"'A chair is something you sit on.' What is wrong with this definition?","options":["It is too broad: you can sit on a rock or the floor","It is too narrow","It is perfect","It is a preference"],"answer":"It is too broad: you can sit on a rock or the floor","hint":"Does it include things that are not chairs?","why":"The definition lets in benches, rocks and floors. It states a necessary feature of chairs, not a sufficient one.","show":{"type":"passage","title":"","text":"'A chair is something you sit on.' What is wrong with this definition?"}},{"q":"Having four sides is ___ for being a square.","options":["necessary but not sufficient","sufficient but not necessary","both necessary and sufficient","neither"],"answer":"necessary but not sufficient","hint":"Can a square lack four sides? Is every four-sided shape a square?","why":"Every square has four sides (necessary), but a rectangle or a kite also has four sides without being a square (not sufficient).","show":{"type":"passage","title":"","text":"Having four sides is ___ for being a square."}},{"q":"Being a square is ___ for being a rectangle.","options":["sufficient but not necessary","necessary but not sufficient","both necessary and sufficient","neither"],"answer":"sufficient but not necessary","hint":"Is every square a rectangle? Must every rectangle be a square?","why":"Every square is a rectangle (sufficient), but a rectangle need not be a square (not necessary).","show":{"type":"passage","title":"","text":"Being a square is ___ for being a rectangle."}},{"q":"Being divisible by 10 is ___ for being even.","options":["sufficient but not necessary","necessary but not sufficient","both","neither"],"answer":"sufficient but not necessary","hint":"Is every multiple of 10 even? Is every even number a multiple of 10?","why":"Every multiple of 10 is even (sufficient), but 4 is even and not a multiple of 10 (not necessary).","show":{"type":"passage","title":"","text":"Being divisible by 10 is ___ for being even."}},{"q":"Being an even number greater than 2 is ___ for being prime.","options":["neither necessary nor sufficient","necessary","sufficient","both"],"answer":"neither necessary nor sufficient","hint":"Can an even number above 2 be prime? Must a prime be even?","why":"No even number above 2 is prime (it is divisible by 2), so it is not sufficient; and 7 is prime without being even, so it is not necessary.","show":{"type":"passage","title":"","text":"Being an even number greater than 2 is ___ for being prime."}},{"q":"Having exactly two factors (1 and itself) is ___ for a whole number to be prime.","options":["both necessary and sufficient","necessary only","sufficient only","neither"],"answer":"both necessary and sufficient","hint":"This is the definition of a prime.","why":"A definition states a condition that is both necessary and sufficient: a number is prime exactly when it has exactly two factors.","show":{"type":"passage","title":"","text":"Having exactly two factors (1 and itself) is ___ for a whole number to be prime."}},{"q":"How are a thermometer and a ruler alike?","options":["Both are instruments that measure","Both are made of glass","Both measure length","Both are used in cooking"],"answer":"Both are instruments that measure","hint":"What is their shared purpose?","why":"Each measures a quantity (temperature, length). The others are not true of both.","show":{"type":"passage","title":"","text":"How are a thermometer and a ruler alike?"}},{"q":"What is the most important difference between a lake and a river?","options":["A river flows in a channel toward a destination; a lake is a body of standing water","Lakes are blue and rivers are brown","Rivers are always longer","Lakes have fish"],"answer":"A river flows in a channel toward a destination; a lake is a body of standing water","hint":"Look for the defining difference, not an accidental one.","why":"Color and fish are accidental features. The defining difference is flowing versus standing water.","show":{"type":"passage","title":"","text":"What is the most important difference between a lake and a river?"}},{"q":"Order from the shortest to the longest duration of looking.","type":"order","items":["stare","glance","look"],"answer":["glance","look","stare"],"hint":"Which is quickest?","why":"A glance is brief, a look is ordinary, a stare is prolonged.","show":{"type":"passage","title":"","text":"Order from the shortest to the longest duration of looking."}},{"q":"Order from least to most intense.","type":"order","items":["furious","annoyed","angry"],"answer":["annoyed","angry","furious"],"hint":"Which word is mildest?","why":"Annoyed < angry < furious.","show":{"type":"passage","title":"","text":"Order from least to most intense."}},{"q":"White to move. The knight on c3 is attacked. Which move DEFENDS it?","options":["Bishop to d2","Queen to e2","Pawn to a3","Queen to g4"],"answer":"Bishop to d2","hint":"After each move, which white piece would be able to recapture on c3?","why":"After Bd2 the bishop guards c3 along the diagonal d2–c3. a3 attacks the bishop but leaves the knight undefended; Qe2 and Qg4 do not reach c3.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g font-size='30' text-anchor='middle' stroke='#111'><text x='244.5' y='266' fill='#fff' stroke-width='1.2'>♔&#xFE0E;</text><text x='145.5' y='266' fill='#fff' stroke-width='1.2'>♕&#xFE0E;</text><text x='112.5' y='266' fill='#fff' stroke-width='1.2'>♗&#xFE0E;</text><text x='112.5' y='200' fill='#fff' stroke-width='1.2'>♘&#xFE0E;</text><text x='46.5' y='233' fill='#fff' stroke-width='1.2'>♙&#xFE0E;</text><text x='79.5' y='200' fill='#fff' stroke-width='1.2'>♙&#xFE0E;</text><text x='178.5' y='35' fill='#111' stroke-width='0.4'>♚&#xFE0E;</text><text x='79.5' y='167' fill='#111' stroke-width='0.4'>♝&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g></svg>"}},{"q":"Which white piece is LOOSE (undefended)?","options":["Knight on e4","Pawn on f2","Bishop on b2"],"answer":"Bishop on b2","hint":"For each piece, ask: which white piece could recapture there?","why":"The pawn on f2 is defended by the king on g1, and the knight on e4 by the pawn on d3. No white piece can recapture on b2, so the bishop is loose.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g font-size='30' text-anchor='middle' stroke='#111'><text x='244.5' y='266' fill='#fff' stroke-width='1.2'>♔&#xFE0E;</text><text x='178.5' y='167' fill='#fff' stroke-width='1.2'>♘&#xFE0E;</text><text x='145.5' y='200' fill='#fff' stroke-width='1.2'>♙&#xFE0E;</text><text x='79.5' y='233' fill='#fff' stroke-width='1.2'>♗&#xFE0E;</text><text x='211.5' y='233' fill='#fff' stroke-width='1.2'>♙&#xFE0E;</text><text x='244.5' y='233' fill='#fff' stroke-width='1.2'>♙&#xFE0E;</text><text x='145.5' y='134' fill='#111' stroke-width='0.4'>♛&#xFE0E;</text><text x='244.5' y='35' fill='#111' stroke-width='0.4'>♚&#xFE0E;</text><text x='277.5' y='68' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g></svg>"}},{gen:() => (gNecSuff())},{gen:() => (gNecSuff())},{gen:() => (gNecSuff())},{gen:() => (gNecSuff())},{gen:() => (gNecSuff())},{gen:() => (gNecSuff())},{gen:() => (gOddWord())},{gen:() => (gOddWord())},{gen:() => (gAnalogyWord())},{gen:() => (gAnalogyWord())},{gen:() => (gKind())},{gen:() => (gKind())},{gen:() => (gKingLegal())}],"challenge":[{"q":"A school rule says: 'If you have finished your work, you may go outside.' A student goes outside. What can be concluded?","options":["Nothing certain about whether the work is finished","The work is finished","The work is not finished"],"answer":"Nothing certain about whether the work is finished","hint":"Is finishing work stated as necessary for going outside, or only as sufficient?","why":"The rule makes finished work SUFFICIENT for permission, not NECESSARY. Other reasons (a fire drill, a teacher's request) could also send someone outside.","show":{"type":"passage","title":"","text":"A school rule says: 'If you have finished your work, you may go outside.' A student goes outside. What can be concluded?"}},{"q":"'Only students with a ticket may enter.' Is a ticket necessary or sufficient for entry?","options":["Necessary","Sufficient","Both","Neither"],"answer":"Necessary","hint":"'Only' introduces a necessary condition.","why":"'Only ticket-holders may enter' means no ticket, no entry: a ticket is necessary. It does not promise that every ticket-holder gets in (the hall could be full).","show":{"type":"passage","title":"","text":"'Only students with a ticket may enter.' Is a ticket necessary or sufficient for entry?"}},{"q":"Being divisible by 10 is sufficient for being even. How many even numbers from 1 to 50 are NOT divisible by 10?","type":"number","answer":20,"hint":"Count even numbers, then subtract multiples of 10.","why":"There are 25 even numbers from 1 to 50, of which 5 are multiples of 10. So 20 even numbers are not multiples of 10, showing that 'divisible by 10' is far from necessary.","show":{"type":"passage","title":"","text":"Being divisible by 10 is sufficient for being even. How many even numbers from 1 to 50 are NOT divisible by 10?"}},{gen:() => (gIncExc())},{gen:() => (gGrid(4, 1))}],"extend":"Look up the definitions of 'planet' before and after 2006, when the International Astronomical Union changed the definition and Pluto was reclassified as a dwarf planet. Write a paragraph: which condition was added, was it necessary or sufficient, and why did evidence (the discovery of many similar distant bodies) motivate the change?","offline":"With a grown-up, pick five everyday words (chair, game, friend, cup, tree). Write a definition for each; the grown-up tries to find a counter-example that is too broad or too narrow. Revise until no counter-example survives. Then, in a chess game, check after every move for loose pieces on both sides."},
    {"title":"Statements, truth and negation","icon":"⚖️","learn":[{"say":"Formal logic begins with the <b>statement</b> (or proposition): a sentence that is either true or false. Questions, commands and exclamations are not statements.","show":{"type":"table","rows":[["Sentence","Statement?"],["7 is a prime number.","yes (true)"],["The Moon is made of cheese.","yes (false)"],["Close the door.","no (a command)"],["Is it raining?","no (a question)"]]}},{"say":"A statement's <b>truth value</b> does not depend on who says it, how confidently, or how many agree. It depends on how things actually are. So we ask: <b>is it true, and how do we know?</b>","show":{"type":"list","items":["Observation: I can see or measure it","Reliable reference: an expert source that is checked","Reasoning: it follows from other known truths","Not evidence: popularity, confidence, wishes"],"caption":"Ways of knowing"}},{"say":"Sources differ in reliability. Prefer sources with <b>expertise</b>, <b>independence</b> and <b>accountability</b>. Ten websites copying one blog are one source, not ten.","show":{"type":"table","rows":[["Source","Reliability"],["measurement you can repeat","high"],["peer-reviewed reference work","high"],["anonymous post repeated widely","low"],["advertisement for a product","low: the seller benefits"]]}},{"say":"The <b>negation</b> of a statement is true exactly when the statement is false. The negation of 'it is raining' is 'it is not raining'. A statement and its negation can never both be true.","show":{"type":"big","text":"P: It is raining.\nnot P: It is not raining."}},{"say":"Negating 'all' and 'some' requires care. The negation of 'All cats are black' is <b>not</b> 'No cats are black'; it is 'Some cat is not black': one counter-example is enough.","show":{"type":"table","rows":[["Statement","Its negation"],["All cats are black.","Some cat is not black."],["Some apples are red.","No apples are red."],["No birds swim.","Some bird swims."]]}},{"say":"Chess: the <b>back rank</b> is the row where the king shelters behind its pawns. If a single piece guards it, removing that guard can be decisive. Here Black's rook on e8 is the only guard.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g font-size='30' text-anchor='middle' stroke='#111'><text x='244.5' y='35' fill='#111' stroke-width='0.4'>♚&#xFE0E;</text><text x='211.5' y='68' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='244.5' y='68' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='277.5' y='68' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='178.5' y='35' fill='#111' stroke-width='0.4'>♜&#xFE0E;</text><text x='178.5' y='266' fill='#fff' stroke-width='1.2'>♖&#xFE0E;</text><text x='145.5' y='266' fill='#fff' stroke-width='1.2'>♕&#xFE0E;</text><text x='244.5' y='266' fill='#fff' stroke-width='1.2'>♔&#xFE0E;</text><text x='211.5' y='233' fill='#fff' stroke-width='1.2'>♙&#xFE0E;</text><text x='244.5' y='233' fill='#fff' stroke-width='1.2'>♙&#xFE0E;</text><text x='277.5' y='233' fill='#fff' stroke-width='1.2'>♙&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g><text x='320' y='60' font-size='20' font-weight='700' text-anchor='start' fill='#222'>Black's rook is the</text><text x='320' y='94' font-size='20' font-weight='700' text-anchor='start' fill='#222'>only back-rank guard.</text><text x='320' y='128' font-size='20' font-weight='700' text-anchor='start' fill='#222'>Rxe8 is mate.</text></svg>"}},{"say":"<b>Explain it.</b> Explain why the negation of 'all cats are black' is 'some cat is not black' and not 'no cats are black'. Then describe one reliable and one unreliable way to check a claim.","show":{"type":"passage","title":"Explain it","text":"Explain why the negation of 'all cats are black' is 'some cat is not black' and not 'no cats are black'. Then describe one reliable and one unreliable way to check a claim.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise words from this lesson."}}],"practice":[{"q":"Which of these is a statement (true or false)?","options":["Paris is the capital of France.","Please sit down.","What time is it?","Hooray!"],"answer":"Paris is the capital of France.","hint":"Which sentence can be judged true or false?","why":"Only the first makes a claim. A request, a question and an exclamation are neither true nor false.","show":{"type":"passage","title":"","text":"Which of these is a statement (true or false)?"}},{"q":"How many of these are statements? (1) 2 + 2 = 5. (2) Open the window. (3) Water boils at 100 °C at sea level. (4) Is the shop open? (5) Whales are fish.","type":"number","answer":3,"hint":"A false claim is still a statement.","why":"(1), (3) and (5) are statements; (1) and (5) are false, and (3) is true. (2) is a command and (4) a question.","show":{"type":"passage","title":"","text":"How many of these are statements? (1) 2 + 2 = 5. (2) Open the window. (3) Water boils at 100 °C at sea level. (4) Is the shop open? (5) Whales are fish."}},{"q":"What is the negation of 'All cats are black'?","options":["Some cat is not black.","No cats are black.","All cats are white.","Some cats are black."],"answer":"Some cat is not black.","hint":"What would show the statement is false?","why":"One cat that is not black makes 'all cats are black' false. 'No cats are black' says far more than is needed.","show":{"type":"passage","title":"","text":"What is the negation of 'All cats are black'?"}},{"q":"What is the negation of 'Some apples are red'?","options":["No apples are red.","Some apples are not red.","All apples are red.","Apples are green."],"answer":"No apples are red.","hint":"When exactly is 'some apples are red' false?","why":"'Some apples are red' is false only if there is not a single red apple: no apples are red.","show":{"type":"passage","title":"","text":"What is the negation of 'Some apples are red'?"}},{"q":"What is the negation of 'No birds can swim'?","options":["Some bird can swim.","All birds can swim.","No birds can fly.","Some birds cannot swim."],"answer":"Some bird can swim.","hint":"One swimming bird would refute it.","why":"One swimming bird (a penguin, a duck) is enough to make 'no birds can swim' false.","show":{"type":"passage","title":"","text":"What is the negation of 'No birds can swim'?"}},{"q":"'It is not the case that the door is not locked.' What does this mean?","options":["The door is locked.","The door is unlocked.","We cannot tell.","The door is open."],"answer":"The door is locked.","hint":"Two negations: what happens when you cancel them?","why":"'Not (not locked)' means locked. A double negation returns the original statement.","show":{"type":"passage","title":"","text":"'It is not the case that the door is not locked.' What does this mean?"}},{"q":"What is the negation of 'x is greater than 5'?","options":["x is less than or equal to 5","x is less than 5","x is 5","x is greater than 6"],"answer":"x is less than or equal to 5","hint":"Is 5 itself greater than 5?","why":"If x is not greater than 5, it could be less than 5 OR equal to 5.","show":{"type":"passage","title":"","text":"What is the negation of 'x is greater than 5'?"}},{"q":"What is the best evidence that the Earth is round, available to the ancient Greeks?","options":["The Earth's shadow on the Moon during a lunar eclipse is always curved","A famous teacher said so","Most people believed it","It looks round on maps"],"answer":"The Earth's shadow on the Moon during a lunar eclipse is always curved","hint":"Which option is an observation anyone could repeat?","why":"Aristotle pointed out that the Earth's shadow on the Moon is always round, which only a sphere produces from every angle. The other options are authority, popularity or a drawing.","show":{"type":"passage","title":"","text":"What is the best evidence that the Earth is round, available to the ancient Greeks?"}},{"q":"Twelve websites state the same surprising claim, and all of them link to one anonymous blog post. How many independent sources support the claim?","options":["One","Twelve","Thirteen","None at all"],"answer":"One","hint":"Did the websites check the claim independently?","why":"They all copy the same post, so there is effectively one source, and an anonymous one at that. Repetition is not confirmation.","show":{"type":"passage","title":"","text":"Twelve websites state the same surprising claim, and all of them link to one anonymous blog post. How many independent sources support the claim?"}},{"q":"Which source is most reliable for the boiling point of water at sea level?","options":["A chemistry reference book, confirmed by your own measurement","A television advertisement","A guess by a friend","A cartoon"],"answer":"A chemistry reference book, confirmed by your own measurement","hint":"Which source has expertise and can be checked?","why":"A reference work written by experts, confirmed by a repeatable measurement, is the strongest evidence.","show":{"type":"passage","title":"","text":"Which source is most reliable for the boiling point of water at sea level?"}},{"q":"A claim is unpopular, and you dislike it, but careful measurements repeatedly confirm it. What should a logical thinker conclude?","options":["Accept it as true on the evidence","Reject it because it is unpopular","Reject it because I dislike it","Ignore it"],"answer":"Accept it as true on the evidence","hint":"Do popularity or feelings change what is true?","why":"Truth depends on the evidence, not on popularity or preference. Changing your mind in response to good evidence is a mark of clear thinking.","show":{"type":"passage","title":"","text":"A claim is unpopular, and you dislike it, but careful measurements repeatedly confirm it. What should a logical thinker conclude?"}},{"q":"White to move. Which move is checkmate?","options":["Rook takes e8","Queen to d8","Rook to e7","Queen to d7"],"answer":"Rook takes e8","hint":"Which black piece guards the back rank? Can it be removed with check?","why":"Rxe8+ removes the only guard with check. f8 and h8 lie on the rook's rank, f7, g7 and h7 hold the king's own pawns, and no black piece can recapture on e8: checkmate.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g font-size='30' text-anchor='middle' stroke='#111'><text x='244.5' y='35' fill='#111' stroke-width='0.4'>♚&#xFE0E;</text><text x='211.5' y='68' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='244.5' y='68' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='277.5' y='68' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='178.5' y='35' fill='#111' stroke-width='0.4'>♜&#xFE0E;</text><text x='178.5' y='266' fill='#fff' stroke-width='1.2'>♖&#xFE0E;</text><text x='145.5' y='266' fill='#fff' stroke-width='1.2'>♕&#xFE0E;</text><text x='244.5' y='266' fill='#fff' stroke-width='1.2'>♔&#xFE0E;</text><text x='211.5' y='233' fill='#fff' stroke-width='1.2'>♙&#xFE0E;</text><text x='244.5' y='233' fill='#fff' stroke-width='1.2'>♙&#xFE0E;</text><text x='277.5' y='233' fill='#fff' stroke-width='1.2'>♙&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g></svg>"}},{"q":"White plays Rook to c8, giving check. Why is it NOT checkmate?","options":["The black rook can capture it, and the king can also go to g7","The king can go to f8","The rook is pinned","It is checkmate"],"answer":"The black rook can capture it, and the king can also go to g7","hint":"List Black's replies: captures, blocks, king moves.","why":"Rxc8 is available, and the pawn move to g6 earlier gave the king a flight square (called 'luft', breathing room) on g7.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g font-size='30' text-anchor='middle' stroke='#111'><text x='244.5' y='35' fill='#111' stroke-width='0.4'>♚&#xFE0E;</text><text x='211.5' y='68' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='244.5' y='101' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='277.5' y='68' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='112.5' y='266' fill='#fff' stroke-width='1.2'>♖&#xFE0E;</text><text x='244.5' y='266' fill='#fff' stroke-width='1.2'>♔&#xFE0E;</text><text x='46.5' y='35' fill='#111' stroke-width='0.4'>♜&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g></svg>"}},{gen:() => (gNegate())},{gen:() => (gNegate())},{gen:() => (gNegate())},{gen:() => (gNegate())},{gen:() => (gNegate())},{gen:() => (gKind())},{gen:() => (gKind())},{gen:() => (gKind())},{gen:() => (gKind())},{gen:() => (gMate1("R"))},{gen:() => (gMate1("R"))},{gen:() => (gNecSuff())},{gen:() => (gNecSuff())}],"challenge":[{"q":"Statement 1: 'Exactly one of these two statements is false.' Statement 2: 'Exactly two of these statements are false.' Which statements are true?","options":["Only statement 1","Only statement 2","Both","Neither"],"answer":"Only statement 1","hint":"Test each of the four possibilities for consistency.","why":"If statement 2 were true, both would be false, including statement 2: a contradiction. So statement 2 is false. If statement 1 were also false, both would be false and statement 2 would be true: contradiction. So statement 1 is true, and indeed exactly one statement (2) is false.","show":{"type":"passage","title":"","text":"Statement 1: 'Exactly one of these two statements is false.' Statement 2: 'Exactly two of these statements are false.' Which statements are true?"}},{"q":"What is the negation of 'Every student read at least one book'?","options":["Some student read no book.","No student read any book.","Every student read no book.","Some student read a book."],"answer":"Some student read no book.","hint":"Negate 'every' first, then negate 'at least one'.","why":"The negation of 'every student did X' is 'some student did not do X'; 'did not read at least one book' means 'read no book'.","show":{"type":"passage","title":"","text":"What is the negation of 'Every student read at least one book'?"}},{"q":"White to move. How many different moves give immediate checkmate?","type":"number","answer":2,"hint":"Which white pieces can capture the rook on d8?","why":"The rook (along the d-file) and the queen (along the diagonal a5–b6–c7–d8) can each capture on d8 with check. Either way the king is walled in by its own pawns and nothing can recapture: 2 mating moves.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g font-size='30' text-anchor='middle' stroke='#111'><text x='244.5' y='35' fill='#111' stroke-width='0.4'>♚&#xFE0E;</text><text x='211.5' y='68' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='244.5' y='68' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='277.5' y='68' fill='#111' stroke-width='0.4'>♟&#xFE0E;</text><text x='145.5' y='35' fill='#111' stroke-width='0.4'>♜&#xFE0E;</text><text x='145.5' y='266' fill='#fff' stroke-width='1.2'>♖&#xFE0E;</text><text x='46.5' y='134' fill='#fff' stroke-width='1.2'>♕&#xFE0E;</text><text x='244.5' y='266' fill='#fff' stroke-width='1.2'>♔&#xFE0E;</text><text x='211.5' y='233' fill='#fff' stroke-width='1.2'>♙&#xFE0E;</text><text x='244.5' y='233' fill='#fff' stroke-width='1.2'>♙&#xFE0E;</text><text x='277.5' y='233' fill='#fff' stroke-width='1.2'>♙&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g></svg>"}},{"q":"'This sentence is false.' Is this a statement in the logical sense?","options":["No: it cannot consistently be either true or false","Yes, and it is true","Yes, and it is false","Yes, because it is a sentence"],"answer":"No: it cannot consistently be either true or false","hint":"Suppose it is true. Then what does it say? Suppose it is false…","why":"If it is true, then what it says holds, so it is false; if it is false, then what it says fails, so it is true. This is the Liar Paradox, known since ancient Greece; it shows that some grammatical sentences are not statements.","show":{"type":"passage","title":"","text":"'This sentence is false.' Is this a statement in the logical sense?"}},{gen:() => (gNegate())},{gen:() => (gMate1("Q"))}],"extend":"Read about Eratosthenes, who around 240 BC estimated the Earth's circumference using shadows in two Egyptian cities. Write a paragraph identifying his evidence (the observations), his reasoning (the geometry), and why his conclusion deserved belief even without modern instruments.","offline":"Play 'Fact check' with a grown-up: each of you writes five statements (some true, some false) about animals or places. Swap lists; for each, say how you would check it and which source would be reliable, then check two of them together. Also set up the back-rank positions and play them out."},
    {"title":"If–then: conditionals","icon":"➡️","learn":[{"say":"A <b>conditional</b> statement has the form 'If P, then Q'. P is the <b>hypothesis</b> (or condition) and Q is the <b>conclusion</b>. It promises: whenever P is true, Q is true.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><g font-size='22' font-weight='700' text-anchor='middle'><rect x='30' y='120' width='200' height='70' rx='12' fill='#eef5fb' stroke='#2e86ab' stroke-width='3'/><text x='130' y='150'>IF it rains</text><text x='130' y='176' font-size='18' fill='#555'>hypothesis</text><rect x='370' y='120' width='200' height='70' rx='12' fill='#e6f4ec' stroke='#2f9e5f' stroke-width='3'/><text x='470' y='150'>THEN the</text><text x='470' y='176'>grass is wet</text></g><line x1='235' y1='155' x2='360' y2='155' stroke='#333' stroke-width='5'/><polygon points='365,155 345,143 345,167' fill='#333'/><text x='300' y='240' font-size='20' font-weight='700' text-anchor='middle' fill='#555'>conclusion follows the hypothesis</text></svg>"}},{"say":"A conditional is only broken in one situation: P is true and Q is false. If it does not rain, the promise says nothing, so the grass may be wet or dry.","show":{"type":"table","rows":[["P (rains)","Q (grass wet)","Is 'if P then Q' kept?"],["true","true","kept"],["true","false","BROKEN"],["false","true","kept (sprinkler?)"],["false","false","kept"]]}},{"say":"Three related statements. The <b>converse</b> swaps: if Q then P. The <b>inverse</b> negates both: if not P then not Q. The <b>contrapositive</b> swaps and negates: if not Q then not P.","show":{"type":"table","rows":[["Name","Form","Example"],["original","if P then Q","if it rains, the grass is wet"],["converse","if Q then P","if the grass is wet, it rained"],["inverse","if not P then not Q","if it does not rain, the grass is dry"],["contrapositive","if not Q then not P","if the grass is dry, it did not rain"]]}},{"say":"The key fact: the <b>contrapositive is equivalent</b> to the original (they are true or false together). The converse and inverse are <b>not</b>: a true conditional may have a false converse.","show":{"type":"big","text":"original ≡ contrapositive\nconverse ≡ inverse\n(but original ≢ converse)"}},{"say":"Conditionals <b>chain</b>: if P then Q, and if Q then R, give if P then R. This is called a hypothetical syllogism (a chain argument).","show":{"type":"big","text":"If it snows, school closes.\nIf school closes, we bake.\n∴ If it snows, we bake."}},{"say":"Truth matters as much as form. 'If an animal is a bird, it can fly' is a FALSE conditional (penguins), so conclusions drawn from it are untrustworthy even when the reasoning pattern is correct.","show":{"type":"big","text":"Correct form + false premise\n= conclusion not established"}},{"say":"Chess as conditional reasoning: 'If I play this move, then my opponent can…'. Every candidate move is a hypothesis; you must check the consequences. Mate in one review: list every check, then test each.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g font-size='30' text-anchor='middle' stroke='#111'><text x='178.5' y='35' fill='#111' stroke-width='0.4'>♚&#xFE0E;</text><text x='178.5' y='101' fill='#fff' stroke-width='1.2'>♔&#xFE0E;</text><text x='112.5' y='233' fill='#fff' stroke-width='1.2'>♕&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g><text x='320' y='60' font-size='22' font-weight='700' text-anchor='start' fill='#222'>If the queen checks</text><text x='320' y='96' font-size='22' font-weight='700' text-anchor='start' fill='#222'>on the 8th rank,</text><text x='320' y='132' font-size='22' font-weight='700' text-anchor='start' fill='#222'>can the king escape?</text></svg>"}},{"say":"<b>Explain it.</b> State the converse, inverse and contrapositive of 'If a number is a multiple of 4, then it is even'. Say which of them are true, and explain why the contrapositive must agree with the original.","show":{"type":"passage","title":"Explain it","text":"State the converse, inverse and contrapositive of 'If a number is a multiple of 4, then it is even'. Say which of them are true, and explain why the contrapositive must agree with the original.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise words from this lesson."}}],"practice":[{"q":"In 'If a shape is a square, then it has four sides', what is the hypothesis?","options":["a shape is a square","it has four sides","if","four"],"answer":"a shape is a square","hint":"The hypothesis follows 'if'.","why":"The hypothesis is the part after 'if': 'a shape is a square'. The conclusion is 'it has four sides'.","show":{"type":"passage","title":"","text":"In 'If a shape is a square, then it has four sides', what is the hypothesis?"}},{"q":"What is the CONVERSE of 'If a shape is a square, then it has four sides'?","options":["If a shape has four sides, then it is a square.","If a shape is not a square, then it does not have four sides.","If a shape does not have four sides, then it is not a square.","A square has four sides."],"answer":"If a shape has four sides, then it is a square.","hint":"Swap hypothesis and conclusion.","why":"The converse swaps the two parts. Note it is false: a rectangle has four sides but need not be a square.","show":{"type":"passage","title":"","text":"What is the CONVERSE of 'If a shape is a square, then it has four sides'?"}},{"q":"What is the CONTRAPOSITIVE of 'If a shape is a square, then it has four sides'?","options":["If a shape does not have four sides, then it is not a square.","If a shape has four sides, then it is a square.","If a shape is not a square, then it does not have four sides.","Squares have sides."],"answer":"If a shape does not have four sides, then it is not a square.","hint":"Swap AND negate both parts.","why":"The contrapositive is 'if not Q then not P'. It is true, like the original.","show":{"type":"passage","title":"","text":"What is the CONTRAPOSITIVE of 'If a shape is a square, then it has four sides'?"}},{"q":"Which of these is the INVERSE of 'If it is a dog, then it is a mammal'?","options":["If it is not a dog, then it is not a mammal.","If it is a mammal, then it is a dog.","If it is not a mammal, then it is not a dog.","If it is a dog, then it is not a mammal."],"answer":"If it is not a dog, then it is not a mammal.","hint":"Negate both parts without swapping.","why":"The inverse negates both parts. It is false: a cat is not a dog but is a mammal.","show":{"type":"passage","title":"","text":"Which of these is the INVERSE of 'If it is a dog, then it is a mammal'?"}},{"q":"'If it rains, the match is canceled.' The match was canceled. Can we conclude that it rained?","options":["No","Yes"],"answer":"No","hint":"Could anything else cause a cancellation?","why":"The match could have been canceled for another reason (illness, a broken pitch). Reasoning from Q back to P is the error called affirming the consequent.","show":{"type":"passage","title":"","text":"'If it rains, the match is canceled.' The match was canceled. Can we conclude that it rained?"}},{"q":"'If it rains, the match is canceled.' The match was NOT canceled. What follows?","options":["It did not rain","It rained","Nothing follows"],"answer":"It did not rain","hint":"Use the contrapositive.","why":"The contrapositive is 'if the match is not canceled, it did not rain'. Since the original is given as true, so is the contrapositive. This valid pattern is called modus tollens.","show":{"type":"passage","title":"","text":"'If it rains, the match is canceled.' The match was NOT canceled. What follows?"}},{"q":"'If it rains, the match is canceled.' It did NOT rain. What follows?","options":["Nothing certain about the match","The match went ahead","The match was canceled"],"answer":"Nothing certain about the match","hint":"Does the rule say anything about dry days?","why":"The conditional says nothing about what happens without rain; the match might still be canceled for another reason. Concluding 'it went ahead' is the error called denying the antecedent.","show":{"type":"passage","title":"","text":"'If it rains, the match is canceled.' It did NOT rain. What follows?"}},{"q":"When is 'If you score a goal, you get a medal' broken (shown false)?","options":["You score a goal and get no medal","You score no goal and get a medal","You score no goal and get no medal","You score a goal and get a medal"],"answer":"You score a goal and get no medal","hint":"Which case breaks the promise?","why":"Only P true with Q false breaks a conditional. Getting a medal without scoring does not contradict the promise.","show":{"type":"passage","title":"","text":"When is 'If you score a goal, you get a medal' broken (shown false)?"}},{"q":"'If a number ends in 0, it is divisible by 5.' Which statement is equivalent to it?","options":["If a number is not divisible by 5, it does not end in 0.","If a number is divisible by 5, it ends in 0.","If a number does not end in 0, it is not divisible by 5.","All numbers divisible by 5 end in 0."],"answer":"If a number is not divisible by 5, it does not end in 0.","hint":"Which form is always equivalent to the original?","why":"The contrapositive is equivalent. The converse is false: 15 is divisible by 5 but ends in 5.","show":{"type":"passage","title":"","text":"'If a number ends in 0, it is divisible by 5.' Which statement is equivalent to it?"}},{"q":"Given: if A then B; if B then C; if C then D. A is true. What can be concluded?","options":["D is true","D is false","Only B is true","Nothing"],"answer":"D is true","hint":"Follow the chain.","why":"A gives B, B gives C, C gives D: a chain of conditionals.","show":{"type":"passage","title":"","text":"Given: if A then B; if B then C; if C then D. A is true. What can be concluded?"}},{"q":"Given: if A then B; if B then C. C is FALSE. What can be concluded about A?","options":["A is false","A is true","Nothing"],"answer":"A is false","hint":"Chain the conditionals, then take the contrapositive.","why":"If A then C (by chaining). Its contrapositive: if not C then not A. C is false, so A is false.","show":{"type":"passage","title":"","text":"Given: if A then B; if B then C. C is FALSE. What can be concluded about A?"}},{"q":"'If an animal is a bird, then it can fly.' Is this conditional true?","options":["No: a penguin is a bird that cannot fly","Yes: most birds fly","Yes: birds have wings"],"answer":"No: a penguin is a bird that cannot fly","hint":"Can you find a case where the hypothesis is true and the conclusion false?","why":"A penguin makes the hypothesis true and the conclusion false, so the conditional is false. A rule that is 'usually' true is not true as a universal conditional.","show":{"type":"passage","title":"","text":"'If an animal is a bird, then it can fly.' Is this conditional true?"}},{"q":"White to move. Which move is checkmate?","options":["Queen to c8","Queen to e2","Queen to c7","Queen to h7"],"answer":"Queen to c8","hint":"The white king covers the 7th-rank squares. Which check covers d8 and f8?","why":"Qc8+ checks along the eighth rank, covering d8 and f8, while the king on e6 covers d7, e7 and f7. The queen cannot be captured: checkmate.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g font-size='30' text-anchor='middle' stroke='#111'><text x='178.5' y='35' fill='#111' stroke-width='0.4'>♚&#xFE0E;</text><text x='178.5' y='101' fill='#fff' stroke-width='1.2'>♔&#xFE0E;</text><text x='112.5' y='233' fill='#fff' stroke-width='1.2'>♕&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g></svg>"}},{"q":"White to move. Which move is checkmate?","options":["Queen to a4","Queen to f8","Queen to b4","Queen to f7"],"answer":"Queen to a4","hint":"The black king on a8 can use a7, b7 and b8. Which of these does the white king already cover?","why":"The white king on c7 covers b7 and b8. Qa4+ checks along the a-file and also covers a7, so the king has no square: checkmate. Qf8+ fails because the king escapes to a7, and Qb4 is not even check.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g font-size='30' text-anchor='middle' stroke='#111'><text x='46.5' y='35' fill='#111' stroke-width='0.4'>♚&#xFE0E;</text><text x='112.5' y='68' fill='#fff' stroke-width='1.2'>♔&#xFE0E;</text><text x='211.5' y='167' fill='#fff' stroke-width='1.2'>♕&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g></svg>"}},{gen:() => (gCondForm())},{gen:() => (gCondForm())},{gen:() => (gCondForm())},{gen:() => (gCondForm())},{gen:() => (gCondForm())},{gen:() => (gCondInfer())},{gen:() => (gCondInfer())},{gen:() => (gCondInfer())},{gen:() => (gCondInfer())},{gen:() => (gCondInfer())},{gen:() => (gMate1("Q"))},{gen:() => (gMate1("Q"))},{gen:() => (gNegate())},{gen:() => (gNegate())}],"challenge":[{"q":"Four cards show: A, K, 4, 7. Each card has a letter on one side and a number on the other. Rule: 'If a card has a vowel on one side, then it has an even number on the other.' Which cards MUST you turn over to test the rule?","options":["A and 7","A and 4","A only","A, 4 and 7"],"answer":"A and 7","hint":"Which cards could reveal 'vowel with odd number'?","why":"The A could have an odd number behind it, and
