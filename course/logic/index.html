h the first row fixed as 1 2 3 4 there are 12 completions; there are 24 possible first rows, so 24 × 12 = 288 grids.","show":{"type":"passage","title":"","text":"How many different completed 4×4 Sudoku grids exist? (Hint: the answer is a famous small number; fix the first row as 1 2 3 4 and count, then multiply by the 24 possible first rows.)"}},{gen:() => (gSudoku(6))},{gen:() => (gSudoku(6))}],"extend":"Solve a 9×9 Sudoku from a newspaper or puzzle book using only deduction, writing small 'candidate' digits in the corners of cells. Afterwards, write down one moment where you used a hidden single and one where you used a pair of candidates to eliminate others.","offline":"Make your own 4×4 Sudoku: fill a complete valid grid, then erase cells one at a time, each time checking that the puzzle still has only one solution. How few clues can you leave? Give it to a grown-up to solve."},
    {"title":"Parity and invariants","icon":"⚫","learn":[{"say":"<b>Parity</b> means whether a whole number is even or odd. Parity follows simple rules, and these rules can settle questions that look impossibly large.","show":{"type":"table","rows":[["","even","odd"],["even +","even","odd"],["odd +","odd","even"],["even ×","even","even"],["odd ×","even","odd"]]}},{"say":"An <b>invariant</b> is a quantity that never changes, whatever moves are made. If the start and the goal differ in an invariant, the goal is impossible: a proof of impossibility.","show":{"type":"big","text":"invariant at start ≠ invariant at goal\n⇒ impossible"}},{"say":"Example: remove two opposite corners from a chessboard (both dark). Can 31 dominoes cover the remaining 62 squares? Every domino covers one light and one dark square, but now there are 32 light and 30 dark squares. <b>Impossible.</b>","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g opacity='0.85'><circle cx='46.5' cy='255.5' r='9' fill='#e4572e'/><circle cx='277.5' cy='24.5' r='9' fill='#e4572e'/></g><g font-size='30' text-anchor='middle' stroke='#111'></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g><text x='320' y='50' font-size='20' font-weight='700' text-anchor='start' fill='#222'>a1 and h8 removed:</text><text x='320' y='84' font-size='20' font-weight='700' text-anchor='start' fill='#222'>32 light squares,</text><text x='320' y='118' font-size='20' font-weight='700' text-anchor='start' fill='#222'>30 dark squares.</text><text x='320' y='152' font-size='20' font-weight='700' text-anchor='start' fill='#222'>31 dominoes need</text><text x='320' y='186' font-size='20' font-weight='700' text-anchor='start' fill='#222'>31 of each.</text></svg>"}},{"say":"Knights again: every knight move changes square color, so after an odd number of moves a knight is on the opposite color. Color parity is an invariant of pairs of moves.","show":{"type":"big","text":"odd number of moves → color changes\neven number of moves → same color"}},{"say":"The <b>handshake lemma</b>: add up how many hands each person shook; every handshake is counted twice, so the total is even. Therefore the number of people who shook an odd number of hands is even.","show":{"type":"big","text":"sum of handshakes = 2 × (number of handshakes)"}},{"say":"<b>Explain it.</b> Explain why the corner-cut chessboard cannot be covered by 31 dominoes, and describe in your own words what an invariant is.","show":{"type":"passage","title":"Explain it","text":"Explain why the corner-cut chessboard cannot be covered by 31 dominoes, and describe in your own words what an invariant is.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise words from this lesson."}}],"practice":[{"q":"Without adding, is 37 + 48 + 91 + 12 odd or even?","options":["Even","Odd"],"answer":"Even","hint":"Count the odd numbers.","why":"There are two odd numbers (37 and 91); two odds make an even, and evens do not change parity. The sum is even (it is 188).","show":{"type":"passage","title":"","text":"Without adding, is 37 + 48 + 91 + 12 odd or even?"}},{"q":"Is 13 × 27 × 45 odd or even?","options":["Odd","Even"],"answer":"Odd","hint":"A product is even if any factor is even.","why":"All three factors are odd, so the product is odd.","show":{"type":"passage","title":"","text":"Is 13 × 27 × 45 odd or even?"}},{"q":"Is the sum 1 + 2 + 3 + … + 10 odd or even?","options":["Odd","Even"],"answer":"Odd","hint":"How many odd numbers are there from 1 to 10?","why":"There are five odd numbers; an odd count of odd numbers gives an odd sum (the sum is 55).","show":{"type":"passage","title":"","text":"Is the sum 1 + 2 + 3 + … + 10 odd or even?"}},{"q":"Can the numbers 1 to 10 be split into two groups with equal sums?","options":["No","Yes"],"answer":"No","hint":"What would the total have to be?","why":"Two equal groups would make the total even, but 1 + … + 10 = 55 is odd. Impossible.","show":{"type":"passage","title":"","text":"Can the numbers 1 to 10 be split into two groups with equal sums?"}},{"q":"Can 31 dominoes cover a chessboard with two opposite corners removed?","options":["No","Yes"],"answer":"No","hint":"Count light and dark squares.","why":"Opposite corners have the same color, leaving 32 of one color and 30 of the other; 31 dominoes always cover 31 of each. Impossible.","show":{"type":"passage","title":"","text":"Can 31 dominoes cover a chessboard with two opposite corners removed?"}},{"q":"Can a 5×5 board be completely covered by dominoes (each covering 2 squares)?","options":["No","Yes"],"answer":"No","hint":"How many squares are there?","why":"25 squares is odd, and dominoes always cover an even number of squares.","show":{"type":"passage","title":"","text":"Can a 5×5 board be completely covered by dominoes (each covering 2 squares)?"}},{"q":"A knight starts on a dark square and makes 7 moves. What color is it on now?","options":["Light","Dark","It depends"],"answer":"Light","hint":"Each move changes the color.","why":"7 is odd, so the color has changed: light.","show":{"type":"passage","title":"","text":"A knight starts on a dark square and makes 7 moves. What color is it on now?"}},{"q":"A knight on a1 must reach h8. What is the fewest number of moves?","type":"number","answer":6,"hint":"Both squares are dark: must the number of moves be odd or even?","why":"The number of moves must be even (same color), at least 5 by distance, so at least 6; and 6 suffice.","show":{"type":"passage","title":"","text":"A knight on a1 must reach h8. What is the fewest number of moves?"}},{"q":"Seven coins lie on a table: 3 heads up, 4 tails up. A move turns over exactly TWO coins. Can you make all seven show tails?","options":["No","Yes"],"answer":"No","hint":"How does one move change the number of heads: by −2, 0 or +2?","why":"Each move changes the number of heads by −2, 0 or +2, so its parity never changes. It starts odd (3) and 0 is even. Impossible.","show":{"type":"passage","title":"","text":"Seven coins lie on a table: 3 heads up, 4 tails up. A move turns over exactly TWO coins. Can you make all seven show tails?"}},{"q":"At a party, could exactly three people have shaken hands an odd number of times?","options":["No","Yes"],"answer":"No","hint":"Use the handshake lemma.","why":"The number of people with an odd number of handshakes must be even. Three is odd, so it is impossible.","show":{"type":"passage","title":"","text":"At a party, could exactly three people have shaken hands an odd number of times?"}},{"q":"Can you pay exactly 25p using exactly 10 coins, if every coin is 1p, 5p or 25p?","options":["No","Yes"],"answer":"No","hint":"All these coin values are odd. What is the parity of the sum of 10 odd numbers?","why":"Ten odd numbers add to an even number, but 25 is odd. Impossible.","show":{"type":"passage","title":"","text":"Can you pay exactly 25p using exactly 10 coins, if every coin is 1p, 5p or 25p?"}},{"q":"A frog starts at 0 on a number line and makes 15 hops, each 1 or 3 steps left or right. Can it end at 0?","options":["No","Yes"],"answer":"No","hint":"Every hop is an odd length. What is the parity after 15 hops?","why":"Each hop changes the position's parity, so after 15 (odd) hops the position is odd. 0 is even: impossible.","show":{"type":"passage","title":"","text":"A frog starts at 0 on a number line and makes 15 hops, each 1 or 3 steps left or right. Can it end at 0?"}},{gen:() => (gParity())},{gen:() => (gParity())},{gen:() => (gParity())},{gen:() => (gParity())},{gen:() => (gParity())},{gen:() => (gPieceDist("N"))},{gen:() => (gPieceDist("N"))},{gen:() => (gPieceDist("N"))},{gen:() => (gHands())},{gen:() => (gHands())},{gen:() => (gBishopReach())},{gen:() => (gBishopReach())},{gen:() => (gSubsets())}],"challenge":[{"q":"The numbers 1, 2, 3, …, 9 are written on a board. Repeatedly erase any two numbers and write their difference. When one number remains, can it be 0?","options":["No","Yes"],"answer":"No","hint":"How does replacing a and b by their difference change the parity of the total?","why":"Replacing a and b with a − b changes the total by 2b, an even amount, so the total's parity is invariant. 1 + … + 9 = 45 is odd, so the final number is odd and cannot be 0.","show":{"type":"passage","title":"","text":"The numbers 1, 2, 3, …, 9 are written on a board. Repeatedly erase any two numbers and write their difference. When one number remains, can it be 0?"}},{"q":"A chessboard has one light and one dark square removed (anywhere). Can the rest always be covered by 31 dominoes?","options":["Yes","No"],"answer":"Yes","hint":"The color count now balances. Is balance enough on a chessboard?","why":"Yes: a theorem of Ralph Gomory shows that removing any light and any dark square always leaves a board that can be tiled. Here the parity argument gives no obstacle, and a clever construction (a closed path through all squares) finishes the proof.","show":{"type":"passage","title":"","text":"A chessboard has one light and one dark square removed (anywhere). Can the rest always be covered by 31 dominoes?"},"keepOrder":true},{"q":"In a group of 9 people, can everyone shake hands with exactly 3 others?","options":["Yes","No"],"answer":"No","hint":"Compute the total number of handshake-ends.","why":"9 × 3 = 27 hand-ends would have to equal twice the number of handshakes, but 27 is odd. Impossible.","show":{"type":"passage","title":"","text":"In a group of 9 people, can everyone shake hands with exactly 3 others?"},"keepOrder":true},{gen:() => (gPieceDist("N"))},{gen:() => (gParity())}],"extend":"Read about the 'Fifteen Puzzle' craze of 1880 and why half of all starting positions are unsolvable (a parity invariant). Then write a one-page explanation, with a small example, of how an invariant proves that something can NEVER happen, however long you try.","offline":"Draw an 8×8 grid, shade it like a chessboard, cross out two opposite corners and try to cover it with 31 paper dominoes. When you get stuck, count the light and dark squares that remain uncovered, and explain the proof to a grown-up."},
    {"title":"Review: valid, sound, and fallacies","icon":"🚩","learn":[{"say":"An <b>argument</b> gives premises (reasons) for a conclusion. Two separate questions decide whether it succeeds: does the conclusion <b>follow</b> from the premises, and are the premises <b>true</b>?","show":{"type":"table","rows":[["Question","Name"],["If the premises were true, would the conclusion have to be true?","validity (a matter of form)"],["Are the premises actually true?","truth (a matter of evidence)"],["Both?","soundness"]]}},{"say":"A <b>valid</b> argument can still have a false premise: 'All metals are magnetic; copper is a metal; so copper is magnetic.' The form is perfect, but the first premise is false, so the argument is <b>not sound</b> and proves nothing.","show":{"type":"big","text":"valid + true premises = SOUND\nvalid + a false premise = not sound"}},{"say":"Four forms to know by name. Two are valid; two are common fallacies (errors of reasoning) that only look valid.","show":{"type":"table","rows":[["Form","Pattern","Verdict"],["modus ponens","If P then Q; P; so Q","valid"],["modus tollens","If P then Q; not Q; so not P","valid"],["affirming the consequent","If P then Q; Q; so P","fallacy"],["denying the antecedent","If P then Q; not P; so not Q","fallacy"]]}},{"say":"Some fallacies replace evidence with pressure. <b>Bandwagon</b> ('everyone does it') appeals to popularity. <b>False appeal to authority</b> rests on who speaks (someone powerful, famous, or outside their field) rather than on evidence. Popularity and status are not reasons for truth.","show":{"type":"list","items":["Bandwagon: 'Everyone has one, so it must be good.'","False appeal to authority: 'A famous footballer says this toothpaste is best.'","Ad hominem: attacking the person, not the argument","Straw man: distorting the other view to defeat it","False dilemma: offering only two options when more exist","Slippery slope: an unsupported chain of dire consequences","Hasty generalization: a conclusion from too few cases","Circular reasoning: assuming what is to be proved"],"caption":"Common fallacies"}},{"say":"A genuine expert can be good evidence, because experts usually have reasons. The fallacy is to accept a claim <b>only</b> because of who said it, or from an 'authority' outside their field. Ask for the evidence the expert relies on.","show":{"type":"big","text":"Good: 'Geologists measured this,\nand here is the data.'\nFallacy: 'He's in charge, so it's true.'"}},{"say":"The aim is not to win arguments but to find the truth. Change your mind when <b>true premises and valid reasoning</b> support the other view, not because an argument merely sounds persuasive, confident or popular.","show":{"type":"big","text":"Is it true? How do we know?\nDoes the conclusion follow?"}},{"say":"<b>Explain it.</b> Explain the difference between a valid argument and a sound one, using an example of a valid argument with a false premise. Then explain why 'everyone does it' is not a good reason.","show":{"type":"passage","title":"Explain it","text":"Explain the difference between a valid argument and a sound one, using an example of a valid argument with a false premise. Then explain why 'everyone does it' is not a good reason.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise words from this lesson."}}],"practice":[{"q":"'All birds can fly. Penguins are birds. So penguins can fly.' Evaluate it.","options":["Valid but not sound","Valid and sound","Invalid"],"answer":"Valid but not sound","hint":"Would the conclusion follow IF the premises were true? Are they true?","why":"The form is valid, but the premise 'all birds can fly' is false, so the argument is unsound.","show":{"type":"passage","title":"","text":"'All birds can fly. Penguins are birds. So penguins can fly.' Evaluate it."}},{"q":"'If it is raining, the street is wet. The street is wet. So it is raining.' Which form is this?","options":["Affirming the consequent (fallacy)","Modus ponens (valid)","Modus tollens (valid)","Denying the antecedent (fallacy)"],"answer":"Affirming the consequent (fallacy)","hint":"Is the fact about the IF part or the THEN part?","why":"It reasons from the consequent back to the antecedent. A street-cleaning truck also makes the street wet.","show":{"type":"passage","title":"","text":"'If it is raining, the street is wet. The street is wet. So it is raining.' Which form is this?"}},{"q":"'If a shape is a square, it has four sides. This shape does not have four sides. So it is not a square.' Which form?","options":["Modus tollens (valid)","Modus ponens (valid)","Affirming the consequent (fallacy)","Denying the antecedent (fallacy)"],"answer":"Modus tollens (valid)","hint":"The fact denies the THEN part.","why":"Denying the consequent and concluding the denial of the antecedent is modus tollens: valid.","show":{"type":"passage","title":"","text":"'If a shape is a square, it has four sides. This shape does not have four sides. So it is not a square.' Which form?"}},{"q":"'If you are a dog, you are a mammal. You are not a dog. So you are not a mammal.' Which form?","options":["Denying the antecedent (fallacy)","Modus tollens (valid)","Modus ponens (valid)"],"answer":"Denying the antecedent (fallacy)","hint":"The fact denies the IF part.","why":"Cats are not dogs, yet they are mammals. Denying the antecedent proves nothing about the consequent.","show":{"type":"passage","title":"","text":"'If you are a dog, you are a mammal. You are not a dog. So you are not a mammal.' Which form?"}},{"q":"'Everyone at school has this phone, so it must be the best.' Which fallacy?","options":["Bandwagon ('everyone does it')","Ad hominem","Circular reasoning","Straw man"],"answer":"Bandwagon ('everyone does it')","hint":"What is offered in place of evidence?","why":"Popularity is offered instead of evidence about quality.","show":{"type":"passage","title":"","text":"'Everyone at school has this phone, so it must be the best.' Which fallacy?"}},{"q":"'A famous actor says this vitamin cures colds, so it must work.' Which fallacy?","options":["False appeal to authority","Bandwagon","Hasty generalization","False dilemma"],"answer":"False appeal to authority","hint":"Is the speaker an expert on medicine? What evidence is given?","why":"Fame as an actor is not expertise in medicine, and no evidence is offered. (A genuine expert who shows the evidence would be a good reason.)","show":{"type":"passage","title":"","text":"'A famous actor says this vitamin cures colds, so it must work.' Which fallacy?"}},{"q":"'You can't trust his math answer; he is always late.' Which fallacy?","options":["Ad hominem","Slippery slope","Bandwagon","Circular reasoning"],"answer":"Ad hominem","hint":"Does lateness bear on the math?","why":"It attacks the person instead of checking the answer.","show":{"type":"passage","title":"","text":"'You can't trust his math answer; he is always late.' Which fallacy?"}},{"q":"'Either we cancel the trip or everyone will be miserable.' Which fallacy?","options":["False dilemma","Straw man","Hasty generalization","Circular reasoning"],"answer":"False dilemma","hint":"Are there really only two options?","why":"Many options exist (change the date, plan indoor activities).","show":{"type":"passage","title":"","text":"'Either we cancel the trip or everyone will be miserable.' Which fallacy?"}},{"q":"'I met two rude people from that town, so everyone there is rude.' Which fallacy?","options":["Hasty generalization","Ad hominem","Bandwagon","Slippery slope"],"answer":"Hasty generalization","hint":"How many cases support 'everyone'?","why":"Two cases cannot establish a claim about a whole town.","show":{"type":"passage","title":"","text":"'I met two rude people from that town, so everyone there is rude.' Which fallacy?"}},{"q":"A geologist presents measurements showing a rock is about 3 billion years old. Is accepting her conclusion a fallacy?","options":["No: an expert presenting evidence within her field is a good reason","Yes: appeal to authority","Yes: bandwagon"],"answer":"No: an expert presenting evidence within her field is a good reason","hint":"Is the claim supported by evidence or only by status?","why":"Expertise plus evidence is exactly what good reasons look like. The fallacy is relying on status alone, or on someone outside their field.","show":{"type":"passage","title":"","text":"A geologist presents measurements showing a rock is about 3 billion years old. Is accepting her conclusion a fallacy?"}},{"q":"An argument sounds very convincing and the speaker is confident, but one premise is false. What should you conclude?","options":["The argument does not establish its conclusion","The conclusion is proven","The conclusion is false"],"answer":"The argument does not establish its conclusion","hint":"Does a false premise make the conclusion false, or merely unsupported?","why":"An unsound argument fails to prove its conclusion. The conclusion might still be true for other reasons, but this argument gives no grounds for believing it.","show":{"type":"passage","title":"","text":"An argument sounds very convincing and the speaker is confident, but one premise is false. What should you conclude?"}},{"q":"'This book is reliable because the book itself says it is reliable.' Which fallacy?","options":["Circular reasoning","Straw man","False dilemma","Bandwagon"],"answer":"Circular reasoning","hint":"What is assumed?","why":"It assumes the book's reliability in order to prove it.","show":{"type":"passage","title":"","text":"'This book is reliable because the book itself says it is reliable.' Which fallacy?"}},{gen:() => (gFallacy())},{gen:() => (gFallacy())},{gen:() => (gFallacy())},{gen:() => (gFallacy())},{gen:() => (gFallacy())},{gen:() => (gValidSound())},{gen:() => (gValidSound())},{gen:() => (gValidSound())},{gen:() => (gValidSound())},{gen:() => (gCondInfer())},{gen:() => (gCondInfer())},{gen:() => (gCondInfer())},{gen:() => (gSyllogism(2))}],"challenge":[{"q":"Which argument is sound?","options":["All mammals breathe air; whales are mammals; so whales breathe air.","All planets are stars; Mars is a planet; so Mars is a star.","All cats are animals; my dog is an animal; so my dog is a cat.","If it snows, school closes; school closed; so it snowed."],"answer":"All mammals breathe air; whales are mammals; so whales breathe air.","hint":"Sound = valid AND all premises true.","why":"The first is valid with true premises. The second has a false premise; the third and fourth are invalid.","show":{"type":"passage","title":"","text":"Which argument is sound?"}},{"q":"Can a valid argument have a false conclusion?","options":["Yes, if at least one premise is false","Never","Only if it is sound"],"answer":"Yes, if at least one premise is false","hint":"What does validity guarantee, exactly?","why":"Validity guarantees only that TRUE premises would give a true conclusion. With a false premise, a valid argument can reach a false conclusion (all planets are stars, so Mars is a star).","show":{"type":"passage","title":"","text":"Can a valid argument have a false conclusion?"}},{"q":"'If we allow one extra story at bedtime, soon it will be ten stories and nobody will ever sleep.' What is the best response?","options":["Ask for evidence that each step in the chain would actually happen","Agree: chains of events always continue","Reply that the speaker is unkind"],"answer":"Ask for evidence that each step in the chain would actually happen","hint":"Which fallacy is this, and what would repair it?","why":"This is a slippery slope. A chain of consequences is only reasonable if each link is supported by evidence; replying with an insult would itself be ad hominem.","show":{"type":"passage","title":"","text":"'If we allow one extra story at bedtime, soon it will be ten stories and nobody will ever sleep.' What is the best response?"}},{gen:() => (gValidSound())},{gen:() => (gSyllogism(2))}],"extend":"Collect five arguments from advertisements, letters to a newspaper or a debate. For each, write out the premises and conclusion, decide whether it is valid, check whether each premise is true (citing your evidence), and name any fallacy. Finish with one argument of your own that you believe is sound, and defend each premise.","offline":"Play 'Fallacy detective' at dinner: each person makes a short argument (some good, some containing a deliberate fallacy). The others must say 'valid or not?', 'are the premises true?', and name the fallacy if there is one."},
    {"title":"Search: river crossings and mate in two","icon":"🛶","learn":[{"say":"Many puzzles are journeys through <b>states</b> (complete descriptions of a situation) connected by <b>moves</b>. Solving the puzzle means finding a path from the start state to the goal state.","show":{"type":"big","text":"start state → move → state → … → goal"}},{"say":"The classic river crossing (recorded by Alcuin of York around the year 800): a farmer must ferry a wolf, a goat and a cabbage. The boat carries the farmer and one item. Unattended, the wolf eats the goat and the goat eats the cabbage.","show":{"type":"list","items":["State: who is on which bank","Move: the farmer crosses, with at most one item","Forbidden: wolf with goat, or goat with cabbage, without the farmer","Goal: everyone on the far bank"]}},{"say":"<b>Breadth-first search</b> examines all states one move away, then two moves away, and so on. The first time it reaches the goal, that number of moves is guaranteed to be the minimum. A computer confirms 7 crossings for the farmer.","show":{"type":"table","rows":[["Moves away","Example state reached"],["1","goat crosses"],["2","farmer returns alone"],["…","…"],["7","everyone across"]]}},{"say":"The key insight is to <b>bring something back</b>: the farmer takes the goat across, later brings it back, and takes it over again. Moves that seem to undo progress can be necessary.","show":{"type":"list","items":["1. Take the goat across","2. Return alone","3. Take the wolf across","4. Bring the goat back","5. Take the cabbage across","6. Return alone","7. Take the goat across"]}},{"say":"Chess is a vast state space. A <b>mate in two</b> means: after White's first move, <b>every</b> Black reply allows mate. You must consider all of the opponent's moves, not just the one you hope for.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g font-size='30' text-anchor='middle' stroke='#111'><text x='277.5' y='35' fill='#111' stroke-width='0.4'>♚&#xFE0E;</text><text x='211.5' y='101' fill='#fff' stroke-width='1.2'>♔&#xFE0E;</text><text x='46.5' y='68' fill='#fff' stroke-width='1.2'>♖&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g><text x='330' y='60' font-size='22' font-weight='700' text-anchor='start' fill='#222'>White to move:</text><text x='330' y='96' font-size='22' font-weight='700' text-anchor='start' fill='#222'>mate in two.</text><text x='330' y='132' font-size='22' font-weight='700' text-anchor='start' fill='#222'>1. Kg6! Kg8</text><text x='330' y='168' font-size='22' font-weight='700' text-anchor='start' fill='#222'>2. Ra8 mate</text></svg>"}},{"say":"<b>Explain it.</b> Explain what breadth-first search is and why the first solution it finds uses the fewest moves. Use the farmer's river crossing as your example.","show":{"type":"passage","title":"Explain it","text":"Explain what breadth-first search is and why the first solution it finds uses the fewest moves. Use the farmer's river crossing as your example.\n\nSpeak in 2–4 complete sentences to a grown-up, or write them down. Use the precise words from this lesson."}}],"practice":[{"q":"Farmer, wolf, goat and cabbage: what is the fewest number of crossings to get everything across safely?","type":"number","answer":7,"hint":"Count each trip of the boat, including the farmer's return trips.","why":"The 7 crossings: goat over; back alone; wolf over; goat back; cabbage over; back alone; goat over. A complete search confirms none shorter exists.","show":{"type":"passage","title":"","text":"Farmer, wolf, goat and cabbage: what is the fewest number of crossings to get everything across safely?"}},{"q":"Which item must the farmer take FIRST?","options":["The goat","The wolf","The cabbage","Nothing"],"answer":"The goat","hint":"If he takes the wolf, what happens to the goat and cabbage?","why":"Taking the wolf leaves the goat with the cabbage; taking the cabbage leaves the wolf with the goat. Only taking the goat leaves a safe pair (wolf and cabbage).","show":{"type":"passage","title":"","text":"Which item must the farmer take FIRST?"}},{"q":"In the solution, what does the farmer bring BACK on his fourth crossing?","options":["The goat","The wolf","The cabbage","Nothing"],"answer":"The goat","hint":"After the wolf arrives on the far bank, who cannot be left with it?","why":"After taking the wolf over, he cannot leave it with the goat, so he brings the goat back.","show":{"type":"passage","title":"","text":"In the solution, what does the farmer bring BACK on his fourth crossing?"}},{"q":"Three missionaries and three cannibals must cross; the boat holds two; cannibals may never outnumber missionaries on either bank (when missionaries are present). Fewest crossings?","type":"number","answer":11,"hint":"Search systematically: list safe states.","why":"A breadth-first search over all safe states finds the minimum: 11 crossings.","show":{"type":"passage","title":"","text":"Three missionaries and three cannibals must cross; the boat holds two; cannibals may never outnumber missionaries on either bank (when missionaries are present). Fewest crossings?"}},{"q":"One adult and two children must cross a river. The boat carries either one adult or up to two children (and needs someone to row). Fewest crossings?","type":"number","answer":5,"hint":"The children must ferry the boat back for the adult.","why":"Two children cross; one returns; the adult crosses; the other child returns; both children cross. Search confirms 5 crossings.","show":{"type":"passage","title":"","text":"One adult and two children must cross a river. The boat carries either one adult or up to two children (and needs someone to row). Fewest crossings?"}},{"q":"Four people cross a bridge at night, taking 1, 2, 5 and 10 minutes. At most two cross at once (at the slower pace), carrying one torch. Fewest total minutes?","type":"number","answer":17,"hint":"Should the two slowest cross together?","why":"1 and 2 cross (2); 1 returns (1); 5 and 10 cross (10); 2 returns (2); 1 and 2 cross (2): 17 minutes. Letting the fastest escort everyone takes 19.","show":{"type":"passage","title":"","text":"Four people cross a bridge at night, taking 1, 2, 5 and 10 minutes. At most two cross at once (at the slower pace), carrying one torch. Fewest total minutes?"}},{"q":"With a 3-litre and a 5-litre jug and a tap, what is the fewest number of steps (fill, empty or pour) to measure exactly 4 liters?","type":"number","answer":6,"hint":"Try filling the 5-litre jug first.","why":"Fill 5; pour into 3 (5 has 2); empty 3; pour the 2 into 3; fill 5; pour into 3 until full (5 now has 4). 6 steps, confirmed minimal by search.","show":{"type":"passage","title":"","text":"With a 3-litre and a 5-litre jug and a tap, what is the fewest number of steps (fill, empty or pour) to measure exactly 4 liters?"}},{"q":"Why must a breadth-first search find the SHORTEST solution first?","options":["It examines all paths of each length before any longer path","It guesses well","It always moves forward","It starts from the goal"],"answer":"It examines all paths of each length before any longer path","hint":"In what order are the states visited?","why":"All states 1 move away are examined before any 2 moves away, and so on; so the first time the goal appears, no shorter path exists.","show":{"type":"passage","title":"","text":"Why must a breadth-first search find the SHORTEST solution first?"}},{"q":"White to move and mate in two. What is the first move?","options":["King to g6","Rook to a8","Rook to h7","King to e7"],"answer":"King to g6","hint":"A check now lets the king escape. Which quiet move removes its squares?","why":"1. Kg6 leaves Black only Kg8, and 2. Ra8 is mate. 1. Ra8+ allows Kh7.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='sans-serif'><defs><pattern id='cb' x='30' y='8' width='66' height='66' patternUnits='userSpaceOnUse'><rect width='66' height='66' fill='#f0dcb4'/><rect x='33' width='33' height='33' fill='#b58863'/><rect y='33' width='33' height='33' fill='#b58863'/></pattern></defs><rect x='30' y='8' width='264' height='264' fill='url(#cb)' stroke='#6b4f2a' stroke-width='2'/><g font-size='30' text-anchor='middle' stroke='#111'><text x='277.5' y='35' fill='#111' stroke-width='0.4'>♚&#xFE0E;</text><text x='211.5' y='101' fill='#fff' stroke-width='1.2'>♔&#xFE0E;</text><text x='46.5' y='68' fill='#fff' stroke-width='1.2'>♖&#xFE0E;</text></g><g font-size='18' font-weight='700' text-anchor='middle' fill='#555'><text x='46.5' y='294'>a</text><text x='17' y='32'>8</text><text x='79.5' y='294'>b</text><text x='17' y='65'>7</text><text x='112.5' y='294'>c</text><text x='17' y='98'>6</text><text x='145.5' y='294'>d</text><text x='17' y='131'>5</text><text x='178.5' y='294'>e</text><text x='17' y='164'>4</text><text x='211.5' y='294'>f</text><text x='17' y='197'>3</text><text x='244.5' y='294'>g</text><text x='17' y='230'>2</text><text x='277.5' y='294'>h</text><text x='17' y='263'>1</text></g></svg>"}},{"q":"White to move and mate in two. What is the first move?","o // Course runner: turns COURSE data (one lesson per school week) into an app with the usual shell.
// Each lesson: Learn slides → Practice (hint after the first miss, worked answer after the second) →
// Challenge (contest level) → an off-screen task. No timers, no speed scoring.
// Layout: every screen must fit one screen. After each change the runner measures the panel and the stage
// and shrinks text step by step to a readable floor; only as a last resort does a long explanation or a
// long passage scroll inside its own box (with a fade at the bottom), never the page.
const { $, el, svg: makeSvg, text, panel, wait, confetti, PRAISE, numpad } = KIT;
const stage = $("[data-stage]");
let token = 0;

const UNITS = COURSE.lessons.map((l, i) => ({ id: `l${i + 1}`, label: `${i + 1}. ${l.title}`, icon: l.icon || COURSE.icon }));
const esc = (t) => String(t ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;");
const len = (t) => String(t ?? "").length;
const stop = (t) => (/[.!?…:;]["'”’)]?$/.test(String(t).trim()) ? String(t).trim() : `${String(t).trim()}.`);

// ---------- fitting ----------
let fitFrame = 0;
const refit = () => {
  cancelAnimationFrame(fitFrame);
  fitFrame = requestAnimationFrame(() => {
    fitPanel();
    fitStage();
  });
};
// The owl's bubble. `quiet` keeps the words (and the voice) but hides the bubble, used when the
// question is already printed on the stage so the panel is not spent on the same sentence twice.
function say(html, { quiet = false } = {}) {
  KIT.say(html);
  const box = $("[data-say]");
  if (box) {
    box.innerHTML = `<span class="cr-say-in">${box.innerHTML}</span>`;
    box.classList.toggle("cr-quiet", quiet);
  }
  refit();
}
const atEnd = (box) => box.scrollTop + box.clientHeight >= box.scrollHeight - 2;
const fadeCue = (box) => {
  if (!box) return;
  box.classList.toggle("cr-fade", box.scrollHeight > box.clientHeight + 2 && !atEnd(box));
  if (!box.dataset.cue) {
    box.dataset.cue = "1";
    box.addEventListener("scroll", () => box.classList.toggle("cr-fade", box.scrollHeight > box.clientHeight + 2 && !atEnd(box)), { passive: true });
  }
};
const singleColumn = () => getComputedStyle($(".ap-main") || document.body).gridTemplateColumns.trim().split(/\s+/).length < 2;

function fitPanel() {

  const main = $(".ap-main");
  host.classList.add("cr-panel");
  const sayBox = $("[data-say]", host);
  const inner = sayBox && $(".cr-say-in", sayBox);
  host.style.removeProperty("max-height");
  main?.style.removeProperty("grid-template-columns");
  if (inner) inner.style.removeProperty("max-height");
  const over = () => host.scrollHeight - host.clientHeight;
  // A ladder of ever stronger measures; stop at the first that fits. Upright screens may give the panel
  // more height ("tall"); landscape phones give it a wider column ("wide").
  const steps = [
    { k: 1 },
    { k: 0.93 },
    { k: 0.86 },
    { k: 0.86, grow: 1 },
    { k: 0.86, grow: 1, dense: true },
    { k: 0.86, grow: 2, dense: true },
    { k: 0.8, grow: 2, dense: true },
    { k: 0.8, grow: 2, dense: true, scroll: true },
    { k: 0.74, grow: 2, dense: true, scroll: true },
  ];
  const upright = singleColumn();
  for (const s of steps) {
    host.style.setProperty("--k", s.k);
    host.classList.toggle("cr-tight", s.k < 0.9);
    host.classList.toggle("cr-dense", !!s.dense);
    if (s.grow && upright) host.style.maxHeight = s.grow > 1 ? "64vh" : "58vh";
    if (s.grow && !upright && main) main.style.gridTemplateColumns = s.grow > 1 ? "minmax(0, 1fr) minmax(260px, 1.45fr)" : "minmax(0, 1.2fr) minmax(260px, 1fr)";
    if (inner) inner.style.removeProperty("max-height");
    let o = over();
    if (o > 1 && s.scroll && inner && sayBox.offsetParent) {
      // Last resort: the explanation scrolls inside the bubble, never the page.
      const lh = parseFloat(getComputedStyle(inner).lineHeight) || 20;
      const room = inner.offsetHeight - o - 2;
      inner.style.maxHeight = `${Math.max(Math.round(lh * 2.2), room)}px`;
      o = over();
    }
    if (o <= 1) break;
  }
  const choiceList = $("[data-list]", host);
  if (over() > 1 && typeof choiceList?._crCompact === "function") {
    const compact = choiceList._crCompact;
    choiceList._crCompact = null;
    if (compact()) return fitPanel();
  }
  fadeCue(inner);
}

function fitStage() {
  const box = $(".cr-show", stage);
  const body = box && $(".cr-body", box);
  if (!body) return;
  const fits = () => body.scrollHeight <= body.clientHeight + 1 && body.scrollWidth <= body.clientWidth + 1;
  box.style.setProperty("--s", 1);
  if (!fits()) {
    let lo = 0.45, hi = 1;
    for (let n = 0; n < 7; n++) {
      const mid = (lo + hi) / 2;
      box.style.setProperty("--s", mid);
      if (fits()) lo = mid;
      else hi = mid;
    }
    box.style.setProperty("--s", lo);
  }
  // A long, flat table (a few rows, many columns) that is still too wide is turned on its side.
  const table = $(".cr-table", body);
  if (table && !table.dataset.turned && body.scrollWidth > body.clientWidth + 1 && table.rows.length < (table.rows[0]?.cells.length || 0)) {
    const grid = [...table.rows].map((r) => [...r.cells]);
    table.dataset.turned = "1";
    table.innerHTML = grid[0].map((_, c) => `<tr>${grid.map((r) => (r[c] ? r[c].outerHTML : "<td></td>")).join("")}</tr>`).join("");
    table.classList.add("cr-turned");
    return fitStage();
  }
  // Still too wide: tighter cells, and long words may hyphenate.
  if (table && !table.classList.contains("cr-squeeze") && body.scrollWidth > body.clientWidth + 1) {
    table.classList.add("cr-squeeze");
    return fitStage();
  }
  fadeCue(body);
}
addEventListener("resize", refit);
if (window.ResizeObserver) new ResizeObserver(() => requestAnimationFrame(fitStage)).observe(stage);
document.fonts?.ready?.then(refit);

// ---------- the stage ----------
// A slide or question picture: big text, emoji row, a small table, a list, bars, a passage, the lesson's own SVG,
// or (for questions without a picture) the question itself. `tag` is the progress label; `q` prints the question
// above a picture so it stays visible while hints are shown.
function show(visual, { tag = "", q = "" } = {}) {
  stage.innerHTML = "";
  const box = document.createElement("div");
  box.className = "cr-show";
  const v = visual || {};
  let html = "";
  if (v.type === "svg") html = `<div class="cr-svg">${v.markup}</div>`;
  else if (v.type === "emoji") html = `<div class="cr-emoji">${esc(v.text)}</div>`;
  else if (v.type === "table")
    html = `<table class="cr-table">${(v.rows || []).map((r, i) => `<tr>${r.map((c) => (i === 0 && v.header !== false ? `<th>${esc(c)}</th>` : `<td>${esc(c)}</td>`)).join("")}</tr>`).join("")}</table>`;
  else if (v.type === "list") html = `<ul class="cr-list">${(v.items || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
  else if (v.type === "bars") {
    const max = Math.max(...(v.values || []).map((x) => x[1]), 1);
    html = `<div class="cr-bars">${(v.values || []).map(([k, n]) => `<div><span style="height:${Math.round((n / max) * 100)}%"></span><b>${esc(n)}</b><small>${esc(k)}</small></div>`).join("")}</div>`;
  } else if (v.type === "passage") html = `<div class="cr-passage">${v.title ? `<h3>${esc(v.title)}</h3>` : ""}${String(v.text || "").split(/\n\n+/).map((p) => `<p>${esc(p)}</p>`).join("")}</div>`;
  else if (v.type === "prompt") html = `<div class="cr-prompt${len(v.text) > 160 ? " cr-long" : ""}">${String(v.text || "").replace(/<(?!\/?b>)[^>]*>/g, "")}</div>`;
  else html = `<div class="cr-big">${esc(v.text || "")}</div>`;
  const question = q ? `<div class="cr-q">${esc(q)}</div>` : "";
  const cap = v.caption ? `<p class="cr-cap">${esc(v.caption)}</p>` : "";
  box.innerHTML = `${tag ? `<p class="cr-tag">${tag}</p>` : ""}<div class="cr-body cr-${v.type || "big"}-body">${question}${html}${cap}</div>`;
  stage.appendChild(box);
  refit();
}

async function learn(lesson, my) {
  const slides = lesson.learn || [];
  let i = 0;
  return new Promise((resolve) => {
    const host = panel(`<div class="kt-steps"><button type="button" class="kt-step-btn" data-back aria-label="Back">◀</button><span class="kt-step-dots" data-dots></span><button type="button" class="kt-step-btn kt-step-next" data-next>Next ▶</button></div>`);
    const render = () => {
      if (my !== token) return;
      const s = slides[i];
      show(s.show);
      $("[data-dots]", host).innerHTML = slides.map((_, k) => `<i class="${k === i ? "on" : k < i ? "seen" : ""}"></i>`).join("") + `<small>Learn ${i + 1} of ${slides.length}</small>`;
      $("[data-back]", host).disabled = i === 0;
      $("[data-next]", host).textContent = i === slides.length - 1 ? "✏️ Practice" : "Next ▶";
      say(`${i === 0 ? `<b>${stop(esc(lesson.title))}</b> ` : ""}${s.say}`);
    };
    host.onclick = (event) => {
      if (event.target.closest("[data-back]") && i > 0) (i -= 1), render();
      else if (event.target.closest("[data-next]")) {
        if (i < slides.length - 1) (i += 1), render();
        else {
          VOICE.hush();
          resolve();
        }
      }
    };
    if (slides.length) render();
    else resolve();
  });
}

// One question; resolves with true if right on the first try.
// Make every attempt different: generator questions build fresh numbers, choices are shuffled.
const shuffled = (list) => {
  const out = [...list];
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
};
function fresh(q) {
  let made = q;
  if (typeof q.gen === "function") {
    try {
      made = { ...q, ...q.gen() };
    } catch (error) {
      console.error("question generator failed", error);
    }
  }
  if (made.options && !made.keepOrder) made = { ...made, options: shuffled(made.options) };
  if (made.items && !made.keepOrder) made = { ...made, items: shuffled(made.items) };
  return made;
}
// Draw a set: keep the first (warm-up) question, sample the rest from the bank, keep easy-to-hard roughly by position.
function drawSet(bank, n) {
  if (bank.length <= n) return bank;
  const picks = new Set([0]);
  while (picks.size < n) picks.add(1 + Math.floor(Math.random() * (bank.length - 1)));
  return [...picks].sort((a, b) => a - b).map((k) => bank[k]);
}

// Choice and ordering lists: short words stay as chips; sentence-length entries become a calm grid of cards.
function listClass(list) {
  const longest = Math.max(0, ...list.map(len));
  const total = list.reduce((a, o) => a + len(o), 0);
  if (longest > 34 || (list.length <= 4 && total > 110)) return "cr-cards cr-wide";
  if (longest > 14 || list.length > 4) return "cr-cards";
  return "";
}

// Questions missed on the first try are kept with the lesson's progress (at most 20, newest last) for the
// parent's weekly report and for review warm-ups in later lessons. `src` says where the question lives
// ({ lesson, bank, k }), so a review can ask it again (a generated question comes back with new numbers).
// One answered right on the first try later is taken off the list.
const srcKey = (src) => (src ? `${src.lesson}:${src.bank}:${src.k}` : "");
function remember(q, missed, src) {
  try {
    const id = src ? `l${src.lesson + 1}` : shell.current();
    const text = String(q.q || "").replace(/<[^>]*>/g, "").trim();
    if (!id || !text) return;
    const key = srcKey(src);
    const was = shell.progress()[id]?.missed || [];
    const rest = was.filter((m) => (key && m.src ? m.src !== key : m.q !== text));
    if (!missed && rest.length === was.length) return;
    const answer = Array.isArray(q.answer) && q.answerText == null ? q.answer.join(" → ") : String(q.answerText ?? q.answer);
    shell.mark(id, { missed: missed ? [...rest, { q: text, a: answer.replace(/<[^>]*>/g, ""), at: Date.now(), ...(key ? { src: key } : {}) }].slice(-20) : rest });
  } catch (error) {}
}

// Spaced review: up to three questions missed in EARLIER lessons of this course, at least a day ago,
// oldest first. Each is asked again at the start of the lesson; a first-try answer clears it.
const REVIEW_MAX = 3;
const REVIEW_GAP = 20 * 3600 * 1000;
function reviewFor(index) {
  const found = [];
  const progress = shell.progress();
  for (let i = 0; i < index; i++)
    for (const m of progress[`l${i + 1}`]?.missed || []) {
      if (!m.src || Date.now() - m.at < REVIEW_GAP) continue;
      const [lesson, bank, k] = m.src.split(":");
      const q = COURSE.lessons[Number(lesson)]?.[bank]?.[Number(k)];
      if (q) found.push({ q, at: m.at, src: { lesson: Number(lesson), bank, k: Number(k) } });
    }
  return found.sort((a, b) => a.at - b.at).slice(0, REVIEW_MAX);
}

function ask(q0, label, my, src) {
  const q = fresh(q0);
  return new Promise((resolve) => {
    let tries = 0;
    const type = q.type || (q.options ? "choice" : q.items ? "order" : "number");
    const tag = `${esc(label)}${type === "order" ? ` · <span>tap in order, first to last</span>` : ""}`;
    if (q.show || q.big) show(q.show || { type: "big", text: q.big }, { tag, q: q.q });
    else show({ type: "prompt", text: q.q }, { tag });
    const finish = (right) => {
      if (my !== token) return;
      panel(`<div class="ap-buttons"><button type="button" class="primary" data-go>Next ▶</button></div>`);
      const why = q.why ? `<small>${esc(q.why)}</small>` : "";
      say(right ? `Correct. ${q.why ? esc(q.why) : ""}` : `The answer is <b>${stop(esc(Array.isArray(q.answer) && q.answerText == null ? q.answer.join(" → ") : q.answerText ?? q.answer))}</b> ${why}`);
      $("[data-panel]").onclick = (e) => e.target.closest("[data-go]") && resolve(tries === 1 && right);
    };
    const check = (value) => {
      if (my !== token) return false;
      tries += 1;
      const want = Array.isArray(q.answer) ? q.answer.join("|") : String(q.answer).trim().toLowerCase();
      const got = Array.isArray(value) ? value.join("|") : String(value).trim().toLowerCase();
      if (got === want) {
        if (tries === 1) remember(q, false, src);
        MUSIC.chime();
        window.OC?.count("problems solved");
        finish(true);
        return true;
      }
      MUSIC.oops();
      if (tries === 1) remember(q, true, src);
      if (tries === 1) say(`Not quite. ${q.hint ? esc(q.hint) : "Reconsider the question carefully."}`);
      else finish(false);
      return false;
    };
    // The question is already on the stage, so the owl reads it aloud with the bubble hidden.
    const prompt = () => say(esc(q.q), { quiet: true });
    if (type === "choice") {
      const host = panel(`<div class="ap-chips cr-choices ${listClass(q.options)}" data-list>${q.options.map((o, k) => `<button type="button" data-c="${k}">${esc(o)}</button>`).join("")}</div>`);
      // If even the tightest layout cannot hold these answers, print them on the stage as A, B, C…
      // (which may scroll there) and keep only large lettered buttons in the panel.
      const letter = (k) => String.fromCharCode(65 + k);
      const choiceList = $("[data-list]", host);
      choiceList._crCompact = () => {
        const list = choiceList, body = $(".cr-body", stage);
        // Only for genuinely long answer sets; short ones always fit the card layout.
        if (!list.isConnected || q.options.reduce((a, o) => a + len(o), 0) < 200) return false;
        if (!list || !body || q.options.length > 8) return false;
        const missed = new Set([...list.querySelectorAll(".cr-miss")].map((b) => b.dataset.c));
        list.className = "ap-chips cr-choices cr-letters";
        list.innerHTML = q.options.map((o, k) => `<button type="button" data-c="${k}" aria-label="${letter(k)}: ${esc(o).replace(/"/g, "&quot;")}" ${missed.has(String(k)) ? `disabled class="cr-miss"` : ""}>${letter(k)}</button>`).join("");
        body.insertAdjacentHTML("beforeend", `<ol class="cr-opts">${q.options.map((o, k) => `<li data-li="${k}" class="${missed.has(String(k)) ? "cr-miss" : ""}"><b>${letter(k)}</b><span>${esc(o)}</span></li>`).join("")}</ol>`);
        return true;
      };
      host.onclick = (e) => {
        const b = e.target.closest("[data-c]");
        if (!b || b.disabled) return;
        const ok = check(q.options[Number(b.dataset.c)]);
        if (!ok && my === token && b.isConnected) {
          b.disabled = true;
          b.classList.add("cr-miss");
          $(`.cr-opts [data-li="${b.dataset.c}"]`, stage)?.classList.add("cr-miss");
        }
      };
    } else if (type === "order") {
      let picked = [];
      const host = panel(`<div class="ap-chips cr-choices cr-ordering ${listClass(q.items)}" data-list></div><div class="ap-buttons cr-undo"><button type="button" data-undo>↺ Start over</button></div>`);
      const list = $("[data-list]", host);
      const draw = () => {
        list.innerHTML = q.items
          .map((o, k) => {
            const at = picked.indexOf(k);
            return `<button type="button" data-o="${k}" ${at >= 0 ? `disabled aria-pressed="true"` : ""}><i>${at >= 0 ? at + 1 : ""}</i><span>${esc(o)}</span></button>`;
          })
          .join("");
        $(".cr-undo", host).style.display = picked.length ? "" : "none";
        refit();
      };
      draw();
      host.onclick = (e) => {
        const b = e.target.closest("[data-o]");
        if (e.target.closest("[data-undo]")) (picked = []), draw();
        else if (b && !b.disabled) {
          picked.push(Number(b.dataset.o));
          draw();
          if (picked.length === q.items.length) {
            const value = picked.map((k) => q.items[k]);
            picked = [];
            if (!check(value) && my === token && list.isConnected) draw();
          }
        }
      };
    } else {
      const host = panel(`<div data-pad></div>`);
      numpad($("[data-pad]", host), { onEnter: (v) => check(v), max: 7 });
    }
    prompt();
  });
}

const units = Object.fromEntries(
  COURSE.lessons.map((lesson, i) => [
    `l${i + 1}`,
    async () => {
      const my = token;
      const id = `l${i + 1}`;
      try {
        await learn(lesson, my);
        if (my !== token) return;
        let first = 0;
        const review = reviewFor(i);
        if (review.length) {
          say(`First, a short review: ${review.length === 1 ? "one question" : `${review.length} questions`} missed in an earlier lesson.`);
          await wait(1400);
          if (my !== token) return;
        }
        for (let k = 0; k < review.length; k++) {
          await ask(review[k].q, `🔁 Review ${k + 1} of ${review.length}`, my, review[k].src);
          if (my !== token) return;
        }
        const bankOf = (name) => (lesson[name] || []).map((q, k) => ({ q, k }));
        const practice = drawSet(bankOf("practice"), lesson.practiceCount || 12);
        for (let k = 0; k < practice.length; k++) {
          if (await ask(practice[k].q, `Practice ${k + 1} of ${practice.length}`, my, { lesson: i, bank: "practice", k: practice[k].k })) first += 1;
          if (my !== token) return;
        }
        const challenge = drawSet(bankOf("challenge"), lesson.challengeCount || 3);
        for (let k = 0; k < challenge.length; k++) {
          say("Challenge problem. Understand it, make a plan, carry it out, then check.");
          await wait(1200);
          if (my !== token) return;
          await ask(challenge[k].q, `⭐ Challenge ${k + 1} of ${challenge.length}`, my, { lesson: i, bank: "challenge", k: challenge[k].k });
          if (my !== token) return;
        }
        shell.mark(id, { done: true, first, of: practice.length, doneAt: Date.now() });
        show({ type: "big", text: `${first} / ${practice.length}`, caption: "practice problems correct on the first attempt" });
        panel(`<div class="ap-buttons"><button type="button" class="primary" data-explain>🗣️ Explain it</button><button type="button" data-off>📝 Task</button>${lesson.extend ? `<button type="button" data-extend>🚀 Go further</button>` : ""}<button type="button" data-again>↺ Again</button></div>`);
        say(`Lesson complete. Now explain the main idea in your own words.`);
        $("[data-panel]").onclick = (e) => {
          if (e.target.closest("[data-again]")) shell.go(id);
          if (e.target.closest("[data-explain]")) {
            show({ type: "list", items: [`Explain to a grown-up, in 3 or 4 clear sentences, the main idea of "${lesson.title}".`, "Give one example of your own.", "Say one question you still have."] });
            say("Explain the main idea in three or four clear sentences, give an example of your own, and ask one question you still have.");
          }
          if (e.target.closest("[data-extend]")) {
            show({ type: "list", items: [lesson.extend] });
            say(esc(lesson.extend), { quiet: true });
          }
          if (e.target.closest("[data-off]")) {
            show({ type: "list", items: [lesson.offline || "Tell a grown-up what you learned today, in 5 sentences."] });
            say(esc(lesson.offline || "Tell a grown-up what you learned today."), { quiet: true });
          }
        };
      } catch (error) {
        console.error(error);
      }
    },
  ]),
);

const how = Object.fromEntries(UNITS.map((u) => [u.id, { icon: COURSE.icon, title: u.label.replace(/^\d+\.\s*/, ""), steps: ["Learn: study the lesson slides.", "Practice: solve each problem; a first miss gives a hint, a second shows the full reasoning.", "Challenge: contest-level problems. Then explain the main idea in your own words."] }]));
const fromHash = /^#l\d+$/.test(location.hash) && UNITS.some((u) => u.id === location.hash.slice(1)) ? location.hash.slice(1) : null;
const shell = SHELL({
  unitWord: "Lesson",
  units: UNITS,
  how,
  start: fromHash || UNITS[0].id,
  onStop() {
    token += 1;
    $("[data-panel]").onclick = null;
  },
  subject: COURSE.subject,
  activity: COURSE.title,
  onUnit(id) {
    token += 1;
    VOICE.hush();
    units[id]();
  },
});

// The shell's "turn sideways" tip normally floats at the bottom of the screen, over the answer buttons.
// Here it sits at the foot of the stage (never over a control) and a tap dismisses it.
const placeTip = () => {
  const tip = $(".ap-turn");
  if (!tip) return;
  if (!tip.dataset.placed) {
    tip.dataset.placed = "1";
    tip.classList.add("cr-turn");
    tip.insertAdjacentHTML("beforeend", ` <b aria-hidden="true">✕</b>`);
    tip.setAttribute("role", "button");
    tip.addEventListener("click", () => tip.remove());
  }
  const r = stage.getBoundingClientRect();
  tip.style.bottom = "auto";
  tip.style.top = `${Math.max(4, Math.round(r.bottom - tip.offsetHeight - 10))}px`;
};
placeTip();
addEventListener("resize", placeTip);
if (window.ResizeObserver) new ResizeObserver(placeTip).observe(stage);

const style = document.createElement("style");
style.textContent = `
/* stage: progress tag on top, content centerd below and shrunk to fit (--s) */
.cr-show{--s:1;width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 16px;overflow:hidden}
.cr-tag{flex:none;margin:0;padding:4px 12px;border-radius:12px;background:var(--accent-soft);color:var(--accent-dark);font:800 13.5px/1.3 var(--sans);font-variant-numeric:tabular-nums;max-width:100%;text-align:center}
.cr-tag span{font-weight:700;opacity:.85}
.cr-body{flex:1 1 0;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;gap:calc(10px * var(--s));overflow:auto;overscroll-behavior:contain;scrollbar-width:thin}
.cr-body>:first-child{margin-top:auto}.cr-body>:last-child{margin-bottom:auto}
.cr-big{font:900 max(22px,calc(clamp(26px,5vw,56px) * var(--s)))/1.2 var(--sans);color:var(--ink);text-align:center;white-space:pre-line;overflow-wrap:anywhere}
.cr-emoji{font-size:max(26px,calc(clamp(34px,6vw,64px) * var(--s)));line-height:1.3;text-align:center;letter-spacing:4px;word-break:break-word}
.cr-svg{flex:1 1 0;min-height:90px;width:100%;display:grid;place-items:center}.cr-svg svg{width:100%;height:100%;max-width:100%;max-height:100%}
.cr-svg-body>.cr-svg:first-child{margin-top:0}.cr-svg-body>.cr-svg:last-child{margin-bottom:0}
.cr-table{border-collapse:collapse;font:800 max(12.5px,calc(clamp(15px,2.3vw,23px) * var(--s)))/1.25 var(--sans);color:var(--ink);max-width:100%}
.cr-table th{position:sticky;top:0;z-index:1}.cr-table.cr-squeeze th,.cr-table.cr-squeeze td{padding:3px 4px;hyphens:auto;-webkit-hyphens:auto;letter-spacing:-.01em}.cr-table.cr-turned th{position:static}
.cr-table th,.cr-table td{border:2px solid var(--line);padding:calc(7px * var(--s)) calc(12px * var(--s));text-align:center;overflow-wrap:break-word}.cr-table th{background:var(--accent-soft)}
.cr-list{margin:0;padding-left:1.3em;font:700 max(14px,calc(clamp(17px,2.4vw,24px) * var(--s)))/1.45 var(--sans);color:var(--ink);max-width:40em;text-align:left}
.cr-list li+li{margin-top:.25em}
.cr-bars{flex:1 1 0;min-height:110px;max-height:340px;display:flex;align-items:flex-end;gap:12px;width:min(640px,96%)}
.cr-bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.cr-bars span{width:100%;background:var(--accent);border-radius:8px 8px 0 0}.cr-bars b{font-weight:900}.cr-bars small{font-weight:800;color:var(--muted);text-align:center;overflow-wrap:anywhere;font-size:max(12px,calc(14px * var(--s)))}
.cr-passage{max-width:44em;font:600 max(13.5px,calc(clamp(16px,2.1vw,20px) * var(--s)))/1.55 var(--sans);color:var(--ink);text-align:left}
.cr-passage h3{margin:0 0 6px;font-size:1.15em}.cr-passage p{margin:0 0 .6em}.cr-passage p:last-child{margin-bottom:0}
.cr-prompt{max-width:34em;font:700 max(16px,calc(clamp(19px,2.6vw,28px) * var(--s)))/1.45 var(--sans);color:var(--ink);text-align:center;overflow-wrap:break-word}
.cr-prompt.cr-long{text-align:left;font-weight:650}
.cr-q{max-width:38em;font:800 max(15px,calc(clamp(17px,2.2vw,24px) * var(--s)))/1.4 var(--sans);color:var(--ink);text-align:center;overflow-wrap:break-word}
.cr-q+*{margin-top:calc(4px * var(--s))}
.cr-cap{margin:0;color:var(--muted);font:800 max(13px,calc(clamp(14px,2vw,18px) * var(--s))) var(--sans);text-align:center}
.cr-fade{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 36px),transparent)}

/* panel (selectors carry .ap-panel.cr-panel so per-course style tweaks cannot undo the fit):
   children never squash (that hides text); content is centerd but never cut at the top */
.ap-panel.cr-panel{--k:1;--say:clamp(15.5px,2.3vw,21px);justify-content:flex-start}
.ap-panel.cr-panel>*{flex-shrink:0}
.ap-panel.cr-panel>:first-child:not(.cr-quiet),.ap-panel.cr-panel>.cr-quiet+*{margin-top:auto}.ap-panel.cr-panel>:last-child{margin-bottom:auto}
.ap-panel.cr-panel .ap-say{min-height:0;max-height:none;overflow:visible;font-size:max(14px,calc(var(--say) * var(--k)));line-height:1.38;max-width:36em;padding-top:12px;padding-bottom:12px}
.ap-panel.cr-panel .ap-say.cr-quiet{display:none}
.ap-panel.cr-panel .cr-say-in{display:block;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.ap-panel.cr-panel .cr-say-in small{display:block;margin-top:.3em}
.ap-panel.cr-panel.cr-tight .ap-say{padding-top:8px;padding-bottom:8px}

/* answer buttons: short answers are chips; long ones are cards in a grid; ordering shows the position picked */
.ap-panel.cr-panel .cr-choices{width:100%;max-width:52em;gap:8px}
.ap-panel.cr-panel .cr-choices button{min-height:48px;font-size:max(14px,calc(17px * var(--k)));max-width:100%;white-space:normal;line-height:1.25;padding:8px 16px}
.ap-panel.cr-panel .cr-choices.cr-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:calc(8px * var(--k))}
.ap-panel.cr-panel .cr-choices.cr-wide{grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr))}
.ap-panel.cr-panel .cr-choices.cr-cards button{min-height:46px;border-radius:16px;padding:calc(9px * var(--k)) 14px;text-align:center;font-weight:750}
.ap-panel.cr-panel .cr-choices.cr-wide button{text-align:left;line-height:1.3}
.ap-panel.cr-panel.cr-tight .cr-choices.cr-cards button{padding-top:6px;padding-bottom:6px;min-height:44px}
.ap-panel.cr-panel .cr-choices button.cr-miss{opacity:.5;background:#f6e9e4;box-shadow:0 0 0 1px #e4b9a8;text-decoration:line-through;text-decoration-color:rgba(160,70,40,.45)}
.ap-panel.cr-panel .cr-ordering button{display:flex;align-items:center;justify-content:flex-start;gap:10px;text-align:left}
.ap-panel.cr-panel .cr-choices.cr-ordering.cr-cards{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.ap-panel.cr-panel.cr-dense .cr-choices.cr-cards:not(.cr-wide){grid-template-columns:repeat(auto-fit,minmax(min(100%,138px),1fr))}
.ap-panel.cr-panel.cr-dense .cr-choices.cr-ordering.cr-cards:not(.cr-wide) button{padding-left:8px;padding-right:8px;gap:7px}
.ap-panel.cr-panel .cr-ordering button i{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--paper,#f6efe4);box-shadow:inset 0 0 0 2px #e2d6c4;font:900 14px/1 var(--sans);font-style:normal;color:#fff}
.ap-panel.cr-panel .cr-ordering button[aria-pressed="true"]{opacity:1;background:var(--accent-soft);color:var(--ink);box-shadow:0 0 0 2px var(--accent);cursor:default}
.ap-panel.cr-panel .cr-ordering button[aria-pressed="true"] i{background:var(--accent);box-shadow:none}
.ap-panel.cr-panel .cr-ordering.cr-wide button span{flex:1}
.ap-panel.cr-panel .cr-ordering button span{text-align:left}
.ap-panel.cr-panel .cr-undo button{min-height:44px;font-size:15px;padding:0 16px}
@media (max-height:700px),(max-width:420px){.ap-panel.cr-panel .cr-choices.cr-cards button,.ap-panel.cr-panel .cr-ordering button{min-height:44px}.ap-panel.cr-panel .cr-choices{gap:6px}}

.ap-turn.cr-turn{pointer-events:auto;cursor:pointer;width:max-content;max-width:calc(100vw - 32px);white-space:normal;text-align:center;font-size:14px;padding:8px 14px}
.ap-turn.cr-turn b{margin-left:6px;opacity:.7}

/* lettered answers: the full texts on the stage, big A/B/C buttons in the panel */
.cr-opts{list-style:none;margin:0;padding:0;display:grid;gap:calc(8px * var(--s));width:100%;max-width:40em;text-align:left;font:650 max(13.5px,calc(clamp(15px,2vw,19px) * var(--s)))/1.4 var(--sans);color:var(--ink)}
.cr-opts li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:calc(8px * var(--s)) 12px;border-radius:14px;background:var(--accent-soft)}
.cr-opts li b{display:grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;background:var(--accent);color:#fff;font-weight:900}
.cr-opts li.cr-miss{opacity:.45;text-decoration:line-through}
.ap-panel.cr-panel .cr-choices.cr-letters{display:flex;flex-wrap:nowrap;justify-content:center;gap:10px}
.ap-panel.cr-panel .cr-choices.cr-letters button{flex:1 1 0;max-width:110px;min-height:52px;font-size:22px;font-weight:900;text-decoration:none}

/* tap targets stay at least 44 px even on short landscape phones */
.ap-panel.cr-panel .ap-buttons button,.ap-panel.cr-panel .kt-step-btn{min-height:46px}
@media (max-height:460px),(max-width:420px) and (max-height:720px){.ap-panel.cr-panel{--say:15.5px}.ap-panel.cr-panel .kt-keys button{min-height:44px !important}.ap-panel.cr-panel .kt-entry{min-height:40px !important}}
@media (max-height:460px){.ap-panel.cr-panel .ap-buttons button,.ap-panel.cr-panel .kt-step-btn{min-height:44px}.ap-panel.cr-panel .cr-choices button{min-height:44px}.cr-show{padding:8px 10px}.cr-tag{font-size:12.5px;padding:3px 10px}}
`;
document.head.appendChild(style);
</script>
</body>
</html>
