    {"title":"Kush and Egypt's later kingdoms","icon":"🏹","learn":[{"say":"Egypt was reunited in the <b>Middle Kingdom</b>, then lost the north to the <b>Hyksos</b>. About 1550 BC Ahmose drove them out, beginning the <b>New Kingdom</b>, Egypt's age of empire.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><path d='M30 170H570' stroke='#1f2937' stroke-width='4'/><circle cx='73' cy='170' r='8' fill='#1d5c8a'/><path d='M73 170V146' stroke='#1d5c8a' stroke-width='2'/><text x='59' y='118' font-size='18' fill='#1f2937' text-anchor='start' font-weight='700'>Middle Kingdom</text><text x='59' y='140' font-size='18' fill='#1f2937' text-anchor='start' font-weight='700'>(about 2055 BC)</text><circle cx='213' cy='170' r='8' fill='#1d5c8a'/><path d='M213 170V222' stroke='#1d5c8a' stroke-width='2'/><text x='213' y='242' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Hyksos rule north</text><text x='213' y='264' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>(about 1650 BC)</text><circle cx='248' cy='170' r='8' fill='#1d5c8a'/><path d='M248 170V100' stroke='#1d5c8a' stroke-width='2'/><text x='248' y='72' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>New Kingdom</text><text x='248' y='94' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>(about 1550 BC)</text><circle cx='415' cy='170' r='8' fill='#1d5c8a'/><path d='M415 170V222' stroke='#1d5c8a' stroke-width='2'/><text x='415' y='242' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>New Kingdom ends</text><text x='415' y='264' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>(about 1069 BC)</text><circle cx='533' cy='170' r='8' fill='#1d5c8a'/><path d='M533 170V146' stroke='#1d5c8a' stroke-width='2'/><text x='547' y='118' font-size='18' fill='#1f2937' text-anchor='end' font-weight='700'>Piye of Kush</text><text x='547' y='140' font-size='18' fill='#1f2937' text-anchor='end' font-weight='700'>(about 728 BC)</text></svg>"}},{"say":"Most New Kingdom kings were buried in the <b>Valley of the Kings</b> near Thebes. Famous rulers of this age include <b>Hatshepsut</b>, <b>Akhenaten</b>, <b>Tutankhamun</b> and <b>Ramesses II</b>.","show":HX.tb(...[[["Ruler","Reign (about)","Known for"],["Hatshepsut","1479–1458 BC","Female king; expedition to Punt"],["Thutmose III","1479–1425 BC","Military campaigns; largest empire"],["Akhenaten","1353–1336 BC","Worship of the Aten; new city of Amarna"],["Tutankhamun","1332–1323 BC","Restored the old gods; tomb found 1922"],["Ramesses II","1279–1213 BC","Battle of Kadesh; Abu Simbel"]]])},{"say":"Later rulers chiselled away Hatshepsut's images and left Akhenaten off king lists. Historians rebuild such reigns from what the erasers missed.","show":{"type":"big","text":"Erased images, missing names\n→ ask who removed them, and why","caption":"Silence in the record can be manufactured"}},{"say":"About 1274 BC Ramesses II fought the Hittites at <b>Kadesh</b>, and his temples proclaim a great victory. Hittite records and the outcome tell a different story.","show":HX.tb(...[[["Source","Says about Kadesh","Possible bias"],["Ramesses's temple reliefs","Great victory, won almost single-handed","Royal propaganda"],["Hittite records","Egypt did not take Kadesh","Hittite propaganda"],["The outcome","Border unchanged; later peace treaty","Least biased evidence"]]])},{"say":"South of Egypt lay <b>Kush</b>, in modern Sudan. Egypt once conquered it, but about 728 BC King <b>Piye</b> of Kush conquered Egypt.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 978' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><rect width='600' height='978' fill='#efe4c8'/><path d='M-1580,-223 -1520,-255 -1405,-255 -1345,-304 -1315,-402 -1290,-451 -1255,-489 -1190,-511 -1140,-538 -1145,-597 -1090,-619 -1030,-608 -935,-636 -855,-674 -790,-646 -775,-592 -745,-565 -685,-530 -650,-502 -590,-478 -555,-451 -520,-437 -500,-380 -517,-326 -495,-326 -470,-348 -443,-380 -470,-418 -440,-459 -400,-429 -375,-443 -450,-494 -495,-538 -550,-543 -605,-592 -625,-630 -680,-663 -685,-706 -680,-733 -615,-744 -615,-712 -575,-722 -505,-630 -420,-597 -370,-565 -330,-532 -330,-456 -300,-418 -265,-375 -245,-342 -215,-288 -205,-261 -175,-239 -155,-255 -140,-239 -160,-299 -125,-288 -150,-320 -120,-323 -98,-307 -100,-337 -135,-358 -170,-372 -155,-391 -135,-386 -165,-429 -170,-456 -155,-467 -135,-445 -105,-456 -110,-475 -80,-483 -30,-483 0,-478 30,-467 10,-437 10,-429 5,-407 40,-397 40,-364 55,-348 20,-342 60,-320 65,-282 70,-272 105,-261 110,-253 155,-250 225,-234 235,-266 275,-255 325,-223 380,-228 430,-261 480,-250 510,-250 490,-190 495,-158 475,-103 460,-71 450,-43 435,-5 420,27 390,43 315,38 290,27 250,22 220,30 195,43 125,54 60,38 -40,22 -100,0 -145,-33 -215,-49 -295,-22 -300,27 -340,92 -390,71 -500,38 -535,-16 -640,-49 -720,-65 -795,-103 -745,-174 -770,-206 -750,-266 -785,-263 -805,-288 -870,-266 -910,-266 -985,-277 -1045,-255 -1150,-261 -1240,-244 -1330,-201 -1410,-168 -1495,-174 -1565,-212ZM327,111 335,158 380,239 415,326 480,440 560,674 630,760 675,896 725,929 790,1010 865,1059 873,1048 835,896 760,733 655,570 595,424 525,320 460,217 443,196 450,136 445,136 423,217 413,231 375,190Z' fill='#bcd9ef'/><path d='M220,30 250,76 262,106 263,163 240,217 245,239 270,272 310,310 335,320 333,342 330,364 345,430 320,489 280,527 268,554 230,625 220,674 224,697 250,739 290,731 325,712 365,677 395,733 400,777 388,818 327,891 325,1032 280,1222' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M262,106 270,65 290,27' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M327,891 370,961 420,1075 465,1130 570,1108' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><circle cx='263' cy='117' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='333' cy='342' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='281' cy='525' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='220' cy='674' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='291' cy='732' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='388' cy='818' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><g font-size='18' font-weight='700' stroke='#fff' stroke-width='4' paint-order='stroke' text-anchor='middle'><text x='150' y='244' fill='#6d28d9'>EGYPT</text><text x='150' y='782' fill='#6d28d9'>KUSH</text><text x='550' y='587' fill='#1d5c8a' font-style='italic'>Red Sea</text><text x='254' y='123' fill='#1f2937' text-anchor='end'>Memphis</text><text x='342' y='348' fill='#1f2937' text-anchor='start'>Thebes</text><text x='272' y='531' fill='#1f2937' text-anchor='end'>Abu Simbel</text><text x='211' y='680' fill='#1f2937' text-anchor='end'>Kerma</text><text x='300' y='738' fill='#1f2937' text-anchor='start'>Napata</text><text x='397' y='824' fill='#1f2937' text-anchor='start'>Meroë</text></g><g font-size='18' font-weight='700'><path d='M14 964h146' stroke='#1f2937' stroke-width='4'/><text x='14' y='956' fill='#1f2937' stroke='#fff' stroke-width='4' paint-order='stroke'>300 km</text></g></svg>"}},{"say":"The Kushite capital moved to <b>Meroë</b>, a centre of iron-working with about 200 pyramids. Its ruling queens bore the title <b>Kandake</b>, and the Bible mentions one.","show":{"type":"passage","title":"Acts 8:27 (World English Bible)","text":"He arose and went; and behold, there was a man of Ethiopia, a eunuch of great authority under Candace, queen of the Ethiopians, who was over all her treasure, who had come to Jerusalem to worship."}},{"say":"<b>Explain it.</b> Compare how Egypt and Kush influenced each other. Then explain, using Kadesh or Hatshepsut, why historians cannot simply trust a ruler's own monuments.","show":{"type":"list","items":["Say it in 2–4 complete sentences.","Use the precise words from this lesson.","Support each claim with evidence: how do we know?"],"caption":"Explain it — to a grown-up or in writing"}}],"practice":[{"q":"Which period was Egypt's age of empire?","options":["The Old Kingdom","The Middle Kingdom","The New Kingdom","The First Intermediate Period"],"answer":"The New Kingdom","hint":"It began about 1550 BC.","why":"The New Kingdom (about 1550–1069 BC) saw Egypt conquer lands in Nubia and the Levant."},{"q":"What military technology did the Hyksos bring into Egypt?","options":["Iron swords","The horse and chariot","Catapults","Gunpowder"],"answer":"The horse and chariot","hint":"It made armies much faster.","why":"The Hyksos introduced horse-drawn chariots, which New Kingdom Egypt then used to build its empire."},{"q":"Hatshepsut is notable because she…","options":["ruled as king for about 20 years, though a woman","built the Great Pyramid","conquered Rome","invented hieroglyphs"],"answer":"ruled as king for about 20 years, though a woman","hint":"She was often shown with a king's false beard.","why":"Hatshepsut ruled as a full king (pharaoh) about 1479–1458 BC, a rare position for a woman."},{"q":"Why did Egyptians later chisel away many of Hatshepsut's images?","options":["Because they were badly carved","Probably to secure Thutmose III's line; the motive is debated","Because she lost a war","Because she was a Hyksos"],"answer":"Probably to secure Thutmose III's line; the motive is debated","hint":"Who gained from removing her from the record?","why":"The erasures happened late in Thutmose III's reign, which points to politics around the succession rather than simple hatred. Historians still debate the motive."},{"q":"What was unusual about Akhenaten's religion?","options":["He worshipped Roman gods","He made the Aten, the sun disc, the central object of worship and closed out other cults","He abolished kingship","He worshipped no god at all"],"answer":"He made the Aten, the sun disc, the central object of worship and closed out other cults","hint":"He even founded a new capital, Amarna.","why":"Akhenaten promoted the Aten above all other gods. After his death, his changes were reversed and his name was erased from king lists."},{"q":"Howard Carter found Tutankhamun's tomb in AD 1922. Tutankhamun died about 1323 BC. About how many years lay between his death and the discovery?","type":"number","answer":3244,"hint":"Crossing BC to AD: add, then subtract 1.","why":"1323 + 1922 − 1 = 3244 years."},{"q":"Why was Tutankhamun's tomb so important to historians?","options":["He was Egypt's greatest king","It was found nearly intact, while almost every other royal tomb had been robbed","It held the Rosetta Stone","It was the first pyramid"],"answer":"It was found nearly intact, while almost every other royal tomb had been robbed","hint":"What had happened to most other tombs?","why":"Robbers had emptied nearly every royal tomb in antiquity. Tutankhamun's, mostly untouched, showed what a royal burial really contained."},{"q":"Ramesses II's temples show Kadesh as a great Egyptian victory. Which evidence best tests this claim?","options":["More of Ramesses's own inscriptions","Hittite records and the outcome: the city stayed Hittite and the war ended in a treaty","A modern film","The size of his statues"],"answer":"Hittite records and the outcome: the city stayed Hittite and the war ended in a treaty","hint":"Which source has no reason to flatter Ramesses?","why":"Independent evidence, the enemy's records and the actual result, shows no clear Egyptian victory. Ramesses's version is propaganda."},{"q":"Why is the Egyptian-Hittite treaty historically special?","options":["It was written in Latin","It is the oldest peace treaty to survive in versions from both sides","It ended the Trojan War","It created the Roman Empire"],"answer":"It is the oldest peace treaty to survive in versions from both sides","hint":"Both copies exist: one in hieroglyphs, one in cuneiform.","why":"Both the Egyptian and the Hittite versions survive, letting historians compare how each side presented the same agreement."},{"q":"Where was Kush?","options":["In Greece","South of Egypt, along the Nile in modern Sudan","In Mesopotamia","In modern Ethiopia only"],"answer":"South of Egypt, along the Nile in modern Sudan","hint":"Look at the map.","why":"Kush (Nubia) lay along the Nile south of Egypt, mostly in modern Sudan."},{"q":"In about 728 BC, what did King Piye of Kush do?","options":["Conquered Egypt, beginning the rule of Kushite pharaohs (25th Dynasty)","Built the Great Pyramid","Founded Carthage","Destroyed Nineveh"],"answer":"Conquered Egypt, beginning the rule of Kushite pharaohs (25th Dynasty)","hint":"The tables turned on Egypt.","why":"Piye marched north and conquered Egypt; his successors ruled as pharaohs until the Assyrians drove them out."},{"q":"Meroë became famous for which industry?","options":["Silk","Iron-working","Glass","Paper"],"answer":"Iron-working","hint":"Slag heaps still surround the ruins.","why":"Meroë had iron ore, wood for fuel and skilled smiths; large slag heaps remain from its furnaces."},{"q":"Which country has more ancient pyramids: Egypt or Sudan?","options":["Egypt","Sudan, with about 200 Kushite pyramids","They have the same number","Neither has pyramids"],"answer":"Sudan, with about 200 Kushite pyramids","hint":"Kushite kings and queens built many steep, smaller pyramids.","why":"Sudan has about 200 pyramids, more than Egypt, though they are smaller and steeper."},{"q":"In Acts 8:27, 'Candace, queen of the Ethiopians' refers to…","options":["a queen of modern Ethiopia","a ruling queen (kandake) of Kush, then called Ethiopia by Greeks","a Roman empress","an Egyptian goddess"],"answer":"a ruling queen (kandake) of Kush, then called Ethiopia by Greeks","hint":"What did 'Ethiopia' mean in Greek?","why":"Greek writers called Kush 'Ethiopia'. Kandake was the title of Kushite ruling queens, which Greek writers took for a name."},{"q":"Put these in order, earliest first.","type":"order","items":["Ramesses II fights at Kadesh","The Hyksos are driven out of Egypt","Kerma flourishes in Nubia","Piye of Kush conquers Egypt"],"answer":["Kerma flourishes in Nubia","The Hyksos are driven out of Egypt","Ramesses II fights at Kadesh","Piye of Kush conquers Egypt"],"hint":"Kerma began about 2500 BC.","why":"Kerma (from about 2500 BC) → Hyksos expelled (about 1550 BC) → Kadesh (about 1274 BC) → Piye (about 728 BC)."},{gen:HX.G.mapdot(17)},{gen:HX.G.mapdot(17)},{gen:HX.G.country(17)},{gen:HX.G.feature(17)},{gen:HX.G.span(17)},{gen:HX.G.first(17)},{gen:HX.G.order(17)},{gen:HX.G.century(17)},{gen:HX.G.ago(17)}],"challenge":[{"q":"Both Egyptian and Hittite accounts of Kadesh are biased. What is the strongest method for reaching a conclusion?","options":["Average the two accounts","Trust the older one","Use points both admit and outcomes neither could hide","Trust the more exciting one"],"answer":"Use points both admit and outcomes neither could hide","hint":"What evidence is hard for propaganda to fake?","why":"Points enemies agree on, and facts on the ground, are the most reliable. Averaging biased claims has no logical basis."},{"q":"Hatshepsut reigned from about 1479 to 1458 BC, and Ramesses II from about 1279 to 1213 BC. How many more years did Ramesses reign than Hatshepsut?","type":"number","answer":45,"hint":"Find each reign length first.","why":"Hatshepsut: 1479 − 1458 = 21 years. Ramesses: 1279 − 1213 = 66 years. 66 − 21 = 45."},{"q":"A king list carved under Ramesses II omits Hatshepsut and Akhenaten. A student concludes they never ruled. What is wrong?","options":["Later kings chose whom to list; other evidence shows they ruled","Nothing: king lists are complete","They were Hittites","The list is in Greek"],"answer":"Later kings chose whom to list; other evidence shows they ruled","hint":"Who made the list, and why might it leave names out?","why":"Official lists reflect the makers' views. Independent evidence, including their own buildings, letters and tombs, proves these rulers reigned."},{"q":"Kushite kings ruled Egypt from about 744 BC to 656 BC (counting from Piye's accession in Kush). For about how many years is that?","type":"number","answer":88,"hint":"Subtract.","why":"744 − 656 = 88 years."},{gen:HX.G.gap2(17)}],"extend":"Read about the Kandakes of Meroë, especially Amanirenas, who fought the Romans about 25 BC. Write a short report using at least two kinds of source (a Roman writer such as Strabo, and archaeology such as the bronze head of Augustus found at Meroë).","offline":"Make a two-sided 'propaganda tablet' of a game or race in your family: one side tells it as the winner would, the other as the loser would. Then write the most neutral account you can, using only facts both sides agree on."},
    {"title":"Moses and the Exodus","icon":"🔥","learn":[{"say":"The book of Exodus tells how <b>Moses</b> led the enslaved Israelites out of Egypt to Mount Sinai, where God gave the Law. It is a founding account of freedom from slavery.","show":HX.li(...[["Israelites enslaved in Egypt","Moses, raised in Pharaoh's household, is called at the burning bush","Ten plagues; the first Passover","Crossing of the sea","The Law given at Mount Sinai","Forty years in the wilderness; arrival at Canaan"],"The Exodus account, in brief"])},{"say":"At Sinai, the Ten Commandments begin with God's identity and the first commandment, then turn to how people must treat one another.","show":{"type":"passage","title":"Exodus 20:2–3, 12–13, 15–16 (World English Bible)","text":"“I am Yahweh your God, who brought you out of the land of Egypt, out of the house of bondage.\n\n“You shall have no other gods before me. […]\n\n“Honor your father and your mother, that your days may be long in the land which Yahweh your God gives you.\n\n“You shall not murder. […]\n\n“You shall not steal.\n\n“You shall not give false testimony against your neighbor. […]"}},{"say":"Compare the form of these laws with Hammurabi's. Most of his are <b>case laws</b>: 'If a man does X, then Y.' The commandments are <b>absolute commands</b>, addressed to every person directly: 'You shall not…', with no exceptions for rank.","show":HX.tb(...[[["","Hammurabi","Ten Commandments"],["Form","If a man does X, then penalty Y","You shall not…"],["Addressed to","Judges deciding cases","Every member of the people"],["Rank","Penalty depends on the victim's rank","Same command for all"],["Source of authority","The king, appointed by the gods","God, directly"]]])},{"say":"Biblical clues point to different dates: 1 Kings 6:1 suggests about 1446 BC, while the city name 'Raamses' in Exodus 1:11 suggests about 1250 BC. Scholars still debate it.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><path d='M30 170H570' stroke='#1f2937' stroke-width='4'/><circle cx='120' cy='170' r='8' fill='#1d5c8a'/><path d='M120 170V146' stroke='#1d5c8a' stroke-width='2'/><text x='120' y='118' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>about 1446 BC</text><text x='120' y='140' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>(from 1 Kings 6:1)</text><circle cx='411' cy='170' r='8' fill='#1d5c8a'/><path d='M411 170V222' stroke='#1d5c8a' stroke-width='2'/><text x='411' y='242' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>about 1250 BC</text><text x='411' y='264' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>(from Exodus 1:11)</text><circle cx='474' cy='170' r='8' fill='#1d5c8a'/><path d='M474 170V100' stroke='#1d5c8a' stroke-width='2'/><text x='474' y='72' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Merneptah Stele</text><text x='474' y='94' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>(about 1208 BC)</text></svg>"}},{"say":"The earliest mention of <b>Israel</b> outside the Bible is the <b>Merneptah Stele</b>, about 1208 BC. No Egyptian record mentions the Exodus, but royal inscriptions rarely recorded defeats.","show":HX.tb(...[[["Evidence","What it shows","What it cannot show"],["Merneptah Stele","A people called Israel in Canaan, about 1208 BC","Where they came from"],["Semitic workers in Egypt (texts, burials)","People from Canaan did live in the delta","That the Exodus happened as told"],["Silence of Egyptian records","Egypt did not record it","That it did not happen: Egypt hid losses"]]])},{"say":"Keep three things distinct: what the text says, what outside evidence confirms, and what is a matter of faith. All can agree on the enormous influence of its ideas.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 518' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><defs><marker id='a' viewBox='0 0 10 10' refX='7' refY='5' markerWidth='5' markerHeight='5' orient='auto'><path d='M0 0L10 5L0 10Z' fill='context-stroke'/></marker></defs><rect width='600' height='518' fill='#efe4c8'/><path d='M-2016,-180 -1944,-221 -1806,-221 -1734,-283 -1698,-408 -1668,-470 -1626,-518 -1548,-546 -1488,-581 -1494,-657 -1428,-684 -1356,-670 -1242,-705 -1146,-753 -1068,-719 -1050,-650 -1014,-615 -942,-570 -900,-536 -828,-504 -786,-470 -744,-453 -720,-380 -741,-311 -714,-311 -684,-339 -651,-380 -684,-428 -648,-480 -600,-442 -570,-460 -660,-525 -714,-581 -780,-587 -846,-650 -870,-698 -936,-739 -942,-795 -936,-829 -858,-843 -858,-802 -810,-815 -726,-698 -624,-657 -564,-615 -516,-574 -516,-477 -480,-428 -438,-373 -414,-332 -378,-263 -366,-228 -330,-200 -306,-221 -288,-200 -312,-276 -270,-263 -300,-304 -264,-308 -238,-287 -240,-325 -282,-352 -324,-370 -306,-394 -282,-387 -318,-442 -324,-477 -306,-491 -282,-463 -246,-477 -252,-501 -216,-511 -156,-511 -120,-504 -84,-491 -108,-453 -108,-442 -114,-415 -72,-401 -72,-359 -54,-339 -96,-332 -48,-304 -42,-256 -36,-242 6,-228 12,-218 66,-214 150,-194 162,-235 210,-221 270,-180 336,-187 396,-228 456,-214 492,-214 468,-138 474,-97 450,-28 432,14 420,48 402,97 384,138 348,159 258,152 228,138 180,131 144,142 114,159 30,173 -48,152 -168,131 -240,104 -294,62 -378,41 -474,76 -480,138 -528,221 -588,194 -720,152 -762,83 -888,41 -984,21 -1074,-28 -1014,-117 -1044,-159 -1020,-235 -1062,-232 -1086,-263 -1164,-235 -1212,-235 -1302,-249 -1374,-221 -1500,-228 -1608,-207 -1716,-152 -1812,-111 -1914,-117 -1998,-166ZM273,245 282,304 336,408 378,518 456,663 552,961 636,1071 690,1244 750,1285 828,1389 918,1451 927,1437 882,1244 792,1037 666,829 594,643 510,511 432,380 411,352 420,276 414,276 387,380 375,397 330,346Z' fill='#bcd9ef'/><path d='M-270,-145 -222,-145 -102,-124 -114,-104 -198,-97 -270,-124ZM258,-104 300,-131 396,-152 354,-104 300,-76 264,-83Z' fill='#efe4c8' stroke='#b9a77c'/><path d='M144,142 180,200 194,238 195,311 168,380 174,408 204,449 252,498 282,511 279,539 276,567 294,650 264,726 216,774 201,809 156,898 144,961 149,990 180,1044 228,1033 270,1009 318,965 354,1037 360,1092 345,1144 272,1237 270,1417 216,1659' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M194,238 204,187 228,138' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M272,1237 324,1327 384,1472 438,1541 564,1513' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M228,200 276,228 324,290 358,343' fill='none' stroke='#c0392b' stroke-width='4' stroke-dasharray='10 6' stroke-linejoin='round' marker-end='url(#a)'/><path d='M358,343 414,270 438,200 456,131' fill='none' stroke='#6d28d9' stroke-width='4' stroke-dasharray='10 6' stroke-linejoin='round' marker-end='url(#a)'/><circle cx='228' cy='200' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='358' cy='343' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><g font-size='18' font-weight='700' stroke='#fff' stroke-width='4' paint-order='stroke' text-anchor='middle'><text x='324' y='242' fill='#6d28d9'>SINAI</text><text x='492' y='90' fill='#6d28d9'>CANAAN</text><text x='150' y='62' fill='#1d5c8a' font-style='italic'>Mediterranean Sea</text><text x='408' y='422' fill='#b42318'>one proposed route</text><text x='219' y='206' fill='#1f2937' text-anchor='end'>Goshen (approx.)</text><text x='349' y='349' fill='#1f2937' text-anchor='end'>Mt Sinai (traditional site)</text></g></svg>"}},{"say":"<b>Explain it.</b> What can the Merneptah Stele tell us, and what can it not tell us? Then compare the form of the Ten Commandments with Hammurabi's laws.","show":{"type":"list","items":["Say it in 2–4 complete sentences.","Use the precise words from this lesson.","Support each claim with evidence: how do we know?"],"caption":"Explain it — to a grown-up or in writing"}}],"practice":[{"q":"According to the book of Exodus, who led the Israelites out of Egypt?","options":["Abraham","Moses","Hammurabi","Ramesses"],"answer":"Moses","hint":"He was raised in Pharaoh's household.","why":"Exodus presents Moses as the leader called by God to bring the Israelites out of slavery in Egypt."},{"q":"Exodus 20:2 begins: 'I am Yahweh your God, who brought you out of…'","options":["Babylon","Ur","the land of Egypt, out of the house of bondage","Haran"],"answer":"the land of Egypt, out of the house of bondage","hint":"Read the passage.","why":"The commandments begin by recalling the escape from slavery in Egypt."},{"q":"Which of these is one of the Ten Commandments in Exodus 20?","options":["An eye for an eye","You shall not give false testimony against your neighbor","If a builder builds a house badly, he shall die","Pay one gold mina"],"answer":"You shall not give false testimony against your neighbor","hint":"Which is addressed to 'you' as an absolute command?","why":"'You shall not give false testimony against your neighbor' is Exodus 20:16. The others come from Hammurabi's code or are invented."},{"q":"What is the difference between a case law and an absolute command?","options":["'If someone does X, penalty Y' versus 'You shall not do X'","There is no difference","Case laws are religious","Commands always name a fine"],"answer":"'If someone does X, penalty Y' versus 'You shall not do X'","hint":"Compare Hammurabi law 196 with 'You shall not murder'.","why":"Hammurabi mostly states cases and penalties. The commandments state duties directly, for everyone."},{"q":"Hammurabi's penalties depended on the victim's rank. How do the Ten Commandments differ?","options":["They also depend on rank","They address every person with the same command, regardless of rank","They apply only to kings","They list prices"],"answer":"They address every person with the same command, regardless of rank","hint":"Look at 'You shall not steal'. Does it mention rank?","why":"The commands are the same for all members of the people. That is a striking contrast with Babylon's rank-based penalties."},{"q":"1 Kings 6:1 puts the Exodus 480 years before Solomon began the temple. If the temple was begun about 966 BC, what date for the Exodus does this suggest?","options":["About 486 BC","About 1446 BC","About 966 BC","About 1250 BC"],"answer":"About 1446 BC","hint":"Going back in time in BC means adding.","why":"966 + 480 = 1446, so about 1446 BC."},{"q":"Why do many scholars favour a date around 1250 BC instead?","options":["Because of the Rosetta Stone","Exodus 1:11 names the city 'Raamses', which suggests the reign of Ramesses II","Because Moses was Greek","Because of Hammurabi's code"],"answer":"Exodus 1:11 names the city 'Raamses', which suggests the reign of Ramesses II","hint":"Which pharaoh's name does the city carry?","why":"A city named for Ramesses points to his time (about 1279–1213 BC), though some argue the name was updated by later writers."},{"q":"What is the Merneptah Stele's importance?","options":["It describes the plagues","It contains the earliest mention of Israel outside the Bible, about 1208 BC","It names Moses","It is the Rosetta Stone"],"answer":"It contains the earliest mention of Israel outside the Bible, about 1208 BC","hint":"Petrie found it in 1896.","why":"It names Israel among peoples Merneptah claims to have crushed, showing a people called Israel in Canaan by about 1208 BC."},{"q":"The Merneptah Stele boasts that Israel was laid waste and left without offspring. Yet Israel clearly survived. What does this show about royal inscriptions?","options":["They exaggerate victories, so their claims must be checked","They are always accurate","Israel did not exist","Merneptah could see the future"],"answer":"They exaggerate victories, so their claims must be checked","hint":"Was Israel really destroyed?","why":"Israel survived for centuries afterwards, so the claim is boastful exaggeration. It still proves Israel existed then: a biased source can contain reliable facts."},{"q":"No Egyptian record mentions the Exodus. Which conclusion follows?","options":["It certainly did not happen","It certainly happened","The silence is weak evidence either way","Egypt kept no records"],"answer":"The silence is weak evidence either way","hint":"Would a pharaoh carve the story of slaves escaping him?","why":"Silence from a source that would not want to record an event tells us little. The question must be decided, as far as it can be, by other evidence."},{"q":"From the suggested early date (about 1446 BC) to the later one (about 1250 BC) is how many years?","type":"number","answer":196,"hint":"Both BC: subtract.","why":"1446 − 1250 = 196 years."},{"q":"Which statement is a matter of faith rather than of historical evidence?","options":["A people called Israel lived in Canaan about 1208 BC","Canaanite workers lived in the Nile Delta","God gave the Law to Moses on Mount Sinai","Ramesses II built a city in the delta"],"answer":"God gave the Law to Moses on Mount Sinai","hint":"Which one could no inscription or excavation settle?","why":"Whether God gave the Law is a faith claim. The others can be examined with inscriptions and archaeology."},{"q":"The traditional site of Mount Sinai is Jebel Musa in the southern Sinai. Why is it labelled 'traditional site'?","options":["The site was fixed by later tradition; others are proposed","It is not a real mountain","It is in Egypt","Moses named it"],"answer":"The site was fixed by later tradition; others are proposed","hint":"How do we know which mountain it was?","why":"The Bible does not give coordinates. Christian tradition fixed the site centuries later, and scholars have proposed other mountains. Honest labelling shows this."},{"q":"Which festival remembers the Exodus?","options":["The Olympic Games","Passover","Saturnalia","The New Year festival of Babylon"],"answer":"Passover","hint":"It is still celebrated by Jewish families every spring.","why":"Passover (Pesach) recalls the night of the Exodus; Jewish families still retell the story at the Seder meal."},{"q":"Why is the commandment 'You shall not give false testimony against your neighbor' important for any system of justice?","options":["Just verdicts depend on truthful witnesses","It is only about manners","It protects kings","It applies only to priests"],"answer":"Just verdicts depend on truthful witnesses","hint":"Recall Hammurabi's law 3 on false accusations.","why":"Justice rests on true evidence. Both Hammurabi's code and the Ten Commandments treat false testimony as a serious wrong."},{gen:HX.G.mapdot(18)},{gen:HX.G.country(18)},{gen:HX.G.span(18)},{gen:HX.G.first(18)},{gen:HX.G.order(18)},{gen:HX.G.century(18)},{gen:HX.G.ago(18)},{gen:HX.G.feature(18)},{gen:HX.G.gap2(18)}],"challenge":[{"q":"Argument: 'Exodus 1:11 names Raamses, so the Exodus happened under Ramesses II.' What would make the argument stronger or weaker?","options":["Nothing could affect it","Weaker if the name was updated; stronger if other details fit","The Rosetta Stone proves it","Ramesses was a common name"],"answer":"Weaker if the name was updated; stronger if other details fit","hint":"Recall 'Ur of the Chaldees' in lesson 12.","why":"Place names can be modernised by later copyists, so one name is suggestive, not decisive. Several independent details fitting the same period would strengthen the case."},{"q":"Using 1 Kings 6:1 and a temple begun about 966 BC, and Exodus 12:40, which says the Israelites lived in Egypt 430 years, in about which year BC would they have entered Egypt?","type":"number","answer":1876,"hint":"Find the Exodus date first, then go 430 years further back.","why":"966 + 480 = 1446 BC for the Exodus. 1446 + 430 = 1876 BC for the entry into Egypt."},{"q":"Which pair of claims is most consistent with all the evidence in this lesson?","options":["Israel existed by 1208 BC; the Exodus date is debated","The Exodus is proven for 1446 BC","No Israel existed before 500 BC","Egyptian records describe the plagues"],"answer":"Israel existed by 1208 BC; the Exodus date is debated","hint":"Check each claim against the Merneptah Stele and the lesson.","why":"The stele establishes Israel's presence by about 1208 BC; the Exodus date remains debated. The other options contradict the evidence."},{"q":"If 600,000 people walked in columns 10 people wide, with 1 metre between rows, how many kilometres long would the column be?","type":"number","answer":60,"hint":"How many rows? Then convert metres to kilometres.","why":"600,000 ÷ 10 = 60,000 rows × 1 m = 60,000 m = 60 km. Calculations like this help historians think about the logistics of ancient accounts."},{gen:HX.G.gap2(18)}],"extend":"Read Exodus chapters 19 and 20 (World English Bible). Then read laws 1–5 and 195–200 of Hammurabi's code. Write a page comparing the two: their form, whom they address, and what each says about equality.","offline":"With your family, write ten rules for a fair home, half as case laws ('If someone…, then…') and half as absolute commands ('Do not…'). Discuss which kind is clearer, and which kind is fairer."},
    {"title":"The Phoenicians and the alphabet","icon":"⛵","learn":[{"say":"The <b>Phoenicians</b> lived in trading cities on the narrow coast of modern Lebanon: <b>Tyre</b>, <b>Sidon</b> and <b>Byblos</b>. Mountains behind them left little farmland, so they turned to the sea. They sold cedar wood to Egypt and Mesopotamia, glass, and a famous purple dye.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 254' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><defs><marker id='a' viewBox='0 0 10 10' refX='7' refY='5' markerWidth='5' markerHeight='5' orient='auto'><path d='M0 0L10 5L0 10Z' fill='context-stroke'/></marker></defs><rect width='600' height='254' fill='#efe4c8'/><path d='M53,133 67,124 95,124 109,110 116,84 122,70 131,60 146,54 158,46 157,30 170,24 185,27 208,19 227,9 242,16 246,31 253,39 268,49 276,56 290,63 299,70 307,74 312,90 308,104 313,104 319,99 326,90 319,79 326,68 336,76 342,72 324,58 313,46 300,45 287,31 282,21 269,12 268,0 269,-7 284,-10 284,-1 294,-4 311,21 331,30 343,39 353,48 353,69 360,79 368,91 373,100 380,115 383,122 390,128 395,124 398,128 394,112 402,115 396,106 403,105 408,110 408,102 400,96 391,92 395,87 400,88 392,76 391,69 395,66 400,72 407,69 406,63 413,61 425,61 432,63 439,66 434,74 434,76 433,82 442,85 442,94 445,99 437,100 446,106 448,116 449,119 457,122 458,125 469,125 486,130 488,121 498,124 510,133 523,131 535,122 547,125 554,125 550,142 551,151 546,166 542,175 540,182 536,193 533,202 526,206 508,205 502,202 492,200 485,202 479,206 462,209 446,205 422,200 408,194 397,185 380,181 361,188 360,202 350,219 338,213 312,205 304,190 278,181 259,176 241,166 253,146 247,137 252,121 244,122 239,115 223,121 214,121 196,118 181,124 156,122 134,127 113,139 94,148 73,146 56,136ZM468,57 456,51 450,37 455,27 463,18 476,-3 488,-22 502,-24 511,-15 510,-6 522,7 534,6 545,0 558,-4 576,7 596,21 619,51 612,58 596,60 580,60 556,55 541,45 520,45 496,57ZM434,74 440,69 450,60 468,59 469,56 472,58 473,63 456,69 440,71 436,75ZM511,225 512,237 523,260 532,284 547,315 566,379 583,403 594,440 606,449 622,472 640,485 641,482 632,440 614,396 589,351 575,311 558,282 542,254 538,248 540,231 539,231 533,254 531,258 522,246ZM53,133 44,127 31,116 13,119 14,97 6,94 13,67 13,45 8,30 24,19 98,24 106,-15 90,-34 66,-51 102,-55 101,-69 122,-70 139,-87 150,-91 168,-103 178,-122 223,-133 223,-157 218,-179 247,-190 247,-216 182,-209 180,-254 -360,-254 -360,448 -84,358 -72,313 -36,261 2,216 4,191 18,175 38,163 49,137ZM372,98 378,99 386,98 395,101 398,104 395,106 388,103 382,100 377,102 372,102Z' fill='#bcd9ef'/><path d='M269,103 281,102 307,100 301,115 301,124 292,119 270,110ZM218,60 235,58 236,85 228,90 221,90 221,66ZM233,30 235,42 230,54 223,49 223,39ZM402,140 412,140 436,145 433,149 416,151 402,145ZM508,149 516,143 535,139 527,149 516,155 509,154ZM394,91 401,90 410,102 415,104 409,103 400,97Z' fill='#efe4c8' stroke='#b9a77c'/><path d='M485,202 492,215 495,223 495,239 490,254 491,260 497,269 506,279 512,282 512,288 511,294 515,312 509,328 499,339 496,346 487,366 485,379 486,386 492,397 502,395 510,390 520,380 527,396 528,408 525,419 510,439 510,478 499,530' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M599,99 603,106 626,114 638,129 639,142 644,155 646,161 653,174 670,187 686,196 689,209' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M586,84 580,104 576,122 588,135 602,144 611,156 628,162 634,170 645,174 653,186 664,205 675,208 689,209 694,216 702,224' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M542,175 522,160 456,155 372,140 306,122 254,116 244,122' fill='none' stroke='#6d28d9' stroke-width='4' stroke-linejoin='round' marker-end='url(#a)'/><path d='M244,122 216,110 156,113 96,128 44,126' fill='none' stroke='#6d28d9' stroke-width='4' stroke-linejoin='round' marker-end='url(#a)'/><circle cx='542' cy='175' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='548' cy='162' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='244' cy='122' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='44' cy='126' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><g font-size='18' font-weight='700' stroke='#fff' stroke-width='4' paint-order='stroke' text-anchor='middle'><text x='288' y='79' fill='#6d28d9'>Phoenician trade routes</text><text x='542' y='199' fill='#1f2937' text-anchor='middle'>Tyre</text><text x='539' y='168' fill='#1f2937' text-anchor='end'>Byblos</text><text x='244' y='146' fill='#1f2937' text-anchor='middle'>Carthage</text><text x='44' y='115' fill='#1f2937' text-anchor='middle'>Gades</text></g></svg>"}},{"say":"Purple dye came from <b>murex</b> sea snails: thousands were needed for a single gram, so purple cloth was worth more than its weight in silver and became the colour of kings. The Greek name Phoenician probably comes from <i>phoinix</i>, the Greek word for this purple-red.","show":{"type":"big","text":"Thousands of snails → one gram of dye","caption":"Why 'royal purple' was so precious"}},{"say":"Phoenicians planted colonies across the Mediterranean, above all <b>Carthage</b>, traditionally founded in 814 BC. Archaeology roughly agrees with that date.","show":HX.tb(...[[["Colony","Modern place","Traditional founding"],["Gades","Cádiz, Spain","About 1100 BC (archaeology suggests later)"],["Utica","Tunisia","About 1100 BC (debated)"],["Carthage","Tunis, Tunisia","814 BC"],["Motya","Sicily, Italy","8th century BC"]]])},{"say":"Their greatest gift was the <b>alphabet</b>: about 22 letters, each standing for one consonant sound, in use by about 1050 BC. Compare that with the hundreds of signs in cuneiform or hieroglyphs. Learning to write no longer needed years of training as a scribe.","show":HX.tb(...[[["Writing system","Number of signs (about)","Who could learn it?"],["Egyptian hieroglyphs","700","Trained scribes"],["Cuneiform","600","Trained scribes"],["Phoenician alphabet","22","Merchants, sailors, anyone"]]])},{"say":"About 800 BC the Greeks borrowed the alphabet and added <b>vowels</b>; through the Etruscans and Romans it reached us. Aleph (ox) and beth (house) became alpha and beta.","show":HX.tb(...[[["Phoenician","Meaning","Greek","Latin / English"],["aleph","ox","alpha (Α)","A"],["beth","house","beta (Β)","B"],["gimel","throwing stick or camel","gamma (Γ)","C, G"],["daleth","door","delta (Δ)","D"]]])},{"say":"Herodotus doubted that the sailors round Africa saw the Sun on their right. Yet south of the Equator a ship sailing west sees the midday Sun on its right, so the detail supports the voyage.","show":{"type":"passage","title":"Herodotus, Histories 4.42 (trans. G. C. Macaulay, 1890)","text":"[…] And they reported a thing which I cannot believe, but another man may, namely that in sailing round Libya they had the sun on their right hand."}},{"say":"<b>Explain it.</b> Why was the alphabet such a powerful invention, and how did it reach us? Then explain why the detail Herodotus doubted actually supports the Phoenician voyage.","show":{"type":"list","items":["Say it in 2–4 complete sentences.","Use the precise words from this lesson.","Support each claim with evidence: how do we know?"],"caption":"Explain it — to a grown-up or in writing"}}],"practice":[{"q":"The Phoenician cities lay mainly in which modern country?","options":["Egypt","Greece","Lebanon","Spain"],"answer":"Lebanon","hint":"Tyre, Sidon and Byblos.","why":"Tyre, Sidon and Byblos are on the coast of modern Lebanon."},{"q":"Why did the Phoenicians turn to the sea?","options":["Mountains left them little farmland, and their coast had good harbours","They were forbidden to farm","Their land was all desert","They had no wood"],"answer":"Mountains left them little farmland, and their coast had good harbours","hint":"Look at their geography.","why":"A narrow coastal strip backed by mountains gave little land to farm, but harbours and cedar forests suited sea trade."},{"q":"What was Phoenician purple dye made from?","options":["Grapes","Murex sea snails","Beetles","Purple flowers"],"answer":"Murex sea snails","hint":"It came from the sea.","why":"Dye was extracted from murex snails; thousands were needed for a gram, which made it very costly."},{"q":"Why did purple become the colour of kings?","options":["It was the cheapest dye","It was extremely costly to make, so only the very rich could wear it","Kings liked snails","It was the only colour available"],"answer":"It was extremely costly to make, so only the very rich could wear it","hint":"Think about how much one gram needed.","why":"Rarity and cost made purple a status symbol, worn by kings and, later, Roman emperors."},{"q":"Which famous city was a Phoenician colony in North Africa?","options":["Alexandria","Carthage","Memphis","Athens"],"answer":"Carthage","hint":"It later fought Rome.","why":"Carthage, traditionally founded in 814 BC from Tyre, became a great power and Rome's rival."},{"q":"Carthage was traditionally founded in 814 BC. Rome destroyed it in 146 BC. How many years did it stand?","type":"number","answer":668,"hint":"Both BC: subtract.","why":"814 − 146 = 668 years."},{"q":"How many letters did the Phoenician alphabet have?","options":["About 700","About 100","About 22","26"],"answer":"About 22","hint":"Far fewer than hieroglyphs.","why":"About 22 letters, all consonants."},{"q":"What did the Phoenician letters stand for?","options":["Whole words","Consonant sounds only","Vowel sounds only","Numbers only"],"answer":"Consonant sounds only","hint":"The Greeks later added something.","why":"Phoenician letters marked consonants. Readers supplied vowels from context, as in Hebrew and Arabic writing."},{"q":"What did the Greeks add to the alphabet?","options":["Pictures","Letters for vowels","Numbers","Punctuation only"],"answer":"Letters for vowels","hint":"They reused letters for sounds Greek needed.","why":"Greeks turned some Phoenician consonant letters they did not need, such as aleph, into vowels: aleph became alpha, A."},{"q":"The word 'alphabet' comes from…","options":["the first two Greek letters, alpha and beta, from Phoenician aleph (ox) and beth (house)","a Latin word meaning book","the name of a Phoenician king","the Egyptian word for writing"],"answer":"the first two Greek letters, alpha and beta, from Phoenician aleph (ox) and beth (house)","hint":"Say the first two Greek letters.","why":"Alpha + beta = alphabet; the letters come from Phoenician aleph and beth."},{"q":"Why did the alphabet spread writing beyond professional scribes?","options":["It was written in gold","About 22 letters could be learned quickly","Kings ordered everyone to learn it","It had no rules"],"answer":"About 22 letters could be learned quickly","hint":"Compare 22 signs with 700.","why":"A small set of sound-letters is far easier to learn than hundreds of signs, so writing became practical for many more people."},{"q":"Put the journey of the alphabet in order.","type":"order","items":["Etruscans and Romans","Greeks","Phoenicians","English"],"answer":["Phoenicians","Greeks","Etruscans and Romans","English"],"hint":"Who added vowels? Who passed it to Rome?","why":"Phoenician alphabet (about 1050 BC) → Greek with vowels (about 800 BC) → Etruscan and Latin → the alphabet used for English today."},{"q":"Herodotus doubted that the sailors had the sun on their right. Why does this detail actually support their story?","options":["It fits real geography south of the Equator, and is unlikely invented","Herodotus disbelieved all true things","The Sun moves randomly","It does not support it"],"answer":"It fits real geography south of the Equator, and is unlikely invented","hint":"Where is the midday Sun when you are south of the Equator?","why":"Below the Equator the midday Sun is to the north. Heading west round the Cape, north is on the right. A detail that seemed absurd to Herodotus but fits the real geography is strong evidence of a true report."},{"q":"Which goods did Phoenicians sell to Egypt and Mesopotamia from their own land?","options":["Silk","Cedar wood","Gold from the mountains of Kush","Papyrus"],"answer":"Cedar wood","hint":"The cedars of Lebanon.","why":"Cedar from Lebanon's mountains was prized for temples, palaces and ships in lands without tall trees."},{"q":"Archaeology finds Carthage settled from the late 9th or 8th century BC; tradition says 814 BC. What should we conclude?","options":["The tradition is roughly supported by archaeology","The tradition is proved exactly right","Carthage was founded in AD 814","Archaeology disproves the tradition"],"answer":"The tradition is roughly supported by archaeology","hint":"Late 9th century BC means about 830–800 BC.","why":"814 BC falls in the late 9th century, so archaeology and tradition roughly agree. Exactness is not proven, so careful writers say 'traditionally 814 BC'."},{gen:HX.G.mapdot(19)},{gen:HX.G.mapdot(19)},{gen:HX.G.country(19)},{gen:HX.G.feature(19)},{gen:HX.G.span(19)},{gen:HX.G.first(19)},{gen:HX.G.order(19)},{gen:HX.G.century(19)},{gen:HX.G.ago(19)}],"challenge":[{"q":"A principle used by historians says that details which embarrass or puzzle the person reporting them are less likely to be invented. Which example from this course best fits it?","options":["Ramesses II's victory claim at Kadesh","The sailors' Sun on their right","Hammurabi's self-praise","Naram-Sin's grand title"],"answer":"The sailors' Sun on their right","hint":"Which detail worked against its reporters' credibility?","why":"The sailors' detail made their story harder to believe, yet they reported it. Invented tales usually avoid such puzzles. The other examples are self-praise."},{"q":"A word is spelled with 4 Phoenician letters chosen from 22, and letters may repeat. How many different 4-letter strings are possible?","type":"number","answer":234256,"hint":"22 choices for each of 4 positions.","why":"22 × 22 × 22 × 22 = 484 × 484 = 234256."},{"q":"Why might an alphabet without vowels still work well for Phoenician, Hebrew or Arabic?","options":["Word roots are carried mainly by consonants","Those languages have no vowels","Vowels were illegal","Readers guessed randomly"],"answer":"Word roots are carried mainly by consonants","hint":"Try reading 'th ct st n th mt'.","why":"In Semitic languages the consonant root carries the core meaning, and a fluent reader fills in vowels easily. Greek, whose roots depend more on vowels, needed vowel letters."},{"q":"If a trading ship sailed about 100 km a day, about how many days would the 3,700 km voyage from Tyre to Gades take, ignoring stops?","type":"number","answer":37,"hint":"Divide.","why":"3,700 ÷ 100 = 37 days."},{gen:HX.G.gap2(19)}],"extend":"Read Herodotus, Histories 4.42–43 (Macaulay translation, Project Gutenberg). Write a paragraph evaluating whether the voyage round Africa happened, listing evidence for, evidence against, and your conclusion with its level of certainty.","offline":"Write a short message to someone using only consonants (as Phoenicians did). Can they read it? Then write it with vowels. Discuss which letters carried the most meaning."},
