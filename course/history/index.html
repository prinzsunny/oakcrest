    if (extra > 0) { const room = ws.map((w, j) => w - minw[j]), rt = room.reduce((x, y) => x + y, 0) || 1; ws = ws.map((w, j) => Math.max(minw[j], Math.floor(w - (extra * room[j]) / rt))); }
    const W1 = Math.max(W0, ws.reduce((x, y) => x + y, 0));
    let y = 0, b = "";
    rows.forEach((r, i) => {
      const cells = r.map((c, j) => wrap(c, Math.max(6, Math.floor((ws[j] - 2 * pad) / CW))));
      const h = Math.max(...cells.map((c) => c.length)) * 25 + 14;

        lines.forEach((ln, k) => (b += Tx(x + ws[j] / 2, y + 8 + (h - 16 - lines.length * 25) / 2 + 20 + k * 25, ln, 20, INK, "middle", i === 0 ? 800 : 600)));
        x += ws[j];
      });
      y += h;
    });
    if (caption) { y += 8; wrap(caption, Math.floor(W1 / 10.7)).forEach((ln) => { b += Tx(W1 / 2, y + 18, ln, 18, GRAY, "middle", 700); y += 23; }); }
    return { type: "svg", markup: Wv(b, Math.ceil(y + 2), W1) };
  }
  function svgList(items, caption) {
    let y = 4, b = "";
    items.forEach((it) => { const lines = wrap(it, 52); b += `<circle cx='14' cy='${y + 13}' r='6' fill='#c2410c'/>`; lines.forEach((ln, k) => (b += Tx(32, y + 19 + k * 23, ln, 18, INK, "start", 600))); y += lines.length * 23 + 12; });

    return { type: "svg", markup: Wv(b, Math.ceil(y + 4)) };
  }
  
  const tb = (rows, c) => svgTable(rows, c), li = (items, c) => svgList(items, c);
  return { tb, li, G, EVENTS, PLACES, FEAT, CITIES, fmt, span, cent, roman, unroman, REG };

  lessons: [
    {"title":"How do we know? Evidence and sources","icon":"🔍","learn":[{"say":"<b>History</b> is the study of the human past, built from evidence. The word comes from the Greek <i>historia</i>, meaning inquiry (asking and investigating). About 2,450 years ago Herodotus opened his book with these words.","show":{"type":"passage","title":"Herodotus, Histories, opening (trans. G. C. Macaulay, 1890)","text":"This is the Showing forth of the Inquiry of Herodotus of Halicarnassos, to the end that neither the deeds of men may be forgotten by lapse of time, nor the works great and marvellous, which have been produced some by Hellenes and some by Barbarians, may lose their renown; and especially that the causes may be remembered for which these waged war with one another."}},{"say":"A <b>primary source</b> was made at the time by people involved: a letter, a law carved in stone, a coin, a skeleton, a diary. A <b>secondary source</b> is written later by someone studying the primary sources, such as a textbook or this lesson.","show":HX.tb(...[[["Source","Primary or secondary?","Why"],["A Roman coin with the emperor's face","Primary","Made at the time"],["A 2020 book about Roman coins","Secondary","Written much later"],["A soldier's letter home from a battle","Primary","Eyewitness, at the time"],["An encyclopedia article on the battle","Secondary","Summarises other sources"]]])},{"say":"Historians separate three kinds of statement. A <b>fact</b> can be checked against evidence; an <b>opinion</b> is a judgement that can be argued; a <b>preference</b> is simply what someone likes.","show":HX.tb(...[[["Statement","Kind"],["The Great Pyramid is about 139 metres tall today.","Fact (can be measured)"],["The pyramids were the greatest achievement of Egypt.","Opinion (a judgement)"],["I like Egyptian art more than Greek art.","Preference (a taste)"]]])},{"say":"A claim earns belief only when it passes five tests. A reason that merely <i>sounds</i> convincing is not enough: the reason must be <b>true</b>, and it must actually <b>support</b> the conclusion.","show":HX.li(...[["1. Is it true? Could it be checked?","2. How do we know? What is the evidence?","3. Is the source reliable? Was the author there? Did they have a reason to slant the story?","4. Do independent sources agree (corroboration)?","5. Does the conclusion really follow from the evidence?"],"The historian's five questions"])},{"say":"<b>Bias</b> is a leaning that makes a source tell one side. A king's monument praises the king; his enemies' records may mock him. A biased source can still contain true facts, so historians read it carefully and compare it with others.","show":{"type":"big","text":"One source = a clue\nTwo independent sources that agree = stronger evidence","caption":"Corroboration: independent sources confirming each other"}},{"say":"A true observation can still fail to support a conclusion: seeing the Sun cross the sky fits a spinning Earth just as well. Change your mind when evidence shows the other view is true, not when someone merely argues well.","show":HX.tb(...[[["Argument","Reason true?","Does it support the conclusion?"],["The Sun moves round the Earth: we see it cross the sky.","Yes","No: a spinning Earth explains the same sight"],["This pot was buried no later than AD 100: it was found sealed under a floor laid in AD 100.","Yes, if the floor is securely dated","Yes: nothing can get under a sealed floor after it is laid"]]])},{"say":"<b>Explain it.</b> What is the difference between a primary and a secondary source, and why should a historian check one source against another before believing a claim?","show":{"type":"list","items":["Say it in 2–4 complete sentences.","Use the precise words from this lesson.","Support each claim with evidence: how do we know?"],"caption":"Explain it — to a grown-up or in writing"}}],"practice":[{"q":"Which of these is a primary source about ancient Egypt?","options":["A modern children's book about pharaohs","A letter written on papyrus by an Egyptian scribe","A documentary film made in 2015","An encyclopedia article on the Nile"],"answer":"A letter written on papyrus by an Egyptian scribe","hint":"Which one was made at the time, by someone living then?","why":"The papyrus letter was written by an ancient Egyptian at the time, so it is primary. The others were made thousands of years later from other sources, so they are secondary."},{"q":"The word history comes from a Greek word meaning…","options":["inquiry (investigation)","story-telling","old things","kings and queens"],"answer":"inquiry (investigation)","hint":"Herodotus called his book his 'Showing forth of the Inquiry'.","why":"Greek historia means inquiry: asking questions and investigating. History is an investigation, not just a collection of stories."},{"q":"“Julius Caesar was killed in 44 BC.” What kind of statement is this?","options":["A fact that can be checked against sources","An opinion","A preference","A legend"],"answer":"A fact that can be checked against sources","hint":"Can evidence show whether it is true or false?","why":"Several independent ancient writers record the date, so it is a checkable fact. Facts can be true or false; we test them against evidence."},{"q":"“Caesar was the most brilliant Roman who ever lived.” What kind of statement is this?","options":["A fact","An opinion","A preference","A primary source"],"answer":"An opinion","hint":"Could two well-informed people reasonably disagree?","why":"'Most brilliant' is a judgement. It can be supported with evidence and argument, but it is not simply checkable like a date, so it is an opinion."},{"q":"“My favourite ancient civilisation is Egypt.” What kind of statement is this?","options":["A fact about Egypt","An opinion about Egypt","A preference","A secondary source"],"answer":"A preference","hint":"Is the speaker claiming something about Egypt, or about what they like?","why":"It reports what the speaker likes. Preferences need no evidence and are not right or wrong; they are tastes."},{"q":"Two ancient writers who never met, and who used different informants, both describe the same flood. What does this give the historian?","options":["Corroboration: stronger evidence that the flood happened","Proof that both writers were biased","A secondary source","Nothing useful, because they agree"],"answer":"Corroboration: stronger evidence that the flood happened","hint":"If two independent witnesses agree, is a mistake by one of them more or less likely to explain the story?","why":"Independent agreement is corroboration. It is unlikely that two independent sources would invent the same event, so the evidence becomes stronger (though still not certain)."},{"q":"A carved monument says a king won every battle he ever fought. Why should a historian be cautious?","options":["Stone carvings are always false","The king paid for the monument and wanted to look glorious","Kings could not read","Monuments are secondary sources"],"answer":"The king paid for the monument and wanted to look glorious","hint":"Who made the monument, and what did they want people to think?","why":"The monument was the king's own publicity, so it is likely biased. It may still contain true details, but its claims of total victory need checking against other evidence, such as his enemies' records."},{"q":"Which is the best definition of bias?","options":["A mistake in arithmetic","A leaning that makes a source favour one side","A source written long after the events","A statement that cannot be checked"],"answer":"A leaning that makes a source favour one side","hint":"Think of a monument written by a king about himself.","why":"Bias is a leaning toward one side. Biased sources are still useful, but must be read with care and compared with others."},{"q":"Is a biased source useless to a historian?","options":["Yes: it must be thrown away","No: it can hold true facts and reveals its author's aims","Yes, unless it is a secondary source","No: biased sources are always true"],"answer":"No: it can hold true facts and reveals its author's aims","hint":"What can a king's boastful inscription still tell us?","why":"Bias does not make every statement false. A boastful inscription still shows the king's name, the places he cared about, and how he wanted to be seen. Historians use it, carefully."},{"q":"Argument: “The Earth is flat, because when I look out across a field the ground looks flat.” What is wrong with it?","options":["The reason is false","The reason is true but does not support the conclusion","Nothing is wrong with it","It is a preference"],"answer":"The reason is true but does not support the conclusion","hint":"Does the observation fit both possibilities equally well?","why":"The observation is true, but a sphere 12,700 km across also looks flat over a short distance, so the observation cannot decide between the two views. A true reason must actually support the conclusion."},{"q":"A diary written by a soldier during a battle in 1916, but first printed as a book in 1990, is…","options":["a secondary source, because it was printed in 1990","a primary source, because it was written by a witness at the time","an opinion","not a source at all"],"answer":"a primary source, because it was written by a witness at the time","hint":"What matters: when the words were written and by whom, or when they were printed?","why":"It is the soldier's own record made at the time, so it is primary. Printing it later does not change who wrote it or when."},{"q":"Which question tests whether a source is reliable?","options":["Is the handwriting neat?","Was the author in a position to know, and did they have a reason to slant the story?","Is the source very old?","Is it written in a language I can read?"],"answer":"Was the author in a position to know, and did they have a reason to slant the story?","hint":"Reliability depends on the author's knowledge and motives.","why":"A reliable source comes from someone who could know the facts and had little reason to distort them. Age, neatness and language do not settle reliability."},{"q":"A friend says, “That claim must be true, because the person who said it is very confident and speaks well.” The best reply is…","options":["“Confidence shows truth.”","“Confidence is not evidence. What is the evidence?”","“All claims are just opinions.”","“We can never know anything.”"],"answer":"“Confidence is not evidence. What is the evidence?”","hint":"Which of the five questions does this skip?","why":"How persuasive a speaker sounds tells us nothing about whether the claim is true. We ask for evidence and check that it actually supports the conclusion."},{"q":"Which of these is evidence, not a conclusion?","options":["Therefore the city was abandoned","A layer of ash covers every house in the city","The people must have been unhappy","So the gods were angry"],"answer":"A layer of ash covers every house in the city","hint":"Evidence is something observed; a conclusion is what we infer from it.","why":"The ash layer is something archaeologists can see and measure. The other statements are inferences (conclusions) that need evidence like the ash layer to support them."},{"q":"Historians find an ash layer over a whole ancient city. Which conclusion does this evidence support best?","options":["The city's king was cruel","A great fire or volcanic eruption covered the city","The city was very rich","The people spoke Greek"],"answer":"A great fire or volcanic eruption covered the city","hint":"Which conclusion is actually about ash?","why":"Ash is produced by fire or volcanoes, so this conclusion follows from the evidence. The other conclusions may be true but the ash says nothing about them."},{"q":"A historian changes her mind about when a city was founded. Which is the right reason to change it?","options":["A famous professor argued loudly for a new date","New, carefully dated evidence was found that shows the old date was wrong","The new date is more exciting","Most of her friends prefer the new date"],"answer":"New, carefully dated evidence was found that shows the old date was wrong","hint":"What should move a careful thinker: popularity, or evidence?","why":"We change our minds when evidence and sound reasoning show the other view is true. Loudness, excitement and popularity are not evidence."},{"q":"Put the steps of a historian's investigation in a sensible order.","type":"order","items":["Compare the sources","Find and test sources","Ask a question","Conclude from the evidence"],"answer":["Ask a question","Find and test sources","Compare the sources","Conclude from the evidence"],"hint":"You cannot conclude before you have checked the evidence.","why":"Question → find and test sources → compare (corroborate) → conclusion. The conclusion comes last, and only as far as the evidence reaches."},{gen:HX.G.span(1)},{gen:HX.G.span(1)},{gen:HX.G.first(1)},{gen:HX.G.first(1)},{gen:HX.G.order(1)},{gen:HX.G.century(1)},{gen:HX.G.ago(1)}],"challenge":[{"q":"Two sources describe a battle. Source A was written by a general who fought in it, 3 years later. Source B was written by a scholar 300 years later who had read five earlier accounts, including A. Which statement is the most careful?","options":["A is always better because it is primary","B is always better because it used more sources","Each has strengths and possible bias; judge each on its merits","Neither can tell us anything"],"answer":"Each has strengths and possible bias; judge each on its merits","hint":"Being primary is not the same as being reliable.","why":"Primary sources give closeness to the events; secondary sources can compare many accounts. Neither type is automatically reliable. A historian asks, for each one, what the author could know and what they wanted."},{"q":"Argument: “All ancient kings boasted. This inscription boasts. Therefore a king wrote this inscription.” Is the reasoning sound?","options":["Yes: both reasons are true","No: others boast too, so the conclusion does not follow","Yes: inscriptions are primary sources","No: kings never boasted"],"answer":"No: others boast too, so the conclusion does not follow","hint":"Does the conclusion follow, even if every reason is true?","why":"The premises say kings boast, not that only kings boast. Generals, governors and merchants also boasted. The conclusion does not follow, so the argument fails even with true premises."},{"q":"Three independent sources mention a festival. Two give the year as 480 BC; one, written by someone with a family feud against the festival's organiser, says 470 BC and calls it a disaster. What should a historian conclude?","options":["It happened, probably in 480 BC; treat the biased third source with caution","It never happened, because the sources disagree","The odd source must be right","It was 475 BC, the average"],"answer":"It happened, probably in 480 BC; treat the biased third source with caution","hint":"Where do the sources agree, and which source has a reason to slant its account?","why":"All three agree the festival happened, which is strong corroboration. Two independent sources agree on 480 BC. The third has a known bias, so its date and its negative judgement need further evidence. Averaging dates has no logical basis."},{"q":"Which of these claims could never be settled by historical evidence?","options":["Whether a city wall was built before or after a temple","Whether a king really ruled for 30 years","Whether purple is a nicer colour than green","How many people lived in a town"],"answer":"Whether purple is a nicer colour than green","hint":"Which one is a preference?","why":"The first three are factual questions that evidence can help answer. Whether purple is nicer than green is a preference, which evidence cannot settle."},{"q":"A historian has 12 sources about an event. One quarter of them are primary. Of the primary sources, two were written by people known to be biased. How many primary sources were written by authors not known to be biased?","type":"number","answer":1,"hint":"First find one quarter of 12.","why":"One quarter of 12 is 3 primary sources. 3 − 2 biased = 1 primary source by an author not known to be biased."},{gen:HX.G.gap2(1)}],"extend":"Read the opening chapter of a history book you own and list five statements from it. Label each one fact, opinion or preference, and for each fact, say what kind of evidence could check it.","offline":"Be a historian of your own family: interview a grandparent or parent about one event from their childhood. Then find one object or photograph (a primary source) that supports part of their story. Does it confirm the account, or raise a new question?"},

BC?","options":["300 BC","200 BC","They are the same year"],"answer":"300 BC","hint":"BC years count down toward AD 1. Which is further from AD 1?","why":"BC numbers count down, so 300 BC is 100 years before 200 BC."},{"q":"How many years passed from 500 BC to 200 BC?","type":"number","answer":300,"hint":"Both are BC. Subtract the smaller number from the larger.","why":"500 − 200 = 300 years."},{"q":"How many years passed from 30 BC to AD 30?","type":"number","answer":59,"hint":"Add the two numbers, then subtract 1 for the missing year 0.","why":"30 + 30 = 60, minus 1 because there is no year 0: 59 years."},{"q":"Rome was founded, according to legend, in 753 BC, and the Republic began in 509 BC. How many years apart are these dates?","type":"number","answer":244,"hint":"Both BC: subtract.","why":"753 − 509 = 244 years."},{"q":"In which century is AD 1066?","options":["10th century","11th century","16th century","1st century"],"answer":"11th century","hint":"Years 1001 to 1100 form which century?","why":"AD 1001–1100 is the 11th century. The century number is one more than the hundreds part (10 + 1 = 11)."},{"q":"Which years make up the 4th century BC?","options":["300 BC – 201 BC","400 BC – 301 BC","499 BC – 400 BC","AD 301 – AD 400"],"answer":"400 BC – 301 BC","hint":"The 1st century BC is 100 BC to 1 BC. Count back.","why":"1st century BC: 100–1 BC; 2nd: 200–101 BC; 3rd: 300–201 BC; 4th: 400–301 BC."},{"q":"What does AD stand for?","options":["After Death","Anno Domini: 'in the year of the Lord'","Ancient Date","After Dionysius"],"answer":"Anno Domini: 'in the year of the Lord'","hint":"It is Latin.","why":"AD abbreviates the Latin anno Domini, in the year of the Lord. 'After Death' is a common error: it would leave Jesus's lifetime unnumbered."},{"q":"A book writes 480 BCE. Which date is this in BC/AD?","options":["AD 480","480 BC","520 BC","48 BC"],"answer":"480 BC","hint":"BCE and BC use the same numbers.","why":"BCE (Before the Common Era) uses the same numbering as BC, so 480 BCE is 480 BC."},{"q":"Why does the AD system have no year zero?","options":["Someone forgot it by mistake in 1900","It was devised in AD 525, counting from 1 in Roman numerals","Year zero was thought unlucky","The Romans banned zero by law"],"answer":"It was devised in AD 525, counting from 1 in Roman numerals","hint":"What number system did Europeans use in AD 525?","why":"Dionysius Exiguus counted years from 1, as was normal with Roman numerals, which have no symbol for zero. The idea of zero as a number reached Europe much later."},{"q":"A Roman was born in 10 BC. In which year AD did he have his 30th birthday? Type the year number.","type":"number","answer":21,"hint":"Count 10 years to reach AD 1 (no year 0), then 20 more.","why":"From 10 BC, 10 years takes you to AD 1 (10 BC → 1 BC is 9 years, then 1 more to AD 1). The remaining 20 years reach AD 21."},{"q":"Put these in order, earliest first.","type":"order","items":["Caesar killed (44 BC)","First Olympics (776 BC)","Great Pyramid (about 2560 BC)","Last Western emperor (AD 476)"],"answer":["Great Pyramid (about 2560 BC)","First Olympics (776 BC)","Caesar killed (44 BC)","Last Western emperor (AD 476)"],"hint":"BC dates with bigger numbers are earlier; AD dates come after all BC dates.","why":"2560 BC → 776 BC → 44 BC → AD 476."},{"q":"What does 'c. 1200 BC' mean?","options":["Exactly 1200 BC","About 1200 BC","The century 1200 BC","1200 years ago"],"answer":"About 1200 BC","hint":"c. is short for a Latin word.","why":"c. stands for circa, around. It marks a date as approximate."},{"q":"Exactly halfway between 400 BC and 200 BC is which year BC? Type the number.","type":"number","answer":300,"hint":"How many years apart are they? Go half that far from either end.","why":"They are 200 years apart. Halfway is 100 years from each: 300 BC."},{"q":"Which date falls in the 1st century BC?","options":["44 BC","146 BC","AD 14","AD 79"],"answer":"44 BC","hint":"The 1st century BC runs from 100 BC to 1 BC.","why":"44 BC lies between 100 BC and 1 BC. 146 BC is in the 2nd century BC; AD 14 and AD 79 are in the 1st century AD."},{"q":"How many years are there in three millennia?","type":"number","answer":3000,"hint":"One millennium is 1,000 years.","why":"3 × 1,000 = 3000 years."},{"q":"Claim: 'Cleopatra lived closer in time to the Moon landing than to the building of the Great Pyramid.' Using about 2560 BC, 30 BC and AD 1969, is the claim true?","options":["True: 2,530 years separate her from the pyramid but only 1,998 from the Moon landing","False: she was closer to the pyramid","It cannot be checked","It is an opinion"],"answer":"True: 2,530 years separate her from the pyramid but only 1,998 from the Moon landing","hint":"Compute both gaps; remember there is no year 0 when crossing into AD.","why":"2560 − 30 = 2,530 years. From 30 BC to AD 1969 is 30 + 1969 − 1 = 1,998 years. 1,998 is less than 2,530, so the claim is true: a surprising fact, checked by arithmetic."},{gen:HX.G.span(2)},{gen:HX.G.span(2)},{gen:HX.G.first(2)},{gen:HX.G.order(2)},{gen:HX.G.century(2)},{gen:HX.G.century(2)},{gen:HX.G.ago(2)}],"challenge":[{"q":"Augustus was born on 23 September 63 BC and died on 19 August AD 14. How old was he when he died?","type":"number","answer":75,"hint":"Count years from his birth to the same date in AD 14, remembering no year 0. Had he reached his birthday that year?","why":"From 23 September 63 BC to 23 September AD 14 is 63 + 14 − 1 = 76 years. He died in August, a month before that birthday, so he was 75."},{"q":"A timeline uses 1 cm for every 100 years. To the nearest whole centimetre, how long is the stretch from 2560 BC to AD 1940?","type":"number","answer":45,"hint":"Find the years first (crossing BC to AD), then divide by 100.","why":"2560 + 1940 − 1 = 4,499 years. 4,499 ÷ 100 = 44.99 cm, which is 45 cm to the nearest centimetre."},{"q":"Which statement is exactly correct?","options":["The 1st century BC runs from 1 BC to 100 BC","The 1st century BC runs from 100 BC to 1 BC","The 1st century BC includes year 0","The 1st centuries BC and AD overlap"],"answer":"The 1st century BC runs from 100 BC to 1 BC","hint":"Which year of the century comes first in time?","why":"BC years count down, so the century's first year in time is 100 BC and its last is 1 BC. There is no year 0, and the two centuries do not overlap."},{"q":"Herodotus was born about 484 BC. Someone claims he wrote 'about 2,450 years ago'. If he wrote around 430 BC, how many years before AD 2026 is that?","type":"number","answer":2455,"hint":"Add the BC number and the AD number, then subtract 1.","why":"430 + 2026 − 1 = 2455 years. So 'about 2,450 years ago' is a fair approximation."},{"q":"A historian says an event happened 'in the 3rd millennium BC'. That millennium runs from 3000 BC down to which year BC? Type the number.","type":"number","answer":2001,"hint":"The 1st millennium BC is 1000 BC to 1 BC.","why":"1st millennium BC: 1000–1 BC; 2nd: 2000–1001 BC; 3rd: 3000–2001 BC."},{gen:HX.G.gap2(2)}],"extend":"Make a scaled timeline 2 metres long from 3000 BC to AD 2000 on a roll of paper (1 cm = 25 years). Mark at least ten events from this course as you meet them, each with its date and 'about' where the date is uncertain.","offline":"Ask three family members their birth years and the birth years of their grandparents. Work out every gap in years, and find who was born in which century."},

='18' font-weight='700'><path d='M14 252h92' stroke='#1f2937' stroke-width='4'/><text x='14' y='244' fill='#1f2937' stroke='#fff' stroke-width='4' paint-order='stroke'>1000 km</text></g></svg>"}},{"say":"Latitude affects <b>climate</b>, the usual weather over many years. Mediterranean lands have hot dry summers and mild wet winters; great deserts lie roughly between 15° and 30° north.","show":HX.tb(...[[["Place","Latitude","Climate"],["Athens","38°N","Mediterranean: hot dry summer, mild wet winter"],["Aswan, Egypt","24°N","Desert: almost no rain"],["Babylon","33°N","Hot desert, watered by the Euphrates"],["Beijing","40°N","Cold winters, hot wet summers"]]])},{"say":"<b>Explain it.</b> How do latitude and longitude pin down a place, and why did early civilisations grow beside rivers? Give one example.","show":{"type":"list","items":["Say it in 2–4 complete sentences.","Use the precise words from this lesson.","Support each claim with evidence: how do we know?"],"caption":"Explain it — to a grown-up or in writing"}}],"practice":[{"q":"Which line is 0° latitude?","options":["The Prime Meridian","The Equator","The Tropic of Cancer","The Arctic Circle"],"answer":"The Equator","hint":"Latitude measures distance north or south of what line?","why":"Latitude is measured from the Equator, which is 0°."},{"q":"The Prime Meridian (0° longitude) passes through…","options":["Rome","Cairo","Greenwich, London","Athens"],"answer":"Greenwich, London","hint":"It was fixed by an international conference in 1884.","why":"An international agreement in 1884 placed 0° longitude through the Royal Observatory at Greenwich, London."},{"q":"What is the greatest possible latitude, in degrees?","type":"number","answer":90,"hint":"Where is the farthest point north of the Equator?","why":"The North Pole is 90°N and the South Pole is 90°S, so 90 is the maximum."},{"q":"What is the greatest possible longitude, in degrees east or west?","type":"number","answer":180,"hint":"East and west meet on the opposite side of the world from Greenwich.","why":"Longitude runs 0° to 180° east and 0° to 180° west; 180° is the line opposite Greenwich."},{"q":"Earth's circumference is about 40,000 km. Divide by 360 degrees. To the nearest whole kilometre, how long is one degree?","type":"number","answer":111,"hint":"40,000 ÷ 360: try 360 × 111.","why":"360 × 111 = 39,960, close to 40,000. 40,000 ÷ 360 = 111.1, so about 111 km."},{"q":"Land almost surrounded by water, like Italy or Greece, is a…","options":["delta","peninsula","strait","plateau"],"answer":"peninsula","hint":"Paene insula is Latin for 'almost an island'.","why":"A peninsula is land almost surrounded by water; the word comes from Latin paene insula, almost an island."},{"q":"The Strait of Gibraltar joins which two bodies of water?","options":["The Mediterranean Sea and the Atlantic Ocean","The Red Sea and the Mediterranean","The Black Sea and the Aegean","The Persian Gulf and the Indian Ocean"],"answer":"The Mediterranean Sea and the Atlantic Ocean","hint":"It lies between Spain and Morocco.","why":"The Strait of Gibraltar, about 14 km wide at its narrowest, connects the Mediterranean with the Atlantic."},{"q":"A fan-shaped area of land where a river splits into channels before reaching the sea is a…","options":["delta","gulf","isthmus","cataract"],"answer":"delta","hint":"The Nile has a famous one in the north of Egypt.","why":"That is a delta, named after the triangular Greek letter Δ (delta)."},{"q":"A narrow strip of land joining two larger areas of land is an…","options":["island","isthmus","estuary","archipelago"],"answer":"isthmus","hint":"The Isthmus of Corinth joins the Peloponnese to mainland Greece.","why":"An isthmus is a land bridge, such as the Isthmus of Corinth or the Isthmus of Panama."},{"q":"Why did the first cities grow beside rivers?","options":["Rivers kept enemies away completely","Rivers provided water, fertile soil and easy transport","Rivers were cooler than anywhere else","Rivers were sacred to everyone"],"answer":"Rivers provided water, fertile soil and easy transport","hint":"What do farmers and traders need most?","why":"Rivers supplied drinking and irrigation water, rich silt for crops, fish, and a highway for boats. Those advantages supported large populations."},{"q":"A Mediterranean climate has…","options":["cold snowy summers and hot winters","hot, dry summers and mild, wet winters","rain every day of the year","no seasons at all"],"answer":"hot, dry summers and mild, wet winters","hint":"Think of olive groves in Greece.","why":"Mediterranean lands have hot, dry summers and mild, rainy winters, ideal for olives, grapes and wheat."},{"q":"Which of these is a fact rather than an opinion?","options":["Greece has the most beautiful coast in the world","Greece lies north of Egypt","Deserts are boring places","Maps are more fun than timelines"],"answer":"Greece lies north of Egypt","hint":"Which one could be checked on a map?","why":"'Greece lies north of Egypt' can be checked with latitudes (about 38°N against about 27°N). The others are opinions or preferences."},{"q":"On a map, 1 cm stands for 50 km. Two cities are 7 cm apart on the map. How many kilometres apart are they really?","type":"number","answer":350,"hint":"Multiply the map distance by the scale.","why":"7 × 50 = 350 km."},{"q":"Rome is at about 42°N and Athens at about 38°N. Which statement follows?","options":["Athens is north of Rome","Rome is north of Athens","They are on the same latitude","Rome is east of Athens"],"answer":"Rome is north of Athens","hint":"Larger north latitude means farther north.","why":"42° is farther from the Equator than 38°, so Rome lies north of Athens. (Latitude alone says nothing about east or west.)"},{"q":"The Nile flows into which sea?","options":["The Red Sea","The Mediterranean Sea","The Black Sea","The Persian Gulf"],"answer":"The Mediterranean Sea","hint":"Look at the map: where is the Nile Delta?","why":"The Nile flows north and empties into the Mediterranean through its delta."},{gen:HX.G.latlon(3)},{gen:HX.G.latlon(3)},{gen:HX.G.latlon(3)},{gen:HX.G.hemi(3)},{gen:HX.G.hemi(3)},{gen:HX.G.degkm(3)},{gen:HX.G.degkm(3)},{gen:HX.G.span(3)},{gen:HX.G.first(3)}],"challenge":[{"q":"Earth turns 360° in 24 hours. How many degrees of longitude does the Sun appear to cross in one hour?","type":"number","answer":15,"hint":"Divide 360 by 24.","why":"360 ÷ 24 = 15 degrees per hour. That is why time zones are roughly 15° wide."},{"q":"Using 15° per hour, a city 45° east of another sees noon how many hours earlier?","type":"number","answer":3,"hint":"How many 15° steps make 45°?","why":"45 ÷ 15 = 3 hours. Places to the east turn toward the Sun first, so their noon comes 3 hours earlier."},{"q":"Why are degrees of longitude shorter near the poles than at the Equator?","options":["Earth is wider at the poles","Lines of longitude meet at the poles","Longitude is measured in kilometres","Maps are drawn badly near the poles"],"answer":"Lines of longitude meet at the poles","hint":"Picture the lines of longitude on a globe, like segments of an orange.","why":"Meridians run from pole to pole and meet there, so the distance between them shrinks from about 111 km per degree at the Equator to 0 at the poles. At 60° latitude a degree of longitude is only about half as long."},{"q":"Which pair of cities lie at almost the same latitude?","options":["Rome and Cairo","Rome and Chicago","Rome and Oslo","Rome and Lima"],"answer":"Rome and Chicago","hint":"Rome is at about 42°N.","why":"Chicago is also at about 42°N. Cairo is near 30°N, Oslo near 60°N and Lima at 12°S."},{"q":"Alexandria is at about 31°N and Aswan at about 24°N, almost due south. Using 111 km per degree, about how many kilometres apart are they north to south?","type":"number","answer":777,"hint":"Find the difference in degrees first.","why":"31 − 24 = 7 degrees. 7 × 111 = 777 km."},{gen:HX.G.gap2(3)}],"extend":"With a globe or an atlas, find the latitude and longitude of ten cities from this course (Cairo, Baghdad, Athens, Rome, Jerusalem, Tehran, Xi'an, Mexico City, Lima, Tunis). Which ones are within 5° of the same latitude? What do their climates have in common?","offline":"Draw a map of your street or garden to scale (for example 1 cm = 1 m), with a compass rose showing north, a key for symbols, and a scale bar. Use the Sun at midday or a compass to find north."},
    {"title":"Archaeology: reading the ground","icon":"⛏️","learn":[{"say":"<b>Archaeology</b> studies the past through physical remains: <b>artefacts</b>, <b>features</b> and <b>ecofacts</b>. For the long ages before writing, it is almost our only evidence.","show":HX.tb(...[[["Kind of evidence","Examples","What it can tell us"],["Artefact","Pot, coin, arrowhead","Skills, trade, dates"],["Feature","Wall, hearth, grave","How space was used"],["Ecofact","Seeds, bones, pollen","Diet, farming, climate"]]])},{"say":"Layers of earth build up over time. The <b>law of superposition</b> says that, unless the ground has been disturbed, lower layers are older than higher ones. Reading layers is called <b>stratigraphy</b>.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><rect x='90' y='30' width='490' height='54' fill='#e9d8a6' stroke='#5c4033'/><text x='335' y='64' font-size='19' fill='#1f2937' text-anchor='middle' font-weight='700'>Topsoil: modern rubbish</text><rect x='90' y='84' width='490' height='54' fill='#d4a373' stroke='#5c4033'/><text x='335' y='118' font-size='19' fill='#1f2937' text-anchor='middle' font-weight='700'>Roman floor with a coin of AD 79</text><rect x='90' y='138' width='490' height='54' fill='#b08968' stroke='#5c4033'/><text x='335' y='172' font-size='19' fill='#1f2937' text-anchor='middle' font-weight='700'>Burnt layer: ash and charcoal</text><rect x='90' y='192' width='490' height='54' fill='#9c6644' stroke='#5c4033'/><text x='335' y='226' font-size='19' fill='#fff' text-anchor='middle' font-weight='700'>Iron Age hut post-holes</text><rect x='90' y='246' width='490' height='54' fill='#7f5539' stroke='#5c4033'/><text x='335' y='280' font-size='19' fill='#fff' text-anchor='middle' font-weight='700'>Stone tools, no pottery</text><text x='10' y='50' font-size='18' fill='#4b5563' text-anchor='start' font-weight='700'>newer</text><path d='M40 66V270' stroke='#4b5563' stroke-width='3'/><path d='M32 260l8 14 8-14z' fill='#4b5563'/><text x='10' y='304' font-size='18' fill='#4b5563' text-anchor='start' font-weight='700'>older</text></svg>"}},{"say":"Stratigraphy gives <b>relative dates</b> (older or younger than). A dated object gives a limit: a layer containing a coin minted in AD 79 cannot have formed before AD 79. Archaeologists call that the <i>terminus post quem</i>, Latin for 'the limit after which'.","show":{"type":"big","text":"Coin minted AD 79 in a layer\n→ the layer formed in AD 79 or later","caption":"Terminus post quem"}},{"say":"<b>Radiocarbon dating</b> dates once-living things. After death their carbon-14 halves about every <b>5,730 years</b>, so the amount left shows the age, back to about 50,000 years.","show":{"type":"bars","values":[["0 yrs",100],["5,730",50],["11,460",25],["17,190",13],["22,920",6]],"caption":"Percent of carbon-14 left (rounded)"}},{"say":"Other clocks include tree rings, pottery styles and dated coins. Dates are strongest when independent methods agree.","show":HX.tb(...[[["Method","Works on","Range"],["Radiocarbon","Bone, wood, seeds, cloth","About 50,000 years"],["Tree rings","Wooden beams","Over 12,000 years in some regions"],["Coins and inscriptions","Dated objects","Since about 600 BC"],["Pottery styles","Broken pots","Where sequences are known"]]])},{"say":"The Iceman, found in the Alps in 1991, lived about 3300 BC and was thought to have died of cold. In 2001 an X-ray revealed an arrowhead in his shoulder: hold conclusions only as firmly as the evidence allows.","show":{"type":"big","text":"1991: died of cold?\n2001 X-ray: arrowhead in the shoulder","caption":"New evidence, new conclusion"}},{"say":"<b>Explain it.</b> How do archaeologists date a layer of earth, and why might they change a conclusion? Use superposition, radiocarbon or the Iceman in your answer.","show":{"type":"list","items":["Say it in 2–4 complete sentences.","Use the precise words from this lesson.","Support each claim with evidence: how do we know?"],"caption":"Explain it — to a grown-up or in writing"}}],"practice":[{"q":"Which of these is an artefact?","options":["A bronze coin","A burnt hearth built into a floor","Wheat seeds","A layer of river mud"],"answer":"A bronze coin","hint":"An artefact is a portable object made by people.","why":"A coin is a made, movable object, so it is an artefact. A hearth is a feature, seeds are ecofacts, and river mud is natural."},{"q":"According to the law of superposition, in undisturbed ground…","options":["lower layers are older than higher layers","higher layers are older than lower layers","all layers are the same age","layers have no order"],"answer":"lower layers are older than higher layers","hint":"Which layer had to be there first for the next to settle on top?","why":"Each layer settles on top of the one before, so the deepest layer is the oldest."},{"q":"Look at the cross-section. Which layer is oldest?","options":["Topsoil","Roman floor","Burnt layer","Stone tools, no pottery"],"answer":"Stone tools, no pottery","hint":"Superposition: which is lowest?","why":"The stone-tool layer is at the bottom, so, if undisturbed, it is the oldest.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><rect x='90' y='30' width='490' height='54' fill='#e9d8a6' stroke='#5c4033'/><text x='335' y='64' font-size='19' fill='#1f2937' text-anchor='middle' font-weight='700'>Topsoil: modern rubbish</text><rect x='90' y='84' width='490' height='54' fill='#d4a373' stroke='#5c4033'/><text x='335' y='118' font-size='19' fill='#1f2937' text-anchor='middle' font-weight='700'>Roman floor with a coin of AD 79</text><rect x='90' y='138' width='490' height='54' fill='#b08968' stroke='#5c4033'/><text x='335' y='172' font-size='19' fill='#1f2937' text-anchor='middle' font-weight='700'>Burnt layer: ash and charcoal</text><rect x='90' y='192' width='490' height='54' fill='#9c6644' stroke='#5c4033'/><text x='335' y='226' font-size='19' fill='#fff' text-anchor='middle' font-weight='700'>Iron Age hut post-holes</text><rect x='90' y='246' width='490' height='54' fill='#7f5539' stroke='#5c4033'/><text x='335' y='280' font-size='19' fill='#fff' text-anchor='middle' font-weight='700'>Stone tools, no pottery</text><text x='10' y='50' font-size='18' fill='#4b5563' text-anchor='start' font-weight='700'>newer</text><path d='M40 66V270' stroke='#4b5563' stroke-width='3'/><path d='M32 260l8 14 8-14z' fill='#4b5563'/><text x='10' y='304' font-size='18' fill='#4b5563' text-anchor='start' font-weight='700'>older</text></svg>"}},{"q":"In the cross-section, the burnt layer lies under the Roman floor with a coin of AD 79. What can you conclude about the burnt layer?","options":["It formed after AD 79","It formed before the Roman floor was laid","It is from AD 79 exactly","It is modern"],"answer":"It formed before the Roman floor was laid","hint":"What does lying underneath tell you?","why":"It lies below the floor, so it formed before the floor was laid. The coin dates the floor (AD 79 or later), not the layer beneath.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><rect x='90' y='30' width='490' height='54' fill='#e9d8a6' stroke='#5c4033'/><text x='335' y='64' font-size='19' fill='#1f2937' text-anchor='middle' font-weight='700'>Topsoil: modern rubbish</text><rect x='90' y='84' width='490' height='54' fill='#d4a373' stroke='#5c4033'/><text x='335' y='118' font-size='19' fill='#1f2937' text-anchor='middle' font-weight='700'>Roman floor with a coin of AD 79</text><rect x='90' y='138' width='490' height='54' fill='#b08968' stroke='#5c4033'/><text x='335' y='172' font-size='19' fill='#1f2937' text-anchor='middle' font-weight='700'>Burnt layer: ash and charcoal</text><rect x='90' y='192' width='490' height='54' fill='#9c6644' stroke='#5c4033'/><text x='335' y='226' font-size='19' fill='#fff' text-anchor='middle' font-weight='700'>Iron Age hut post-holes</text><rect x='90' y='246' width='490' height='54' fill='#7f5539' stroke='#5c4033'/><text x='335' y='280' font-size='19' fill='#fff' text-anchor='middle' font-weight='700'>Stone tools, no pottery</text><text x='10' y='50' font-size='18' fill='#4b5563' text-anchor='start' font-weight='700'>newer</text><path d='M40 66V270' stroke='#4b5563' stroke-width='3'/><path d='M32 260l8 14 8-14z' fill='#4b5563'/><text x='10' y='304' font-size='18' fill='#4b5563' text-anchor='start' font-weight='700'>older</text></svg>"}},{"q":"Carbon-14's half-life is about 5,730 years. How many years make two half-lives?","type":"number","answer":11460,"hint":"Double 5,730.","why":"2 × 5,730 = 11460 years, after which about 25% of the carbon-14 remains."},{"q":"Radiocarbon dating can date which of these?","options":["A gold ring","A wooden spear shaft","A stone axe head","A clay brick with no plant material"],"answer":"A wooden spear shaft","hint":"The method needs something that was once alive.","why":"Only once-living material contains carbon-14 taken in during life. Wood qualifies; gold, stone and plain fired clay do not."},{"q":"A layer contains a coin minted in AD 79. Which statement must be true?","options":["The layer formed exactly in AD 79","The layer formed in AD 79 or later","The layer formed before AD 79","The coin is a fake"],"answer":"The layer formed in AD 79 or later","hint":"Could the coin be dropped into ground that had already been sealed?","why":"A coin cannot be in a layer before it existed, so the layer formed in AD 79 or later. It might be much later: coins stay in use for years."},{"q":"Dendrochronology dates wood by…","options":["matching patterns of thick and thin tree rings","measuring how heavy the wood is","counting nails in a beam","tasting the wood"],"answer":"matching patterns of thick and thin tree rings","hint":"Wet years make wide rings; dry years make narrow ones.","why":"Ring widths vary with yearly weather, making patterns that can be matched across trees back thousands of years."},{"q":"Why are dates stronger when radiocarbon and tree rings agree?","options":["Because two is always better than one","Because two independent methods are unlikely to make the same error","Because tree rings are always wrong","Because radiocarbon is an opinion"],"answer":"Because two independent methods are unlikely to make the same error","hint":"This is the archaeologist's form of corroboration.","why":"Independent methods have different weaknesses. When they agree, an error in one is unlikely to explain the result."},{"q":"The Iceman was first thought to have died of cold. What changed historians' minds?","options":["A famous expert's opinion","An X-ray in 2001 showed an arrowhead in his shoulder","A vote of archaeologists","A legend from the Alps"],"answer":"An X-ray in 2001 showed an arrowhead in his shoulder","hint":"What kind of thing should change a conclusion?","why":"New physical evidence, the arrowhead seen on an X-ray, showed he had been shot. Evidence, not authority or popularity, changed the conclusion."},{"q":"Why do archaeologists record exactly where every object was found?","options":["To make the dig take longer","An object's context is evidence, and digging destroys it","Labelled objects sell for more","The law of superposition requires it"],"answer":"An object's context is evidence, and digging destroys it","hint":"Once an object is lifted out, can its original position be recovered?","why":"Excavation destroys the layers it studies. Without careful records, the context that dates and explains an object is lost for ever. That is also why looting is so harmful."},{"q":"Which is an ecofact?","options":["A clay lamp","A stone wall","Charred barley grains","A bronze sword"],"answer":"Charred barley grains","hint":"Ecofacts are natural remains that show how people lived.","why":"Charred grains are natural remains that tell us about diet and farming, so they are ecofacts."},{"q":"A bone has 25% of its carbon-14 left. Using a half-life of 5,730 years, about how many years ago did the animal die?","type":"number","answer":11460,"hint":"How many halvings take 100% to 25%?","why":"100% → 50% → 25% is 2 half-lives. 2 × 5,730 = 11460 years."},{"q":"A hearth, a fireplace built into a floor, is best described as…","options":["an artefact","a feature","an ecofact","a secondary source"],"answer":"a feature","hint":"Can you carry it to a museum without destroying it?","why":"A hearth is part of the site and cannot be moved intact, so it is a feature."},{"q":"Why is looting (digging up objects secretly to sell them) so harmful to history, even if the objects end up in a museum?","options":["It is harmless if objects survive","Objects lose their context: where, when and with what they lay","Looted objects are always fakes","Museums cannot display them"],"answer":"Objects lose their context: where, when and with what they lay","hint":"What evidence is destroyed when an object is pulled out without records?","why":"An object's layer, position and neighbours date it and explain its use. Looters destroy that context for ever, so even a beautiful object loses most of its value as evidence."},{gen:HX.G.halflife(4)},{gen:HX.G.halflife(4)},{gen:HX.G.halflife(4)},{gen:HX.G.span(4)},{gen:HX.G.first(4)},{gen:HX.G.order(4)},{gen:HX.G.century(4)},{gen:HX.G.ago(4)},{gen:HX.G.degkm(4)}],"challenge":[{"q":"A pit was dug from the Roman floor level down through the burnt layer and the hut layer, and filled with soil containing a medieval pot. What does this disturbance mean for superposition?","options":["The pot is older because it lies lower","The pit's fill is younger than the floor it was cut from","Superposition proves the pit prehistoric","Nothing can be concluded"],"answer":"The pit's fill is younger than the floor it was cut from","hint":"Superposition holds only for undisturbed layers. When was the pit cut?","why":"A pit cut through layers is younger than every layer it cuts. Its filling, with the medieval pot, must be later still, though it lies deep. Archaeologists watch for such cuts."},{"q":"A wooden beam has 12.5% of its carbon-14 left. Using a half-life of 5,730 years, about how many years ago was the tree cut down?","type":"number","answer":17190,"hint":"Count the halvings from 100% to 12.5%.","why":"100% → 50% → 25% → 12.5% is 3 half-lives. 3 × 5,730 = 17190 years."},{"q":"Why can radiocarbon not date a dinosaur bone 66 million years old?","options":["Dinosaurs did not contain carbon","After about 50,000 years (about 9 half-lives) too little carbon-14 is left to measure","Radiocarbon only works on wood","Dinosaur bones are artefacts"],"answer":"After about 50,000 years (about 9 half-lives) too little carbon-14 is left to measure","hint":"How much of the original is left after many halvings?","why":"After 9 half-lives only about 1/512 of the carbon-14 remains, too little to measure reliably. Millions of years needs other methods, such as dating volcanic layers with isotopes that decay far more slowly."},{"q":"Layer A contains a coin of AD 117. Layer B lies directly on top of A and contains a coin of AD 98. What is the best conclusion?","options":["Layer B formed before layer A","B formed in AD 117 or later; its coin was simply old","The layers were swapped","Superposition is false"],"answer":"B formed in AD 117 or later; its coin was simply old","hint":"Use superposition first, then each coin's limit.","why":"B is above A, so B is younger than A. A formed in AD 117 or later, so B did too. A coin gives only an earliest possible date; old coins circulated for decades."},{"q":"Tree rings from a beam show 213 rings. The outermost ring grew in 431 BC. In which year BC did the innermost ring grow? (Count the outermost ring as one of the 213.)","type":"number","answer":643,"hint":"The innermost ring is 212 years before the outermost.","why":"The innermost ring is 213 − 1 = 212 years earlier. In BC, earlier means a larger number: 431 + 212 = 643 BC."},{gen:HX.G.gap2(4)}],"extend":"Read about the excavation of Sutton Hoo (1939) or of the Iceman, and write a one-page report: what was found, how it was dated, and one conclusion that changed when new evidence appeared.","offline":"Make a layer jar: in a clear jar, put layers of sand, soil, rice and gravel, burying a small 'artefact' (a coin or button) in each. Ask someone to read the layers in order and say what the coin dates tell them about each layer."},
    {"title":"The earliest people","icon":"🦴","learn":[{"say":"<b>Prehistory</b> is the long time before written records. Our own species, <i>Homo sapiens</i>, is at least about <b>300,000</b> years old: the oldest known fossils, from Jebel Irhoud in Morocco, date to about then. Writing appeared only about 5,200 years ago.","show":{"type":"bars","values":[["Homo sapiens",300000],["Farming",11500],["Writing",5200],["Rome founded",2780]],"caption":"Years ago (approximate)"}},{"say":"Fossils and DNA show that all living humans descend from African ancestors. Groups spread out mostly within the last 70,000 years, reaching Australia, Europe and finally the Americas.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 230' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><defs><marker id='a' viewBox='0 0 10 10' refX='7' refY='5' markerWidth='5' markerHeight='5' orient='auto'><path d='M0 0L10 5L0 10Z' fill='context-stroke'/></marker></defs><rect width='600' height='230' fill='#bcd9ef'/><path d='M290,71 296,73 302,70 308,70 317,69 318,70 317,75 322,76 326,77 332,81 334,77 339,77 342,79 350,79 354,79 354,81 356,85 359,92 362,99 366,106 370,109 372,112 374,114 385,112 382,121 376,129 367,137 366,144 367,149 368,157 362,162 359,169 359,173 354,176 352,182 347,188 343,190 333,191 331,190 330,186 325,178 324,171 320,161 322,152 320,142 316,134 316,125 314,124 310,125 303,121 297,124 287,125 282,120 278,116 275,113 272,107 273,99 272,96 273,91 278,85 284,80 286,76 289,74ZM291,71 285,69 284,67 285,61 285,59 297,59 298,54 293,50 303,46 308,42 314,41 314,36 318,34 318,32 309,32 308,27 323,18 332,14 343,12 352,14 367,17 373,16 388,16 398,14 417,8 422,17 433,8 447,4 473,1 488,8 515,8 533,9 550,12 567,14 583,14 600,15 600,22 597,26 583,30 572,34 570,37 561,46 559,36 552,31 538,32 528,40 534,44 535,51 528,55 520,59 516,63 516,72 511,73 509,68 507,64 503,66 502,63 499,65 496,66 499,69 504,69 501,71 502,77 503,80 502,84 500,88 497,91 490,94 484,98 480,96 478,97 476, e that the sea was about 120 metres lower. A land bridge called <b>Beringia</b> joined Asia to Alaska.","show":HX.tb(...[[["Ice Age fact","Value"],["Coldest point","About 20,000 years ago"],["Sea level","About 120 m lower than today"],["Land bridge","Beringia: Siberia to Alaska"],["Other humans alive","Neanderthals, until about 40,000 years ago"]]])},{"say":"These people were <b>hunter-gatherers</b> of the <b>Palaeolithic</b>, or Old Stone Age. They made stone blades, spear-throwers and eyed bone needles for sewing fitted clothes.","show":HX.li(...[["Tools: flaked stone blades, bone needles, spear-throwers","Fire: controlled by earlier human species long before Homo sapiens","Shelter: caves, and huts of hide, wood or even mammoth bone","Art: cave paintings, carved figures, beads"],"Life in the Old Stone Age"])},{"say":"They were also artists. Paintings in Chauvet Cave in France are about 36,000 years old. Lascaux, found in 1940 by four teenagers, holds about 600 painted animals made roughly 17,000 years ago.","show":HX.tb(...[[["Cave","Country","Age (about)","Found"],["Chauvet","France","36,000 years","1994"],["Lascaux","France","17,000 years","1940"],["Altamira","Spain","at least 15,000 years","1868"]]])},{"say":"<b>How do we know?</b> Fossils, tools, art, ancient DNA and dating methods. When the Jebel Irhoud fossils were re-dated in 2017, our species' age jumped by about 100,000 years: good scientists expect revision.","show":{"type":"big","text":"No writing ≠ no evidence","caption":"Bones, tools, DNA and art speak too"}},{"say":"<b>Explain it.</b> What does 'prehistory' mean, and what kinds of evidence let us know about people who left no writing? Mention one way our knowledge has changed.","show":{"type":"list","items":["Say it in 2–4 complete sentences.","Use the precise words from this lesson.","Support each claim with evidence: how do we know?"],"caption":"Explain it — to a grown-up or in writing"}}],"practice":[{"q":"What does 'prehistory' mean?","options":["History that is not true","The time before written records","The time of the dinosaurs only","History before AD 1"],"answer":"The time before written records","hint":"What kind of source does prehistory lack?","why":"Prehistory is the human past before writing. It is studied mainly through archaeology."},{"q":"Homo sapiens is at least about 300,000 years old, and writing is about 5,000 years old. About how many times longer have humans existed than writing? (Use 300,000 ÷ 5,000.)","type":"number","answer":60,"hint":"Divide; cancel the zeros first.","why":"300,000 ÷ 5,000 = 300 ÷ 5 = 60. Writing covers only about 1/60 of our species' story."},{"q":"Where were the oldest known Homo sapiens fossils found?","options":["China","Jebel Irhoud, Morocco","Lascaux, France","Alaska"],"answer":"Jebel Irhoud, Morocco","hint":"It is in north-west Africa.","why":"Fossils from Jebel Irhoud in Morocco are about 300,000 years old, the oldest known Homo sapiens remains."},{"q":"Which continent did all living humans' ancestors come from?","options":["Europe","Asia","Africa","Australia"],"answer":"Africa","hint":"Where are the oldest fossils, and where is human DNA most varied?","why":"Fossils and DNA both point to Africa. Two independent kinds of evidence agree: corroboration."},{"q":"Why was the sea about 120 metres lower during the Ice Age?","options":["The Moon pulled it away","Huge amounts of water were locked up in ice sheets on land","The oceans evaporated in the heat","Earth was smaller"],"answer":"Huge amounts of water were locked up in ice sheets on land","hint":"Where was the water instead?","why":"Water that normally flows back to the oceans was frozen into ice sheets on land, so sea level fell."},{"q":"What was Beringia?","options":["A land bridge joining Siberia to Alaska when sea levels were low","A cave in France","An ancient city","A kind of stone tool"],"answer":"A land bridge joining Siberia to Alaska when sea levels were low","hint":"It is now under the Bering Strait.","why":"With the sea about 120 m lower, dry land joined Asia and North America. People crossed into the Americas by this route and possibly along the coast."},{"q":"Palaeolithic means…","options":["New Stone Age","Old Stone Age","Bronze Age","Ice Age"],"answer":"Old Stone Age","hint":"Greek palaios = old, lithos = stone.","why":"Palaeo- means old and -lithic means stone: the Old Stone Age, the time of hunter-gatherers."},{"q":"How did hunter-gatherers get their food?","options":["By farming wheat","By hunting, fishing and gathering wild plants","By trading in cities","By keeping herds of cattle in barns"],"answer":"By hunting, fishing and gathering wild plants","hint":"This is in their name.","why":"They hunted, fished and gathered wild plants, moving with the seasons to where food was."},{"q":"What does an eyed bone needle about 40,000 years old suggest?","options":["People wrote letters","People were sewing fitted clothing, useful in a cold climate","People were farming","People had metal tools"],"answer":"People were sewing fitted clothing, useful in a cold climate","hint":"What is a needle with an eye used for?","why":"A needle with an eye pulls thread through hide, so people were sewing close-fitting clothes, an advantage in the Ice Age cold."},{"q":"Lascaux Cave, with about 600 painted animals, was discovered in 1940 by…","options":["a team of professors","four teenagers exploring a hole in a hillside","a farmer ploughing a field","a king"],"answer":"four teenagers exploring a hole in a hillside","hint":"It was a chance discovery.","why":"In 1940 four teenagers explored a hole and found the painted cave. A popular story says their dog found the hole first; accounts differ on that detail. Many great finds are accidental; what matters is recording them carefully."},{"q":"The Lascaux paintings are about 17,000 years old. Chauvet's are about 36,000 years old. About how many years older are Chauvet's?","type":"number","answer":19000,"hint":"Subtract.","why":"36,000 − 17,000 = 19000 years."},{"q":"Which of these is evidence from prehistory, not a guess?","options":["The people of Lascaux were happy","Charcoal from a hearth has been radiocarbon-dated to 17,000 years ago","The cave painters believed in magic","Hunter-gatherers disliked farming"],"answer":"Charcoal from a hearth has been radiocarbon-dated to 17,000 years ago","hint":"Evidence is something found and tested.","why":"Dated charcoal is physical evidence. The other statements are interpretations that need evidence to support them."},{"q":"In 2017 the Jebel Irhoud fossils were re-dated to about 300,000 years. What should a good thinker learn from this?","options":["Scientists are always wrong","Hold conclusions in proportion to evidence; revise when it improves","Old dates can never be trusted","Ignore new evidence"],"answer":"Hold conclusions in proportion to evidence; revise when it improves","hint":"Is changing your mind for good evidence a weakness?","why":"Revising a conclusion because of better evidence is exactly what reliable inquiry does. That is why careful writers say 'at least' and 'about'."},{"q":"Which humans lived in Europe until about 40,000 years ago?","options":["Romans","Neanderthals","Egyptians","Vikings"],"answer":"Neanderthals","hint":"They were a different human group, with big brains and stocky bodies.","why":"Neanderthals lived in Europe and western Asia until about 40,000 years ago. Most people of non-African descent carry a small share of Neanderthal DNA."},{"q":"A sign says: 'People reached the Americas exactly 15,000 years ago.' What is wrong with it?","options":["Nothing is wrong","It is too certain: the evidence shows at least 15,000 years","People never reached the Americas","It should say 15,000 BC"],"answer":"It is too certain: the evidence shows at least 15,000 years","hint":"Does our evidence give an exact date, or a minimum?","why":"Our evidence gives a minimum ('at least') and some sites may be older. Saying 'exactly' claims more than the evidence supports."},{"q":"A painting made 17,000 years ago: about which year BC is that? Use 2,000 years for AD, so subtract 2,000 from 17,000.","type":"number","answer":15000,"hint":"17,000 years ago minus the 2,000 AD years.","why":"17,000 − 2,000 = 15000, so about 15000 BC. (With such rough dates, a 26-year difference does not matter.)"},{gen:HX.G.span(5)},{gen:HX.G.first(5)},{gen:HX.G.order(5)},{gen:HX.G.ago(5)},{gen:HX.G.halflife(5)},{gen:HX.G.halflife(5)},{gen:HX.G.latlon(5)},{gen:HX.G.century(5)}],"challenge":[{"q":"Fossils, ancient DNA and stone tools all suggest people reached Australia by about 50,000 years ago. Why is this conclusion strong?","options":["Because it is a large number","Because three independent kinds of evidence agree","Because Australia is far away","Because a famous scientist said so"],"answer":"Because three independent kinds of evidence agree","hint":"What do we call independent agreement?","why":"Different methods with different possible errors point to the same answer. That is corroboration, the strongest support history and science can offer."},{"q":"To reach Australia from Asia even with lower sea levels, people had to cross open water of up to about 90 km. If a raft travelled 3 km per hour, how many hours would 90 km take?","type":"number","answer":30,"hint":"Divide distance by speed.","why":"90 ÷ 3 = 30 hours: more than a day at sea, which implies planning, boats and navigation skill."},{"q":"Argument: 'Cave paintings show many animals, so Ice Age people ate only meat.' Evaluate it.","options":["Sound: pictures show what people ate","Unsound: art shows choices, not the whole diet","Sound, because the paintings are old","It is a preference"],"answer":"Unsound: art shows choices, not the whole diet","hint":"Do people paint everything they eat?","why":"Even if the premise is true, the conclusion does not follow. Art reflects choices and beliefs. Charred plant remains from hearths show people also ate plants."},{"q":"Sea level was about 120 m lower 20,000 years ago. If it rose evenly to today's level over 10,000 years, by how many centimetres per year did it rise on average? Round to the nearest whole centimetre.","type":"number","answer":1,"hint":"Convert metres to centimetres first: 120 m = 12,000 cm.","why":"12,000 cm ÷ 10,000 years = 1.2 cm a year, which is about 1 cm to the nearest whole centimetre."},{gen:HX.G.gap2(5)}],"extend":"Read about the discovery of Lascaux and of Chauvet. Write a paragraph comparing how each was found and dated, and explain why the caves are now closed to the public.","offline":"Use only natural materials (charcoal from a cold fire, chalk, mud, crushed berries) to paint an animal on a large flat stone or cardboard, as cave artists did. Then write two sentences: one fact about Ice Age art and one question you would ask a cave painter."},
    {"title":"From wanderers to farmers","icon":"🌾","learn":[{"say":"About 11,500 years ago (about 9500 BC), people in the <b>Fertile Crescent</b>, an arc of land from the Levant to the Tigris and Euphrates, began to farm. Historians call this change the <b>Neolithic Revolution</b> (Neolithic = New Stone Age).","show":{"type":"svg","markup":"<svg viewBox='0 0 600 450' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><defs><mask id='m'><rect width='600' height='450' fill='#fff'/><path d='M-840,147 -810,129 -752,129 -722,102 -707,48 -695,21 -677,0 -645,-12 -620,-27 -622,-60 -595,-72 -565,-66 -517,-81 -477,-102 -445,-87 -437,-57 -422,-42 -392,-22 -375,-7 -345,6 -327,21 -310,28 -300,60 -309,90 -297,90 -285,78 -271,60 -285,39 -270,16 -250,33 -237,25 -275,-3 -297,-27 -325,-30 -352,-57 -362,-78 -390,-96 -392,-120 -390,-135 -357,-141 -357,-123 -337,-129 -302,-78 -260,-60 -235,-42 -215,-24 -215,18 -200,39 -182,63 -172,81 -157,111 -153,126 -137,138 -128,129 -120,138 -130,105 -112,111 -125,93 -110,91 -99,100 -100,84 -117,72 -135,64 -128,54 -117,57 -132,33 -135,18 -128,12 -117,24 -103,18 -105,7 -90,3 -65,3 -50,6 -35,12 -45,28 -45,33 -47,45 -30,51 -30,69 -22,78 -40,81 -20,93 -17,114 -15,120 3,126 5,130 28,132 62,141 67,123 87,129 113,147 140,144 165,126 190,132 205,132 195,165 197,183 187,213 180,231 175,246 168,267 160,285 145,294 107,291 95,285 75,282 60,286 47,294 12,300 -20,291 -70,282 -100,270 -122,252 -157,243 -197,258 -200,285 -220,321 -245,309 -300,291 -317,261 -370,243 -410,234 -447,213 -422,174 -435,156 -425,123 -442,124 -452,111 -485,123 -505,123 -542,117 -572,129 -625,126 -670,135 -715,159 -755,177 -797,174 -832,153ZM25,-6 0,-18 -12,-45 -3,-66 15,-84 42,-126 67,-165 95,-168 115,-150 113,-132 138,-105 163,-108 185,-120 212,-129 250,-105 293,-78 340,-18 325,-3 293,0 257,1 207,-9 178,-30 132,-30 83,-6ZM-45,28 -33,19 -12,1 25,-1 28,-7 33,-3 35,7 0,19 -33,22 -42,31ZM114,331 118,357 140,402 157,450 190,513 230,642 265,690 287,764 312,782 345,827 382,85 5,28 -33,19 -12,1 25,-1 28,-7 33,-3 35,7 0,19 -33,22 -42,31ZM114,331 118,357 140,402 157,450 190,513 230,642 265,690 287,764 312,782 345,827 382,854 386,848 368,764 330,675 278,585 247,504 212,447 180,390 171,378 175,345 172,345 161,390 156,397 138,375ZM512,330 497,348 515,390 540,420 555,441 570,462 580,447 590,471 582,501 613,504 660,501 682,471 703,447 709,438 710,480 737,480 745,459 725,420 707,414 670,432 637,426 600,402 585,393 570,363 553,327 530,321ZM468,-111 490,-138 530,-162 588,-180 625,-174 628,-129 582,-105 582,-63 620,-24 625,30 647,63 647,111 588,126 550,108 525,75 535,24 515,-24 487,-57Z' fill='#bcd9ef'/><path d='M-112,162 -92,162 -42,171 -47,180 -83,183 -112,171ZM107,180 125,168 165,159 147,180 125,192 110,189Z' fill='#efe4c8' stroke='#b9a77c'/><g mask='url(#m)'><path d='M163,300 187,240 212,135 275,102 350,102 412,135 450,210 500,300 487,330 437,294 400,240 350,186 287,165 237,180 212,240 187,300Z' fill='#4d9b4d' fill-opacity='0.45'/></g><path d='M297,78 306,93 355,110 378,140 381,166 392,192 397,204 410,230 446,255 479,275 486,300' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M270,48 257,90 250,125 275,151 304,170 322,193 359,206 370,221 394,229 411,254 432,291 456,298 486,300 495,315 512,330' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M60,286 75,312 81,328 81,360 70,390 72,402 85,420 105,441 118,447 116,459 115,471 122,507 110,540 90,561 84,576 65,615 60,642 62,654 75,678 95,673 113,663 132,644 147,675 150,699 144,721 113,761 113,839 90,944' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><circle cx='186' cy='274' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='121' cy='100' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='273' cy='113' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><g font-size='18' font-weight='700' stroke='#fff' stroke-width='4' paint-order='stroke' text-anchor='middle'><text x='400' y='159' fill='#6d28d9'>Fertile Crescent</text><text x='75' y='210' fill='#1d5c8a' font-style='italic'>Mediterranean</text><text x='177' y='280' fill='#1f2937' text-anchor='end'>Jericho</text><text x='121' y='89' fill='#1f2937' text-anchor='middle'>Çatalhöyük</text><text x='273' y='102' fill='#1f2937' text-anchor='middle'>Göbekli Tepe</text></g></svg>"}},{"say":"<b>Domestication</b> means breeding wild plants and animals until they depend on people and serve human needs. Wild wheat drops its seeds; farmers kept seeds from plants whose heads held on, so over generations wheat became easy to harvest.","show":HX.tb(...[[["Plants","Animals"],["Emmer and einkorn wheat, barley","Goats, sheep"],["Lentils, peas, chickpeas","Cattle, pigs"],["Flax (for linen)","Dogs were tamed even earlier"]]])},{"say":"Farming began <b>independently</b> in several places: no one taught the others. That is strong evidence that farming was a natural human solution to similar problems.","show":HX.tb(...[[["Region","First crops","By about"],["Fertile Crescent","Wheat, barley, lentils","9500 BC"],["China","Millet (north), rice (Yangtze)","7000 BC"],["Mexico","Squash, then maize","8000–7000 BC"],["Andes","Potatoes","6000 BC"],["New Guinea","Taro, bananas","5000 BC"]]])},{"say":"Farming produced <b>surpluses</b>, so villages grew and some people specialised. Stored wealth brought <b>inequality</b>, and crowded villages spread disease.","show":HX.li(...[["Cause: farming produces a surplus →","Effect: more people can live in one place →","Effect: some people specialise in crafts →","Effect: stored wealth must be protected and ruled →","Long-term effect: towns, then cities and governments"],"A chain of cause and effect"])},{"say":"Early sites surprise us: great carved pillars at <b>Göbekli Tepe</b>, a walled tower at <b>Jericho</b>, and crowded <b>Çatalhöyük</b>, whose houses were entered through the roofs.","show":HX.tb(...[[["Site","Date (about)","What it shows"],["Göbekli Tepe","9500 BC","Great monuments before full farming"],["Jericho","8000 BC","A walled settlement with a tower"],["Çatalhöyük","7100–5700 BC","A crowded town without streets"]]])},{"say":"Many scholars assumed farming came first and monuments later. Göbekli Tepe, raised by people who still lived largely by hunting and gathering, challenges that order, and the question is still debated.","show":{"type":"big","text":"Old idea: farming → monuments\nGöbekli Tepe: monuments → farming?","caption":"Evidence can overturn assumptions"}},{"say":"<b>Explain it.</b> What was the Neolithic Revolution, and what chain of effects followed from farming? Include one cost of farming as well as one benefit.","show":{"type":"list","items":["Say it in 2–4 complete sentences.","Use the precise words from this lesson.","Support each claim with evidence: how do we know?"],"caption":"Explain it — to a grown-up or in writing"}}],"practice":[{"q":"What was the Neolithic Revolution?","options":["A war between Stone Age tribes","The change from hunting and gathering to farming and settled villages","The invention of writing","The first use of iron"],"answer":"The change from hunting and gathering to farming and settled villages","hint":"Neolithic means New Stone Age. What was new?","why":"It was the shift to farming, which led to settled villages and, later, towns."},{"q":"Where did farming first begin, about 9500 BC?","options":["The Nile Delta","The Fertile Crescent","Northern Europe","Australia"],"answer":"The Fertile Crescent","hint":"Look at the map: the green arc.","why":"The earliest known farming began in the Fertile Crescent, from the Levant up through south-east Turkey and down the Tigris and Euphrates."},{"q":"To domesticate a plant means…","options":["to plant it in a pot indoors","to breed it over generations so that it serves human needs and depends on people","to eat it raw","to sell it at a market"],"answer":"to breed it over generations so that it serves human needs and depends on people","hint":"Think of wheat whose seeds no longer fall off by themselves.","why":"Domestication is a long process of selective breeding; domesticated wheat keeps its seeds on the stalk until harvested."},{"q":"Which animal was tamed even before farming began?","options":["The horse","The camel","The dog","The chicken"],"answer":"The dog","hint":"Hunters had a partner.","why":"Dogs were domesticated from wolves well before farming, probably more than 15,000 years ago."},{"q":"Farming began independently in several regions. What does 'independently' mean here?","options":["Each region invented farming without learning it from another","Each region was ruled by its own king","Farming was invented once and spread everywhere","Farmers lived alone"],"answer":"Each region invented farming without learning it from another","hint":"Did the people of Mexico learn maize farming from Mesopotamia?","why":"Independent invention means separate origins. Mesoamerica, China and the Fertile Crescent each domesticated their own crops."},{"q":"Match the region to its first great crop: the Andes of South America.","options":["Rice","Wheat","Potatoes","Maize"],"answer":"Potatoes","hint":"The plant grows well in cool highlands.","why":"Potatoes were domesticated in the Andes, by about 6000 BC."},{"q":"What is a surplus?","options":["A shortage of food","More food or goods than are immediately needed","A kind of tax","A farm animal"],"answer":"More food or goods than are immediately needed","hint":"Sur- means over or extra.","why":"A surplus is extra beyond immediate needs. Stored surpluses let some people do work other than farming."},{"q":"Why did farming tend to increase inequality?","options":["Everyone farmed the same amount","Land and stored food could be owned and inherited","Farmers stopped trading","Hunter-gatherers were all kings"],"answer":"Land and stored food could be owned and inherited","hint":"Can a hunter-gatherer store a barn full of grain?","why":"Fixed land and storable surpluses can be owned, inherited and taken. Differences in wealth grew, and with them, rulers and the ruled."},{"q":"Which statement about farming is supported by evidence from skeletons?","options":["Early farmers were always healthier","Many early farmers were shorter, with more tooth decay","Farming ended all disease","Farming made everyone taller"],"answer":"Many early farmers were shorter, with more tooth decay","hint":"A starchy diet of grain affects teeth and growth.","why":"Skeletons from many early farming villages show shorter height, worn and decayed teeth and signs of disease. Farming fed more people, but not always better."},{"q":"What makes Göbekli Tepe so important?","options":["It was the first city with a king","Monuments built about 9500 BC, largely by hunter-gatherers","It is the oldest pyramid","Writing began there"],"answer":"Monuments built about 9500 BC, largely by hunter-gatherers","hint":"What did scholars expect hunter-gatherers could not build?","why":"It shows large-scale cooperation and monument building at the very start of farming, which challenged the idea that farming had to come first."},{"q":"How did people enter the houses of Çatalhöyük?","options":["Through front doors from the street","Through openings in the roofs, using ladders","Through tunnels","Through windows"],"answer":"Through openings in the roofs, using ladders","hint":"The houses were packed wall to wall, with no streets.","why":"With houses built against each other and no streets, people moved across the rooftops and climbed down ladders."},{"q":"Put these in order, earliest first.","type":"order","items":["Çatalhöyük (about 7100 BC)","Jericho's tower (about 8000 BC)","Göbekli Tepe (about 9500 BC)","Egypt united (about 3100 BC)"],"answer":["Göbekli Tepe (about 9500 BC)","Jericho's tower (about 8000 BC)","Çatalhöyük (about 7100 BC)","Egypt united (about 3100 BC)"],"hint":"Bigger BC numbers are earlier.","why":"9500 BC → 8000 BC → 7100 BC → 3100 BC."},{"q":"Çatalhöyük was lived in from about 7100 BC to about 5700 BC. For about how many years was it occupied?","type":"number","answer":1400,"hint":"Both dates are BC: subtract.","why":"7100 − 5700 = 1400 years, almost as long as the 1,550 years from the fall of the Western Roman Empire (AD 476) to today."},{"q":"Which of these is an effect of farming rather than a cause of it?","options":["Wild wheat grew in the Fertile Crescent","The climate warmed after the Ice Age","People began to live in permanent villages","People knew which wild plants were edible"],"answer":"People began to live in permanent villages","hint":"Which one came after farming started, because of it?","why":"Permanent villages resulted from farming. The other three are conditions that helped farming begin."},{"q":"Opinion or fact: 'Farming was the best thing that ever happened to humanity.'","options":["Fact","Opinion: a judgement that people can argue about with evidence on both sides","Preference","Primary source"],"answer":"Opinion: a judgement that people can argue about with evidence on both sides","hint":"Could informed people disagree?","why":"It is a judgement. Evidence shows benefits (more food, cities, writing) and costs (harder labour, disease, inequality), so people weigh them differently."},{gen:HX.G.mapdot(6)},{gen:HX.G.country(6)},{gen:HX.G.span(6)},{gen:HX.G.first(6)},{gen:HX.G.order(6)},{gen:HX.G.century(6)},{gen:HX.G.ago(6)},{gen:HX.G.halflife(6)},{gen:HX.G.latlon(6)}],"challenge":[{"q":"Emmer wheat found at a site has seeds that stay on the stalk, unlike wild emmer. What is the best conclusion?","options":["The site is older than farming","The plants had been domesticated by people","The wheat came from America","Nothing can be concluded"],"answer":"The plants had been domesticated by people","hint":"In the wild, which plants reproduce well: the ones that drop seeds or the ones that keep them?","why":"Wild wheat must scatter its seeds to reproduce. Plants that keep their seeds survive only when people harvest and resow them, so their presence shows domestication."},{"q":"A village of 100 people grows enough grain for 125 people. If each extra person's share can feed one craft worker, how many people could the village support who do not farm?","type":"number","answer":25,"hint":"How much extra food is there?","why":"125 − 100 = 25 people's worth of food. That surplus could support 25 specialists, such as potters or builders."},{"q":"Scholar A: 'People farmed first, then built monuments.' Scholar B: 'At Göbekli Tepe the monuments seem to come first.' What should a careful historian say?","options":["A must be right: the idea is older","B must be right: the idea is newer","Göbekli Tepe challenges A's rule; more sites are needed","Both are opinions, so evidence cannot help"],"answer":"Göbekli Tepe challenges A's rule; more sites are needed","hint":"Does one site overturn a rule everywhere, or show that the rule has exceptions?","why":"One well-dated site can disprove the claim that monuments always followed farming, but it cannot by itself prove the reverse everywhere. More evidence is needed for a general rule."},{"q":"If a farmer saves the best 10% of a 500 kg harvest as seed every year, how many kilograms does she save each year?","type":"number","answer":50,"hint":"10% means one tenth.","why":"500 ÷ 10 = 50 kg. Choosing which seeds to save, year after year, is how domestication happened."},{gen:HX.G.gap2(6)}],"extend":"Read about Göbekli Tepe and write a one-page argument: did monument building help to cause farming? State your claim, give two pieces of evidence, and say what new discovery would change your mind.","offline":"Sprout some wheat berries, dried peas or lentils in a jar on damp cotton. Keep a dated diary with a drawing every two days. Note which seeds sprout first, and explain why early farmers would have saved seeds from their best plants."},
