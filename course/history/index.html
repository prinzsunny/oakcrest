    {"title":"Egypt, gift of the Nile","icon":"🐊","learn":[{"say":"Herodotus visited Egypt about 450 BC and wrote a famous phrase: Egypt is the gift of the river. Without the Nile, Egypt would be desert.","show":{"type":"passage","title":"Herodotus, Histories 2.5 (trans. G. C. Macaulay, 1890)","text":"[…] the Egypt to which the Hellenes come in ships is a land which has been won by the Egyptians as an addition, and that it is a gift of the river […]"}},{"say":"The Nile, about 6,650 km long, flows <b>north</b>. So <b>Upper Egypt</b> is the south (upstream) and <b>Lower Egypt</b> is the north, the delta. Rapids called <b>cataracts</b> blocked boats; the First Cataract at Aswan marked Egypt's traditional southern border.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 644' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><rect width='600' height='644' fill='#efe4c8'/><path d='M-1580,-202 -1520,-235 -1405,-235 -1345,-286 -1315,-386 -1290,-437 -1255,-476 -1190,-498 -1140,-526 -1145,-588 -1090,-610 -1030,-599 -935,-627 -855,-666 -790,-638 -775,-582 -745,-554 -685,-518 -650,-490 -590,-465 -555,-437 -520,-423 -500,-364 -517,-308 -495,-308 -470,-330 -443,-364 -470,-403 -440,-445 -400,-414 -375,-428 -450,-482 -495,-526 -550,-532 -605,-582 -625,-622 -680,-655 -685,-700 -680,-728 -615,-739 -615,-706 -575,-717 -505,-622 -420,-588 -370,-554 -330,-521 -330,-442 -300,-403 -265,-358 -245,-325 -215,-269 -205,-241 -175,-218 -155,-235 -140,-218 -160,-280 -125,-269 -150,-302 -120,-305 -98,-288 -100,-319 -135,-342 -170,-356 -155,-375 -135,-370 -165,-414 -170,-442 -155,-454 -135,-431 -105,-442 -110,-462 -80,-470 -30,-470 0,-465 30,-454 10,-423 10,-414 5,-392 40,-381 40,-347 55,-330 20,-325 60,-302 65,-263 70,-252 105,-241 110,-232 155,-230 225,-213 235,-246 275,-235 325,-202 380,-207 430,-241 480,-230 510,-230 490,-168 495,-134 475,-78 460,-45 450,-17 435,22 420,56 390,73 315,67 290,56 250,50 220,59 195,73 125,84 60,67 -40,50 -100,28 -145,-6 -215,-22 -295,6 -300,56 -340,123 -390,101 -500,67 -535,11 -640,-22 -720,-39 -795,-78 -745,-151 -770,-185 -750,-246 -785,-244 -805,-269 -870,-246 -910,-246 -985,-258 -1045,-235 -1150,-241 -1240,-224 -1330,-179 -1410,-146 -1495,-151 -1565,-190ZM327,143 335,190 380,274 415,364 480,482 560,722 630,812 675,952 725,985 790,1069 865,1120 873,1109 835,952 760,784 655,616 595,465 525,358 460,252 443,230 450,168 445,168 423,252 413,266 375,224Z' fill='#bcd9ef'/><path d='M220,59 250,106 262,137 263,196 240,252 245,274 270,308 310,347 335,358 332,381 330,403 345,471 320,532 280,571 268,599 230,672 220,722 224,746 250,789 290,781 325,761 365,726 395,784 400,829 388,871 327,946 325,1092 280,1288' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M262,137 270,95 290,56' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M327,946 370,1019 420,1137 465,1193 570,1170' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><circle cx='263' cy='148' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='332' cy='381' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='345' cy='471' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><g font-size='18' font-weight='700' stroke='#fff' stroke-width='4' paint-order='stroke' text-anchor='middle'><text x='380' y='106' fill='#6d28d9'>LOWER EGYPT</text><text x='170' y='330' fill='#6d28d9'>UPPER EGYPT</text><text x='175' y='22' fill='#1d5c8a' font-style='italic'>Mediterranean Sea</text><text x='490' y='420' fill='#1d5c8a' font-style='italic'>Red Sea</text><text x='280' y='252' fill='#1d5c8a' font-style='italic'>Nile</text><text x='100' y='504' fill='#6b5a35'>Desert</text><text x='254' y='154' fill='#1f2937' text-anchor='end'>Memphis</text><text x='341' y='387' fill='#1f2937' text-anchor='start'>Thebes</text><text x='354' y='477' fill='#1f2937' text-anchor='start'>Aswan (1st Cataract)</text></g><g font-size='18' font-weight='700'><path d='M14 630h101' stroke='#1f2937' stroke-width='4'/><text x='14' y='622' fill='#1f2937' stroke='#fff' stroke-width='4' paint-order='stroke'>200 km</text></g></svg>"}},{"say":"Every summer, rains in the Ethiopian highlands made the Nile flood. When the water drew back it left black, fertile silt. The Egyptians called their farmland <b>Kemet</b>, the Black Land, and the desert <b>Deshret</b>, the Red Land.","show":HX.tb(...[[["Season","Months (about)","What happened"],["Akhet (flood)","June – September","Fields under water; men worked on state projects"],["Peret (growing)","October – February","Planting in the wet silt"],["Shemu (harvest)","March – May","Harvest before the next flood"]]])},{"say":"Officials measured the flood with <b>Nilometers</b>, steps cut down to the river. A low flood meant hunger; a very high one swept villages away. The calendar fitted the river: 12 months of 30 days plus 5 extra days, 365 in all.","show":{"type":"big","text":"12 × 30 + 5 = 365 days","caption":"The Egyptian civil calendar"}},{"say":"About 3100 BC Upper and Lower Egypt were united. The <b>Narmer Palette</b>, found in 1898, shows King Narmer in the white crown of the south and the red crown of the north.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><path d='M30 170H570' stroke='#1f2937' stroke-width='4'/><circle cx='70' cy='170' r='8' fill='#1d5c8a'/><path d='M70 170V146' stroke='#1d5c8a' stroke-width='2'/><text x='56' y='118' font-size='18' fill='#1f2937' text-anchor='start' font-weight='700'>Unification</text><text x='56' y='140' font-size='18' fill='#1f2937' text-anchor='start' font-weight='700'>(about 3100 BC)</text><circle cx='150' cy='170' r='8' fill='#1d5c8a'/><path d='M150 170V222' stroke='#1d5c8a' stroke-width='2'/><text x='150' y='242' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Great Pyramid</text><text x='150' y='264' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>(about 2560 BC)</text><circle cx='300' cy='170' r='8' fill='#1d5c8a'/><path d='M300 170V146' stroke='#1d5c8a' stroke-width='2'/><text x='300' y='118' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>New Kingdom</text><text x='300' y='140' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>(about 1550 BC)</text><circle cx='526' cy='170' r='8' fill='#1d5c8a'/><path d='M526 170V222' stroke='#1d5c8a' stroke-width='2'/><text x='540' y='242' font-size='18' fill='#1f2937' text-anchor='end' font-weight='700'>Cleopatra dies</text><text x='540' y='264' font-size='18' fill='#1f2937' text-anchor='end' font-weight='700'>30 BC</text></svg>"}},{"say":"The king, later called <b>pharaoh</b> ('great house'), was seen as a living god who kept <b>maat</b>: truth, justice and cosmic order. Deserts on both sides and cataracts to the south protected Egypt, which helps explain why its civilisation lasted about 3,000 years.","show":HX.li(...[["Natural protection: deserts east and west, cataracts south, sea north","Transport: the current carries boats north; the wind blows south","Unity: one river joins the whole land","Risk: everything depends on the flood"],"How geography shaped Egypt"])},{"say":"<b>Explain it.</b> Explain why Herodotus called Egypt the gift of the river. Use the words flood, silt, Upper and Lower Egypt in your answer.","show":{"type":"list","items":["Say it in 2–4 complete sentences.","Use the precise words from this lesson.","Support each claim with evidence: how do we know?"],"caption":"Explain it — to a grown-up or in writing"}}],"practice":[{"q":"In which direction does the Nile flow?","options":["South","North","East","West"],"answer":"North","hint":"Where is its delta?","why":"The Nile flows north, from the highlands of East Africa to its delta on the Mediterranean."},{"q":"Upper Egypt is…","options":["the north, near the sea","the south, upstream","the eastern desert","the delta"],"answer":"the south, upstream","hint":"'Upper' means upriver. Which way is upriver on a north-flowing river?","why":"Because the Nile flows north, upriver is south. Upper Egypt is the south; Lower Egypt is the northern delta."},{"q":"What did Herodotus mean by calling Egypt 'a gift of the river'?","options":["The river carried presents from other lands","The Nile's water and silt made farming, and therefore Egypt, possible in a desert","Egypt was given to the Greeks","The river was a god who gave gold"],"answer":"The Nile's water and silt made farming, and therefore Egypt, possible in a desert","hint":"What would Egypt be without the Nile?","why":"Without the Nile's yearly flood and silt, Egypt would be desert. The river made its farms, food and wealth possible."},{"q":"What caused the yearly flood?","options":["Melting snow in Egypt","Heavy summer rains in the Ethiopian highlands","Tides from the Mediterranean","Egyptians opening dams"],"answer":"Heavy summer rains in the Ethiopian highlands","hint":"The water came from far upstream.","why":"Monsoon rains in the Ethiopian highlands swelled the Blue Nile and Atbara each summer, and the flood reached Egypt weeks later."},{"q":"What did the Egyptians call their fertile farmland?","options":["Deshret, the Red Land","Kemet, the Black Land","Sinai","Nubia"],"answer":"Kemet, the Black Land","hint":"Its name comes from the colour of the silt.","why":"Kemet, the Black Land, after the dark silt; the desert was Deshret, the Red Land."},{"q":"A cataract on the Nile is…","options":["a waterfall in the delta","a stretch of rapids and rocks that blocks boats","a canal","a flood season"],"answer":"a stretch of rapids and rocks that blocks boats","hint":"The First Cataract is at Aswan.","why":"Cataracts are rocky rapids. They made river travel south difficult and helped protect Egypt."},{"q":"The Egyptian calendar had 12 months of 30 days, plus extra days to make 365. How many extra days?","type":"number","answer":5,"hint":"Compute 12 × 30 first.","why":"12 × 30 = 360. 365 − 360 = 5 extra days."},{"q":"What was a Nilometer for?","options":["Measuring the length of the Nile","Measuring the height of the flood, to predict harvests and set taxes","Catching fish","Telling time at night"],"answer":"Measuring the height of the flood, to predict harvests and set taxes","hint":"A low flood meant a poor harvest.","why":"Steps marked in a Nilometer showed the flood's height, which predicted the harvest and the tax the farmers could pay."},{"q":"About when were Upper and Lower Egypt united?","options":["About 9500 BC","About 3100 BC","About 1000 BC","AD 1"],"answer":"About 3100 BC","hint":"It was roughly when writing began.","why":"Unification came about 3100 BC, traditionally under Narmer (sometimes linked with the legendary Menes)."},{"q":"On the Narmer Palette, the king wears the white crown on one side and the red crown on the other. What does this most likely show?","options":["He ruled both Upper (white) and Lower (red) Egypt","He changed his mind about crowns","He was two different kings","Crowns were fashion only"],"answer":"He ruled both Upper (white) and Lower (red) Egypt","hint":"Which crown belonged to which land?","why":"The white crown stood for Upper Egypt and the red for Lower Egypt. Showing both presents Narmer as king of the whole land."},{"q":"What did maat mean to the Egyptians?","options":["A kind of boat","Truth, justice and the right order of the world","The flood season","A type of crown"],"answer":"Truth, justice and the right order of the world","hint":"The pharaoh's duty was to uphold it.","why":"Maat was the ideal of truth, justice and cosmic order, which the king was expected to maintain."},{"q":"Which geographic feature did NOT protect Egypt from invasion?","options":["The Western Desert","The Eastern Desert","The cataracts to the south","The Nile Delta's fertile fields"],"answer":"The Nile Delta's fertile fields","hint":"Which feature is a resource, not a barrier?","why":"The deserts and cataracts made invasion hard. The fertile delta was rich and open, a prize rather than a barrier."},{"q":"Boats sailing south on the Nile used sails. Why?","options":["The prevailing wind blows from the north, against the current","The current flows south","Sails were only decoration","Oars were forbidden"],"answer":"The prevailing wind blows from the north, against the current","hint":"Which way does the current carry a boat without help?","why":"The current carries boats north; the prevailing wind blows from the north, pushing sailing boats south. The Nile was a two-way highway."},{"q":"The Nile is about 6,650 km long. If a boat drifted 50 km a day, about how many days would it take to drift the whole length? Round to the nearest whole day.","type":"number","answer":133,"hint":"6,650 ÷ 50.","why":"6,650 ÷ 50 = 133 days."},{"q":"Since the Aswan High Dam was finished in 1970, what has happened to the yearly flood in Egypt?","options":["It is bigger","It no longer reaches Egypt's fields; the dam holds the water back","It comes twice a year","Nothing has changed"],"answer":"It no longer reaches Egypt's fields; the dam holds the water back","hint":"What does a dam do to a river's flow?","why":"The High Dam controls the water. Egypt gained steady irrigation and electricity, but the silt that once renewed the fields is trapped behind the dam."},{"q":"Egypt's farmers paid taxes in grain. Officials set each year's tax using the Nilometer reading. Why was this sensible?","options":["A higher flood meant a bigger harvest","The Nilometer measured wealth directly","Taxes never changed","Floods made grain lighter"],"answer":"A higher flood meant a bigger harvest","hint":"What does a good flood mean for the harvest?","why":"The flood's height predicted how much land would be watered and how much grain would grow. Linking tax to it matched what farmers could actually pay."},{gen:HX.G.mapdot(7)},{gen:HX.G.mapdot(7)},{gen:HX.G.country(7)},{gen:HX.G.span(7)},{gen:HX.G.first(7)},{gen:HX.G.order(7)},{gen:HX.G.century(7)},{gen:HX.G.ago(7)}],"challenge":[{"q":"Egypt's 365-day calendar was about a quarter of a day shorter than the real year. After how many years would it have drifted a whole 365 days out of step with the seasons?","type":"number","answer":1460,"hint":"A quarter day per year: how many years for one day? Then for 365 days?","why":"It drifts 1 day every 4 years, so 365 days takes 365 × 4 = 1460 years."},{"q":"A flood record shows a very low Nile in a year when a papyrus records famine and unrest. A historian concludes: 'The low flood caused the unrest.' What extra evidence would most strengthen the claim?","options":["A statue of the king","Many years showing low floods followed by trouble","A modern film about famine","One more record of the same year"],"answer":"Many years showing low floods followed by trouble","hint":"One coincidence is weak. What pattern would be convincing?","why":"A single year cannot separate cause from coincidence. A repeated pattern, low floods followed by trouble and good floods by calm, would support a causal link."},{"q":"Why did Egyptian civilisation last so much longer than many others, about 3,000 years? Choose the best-supported explanation.","options":["Natural barriers, a reliable river supplying food, and one river uniting the country","Egyptians never fought wars","The pharaohs lived for centuries","Egypt had no neighbours"],"answer":"Natural barriers, a reliable river supplying food, and one river uniting the country","hint":"Which answer is about geography and is true?","why":"Deserts and cataracts made invasion difficult, the flood fed a large population, and the Nile tied the land together. Egypt did fight wars, and was sometimes conquered, so the other answers are false."},{"q":"A field is a rectangle 60 cubits long and 25 cubits wide. After the flood washed away its boundary stones, a surveyor re-measures it. What is its area in square cubits?","type":"number","answer":1500,"hint":"Area of a rectangle = length × width.","why":"60 × 25 = 1500 square cubits. Re-measuring fields after every flood is one reason Egyptians became skilled at geometry, which means 'earth measuring'."},{gen:HX.G.gap2(7)}],"extend":"Read Herodotus, Histories Book 2, chapters 5–14 (Macaulay or de Sélincourt translation), where he reasons about how Egypt's land was formed by the river. Which of his arguments use real evidence, and which are guesses?","offline":"Make a model Nile: a long tray of soil with a channel. Pour water slowly from the 'south' end to flood it, then let it drain and look at where the fine silt settled. Draw and label Upper Egypt, Lower Egypt and the delta."},
    {"title":"Hieroglyphs and the first writing","icon":"📜","learn":[{"say":"Writing was invented about <b>3200 BC</b>, in Sumer and in Egypt, and later, independently, in China and in Mesoamerica. Writing let people keep accounts, record laws and send messages across time. It also divides prehistory from history.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 426' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><rect width='600' height='426' fill='#efe4c8'/><path d='M-683,51 -655,35 -602,35 -575,11 -561,-37 -549,-61 -533,-80 -503,-91 -480,-104 -482,-133 -457,-144 -429,-139 -385,-152 -348,-171 -318,-157 -312,-131 -298,-117 -270,-100 -254,-87 -226,-75 -210,-61 -194,-55 -185,-27 -193,0 -182,0 -171,-11 -158,-27 -171,-45 -157,-65 -138,-51 -127,-57 -162,-83 -182,-104 -208,-107 -233,-131 -242,-149 -268,-165 -270,-187 -268,-200 -238,-205 -238,-189 -219,-195 -187,-149 -148,-133 -125,-117 -106,-101 -106,-64 -92,-45 -76,-24 -67,-8 -53,19 -48,32 -35,43 -25,35 -18,43 -28,13 -12,19 -23,3 -9,1 1,9 0,-5 -16,-16 -32,-23 -25,-32 -16,-29 -30,-51 -32,-64 -25,-69 -16,-59 -2,-64 -5,-73 9,-77 32,-77 46,-75 60,-69 51,-55 51,-51 48,-40 65,-35 65,-19 72,-11 55,-8 74,3 76,21 78,27 95,32 97,36 118,37 150,45 155,29 173,35 196,51 222,48 245,32 268,37 282,37 272,67 275,83 265,109 258,125 254,139 247,157 240,173 226,181 192,179 180,173 162,171 148,175 136,181 104,187 74,179 28,171 0,160 -21,144 -53,136 -90,149 -92,173 -111,205 -134,195 -185,179 -201,152 -249,136 -286,128 -321,109 -298,75 -309,59 -300,29 -316,31 -325,19 -355,29 -374,29 -408,24 -436,35 -485,32 -526,40 -568,61 -605,77 -644,75 -676,56ZM51,-55 62,-63 81,-79 115,-81 118,-87 122,-83 125,-73 92,-63 62,-60 53,-52ZM197,215 201,237 222,277 238,320 268,376 305,490 337,533 358,600 381,616 411,656 445,679 449,674 432,600 397,520 348,440 321,368 288,317 258,266 250,256 254,226 252,226 241,266 237,273 219,253ZM565,213 552,229 568,266 591,293 605,312 618,330 628,317 637,338 630,365 658,368 702,365 722,338 741,317 747,309 748,346 773,346 780,328 762,293 745,288 711,304 681,298 646,277 632,269 618,242 602,211 582,205ZM524,-179 545,-203 582,-224 635,-240 669,-234 672,-195 630,-173 630,-136 665,-101 669,-53 690,-24 690,19 635,32 600,16 577,-13 586,-59 568,-101 542,-131ZM-69,-12 -58,-9 -42,-11 -25,-6 -18,-1 -24,2 -39,-3 -51,-7 -60,-4 -69,-5Z' fill='#bcd9ef'/><path d='M-12,64 7,64 53,72 48,80 16,83 -12,72ZM192,80 208,69 245,61 228,80 208,91 194,88ZM-28,-24 -14,-25 5,-5 14,-1 2,-3 -16,-13Z' fill='#efe4c8' stroke='#b9a77c'/><path d='M148,175 162,197 167,212 167,240 157,266 159,277 171,293 189,312 201,317 200,328 198,338 205,371 194,400 175,418 170,432 152,466 148,490 150,502 162,522 180,518 196,509 215,492 228,520 231,541 225,561 197,597 196,666 175,759' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M367,-11 375,2 420,18 441,44 444,68 454,91 459,101 470,125 504,147 534,164 541,187' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M342,-37 330,0 323,31 346,55 373,71 390,92 424,103 434,116 456,124 471,145 492,179 514,185 541,187 549,200 565,213' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><circle cx='499' cy='178' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='183' cy='315' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='148' cy='176' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><g font-size='18' font-weight='700' stroke='#fff' stroke-width='4' paint-order='stroke' text-anchor='middle'><text x='92' y='117' fill='#1d5c8a' font-style='italic'>Mediterranean</text><text x='305' y='386' fill='#1d5c8a' font-style='italic'>Red Sea</text><text x='508' y='184' fill='#1f2937' text-anchor='start'>Uruk</text><text x='174' y='321' fill='#1f2937' text-anchor='end'>Abydos</text><text x='148' y='165' fill='#1f2937' text-anchor='middle'>Rosetta</text></g></svg>"}},{"say":"Egyptian <b>hieroglyphs</b> ('sacred carvings', in Greek) mix three kinds of sign. Classic Middle Egyptian used about 700 common signs, written in rows or columns, facing the start of the line.","show":HX.tb(...[[["Kind of sign","What it does","Example"],["Logogram","Stands for a whole word","A sun disc = 'sun' or 'day'"],["Phonogram","Stands for sounds","A mouth = the sound r"],["Determinative","Silent sign showing the category","A seated man after a man's name"]]])},{"say":"Training as a <b>scribe</b> took years, and few Egyptians could read. Scribes wrote in ink on <b>papyrus</b>, using quicker scripts called <b>hieratic</b> and <b>demotic</b> for everyday work.","show":HX.tb(...[[["Script","Used for","Period (about)"],["Hieroglyphic","Monuments, temples, tombs","3200 BC – AD 394"],["Hieratic","Everyday documents on papyrus","3200 BC onward"],["Demotic","Business and law","650 BC – AD 452"]]])},{"say":"When Egypt's temples closed, the knowledge of hieroglyphs was lost for about 1,400 years. In 1799 French soldiers found the <b>Rosetta Stone</b>: a decree of 196 BC in two languages and three scripts. The Greek part could be read, so it was a key to the other two.","show":HX.tb(...[[["Section","Language","Script"],["Top","Egyptian","Hieroglyphic"],["Middle","Egyptian","Demotic"],["Bottom","Greek","Greek alphabet"]],"The Rosetta Stone, British Museum since 1802"])},{"say":"Royal names sat inside ovals called <b>cartouches</b>. Matching the signs in the names Ptolemy and Cleopatra showed that hieroglyphs record sounds, and in 1822 Champollion proved it.","show":HX.tb(...[[["Sound","Same sign in both names?"],["P","Yes"],["T","No: a loaf in Ptolemy, a hand in Cleopatra"],["O","Yes"],["L","Yes"]]])},{"say":"Egyptians wrote numbers additively with seven signs. To write 2,315 a scribe drew 2 lotus flowers, 3 coils of rope, 1 heel bone and 5 strokes. The order did not matter, and there was no zero.","show":HX.tb(...[[["Value","Sign"],["1","Single stroke"],["10","Heel bone"],["100","Coil of rope"],["1,000","Lotus flower"],["10,000","Raised finger"],["100,000","Tadpole"],["1,000,000","God Heh, arms raised"]]])},{"say":"<b>Explain it.</b> How was the Rosetta Stone used to decipher hieroglyphs? Explain why a text in two languages is such powerful evidence.","show":{"type":"list","items":["Say it in 2–4 complete sentences.","Use the precise words from this lesson.","Support each claim with evidence: how do we know?"],"caption":"Explain it — to a grown-up or in writing"}}],"practice":[{"q":"About when was writing first invented?","options":["About 9500 BC","About 3200 BC","About 776 BC","AD 1"],"answer":"About 3200 BC","hint":"It came after farming and before the pyramids.","why":"The earliest writing, in Sumer and Egypt, dates to about 3200 BC."},{"q":"What does the Greek word 'hieroglyph' mean?","options":["Picture story","Sacred carving","Royal letter","Secret code"],"answer":"Sacred carving","hint":"Hieros = sacred; glyphein = to carve.","why":"Hieroglyph comes from Greek words for sacred and carving, because the Greeks saw them on temples."},{"q":"A hieroglyph that stands for a sound rather than a whole word is a…","options":["logogram","phonogram","determinative","cartouche"],"answer":"phonogram","hint":"Phon- means sound (as in telephone).","why":"A phonogram represents sounds. Logograms stand for whole words; determinatives are silent category markers."},{"q":"A silent sign placed after a word to show its category (for example, a seated man after a man's name) is a…","options":["phonogram","determinative","cartouche","numeral"],"answer":"determinative","hint":"It determines what kind of thing the word means.","why":"Determinatives are not pronounced; they tell the reader the category, which helps tell apart words with the same sounds."},{"q":"What is papyrus?","options":["A kind of clay tablet","A writing material made from strips of a marsh plant pressed into sheets","A stone used for carving","An Egyptian god"],"answer":"A writing material made from strips of a marsh plant pressed into sheets","hint":"It grew along the Nile.","why":"Papyrus sheets were made from the pith of the papyrus reed, laid in crossing layers and pressed. Our word paper comes from it."},{"q":"Why was the Rosetta Stone the key to hieroglyphs?","options":["Champollion wrote it","It gave one decree in readable Greek and in Egyptian","It had a dictionary on the back","It was the oldest Egyptian text"],"answer":"It gave one decree in readable Greek and in Egyptian","hint":"Which part could people already read in 1799?","why":"Because the Greek text could be read, scholars knew what the Egyptian texts said and could match words and names."},{"q":"The Rosetta Stone has how many languages and how many scripts?","options":["Three languages, three scripts","Two languages (Egyptian and Greek), three scripts (hieroglyphic, demotic, Greek)","One language, two scripts","Two languages, two scripts"],"answer":"Two languages (Egyptian and Greek), three scripts (hieroglyphic, demotic, Greek)","hint":"Hieroglyphic and demotic are two ways of writing the same language.","why":"Egyptian appears in two scripts, hieroglyphic and demotic; Greek is the second language. So: two languages, three scripts."},{"q":"The Rosetta Stone's decree dates from 196 BC; the stone was found in AD 1799. How many years separate them?","type":"number","answer":1994,"hint":"Add, then subtract 1 for the missing year 0.","why":"196 + 1799 − 1 = 1994 years."},{"q":"Who announced the decipherment of hieroglyphs in 1822?","options":["Herodotus","Napoleon","Jean-François Champollion","Howard Carter"],"answer":"Jean-François Champollion","hint":"He knew Coptic, the late form of Egyptian.","why":"Champollion, building on work by Thomas Young, showed in 1822 that hieroglyphs combine sound signs and word signs."},{"q":"Why were cartouches so useful for decipherment?","options":["They were painted gold","They marked royal names, which could be matched with the same names in the Greek text","They contained numbers","They were always at the top of the stone"],"answer":"They marked royal names, which could be matched with the same names in the Greek text","hint":"Names sound about the same in every language.","why":"Names like Ptolemy and Cleopatra keep roughly the same sounds in Greek and Egyptian. Finding them inside cartouches gave scholars sure sound values for many signs."},{"q":"In the cartouches of Ptolemy and Cleopatra, the sounds p, o and l are written with the same signs. Why was this a strong test of the sound theory?","options":["Two independent names matched the same sound signs","Both names belonged to queens","The names are short","The signs were the same colour"],"answer":"Two independent names matched the same sound signs","hint":"One name could fit by luck. Could two?","why":"A pattern that holds in two independent names is unlikely to be chance. This cross-checking is corroboration, the same logic historians use for sources."},{"q":"Write in our numbers: 3 lotus flowers, 4 coils of rope, 2 heel bones and 7 strokes.","type":"number","answer":3427,"hint":"Lotus = 1,000, rope = 100, heel bone = 10, stroke = 1.","why":"3 × 1,000 + 4 × 100 + 2 × 10 + 7 × 1 = 3,000 + 400 + 20 + 7 = 3427."},{"q":"Why did Egyptian numerals not need a zero?","options":["Each sign kept its own value wherever it stood","Egyptians did not count","They used letters instead","The pharaoh forbade zero"],"answer":"Each sign kept its own value wherever it stood","hint":"In 305, why do we need the 0?","why":"In our place-value system, 0 holds an empty place. Egyptian signs each had a fixed value, so 305 was just 3 coils of rope and 5 strokes."},{"q":"What was hieratic?","options":["A quicker, joined-up script for writing on papyrus","A kind of temple","A Greek alphabet","The name of the Rosetta Stone"],"answer":"A quicker, joined-up script for writing on papyrus","hint":"Scribes needed something faster than carving pictures.","why":"Hieratic was a cursive form of hieroglyphs used for everyday documents; demotic was later and even faster."},{"q":"For about how long was the ability to read hieroglyphs lost?","options":["About 14 years","About 140 years","About 1,400 years","About 14,000 years"],"answer":"About 1,400 years","hint":"The last known hieroglyphic inscription dates from AD 394; decipherment came in 1822.","why":"From AD 394 to 1822 is about 1,428 years, roughly 1,400."},{"q":"Writing appeared in Sumer and Egypt at nearly the same time, about 3200 BC. What is the most careful conclusion?","options":["Egypt must have copied Sumer","Sumer must have copied Egypt","Contact is possible but unproven; the question is open","One person invented writing"],"answer":"Contact is possible but unproven; the question is open","hint":"Does closeness in time prove copying?","why":"Being close in time allows influence but does not prove it. The two systems use different signs and materials, so the question remains open; claiming certainty either way goes beyond the evidence."},{gen:HX.G.feature(8)},{gen:HX.G.egypt(8)},{gen:HX.G.egypt(8)},{gen:HX.G.mapdot(8)},{gen:HX.G.span(8)},{gen:HX.G.first(8)},{gen:HX.G.order(8)},{gen:HX.G.ago(8)}],"challenge":[{"q":"Before 1822, many scholars believed every hieroglyph was a symbol of a mystical idea, not a sound. Champollion's sound readings worked on new inscriptions he had never seen. Why is that strong evidence that he was right?","options":["Because he was famous","Correct predictions on new texts are hard to fake","Because the old theory was older","Because Greek is easier"],"answer":"Correct predictions on new texts are hard to fake","hint":"What is the difference between explaining and predicting?","why":"Any theory can be twisted to fit known examples. Successful predictions on fresh evidence are hard to fake, so they give strong support."},{"q":"A scribe writes a number using 1 tadpole, 2 raised fingers, 9 coils of rope and 9 strokes. What is the number?","type":"number","answer":120909,"hint":"Tadpole = 100,000; finger = 10,000. Note the places with no signs.","why":"100,000 + 2 × 10,000 + 9 × 100 + 9 × 1 = 100,000 + 20,000 + 900 + 9 = 120909."},{"q":"How many Egyptian signs are needed to write 9,999, at the fewest?","type":"number","answer":36,"hint":"Count signs for each place: thousands, hundreds, tens, ones.","why":"9 lotus + 9 ropes + 9 heel bones + 9 strokes = 36 signs. Our system needs only 4 digits: place value is far more compact."},{"q":"The last dated hieroglyphic inscription (AD 394) and the last demotic one (AD 452) come from the temple of Philae. What does it suggest that demotic outlasted hieroglyphic?","options":["Everyday script lasted a little longer than monumental script","Demotic was invented after hieroglyphs","Philae was abandoned in AD 394","Nothing at all"],"answer":"Everyday script lasted a little longer than monumental script","hint":"Who would still need to write ordinary documents?","why":"The more practical script stayed in use slightly longer. Both died as the old temples closed and Coptic, written in Greek letters plus a few signs taken from demotic, replaced them."},{gen:HX.G.gap2(8)}],"extend":"Read the chapter on the Rosetta Stone in a book such as 'The Keys of Egypt' by Lesley and Roy Adkins, or the British Museum's online pages. Write the story of the decipherment as a sequence of steps, marking which steps were guesses and which were tests.","offline":"Invent a cartouche for your name: give each sound a picture sign (a mouth for r, a snake for s, and so on) and add a determinative. Write it on 'papyrus' made of paper strips glued crosswise, and ask someone to decode it with your sign key."},
    {"title":"The Old Kingdom and the pyramids","icon":"🔺","learn":[{"say":"The <b>Old Kingdom</b> (about 2686–2181 BC) was Egypt's age of pyramids. The first, King Djoser's <b>Step Pyramid</b>, was designed by his official <b>Imhotep</b> about 2650 BC.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><path d='M30 170H570' stroke='#1f2937' stroke-width='4'/><circle cx='120' cy='170' r='8' fill='#1d5c8a'/><path d='M120 170V146' stroke='#1d5c8a' stroke-width='2'/><text x='120' y='118' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Step Pyramid</text><text x='120' y='140' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>(about 2650 BC)</text><circle cx='160' cy='170' r='8' fill='#1d5c8a'/><path d='M160 170V222' stroke='#1d5c8a' stroke-width='2'/><text x='160' y='242' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Sneferu's pyramids</text><text x='160' y='264' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>(about 2600 BC)</text><circle cx='192' cy='170' r='8' fill='#1d5c8a'/><path d='M192 170V100' stroke='#1d5c8a' stroke-width='2'/><text x='192' y='72' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Great Pyramid</text><text x='192' y='94' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>(about 2560 BC)</text><circle cx='495' cy='170' r='8' fill='#1d5c8a'/><path d='M495 170V222' stroke='#1d5c8a' stroke-width='2'/><text x='509' y='242' font-size='18' fill='#1f2937' text-anchor='end' font-weight='700'>Old Kingdom ends</text><text x='509' y='264' font-size='18' fill='#1f2937' text-anchor='end' font-weight='700'>(about 2181 BC)</text></svg>"}},{"say":"Builders learned by trial and error. King Sneferu's 'Bent Pyramid' changes angle halfway up, probably because the steep lower slope was becoming unstable. His next, the Red Pyramid, used the gentler angle from the start: the first true smooth-sided pyramid.","show":HX.tb(...[[["Pyramid","King","What it shows"],["Step Pyramid, Saqqara","Djoser","First large stone building"],["Bent Pyramid, Dahshur","Sneferu","A design corrected mid-build"],["Red Pyramid, Dahshur","Sneferu","First true pyramid"],["Great Pyramid, Giza","Khufu","Largest of all"]]])},{"say":"Khufu's <b>Great Pyramid</b> at Giza, finished about 2560 BC, was about 146 m tall with a square base about 230 m on each side, built from roughly 2.3 million blocks. It remained the tallest human-made structure on Earth for nearly 3,900 years.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><path d='M100 270L300 70L500 270Z' fill='#e9d8a6' stroke='#8a6d3b' stroke-width='3'/><path d='M300 70V270' stroke='#b42318' stroke-width='3' stroke-dasharray='8 6'/><path d='M100 290H500' stroke='#1f2937' stroke-width='3'/><path d='M100 282V298M500 282V298' stroke='#1f2937' stroke-width='3'/><text x='300' y='314' font-size='19' fill='#1f2937' text-anchor='middle' font-weight='700'>base: about 230 m each side</text><text x='312' y='205' font-size='18' fill='#b42318' text-anchor='start' font-weight='700'>146 m tall</text><text x='300' y='52' font-size='20' fill='#1f2937' text-anchor='middle' font-weight='700'>Great Pyramid of Khufu, as built</text><text x='20' y='110' font-size='18' fill='#4b5563' text-anchor='start' font-weight='700'>about 2.3 million blocks</text></svg>"}},{"say":"Who built the pyramids? Compare Herodotus, writing 2,100 years later, with the builders' tombs at Giza and the <b>Diary of Merer</b>, a logbook from Khufu's own reign found in 2013.","show":HX.tb(...[[["Source","What it says","Reliability"],["Herodotus (about 450 BC)","100,000 men in shifts","Written 2,100 years later"],["Workers' tombs at Giza (about 2560 BC)","Builders honoured near the king","Physical evidence from the time"],["Diary of Merer (about 2560 BC)","Stone shipped by boat; crews fed","Eyewitness, written at the time"]]])},{"say":"Egyptians believed the soul needed the body after death, so they <b>mummified</b> the dead. Embalmers removed the organs, dried the body with <b>natron</b>, and wrapped it: about 70 days in all.","show":HX.li(...[["1. Remove the brain; keep the main organs in canopic jars","2. Cover the body in natron for about 40 days to dry it","3. Anoint with oils and resins","4. Wrap in layers of linen with protective amulets","5. Place in the coffin and tomb, about 70 days after death"],"Mummification"])},{"say":"Around 2181 BC the Old Kingdom broke apart, as local governors grew stronger and, many scholars think, low Nile floods weakened the kings. The pyramids show both the power of a united state and its dependence on the river.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 680' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><rect width='600' height='680' fill='#efe4c8'/><path d='M-2520,-348 -2430,-399 -2257,-399 -2167,-476 -2122,-629 -2085,-705 -2033,-764 -1935,-798 -1860,-841 -1867,-934 -1785,-968 -1695,-951 -1552,-994 -1433,-1053 -1335,-1011 -1313,-926 -1267,-883 -1177,-828 -1125,-786 -1035,-747 -983,-705 -930,-684 -900,-595 -926,-510 -892,-510 -855,-544 -814,-595 -855,-654 -810,-718 -750,-671 -713,-692 -825,-773 -892,-841 -975,-849 -1057,-926 -1087,-985 -1170,-1036 -1177,-1104 -1170,-1147 -1072,-1164 -1072,-1113 -1013,-1130 -907,-985 -780,-934 -705,-883 -645,-832 -645,-714 -600,-654 -548,-586 -517,-535 -473,-450 -458,-408 -413,-374 -383,-399 -360,-374 -390,-467 -337,-450 -375,-501 -330,-505 -298,-480 -300,-527 -352,-561 -405,-582 -383,-612 -352,-603 -398,-671 -405,-714 -383,-731 -352,-697 -308,-714 -315,-743 -270,-756 -195,-756 -150,-747 -105,-731 -135,-684 -135,-671 -142,-637 -90,-620 -90,-569 -67,-544 -120,-535 -60,-501 -52,-442 -45,-425 8,-408 15,-395 83,-391 188,-365 202,-416 263,-399 338,-348 420,-357 495,-408 570,-391 615,-391 585,-297 592,-246 563,-161 540,-110 525,-68 503,-8 480,42 435,68 322,59 285,42 225,34 180,47 142,68 38,85 -60,59 -210,34 -300,0 -367,-51 -473,-76 -592,-34 -600,42 -660,144 -735,110 -900,59 -952,-25 -1110,-76 -1230,-102 -1342,-161 -1267,-272 -1305,-323 -1275,-416 -1327,-412 -1358,-450 -1455,-416 -1515,-416 -1627,-433 -1717,-399 -1875,-408 -2010,-382 -2145,-314 -2265,-263 -2392,-272 -2497,-331ZM341,174 353,246 420,374 472,510 570,688 690,1053 795,1189 863,1402 938,1453 1035,1580 1147,1656 1159,1639 1103,1402 990,1147 833,892 742,663 638,501 540,340 514,306 525,212 517,212 484,340 469,361 413,297Z' fill='#bcd9ef'/><path d='M180,47 225,119 242,166 244,255 210,340 217,374 255,425 315,484 353,501 349,535 345,569 367,672 330,764 270,824 251,866 195,977 180,1053 186,1090 225,1155 285,1142 338,1113 397,1059 442,1147 450,1215 431,1279 340,1393 338,1614 270,1911' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M242,166 255,102 285,42' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M340,1393 405,1503 480,1682 547,1767 705,1733' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><circle cx='235' cy='172' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='241' cy='181' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='349' cy='255' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='367' cy='672' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><g font-size='18' font-weight='700' stroke='#fff' stroke-width='4' paint-order='stroke' text-anchor='middle'><text x='225' y='17' fill='#1d5c8a' font-style='italic'>Mediterranean Sea</text><text x='517' y='510' fill='#1d5c8a' font-style='italic'>Red Sea</text><text x='322' y='408' fill='#1d5c8a' font-style='italic'>Nile</text><text x='226' y='178' fill='#1f2937' text-anchor='end'>Giza</text><text x='241' y='205' fill='#1f2937' text-anchor='middle'>Saqqara</text><text x='358' y='261' fill='#1f2937' text-anchor='start'>Wadi al-Jarf</text><text x='376' y='678' fill='#1f2937' text-anchor='start'>Aswan (granite)</text></g><g font-size='18' font-weight='700'><path d='M14 666h76' stroke='#1f2937' stroke-width='4'/><text x='14' y='658' fill='#1f2937' stroke='#fff' stroke-width='4' paint-order='stroke'>100 km</text></g></svg>"}},{"say":"<b>Explain it.</b> How do we know who built the pyramids? Compare Herodotus with the evidence from Giza and the Diary of Merer, and say which you trust more and why.","show":{"type":"list","items":["Say it in 2–4 complete sentences.","Use the precise words from this lesson.","Support each claim with evidence: how do we know?"],"caption":"Explain it — to a grown-up or in writing"}}],"practice":[{"q":"Which pyramid came first?","options":["Djoser's Step Pyramid at Saqqara","Khufu's Great Pyramid","Sneferu's Red Pyramid","The Bent Pyramid"],"answer":"Djoser's Step Pyramid at Saqqara","hint":"Its design was stacked platforms.","why":"Djoser's Step Pyramid, about 2650 BC, designed by Imhotep, was the first large stone pyramid."},{"q":"Who designed the Step Pyramid?","options":["Khufu","Herodotus","Imhotep","Narmer"],"answer":"Imhotep","hint":"He was Djoser's chief official.","why":"Imhotep, Djoser's official, is credited with the design. Later Egyptians honoured him as a wise man and even a god of healing."},{"q":"Why does the Bent Pyramid change angle halfway up?","options":["The king changed his mind for fun","The builders probably found the steep lower slope unstable and finished at a safer angle","An earthquake bent it","It was built by two different civilisations"],"answer":"The builders probably found the steep lower slope unstable and finished at a safer angle","hint":"What would make builders change a plan mid-way?","why":"The most likely explanation is engineering trouble: cracks and settling in the steeper part. The Red Pyramid then used the gentler angle from the start: learning from failure."},{"q":"About when was the Great Pyramid finished?","options":["About 3100 BC","About 2560 BC","About 1550 BC","About 30 BC"],"answer":"About 2560 BC","hint":"It was in the reign of Khufu, in the Old Kingdom.","why":"Khufu's pyramid was completed about 2560 BC."},{"q":"The Great Pyramid was originally about 146 m tall; erosion and the loss of its outer casing stones have reduced it to about 139 m. About how many metres has it lost?","type":"number","answer":7,"hint":"Subtract.","why":"146 − 139 = 7 m."},{"q":"The Great Pyramid has about 2.3 million blocks. If it took 20 years to build, about how many blocks were set each year?","type":"number","answer":115000,"hint":"2,300,000 ÷ 20.","why":"2,300,000 ÷ 20 = 115000 blocks a year."},{"q":"Herodotus wrote that 100,000 men built the Great Pyramid. Why must historians treat this number with caution?","options":["Herodotus never visited Egypt","He wrote about 2,100 years after the building, relying on what priests told him","Herodotus disliked Egypt","Numbers cannot be checked at all"],"answer":"He wrote about 2,100 years after the building, relying on what priests told him","hint":"How close in time was he to the events?","why":"Herodotus was far removed in time and depended on oral tradition, so his number is a late report, not an eyewitness count. Archaeology suggests a smaller permanent workforce."},{"q":"What is the Diary of Merer?","options":["A modern novel about pyramids","Papyri from Khufu's reign recording boat trips that carried limestone to Giza","A list of pharaohs","Herodotus's travel notes"],"answer":"Papyri from Khufu's reign recording boat trips that carried limestone to Giza","hint":"It was found in 2013 at Wadi al-Jarf.","why":"Merer's logbook, the oldest inscribed papyri known, records his crew shipping limestone from the Tura quarries to Giza: a primary source from the building years."},{"q":"Which evidence most strongly suggests the builders were not slaves treated as worthless?","options":["Hollywood films","Workers' tombs built near the pyramids, with offerings of bread and beer","The pyramid's size","Herodotus's stories"],"answer":"Workers' tombs built near the pyramids, with offerings of bread and beer","hint":"Where were the workers buried, and how?","why":"Workers were buried in their own tombs near the king's pyramid, with provisions for the afterlife. That honour would be strange for despised slaves. Most were probably paid, conscripted labourers."},{"q":"What was natron used for in mummification?","options":["Painting the coffin","Drying out the body","Making linen","Carving the tomb"],"answer":"Drying out the body","hint":"It is a natural salt.","why":"Natron, a salt found in dry lake beds, drew water out of the body so that it would not decay."},{"q":"Why did Egyptians mummify their dead?","options":["They believed the soul needed a preserved body in the afterlife","To frighten tomb robbers","Because of a law of Hammurabi","To study medicine"],"answer":"They believed the soul needed a preserved body in the afterlife","hint":"What did they believe happened after death?","why":"Egyptians believed parts of the soul returned to the body, so the body had to be preserved for eternal life."},{"q":"Mummification took about 70 days. About how many weeks is that?","type":"number","answer":10,"hint":"7 days make a week.","why":"70 ÷ 7 = 10 weeks."},{"q":"What were canopic jars for?","options":["Storing grain for the workers","Holding the dead person's preserved internal organs","Carrying Nile water","Making ink"],"answer":"Holding the dead person's preserved internal organs","hint":"The organs were removed first.","why":"The stomach, intestines, lungs and liver were preserved and stored in four canopic jars placed in the tomb."},{"q":"What helped end the Old Kingdom about 2181 BC?","options":["An invasion by Rome","Low Nile floods and the growing power of local governors","The building of the Great Pyramid","The invention of writing"],"answer":"Low Nile floods and the growing power of local governors","hint":"Recall the lesson on the gift of the Nile.","why":"Poor floods meant poor harvests, weakening the kings while provincial governors gained power. Egypt split for a time."},{"q":"The Great Pyramid's base is a square about 230 m on each side. What is its area in square metres?","type":"number","answer":52900,"hint":"Area of a square = side × side.","why":"230 × 230 = 52900 square metres, about seven football pitches."},{"q":"Put these pyramids in the order they were built.","type":"order","items":["Red Pyramid of Sneferu","Bent Pyramid of Sneferu","Step Pyramid of Djoser","Great Pyramid of Khufu"],"answer":["Step Pyramid of Djoser","Bent Pyramid of Sneferu","Red Pyramid of Sneferu","Great Pyramid of Khufu"],"hint":"Step first; then Sneferu's experiments; then his son Khufu.","why":"Djoser (about 2650 BC), then Sneferu's Bent and Red pyramids (about 2600 BC), then Khufu's Great Pyramid (about 2560 BC). Khufu was Sneferu's son."},{gen:HX.G.mapdot(9)},{gen:HX.G.feature(9)},{gen:HX.G.egypt(9)},{gen:HX.G.span(9)},{gen:HX.G.first(9)},{gen:HX.G.order(9)},{gen:HX.G.century(9)},{gen:HX.G.ago(9)},{gen:HX.G.country(9)}],"challenge":[{"q":"A pyramid's volume is one third of base area × height. Using a base of 230 m by 230 m and a height of 147 m, find the Great Pyramid's volume in cubic metres.","type":"number","answer":2592100,"hint":"Base area first (230 × 230). Then multiply by 147 and divide by 3; dividing 147 by 3 first is easier.","why":"230 × 230 = 52,900. 147 ÷ 3 = 49. 52,900 × 49 = 2,592,100 cubic metres."},{"q":"At 115,000 blocks a year, working every day of a 365-day year, about how many blocks were set per day? Round to the nearest whole number.","type":"number","answer":315,"hint":"115,000 ÷ 365.","why":"115,000 ÷ 365 = 315.07…, about 315 blocks a day: in a 10-hour day, roughly one block every two minutes."},{"q":"Herodotus says 100,000 men; archaeologists estimate a permanent workforce nearer 20,000 to 30,000, with more at certain seasons. Which reasoning best explains why these could both come from honest people?","options":["They may be counting different things with different evidence","One of them must be lying","The numbers are the same","Archaeologists copy Herodotus"],"answer":"They may be counting different things with different evidence","hint":"Are both numbers measuring exactly the same thing?","why":"Different sources can measure different things. A tradition might count everyone who ever took a shift, while a town's size suggests how many lived there at once. Careful historians ask what each number actually measures."},{"q":"Merer's papyri and the workers' tombs are both primary sources. Why is their agreement especially valuable?","options":["The same person wrote them","Independent kinds of evidence agree","Both are in museums","They prove Herodotus right"],"answer":"Independent kinds of evidence agree","hint":"Corroboration is strongest when sources are independent.","why":"A logbook and a cemetery could not have copied each other. When a document and archaeology agree that organised, fed and honoured crews built the pyramid, the conclusion is well supported."},{"q":"The Great Pyramid (about 2560 BC) was the tallest human-made structure until Lincoln Cathedral's spire was finished in about AD 1311. About how many years is that?","type":"number","answer":3870,"hint":"Crossing BC to AD: add, then subtract 1.","why":"2560 + 1311 − 1 = 3870 years, nearly 3,900."},{gen:HX.G.gap2(9)}],"extend":"Read about the Diary of Merer (for example in Pierre Tallet's reports or the Smithsonian magazine article 'The Oldest Papyri'). Write a short diary entry for one of Merer's days, using only details the papyri support, and underline anything you had to imagine.","offline":"Build a model pyramid from sugar cubes or Lego with a square base of 6 × 6. Count the cubes in each layer and the total. Then work out how many cubes a 10 × 10 base pyramid would need, and check by building or drawing it."},
    {"title":"Sumer: the first cities","icon":"🏺","learn":[{"say":"<b>Mesopotamia</b> means 'between the rivers': the Tigris and Euphrates, mostly in modern Iraq. In its far south, <b>Sumer</b>, the first true cities grew after about 3500 BC.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 572' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><rect width='600' height='572' fill='#efe4c8'/><path d='M510,501 474,544 516,644 576,715 612,765 648,816 672,780 696,837 678,909 750,916 864,909 918,837 966,780 981,758 984,859 1050,859 1068,808 1020,715 978,701 888,744 810,730 720,672 684,651 648,579 606,494 552,479ZM402,-551 456,-615 552,-672 690,-715 780,-701 786,-594 678,-537 678,-436 768,-343 780,-215 834,-136 834,-21 690,14 600,-29 540,-107 564,-229 516,-343 450,-422ZM198,1753 198,1817 270,1903 420,1853 672,1803 660,1903 540,2182 480,2289 318,2504 120,2719 0,2862 -42,3134 24,3384 60,4078 300,5509 3600,5509 3600,2289 3498,2075 3462,1467 3258,1502 3240,1259 3138,1166 3108,1052 3030,1066 2970,1073 2892,1095 2820,1109 2748,1231 2598,1381 2538,1459 2412,1517 2418,1710 2388,1910 2292,2017 2250,2068 2178,1939 2088,1724 2028,1538 1968,1288 1956,1130 1848,1166 1740,1045 1812,1009 1710,966 1650,930 1620,873 1596,830 1296,844 1068,816 984,859 996,901 1050,944 1116,959 1188,1037 1116,1188 1068,1288 1002,1359 900,1431 732,1524 540,1610 300,1731 210,1738Z' fill='#bcd9ef'/><path d='M-6,-100 14,-65 131,-24 188,47 196,110 221,172 232,200 263,263 350,322 429,369 446,429' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M-72,-172 -102,-72 -120,12 -60,75 9,119 53,175 142,205 168,240 227,261 265,319 318,408 376,426 446,429 468,465 510,501' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><circle cx='338' cy='406' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='366' cy='432' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='359' cy='442' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='384' cy='401' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='314' cy='348' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='276' cy='318' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><g font-size='18' font-weight='700' stroke='#fff' stroke-width='4' paint-order='stroke' text-anchor='middle'><text x='252' y='172' fill='#1d5c8a' font-style='italic'>Tigris</text><text x='108' y='258' fill='#1d5c8a' font-style='italic'>Euphrates</text><text x='456' y='336' fill='#6d28d9'>SUMER</text><text x='504' y='551' fill='#1d5c8a' font-style='italic'>Persian Gulf</text><text x='329' y='412' fill='#1f2937' text-anchor='end'>Uruk</text><text x='375' y='438' fill='#1f2937' text-anchor='start'>Ur</text><text x='359' y='466' fill='#1f2937' text-anchor='middle'>Eridu</text><text x='384' y='390' fill='#1f2937' text-anchor='middle'>Lagash</text><text x='323' y='354' fill='#1f2937' text-anchor='start'>Nippur</text><text x='267' y='324' fill='#1f2937' text-anchor='end'>Kish</text></g><g font-size='18' font-weight='700'><path d='M14 558h64' stroke='#1f2937' stroke-width='4'/><text x='14' y='550' fill='#1f2937' stroke='#fff' stroke-width='4' paint-order='stroke'>100 km</text></g></svg>"}},{"say":"Unlike the Nile, these rivers flooded at the wrong time and without warning. Building and running <b>irrigation canals</b> needed leaders and records, and cities such as <b>Uruk</b> grew large.","show":HX.tb(...[[["","Nile","Tigris and Euphrates"],["Flood timing","Regular, late summer","Spring, unpredictable, sometimes violent"],["Solution","Basin farming with the flood","Canals, dykes and constant labour"],["Result","One unified kingdom","Many rival city-states"]]])},{"say":"Sumer was divided into <b>city-states</b>: each city ruled its surrounding farmland, had its own patron god, and often fought its neighbours over water and land. At the centre stood a temple on a great stepped platform called a <b>ziggurat</b>.","show":HX.tb(...[[["City","Patron god"],["Ur","Nanna, the moon god"],["Uruk","Inanna, goddess of love and war"],["Eridu","Enki, god of fresh water and wisdom"],["Nippur","Enlil, chief of the gods"]]])},{"say":"Writing grew out of <b>accounting</b>: tokens, then signs on clay tablets by about 3200 BC. These became <b>cuneiform</b>, wedge-shaped marks used for about 3,000 years.","show":HX.li(...[["About 8000 BC: clay tokens count goods","About 3500 BC: tokens sealed inside clay envelopes, marked on the outside","About 3200 BC: signs drawn on flat tablets: proto-cuneiform","About 2600 BC: wedge-shaped signs that record sounds and words: literature, letters, laws"],"From counting to writing"])},{"say":"Sumerians counted in <b>base 60</b>. Sixty divides evenly by 1, 2, 3, 4, 5, 6, 10, 12, 15, 20, 30 and 60, which makes fractions easy. Their system lives on every time you read a clock (60 seconds, 60 minutes) or measure an angle (360 degrees).","show":HX.tb(...[[["Babylonian place","Value","Example: 1, 20, 5"],["3,600s","60 × 60","1 × 3,600 = 3,600"],["60s","60","20 × 60 = 1,200"],["1s","1","5 × 1 = 5"],["Total","","4,805"]]])},{"say":"The <b>Sumerian King List</b> says its first king ruled 28,800 years. Historians separate its legendary early part from later reigns that other records confirm.","show":{"type":"big","text":"King List: first king ruled 28,800 years\n→ legend, not history","caption":"A source can mix fact and legend"}},{"say":"<b>Explain it.</b> Why did the first cities grow in Sumer, and why did writing begin with accounting? Use the words irrigation, surplus and cuneiform.","show":{"type":"list","items":["Say it in 2–4 complete sentences.","Use the precise words from this lesson.","Support each claim with evidence: how do we know?"],"caption":"Explain it — to a grown-up or in writing"}}],"practice":[{"q":"What does 'Mesopotamia' mean?","options":["Land of the pharaohs","Land between the rivers","Black land","Land of kings"],"answer":"Land between the rivers","hint":"It is Greek: mesos = middle, potamos = river.","why":"Mesopotamia means the land between the rivers, the Tigris and Euphrates."},{"q":"Which two rivers watered Mesopotamia?","options":["The Nile and the Jordan","The Tigris and the Euphrates","The Indus and the Ganges","The Yellow River and the Yangtze"],"answer":"The Tigris and the Euphrates","hint":"Look at the map.","why":"The Tigris (east) and Euphrates (west) frame Mesopotamia."},{"q":"Most of ancient Mesopotamia lies in which modern country?","options":["Egypt","Iraq","Greece","India"],"answer":"Iraq","hint":"Its capital, Baghdad, is on the Tigris.","why":"Most of Mesopotamia lies in modern Iraq, with parts in Syria, Turkey and Iran."},{"q":"Why did Sumerians need large irrigation canals?","options":["The rivers never flooded","Floods were unpredictable and came at the wrong time","Canals were only for boats","It rained every day"],"answer":"Floods were unpredictable and came at the wrong time","hint":"Compare with the Nile's regular flood.","why":"The Tigris and Euphrates flooded in spring, often violently, before crops needed water. Canals and dykes controlled and stored it."},{"q":"What was a city-state?","options":["A state with no cities","An independent city ruling the farmland around it","A province of Egypt","A kind of temple"],"answer":"An independent city ruling the farmland around it","hint":"Sumer had many, each with its own ruler and god.","why":"A city-state was a self-governing city with its surrounding land. Sumer's city-states often fought over water and borders."},{"q":"What was a ziggurat?","options":["A royal tomb","A stepped temple platform at the heart of a city","A canal","A clay tablet"],"answer":"A stepped temple platform at the heart of a city","hint":"Compare its shape to the Step Pyramid, but it was not a tomb.","why":"A ziggurat was a huge stepped platform with a temple on top. Unlike pyramids, ziggurats were not tombs."},{"q":"What does 'cuneiform' mean?","options":["Picture writing","Wedge-shaped","Sacred carving","Clay book"],"answer":"Wedge-shaped","hint":"Latin cuneus means wedge.","why":"Cuneiform means wedge-shaped, from the marks a reed stylus makes in clay."},{"q":"Writing in Sumer began mainly to…","options":["record poetry","keep accounts of goods such as grain and livestock","write letters to Egypt","record dreams"],"answer":"keep accounts of goods such as grain and livestock","hint":"The earliest tablets are lists of numbers and goods.","why":"The earliest proto-cuneiform tablets are economic records from temples, tracking goods and rations."},{"q":"Sixty can be divided evenly by how many whole numbers (including 1 and 60)?","type":"number","answer":12,"hint":"List them in pairs: 1 × 60, 2 × 30, …","why":"Pairs: 1·60, 2·30, 3·20, 4·15, 5·12, 6·10. That is 12 divisors: 1, 2, 3, 4, 5, 6, 10, 12, 15, 20, 30, 60."},{"q":"How many seconds are there in one hour? (60 seconds in a minute, 60 minutes in an hour.)","type":"number","answer":3600,"hint":"60 × 60.","why":"60 × 60 = 3600 seconds: the same as the Babylonian third place value."},{"q":"Which of these do we still use today because of Mesopotamian base 60?","options":["The 10-digit number system","60 minutes in an hour and 360 degrees in a circle","The alphabet","The 7-day week only"],"answer":"60 minutes in an hour and 360 degrees in a circle","hint":"Look at a clock.","why":"Our hours, minutes, seconds and degrees continue the Sumerian and Babylonian base-60 system."},{"q":"The Sumerian King List says its first king ruled for 28,800 years. How should a historian treat this?","options":["As an exact fact","As legend: no one reigns for thousands of years","As proof that kings were giants","As a source to ignore entirely"],"answer":"As legend: no one reigns for thousands of years","hint":"Is the claim possible? Does any other evidence support it?","why":"The claim is impossible as literal history. Historians treat the early list as legend while testing its later entries against inscriptions, which often confirm them."},{"q":"Which Sumerian invention appears by about 3500 BC?","options":["Iron swords","Paper","The wheel","Coins"],"answer":"The wheel","hint":"Potters and carts both used it.","why":"Wheels for pottery and for carts appear in Mesopotamia by about 3500 BC."},{"q":"Why did Sumer become many city-states rather than one kingdom like Egypt? Choose the best-supported reason.","options":["Each city had its own canals and land, and rivals fought over water","Sumerians did not want kings","Deserts separated every city","Egypt forbade unity"],"answer":"Each city had its own canals and land, and rivals fought over water","hint":"What did each city control and fight about?","why":"Each city managed its own canals and fields, and rivalry over water and land kept them apart until conquerors such as Sargon united them."},{"q":"Put the steps in the development of writing in order.","type":"order","items":["Signs on flat tablets","Marked clay envelopes","Clay tokens","Wedges recording words"],"answer":["Clay tokens","Marked clay envelopes","Signs on flat tablets","Wedges recording words"],"hint":"Writing grew from counting.","why":"Tokens (about 8000 BC) → marked envelopes (about 3500 BC) → proto-cuneiform tablets (about 3200 BC) → full cuneiform able to record language."},{gen:HX.G.base60(10)},{gen:HX.G.base60(10)},{gen:HX.G.mapdot(10)},{gen:HX.G.feature(10)},{gen:HX.G.span(10)},{gen:HX.G.first(10)},{gen:HX.G.order(10)},{gen:HX.G.century(10)},{gen:HX.G.country(10)}],"challenge":[{"q":"A Babylonian scribe writes a number with 2 in the 3,600s place, 0 (an empty space) in the 60s place and 45 in the ones place. What is it in our numbers?","type":"number","answer":7245,"hint":"Each place is worth 60 times the next.","why":"2 × 3,600 + 0 × 60 + 45 = 7,200 + 45 = 7245. Early scribes had no zero sign and just left a gap, which could be misread: a real weakness."},{"q":"A temple gives each worker 2 litres of barley a day. How many litres does it need for 60 workers for 30 days?","type":"number","answer":3600,"hint":"Workers × days × litres.","why":"60 × 30 × 2 = 3600 litres. Records like this are exactly what the first tablets contain."},{"q":"Why might a base-60 system be more convenient than base 10 for sharing grain?","options":["60 divides evenly by 2, 3, 4, 5 and 6","60 is a smaller number","Base 10 had not been invented","Grain comes in sixties"],"answer":"60 divides evenly by 2, 3, 4, 5 and 6","hint":"Try dividing 60 and 10 by 3 and by 4.","why":"60 ÷ 3 = 20 and 60 ÷ 4 = 15 exactly, but 10 ÷ 3 and 10 ÷ 4 are not whole. More divisors mean easier fair shares."},{"q":"Most early cuneiform tablets record goods, rations and debts. A student concludes: 'Sumerians cared only about money, not stories.' Evaluate the argument.","options":["Sound: the tablets prove it","Unsound: early writing was for accounts; stories were oral","Sound, because accounts are dull","It is a preference"],"answer":"Unsound: early writing was for accounts; stories were oral","hint":"Does the purpose of an early tool show everything a people valued?","why":"The premise is true but the conclusion does not follow. Writing began as bookkeeping; oral storytelling needed no writing. Later tablets preserve myths, hymns and epics."},{"q":"Uruk's wall was about 9 km long. If a person walks 4 km an hour, how many minutes would a full circuit take?","type":"number","answer":135,"hint":"Hours first (9 ÷ 4), then convert to minutes.","why":"9 ÷ 4 = 2.25 hours = 2 hours 15 minutes = 135 minutes."},{gen:HX.G.gap2(10)}],"extend":"Look up the British Museum's or Penn Museum's online images of proto-cuneiform tablets from Uruk. Choose one and describe what is recorded, what the numbers might mean, and what you cannot tell from the tablet alone.","offline":"Make a clay or play-dough tablet. Use the end of a chopstick or straw as a stylus to press wedge marks. Invent signs for three goods (grain, sheep, beer) and record a temple's stock, then have someone read it back without your help."},
    {"title":"Akkad and the first empire","icon":"👑","learn":[{"say":"About 2334 BC (by the usual 'middle chronology', one of several dating schemes for this era) <b>Sargon of Akkad</b> conquered Sumer and lands beyond. An <b>empire</b> is a state in which one ruler governs many lands and peoples; his is the first we know of.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 492' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><defs><mask id='m'><rect width='600' height='492' fill='#fff'/><path d='M-1219,148 -1181,125 -1108,125 -1071,91 -1052,23 -1036,-11 -1014,-38 -973,-53 -941,-72 -944,-114 -909,-129 -872,-121 -812,-140 -761,-167 -720,-148 -711,-110 -692,-91 -654,-66 -632,-47 -594,-30 -572,-11 -549,-2 -537,38 -548,76 -534,76 -518,61 -501,38 -518,11 -499,-17 -474,4 -458,-6 -505,-42 -534,-72 -568,-76 -603,-110 -616,-136 -651,-159 -654,-189 -651,-208 -609,-216 -609,-193 -584,-201 -540,-136 -486,-114 -455,-91 -429,-68 -429,-15 -411,11 -388,42 -376,64 -357,102 -351,121 -332,136 -319,125 -309,136 -322,95 -300,102 -316,80 -297,78 -283,89 -284,68 -306,53 -328,44 -319,30 -306,34 -325,4 -328,-15 -319,-23 -306,-8 -287,-15 -291,-28 -272,-34 -240,-34 -221,-30 -202,-23 -215,-2 -215,4 -218,19 -196,27 -196,49 -186,61 -208,64 -183,80 -180,106 -177,114 -155,121 -152,127 -123,129 -79,140 -73,117 -47,125 -16,148 19,144 51,121 82,129 101,129 88,170 92,193 79,231 69,254 63,273 54,299 44,322 25,333 -22,329 -38,322 -63,318 -82,324 -98,333 -142,341 -183,329 -246,318 -284,303 -313,280 -357,269 -407,288 -411,322 -436,367 -467,352 -537,329 -559,292 -625,269 -676,258 -723,231 -692,182 -707,159 -695,117 -717,119 -729,102 -771,117 -796,117 -843,110 -881,125 -947,121 -1004,133 -1061,163 -1112,186 -1165,182 -1209,155ZM-126,-45 -158,-61 -174,-95 -161,-121 -139,-144 -104,-197 -73,-246 -38,-250 -13,-227 -16,-204 16,-170 47,-174 76,-189 111,-201 158,-170 212,-136 272,-61 253,-42 212,-38 167,-36 104,-49 66,-76 9,-76 -54,-45ZM-14,381 -9,413 19,470 41,530 82,610 133,773 177,833 >"}},{"say":"Sargon's capital, <b>Akkad</b>, is named on thousands of tablets but has never been found. Absence of evidence is not evidence of absence.","show":{"type":"big","text":"Akkad: mentioned in texts, never located","caption":"Absence of evidence ≠ evidence of absence"}},{"say":"A text written about 1,500 years after Sargon says he was set adrift in a reed basket. Historians call that legend, while inscriptions from his own dynasty support his conquests.","show":HX.tb(...[[["Claim about Sargon","Source","Status"],["He conquered Sumer","Inscriptions of his dynasty, copied later","Well supported"],["He ruled from Akkad","Many tablets","Well supported, site unknown"],["He was found in a basket on a river","Text written about 1,500 years later","Legend"]]])},{"say":"Sargon's daughter <b>Enheduanna</b>, high priestess at Ur, is the earliest author known by name. Akkadian, related to Hebrew and Arabic, became the Near East's common language.","show":HX.li(...[["Enheduanna: earliest named author (about 2285–2250 BC)","Akkadian: written in cuneiform, used in diplomacy for 2,000 years","Naram-Sin, Sargon's grandson, called himself 'king of the four quarters' of the world"],"The Akkadian legacy"])},{"say":"Akkad collapsed about 2154 BC amid revolt, invasion and drought. Then <b>Ur-Nammu</b> of Ur built its great ziggurat and issued the oldest law code that survives.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><path d='M30 170H570' stroke='#1f2937' stroke-width='4'/><circle cx='89' cy='170' r='8' fill='#1d5c8a'/><path d='M89 170V146' stroke='#1d5c8a' stroke-width='2'/><text x='75' y='118' font-size='18' fill='#1f2937' text-anchor='start' font-weight='700'>Sargon begins</text><text x='75' y='140' font-size='18' fill='#1f2937' text-anchor='start' font-weight='700'>to rule</text><circle cx='223' cy='170' r='8' fill='#1d5c8a'/><path d='M223 170V222' stroke='#1d5c8a' stroke-width='2'/><text x='223' y='242' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Akkad</text><text x='223' y='264' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>collapses</text><circle cx='254' cy='170' r='8' fill='#1d5c8a'/><path d='M254 170V100' stroke='#1d5c8a' stroke-width='2'/><text x='254' y='72' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Ur-Nammu</text><text x='254' y='94' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>of Ur</text><circle cx='520' cy='170' r='8' fill='#1d5c8a'/><path d='M520 170V222' stroke='#1d5c8a' stroke-width='2'/><text x='534' y='242' font-size='18' fill='#1f2937' text-anchor='end' font-weight='700'>Hammurabi's</text><text x='534' y='264' font-size='18' fill='#1f2937' text-anchor='end' font-weight='700'>code</text></svg>"}},{"say":"The <b>Epic of Gilgamesh</b> tells of a king of Uruk who seeks to escape death. In 1872 George Smith read a tablet of it describing a great flood, and caused a sensation.","show":HX.tb(...[[["Kind of state","Who rules","Example"],["City-state","One city and its farmland","Uruk, Ur, Lagash"],["Kingdom","One people's land","Egypt"],["Empire","Many peoples and lands under one ruler","Akkad"]]])},{"say":"<b>Explain it.</b> What is an empire, and how was Sargon's different from a Sumerian city-state? Explain also how historians separate the facts of Sargon's life from legend.","show":{"type":"list","items":["Say it in 2–4 complete sentences.","Use the precise words from this lesson.","Support each claim with evidence: how do we know?"],"caption":"Explain it — to a grown-up or in writing"}}],"practice":[{"q":"What is an empire?","options":["A single city and its fields","A state where one ruler governs many lands and peoples","Any country with a king","A temple community"],"answer":"A state where one ruler governs many lands and peoples","hint":"Think of Sargon ruling Sumerians, Akkadians and Elamites.","why":"An empire brings many peoples and territories under one ruler, usually by conquest."},{"q":"Who founded the first known empire, about 2334 BC?","options":["Hammurabi","Narmer","Sargon of Akkad","Gilgamesh"],"answer":"Sargon of Akkad","hint":"His capital was Akkad.","why":"Sargon of Akkad united Mesopotamia and beyond into the first known empire."},{"q":"What is unusual about the city of Akkad?","options":["It was underwater","It is mentioned in thousands of texts, but its site has never been found","It was built of iron","It still exists today"],"answer":"It is mentioned in thousands of texts, but its site has never been found","hint":"Have archaeologists located it?","why":"Akkad's ruins have not been identified. Texts show it existed; we simply have not found where."},{"q":"Akkad has not been found. Which conclusion is logical?","options":["Akkad never existed","We do not yet know where Akkad was; the many texts are good evidence that it existed","The texts must be forgeries","Akkad was a myth like Atlantis"],"answer":"We do not yet know where Akkad was; the many texts are good evidence that it existed","hint":"Is failing to find something proof it was not there?","why":"Absence of evidence is not evidence of absence, especially when many independent texts name the city. The sensible conclusion is that its site is unknown."},{"q":"The story of baby Sargon found in a river basket comes from a text written about 1,500 years after his time. How should historians treat it?","options":["As a reliable eyewitness account","As legend: it is very late and story-like, so it cannot be relied on as history","As proof Sargon was Egyptian","As a law code"],"answer":"As legend: it is very late and story-like, so it cannot be relied on as history","hint":"How close in time is the source?","why":"A source 1,500 years later with a folk-tale shape is weak evidence. Historians label it legend unless earlier evidence supports it."},{"q":"Who is the earliest author in history known by name?","options":["Homer","Herodotus","Enheduanna, Sargon's daughter","Confucius"],"answer":"Enheduanna, Sargon's daughter","hint":"She was a high priestess at Ur.","why":"Enheduanna, high priestess of the moon god at Ur, is credited with hymns about 4,300 years ago, making her the earliest named author."},{"q":"Akkadian is related to which modern languages?","options":["English and German","Hebrew and Arabic","Chinese and Japanese","Greek and Latin"],"answer":"Hebrew and Arabic","hint":"They belong to the same language family: Semitic.","why":"Akkadian was a Semitic language, related to Hebrew, Aramaic and Arabic."},{"q":"Which ruler issued the oldest law code that survives?","options":["Hammurabi","Ur-Nammu of Ur","Sargon","Narmer"],"answer":"Ur-Nammu of Ur","hint":"He lived about 350 years before Hammurabi.","why":"Ur-Nammu's code (about 2100 BC) is older than Hammurabi's (about 1754 BC). It set fines in silver for injuries."},{"q":"Ur-Nammu's code dates to about 2100 BC and Hammurabi's to about 1754 BC. About how many years apart are they?","type":"number","answer":346,"hint":"Both BC: subtract.","why":"2100 − 1754 = 346 years, about 350."},{"q":"What is the Epic of Gilgamesh?","options":["A law code","An early epic about a king of Uruk who seeks to escape death","A list of kings","A map of Sumer"],"answer":"An early epic about a king of Uruk who seeks to escape death","hint":"It is a long poem.","why":"The Epic of Gilgamesh tells of a king of Uruk who searches for immortality and learns that all humans must die."},{"q":"Which part of the Gilgamesh story is most likely historical?","options":["That a king called Gilgamesh ruled Uruk, perhaps about 2700 BC","That he fought a monster in a cedar forest","That he was two-thirds god","That he found a plant of eternal youth"],"answer":"That a king called Gilgamesh ruled Uruk, perhaps about 2700 BC","hint":"Which claim could ordinary records support?","why":"A king's name and city can appear in king lists and inscriptions. Monsters and divine parentage belong to legend."},{"q":"In 1872, George Smith read a tablet from Nineveh that caused a sensation. What did it describe?","options":["The building of the pyramids","A great flood and a man who built a boat to survive it","The founding of Rome","A recipe for beer"],"answer":"A great flood and a man who built a boat to survive it","hint":"It was part of the Gilgamesh epic.","why":"Tablet XI of the Gilgamesh epic tells of a flood survivor, Utnapishtim, who built a boat. Its likeness to the account of Noah in Genesis caused intense interest."},{"q":"Why did the Akkadian Empire fall about 2154 BC? Choose the answer historians support.","options":["One single battle","Revolts, invasions and a severe drought together","The invention of iron","Egypt conquered it"],"answer":"Revolts, invasions and a severe drought together","hint":"Big events usually have several causes.","why":"Historians point to several causes together: rebellious cities, raiders called the Gutians, and climate evidence for a major drought around 2200 BC."},{"q":"Put these in order, earliest first.","type":"order","items":["Ur-Nammu's law code","Sargon builds the first empire","Uruk grows into a great city","Hammurabi's law code"],"answer":["Uruk grows into a great city","Sargon builds the first empire","Ur-Nammu's law code","Hammurabi's law code"],"hint":"Uruk was great about 3100 BC.","why":"Uruk (about 3100 BC) → Sargon (about 2334 BC) → Ur-Nammu (about 2100 BC) → Hammurabi (about 1754 BC)."},{"q":"Naram-Sin called himself 'king of the four quarters' of the world. What does this tell a historian?","options":["That he ruled the whole Earth","How he wished to be seen: royal propaganda","That he was a geographer","Nothing"],"answer":"How he wished to be seen: royal propaganda","hint":"Who wrote the title, and why?","why":"The title shows royal ideology. It is evidence of Naram-Sin's claims and ambitions, not a reliable map of his power."},{gen:HX.G.mapdot(11)},{gen:HX.G.mapdot(11)},{gen:HX.G.country(11)},{gen:HX.G.feature(11)},{gen:HX.G.base60(11)},{gen:HX.G.span(11)},{gen:HX.G.first(11)},{gen:HX.G.order(11)},{gen:HX.G.century(11)}],"challenge":[{"q":"Three statements: (1) Many tablets name Akkad. (2) No one has found Akkad. (3) Therefore Akkad did not exist. What is wrong with the argument?","options":["Statement 1 is false","Statement 2 is false","1 and 2 may be true, but 3 does not follow","Nothing is wrong"],"answer":"1 and 2 may be true, but 3 does not follow","hint":"Do the premises lead to the conclusion?","why":"The premises are true but the conclusion does not follow. Unlocated cities can still be real; Troy was once thought legendary until its ruins were identified."},{"q":"Sargon is said to have reigned 56 years, starting about 2334 BC. In about which year BC did his reign end?","type":"number","answer":2278,"hint":"BC years count down, so subtract the reign length from the start year.","why":"2334 − 56 = 2278 BC (some lists give slightly different numbers, so 'about')."},{"q":"Which pair of features most clearly makes Akkad an empire rather than a large city-state?","options":["A king and a temple","Rule over many peoples through governors and an army","A city wall and a canal","A written language"],"answer":"Rule over many peoples through governors and an army","hint":"City-states also had kings, temples and walls.","why":"Kings, temples, walls and writing existed in city-states. What is new is one ruler over many peoples and regions, held by governors and force."},{"q":"A Sumerian measure of grain called a gur held 300 sila. How many sila are in 12 gur?","type":"number","answer":3600,"hint":"Multiply.","why":"12 × 300 = 3600 sila. Notice 3,600 = 60 × 60, a round number in base 60."},{"q":"The flood story in Gilgamesh and the account of Noah in Genesis share features. Which conclusion goes beyond what this evidence alone can show?","options":["The two accounts share some features","One account was certainly copied word for word from the other","Flood stories were told in the ancient Near East","Comparing the texts is worthwhile"],"answer":"One account was certainly copied word for word from the other","hint":"Similarity shows a connection of some kind, but which kind?","why":"Shared features show that flood traditions existed in the region and invite comparison. They do not by themselves prove word-for-word copying; the accounts also differ greatly in their message."},{gen:HX.G.gap2(11)}],"extend":"Read a modern prose retelling of the Epic of Gilgamesh (for example Geraldine McCaughrean's 'Gilgamesh the Hero'). Write a paragraph on what the story teaches about friendship and death, and list which details might reflect real life in Uruk.","offline":"Draw a three-column chart of a city-state, a kingdom and an empire. For each, give an ancient example, who rules, and one strength and one weakness. Explain it to someone at dinner."},
