3,240Z' fill='#efe4c8' stroke='#b9a77c'/><path d='M528,241 465,135 405,77 405,38 315,0 188,10 120,48 105,135 115,212' fill='none' stroke='#b42318' stroke-width='4' stroke-linejoin='round' marker-end='url(#a)'/><circle cx='205' cy='290' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='223' cy='274' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='115' cy='212' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='170' cy='267' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='528' cy='241' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='471' cy='334' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><g font-size='18' font-weight='700' stroke='#fff' stroke-width='4' paint-order='stroke' text-anchor='middle'><text x='390' y='-48' fill='#b42318'>Xerxes' route, 480 BC</text><text x='330' y='202' fill='#1d5c8a' font-style='italic'>Aegean Sea</text><text x='205' y='314' fill='#1f2937' text-anchor='middle'>Athens</text><text x='232' y='280' fill='#1f2937' text-anchor='start'>Marathon</text><text x='115' y='201' fill='#1f2937' text-anchor='middle'>Thermopylae</text><text x='170' y='256' fill='#1f2937' text-anchor='middle'>Plataea</text><text x='528' y='265' fill='#1f2937' text-anchor='middle'>Sardis</text><text x='471' y='358' fill='#1f2937' text-anchor='middle'>Miletus</text></g><g font-size='18' font-weight='700'><path d='M14 419h86' stroke='#1f2937' stroke-width='4'/><text x='14' y='411' fill='#1f2937' stroke='#fff' stroke-width='4' paint-order='stroke'>100 km</text></g></svg>"}},{"say":"Herodotus says the runner <b>Pheidippides</b> ran about 240 km to Sparta before the battle. The tale of a runner dying in Athens after Marathon first appears in surviving sources about 600 years after the battle.","show":HX.tb(...[[["Story","Earliest source","Date of source"],["Pheidippides ran to Sparta for help","Herodotus","About 430 BC"],["A runner ran from Marathon to Athens and died","Plutarch, Lucian","About AD 100–170"]]])},{"say":"In 480 BC <b>Xerxes</b> invaded with a vast army. Herodotus gives 2,641,610 fighting men; modern historians, counting food and water, think it was far smaller.","show":HX.tb(...[[["Estimate","Source","Basis"],["2,641,610 fighting men","Herodotus","Reports and traditions, decades later"],["About 100,000–300,000","Modern historians","Food, water, roads, ships"]]])},{"say":"At the narrow pass of <b>Thermopylae</b>, <b>Leonidas</b> and his Greeks held the Persians for three days. When a local man showed the Persians a mountain path around the pass, Leonidas stayed and died fighting.","show":{"type":"passage","title":"Epitaph for the Spartans at Thermopylae, quoted by Herodotus 7.228 (trans. G. C. Macaulay, 1890)","text":"Stranger, report this word, we pray, to the Spartans, that lying\nHere in this spot we remain, faithfully keeping their laws."}},{"say":"In the narrow strait of <b>Salamis</b>, <b>Themistocles</b>'s fleet of <b>triremes</b> defeated the larger Persian navy. In 479 BC victory at Plataea ended the invasion.","show":HX.tb(...[[["Battle","Year","Result"],["Marathon","490 BC","Athenian victory on land"],["Thermopylae","480 BC","Persian victory; Greek delay"],["Salamis","480 BC","Greek naval victory"],["Plataea","479 BC","Greek victory; invasion ends"]]])},{"say":"<b>Explain it.</b> Why did the Greeks win the Persian Wars? Then explain how historians test Herodotus's numbers and the Marathon runner story.","show":{"type":"list","items":["Say it in 2–4 complete sentences.","Use the precise words from this lesson.","Support each claim with evidence: how do we know?"],"caption":"Explain it — to a grown-up or in writing"}}],"practice":[{"q":"Where did the Persian Wars begin, in 499 BC?","options":["In Egypt","Among the Ionian Greek cities on the coast of modern Turkey","In Sparta","In Babylon"],"answer":"Among the Ionian Greek cities on the coast of modern Turkey","hint":"They were under Persian rule.","why":"The Ionian Greek cities rebelled against Persia in 499 BC; Athens sent help."},{"q":"Who won the Battle of Marathon in 490 BC?","options":["The Athenians and Plataeans","The Persians","The Spartans alone","The Egyptians"],"answer":"The Athenians and Plataeans","hint":"The Spartans arrived late.","why":"Athenians and Plataeans defeated the Persian landing force at Marathon."},{"q":"Herodotus says 6,400 Persians and 192 Athenians died at Marathon. How many more Persians than Athenians died?","type":"number","answer":6208,"hint":"Subtract.","why":"6,400 − 192 = 6208."},{"q":"According to Herodotus, where did Pheidippides run?","options":["From Marathon to Athens","From Athens to Sparta, to ask for help before the battle","From Sparta to Persia","Around Greece"],"answer":"From Athens to Sparta, to ask for help before the battle","hint":"Herodotus is our earliest source.","why":"Herodotus says Pheidippides ran to Sparta, about 240 km, arriving the day after he set out."},{"q":"Why do historians doubt the story of a runner dying after running from Marathon to Athens?","options":["It first appears about 600 years later; Herodotus tells another","Running had not been invented","Marathon is in Egypt","Herodotus says no one ran"],"answer":"It first appears about 600 years later; Herodotus tells another","hint":"Compare the dates of the sources.","why":"A detail absent from the earliest account and first found centuries later is likely a later legend."},{"q":"The modern marathon is 42.195 km, about 42 km. Pheidippides's run to Sparta was about 240 km. To the nearest whole number, how many marathons is that?","type":"number","answer":6,"hint":"240 ÷ 42.","why":"240 ÷ 42 is about 5.7, so about 6 marathons."},{"q":"Herodotus says Xerxes brought 2,641,610 fighting men. Why do modern historians think the number was much smaller?","options":["Because they dislike Herodotus","The land, water and roads could not have supplied so many people at once","Because Persia had no army","Because the number is too precise to be wrong"],"answer":"The land, water and roads could not have supplied so many people at once","hint":"How much water does an army drink?","why":"Logistics, food, water and supply, limit army size. A force of millions could not have been fed or moved."},{"q":"Herodotus gives an exact figure, 2,641,610. Does the precision make it more reliable?","options":["Yes, exact numbers are always reliable","No: a precise-looking number is only as good as the method behind it","Yes, because it is large","It does not matter"],"answer":"No: a precise-looking number is only as good as the method behind it","hint":"Recall: 'about' is honest when the evidence is rough.","why":"Precision is not accuracy. The figure probably came from inflated traditions; its exactness tells us nothing about its truth."},{"q":"Who led the Spartans at Thermopylae?","options":["Themistocles","Miltiades","Leonidas","Pericles"],"answer":"Leonidas","hint":"He died there.","why":"King Leonidas led the defence and died with his 300 Spartans."},{"q":"How were the Greeks at Thermopylae defeated?","options":["They ran out of water","A local man showed the Persians a mountain path around the pass","Their ships sank","They surrendered"],"answer":"A local man showed the Persians a mountain path around the pass","hint":"The pass was held for three days.","why":"Ephialtes led the Persians along a mountain path, surrounding the Greek position."},{"q":"Why did Thermopylae matter even though the Greeks lost?","options":["It delayed the Persians and became a lasting symbol of courage and sacrifice","It ended the war","It destroyed the Persian navy","It did not matter"],"answer":"It delayed the Persians and became a lasting symbol of courage and sacrifice","hint":"What did the delay allow?","why":"The stand bought time and inspired the Greeks; the war was decided later at Salamis and Plataea."},{"q":"What was a trireme?","options":["A Persian chariot","A Greek warship rowed by about 170 men in three banks","A Spartan shield","A Greek temple"],"answer":"A Greek warship rowed by about 170 men in three banks","hint":"Tri = three.","why":"Triremes had three banks of oars and a bronze ram at the bow."},{"q":"If each trireme had 170 rowers, how many rowers would 200 triremes need?","type":"number","answer":34000,"hint":"Multiply.","why":"200 × 170 = 34000 rowers, mostly poorer Athenian citizens."},{"q":"Who persuaded Athens to build its fleet and led the strategy at Salamis?","options":["Leonidas","Themistocles","Xerxes","Solon"],"answer":"Themistocles","hint":"He used silver from Athens's mines.","why":"Themistocles convinced Athens to build triremes with silver from the mines of Laurion."},{"q":"Why did the narrow strait of Salamis help the Greeks?","options":["The larger Persian fleet could not use its numbers or manoeuvre in the narrow water","The water was shallow for Greeks only","It was foggy","The Persians had no ships"],"answer":"The larger Persian fleet could not use its numbers or manoeuvre in the narrow water","hint":"What happens to a large force in a tight space?","why":"In narrow waters, numbers count for less; the Persian ships crowded and collided, and the Greeks rammed them."},{"q":"Put these in order.","type":"order","items":["Battle of Thermopylae","Battle of Marathon","Ionian Revolt begins","Battle of Plataea"],"answer":["Ionian Revolt begins","Battle of Marathon","Battle of Thermopylae","Battle of Plataea"],"hint":"499, 490, 480, 479 BC.","why":"Ionian Revolt (499) → Marathon (490) → Thermopylae (480) → Plataea (479)."},{gen:HX.G.mapdot(25)},{gen:HX.G.mapdot(25)},{gen:HX.G.country(25)},{gen:HX.G.feature(25)},{gen:HX.G.span(25)},{gen:HX.G.first(25)},{gen:HX.G.order(25)},{gen:HX.G.century(25)},{gen:HX.G.ago(25)}],"challenge":[{"q":"Herodotus was born in Halicarnassus, a Greek city under Persian rule, and wrote for Greek audiences. How might his background affect his account?","options":["He may be fair to Persians yet still please Greeks: check both","He must have been pro-Persian","Background never matters","He could not write about Persia"],"answer":"He may be fair to Persians yet still please Greeks: check both","hint":"A source's background can cut both ways.","why":"Knowing an author's position helps us ask the right questions, not to dismiss them. Herodotus is often fair to Persians, but he wrote a Greek victory story."},{"q":"Herodotus says Pheidippides reached Sparta on the second day, covering about 240 km. If he ran for 36 hours, what was his average speed in kilometres per hour? Round to the nearest whole number.","type":"number","answer":7,"hint":"240 ÷ 36.","why":"240 ÷ 36 = 6.67, about 7 km an hour, a plausible pace for an endurance runner. Runners in the modern Spartathlon race cover a similar route in roughly 20 to 36 hours."},{"q":"Two statements: (A) 'The Greeks won because they were braver.' (B) 'The Greeks won partly because Salamis's narrow strait cancelled Persia's advantage in numbers.' Which is the better historical explanation, and why?","options":["A: bravery always wins","B: it names a specific, testable cause","Both are equally good","Neither"],"answer":"B: it names a specific, testable cause","hint":"Which can be checked?","why":"Explanation B identifies a mechanism supported by accounts of the battle and geography. A is vague and hard to test; courage existed on both sides."},{"q":"The Greeks fought Persia from 499 BC (Ionian Revolt) to 479 BC (Plataea). The Peloponnesian War lasted from 431 to 404 BC. How many years longer did the second conflict last?","type":"number","answer":7,"hint":"Find each span first.","why":"Persian Wars: 499 − 479 = 20 years. Peloponnesian War: 431 − 404 = 27 years. 27 − 20 = 7."},{gen:HX.G.gap2(25)}],"extend":"Read Herodotus, Histories 7.201–228 (Thermopylae) in Macaulay's translation. List three details that are probably reliable and three that might be exaggerated, with a reason for each.","offline":"Walk or run 1 km and time yourself. Using your pace, estimate how long Pheidippides's 240 km would take you. Then compare: what does that suggest about how fit ancient messengers had to be?"},
    {"title":"Athens' golden age and the Peloponnesian War","icon":"🏛️","learn":[{"say":"After the Persian Wars Athens turned its alliance, the <b>Delian League</b>, into an empire. Under <b>Pericles</b> its wealth built the <b>Parthenon</b> and supported drama, philosophy and history.","show":HX.tb(...[[["Field","Athenian or visitor","Achievement"],["Architecture","Ictinus, Phidias","The Parthenon"],["Drama","Sophocles","Tragedies such as Antigone"],["History","Herodotus, Thucydides","Inquiry into causes"],["Philosophy","Socrates","Questioning to find truth"],["Medicine","Hippocrates","Disease has natural causes"]]])},{"say":"Sparta feared Athens's growing power. In 431 BC the <b>Peloponnesian War</b> began. That winter Pericles gave a speech honouring the dead, as reported by the historian Thucydides.","show":{"type":"passage","title":"Thucydides, History of the Peloponnesian War 2.37 (trans. Richard Crawley, 1874)","text":"Our constitution does not copy the laws of neighbouring states; we are rather a pattern to others than imitators ourselves. Its administration favours the many instead of the few; this is why it is called a democracy. If we look to the laws, they afford equal justice to all in their private differences; if no social standing, advancement in public life falls to reputation for capacity, class considerations not being allowed to interfere with merit; nor again does poverty bar the way, if a man is able to serve the state, he is not hindered by the obscurity of his condition. […]"}},{"say":"Are these Pericles's exact words? Thucydides himself tells us they are not. He explains his method for speeches, a model of honesty about sources.","show":{"type":"passage","title":"Thucydides 1.22 (trans. Richard Crawley, 1874)","text":"With reference to the speeches in this history, some were delivered before the war began, others while it was going on; some I heard myself, others I got from various quarters; it was in all cases difficult to carry them word for word in one’s memory, so my habit has been to make the speakers say what was in my opinion demanded of them by the various occasions, of course adhering as closely as possible to the general sense of what they really said."}},{"say":"In 430 BC plague killed perhaps a quarter of Athens, Pericles among them. After a disastrous attack on Syracuse, Athens surrendered to Sparta in 404 BC.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 338' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><defs><marker id='a' viewBox='0 0 10 10' refX='7' refY='5' markerWidth='5' markerHeight='5' orient='auto'><path d='M0 0L10 5L0 10Z' fill='context-stroke'/></marker></defs><rect width='600' height='338' fill='#efe4c8'/><path d='M-587,250 -547,224 -470,224 -430,186 -410,110 -393,72 -370,42 -327,25 -293,4 -297,-42 -260,-59 -220,-51 -157,-72 -103,-102 -60,-80 -50,-38 -30,-17 10,11 33,32 73,51 97,72 120,82 133,127 122,169 137,169 153,152 172,127 153,97 173,66 200,89 217,78 167,38 137,4 100,0 63,-38 50,-68 13,-93 10,-127 13,-148 57,-157 57,-131 83,-140 130,-68 187,-42 220,-17 247,8 247,68 267,97 290,131 303,157 323,199 330,220 350,237 363,224 373,237 360,190 383,199 367,173 387,171 401,184 400,161 377,144 353,133 363,118 377,123 357,89 353,68 363,59 377,76 397,68 393,53 413,47 447,47 467,51 487,59 473,82 473,89 470,106 493,114 493,140 503,152 480,157 507,173 510,203 513,212 537,220 540,226 570,228 617,241 623,216 650,224 683,250 720,245 753,220 787,228 807,228 793,275 797,300 783,343 773,368 767,389 757,419 747,444 727,457 677,453 660,444 633,440 613,446 597,457 550,465 507,453 440,440 400,423 370,398 323,385 270,406 267,444 240,495 207,478 133,453 110,410 40,385 -13,372 -63,343 -30,288 -47,262 -33,216 -57,218 -70,199 -113,216 -140,216 -190,207 -230,224 -300,220 -360,233 -420,266 -473,292 -530,288 -577,258ZM567,34 533,17 517,-21 530,-51 553,-76 590,-135 623,-190 660,-195 687,-169 683,-144 717,-106 750,-110 780,-127 817,-140 867,-106 923,-68 987,17 967,38 923,42 877,44 810,30 770,0 710,0 643,34ZM473,82 490,70 517,44 567,40 570,32 577,38 580,53 533,70 490,74 477,87ZM300,150 317,154 340,151 363,160 373,167 365,172 343,164 327,158 313,163 300,161Z' fill='#bcd9ef'/><path d='M13,165 47,161 120,157 103,199 103,224 77,212 17,186ZM383,271 410,271 477,283 470,296 423,300 383,283ZM360,131 380,129 407,161 420,167 403,165 377,148Z' fill='#efe4c8' stroke='#b9a77c'/><path d='M613,446 633,482 641,505 642,550 627,592 630,609 647,635 673,664 690,673 688,689 687,706 697,758 680,804 653,833 645,854 620,909 613,948 616,966 633,998 660,992 683,977 710,950 730,994 733,1028 725,1060 684,1117 683,1227 653,1375' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M930,152 941,173 1006,198 1038,239 1042,277 1056,313 1062,330 1079,367 1128,402 1172,430 1181,465' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M893,110 877,169 867,219 900,256 938,282 963,315 1012,333 1027,354 1059,366 1081,400 1110,453 1142,463 1181,465 1193,486 1217,508' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M387,173 317,203 233,148 150,148 113,203' fill='none' stroke='#1d5c8a' stroke-width='4' stroke-linejoin='round' marker-end='url(#a)'/><circle cx='391' cy='170' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='348' cy='209' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='110' cy='208' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><g font-size='18' font-weight='700' stroke='#fff' stroke-width='4' paint-order='stroke' text-anchor='middle'><text x='250' y='97' fill='#1d5c8a' font-style='italic'>Sicilian Expedition 415 BC</text><text x='400' y='176' fill='#1f2937' text-anchor='start'>Athens</text><text x='348' y='233' fill='#1f2937' text-anchor='middle'>Sparta</text><text x='110' y='232' fill='#1f2937' text-anchor='middle'>Syracuse</text></g></svg>"}},{"say":"<b>Socrates</b> tested every claim by asking what it meant, how anyone knew it, and whether it followed. In 399 BC an Athenian jury condemned him to death.","show":{"type":"passage","title":"Plato, Apology 38a (trans. Benjamin Jowett)","text":"[…] the unexamined life is not worth living […]"}},{"say":"An argument is <b>valid</b> if its conclusion must follow from its premises, and <b>sound</b> only if it is valid and every premise is true. Check both the logic and the facts.","show":HX.tb(...[[["Argument","Valid?","Sound?"],["All Athenians are Greeks. Socrates is Athenian. So he is Greek.","Yes","Yes"],["All Greeks are Spartans. Pericles is Greek. So he is Spartan.","Yes","No: a premise is false"],["Some Greeks are Spartans. Pericles is Greek. So he is Spartan.","No","No"]]])},{"say":"<b>Explain it.</b> What is the difference between a valid and a sound argument? Give one example of each, and explain why Thucydides's honesty about speeches matters to a historian.","show":{"type":"list","items":["Say it in 2–4 complete sentences.","Use the precise words from this lesson.","Support each claim with evidence: how do we know?"],"caption":"Explain it — to a grown-up or in writing"}}],"practice":[{"q":"What was the Delian League?","options":["A Spartan army","A naval alliance of Greek cities led by Athens, which became an Athenian empire","A Persian province","A sports festival"],"answer":"A naval alliance of Greek cities led by Athens, which became an Athenian empire","hint":"Its treasury was first on the island of Delos.","why":"Formed in 478 BC against Persia, it became an Athenian empire when Athens moved the treasury to Athens and forced members to stay."},{"q":"When was the Parthenon built?","options":["776–750 BC","447–432 BC","AD 117–138","1200 BC"],"answer":"447–432 BC","hint":"Under Pericles.","why":"The Parthenon, temple of Athena on the Acropolis, was built 447–432 BC."},{"q":"How many years did the Parthenon take to build (447–432 BC)?","type":"number","answer":15,"hint":"Subtract.","why":"447 − 432 = 15 years."},{"q":"Which is the best description of the Peloponnesian War?","options":["A war between Athens and its allies and Sparta and its allies, 431–404 BC","A war between Greece and Persia","A war between Rome and Carthage","A civil war inside Sparta"],"answer":"A war between Athens and its allies and Sparta and its allies, 431–404 BC","hint":"Peloponnese = Sparta's region.","why":"It was a long war between the Athenian alliance and the Spartan-led Peloponnesian League, ending in Athens's defeat."},{"q":"In the Funeral Oration, why does Pericles say Athens is called a democracy?","options":["Because it has a king","Because its administration favours the many instead of the few","Because Sparta says so","Because it has a navy"],"answer":"Because its administration favours the many instead of the few","hint":"Read the passage.","why":"He says its administration favours the many instead of the few; that is why it is called a democracy."},{"q":"Pericles says advancement in public life comes from 'reputation for capacity, class considerations not being allowed to interfere with merit.' What ideal is this?","options":["Merit: positions should go to the able, not just the well-born","Monarchy","Equality of wealth","Military rule"],"answer":"Merit: positions should go to the able, not just the well-born","hint":"Privilege versus merit.","why":"He presents Athens as rewarding ability. Remember, though, that this was an ideal in a speech, and citizenship itself was limited."},{"q":"What does Thucydides admit in 1.22 about the speeches in his history?","options":["They are word-for-word recordings","He reconstructed them, keeping as close as he could to the general sense of what was said","He invented every speech with no basis","They were written by Pericles"],"answer":"He reconstructed them, keeping as close as he could to the general sense of what was said","hint":"Read the passage.","why":"He says exact words were hard to remember, so he wrote what the speakers would have needed to say, keeping close to the general sense."},{"q":"Given Thucydides 1.22, how should we treat the Funeral Oration?","options":["As Pericles's exact words","As Thucydides's reconstruction of its general sense","As a complete fake","As Plato's writing"],"answer":"As Thucydides's reconstruction of its general sense","hint":"What did the author himself tell us?","why":"We read it as a reconstruction. It is still valuable, written by a contemporary who may have heard it, but the wording is Thucydides's."},{"q":"What disaster struck Athens in 430 BC?","options":["An earthquake","A plague that killed perhaps a quarter of the population","A Persian invasion","A flood"],"answer":"A plague that killed perhaps a quarter of the population","hint":"The city was crowded with refugees.","why":"A plague, described in detail by Thucydides, who caught it and survived, killed many, including Pericles in 429 BC."},{"q":"What was the Sicilian Expedition (415–413 BC)?","options":["A Spartan victory parade","A huge Athenian attack on Syracuse that ended in total disaster","A trading voyage","The founding of Syracuse"],"answer":"A huge Athenian attack on Syracuse that ended in total disaster","hint":"Look at the map.","why":"Athens sent a great fleet and army against Syracuse; almost all were killed or enslaved by 413 BC."},{"q":"In which year did Athens surrender to Sparta?","options":["431 BC","404 BC","399 BC","480 BC"],"answer":"404 BC","hint":"After a long blockade.","why":"Athens surrendered in 404 BC after its last fleet was destroyed and the city was starved."},{"q":"Why was Socrates put on trial in 399 BC?","options":["For stealing","For 'corrupting the young' and impiety","For losing a battle","For writing books"],"answer":"For 'corrupting the young' and impiety","hint":"His questions embarrassed many.","why":"He was charged with corrupting the young and not honouring the city's gods; many resented his public questioning."},{"q":"What did Socrates mean by 'the unexamined life is not worth living'?","options":["A good life requires questioning one's beliefs and testing whether they are true","Doctors should examine everyone","Life is not worth living","Only philosophers should live"],"answer":"A good life requires questioning one's beliefs and testing whether they are true","hint":"What did Socrates spend his life doing?","why":"He believed we must test our beliefs by reason and evidence, not accept them unexamined."},{"q":"An argument is valid when…","options":["its premises are true","the conclusion must follow if the premises are true","most people agree with it","it is written down"],"answer":"the conclusion must follow if the premises are true","hint":"Validity is about the logical link.","why":"Validity concerns the structure: if the premises were true, the conclusion would have to be."},{"q":"'All Greeks are Spartans. Pericles is Greek. So Pericles is a Spartan.' This argument is…","options":["valid and sound","valid but unsound, because the first premise is false","invalid but sound","neither valid nor about Greeks"],"answer":"valid but unsound, because the first premise is false","hint":"Check the logic, then the facts.","why":"The conclusion follows from the premises, so it is valid. But not all Greeks were Spartans, so a premise is false and the argument is unsound."},{"q":"Why did Sparta's allies and Athens's subject cities matter so much in the war?","options":["Athens's power rested on tribute; revolts drained it","They did not matter","They were all neutral","They fought only for Persia"],"answer":"Athens's power rested on tribute; revolts drained it","hint":"Where did Athens's money come from?","why":"Tribute from Delian League cities paid for Athens's fleet. When subjects revolted, especially after the Sicilian disaster, Athens lost money and ships."},{gen:HX.G.mapdot(26)},{gen:HX.G.country(26)},{gen:HX.G.feature(26)},{gen:HX.G.span(26)},{gen:HX.G.first(26)},{gen:HX.G.order(26)},{gen:HX.G.century(26)},{gen:HX.G.ago(26)}],"challenge":[{"q":"'Some Athenians were philosophers. Socrates was an Athenian. Therefore Socrates was a philosopher.' Evaluate.","options":["Valid and sound","Invalid: the conclusion does not follow, though it is true","Valid but unsound","Sound but invalid"],"answer":"Invalid: the conclusion does not follow, though it is true","hint":"Could the premises be true and the conclusion false for some other person?","why":"Replace Socrates with a cobbler: true premises, false conclusion. So the form is invalid. A true conclusion does not rescue a bad argument."},{"q":"The Funeral Oration praises Athenian democracy as a model. Which fact would a careful historian set beside it?","options":["Athens ruled an empire and excluded most residents from citizenship","Athens had no assembly","Pericles was Spartan","The speech was given in Persia"],"answer":"Athens ruled an empire and excluded most residents from citizenship","hint":"Is the speech the whole truth about Athens?","why":"A speech of praise, at a funeral, in wartime, presents the ideal. Evidence of empire and exclusion completes the picture."},{"q":"If Athens and its surrounding land had about 300,000 people and the plague killed a quarter, about how many died?","type":"number","answer":75000,"hint":"One quarter of 300,000.","why":"300,000 ÷ 4 = 75000."},{"q":"Thucydides wrote that he aimed at 'a possession for all time', not a piece to please listeners. Which of his methods best supports trusting him more than many ancient writers?","options":["He explains his methods and admits reconstructions","He wrote exciting stories","He never mentions sources","He was always on the winning side"],"answer":"He explains his methods and admits reconstructions","hint":"Which habit lets readers check his work?","why":"Openness about method and sources lets readers judge reliability, the habit of a careful historian."},{gen:HX.G.gap2(26)}],"extend":"Read Plato's Apology (Jowett translation) or its first half. List three questions Socrates asks his accusers, and explain how each tests whether their claims are true.","offline":"Play 'valid or sound?' at dinner: each person makes up an argument of two premises and a conclusion. Others decide whether it is valid, and whether it is sound. Score a point for each correct judgement."},
    {"title":"Alexander the Great","icon":"🐎","learn":[{"say":"<b>Alexander</b> was born in 356 BC in <b>Macedonia</b> and taught by <b>Aristotle</b>. Plutarch tells how, as a boy, he tamed the horse <b>Bucephalus</b> by turning it away from its shadow.","show":{"type":"passage","title":"Plutarch, Life of Alexander 6 (trans. Bernadotte Perrin, 1919)","text":"[…] his father, as we are told, actually shed tears of joy, and when Alexander had dismounted, kissed him, saying: \"My son, seek thee out a kingdom equal to thyself; Macedonia has not room for thee.\""}},{"say":"Plutarch warns readers what kind of book he is writing. Notice his purpose: he chooses stories that reveal character, not every battle. A source's purpose shapes what it includes.","show":{"type":"passage","title":"Plutarch, Life of Alexander 1 (trans. Bernadotte Perrin, 1919)","text":"For it is not Histories that I am writing, but Lives; and in the most illustrious deeds there is not always a manifestation of virtue or vice, nay, a slight thing like a phrase or a jest often makes a greater revelation of character than battles when thousands fall, or the greatest armaments, or sieges of cities."}},{"say":"King at 20, Alexander invaded Persia in 334 BC and marched as far as the Indus. He died in Babylon in 323 BC, aged 32.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 271' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><defs><marker id='a' viewBox='0 0 10 10' refX='7' refY='5' markerWidth='5' markerHeight='5' orient='auto'><path d='M0 0L10 5L0 10Z' fill='context-stroke'/></marker></defs><rect width='600' height='271' fill='#efe4c8'/><path d='M-244,97 -232,90 -208,90 -196,79 -189,57 -184,46 -177,37 -163,32 -153,26 -154,12 -143,7 -130,10 -111,4 -94,-5 -81,1 -78,14 -71,20 -59,28 -52,34 -39,39 -32,46 -25,49 -21,62 -24,74 -20,74 -14,69 -9,62 -14,53 -8,44 0,51 5,47 -10,36 -20,26 -31,25 -42,14 -47,5 -58,-2 -59,-12 -58,-19 -44,-21 -44,-14 -36,-16 -22,5 -4,12 6,20 14,27 14,44 21,53
