 65,104 86,107 84,111 69,112 57,107ZM148,111 155,106 172,102 164,111 155,116 149,115ZM50,63 56,62 64,72 68,73 63,73 55,68Z' fill='#efe4c8' stroke='#b9a77c'/><path d='M128,155 134,165 137,172 137,185 132,197 133,202 139,210 147,218 152,221 152,226 151,231 154,246 149,259 141,268 138,274 130,290 128,301 129,306 134,316 143,314 150,310 158,302 164,315 166,324 163,334 150,350 150,382 141,426' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M227,69 230,75 250,82 260,94 261,105 266,116 268,121 273,132 288,142 302,150 304,160' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M215,57 210,74 207,88 217,99 229,107 237,117 252,122 257,128 267,131 273,141 282,157 292,160 304,160 308,167 316,173' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M47,40 87,47 96,47 104,68 145,54 188,88 178,132 170,154 137,175 123,158 78,183 137,175 178,132 207,93 263,91 273,141 313,146 361,174 316,113 383,93 445,111 506,89 507,54 506,89 538,117 575,137 553,173 521,222 512,243 455,222 403,210 361,174 313,146 273,141' fill='none' stroke='#b42318' stroke-width='4' stroke-linejoin='round' marker-end='url(#a)'/><circle cx='47' cy='40' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='188' cy='88' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='123' cy='158' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='263' cy='91' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='273' cy='141' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='361' cy='174' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='575' cy='137' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><g font-size='18' font-weight='700' stroke='#fff' stroke-width='4' paint-order='stroke' text-anchor='middle'><text x='300' y='15' fill='#b42318'>Alexander's route, 334–323 BC</text><text x='47' y='29' fill='#1f2937' text-anchor='middle'>Pella</text><text x='188' y='77' fill='#1f2937' text-anchor='middle'>Issus</text><text x='114' y='164' fill='#1f2937' text-anchor='end'>Alexandria</text><text x='272' y='97' fill='#1f2937' text-anchor='start'>Gaugamela</text><text x='273' y='165' fill='#1f2937' text-anchor='middle'>Babylon</text><text x='361' y='198' fill='#1f2937' text-anchor='middle'>Persepolis</text><text x='566' y='143' fill='#1f2937' text-anchor='end'>Hydaspes</text></g></svg>"}},{"say":"Key events of the campaign. Note how quickly he moved: from the Granicus to the Hydaspes in eight years, on foot and horseback.","show":HX.tb(...[[["Year","Event"],["334 BC","Crosses into Asia; wins at the Granicus"],["333 BC","Defeats Darius III at Issus"],["332 BC","Takes Tyre after a 7-month siege; enters Egypt"],["331 BC","Founds Alexandria; wins at Gaugamela"],["330 BC","Persepolis burned; Darius III killed by his own men"],["326 BC","Battle of the Hydaspes in India; army refuses to go on"],["323 BC","Dies in Babylon, aged 32"]]])},{"say":"Accounts by Alexander's companions are lost. Our main historian, <b>Arrian</b>, wrote about 450 years later, so every story has passed through several hands.","show":HX.tb(...[[["Source","Written","Status"],["Ptolemy, Aristobulus, Callisthenes","During or soon after his life","Lost; known only through quotations"],["Diodorus","About 30 BC","Survives"],["Plutarch","About AD 100","Survives; aims at character"],["Arrian","About AD 130","Survives; uses Ptolemy and Aristobulus"]]])},{"say":"Alexander's generals divided his empire, and Greek culture spread in the <b>Hellenistic</b> age. In Alexandria, Eratosthenes used shadows to measure the Earth.","show":{"type":"big","text":"360° ÷ 7.2° = 50\n50 × 5,000 stadia = 250,000 stadia","caption":"Eratosthenes measures the Earth, about 240 BC"}},{"say":"<b>Explain it.</b> How did Alexander build his empire, and why did it split after his death? Explain also why Plutarch and Arrian must be read with their purposes and dates in mind.","show":{"type":"list","items":["Say it in 2–4 complete sentences.","Use the precise words from this lesson.","Support each claim with evidence: how do we know?"],"caption":"Explain it — to a grown-up or in writing"}}],"practice":[{"q":"Where was Alexander born?","options":["Athens","Sparta","Pella, in Macedonia","Babylon"],"answer":"Pella, in Macedonia","hint":"Macedonia lay north of Greece.","why":"Alexander was born at Pella, capital of Macedonia, in 356 BC."},{"q":"Who was Alexander's tutor?","options":["Socrates","Plato","Aristotle","Herodotus"],"answer":"Aristotle","hint":"He was Plato's student.","why":"Aristotle taught Alexander for several years in Macedonia."},{"q":"According to Plutarch, how did Alexander tame Bucephalus?","options":["By whipping him","By noticing the horse feared its own shadow and turning it toward the Sun","By feeding him honey","By singing to him"],"answer":"By noticing the horse feared its own shadow and turning it toward the Sun","hint":"Observation solved the problem.","why":"Alexander saw that the horse shied at its shadow, turned it to face the Sun so the shadow fell behind, and calmed it."},{"q":"What does Plutarch say about his purpose in Alexander 1?","options":["He is writing Lives, not Histories, choosing details that reveal character","He is writing a complete military history","He is writing for children","He was an eyewitness"],"answer":"He is writing Lives, not Histories, choosing details that reveal character","hint":"Read the passage.","why":"He chooses small revealing stories over full battle accounts. Knowing his purpose explains what he includes and leaves out."},{"q":"Alexander was born in 356 BC and became king in 336 BC. How old was he, roughly, when he became king?","type":"number","answer":20,"hint":"Both BC: subtract.","why":"356 − 336 = 20 years old."},{"q":"He invaded Asia in 334 BC and died in 323 BC. How many years did his campaigns last?","type":"number","answer":11,"hint":"Subtract.","why":"334 − 323 = 11 years."},{"q":"Which battle in 331 BC decided the fate of the Persian Empire?","options":["Marathon","Gaugamela","Salamis","Cannae"],"answer":"Gaugamela","hint":"It was near Nineveh, in modern Iraq.","why":"At Gaugamela Alexander defeated Darius III decisively."},{"q":"Why did Alexander turn back after the Hydaspes in 326 BC?","options":["He was defeated","His exhausted soldiers refused to march further east","He reached the end of the world","Persia surrendered"],"answer":"His exhausted soldiers refused to march further east","hint":"Who refused?","why":"After years of marching, his army refused to go on, and he agreed to return."},{"q":"Which city, founded by Alexander in Egypt, became a great centre of learning?","options":["Memphis","Alexandria","Thebes","Carthage"],"answer":"Alexandria","hint":"It had a famous library and lighthouse.","why":"Alexandria, founded in 331 BC, became home to the great Library and scholars such as Euclid and Eratosthenes."},{"q":"Who ruled Egypt after Alexander?","options":["The Ptolemies, descendants of his general Ptolemy, until Cleopatra died in 30 BC","The Seleucids","The Romans immediately","The Spartans"],"answer":"The Ptolemies, descendants of his general Ptolemy, until Cleopatra died in 30 BC","hint":"Cleopatra was the last of them.","why":"Ptolemy took Egypt; his dynasty ruled until Cleopatra VII's death in 30 BC."},{"q":"What does 'Hellenistic' describe?","options":["The age of Homer","The age after Alexander when Greek culture spread across the lands he conquered","The Persian Wars","Roman culture"],"answer":"The age after Alexander when Greek culture spread across the lands he conquered","hint":"Hellenes = Greeks.","why":"From 323 to about 30 BC, Greek language and culture spread from Egypt to Afghanistan."},{"q":"Why must historians be careful with stories about Alexander?","options":["He never existed","The eyewitness accounts are lost; surviving histories were written centuries later","He wrote his own biography","All the sources are Persian"],"answer":"The eyewitness accounts are lost; surviving histories were written centuries later","hint":"When was Arrian writing?","why":"Arrian wrote about 450 years after Alexander, using earlier books now lost. Each step adds possible error or bias."},{"q":"Arrian wrote about AD 130. Alexander died in 323 BC. How many years apart are those dates?","type":"number","answer":452,"hint":"Crossing BC to AD.","why":"323 + 130 − 1 = 452 years."},{"q":"Eratosthenes measured an angle of 7.2°. How many times does 7.2° fit into a full circle of 360°?","type":"number","answer":50,"hint":"360 ÷ 7.2.","why":"360 ÷ 7.2 = 50."},{"q":"If Syene and Alexandria were 5,000 stadia apart and that distance was 1/50 of the Earth's circumference, how many stadia is the whole circumference?","type":"number","answer":250000,"hint":"Multiply.","why":"50 × 5,000 = 250000 stadia."},{"q":"Who killed Darius III in 330 BC?","options":["Alexander in single combat","His own officers, as he fled","A Spartan","Nobody: he lived to old age"],"answer":"His own officers, as he fled","hint":"Alexander found him dying or dead.","why":"Darius was murdered by his own officers, led by the satrap Bessus, while fleeing Alexander."},{gen:HX.G.mapdot(27)},{gen:HX.G.mapdot(27)},{gen:HX.G.country(27)},{gen:HX.G.feature(27)},{gen:HX.G.span(27)},{gen:HX.G.first(27)},{gen:HX.G.order(27)},{gen:HX.G.century(27)}],"challenge":[{"q":"If a stadion was about 160 m, about how many kilometres is 250,000 stadia?","type":"number","answer":40000,"hint":"250,000 × 160 m, then convert to km.","why":"250,000 × 160 = 40,000,000 m = 40000 km. The true circumference is about 40,075 km, though we are unsure of the stadion's exact length."},{"q":"Eratosthenes's method needed several assumptions. Which one is NOT required?","options":["The Earth is a sphere","The Sun is so far away that its rays arrive parallel","Syene is almost due south of Alexandria","The Earth is the centre of the universe"],"answer":"The Earth is the centre of the universe","hint":"Which assumption does the geometry actually use?","why":"The calculation uses a spherical Earth, parallel sunlight and a north-south line. It needs no assumption about the centre of the universe."},{"q":"Plutarch's story of Philip weeping and saying Macedonia had no room for Alexander was written more than 400 years later. Which statement is most careful?","options":["It may be real tradition or later legend; we cannot be sure","It is true because Plutarch wrote it","It is false because it is a good story","Aristotle recorded it"],"answer":"It may be real tradition or later legend; we cannot be sure","hint":"A good story is not proof either way.","why":"The tale could reflect a real event or be a later legend shaped by hindsight. Without earlier evidence we hold it lightly."},{"q":"Alexander was born in July 356 BC and died in June 323 BC. How old was he when he died?","type":"number","answer":32,"hint":"From July 356 BC to July 323 BC is 33 years; had he reached his birthday?","why":"356 − 323 = 33 years from birthday to birthday, but he died in June, a month before his 33rd birthday. So he was 32."},{gen:HX.G.gap2(27)}],"extend":"Read Arrian's Anabasis of Alexander, Book 1, chapters 13–16 (the Granicus), in an online public-domain translation (E. J. Chinnock). Note where Arrian names his sources and where he chooses between versions.","offline":"Repeat Eratosthenes's idea with two shadows: on a sunny day, measure the length of a 1-metre stick's shadow at noon. With a grown-up, draw the triangle on paper and measure the Sun's angle with a protractor."},
    {"title":"The first Americans","icon":"🌽","learn":[{"say":"People reached the Americas from Asia during the Ice Age, across <b>Beringia</b> or along the coast. Monte Verde in Chile shows they were far south about 14,500 years ago.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 533' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><rect width='600' height='533' fill='#bcd9ef'/><path d='M-460,-361 -368,-385 -210,-368 -150,-362 -50,-367 50,-350 150,-352 250,-352 330,-337 295,-312 260,-287 255,-262 275,-242 312,-240 350,-223 377,-200 410,-186 433,-231 425,-272 420,-296 500,-260 555,-275 590,-231 644,-187 600,-171 540,-163 555,-146 600,-131 565,-117 540,-109 531,-119 500,-109 495,-89 460,-76 437,-40 445,-22 408,-2 386,26 399,63 386,79 372,51 355,30 320,25 300,39 252,37 226,52 223,108 239,139 255,149 284,145 296,121 325,116 317,146 318,173 340,171 366,181 364,222 383,242 405,238 427,245 445,226 480,212 484,223 531,225 574,225 600,247 630,273 689,293 700,332 715,346 757,357 810,361 848,386 851,413 815,463 810,509 768,563 714,596 666,671 651,683 616,680 633,698 625,716 578,723 562,755 524,799 542,812 508,838 517,859 547,886 514,891 455,855 445,815 461,760 464,707 484,664 496,570 497,517 438,473 430,453 401,402 387,378 399,341 415,307 425,262 417,248 405,242 396,259 365,249 343,221 325,199 278,186 260,170 235,174 190,155 157,140 144,127 115,81 90,55 53,13 78,45 101,102 60,50 28,5 -6,-15 -25,-47 -40,-91 -40,-156 -100,-216 -160,-252 -195,-270 -260,-282 -320,-269 -350,-248 -425,-221 -380,-257 -420,-272 -450,-297 -410,-317 -480,-328 -420,-332Z' fill='#efe4c8' stroke='#b9a77c'/><path d='M350,112 400,100 458,129 425,132 380,106ZM456,147 472,132 516,145 485,155Z' fill='#efe4c8' stroke='#b9a77c'/><circle cx='212' cy='134' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='260' cy='150' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='304' cy='159' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='309' cy='183' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='425' cy='442' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='428' cy='429' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><g font-size='18' font-weight='700' stroke='#fff' stroke-width='4' paint-order='stroke' text-anchor='middle'><text x='290' y='81' fill='#1d5c8a' font-style='italic'>Gulf of Mexico</text><text x='150' y='282' fill='#1d5c8a' font-style='italic'>Pacific Ocean</text><text x='160' y='206' fill='#6d28d9'>MESOAMERICA</text><text x='470' y='473' fill='#6d28d9'>ANDES</text><text x='212' y='123' fill='#1f2937' text-anchor='middle'>Teotihuacan</text><text x='260' y='174' fill='#1f2937' text-anchor='middle'>La Venta</text><text x='313' y='165' fill='#1f2937' text-anchor='start'>Tikal</text><text x='309' y='207' fill='#1f2937' text-anchor='middle'>Copán</text><text x='434' y='448' fill='#1f2937' text-anchor='start'>Caral</text><text x='428' y='418' fill='#1f2937' text-anchor='middle'>Chavín</text></g></svg>"}},{"say":"Farming began independently in the Americas. People in Mexico bred <b>maize</b> from a wild grass, teosinte, while Andean farmers grew potatoes and herded llamas.","show":HX.tb(...[[["Crop or animal","Region","Began (about)"],["Squash","Mexico","8000 BC"],["Maize","Southern Mexico","7000 BC"],["Potatoes","Andes","6000 BC"],["Llamas and alpacas","Andes","4000 BC"]]])},{"say":"<b>Caral</b> in Peru, built about 2600 BC, had platform mounds and plazas as old as Egypt's pyramids. Its people had no pottery and left no writing.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><path d='M30 170H570' stroke='#1f2937' stroke-width='4'/><circle cx='72' cy='170' r='8' fill='#1d5c8a'/><path d='M72 170V146' stroke='#1d5c8a' stroke-width='2'/><text x='58' y='118' font-size='18' fill='#1f2937' text-anchor='start' font-weight='700'>Caral</text><text x='58' y='140' font-size='18' fill='#1f2937' text-anchor='start' font-weight='700'>(about 2600 BC)</text><circle cx='292' cy='170' r='8' fill='#1d5c8a'/><path d='M292 170V222' stroke='#1d5c8a' stroke-width='2'/><text x='292' y='242' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Olmec</text><text x='292' y='264' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>(about 1200 BC)</text><circle cx='339' cy='170' r='8' fill='#1d5c8a'/><path d='M339 170V146' stroke='#1d5c8a' stroke-width='2'/><text x='339' y='118' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Chavín</text><text x='339' y='140' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>(about 900 BC)</text><circle cx='521' cy='170' r='8' fill='#1d5c8a'/><path d='M521 170V222' stroke='#1d5c8a' stroke-width='2'/><text x='535' y='242' font-size='18' fill='#1f2937' text-anchor='end' font-weight='700'>Classic Maya</text><text x='535' y='264' font-size='18' fill='#1f2937' text-anchor='end' font-weight='700'>(about AD 250)</text></svg>"}},{"say":"The <b>Olmec</b> (about 1200–400 BC) carved colossal stone heads. Their own name is unknown: 'Olmec' is a later Aztec word meaning 'rubber people'.","show":{"type":"big","text":"17 colossal heads\nup to about 3 m tall","caption":"Olmec, about 1200–400 BC"}},{"say":"The <b>Maya</b> built cities from about 1000 BC and wrote in glyphs. They counted in <b>base 20</b> with a shell sign for <b>zero</b>, one of very few peoples to invent zero.","show":HX.tb(...[[["Place","Value","Example: 2, 0, 13"],["400s","20 × 20","2 × 400 = 800"],["20s","20","0 × 20 = 0 (shell sign)"],["1s","1","13 × 1 = 13"],["Total","","813"]]])},{"say":"In 1562 Bishop Diego de Landa burned Maya books, and only four survive. In the 20th century scholars learned to read the glyphs, recovering the histories of real kings.","show":HX.tb(...[[["Year","Event"],["1562","De Landa burns Maya books at Maní"],["1952","Knorozov shows glyphs record sounds"],["1960","Proskouriakoff shows inscriptions record rulers' lives"],["Today","Most inscriptions can be read"]]])},{"say":"<b>Explain it.</b> How did farming and cities develop independently in the Americas? Explain how the loss of Maya books affects what we know, and how decipherment recovered some of it.","show":{"type":"list","items":["Say it in 2–4 complete sentences.","Use the precise words from this lesson.","Support each claim with evidence: how do we know?"],"caption":"Explain it — to a grown-up or in writing"}}],"practice":[{"q":"How did the first people reach the Americas?","options":["From Asia, across the Beringia land bridge and perhaps along the Pacific coast by boat","From Africa across the Atlantic","From Europe on Roman ships","They were always there"],"answer":"From Asia, across the Beringia land bridge and perhaps along the Pacific coast by boat","hint":"Recall lesson 5.","why":"During the Ice Age, low seas exposed Beringia; people came from Asia by land and probably along the coast."},{"q":"Monte Verde in Chile is about 14,500 years old. Why is it important?","options":["It is the oldest pyramid","People were already far south, so they arrived earlier","Maize began there","It is a Maya city"],"answer":"People were already far south, so they arrived earlier","hint":"How long would it take to travel from Alaska to Chile?","why":"People at Monte Verde 14,500 years ago imply that the first entry into the Americas came earlier."},{"q":"From which wild plant was maize bred?","options":["Wheat","Rice","Teosinte","Barley"],"answer":"Teosinte","hint":"A wild grass of southern Mexico.","why":"Maize was domesticated from teosinte, whose cobs were tiny with a few hard kernels."},{"q":"What were the 'three sisters' of American farming?","options":["Wheat, barley and lentils","Maize, beans and squash","Rice, millet and soy","Potatoes, llamas and cotton"],"answer":"Maize, beans and squash","hint":"They were often grown together.","why":"Maize, beans and squash were planted together: the maize supported the beans, the beans enriched the soil, and squash shaded the ground."},{"q":"Which statement about farming in the Americas is correct?","options":["It was brought from Mesopotamia","It began independently, with different crops","It began only after Columbus","There was no farming"],"answer":"It began independently, with different crops","hint":"Recall lesson 6.","why":"The Americas developed farming independently with maize, squash, beans and potatoes, unknown in the Old World before 1492."},{"q":"About when was Caral in Peru built?","options":["About 2600 BC","About AD 1400","About 500 BC","About AD 250"],"answer":"About 2600 BC","hint":"It is as old as Egypt's pyramids.","why":"Caral dates to about 2600 BC, making it one of the oldest cities in the Americas."},{"q":"What surprised archaeologists about Caral?","options":["A large city with monuments but no pottery and no writing found","It had iron weapons","It was built by Romans","It had a library"],"answer":"A large city with monuments but no pottery and no writing found","hint":"What do most early cities have?","why":"Caral had platform mounds and plazas, yet no pottery has been found there, which challenged ideas about what a 'civilisation' needs."},{"q":"What are the Olmec best known for?","options":["Pyramids at Giza","Colossal carved stone heads","The first alphabet","Iron tools"],"answer":"Colossal carved stone heads","hint":"17 are known.","why":"The Olmec carved huge basalt heads, probably portraits of rulers."},{"q":"Why is the name 'Olmec' not the people's own name?","options":["It is a later Aztec word meaning 'rubber people'; their own name is unknown","They called themselves Olmec","It is a Spanish word","It is a Greek word"],"answer":"It is a later Aztec word meaning 'rubber people'; their own name is unknown","hint":"Who named them?","why":"The name comes from the Aztec language Nahuatl, long after the Olmec; they left no record of their own name."},{"q":"A Maya number has 3 in the twenties place and 7 in the ones place. What is it?","type":"number","answer":67,"hint":"Multiply the upper digit by 20.","why":"3 × 20 + 7 = 67."},{"q":"Why is the Maya zero remarkable?","options":["Very few civilisations ever invented zero as a placeholder; the Maya did so independently","Everyone had zero","The Maya copied it from Rome","Zero was a Maya god"],"answer":"Very few civilisations ever invented zero as a placeholder; the Maya did so independently","hint":"Did the Romans have zero?","why":"Zero as a number placeholder was invented independently only a few times, in Mesopotamia (late), India and Mesoamerica. Roman numerals had none."},{"q":"How many Maya codices survive today?","type":"number","answer":4,"hint":"Very few.","why":"Only 4 Maya codices survive: those of Dresden, Madrid, Paris and Mexico."},{"q":"What happened to many Maya books in 1562?","options":["They were sent to Rome","They were burned at Maní on the orders of Bishop Diego de Landa","They were buried in tombs","They were translated into Latin"],"answer":"They were burned at Maní on the orders of Bishop Diego de Landa","hint":"A Spanish bishop considered them idolatrous.","why":"De Landa had Maya books burned. Ironically, his own notes on Maya writing later helped decipherment."},{"q":"What did Tatiana Proskouriakoff show in 1960?","options":["That Maya inscriptions record the births, accessions and deaths of real rulers","That Maya glyphs were only decoration","That the Maya came from Egypt","That the Maya had no calendar"],"answer":"That Maya inscriptions record the births, accessions and deaths of real rulers","hint":"She noticed patterns of dates on monuments.","why":"By studying dates on monuments, she showed they recorded rulers' lives, turning the Maya into a people with written history."},{"q":"Chavín de Huántar in the Andes (about 900–200 BC) was mainly…","options":["a religious centre whose art and ideas spread widely","a Roman fort","a Maya capital","an Olmec port"],"answer":"a religious centre whose art and ideas spread widely","hint":"Pilgrims came to its temple.","why":"Chavín was a temple centre in the Peruvian highlands whose style spread across much of the Andes."},{gen:HX.G.maya(28)},{gen:HX.G.maya(28)},{gen:HX.G.mapdot(28)},{gen:HX.G.mapdot(28)},{gen:HX.G.country(28)},{gen:HX.G.feature(28)},{gen:HX.G.span(28)},{gen:HX.G.first(28)},{gen:HX.G.order(28)}],"challenge":[{"q":"A Maya number has 1 in the 8,000s place (20 × 20 × 20), 0 in the 400s place, 5 in the 20s place and 10 in the ones place. What is it?","type":"number","answer":8110,"hint":"Add each place's value.","why":"1 × 8,000 + 0 × 400 + 5 × 20 + 10 = 8,000 + 0 + 100 + 10 = 8110."},{"q":"Before 1952 many scholars believed Maya glyphs recorded only calendars and gods, not history. What changed their minds?","options":["Evidence: sound readings and dates fitting lifespans","A professors' vote","A Mexican Rosetta Stone","Spanish documents of 1950"],"answer":"Evidence: sound readings and dates fitting lifespans","hint":"Did the evidence or the experts' authority decide?","why":"Patterns in the inscriptions themselves, tested on many monuments, showed the glyphs recorded sounds and history. Evidence overturned authority."},{"q":"Caral had monumental buildings but no pottery or writing. A student says: 'Then it cannot have been a civilisation.' Evaluate.","options":["Sound: all civilisations have pottery","Unsound: it assumes a definition Caral itself disproves","Sound: Caral was small","It is a preference"],"answer":"Unsound: it assumes a definition Caral itself disproves","hint":"Is the hidden premise true?","why":"The argument relies on the premise that civilisation requires pottery and writing. Caral's large planned monuments show that premise is false."},{"q":"Columbus reached the Americas in AD 1492. Caral was built about 2600 BC. About how many years earlier was Caral built?","type":"number","answer":4091,"hint":"Crossing BC to AD.","why":"2600 + 1492 − 1 = 4091 years."},{gen:HX.G.gap2(28)}],"extend":"Read about the decipherment of Maya glyphs (Michael Coe's 'Breaking the Maya Code' is excellent). Write a short account of how Knorozov and Proskouriakoff each reasoned from evidence, and how their work was tested.","offline":"Write the numbers 1 to 25 in Maya notation (dot = 1, bar = 5, shell = 0, stacked places of 20). Then write your age, the year, and 400 in Maya numbers."},
    {"title":"The founding of Rome and the Republic","icon":"🐺","learn":[{"say":"Rome grew on seven hills by the river <b>Tiber</b>, where trade routes crossed. To the north lived the <b>Etruscans</b>; to the south, Greek colonies.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 568' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><rect width='600' height='568' fill='#efe4c8'/><path d='M-497,562 -446,528 -347,528 -296,477 -270,375 -249,324 -219,284 -163,261 -120,233 -124,170 -77,148 -26,159 56,131 124,91 180,119 193,176 219,204 270,241 300,270 351,295 381,324 411,338 429,398 414,454 433,454 454,432 478,398 454,358 480,315 514,346 536,332 471,278 433,233 386,227 339,176 321,136 274,102 270,57 274,28 330,17 330,51 364,40 424,136 497,170 540,204 574,239 574,318 600,358 630,403 647,437 673,494 681,522 707,545 724,528 737,545 720,483 750,494 729,460 754,457 773,474 771,443 741,420 711,406 724,386 741,392 716,346 711,318 724,307 741,329 767,318 763,298 789,290 831,290 857,295 883,307 866,338 866,346 861,369 891,380 891,415 904,432 874,437 909,460 913,500 917,511 947,522 951,531 990,534 1050,551 1059,517 1093,528 1136,562 1183,557 1226,522 1269,534 1294,534 1277,596 1281,630 1264,687 1251,721 1243,750 1230,789 1217,823 1191,840 1127,835 1106,823 1071,818 1046,826 1024,840 964,852 909,835 823,818 771,795 733,761 673,744 604,772 600,823 566,892 523,869 429,835 399,778 309,744 240,727 176,687 219,613 197,579 214,517 184,520 167,494 111,517 77,517 13,505 -39,528 -129,522 -206,539 -283,585 -351,619 -424,613 -484,574Z' fill='#bcd9ef'/><path d='M274,449 317,443 411,437 390,494 390,528 356,511 279,477ZM94,284 154,278 159,380 129,398 103,398 103,307ZM146,170 154,216 137,261 111,244 111,204Z' fill='#efe4c8' stroke='#b9a77c'/><path d='M270,142 274,204 279,233 268,242' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><circle cx='279' cy='233' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='398' cy='507' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='354' cy='292' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><g font-size='18' font-weight='700' stroke='#fff' stroke-width='4' paint-order='stroke' text-anchor='middle'><text x='227' y='153' fill='#6d28d9'>ETRURIA</text><text x='326' y='216' fill='#6d28d9'>LATIUM</text><text x='471' y='375' fill='#6d28d9'>Greek colonies</text><text x='236' y='363' fill='#1d5c8a' font-style='italic'>Tyrrhenian Sea</text><text x='437' y='159' fill='#1d5c8a' font-style='italic'>Adriatic Sea</text><text x='270' y='239' fill='#1f2937' text-anchor='end'>Rome</text><text x='389' y='513' fill='#1f2937' text-anchor='end'>Syracuse</text><text x='363' y='298' fill='#1f2937' text-anchor='start'>Naples</text></g><g font-size='18' font-weight='700'><path d='M14 554h102' stroke='#1f2937' stroke-width='4'/><text x='14' y='546' fill='#1f2937' stroke='#fff' stroke-width='4' paint-order='stroke'>200 km</text></g></svg>"}},{"say":"Legend says <b>Romulus</b> founded Rome in 753 BC, a date calculated about 700 years later. Even Rome's historian <b>Livy</b> warned that such tales were not history.","show":{"type":"passage","title":"Livy, History of Rome, Preface (trans. D. Spillan, 1853)","text":"The traditions which have come down to us of what happened before the building of the city, or before its building was contemplated, as being suitable rather to the fictions of poetry than to the genuine records of history, I have no intention either to affirm or refute. This indulgence is conceded to antiquity, that by blending things human with divine, it may make the origin of cities appear more venerable […]"}},{"say":"Archaeology shows huts on the Palatine by about the 8th century BC and villages slowly merging. Tradition says kings ruled until 509 BC, when the last was expelled.","show":HX.tb(...[[["Claim","Evidence","Status"],["Rome founded by Romulus in 753 BC","Legend; date calculated centuries later","Legend"],["Huts on the Palatine by about the 8th century BC","Excavated post-holes","Archaeological fact"],["Kings ruled until about 509 BC","Later tradition, partly confirmed (e.g. Etruscan influence)","Probable outline"]]])},{"say":"Rome became a <b>republic</b>, 'the public thing', with elected officials. Two <b>consuls</b> served one year each and could <b>veto</b> each other; a <b>dictator</b> ruled only in emergencies.","show":HX.tb(...[[["Office","Term","Power"],["2 consuls","1 year","Led state and army; each could veto the other"],["Senate (about 300)","For life","Advised; controlled money and foreign policy"],["Tribunes of the plebs","1 year","Could veto acts harming plebeians"],["Dictator","At most 6 months","Supreme power in emergencies"]]])},{"say":"Plebeians won their own <b>tribunes</b> in 494 BC, and about 450 BC the laws were written on the <b>Twelve Tables</b>. SPQR means 'the Senate and the Roman People'.","show":HX.tb(...[[["System","Who rules?","Check on power"],["Monarchy","One king, by birth","Few"],["Athenian democracy","All citizens, in person","Juries, ostracism"],["Roman Republic","Elected officials and Senate","Two consuls, one-year terms, vetoes"]]])},{"say":"Romans wrote numbers with letters: I, V, X, L, C, D and M. A smaller numeral before a larger one is subtracted, and there is no zero.","show":HX.tb(...[[["Numeral","Value","How"],["XVII","17","10 + 5 + 1 + 1"],["XLIV","44","(50 − 10) + (5 − 1)"],["CDLXXVI","476","(500 − 100) + 50 + 10 + 10 + 5 + 1"],["MMXXVI","2026","1,000 + 1,000 + 10 + 10 + 5 + 1"]]])},{"say":"<b>Explain it.</b> Compare a monarchy, the Athenian democracy and the Roman Republic. Then explain why Livy's warning about the founding legends shows good historical judgement.","show":{"type":"list","items":["Say it in 2–4 complete sentences.","Use the precise words from this lesson.","Support each claim with evidence: how do we know?"],"caption":"Explain it — to a grown-up or in writing"}}],"practice":[{"q":"On which river was Rome built?","options":["The Po","The Tiber","The Nile","The Rhine"],"answer":"The Tiber","hint":"Look at the map.","why":"Rome grew on hills beside the Tiber, near a ford about 25 km from the sea."},{"q":"Who, according to legend, founded Rome?","options":["Aeneas's son Iulus","Romulus","Hannibal","Cincinnatus"],"answer":"Romulus","hint":"He had a twin brother.","why":"Legend says Romulus founded Rome after quarrelling with his twin, Remus."},{"q":"Livy says the founding traditions are 'suitable rather to the fictions of poetry than to the genuine records of history.' What does he mean?","options":["They are good stories but not reliable historical records","They are certainly true","Poets invented Rome","History is less important than poetry"],"answer":"They are good stories but not reliable historical records","hint":"Read the passage.","why":"Livy admits the earliest stories cannot be checked; he will neither affirm nor refute them."},{"q":"What does archaeology show about early Rome?","options":["A great city built in one day","Huts on the Palatine by the 8th century BC, slowly merging","Nothing before AD 1","A Greek city"],"answer":"Huts on the Palatine by the 8th century BC, slowly merging","hint":"Post-holes of huts have been found.","why":"Remains of huts and graves show small settlements that gradually merged into a city."},{"q":"Rome's traditional founding is 753 BC and the Republic's founding 509 BC. How many years of kings does that leave?","type":"number","answer":244,"hint":"Both BC: subtract.","why":"753 − 509 = 244 years."},{"q":"What does 'republic' mean?","options":["Rule by a king","'The public thing': a state where power belongs to the citizens, who elect officials","Rule by priests","Rule by soldiers"],"answer":"'The public thing': a state where power belongs to the citizens, who elect officials","hint":"Latin res publica.","why":"Res publica means 'the public thing' or 'public affair': government as the business of the people, through elected officials."},{"q":"How many consuls were elected each year?","type":"number","answer":2,"hint":"Each could check the other.","why":"There were 2 consuls, each able to veto the other."},{"q":"Why did Rome have two consuls with one-year terms?","options":["To save money","To prevent any one man from gaining too much power","Because one died each year","Because the Senate was lazy"],"answer":"To prevent any one man from gaining too much power","hint":"What had the Romans just escaped?","why":"After expelling their king, Romans divided and limited power so that no one could become a king again."},{"q":"What does 'veto' mean?","options":["I agree","I forbid","I vote","I win"],"answer":"I forbid","hint":"It is Latin.","why":"Veto means 'I forbid'; a consul or tribune could block an action."},{"q":"Who were the tribunes of the plebs?","options":["Officials elected by plebeians who could veto actions harming ordinary citizens","Army generals","Priests of Jupiter","Kings of Rome"],"answer":"Officials elected by plebeians who could veto actions harming ordinary citizens","hint":"They were won in 494 BC.","why":"After the plebeians' walk-out, they gained tribunes to protect them, with the power of veto."},{"q":"Why were the Twelve Tables important?","options":["They listed the kings","They wrote the laws down publicly, so judges could not twist unwritten custom","They were Rome's first coins","They were a religious calendar"],"answer":"They wrote the laws down publicly, so judges could not twist unwritten custom","hint":"Recall Hammurabi's stele.","why":"Written, public laws protected ordinary citizens from arbitrary decisions by patrician judges."},{"q":"What does SPQR stand for?","options":["Senatus Populusque Romanus: the Senate and the Roman People","Soldiers Protect Quiet Rome","Sons of Peter, Queen of Rome","Seven Patrician Quarters of Rome"],"answer":"Senatus Populusque Romanus: the Senate and the Roman People","hint":"Latin.","why":"SPQR = Senatus Populusque Romanus, the Senate and the Roman People."},{"q":"How was the Roman Republic different from Athenian democracy?","options":["Rome elected officials; Athenians voted on laws directly","Rome had no voting","Athens had kings","They were identical"],"answer":"Rome elected officials; Athenians voted on laws directly","hint":"Direct versus representative.","why":"Athens was a direct democracy. Roman citizens also voted in assemblies, but only on proposals put to them by officials; elected officials and the Senate did most of the governing."},{"q":"How long, at most, could a Roman dictator hold power, in months?","type":"number","answer":6,"hint":"It was meant for emergencies.","why":"At most 6 months, or until the emergency ended."},{"q":"Which Roman numeral means 44?","options":["XXXXIV","XLIV","LXIV","IVL"],"answer":"XLIV","hint":"40 is XL (50 − 10); 4 is IV.","why":"44 = 40 + 4 = XL + IV = XLIV."},{gen:HX.G.romanToNum(29)},{gen:HX.G.romanToNum(29)},{gen:HX.G.numToRoman(29)},{gen:HX.G.numToRoman(29)},{gen:HX.G.mapdot(29)},{gen:HX.G.country(29)},{gen:HX.G.feature(29)},{gen:HX.G.span(29)},{gen:HX.G.first(29)}],"challenge":[{"q":"A writer argues: 'Romulus founded Rome in 753 BC, because Roman historians give that date.' What is the weakness?","options":["The date was worked out 700 years later from legends","Roman historians gave no date","753 BC is in the AD era","Nothing: authority proves it"],"answer":"The date was worked out 700 years later from legends","hint":"When and how was the date produced?","why":"An authority is only as good as its evidence. A date reconstructed centuries later from legends cannot confirm a founding by Romulus."},{"q":"Write MCMLXIX as an ordinary number.","type":"number","answer":1969,"hint":"M = 1,000; CM = 900; LX = 60; IX = 9.","why":"1,000 + 900 + 60 + 9 = 1969, the year of the Moon landing."},{"q":"The Roman Republic had many checks on power: two consuls, one-year terms, vetoes, a Senate. What is a cost of so many checks?","options":["Decisions can be slow and blocked in a crisis","There is no cost","It makes the state a monarchy","It abolishes elections"],"answer":"Decisions can be slow and blocked in a crisis","hint":"Why did Rome invent the dictator?","why":"Checks prevent tyranny but can cause deadlock. Rome's solution, a temporary dictator, itself carried risk, as later history showed."},{"q":"The Gauls sacked Rome about 390 BC. How many years after the Republic's founding (509 BC) was that?","type":"number","answer":119,"hint":"Both BC: subtract.","why":"509 − 390 = 119 years."},{gen:HX.G.gap2(29)}],"extend":"Read Livy's Preface and Book 1, chapters 3–7 (Romulus and Remus) in Canon Roberts's translation. List the parts that are clearly legend, and any details that archaeology might be able to test.","offline":"Make a 'Twelve Tables' for your family: twelve short rules, each fair to everyone, carved (written) on card. Then check each one: could a judge twist it? Rewrite any that are unclear."},
    {"title":"Carthage, Hannibal and Julius Caesar","icon":"🐘","learn":[{"say":"By 264 BC Rome controlled Italy, and met Carthage, the Phoenician sea power, over Sicily. The three <b>Punic Wars</b> (from Latin <i>Punicus</i>, Phoenician) followed. In the first, Rome built its first great fleet and won Sicily.","show":HX.tb(...[[["War","Years","Outcome"],["First Punic War","264–241 BC","Rome wins Sicily"],["Second Punic War","218–201 BC","Hannibal invades Italy; Rome wins at Zama"],["Third Punic War","149–146 BC","Rome destroys Carthage"]]])},{"say":"In 218 BC <b>Hannibal</b> marched from Spain over the Alps into Italy. At <b>Cannae</b> in 216 BC he surrounded and destroyed a much larger Roman army.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 371' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><defs><marker id='a' viewBox='0 0 10 10' refX='7' refY='5' markerWidth='5' markerHeight='5' orient='auto'><path d='M0 0L10 5L0 10Z' fill='context-stroke'/></marker></defs><rect width='600' height='371' fill='#efe4c8'/><path d='M88,315 112,299 158,299 182,276 194,228 204,204 218,186 244,175 264,162 262,133 284,122 308,127 346,114 378,95 404,109 410,135 422,148 446,166 460,179 484,191 498,204 512,211 520,239 513,265 522,265 532,254 543,239 532,220 544,200 560,215 570,208 540,183 522,162 500,159 478,135 470,117 448,101 446,80 448,66 474,61 474,77 490,72 518,117 552,133 572,148 588,164 588,201 600,220 614,241 622,257 634,284 638,297 650,307 658,299 664,307 656,278 670,284 660,268 672,266 681,274 680,260 666,249 652,242 658,233 666,236 654,215 652,201 658,196 666,207 678,201 676,192 688,188 708,188 720,191 732,196 724,211 724,215 722,225 736,231 736,246 742,254 728,257 744,268 746,286 748,292 762,297 764,301 782,302 810,310 814,294 830,299 850,315 872,313 892,297 912,302 924,302 916,331 918,347 910,374 904,390 900,403 894,421 888,437 876,445 846,443 836,437 820,435 808,439 798,445 770,451 744,443 704,435 680,424 662,408 634,400 602,413 600,437 584,469 564,458 520,443 506,416 464,400 432,392 402,374 422,339 412,323 420,294 406,295 398,284 372,294 356,294 326,289 302,299 260,297 224,305 188,326 156,342 122,339 94,321ZM88,315 74,305 52,286 22,292 24,252 10,246 22,199 22,159 14,133 40,114 164,122 176,53 150,19 110,-11 170,-19 168,-42 204,-45 232,-74 250,-82 280,-103 296,-138 372,-156 372,-199 364,-239 412,-257 412,-305 304,-292 300,-371 -600,-371 -600,875 -140,716 -120,636 -60,543 4,464 6,419 30,390 64,368 82,323Z' fill='#bcd9ef'/><path d='M448,262 468,260 512,257 502,284 502,299 486,292 450,276ZM364,186 392,183 394,231 380,239 368,239 368,196ZM388,133 392,154 384,175 372,167 372,148Z' fill='#efe4c8' stroke='#b9a77c'/><path d='M446,119 448,148 450,162 445,166' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M180,276 204,212 212,193 250,148 294,106 324,80 336,74 354,78 392,80 442,129 490,159 523,177' fill='none' stroke='#b42318' stroke-width='4' stroke-linejoin='round' marker-end='url(#a)'/><circle cx='180' cy='276' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='450' cy='162' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='523' cy='177' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='406' cy='295' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='388' cy='313' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><g font-size='18' font-weight='700' stroke='#fff' stroke-width='4' paint-order='stroke' text-anchor='middle'><text x='260' y='19' fill='#b42318'>Hannibal's route, 218–216 BC</text><text x='370' y='42' fill='#6b5a35'>Alps</text><text x='300' y='249' fill='#1d5c8a' font-style='italic'>Mediterranean Sea</text><text x='180' y='300' fill='#1f2937' text-anchor='middle'>New Carthage</text><text x='441' y='168' fill='#1f2937' text-anchor='end'>Rome</text><text x='532' y='183' fill='#1f2937' text-anchor='start'>Cannae</text><text x='415' y='301' fill='#1f2937' text-anchor='start'>Carthage</text><text x='388' y='337' fill='#1f2937' text-anchor='middle'>Zama (approx.)</text></g></svg>"}},{"say":"Rome fought on, and Scipio beat Hannibal at <b>Zama</b> in 202 BC. In 146 BC Rome destroyed Carthage; the story that it salted the earth appears only in modern times.","show":HX.tb(...[[["Claim","Evidence","Verdict"],["Rome destroyed Carthage in 146 BC","Polybius (an eyewitness), archaeology","Fact"],["Survivors were enslaved","Ancient historians","Fact"],["Romans salted the earth","No ancient source; appears in modern books","Modern myth"]]])},{"say":"Our main source, <b>Polybius</b>, knew the events well but admired his Roman patrons. Carthage's own histories are lost, so we see it through its enemies' eyes.","show":{"type":"big","text":"Carthage's own books: lost\nOur sources: Roman or pro-Roman","caption":"Whose voice survives shapes the story"}},{"say":"Conquest enriched Rome but strained the Republic, and slaves like <b>Spartacus</b> rose in revolt. <b>Julius Caesar</b> conquered Gaul and wrote his own account of it.","show":{"type":"passage","title":"Julius Caesar, The Gallic War 1.1 (trans. W. A. McDevitte and W. S. Bohn, 1869)","text":"All Gaul is divided into three parts, one of which the Belgae inhabit, the Aquitani another, those who in their own language are called Celts, in ours Gauls, the third."}},{"say":"In 49 BC Caesar crossed the <b>Rubicon</b> with his army and won a civil war. On the <b>Ides of March</b>, 44 BC, senators who feared he would make himself king assassinated him.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 360' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><path d='M30 170H570' stroke='#1f2937' stroke-width='4'/><circle cx='135' cy='170' r='8' fill='#1d5c8a'/><path d='M135 170V146' stroke='#1d5c8a' stroke-width='2'/><text x='135' y='118' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Gallic War</text><text x='135' y='140' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>begins 58 BC</text><circle cx='347' cy='170' r='8' fill='#1d5c8a'/><path d='M347 170V222' stroke='#1d5c8a' stroke-width='2'/><text x='347' y='242' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Rubicon</text><text x='347' y='264' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>49 BC</text><circle cx='442' cy='170' r='8' fill='#1d5c8a'/><path d='M442 170V100' stroke='#1d5c8a' stroke-width='2'/><text x='442' y='72' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Julian calendar</text><text x='442' y='94' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>begins 45 BC</text><circle cx='465' cy='170' r='8' fill='#1d5c8a'/><path d='M465 170V268' stroke='#1d5c8a' stroke-width='2'/><text x='465' y='288' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Ides of March</text><text x='465' y='310' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>44 BC</text></svg>"}},{"say":"<b>Explain it.</b> How did Rome defeat Carthage, and how did conquest weaken the Republic? Explain why Caesar's own Gallic War must be read with care.","show":{"type":"list","items":["Say it in 2–4 complete sentences.","Use the precise words from this lesson.","Support each claim with evidence: how do we know?"],"caption":"Explain it — to a grown-up or in writing"}}],"practice":[{"q":"What were the Punic Wars?","options":["Wars between Athens and Sparta","Three wars between Rome and Carthage","Wars between Rome and Persia","Civil wars in Rome"],"answer":"Three wars between Rome and Carthage","hint":"Punicus = Phoenician.","why":"The Punic Wars (264–146 BC) were fought between Rome and Carthage, a Phoenician city."},{"q":"What did Rome win in the First Punic War?","options":["Spain","Egypt","Sicily","Gaul"],"answer":"Sicily","hint":"That was the island they fought over.","why":"Rome won Sicily in 241 BC, its first overseas province."},{"q":"Which mountains did Hannibal cross to invade Italy?","options":["The Apennines only","The Pyrenees and the Alps","The Himalaya","The Atlas"],"answer":"The Pyrenees and the Alps","hint":"Look at the route on the map.","why":"He marched from Spain over the Pyrenees, crossed the Rhône, and crossed the Alps in late 218 BC."},{"q":"Hannibal set out with about 37 elephants (Polybius's figure). If only 1 survived the next winter, how many died?","type":"number","answer":36,"hint":"Subtract.","why":"37 − 1 = 36 elephants died."},{"q":"What happened at Cannae in 216 BC?","options":["Hannibal surrounded and destroyed a much larger Roman army","Rome destroyed Carthage","Caesar crossed the Rubicon","Scipio defeated Hannibal"],"answer":"Hannibal surrounded and destroyed a much larger Roman army","hint":"It is still studied in military academies.","why":"Hannibal's encirclement at Cannae killed tens of thousands of Romans in one day."},{"q":"Where and when was Hannibal finally defeated?","options":["Cannae, 216 BC","Zama, 202 BC","Rome, 146 BC","Sicily, 241 BC"],"answer":"Zama, 202 BC","hint":"Scipio took the war to Africa.","why":"Scipio defeated Hannibal at Zama in North Africa in 202 BC."},{"q":"Carthage was destroyed in 146 BC. How many years after Hannibal crossed the Alps (218 BC)?","type":"number","answer":72,"hint":"Both BC: subtract.","why":"218 − 146 = 72 years."},{"q":"Did the Romans sow salt on Carthage's fields?","options":["Yes, ancient historians describe it in detail","There is no ancient evidence; the story appears only in modern times","Yes, archaeologists found the salt","It was the Greeks who did it"],"answer":"There is no ancient evidence; the story appears only in modern times","hint":"Which ancient source mentions salt?","why":"No ancient source mentions salting. The story is a modern addition, a reminder to check where a 'well-known fact' comes from."},{"q":"Why must we read Polybius with care, even though he was well informed?","options":["He admired his Roman patrons, and Carthage's books are lost","He was Carthaginian","He lived 1,000 years later","He never visited Italy"],"answer":"He admired his Roman patrons, and Carthage's books are lost","hint":"Whose side was he close to?","why":"Polybius was knowledgeable and careful, but his patrons were Romans who destroyed Carthage. With no Carthaginian account surviving, we hear mainly one side."},{"q":"Who was Spartacus?","options":["A Spartan king","A gladiator who led a great slave revolt in Italy, 73–71 BC","A Roman consul","Hannibal's brother"],"answer":"A gladiator who led a great slave revolt in Italy, 73–71 BC","hint":"He was a Thracian.","why":"Spartacus led tens of thousands of escaped slaves; the revolt was crushed in 71 BC. It shows the brutality of Roman slavery."},{"q":"Caesar's Gallic War is written in the third person ('Caesar did…'). Why should a historian be careful with it?","options":["It is Caesar's own account of his own campaigns, written to win support in Rome","It was written by his enemies","It is in Greek","It is a poem"],"answer":"It is Caesar's own account of his own campaigns, written to win support in Rome","hint":"Who wrote it, about whom, and why?","why":"Caesar wrote to present himself well to Romans. Writing in the third person makes it sound objective, but it is self-presentation."},{"q":"Into how many parts does Caesar say Gaul is divided?","options":["Two","Three","Four","Twelve"],"answer":"Three","hint":"Read the opening line.","why":"'All Gaul is divided into three parts': Belgae, Aquitani and Celts (Gauls)."},{"q":"What was significant about crossing the Rubicon in 49 BC?","options":["It was illegal for a general to bring his army into Italy; crossing meant civil war","It was the border of Spain","It ended the Punic Wars","It was a religious festival"],"answer":"It was illegal for a general to bring his army into Italy; crossing meant civil war","hint":"The river marked Italy's border.","why":"By crossing with his army, Caesar defied the Senate; the phrase now means passing a point of no return."},{"q":"Why did senators assassinate Caesar in 44 BC?","options":["He had lost a war","They feared he had made himself a king in all but name, ending the Republic","He refused to be dictator","He was a Carthaginian spy"],"answer":"They feared he had made himself a king in all but name, ending the Republic","hint":"He had been named dictator for life.","why":"As dictator for life, Caesar held power that looked like kingship, which Romans had sworn never to accept again."},{"q":"What are the Ides of March?","options":["1 March","15 March","31 March","The first day of spring"],"answer":"15 March","hint":"Caesar was killed then.","why":"In the Roman calendar the Ides of March fell on 15 March."},{gen:HX.G.romanToNum(30)},{gen:HX.G.numToRoman(30)},{gen:HX.G.mapdot(30)},{gen:HX.G.mapdot(30)},{gen:HX.G.country(30)},{gen:HX.G.span(30)},{gen:HX.G.first(30)},{gen:HX.G.order(30)},{gen:HX.G.century(30)}],"challenge":[{"q":"Plutarch writes that Caesar's wars in Gaul killed a million people and enslaved another million. How should we treat such figures?","options":["As a sign of great destruction, uncertain in detail","As exact counts","As certainly invented","As Gallic propaganda"],"answer":"As a sign of great destruction, uncertain in detail","hint":"Recall Herodotus's numbers.","why":"Round, huge figures from writers far from the events signal scale, not precision. Even if the true numbers were smaller, the conquest was devastating."},{"q":"The Julian calendar has 365 days with an extra day every 4 years. How many days are there in 4 Julian years?","type":"number","answer":1461,"hint":"3 ordinary years plus 1 leap year.","why":"3 × 365 + 366 = 1,095 + 366 = 1461 days."},{"q":"Carthage's books were lost, so we know its history mainly from Romans and Greeks. Which conclusion is most careful?","options":["Be cautious, and check with archaeology from Carthage","Carthage had no history","Roman accounts must be false","Archaeology cannot help"],"answer":"Be cautious, and check with archaeology from Carthage","hint":"How can we hear a silenced side?","why":"When one side's records are lost, archaeology (temples, harbours, inscriptions) gives independent evidence. We neither accept nor dismiss the enemy's account automatically."},{"q":"Caesar was born in July 100 BC and killed on 15 March 44 BC. How old was he when he died?","type":"number","answer":55,"hint":"Both BC: subtract, then ask whether he had reached his birthday in 44 BC.","why":"100 − 44 = 56 years from July to July, but in March 44 BC he had not yet reached his July birthday, so he was 55."},{gen:HX.G.gap2(30)}],"extend":"Read Polybius, Histories 3.47–56 (Hannibal crossing the Alps; Shuckburgh translation). Note where Polybius criticises other writers for exaggeration, and say whether his own account seems more careful, with reasons.","offline":"Make a table of the Roman Republic's offices (consuls, tribunes, Senate, dictator) and explain to a grown-up how Caesar broke each limit. Then discuss: is a strong leader ever worth losing a republic?"},
    {"title":"Augustus, Christianity and the Pax Romana","icon":"🏛️","learn":[{"say":"Octavian defeated Antony and Cleopatra at <b>Actium</b> in 31 BC, and in 27 BC took the name <b>Augustus</b>. Calling himself 'first citizen', he ruled for life: Rome was now an empire.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 360' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><path d='M30 170H570' stroke='#1f2937' stroke-width='4'/><circle cx='80' cy='170' r='8' fill='#1d5c8a'/><path d='M80 170V146' stroke='#1d5c8a' stroke-width='2'/><text x='66' y='118' font-size='18' fill='#1f2937' text-anchor='start' font-weight='700'>Actium</text><text x='66' y='140' font-size='18' fill='#1f2937' text-anchor='start' font-weight='700'>31 BC</text><circle cx='88' cy='170' r='8' fill='#1d5c8a'/><path d='M88 170V222' stroke='#1d5c8a' stroke-width='2'/><text x='74' y='242' font-size='18' fill='#1f2937' text-anchor='start' font-weight='700'>Augustus</text><text x='74' y='264' font-size='18' fill='#1f2937' text-anchor='start' font-weight='700'>27 BC</text><circle cx='173' cy='170' r='8' fill='#1d5c8a'/><path d='M173 170V100' stroke='#1d5c8a' stroke-width='2'/><text x='173' y='72' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Augustus dies</text><text x='173' y='94' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>AD 14</text><circle cx='308' cy='170' r='8' fill='#1d5c8a'/><path d='M308 170V222' stroke='#1d5c8a' stroke-width='2'/><text x='308' y='242' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Vesuvius</text><text x='308' y='264' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>AD 79</text><circle cx='387' cy='170' r='8' fill='#1d5c8a'/><path d='M387 170V146' stroke='#1d5c8a' stroke-width='2'/><text x='387' y='118' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Greatest extent</text><text x='387' y='140' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>AD 117</text><circle cx='518' cy='170' r='8' fill='#1d5c8a'/><path d='M518 170V268' stroke='#1d5c8a' stroke-width='2'/><text x='532' y='288' font-size='18' fill='#1f2937' text-anchor='end' font-weight='700'>Pax Romana</text><text x='532' y='310' font-size='18' fill='#1f2937' text-anchor='end' font-weight='700'>ends AD 180</text></svg>"}},{"say":"From 27 BC to AD 180 the <b>Pax Romana</b> joined perhaps 50 to 70 million people with roads, one currency and Roman law. The frontier ran along the Rhine and Danube.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 434' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><rect width='600' height='434' fill='#efe4c8'/><path d='M44,275 56,267 79,267 91,255 97,231 102,220 109,210 122,205 132,199 131,184 142,179 154,181 173,175 189,166 202,172 205,185 211,192 223,201 230,207 242,213 249,220 256,223 260,237 257,250 261,250 266,245 272,237 266,228 272,218 280,225 285,222 270,209 261,199 250,197 239,185 235,176 224,168 223,158 224,151 237,149 237,156 245,154 259,176 276,184 286,192 294,200 294,218 300,228 307,238 311,246 317,259 319,266 325,271 329,267 332,271 328,256 335,259 330,251 336,251 340,254 340,247 333,242 326,239 329,234 333,235 327,225 326,218 329,216 333,221 339,218 338,214 344,212 354,212 360,213 366,216 362,223 362,225 361,230 368,233 368,241 371,245 364,246 372,251 373,260 374,263 381,266 382,268 391,268 405,272 407,264 415,267 425,275 436,274 446,266 456,268 462,268 458,283 459,291 455,304 452,312 450,318 447,327 444,335 438,339 423,338 418,335 410,334 404,336 399,339 385,342 372,338 352,334 340,329 331,321 317,317 301,324 300,335 292,351 282,346 260,338 253,325 232,317 216,313 201,304 211,287 206,279 210,264 203,265 199,259 186,264 178,264 163,262 151,267 130,266 112,270 94,280 78,288 61,287 47,277ZM390,208 380,203 375,191 379,181 386,174 397,155 407,138 418,137 426,145 425,153 435,164 445,163 454,158 465,154 480,164 497,176 516,203 510,209 497,210 483,211 463,206 451,197 43  440,517 437,527 425,544 425,579 416,625' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M145,66 161,68 170,80 182,92 195,99 210,105 221,105 235,110 264,116 289,124 305,138 335,121 365,132 382,153 397,155' fill='none' stroke='#b42318' stroke-width='4' stroke-linejoin='round'/><path d='M516,203 545,221 555,243 540,289 570,342 585,355' fill='none' stroke='#b42318' stroke-width='4' stroke-linejoin='round'/><path d='M450,362 430,434 390,408 350,348 300,348 250,345 200,335 180,302 140,296 100,295 50,309 30,305' fill='none' stroke='#b42318' stroke-width='4' stroke-dasharray='9 6' stroke-linejoin='round'/><path d='M47,27 85,26' fill='none' stroke='#b42318' stroke-width='4' stroke-linejoin='round'/><circle cx='225' cy='199' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='452' cy='332' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><g font-size='18' font-weight='700' stroke='#fff' stroke-width='4' paint-order='stroke' text-anchor='middle'><text x='300' y='46' fill='#b42318'>Frontiers about AD 117 (approx.)</text><text x='280' y='300' fill='#1d5c8a' font-style='italic'>Mediterranean</text><text x='225' y='223' fill='#1f2937' text-anchor='middle'>Rome</text><text x='443' y='338' fill='#1f2937' text-anchor='end'>Jerusalem</text></g></svg>"}},{"say":"Aqueducts carried water by gravity for many kilometres. The Pont du Gard in France belongs to an aqueduct about 50 km long that falls only about 12.6 m over its whole length: about 25 cm per kilometre. Rome itself was eventually supplied by eleven aqueducts.","show":{"type":"big","text":"12.6 m fall ÷ 50 km ≈ 25 cm per km","caption":"Roman engineers worked to a tiny slope"}},{"say":"<b>Jesus</b> was born in Judaea in the reign of Augustus. Because Matthew places the birth under Herod, who died in 4 BC, historians date it about 6–4 BC.","show":{"type":"passage","title":"Luke 2:1 (World English Bible)","text":"Now in those days, a decree went out from Caesar Augustus that all the world should be enrolled."}},{"say":"Jesus was crucified under <b>Pontius Pilate</b> about AD 30–33. The Roman historian <b>Tacitus</b>, hostile to Christians, confirms it, and a stone naming Pilate was found in 1961.","show":{"type":"passage","title":"Tacitus, Annals 15.44 (trans. A. J. Church and W. J. Brodribb, 1876)","text":"Christus, from whom the name had its origin, suffered the extreme penalty during the reign of Tiberius at the hands of one of our procurators, Pontius Pilatus […]"}},{"say":"<b>Paul</b>'s letters from the AD 50s are the earliest Christian writings. In AD 79 Vesuvius buried <b>Pompeii</b>, described by the eyewitness Pliny the Younger.","show":HX.tb(...[[["Source on early Christianity","Writer's attitude","Value"],["Paul's letters (AD 50s)","Christian","Earliest Christian documents"],["The Gospels (later 1st century)","Christian","Accounts of Jesus's life and teaching"],["Tacitus, Annals (about AD 116)","Hostile","Confirms Pilate's execution of Christus"],["Pilate Stone (found 1961)","Neutral inscription","Confirms Pilate held office in Judaea"]]])},{"say":"<b>Explain it.</b> What held the Roman Empire together during the Pax Romana? Explain why Tacitus, a hostile writer, is a valuable witness for the death of Jesus under Pilate.","show":{"type":"list","items":["Say it in 2–4 complete sentences.","Use the precise words from this lesson.","Support each claim with evidence: how do we know?"],"caption":"Explain it — to a grown-up or in writing"}}],"practice":[{"q":"Whom did Octavian defeat at Actium in 31 BC?","options":["Hannibal","Mark Antony and Cleopatra","Julius Caesar","Spartacus"],"answer":"Mark Antony and Cleopatra","hint":"It was a sea battle off Greece.","why":"At Actium Octavian's fleet defeated Antony and Cleopatra, leaving him master of the Roman world."},{"q":"What does 'Augustus' mean?","options":["King of kings","Revered one","First soldier","Son of Mars"],"answer":"Revered one","hint":"A title of honour given in 27 BC.","why":"Augustus means 'revered' or 'majestic', a title the Senate gave Octavian in 27 BC."},{"q":"Augustus called himself 'first citizen'. What was the reality?","options":["He held supreme power for life while keeping the forms of the Republic","He had no power","He shared power equally with the Senate","He was elected every year by the people"],"answer":"He held supreme power for life while keeping the forms of the Republic","hint":"Did elections still decide who ruled?","why":"He kept consuls and Senate in name, but controlled the army and key offices: an emperor in fact."},{"q":"Augustus received his title in 27 BC and died in AD 14. For how many years did he rule as Augustus?","type":"number","answer":40,"hint":"Crossing BC to AD.","why":"27 + 14 − 1 = 40 years."},{"q":"What was the Pax Romana?","options":["A peace treaty with Carthage","About two centuries of peace in the empire, 27 BC – AD 180","A Roman coin","A temple"],"answer":"About two centuries of peace in the empire, 27 BC – AD 180","hint":"Pax = peace.","why":"From Augustus to Marcus Aurelius, the empire enjoyed internal peace, trade and growth, though frontier wars continued."},{"q":"The Pax Romana ran from 27 BC to AD 180. How many years is that?","type":"number","answer":206,"hint":"Crossing BC to AD.","why":"27 + 180 − 1 = 206 years."},{"q":"Which rivers formed much of Rome's northern frontier in Europe?","options":["The Tiber and the Po","The Rhine and the Danube","The Nile and the Jordan","The Tigris and the Euphrates"],"answer":"The Rhine and the Danube","hint":"Look at the map.","why":"The Rhine and Danube marked most of the northern frontier."},{"q":"An aqueduct falls 12.6 m over 50 km. How many centimetres does it fall per kilometre, to the nearest whole number?","type":"number","answer":25,"hint":"Convert 12.6 m to 1,260 cm, then divide by 50.","why":"1,260 ÷ 50 = 25.2 cm per km, about 25."},{"q":"Why do historians date Jesus's birth to about 6–4 BC, not AD 1?","options":["Matthew places it under Herod, who died in 4 BC","Augustus changed the calendar","The Rosetta Stone says so","There is no year 0"],"answer":"Matthew places it under Herod, who died in 4 BC","hint":"When did Herod die?","why":"Herod died in 4 BC, so a birth under Herod must be earlier. Dionysius's count, made centuries later, slightly misplaced the year."},{"q":"Under which Roman governor was Jesus crucified?","options":["Augustus","Herod","Pontius Pilate","Nero"],"answer":"Pontius Pilate","hint":"Tacitus names him.","why":"Jesus was executed under Pontius Pilate, prefect of Judaea from about AD 26 to 36."},{"q":"Why is Tacitus's mention of Christus valuable evidence?","options":["He was hostile to Christians, so had no motive to invent it","He was a Christian bishop","He saw the crucifixion","He wrote in Hebrew"],"answer":"He was hostile to Christians, so had no motive to invent it","hint":"A hostile witness who confirms a fact.","why":"When a writer who dislikes a group confirms a fact about it, the fact is unlikely to be invented to please that group. Tacitus confirms the execution under Pilate."},{"q":"What does the Pilate Stone, found at Caesarea in 1961, show?","options":["That Jesus was born in 4 BC","That Pontius Pilate was the Roman prefect of Judaea","That Pompeii existed","That Augustus visited Judaea"],"answer":"That Pontius Pilate was the Roman prefect of Judaea","hint":"It is an inscription.","why":"The stone names Pilate as prefect, confirming independently what the Gospels, Tacitus and Josephus say about his office."},{"q":"What are the earliest surviving Christian writings?","options":["The Gospel of John","Paul's letters, from the AD 50s","Tacitus's Annals","The Book of Revelation"],"answer":"Paul's letters, from the AD 50s","hint":"Paul wrote to churches he founded.","why":"Paul's letters date from about AD 50–60, earlier than the Gospels as we have them."},{"q":"Why was Pliny the Younger's account of Vesuvius so valuable?","options":["He was an eyewitness who wrote soon afterwards, and excavations have confirmed much of it","He was a volcano","He wrote 500 years later","He was the emperor"],"answer":"He was an eyewitness who wrote soon afterwards, and excavations have confirmed much of it","hint":"Who was he, and how close was he?","why":"Pliny watched the eruption from across the bay and described it in letters to Tacitus. Archaeology at Pompeii and Herculaneum corroborates his account."},{"q":"What helped the Roman Empire hold together during the Pax Romana?","options":["Everyone spoke Greek only","Roads, a common currency, Roman law and the army","There was no trade","A single religion was forced on all from the start"],"answer":"Roads, a common currency, Roman law and the army","hint":"What connects distant provinces?","why":"Roads and sea lanes carried trade and troops, coins and law were shared, and the army guarded the frontiers."},{gen:HX.G.romanToNum(31)},{gen:HX.G.numToRoman(31)},{gen:HX.G.mapdot(31)},{gen:HX.G.country(31)},{gen:HX.G.feature(31)},{gen:HX.G.span(31)},{gen:HX.G.first(31)},{gen:HX.G.order(31)},{gen:HX.G.ago(31)}],"challenge":[{"q":"Paul's letters, the Gospels, Tacitus and the Pilate Stone all bear on early Christianity. Which pair gives the strongest independent corroboration that Pilate governed Judaea?","options":["Two Gospels","Tacitus and the Pilate Stone","Paul and Luke","Luke and Matthew"],"answer":"Tacitus and the Pilate Stone","hint":"Which sources are independent of each other and of Christian writers?","why":"A hostile Roman historian and a neutral stone inscription are independent of the Christian texts and of each other. Their agreement is strong corroboration."},{"q":"Hadrian's Wall was about 117 km long, with a small fort (milecastle) every Roman mile, about 1.5 km. About how many milecastles is that? Round to the nearest whole number.","type":"number","answer":78,"hint":"117 ÷ 1.5.","why":"117 ÷ 1.5 = 78 milecastles. (The wall measured 80 Roman miles; about 80 milecastles were planned.)"},{"q":"A student argues: 'The Pax Romana was peaceful, so everyone in the empire was free and happy.' Evaluate.","options":["Sound","Unsound: peace did not mean freedom; slavery and revolts continued","Sound, because Augustus said so","It is a preference"],"answer":"Unsound: peace did not mean freedom; slavery and revolts continued","hint":"Does 'peace' mean the same as 'freedom'?","why":"Absence of major wars inside the empire is real and important, but the conclusion overreaches: slavery, revolts and their brutal suppression are also part of the evidence."},{"q":"Write MDCCXLVIII as an ordinary number: the year excavations began at Pompeii.","type":"number","answer":1748,"hint":"M = 1,000; DCC = 700; XL = 40; VIII = 8.","why":"1,000 + 700 + 40 + 8 = 1748."},{gen:HX.G.gap2(31)}],"extend":"Read Pliny the Younger's letters 6.16 and 6.20 to Tacitus about Vesuvius (public-domain translation by William Melmoth, revised). List five details he gives and say which ones archaeology or volcanology could check.","offline":"Build a mini-aqueduct from a cardboard tube cut lengthwise or a gutter: try to carry water 2 metres with as small a slope as possible. Measure the drop. What is the smallest drop that still keeps the water flowing?"},
