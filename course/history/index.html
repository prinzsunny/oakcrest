    {"title":"Abraham's journey","icon":"⛺","learn":[{"say":"The Bible's book of Genesis tells how <b>Abraham</b> (first called Abram) left Ur, travelled with his family up the Euphrates to Haran, and then went on to the land of Canaan. Jews, Christians and Muslims all honour him as a father of their faith.","show":{"type":"passage","title":"Genesis 11:31 (World English Bible)","text":"Terah took Abram his son, Lot the son of Haran, his son’s son, and Sarai his daughter-in-law, his son Abram’s wife. They went from Ur of the Chaldees, to go into the land of Canaan. They came to Haran and lived there."}},{"say":"In Haran, Genesis says, God called Abram to go on, with a promise that has shaped history ever since.","show":{"type":"passage","title":"Genesis 12:1–3 (World English Bible)","text":"Now Yahweh said to Abram, “Leave your country, and your relatives, and your father’s house, and go to the land that I will show you. I will make of you a great nation. I will bless you and make your name great. You will be a blessing. I will bless those who bless you, and I will curse him who treats you with contempt. All the families of the earth will be blessed through you.”"}},{"say":"Trace the journey. From Ur to Haran is roughly 1,000 km following the Euphrates; from Haran south to Canaan roughly 700 km more. Families travelling with flocks would move slowly, from pasture to pasture.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 474' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><defs><marker id='a' viewBox='0 0 10 10' refX='7' refY='5' markerWidth='5' markerHeight='5' orient='auto'><path d='M0 0L10 5L0 10Z' fill='context-stroke'/></marker></defs><rect width='600' height='440' fill='#efe4c8'/><path d='M-1220,116 -1180,92 -1103,92 -1063,56 -1043,-16 -1027,-52 -1003,-80 -960,-96 -927,-116 -930,-160 -893,-176 -853,-168 -790,-188 -737,-216 -693,-196 -683,-156 -663,-136 -623,-110 -600,-90 -560,-72 -537,-52 -513,-42 -500,0 -512,40 -497,40 -480,24 -462,0 -480,-28 -460,-58 -433,-36 -417,-46 -467,-84 -497,-116 -533,-120 -570,-156 -583,-184 -620,-208 -623,-240 -620,-260 -577,-268 -577,-244 -550,-252 -503,-184 -447,-160 -413,-136 -387,-112 -387,-56 -367,-28 -343,4 -330,28 -310,68 -303,88 -283,104 -270,92 -260,104 -273,60 -250,68 -267,44 -247,42 -232,54 -233,32 -257,16 -280,6 -270,-8 -257,-4 -277,-36 -280,-56 -270,-64 -257,-48 -237,-56 -240,-70 -220,-76 -187,-76 -167,-72 -147,-64 -160,-42 -160,-36 -163,-20 -140,-12 -140,12 -130,24 -153,28 -127,44 -123,72 -120,80 -97,88 -93,94 -63,96 -17,108 -10,84 17,92 50,116 87,112 120,88 153,96 173,96 160,140 163,164 150,204 140,228 133,248 123,276 113,300 93,312 43,308 27,300 0,296 -20,302 -37,312 -83,320 -127,308 -193,296 -233,280 -263,256 -310,244 -363,264 -367,300 -393,348 -427,332 -500,308 -523,268 -593,244 -647,232 -697,204 -663,152 -680,128 -667,84 -690,86 -703,68 -747,84 -773,84 -823,76 -863,92 -933,88 -993,100 -1053,132 -1107,156 -1163,152 -1210,124ZM-67,-88 -100,-104 -117,-140 -103,-168 -80,-192 -43,-248 -10,-300 27,-304 53,-280 50,-256 83,-220 117,-224 147,-240 183,-252 233,-220 290,-184 353,-104 333,-84 290,-80 243,-78 177,-92 137,-120 77,-120 10,-88ZM-160,-42 -143,-54 -117,-78 -67,-82 -63,-90 -57,-84 -53,-70 -100,-54 -143,-50 -157,-38ZM52,362 57,396 87,456 110,520 153,604 207,775 253,839 283,939 317,963 360,1023 410,1059 415,1051 390,939 340,819 270,700 230,592 183,516 140,440 128,424 133,380 130,380 115,440 108,450 83,420ZM583,360 563,384 587,440 620,480 640,508 660,536 673,516 687,548 677,588 717,592 780,588 810,548 837,516 845,504 847,560 883,560 893,532 867,480 843,472 793,496 750,488 700,456 680,444 660,404 637,356 607,348ZM523,-228 553,-264 607,-296 683,-320 733,-312 737,-252 677,-220 677,-164 727,-112 733,-40 763,4 763,68 683,88 633,64 600,20 613,-48 587,-112 550,-156Z' fill='#bcd9ef'/><path d='M43,160 67,144 120,132 97,160 67,176 47,172Z' fill='#efe4c8' stroke='#b9a77c'/><path d='M297,24 308,44 373,67 404,106 409,142 423,176 429,192 446,227 494,260 538,286 548,320' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M260,-16 243,40 233,87 267,122 305,147 330,178 379,195 393,214 426,226 447,258 477,308 509,318 548,320 560,340 583,360' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M503,321 477,300 447,256 407,220 350,184 307,148 280,108 268,85' fill='none' stroke='#c0392b' stroke-width='4' stroke-linejoin='round' marker-end='url(#a)'/><path d='M268,85 207,112 177,220 143,272 137,296' fill='none' stroke='#c0392b' stroke-width='4' stroke-linejoin='round' marker-end='url(#a)'/><circle cx='503' cy='321' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='268' cy='85' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='177' cy='220' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='137' cy='299' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><g font-size='18' font-weight='700' stroke='#fff' stroke-width='4' paint-order='stroke' text-anchor='middle'><text x='147' y='344' fill='#6d28d9'>CANAAN</text><text x='512' y='327' fill='#1f2937' text-anchor='start'>Ur</text><text x='268' y='74' fill='#1f2937' text-anchor='middle'>Haran</text><text x='186' y='226' fill='#1f2937' text-anchor='start'>Damascus</text><text x='146' y='305' fill='#1f2937' text-anchor='start'>Hebron</text></g><g font-size='18' font-weight='700'><path d='M14 426h72' stroke='#1f2937' stroke-width='4'/><text x='14' y='418' fill='#1f2937' stroke='#fff' stroke-width='4' paint-order='stroke'>200 km</text></g><rect y='440' width='600' height='34' fill='#fff'/><text x='300' y='464' font-size='18' font-weight='700' fill='#4b5563' text-anchor='middle'>Most scholars identify Abram's Ur with Ur in Sumer</text></svg>"}},{"say":"No inscription outside the Bible names Abraham, which is not surprising for a herdsman. Some details fit his era, while others, such as 'Ur of the Chaldees', suggest the text was written down later.","show":HX.tb(...[[["Question","What the evidence allows"],["Did Ur and Haran exist?","Yes: both are excavated and well documented"],["Did herding families travel this route?","Yes: such movements are recorded"],["Is Abraham named in ancient inscriptions?","No such inscription is known"],["When was Genesis written down?","Debated; many scholars think centuries after the events"]]])},{"say":"Archaeology can test claims about places, customs and dates, but not a faith claim such as 'God spoke to Abram'. Honest thinking keeps the two kinds of claim distinct.","show":HX.tb(...[[["Claim","Kind","How it can be examined"],["Ur was a great city about 2000 BC","Historical","Excavation, tablets"],["Abram travelled from Ur to Haran","Historical, not yet confirmed outside Genesis","Further evidence, if found"],["God called Abram","Religious (faith)","Not by archaeology"]]])},{"say":"The story's central ideas, worship of <b>one God</b> and a <b>covenant</b> between God and a people, now shape the beliefs of more than half of humanity.","show":HX.tb(...[[["Belief system","Gods","Example"],["Polytheism","Many gods","Ur: Nanna the moon god, and many others"],["Monotheism","One God","Judaism, Christianity, Islam"]]])},{"say":"<b>Explain it.</b> Retell Abraham's journey on the map, then explain the difference between a historical claim and a faith claim, using one example of each from this lesson.","show":{"type":"list","items":["Say it in 2–4 complete sentences.","Use the precise words from this lesson.","Support each claim with evidence: how do we know?"],"caption":"Explain it — to a grown-up or in writing"}}],"practice":[{"q":"According to Genesis 11:31, where did Terah's family set out from?","options":["Haran","Canaan","Ur of the Chaldees","Egypt"],"answer":"Ur of the Chaldees","hint":"Read the passage again.","why":"Genesis 11:31 says they went from Ur of the Chaldees to go into the land of Canaan."},{"q":"Where did the family stop and settle before going on to Canaan?","options":["Babylon","Haran","Memphis","Nineveh"],"answer":"Haran","hint":"It is in the north, by a tributary of the Euphrates.","why":"They came to Haran and lived there (Genesis 11:31). Haran lies in modern south-east Turkey."},{"q":"Which three religions honour Abraham as a father of faith?","options":["Hinduism, Buddhism, Jainism","Judaism, Christianity and Islam","Greek, Roman and Egyptian religion","Confucianism, Daoism and Buddhism"],"answer":"Judaism, Christianity and Islam","hint":"They are sometimes called the Abrahamic religions.","why":"Judaism, Christianity and Islam all look back to Abraham."},{"q":"What does 'monotheism' mean?","options":["Belief in many gods","Belief in one God","Belief in no gods","Belief in a king as god"],"answer":"Belief in one God","hint":"Mono = one; theos = god.","why":"Monotheism is belief in one God. Polytheism is belief in many gods."},{"q":"In Genesis 12:1–3, what does God promise Abram?","options":["Gold and a palace","A great nation, and blessing for all families of the earth","Rule over Egypt","That he would never die"],"answer":"A great nation, and blessing for all families of the earth","hint":"Read the passage.","why":"The promise is of a great nation, a great name, and blessing for all the families of the earth through him."},{"q":"What is a covenant?","options":["A kind of tent","A solemn, binding agreement","A city wall","A clay tablet"],"answer":"A solemn, binding agreement","hint":"Think of a promise with obligations on both sides.","why":"A covenant is a binding agreement. In Genesis, God makes a covenant with Abraham and his descendants."},{"q":"Using the map's estimates, about how many kilometres is the whole journey: about 1,000 km from Ur to Haran and about 700 km from Haran to Canaan?","type":"number","answer":1700,"hint":"Add the two legs.","why":"1,000 + 700 = 1700 km."},{"q":"If a family with flocks covered 10 km a day, about how many days would 1,700 km take, not counting rest days?","type":"number","answer":170,"hint":"Divide.","why":"1,700 ÷ 10 = 170 days: about half a year of walking."},{"q":"Has any inscription outside the Bible been found naming Abraham?","options":["Yes, many","No such inscription is known","Yes, on the Great Pyramid","Yes, in Hammurabi's code"],"answer":"No such inscription is known","hint":"What does the lesson say about outside evidence?","why":"No known ancient inscription names him. That is not surprising for a herdsman, but it means the account rests on Genesis itself."},{"q":"Which statement correctly describes what archaeology can do here?","options":["Test claims about places, customs and dates, such as whether Ur and Haran existed","Prove or disprove that God spoke to Abram","Show that Genesis is entirely legend","Tell us nothing at all"],"answer":"Test claims about places, customs and dates, such as whether Ur and Haran existed","hint":"What kinds of claims can digging test?","why":"Archaeology studies physical remains, so it can test historical claims about places and customs. It cannot settle a faith claim about God speaking."},{"q":"'Ur of the Chaldees' uses the name of the Chaldeans, a people known from records of the first millennium BC. What does this suggest?","options":["Abraham lived in the first millennium BC","The account was probably written down, or updated, long after the time it describes","The Chaldeans built Ur","Ur never existed"],"answer":"The account was probably written down, or updated, long after the time it describes","hint":"When would a writer use the name a place had in his own day?","why":"Writers often use the names familiar in their own time. This clue suggests the text took its final form centuries after the events it describes. It does not decide whether the events happened."},{"q":"Which claim is a faith claim rather than a historical claim?","options":["Ur had a great ziggurat","Haran lies on a tributary of the Euphrates","God called Abram to leave Haran","Herders moved between Mesopotamia and Canaan"],"answer":"God called Abram to leave Haran","hint":"Which one could no excavation test?","why":"Whether God called Abram is a religious claim. The others concern places and customs that evidence can test."},{"q":"The moon god Nanna was the patron of Ur. Why is this interesting in Abraham's story?","options":["He came from a city of many gods, yet the story is about one God","Abraham was Nanna's priest","Nanna was the God of Genesis","It is not interesting"],"answer":"He came from a city of many gods, yet the story is about one God","hint":"Compare polytheism and monotheism.","why":"Ur and Haran were centres of moon-god worship. The Genesis story describes a decisive turn to one God: a striking contrast with its setting."},{"q":"Dates proposed for Abraham, from Genesis's family chronology and from archaeology, range roughly from 2100 to 1800 BC. Why do historians write 'roughly' or 'about'?","options":["Because historians are lazy","No dated inscription fixes them; they rest on ages in the text and indirect clues","The Bible has no numbers","Abraham lived in AD times"],"answer":"No dated inscription fixes them; they rest on ages in the text and indirect clues","hint":"How was the date worked out?","why":"The date comes from adding up lifespans and generations, with no independent dated record. Honest precision means 'about'."},{"q":"Why would a family travelling from Ur to Canaan follow the Euphrates north instead of crossing straight west?","options":["The direct route crosses desert; the river gives water and pasture","The straight route was longer","Rivers flow toward Canaan","Camels could not cross sand"],"answer":"The direct route crosses desert; the river gives water and pasture","hint":"Look at the map: what lies between Ur and Canaan?","why":"The direct line crosses desert. Herders with flocks needed water and grazing, so the curving river route through the 'Fertile Crescent' made sense even though it is longer."},{gen:HX.G.mapdot(12)},{gen:HX.G.mapdot(12)},{gen:HX.G.country(12)},{gen:HX.G.span(12)},{gen:HX.G.first(12)},{gen:HX.G.order(12)},{gen:HX.G.century(12)},{gen:HX.G.ago(12)},{gen:HX.G.feature(12)}],"challenge":[{"q":"A student argues: 'No inscription names Abraham, so he did not exist.' Another argues: 'Ur really existed, so every detail of Abraham's story is proven.' What is the best judgement?","options":["The first is right","The second is right","Both overreach what the evidence shows","Both are right"],"answer":"Both overreach what the evidence shows","hint":"Check each conclusion against what its evidence can show.","why":"Silence in the records is weak evidence about an ordinary individual, and a historically accurate setting is consistent with history or with a story set in a real place. Neither conclusion follows."},{"q":"Genesis 12:4 says Abram was seventy-five years old when he left Haran. What kind of statement is this within the narrative?","options":["A specific detail that the text asserts, which outside evidence currently cannot check","A proven fact from inscriptions","An opinion","A preference"],"answer":"A specific detail that the text asserts, which outside evidence currently cannot check","hint":"Can any other source confirm it?","why":"It is the text's own claim. Historians record it as what Genesis says; no independent evidence exists to test it either way."},{"q":"One common estimate places Abraham about 1900 BC. About how many years before AD 2026 is that?","type":"number","answer":3925,"hint":"Add, then subtract 1 for the missing year 0.","why":"1900 + 2026 − 1 = 3925 years."},{"q":"Why might nomadic herders leave little trace for archaeologists compared with city dwellers?","options":["Tents and moving camps leave few remains","They did not exist","They burned everything","Archaeologists ignore nomads"],"answer":"Tents and moving camps leave few remains","hint":"What remains after a tent camp moves on?","why":"Tents, wooden poles and leather decay; camps move. Cities leave walls, rubbish heaps and archives. So the lack of remains says little about nomads' existence."},{gen:HX.G.gap2(12)}],"extend":"Read Genesis chapters 12 to 15 (World English Bible) and make a two-column table: details that can be compared with archaeology (places, customs, travel), and statements of faith or promise. Write a short paragraph on what each column contributes.","offline":"Plan a 'journey of Abraham' walk: measure 1 km near home and walk it, timing yourself. Using your time, estimate how long walking 1,700 km would take with no rest days, then with one rest day each week."},
    {"title":"Hammurabi and the rule of law","icon":"⚖️","learn":[{"say":"<b>Hammurabi</b> ruled Babylon about 1792–1750 BC (middle chronology) and conquered most of Mesopotamia. About 1754 BC he set up a black stone pillar (a <b>stele</b>), 2.25 m tall, carved with 282 laws. At the top he stands before Shamash, the sun god of justice.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 508' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><rect width='600' height='508' fill='#efe4c8'/><path d='M-2180,84 -2120,48 -2005,48 -1945,-6 -1915,-114 -1890,-167 -1855,-209 -1790,-233 -1740,-263 -1745,-329 -1690,-353 -1630,-341 -1535,-371 -1455,-413 -1390,-383 -1375,-323 -1345,-293 -1285,-254 -1250,-224 -1190,-197 -1155,-167 -1120,-152 -1100,-90 -1117,-30 -1095,-30 -1070,-54 -1042,-90 -1070,-132 -1040,-176 -1000,-143 -975,-158 -1050,-215 -1095,-263 -1150,-269 -1205,-323 -1225,-365 -1280,-401 -1285,-448 -1280,-478 -1215,-490 -1215,-454 -1175,-466 -1105,-365 -1020,-329 -970,-293 -930,-257 -930,-173 -900,-132 -865,-84 -845,-48 -815,12 -805,42 -775,66 -755,48 -740,66 -760,0 -725,12 -750,-24 -720,-27 -698,-9 -700,-42 -735,-66 -770,-81 -755,-102 -735,-96 -765,-143 -770,-173 -755,-185 -735,-161 -705,-173 -710,-194 -680,-203 -630,-203 -600,-197 -570,-185 -590,-152 -590,-143 -595,-120 -560,-108 -560,-72 -545,-54 -580,-48 -540,-24 -535,18 -530,30 -495,42 -490,51 -445,54 -375,72 -365,36 -325,48 -275,84 -220,78 -170,42 -120,54 -90,54 -110,120 -105,155 -125,215 -140,251 -150,281 -165,323 -180,359 -210,377 -285,371 -310,359 -350,353 -380,362 -405,377 -475,389 -540,371 -640,353 -700,329 -745,293 -815,275 -895,305 -900,359 -940,430 -990,407 -1100,371 -1135,311 -1240,275 -1320,257 -1395,215 -1345,138 -1370,102 -1350,36 -1385,39 -1405,12 -1470,36 -1510,36 -1585,24 -1645,48 -1750,42 -1840,60 -1930,108 -2010,143 -2095,138 -2165,96ZM525,448 495,484 530,568 580,628 610,670 640,711 660,682 680,729 665,789 725,795 820,789 865,729 905,682 918,664 920,747 975,747 990,706 950,628 915,616 840,652 775,640 700,592 670,574 640,514 605,442 560,430ZM435,-430 480,-484 560,-532 675,-568 750,-556 755,-466 665,-419 665,-335 740,-257 750,-149 795,-84 795,12 675,42 600,6 550,-60 570,-161 530,-257 475,-323Z' fill='#bcd9ef'/><path d='M95,-54 111,-25 209,10 257,69 263,122 284,173 293,197 319,250 391,299 457,338 472,389' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M40,-114 15,-30 0,40 50,93 107,130 145,176 218,201 240,231 289,248 321,297 365,371 413,386 472,389 490,419 525,448' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><circle cx='321' cy='297' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='145' cy='176' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='513' cy='317' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='405' cy='391' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><g font-size='18' font-weight='700' stroke='#fff' stroke-width='4' paint-order='stroke' text-anchor='middle'><text x='340' y='215' fill='#6d28d9'>BABYLONIA</text><text x='312' y='303' fill='#1f2937' text-anchor='end'>Babylon</text><text x='145' y='165' fill='#1f2937' text-anchor='middle'>Mari</text><text x='522' y='323' fill='#1f2937' text-anchor='start'>Susa</text><text x='396' y='397' fill='#1f2937' text-anchor='end'>Ur</text></g><g font-size='18' font-weight='700'><path d='M14 494h54' stroke='#1f2937' stroke-width='4'/><text x='14' y='486' fill='#1f2937' stroke='#fff' stroke-width='4' paint-order='stroke'>100 km</text></g></svg>"}},{"say":"The prologue states the law's purpose. Read it carefully: whom is the law meant to protect?","show":{"type":"passage","title":"Code of Hammurabi, Prologue (trans. L. W. King, 1910)","text":"Anu and Bel called by name me, Hammurabi, the exalted prince, who feared God, to bring about the rule of righteousness in the land, to destroy the wicked and the evil-doers; so that the strong should not harm the weak […]"}},{"say":"Laws 1 and 3 punish accusers who cannot prove their charge. Law 2 uses an <b>ordeal</b> instead: sinking in the river means guilt, a test with no connection to the truth.","show":{"type":"passage","title":"Code of Hammurabi, laws 1–3 (trans. L. W. King, 1910)","text":"1. If any one ensnare another, putting a ban upon him, but he can not prove it, then he that ensnared him shall be put to death.\n\n2. If any one bring an accusation against a man, and the accused go to the river and leap into the river, if he sink in the river his accuser shall take possession of his house. But if the river prove that the accused is not guilty, and he escape unhurt, then he who had brought the accusation shall be put to death, while he who leaped into the river shall take possession of the house that had belonged to his accuser.\n\n3. If any one bring an accusation of any crime before the elders, and does not prove what he has charged, he shall, if it be a capital offense charged, be put to death."}},{"say":"The famous 'eye for an eye' laws show the principle of <b>retaliation</b> (punishment matching the injury), but only between equals. Babylonian society had three ranks, and the punishment depended on the victim's rank.","show":{"type":"passage","title":"Code of Hammurabi, laws 196–199 (trans. L. W. King)","text":"196. If a man put out the eye of another man, his eye shall be put out.\n\n197. If he break another man's bone, his bone shall be broken.\n\n198. If he put out the eye of a freed man, or break the bone of a freed man, he shall pay one gold mina.\n\n199. If he put out the eye of a man's slave, or break the bone of a man's slave, he shall pay one-half of its value."}},{"say":"Other laws hold officials and workers to account: a careless judge pays twelve times the fine, and a builder whose house kills its owner is put to death.","show":HX.tb(...[[["Law","Rule","Idea behind it"],["5","A judge who alters his written verdict pays 12 times the fine","Officials answer to the law"],["229","A builder whose house falls and kills the owner is put to death","Responsibility for one's work"],["196–199","Penalties depend on the victim's rank","Law, but not equality"]]])},{"say":"Public, written laws were an early step toward the <b>rule of law</b>, yet the code was harsh and unequal. The stele, carried off to Susa as plunder, was found there in 1901.","show":HX.tb(...[[["Rule of law idea","Hammurabi's code?"],["Laws are written and public","Yes"],["Accusers must prove their claims","Mostly yes"],["Everyone equal before the law","No: penalties depend on rank"],["Evidence decides guilt","Not always: river ordeal"]]])},{"say":"<b>Explain it.</b> What did Hammurabi's code achieve, and where did it fall short of fair justice? Use law 2 and laws 196–199 as evidence.","show":{"type":"list","items":["Say it in 2–4 complete sentences.","Use the precise words from this lesson.","Support each claim with evidence: how do we know?"],"caption":"Explain it — to a grown-up or in writing"}}],"practice":[{"q":"Which city did Hammurabi rule?","options":["Ur","Nineveh","Babylon","Memphis"],"answer":"Babylon","hint":"It stood on the Euphrates.","why":"Hammurabi was king of Babylon, about 1792–1750 BC."},{"q":"What is a stele?","options":["A scroll of papyrus","An upright stone slab carved with an inscription","A clay token","A temple tower"],"answer":"An upright stone slab carved with an inscription","hint":"Hammurabi's laws were carved on one.","why":"A stele is a carved standing stone. Hammurabi's is about 2.25 m tall."},{"q":"Hammurabi's stele lists how many laws (as numbered by modern scholars)?","type":"number","answer":282,"hint":"It is a number between 250 and 300.","why":"Scholars number the laws 1 to 282, though some in the middle were erased in antiquity."},{"q":"According to the prologue, one purpose of the law was…","options":["to make Babylon rich","so that the strong should not harm the weak","to honour the Egyptian gods","to train soldiers"],"answer":"so that the strong should not harm the weak","hint":"Read the passage.","why":"The prologue says the laws were given so that the strong should not harm the weak […]"},{"q":"Law 3 says an accuser who cannot prove a capital charge is put to death. What principle does this support?","options":["The person making an accusation must prove it","Accusations are always true","Judges decide by vote","Kings are above the law"],"answer":"The person making an accusation must prove it","hint":"Who carries the burden of proof?","why":"The accuser must prove the charge. False accusers faced the penalty they sought to bring on another: a strong deterrent against lying."},{"q":"In law 2's river ordeal, the accused leaps into the river and sinking means guilt. What is wrong with this as a way of finding the truth?","options":["Nothing: rivers know the truth","Sinking depends on swimming and currents, not guilt","It is too slow","It is unfair to the river"],"answer":"Sinking depends on swimming and currents, not guilt","hint":"Is the 'evidence' connected to the question being asked?","why":"The result of the test has no logical connection to guilt. It looks like a decision but gives no evidence about the charge."},{"q":"Law 196 says: if a man puts out another man's eye, his eye shall be put out. This principle is called…","options":["mercy","retaliation: punishment matching the injury","a fine","ordeal"],"answer":"retaliation: punishment matching the injury","hint":"An eye for an eye.","why":"Matching punishment to injury is the principle of retaliation (lex talionis in Latin)."},{"q":"Compare laws 196 and 199. What do they show?","options":["All people were treated equally","Penalties depended on the victim's rank","Slaves had more rights than free men","Eyes were cheap in Babylon"],"answer":"Penalties depended on the victim's rank","hint":"Who is the victim in each law?","why":"The same injury brought very different penalties depending on rank. The code gave law, but not equality."},{"q":"Law 229 says a builder whose house falls and kills the owner shall be put to death. What idea does it express?","options":["Builders are responsible for the safety of their work","Houses should not be built","Owners must build their own houses","The king owns all houses"],"answer":"Builders are responsible for the safety of their work","hint":"Who is held responsible?","why":"The law makes builders answerable for faulty work, an early form of building regulation."},{"q":"Law 5: a judge who changes his written verdict through his own fault pays twelve times the fine. If the fine was 5 shekels, how many shekels does he pay?","type":"number","answer":60,"hint":"Multiply.","why":"12 × 5 = 60 shekels, which equals one mina."},{"q":"In Babylonian weights, 60 shekels make 1 mina. How many shekels are in 3 minas?","type":"number","answer":180,"hint":"Multiply by 60.","why":"3 × 60 = 180 shekels. Babylonian weights used base 60, like their counting."},{"q":"Where was the stele found, and when?","options":["In Babylon, in 1754 BC","At Susa in Iran, in 1901","In Egypt, in 1799","In Ur, in 1922"],"answer":"At Susa in Iran, in 1901","hint":"It had been carried off as plunder.","why":"An Elamite king took it to Susa about 1158 BC; a French expedition found it there in 1901."},{"q":"Why was writing laws on a public stele a step toward the rule of law?","options":["Rules were fixed and known in advance, so judges applied them instead of deciding by whim","Because stone is heavy","Because only priests could read it","Because it made the king a god"],"answer":"Rules were fixed and known in advance, so judges applied them instead of deciding by whim","hint":"What changes when a law is public?","why":"Public, written laws let people know the rules beforehand and let others check that judges followed them."},{"q":"Which statement about Hammurabi's code is an opinion rather than a fact?","options":["It was carved on a black stone stele","It has about 282 laws","It was the greatest achievement of the ancient world","It was found at Susa"],"answer":"It was the greatest achievement of the ancient world","hint":"Which one is a judgement?","why":"'The greatest achievement' is a judgement. The others can be checked against the stele and excavation records."},{"q":"Hammurabi's code was not the first written law code. Which was older?","options":["The Twelve Tables of Rome","The code of Ur-Nammu","The Ten Commandments","Solon's laws"],"answer":"The code of Ur-Nammu","hint":"Recall lesson 11.","why":"Ur-Nammu's code, about 2100 BC, is about 350 years older than Hammurabi's."},{gen:HX.G.mapdot(13)},{gen:HX.G.country(13)},{gen:HX.G.feature(13)},{gen:HX.G.base60(13)},{gen:HX.G.span(13)},{gen:HX.G.first(13)},{gen:HX.G.order(13)},{gen:HX.G.century(13)},{gen:HX.G.gap2(13)}],"challenge":[{"q":"Consider law 2's logic. The river decides guilt; if the accused survives, the accuser dies. Which statement is the best analysis?","options":["It may deter false accusers, but the test is no evidence of guilt","It is perfectly fair","It is irrational in every way","It stopped all accusations"],"answer":"It may deter false accusers, but the test is no evidence of guilt","hint":"Separate the deterrent effect from the test's value as evidence.","why":"A rule can have a useful side effect (deterring false accusers) while still being worthless as evidence. Good reasoning judges each part separately."},{"q":"Babylonian law allowed interest of up to one third on loans of grain for a year. A farmer borrows 300 sila of barley. At that rate, how many sila must he repay in total?","type":"number","answer":400,"hint":"Find one third of 300, then add it to the loan.","why":"One third of 300 is 100 sila of interest. 300 + 100 = 400 sila in total."},{"q":"A student says: 'Hammurabi said his laws protected the weak, so Babylon was fair to the weak.' Evaluate the argument.","options":["Sound: the king said so","Unsound: a stated aim is not evidence of results","Sound: the laws were written down","It is a preference"],"answer":"Unsound: a stated aim is not evidence of results","hint":"Is a claim of good intentions proof of good results?","why":"The premise is true (he did say it), but the conclusion needs evidence about practice. The laws themselves show penalties favouring the higher ranks."},{"q":"The stele was set up about 1754 BC and carried to Susa about 1158 BC. For about how many years did it stand in Babylonia before it was taken?","type":"number","answer":596,"hint":"Both BC: subtract.","why":"1754 − 1158 = 596 years."},{"q":"Why are law codes good evidence about everyday life, but imperfect evidence about how people actually behaved?","options":["They show common problems, not how often laws were obeyed","They are always exaggerated","They were never used","They describe only kings"],"answer":"They show common problems, not how often laws were obeyed","hint":"A speed limit tells you cars exist; does it tell you how fast people drive?","why":"Laws reveal concerns (debts, building, theft) and values. Court records and letters are needed to see how laws worked in practice."},{gen:HX.G.gap2(13)}],"extend":"Read laws 1–25 and 195–214 of the Code of Hammurabi in L. W. King's translation (Avalon Project, Yale). Choose three laws and, for each, write the problem it solves, whether it is fair by your standards, and why.","offline":"Hold a family 'law court'. Write five rules for your home on a card (your stele). Then test them: does each rule treat everyone equally? Does it say what evidence is needed? Rewrite any rule that fails."},
    {"title":"The cities of the Indus","icon":"🧱","learn":[{"say":"From about 2600 to 1900 BC a great civilisation flourished along the <b>Indus River</b>, in modern Pakistan and north-west India. It was rediscovered only in the 1920s.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 402' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><rect width='600' height='402' fill='#efe4c8'/><path d='M-313,518 -313,537 -291,562 -244,547 -165,533 -169,562 -206,645 -225,676 -276,740 -337,803 -375,846 -388,926 -367,1000 -356,1205 -281,1628 750,1628 750,676 718,613 707,433 643,444 638,372 606,345 596,311 572,315 553,317 529,323 506,328 484,364 437,408 418,431 379,448 381,505 371,564 341,596 328,611 306,573 277,509 259,454 240,380 236,334 202,345 169,309 191,298 159,285 141,275 131,258 124,245 30,249 -41,241 -68,254 -64,266 -47,279 -26,283 -4,307 -26,351 -41,380 -62,402 -94,423 -146,450 -206,476 -281,512 -309,514Z' fill='#bcd9ef'/><path d='M292,36 234,63 230,66 216,95 206,137 178,180 166,197 153,204 157,245 141,275' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M268,114 241,135 217,142 206,137' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M340,149 381,223 410,245 431,247 471,241 525,262 553,283 572,307' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><circle cx='241' cy='135' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='153' cy='204' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='230' cy='306' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='191' cy='277' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='302' cy='163' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><g font-size='18' font-weight='700' stroke='#fff' stroke-width='4' paint-order='stroke' text-anchor='middle'><text x='193' y='163' fill='#1d5c8a' font-style='italic'>Indus</text><text x='103' y='338' fill='#1d5c8a' font-style='italic'>Arabian Sea</text><text x='450' y='220' fill='#1d5c8a' font-style='italic'>Ganges</text><text x='375' y='74' fill='#6b5a35'>Himalaya</text><text x='250' y='141' fill='#1f2937' text-anchor='start'>Harappa</text><text x='144' y='210' fill='#1f2937' text-anchor='end'>Mohenjo-daro</text><text x='239' y='312' fill='#1f2937' text-anchor='start'>Lothal</text><text x='182' y='283' fill='#1f2937' text-anchor='end'>Dholavira</text><text x='311' y='169' fill='#1f2937' text-anchor='start'>Rakhigarhi</text></g><g font-size='18' font-weight='700'><path d='M14 388h57' stroke='#1f2937' stroke-width='4'/><text x='14' y='380' fill='#1f2937' stroke='#fff' stroke-width='4' paint-order='stroke'>300 km</text></g></svg>"}},{"say":"Indus cities were carefully <b>planned</b>, with grid streets, bathrooms and covered drains. Their bricks kept the same proportions, <b>1 : 2 : 4</b>, across hundreds of kilometres.","show":HX.tb(...[[["Feature","Mohenjo-daro"],["Population","Perhaps around 40,000"],["Streets","Grid plan, main streets up to about 10 m wide"],["Water","Hundreds of brick-lined wells"],["Great Bath","About 12 m × 7 m, 2.4 m deep, watertight"],["Bricks","Standard ratio 1 : 2 : 4"]]])},{"say":"Traders used <b>standard weights</b> of polished stone. The small weights double each time, 1, 2, 4, 8, 16, 32, 64, and then larger ones follow a decimal pattern. With doubling weights any whole amount up to 127 units can be balanced using each weight at most once.","show":HX.tb(...[[["Weight","Units"],["A","1"],["B","2"],["C","4"],["D","8"],["E","16"],["F","32"],["G","64"]],"Example: 45 = 32 + 8 + 4 + 1"])},{"say":"Indus merchants traded cotton, beads of carnelian and other goods as far as Mesopotamia, whose texts mention a land called <b>Meluhha</b>, probably the Indus region. Square stamp seals carved with animals and short inscriptions have been found in both places.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 319' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><defs><marker id='a' viewBox='0 0 10 10' refX='7' refY='5' markerWidth='5' markerHeight='5' orient='auto'><path d='M0 0L10 5L0 10Z' fill='context-stroke'/></marker></defs><rect width='600' height='319' fill='#efe4c8'/><path d='M-118,107 -115,122 -101,149 -90,177 -69,214 -44,291 -22,319 -8,363 8,374 28,400 52,416 54,413 43,363 19,310 -14,257 -33,209 -55,175 -76,142 -81,135 -79,115 -81,115 -88,142 -91,146 -103,133ZM134,106 125,117 136,142 152,159 161,172 171,184 177,175 183,190 178,207 197,209 227,207 242,190 254,175 258,170 259,195 276,195 281,183 268,159 257,156 234,167 213,163 189,149 180,144 171,126 159,105 145,101ZM106,-154 120,-170 145,-184 182,-195 205,-191 207,-165 178,-151 178,-126 202,-103 205,-71 219,-51 219,-23 182,-14 158,-25 142,-44 148,-74 136,-103 118,-122ZM52,416 52,432 71,454 111,441 177,429 174,454 142,523 126,549 84,603 32,656 0,691 -11,758 6,820 16,992 79,1347 947,1347 947,549 921,496 911,346 857,354 853,294 826,271 818,243 797,246 782,248 761,253 742,257 723,287 684,324 668,344 635,358 636,406 628,455 603,482 592,494 573,463 549,409 534,363 518,301 515,262 486,271 458,241 477,232 450,222 434,213 426,198 420,188 341,191 281,184 259,195 262,206 276,216 294,220 313,239 294,276 281,301 264,319 237,337 193,360 142,381 79,411 55,413Z' fill='#bcd9ef'/><path d='M562,12 513,35 509,37 497,62 489,97 466,133 456,147 444,154 448,188 434,213' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M-2,-43 4,-34 35,-24 49,-6 51,10 58,25 61,32 69,47 92,62 113,74 117,89' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M-19,-60 -27,-35 -32,-15 -16,1 2,12 14,26 37,33 44,42 60,47 70,61 84,83 99,88 117,89 123,97 134,106' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M434,213 347,202 276,209 257,172 189,163 136,112' fill='none' stroke='#c0392b' stroke-width='4' stroke-dasharray='10 6' stroke-linejoin='round' marker-end='url(#a)'/><circle cx='444' cy='154' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='96' cy='89' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><g font-size='18' font-weight='700' stroke='#fff' stroke-width='4' paint-order='stroke' text-anchor='middle'><text x='316' y='234' fill='#b42318'>sea trade route</text><text x='453' y='160' fill='#1f2937' text-anchor='start'>Mohenjo-daro</text><text x='87' y='95' fill='#1f2937' text-anchor='end'>Ur</text></g></svg>"}},{"say":"The <b>Indus script</b> is still unread: inscriptions are short and no bilingual text exists. So we know neither their rulers' names nor their language.","show":{"type":"big","text":"Average inscription: about 5 signs\nBilingual key: none found","caption":"Why the Indus script is still unread"}},{"say":"An old theory of a massacre at Mohenjo-daro failed when the skeletons proved to come from different periods. Most historians now blame <b>environmental change</b> for the cities' decline.","show":HX.tb(...[[["Explanation for the decline","Evidence","Status"],["Invaders massacred the people","Skeletons from different periods, no battle wounds","Rejected"],["Rivers shifted, monsoon weakened","Dried river beds, climate records","Widely supported"]]])},{"say":"<b>Explain it.</b> What does the Indus civilisation's planning tell us about how it was organised, and why do we still know so little about its rulers and language?","show":{"type":"list","items":["Say it in 2–4 complete sentences.","Use the precise words from this lesson.","Support each claim with evidence: how do we know?"],"caption":"Explain it — to a grown-up or in writing"}}],"practice":[{"q":"The Indus civilisation lay mainly in which modern countries?","options":["Egypt and Sudan","Pakistan and north-west India","Iraq and Iran","China and Mongolia"],"answer":"Pakistan and north-west India","hint":"Look at the map.","why":"Most Indus cities lie in Pakistan and north-west India."},{"q":"When did the Indus cities flourish?","options":["About 9500 BC","About 2600–1900 BC","About 500 BC","AD 1–500"],"answer":"About 2600–1900 BC","hint":"They were contemporaries of the Old Kingdom pyramid builders.","why":"The mature Indus civilisation lasted from about 2600 to about 1900 BC."},{"q":"Which feature shows that Indus cities were planned?","options":["Grid-pattern streets with covered drains","Very tall pyramids","Huge royal palaces","Walls made of gold"],"answer":"Grid-pattern streets with covered drains","hint":"Look at how the streets were laid out.","why":"Straight streets in a grid, standard bricks and covered drains show careful planning."},{"q":"Indus bricks had proportions 1 : 2 : 4. If a brick is 7 cm thick, how long is it, in cm?","type":"number","answer":28,"hint":"Length is 4 times the thickness.","why":"4 × 7 = 28 cm. (Its width would be 14 cm.)"},{"q":"Using doubling weights 1, 2, 4, 8, 16, 32 and 64, what is the heaviest amount you can weigh using each weight once?","type":"number","answer":127,"hint":"Add them all.","why":"1 + 2 + 4 + 8 + 16 + 32 + 64 = 127 units."},{"q":"Which doubling weights make 45 units, using each at most once?","options":["32 + 8 + 4 + 1","32 + 16 − 3","16 + 16 + 8 + 5","64 − 19"],"answer":"32 + 8 + 4 + 1","hint":"Start with the largest weight that fits.","why":"45 − 32 = 13; 13 − 8 = 5; 5 − 4 = 1; 1 − 1 = 0. So 32 + 8 + 4 + 1. This is the same idea as binary numbers in computers."},{"q":"Which single doubling weight must be added to 32 + 16 + 4 to make 54?","type":"number","answer":2,"hint":"Add what you have, then find the difference.","why":"32 + 16 + 4 = 52. 54 − 52 = 2."},{"q":"Why can no one yet read the Indus script?","options":["It was written in invisible ink","Inscriptions are very short and no bilingual text has been found","It uses the Greek alphabet","All the seals were destroyed"],"answer":"Inscriptions are very short and no bilingual text has been found","hint":"What made the Rosetta Stone so useful?","why":"Without a bilingual text and with only short inscriptions, scholars cannot test proposed readings properly."},{"q":"Mesopotamian texts mention trade with a land called Meluhha. Why do historians think it was the Indus region?","options":["Indus seals and goods are found in Mesopotamia","Meluhha means Indus in Greek","Hammurabi conquered it","The names sound alike"],"answer":"Indus seals and goods are found in Mesopotamia","hint":"What physical evidence matches the texts?","why":"The written references and the objects found agree: corroboration between texts and archaeology."},{"q":"What was the Great Bath at Mohenjo-daro?","options":["A royal tomb","A large watertight brick pool, perhaps for ritual washing","A harbour","A granary"],"answer":"A large watertight brick pool, perhaps for ritual washing","hint":"It was sealed with bitumen.","why":"A brick pool about 12 m by 7 m, waterproofed with bitumen. Its purpose is not certain; many suggest ritual bathing."},{"q":"Archaeologists have found no clear palaces or royal tombs in Indus cities. Which conclusion is most careful?","options":["The Indus had no government","We do not know how they were governed","Egypt ruled them","Kings hid their palaces"],"answer":"We do not know how they were governed","hint":"Uniform bricks and drains needed organisation. Does that tell us who ruled?","why":"Planning shows coordination, but without readable texts or royal monuments we cannot say whether kings, priests, councils or merchants led. Saying 'we do not know' is the honest answer."},{"q":"The old theory said invaders massacred the people of Mohenjo-daro. Why was it rejected?","options":["A professor changed his mind for no reason","The skeletons were from different times, with no battle wounds","The invaders were friendly","The skeletons were moved"],"answer":"The skeletons were from different times, with no battle wounds","hint":"What did new evidence show?","why":"Checking the evidence showed it did not support a single massacre. The theory was dropped because it failed the test of evidence."},{"q":"Which explanation for the Indus decline do most historians now favour?","options":["A volcanic eruption","Environmental change, such as rivers shifting course and weaker monsoons","A plague brought by Romans","The invention of iron"],"answer":"Environmental change, such as rivers shifting course and weaker monsoons","hint":"Think about rivers and rain.","why":"Evidence of dried riverbeds and climate change supports a gradual environmental decline."},{"q":"Which religion's oldest scriptures, the Vedas, come from the period after the Indus cities?","options":["Islam","Hinduism","Christianity","Zoroastrianism"],"answer":"Hinduism","hint":"They were composed in Sanskrit.","why":"The Vedas, composed in Sanskrit and passed down orally for centuries, are the oldest scriptures of Hinduism."},{"q":"Many Indus houses had private bathrooms connected to street drains. What does this suggest?","options":["Ordinary citizens valued cleanliness, and the city organised a shared drainage system","Only kings had water","The people never washed","The drains were for war"],"answer":"Ordinary citizens valued cleanliness, and the city organised a shared drainage system","hint":"Who had the bathrooms: rulers only, or many households?","why":"Bathrooms in many ordinary houses, linked to public drains, show both private concern for hygiene and public organisation."},{gen:HX.G.mapdot(14)},{gen:HX.G.mapdot(14)},{gen:HX.G.country(14)},{gen:HX.G.feature(14)},{gen:HX.G.span(14)},{gen:HX.G.first(14)},{gen:HX.G.order(14)},{gen:HX.G.century(14)},{gen:HX.G.ago(14)}],"challenge":[{"q":"How many different total weights (from 1 to the maximum) can be made with the seven doubling weights 1, 2, 4, 8, 16, 32 and 64, using each at most once?","type":"number","answer":127,"hint":"Each weight is either used or not: how many choices for seven weights? Then remove the case with no weights.","why":"Each weight is in or out: 2 × 2 × 2 × 2 × 2 × 2 × 2 = 128 combinations. Excluding 'none' leaves 127, and they give every total from 1 to 127 exactly once."},{"q":"An Indus brick is 6 cm thick in the ratio 1 : 2 : 4. What is its volume in cubic centimetres?","type":"number","answer":1728,"hint":"Find width and length first.","why":"Thickness 6, width 12, length 24. Volume 6 × 12 × 24 = 1728 cm³ (which is 12³)."},{"q":"Someone claims to have deciphered the Indus script, and their readings fit all the seals they chose. What would most convincingly test the claim?","options":["Reading new inscriptions consistently, checked by others","Asking how confident they are","Counting their books","Seeing if readings sound beautiful"],"answer":"Reading new inscriptions consistently, checked by others","hint":"Recall how Champollion's readings were confirmed.","why":"A real decipherment predicts readings of fresh texts and survives independent checking. Fitting chosen examples is easy; prediction is hard to fake."},{"q":"Standard bricks and weights appear across hundreds of kilometres. Which inference is reasonable, and which goes too far?","options":["Shared organisation is reasonable; 'one emperor' goes too far","One emperor is reasonable; shared tradition goes too far","Both are equally proven","Neither is reasonable"],"answer":"Shared organisation is reasonable; 'one emperor' goes too far","hint":"What does uniformity require, at minimum?","why":"Uniformity shows coordination or a strong common culture. Many kinds of system could produce it, so naming one ruler goes beyond the evidence."},{"q":"The mature Indus civilisation lasted from about 2600 BC to about 1900 BC. Rome's Western Empire lasted from 27 BC to AD 476. How many more years did the Indus civilisation last? (Use the rounded dates.)","type":"number","answer":198,"hint":"Find each span; the Roman one crosses into AD.","why":"Indus: 2600 − 1900 = 700 years. Rome: 27 + 476 − 1 = 502 years. 700 − 502 = 198 years."},{gen:HX.G.gap2(14)}],"extend":"Read about the Mohenjo-daro 'massacre' theory and its rejection (for example in Jane McIntosh's 'The Ancient Indus Valley'). Write a paragraph explaining how the theory was tested and why it failed.","offline":"Make a set of doubling 'weights' from paper cards labelled 1, 2, 4, 8, 16, 32. Ask someone to name any number from 1 to 63 and make it using each card at most once. Then explain why it always works."},
    {"title":"Ancient China: the Shang and the Zhou","icon":"🐉","learn":[{"say":"Chinese civilisation grew along the <b>Yellow River</b> (Huang He), named for the yellow loess silt it carries. The silt made rich farmland, but floods were so destructive that the river was called 'China's sorrow'. Further south, the Yangtze valley grew rice.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 540' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><rect width='600' height='540' fill='#efe4c8'/><path d='M568,73 526,84 504,99 516,75 524,59 506,49 480,66 466,84 434,96 444,117 464,138 494,122 532,131 512,145 486,164 468,185 486,211 500,249 518,281 518,305 508,340 476,394 442,434 412,464 364,486 350,488 300,504 286,532 274,504 240,504 214,523 196,563 214,598 250,645 266,715 260,891 980,891 980,-70 694,9 676,52 650,110 668,162 666,183 632,195 610,197 604,124 584,117Z' fill='#bcd9ef'/><path d='M500,415 520,422 508,469 496,495 482,469 492,432ZM252,558 280,537 300,549 286,577 264,579Z' fill='#efe4c8' stroke='#b9a77c'/><path d='M0,188 156,163 206,106 280,56 304,63 290,176 286,197 329,197 352,190 366,192 420,149 460,123' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M40,235 80,375 172,333 211,315 306,289 366,291 410,305 456,258 510,274' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><circle cx='367' cy='162' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='329' cy='197' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='259' cy='203' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='164' cy='282' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><g font-size='18' font-weight='700' stroke='#fff' stroke-width='4' paint-order='stroke' text-anchor='middle'><text x='300' y='99' fill='#1d5c8a' font-style='italic'>Yellow River</text><text x='330' y='317' fill='#1d5c8a' font-style='italic'>Yangtze</text><text x='550' y='183' fill='#1d5c8a' font-style='italic'>Yellow Sea</text><text x='376' y='168' fill='#1f2937' text-anchor='start'>Anyang</text><text x='329' y='221' fill='#1f2937' text-anchor='middle'>Luoyang</text><text x='250' y='209' fill='#1f2937' text-anchor='end'>Xi'an</text><text x='164' y='306' fill='#1f2937' text-anchor='middle'>Sanxingdui</text></g><g font-size='18' font-weight='700'><path d='M14 526h63' stroke='#1f2937' stroke-width='4'/><text x='14' y='518' fill='#1f2937' stroke='#fff' stroke-width='4' paint-order='stroke'>300 km</text></g></svg>"}},{"say":"Later histories name a first dynasty, the <b>Xia</b>, but no writing from it has been found. The first dynasty proven by its own writing is the <b>Shang</b> (about 1600–1046 BC).","show":HX.tb(...[[["Dynasty","Dates (about)","Evidence"],["Xia","2070–1600 BC (traditional)","Later histories; no writing found; debated"],["Shang","1600–1046 BC","Oracle bones, bronzes, tombs at Anyang"],["Zhou","1046–256 BC","Bronze inscriptions, texts"]]])},{"say":"Shang kings asked their ancestors questions by heating carved bones and shells and reading the cracks. These <b>oracle bones</b> are the oldest Chinese writing.","show":HX.li(...[["1. Prepare a bone or shell; drill small hollows","2. Carve the question, often as a pair: 'It will rain' / 'It may not rain'","3. Apply heat: cracks appear","4. The king reads the cracks as the answer","5. Sometimes the outcome is carved later: a record of what happened"],"How an oracle bone was used"])},{"say":"Shang writing is the ancestor of Chinese characters still used today. The intact tomb of Lady <b>Fu Hao</b>, queen and general, shows Shang mastery of bronze.","show":HX.tb(...[[["Character today","Meaning","Origin on oracle bones"],["人","person","A person seen from the side"],["日","sun","A circle with a dot"],["木","tree","A tree with branches and roots"],["山","mountain","Three peaks"]]])},{"say":"About 1046 BC the <b>Zhou</b> overthrew the Shang, claiming the <b>Mandate of Heaven</b>. Notice the bias: the last Shang king's wickedness is described by his conquerors.","show":HX.li(...[["A just ruler receives Heaven's mandate","He becomes corrupt; floods, famine and revolts follow","Rebels claim the mandate has passed to them","If they win, their victory is taken as proof"],"The cycle of the Mandate of Heaven"])},{"say":"Zhou nobles grew stronger than their kings, and China split into warring states. Meanwhile silk became China's most famous product; the tale of its discovery by Empress Leizu is legend.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><path d='M30 170H570' stroke='#1f2937' stroke-width='4'/><circle cx='73' cy='170' r='8' fill='#1d5c8a'/><path d='M73 170V146' stroke='#1d5c8a' stroke-width='2'/><text x='59' y='118' font-size='18' fill='#1f2937' text-anchor='start' font-weight='700'>Shang begins</text><text x='59' y='140' font-size='18' fill='#1f2937' text-anchor='start' font-weight='700'>(about 1600 BC)</text><circle cx='253' cy='170' r='8' fill='#1d5c8a'/><path d='M253 170V222' stroke='#1d5c8a' stroke-width='2'/><text x='253' y='242' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Zhou conquest</text><text x='253' y='264' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>(about 1046 BC)</text><circle cx='342' cy='170' r='8' fill='#1d5c8a'/><path d='M342 170V146' stroke='#1d5c8a' stroke-width='2'/><text x='342' y='118' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Zhou move east</text><text x='342' y='140' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>771 BC</text><circle cx='438' cy='170' r='8' fill='#1d5c8a'/><path d='M438 170V222' stroke='#1d5c8a' stroke-width='2'/><text x='438' y='242' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Warring States</text><text x='438' y='264' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>475 BC</text><circle cx='521' cy='170' r='8' fill='#1d5c8a'/><path d='M521 170V146' stroke='#1d5c8a' stroke-width='2'/><text x='535' y='118' font-size='18' fill='#1f2937' text-anchor='end' font-weight='700'>Qin unites China</text><text x='535' y='140' font-size='18' fill='#1f2937' text-anchor='end' font-weight='700'>221 BC</text></svg>"}},{"say":"<b>Explain it.</b> Explain how oracle bones work as historical evidence, and why the Mandate of Heaven was a convenient idea for the Zhou. Mention bias.","show":{"type":"list","items":["Say it in 2–4 complete sentences.","Use the precise words from this lesson.","Support each claim with evidence: how do we know?"],"caption":"Explain it — to a grown-up or in writing"}}],"practice":[{"q":"Along which river did Chinese civilisation first grow?","options":["The Nile","The Yellow River (Huang He)","The Indus","The Ganges"],"answer":"The Yellow River (Huang He)","hint":"It is named for the colour of its silt.","why":"The Yellow River valley, with its fertile loess soil, was the cradle of early Chinese civilisation."},{"q":"Why was the Yellow River called 'China's sorrow'?","options":["It was too cold","Its floods were often catastrophic, sometimes changing its course and drowning huge areas","It had no fish","It was always dry"],"answer":"Its floods were often catastrophic, sometimes changing its course and drowning huge areas","hint":"Silt raises the riverbed above the plain.","why":"Silt built up the riverbed, so floods could burst the banks and spread over vast plains, killing many people."},{"q":"What is the earliest Chinese dynasty proven by its own writing?","options":["Xia","Shang","Qin","Han"],"answer":"Shang","hint":"Oracle bones come from this dynasty.","why":"The Shang, with their oracle bone inscriptions, are the first dynasty confirmed by their own written records."},{"q":"Historians debate whether the Xia dynasty existed. Why?","options":["Because it was too large","It appears in later histories, but no writing from the Xia has been found to confirm it","Because the Zhou destroyed it","Because it was in India"],"answer":"It appears in later histories, but no writing from the Xia has been found to confirm it","hint":"What kind of evidence confirmed the Shang?","why":"The Shang were confirmed by their own oracle bones. For the Xia, there are only much later accounts, so its existence remains debated."},{"q":"What were oracle bones?","options":["Bones used as money","Bones and shells carved with questions to ancestors and cracked with heat for answers","Musical instruments","Weapons"],"answer":"Bones and shells carved with questions to ancestors and cracked with heat for answers","hint":"The king wanted to know the future.","why":"Diviners carved questions on bones or turtle shells, heated them and read the cracks as answers from the ancestors."},{"q":"About 150,000 oracle bone fragments have been found. If a museum displayed 500 of them, what fraction is on display? Give the answer as '1 in how many'.","type":"number","answer":300,"hint":"150,000 ÷ 500.","why":"150,000 ÷ 500 = 300, so 1 in 300."},{"q":"Why are oracle bones valuable to historians beyond telling us about religion?","options":["Their questions show what mattered to the king","They predict the future","They are made of gold","They contain maps"],"answer":"Their questions show what mattered to the king","hint":"What did the kings ask about?","why":"The questions record kings' names, wars, harvests and daily concerns: an unintended archive of Shang life."},{"q":"Who was Fu Hao?","options":["A Zhou emperor","A Shang queen and army commander whose intact tomb was found in 1976","The inventor of silk","A philosopher"],"answer":"A Shang queen and army commander whose intact tomb was found in 1976","hint":"Oracle bones mention her leading armies.","why":"Fu Hao was a wife of King Wu Ding and a military leader. Her tomb held hundreds of bronzes and jades; oracle bones confirm her campaigns."},{"q":"What was the Mandate of Heaven?","options":["A Shang law code","Heaven's right to rule, given to the just and taken from the wicked","A calendar","A trade agreement"],"answer":"Heaven's right to rule, given to the just and taken from the wicked","hint":"The Zhou used it to explain their victory.","why":"The idea let a successful rebel claim Heaven's approval, and warned rulers that misrule could cost them the throne."},{"q":"Why should historians be cautious about stories of the last Shang king's terrible wickedness?","options":["They come mainly from the Zhou, who overthrew him and needed to justify it","He left no records","The Shang never had kings","The stories are too short"],"answer":"They come mainly from the Zhou, who overthrew him and needed to justify it","hint":"Who benefits from the story?","why":"The conquerors had a strong reason to paint him as wicked. Such accounts may contain truth but must be read as biased."},{"q":"Is the Mandate of Heaven a claim that can be tested by evidence?","options":["Yes: rain proves it","Not really: it can explain any outcome after the event","Yes: it was written down","No: it was invented in AD 1900"],"answer":"Not really: it can explain any outcome after the event","hint":"Could any possible outcome ever show the idea false?","why":"An idea that explains every outcome after the event cannot be tested. That makes it politically useful but weak as an explanation."},{"q":"The Chinese character 木 began as a picture of…","options":["a person","a tree","a mountain","the sun"],"answer":"a tree","hint":"Look for branches and roots.","why":"木 (mu) means tree; it began as a drawing of a tree with branches above and roots below."},{"q":"What happened to China during the Warring States period (475–221 BC)?","options":["It was ruled peacefully by one king","Rival states fought for supremacy until Qin conquered the rest in 221 BC","It was conquered by Rome","It had no wars"],"answer":"Rival states fought for supremacy until Qin conquered the rest in 221 BC","hint":"The name tells you.","why":"Seven major states fought for over 250 years; Qin finally unified China in 221 BC."},{"q":"Which statement about silk is history, not legend?","options":["Dated finds show silk in China by about 2700 BC","Empress Leizu found silk in her tea","A dragon invented silk","Silk was first made in Rome"],"answer":"Dated finds show silk in China by about 2700 BC","hint":"Which statement rests on dated finds?","why":"Dated silk remains support the first. The Leizu story is a legend, told long after."},{"q":"Sanxingdui in Sichuan has huge bronze masks from about 1200–1000 BC but no writing. What does it show?","options":["Early China had cultures the written records barely mention","The Shang ruled all of China","The Zhou made the masks","Sanxingdui was in Egypt"],"answer":"Early China had cultures the written records barely mention","hint":"Why might this culture be missing from the histories?","why":"Histories written from the Yellow River centre overlooked other regions. Archaeology reveals cultures the texts ignore."},{gen:HX.G.mapdot(15)},{gen:HX.G.country(15)},{gen:HX.G.feature(15)},{gen:HX.G.span(15)},{gen:HX.G.first(15)},{gen:HX.G.order(15)},{gen:HX.G.century(15)},{gen:HX.G.ago(15)},{gen:HX.G.gap2(15)}],"challenge":[{"q":"Oracle bones sometimes record a forecast and, later, what actually happened. Most records that survive show the king's forecasts coming true. What should a careful historian suspect?","options":["Selection bias: successes were more likely to be kept","The king could see the future","The bones were forged","Nothing"],"answer":"Selection bias: successes were more likely to be kept","hint":"Which records would a royal diviner be eager to carve?","why":"If successes were recorded and failures quietly dropped, the surviving record overstates accuracy. Asking what is missing from a sample is a key historical skill."},{"q":"The Zhou dynasty lasted from about 1046 BC to 256 BC. About how many years is that?","type":"number","answer":790,"hint":"Both BC: subtract.","why":"1046 − 256 = 790 years, the longest dynasty in Chinese history (though its kings lost real power after 771 BC)."},{"q":"Compare Egypt's pharaoh and China's Mandate of Heaven. Which is the most accurate contrast?","options":["Both rulers could never lose power","Pharaoh was divine; the Mandate could be withdrawn","Neither had religious kingship","Both were elected"],"answer":"Pharaoh was divine; the Mandate could be withdrawn","hint":"Could a Chinese king lose Heaven's favour?","why":"Egyptian kingship was divine by nature. The Mandate was conditional: it gave a moral reason both to obey good rulers and to overthrow bad ones."},{"q":"A Shang diviner prepared 4 hollows on each of 35 turtle shells. How many hollows did he drill?","type":"number","answer":140,"hint":"Multiply.","why":"35 × 4 = 140 hollows."},{gen:HX.G.gap2(15)}],"extend":"Read a translated selection of oracle bone inscriptions (for example in David Keightley's 'Sources of Shang History' or Patricia Ebrey's 'Chinese Civilization: A Sourcebook'). Sort ten questions by topic and write what they reveal about a Shang king's worries.","offline":"Learn to write ten Chinese characters that began as pictures (人, 日, 月, 山, 水, 木, 火, 口, 目, 雨). Draw the old picture beside each, then teach three of them to someone else."},
    {"title":"Confucius and the first emperor","icon":"📜","learn":[{"say":"<b>Confucius</b> (traditionally 551–479 BC) taught in the state of Lu. His followers recorded his sayings, the <b>Analects</b>, after his death.","show":{"type":"passage","title":"Analects 2.17 (trans. James Legge, 1861)","text":"The Master said, 'Yu, shall I teach you what knowledge is? When you know a thing, to hold that you know it; and when you do not know a thing, to allow that you do not know it;—this is knowledge.'"}},{"say":"Confucius taught that a good society rests on good character: <b>ren</b> (humaneness), <b>li</b> (proper conduct and ritual), respect for parents (<b>filial piety</b>) and rulers who lead by example rather than by force. His rule for life is a version of the Golden Rule.","show":{"type":"passage","title":"Analects 15.23 and 2.15 (trans. James Legge)","text":"Tsze-kung asked, saying, 'Is there one word which may serve as a rule of practice for all one's life?' The Master said, 'Is not RECIPROCITY such a word? What you do not want done to yourself, do not do to others.'\n\nThe Master said, 'Learning without thought is labour lost; thought without learning is perilous.'"}},{"say":"<b>Legalism</b> taught that people obey only strict laws and harsh punishments. Following it, <b>Qin</b> conquered every rival, and in 221 BC its king became <b>Qin Shi Huang</b>, the First Emperor.","show":HX.tb(...[[["","Confucianism","Legalism"],["Human nature","Can be improved by education","Selfish; must be controlled"],["How to rule","By virtue and example","By strict law and punishment"],["Model","The wise gentleman (junzi)","The all-powerful state"]]])},{"say":"The First Emperor <b>standardised</b> script, weights, coins and axle widths, and linked older walls in the north. Most of the stone Great Wall seen today is much later Ming work.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 540' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><defs><marker id='a' viewBox='0 0 10 10' refX='7' refY='5' markerWidth='5' markerHeight='5' orient='auto'><path d='M0 0L10 5L0 10Z' fill='context-stroke'/></marker></defs><rect width='600' height='540' fill='#efe4c8'/><path d='M568,73 526,84 504,99 516,75 524,59 506,49 480,66 466,84 434,96 444,117 464,138 494,122 532,131 512,145 486,164 468,185 486,211 500,249 518,281 518,305 508,340 476,394 442,434 412,464 364,486 350,488 300,504 286,532 274,504 240,504 214,523 196,563 214,598 250,645 266,715 260,891 980,891 980,-70 694,9 676,52 650,110 668,162 666,183 632,195 610,197 604,124 584,117Z' fill='#bcd9ef'/><path d='M500,415 520,422 508,469 496,495 482,469 492,432ZM252,558 280,537 300,549 286,577 264,579Z' fill='#efe4c8' stroke='#b9a77c'/><path d='M0,188 156,163 206,106 280,56 304,63 290,176 286,197 329,197 352,190 366,192 420,149 460,123' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M40,235 80,375 172,333 211,315 306,289 366,291 410,305 456,258 510,274' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M158,178 210,129 270,59 320,42 400,35 460,23 520,23 566,47' fill='none' stroke='#b42318' stroke-width='4' stroke-dasharray='9 6' stroke-linejoin='round'/><path d='M258,204 156,164 60,82 0,63' fill='none' stroke='#6d28d9' stroke-width='4' stroke-linejoin='round' marker-end='url(#a)'/><circle cx='254' cy='203' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='420' cy='174' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><g font-size='18' font-weight='700' stroke='#fff' stroke-width='4' paint-order='stroke' text-anchor='middle'><text x='420' y='66' fill='#b42318'>Qin walls (approx.)</text><text x='100' y='28' fill='#6d28d9'>to the Silk Road</text><text x='254' y='227' fill='#1f2937' text-anchor='middle'>Xianyang</text><text x='429' y='180' fill='#1f2937' text-anchor='start'>Qufu</text></g></svg>"}},{"say":"Our main source, <b>Sima Qian</b>, wrote a century later for the Han, who had reason to paint Qin as cruel. Yet his claim of mercury in the tomb was supported by soil tests.","show":HX.tb(...[[["Sima Qian says","Independent check","Result"],["The tomb contains rivers of mercury","Soil tests over the mound","High mercury: supports him"],["The emperor burned books","Few other sources","Probably true, scale debated"],["Hundreds of scholars were buried alive","No independent evidence yet","Debated"]]])},{"say":"In 1974 farmers digging a well found the <b>Terracotta Army</b>. Qin fell by 206 BC; the <b>Han</b> kept the unified state, made Confucianism official and opened the <b>Silk Road</b>.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 340' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><path d='M30 170H570' stroke='#1f2937' stroke-width='4'/><circle cx='97' cy='170' r='8' fill='#1d5c8a'/><path d='M97 170V146' stroke='#1d5c8a' stroke-width='2'/><text x='83' y='118' font-size='18' fill='#1f2937' text-anchor='start' font-weight='700'>Confucius born</text><text x='83' y='140' font-size='18' fill='#1f2937' text-anchor='start' font-weight='700'>(about 551 BC)</text><circle cx='184' cy='170' r='8' fill='#1d5c8a'/><path d='M184 170V222' stroke='#1d5c8a' stroke-width='2'/><text x='184' y='242' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Warring States</text><text x='184' y='264' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>begin 475 BC</text><circle cx='478' cy='170' r='8' fill='#1d5c8a'/><path d='M478 170V146' stroke='#1d5c8a' stroke-width='2'/><text x='478' y='118' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Qin unites China</text><text x='478' y='140' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>221 BC</text><circle cx='495' cy='170' r='8' fill='#1d5c8a'/><path d='M495 170V268' stroke='#1d5c8a' stroke-width='2'/><text x='509' y='288' font-size='18' fill='#1f2937' text-anchor='end' font-weight='700'>Han dynasty</text><text x='509' y='310' font-size='18' fill='#1f2937' text-anchor='end' font-weight='700'>begins 206 BC</text></svg>"}},{"say":"<b>Explain it.</b> Compare Confucianism and Legalism. Which did the First Emperor follow, and what are the strengths and limits of Sima Qian as a source about him?","show":{"type":"list","items":["Say it in 2–4 complete sentences.","Use the precise words from this lesson.","Support each claim with evidence: how do we know?"],"caption":"Explain it — to a grown-up or in writing"}}],"practice":[{"q":"According to Analects 2.17, what is knowledge?","options":["Knowing as many facts as possible","Holding that you know what you know, and admitting what you do not know","Agreeing with your teacher","Being confident in every answer"],"answer":"Holding that you know what you know, and admitting what you do not know","hint":"Read the passage again.","why":"Confucius defines knowledge as honesty about the limits of what you know: claim what you know, and admit what you do not."},{"q":"Who wrote down the Analects?","options":["Confucius himself","His followers, after his death","The First Emperor","Sima Qian"],"answer":"His followers, after his death","hint":"Is it a first-hand or second-hand record?","why":"His disciples and their students compiled the sayings after his death. It is close to him, but not his own writing."},{"q":"Confucius's 'reciprocity' rule says…","options":["Repay every insult","What you do not want done to yourself, do not do to others","Obey every law without question","Trade fairly at market"],"answer":"What you do not want done to yourself, do not do to others","hint":"Analects 15.23.","why":"It is a form of the Golden Rule: do not do to others what you would not want done to you."},{"q":"'Learning without thought is labour lost; thought without learning is perilous.' What does this mean?","options":["You must both study facts and think them through; either alone is not enough","Thinking is dangerous","Learning is a waste of time","Only teachers should think"],"answer":"You must both study facts and think them through; either alone is not enough","hint":"What happens if you only memorise? If you only think, with no facts?","why":"Facts without reflection are useless; reflection without facts is dangerous. Good reasoning needs true information and careful thought together."},{"q":"What is filial piety?","options":["Loyalty to an army","Respect and care for one's parents and ancestors","Belief in many gods","Fear of the emperor"],"answer":"Respect and care for one's parents and ancestors","hint":"Filial comes from Latin filius, son.","why":"Filial piety, honouring and caring for parents and ancestors, is central to Confucian ethics."},{"q":"Which school of thought did the Qin follow?","options":["Confucianism","Legalism","Buddhism","Daoism"],"answer":"Legalism","hint":"It relied on strict laws and harsh punishments.","why":"Qin followed Legalism, which held that people obey only clear laws backed by rewards and severe punishment."},{"q":"In which year did Qin unify China?","options":["551 BC","221 BC","206 BC","AD 1974"],"answer":"221 BC","hint":"It ended the Warring States period.","why":"Qin completed its conquests in 221 BC, and its king became Qin Shi Huang, the First Emperor."},{"q":"Why did the First Emperor standardise axle widths?","options":["To make carts faster","So all carts fit the same ruts on roads across the empire","To raise taxes on wheels","For decoration"],"answer":"So all carts fit the same ruts on roads across the empire","hint":"Old roads had deep ruts.","why":"Same axle widths meant any cart could travel any road's ruts: a small rule that knit the empire together."},{"q":"Which of these did the First Emperor NOT standardise?","options":["Writing","Weights and measures","Coins","The religion of every household"],"answer":"The religion of every household","hint":"Look at the list in the lesson.","why":"He standardised script, weights, measures, coins and axle widths. He did not impose a single household religion."},{"q":"Most of the stone Great Wall seen by tourists today was built…","options":["by the Ming dynasty, AD 1368–1644","by Qin Shi Huang in 221 BC","by the Shang","by the Romans"],"answer":"by the Ming dynasty, AD 1368–1644","hint":"Qin walls were mostly rammed earth.","why":"Qin linked older earthen walls. The famous brick-and-stone sections are mainly Ming work, more than 1,500 years later."},{"q":"A popular claim says the Great Wall is visible from the Moon with the naked eye. How could you test it?","options":["Repeat it often","Ask astronauts and check: it is far too narrow to see","Believe it because it is famous","It cannot be tested"],"answer":"Ask astronauts and check: it is far too narrow to see","hint":"What is the evidence, and does the conclusion follow?","why":"Astronauts report it cannot be seen from the Moon, and a structure a few metres wide is far below what an eye can resolve at that distance. A famous claim can be false."},{"q":"Why might Sima Qian's account of the First Emperor be biased?","options":["He was the emperor's son","He wrote for the Han, who replaced Qin","He never wrote about Qin","He lived in Rome"],"answer":"He wrote for the Han, who replaced Qin","hint":"Who replaced the Qin?","why":"Writing about a century later for the dynasty that overthrew Qin, he had reasons to stress its cruelty. His work is still invaluable, but must be read critically."},{"q":"Soil tests over the First Emperor's tomb found high levels of mercury. Why is this important?","options":["They support his report of mercury in the tomb","They prove every word he wrote","They show the tomb was looted","They prove the emperor was poisoned"],"answer":"They support his report of mercury in the tomb","hint":"What does independent physical evidence do to a written claim?","why":"An independent test agreeing with a written source corroborates that claim. It does not prove the rest of his history, but it shows he had real information."},{"q":"How was the Terracotta Army discovered?","options":["By farmers digging a well in 1974","By a satellite photograph","By Sima Qian","By a museum in 1799"],"answer":"By farmers digging a well in 1974","hint":"It was an accident.","why":"In 1974 farmers digging a well near Xi'an found pieces of clay figures, leading to the excavation of the pits."},{"q":"The First Emperor unified China in 221 BC and died in 210 BC. For how many years did he rule all of China?","type":"number","answer":11,"hint":"Both BC: subtract.","why":"221 − 210 = 11 years."},{gen:HX.G.mapdot(16)},{gen:HX.G.mapdot(16)},{gen:HX.G.country(16)},{gen:HX.G.feature(16)},{gen:HX.G.span(16)},{gen:HX.G.first(16)},{gen:HX.G.order(16)},{gen:HX.G.century(16)},{gen:HX.G.ago(16)}],"challenge":[{"q":"Analects 2.17 says knowledge includes admitting what you do not know. Which modern practice best follows this teaching?","options":["Writing 'about' and 'debated' where evidence is uncertain","Guessing confidently every time","Never stating any conclusion","Repeating the popular opinion"],"answer":"Writing 'about' and 'debated' where evidence is uncertain","hint":"Which answer is honest about the limits of evidence while still saying what is known?","why":"Marking uncertainty precisely, without either overclaiming or refusing to conclude, is exactly Confucius's standard."},{"q":"About 8,000 terracotta figures are estimated. If a team restores 4 figures a week and works 50 weeks a year, how many years would restoring all of them take?","type":"number","answer":40,"hint":"Figures per year first.","why":"4 × 50 = 200 figures a year. 8,000 ÷ 200 = 40 years."},{"q":"A Legalist argues: 'People obey laws only from fear. Qin used harsh laws and conquered everyone. So harsh laws are the best way to rule.' What is the strongest objection?","options":["Conquest is not good rule: Qin fell in 15 years; the Han lasted 400","Qin never conquered anyone","Laws are always useless","Confucius said so"],"answer":"Conquest is not good rule: Qin fell in 15 years; the Han lasted 400","hint":"Does winning a war prove a system is good for governing?","why":"The conclusion does not follow from conquest alone, and the evidence of Qin's quick collapse counts against it. Comparing outcomes is the test."},{"q":"The Han dynasty lasted from 206 BC to AD 220. How many years is that?","type":"number","answer":425,"hint":"Crossing BC to AD: add, then subtract 1.","why":"206 + 220 − 1 = 425 years."},{gen:HX.G.gap2(16)}],"extend":"Read Book 2 of the Analects in James Legge's translation (Project Gutenberg). Choose three sayings, explain each in your own words, and say whether you agree, giving a reason.","offline":"Hold a short debate at home: one side argues like Confucius (rule by good example), the other like a Legalist (rule by strict rules). Use examples from family life. Afterwards, write which arguments relied on true evidence and which only sounded convincing."},
