prox.)</text><text x='368' y='125' fill='#1f2937' text-anchor='start'>Nineveh</text><text x='384' y='250' fill='#1f2937' text-anchor='end'>Babylon</text><text x='143' y='258' fill='#1f2937' text-anchor='middle'>Jerusalem</text><text x='132' y='300' fill='#1f2937' text-anchor='middle'>Lachish</text></g><g font-size='18' font-weight='700'><path d='M14 411h88' stroke='#1f2937' stroke-width='4'/><text x='14' y='403' fill='#1f2937' stroke='#fff' stroke-width='4' paint-order='stroke'>300 km</text></g></svg>"}},{"say":"King <b>Ashurbanipal</b> gathered a great <b>library</b> at Nineveh; about 30,000 of its tablets and fragments are now in the British Museum. When Nineveh burned in 612 BC, the fire baked many clay tablets hard.","show":{"type":"big","text":"Fire destroys papyrus and parchment\nbut bakes clay tablets hard","caption":"Why so much Assyrian writing survives"}},{"say":"In 701 BC King <b>Sennacherib</b> invaded Judah. We have both sides. The Bible's account and Sennacherib's own six-sided clay prism agree on the main points, and differ on one figure.","show":HX.tb(...[[["Point","2 Kings 18–19","Sennacherib's Prism"],["Judah's fortified cities taken","Yes","Yes: 46 strong cities"],["Jerusalem captured?","No: Sennacherib returned to Nineveh","Not claimed: Hezekiah shut up 'like a caged bird'"],["Tribute of gold","30 talents","30 talents"],["Tribute of silver","300 talents","800 talents"]]])},{"say":"Read Sennacherib's words, then the Bible's. Notice that a proud king, who boasts of everything, does not claim to have taken Jerusalem.","show":{"type":"passage","title":"Sennacherib's Prism (trans. D. D. Luckenbill, The Annals of Sennacherib, 1924) and 2 Kings 18:13 (World English Bible)","text":"As for Hezekiah, the Jew, who did not submit to my yoke, 46 of his strong cities, as well as the small cities in their neighborhood, which were without number […] I besieged and took (those cities). […] Himself, like a caged bird I shut up in Jerusalem, his royal city. […]\n\nNow in the fourteenth year of king Hezekiah, Sennacherib king of Assyria came up against all the fortified cities of Judah, and took them."}},{"say":"Babylonians and Medes destroyed Nineveh in 612 BC. Under <b>Nebuchadnezzar II</b> Babylon destroyed Jerusalem about 587 BC and built the blue-glazed <b>Ishtar Gate</b>.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 340' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><path d='M30 170H570' stroke='#1f2937' stroke-width='4'/><circle cx='85' cy='170' r='8' fill='#1d5c8a'/><path d='M85 170V146' stroke='#1d5c8a' stroke-width='2'/><text x='71' y='118' font-size='18' fill='#1f2937' text-anchor='start' font-weight='700'>Assyrian</text><text x='71' y='140' font-size='18' fill='#1f2937' text-anchor='start' font-weight='700'>expansion</text><circle cx='303' cy='170' r='8' fill='#1d5c8a'/><path d='M303 170V222' stroke='#1d5c8a' stroke-width='2'/><text x='303' y='242' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Israel falls</text><text x='303' y='264' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>722 BC</text><circle cx='328' cy='170' r='8' fill='#1d5c8a'/><path d='M328 170V100' stroke='#1d5c8a' stroke-width='2'/><text x='328' y='72' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Siege of</text><text x='328' y='94' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Jerusalem 701</text><circle cx='431' cy='170' r='8' fill='#1d5c8a'/><path d='M431 170V222' stroke='#1d5c8a' stroke-width='2'/><text x='431' y='242' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Nineveh falls</text><text x='431' y='264' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>612 BC</text><circle cx='459' cy='170' r='8' fill='#1d5c8a'/><path d='M459 170V146' stroke='#1d5c8a' stroke-width='2'/><text x='459' y='118' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Jerusalem destroyed</text><text x='459' y='140' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>(about 587 BC)</text><circle cx='515' cy='170' r='8' fill='#1d5c8a'/><path d='M515 170V268' stroke='#1d5c8a' stroke-width='2'/><text x='529' y='288' font-size='18' fill='#1f2937' text-anchor='end' font-weight='700'>Cyrus takes</text><text x='529' y='310' font-size='18' fill='#1f2937' text-anchor='end' font-weight='700'>Babylon 539</text></svg>"}},{"say":"No Babylonian text mentions the <b>Hanging Gardens</b>, so their location is uncertain. Critics once doubted the Bible's Belshazzar until a cylinder found in 1854 named him.","show":HX.tb(...[[["Claim","Evidence","Verdict"],["Hanging Gardens at Babylon","Only later Greek writers","Unproven; possibly Nineveh"],["Belshazzar ruled in Babylon","Book of Daniel; Nabonidus Cylinder (found 1854)","Confirmed as crown prince and regent"],["Ishtar Gate","Excavated 1902–1914","Certain"]]])},{"say":"<b>Explain it.</b> Compare the two accounts of 701 BC. Where do they agree, where do they differ, and why does Sennacherib's silence about capturing Jerusalem matter?","show":{"type":"list","items":["Say it in 2–4 complete sentences.","Use the precise words from this lesson.","Support each claim with evidence: how do we know?"],"caption":"Explain it — to a grown-up or in writing"}}],"practice":[{"q":"Which empire, centred on the upper Tigris, dominated the Near East from about 911 to 609 BC?","options":["Babylonia","Persia","Assyria","Egypt"],"answer":"Assyria","hint":"Its capitals included Assur and Nineveh.","why":"The Neo-Assyrian Empire ruled from Nineveh and other cities on the Tigris."},{"q":"How did the Assyrians treat many conquered peoples?","options":["They left them alone","They deported whole populations to other parts of the empire","They made them all citizens","They paid them"],"answer":"They deported whole populations to other parts of the empire","hint":"What happened to the northern kingdom of Israel in 722 BC?","why":"Deportation broke up conquered peoples so they could not rebel. Israel's people were deported after 722 BC."},{"q":"Why did so many of Ashurbanipal's tablets survive the burning of Nineveh?","options":["They were made of gold","The fire baked the clay tablets hard","They were hidden in Egypt","Nineveh never burned"],"answer":"The fire baked the clay tablets hard","hint":"What does heat do to clay?","why":"The fire that destroyed the palace fired the clay, preserving the tablets: a rare case of destruction saving evidence."},{"q":"About how many tablets and fragments from Ashurbanipal's library are in the British Museum? (Type the round number from the lesson.)","type":"number","answer":30000,"hint":"It is tens of thousands.","why":"About 30000 tablets and fragments."},{"q":"In 701 BC, according to both 2 Kings and Sennacherib's Prism, what happened to Jerusalem?","options":["It was captured and destroyed","It was besieged or blockaded but not captured","It surrendered without a siege","It was never threatened"],"answer":"It was besieged or blockaded but not captured","hint":"Does the boastful prism claim to have taken it?","why":"Both sources agree Jerusalem was not taken. Sennacherib boasts that he shut Hezekiah up 'like a caged bird', but does not claim a capture."},{"q":"Why is it significant that Sennacherib, who boasted of everything, does not claim to have captured Jerusalem?","options":["A boastful king would have claimed it if true","He forgot to mention it","It proves the Bible wrong","It is not significant"],"answer":"A boastful king would have claimed it if true","hint":"Silence from someone who would want to speak is meaningful.","why":"Unlike Egypt's silence about the Exodus, this silence comes from a source that would have every reason to record a capture. Such silence is good evidence."},{"q":"2 Kings says Hezekiah paid 300 talents of silver; Sennacherib's prism says 800. How many talents do they differ by?","type":"number","answer":500,"hint":"Subtract.","why":"800 − 300 = 500 talents."},{"q":"Both accounts say 30 talents of gold. What does this agreement suggest?","options":["The two independent sources corroborate the gold figure, making it likely to be accurate","One copied the other","Gold was worthless","Both are wrong"],"answer":"The two independent sources corroborate the gold figure, making it likely to be accurate","hint":"These sources come from enemies.","why":"Enemies rarely copy each other. Agreement between independent, opposing sources is strong corroboration."},{"q":"Who destroyed Nineveh in 612 BC?","options":["The Egyptians","The Babylonians and the Medes","The Greeks","The Romans"],"answer":"The Babylonians and the Medes","hint":"Assyria's enemies joined together.","why":"An alliance of Babylonians and Medes sacked Nineveh in 612 BC; the Assyrian Empire ended by 609 BC."},{"q":"Which Babylonian king destroyed Jerusalem and its temple in about 587 BC?","options":["Hammurabi","Sargon","Nebuchadnezzar II","Ashurbanipal"],"answer":"Nebuchadnezzar II","hint":"He also built the Ishtar Gate.","why":"Nebuchadnezzar II captured Jerusalem in 597 BC and destroyed it in about 587 BC, exiling many of its people to Babylon."},{"q":"What is the Ishtar Gate?","options":["A blue-glazed brick gateway of Babylon decorated with bulls and dragons","A gate of Nineveh","A Phoenician harbour","A pyramid entrance"],"answer":"A blue-glazed brick gateway of Babylon decorated with bulls and dragons","hint":"It is now reconstructed in Berlin.","why":"Built under Nebuchadnezzar II, it was faced with blue glazed bricks showing bulls and dragons (lions lined the Processional Way leading to it); it was excavated in the early 1900s and rebuilt in Berlin's Pergamon Museum."},{"q":"Why do some historians doubt that the Hanging Gardens were in Babylon?","options":["Babylon had no plants","No Babylonian text mentions them, and Herodotus, who described Babylon, does not","Nebuchadnezzar hated gardens","The gardens are still standing elsewhere"],"answer":"No Babylonian text mentions them, and Herodotus, who described Babylon, does not","hint":"Which sources mention them, and when?","why":"Only Greek writers centuries later describe them. Babylon's own abundant records are silent. That makes the Babylonian location uncertain."},{"q":"Critics once said Belshazzar never existed because no Babylonian record named him. What happened?","options":["They were proved right","A cylinder of King Nabonidus, found in 1854, named Belshazzar as his son","Belshazzar was found to be Egyptian","Nothing has been found"],"answer":"A cylinder of King Nabonidus, found in 1854, named Belshazzar as his son","hint":"Recall: absence of evidence is not evidence of absence.","why":"The Nabonidus Cylinder named Belshazzar; other texts show he ruled in Babylon while his father was away. The critics had mistaken a gap in evidence for proof."},{"q":"In which year did Cyrus of Persia take Babylon?","options":["612 BC","587 BC","539 BC","331 BC"],"answer":"539 BC","hint":"It ended the Neo-Babylonian empire.","why":"Cyrus the Great took Babylon in 539 BC."},{"q":"The Lachish reliefs in Sennacherib's palace show the siege and capture of the Judean city of Lachish, with prisoners led away. What can they tell us, and what must we remember?","options":["Siege methods, but shown to glorify the king","They are neutral photographs","They show Jerusalem captured","They are Egyptian"],"answer":"Siege methods, but shown to glorify the king","hint":"Who commissioned them, and where were they displayed?","why":"The reliefs are valuable evidence of weapons, armour and siege tactics, but as royal art in the king's palace they present the victory as the king wanted it seen."},{gen:HX.G.mapdot(20)},{gen:HX.G.mapdot(20)},{gen:HX.G.country(20)},{gen:HX.G.feature(20)},{gen:HX.G.span(20)},{gen:HX.G.first(20)},{gen:HX.G.order(20)},{gen:HX.G.century(20)},{gen:HX.G.ago(20)}],"challenge":[{"q":"2 Kings and Sennacherib's Prism agree on the gold but disagree on the silver (300 against 800 talents). Which reasoning is best?","options":["Average them: 550 talents","Trust what they share; treat the silver figure as uncertain","Reject both sources","Accept the bigger number"],"answer":"Trust what they share; treat the silver figure as uncertain","hint":"What can explain a difference between two otherwise agreeing sources?","why":"We accept what they agree on and treat the disputed figure as uncertain, suggesting possible explanations without pretending to know which is right. Averaging is not a method."},{"q":"The Assyrian empire lasted from about 911 BC to 609 BC. Babylon's revived empire lasted from 626 BC to 539 BC. How many more years did Assyria's last?","type":"number","answer":215,"hint":"Find each span first.","why":"Assyria: 911 − 609 = 302 years. Babylon: 626 − 539 = 87 years. 302 − 87 = 215."},{"q":"Which statement correctly contrasts two silences discussed in this course?","options":["Egypt's silence is weak; Sennacherib's silence is strong","Both silences prove nothing happened","Both prove everything happened","Silence is never evidence"],"answer":"Egypt's silence is weak; Sennacherib's silence is strong","hint":"Ask in each case: would this source have recorded the event if it had happened?","why":"Silence counts as evidence only when the source would be expected to speak. That is the key question to ask about any argument from silence."},{"q":"A talent weighed about 30 kg. About how many kilograms of silver would 800 talents be?","type":"number","answer":24000,"hint":"Multiply.","why":"800 × 30 = 24000 kg: about 24 tonnes."},{gen:HX.G.gap2(20)}],"extend":"Read 2 Kings chapters 18 and 19 (World English Bible) and the British Museum's online description of Sennacherib's Prism and the Lachish reliefs. Write a historian's report on 701 BC: what is certain, what is probable, and what is disputed.","offline":"Interview two people separately about the same family event. List the points they agree on, the points where they differ, and suggest a reason for each difference. Which points would you call 'corroborated'?"},
    {"title":"Crete, Mycenae and Troy","icon":"🐂","learn":[{"say":"On Crete the <b>Minoans</b> built great palaces from about 1900 BC. <b>Knossos</b> had more than a thousand rooms and paintings of young people leaping over bulls.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 485' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><rect width='600' height='485' fill='#efe4c8'/><path d='M-1342,374 -1276,332 -1151,332 -1085,270 -1053,145 -1025,83 -987,35 -916,7 -862,-28 -867,-104 -807,-132 -742,-118 -638,-152 -551,-201 -480,-166 -464,-97 -431,-62 -365,-17 -327,17 -262,48 -224,83 -185,100 -164,173 -183,242 -158,242 -131,215 -101,173 -131,125 -98,73 -55,111 -27,93 -109,28 -158,-28 -218,-35 -278,-97 -300,-145 -360,-187 -365,-242 -360,-277 -289,-291 -289,-249 -245,-263 -169,-145 -76,-104 -22,-62 22,-21 22,76 55,125 93,180 115,222 147,291 158,325 191,353 213,332 229,353 207,277 245,291 218,249 251,246 274,266 273,228 235,201 196,183 213,159 235,166 202,111 196,76 213,62 235,90 267,76 262,52 295,42 349,42 382,48 415,62 393,100 393,111 387,138 425,152 425,194 442,215 404,222 447,249 453,298 458,311 496,325 502,336 551,339 627,360 638,318 682,332 736,374 796,367 851,325 905,339 938,339 916,415 922,457 900,526 884,568 873,602 856,651 840,692 807,713 725,706 698,692 655,685 622,696 595,713 518,727 447,706 338,685 273,658 224,616 147,595 60,630 55,692 11,775 -44,748 -164,706 -202,637 -316,595 -404,575 -485,526 -431,436 -458,395 -436,318 -475,322 -496,291 -567,318 -611,318 -693,305 -758,332 -873,325 -971,346 -1069,401 -1156,443 -1249,436 -1325,388ZM545,21 491,-7 464,-69 485,-118 524,-159 584,-256 638,-346 698,-353 742,-311 736,-270 791,-208 845,-215 895,-242 955,-263 1036,-208 1129,-145 1233,-7 1200,28 1129,35 1053,38 944,14 878,-35 780,-35 671,21ZM393,100 420,80 464,38 545,31 551,17 562,28 567,52 491,80 420,87 398,107ZM109,211 136,218 175,213 213,227 229,239 215,247 180,233 153,224 131,232 109,228Z' fill='#bcd9ef'/><path d='M245,408 289,408 398,429 387,450 311,457 245,429ZM207,180 240,177 284,228 305,239 278,235 235,208Z' fill='#efe4c8' stroke='#b9a77c'/><circle cx='336' cy='429' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='205' cy='261' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='146' cy='309' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='395' cy='107' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='349' cy='353' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><g font-size='18' font-weight='700' stroke='#fff' stroke-width='4' paint-order='stroke' text-anchor='middle'><text x='338' y='215' fill='#1d5c8a' font-style='italic'>Aegean Sea</text><text x='284' y='446' fill='#6d28d9'>CRETE</text><text x='164' y='457' fill='#1d5c8a' font-style='italic'>Mediterranean Sea</text><text x='336' y='418' fill='#1f2937' text-anchor='middle'>Knossos</text><text x='196' y='267' fill='#1f2937' text-anchor='end'>Mycenae</text><text x='137' y='315' fill='#1f2937' text-anchor='end'>Pylos</text><text x='404' y='113' fill='#1f2937' text-anchor='start'>Troy</text><text x='358' y='359' fill='#1f2937' text-anchor='start'>Thera</text></g><g font-size='18' font-weight='700'><path d='M14 471h62' stroke='#1f2937' stroke-width='4'/><text x='14' y='463' fill='#1f2937' stroke='#fff' stroke-width='4' paint-order='stroke'>100 km</text></g></svg>"}},{"say":"'Minoan' is a modern name chosen by <b>Arthur Evans</b>, after the legendary King Minos. The <b>Minotaur</b> legend may echo the maze-like palace, but that link is a guess.","show":HX.tb(...[[["Statement","Status"],["Knossos had over a thousand rooms","Excavated fact"],["Minoans painted bull-leaping","Fact: surviving frescoes"],["King Minos ruled Crete","Greek legend"],["The Minotaur legend was inspired by the palace","Possible, unproven"]]])},{"say":"Minoan <b>Linear A</b> is still unread, but in 1952 Michael Ventris showed that <b>Linear B</b> is early <b>Greek</b>. So Greek-speaking <b>Mycenaeans</b> had taken over Knossos.","show":HX.tb(...[[["Script","Language","Deciphered?"],["Linear A","Minoan (unknown)","No"],["Linear B","Early Greek","Yes: Ventris, 1952"]]])},{"say":"About 1600 BC the volcano of <b>Thera</b> erupted, burying the town of Akrotiri. Radiocarbon and pottery dating disagree about the exact date, so the question stays open.","show":{"type":"big","text":"Radiocarbon: about 1600 BC\nPottery styles: about 1500 BC","caption":"When methods disagree, keep the question open"}},{"say":"The <b>Mycenaeans</b> were warrior-kings who built stone citadels with gates like the <b>Lion Gate</b>. In 1871 <b>Schliemann</b> began digging at Troy and found many layers. Whether a real war lies behind Homer's Trojan War is still debated.","show":HX.li(...[["Troy I (about 3000 BC): the oldest layer","Troy II: Schliemann's 'Priam's Treasure', in fact about 1,000 years too early for the Trojan War","Troy VI–VIIa (about 1700–1180 BC): the strongest candidates for Homer's Troy","Troy IX: Roman Ilium"],"Some of Troy's layers"])},{"say":"Schliemann dug carelessly, destroying evidence, and fitted his finds to Homer. Around 1200 BC many Bronze Age cities fell in the <b>Late Bronze Age collapse</b>, whose causes are debated.","show":HX.tb(...[[["Schliemann's claim","What the evidence shows"],["'Priam's Treasure' from Homer's Troy","From Troy II, about 1,000 years earlier"],["'The face of Agamemnon'","About 300 years before the traditional Trojan War"],["Troy was real","A great city did exist at Hisarlik"]]])},{"say":"<b>Explain it.</b> How did the decipherment of Linear B change what we know about Crete? Then explain what Schliemann got right and what he got wrong.","show":{"type":"list","items":["Say it in 2–4 complete sentences.","Use the precise words from this lesson.","Support each claim with evidence: how do we know?"],"caption":"Explain it — to a grown-up or in writing"}}],"practice":[{"q":"On which island did the Minoan civilisation flourish?","options":["Cyprus","Sicily","Crete","Thera"],"answer":"Crete","hint":"Look at the map.","why":"The Minoans flourished on Crete, with palaces at Knossos and elsewhere."},{"q":"Who named the Minoans, and after whom?","options":["Arthur Evans, after Minos, a king of Greek legend","Homer, after a god","The Minoans themselves","Herodotus, after an island"],"answer":"Arthur Evans, after Minos, a king of Greek legend","hint":"We do not know their own name for themselves.","why":"Evans chose the name from the legendary King Minos; their own name is unknown."},{"q":"Which famous wall paintings were found at Knossos?","options":["Pyramids","Young people leaping over bulls","Roman legions","Chariot races in Rome"],"answer":"Young people leaping over bulls","hint":"The bull was central to Minoan art.","why":"The 'bull-leaping' fresco shows acrobats vaulting over a charging bull."},{"q":"How should we treat the claim that the palace of Knossos inspired the legend of the labyrinth?","options":["As a reasonable possibility, but unproven","As a proven fact","As certainly false","As a primary source"],"answer":"As a reasonable possibility, but unproven","hint":"Is there direct evidence linking them?","why":"The idea fits the maze-like palace and bull imagery, but nothing proves it. Honest writers call it a possibility."},{"q":"What did Michael Ventris show in 1952?","options":["That Linear B writes an early form of Greek","That Linear A is Egyptian","That Troy never existed","That the Minoans spoke Latin"],"answer":"That Linear B writes an early form of Greek","hint":"He was an architect, not a professional scholar.","why":"Ventris deciphered Linear B as Greek, transforming our understanding of the Mycenaean world."},{"q":"Linear B tablets were found at Knossos. What did their Greek language reveal?","options":["The Minoans were Egyptian","Greek-speaking Mycenaeans controlled Knossos in its later period","Crete was ruled by Persia","Nothing new"],"answer":"Greek-speaking Mycenaeans controlled Knossos in its later period","hint":"Who wrote Greek?","why":"The Mycenaeans, not the original Minoans, wrote Greek. Their tablets at Knossos show that mainland Greeks had taken over Crete, about 1450 BC."},{"q":"Why is Linear A still undeciphered?","options":["No one has tried","Few texts survive, the language is unknown, and no bilingual inscription has been found","It was written in invisible ink","It is the same as Linear B"],"answer":"Few texts survive, the language is unknown, and no bilingual inscription has been found","hint":"Recall the Indus script.","why":"Without a known related language or a bilingual text, and with few inscriptions, decipherment cannot be tested properly."},{"q":"Why do historians write 'about 1600 BC' for the eruption of Thera, and note a debate?","options":["Radiocarbon and pottery dating disagree","Nobody knows if it erupted","It erupted in AD 1600","The eruption is a legend"],"answer":"Radiocarbon and pottery dating disagree","hint":"Two methods give different answers.","why":"When independent methods disagree, the honest course is to report both and keep the question open until the disagreement is explained."},{"q":"What was the Lion Gate?","options":["A gate of Babylon","The main gate of the Mycenaean citadel of Mycenae, with two carved lions","A palace in Crete","A Roman arch"],"answer":"The main gate of the Mycenaean citadel of Mycenae, with two carved lions","hint":"It stands at Mycenae, in mainland Greece.","why":"The Lion Gate, about 1250 BC, is the entrance to Mycenae's citadel."},{"q":"Where is the site of ancient Troy?","options":["Crete","Hisarlik, in north-west Turkey","Athens","Cyprus"],"answer":"Hisarlik, in north-west Turkey","hint":"Near the entrance to the Dardanelles.","why":"Troy lies at Hisarlik in Turkey, overlooking the approach to the Dardanelles."},{"q":"Troy has about nine main layers. If a 15-metre mound held them in roughly equal thickness, how many metres thick would each be, on average? Round to the nearest whole metre.","type":"number","answer":2,"hint":"15 ÷ 9.","why":"15 ÷ 9 = 1.67 m, about 2 m per layer."},{"q":"What was Schliemann's biggest mistake as an archaeologist?","options":["He found nothing","He destroyed layers and fitted his finds to Homer","He worked too slowly","He refused to dig at Troy"],"answer":"He destroyed layers and fitted his finds to Homer","hint":"Recall why context matters.","why":"By cutting through layers quickly, he destroyed the context needed to date finds, and he interpreted objects to match the Iliad."},{"q":"Schliemann called a gold mask the 'face of Agamemnon'. What does dating show?","options":["It belonged to Agamemnon","It is about 300 years older than any likely Trojan War","It is a modern fake","It came from Egypt"],"answer":"It is about 300 years older than any likely Trojan War","hint":"Compare the mask's date with the war's.","why":"The mask dates to about 1550–1500 BC, roughly three centuries before the traditional date of the Trojan War, about 1200 BC (if a real war lies behind the legend). The famous name is a misattribution."},{"q":"What was the Late Bronze Age collapse?","options":["The invention of iron","The fall of many eastern Mediterranean cities about 1200 BC","The fall of Rome","One earthquake on Crete"],"answer":"The fall of many eastern Mediterranean cities about 1200 BC","hint":"Mycenae was one of its victims.","why":"Around 1200–1150 BC many palaces and cities fell, trade networks broke and writing disappeared in Greece. Possible causes include drought, earthquakes, raiders and system collapse."},{"q":"Put these in order, earliest first.","type":"order","items":["Mycenaeans take over Knossos","Thera erupts","Minoan palaces built on Crete","Late Bronze Age collapse"],"answer":["Minoan palaces built on Crete","Thera erupts","Mycenaeans take over Knossos","Late Bronze Age collapse"],"hint":"Palaces from about 1900 BC.","why":"Palaces (about 1900 BC) → Thera (about 1600 BC) → Mycenaean Knossos (about 1450 BC) → collapse (about 1200 BC)."},{gen:HX.G.mapdot(21)},{gen:HX.G.mapdot(21)},{gen:HX.G.country(21)},{gen:HX.G.feature(21)},{gen:HX.G.span(21)},{gen:HX.G.first(21)},{gen:HX.G.order(21)},{gen:HX.G.century(21)},{gen:HX.G.ago(21)}],"challenge":[{"q":"Schliemann reasoned: 'Homer describes Troy. I found a rich ancient city where Troy should be. Therefore this treasure is Priam's.' Which step fails?","options":["Homer never mentions Troy","The right place does not prove the right layer: that needs dating","There is no city at Hisarlik","The treasure was not gold"],"answer":"The right place does not prove the right layer: that needs dating","hint":"Does 'right place' mean 'right time'?","why":"The location was right, but the treasure came from a layer about a thousand years too early. A conclusion can be partly right and still overreach."},{"q":"Ventris deciphered Linear B in AD 1952. Knossos fell under Mycenaean control about 1450 BC. About how many years separate these dates?","type":"number","answer":3401,"hint":"Crossing BC to AD.","why":"1450 + 1952 − 1 = 3401 years."},{"q":"Before 1952 many scholars assumed the Minoans dominated the Mycenaeans. The Greek Linear B tablets at Knossos showed the reverse in the later period. What does this case teach?","options":["Strongly held assumptions must give way when new evidence clearly contradicts them","Scholars are always wrong","Writing is unimportant","Crete was never conquered"],"answer":"Strongly held assumptions must give way when new evidence clearly contradicts them","hint":"What changed the view: argument or evidence?","why":"The tablets' language was hard evidence. A good thinker revises a view when evidence shows another to be true, however established the old view was."},{"q":"If Knossos had about 1,300 rooms on 2 floors in roughly equal numbers, about how many rooms per floor?","type":"number","answer":650,"hint":"Divide.","why":"1,300 ÷ 2 = 650 rooms per floor."},{gen:HX.G.gap2(21)}],"extend":"Read the story of the decipherment of Linear B (for example, Andrew Robinson's 'The Man Who Deciphered Linear B'). Write the key steps, marking which were guesses and which were tests, and compare them with Champollion's method.","offline":"Make a 'layer cake' site: stack five layers of different coloured play-dough with a small object in each. Have someone excavate it carefully with a spoon and record each layer, then do a second one as Schliemann did, with one deep trench. Compare what was learned."},
    {"title":"The early Greeks","icon":"🏺","learn":[{"say":"Mountains divided Greece, but the sea joined it. So the Greeks lived in more than a thousand independent city-states, each a <b>polis</b>.","show":HX.tb(...[[["Geographic fact","Effect on history"],["Mountains divide the land","Many independent city-states"],["Little good farmland","Colonies founded overseas"],["Long coastline, many islands","Sea trade and naval power"],["Mediterranean climate","Olives, grapes, wheat"]]])},{"say":"After the Bronze Age collapse, Greece passed through a 'Dark Age' (about 1100–800 BC) in which writing was forgotten. About 800 BC the Greeks adopted the Phoenician alphabet, adding vowels. From then on they wrote down their poems, laws and histories.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 360' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><path d='M30 170H570' stroke='#1f2937' stroke-width='4'/><circle cx='83' cy='170' r='8' fill='#1d5c8a'/><path d='M83 170V146' stroke='#1d5c8a' stroke-width='2'/><text x='69' y='118' font-size='18' fill='#1f2937' text-anchor='start' font-weight='700'>Dark Age begins</text><text x='69' y='140' font-size='18' fill='#1f2937' text-anchor='start' font-weight='700'>(about 1100 BC)</text><circle cx='343' cy='170' r='8' fill='#1d5c8a'/><path d='M343 170V222' stroke='#1d5c8a' stroke-width='2'/><text x='343' y='242' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Alphabet adopted</text><text x='343' y='264' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>(about 800 BC)</text><circle cx='364' cy='170' r='8' fill='#1d5c8a'/><path d='M364 170V100' stroke='#1d5c8a' stroke-width='2'/><text x='364' y='72' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>First Olympic</text><text x='364' y='94' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Games 776 BC</text><circle cx='387' cy='170' r='8' fill='#1d5c8a'/><path d='M387 170V268' stroke='#1d5c8a' stroke-width='2'/><text x='387' y='288' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Homer's epics</text><text x='387' y='310' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>(about 750 BC)</text><circle cx='517' cy='170' r='8' fill='#1d5c8a'/><path d='M517 170V146' stroke='#1d5c8a' stroke-width='2'/><text x='531' y='118' font-size='18' fill='#1f2937' text-anchor='end' font-weight='700'>Massalia founded</text><text x='531' y='140' font-size='18' fill='#1f2937' text-anchor='end' font-weight='700'>(about 600 BC)</text></svg>"}},{"say":"The <b>Iliad</b> and the <b>Odyssey</b>, credited to <b>Homer</b>, grew from a long oral tradition, probably in the 8th century BC. Whether Homer was one poet is debated.","show":{"type":"passage","title":"Homer, Iliad 1.1–2 (trans. Samuel Butler, 1898)","text":"Sing, O goddess, the anger of Achilles son of Peleus, that brought countless ills upon the Achaeans."}},{"say":"The greatest shared festival was the <b>Olympic Games</b> at Olympia, traditionally first held in <b>776 BC</b> and then every four years. Greeks even counted time in Olympiads.","show":HX.tb(...[[["Olympiad","Year"],["1st","776 BC"],["2nd","772 BC"],["3rd","768 BC"],["10th","740 BC"]],"Each Olympiad is 4 years later"])},{"say":"Short of land, Greek cities founded <b>colonies</b> from Spain to the Black Sea, such as Massalia, Syracuse and Byzantium. Plato compared the Greeks to frogs about a marsh.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 338' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><rect width='600' height='338' fill='#efe4c8'/><path d='M-57,197 -38,185 -2,185 17,167 27,131 35,113 46,100 66,92 82,82 81,60 98,52 117,56 147,46 172,32 193,42 197,62 207,72 226,85 237,95 256,103 267,113 278,118 284,139 279,159 286,159 294,151 302,139 294,125 303,110 316,121 324,116 300,98 286,82 268,80 251,62 245,48 227,36 226,20 227,10 248,6 248,18 261,14 283,48 309,60 325,72 338,84 338,111 347,125  546,412 551,436 543,458 531,472 527,482 515,508 512,525 513,534 521,549 534,546 545,539 557,527 567,547 568,563 564,578 545,605 545,657 531,726' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M662,151 667,161 698,173 713,192 715,210 721,227 724,235 732,252 755,269 776,282 780,299' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><path d='M644,131 636,159 632,183 647,200 666,212 677,228 701,236 707,246 723,252 733,268 747,293 762,298 780,299 786,308 797,318' fill='none' stroke='#2b7bbf' stroke-width='3' stroke-linejoin='round'/><circle cx='116' cy='54' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='273' cy='178' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='489' cy='99' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='377' cy='262' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='515' cy='301' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='406' cy='160' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><g font-size='18' font-weight='700' stroke='#fff' stroke-width='4' paint-order='stroke' text-anchor='middle'><text x='568' y='56' fill='#1d5c8a' font-style='italic'>Black Sea</text><text x='316' y='233' fill='#1d5c8a' font-style='italic'>Mediterranean Sea</text><text x='116' y='43' fill='#1f2937' text-anchor='middle'>Massalia</text><text x='273' y='202' fill='#1f2937' text-anchor='middle'>Syracuse</text><text x='489' y='88' fill='#1f2937' text-anchor='middle'>Byzantium</text><text x='377' y='286' fill='#1f2937' text-anchor='middle'>Cyrene</text><text x='515' y='325' fill='#1f2937' text-anchor='middle'>Naucratis</text><text x='406' y='184' fill='#1f2937' text-anchor='middle'>Athens</text></g></svg>"}},{"say":"Greek <b>myths</b> about the gods explained the world and taught values. The thinker Xenophanes noticed that every people pictures its gods looking like itself.","show":HX.tb(...[[["God","Domain","Symbol"],["Zeus","Sky, king of the gods","Thunderbolt"],["Athena","Wisdom, crafts; patron of Athens","Owl, olive"],["Poseidon","Sea, earthquakes","Trident"],["Apollo","Light, music, prophecy","Lyre"]]])},{"say":"<b>Explain it.</b> How did Greek geography lead to many city-states and to colonies? Then explain how a myth differs from a historical account.","show":{"type":"list","items":["Say it in 2–4 complete sentences.","Use the precise words from this lesson.","Support each claim with evidence: how do we know?"],"caption":"Explain it — to a grown-up or in writing"}}],"practice":[{"q":"What was a polis?","options":["A Greek temple","A Greek city-state: a city and its surrounding land, self-governing","A Greek ship","A kind of poem"],"answer":"A Greek city-state: a city and its surrounding land, self-governing","hint":"Our words politics and police come from it.","why":"A polis was an independent city-state with its own laws, army and gods."},{"q":"Why did the Greeks never form a single kingdom in this period?","options":["Mountains and sea divided communities, encouraging independent city-states","They had no kings","Persia forbade it","They spoke many languages"],"answer":"Mountains and sea divided communities, encouraging independent city-states","hint":"Recall the geography.","why":"Rugged terrain separated valleys and islands, so each community developed independently."},{"q":"Why did Greek cities found colonies overseas?","options":["To escape the gods","Their land was too small and rugged to feed growing populations, and trade beckoned","Because Rome ordered it","To hold the Olympics"],"answer":"Their land was too small and rugged to feed growing populations, and trade beckoned","hint":"What was scarce in Greece?","why":"Shortage of good farmland pushed cities to found new settlements abroad, which also became trading partners."},{"q":"Which modern city began as the Greek colony Massalia?","options":["Naples","Marseille","Istanbul","Cairo"],"answer":"Marseille","hint":"It is a port in southern France.","why":"Massalia, founded about 600 BC by Greeks from Phocaea, is modern Marseille."},{"q":"Byzantium, a Greek colony, later became…","options":["Rome","Constantinople, now Istanbul","Alexandria","Carthage"],"answer":"Constantinople, now Istanbul","hint":"It guards the Bosporus.","why":"Byzantium became Constantinople in AD 330 and is now Istanbul."},{"q":"What happened to writing in Greece during the Dark Age (about 1100–800 BC)?","options":["It was forgotten; Linear B disappeared","It spread to every home","The Greeks invented hieroglyphs","It was carved on pyramids"],"answer":"It was forgotten; Linear B disappeared","hint":"Recall the Bronze Age collapse.","why":"With the palaces gone, Linear B fell out of use. Writing returned with the alphabet about 800 BC."},{"q":"What are the Iliad and the Odyssey?","options":["Law codes","Epic poems credited to Homer, about the Trojan War and Odysseus's journey home","Histories by Herodotus","Greek plays"],"answer":"Epic poems credited to Homer, about the Trojan War and Odysseus's journey home","hint":"One is about a war, one about a voyage.","why":"The Iliad tells of the anger of Achilles during the Trojan War; the Odyssey of Odysseus's ten-year journey home."},{"q":"Why do scholars debate whether Homer was a single person?","options":["The poems grew from oral tradition; his 'life' is legend","Homer signed every page","Homer was a Roman","The poems are in Latin"],"answer":"The poems grew from oral tradition; his 'life' is legend","hint":"How were the poems passed on before writing?","why":"Generations of oral poets shaped the stories before they were written down, and the 'biographies' of Homer are late inventions."},{"q":"The first Olympic Games are dated 776 BC, held every 4 years. In which year BC were the 10th Games held?","type":"number","answer":740,"hint":"The 10th Games came 9 four-year steps after the 1st.","why":"9 × 4 = 36 years after 776 BC. In BC, later means smaller: 776 − 36 = 740 BC."},{"q":"The stadion race was about 192 m. How many metres would 5 stadia be?","type":"number","answer":960,"hint":"Multiply.","why":"5 × 192 = 960 m."},{"q":"In whose honour were the Olympic Games held?","options":["Athena","Zeus","Poseidon","Apollo"],"answer":"Zeus","hint":"Olympia held his great temple.","why":"The Games at Olympia honoured Zeus, whose temple there held a huge gold-and-ivory statue."},{"q":"Where was the most famous Greek oracle?","options":["Athens","Olympia","Delphi","Sparta"],"answer":"Delphi","hint":"Apollo spoke there through a priestess.","why":"At Delphi, Apollo's priestess, the Pythia, gave answers that cities and kings consulted."},{"q":"Xenophanes noted that every people pictures its gods looking like themselves. What kind of reasoning is he using?","options":["Appeal to tradition","Asking where beliefs come from","Proof by authority","Counting votes"],"answer":"Asking where beliefs come from","hint":"He questions the source of a belief.","why":"He asks why people believe what they do. If a belief simply mirrors the believer, it needs better evidence."},{"q":"Which is the best description of a myth?","options":["A traditional story that explains or teaches, not a record","A dated, checked historical record","A law code","A scientific experiment"],"answer":"A traditional story that explains or teaches, not a record","hint":"Think of Poseidon causing earthquakes.","why":"Myths carry meaning and values but are not historical evidence in the ordinary sense; they must be tested against other sources."},{"q":"The Greeks shared which of these across their many city-states?","options":["One king","One capital city","A language, gods and festivals such as the Olympic Games","One army"],"answer":"A language, gods and festivals such as the Olympic Games","hint":"What made a Spartan and an Athenian both Greek?","why":"Despite political division, Greeks shared language, religion and festivals, and called themselves Hellenes."},{gen:HX.G.mapdot(22)},{gen:HX.G.mapdot(22)},{gen:HX.G.country(22)},{gen:HX.G.feature(22)},{gen:HX.G.span(22)},{gen:HX.G.first(22)},{gen:HX.G.order(22)},{gen:HX.G.century(22)},{gen:HX.G.ago(22)}],"challenge":[{"q":"The date 776 BC for the first Olympics comes from a list made by the scholar Hippias about 400 BC. How many years after the first Games did he compile it?","type":"number","answer":376,"hint":"Both BC: subtract.","why":"776 − 400 = 376 years. A list made nearly four centuries later may be imprecise, which is why historians call 776 BC 'traditional'."},{"q":"A myth says Poseidon causes earthquakes. A Greek thinker argues: 'Earthquakes happen whether or not people sacrifice to Poseidon, so the sacrifices do not stop them.' Evaluate.","options":["It tests the claim against evidence","It fails because Poseidon is a god","It fails because earthquakes are rare","It is a preference"],"answer":"It tests the claim against evidence","hint":"What evidence would the myth predict?","why":"If the claim were true, sacrifices should reduce earthquakes. Comparing records tests the claim, the beginning of scientific thinking."},{"q":"The Olympic Games were held every 4 years from 776 BC to about AD 393. About how many Games is that? (Count the years, divide by 4 and add 1.)","type":"number","answer":293,"hint":"Years from 776 BC to AD 393 first, remembering no year 0.","why":"776 + 393 − 1 = 1,168 years. 1,168 ÷ 4 = 292, plus 1 for the first Games = 293."},{"q":"Why might geography be a strong but not complete explanation for Greek disunity?","options":["Choices mattered too: Macedon later united the same land","Geography explains everything","Geography explains nothing","Greece had no mountains"],"answer":"Choices mattered too: Macedon later united the same land","hint":"Did the mountains change when Philip of Macedon conquered Greece?","why":"Geography shapes possibilities; it does not decide events alone. The same land was later united by force, so human decisions matter too."},{gen:HX.G.gap2(22)}],"extend":"Read Book 9 of Homer's Odyssey (the Cyclops) in Samuel Butler's translation. Write a page on how Odysseus wins by cleverness, and which details tell us about Greek values such as hospitality.","offline":"Hold a family 'Olympics' with a 192-step race (a stadion), a long jump and a throw. Record results in a table and calculate each person's average across three tries."},
    {"title":"Athens and Sparta","icon":"🛡️","learn":[{"say":"<b>Athens</b> became a sea power and the first <b>democracy</b>. <b>Sparta</b> became the strongest land power through a life of military discipline.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 483' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><rect width='600' height='483' fill='#efe4c8'/><path d='M-2847,469 -2716,386 -2465,386 -2335,262 -2269,14 -2215,-110 -2138,-207 -1996,-262 -1887,-331 -1898,-483 -1778,-538 -1647,-510 -1440,-579 -1265,-676 -1124,-607 -1091,-469 -1025,-400 -895,-310 -818,-241 -687,-179 -611,-110 -535,-76 -491,69 -529,207 -480,207 -425,152 -365,69 -425,-28 -360,-131 -273,-55 -218,-90 -382,-221 -480,-331 -600,-345 -720,-469 -764,-566 -884,-648 -895,-759 -884,-828 -742,-855 -742,-773 -655,-800 -502,-566 -316,-483 -207,-400 -120,-317 -120,-124 -55,-28 22,83 65,166 131,304 153,373 218,428 262,386 295,428 251,276 327,304 273,221 338,214 385,255 382,179 305,124 229,90 262,41 305,55 240,-55 229,-124 262,-152 305,-97 371,-124 360,-172 425,-193 535,-193 600,-179 665,-152 622,-76 622,-55 611,0 687,28 687,110 720,152 644,166 731,221 742,317 753,345 829,373 840,393 938,400 1091,442 1113,359 1200,386 1309,469 1429,455 1538,373 1647,400 1713,400 1669,552 1680,635 1636,773 1604,855 1582,924 1549,1021 1516,1104 1451,1145 1287,1131 1233,1104 1145,1090 1080,1111 1025,1145 873,1173 731,1131 513,1090 382,1035 284,952 131,911 -44,980 -55,1104 -142,1269 -251,1214 -491,1131 -567,993 -796,911 -971,869 -1135,773 -1025,593 -1080,510 -1036,359 -1113,366 -1156,304 -1298,359 -1385,359 -1549,331 -1680,386 -1909,373 -2105,414 -2302,524 -2476,607 -2662,593 -2815,497ZM622,-76 676,-117 764,-200 927,-214 938,-241 960,-221 971,-172 818,-117 676,-103 633,-62ZM55,145 109,159 185,149 262,177 295,200 267,217 196,189 142,170 98,186 55,179Z' fill='#bcd9ef'/><path d='M327,538 415,538 633,579 611,621 458,635 327,579ZM251,83 316,76 404,179 447,200 393,193 305,138Z' fill='#efe4c8' stroke='#b9a77c'/><circle cx='352' cy='210' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='211' cy='335' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='265' cy='221' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><circle cx='123' cy='257' r='5' fill='#1f2937' stroke='#fff' stroke-width='2'/><g font-size='18' font-weight='700' stroke='#fff' stroke-width='4' paint-order='stroke' text-anchor='middle'><text x='322' y='172' fill='#6d28d9'>ATTICA</text><text x='175' y='276' fill='#6d28d9'>PELOPONNESE</text><text x='491' y='290' fill='#1d5c8a' font-style='italic'>Aegean Sea</text><text x='361' y='216' fill='#1f2937' text-anchor='start'>Athens</text><text x='202' y='341' fill='#1f2937' text-anchor='end'>Sparta</text><text x='265' y='210' fill='#1f2937' text-anchor='middle'>Corinth</text><text x='114' y='263' fill='#1f2937' text-anchor='end'>Olympia</text></g><g font-size='18' font-weight='700'><path d='M14 469h62' stroke='#1f2937' stroke-width='4'/><text x='14' y='461' fill='#1f2937' stroke='#fff' stroke-width='4' paint-order='stroke'>50 km</text></g></svg>"}},{"say":"Athens moved toward democracy in stages: Draco's harsh laws, Solon's end to debt slavery, and Cleisthenes's assembly in 508 BC. Democracy means 'rule by the people'.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 320' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><path d='M30 170H570' stroke='#1f2937' stroke-width='4'/><circle cx='115' cy='170' r='8' fill='#1d5c8a'/><path d='M115 170V146' stroke='#1d5c8a' stroke-width='2'/><text x='115' y='118' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Draco's laws</text><text x='115' y='140' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>(about 621 BC)</text><circle cx='186' cy='170' r='8' fill='#1d5c8a'/><path d='M186 170V222' stroke='#1d5c8a' stroke-width='2'/><text x='186' y='242' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Solon</text><text x='186' y='264' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>594 BC</text><circle cx='409' cy='170' r='8' fill='#1d5c8a'/><path d='M409 170V146' stroke='#1d5c8a' stroke-width='2'/><text x='409' y='118' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Cleisthenes</text><text x='409' y='140' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>508 BC</text><circle cx='482' cy='170' r='8' fill='#1d5c8a'/><path d='M482 170V222' stroke='#1d5c8a' stroke-width='2'/><text x='482' y='242' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Salamis</text><text x='482' y='264' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>480 BC</text></svg>"}},{"say":"Every male citizen could vote in the <b>Assembly</b>; councils and juries were chosen by <b>lot</b>. The Assembly could <b>ostracise</b> a man, sending him away for ten years.","show":HX.tb(...[[["Institution","Who","How chosen"],["Assembly","All adult male citizens","Anyone could attend"],["Council of 500","50 from each of 10 tribes","Lot, for one year"],["Juries","Often 201 or 501 citizens","Lot"],["Generals (10)","Experienced men","Election"]]])},{"say":"Athenian democracy was real but limited: perhaps 30,000 citizens in a population of about 250,000. Women, slaves and resident foreigners called <b>metics</b> could not vote.","show":{"type":"bars","values":[["Citizens (men)",30000],["Citizens' families",90000],["Metics",40000],["Slaves",80000]],"caption":"Attica about 430 BC (rough estimates)"}},{"say":"Sparta had two kings, elected <b>ephors</b> and a council of elders. Boys trained in the harsh <b>agoge</b>, and the land was worked by <b>helots</b>, a conquered people held down by fear.","show":HX.tb(...[[["","Athens","Sparta"],["Government","Democracy (by 508 BC)","Two kings, ephors, elders: mixed"],["Strength","Navy, trade","Army"],["Education","Reading, music, athletics, rhetoric","The agoge: military training from age 7"],["Labour","Slaves, citizens, metics","Helots"],["Women","Few rights; kept at home","Athletics; could own property"]]])},{"say":"How do we know about Sparta? Spartans wrote little; most accounts come from outsiders, often Athenians, centuries later. Plutarch, writing about AD 100, opens his life of Sparta's lawgiver with a warning that every historian should admire.","show":{"type":"passage","title":"Plutarch, Life of Lycurgus 1 (trans. Bernadotte Perrin, 1914)","text":"Concerning Lycurgus the lawgiver, in general, nothing can be said which is not disputed, since indeed there are different accounts of his birth, his travels, his death, and above all, of his work as lawmaker and statesman; and there is least agreement among historians as to the times in which the man lived."}},{"say":"<b>Explain it.</b> Compare Athens and Sparta in government, education and rights, and judge with evidence whether Athens was a democracy by our standards.","show":{"type":"list","items":["Say it in 2–4 complete sentences.","Use the precise words from this lesson.","Support each claim with evidence: how do we know?"],"caption":"Explain it — to a grown-up or in writing"}}],"practice":[{"q":"What does 'democracy' mean?","options":["Rule by one","Rule by the few","Rule by the people","Rule by the gods"],"answer":"Rule by the people","hint":"Demos = people; kratos = power.","why":"Democracy means rule by the people."},{"q":"Which Athenian lawgiver cancelled debts and freed those enslaved for debt?","options":["Draco","Solon","Cleisthenes","Lycurgus"],"answer":"Solon","hint":"594 BC.","why":"Solon, in 594 BC, cancelled debts and ended debt-slavery for Athenians."},{"q":"Which reformer, in 508 BC, is usually credited with founding Athenian democracy?","options":["Solon","Draco","Cleisthenes","Pericles"],"answer":"Cleisthenes","hint":"He reorganised citizens into ten tribes.","why":"Cleisthenes gave power to the citizens' assembly and reorganised the tribes, about 508 BC."},{"q":"We call very harsh laws 'draconian'. Why?","options":["Draco's written laws of about 621 BC were famously severe","Dragons made the laws","Sparta's kings were called Draco","Because of the Chinese dragon"],"answer":"Draco's written laws of about 621 BC were famously severe","hint":"Who wrote down Athens's first laws?","why":"Draco's code punished even small crimes severely; his name became a word for harshness."},{"q":"How was the Athenian Council of 500 chosen?","options":["By birth","By the king","By lot (random draw)","By wealth"],"answer":"By lot (random draw)","hint":"Athenians thought this was fairest.","why":"Members were chosen by lot each year, so ordinary citizens shared in government, not just the rich or eloquent."},{"q":"What was ostracism?","options":["A Spartan training","A vote to send a man away from Athens for ten years, by writing his name on pottery shards","A tax","A religious festival"],"answer":"A vote to send a man away from Athens for ten years, by writing his name on pottery shards","hint":"Ostraka were pottery shards.","why":"If enough votes were cast, the man with the most left Athens for ten years: a way to remove someone seen as dangerous to democracy."},{"q":"Who could vote in the Athenian Assembly?","options":["Everyone living in Athens","Free adult men who were Athenian citizens","Only the rich","Women and men equally"],"answer":"Free adult men who were Athenian citizens","hint":"Who was excluded?","why":"Only adult male citizens could vote; women, slaves and metics were excluded."},{"q":"If Attica had about 250,000 people and about 30,000 adult male citizens, about what percentage could vote? Round to the nearest whole number.","type":"number","answer":12,"hint":"30,000 ÷ 250,000, then × 100.","why":"30,000 ÷ 250,000 = 0.12 = 12%. Roughly one person in eight could vote."},{"q":"What was the agoge?","options":["An Athenian school of philosophy","Sparta's harsh military training for boys, starting at age seven","A Spartan festival","The Athenian assembly"],"answer":"Sparta's harsh military training for boys, starting at age seven","hint":"It began in childhood.","why":"The agoge trained Spartan boys from age seven in endurance, obedience and fighting."},{"q":"Who were the helots?","options":["Spartan kings","Athenian sailors","A conquered people forced to farm the land for Spartan citizens","Persian soldiers"],"answer":"A conquered people forced to farm the land for Spartan citizens","hint":"They outnumbered the Spartans.","why":"Helots were state-owned unfree labourers. Fear of helot revolt shaped Sparta's whole military way of life."},{"q":"How was Sparta governed?","options":["By two kings, five elected ephors, a council of elders and an assembly","By one emperor","By a democracy exactly like Athens","By priests only"],"answer":"By two kings, five elected ephors, a council of elders and an assembly","hint":"It mixed several kinds of rule.","why":"Sparta combined monarchy (two kings), oligarchy (elders, ephors) and some popular voice (assembly)."},{"q":"Which statement about Spartan women is supported by ancient sources?","options":["They were forbidden to leave home","They trained in athletics and could own property","They served as soldiers in the army","They voted in the assembly"],"answer":"They trained in athletics and could own property","hint":"Compare with Athenian women.","why":"Spartan women exercised, managed estates and could own land, far more than Athenian women."},{"q":"Why must we be careful with accounts of Sparta?","options":["Sparta never existed","Most come from outsiders writing much later","All are Spartan propaganda","Plutarch lived in 800 BC"],"answer":"Most come from outsiders writing much later","hint":"Who wrote about Sparta?","why":"Most sources are by non-Spartans, sometimes admirers, sometimes enemies, and often centuries later. Historians call this 'the Spartan mirage'."},{"q":"What does Plutarch's opening of the Life of Lycurgus show about him as a writer?","options":["He was careless","He openly admits that the evidence about Lycurgus is disputed","He knew Lycurgus personally","He invented Lycurgus"],"answer":"He openly admits that the evidence about Lycurgus is disputed","hint":"Read the passage.","why":"Plutarch warns readers that every part of Lycurgus's story is disputed: an honest statement of the limits of his evidence."},{"q":"Which form of government means 'rule by the few'?","options":["Monarchy","Democracy","Oligarchy","Tyranny"],"answer":"Oligarchy","hint":"Oligoi = few.","why":"Oligarchy is rule by a small group, usually the rich or noble."},{"q":"Was Sparta a democracy, a monarchy or an oligarchy?","options":["Purely a democracy","Purely a monarchy","A mixture: kings (monarchy), elders and ephors (oligarchy) and an assembly of citizens","A tyranny"],"answer":"A mixture: kings (monarchy), elders and ephors (oligarchy) and an assembly of citizens","hint":"Count the parts of its government.","why":"Ancient writers admired Sparta as a 'mixed constitution', blending rule by one, by the few and by the many."},{gen:HX.G.mapdot(23)},{gen:HX.G.mapdot(23)},{gen:HX.G.country(23)},{gen:HX.G.feature(23)},{gen:HX.G.span(23)},{gen:HX.G.first(23)},{gen:HX.G.order(23)},{gen:HX.G.century(23)}],"challenge":[{"q":"A student says: 'Athens was a democracy, so everyone in Athens had a say.' Which is the most precise correction?","options":["It was a democracy for citizens, but most residents were not citizens","Athens was not a democracy at all","Everyone voted except archons","Only slaves could vote"],"answer":"It was a democracy for citizens, but most residents were not citizens","hint":"Distinguish the system from who was included.","why":"Athens was a genuine democracy among citizens, but the citizen body excluded women, slaves and metics. Both parts of the statement matter."},{"q":"An ostracism needed at least 6,000 votes in total. If 6,000 votes were cast and one man received 2,700, what percentage of the votes did he receive?","type":"number","answer":45,"hint":"2,700 ÷ 6,000 × 100.","why":"2,700 ÷ 6,000 = 0.45 = 45%."},{"q":"Athenians chose most officials by lot, but elected their generals. Why might they have made that exception?","options":["Commanding armies needs proven skill","Generals were not important","Lot was illegal","Sparta forced them"],"answer":"Commanding armies needs proven skill","hint":"What would happen with a randomly chosen general?","why":"Lot spread power fairly for ordinary tasks; specialised, life-or-death jobs called for elected, experienced men."},{"q":"A jury of 501 citizens votes; 251 vote 'guilty'. What is the smallest number of jurors who would need to switch to 'not guilty' to change the verdict?","type":"number","answer":1,"hint":"With 501 jurors, how many votes make a majority?","why":"A majority of 501 is 251. If 1 juror switches, 'guilty' has 250 and 'not guilty' 251, so the verdict changes. Odd-numbered juries prevent ties."},{gen:HX.G.gap2(23)}],"extend":"Read Plutarch's Life of Lycurgus, chapters 14–18 (Perrin translation), on Spartan education. List three practices, and for each say whether Plutarch seems to approve, and how reliable his account is likely to be.","offline":"Run a family 'assembly': propose a decision (for example, a weekend outing), let everyone speak for one minute, and vote. Then choose a 'council' by lot. Discuss: is choosing by lot fairer than voting? When is it worse?"},

s return to rebuild their temple in Jerusalem.","show":{"type":"passage","title":"Ezra 1:1–2 (World English Bible)","text":"Now in the first year of Cyrus king of Persia, that Yahweh’s word by Jeremiah’s mouth might be accomplished, Yahweh stirred up the spirit of Cyrus king of Persia, so that he made a proclamation throughout all his kingdom, and put it also in writing, saying, “Thus says Cyrus king of Persia, ‘Yahweh, the God of heaven, has given me all the kingdoms of the earth; and he has commanded me to build him a house in Jerusalem, which is in Judah. […]"}},{"say":"The Cyrus Cylinder credits Marduk and does not mention the Jews, but it describes the same policy of return as Ezra. Calling it 'the first charter of human rights' goes beyond the text.","show":HX.tb(...[[["Question","Cyrus Cylinder","Ezra 1"],["Who chose Cyrus?","Marduk, god of Babylon","Yahweh, God of Israel"],["Policy","Return of gods and peoples to their homes","Jews may return and rebuild the temple"],["Mentions the Jews?","No","Yes"],["Agreement","A policy of return","A policy of return"]]])},{"say":"<b>Darius I</b> divided the empire into <b>satrapies</b>, each with a governor who paid tribute, watched by inspectors called the 'king's eyes'. He issued gold coins and built <b>Persepolis</b>.","show":HX.li(...[["Satrapies: about 20 provinces","Satraps: governors who collected tribute","'King's eyes': inspectors who reported to the king","Daric: a standard gold coin","Local laws and religions mostly left in place"],"How Darius ruled many peoples"])},{"say":"A <b>Royal Road</b> about 2,700 km long ran from Sardis to Susa. Royal couriers changing horses at relay stations carried messages in about a week.","show":{"type":"passage","title":"Herodotus, Histories 8.98 (trans. G. C. Macaulay, 1890)","text":"These neither snow nor rain nor heat nor darkness of night prevents from accomplishing each one the task proposed to him, with the very utmost speed."}},{"say":"Darius carved his deeds at <b>Behistun</b> in three languages. Henry Rawlinson copied them, and they became the key to reading all cuneiform.","show":{"type":"passage","title":"Herodotus, Histories 1.136 (trans. G. C. Macaulay, 1890)","text":"And they educate their children, beginning at five years old and going on till twenty, in three things only, in riding, in shooting, and in speaking the truth […]"}},{"say":"<b>Explain it.</b> How did Cyrus and Darius hold together an empire of so many peoples? Then explain what the Cyrus Cylinder and Ezra 1 agree on, and what neither can prove.","show":{"type":"list","items":["Say it in 2–4 complete sentences.","Use the precise words from this lesson.","Support each claim with evidence: how do we know?"],"caption":"Explain it — to a grown-up or in writing"}}],"practice":[{"q":"Who founded the Persian Empire, about 550 BC?","options":["Darius I","Xerxes","Cyrus the Great","Nebuchadnezzar"],"answer":"Cyrus the Great","hint":"He took Babylon in 539 BC.","why":"Cyrus the Great founded the Achaemenid Persian Empire about 550 BC."},{"q":"Persia is the old name for which modern country?","options":["Iraq","Iran","Turkey","Egypt"],"answer":"Iran","hint":"Persepolis lies there.","why":"Persia is modern Iran; the name Iran was adopted internationally in 1935."},{"q":"According to Ezra 1, what did Cyrus allow the exiled Jews to do?","options":["Return to Jerusalem and rebuild the temple","Stay in Babylon forever","Become Persian soldiers","Build a temple in Persia"],"answer":"Return to Jerusalem and rebuild the temple","hint":"Read the passage.","why":"Ezra says Cyrus proclaimed that the temple in Jerusalem should be rebuilt, allowing exiles to return."},{"q":"Does the Cyrus Cylinder mention the Jews?","options":["Yes, many times","No, but it describes a general policy of returning peoples and gods to their homes","Yes, it names Ezra","It is written in Hebrew"],"answer":"No, but it describes a general policy of returning peoples and gods to their homes","hint":"What does it say about returning peoples?","why":"It does not name the Jews; its general policy of return is consistent with Ezra's account."},{"q":"The Cyrus Cylinder is sometimes called 'the first charter of human rights'. What is the best judgement?","options":["Exactly right","An exaggeration: it is royal propaganda, not a charter of rights","A modern forgery","A law code like Hammurabi's"],"answer":"An exaggeration: it is royal propaganda, not a charter of rights","hint":"Does the text speak of universal rights?","why":"The text presents Cyrus as a pious, merciful conqueror. Calling it a human rights charter reads modern ideas into an ancient document."},{"q":"What was a satrapy?","options":["A Persian coin","A province of the Persian Empire, run by a governor","A royal road","A kind of temple"],"answer":"A province of the Persian Empire, run by a governor","hint":"Its governor was a satrap.","why":"Darius divided the empire into about 20 satrapies, each under a satrap who collected tribute."},{"q":"Who were the 'king's eyes'?","options":["Spies of Greece","Royal inspectors who checked on governors and reported to the king","Astronomers","Archers"],"answer":"Royal inspectors who checked on governors and reported to the king","hint":"How could a king far away control his governors?","why":"Inspectors watched satraps on the king's behalf, a check against corruption and rebellion."},{"q":"The Royal Road ran about 2,700 km. If a traveller walked 30 km a day, how many days would the journey take?","type":"number","answer":90,"hint":"Divide.","why":"2,700 ÷ 30 = 90 days, about three months, as Herodotus says."},{"q":"Royal couriers covered the 2,700 km in about 7 days. To the nearest whole kilometre, about how many kilometres a day is that?","type":"number","answer":386,"hint":"2,700 ÷ 7.","why":"2,700 ÷ 7 = 385.7…, about 386 km a day, possible only with fresh horses at every station."},{"q":"If 111 relay stations were spread evenly along 2,700 km, about how many kilometres apart were they? Round to the nearest whole number.","type":"number","answer":24,"hint":"2,700 ÷ 111.","why":"2,700 ÷ 111 = 24.3…, about 24 km between stations: roughly a day's walk."},{"q":"What was the daric?","options":["A Persian gold coin","A Persian god","A kind of chariot","A province"],"answer":"A Persian gold coin","hint":"Named after Darius.","why":"The daric was a standard gold coin issued by Darius I, helping trade across the empire."},{"q":"According to Herodotus 1.136, what three things did Persians teach their children?","options":["Reading, writing and arithmetic","Riding, shooting and speaking the truth","Farming, building and trade","Music, poetry and dance"],"answer":"Riding, shooting and speaking the truth","hint":"Read the passage.","why":"Herodotus says Persians taught their children, from five to twenty, to ride, to shoot, and to speak the truth."},{"q":"What made the Behistun inscription so important?","options":["It is the oldest pyramid","It records Darius's deeds in three languages, which let scholars decipher cuneiform","It describes the Trojan War","It is written in Greek"],"answer":"It records Darius's deeds in three languages, which let scholars decipher cuneiform","hint":"Compare it to the Rosetta Stone.","why":"Like the Rosetta Stone, a multilingual inscription provided the key: Old Persian was deciphered first, then Babylonian cuneiform."},{"q":"How did the Persians generally treat local religions and customs?","options":["They banned them all","They mostly left them in place, as long as tribute was paid and rebellions avoided","They forced everyone to worship Marduk","They made everyone speak Greek"],"answer":"They mostly left them in place, as long as tribute was paid and rebellions avoided","hint":"Recall Cyrus and Babylon.","why":"Persian rule was relatively tolerant of local religions and laws; harsh punishment came mainly for rebellion."},{"q":"Persepolis's carved stairways show people from many nations bringing gifts. What do they most reliably show?","options":["How the king wished his empire to be seen: many peoples united in loyalty to him","Exactly what each nation paid every year","That no one ever rebelled","Greek art"],"answer":"How the king wished his empire to be seen: many peoples united in loyalty to him","hint":"Who made the carvings, and why?","why":"They are royal art presenting an ideal of harmony and loyalty. They show the empire's peoples and ideology, not a tax ledger."},{gen:HX.G.mapdot(24)},{gen:HX.G.mapdot(24)},{gen:HX.G.country(24)},{gen:HX.G.feature(24)},{gen:HX.G.span(24)},{gen:HX.G.first(24)},{gen:HX.G.order(24)},{gen:HX.G.century(24)},{gen:HX.G.ago(24)}],"challenge":[{"q":"The Cylinder credits Marduk; Ezra credits Yahweh. Both describe Cyrus sending peoples home. What is the most careful conclusion?","options":["The return policy is well supported; each explains it by its own faith","They contradict, so neither is reliable","Trust only the Cylinder","Trust only Ezra"],"answer":"The return policy is well supported; each explains it by its own faith","hint":"Separate the shared factual claim from each source's explanation.","why":"Independent sources agreeing on the policy corroborate it. Their different religious explanations reflect their authors' perspectives."},{"q":"Cyrus took Babylon in 539 BC. Nebuchadnezzar had destroyed Jerusalem in about 587 BC. About how many years of exile is that?","type":"number","answer":48,"hint":"Both BC: subtract.","why":"587 − 539 = 48 years, about two generations."},{"q":"An empire of many peoples has two broad options: force everyone to become alike, or allow local customs while demanding loyalty and tribute. Which choice did Persia mostly make, and what was one risk?","options":["Mostly tolerance; local identities could still fuel revolts","Forced sameness; the risk was boredom","Persia had only one people","Tolerance with no risks"],"answer":"Mostly tolerance; local identities could still fuel revolts","hint":"Did any subject peoples rebel?","why":"Persia generally allowed local religion and law, which reduced resentment, but distinct peoples did revolt, including the Ionian Greeks in 499 BC."},{"q":"Darius reigned from 522 BC to 486 BC. How many years is that?","type":"number","answer":36,"hint":"Both BC: subtract.","why":"522 − 486 = 36 years."},{gen:HX.G.gap2(24)}],"extend":"Read the British Museum's online translation of the Cyrus Cylinder and Ezra chapter 1 (World English Bible). Write a side-by-side comparison: who wrote each, for whom, what each claims, and what facts both support.","offline":"Set up a 'Royal Road' relay at home or in a park: mark stations 20 steps apart and pass a message along with several runners. Time it, then time one person carrying it all the way. Explain why relays were faster."},
    {"title":"The Persian Wars","icon":"⚔️","learn":[{"say":"In 499 BC the Greek cities of <b>Ionia</b> rebelled against Persia, and Athens sent ships to help. Persia crushed the revolt, and Darius resolved to punish Athens.","show":{"type":"svg","markup":"<svg viewBox='0 0 600 360' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'><path d='M30 170H570' stroke='#1f2937' stroke-width='4'/><circle cx='129' cy='170' r='8' fill='#1d5c8a'/><path d='M129 170V146' stroke='#1d5c8a' stroke-width='2'/><text x='129' y='118' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Ionian Revolt</text><text x='129' y='140' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>499 BC</text><circle cx='263' cy='170' r='8' fill='#1d5c8a'/><path d='M263 170V222' stroke='#1d5c8a' stroke-width='2'/><text x='263' y='242' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Marathon</text><text x='263' y='264' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>490 BC</text><circle cx='411' cy='170' r='8' fill='#1d5c8a'/><path d='M411 170V100' stroke='#1d5c8a' stroke-width='2'/><text x='411' y='72' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Thermopylae,</text><text x='411' y='94' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Salamis 480 BC</text><circle cx='426' cy='170' r='8' fill='#1d5c8a'/><path d='M426 170V268' stroke='#1d5c8a' stroke-width='2'/><text x='426' y='288' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>Plataea</text><text x='426' y='310' font-size='18' fill='#1f2937' text-anchor='middle' font-weight='700'>479 BC</text></svg>"}},{"say":"In 490 BC a Persian army landed at <b>Marathon</b>, about 40 km from Athens. About 10,000 Athenians and 1,000 Plataeans, led by Miltiades, charged at a run and drove the Persians to their ships. Herodotus reports 6,400 Persian dead and 192 Athenian.","show":{"type":"svg","markup":"<svg viewBo
