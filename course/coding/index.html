<script>// Coding & Computers: Year 1 — 32 lessons. Generated from scratch parts.
// Generator questions compute their answers in JavaScript; each also carries a Python program (py) that the check script runs to verify the answer.
const COURSE = (() => {
"use strict";
// ===== Shared helpers (all inside the COURSE IIFE, so nothing leaks into the page's globals) =====
// Every generator returns a normal question plus two verification fields the runner ignores:
//   py  = a Python program that prints the expected result (run by the check script in real Python)
//   out = the result the generator computed in JavaScript; the answer is exactly out (choice) or Number(out) (number).
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const shuf = (a) => { const o = a.slice(); for (let i = o.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; } return o; };
const sample = (a, k) => shuf(a).slice(0, k);
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const plist = (a) => "[" + a.map((x) => (typeof x === "string" ? `'${x}'` : x)).join(", ") + "]"; // Python list repr
const sum = (a) => a.reduce((s, x) => s + x, 0);
// Options: the answer plus distinct distractors (as strings), at most n in total.
const opts = (ans, ds, n = 4) => { const out = [String(ans)]; for (const d of ds) { const s = String(d); if (s !== "" && s !== "NaN" && !out.includes(s) && out.length < n) out.push(s); } return out; };
const numOpts = (a, ds = []) => opts(a, [...ds, a + 1, a - 1, a + 2, a * 2, a + 10, a - 2].filter((x) => x >= 0 && Number.isInteger(x)));

// ---- question constructors ----
const add = (o, show) => (show ? { ...o, show } : o);
const N = (q, answer, hint, why, show) => add({ q, type: "number", answer, hint, why }, show);
const C = (q, options, answer, hint, why, show) => add({ q, options, answer, hint, why }, show);
const TF = (q, answer, hint, why, show) => add({ q, options: ["True", "False"], answer: answer ? "True" : "False", hint, why }, show);
const scramble = (a) => { const r = a.slice().reverse(); return r.slice(1).concat(r[0]); };
const O = (q, answer, hint, why, show) => add({ q, type: "order", items: scramble(answer), answer, hint, why }, show);
const G = (f, o) => ({ gen: () => f(o || {}) });
// Attach a Python verifier to a static question: py must print the stored answer.
const P = (question, py) => ({ ...question, py, out: String(question.answer) });
// Generator result builders
const gN = (q, out, hint, why, show, py) => add({ q, type: "number", answer: Number(out), hint, why, py, out: String(out) }, show);
const gC = (q, out, ds, hint, why, show, py) => add({ q, options: opts(out, ds), answer: String(out), hint, why, py, out: String(out) }, show);

// ---- slides ----
const S = (say, show) => ({ say, show });
const cap = (o, caption) => (caption ? { ...o, caption } : o);
const big = (text, caption) => cap({ type: "big", text }, caption);
const emo = (text, caption) => cap({ type: "emoji", text }, caption);
const tbl = (rows, caption) => cap({ type: "table", rows }, caption);
const list = (items, caption) => cap({ type: "list", items }, caption);
const bars = (values, caption) => cap({ type: "bars", values }, caption);
const passage = (title, text) => ({ type: "passage", title, text });
// SVG captions are drawn inside the picture (an extra band at the bottom) so they never push the stage into overflow.
const pic = (markup, caption) => {
  if (!caption) return { type: "svg", markup };
  const H = +markup.match(/viewBox='0 0 600 (\d+)'/)[1];
  return { type: "svg", markup: markup.replace(`viewBox='0 0 600 ${H}'`, `viewBox='0 0 600 ${H + 40}'`).replace(/<\/svg>$/, T(300, H + 28, caption, caption.length > 48 ? 18 : 20, GRAY) + "</svg>") };
};
const X = (prompt) => S(`<b>Explain it.</b> ${prompt}`, list(["Say it in 2–4 complete sentences.", "Use the precise words from this lesson.", "Give one example of your own."], "Explain it — to a grown-up or in writing"));

// ---- SVG ----
const INK = "#1f2937", BLUE = "#2563eb", ORANGE = "#ea580c", GREEN = "#16a34a", RED = "#dc2626", LB = "#dbeafe", LO = "#fed7aa", LG = "#dcfce7", GRAY = "#6b7280", PURPLE = "#7c3aed", LP = "#ede9fe";
const W = (body, h = 320) => `<svg viewBox='0 0 600 ${h}' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'>${body}</svg>`;
const T = (x, y, s, size = 24, fill = INK, anchor = "middle", weight = 700) => `<text x='${x}' y='${y}' font-size='${size}' fill='${fill}' text-anchor='${anchor}' font-weight='${weight}'>${esc(s)}</text>`;
const R = (x, y, w, h, fill, stroke = INK, rx = 8, sw = 3) => `<rect x='${x}' y='${y}' width='${w}' height='${h}' rx='${rx}' fill='${fill}' stroke='${stroke}' stroke-width='${sw}'/>`;
const Ln = (x1, y1, x2, y2, c = INK, w = 3) => `<line x1='${x1}' y1='${y1}' x2='${x2}' y2='${y2}' stroke='${c}' stroke-width='${w}' stroke-linecap='round'/>`;
const Arr = (x1, y1, x2, y2, c = INK, w = 3) => { const a = Math.atan2(y2 - y1, x2 - x1), h = 12; const p = (d) => `${Math.round(x2 - h * Math.cos(a + d))},${Math.round(y2 - h * Math.sin(a + d))}`; return Ln(x1, y1, x2, y2, c, w) + `<polygon points='${x2},${y2} ${p(0.45)} ${p(-0.45)}' fill='${c}'/>`; };

// Code card: dark editor panel with simple syntax colours; indentation is preserved by x offsets.
const KWS = new Set(["for", "in", "if", "elif", "else", "def", "return", "while", "and", "or", "not", "True", "False", "None", "REPEAT", "TIMES", "IF", "THEN", "ELSE", "END", "WHEN", "AND", "OR", "NOT", "SET", "TO", "PRINT", "FOR", "FROM", "WHILE", "DO"]);
const hl = (s) => s.split(/("[^"]*"|'[^']*'|#.*$|\b[A-Za-z_]+\b|\b\d+\b)/).map((t) => {
  if (!t) return "";
  if (/^["']/.test(t)) return `<tspan fill='#fbbf24'>${esc(t)}</tspan>`;
  if (/^#/.test(t)) return `<tspan fill='#94a3b8'>${esc(t)}</tspan>`;
  if (/^\d/.test(t)) return `<tspan fill='#f9a8d4'>${t}</tspan>`;
  if (/^(print|range|len|int|str|bin|ord|chr|sorted|max|min|sum|abs)$/.test(t)) return `<tspan fill='#5eead4'>${t}</tspan>`;
  if (KWS.has(t)) return `<tspan fill='#93c5fd' font-weight='700'>${t}</tspan>`;
  return esc(t);
}).join("");
function codeSvg(src, title) {
  const lines = src.split("\n");
  const n = lines.length, lh = n > 9 ? 28 : 34;
  const longest = Math.max(...lines.map((l) => l.length), (title || "").length * 0.6);
  let f = n > 9 ? 21 : 24;
  while (28 + longest * 0.61 * f > 580 && f > 18) f--;
  const top = title ? 52 : 18;
  const H = Math.max(150, top + n * lh + 20);
  let b = `<rect x='2' y='2' width='596' height='${H - 4}' rx='14' fill='#0f172a'/>`;
  if (title) b += `<text x='26' y='36' font-size='18' fill='#94a3b8' font-weight='700'>${esc(title)}</text>`;
  lines.forEach((ln, i) => {
    const ind = ln.match(/^ */)[0].length;
    b += `<text x='${(26 + ind * 0.61 * f).toFixed(1)}' y='${top + (i + 1) * lh - 8}' font-size='${f}' font-family='Menlo,Consolas,monospace' fill='#e2e8f0'>${hl(ln.trim())}</text>`;
  });
  return `<svg viewBox='0 0 600 ${H}' xmlns='http://www.w3.org/2000/svg' font-family='system-ui,sans-serif'>${b}</svg>`;
}
const code = (src, title, caption) => pic(codeSvg(src, title === undefined ? "Python" : title), caption);

// Binary place-value card: bits as a string, e.g. "01001010".
function bitsSvg(bitstr, showSum = false) {
  const n = bitstr.length, cw = Math.min(70, 560 / n), x0 = 300 - (n * cw) / 2;
  let b = "", parts = [];
  for (let i = 0; i < n; i++) {
    const pv = 2 ** (n - 1 - i), on = bitstr[i] === "1", x = x0 + i * cw;
    b += R(Math.round(x + 3), 40, Math.round(cw - 6), 50, LO, ORANGE, 8, 2) + T(Math.round(x + cw / 2), 74, pv, pv >= 1000 ? 18 : pv >= 100 ? 20 : 24, ORANGE);
    b += R(Math.round(x + 3), 100, Math.round(cw - 6), 80, on ? "#fde68a" : "#fff", INK, 8, 3) + T(Math.round(x + cw / 2), 156, bitstr[i], Math.min(44, Math.round(cw * 0.75)), on ? INK : GRAY);
    if (on) parts.push(pv);
  }
  b += T(300, 26, "place values", 18, GRAY);
  if (showSum) b += T(300, 236, parts.length ? parts.join(" + ") + " = " + sum(parts) : "0", 26, BLUE);
  return W(b, showSum ? 260 : 210);
}

// Grid world. o: { w, h, robot:[x,y,dir], goal:[x,y], walls:[[x,y]], marks:{ "x,y":"A" }, axes:true }
// Coordinates: x to the right from 0, y upward from 0 (as in maths). dir 0 = up/north, 1 = right/east, 2 = down/south, 3 = left/west.
function gridSvg(o) {
  const w = o.w, h = o.h, cs = Math.floor(Math.min(500 / w, 250 / h)), gx = 300 - (w * cs) / 2 + (o.axes ? 14 : 0), gy = 18;
  const px = (x) => gx + x * cs, py = (y) => gy + (h - 1 - y) * cs;
  let b = "";
  for (let x = 0; x < w; x++) for (let y = 0; y < h; y++) b += `<rect x='${px(x)}' y='${py(y)}' width='${cs}' height='${cs}' fill='${(o.walls || []).some(([a, c]) => a === x && c === y) ? "#475569" : "#f8fafc"}' stroke='#cbd5e1' stroke-width='2'/>`;
  if (o.axes) {
    for (let x = 0; x < w; x++) b += T(px(x) + cs / 2, py(0) + cs + 24, x, 18, GRAY);
    for (let y = 0; y < h; y++) b += T(px(0) - 14, py(y) + cs / 2 + 7, y, 18, GRAY);
  }
  for (const [k, v] of Object.entries(o.marks || {})) { const [x, y] = k.split(",").map(Number); b += T(px(x) + cs / 2, py(y) + cs / 2 + 9, v, Math.min(28, cs * 0.55), PURPLE); }
  if (o.goal) { const [x, y] = o.goal; b += `<text x='${px(x) + cs / 2}' y='${py(y) + cs / 2 + 11}' font-size='${Math.round(cs * 0.6)}' text-anchor='middle'>⭐</text>`; }
  if (o.robot) {
    const [x, y, d] = o.robot, cx = px(x) + cs / 2, cy = py(y) + cs / 2, r = cs * 0.36;
    const ang = [-90, 0, 90, 180][d] * Math.PI / 180, tip = (k, a) => `${Math.round(cx + k * Math.cos(ang + a))},${Math.round(cy + k * Math.sin(ang + a))}`;
    b += `<circle cx='${cx}' cy='${cy}' r='${Math.round(r)}' fill='${BLUE}'/><polygon points='${tip(r * 0.9, 0)} ${tip(r * 0.6, 2.4)} ${tip(r * 0.6, -2.4)}' fill='#fff'/>`;
  }
  return W(b, gy + h * cs + (o.axes ? 34 : 14));
}
const DIRS = ["north", "east", "south", "west"], DX = [0, 1, 0, -1], DY = [1, 0, -1, 0];
// Run a robot program of F (forward one square), L (turn left 90°), R (turn right 90°). Returns final [x, y, d] or null if it leaves the grid.
function runRobot(prog, x, y, d, w, h) {
  for (const c of prog) {
    if (c === "F") { x += DX[d]; y += DY[d]; if (x < 0 || y < 0 || x >= w || y >= h) return null; }
    else if (c === "R") d = (d + 1) % 4; else if (c === "L") d = (d + 3) % 4;
  }
  return [x, y, d];
}
const pyRobot = (prog, x, y, d) => `x, y, d = ${x}, ${y}, ${d}\ndx = [0, 1, 0, -1]\ndy = [1, 0, -1, 0]\nfor c in "${prog}":\n    if c == "F":\n        x += dx[d]\n        y += dy[d]\n    elif c == "R":\n        d = (d + 1) % 4\n    elif c == "L":\n        d = (d + 3) % 4\n`;

// ===== Generator families =====
const F = {};

// --- algorithms / number machines ---
// Follow a precise rule repeatedly. mode: "halve" (even → half, odd → +1, until 1; count steps) | "machine" (apply ×a then +/−b, k times)
F.machine = (o) => {
  const mode = o.mode || pick(["halve", "machine"]);
  if (mode === "halve") {
    const n = ri(o.min || 6, o.max || 40);
    let x = n, k = 0, trail = [n];
    while (x !== 1) { x = x % 2 === 0 ? x / 2 : x + 1; k++; trail.push(x); }
    return gN(`Algorithm: start with ${n}. If the number is even, halve it; if it is odd, add 1. Repeat until you reach 1. How many steps does it take?`, k,
      "Write each number down as you go and count the arrows, not the numbers.", `${trail.join(" → ")}: that is ${k} steps (count the arrows).`, big(`${n} → … → 1`),
      `x = ${n}\nk = 0\nwhile x != 1:\n    if x % 2 == 0:\n        x = x // 2\n    else:\n        x = x + 1\n    k += 1\nprint(k)`);
  }
  const s = ri(1, 9), a = ri(2, 3), b = ri(1, 5), k = ri(2, o.maxK || 4), sub = Math.random() < 0.5;
  let x = s; const trail = [s];
  for (let i = 0; i < k; i++) { x = sub ? x * a - b : x * a + b; trail.push(x); }
  if (x < 0 || sub && trail.some((t) => t < 0)) return F.machine(o);
  return gN(`A machine follows this algorithm: multiply by ${a}, then ${sub ? "subtract" : "add"} ${b}. Start with ${s} and run the machine ${k} times (each output goes back in). What comes out at the end?`, x,
    "Run it one pass at a time and write each result before the next pass.", trail.map((t, i) => (i ? `→ ${t}` : `${t}`)).join(" ") + `. Final output: ${x}.`, big(`× ${a}, then ${sub ? "−" : "+"} ${b}\n(${k} times)`),
    `x = ${s}\nfor i in range(${k}):\n    x = x * ${a} ${sub ? "-" : "+"} ${b}\nprint(x)`);
};

// --- robot on a grid: final position as "(x, y)" ---
F.robot = (o) => {
  const w = o.w || 6, h = o.h || 5, len = ri(o.min || 4, o.max || 7);
  for (let t = 0; t < 500; t++) {
    const x = ri(0, w - 1), y = ri(0, h - 1), d = ri(0, 3);
    let prog = ""; for (let i = 0; i < len; i++) prog += pick(o.loop ? ["F", "F", "R", "L"] : ["F", "F", "F", "R", "L"]);
    let shown = prog, rep = 1;
    if (o.loop) { rep = ri(2, 4); prog = prog.slice(0, ri(2, 3)); shown = `REPEAT ${rep} TIMES: ${prog.split("").join(" ")}`; prog = prog.repeat(rep); }
    if (!/F/.test(prog)) continue;
    const end = runRobot(prog, x, y, d, w, h);
    if (!end) continue;
    const mirror = runRobot(prog.replace(/[LR]/g, (c) => (c === "L" ? "R" : "L")), x, y, d, w, h);
    const short = runRobot(prog.slice(0, -1) || prog, x, y, d, w, h);
    const fmt = (p) => `(${p[0]}, ${p[1]})`;
    const ds = [mirror, short, [end[1], end[0]], [x, y], [end[0] + 1, end[1]], [end[0], end[1] + 1], [end[0] - 1, end[1]]].filter((p) => p && p[0] >= 0 && p[1] >= 0).map(fmt);
    const out = fmt(end);
    if (ds.filter((s) => s !== out).length < 3) continue;
    return gC(`The robot starts at (${x}, ${y}) facing ${DIRS[d]}. F = forward one square, L = turn left 90°, R = turn right 90° (turns happen on the spot). Program: ${shown}. Where does it finish?`, out, ds,
      "Track two things after every command: the square and the direction the robot faces.", `It ends at ${out}, facing ${DIRS[end[2]]}. Turning never moves the robot; only F changes x or y.`,
      pic(gridSvg({ w, h, robot: [x, y, d], axes: true })), pyRobot(prog, x, y, d) + `print(f"({x}, {y})")`);
  }
};

// --- sequences of numbers / patterns (decomposition and generalisation) ---
F.pattern = (o) => {
  const mode = o.mode || pick(["next", "nth", "tiles"]);
  if (mode === "tiles") {
    const a = ri(2, 6), b = ri(1, 5), n = ri(8, 30);
    return gN(`A tile pattern grows the same way each step: step 1 has ${a + b} tiles, step 2 has ${2 * a + b}, step 3 has ${3 * a + b}. How many tiles are in step ${n}?`, a * n + b,
      "How many tiles are added each step? What is left over if you take that many per step away?", `Each step adds ${a}, so step n has ${a} × n + ${b}. Step ${n}: ${a} × ${n} + ${b} = ${a * n + b}. Finding the rule is abstraction: one formula replaces counting every step.`,
      tbl([["step", "1", "2", "3", "…", String(n)], ["tiles", String(a + b), String(2 * a + b), String(3 * a + b), "…", "?"]]), `print(${a} * ${n} + ${b})`);
  }
  if (mode === "nth") {
    const s = ri(1, 20), d = ri(2, 9), n = ri(10, 60);
    return gN(`A list starts ${s}, ${s + d}, ${s + 2 * d}, ${s + 3 * d}, … and keeps adding ${d}. What is item number ${n} (the first item is number 1)?`, s + (n - 1) * d,
      "How many jumps of the same size are there from item 1 to item n?", `From item 1 to item ${n} there are ${n - 1} jumps of ${d}: ${s} + ${n - 1} × ${d} = ${s + (n - 1) * d}.`, null,
      `x = ${s}\nfor i in range(${n - 1}):\n    x += ${d}\nprint(x)`);
  }
  const kind = pick(["add", "double", "square", "fib"]);
  let seq = [], nxt, rule;
  if (kind === "add") { const s = ri(1, 30), d = ri(3, 12); seq = [0, 1, 2, 3, 4].map((i) => s + i * d); nxt = s + 5 * d; rule = `add ${d} each time`; }
  if (kind === "double") { const s = ri(1, 7); seq = [0, 1, 2, 3, 4].map((i) => s * 2 ** i); nxt = s * 32; rule = "double each time"; }
  if (kind === "square") { const s = ri(1, 6); seq = [0, 1, 2, 3, 4].map((i) => (s + i) ** 2); nxt = (s + 5) ** 2; rule = "square numbers: " + (s + 5) + " × " + (s + 5); }
  if (kind === "fib") { const a = ri(1, 4), b = ri(a, 6); seq = [a, b]; while (seq.length < 5) seq.push(seq.at(-1) + seq.at(-2)); nxt = seq[3] + seq[4]; rule = "each item is the sum of the two before it"; }
  const py = kind === "fib" ? `s = ${plist(seq)}\nprint(s[-1] + s[-2])` : kind === "square" ? `print(${Math.sqrt(nxt)} ** 2)` : kind === "double" ? `print(${seq[4]} * 2)` : `print(${seq[4]} + ${seq[1] - seq[0]})`;
  return gN(`What comes next? ${seq.join(", ")}, …`, nxt, "Compare neighbouring items: what is the difference, or the ratio, or the rule that links them?", `The rule: ${rule}. Next: ${nxt}.`, big(seq.join(", ") + ", ?"), py);
};

// --- events: handlers change a score ---
F.events = (o) => {
  const hs = { click: [pick([1, 2, 3, 5]), "+"], key: [2, "*"], tick: [1, "-"] };
  const start = ri(0, 5), evs = []; const n = ri(o.min || 4, o.max || 6);
  for (let i = 0; i < n; i++) evs.push(pick(["click", "click", "key", "tick"]));
  let s = start; for (const e of evs) { const [v, op] = hs[e]; s = op === "+" ? s + v : op === "*" ? s * v : s - v; }
  if (s < 0) return F.events(o);
  const src = `score = ${start}\n\nWHEN clicked:\n    score = score + ${hs.click[0]}\nWHEN key pressed:\n    score = score * 2\nWHEN timer ticks:\n    score = score - 1`;
  return gN(`Events arrive in this order: ${evs.join(", ")}. Each event runs only its own handler (the block written for that event). What is the score at the end?`, s,
    "Process the events one at a time, in the order they arrive, and write the score after each.", `Start ${start}. ` + (() => { let t = start; return evs.map((e) => { const [v, op] = hs[e]; t = op === "+" ? t + v : op === "*" ? t * v : t - v; return `${e} → ${t}`; }).join(", "); })() + `. Order matters: doubling before or after adding gives different results.`,
    code(src, "Event handlers"), `score = ${start}\nfor e in ${plist(evs)}:\n    if e == "click":\n        score += ${hs.click[0]}\n    elif e == "key":\n        score *= 2\n    else:\n        score -= 1\nprint(score)`);
};

// --- conditionals (pseudo or python) ---
F.ifElse = (o) => {
  const py = o.py !== false;
  const x = ri(1, 30), t1 = ri(5, 25), t2 = t1 + ri(2, 8);
  const ws = sample(["cold", "mild", "warm", "low", "medium", "high", "red", "amber", "green"], 3);
  const kind = pick(["chain", "and", "or", "mod"]);
  let src, pysrc, out, ds;
  if (kind === "chain") {
    pysrc = `x = ${x}\nif x < ${t1}:\n    print("${ws[0]}")\nelif x < ${t2}:\n    print("${ws[1]}")\nelse:\n    print("${ws[2]}")`;
    src = py ? pysrc : `SET x TO ${x}\nIF x < ${t1} THEN\n    PRINT "${ws[0]}"\nELSE IF x < ${t2} THEN\n    PRINT "${ws[1]}"\nELSE\n    PRINT "${ws[2]}"`;
    out = x < t1 ? ws[0] : x < t2 ? ws[1] : ws[2];
  } else if (kind === "and") {
    const y = ri(1, 30);
    pysrc = `x = ${x}\ny = ${y}\nif x > ${t1} and y > ${t1}:\n    print("${ws[0]}")\nelse:\n    print("${ws[1]}")`;
    src = py ? pysrc : `SET x TO ${x}\nSET y TO ${y}\nIF x > ${t1} AND y > ${t1} THEN\n    PRINT "${ws[0]}"\nELSE\n    PRINT "${ws[1]}"`;
    out = x > t1 && y > t1 ? ws[0] : ws[1];
  } else if (kind === "or") {
    const y = ri(1, 30);
    pysrc = `x = ${x}\ny = ${y}\nif x > ${t1} or y > ${t2}:\n    print("${ws[0]}")\nelse:\n    print("${ws[1]}")`;
    src = py ? pysrc : `SET x TO ${x}\nSET y TO ${y}\nIF x > ${t1} OR y > ${t2} THEN\n    PRINT "${ws[0]}"\nELSE\n    PRINT "${ws[1]}"`;
    out = x > t1 || y > t2 ? ws[0] : ws[1];
  } else {
    const m = pick([2, 3, 5]);
    pysrc = `x = ${x}\nif x % ${m} == 0:\n    print("${ws[0]}")\nelse:\n    print("${ws[1]}")`;
    src = py ? pysrc : `SET x TO ${x}\nIF x divides exactly by ${m} THEN\n    PRINT "${ws[0]}"\nELSE\n    PRINT "${ws[1]}"`;
    out = x % m === 0 ? ws[0] : ws[1];
  }
  return gC("What does this program print?", out, [...ws, "nothing"], "Test each condition in order with the actual values. Only the first true branch runs.",
    `The first condition that is true decides it, so the program prints ${out}. Every other branch is skipped.`, code(src, py ? "Python" : "Pseudocode"), pysrc);
};

// --- Boolean expressions ---
function boolExpr(vars, depth) {
  if (depth <= 0 || Math.random() < 0.25) { const v = pick(vars); return Math.random() < 0.25 ? { op: "not", a: { v } } : { v }; }
  if (Math.random() < 0.15) return { op: "not", a: boolExpr(vars, depth - 1) };
  return { op: pick(["and", "or"]), a: boolExpr(vars, depth - 1), b: boolExpr(vars, depth - 1) };
}
const showB = (e, up, top = true) => e.v ? e.v : e.op === "not" ? `${up ? "NOT" : "not"} ${e.a.v ? e.a.v : "(" + showB(e.a, up, true) + ")"}` : `${top ? "" : "("}${showB(e.a, up, false)} ${up ? e.op.toUpperCase() : e.op} ${showB(e.b, up, false)}${top ? "" : ")"}`;

const varsIn = (e, s = new Set()) => { if (e.v) s.add(e.v); else { varsIn(e.a, s); if (e.b) varsIn(e.b, s); } return s; };
F.truth = (o) => {
  const vars = o.vars || ["A", "B"], depth = o.depth || 2, mode = o.mode || "row";
  let e; do e = boolExpr(vars, depth); while (varsIn(e).size < Math.min(vars.length, 2) || !e.op);
  const used = vars.filter((v) => varsIn(e).has(v));
  const bits = o.bits; // show 1/0 instead of True/False
  const name = (b) => (bits ? (b ? "1" : "0") : b ? "True" : "False");
  if (mode === "count") {
    let k = 0; const rows = [];
    for (let m = 0; m < 2 ** used.length; m++) { const env = {}; used.forEach((v, i) => (env[v] = !!((m >> (used.length - 1 - i)) & 1))); if (evalB(e, env)) k++; }
    return gN(`In the full truth table of  ${showB(e, true)}  (every combination of ${used.join(", ")}), how many rows give True?`, k,
      `There are ${2 ** used.length} rows. Can you find the rows that make it True without writing every one?`, `Checking all ${2 ** used.length} combinations, exactly ${k} make${k === 1 ? "s" : ""} the expression True.`, big(showB(e, true)),
      `import itertools\nk = 0\nfor ${used.join(", ")} in itertools.product([False, True], repeat=${used.length}):\n    if ${showB(e, false)}:\n        k += 1\nprint(k)`);
  }
  const env = {}; used.forEach((v) => (env[v] = Math.random() < 0.5));
  const val = evalB(e, env);
  const given = used.map((v) => `${v} = ${name(env[v])}`).join(", ");
  return add({ q: `${given}. What is the value of  ${showB(e, true)} ?`, options: [name(true), name(false)], answer: name(val), keepOrder: true,
    hint: "Work from the innermost brackets outward. NOT flips a value; AND needs both; OR needs at least one.", why: `With ${given}, the expression evaluates to ${name(val)}.`,
    py: `${used.map((v) => `${v} = ${env[v] ? "True" : "False"}`).join("\n")}\nprint(${bits ? "int(" : ""}${showB(e, false)}${bits ? ")" : ""})`, out: bits ? (val ? "1" : "0") : val ? "True" : "False" }, big(showB(e, true)));
};

// --- assignment tracing ---
F.assign = (o) => {
  const steps = ri(o.min || 3, o.max || 5);
  for (let t = 0; t < 200; t++) {
    const env = { a: ri(1, 9), b: ri(1, 9) }; const lines = [`a = ${env.a}`, `b = ${env.b}`];
    let c = false;
    for (let i = 0; i < steps; i++) {
      const tgt = pick(["a", "b", "c"]), src1 = pick(c ? ["a", "b", "c"] : ["a", "b"]), src2 = pick(c ? ["a", "b", "c"] : ["a", "b"]);
      const k = pick(["swap", "add", "addk", "mul", "sub"]);
      if (k === "swap" && o.swap) { lines.push(`t = a`, `a = b`, `b = t`); [env.a, env.b] = [env.b, env.a]; continue; }
      if (k === "addk") { const n = ri(1, 9); lines.push(`${tgt} = ${src1} + ${n}`); env[tgt] = env[src1] + n; }
      else if (k === "mul") { const n = ri(2, 3); lines.push(`${tgt} = ${src1} * ${n}`); env[tgt] = env[src1] * n; }
      else if (k === "sub") { lines.push(`${tgt} = ${src1} - ${src2}`); env[tgt] = env[src1] - env[src2]; }
      else { lines.push(`${tgt} = ${src1} + ${src2}`); env[tgt] = env[src1] + env[src2]; }
      if (tgt === "c") c = true;
    }
    const ask = pick(c ? ["a", "b", "c"] : ["a", "b"]);
    if (Object.values(env).some((v) => v < 0 || v > 999)) continue;
    if (lines.filter((l) => l.startsWith(ask + " =")).length < 2 && Math.random() < 0.7) continue;
    if (env.t !== undefined) delete env.t;
    const src = lines.join("\n") + `\nprint(${ask})`;
    return gN(`Trace the program. What does it print?`, env[ask], "Make a trace table: one column per variable, one row per line. A variable keeps only its newest value.",
      `Each assignment replaces the old value; the right-hand side is computed first, using current values. At the end ${ask} = ${env[ask]}.`, code(src), src);
  }
};

// --- trace table of a loop ---
F.traceLoop = (o) => {
  const n = ri(3, o.max || 5), x0 = ri(1, 6), k = pick(["x = x * 2 - i", "x = x + i * i", "x = x * 2 + 1", "x = x + 2 * i + 1", "x = 3 * x - 2 * i"]);
  let x = x0; const rows = [["i", "x after the line"]];
  const f = { "x = x * 2 - i": (x, i) => x * 2 - i, "x = x + i * i": (x, i) => x + i * i, "x = x * 2 + 1": (x) => x * 2 + 1, "x = x + 2 * i + 1": (x, i) => x + 2 * i + 1, "x = 3 * x - 2 * i": (x, i) => 3 * x - 2 * i }[k];
  for (let i = 0; i < n; i++) { x = f(x, i); rows.push([String(i), i < n - 1 && i < 2 ? String(x) : "?"]); }
  if (x > 9999999 || x < 0) return F.traceLoop(o);
  const src = `x = ${x0}\nfor i in range(${n}):\n    ${k}\nprint(x)`;
  return gN(`Complete the trace table in your head. What does the program print?`, x, "i takes the values 0, 1, 2, … up to one less than the number in range. Use the new x each time.",
    `Starting at x = ${x0}: ` + (() => { let t = x0; const s = []; for (let i = 0; i < n; i++) { t = f(t, i); s.push(`i=${i} → ${t}`); } return s.join(", "); })() + `. It prints ${x}.`, code(src), src);
};

// --- loops: counts, sums, outputs ---
const rangeOf = (a, b, s) => { const r = []; if (s > 0) for (let i = a; i < b; i += s) r.push(i); else for (let i = a; i > b; i += s) r.push(i); return r; };
const rangeSrc = (a, b, s) => (s === 1 ? (a === 0 ? `range(${b})` : `range(${a}, ${b})`) : `range(${a}, ${b}, ${s})`);
F.loopCount = (o) => {
  const mode = o.mode || pick(["single", "nested", "tri"]);
  if (o.pseudo) {
    const p = ri(2, 9), q = ri(2, 9), r = ri(2, 5), nest = mode !== "single";
    const src = nest ? `REPEAT ${p} TIMES\n    REPEAT ${q} TIMES\n        draw a star\n    move down one row` : `REPEAT ${p} TIMES\n    draw a star\n    turn right ${r * 10}°`;
    const out = nest ? p * q : p;
    return gN(`How many stars does this program draw?`, out, nest ? "The inner block runs completely every time the outer block runs once." : "The body runs once per repetition.",
      nest ? `The inner loop draws ${q} stars, and it runs ${p} times: ${p} × ${q} = ${out}.` : `One star per repetition: ${p}.`, code(src, "Pseudocode"), nest ? `print(${p} * ${q})` : `print(${p})`);
  }
  if (mode === "single") {
    const s = pick([1, 1, 2, 3, 5]), a = ri(0, 10), b = a + s * ri(2, 12) + (Math.random() < 0.5 ? ri(0, s - 1) : 0);
    const n = rangeOf(a, b, s).length, src = `for i in ${rangeSrc(a, b, s)}:\n    print("Hello")`;
    return gN("How many times does this program print Hello?", n, "range stops BEFORE the end number. List the first few values of i and the last one.",
      `i takes the values ${rangeOf(a, b, s).slice(0, 3).join(", ")}${n > 3 ? ", …, " + rangeOf(a, b, s).at(-1) : ""}: that is ${n} values, so ${n} lines.`, code(src), `print(len(${rangeSrc(a, b, s)}))`);
  }
  if (mode === "nested") {
    const p = ri(2, 9), q = ri(2, 9), src = `for row in range(${p}):\n    for col in range(${q}):\n        print("*", end="")\n    print()`;
    return gN("How many stars does this program print in total?", p * q, "How many stars in one row? How many rows?", `Each row has ${q} stars and there are ${p} rows: ${p} × ${q} = ${p * q}. Nested loops multiply.`, code(src),
      `k = 0\nfor row in range(${p}):\n    for col in range(${q}):\n        k += 1\nprint(k)`);
  }
  const p = ri(3, 12), plus = pick([0, 1]), src = `for row in range(${p}):\n    for col in range(row${plus ? " + 1" : ""}):\n        print("*", end="")\n    print()`;
  const out = plus ? (p * (p + 1)) / 2 : (p * (p - 1)) / 2;
  return gN("This makes a triangle of stars. How many stars in total?", out, "Row 0 has how many stars? Row 1? The last row?", `Rows hold ${plus ? "1, 2, …, " + p : "0, 1, …, " + (p - 1)} stars; their sum is ${out}. (Pairing first with last gives a quick total.)`, code(src),
    `k = 0\nfor row in range(${p}):\n    for col in range(row${plus ? " + 1" : ""}):\n        k += 1\nprint(k)`);
};
F.loopSum = (o) => {
  const s = pick([1, 1, 2, 3]), a = ri(0, 6), b = a + s * ri(3, 8);
  const f = pick(["i", "i * 2", "i * i", "i + 1", "3"]), vals = rangeOf(a, b, s), fn = (i) => ({ i, "i * 2": i * 2, "i * i": i * i, "i + 1": i + 1, 3: 3 })[f];
  const total = sum(vals.map(fn)), src = `total = 0\nfor i in ${rangeSrc(a, b, s)}:\n    total = total + ${f}\nprint(total)`;
  return gN("What does this program print?", total, "List the values of i first. Then add up what each pass contributes.", `i = ${vals.join(", ")}; the pieces added are ${vals.map(fn).join(" + ")} = ${total}.`, code(src), src);
};
F.loopPrint = (o) => {
  const s = pick([1, 2, 3, -1, -2]), a = s > 0 ? ri(0, 8) : ri(8, 15), n = ri(3, 6), b = a + s * n;
  const vals = rangeOf(a, b, s), out = vals.join(" "), src = `for i in ${rangeSrc(a, b, s)}:\n    print(i, end=" ")`;
  const incl = rangeOf(a, b + s, s).join(" "), from0 = s > 0 ? rangeOf(0, b, s).join(" ") : rangeOf(a - s, b, s).join(" ");
  return gC("What does this program print? (end=\" \" keeps the output on one line, separated by spaces.)", out, [incl, from0, rangeOf(a + s, b + s, s).join(" "), rangeOf(a, b - s, s).join(" ")],
    "range(start, stop, step) begins at start, moves by step, and stops BEFORE reaching stop.", `Start at ${a}, step ${s}, stop before ${b}: ${out}.`, code(src), src);
};

// --- Python expressions ---
F.arith = (o) => {
  const kind = o.kind || pick(["div", "mod", "prec", "str", "time"]);
  if (kind === "div" || kind === "mod") {
    const b = ri(2, 9), a = ri(b + 1, 99), op = kind === "div" ? "//" : "%", v = kind === "div" ? Math.floor(a / b) : a % b;
    const src = `print(${a} ${op} ${b})`;
    return gN("What does this print?", v, op === "//" ? "// is whole-number division: how many whole times does it fit?" : "% gives the remainder after whole-number division.", `${a} = ${b} × ${Math.floor(a / b)} + ${a % b}, so ${a} // ${b} = ${Math.floor(a / b)} and ${a} % ${b} = ${a % b}.`, code(src), src);
  }
  if (kind === "time") {
    const sec = ri(61, 599);
    const src = `seconds = ${sec}\nminutes = seconds // 60\nleft = seconds % 60\nprint(minutes * 100 + left)`;
    return gN("This program packs minutes and seconds into one number (minutes, then two digits of seconds). What does it print?", Math.floor(sec / 60) * 100 + (sec % 60), "How many whole minutes are in the seconds? What remains?",
      `${sec} seconds = ${Math.floor(sec / 60)} minutes and ${sec % 60} seconds, so it prints ${Math.floor(sec / 60) * 100 + (sec % 60)}.`, code(src), src);
  }
  if (kind === "prec") {
    const a = ri(2, 9), b = ri(2, 9), c = ri(2, 9), form = pick(["a + b * c", "(a + b) * c", "a * b - c", "a + b // c", "a * (b + c) - a"]);
    const v = { "a + b * c": a + b * c, "(a + b) * c": (a + b) * c, "a * b - c": a * b - c, "a + b // c": a + Math.floor(b / c), "a * (b + c) - a": a * (b + c) - a }[form];
    if (v < 0) return F.arith(o);
    const ex = form.replace(/a/g, a).replace(/b/g, b).replace(/c/g, c), src = `print(${ex})`;
    return gN("What does this print?", v, "Brackets first, then * and // , then + and −, left to right.", `${ex} = ${v}: Python follows the same order of operations as mathematics.`, code(src), src);
  }
  const w = pick(["ab", "Hi", "ok", "na", "zip"]), k = ri(2, 4), mode = pick(["rep", "len", "cat"]);
  if (mode === "rep") return gC("What does this print?", w.repeat(k), [w + k, w.repeat(k + 1), w.repeat(k - 1) || w + w + w + w, `${w} ${w}`], "What does multiplying a string by a whole number do?", `"${w}" * ${k} repeats the text ${k} times: ${w.repeat(k)}.`, code(`print("${w}" * ${k})`), `print("${w}" * ${k})`);
  if (mode === "len") { const s = pick(["computer", "binary", "python", "algorithm", "pixel", "network"]); return gN("What does this print?", s.length, "len counts the characters in a string.", `"${s}" has ${s.length} characters.`, code(`print(len("${s}"))`), `print(len("${s}"))`); }
  const x = ri(1, 9), y = ri(1, 9), src = `x = "${x}"\ny = "${y}"\nprint(x + y)`;
  return gN("Careful: the quotation marks matter. What does this print?", Number(`${x}${y}`), "Are x and y numbers or strings (text)? What does + do to text?", `x and y are strings, so + joins them: "${x}" + "${y}" = "${x}${y}". Without quotes it would be ${x + y}.`, code(src), src);
};

// --- functions ---
F.func = (o) => {
  const kind = o.kind || pick(["one", "two", "nested", "compose", "default"]);
  const a = ri(2, 5), b = ri(1, 9), x = ri(1, 9), y = ri(1, 9);
  let src, v, work;
  if (kind === "one") { src = `def f(n):\n    return n * ${a} + ${b}\n\nprint(f(${x}))`; v = x * a + b; work = `f(${x}) = ${x} × ${a} + ${b} = ${v}`; }
  else if (kind === "two") { src = `def area(w, h):\n    return w * h\n\nprint(area(${x}, ${y}) + ${b})`; v = x * y + b; work = `area(${x}, ${y}) = ${x * y}, and ${x * y} + ${b} = ${v}`; }
  else if (kind === "nested") { src = `def f(n):\n    return n + ${a}\n\nprint(f(f(${x})))`; v = x + 2 * a; work = `f(${x}) = ${x + a}, then f(${x + a}) = ${v}`; }
  else if (kind === "compose") { src = `def double(n):\n    return n * 2\n\ndef plus(n, k):\n    return n + k\n\nprint(double(plus(${x}, ${y})))`; v = 2 * (x + y); work = `plus(${x}, ${y}) = ${x + y}, then double(${x + y}) = ${v}`; }
  else { src = `def bigger(p, q):\n    if p > q:\n        return p\n    return q\n\nprint(bigger(${x}, ${y}) * ${a})`; v = Math.max(x, y) * a; work = `bigger(${x}, ${y}) = ${Math.max(x, y)}, and ${Math.max(x, y)} × ${a} = ${v}`; }
  return gN("What does this program print?", v, "Substitute the arguments for the parameters, compute the return value, then use it where the call was.", `Replace each call by its return value, innermost first: ${work}.`, code(src), src);
};

// --- lists ---
F.listIdx = (o) => {
  const words = o.words !== false && Math.random() < 0.4;
  const n = ri(4, 7), xs = words ? sample(["cat", "dog", "owl", "fox", "elk", "bee", "ant", "yak"], n) : Array.from({ length: n }, () => ri(1, 50));
  const kind = pick(words ? ["idx", "neg", "len"] : ["idx", "neg", "len", "sum2", "last"]);
  const i = ri(0, n - 1), j = ri(0, n - 1);
  let expr, v, ds = [];
  if (kind === "idx") { expr = `xs[${i}]`; v = xs[i]; ds = [xs[i + 1], xs[i - 1]]; }
  else if (kind === "neg") { const k = ri(1, Math.min(3, n)); expr = `xs[-${k}]`; v = xs[n - k]; ds = [xs[k - 1], xs[n - k - 1], xs[n - k + 1]]; }
  else if (kind === "len") { expr = `len(xs)`; v = n; }
  else if (kind === "last") { expr = `xs[len(xs) - 1]`; v = xs[n - 1]; }
  else { expr = `xs[${i}] + xs[${j}]`; v = xs[i] + xs[j]; }
  const src = `xs = ${plist(xs)}\nprint(${expr})`;
  const hint = "Indexes start at 0: xs[0] is the first item. A negative index counts from the end: xs[-1] is the last.";
  const why = kind === "neg" ? `${expr} counts back from the end: xs[-1] is the last item, so ${expr} is item ${n - +expr.slice(4, -1)} (counting from 0): ${v}.` : kind === "len" ? `The list has ${n} items, so ${expr} is ${n}.` : kind === "last" ? `len(xs) is ${n}, so this is xs[${n - 1}], the last item: ${v}.` : kind === "idx" ? `${expr} is the item ${i} step${i === 1 ? "" : "s"} from the start (index 0 is the first item): ${v}.` : `xs[${i}] is ${xs[i]} and xs[${j}] is ${xs[j]}; together ${v}.`;
  if (typeof v === "string") return gC("What does this print?", v, [...ds.filter(Boolean), ...xs], hint, why, code(src), src);

// --- sorting ---
const distinctList = (n, lo = 1, hi = 60) => sample(Array.from({ length: hi - lo + 1 }, (_, i) => lo + i), n);
const pyBubble = `def bubble(xs, passes):\n    xs = xs[:]\n    swaps = 0\n    for p in range(passes):\n        for i in range(len(xs) - 1 - p):\n            if xs[i] > xs[i + 1]:\n                xs[i], xs[i + 1] = xs[i + 1], xs[i]\n                swaps += 1\n    return xs, swaps\n`;
function bubble(xs, passes) { xs = xs.slice(); let swaps = 0; for (let p = 0; p < passes; p++) for (let i = 0; i < xs.length - 1 - p; i++) if (xs[i] > xs[i + 1]) { [xs[i], xs[i + 1]] = [xs[i + 1], xs[i]]; swaps++; } return [xs, swaps]; }

// --- searching ---
const pyBin = `def bsearch(xs, t):\n    lo, hi, k = 0, len(xs) - 1, 0\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        k += 1\n        if xs[mid] == t:\n            return k, xs[mid]\n        if xs[mid] < t:\n            lo = mid + 1\n        else:\n            hi = mid - 1\n    return k, None\n`;

F.search = (o) => {

};

// --- efficiency ---
F.growth = (o) => {
  const kind = o.kind || pick(["pairs", "nested", "double", "log", "compare"]);

// --- data integrity and compression ---
F.parity = (o) => {

// --- AI: learning from examples ---
F.ai = (o) => {

  }

      `pts = ${"[" + pts.map((p) => `(${p[0]}, ${p[1]}, "${p[2]}")`).join(", ") + "]"}\nq = (${q[0]}, ${q[1]})\nd = sorted(pts, key=lambda p: abs(p[0] - q[0]) + abs(p[1] - q[1]))\nv = [p[2] for p in d[:${k}]]\nprint("cat" if v.count("cat") * 2 > ${k} else "dog")`);

// --- passwords ---
F.password = (o) => {
  const kind = o.kind || pick(["count", "time", "compare"]);

};
const sortedCheck = () => {

  const broken = Math.random() < 0.6; if (broken) { const i = ri(0, n - 2); [xs[i], xs[i + 1]] = [xs[i + 1], xs[i]]; }
  const k = xs.slice(0, -1).filter((x, i) => x > xs[i + 1]).length;

};
const passesNeeded = () => {
  const n = ri(5, 7), xs = distinctList(n, 1, 40);

  return gN(`Bubble sort with an early stop repeats full passes until a pass makes no swaps (that last, swap-free pass counts too). How many passes for ${plist(xs)}?`, p, "Do the passes; the final pass only confirms the list is sorted.", `It needs ${p - 1} pass${p - 1 === 1 ? "" : "es"} with swaps, then 1 check pass: ${p}.`, big(plist(xs)),
    `a = ${plist(xs)}\np = 0\nwhile True:\n    sw = False\n    for i in range(len(a) - 1):\n        if a[i] > a[i + 1]:\n            a[i], a[i + 1] = a[i + 1], a[i]\n            sw = True\n    p += 1\n    if not sw:\n        break\nprint(p)`);
};

};

const selPic = () => {

  let r = "", t = "", lab = "";

  ["start", "min 1 → front", "min 3 stays", "pass 3: 5 ↔ 9"].forEach((s, k) => (lab += `<text x='148' y='${54 + k * 66}'>${s}</text>`));

};
const selSwaps = () => {
  const n = ri(5, 7), xs = distinctList(n, 1, 40); let a = xs.slice(), k = 0; const done = [];
  for (let p = 0; p < n - 1; p++) { let m = p; for (let i = p + 1; i < n; i++) if (a[i] < a[m]) m = i; if (m !== p) { done.push(`${a[p]}↔${a[m]}`); [a[p], a[m]] = [a[m], a[p]]; k++; } }
  return gN(`Selection sort swaps only when the minimum is not already in place. How many actual swaps does it make on ${plist(xs)}?`, k, "Do each pass: find the minimum of the unsorted part; swap only if it is not already first.", `${k ? `The real swaps are ${done.join(", ")}: ` : "Every minimum is already in place: "}${k} swap${k === 1 ? "" : "s"} — never more than n − 1, compared with up to n(n − 1)/2 for bubble sort.`, big(plist(xs)),
    `a = ${plist(xs)}\nk = 0\nfor p in range(len(a) - 1):\n    m = p\n    for i in range(p + 1, len(a)):\n        if a[i] < a[m]:\n            m = i\n    if m != p:\n        a[p], a[m] = a[m], a[p]\n        k += 1\nprint(k)`);
};
const countSort = () => {
  const xs = Array.from({ length: ri(8, 12) }, () => ri(0, 4)), v = ri(0, 4);
  const pos = xs.filter((x) => x < v).length;
  return gN(`Counting sort counts how many of each value there are. In ${plist(xs)}, after sorting, at which index does the first ${v} appear? (If there is no ${v}, give the index where it would go.)`, pos, "How many items are smaller than this value? They all come before it.", `${pos === 1 ? "1 item is" : `${pos} items are`} smaller than ${v}, so the first ${v} goes at index ${pos}. No comparisons between items were needed — only counting.`, null, `xs = ${plist(xs)}\nprint(sum(1 for x in xs if x < ${v}))`);
};
const compareCost = () => {
  const n = ri(5, 60), sw = ri(1, 9);
  return gN(`Selection sort always makes n(n − 1)/2 comparisons. If each comparison takes 1 microsecond and each swap ${sw} microseconds, what is the total time in microseconds for n = ${n}, if it makes ${n - 1} swaps?`, (n * (n - 1)) / 2 + sw * (n - 1), "Comparisons first, then swaps; add.", `${(n * (n - 1)) / 2} comparisons + ${n - 1} × ${sw} for swaps = ${(n * (n - 1)) / 2 + sw * (n - 1)}.`, null, `print(${n} * ${n - 1} // 2 + ${sw} * (${n} - 1))`);
};
const stableGen = () => {
  const names = sample(["Ada", "Ben", "Cy", "Di", "Eve", "Fay"], 4).sort(), marks = names.map(() => pick([7, 8, 9]));

};

  main?.style.removeProperty("grid-template-columns");
  if (inner) inner.style.removeProperty("max-height");
  const over = () => host.scrollHeight - host.clientHeight;
  // A ladder of ever stronger measures; stop at the first that fits. Upright screens may give the panel
  // more height ("tall"); landscape phones give it a wider column ("wide").
  const steps = [
    { k: 1 },
    { k: 0.93 },
    { k: 0.86 },
    { k: 0.86, grow: 1 },
    { k: 0.86, grow: 1, dense: true },
    { k: 0.86, grow: 2, dense: true },
    { k: 0.8, grow: 2, dense: true },
    { k: 0.8, grow: 2, dense: true, scroll: true },
    { k: 0.74, grow: 2, dense: true, scroll: true },
  ];
  const upright = singleColumn();
  for (const s of steps) {
    host.style.setProperty("--k", s.k);
    host.classList.toggle("cr-tight", s.k < 0.9);
    host.classList.toggle("cr-dense", !!s.dense);
    if (s.grow && upright) host.style.maxHeight = s.grow > 1 ? "64vh" : "58vh";
    if (s.grow && !upright && main) main.style.gridTemplateColumns = s.grow > 1 ? "minmax(0, 1fr) minmax(260px, 1.45fr)" : "minmax(0, 1.2fr) minmax(260px, 1fr)";
    if (inner) inner.style.removeProperty("max-height");
    let o = over();
    if (o > 1 && s.scroll && inner && sayBox.offsetParent) {
      // Last resort: the explanation scrolls inside the bubble, never the page.
      const lh = parseFloat(getComputedStyle(inner).lineHeight) || 20;
      const room = inner.offsetHeight - o - 2;
      inner.style.maxHeight = `${Math.max(Math.round(lh * 2.2), room)}px`;
      o = over();
    }
    if (o <= 1) break;
  }
  const choiceList = $("[data-list]", host);
  if (over() > 1 && typeof choiceList?._crCompact === "function") {
    const compact = choiceList._crCompact;
    choiceList._crCompact = null;
    if (compact()) return fitPanel();
  }
  fadeCue(inner);
}

function fitStage() {
  const box = $(".cr-show", stage);
  const body = box && $(".cr-body", box);
  if (!body) return;
  const fits = () => body.scrollHeight <= body.clientHeight + 1 && body.scrollWidth <= body.clientWidth + 1;
  box.style.setProperty("--s", 1);
  if (!fits()) {
    let lo = 0.45, hi = 1;
    for (let n = 0; n < 7; n++) {
      const mid = (lo + hi) / 2;
      box.style.setProperty("--s", mid);
      if (fits()) lo = mid;
      else hi = mid;
    }
    box.style.setProperty("--s", lo);
  }
  // A long, flat table (a few rows, many columns) that is still too wide is turned on its side.
  const table = $(".cr-table", body);
  if (table && !table.dataset.turned && body.scrollWidth > body.clientWidth + 1 && table.rows.length < (table.rows[0]?.cells.length || 0)) {
    const grid = [...table.rows].map((r) => [...r.cells]);
    table.dataset.turned = "1";
    table.innerHTML = grid[0].map((_, c) => `<tr>${grid.map((r) => (r[c] ? r[c].outerHTML : "<td></td>")).join("")}</tr>`).join("");
    table.classList.add("cr-turned");
    return fitStage();
  }
  // Still too wide: tighter cells, and long words may hyphenate.
  if (table && !table.classList.contains("cr-squeeze") && body.scrollWidth > body.clientWidth + 1) {
    table.classList.add("cr-squeeze");
    return fitStage();
  }
  fadeCue(body);
}
addEventListener("resize", refit);
if (window.ResizeObserver) new ResizeObserver(() => requestAnimationFrame(fitStage)).observe(stage);
document.fonts?.ready?.then(refit);

// ---------- the stage ----------
// A slide or question picture: big text, emoji row, a small table, a list, bars, a passage, the lesson's own SVG,
// or (for questions without a picture) the question itself. `tag` is the progress label; `q` prints the question
// above a picture so it stays visible while hints are shown.
function show(visual, { tag = "", q = "" } = {}) {
  stage.innerHTML = "";
  const box = document.createElement("div");
  box.className = "cr-show";
  const v = visual || {};
  let html = "";
  if (v.type === "svg") html = `<div class="cr-svg">${v.markup}</div>`;
  else if (v.type === "emoji") html = `<div class="cr-emoji">${esc(v.text)}</div>`;
  else if (v.type === "table")
    html = `<table class="cr-table">${(v.rows || []).map((r, i) => `<tr>${r.map((c) => (i === 0 && v.header !== false ? `<th>${esc(c)}</th>` : `<td>${esc(c)}</td>`)).join("")}</tr>`).join("")}</table>`;
  else if (v.type === "list") html = `<ul class="cr-list">${(v.items || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
  else if (v.type === "bars") {
    const max = Math.max(...(v.values || []).map((x) => x[1]), 1);
    html = `<div class="cr-bars">${(v.values || []).map(([k, n]) => `<div><span style="height:${Math.round((n / max) * 100)}%"></span><b>${esc(n)}</b><small>${esc(k)}</small></div>`).join("")}</div>`;
  } else if (v.type === "passage") html = `<div class="cr-passage">${v.title ? `<h3>${esc(v.title)}</h3>` : ""}${String(v.text || "").split(/\n\n+/).map((p) => `<p>${esc(p)}</p>`).join("")}</div>`;
  else if (v.type === "prompt") html = `<div class="cr-prompt${len(v.text) > 160 ? " cr-long" : ""}">${String(v.text || "").replace(/<(?!\/?b>)[^>]*>/g, "")}</div>`;
  else html = `<div class="cr-big">${esc(v.text || "")}</div>`;
  const question = q ? `<div class="cr-q">${esc(q)}</div>` : "";
  const cap = v.caption ? `<p class="cr-cap">${esc(v.caption)}</p>` : "";
  box.innerHTML = `${tag ? `<p class="cr-tag">${tag}</p>` : ""}<div class="cr-body cr-${v.type || "big"}-body">${question}${html}${cap}</div>`;
  stage.appendChild(box);
  refit();
}

async function learn(lesson, my) {
  const slides = lesson.learn || [];
  let i = 0;
  return new Promise((resolve) => {
    const host = panel(`<div class="kt-steps"><button type="button" class="kt-step-btn" data-back aria-label="Back">◀</button><span class="kt-step-dots" data-dots></span><button type="button" class="kt-step-btn kt-step-next" data-next>Next ▶</button></div>`);
    const render = () => {
      if (my !== token) return;
      const s = slides[i];
      show(s.show);
      $("[data-dots]", host).innerHTML = slides.map((_, k) => `<i class="${k === i ? "on" : k < i ? "seen" : ""}"></i>`).join("") + `<small>Learn ${i + 1} of ${slides.length}</small>`;
      $("[data-back]", host).disabled = i === 0;
      $("[data-next]", host).textContent = i === slides.length - 1 ? "✏️ Practice" : "Next ▶";
      say(`${i === 0 ? `<b>${stop(esc(lesson.title))}</b> ` : ""}${s.say}`);
    };
    host.onclick = (event) => {
      if (event.target.closest("[data-back]") && i > 0) (i -= 1), render();
      else if (event.target.closest("[data-next]")) {
        if (i < slides.length - 1) (i += 1), render();
        else {
          VOICE.hush();
          resolve();
        }
      }
    };
    if (slides.length) render();
    else resolve();
  });
}

// One question; resolves with true if right on the first try.
// Make every attempt different: generator questions build fresh numbers, choices are shuffled.
const shuffled = (list) => {
  const out = [...list];
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
};
function fresh(q) {
  let made = q;
  if (typeof q.gen === "function") {
    try {
      made = { ...q, ...q.gen() };
    } catch (error) {
      console.error("question generator failed", error);
    }
  }
  if (made.options && !made.keepOrder) made = { ...made, options: shuffled(made.options) };
  if (made.items && !made.keepOrder) made = { ...made, items: shuffled(made.items) };
  return made;
}
// Draw a set: keep the first (warm-up) question, sample the rest from the bank, keep easy-to-hard roughly by position.
function drawSet(bank, n) {
  if (bank.length <= n) return bank;
  const picks = new Set([0]);
  while (picks.size < n) picks.add(1 + Math.floor(Math.random() * (bank.length - 1)));
  return [...picks].sort((a, b) => a - b).map((k) => bank[k]);
}

// Choice and ordering lists: short words stay as chips; sentence-length entries become a calm grid of cards.
function listClass(list) {
  const longest = Math.max(0, ...list.map(len));
  const total = list.reduce((a, o) => a + len(o), 0);
  if (longest > 34 || (list.length <= 4 && total > 110)) return "cr-cards cr-wide";
  if (longest > 14 || list.length > 4) return "cr-cards";
  return "";
}

function ask(q0, label, my) {
  const q = fresh(q0);
  return new Promise((resolve) => {
    let tries = 0;
    const type = q.type || (q.options ? "choice" : q.items ? "order" : "number");
    const tag = `${esc(label)}${type === "order" ? ` · <span>tap in order, first to last</span>` : ""}`;
    if (q.show || q.big) show(q.show || { type: "big", text: q.big }, { tag, q: q.q });
    else show({ type: "prompt", text: q.q }, { tag });
    const finish = (right) => {
      if (my !== token) return;
      panel(`<div class="ap-buttons"><button type="button" class="primary" data-go>Next ▶</button></div>`);
      const why = q.why ? `<small>${esc(q.why)}</small>` : "";
      say(right ? `Correct. ${q.why ? esc(q.why) : ""}` : `The answer is <b>${stop(esc(Array.isArray(q.answer) && q.answerText == null ? q.answer.join(" → ") : q.answerText ?? q.answer))}</b> ${why}`);
      $("[data-panel]").onclick = (e) => e.target.closest("[data-go]") && resolve(tries === 1 && right);
    };
    const check = (value) => {
      if (my !== token) return false;
      tries += 1;
      const want = Array.isArray(q.answer) ? q.answer.join("|") : String(q.answer).trim().toLowerCase();
      const got = Array.isArray(value) ? value.join("|") : String(value).trim().toLowerCase();
      if (got === want) {
        MUSIC.chime();
        window.OC?.count("problems solved");
        finish(true);
        return true;
      }
      MUSIC.oops();
      if (tries === 1) say(`Not quite. ${q.hint ? esc(q.hint) : "Reconsider the question carefully."}`);
      else finish(false);
      return false;
    };
    // The question is already on the stage, so the owl reads it aloud with the bubble hidden.
    const prompt = () => say(esc(q.q), { quiet: true });
    if (type === "choice") {
      const host = panel(`<div class="ap-chips cr-choices ${listClass(q.options)}" data-list>${q.options.map((o, k) => `<button type="button" data-c="${k}">${esc(o)}</button>`).join("")}</div>`);
      // If even the tightest layout cannot hold these answers, print them on the stage as A, B, C…
      // (which may scroll there) and keep only large lettered buttons in the panel.
      const letter = (k) => String.fromCharCode(65 + k);
      const choiceList = $("[data-list]", host);
      choiceList._crCompact = () => {
        const list = choiceList, body = $(".cr-body", stage);
        // Only for genuinely long answer sets; short ones always fit the card layout.
        if (!list.isConnected || q.options.reduce((a, o) => a + len(o), 0) < 200) return false;
        if (!list || !body || q.options.length > 8) return false;
        const missed = new Set([...list.querySelectorAll(".cr-miss")].map((b) => b.dataset.c));
        list.className = "ap-chips cr-choices cr-letters";
        list.innerHTML = q.options.map((o, k) => `<button type="button" data-c="${k}" aria-label="${letter(k)}: ${esc(o).replace(/"/g, "&quot;")}" ${missed.has(String(k)) ? `disabled class="cr-miss"` : ""}>${letter(k)}</button>`).join("");
        body.insertAdjacentHTML("beforeend", `<ol class="cr-opts">${q.options.map((o, k) => `<li data-li="${k}" class="${missed.has(String(k)) ? "cr-miss" : ""}"><b>${letter(k)}</b><span>${esc(o)}</span></li>`).join("")}</ol>`);
        return true;
      };
      host.onclick = (e) => {
        const b = e.target.closest("[data-c]");
        if (!b || b.disabled) return;
        const ok = check(q.options[Number(b.dataset.c)]);
        if (!ok && my === token && b.isConnected) {
          b.disabled = true;
          b.classList.add("cr-miss");
          $(`.cr-opts [data-li="${b.dataset.c}"]`, stage)?.classList.add("cr-miss");
        }
      };
    } else if (type === "order") {
      let picked = [];
      const host = panel(`<div class="ap-chips cr-choices cr-ordering ${listClass(q.items)}" data-list></div><div class="ap-buttons cr-undo"><button type="button" data-undo>↺ Start over</button></div>`);
      const list = $("[data-list]", host);
      const draw = () => {
        list.innerHTML = q.items
          .map((o, k) => {
            const at = picked.indexOf(k);
            return `<button type="button" data-o="${k}" ${at >= 0 ? `disabled aria-pressed="true"` : ""}><i>${at >= 0 ? at + 1 : ""}</i><span>${esc(o)}</span></button>`;
          })
          .join("");
        $(".cr-undo", host).style.display = picked.length ? "" : "none";
        refit();
      };
      draw();
      host.onclick = (e) => {
        const b = e.target.closest("[data-o]");
        if (e.target.closest("[data-undo]")) (picked = []), draw();
        else if (b && !b.disabled) {
          picked.push(Number(b.dataset.o));
          draw();
          if (picked.length === q.items.length) {
            const value = picked.map((k) => q.items[k]);
            picked = [];
            if (!check(value) && my === token && list.isConnected) draw();
          }
        }
      };
    } else {
      const host = panel(`<div data-pad></div>`);
      numpad($("[data-pad]", host), { onEnter: (v) => check(v), max: 7 });
    }
    prompt();
  });
}

const units = Object.fromEntries(
  COURSE.lessons.map((lesson, i) => [
    `l${i + 1}`,
    async () => {
      const my = token;
      const id = `l${i + 1}`;
      try {
        await learn(lesson, my);
        if (my !== token) return;
        let first = 0;
        const practice = drawSet(lesson.practice || [], lesson.practiceCount || 12);
        for (let k = 0; k < practice.length; k++) {
          if (await ask(practice[k], `Practice ${k + 1} of ${practice.length}`, my)) first += 1;
          if (my !== token) return;
        }
        const challenge = drawSet(lesson.challenge || [], lesson.challengeCount || 3);
        for (let k = 0; k < challenge.length; k++) {
          say("Challenge problem. Understand it, make a plan, carry it out, then check.");
          await wait(1200);
          if (my !== token) return;
          await ask(challenge[k], `⭐ Challenge ${k + 1} of ${challenge.length}`, my);
          if (my !== token) return;
        }
        shell.mark(id, { done: true, first, of: practice.length });
        show({ type: "big", text: `${first} / ${practice.length}`, caption: "practice problems correct on the first attempt" });
        panel(`<div class="ap-buttons"><button type="button" class="primary" data-explain>🗣️ Explain it</button><button type="button" data-off>📝 Task</button>${lesson.extend ? `<button type="button" data-extend>🚀 Go further</button>` : ""}<button type="button" data-again>↺ Again</button></div>`);
        say(`Lesson complete. Now explain the main idea in your own words.`);
        $("[data-panel]").onclick = (e) => {
          if (e.target.closest("[data-again]")) shell.go(id);
          if (e.target.closest("[data-explain]")) {
            show({ type: "list", items: [`Explain to a grown-up, in 3 or 4 clear sentences, the main idea of "${lesson.title}".`, "Give one example of your own.", "Say one question you still have."] });
            say("Explain the main idea in three or four clear sentences, give an example of your own, and ask one question you still have.");
          }
          if (e.target.closest("[data-extend]")) {
            show({ type: "list", items: [lesson.extend] });
            say(esc(lesson.extend), { quiet: true });
          }
          if (e.target.closest("[data-off]")) {
            show({ type: "list", items: [lesson.offline || "Tell a grown-up what you learned today, in 5 sentences."] });
            say(esc(lesson.offline || "Tell a grown-up what you learned today."), { quiet: true });
          }
        };
      } catch (error) {
        console.error(error);
      }
    },
  ]),
);

const how = Object.fromEntries(UNITS.map((u) => [u.id, { icon: COURSE.icon, title: u.label.replace(/^\d+\.\s*/, ""), steps: ["Learn: study the lesson slides.", "Practice: solve each problem; a first miss gives a hint, a second shows the full reasoning.", "Challenge: contest-level problems. Then explain the main idea in your own words."] }]));
const fromHash = /^#l\d+$/.test(location.hash) && UNITS.some((u) => u.id === location.hash.slice(1)) ? location.hash.slice(1) : null;
const shell = SHELL({
  unitWord: "Lesson",
  units: UNITS,
  how,
  start: fromHash || UNITS[0].id,
  onStop() {
    token += 1;
    $("[data-panel]").onclick = null;
  },
  subject: COURSE.subject,
  activity: COURSE.title,
  onUnit(id) {
    token += 1;

});

// The shell's "turn sideways" tip normally floats at the bottom of the screen, over the answer buttons.
// Here it sits at the foot of the stage (never over a control) and a tap dismisses it.
const placeTip = () => {
  const tip = $(".ap-turn");
  if (!tip) return;
  if (!tip.dataset.placed) {
    tip.dataset.placed = "1";
    tip.classList.add("cr-turn");
    tip.insertAdjacentHTML("beforeend", ` <b aria-hidden="true">✕</b>`);
    tip.setAttribute("role", "button");
    tip.addEventListener("click", () => tip.remove());
  }
  const r = stage.getBoundingClientRect();
  tip.style.bottom = "auto";
  tip.style.top = `${Math.max(4, Math.round(r.bottom - tip.offsetHeight - 10))}px`;
};
placeTip();

.ap-panel.cr-panel>:first-child:not(.cr-quiet),.ap-panel.cr-panel>.cr-quiet+*{margin-top:auto}.ap-panel.cr-panel>:last-child{margin-bottom:auto}
.ap-panel.cr-panel .ap-say{min-height:0;max-height:none;overflow:visible;font-size:max(14px,calc(var(--say) * var(--k)));line-height:1.38;max-width:36em;padding-top:12px;padding-bottom:12px}
.ap-panel.cr-panel .ap-say.cr-quiet{display:none}
.ap-panel.cr-panel .cr-say-in{display:block;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.ap-panel.cr-panel .cr-say-in small{display:block;margin-top:.3em}
.ap-panel.cr-panel.cr-tight .ap-say{padding-top:8px;padding-bottom:8px}

/* answer buttons: short answers are chips; long ones are cards in a grid; ordering shows the position picked */
.ap-panel.cr-panel .cr-choices{width:100%;max-width:52em;gap:8px}
.ap-panel.cr-panel .cr-choices button{min-height:48px;font-size:max(14px,calc(17px * var(--k)));max-width:100%;white-space:normal;line-height:1.25;padding:8px 16px}
.ap-panel.cr-panel .cr-choices.cr-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:calc(8px * var(--k))}
.ap-panel.cr-panel .cr-choices.cr-wide{grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr))}
.ap-panel.cr-panel .cr-choices.cr-cards button{min-height:46px;border-radius:16px;padding:calc(9px * var(--k)) 14px;text-align:center;font-weight:750}
.ap-panel.cr-panel .cr-choices.cr-wide button{text-align:left;line-height:1.3}
.ap-panel.cr-panel.cr-tight .cr-choices.cr-cards button{padding-top:6px;padding-bottom:6px;min-height:44px}
.ap-panel.cr-panel .cr-choices button.cr-miss{opacity:.5;background:#f6e9e4;box-shadow:0 0 0 1px #e4b9a8;text-decoration:line-through;text-decoration-color:rgba(160,70,40,.45)}
.ap-panel.cr-panel .cr-ordering button{display:flex;align-items:center;justify-content:flex-start;gap:10px;text-align:left}
.ap-panel.cr-panel .cr-choices.cr-ordering.cr-cards{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.ap-panel.cr-panel.cr-dense .cr-choices.cr-cards:not(.cr-wide){grid-template-columns:repeat(auto-fit,minmax(min(100%,138px),1fr))}
.ap-panel.cr-panel.cr-dense .cr-choices.cr-ordering.cr-cards:not(.cr-wide) button{padding-left:8px;padding-right:8px;gap:7px}
.ap-panel.cr-panel .cr-ordering button i{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--paper,#f6efe4);box-shadow:inset 0 0 0 2px #e2d6c4;font:900 14px/1 var(--sans);font-style:normal;color:#fff}
.ap-panel.cr-panel .cr-ordering button[aria-pressed="true"]{opacity:1;background:var(--accent-soft);color:var(--ink);box-shadow:0 0 0 2px var(--accent);cursor:default}
.ap-panel.cr-panel .cr-ordering button[aria-pressed="true"] i{background:var(--accent);box-shadow:none}
.ap-panel.cr-panel .cr-ordering.cr-wide button span{flex:1}
.ap-panel.cr-panel .cr-ordering button span{text-align:left}
.ap-panel.cr-panel .cr-undo button{min-height:44px;font-size:15px;padding:0 16px}
@media (max-height:700px),(max-width:420px){.ap-panel.cr-panel .cr-choices.cr-cards button,.ap-panel.cr-panel .cr-ordering button{min-height:44px}.ap-panel.cr-panel .cr-choices{gap:6px}}

.ap-turn.cr-turn{pointer-events:auto;cursor:pointer;width:max-content;max-width:calc(100vw - 32px);white-space:normal;text-align:center;font-size:14px;padding:8px 14px}
.ap-turn.cr-turn b{margin-left:6px;opacity:.7}

/* lettered answers: the full texts on the stage, big A/B/C buttons in the panel */
.cr-opts{list-style:none;margin:0;padding:0;display:grid;gap:calc(8px * var(--s));width:100%;max-width:40em;text-align:left;font:650 max(13.5px,calc(clamp(15px,2vw,19px) * var(--s)))/1.4 var(--sans);color:var(--ink)}
.cr-opts li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:calc(8px * var(--s)) 12px;border-radius:14px;background:var(--accent-soft)}
.cr-opts li b{display:grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;background:var(--accent);color:#fff;font-weight:900}
.cr-opts li.cr-miss{opacity:.45;text-decoration:line-through}
.ap-panel.cr-panel .cr-choices.cr-letters{display:flex;flex-wrap:nowrap;justify-content:center;gap:10px}
.ap-panel.cr-panel .cr-choices.cr-letters button{flex:1 1 0;max-width:110px;min-height:52px;font-size:22px;font-weight:900;text-decoration:none}

/* tap targets stay at least 44 px even on short landscape phones */
.ap-panel.cr-panel .ap-buttons button,.ap-panel.cr-panel .kt-step-btn{min-height:46px}
@media (max-height:460px),(max-width:420px) and (max-height:720px){.ap-panel.cr-panel{--say:15.5px}.ap-panel.cr-panel .kt-keys button{min-height:44px !important}.ap-panel.cr-panel .kt-entry{min-height:40px !important}}
@media (max-height:460px){.ap-panel.cr-panel .ap-buttons button,.ap-panel.cr-panel .kt-step-btn{min-height:44px}.ap-panel.cr-panel .cr-choices button{min-height:44px}.cr-show{padding:8px 10px}.cr-tag{font-size:12.5px;padding:3px 10px}}
`;
document.head.appendChild(style);
</script>
</body>
</html>
