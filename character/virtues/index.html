    const eraAt = (p) => ERAS.find((e, i) => p.x >= 14 + i * 164 && p.x <= 168 + i * 164 && p.y >= 50 && p.y <= 345)?.id;
    const home = (c) => c.g.setAttribute("transform", `translate(${c.g.dataset.x} ${c.g.dataset.y})`);
    const choose = (c) => {
      chips.forEach((o) => o.g.querySelector("rect").setAttribute("stroke-width", 3));
      picked = c;
      if (c) {
        c.g.querySelector("rect").setAttribute("stroke-width", 7);
        talk(`${c.h.short}: ${chipSub(c.h)}. Now tap where it goes on the timeline.`, `${c.h.name}. ${c.h.kind === "bible" ? refSay(c.h.ref) : c.h.sub}. Now tap where it goes on the timeline.`);
      }
    };
    const put = (c, era) => {
      const sl = slots[era];
      const tx = sl.x + 7;
      const ty = 176 + sl.n * 38;
      sl.n += 1;
      const tag = el("g", {}, sl.g);
      el("rect", { x: tx, y: ty, width: 140, height: 34, rx: 17, fill: vv.color }, tag);
      text(tag, tx + 70, ty + 25, c.h.short, { "font-size": 22, fill: "#fff", ...(c.h.short.length > 9 ? { textLength: 128, lengthAdjust: "spacingAndGlyphs" } : {}) });
      c.done = true;
      c.g.setAttribute("opacity", 0);
      c.g.setAttribute("pointer-events", "none");
      placed += 1;
    };
    const why = (h) => (h.kind === "bible" ? `${bookOf(h)} is in ${ERA[h.era].say}.` : `${h.sub.replace("lived ", "He lived ")} is in ${ERA[h.era].say}.`);
    const drop = (c, era) => {
      if (!live(s) || c.done) return;
      window.OC?.touch();
      choose(null);
      if (era === c.h.era) {
        MUSIC.chime();
        put(c, era);
        window.OC?.count("heroes on the timeline");
        if (placed === chips.length) setTimeout(() => live(s) && explainIt(), 2200);
        talk(`Correct. ${c.h.short} goes in ${ERA[era].top}${ERA[era].mid ? " " + ERA[era].mid : ""}. ${why(c.h)}`);
      } else {
        c.tries += 1;
        MUSIC.oops();
        const wrongKind = (c.h.kind === "bible") !== (era.length === 2);
        if (c.tries < 2) {
          if (wrongKind) talk(`${pick(LEARN)} Is ${c.h.short} from the Bible, or from history? Look at the card: ${chipSub(c.h)}.`);
          else if (c.h.kind === "bible") talk(`${pick(LEARN)} Was this before Jesus was born, or in New Testament times, when Jesus and the first Christians lived? Think about the story.`);
          else talk(`${pick(LEARN)} Look at the date: ${c.h.sub}. Which box starts with the same two numbers?`);
        } else {
          put(c, c.h.era);
          talk(`Here is the reasoning. ${c.h.short} goes in ${ERA[c.h.era].top}${ERA[c.h.era].mid ? " " + ERA[c.h.era].mid : ""}. ${why(c.h)}`);
          if (placed === chips.length) setTimeout(() => live(s) && explainIt(), 2600);
        }
      }
    };
    view.addEventListener("pointerdown", (e) => {
      if (!live(s)) return;
      const cg = e.target.closest(".vh-chip");

        try {
          view.setPointerCapture(e.pointerId);
        } catch {}

        return;
      }
      const sg = e.target.closest(".vh-slot");
      if (sg && picked) drop(picked, sg.dataset.era);
    });
    stage.onpointermove = (e) => {
      if (!drag || !live(s)) return;
      const p = toSvg(e);
      if (Math.hypot(p.x - drag.x0, p.y - drag.y0) > 10) drag.moved = true;
      if (drag.moved) drag.c.g.setAttribute("transform", `translate(${p.x - drag.dx} ${p.y - drag.dy})`);
    };
    stage.onpointerup = (e) => {
      if (!drag || !live(s)) return;
      const { c, moved } = drag;
      drag = null;
      if (!moved) return choose(c);
      const era = eraAt(toSvg(e));
      home(c);
      if (era) drop(c, era);
    };
    talk(`Drag each person to the era in which they lived. Scripture is on the left; historical figures are placed by their dates.`);
    status(`Timeline: ${order.length} heroes`);
    actions(act, [["🔁 Listen again", () => live(s) && talk(`Drag each person to the era in which they lived. Scripture is on the left; historical figures are placed by their dates.`)]]);
  };

  const explainIt = () => {
    const s = ++seq;
    let h = order[0];
    setStep("explain");
    status("Explain it");
    stage.onpointermove = stage.onpointerup = null;
    const draw = (showModel) => {
      fresh();
      el("rect", { x: 0, y: 0, width: W, height: H, fill: "#fbf6ee" }, view);
      text(view, 500, 42, "Explain it: choose one person", { "font-size": 28, fill: INK });

        [`1. What did ${h.short} do?`, `2. Why does it show ${vv.name.toLowerCase()} (${vv.def})?`, `3. What did it cost ${h.short}?`].reduce((y, t) => y + 18 + para(view, 52, y, t, { size: 26, max: 64, anchor: "start", weight: 700 }), 304);
      } else {
        text(view, 52, 250, "A model answer (compare it with yours):", { "font-size": 26, fill: vv.color, "text-anchor": "start" });
        para(view, 52, 296, `${h.name} ${h.deed}. This shows ${vv.name.toLowerCase()}: ${h.why} It cost ${COST[h.id]}.`, { size: 25, max: 68, anchor: "start", weight: 700 });

      });

    const prompt = () => {
      talk(`<b>Explain it.</b> In 2–4 sentences, tell a grown-up what ${h.short} did, why it shows ${vv.name.toLowerCase()}, and what it cost.`);
      actions(act, [["Show a model answer", () => live(s) && (draw(true), talk(`Compare the model answer with yours. Did you name the cost?`, `${h.name} ${h.deed}. This shows ${vv.name.toLowerCase()}. ${h.why} It cost ${COST[h.id]}. Did your answer name the cost?`), actions(act, [["Finish ▶", () => live(s) && finish(), true]]))], ["I explained it ▶", () => live(s) && finish(), true]]);
    };
    draw(false);
    prompt();
  };

  const finish = () => {
    const s = ++seq;
    stage.onpointermove = stage.onpointerup = null;
    confetti();
    MUSIC.chime();
    shell.mark(uid, { done: true, [key]: true });
    window.OC?.count("virtues explored");
    status("All done");
    talk(`You studied six examples of <b>${vv.name}</b>, placed them in time, and explained one in your own words. That is careful, thorough work.`);
    actions(act, [["🏠 Try it for real", () => realCard(key), true], ["🔁 Start again", () => live(s) && intro()]]);
  };

  intro();
  return { intro, hero, wwyd, timeline, explainIt };
}

      const card = draw(h);
      const keys = level === "hard" ? Object.keys(V) : Y1;
      const n = { easy: 2, medium: 3, hard: 4 }[level];
      const opts = shuffle([h.v, ...shuffle(keys.filter((k) => k !== h.v && !(h.also || []).includes(k))).slice(0, n - 1)]);
      let tries = 0;
      talk(`${h.name} ${h.deed}. Which virtue does this show?`);
      choices(host, opts.map((k) => ({ label: `${V[k].icon} ${V[k].name}`, v: k })), (o, button) => {
        if (me !== s || my !== token || button.disabled) return;
        window.OC?.touch();
        if (o.v === h.v) {
          button.classList.add("right");
          MUSIC.chime();
          if (level === "hard") {
            talk(`Correct: ${V[h.v].name}.`);
            setTimeout(() => me === s && my === token && reason(h, card), 1400);
          } else {
            talk(`${tries ? "Correct — well reconsidered." : pick(EFFORT)} ${V[h.v].name}. ${h.why}`);
            window.OC?.count("heroes matched");
            next();
          }
        } else {
          tries += 1;
          button.classList.add("wrong");
          button.disabled = true;
          MUSIC.oops();
          if (tries < 2) talk(`${pick(LEARN)} ${V[o.v].name} means ${V[o.v].def}. Is that what ${h.name} did? Look again.`);
          else {
            const i = opts.indexOf(h.v);
            host.querySelector(`[data-c="${i}"]`)?.classList.add("right");
            talk(`Consider it together. This shows ${V[h.v].name}: ${V[h.v].def}. ${h.why}`);
            window.OC?.count("heroes matched");
            next();
          }
        }
      });
    };
    const end = () => {
      ++s;
      confetti();
      MUSIC.chime();
      shell.mark("vh6", { done: true });
      status("All done");
      talk(`You matched ${pool.length} people to the virtues they showed. <b>Explain it:</b> choose one and tell a grown-up, in 2–4 sentences, what the person did, why it fits the virtue, and what it cost them.`);
      host.innerHTML = `<div class="ap-buttons"><button type="button" class="primary" data-real>🏠 Try it for real</button><button type="button" data-again>🔁 Play again</button></div>`;
      host.onclick = (event) => {
        if (event.target.closest("[data-real]")) realCard(level === "hard" ? pick(Y4) : pick(Y1));
        else if (event.target.closest("[data-again]")) start();
      };
    };
    $("[data-levels]").addEventListener("click", (event) => {
      const b = event.target.closest("[data-lv]");
      if (!b) return;
      document.querySelectorAll("[data-lv]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      level = b.dataset.lv;
      shell.mark("vh6", { level });
      window.OC?.touch();
      start();
    });
    start();
  },

  // ---------- 7. My virtue journal (offline) ----------
  vh7() {
    const my = token;
    let key = shell.progress().vh7?.virtue || "honesty";
    const IDEAS = {
      honesty: ["said “I did it” about a mistake", "told the truth when it was hard", "didn't pretend"],
      kindness: ["helped without being asked", "shared something special", "included someone left out"],
      courage: ["tried something new", "spoke up for someone", "told the truth when scared"],
      selfcontrol: ["waited for my turn", "used calm words when cross", "stopped when asked"],
      gratitude: ["said thank you and why", "named 3 good things at bedtime", "made a thank-you card"],
    };
    panel(`<div class="ap-chips" data-virtues>${Y1.map((k) => `<button type="button" data-v="${k}" aria-pressed="${k === key}">${V[k].icon} ${V[k].name}</button>`).join("")}</div><div class="ap-buttons"><button type="button" class="primary" data-real>🏠 Try it for real</button></div>`);
    const draw = () => {
      const vv = V[key];
      fresh();
      el("rect", { x: 0, y: 0, width: W, height: H, fill: "#efe4d2" }, view);
      el("rect", { x: 60, y: 18, width: 880, height: 524, rx: 18, fill: "#fffdf7", stroke: "#c9b8a1", "stroke-width": 4 }, view);
      for (let i = 0; i < 9; i++) el("circle", { cx: 82, cy: 52 + i * 56, r: 10, fill: "#efe4d2", stroke: "#a8946f", "stroke-width": 3 }, view);
      text(view, 520, 70, "📓 My Virtue Journal", { "font-size": 34, fill: INK });
      text(view, 130, 122, "This week I showed", { "font-size": 28, fill: INK, "text-anchor": "start" });
      emoji(view, 432, 112, vv.icon, 40);
      text(view, 462, 122, vv.name, { "font-size": 34, fill: vv.color, "text-anchor": "start" });
      el("rect", { x: 130, y: 150, width: 380, height: 360, rx: 18, fill: "#fff", stroke: vv.color, "stroke-width": 4, "stroke-dasharray": "14 10" }, view);
      text(view, 320, 320, "✏️ Draw yourself", { "font-size": 28, fill: MUTED });
      text(view, 320, 356, "showing it here", { "font-size": 28, fill: MUTED });
      text(view, 540, 182, "I showed it when I…", { "font-size": 26, fill: INK, "text-anchor": "start" });
      for (let i = 0; i < 3; i++) el("line", { x1: 540, x2: 910, y1: 232 + i * 46, y2: 232 + i * 46, stroke: "#c9d6e8", "stroke-width": 3 }, view);
      text(view, 540, 380, "Ideas:", { "font-size": 24, fill: vv.color, "text-anchor": "start" });
      IDEAS[key].forEach((t, i) => text(view, 550, 418 + i * 36, `• ${t}`, { "font-size": 22, fill: INK, "text-anchor": "start", "font-weight": 700 }));
      talk(`Your virtue journal. This week, watch for a moment when you show <b>${vv.name}</b>. Draw it on paper, then explain it in 2–4 sentences: what happened, and what it cost you.`);
    };
    const host = $("[data-panel]");
    host.onclick = (event) => {
      if (my !== token) return;
      const b = event.target.closest("[data-v]");
      if (b) {
        key = b.dataset.v;
        document.querySelectorAll("[data-v]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
        shell.mark("vh7", { virtue: key });
        window.OC?.touch();
        draw();
      } else if (event.target.closest("[data-real]")) {
        window.OC?.count("journal pages started");
        shell.mark("vh7", { done: true, virtue: key });
        const vv = V[key];
        REAL.journal = {
          title: `Draw yourself showing ${vv.name}`,
          need: "a notebook or paper, crayons or pencils",
          steps: [`This week, watch for a time you show ${vv.name.toLowerCase()}: ${vv.def}.`, "Draw yourself doing it. Put the day at the top.", "Tell a grown-up what happened. They can write your words: I showed it when I…", "If you got it wrong one day, that's OK: name it, understand it, repair it, forgive."],
          safe: "Show your grown-up. You can pray and thank God together.",
        };
        realCard("journal");
      }
    };
    draw();
  },
};
for (const [uid, key] of Object.entries(UNIT_OF))
  units[uid] = () => {
    const my = token;
    panel(`<div class="ap-row"><div class="ap-chips" data-steps><button type="button" data-step="heroes">📖 Heroes</button><button type="button" data-step="you">🤔 You</button><button type="button" data-step="line">🧭 Timeline</button><button type="button" data-step="explain">✍️ Explain</button></div><p class="ap-status" data-status></p></div><div data-act></div>`);

// ---------- 8. Bigger virtues (Year 4 preview) ----------
units.vh8 = () => {

  runVirtue("vh8", key, my);
};
