<script>// Bible Stories: the Bible as one big story, a shelf of read-aloud stories, memory verses,
// the order of the books, a map of where stories happened, and prayer in your own words.
// Stories are retold in our own words. Scripture quotes are from the World English Bible (public domain).
const { $, el, svg: makeSvg, text, panel, say, pick, wait, confetti, choices, explain, everyday, emoji, shuffle } = KIT;
const stage = $("[data-stage]");
const W = 1000;
const H = 560;
const INK = "#2b1d12";
const LINE = "#5a4130";
let token = 0;
let view = null;
let uid = 0;

const UNITS = [
  { id: "b0", label: "See it", icon: "👀" },
  { id: "b1", label: "1. Story shelf", icon: "📚" },
  { id: "b2", label: "2. Memory verses", icon: "💬" },
  { id: "b3", label: "3. Books in order", icon: "📖" },
  { id: "b4", label: "4. Bible map", icon: "🗺️" },
  { id: "b5", label: "5. Prayer in my own words", icon: "🙏" },
];

// ---------- speech and small helpers ----------
const clean = (html) => html.replace(/<[^>]+>/g, " ").replace(/[\p{Extended_Pictographic}\u{FE0F}\u{200D}]/gu, "").replace(/_{3,}/g, " blank ");
const talk = (html, spoken) => {
  say(html, { voice: false });
  VOICE.speak(clean(spoken ?? html));
};
const talkAsync = (html, spoken) => {
  say(html, { voice: false });
  return VOICE.speakAsync(clean(spoken ?? html));
};
const EFFORT = ["Correct. You listened carefully.", "Correct. You thought it through.", "Correct. Your persistence paid off.", "Correct. You remembered precisely.", "Correct. Careful reasoning.", "Correct. You took your time, and it showed."];
const LEARN = ["Not quite. Consider this:", "Not quite. Look again:", "Not yet. Mistakes are how we learn. Consider:"];

function fresh() {
  stage.innerHTML = "";
  view = makeSvg(`0 0 ${W} ${H}`, stage);
  view.style.overflow = "hidden";
  defs(view);
  return view;
}
function defs(v) {
  const d = el("defs", {}, v);
  const g = el("radialGradient", { id: "bi-glow" }, d);
  el("stop", { offset: "0", "stop-color": "#fffbe6", "stop-opacity": 1 }, g);
  el("stop", { offset: "0.55", "stop-color": "#ffe9a3", "stop-opacity": 0.55 }, g);
  el("stop", { offset: "1", "stop-color": "#ffe9a3", "stop-opacity": 0 }, g);
}
const tween = (ms, fn, alive) =>
  new Promise((resolve) => {
    if (KIT.still.matches) {
      fn(1);
      return resolve(true);
    }
    const t0 = performance.now();
    const frame = (now) => {
      if (!alive()) return resolve(false);
      const t = Math.min(1, (now - t0) / ms);
      fn(t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
      if (t < 1) requestAnimationFrame(frame);
      else resolve(true);
    };
    requestAnimationFrame(frame);
  });
function wrap(str, max) {
  const out = [];
  for (const w of String(str).split(" ")) {
    const last = out[out.length - 1];
    if (last && (last + " " + w).length <= max) out[out.length - 1] = last + " " + w;
    else out.push(w);
  }
  return out;
}
function para(parent, x, y, str, { size = 28, max = 28, lh = 1.25, fill = INK, anchor = "middle", weight = 800 } = {}) {
  const ls = wrap(str, max);
  ls.forEach((l, i) => text(parent, x, y + i * size * lh, l, { "font-size": size, fill, "text-anchor": anchor, "font-weight": weight }));
  return ls.length * size * lh;
}
const status = (s) => {
  const b = $("[data-status]");
  if (b) b.textContent = s;
};
const LEVELS = [["easy", "🐣 Easy"], ["medium", "🦊 Medium"], ["hard", "🦁 Hard"]];
const levelRow = (cur) => `<div class="ap-row"><div class="ap-chips" data-levels>${LEVELS.map(([k, l]) => `<button type="button" data-lv="${k}" aria-pressed="${k === cur}">${l}</button>`).join("")}</div><p class="ap-status" data-status></p></div>`;
const onLevels = (id, fn) =>
  $("[data-levels]")?.addEventListener("click", (event) => {
    const b = event.target.closest("[data-lv]");
    if (!b) return;
    document.querySelectorAll("[data-lv]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    shell.mark(id, { level: b.dataset.lv });
    window.OC?.touch();
    fn(b.dataset.lv);
  });

// One best answer: a Socratic hint after the first miss, the answer and WHY after the second.
function quiz(my, host, options, { right, hint, onDone }) {
  let tries = 0;
  let over = false;
  choices(host, options, (o, button) => {
    if (my !== token || over || button.disabled) return;
    window.OC?.touch();
    if (o.v === right) {
      over = true;
      button.classList.add("right");
      MUSIC.chime();
      onDone(tries === 0, false);
    } else {
      tries += 1;
      button.classList.add("wrong");
      button.disabled = true;
      MUSIC.oops();
      if (tries >= 2) {
        over = true;
        const i = options.findIndex((x) => x.v === right);
        host.querySelector(`[data-c="${i}"]`)?.classList.add("right");
        onDone(false, true);
      } else talk(`${pick(LEARN)} ${hint}`);
    }
  });
}
function buttons(host, list) {
  host.innerHTML = `<div class="ap-buttons">${list.map(([k, label, primary]) => `<button type="button" data-b="${k}"${primary ? ' class="primary"' : ""}>${label}</button>`).join("")}</div>`;
  const map = Object.fromEntries(list.map(([k, , , fn]) => [k, fn]));
  host.onclick = (event) => {
    const b = event.target.closest("[data-b]");
    if (b && map[b.dataset.b]) {
      window.OC?.touch();
      map[b.dataset.b]();
    }
  };
}
function realCard({ title, need, steps, safe = "Do this with a grown-up." }) {
  document.querySelector(".bi-real")?.remove();
  VOICE.hush();
  const box = document.createElement("div");
  box.className = "bi-real";
  box.innerHTML = `<div class="bi-real-card" role="dialog" aria-label="Try it for real"><h2>🏠 Try it for real</h2><h3>${title}</h3><p><b>You need:</b> ${need}</p><ol>${steps.map((s) => `<li>${s}</li>`).join("")}</ol><p class="bi-safe">👪 ${safe}</p><button type="button" class="kt-go" data-close-real>✓ OK</button></div>`;
  document.body.appendChild(box);
  VOICE.speak(clean(`Try it for real. ${title}. You need: ${need}. ${steps.join(" ")} ${safe}`));
  box.addEventListener("click", (event) => {
    if (event.target === box || event.target.closest("[data-close-real]")) {
      VOICE.hush();
      box.remove();
    }
  });
}

const biStyle = document.createElement("style");
biStyle.textContent = `

@media (prefers-reduced-motion:reduce){.bi-bob,.bi-rock,.bi-tw,.bi-pulse,.bi-rain,.bi-wave,.bi-flick,.bi-wind,.bi-glowpick{animation:none}}
@media (max-height:460px),(max-width:420px) and (max-height:720px){.bi-col .kt-choices button{min-height:40px;font-size:14.5px;padding:4px 12px}.bi-word .kt-choices button{min-height:44px;min-width:80px;font-size:17px}.bi-real-card{font-size:15px;padding:12px 16px}.bi-real-card .kt-go{min-height:46px}}
`;
document.head.appendChild(biStyle);

// ---------- people ----------
const SKIN = ["#c58c5c", "#b07a4f", "#d39d6e", "#a86f45"];
function person(parent, x, y, o = {}) {
  const s = (o.s ?? 1) * (o.kid ? 0.68 : 1);
  const g = el("g", { transform: `translate(${x} ${y - (o.lie ? 34 * s : 0)}) rotate(${o.lie ? -84 : 0}) scale(${o.flip ? -s : s} ${s})` }, parent);
  const skin = o.skin || SKIN[0];
  const robe = o.r || "#7a9cc6";
  const hair = o.hair || (o.old ? "#dcd7cd" : "#3b2516");
  const P = (d, a = {}) => el("path", { d, ...a }, g);
  if (o.glow) el("circle", { cx: 0, cy: -110, r: 130, fill: "url(#bi-glow)", class: "bi-pulse" }, g);
  if (o.angel) {
    P("M-18 -112 Q-120 -190 -104 -52 Q-70 -78 -20 -66Z", { fill: "#fff", stroke: "#e6c66a", "stroke-width": 3 });
    P("M18 -112 Q120 -190 104 -52 Q70 -78 20 -66Z", { fill: "#fff", stroke: "#e6c66a", "stroke-width": 3 });
  }
  if (o.cloth) P("M-31 -150 Q-39 -100 -27 -93 L27 -93 Q39 -100 31 -150Z", { fill: o.cloth, stroke: LINE, "stroke-width": 2.5 });
  else if (o.nemes) P("M-32 -152 L-42 -96 L42 -96 L32 -152Z", { fill: "#f2c94c", stroke: "#2f5fb3", "stroke-width": 4, "stroke-dasharray": "7 6" });
  else if (o.w || o.bob) P(o.bob ? "M-30 -150 L-32 -112 L32 -112 L30 -150Z" : "M-28 -150 Q-37 -104 -24 -98 L24 -98 Q37 -104 28 -150Z", { fill: hair });
  const robePath = "M-40 0 L-27 -112 Q0 -124 27 -112 L40 0 Q0 8 -40 0Z";
  P(robePath, { fill: robe, stroke: LINE, "stroke-width": 3, "stroke-linejoin": "round" });
  if (o.stripes) {
    const id = `bi-c${++uid}`;
    const cp = el("clipPath", { id }, g);
    el("path", { d: robePath }, cp);
    const band = el("g", { "clip-path": `url(#${id})` }, g);
    const cols = ["#e53935", "#f2c94c", "#43a047", "#1e88e5", "#8e24aa", "#fb8c00"];
    for (let i = 0; i < 7; i++) el("rect", { x: -44, y: -126 + i * 19, width: 88, height: 10, fill: cols[i % 6], opacity: 0.9 }, band);
    P(robePath, { fill: "none", stroke: LINE, "stroke-width": 3 });
  }
  if (o.armour) {
    el("rect", { x: -30, y: -112, width: 60, height: 62, rx: 12, fill: "#c9a15a", stroke: LINE, "stroke-width": 3 }, g);
    for (let i = 0; i < 3; i++) el("line", { x1: -26, x2: 26, y1: -96 + i * 16, y2: -96 + i * 16, stroke: "#9b7a3e", "stroke-width": 3 }, g);
  }
  if (o.sash) P("M-25 -110 L32 -42 L22 -32 L-31 -98Z", { fill: o.sash, opacity: 0.9 });
  el("rect", { x: -33, y: -64, width: 66, height: 8, rx: 3, fill: o.belt || "#8a5a2b" }, g);
  // arms
  const ARMS = { down: [[-36, -50], [36, -50]], up: [[-50, -178], [50, -178]], out: [[-74, -112], [74, -112]], pray: [[-4, -96], [4, -96]], hold: [[-36, -50], [52, -84]], wave: [[-36, -50], [54, -178]], carry: [[-36, -166], [36, -166]], staff: [[-36, -50], [50, -100]] };
  const pose = o.arms || (o.staff ? "staff" : "down");
  const ends = ARMS[pose];
  [-1, 1].forEach((side, i) => {
    const [hx, hy] = ends[i];
    const sx = side * 22;
    const d = pose === "pray" ? `M${sx} -104 L${side * 30} -66 L${hx} ${hy}` : `M${sx} -104 L${hx} ${hy}`;
    P(d, { fill: "none", stroke: LINE, "stroke-width": 20, "stroke-linecap": "round", "stroke-linejoin": "round" });
    P(d, { fill: "none", stroke: robe === "#ffffff" || robe === "#fbf7ee" ? "#f4efe2" : robe, "stroke-width": 14, "stroke-linecap": "round", "stroke-linejoin": "round" });
  });
  ends.forEach(([hx, hy]) => el("circle", { cx: hx, cy: hy, r: 8.5, fill: skin, stroke: LINE, "stroke-width": 2 }, g));
  if (o.staff) {
    const up = pose === "up";
    el("path", { d: up ? "M50 -112 L50 -262 Q50 -284 68 -276" : "M52 -4 L52 -196 Q52 -218 70 -210", fill: "none", stroke: "#7a4f26", "stroke-width": 7, "stroke-linecap": "round" }, g);
  }
  if (o.horn) emoji(g, 38, -132, "📯", 42);
  // head
  el("rect", { x: -8, y: -122, width: 16, height: 12, fill: skin }, g);
  el("circle", { cx: 0, cy: -142, r: 25, fill: skin, stroke: LINE, "stroke-width": 2.5 }, g);
  if (o.beard) P("M-24 -140 Q-24 -106 0 -102 Q24 -106 24 -140 Q14 -126 0 -127 Q-14 -126 -24 -140Z", { fill: o.beard === true ? hair : o.beard });
  if (o.sleep) {
    P("M-14 -146 Q-9 -142 -4 -146", { fill: "none", stroke: INK, "stroke-width": 2.5 });
    P("M4 -146 Q9 -142 14 -146", { fill: "none", stroke: INK, "stroke-width": 2.5 });
  } else [-9, 9].forEach((ex) => el("circle", { cx: ex, cy: -146, r: 3.3, fill: INK }, g));
  [-15, 15].forEach((cx) => el("circle", { cx, cy: -135, r: 5, fill: "#e88a7a", opacity: 0.35 }, g));
  if (o.mouth === "o") el("ellipse", { cx: 0, cy: -129, rx: 5, ry: 6, fill: INK }, g);
  else P(o.sad ? "M-8 -126 Q0 -133 8 -126" : "M-9 -132 Q0 -124 9 -132", { fill: "none", stroke: INK, "stroke-width": 2.5, "stroke-linecap": "round" });
  // top of head
  if (o.cloth) {
    P("M-30 -140 Q-31 -179 0 -179 Q31 -179 30 -140 Q16 -160 0 -161 Q-16 -160 -30 -140Z", { fill: o.cloth, stroke: LINE, "stroke-width": 2.5 });
    P("M-29 -153 Q0 -165 29 -153", { fill: "none", stroke: o.band || "#8a5a2b", "stroke-width": 4 });
  } else if (o.nemes) P("M-31 -142 Q-31 -179 0 -179 Q31 -179 31 -142 Q16 -160 0 -161 Q-16 -160 -31 -142Z", { fill: "#f2c94c", stroke: "#2f5fb3", "stroke-width": 3 });
  else if (o.helmet) {
    P("M-29 -146 Q-29 -182 0 -182 Q29 -182 29 -146Z", { fill: "#b08a4f", stroke: LINE, "stroke-width": 3 });
    P("M-4 -182 Q0 -204 18 -200", { fill: "none", stroke: "#c0392b", "stroke-width": 8, "stroke-linecap": "round" });
  } else P(o.bob ? "M-27 -138 Q-29 -173 0 -172 Q29 -173 27 -138 L22 -152 Q0 -160 -22 -152Z" : "M-25 -140 Q-28 -172 0 -170 Q28 -172 25 -140 Q20 -156 0 -158 Q-20 -156 -25 -140Z", { fill: hair });
  if (o.bob) P("M-26 -158 Q0 -168 26 -158", { fill: "none", stroke: "#f2c94c", "stroke-width": 4 });
  if (o.crown) P("M-20 -164 L-20 -186 L-10 -173 L0 -190 L10 -173 L20 -186 L20 -164Z", { fill: "#f2c94c", stroke: "#b8860b", "stroke-width": 2.5, "stroke-linejoin": "round" });
  return g;
}
const CAST = {
  adam: { r: "#8fbf6a", beard: true }, eve: { r: "#e7a3b5", w: true, hair: "#5a3420", skin: SKIN[2] },
  noah: { r: "#8a6a4f", cloth: "#e6d3a8", beard: "#e8e4dc", old: true }, wife: { r: "#c27c4e", w: true, cloth: "#e8c07a", skin: SKIN[2] },

  jacob: { r: "#6b7d4a", cloth: "#e6d3a8", beard: "#e8e4dc", old: true }, joseph: { r: "#e05a47", stripes: true },
  bro: { r: "#8a7a5a", cloth: "#c9b48a", beard: true, skin: SKIN[1] }, pharaoh: { r: "#f6f1e4", nemes: true, skin: SKIN[3], belt: "#2f5fb3" },
  moses: { r: "#b5651d", cloth: "#e6d3a8", beard: true, staff: true }, mom: { r: "#5b8bc4", w: true, cloth: "#9cc0e6", skin: SKIN[1] },
  miriam: { r: "#d98b3a", w: true, kid: true, skin: SKIN[1] }, princess: { r: "#ffffff", bob: true, hair: "#1f1a17", skin: SKIN[3], belt: "#f2c94c" },

// ---------- backgrounds ----------
function backdrop(v, kind) {
  const g = el("g", {}, v);
  const R = (a) => el("rect", a, g);
  const C = (a) => el("circle", a, g);
  const E = (a) => el("ellipse", a, g);
  const P = (d, a) => el("path", { d, ...a }, g);
  const sky = (fill) => R({ x: 0, y: 0, width: W, height: H, fill });
  const ground = (fill, y = 430) => R({ x: 0, y, width: W, height: H - y, fill });
  const hills = (fill, y = 430) => {
    E({ cx: 180, cy: y + 10, rx: 320, ry: 110, fill });
    E({ cx: 780, cy: y + 20, rx: 380, ry: 130, fill });
  };
  const sunAt = (x, y, r = 44) => C({ cx: x, cy: y, r, fill: "#ffd34d" });
  const starsIn = (n, y0 = 20, y1 = 320) => {
    const sg = el("g", { class: "bi-tw" }, g);
    for (let i = 0; i < n; i++) el("circle", { cx: (i * 397 + 31) % 1000, cy: y0 + ((i * 131) % (y1 - y0)), r: 1.6 + (i % 3), fill: "#fff", opacity: 0.85 }, sg);
  };
  const houses = (y = 430, tint = 0) => {
    const cols = ["#ead2a8", "#e3c494", "#f0dcb6", "#dcbc8a"];
    for (let i = 0; i < 9; i++) {
      const h = 70 + ((i * 47) % 70);
      const x = i * 115 - 20;
      R({ x, y: y - h, width: 100, height: h, rx: 4, fill: cols[(i + tint) % 4], stroke: "#c9a77c", "stroke-width": 2 });
      R({ x: x + 36, y: y - h + 18, width: 24, height: 22, rx: 3, fill: "#8a6a4f", opacity: 0.7 });
    }
  };
  switch (kind) {
    case "dark":
      sky("#1f2547");
      starsIn(18, 20, 540);
      break;
    case "garden":
      sky("#e3f5fb");
      sunAt(900, 80);
      hills("#b9e19a");
      ground("#a9d98a");
      for (const [x, y, c] of [[70, 300, "#7fbf5f"], [930, 310, "#6fb35a"], [820, 280, "#8cc56f"]]) {
        R({ x: x - 10, y: y + 40, width: 20, height: 100, rx: 6, fill: "#8a6a4f" });
        C({ cx: x, cy: y, r: 62, fill: c });
      }
      for (let i = 0; i < 14; i++) C({ cx: 40 + i * 70, cy: 520 + (i % 2) * 16, r: 7, fill: ["#f48fb1", "#fff176", "#ffffff", "#ce93d8"][i % 4] });
      break;
    case "day":
      sky("#dff1fb");
      sunAt(880, 84);
      hills("#cde8b3");
      ground("#bfe0a0");
      break;
    case "hills":
      sky("#e3f2fb");
      E({ cx: 250, cy: 470, rx: 420, ry: 200, fill: "#bfe0a0" });
      E({ cx: 820, cy: 480, rx: 400, ry: 170, fill: "#a9d38a" });
      ground("#b5da95", 450);
      break;
    case "night":
      sky("#2c3e6b");
      starsIn(40, 20, 380);
      C({ cx: 860, cy: 90, r: 40, fill: "#fff3c4" });
      C({ cx: 878, cy: 78, r: 36, fill: "#2c3e6b" });
      E({ cx: 250, cy: 470, rx: 420, ry: 140, fill: "#3b5a6e" });
      ground("#3e5a5a", 440);
      break;
    case "rain":
      sky("#9aa7b8");
      for (const x of [150, 450, 780]) E({ cx: x, cy: 70, rx: 170, ry: 60, fill: "#7d8a9c" });
      break;
    case "sea":
      sky("#dff1fb");
      sunAt(860, 90);
      R({ x: 0, y: 330, width: W, height: 230, fill: "#7cc3e8" });
      for (const y of [380, 440, 500]) P(`M0 ${y}q50 -14 100 0t100 0t100 0t100 0t100 0t100 0t100 0t100 0t100 0t100 0t100 0`, { stroke: "#bfe3f5", "stroke-width": 4, fill: "none" });
      break;
    case "shore":
      sky("#dff1fb");
      P("M0 420 Q300 400 560 430 L1000 430 L1000 560 L0 560Z", { fill: "#7cc3e8" });
      P("M0 410 Q240 380 470 420 Q420 470 0 470Z", { fill: "#bfe0a0" });
      R({ x: 0, y: 460, width: W, height: 100, fill: "#e8d3a0" });
      for (const x of [600, 800]) P(`M${x} 448q20 -10 40 0t40 0`, { stroke: "#fff", "stroke-width": 4, fill: "none", opacity: 0.8 });
      break;
    case "storm":
      sky("#5b6b86");
      for (const x of [120, 420, 760]) E({ cx: x, cy: 60, rx: 190, ry: 64, fill: "#45536b" });
      R({ x: 0, y: 390, width: W, height: 170, fill: "#3e6f94" });
      break;
    case "lake":
      sky("#e6f3fb");
      E({ cx: 200, cy: 330, rx: 360, ry: 110, fill: "#b8d8a2" });
      E({ cx: 820, cy: 330, rx: 330, ry: 90, fill: "#a6cf8f" });
      R({ x: 0, y: 320, width: W, height: 240, fill: "#8fc9e6" });
      for (const x of [100, 420, 760]) P(`M${x} 380q20 -10 40 0t40 0`, { stroke: "#fff", "stroke-width": 4, fill: "none", opacity: 0.7 });
      break;
    case "hillside":
      sky("#e6f3fb");
      R({ x: 0, y: 260, width: W, height: 70, fill: "#8fc9e6" });
      P("M0 300 Q500 250 1000 300 L1000 560 L0 560Z", { fill: "#b5da95" });
      break;
    case "desert":
      sky("#fbe9c8");
      sunAt(860, 90);
      E({ cx: 200, cy: 450, rx: 400, ry: 100, fill: "#f0d6a2" });
      E({ cx: 800, cy: 460, rx: 380, ry: 90, fill: "#e9cb8e" });
      ground("#efd49b", 440);
      break;
    case "egypt":
      sky("#fbe9c8");
      sunAt(880, 90);
      P("M560 430 L700 230 L840 430Z", { fill: "#e5c07f", stroke: "#c9a05a", "stroke-width": 3 });
      P("M760 430 L860 290 L960 430Z", { fill: "#ddb46e", stroke: "#c9a05a", "stroke-width": 3 });
      ground("#efd49b", 430);
      break;
    case "river":
      sky("#e9f6fb");
      R({ x: 0, y: 220, width: W, height: 80, fill: "#cfe3a3" });
      R({ x: 0, y: 290, width: W, height: 190, fill: "#7cc0e0" });
      for (const x of [140, 460, 760]) P(`M${x} 360q20 -10 40 0t40 0`, { stroke: "#d6eef9", "stroke-width": 4, fill: "none" });
      R({ x: 0, y: 470, width: W, height: 90, fill: "#b9d98d" });
      break;
    case "palace":
      sky("#f1dfbd");
      for (const x of [60, 300, 640, 880]) {
        R({ x: x - 26, y: 60, width: 52, height: 380, fill: "#e9cf9c", stroke: "#c9a77c", "stroke-width": 3 });
        R({ x: x - 40, y: 46, width: 80, height: 22, rx: 6, fill: "#d9b77a" });
      }
      R({ x: 0, y: 30, width: W, height: 18, fill: "#c9a77c" });
      ground("#d9b98a", 440);
      break;
    case "prison":
      sky("#cbbfae");
      for (let r = 0; r < 8; r++) for (let c = 0; c < 9; c++) R({ x: c * 120 - (r % 2) * 60, y: r * 58, width: 116, height: 54, rx: 6, fill: "none", stroke: "#b3a691", "stroke-width": 3 });
      R({ x: 420, y: 70, width: 160, height: 120, rx: 10, fill: "#9fd3ef", stroke: "#8a7764", "stroke-width": 6 });
      for (const x of [452, 484, 516, 548]) R({ x, y: 70, width: 7, height: 120, fill: "#5a4c40" });
      ground("#a8997f", 450);
      break;
    case "city":
      sky("#e3f0f9");
      sunAt(880, 70, 36);
      houses(430);
      ground("#dcc6a3", 430);
      break;
    case "temple":
      sky("#e7f1f8");
      R({ x: 160, y: 120, width: 680, height: 320, fill: "#f3e3c0", stroke: "#c9a77c", "stroke-width": 4 });
      P("M130 125 L500 40 L870 125Z", { fill: "#e6cf9f", stroke: "#c9a77c", "stroke-width": 4 });
      for (let i = 0; i < 7; i++) R({ x: 196 + i * 98, y: 150, width: 34, height: 290, fill: "#fbf3e1", stroke: "#d9c49a", "stroke-width": 3 });
      ground("#e2cfa9", 440);
      break;
    case "room":
      sky("#f4e4c8");
      R({ x: 700, y: 90, width: 170, height: 150, rx: 80, fill: "#cfe9f7", stroke: "#c9a77c", "stroke-width": 8 });
      ground("#d7b48a", 440);
      break;
    case "nightroom":
      sky("#3f4a6e");
      R({ x: 700, y: 90, width: 170, height: 150, rx: 80, fill: "#24305a", stroke: "#6b6f8e", "stroke-width": 8 });
      for (let i = 0; i < 5; i++) C({ cx: 730 + i * 28, cy: 130 + (i % 2) * 40, r: 2.5, fill: "#fff" });
      ground("#2f3755", 440);
      break;
    case "dawn":
      sky("#ffe6c4");
      R({ x: 0, y: 0, width: W, height: 160, fill: "#ffd3a8", opacity: 0.7 });
      sunAt(500, 420, 80);
      hills("#cfe4b0", 440);
      ground("#bfdca0", 450);
      break;
    case "dusk":
      sky("#e9c2ab");
      R({ x: 0, y: 0, width: W, height: 200, fill: "#c9a3b8", opacity: 0.6 });
      E({ cx: 500, cy: 520, rx: 560, ry: 170, fill: "#8f8a72" });
      ground("#7f7a63", 470);
      break;
    case "den":
      sky("#8d7b68");
      for (let i = 0; i < 18; i++) E({ cx: (i * 233) % 1000, cy: 40 + ((i * 97) % 380), rx: 60, ry: 34, fill: "#7e6c5a", opacity: 0.7 });
      E({ cx: 500, cy: 18, rx: 120, ry: 42, fill: "#ffe9a3" });
      ground("#a8927a", 450);
      break;
    case "deep":
      sky("#2f6f8f");
      R({ x: 0, y: 0, width: W, height: 120, fill: "#4c93b4" });
      for (let i = 0; i < 16; i++) C({ cx: (i * 271) % 1000, cy: 140 + ((i * 113) % 380), r: 4 + (i % 4) * 2, fill: "none", stroke: "#bfe3f5", "stroke-width": 2, opacity: 0.7 });
      ground("#c9b48a", 500);
      break;
    case "mountain":
      sky("#dfe7f1");
      P("M120 450 L500 110 L880 450Z", { fill: "#a08a74", stroke: "#86705b", "stroke-width": 4 });
      ground("#d9c49a", 440);
      break;
    case "field":
      sky("#e3f2fb");
      sunAt(880, 80);
      ground("#f0d27a", 340);
      for (let i = 0; i < 40; i++) {
        const x = (i * 113) % 1000;
        const y = 360 + ((i * 59) % 190);
        P(`M${x} ${y} l0 -34`, { stroke: "#c99a2e", "stroke-width": 3 });
        E({ cx: x, cy: y - 38, rx: 5, ry: 11, fill: "#d9a93a" });
      }
      break;
    case "valley":
      sky("#e3f2fb");
      E({ cx: 80, cy: 520, rx: 360, ry: 260, fill: "#b8d8a2" });
      E({ cx: 920, cy: 520, rx: 360, ry: 260, fill: "#a6cf8f" });
      ground("#c9dfa0", 470);
      P("M380 560 Q470 500 520 470 Q600 430 640 400", { stroke: "#8fc9e6", "stroke-width": 16, fill: "none", "stroke-linecap": "round" });
      break;
    case "road":
      sky("#e9f2f8");
      E({ cx: 200, cy: 420, rx: 340, ry: 140, fill: "#d8c7a0" });
      E({ cx: 820, cy: 420, rx: 360, ry: 120, fill: "#cdb88c" });
      ground("#d9c49a", 430);
      P("M0 520 Q300 470 520 480 T1000 450 L1000 500 Q700 520 500 530 T0 560Z", { fill: "#eadcb8" });
      break;
    default:
      sky("#fbf6ee");
  }
  return g;
}

// ---------- props (x, y is the bottom centre unless noted) ----------
const PROPS = {
  sun(g, x, y, s) {
    const r = el("g", { class: "bi-pulse" }, g);
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      el("line", { x1: x + Math.cos(a) * 58 * s, y1: y + Math.sin(a) * 58 * s, x2: x + Math.cos(a) * 80 * s, y2: y + Math.sin(a) * 80 * s, stroke: "#ffcf3f", "stroke-width": 6, "stroke-linecap": "round" }, r);
    }
    el("circle", { cx: x, cy: y, r: 46 * s, fill: "#ffd34d" }, g);
  },
  moon(g, x, y, s) {
    el("circle", { cx: x, cy: y, r: 40 * s, fill: "#fff3c4" }, g);
    el("circle", { cx: x + 18 * s, cy: y - 12 * s, r: 36 * s, fill: "#2c3e6b" }, g);
  },
  stars(g, x, y, s, o = {}) {
    const sg = el("g", { class: "bi-tw" }, g);
    const n = o.n || 30;
    for (let i = 0; i < n; i++) {
      const cx = (o.x0 ?? 0) + ((i * 397 + 53) % (o.w ?? 1000));
      const cy = 20 + ((i * 151) % (o.h ?? 320));
      const r = (i % 4) + 3;
      el("path", { d: `M${cx} ${cy - r * 2}L${cx + r * 0.6} ${cy - r * 0.6}L${cx + r * 2} ${cy}L${cx + r * 0.6} ${cy + r * 0.6}L${cx} ${cy + r * 2}L${cx - r * 0.6} ${cy + r * 0.6}L${cx - r * 2} ${cy}L${cx - r * 0.6} ${cy - r * 0.6}Z`, fill: "#fff6c8" }, sg);
    }
  },
  cloud(g, x, y, s, o = {}) {
    const c = el("g", { class: "bi-bob" }, g);
    const fill = o.grey ? "#9aa3b0" : "#fff";
    for (const [dx, dy, r] of [[-60, 0, 40], [0, -20, 54], [60, 0, 40], [0, 10, 46]]) el("circle", { cx: x + dx * s, cy: y + dy * s, r: r * s, fill }, c);
  },
  light(g, x, y, s) {
    const l = el("g", { class: "bi-pulse" }, g);
    for (let i = -3; i <= 3; i++) el("path", { d: `M${x} ${y}L${x + i * 90 * s - 40 * s} ${y + 560}L${x + i * 90 * s + 40 * s} ${y + 560}Z`, fill: "#fff3c0", opacity: 0.35 }, l);
    el("circle", { cx: x, cy: y + 30, r: 140 * s, fill: "url(#bi-glow)" }, l);
  },
  tree(g, x, y, s, o = {}) {
    el("rect", { x: x - 16 * s, y: y - 170 * s, width: 32 * s, height: 170 * s, rx: 8, fill: "#8a6a4f" }, g);
    for (const [dx, dy, r] of [[-60, -190, 70], [60, -190, 70], [0, -240, 84], [0, -170, 70]]) el("circle", { cx: x + dx * s, cy: y + dy * s, r: r * s, fill: o.c || "#6fb35a" }, g);
    if (o.fruit) for (const [dx, dy] of [[-70, -200], [40, -250], [70, -170], [-20, -160], [-30, -260], [10, -200]]) el("circle", { cx: x + dx * s, cy: y + dy * s, r: 11 * s, fill: o.fruit, stroke: "#8a3a2a", "stroke-width": 1.5 }, g);
  },
  bush(g, x, y, s) {
    for (const [dx, dy, r] of [[-70, -40, 50], [0, -60, 64], [70, -40, 50], [0, -20, 60]]) el("circle", { cx: x + dx * s, cy: y + dy * s, r: r * s, fill: "#5fa34a" }, g);
  },
  ark(g, x, y, s, o = {}) {
    const a = el("g", o.bob ? { class: "bi-bob" } : {}, g);
    const k = el("g", { transform: `translate(${x} ${y}) scale(${s})` }, a);
    el("path", { d: "M-260 -110 L260 -110 L210 0 L-210 0Z", fill: "#a8743f", stroke: "#6e4524", "stroke-width": 5, "stroke-linejoin": "round" }, k);
    for (let i = 1; i < 4; i++) el("line", { x1: -250 + i * 10, x2: 250 - i * 10, y1: -110 + i * 27, y2: -110 + i * 27, stroke: "#8a5a2b", "stroke-width": 3 }, k);
    if (!o.build) {
      el("rect", { x: -150, y: -210, width: 300, height: 100, fill: "#c9935a", stroke: "#6e4524", "stroke-width": 5 }, k);
      el("path", { d: "M-175 -210 L0 -270 L175 -210Z", fill: "#8a5a2b", stroke: "#6e4524", "stroke-width": 5, "stroke-linejoin": "round" }, k);
      for (const wx of [-110, -40, 30, 100]) el("rect", { x: wx, y: -186, width: 34, height: 30, rx: 5, fill: "#5a3a20" }, k);
    } else {
      for (let i = -2; i <= 2; i++) el("rect", { x: i * 60 - 6, y: -230, width: 12, height: 120, fill: "#c9935a", stroke: "#6e4524", "stroke-width": 3 }, k);
    }
  },
  water(g, x, y) {
    el("rect", { x: 0, y, width: W, height: H - y, fill: "#6aa6cc" }, g);
    const w = el("g", { class: "bi-wave" }, g);
    for (let i = 0; i < 3; i++) el("path", { d: `M-40 ${y + 30 + i * 50}q50 -16 100 0t100 0t100 0t100 0t100 0t100 0t100 0t100 0t100 0t100 0t100 0`, stroke: "#a9d3ec", "stroke-width": 5, fill: "none" }, w);
  },
  rain(g) {
    const r = el("g", { class: "bi-rain" }, g);
    for (let i = 0; i < 70; i++) {
      const x = (i * 149) % 1040;
      const y = ((i * 83) % 600) - 40;
      el("line", { x1: x, y1: y, x2: x - 8, y2: y + 30, stroke: "#dbe9f5", "stroke-width": 3, "stroke-linecap": "round", opacity: 0.8 }, r);
    }
  },
  rainbow(g, x, y, s) {
    ["#e53935", "#fb8c00", "#fdd835", "#43a047", "#1e88e5", "#8e24aa"].forEach((c, i) => {
      const r = (380 - i * 26) * s;
      el("path", { d: `M${x - r} ${y} A${r} ${r} 0 0 1 ${x + r} ${y}`, fill: "none", stroke: c, "stroke-width": 26 * s, opacity: 0.85 }, g);
    });
  },
  tent(g, x, y, s) {
    el("path", { d: `M${x - 120 * s} ${y} L${x} ${y - 150 * s} L${x + 120 * s} ${y}Z`, fill: "#c9a77c", stroke: LINE, "stroke-width": 3, "stroke-linejoin": "round" }, g);
    el("path", { d: `M${x - 30 * s} ${y} L${x} ${y - 90 * s} L${x + 30 * s} ${y}Z`, fill: "#6e4f34" }, g);
    for (let i = 1; i < 4; i++) el("line", { x1: x - 120 * s + i * 30 * s, x2: x - 120 * s + i * 30 * s + 8, y1: y - i * 38 * s, y2: y - i * 38 * s + 6, stroke: "#a8865c", "stroke-width": 3 }, g);
  },
  pyramid(g, x, y, s) {
    el("path", { d: `M${x - 150 * s} ${y} L${x} ${y - 190 * s} L${x + 150 * s} ${y}Z`, fill: "#e5c07f", stroke: "#c9a05a", "stroke-width": 3 }, g);
  },
  grain(g, x, y, s) {
    for (const dx of [-60, 0, 60]) {
      el("path", { d: `M${x + dx * s - 28 * s} ${y} Q${x + dx * s - 34 * s} ${y - 70 * s} ${x + dx * s} ${y - 80 * s} Q${x + dx * s + 34 * s} ${y - 70 * s} ${x + dx * s + 28 * s} ${y}Z`, fill: "#e0c48f", stroke: LINE, "stroke-width": 3 }, g);
      el("line", { x1: x + dx * s - 14 * s, x2: x + dx * s + 14 * s, y1: y - 72 * s, y2: y - 72 * s, stroke: "#8a5a2b", "stroke-width": 4 }, g);
    }
  },

function phrases(part, k) {
  let pieces = (part.match(/[^,;:.!?]+[,;:.!?]*[”’]*\s*/g) || [part]).map((s) => s.trim()).filter(Boolean);
  const wc = (s) => s.split(" ").length;
  while (pieces.length > k) {
    let best = 0;
    for (let i = 1; i < pieces.length - 1; i++) if (wc(pieces[i]) + wc(pieces[i + 1]) < wc(pieces[best]) + wc(pieces[best + 1])) best = i;
    pieces.splice(best, 2, pieces[best] + " " + pieces[best + 1]);
  }
  while (pieces.length < k) {
    let li = -1;
    pieces.forEach((p, i) => {
      if (wc(p) >= 4 && (li < 0 || wc(p) > wc(pieces[li]))) li = i;
    });
    if (li < 0) break;
    const ws = pieces[li].split(" ");
    const mid = Math.ceil(ws.length / 2);
    pieces.splice(li, 1, ws.slice(0, mid).join(" "), ws.slice(mid).join(" "));
  }
  return pieces;
}

  b1() {
    const my = token;
    const alive = () => my === token;
    let level = shell.progress().b1?.level || "medium";
    panel(`<div data-top></div><div class="bi-col" data-choices></div>`);
    const top = $("[data-top]");
    const host = $("[data-choices]");
    const readList = () => shell.progress().b1?.read || [];
    const shelf = () => {
      if (!alive()) return;
      top.innerHTML = levelRow(level);
      onLevels("b1", (lv) => {
        level = lv;
        shelf();
      });
      host.innerHTML = "";
      host.onclick = null;
      fresh();
      el("rect", { x: 0, y: 0, width: W, height: H, fill: "#fbf6ee" }, view);
      const read = readList();
      STORIES.forEach((s, i) => {
        const c = i % 6;
        const r = Math.floor(i / 6);
        const x = 14 + c * 164;
        const y = 10 + r * 137;
        const nt = i >= NT_FROM;
        const g = el("g", { class: "bi-book bi-tap", "data-i": i }, view);
        el("rect", { x, y, width: 152, height: 127, rx: 18, fill: nt ? "#e5e7ff" : "#f6e7c8", stroke: nt ? "var(--accent)" : "#c9a77c", "stroke-width": 3 }, g);
        emoji(g, x + 76, y + 44, s.cover, 50);
        text(g, x + 76, y + 108, SHORT[i], { "font-size": 22, fill: INK });
        if (read.includes(i)) {
          el("circle", { cx: x + 134, cy: y + 18, r: 15, fill: "#22a05a" }, g);
          text(g, x + 134, y + 26, "✓", { "font-size": 22, fill: "#fff" });
        }
      });
      view.addEventListener("pointerdown", (event) => {
        const b = event.target.closest(".bi-book");
        if (b && alive()) {
          window.OC?.touch();
          MUSIC.play("harp", 67, { gain: 0.3 });
          tell(Number(b.dataset.i), 0);
        }
      });
      status(`${read.length} of ${STORIES.length} stories read`);
      talk("The shelf runs in Bible order: the Old Testament in gold, the New Testament in blue. <b>Tap a story to begin.</b>");
    };
    const tell = (si, p) => {
      if (!alive()) return;
      const s = STORIES[si];
      const [t, bg, d, extra] = s.pages[p];
      top.innerHTML = "";
      fresh();
      drawScene(view, { bg, d, ...(extra || {}) }, alive);
      const cap = el("g", {}, view);
      el("rect", { x: 300, y: 516, width: 400, height: 36, rx: 18, fill: "#fff", opacity: 0.85 }, cap);
      text(cap, 500, 542, `${s.t} · ${p + 1} of ${s.pages.length}`, { "font-size": 22, fill: LINE });
      talk(`<small>${s.ref}</small> ${t}`, t);
      const last = p === s.pages.length - 1;
      buttons(host, [
        ["shelf", "📚 Shelf", false, shelf],
        ...(p > 0 ? [["back", "◀", false, () => tell(si, p - 1)]] : []),
        ["next", last ? (level === "easy" ? "Questions ▶" : "📜 Read it ▶") : "Next ▶", true, () => {
          MUSIC.play("harp", 67 + p * 2, { gain: 0.25 });
          if (!last) tell(si, p + 1);
          else if (level === "easy") ask(si, 0, 0);
          else reading(si);
        }],
      ]);
    };
    const reading = (si) => {
      const s = STORIES[si];
      fresh();
      const verses = s.read.flatMap(([ref, only]) => [{ ref }, ...web(ref, only).map(([n, t]) => ({ n, t }))]);
      const str = verses.map((v) => (v.ref ? "" : `${v.n} ${v.t}`)).filter(Boolean).join(" ");
      el("rect", { x: 20, y: 14, width: 960, height: 532, rx: 26, fill: "#fffaf0", stroke: "#e0cfa9", "stroke-width": 3 }, view);
      const refs = s.read.map(([r, only]) => (only ? `${r.split(":")[0]}:${only.join(", ")}` : r)).join("; ").replace(/(\d)-(\d)/g, "$1–$2");
      text(view, 500, 56, refs, { "font-size": 26, fill: "var(--accent-dark)" });
      let size = 30;
      let lines;
      do {
        lines = wrap(str, Math.floor(880 / (size * 0.58)));
        if (lines.length * size * 1.3 <= 440) break;
        size -= 1;
      } while (size > 22);
      lines.forEach((l, i) => text(view, 50, 100 + i * size * 1.3, l, { "font-size": size, fill: INK, "text-anchor": "start", "font-weight": 600, "font-family": "Georgia, 'Times New Roman', serif" }));
      text(view, 960, 538, "World English Bible", { "font-size": 22, fill: "#8a7764", "text-anchor": "end", "font-weight": 600 });
      talk(`Read the passage yourself, slowly. Then answer the questions. <small>(Yahweh is God's personal name; many Bibles print it as “the LORD”.)</small>`);
      buttons(host, [
        ["hear", "🔊 Read it aloud", false, () => VOICE.speak(`${refs.replace(/–/g, " to ")}. ${verses.filter((v) => !v.ref).map((v) => v.t).join(" ")}`)],
        ["go", "Questions ▶", true, () => ask(si, 0, 0)],
      ]);
    };
    const qList = (si) => {
      const s = STORIES[si];
      const qs = level === "easy" ? [s.q[0], s.q[2]] : [...s.q];
      if (level === "hard") {
        // Other Gospels can tell the same event (the storm, the 5,000, Easter), so never offer one as a wrong answer.
        const others = shuffle([...new Set(STORIES.map((x) => x.book))].filter((b) => b !== s.book && !(GOSPELS.includes(s.book) && GOSPELS.includes(b)))).slice(0, 2);
        const nt = si >= NT_FROM;
        qs.push([`In which book of the Bible is “${s.t}” found?`, s.book, others[0], others[1], `Is this story before Jesus (Old Testament) or about Jesus and the church (New Testament)?`, `It is in ${s.book}, in the ${nt ? "New" : "Old"} Testament (${s.ref}).`]);
      }
      return qs;
    };
    const ask = (si, qi, firsts) => {
      if (!alive()) return;
      const s = STORIES[si];
      const qs = qList(si);
      if (qi >= qs.length) return explainIt(si, firsts, qs.length);
      const [q, right, w1, w2, hint, why] = qs[qi];
      fresh();
      const lastPage = s.pages[s.pages.length - 1];
      drawScene(view, { bg: lastPage[1], d: lastPage[2] }, alive);
      el("rect", { x: 0, y: 0, width: W, height: H, fill: "#fff", opacity: 0.35 }, view);
      const cap = el("g", {}, view);
      el("rect", { x: 330, y: 516, width: 340, height: 36, rx: 18, fill: "#fff", opacity: 0.9 }, cap);
      text(cap, 500, 542, `Question ${qi + 1} of ${qs.length}`, { "font-size": 22, fill: LINE });
      const opts = shuffle([right, w1, ...(level === "easy" ? [] : [w2])]).map((x) => ({ label: x, v: x }));
      talk(`<b>${q}</b>`, `${q} ${opts.map((o) => o.label).join(". Or: ")}`);
      quiz(my, host, opts, {
        right,
        hint,
        onDone(first, revealed) {
          window.OC?.count("Bible questions answered");
          talk(`${first ? "Correct — and here is why:" : revealed ? "Here is the answer, and why:" : "Correct on the second attempt. Here is why:"} ${why}`);
          setTimeout(() => alive() && buttons(host, [["n", qi + 1 < qs.length ? "Next question ▶" : "Explain it ▶", true, () => ask(si, qi + 1, firsts + (first ? 1 : 0))]]), 500);
        },
      });
    };
    const explainIt = (si, firsts, total) => {
      const s = STORIES[si];
      const [prompt, model] = s.ex;
      fresh();
      el("rect", { x: 30, y: 20, width: 940, height: 520, rx: 28, fill: "#fff", stroke: "var(--accent)", "stroke-width": 5 }, view);
      text(view, 500, 78, "💬 Explain it", { "font-size": 38, fill: "var(--accent-dark)" });
      para(view, 500, 132, prompt, { size: 30, max: 50, weight: 800 });
      talk(`${firsts} of ${total} correct on the first attempt. Now <b>explain it</b> out loud to a grown-up, in 2 to 4 sentences.`, `${firsts} of ${total} correct on the first attempt. Now explain it out loud to a grown-up, in two to four sentences. ${prompt}`);
      const done = () => finishStory(si);
      buttons(host, [
        ["model", "📝 Compare with a model answer", false, () => {
          const g = el("g", {}, view);
          el("rect", { x: 60, y: 300, width: 880, height: 220, rx: 20, fill: "var(--accent-soft)" }, g);
          text(g, 500, 340, "A model answer", { "font-size": 24, fill: "var(--accent-dark)" });
          para(g, 500, 378, model, { size: 23, max: 72, weight: 700 });
          talk("Compare your explanation with this one. What did you include that it does not? What did it include that you missed?", `A model answer. ${model}`);
        }],
        ["done", "✓ I explained it", true, done],
      ]);
    };
    const finishStory = (si) => {
      if (!alive()) return;
      const s = STORIES[si];
      const read = readList();
      shell.mark("b1", { done: true, read: read.includes(si) ? read : [...read, si] });
      window.OC?.count("Bible stories read");
      confetti();
      MUSIC.chime();
      fresh();
      backdrop(view, "dawn");
      el("rect", { x: 160, y: 60, width: 680, height: 250, rx: 28, fill: "#fff", stroke: "var(--accent)", "stroke-width": 5 }, view);
      emoji(view, 500, 130, s.cover, 80);
      text(view, 500, 230, s.t, { "font-size": 38, fill: INK });
      text(view, 500, 276, `Theme: ${s.theme}`, { "font-size": 26, fill: "var(--accent-dark)" });
      talk(`You read <b>${s.t}</b> (${s.ref}), studied the Scripture, and explained it in your own words. Thorough work.`);
      buttons(host, [
        ["real", "🏠 Try it for real", true, () => realCard({ title: `Retell ${s.t}`, need: "a few toys or household objects, and a listener", steps: ["Retell the story in your own words, in the right order.", "Explain where it fits in the Bible's big story: which promise or theme does it show?", "Ask your listener the Explain-it question and discuss your answers."], safe: "Do this with a grown-up. You may finish by praying together." })],
        ["shelf", "📚 Shelf", false, shelf],
      ]);
    };
    shelf();
  },

  b2() {
    const my = token;
    const alive = () => my === token;
    panel(`<div data-top></div><div class="bi-word" data-choices></div>`);
    const top = $("[data-top]");
    const host = $("[data-choices]");
    const stars = () => shell.progress().b2?.stars || {};
    const giveStar = (vid, game) => {
      const all = stars();
      const mine = new Set(all[vid] || []);
      mine.add(game);
      all[vid] = [...mine];
      const full = Object.values(all).some((x) => x.length >= 3);
      shell.mark("b2", { stars: all, ...(full ? { done: true } : {}) });
    };
    const menu = () => {
      if (!alive()) return;
      top.innerHTML = `<p class="ap-status" data-status></p>`;
      host.innerHTML = "";
      host.onclick = null;
      fresh();
      el("rect", { x: 0, y: 0, width: W, height: H, fill: "#fbf6ee" }, view);
      const st = stars();
      VERSES.forEach((v, i) => {
        const x = 30 + (i % 3) * 320;
        const y = 24 + Math.floor(i / 3) * 266;
        const g = el("g", { class: "bi-vcard bi-tap", "data-i": i }, view);
        el("rect", { x, y, width: 300, height: 246, rx: 24, fill: "#fff", stroke: "var(--accent)", "stroke-width": 4 }, g);
        el("circle", { cx: x + 150, cy: y + 72, r: 50, fill: "var(--accent-soft)" }, g);
        emoji(g, x + 150, y + 72, v.icon, 56);
        text(g, x + 150, y + 162, v.ref, { "font-size": 28, fill: INK });
        const got = (st[v.id] || []).length;
        text(g, x + 150, y + 214, "★".repeat(got) + "☆".repeat(3 - got), { "font-size": 34, fill: "#e0a800" });
      });
      view.addEventListener("pointerdown", (event) => {
        const c = event.target.closest(".bi-vcard");
        if (c && alive()) {
          window.OC?.touch();
          home(Number(c.dataset.i));
        }
      });
      status("Earn a star for each game: missing word, order, first letters");
      talk("Choose a passage to memorise. Each passage has three games, and each game earns a star.");
    };
    const showText = (v, hi = -1) => {
      fresh();
      el("rect", { x: 20, y: 14, width: 960, height: 532, rx: 26, fill: "#fffaf0", stroke: "#e0cfa9", "stroke-width": 3 }, view);
      text(view, 500, 58, `${v.ref} (WEB)`, { "font-size": 30, fill: "var(--accent-dark)" });
      const parts = partsOf(v);
      const total = parts.reduce((n, p) => n + p.t.length, 0);
      const size = total > 500 ? 23 : total > 300 ? 27 : 32;
      let y = 104;
      const max = Math.floor(880 / (size * 0.58));
      parts.forEach((p, i) => {
        const ls = wrap(`${p.n} ${p.t}`, max);
        ls.forEach((l, j) => text(view, 50, y + j * size * 1.28, l, { "font-size": size, fill: i === hi ? "var(--accent-dark)" : INK, "text-anchor": "start", "font-weight": i === hi ? 800 : 600, "font-family": "Georgia, 'Times New Roman', serif" }));
        y += ls.length * size * 1.28 + 4;
      });
    };
    const home = (vi) => {
      if (!alive()) return;
      const v = VERSES[vi];
      showText(v);
      top.innerHTML = "";
      talk(`<b>${v.ref}.</b> ${v.about}`);
      buttons(host, [
        ["back", "◀", false, menu],
        ["hear", "🔊 Listen", false, () => listen(vi)],
        ["miss", "🔤 Missing word", true, () => missing(vi)],
        ["order", "🧩 Order", true, () => order(vi)],
        ["first", "🅰️ First letters", true, () => letters(vi)],
      ]);
    };
    const listen = async (vi) => {
      const v = VERSES[vi];
      const parts = partsOf(v);
      for (let i = 0; i < parts.length; i++) {
        if (!alive()) return;
        showText(v, i);
        await talkAsync(`Listen, then say it back: <i>${parts[i].t}</i>`, parts[i].t);
        if (!alive()) return;
        await wait(1600);
      }
      if (alive()) home(vi);
    };
    const backRow = (vi) => `<button type="button" class="ap-btn" data-home aria-label="Back to passage">◀</button>`;
    const gameFrame = (vi) => {
      top.innerHTML = `<div class="bi-row">${backRow(vi)}<p class="ap-status" data-status></p></div>`;
      top.querySelector("[data-home]").onclick = () => home(vi);
    };
    const finishGame = (vi, game, msg) => {
      giveStar(VERSES[vi].id, game);
      window.OC?.count("verse games");
      confetti();
      MUSIC.chime();
      talk(msg);
      status("Finished");
      buttons(host, [["home", "📖 Back to the passage", true, () => home(vi)], ["menu", "★ All passages", false, menu]]);
    };
    const missing = (vi) => {
      const v = VERSES[vi];
      const parts = partsOf(v);
      const pool = [...new Set(VERSES.flatMap((x) => partsOf(x).flatMap((p) => p.t.split(" ").map(core))).filter((w) => w.length >= 4 && !STOP.has(w.toLowerCase())))];
      const used = new Set();
      const ROUNDS = 8;
      let round = 0;
      let firsts = 0;
      gameFrame(vi);
      const next = () => {
        if (!alive()) return;
        if (round >= ROUNDS) return finishGame(vi, "miss", `${firsts} of ${ROUNDS} correct on the first attempt. Now say the whole passage aloud without looking.`);
        const p = parts[round % parts.length];
        const toks = p.t.split(" ");
        const cand = toks.map((w, i) => [core(w), i]).filter(([w]) => w.length >= 3 && !STOP.has(w.toLowerCase()));
        const fresh1 = cand.filter(([w]) => !used.has(p.n + w));
        const [word, idx] = pick(fresh1.length ? fresh1 : cand);
        used.add(p.n + word);
        const inPart = new Set(toks.map((w) => core(w).toLowerCase()));
        const wrongs = shuffle(pool.filter((w) => !inPart.has(w.toLowerCase()) && w.toLowerCase() !== word.toLowerCase())).slice(0, 2);
        const shown = toks.map((w, i) => (i === idx ? w.replace(word, "_____") : w)).join(" ");
        fresh();
        el("rect", { x: 20, y: 14, width: 960, height: 532, rx: 26, fill: "#fffaf0", stroke: "#e0cfa9", "stroke-width": 3 }, view);
        text(view, 500, 64, `${v.ref.split(/[:]/)[0]}${v.src.includes(":") ? ":" + p.n : ""}`, { "font-size": 28, fill: "var(--accent-dark)" });
        para(view, 500, 150, shown, { size: 36, max: 44, weight: 700 });
        status(`Word ${round + 1} of ${ROUNDS}`);
        talk("Which word is missing? Say the verse to yourself, then choose.", `Which word is missing? ${shown}`);
        let tries = 0;
        choices(host, shuffle([word, ...wrongs]).map((w) => ({ label: w, v: w })), (o, button) => {
          if (!alive() || button.disabled) return;
          window.OC?.touch();
          if (o.v === word) {
            button.classList.add("right");
            MUSIC.chime();
            if (!tries) firsts += 1;
            round += 1;
            talk(`${tries ? "Yes." : "Correct."} <i>${p.t}</i>`, p.t);
            host.onclick = null;
            setTimeout(() => alive() && buttons(host, [["n", "Next ▶", true, next]]), 700);
          } else {
            tries += 1;
            button.classList.add("wrong");
            button.disabled = true;
            MUSIC.oops();
            if (tries >= 2) {
              host.querySelectorAll("[data-c]").forEach((b) => b.textContent === word && b.classList.add("right"));
              round += 1;
              host.onclick = null;
              talk(`The word is <b>${word}</b>: <i>${p.t}</i>`, `The word is ${word}. ${p.t}`);
              setTimeout(() => alive() && buttons(host, [["n", "Next ▶", true, next]]), 900);
            } else talk(`Not quite. Read the words just before the gap aloud. Which word makes sense and sounds like the passage?`);
          }
        });
      };
      next();
    };
    const order = (vi) => {
      const v = VERSES[vi];
      const parts = partsOf(v);
      const plan = parts.length === 1 ? [3, 4, 6].map((k) => [parts[0], k]) : parts.map((p) => [p, Math.min(5, Math.max(2, Math.round(p.t.split(" ").length / 4)))]);
      let round = 0;
      let firsts = 0;
      gameFrame(vi);
      const next = () => {
        if (!alive()) return;
        if (round >= plan.length) return finishGame(vi, "order", `${firsts} of ${plan.length} built without a slip. You are learning the shape of the passage.`);
        const [p, k] = plan[round];
        const pieces = phrases(p.t, k);
        const deck = shuffle(pieces.map((t, i) => ({ t, i })));
        let placed = 0;

            if (x + wdt > 950) {
