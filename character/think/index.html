<script>const { $, el, svg: makeSvg, text, panel, say, pick, wait, confetti, choices, explain, everyday, emoji, shuffle } = KIT;
const stage = $("[data-stage]");
const W = 1000;
const H = 560;
const INK = "#2b1d12";
let token = 0;
let view = null;

const UNITS = [
  { id: "t0", label: "See it", icon: "👀" },
  { id: "t1", label: "1. Name the virtue", icon: "🏷️" },
  { id: "t6", label: "2. Feelings words", icon: "😊" },
  { id: "t2", label: "3. What would you do?", icon: "🤔" },
  { id: "t3", label: "4. Fables and morals", icon: "📖" },
  { id: "t4", label: "5. Fair or not fair?", icon: "⚖️" },
  { id: "t5", label: "6. Big Question of the week", icon: "💭" },

// ---------- the five virtues (the family's own words) ----------
const V = {
  honesty: { name: "Honesty", icon: "🗣️", color: "#2f6fd6", soft: "#e3edfc", def: "telling the truth, even when it is uncomfortable; not pretending", short: "tell the truth" },
  kindness: { name: "Kindness", icon: "💛", color: "#c98a00", soft: "#fff3d1", def: "choosing to do something good for another person, especially when you don't have to", short: "do good for others" },
  courage: { name: "Courage", icon: "🦁", color: "#d4552c", soft: "#fde5dc", def: "doing the right thing even when it is scary or hard", short: "do right when it's hard" },
  selfcontrol: { name: "Self-control", icon: "✋", color: "#8a44b8", soft: "#f1e5fa", def: "choosing to wait, to stop, to hold back, even when you want to go ahead", short: "wait, stop, hold back" },
  gratitude: { name: "Gratitude", icon: "🌻", color: "#2e8f55", soft: "#e2f4e8", def: "noticing and naming the good things you have been given", short: "notice the good" },
};
const VKEYS = Object.keys(V);
const vLabel = (k) => `${V[k].icon} ${V[k].name}`;

// ---------- speech without reading emoji names aloud ----------
const clean = (html) => html.replace(/[\p{Extended_Pictographic}\u{FE0F}\u{200D}]/gu, "");
const talk = (html, spoken) => {
  say(html, { voice: false });
  VOICE.speak(clean(spoken ?? html));
};
const EFFORT = ["Correct, and well reasoned.", "You examined it carefully.", "Precisely observed.", "Sound reasoning.", "You persisted with it.", "Careful, deliberate thinking."];
const LEARN = ["Mistakes are how we learn.", "That's OK, let's think again.", "Good try. Let's look again."];

// ---------- small helpers ----------
function fresh() {
  stage.innerHTML = "";
  view = makeSvg(`0 0 ${W} ${H}`, stage);
  return view;
}
const tween = (ms, fn, alive) =>
  new Promise((resolve) => {
    if (KIT.still.matches) {
      fn(1);
      return resolve(true);
    }
    const t0 = performance.now();
    const frame = (now) => {
      if (!alive()) return resolve(false);
      const t = Math.min(1, (now - t0) / ms);
      fn(t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
      if (t < 1) requestAnimationFrame(frame);
      else resolve(true);
    };
    requestAnimationFrame(frame);
  });
function wrap(str, max) {
  const out = [];
  for (const w of String(str).split(" ")) {
    const last = out[out.length - 1];
    if (last && (last + " " + w).length <= max) out[out.length - 1] = last + " " + w;
    else out.push(w);
  }
  return out;
}
function para(parent, x, y, str, { size = 28, max = 28, lh = 1.22, fill = INK, anchor = "middle", weight = 800 } = {}) {
  const ls = wrap(str, max);
  ls.forEach((l, i) => text(parent, x, y + i * size * lh, l, { "font-size": size, fill, "text-anchor": anchor, "font-weight": weight }));
  return ls.length * size * lh;
}
function bubble(parent, cx, top, str, w = 300, size = 26) {
  const g = el("g", {}, parent);
  const ls = wrap(str, Math.max(6, Math.floor((w - 28) / (size * 0.56))));
  const h = ls.length * size * 1.2 + 26;
  el("rect", { x: cx - w / 2, y: top, width: w, height: h, rx: 22, fill: "#fff", stroke: "#5a4130", "stroke-width": 3 }, g);
  el("path", { d: `M${cx - 16} ${top + h - 2}L${cx} ${top + h + 22}L${cx + 16} ${top + h - 2}Z`, fill: "#fff", stroke: "#5a4130", "stroke-width": 3, "stroke-linejoin": "round" }, g);
  el("rect", { x: cx - 18, y: top + h - 6, width: 36, height: 6, fill: "#fff" }, g);
  ls.forEach((l, i) => text(g, cx, top + 13 + size * 0.95 + i * size * 1.2, l, { "font-size": size, fill: INK }));
  return g;
}
const status = (s) => {
  const b = $("[data-status]");
  if (b) b.textContent = s;
};

// Warm backgrounds for the story pictures.
function backdrop(v, kind = "plain") {
  const g = el("g", {}, v);
  const R = (a) => el("rect", a, g);
  const C = (a) => el("circle", a, g);
  const sky = (fill) => R({ x: 0, y: 0, width: W, height: H, fill });
  if (kind === "home") {
    sky("#fbf1e1");
    R({ x: 0, y: 410, width: W, height: 150, fill: "#e6cfa8" });
    R({ x: 0, y: 404, width: W, height: 8, fill: "#c9a77c" });
    R({ x: 790, y: 60, width: 150, height: 120, rx: 10, fill: "#cfe9f7", stroke: "#c9a77c", "stroke-width": 8 });
    el("line", { x1: 865, x2: 865, y1: 60, y2: 180, stroke: "#c9a77c", "stroke-width": 6 }, g);
  } else if (kind === "park" || kind === "field") {
    sky(kind === "park" ? "#dff1fb" : "#e8f5fb");
    C({ cx: 900, cy: 80, r: 44, fill: "#ffd34d" });
    if (kind === "field") el("ellipse", { cx: 260, cy: 420, rx: 420, ry: 120, fill: "#cde8b3" }, g);
    R({ x: 0, y: 410, width: W, height: 150, fill: "#bfe0a0" });
    if (kind === "park") {
      R({ x: 98, y: 250, width: 26, height: 170, rx: 6, fill: "#8a6a4f" });
      C({ cx: 111, cy: 230, r: 76, fill: "#8cc56f" });
    }
    for (const x of [260, 620, 940]) el("ellipse", { cx: x, cy: 420, rx: 46, ry: 18, fill: "#a6d38a" }, g);
  } else if (kind === "school") {
    sky("#f4efe6");
    R({ x: 300, y: 40, width: 400, height: 140, rx: 12, fill: "#2f5d50", stroke: "#8a6a4f", "stroke-width": 8 });
    text(g, 500, 125, "A B C  1 2 3", { "font-size": 40, fill: "#e8f2ee", opacity: 0.8 });
    R({ x: 0, y: 420, width: W, height: 140, fill: "#dcc6a3" });
    R({ x: 0, y: 414, width: W, height: 8, fill: "#b99a72" });
  } else if (kind === "night") {
    sky("#2c3e6b");
    C({ cx: 860, cy: 90, r: 46, fill: "#fff3c4" });
    C({ cx: 880, cy: 76, r: 42, fill: "#2c3e6b" });
    for (let i = 0; i < 26; i++) C({ cx: (i * 397) % 1000, cy: 30 + ((i * 131) % 300), r: 2 + (i % 3), fill: "#fff", opacity: 0.8 });
    R({ x: 0, y: 440, width: W, height: 120, fill: "#3b4f7a" });
  } else if (kind === "winter") {
    sky("#e3edf6");
    R({ x: 0, y: 400, width: W, height: 160, fill: "#fbfdff" });
    for (let i = 0; i < 30; i++) C({ cx: (i * 337) % 1000, cy: 20 + ((i * 97) % 360), r: 4, fill: "#fff", stroke: "#cfdbe8" });
  } else if (kind === "river") {
    sky("#e3f2fb");
    R({ x: 0, y: 380, width: W, height: 180, fill: "#8fc9e6" });
    for (const x of [120, 420, 760]) el("path", { d: `M${x} 470q20 -10 40 0t40 0`, stroke: "#fff", "stroke-width": 4, fill: "none", opacity: 0.7 }, g);
    R({ x: 0, y: 350, width: 150, height: 40, fill: "#a6d38a" });
    R({ x: 850, y: 350, width: 150, height: 40, fill: "#a6d38a" });
    R({ x: 120, y: 340, width: 760, height: 22, rx: 6, fill: "#a8743f", stroke: "#7a4f26", "stroke-width": 3 });
  } else if (kind === "pool") {
    sky("#eef7fb");
    R({ x: 0, y: 330, width: W, height: 230, fill: "#7cc3e8" });
    for (const y of [380, 440, 500]) el("path", { d: `M0 ${y}q50 -14 100 0t100 0t100 0t100 0t100 0t100 0t100 0t100 0t100 0t100 0`, stroke: "#bfe3f5", "stroke-width": 4, fill: "none" }, g);
  } else if (kind === "town") {
    sky("#e9eef5");
    const cols = ["#e8b4a0", "#c9d6e8", "#f2d59b", "#b9d8c2", "#e0c1e3"];
    for (let i = 0; i < 6; i++) {
      const h = 160 + ((i * 53) % 120);
      R({ x: 20 + i * 165, y: 420 - h, width: 140, height: h, rx: 6, fill: cols[i % 5] });
      for (let r = 0; r < 3; r++) R({ x: 46 + i * 165, y: 440 - h + r * 48, width: 26, height: 26, fill: "#fff", opacity: 0.8 });
    }
    R({ x: 0, y: 420, width: W, height: 140, fill: "#cfc7b9" });
  } else if (kind === "farm") {
    sky("#eaf5fb");
    R({ x: 0, y: 400, width: W, height: 160, fill: "#c8e3a2" });
    R({ x: 760, y: 220, width: 180, height: 180, fill: "#c0452f" });
    el("path", { d: "M740 230L850 150L960 230Z", fill: "#8f2f20" }, g);
    R({ x: 820, y: 300, width: 60, height: 100, fill: "#f4e3c4" });
  } else sky("#fbf6ee");
  return g;
}
// A story picture: [background, [[glyph, x, y, size, flip?]], [[cx, top, "bubble text", width]]]
function picture(v, spec, alive) {
  const [bg, items = [], bubbles = []] = spec;
  backdrop(v, bg);
  items.forEach(([glyph, x, y, size, flip], i) => {
    const g = el("g", { opacity: 0 }, v);
    const inner = el("g", { transform: `translate(${x} ${y})${flip ? " scale(-1 1)" : ""}` }, g);
    emoji(inner, 0, 0, glyph, size);
    setTimeout(() => alive() && tween(500, (t) => {
      g.setAttribute("opacity", t);
      g.setAttribute("transform", `translate(0 ${(1 - t) * 24})`);
    }, alive), i * 160);
  });
  bubbles.forEach(([cx, top, str, w], i) => {
    const b = bubble(v, cx, top, str, w);
    b.setAttribute("opacity", 0);
    setTimeout(() => alive() && tween(500, (t) => b.setAttribute("opacity", t), alive), 500 + i * 300 + items.length * 160);
  });
}
function virtueBadge(v, k, y = 20) {
  const vv = V[k];
  const g = el("g", { opacity: 0 }, v);
  el("rect", { x: 40, y, width: 920, height: 130, rx: 26, fill: "#fff", stroke: vv.color, "stroke-width": 5 }, g);
  el("circle", { cx: 112, cy: y + 65, r: 50, fill: vv.soft }, g);
  emoji(g, 112, y + 65, vv.icon, 62);
  text(g, 185, y + 50, vv.name, { "font-size": 38, fill: vv.color, "text-anchor": "start" });
  para(g, 185, y + 86, vv.def, { size: 24, max: 58, anchor: "start", weight: 700, fill: "#4d3c2e" });
  tween(600, (t) => g.setAttribute("opacity", t), () => g.isConnected);
  return g;
}

// Difficulty chips (same pattern as the other apps).
const LEVELS = [["easy", "🐣 Easy"], ["medium", "🦊 Medium"], ["hard", "🦁 Hard"]];
const levelRow = (cur) => `<div class="ap-row"><div class="ap-chips" data-levels>${LEVELS.map(([k, l]) => `<button type="button" data-lv="${k}" aria-pressed="${k === cur}">${l}</button>`).join("")}</div><p class="ap-status" data-status></p></div>`;
const onLevels = (id, fn) =>
  $("[data-levels]").addEventListener("click", (event) => {
    const b = event.target.closest("[data-lv]");
    if (!b) return;
    document.querySelectorAll("[data-lv]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    shell.mark(id, { level: b.dataset.lv });
    window.OC?.touch();
    fn(b.dataset.lv);
  });

// A question with one best answer: Socratic hint after the first miss, the answer and WHY after the second.
function quiz(my, host, options, { right, also = [], onAlso, hint, onDone }) {
  let tries = 0;
  let over = false;
  choices(host, options, (o, button) => {
    if (my !== token || over || button.disabled) return;
    window.OC?.touch();
    if (o.v === right) {
      over = true;
      button.classList.add("right");
      MUSIC.chime();
      onDone(tries === 0);
    } else if (also.includes(o.v)) {
      button.disabled = true;
      button.classList.add("wrong");
      MUSIC.play("xylophone", 79, { gain: 0.3 });
      onAlso?.(o);
    } else {
      tries += 1;
      button.classList.add("wrong");
      button.disabled = true;
      MUSIC.oops();
      if (tries >= 2) {
        over = true;
        const i = options.findIndex((x) => x.v === right);
        host.querySelector(`[data-c="${i}"]`)?.classList.add("right");
        onDone(false);
      } else talk(`${pick(LEARN)} ${hint}`);
    }
  });
}
function nextButton(host, label, fn) {
  host.innerHTML = `<div class="ap-buttons"><button type="button" class="primary" data-go>${label}</button></div>`;
  host.onclick = (event) => {
    if (event.target.closest("[data-go]")) {
      window.OC?.touch();
      fn();
    }
  };
}
// Calm finish: confetti once, a "Try it for real" card, and Play again. No endless "next".
function finish(my, id, host, msg, real, again) {
  if (my !== token) return;
  confetti();
  MUSIC.chime();
  shell.mark(id, { done: true });
  status("All done");
  talk(`🎉 ${msg}`);
  host.innerHTML = `<div class="ap-buttons"><button type="button" class="primary" data-real>🏠 Try it for real</button><button type="button" data-again>🔁 Play again</button></div>`;
  host.onclick = (event) => {
    if (event.target.closest("[data-real]")) realCard(real);
    else if (event.target.closest("[data-again]")) again();
  };
}
function realCard({ title, need, steps, safe = "Do this with a grown-up." }) {
  document.querySelector(".bq-real")?.remove();
  VOICE.hush();
  const box = document.createElement("div");
  box.className = "bq-real";
  box.innerHTML = `<div class="bq-real-card" role="dialog" aria-label="Try it for real"><h2>🏠 Try it for real</h2><h3>${title}</h3><p><b>You need:</b> ${need}</p><ol>${steps.map((s) => `<li>${s}</li>`).join("")}</ol><p class="bq-safe">👪 ${safe}</p><button type="button" class="kt-go" data-close-real>✓ OK</button></div>`;
  document.body.appendChild(box);
  VOICE.speak(clean(`Try it for real. ${title}. You need: ${need}. ${steps.join(" ")} ${safe}`));
  box.addEventListener("click", (event) => {
    if (event.target === box || event.target.closest("[data-close-real]")) {
      VOICE.hush();
      box.remove();
    }
  });
}

// ---------- content ----------
const SCEN = [
  { v: "honesty", text: "You knock over a cup of juice. Dad asks, “What happened?” You say, “I did it. I'm sorry.”", why: "You told the truth, even though it felt uncomfortable.", pic: ["home", [["🧒", 300, 330, 140], ["🧃", 470, 385, 60], ["💦", 540, 400, 50], ["👨", 720, 320, 150]], [[300, 70, "I did it. I'm sorry.", 300]]] },
  { v: "honesty", also: ["courage"], text: "A friend loves your drawing and asks, “Did you draw it all by yourself?” Your big sister helped a lot. You say, “My sister helped me.”", why: "You did not pretend. You told the truth about who helped.", pic: ["school", [["👧", 230, 340, 140], ["🖼️", 500, 340, 110], ["🧒", 770, 340, 140]], [[770, 200, "My sister helped me.", 300]]] },

      }
    };
    const begin = () => {
      step = 0;
      pos = -1;
      reason = "";
      other = -1;
      ending = "";
      draw();
      $("[data-deck]").hidden = false;
      const opts = q().a.map((a, i) => ({ label: a[0], v: i })).concat([{ label: "🤷 Not sure yet", v: -1 }]);
      talk(`<b>${q().q}</b> There's no single right answer. What do you think? Tap: <b>I think…</b>`, `${q().q} There's no single right answer. What do you think? ${q().a.map((a) => a[0]).join(", or ")}, or not sure yet?`);
      choices(host, opts, (o) => {
        if (!alive()) return;
        window.OC?.touch();
        MUSIC.play("xylophone", 72, { gain: 0.35 });
        because(o.v);
      });
    };
    const because = (p) => {
      $("[data-deck]").hidden = true;
      step = 1;
      pos = p;
      draw();
      const mine = p >= 0 ? [{ label: `“${q().a[p][1]}”`, v: p }] : q().a.map((a, i) => ({ label: `“${a[1]}”`, v: i }));
      talk(p >= 0 ? `You think: <b>${q().a[p][0]}</b>. Now give a reason. <b>Because…</b> Tap a reason, or say your own out loud.` : "Not sure yet is a fine place to start! Listen to these reasons. Tap the one you like best, or say your own.");
      host.classList.add("bq-col");
      choices(host, mine.concat([{ label: "🗣️ My own reason (say it out loud!)", v: "own" }]), (o) => {
        if (!alive()) return;
        window.OC?.touch();
        MUSIC.play("xylophone", 76, { gain: 0.35 });
        if (o.v === "own") reason = "my own";
        else {
          pos = o.v;
          reason = q().a[o.v][1];
        }
        if (pos < 0) pos = 0;
        but();
      });
    };
    const but = () => {
      step = 2;
      other = pos === 0 ? 1 : 0;
      draw();
      const o = q().a[other];
      talk(`${reason === "my own" ? "You gave your own reason." : "That is a reason."} <b>Another view:</b> “I think ${o[0].toLowerCase().replace(/…$/, "")}, ${o[1]}” Test it: is that reason true, and does it actually support the conclusion?`);
      host.classList.remove("bq-col");
      choices(host, [{ label: "✅ True and relevant", v: 1 }, { label: "❌ Not true or not relevant", v: 0 }, { label: "🔍 Need more evidence", v: 2 }], () => {
        if (!alive()) return;
        window.OC?.touch();
        MUSIC.play("xylophone", 79, { gain: 0.35 });
        soNow();
      });
    };
    const soNow = () => {
      step = 3;
      draw();
      talk("You weighed the other view against the evidence. <b>So now I think…</b>");
      choices(host, [{ label: `💭 Still: ${q().a[pos][0]}`, v: "same" }, { label: `🔄 I changed my mind`, v: "changed" }, { label: "🤔 Still thinking", v: "thinking" }], (o) => {
        if (!alive()) return;
        window.OC?.touch();
        ending = o.v === "same" ? q().a[pos][0] : o.v === "changed" ? "changed!" : "still thinking";
        step = 4;
        draw();
        $("[data-deck]").hidden = false;
        MUSIC.chime();
        confetti();
        shell.mark("t5", { done: true });
        window.OC?.count("big questions");
        const msg = o.v === "same" ? "You tested the other view and kept yours because your evidence still holds. That is sound thinking." : o.v === "changed" ? "You changed your view because the evidence showed the other side was right. That is intellectual honesty." : "Suspending judgement until you have more evidence is wise. Big questions can take a long time.";
        talk(`${msg} Now ask a grown-up what <b>they</b> think, and what evidence supports it.`);
        host.innerHTML = `<div class="ap-buttons"><button type="button" class="primary" data-real>🏠 Try it for real</button><button type="button" data-again>🔁 Think again</button></div>`;
        host.onclick = (event) => {
          if (event.target.closest("[data-real]")) realCard({ title: "Dinner-table question", need: "your family around the table", steps: [`Ask everyone: “${q().q}”`, "Each person says: “I think… because…”", "Test each reason: is it true, and how do we know? Did the evidence change anyone's mind?"], safe: "Grown-ups: listen more than you talk. There are no wrong answers." });
          else if (event.target.closest("[data-again]")) {
            host.onclick = null;
            begin();
          }
        };
      });
    };
    $("[data-deck]").addEventListener("click", (event) => {
      const b = event.target.closest("[data-d]");
      if (!b || !alive()) return;
      window.OC?.touch();
      const d = b.dataset.d;
      if (d === "tip") {
        talk(`👪 <b>For grown-ups:</b> ${q().tip} Say “What makes you think that?” and “Can you think of a time when…?” Let quiet thinking happen.`);
        return;
      }
      idx = d === "week" ? weekIndex() : (idx + (d === "next" ? 1 : BIGQ.length - 1)) % BIGQ.length;
      host.onclick = null;
      host.classList.remove("bq-col");
      begin();
    });
    begin();
  },

  // Feelings words
  t6() {
    const my = token;
    let level = shell.progress().t6?.level || "easy";
    let round = 0;
    let list = [];
    const ROUNDS = 8;
    panel(`${levelRow(level)}<div class="bq-pick" data-choices></div>`);
    const host = $("[data-choices]");
    const alive = () => my === token;
    const coreOpts = () => CKEYS.map((k) => ({ label: `${CORE[k].face} ${k}`, v: k }));
    const faceSpot = (x, y, r = 110) => {
      el("circle", { cx: x, cy: y, r, fill: "#fff", stroke: "var(--accent)", "stroke-width": 6, "stroke-dasharray": "14 10" }, view);
      return text(view, x, y + 42, "?", { "font-size": 120, fill: "var(--accent)" });
    };
    const wheel = (hi) => {
      const cx = 620;
      const cy = 280;
      const R = 250;
      const r0 = 108;
      CKEYS.forEach((k, i) => {
        const a0 = -Math.PI / 2 + (i * Math.PI) / 2;
        const a1 = a0 + Math.PI / 2;
        const P = (r, a) => `${cx + r * Math.cos(a)} ${cy + r * Math.sin(a)}`;
        const g = el("g", { class: "bq-slice", "data-k": k, style: "cursor:pointer" }, view);
        el("path", { d: `M${P(r0, a0)}L${P(R, a0)}A${R} ${R} 0 0 1 ${P(R, a1)}L${P(r0, a1)}A${r0} ${r0} 0 0 0 ${P(r0, a0)}Z`, fill: CORE[k].soft, stroke: "#fff", "stroke-width": 6, opacity: hi && hi !== k ? 0.5 : 1 }, g);
        el("path", { d: `M${cx} ${cy}L${P(r0, a0)}A${r0} ${r0} 0 0 1 ${P(r0, a1)}Z`, fill: CORE[k].color, stroke: "#fff", "stroke-width": 6 }, g);
        const am = (a0 + a1) / 2;
        const [ix, iy] = [cx + 62 * Math.cos(am), cy + 62 * Math.sin(am)];
        emoji(g, ix, iy - 8, CORE[k].face, 40);
        const [ox, oy] = [cx + 180 * Math.cos(am), cy + 180 * Math.sin(am)];
        text(g, ox, oy + 10, k, { "font-size": 32, fill: INK });
      });
      return { cx, cy };
    };
    const ask = () => {
      if (!alive()) return;
      if (round >= ROUNDS) {
        return finish(my, "t6", host, "You matched 8 feelings. All feelings are OK, and now you have more words to name them!", { title: "Feelings faces", need: "a mirror, paper, and crayons", steps: ["Look in the mirror and make a happy, sad, mad, and scared face.", "Now try a frustrated face, and a proud face!", "Draw one feeling you had today and tell a grown-up about it."] }, start);
      }
      const q = list[round];
      status(`Feeling ${round + 1} of ${ROUNDS}`);
      fresh();
      if (level === "easy") {
        picture(view, q.pic, alive);
        const spot = el("g", {}, view);
        el("circle", { cx: 880, cy: 110, r: 80, fill: "#fff", stroke: "var(--accent)", "stroke-width": 5, "stroke-dasharray": "12 8" }, spot);
        const mark = text(spot, 880, 146, "?", { "font-size": 96, fill: "var(--accent)" });
        talk(`${q.text} <b>How would you feel?</b> Tap a face.`);
        quiz(my, host, coreOpts(), {
          right: q.f,
          hint: "Imagine it is happening to you. What would your face look like?",
          onDone(first) {
            mark.remove();
            emoji(spot, 880, 110, CORE[q.f].face, 110);
            done(`${first ? pick(EFFORT) : "Let's look why."} Most people would feel <b>${q.f}</b>. It's OK to feel ${q.f}. ${helpFor[q.f]}`);
          },
        });
      } else if (level === "medium") {
        backdrop(view, "plain");
        el("circle", { cx: 280, cy: 260, r: 170, fill: "var(--accent-soft)" }, view);
        emoji(view, 280, 260, q.pic, 190);
        const mark = faceSpot(720, 260, 150);
        const others = shuffle(WORDS.filter((x) => x.fam !== q.fam));
        const picked = [q];
        for (const o of others) if (picked.length < 3 && !picked.some((p) => p.fam === o.fam)) picked.push(o);
        talk(`${q.text} <b>Which feeling word fits?</b>`);
        quiz(my, host, shuffle(picked).map((x) => ({ label: `${x.face} ${x.w}`, v: x.w })), {
          right: q.w,
          hint: "How would your body feel? Think about each word. Which one fits this moment best?",
          onDone(first) {
            mark.remove();
            emoji(view, 720, 250, q.face, 170);
            text(view, 720, 500, q.w, { "font-size": 44, fill: INK });
            done(`${first ? pick(EFFORT) : "Let's look why."} <b>${q.w[0].toUpperCase() + q.w.slice(1)}</b> means ${q.mean}. All feelings are OK.`);
          },
        });
      } else {
        backdrop(view, "plain");
        wheel();
        const card = el("g", {}, view);
        el("rect", { x: 20, y: 150, width: 300, height: 240, rx: 26, fill: "#fff", stroke: "var(--accent)", "stroke-width": 5 }, card);
        emoji(card, 170, 230, q.face, 100);
        text(card, 170, 350, q.w, { "font-size": q.w.length > 10 ? 32 : 40, fill: INK });
        talk(`${q.text} You might feel <b>${q.w}</b>. Which family on the wheel does ${q.w} belong to?`);
        quiz(my, host, coreOpts(), {
          right: q.fam,
          hint: `Is ${q.w} a nice feeling or a hard one? Is it more like sad, mad, or scared?`,
          onDone(first) {
            fresh();
            backdrop(view, "plain");
            wheel(q.fam);
            const i = CKEYS.indexOf(q.fam);
            const am = -Math.PI / 2 + (i * Math.PI) / 2 + Math.PI / 4;
            const g = el("g", {}, view);
            el("rect", { x: -100, y: -30, width: 200, height: 60, rx: 18, fill: "#fff", stroke: CORE[q.fam].color, "stroke-width": 4 }, g);
            text(g, 0, 11, q.w, { "font-size": q.w.length > 10 ? 26 : 30, fill: INK });
            const tx = 620 + 180 * Math.cos(am);
            const ty = 280 + 180 * Math.sin(am) + (am > 0 ? -50 : 50);
            tween(900, (t) => g.setAttribute("transform", `translate(${170 + (tx - 170) * t} ${270 + (ty - 270) * t})`), alive);
            done(`${first ? pick(EFFORT) : "Let's look why."} <b>${q.w[0].toUpperCase() + q.w.slice(1)}</b> is in the <b>${q.fam}</b> family. It means ${q.mean}.`);
          },
        });
        view.addEventListener("pointerdown", (event) => {
          const s = event.target.closest(".bq-slice");
          if (!s || !alive()) return;
          const i = CKEYS.indexOf(s.dataset.k);
          host.querySelector(`[data-c="${i}"]`)?.click();
        });
      }
    };
    const done = (msg) => {
      round += 1;
      window.OC?.count("feelings named");
      talk(msg);
      setTimeout(() => alive() && nextButton(host, round >= ROUNDS ? "Finish ▶" : "Next ▶", ask), 600);
    };
    const start = () => {
      round = 0;
      list = shuffle(level === "easy" ? BASIC : WORDS).slice(0, ROUNDS);
      ask();
    };
    onLevels("t6", (lv) => {
      level = lv;
      start();
    });
    start();
  },
};

const shell = SHELL({
  units: UNITS,
  how: {
    t0: { icon: "👀", title: "See it", steps: ["Watch the pictures.", "Press Next ▶ to go on.", "Press Let's play when you are ready."] },
    t1: { icon: "🏷️", title: "Name the virtue", steps: ["Listen to the little story.", "Tap the virtue it shows.", "Say why: “I think… because…”"] },
    t6: { icon: "😊", title: "Feelings words", steps: ["Look at the picture and listen.", "Think: how would you feel?", "Tap the feeling that fits."] },
    t2: { icon: "🤔", title: "What would you do?", steps: ["Listen to the story.", "Tap what you would really do.", "Then think: how would each person feel?"] },
    t3: { icon: "📖", title: "Fables and morals", steps: ["Tap a book to read a fable.", "Press Next page to hear more.", "Tap the lesson of the story."] },
    t4: { icon: "⚖️", title: "Fair or not fair?", steps: ["Listen to the puzzle.", "Tap Fair or Not fair.", "Then tap the best reason why."] },
    t5: { icon: "💭", title: "Big Question", steps: ["Read the big question.", "State what you think and give a reason.", "Test the other view: is its reason true? Then decide."] },
  },
  start: "t0",
  onStop() {
    token += 1;
    $("[data-panel]").onclick = null;
    document.querySelector(".bq-real")?.remove();
  },
  subject: "Character",
  activity: "Big Questions",
  onUnit(id) {
    token += 1;
    VOICE.hush();
    units[id]();
  },
});
MUSIC.preload("xylophone", [72, 74, 76, 79, 84, 88]);
MUSIC.preload("woodblock", [79]);
MUSIC.preload("harp", [67, 69, 71, 72]);
</script>
