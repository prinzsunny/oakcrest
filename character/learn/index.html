<script>const { $, el, text, panel, sayAsync, wait, confetti, explain, everyday, emoji, shuffle, still, surprise, sparkle } = KIT;

const learner = () => (window.OC ? OC.current() : "") || "";
const esc = (s) => (window.OC ? OC.escapeHtml(s) : String(s));
const NAME = () => esc(learner());
const rpick = (list) => list[Math.floor(Math.random() * list.length)];
const ROUNDS = 10;
// Where each child starts: Level 2 (and younger) → 0, Level 3 → 1, Level 4 and up → 2.
function ageStart() {
  try {
    const at = window.OC ? OC.LEVELS.indexOf(OC.levelOf(OC.current())) : -1;
    return at <= 1 ? 0 : at === 2 ? 1 : 2;
  } catch {
    return 0;
  }
}

// ======================================================================
// Smooth touch. Act on pointerdown (no waiting for click), never rebuild the stage on a tap,
// and animate with transforms only. click still works for keyboards and switch access.
// ======================================================================
function onTap(host, selector, fn) {
  let downAt = 0;
  const run = (event) => {
    const target = event.target.closest?.(selector);
    if (target && host.contains(target) && !target.disabled) fn(target, event);
  };
  const down = (event) => {
    if (event.button > 0) return;
    downAt = Date.now();
    window.OC?.touch();
    run(event);
  };
  const click = (event) => {
    if (Date.now() - downAt < 800) return;
    run(event);
  };
  host.addEventListener("pointerdown", down);
  host.addEventListener("click", click);
  cleanups.push(() => {
    host.removeEventListener("pointerdown", down);
    host.removeEventListener("click", click);
  });
}
const anim = (node, frames, ms, opts = {}) => {
  if (!node?.animate) return Promise.resolve();
  const duration = still.matches ? Math.min(ms, 120) : ms;
  const a = node.animate(frames, { duration, easing: "cubic-bezier(.2,.8,.3,1)", fill: "both", ...opts });
  // Never let a paused animation (hidden tab, power saving) stall a game.
  return Promise.race([a.finished.catch(() => {}), wait(duration + (opts.delay || 0) + 250)]);
};
const pop = (node) => anim(node, [{ transform: "scale(1)" }, { transform: "scale(1.08)" }, { transform: "scale(1)" }], 380, { fill: "none" });
const shake = (node) => anim(node, [{ transform: "translateX(0)" }, { transform: "translateX(-10px)" }, { transform: "translateX(9px)" }, { transform: "translateX(-6px)" }, { transform: "translateX(0)" }], 420, { fill: "none" });
const bounce = (node) => anim(node, [{ transform: "translateY(0) scale(1)" }, { transform: "translateY(-14%) scale(1.08)" }, { transform: "translateY(0) scale(1)" }], 520, { fill: "none" });

// talk("html") shows and speaks the same words. talk({ html, speech }) speaks different words,
// so a quote shown on the card can be read aloud with the question.
const talk = (msg, my = token) => {
  if (my !== token) return Promise.resolve(false);
  if (typeof msg === "string") return sayAsync(msg);
  const box = $("[data-say]");
  if (box) box.innerHTML = msg.html;
  return VOICE.speakAsync(msg.speech);
};
const mark = (id, data) => shell.mark(id, data);
const NEXT = { see: "mind", mind: "practice", practice: "memory", memory: "stuck", stuck: "focus", focus: "teach", teach: null };

// ======================================================================
// Learning that adapts. Each game keeps a level for the child (0, 1, 2 ≈ Level 2, 3, 4):
// three right first time in a row → a little harder; two misses in a row → a little easier.
// Missed items are remembered and come back in later rounds until they are right first time.
// ======================================================================
function skillOf(id, { start = ageStart(), max = 2 } = {}) {
  const saved = shell.progress()[id] || {};
  let level = Math.max(0, Math.min(max, saved.level ?? start));
  let missed = Array.isArray(saved.missed) ? saved.missed : [];
  let streak = 0;
  let slips = 0;
  const save = () => mark(id, { level, missed });
  return {
    get level() {
      return level;
    },
    max,
    right(key) {
      streak += 1;
      slips = 0;
      missed = missed.filter((k) => k !== key);
      const up = streak >= 3 && level < max;
      if (up) {
        level += 1;
        streak = 0;
      }
      save();
      return up;
    },
    wrong(key) {
      streak = 0;
      slips += 1;
      missed = [key, ...missed.filter((k) => k !== key)].slice(0, 8);
      if (slips >= 2 && level > 0) {
        level -= 1;
        slips = 0;
      }
      save();
    },
    // Set the level straight away (games scored at the end, like the pairs game).
    set(next) {
      level = Math.max(0, Math.min(max, next));
      save();
    },
    // Not the same as last time; a missed item comes back about two rounds in five.
    pick(list, keyOf, lastKey) {
      const others = list.filter((x) => keyOf(x) !== lastKey);
      const pool = others.length ? others : list;
      const review = pool.filter((x) => missed.includes(keyOf(x)));
      return review.length && Math.random() < 0.4 ? rpick(review) : rpick(pool);
    },
  };
}
const LEVEL_UP = ["You're getting so good at this! Let's make it a little trickier.", "Wow, your brain is growing! Here comes a harder one.", "Super thinking! Let's go up a level."];

// A right answer: sparkles where the finger was, and a bigger surprise now and then.
function cheer(target, round, rounds) {
  sparkle(target);
  if (round < rounds && (round === 3 || round === rounds - 2)) surprise();
}
async function levelUp(my) {
  surprise();
  MUSIC.chime();
  await talk(rpick(LEVEL_UP), my);
}

function finishCard({ id, icon, message, speech, note = "" }) {
  const my = token;
  stage.innerHTML = `<div class="ll-done"><div class="ll-done-pic" aria-hidden="true"><span>${icon}</span></div><div class="ll-done-text">${note ? `<p class="ll-done-note">${note}</p>` : ""}<h2>Try it for real, with a grown-up</h2><p>${message}</p></div></div>`;
  anim($(".ll-done-pic", stage), [{ transform: "scale(.5) rotate(-12deg)", opacity: 0 }, { transform: "scale(1.08) rotate(4deg)", opacity: 1 }, { transform: "none", opacity: 1 }], 700, { fill: "none" });
  confetti();
  MUSIC.chime();
  mark(id, { done: true });
  const host = panel(`<div class="ap-buttons"><button type="button" data-again>🔁 Play again</button>${NEXT[id] ? '<button type="button" class="primary" data-next data-pulse>▶ Next game</button>' : ""}</div>`);
  talk(speech || `Try it for real, with a grown-up. ${message}`, my);
  host.onclick = (event) => {
    if (event.target.closest("[data-again]")) shell.go(id);
    else if (event.target.closest("[data-next]")) shell.go(NEXT[id]);
  };
}

const card = (icon, label, cls = "") => `<span class="ll-c ${cls}"><span class="ll-ico" aria-hidden="true">${icon}</span><span class="ll-lbl">${label}</span></span>`;
const quote = (s, icon = "💬") => `<div class="ll-quote"><span aria-hidden="true">${icon}</span><q>${s}</q></div>`;
// A situation or question (not somebody's words), so no quote marks.
const scene = (s, icon = "🤔") => `<div class="ll-quote"><span aria-hidden="true">${icon}</span><p>${s}</p></div>`;

// ======================================================================
// Round-based picking game. Taps answer on pointerdown; only classes change, cards are never rebuilt mid-round.
// cfg.gen(level, skill, lastKey) builds a round: { key, prompt, choices: [{ ok, art, label }] }.
// ======================================================================
const raceHtml = (racer = "🧠", goal = "⭐") => `<div class="ll-race" data-race aria-hidden="true"><span class="ll-race-goal">${goal}</span><span class="ll-racer" data-racer>${racer}</span></div>`;
function raceTo(host, round, rounds) {
  const racer = $("[data-racer]", host);
  if (racer) racer.style.left = `calc((100% - 84px) * ${round / rounds} + 6px)`;
}
const HALFWAY = ["Halfway there! Keep going!", "You're halfway! Your brain is working hard.", "Halfway! Great thinking so far."];

function runChoice(cfg) {
  const my = token;
  const rounds = cfg.rounds || ROUNDS;
  const skill = skillOf(cfg.id, cfg.skill);
  let round = 0;
  let firstTry = 0;
  let tries = 0;
  let open = false;
  let q = null;
  let lastKey = null;
  stage.innerHTML = `<div class="ll-play" data-play><div class="ll-prompt" data-prompt></div><div class="ll-cards" data-cards></div></div>`;
  const cards = $("[data-cards]", stage);
  const promptBox = $("[data-prompt]", stage);
  const host = panel(`<div class="ap-row ll-row">${raceHtml(cfg.racer, cfg.goal)}<span class="ap-status" data-level></span><button type="button" class="ap-btn" data-again aria-label="Say it again">🔊<span class="ll-wide"> Again</span></button></div>`);
  const dots = () => {
    raceTo(host, round, rounds);
    $("[data-level]", host).innerHTML = `🌱 ${["Level 2", "Level 3", "Level 4"][skill.level] || `Level ${skill.level + 2}`}`;
  };
  host.onclick = (event) => {
    if (event.target.closest("[data-again]") && q) talk(cfg.ask(q), my);
  };
  async function ask() {
    if (my !== token) return;
    q = cfg.gen(skill.level, skill, lastKey);
    lastKey = q.key;
    tries = 0;
    dots();
    promptBox.innerHTML = q.prompt;
    anim(promptBox.firstElementChild, [{ transform: "scale(.9)", opacity: 0 }, { transform: "none", opacity: 1 }], 380, { fill: "none" });
    cards.className = `ll-cards n${q.choices.length}`;
    cards.innerHTML = q.choices.map((c, i) => `<button type="button" class="ll-card" data-c="${i}" aria-label="${c.label.replace(/"/g, "&quot;")}">${c.art}</button>`).join("");
    [...cards.children].forEach((b, i) => anim(b, [{ transform: "translateY(20px)", opacity: 0 }, { transform: "none", opacity: 1 }], 380, { delay: i * 70, fill: "backwards" }));
    open = true;
    await talk(cfg.ask(q), my);
  }
  async function next(up) {
    if (my !== token) return;
    if (up && round < rounds) {
      await levelUp(my);
      if (my !== token) return;
    }
    if (round === Math.ceil(rounds / 2) && round < rounds) {
      surprise();
      await talk(rpick(HALFWAY), my);
      if (my !== token) return;
    }
    if (round >= rounds) {
      if (cfg.after) return cfg.after({ firstTry, rounds, level: skill.level });
      return finishCard({ id: cfg.id, ...cfg.finish, note: `${firstTry} of ${rounds} right first time.` });
    }
    ask();
  }
  async function choose(button) {
    const c = q.choices[Number(button.dataset.c)];
    if (!open || c.state || my !== token) return;
    if (c.ok) {
      open = false;
      c.state = "good";
      button.classList.add("good");
      for (const b of cards.children) if (b !== button) b.classList.add("dim");
      const up = tries === 0 ? skill.right(q.key) : false;
      if (tries === 0) firstTry += 1;
      MUSIC.chime();
      round += 1;
      window.OC?.count(cfg.count);
      dots();
      cheer(button, round, rounds);
      pop(button);
      await talk(cfg.praise(q, c), my);
      if (my !== token) return;
      await wait(250);
      next(up);
    } else {
      if (tries === 0) skill.wrong(q.key);
      tries += 1;
      c.state = "bad";
      button.classList.add("bad");
      MUSIC.oops();
      shake(button);
      // With two choices one miss leaves only the answer, so show it straight away.
      if (tries >= Math.min(2, q.choices.length - 1)) {
        open = false;
        const right = cards.children[q.choices.findIndex((x) => x.ok)];
        right.classList.add("hint");
        await talk(cfg.reveal(q, c), my);
        if (my !== token) return;
        await wait(400);
        round += 1;
        dots();
        next(false);
      } else await talk(cfg.hint(q, c), my);
    }
  }
  onTap(cards, "[data-c]", choose);
  (async () => {
    dots();
    if (cfg.intro) await talk(cfg.intro, my);
    ask();
  })();
}

const NEURON = (cx, cy, r, fill, angle = 0) => {
  const arms = Array.from({ length: 6 }, (_, i) => {
    const a = ((angle + i * 60) * Math.PI) / 180;
    const x1 = cx + Math.cos(a) * r * 0.8;
    const y1 = cy + Math.sin(a) * r * 0.8;
    const x2 = cx + Math.cos(a) * r * 2;
    const y2 = cy + Math.sin(a) * r * 2;
    const b = a + 0.5;
    return `<path d="M${x1} ${y1} L${x2} ${y2} M${(x1 + x2) / 2 + Math.cos(a) * r * 0.2} ${(y1 + y2) / 2 + Math.sin(a) * r * 0.2} l${Math.cos(b) * r * 0.6} ${Math.sin(b) * r * 0.6}" stroke="${fill}" stroke-width="${r * 0.22}" stroke-linecap="round" fill="none"/>`;
  }).join("");
  return `<g>${arms}<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}"/><circle cx="${cx - r * 0.25}" cy="${cy - r * 0.25}" r="${r * 0.3}" fill="#fff" opacity=".45"/></g>`;
};
const SANS = "Nunito, ui-rounded, system-ui, sans-serif";
function label(view, x, y, words, size = 34, fill = "#2b1d12", attrs = {}) {
  return text(view, x, y, words, { "font-size": size, fill, "font-family": SANS, "font-weight": 900, ...attrs });
}

  // ---------- Fixed or growth? ----------
  mind() {
    runChoice({
      id: "mind",
      count: "growth thoughts",
      racer: "🌱",
      goal: "🌳",
      intro: `<b>Fixed thinking</b> says "I can't change." <b>Growth thinking</b> says "I can get better." Let's spot them!`,
      gen(level, skill, lastKey) {
        const kind = level === 0 ? "sort" : level === 1 ? rpick(["sort", "fix"]) : rpick(["fix", "fix", "sort"]);
        if (kind === "sort") {
          const all = [...FIXED.filter((f) => level >= 2 || !f.hard).map((f) => ({ s: f.say, fixed: true, f })), ...GROWTH.map((g) => ({ s: g, fixed: false }))];
          const t = skill.pick(all, (x) => x.s, lastKey);
          return {
            kind,
            t,
            key: t.s,
            prompt: quote(t.s),
            choices: [
              { ok: t.fixed, art: card("🧱", "Fixed thinking"), label: "Fixed thinking" },
              { ok: !t.fixed, art: card("🌱", "Growth thinking"), label: "Growth thinking" },
            ],
          };
        }
        const t = skill.pick(FIXED.filter((f) => level >= 2 || !f.hard), (f) => f.say, lastKey);
        const n = level >= 2 ? 4 : 3;
        const wrong = [...new Set([...shuffle(t.not || []), ...shuffle(UNHELPFUL)])].slice(0, n - 1);
        return {
          kind,
          t,
          key: t.say,
          prompt: quote(t.say, "🧱"),
          choices: shuffle([{ ok: true, art: card("💬", t.good, "ll-words"), label: t.good }, ...wrong.map((w) => ({ ok: false, art: card("💬", w, "ll-words"), label: w }))]),
        };
      },
      ask: (q) => (q.kind === "sort" ? { html: `Is this <b>fixed</b> thinking or <b>growth</b> thinking?`, speech: `"${q.t.s}" Is this fixed thinking, or growth thinking?` } : { html: `That's fixed thinking. Tap the <b>growth</b> way to say it.`, speech: `"${q.t.say}" That's fixed thinking. Tap the growth way to say it.` }),
      praise(q) {
        if (q.kind === "sort") return q.t.fixed ? `Yes, that's fixed thinking. A growth way to say it: "${q.t.f.good}"` : `Yes! That's growth thinking. It says you can get better.`;
        return `Yes! "${q.t.good}" That's growth thinking.`;
      },
      hint: () => `That one still sounds stuck. Find the one that says you can learn and get better.`,
      reveal(q) {
        if (q.kind === "sort") return q.t.fixed ? `That's fixed thinking: it says you can't change. A growth way: "${q.t.f.good}"` : `That's growth thinking: it says you can keep learning.`;
        return `The growth way to say it is: "${q.t.good}"`;
      },
      finish: { icon: "🌱", message: "Next time something feels hard, catch any fixed thinking out loud and change it together: “I can't do it” becomes “I can't do it <b>yet</b>.” Grown-ups can do it too!" },
    });
  },

  // ---------- The power of practice: the same pairs game, three tries ----------
  practice() {
    const my = token;
    const skill = skillOf("practice");
    const pairs = [4, 5, 6][skill.level];
    const TRIES = 3;
    const faces = shuffle(["🍎", "🚀", "🐢", "🌈", "🎈", "🐙", "⚽", "🌻", "🦊", "🍩"]).slice(0, pairs);
    const deck = shuffle([...faces, ...faces]);
    const results = [];
    let turns = 0;
    let first = null;
    let busy = true;
    let matched = 0;
    stage.innerHTML = `<div class="ll-practice"><div class="ll-grid n${deck.length}" data-grid>${deck.map((f, i) => `<button type="button" class="ll-flip" data-i="${i}" aria-label="Card ${i + 1}"><span class="ll-face ll-back" aria-hidden="true">?</span><span class="ll-face ll-front">${f}</span></button>`).join("")}</div><div class="ll-chart" data-chart></div></div>`;
    const grid = $("[data-grid]", stage);
    const flips = [...grid.children];
    const chart = $("[data-chart]", stage);
    const host = panel(`<div class="ap-row"><span class="ap-status" data-turns></span><div class="ap-buttons" data-ctrl></div></div>`);
    const status = () => ($("[data-turns]", host).innerHTML = `Try ${results.length + 1} of ${TRIES} · Turns: <b>${turns}</b>`);
    const drawChart = () => {
      const max = Math.max(pairs * 3, ...results);
      const bw = 64;
      const bars = Array.from({ length: TRIES }, (_, i) => {
        const v = results[i];
        const x = 40 + i * 90;
        const h = v ? (v / max) * 150 : 0;
        return `<g><rect x="${x}" y="${190 - h}" width="${bw}" height="${h}" rx="10" fill="${i === results.length - 1 ? "var(--accent)" : "#a5b4fc"}" class="ll-bar"/>${v ? `<text x="${x + bw / 2}" y="${182 - h}" text-anchor="middle" font-family="${SANS}" font-weight="900" font-size="22" fill="#2b1d12">${v}</text>` : `<text x="${x + bw / 2}" y="180" text-anchor="middle" font-family="${SANS}" font-weight="900" font-size="22" fill="#c7c9f5">?</text>`}<text x="${x + bw / 2}" y="216" text-anchor="middle" font-family="${SANS}" font-weight="800" font-size="17" fill="#6b5a49">Try ${i + 1}</text></g>`;
      }).join("");
      const by = 190 - (pairs / max) * 150;
      chart.innerHTML = `<h3>My turns <small>(fewer is better)</small></h3><svg viewBox="0 0 320 228" role="img" aria-label="Turns for each try: ${results.join(", ") || "none yet"}"><line x1="28" y1="190" x2="310" y2="190" stroke="#d6cdbf" stroke-width="3"/><line x1="28" y1="${by}" x2="310" y2="${by}" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 6"/><text x="310" y="${by - 6}" text-anchor="end" font-family="${SANS}" font-weight="800" font-size="13" fill="#15803d">best: ${pairs}</text>${bars}</svg>`;
    };
    const show = (b, up) => b.classList.toggle("up", up);
    function setCtrl(html, fn) {
      const ctrl = $("[data-ctrl]", host);
      ctrl.innerHTML = html;
      ctrl.onclick = (e) => {
        const b = e.target.closest("button");
        if (b) fn(b);
      };
    }
    async function startTry() {
      if (my !== token) return;
      turns = 0;
      first = null;
      matched = 0;
      for (const b of flips) b.classList.remove("up", "got");
      status();
      setCtrl("", () => {});
      busy = false;
      const n = results.length;
      await talk(n === 0 ? `Find the pairs! Tap two cards to turn them over. Try to use as few turns as you can.` : `Try ${n + 1}. Same cards, in the same places. Can your brain remember where they are?`, my);
    }
    async function endTry() {
      busy = true;
      results.push(turns);
      window.OC?.count("pairs tries");
      drawChart();
      pop(chart);
      surprise();
      const n = results.length;
      const better = n > 1 && turns < results[n - 2];
      const same = n > 1 && turns === results[n - 2];
      let words = n === 1 ? `You found all the pairs in <b>${turns}</b> turns. Now let's practice with the same cards.` : better ? `<b>${turns}</b> turns: fewer than last time! Your brain remembered where things were.` : same ? `<b>${turns}</b> turns again. Your brain is still building the paths. Keep going!` : `<b>${turns}</b> turns. Practice can be bumpy, and that's normal. Your brain is still learning the places.`;
      if (n < TRIES) {
        await talk(words, my);
        if (my !== token) return;
        setCtrl(`<button type="button" class="primary" data-pulse>▶ Try ${n + 1}</button>`, () => startTry());
        return;
      }
      const gain = results[0] - turns;
      words = gain > 0 ? `From <b>${results[0]}</b> turns down to <b>${turns}</b>. That's practice working! Each try strengthened the paths in your brain.` : `Some days practice looks bumpy. Over a few days, it really does get easier.`;
      await talk(words, my);
      if (my !== token) return;
      if (turns <= pairs + 1) skill.set(skill.level + 1);
      else if (turns > pairs * 3 && gain <= 0) skill.set(skill.level - 1);
      await wait(600);
      finishCard({
        id: "practice",
        icon: "📈",
        note: `My turns: ${results.join(" → ")}`,
        message: "Pick one skill, like throwing and catching a ball, or writing your name with your other hand. Count how many you get right on day 1. Practice a few minutes every day, count again on day 5, and make a chart together.",
      });
    }
    async function flip(b) {
      if (busy || my !== token || b.classList.contains("up")) return;
      const i = Number(b.dataset.i);
      show(b, true);
      if (first === null) {
        first = i;
        return;
      }
      const a = flips[first];
      first = null;
      turns += 1;
      status();
      if (deck[i] === deck[Number(a.dataset.i)]) {
        a.classList.add("got");
        b.classList.add("got");
        matched += 1;
        MUSIC.chime();
        sparkle(b);
        if (matched === pairs) {
          await wait(500);
          if (my === token) endTry();
        }
      } else {
        busy = true;
        await wait(900);
        if (my !== token) return;
        show(a, false);
        show(b, false);
        busy = false;
      }
    }
    onTap(grid, "[data-i]", flip);
    drawChart();
    status();
    startTry();
  },

  // ---------- Memory tricks: plain, then with a story ----------
  memory() {
    const my = token;
    const skill = skillOf("memory");
    const N = [5, 6, 8][skill.level];
    const story = rpick(STORIES).slice(0, N);
    const storyWords = new Set(STORIES.flat().map((x) => x[1]));
    const plainPool = shuffle(THINGS.filter((t) => !storyWords.has(t[1])));
    const plain = plainPool.slice(0, N);
    const scores = [];
    stage.innerHTML = `<div class="ll-mem" data-mem></div>`;
    const box = $("[data-mem]", stage);
    const host = panel(`<div class="ap-buttons" data-ctrl></div>`);
    const ctrl = $("[data-ctrl]", host);
    let ctrlFn = () => {};
    ctrl.onclick = (e) => {
      const b = e.target.closest("button");
      if (b && !b.disabled) ctrlFn(b);
    };
    const setCtrl = (html, fn) => {
      ctrl.innerHTML = html;
      ctrlFn = fn;
    };
    const tile = (t, i, extra = "") => `<button type="button" class="ll-thing" data-t="${i}" aria-label="${t[1]}"${extra}><span aria-hidden="true">${t[0]}</span><b>${t[1]}</b></button>`;

    async function look(items, withStory) {
      if (my !== token) return;
      box.className = `ll-mem look${withStory ? " story" : ""}`;
      box.innerHTML = `<div class="ll-look">${items.map((t, i) => `<div class="ll-thing show" style="--i:${i}"><span aria-hidden="true">${t[0]}</span><b>${t[1]}</b>${withStory ? `<small>${i + 1}</small>` : ""}</div>`).join(withStory ? '<i class="ll-arrow" aria-hidden="true">➜</i>' : "")}</div><div class="ll-timebar"><i data-bar></i></div>`;
      [...box.querySelectorAll(".ll-thing")].forEach((n, i) => anim(n, [{ transform: "scale(.6)", opacity: 0 }, { transform: "none", opacity: 1 }], 400, { delay: i * 90, fill: "backwards" }));
      let ready = false;
      setCtrl(`<button type="button" class="primary" data-ready disabled>✋ I'm ready</button>`, () => (ready = true));
      if (withStory) {
        await talk(`Trick: make a silly story that links each thing to the next. Listen and picture it!`, my);
        for (let i = 0; i < items.length; i++) {
          if (my !== token) return;
          const n = box.querySelectorAll(".ll-thing")[i];
          n.classList.add("on");
          await talk(items[i][2], my);
          n.classList.remove("on");
        }
        if (my !== token) return;
        await talk(`Now say the story to yourself, picturing each thing. Press <b>I'm ready</b> when you are.`, my);
      } else {
        await talk(`Look at these ${items.length} things and try to remember them: ${items.map((t) => t[1]).join(", ")}. Press <b>I'm ready</b> when you are.`, my);
      }
      if (my !== token) return;
      const button = $("[data-ready]", ctrl);
      if (button) button.disabled = false;
      // A gentle time limit: about 3 seconds a thing, or sooner if the child is ready.
      const limit = items.length * 3000;
      const t0 = Date.now();
      const bar = $("[data-bar]", box);
      while (!ready && Date.now() - t0 < limit) {
        if (my !== token) return;
        if (bar) bar.style.transform = `scaleX(${1 - (Date.now() - t0) / limit})`;
        await wait(100);
      }
    }
    // Pick the things you saw from a mix. Returns how many were right.
    function test(items, avoid) {
      return new Promise((resolve) => {
        const fakes = shuffle(THINGS.filter((t) => !items.includes(t) && !avoid.includes(t[1]) && !storyWords.has(t[1]))).slice(0, items.length);
        const mix = shuffle([...items, ...fakes]);
        box.className = `ll-mem test n${mix.length}`;
        box.innerHTML = `<div class="ll-pick">${mix.map((t, i) => tile(t, i)).join("")}</div>`;
        const picked = new Set();
        let done = false;
        const update = () => {
          const b = $("[data-check]", ctrl);
          if (b) {
            b.disabled = !picked.size;
            b.textContent = `✓ Check (${picked.size} of ${items.length})`;
          }
        };
        setCtrl(`<button type="button" class="primary" data-check disabled>✓ Check</button>`, async () => {
          if (done) return;
          done = true;
          let hits = 0;
          [...box.querySelectorAll("[data-t]")].forEach((b) => {
            const t = mix[Number(b.dataset.t)];
            const was = items.includes(t);
            if (was && picked.has(b.dataset.t)) {
              hits += 1;
              b.classList.add("good");
            } else if (was) b.classList.add("missed");
            else if (picked.has(b.dataset.t)) b.classList.add("bad");
            else b.classList.add("dim");
          });
          MUSIC.chime();
          setCtrl("", () => {});
          resolve(hits);
        });
        update();
        onTap(box, "[data-t]", (b) => {
          if (done || my !== token) return;
          const id = b.dataset.t;
          if (picked.has(id)) picked.delete(id);
          else if (picked.size < items.length) picked.add(id);
          else {
            shake(b);
            talk(`You can pick ${items.length}. Tap one again to take it away.`, my);
            return;
          }
          b.classList.toggle("on", picked.has(id));
          pop(b);
          update();
        });
        talk(`Which ${items.length} did you see? Tap them, then press <b>Check</b>.`, my);
      });
    }
    const compare = () => {
      const bar = (v, i, name) => `<div class="ll-cbar"><b>${v} of ${N}</b><i style="--h:${Math.max(4, (v / N) * 100)}%;${i ? "background:var(--accent)" : ""}"></i><span>${name}</span></div>`;
      box.className = "ll-mem compare";
      box.innerHTML = `<div class="ll-compare">${bar(scores[0], 0, "🙂 Just looking")}${bar(scores[1], 1, "📖 With a story")}</div>`;
      anim(box.firstElementChild, [{ transform: "translateY(20px)", opacity: 0 }, { transform: "none", opacity: 1 }], 450, { fill: "none" });
    };
    // Two quick questions on making memories last: spacing and testing yourself.
    function quiz() {
      const QS = [
        { q: "Which way helps you remember your spellings best?", a: ["📅", "5 minutes every day for a week"], d: ["⏰", "35 minutes all on Sunday night"], why: "A little every day beats a lot all at once. Each time you come back, the memory gets stronger." },
        { q: "Which helps you remember more?", a: ["🙈", "Cover the words and try to say them"], d: ["👀", "Just read them again and again"], why: "Testing yourself makes your brain fetch the memory, and that makes it stick." },
      ];
      return new Promise((resolve) => {
        let i = 0;
        let open = false;
        const askQ = async () => {
          const Q = QS[i];
          const opts = shuffle([{ ok: true, v: Q.a }, { ok: false, v: Q.d }]);
          box.className = "ll-mem quiz";
          box.innerHTML = `<div class="ll-play"><div class="ll-prompt">${scene(Q.q)}</div><div class="ll-cards n2">${opts.map((o, k) => `<button type="button" class="ll-card" data-o="${k}" aria-label="${o.v[1]}">${card(o.v[0], o.v[1], "ll-words")}</button>`).join("")}</div></div>`;
          box.opts = opts;
          open = true;
          await talk(Q.q, my);
        };
        onTap(box, "[data-o]", async (b) => {
          if (!open || my !== token || !box.opts) return;
          open = false;
          const o = box.opts[Number(b.dataset.o)];
          const Q = QS[i];
          if (o.ok) {
            b.classList.add("good");
            MUSIC.chime();
            sparkle(b);
            await talk(`Yes! ${Q.why}`, my);
          } else {
            b.classList.add("bad");
            MUSIC.oops();
            shake(b);
            box.querySelectorAll("[data-o]").forEach((x) => box.opts[Number(x.dataset.o)].ok && x.classList.add("hint"));
            await talk(`Good thinking, but the other way works better. ${Q.why}`, my);
          }
          if (my !== token) return;
          await wait(400);
          i += 1;
          if (i < QS.length) askQ();
          else resolve();
        });
        askQ();
      });
    }
    (async () => {
      await talk(`Let's test your memory two ways: first just by looking, then with a memory trick.`, my);
      if (my !== token) return;
      await look(plain, false);
      if (my !== token) return;
      scores.push(await test(plain, []));
      window.OC?.count("memory tries");
      if (my !== token) return;
      await talk(`You remembered <b>${scores[0]} of ${N}</b>. Now let's try a trick, with different things.`, my);
      if (my !== token) return;
      await look(story, true);
      if (my !== token) return;
      scores.push(await test(story, plain.map((t) => t[1])));
      window.OC?.count("memory tries");
      if (my !== token) return;
      await talk(`You remembered <b>${scores[1]} of ${N}</b>.`, my);
      if (my !== token) return;
      compare();
      surprise();
      const gain = scores[1] - scores[0];
      await talk(gain > 0 ? `The story helped! Linking things together gives your brain hooks to find them again.` : scores[1] === N ? `All of them! Linking things in a story gives your brain hooks to find them again.` : `Tricks take practice too. The more you use a story, the better it works.`, my);
      if (my !== token) return;
      if (scores[1] === N) skill.set(skill.level + 1);
      else if (scores[1] < N / 2 && scores[0] < N / 2) skill.set(skill.level - 1);
      await wait(800);
      if (my !== token) return;
      await quiz();
      if (my !== token) return;
      finishCard({
        id: "memory",
        icon: "🧩",
        note: `Just looking: ${scores[0]} of ${N} · With a story: ${scores[1]} of ${N}`,
        message: "Write a shopping list of 6 things. Make up a silly story that links them, then go shopping without looking at the list! For spellings, practice a few minutes every day and test yourself by covering the words.",
      });
    })();
  },

  // ---------- When I'm stuck ----------
  stuck() {
    runChoice({
      id: "stuck",
      count: "stuck steps",
      racer: "🧗",
      goal: "⛰️",
      intro: `Everyone gets stuck. Good learners know what to try next. Read it again, try another way, look at an example, take a break, and ask for help.`,
      gen(level, skill, lastKey) {
        const t = skill.pick(STUCK, (x) => x.s, lastKey);
        const n = [2, 3, 4][level];
        const bad = shuffle(BAD_STEPS);
        const others = level === 0 ? [bad[0]] : level === 1 ? [shuffle(t.d)[0], bad[0]] : [...t.d, bad[0]];
        const keys = shuffle([t.a, ...others.slice(0, n - 1)]);
        return {
          t,
          key: t.s,
          prompt: `<div class="ll-scene">${scene(t.s)}${level >= 1 ? `<ol class="ll-ladder" aria-label="The stuck ladder">${LADDER.map((k) => `<li>${STEPS[k].icon}<span> ${STEPS[k].label}</span></li>`).join("")}</ol>` : ""}</div>`,
          choices: keys.map((k) => ({ ok: k === t.a, k, art: card(STEPS[k].icon, STEPS[k].label), label: STEPS[k].label })),
        };
      },
      ask: (q) => ({ html: `What's the <b>best next step</b>?`, speech: `${q.t.s} What's the best next step?` }),
      praise: (q) => `Yes! ${STEPS[q.t.a].label}. ${q.t.why}`,
      hint(q, c) {
        if (BAD_STEPS.includes(c.k)) return `Hmm, "${STEPS[c.k].label}" won't help you learn. Try again!`;
        return `That can help sometimes, but there's a better step here. Look again.`;
      },
      reveal: (q) => `The best step here: <b>${STEPS[q.t.a].label}</b>. ${q.t.why}`,
      finish: { icon: "🪜", message: "Draw the stuck ladder on a card: 📖 read it again, 🔄 try another way, 🔎 look at an example, 🧘 take a break, 🙋 ask for help. Keep it by your desk, and next time you're stuck, point to the step you're trying." },
    });
  },

  // ---------- Focus & goals, then a real focus time ----------
  focus() {
    runChoice({
      id: "focus",
      count: "focus choices",
      rounds: 8,
      racer: "🎯",
      goal: "🏁",
      skill: { max: 1 },
      intro: `Good learners set small goals, break big jobs into steps, and beat distractions. Let's practice!`,
      gen(level, skill, lastKey) {
        const t = skill.pick(FOCUS, (x) => x.q, lastKey);
        const n = level === 0 ? 2 : 3;
        const opts = shuffle([{ ok: true, v: t.a }, ...shuffle(t.d).slice(0, n - 1).map((v) => ({ ok: false, v }))]);
        const head = { goal: "🎯 Goals", steps: "🪜 Big jobs", distract: "🔕 Distractions" }[t.kind];
        return { t, key: t.q, prompt: `<div class="ll-scene"><span class="ll-tag">${head}</span>${scene(t.q)}</div>`, choices: opts.map((o) => ({ ok: o.ok, art: card(o.v[0], o.v[1], "ll-words"), label: o.v[1] })) };
      },
      ask: (q) => ({ html: `What's the best choice?`, speech: `${q.t.q} What's the best choice?` }),
      praise: (q) => `Yes! ${q.t.why}`,
      hint: () => `Hmm, would that really help you learn? Try again.`,
      reveal: (q) => `The best choice: <b>${q.t.a[1]}</b>. ${q.t.why}`,
      after: () => focusTime(),
    });
  },

  // ---------- Teach it back ----------
  teach() {
    const my = token;
    const level = skillOf("teach").level;
    const checks = CHECKS.slice(0, [4, 5, 6][level]);
    let toy = null;
    let topic = null;
    const host = panel(`<div class="ap-buttons" data-ctrl></div>`);
    const ctrl = $("[data-ctrl]", host);
    const pickFrom = (items, html, fn) => {
      stage.innerHTML = `<div class="ll-choose n${items.length}">${items.map((x, i) => `<button type="button" class="ll-card" data-p="${i}" aria-label="${x[1] || x.label}">${card(x[0] || x.icon, x[1] || x.label)}</button>`).join("")}</div>`;
      [...stage.querySelectorAll("[data-p]")].forEach((b, i) => anim(b, [{ transform: "translateY(20px)", opacity: 0 }, { transform: "none", opacity: 1 }], 380, { delay: i * 60, fill: "backwards" }));
      onTap(stage.firstElementChild, "[data-p]", (b) => {
        if (my !== token) return;
        pop(b);
        fn(items[Number(b.dataset.p)]);
      });
      talk(html, my);
    };
    const checklist = () => {
      cleanups.forEach((f) => f());
      cleanups = [];
      const done = new Set();
      stage.innerHTML = `<div class="ll-teach"><div class="ll-toy"><span class="ll-toy-face" data-toy aria-hidden="true">${toy[0]}</span><b>${toy[1]}</b><small>is listening…</small><span class="ll-topic">${topic.icon} ${topic.label}</span></div><div class="ll-checks">${checks.map((c, i) => `<button type="button" class="ll-check" data-k="${i}" aria-pressed="false"><span class="ll-box" aria-hidden="true"></span><span class="ll-ico" aria-hidden="true">${c[0]}</span><span>${c[1]}</span></button>`).join("")}</div></div>`;
      ctrl.innerHTML = topic.model ? `<button type="button" data-model>🔊 Hear an example</button>` : "";
      ctrl.onclick = (e) => {
        if (e.target.closest("[data-model]")) talk(`Here's one way to say it: "${topic.model}" Now say it your own way!`, my);
      };
      const face = $("[data-toy]", stage);
      onTap(stage.firstElementChild, "[data-k]", async (b) => {
        if (my !== token || done.has(b.dataset.k)) return;
        done.add(b.dataset.k);
        b.classList.add("on");
        b.setAttribute("aria-pressed", "true");
        MUSIC.chime();
        sparkle(b);
        bounce(face);
        window.OC?.count("teach-back steps");
        if (done.size === checks.length) {
          await talk(`${toy[1]} learned all about ${topic.label.toLowerCase()}! And explaining it helped <b>you</b> learn it even better.`, my);
          if (my !== token) return;
          await wait(400);
          finishCard({
            id: "teach",
            icon: toy[0],
            message: "At dinner tonight, teach your family one thing you learned today. Let them ask you questions. If there's a bit you can't explain, look it up together. That's the bit your brain still needs!",
          });
          return;
        }
        const nextOne = checks.findIndex((_, i) => !done.has(String(i)));
        await talk(`${rpick(["Great!", "Lovely!", "Nice one!", `${toy[1]} likes that!`])} Next: ${checks[nextOne][1]}`, my);
      });
      talk(`Teach ${toy[1]} about <b>${topic.label.toLowerCase()}</b>. Do each step out loud, then tick it. First: ${checks[0][1]}`, my);
    };
    pickFrom(TOYS, `When you teach something, you learn it even better! Who will you teach today?`, (t) => {
      toy = t;
      cleanups.forEach((f) => f());
      cleanups = [];
      pickFrom(TEACH_TOPICS, `What will you teach ${t[1]}?`, (p) => {
        topic = p;
        checklist();
      });
    });
  },
};

// A real focus time: pick a small goal and a time, then work away from the screen with a calm picture.
function focusTime() {
  const my = token;
  const level = skillOf("focus").level;
  let goal = null;
  let minutes = 0;
  let timer = 0;
  cleanups.push(() => clearInterval(timer));
  const host = panel(`<div class="ap-buttons" data-ctrl></div>`);
  const ctrl = $("[data-ctrl]", host);
  const pickFrom = (items, words, fn) => {
    stage.innerHTML = `<div class="ll-choose n${items.length}">${items.map((x, i) => `<button type="button" class="ll-card" data-p="${i}" aria-label="${x[1]}">${card(x[0], x[1])}</button>`).join("")}</div>`;
    const box = stage.firstElementChild;
    onTap(box, "[data-p]", (b) => {
      if (my !== token || box.dataset.used) return;
      box.dataset.used = "1";
      pop(b);
      fn(items[Number(b.dataset.p)]);
    });
    talk(words, my);
  };
  const times = level === 0 ? [1, 2, 3] : [2, 5, 10];
  pickFrom(GOALS, `Now a real <b>focus time</b>! Pick one small goal to work on, away from the screen.`, (g) => {
    goal = g;
    pickFrom(times.map((m) => ["⏱️", `${m} minute${m > 1 ? "s" : ""}`]), `How long will you focus on: ${g[1].toLowerCase()}?`, (t) => {
      minutes = Number(t[1].split(" ")[0]);
      run();
    });
  });
  function run() {
    const total = minutes * 60000 * TIMER_SCALE;
    stage.innerHTML = `<div class="ll-timer"><svg viewBox="0 0 400 400" class="ll-ring" aria-hidden="true"><circle cx="200" cy="200" r="120" class="ll-breathe" fill="var(--accent-soft)"/><circle cx="200" cy="200" r="172" fill="none" stroke="#ecebff" stroke-width="20"/><circle cx="200" cy="200" r="172" fill="none" stroke="var(--accent)" stroke-width="20" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" transform="rotate(-90 200 200)" data-arc/><text x="200" y="232" text-anchor="middle" font-size="110" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif" data-plant>🌱</text></svg><div class="ll-timer-side"><span class="ll-goal">${goal[0]} ${goal[1]}</span><b class="ll-clock" data-clock>${minutes}:00</b><small>Breathe slowly with the circle. Work on your goal.</small></div></div>`;
    ctrl.innerHTML = `<button type="button" data-stop>⏹ I'm finished early</button>`;
    const arc = $("[data-arc]", stage);
    const clock = $("[data-clock]", stage);
    const plant = $("[data-plant]", stage);
    const t0 = Date.now();
    let over = false;
    const end = (early) => {
      if (over || my !== token) return;
      over = true;
      clearInterval(timer);
      window.OC?.count("focus minutes", Math.round(Math.min(total, Date.now() - t0) / 60000 / TIMER_SCALE));
      arc.setAttribute("stroke-dashoffset", early ? arc.getAttribute("stroke-dashoffset") : 0);
      plant.textContent = early ? plant.textContent : "🌳";
      MUSIC.chime();
      check(early);
    };
    ctrl.onclick = (e) => e.target.closest("[data-stop]") && end(true);
    timer = setInterval(() => {
      if (my !== token) return clearInterval(timer);
      const gone = Math.min(1, (Date.now() - t0) / total);
      const left = Math.max(0, Math.ceil((total - (Date.now() - t0)) / TIMER_SCALE / 1000));
      clock.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
      arc.setAttribute("stroke-dashoffset", (100 * (1 - gone)).toFixed(2));
      plant.textContent = gone < 0.34 ? "🌱" : gone < 0.67 ? "🌿" : "🪴";
      if (gone >= 1) end(false);
    }, 250);
    talk(`Ready, steady, focus! Put the screen down and work on your goal. If your mind wanders, gently bring it back. I'll ring a chime when the time is up.`, my);
  }
  function check(early) {
    ctrl.innerHTML = "";
    const answers = [["✅", "I did my goal!"], ["🙂", "I did some of it"], ["😅", "I got distracted"]];
    const box = document.createElement("div");
    box.className = "ll-askback";
    box.innerHTML = `<p>${early ? "Finished early!" : "Time's up!"} How did it go?</p><div class="ll-choose n3">${answers.map((x, i) => `<button type="button" class="ll-card" data-a="${i}" aria-label="${x[1]}">${card(x[0], x[1])}</button>`).join("")}</div>`;
    stage.appendChild(box);
    talk(`${early ? "Finished early!" : "Time's up!"} How did your focus time go?`, my);
    onTap(box, "[data-a]", async (b) => {
      if (my !== token || box.dataset.used) return;
      box.dataset.used = "1";
      pop(b);
      const k = Number(b.dataset.a);
      const reply = [`Brilliant! You set a goal and you did it. That's how big things get done: one small goal at a time.`, `Some is great progress! Next time, you could pick a slightly smaller goal, or a little more time.`, `That happens to everyone, and noticing it is the first step. Next time, move distractions away before you start.`][k];
      await talk(reply, my);
      if (my !== token) return;
      await wait(400);
      finishCard({
        id: "focus",
        icon: "🎯",
        note: `${goal[0]} ${goal[1]} · ${minutes} minute${minutes > 1 ? "s" : ""}`,
        message: "Each day this week, pick one small goal with a grown-up. Clear the space, put screens away, and use a kitchen timer. At the end, tick it off on a chart and talk about what helped you focus.",
      });
    });
  }
}

shell = SHELL({
