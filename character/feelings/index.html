// ======================================================================
// Smooth touch. Act on pointerdown (no waiting for click), never rebuild the stage on a tap,
// and animate with transforms only. click still works for keyboards and switch access.
// ======================================================================
function onTap(host, selector, fn) {
  let downAt = 0;
  const run = (event) => {
    const target = event.target.closest?.(selector);
    if (target && host.contains(target) && !target.disabled) fn(target, event);
  };
  const down = (event) => {
    if (event.button > 0) return;
    downAt = Date.now();
    window.OC?.touch();
    run(event);
  };
  const click = (event) => {
    if (Date.now() - downAt < 800) return;
    run(event);
  };
  host.addEventListener("pointerdown", down);
  host.addEventListener("click", click);
  cleanups.push(() => {
    host.removeEventListener("pointerdown", down);
    host.removeEventListener("click", click);
  });
}
const anim = (node, frames, ms, opts = {}) => {
  if (!node?.animate) return Promise.resolve();
  const duration = still.matches ? Math.min(ms, 120) : ms;
  const a = node.animate(frames, { duration, easing: "cubic-bezier(.2,.8,.3,1)", fill: "both", ...opts });
  // Never let a paused animation (hidden tab, power saving) stall a game.
  return Promise.race([a.finished.catch(() => {}), wait(duration + (opts.delay || 0) + 250)]);
};

// ======================================================================
// Learning that adapts. Each game keeps a level for the child:
// three right first time in a row → a little harder; two misses in a row → a little easier.
// Missed items are remembered and come back in later rounds until they are right first time.
// ======================================================================
function skillOf(id, { start = 1, max = 3 } = {}) {
  const saved = shell.progress()[id] || {};
  let level = Math.max(0, Math.min(max, saved.level ?? start));
  let missed = Array.isArray(saved.missed) ? saved.missed : [];
  let streak = 0;
  let slips = 0;
  const save = () => mark(id, { level, missed });
  return {
    get level() {
      return level;
    },
    max,
    right(key) {
      streak += 1;
      slips = 0;
      missed = missed.filter((k) => k !== key);
      const up = streak >= 3 && level < max;
      if (up) {
        level += 1;
        streak = 0;
      }
      save();
      return up;
    },
    wrong(key) {
      streak = 0;
      slips += 1;
      missed = [key, ...missed.filter((k) => k !== key)].slice(0, 8);
      if (slips >= 2 && level > 0) {
        level -= 1;
        slips = 0;
      }
      save();
    },
    // Not the same as last time; a missed item comes back about two rounds in five.
    pick(list, keyOf, last) {
      const others = list.filter((x) => keyOf(x) !== last);
      const pool = others.length ? others : list;
      const review = pool.filter((x) => missed.includes(keyOf(x)));
      return review.length && Math.random() < 0.4 ? rpick(review) : rpick(pool);
    },
  };
}
const choicesFor = (level) => [2, 3, 3, 4][Math.min(level, 3)];

// ======================================================================
// Round games. Each game's gen(level, skill, last) builds one round:
// { key, target, layout, prompt, choices: [{ ok, art, label, ... }] } and the game says what to ask and answer.
// ======================================================================
const GAMES = {
  // ---------- Name the feeling ----------
  name: {
    id: "name",
    count: "feelings named",
    skill: { max: 3 },
    racer: "🦋",
    goal: "🌻",
    gen(level, skill, last) {
      const pool = feelsAt(level);
      // Level 1: tap the face. From level 3, most rounds are "how might they feel?" scenes.
      const scene = level >= 1 && Math.random() < [0, 0.3, 0.5, 0.75][level];
      if (scene) {
        const scenes = SCENES.filter((s) => pool.includes(s.feel));
        const s = skill.pick(scenes, (x) => x.text, last);
        const p = rpick(PEOPLE);
        const n = choicesFor(level);
        // A look-alike feeling only joins as a wrong choice at the top level, and only when the scene clearly fits one of them.
        const others = shuffle(pool.filter((f) => f !== s.feel && (level >= 3 && s.sharp ? true : !twins(f, s.feel))));
        const twin = level >= 3 && s.sharp ? others.find((f) => twins(f, s.feel)) : null;
        const rest = others.filter((f) => f !== twin);
        const picks = (twin ? [twin, ...rest] : rest).slice(0, n - 1);
        const shown = rpick(PEOPLE.filter((x) => x !== p));

          kind: "scene", key: s.text, target: s.text, feel: s.feel, p, scene: s, layout: "side",
          prompt: sceneCard(s.pic, fill(s.text, p)),
          choices: shuffle([s.feel, ...picks]).map((f) => ({ v: f, ok: f === s.feel, art: faceCard(shown, f), label: FEELS[f].word })),
        };
      }
      const faces = level === 0 ? ["happy", "sad", "angry", "scared"] : pool;
      const target = skill.pick(faces, (f) => f, last);
      const n = choicesFor(level);
      const others = shuffle(faces.filter((f) => f !== target && !twins(f, target))).slice(0, n - 1);
      const p = rpick(PEOPLE);
      return { kind: "face", key: target, target, feel: target, p, layout: "", choices: shuffle([target, ...others]).map((f) => ({ v: f, ok: f === target, art: faceCard(p, f, false), label: `${FEELS[f].word} face` })) };
    },
    ask(q) {
      if (q.kind === "scene") return { html: `How might <b>${q.p.name}</b> feel?`, speech: `${fill(q.scene.text, q.p)} How might ${q.p.name} feel? Is it ${q.choices.map((c) => FEELS[c.v].word).join(", or ")}?` };
      return `Find the <b>${FEELS[q.feel].word}</b> face.`;
    },
    praise(q) {
      const F = FEELS[q.feel];
      if (q.kind === "scene") return `Yes! ${q.p.name} might feel <b>${F.word}</b>. ${cap(F.word)} is ${F.means}. ${rpick(["Different people can feel different things, too.", "Have you ever felt like that?", "Feelings like this come and go."])}`;
      return `Yes! That face looks <b>${F.word}</b>. Look at ${F.cue}.`;
    },
    hint(q, c) {
      const F = FEELS[c.v];
      if (q.kind === "scene") return `${rpick(AGAIN)} <b>${cap(F.word)}</b> is ${F.means}. How would you feel if it happened to you?`;
      return `${rpick(AGAIN)} That face looks <b>${F.word}</b>: see ${F.cue}? Find the ${FEELS[q.feel].word} face.`;
    },
    reveal(q) {
      const F = FEELS[q.feel];
      if (q.kind === "scene") return `${q.p.name} might feel <b>${F.word}</b>. ${cap(F.word)} is ${F.means}.`;
      return `Here is the <b>${F.word}</b> face. Look at ${F.cue}.`;
    },
  },

  // ---------- How big is the problem? and mild-to-strong feeling words ----------
  big: {
    id: "big",
    count: "problems sized",
    skill: { max: 3 },
    racer: "🎈",
    goal: "☁️",
    gen(level, skill, last) {
      if (level >= 2 && Math.random() < 0.4) {
        const lad = skill.pick(LADDERS, (l) => l.family, last);
        const want = level >= 3 && Math.random() < 0.5 ? "smallest" : "biggest";
        const answer = want === "biggest" ? lad.words[2] : lad.words[0];
        return {
          kind: "ladder", key: lad.family, target: lad.family, lad, want, answer, layout: "side",
          prompt: `<div class="ff-ladder" data-ladder><span class="ff-scene-pic" aria-hidden="true">${lad.pic}</span><p><b>${cap(lad.family)}</b> words</p></div>`,
          choices: shuffle(lad.words).map((w) => ({ v: w, ok: w === answer, art: `<div class="ff-word">${w}</div>`, label: w })),
        };
      }
      const sizes = level === 0 ? ["small", "big"] : ["small", "medium", "big"];
      const pr = skill.pick(PROBLEMS.filter((x) => sizes.includes(x.size)), (x) => x.text, last);
      return { kind: "problem", key: pr.text, target: pr.text, pr, layout: "side across", prompt: sceneCard(pr.pic, pr.text), choices: sizes.map((s) => ({ v: s, ok: s === pr.size, art: thermo(s), label: `${s} problem` })) };
    },
    ask(q) {
      if (q.kind === "ladder") return { html: `Which word is the <b>${q.want}</b> feeling?`, speech: `Here are three ${q.lad.family} words: ${shuffle(q.lad.words).join(", ")}. Which word is the ${q.want} feeling?` };
      return { html: `How big is this problem?`, speech: `${q.pr.text} How big is this problem? ${q.choices.length === 2 ? "Small, or big?" : "Small, medium, or big?"}` };
    },
    praise(q) {
      if (q.kind === "ladder") return `Yes! From small to big: <b>${q.lad.words.join(" → ")}</b>. Knowing how big a feeling is helps us choose what to do.`;
      return `Yes! That's a <b>${q.pr.size}</b> problem. ${SIZES.find((s) => s.key === q.pr.size).means}`;
    },
    hint(q, c) {
      if (q.kind === "ladder") return `${rpick(AGAIN)} Is <b>${c.v}</b> a little feeling, or a huge one? Try another word.`;
      return `${rpick(AGAIN)} Is anyone hurt or not safe? Could you sort it out yourself?`;
    },
    reveal(q) {
      if (q.kind === "ladder") return `The ${q.want} is <b>${q.answer}</b>. From small to big: ${q.lad.words.join(", ")}.`;
      return `This is a <b>${q.pr.size}</b> problem. ${SIZES.find((s) => s.key === q.pr.size).means}`;
    },
    onRight(q, box) {
      if (q.kind !== "ladder") return;
      const lad = $("[data-ladder]", box);
      if (lad) lad.innerHTML = `<ol class="ff-steps-up">${[...q.lad.words].reverse().map((w, i) => `<li style="--h:${3 - i}">${w}</li>`).join("")}</ol>`;
    },
  },

  // ---------- Kind or not kind? What would you do? ----------
  kind: {
    id: "kind",
    count: "kind choices",
    skill: { max: 3 },
    racer: "🐝",
    goal: "🌼",
    gen(level, skill, last) {
      const p = rpick(PEOPLE);
      if (level === 0 || (level === 1 && Math.random() < 0.4)) {
        const a = skill.pick(ACTS, (x) => x.text, last);
        return {
          kind: "act", key: a.text, target: a.text, a, p, layout: "side",
          prompt: sceneCard(a.pic, fill(a.text, p)),
          choices: [true, false].map((k) => ({ v: k, ok: k === a.kind, art: optCard(k ? "💛" : "💔", k ? "Kind" : "Not kind"), label: k ? "kind" : "not kind" })),
        };
      }
      const d = skill.pick(DILEMMAS.filter((x) => x.tier <= Math.max(1, level)), (x) => x.text, last);
      const n = level >= 2 ? 3 : 2;
      const opts = [{ icon: d.ok[0], text: d.ok[1], ok: true }, ...shuffle(d.no).slice(0, n - 1).map(([icon, text]) => ({ icon, text, ok: false }))];
      return { kind: "do", key: d.text, target: d.text, d, layout: "side", prompt: sceneCard(d.pic, d.text), choices: shuffle(opts).map((o) => ({ v: o, ok: o.ok, art: optCard(o.icon, o.text), label: o.text })) };
    },
    ask(q) {
      if (q.kind === "act") return { html: `Is that <b>kind</b>, or <b>not kind</b>?`, speech: `${fill(q.a.text, q.p)} Is that kind, or not kind?` };
      return { html: `What would you do?`, speech: `${q.d.text} What would you do? ${q.choices.map((c) => c.v.text).join(" Or, ")}` };
    },
    praise(q) {
      if (q.kind === "act") return `Yes! ${q.a.kind ? "That's <b>kind</b>." : "That's <b>not kind</b>."} ${q.a.why}`;
      return `Yes! <b>${q.d.ok[1]}</b> ${q.d.why}`;
    },
    hint(q) {
      if (q.kind === "act") return `${rpick(AGAIN)} How would the other person feel?`;
      return `${rpick(AGAIN)} How would the other person feel if you did that?`;
    },
    reveal(q) {
      if (q.kind === "act") return `${q.a.kind ? "That one is <b>kind</b>." : "That one is <b>not kind</b>."} ${q.a.why}`;
      return `A kind choice is: <b>${q.d.ok[1]}</b> ${q.d.why}`;
    },
  },

  // ---------- Feelings detective: read the clues, then choose what would help ----------
  detective: {
    id: "detective",
    count: "feelings detected",
    skill: { max: 3 },
    racer: "🔍",
    goal: "💛",
    layout: "stack",
    gen(level, skill, last) {
      // Each case is two rounds: first "how do they feel?", then "what would help?".
      if (this.pending) {
        const q = this.pending;
        this.pending = null;
        const n = level >= 2 ? 3 : 2;
        const opts = [{ icon: q.c.ok[0], text: fill(q.c.ok[1], q.p), ok: true }, ...shuffle(q.c.no).slice(0, n - 1).map(([icon, text]) => ({ icon, text: fill(text, q.p), ok: false }))];
        return { ...q, step: "help", key: `${q.key}:help`, choices: shuffle(opts).map((o) => ({ v: o, ok: o.ok, art: optCard(o.icon, o.text), label: o.text })) };
      }
      const pool = CASES.filter((c) => c.tier <= level);
      const c = skill.pick(pool, (x) => x.what, last);
      const p = rpick(PEOPLE);
      const feels = feelsAt(Math.max(level, FEELS[c.feel].tier));
      const n = choicesFor(level);
      const others = shuffle(feels.filter((f) => f !== c.feel && f !== c.mask && (level >= 3 && c.sharp ? true : !twins(f, c.feel))));
      const twin = level >= 3 && c.sharp ? others.find((f) => twins(f, c.feel)) : null;
      // In a hidden-feelings case the face the child sees is a choice too, so they must weigh the other clues.
      const firsts = [c.mask, twin].filter(Boolean);
      const picks = [...firsts, ...others.filter((f) => !firsts.includes(f))].slice(0, n - 1);
      const shown = rpick(PEOPLE.filter((x) => x !== p));
      const q = {
        step: "feel", key: c.what, target: c.what, c, p, feel: c.feel,
        prompt: `<div class="ff-clues"><div class="ff-clue" data-clue="0"><small>👀 Face</small>${faceSvg(p, c.mask || c.feel)}</div><div class="ff-clue" data-clue="1"><small>🧍 Body</small><p>${fill(c.body, p)}</p></div><div class="ff-clue" data-clue="2"><small>📖 What happened</small><p>${fill(c.what, p)}</p></div></div>`,
        choices: shuffle([c.feel, ...picks]).map((f) => ({ v: f, ok: f === c.feel, art: faceCard(shown, f), label: FEELS[f].word })),
      };
      this.pending = q;
      return q;
    },
    ask(q) {
      if (q.step === "help") return { html: `What would help <b>${q.p.name}</b>?`, speech: `${q.p.name} feels ${FEELS[q.feel].word}. What would help? ${q.choices.map((c) => c.v.text).join(" Or, ")}` };
      return { html: `Detective time! Look at the clues. How does <b>${q.p.name}</b> feel?`, speech: `Detective time! Look at the clues. ${q.c.mask ? `${q.p.name}'s face is smiling.` : ""} Body: ${fill(q.c.body, q.p)} What happened: ${fill(q.c.what, q.p)} How does ${q.p.name} feel? Is it ${q.choices.map((c) => FEELS[c.v].word).join(", or ")}?` };
    },
    praise(q) {
      if (q.step === "help") return `Yes! That would help ${q.p.name} feel better. Noticing feelings and being kind is called empathy.`;
      const F = FEELS[q.feel];
      if (q.c.mask) return `Great detective work! ${q.p.name} is smiling, but the other clues say <b>${F.word}</b>. Sometimes people hide how they feel. It's good to share feelings with someone you trust.`;
      return `Great detective work! ${q.p.name} feels <b>${F.word}</b>. The clues: ${F.cue}, and ${F.body}.`;
    },
    hint(q, c) {
      if (q.step === "help") return `${rpick(AGAIN)} Would that make ${q.p.name} feel better, or worse?`;
      return `${rpick(AGAIN)} ${q.c.mask ? "Faces don't always tell the whole story. " : ""}Look at the body clue and what happened.`;
    },
    reveal(q) {
      if (q.step === "help") return `This would help: <b>${fill(q.c.ok[1], q.p)}</b>`;
      return `${q.p.name} feels <b>${FEELS[q.feel].word}</b>. ${cap(FEELS[q.feel].word)} is ${FEELS[q.feel].means}.`;
    },
    onRight(q, box) {
      if (q.step === "feel") for (const clue of box.querySelectorAll("[data-clue]")) clue.classList.add("solved");
    },
  },

  // ---------- Solve it together: five steps, I-feel words and fair plans ----------
  fix: {
    id: "fix",
    count: "problems solved",
    skill: { max: 2 },
    racer: "🐢",
    goal: "🤝",
    gen(level, skill, last) {
      const kinds = level === 0 ? ["order"] : level === 1 ? ["order", "order", "say", "plan"] : ["order", "say", "plan", "listen"];
      const kind = rpick(kinds.filter((k) => k !== last?.kind || kinds.length === 1));
      if (kind === "order") {
        const at = level === 0 ? Math.floor(Math.random() * 3) : Math.floor(Math.random() * 5);
        const answer = STEPS[at];
        const n = level === 0 ? 2 : 3;
        const others = shuffle(STEPS.filter((s) => s !== answer)).slice(0, n - 1);
        return {
          kind, key: `step${at}`, target: { kind }, at, answer, layout: "stack",
          prompt: `<div class="ff-path" data-path>${STEPS.map((s, i) => `<span class="ff-step${i < at ? " on" : i === at ? " q" : ""}">${i < at ? `<i aria-hidden="true">${s.icon}</i><b>${s.name}</b>` : i === at ? "<i>?</i>" : `<i>${i + 1}</i>`}</span>`).join("")}</div>`,
          choices: shuffle([answer, ...others]).map((s) => ({ v: s, ok: s === answer, art: optCard(s.icon, s.name), label: s.name })),
        };
      }
      const c = rpick(CONFLICTS);
      if (kind === "listen") {
        const opts = [["👀", "Look at them, and let them finish.", true], ["🗣️", "Talk over them.", false], ["🧸", "Play with a toy and ignore them.", false]];
        return { kind, key: "listen", target: { kind }, c, layout: "side", prompt: sceneCard("👂", `${c.text} Now one friend is saying how they feel.`), choices: shuffle(opts).map(([icon, text, ok]) => ({ v: { text }, ok, art: optCard(icon, text), label: text })) };
      }
      const list = kind === "say" ? c.say : c.plan;
      const icons = kind === "say" ? ["🗣️", "😡", "😶"] : ["🤝", "😤", "🚫"];
      const n = level >= 2 ? 3 : 2;
      const opts = list.map((text, i) => ({ text, ok: i === 0, icon: icons[i] })).slice(0, n);
      return { kind, key: `${kind}:${c.text}`, target: { kind }, c, layout: "side", prompt: sceneCard(c.pic, c.text), choices: shuffle(opts).map((o) => ({ v: o, ok: o.ok, art: optCard(o.icon, o.text), label: o.text })) };
    },
    ask(q) {
      if (q.kind === "order") return q.at === 0 ? `Two friends disagree. What is the <b>first</b> step?` : `Steps so far: ${STEPS.slice(0, q.at).map((s) => s.name).join(", ")}. What comes <b>next</b>?`;
      if (q.kind === "listen") return { html: `What does good <b>listening</b> look like?`, speech: `${q.c.text} Now one friend is saying how they feel. What does good listening look like? ${q.choices.map((c) => c.v.text).join(" Or, ")}` };
      if (q.kind === "say") return { html: `Which is a good way to <b>say how you feel</b>?`, speech: `${q.c.text} Which is a good way to say how you feel? ${q.choices.map((c) => c.v.text).join(" Or, ")}` };
      return { html: `Which plan is <b>fair</b> for both?`, speech: `${q.c.text} Which plan is fair for both? ${q.choices.map((c) => c.v.text).join(" Or, ")}` };
    },
    praise(q) {
      if (q.kind === "order") return `Yes! Step ${q.at + 1}: <b>${q.answer.name}</b>. ${q.answer.tip}`;
      if (q.kind === "listen") return `Yes! Good listeners look at the speaker and wait until they finish. Then it's your turn.`;
      if (q.kind === "say") return `Yes! "I feel... when..." words are calm and clear. They tell the other person what's wrong without hurting them.`;
      return `Yes! That plan is fair, because both friends get something they need.`;
    },
    hint(q) {
      if (q.kind === "order") return `${rpick(AGAIN)} Think: first we stop, then we calm our body, then we use words.`;
      if (q.kind === "say") return `${rpick(AGAIN)} Which one uses calm words, like "I feel..."?`;
      if (q.kind === "plan") return `${rpick(AGAIN)} Would both friends think that plan is fair?`;
      return `${rpick(AGAIN)} How would you like people to listen to you?`;
    },
    reveal(q) {
      if (q.kind === "order") return `Step ${q.at + 1} is <b>${q.answer.name}</b>. ${q.answer.tip}`;
      return `A good choice is: <b>${q.choices.find((c) => c.ok).v.text}</b>`;
    },
    onRight(q, box) {
      if (q.kind !== "order") return;
      const step = box.querySelectorAll(".ff-step")[q.at];
      if (step) {
        step.className = "ff-step on";
        step.innerHTML = `<i aria-hidden="true">${q.answer.icon}</i><b>${q.answer.name}</b>`;
        return pop(step);
      }
    },
  },
};

// The race track under every game: the racer moves one step towards the goal for each answer.
const raceHtml = (racer = "🐞", goal = "🏁") => `<div class="ff-race" data-race aria-hidden="true"><span class="ff-race-goal">${goal}</span><span class="ff-racer" data-racer>${racer}</span></div>`;
function raceTo(host, round, rounds) {
  const racer = $("[data-racer]", host);
  if (!racer) return;
  racer.style.left = `calc((100% - 84px) * ${round / rounds} + 6px)`;
}

// A round-based picking game. Taps answer on pointerdown; only classes change, the cards are never rebuilt mid-round.
function runChoice(cfg) {
  const my = token;
  const rounds = cfg.rounds || ROUNDS;
  const skill = skillOf(cfg.id, { start: Math.min(startLevel(), cfg.skill.max), max: cfg.skill.max });
  let round = 0;
  let tries = 0;
  let open = false;
  let q = null;
  let last = null;
  cfg.pending = null;
  stage.innerHTML = `<div class="ff-play" data-play><div class="ff-prompt" data-prompt></div><div class="ff-cards" data-cards></div></div>`;
  const play = $("[data-play]", stage);
  const cards = $("[data-cards]", stage);
  const promptBox = $("[data-prompt]", stage);
  const host = panel(`<div class="ap-row ff-row">${raceHtml(cfg.racer, cfg.goal)}<span class="ap-status" data-level></span><button type="button" class="ap-btn" data-again aria-label="Say it again">🔊<span class="ff-wide"> Again</span></button></div>`);
  const dots = () => {
    raceTo(host, round, rounds);
    $("[data-level]", host).innerHTML = `⭐<span class="ff-wide"> Stage</span> ${skill.level + 1}`;
  };
  host.onclick = (event) => {
    if (event.target.closest("[data-again]") && q) talk(cfg.ask(q), my);
  };
  async function ask() {
    if (my !== token) return;
    q = cfg.gen(skill.level, skill, last);
    last = q.target;
    tries = 0;
    dots();
    const layout = q.layout ?? cfg.layout ?? "";
    play.className = `ff-play ${layout}`;
    // The detective's second step keeps the same clues on screen.
    if (!(q.step === "help" && promptBox.firstElementChild)) promptBox.innerHTML = layout ? q.prompt || "" : "";
    if (q.step !== "help" && promptBox.firstElementChild) anim(promptBox.firstElementChild, [{ transform: "scale(.9)", opacity: 0 }, { transform: "none", opacity: 1 }], 380, { fill: "none" });
    cards.className = `ff-cards n${q.choices.length}`;
    cards.innerHTML = q.choices.map((c, i) => `<button type="button" class="ff-card ff-pick" data-c="${i}" aria-label="${c.label}"><span class="ff-art">${c.art}</span></button>`).join("");
    [...cards.children].forEach((card, i) => anim(card, [{ transform: "translateY(24px)", opacity: 0 }, { transform: "none", opacity: 1 }], 380, { delay: i * 70, fill: "backwards" }));
    open = true;
    await talk(cfg.ask(q), my);
  }
  async function next(up) {
    if (my !== token) return;
    if (up && round < rounds) {
      await levelUp(my);
      if (my !== token) return;
    }
    if (round === Math.ceil(rounds / 2) && round < rounds) {
      surprise();
      await talk(rpick(HALFWAY), my);
      if (my !== token) return;
    }
    if (round >= rounds) return finishCard({ id: cfg.id, ...cfg.finish });
    ask();
  }
  async function choose(button) {
    const c = q.choices[Number(button.dataset.c)];
    if (!open || c.state || my !== token) return;
    if (c.ok) {
      open = false;
      c.state = "good";
      button.classList.add("good");
      for (const b of cards.children) if (b !== button) b.classList.add("dim");
      const up = tries === 0 ? skill.right(q.key) : false;
      MUSIC.chime();
      round += 1;
      window.OC?.count(cfg.count);
      dots();
      cheer(button, round, rounds);
      await Promise.all([pop(button), cfg.onRight?.(q, promptBox, my)]);
      if (my !== token) return;
      await talk(cfg.praise(q, c), my);
      if (my !== token) return;
      next(up);
    } else {
      if (tries === 0) skill.wrong(q.key);
      tries += 1;
      c.state = "bad";
      button.classList.add("bad");
      MUSIC.oops();
      shake(button);
      // With two choices one miss leaves only the answer, so show it straight away.
      if (tries >= Math.min(2, q.choices.length - 1)) {
        open = false;
        const right = cards.children[q.choices.findIndex((x) => x.ok)];
        right.classList.add("hint");
        await talk(cfg.reveal(q, c), my);
        if (my !== token) return;
        round += 1;
        dots();
        next(false);
      } else await talk(cfg.hint(q, c), my);
    }
  }
  onTap(cards, "[data-c]", choose);
  (async () => {
    dots();
    if (cfg.intro) await talk(cfg.intro, my);
    ask();
  })();
}

// ======================================================================
// Games
// ======================================================================
const units = {
  // ---------- See it: what feelings are ----------
  see() {
    const my = token;
    const [mia, leo, amara, sam, priya, jonah, zara, ben] = PEOPLE;
    const label = (x, y, text, size = 30) => `<text x="${x}" y="${y}" text-anchor="middle" font-family="Nunito, sans-serif" font-weight="900" font-size="${size}" fill="#2b1d12">${text}</text>`;
    const bg = (fill = "#f6f4ff") => `<rect width="1000" height="560" fill="${fill}"/>`;
    const emo = (x, y, glyph, size = 80) => `<text x="${x}" y="${y + size * 0.35}" text-anchor="middle" font-size="${size}" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif">${glyph}</text>`;
    const row = (people, feels, api, view, y = 120, size = 200) => {
      const gap = (1000 - feels.length * size) / (feels.length + 1);
      return feels.map((f, i) => {
        const x = gap + i * (size + gap);
        const g = el("g", { opacity: 0 }, view);
        g.innerHTML = `<rect x="${x - 8}" y="${y - 8}" width="${size + 16}" height="${size + 70}" rx="26" fill="#fff" stroke="var(--accent)" stroke-width="4"/>${sceneFace(people[i], f, x, y, size)}${label(x + size / 2, y + size + 46, FEELS[f].word)}`;
        return g;
      });
    };
    const fadeIn = async (api, groups, ms = 380, gap = 250) => {
      for (const g of groups) {
        await api.tween(ms, (t) => g.setAttribute("opacity", t));
        await api.wait(gap);
      }
    };
    const scenes = [
      {
        say: `Welcome to <b>Feelings & Friends</b>! Feelings are like messages from inside us. They tell us how we are, and what we need.`,
        async draw(view, api) {
          view.innerHTML = `${bg()}<circle cx="500" cy="290" r="210" fill="var(--accent-soft)"/>${sceneFace(mia, "happy", 330, 120, 340)}`;
          const note = el("g", { opacity: 0 }, view);
          note.innerHTML = emo(800, 130, "💌", 110);
          await api.tween(900, (t) => {
            note.setAttribute("opacity", t);
            note.setAttribute("transform", `translate(${(1 - t) * -200} ${(1 - t) * 120})`);
          });
        },

  kind: () => runChoice({ ...GAMES.kind, finish: { feel: "proud", icon: "💛", message: "Do a secret kindness today: help lay the table, share a toy, or make a card for someone. Then tell your grown-up how it felt.", speech: "What kind choices! Do a secret kindness today. Help lay the table, share a toy, or make a card for someone. Then tell your grown-up how it felt." } }),
  detective: () => runChoice({ ...GAMES.detective, finish: { feel: "excited", icon: "🔍", message: "Read a picture book with a grown-up. On each page, be a feelings detective: look at the faces and bodies. How do they feel? What would help?", speech: "Super detective work! Read a picture book with a grown-up. On each page, be a feelings detective. Look at the faces and bodies. How do they feel? What would help?" } }),
  fix: () => runChoice({ ...GAMES.fix, finish: { feel: "proud", icon: "🤝", message: "Next time there's a disagreement, try the five steps with a grown-up: stop, calm down, say “I feel… when…”, listen, and choose a fair plan together.", speech: "You're a great problem solver! Next time there's a disagreement, try the five steps with a grown-up. Stop, calm down, say I feel, when, listen, and choose a fair plan together." } }),

  // ---------- Calm-down toolbox: guided breathing, counting and squeezing ----------
  calm() {
    const my = token;
    const TOOLS = [
      { id: "balloon", icon: "🎈", name: "Balloon breaths" },
      { id: "flower", icon: "🌸", name: "Flower and candle" },
      { id: "count", icon: "🖐️", name: "Count to 5" },
      { id: "squeeze", icon: "🍋", name: "Squeeze and let go" },
    ];
    stage.innerHTML = `<div class="ff-calm"><div class="ff-tools" role="group" aria-label="Calm-down tools">${TOOLS.map((t) => `<button type="button" class="ff-card ff-tool" data-tool="${t.id}" aria-label="${t.name}"><span aria-hidden="true">${t.icon}</span><b>${t.name}</b></button>`).join("")}</div><div class="ff-area" data-area></div></div>`;
    const area = $("[data-area]", stage);
    const host = panel(`<p class="ap-dots" data-dots></p><div class="ap-buttons ff-check" data-check hidden><button type="button" data-feel="calmer">😌 Calmer</button><button type="button" data-feel="same">😐 The same</button><button type="button" data-feel="big">😣 Still big</button></div>`);
    const tried = new Set();
    let finished = false;
    let gen = 0;
    const dots = () => ($("[data-dots]", host).textContent = TOOLS.map((t) => (tried.has(t.id) ? "⭐" : "☆")).join(""));
    const check = $("[data-check]", host);
    dots();
    const idle = () => (area.innerHTML = `<div class="ff-idle"><span aria-hidden="true">🧰</span><p>Pick a tool</p></div>`);
    idle();
    talk(`This is your calm-down toolbox. Pick a tool to try! Practice when you feel calm, so the tools are ready when feelings get big.`, my);
    // Counts out loud in time, so the child can breathe along.
    const beat = async (live, n, el) => {
      for (let k = 1; k <= n; k++) {
        if (!live()) return false;
        if (el) el.textContent = k;
        await wait(1000);
      }
      return live();
    };
    const RUN = {
      async balloon(live) {
        area.innerHTML = `<div class="ff-breath"><div class="ff-balloon" data-b><svg viewBox="0 0 200 270" aria-hidden="true">${BALLOON}</svg></div><div class="ff-breath-side"><b class="ff-phase" data-phase></b><b class="ff-count" data-n></b></div></div>`;
        const b = $("[data-b]", area);
        const n = $("[data-n]", area);
        const phase = $("[data-phase]", area);
        b.style.transform = "scale(.55)";
        await talk(`Balloon breaths. Put your hands on your tummy. Breathe in through your nose, and fill your tummy like a balloon. Then let the air out, slowly.`, my);
        for (let i = 0; i < 3; i++) {
          if (!live()) return false;
          phase.textContent = "Breathe in…";
          say(`Breathe in… <small>(${i + 1} of 3)</small>`);
          anim(b, [{ transform: "scale(.55)" }, { transform: "scale(1)" }], 4000, { easing: "ease-in-out" });
          if (!(await beat(live, 4, n))) return false;
          phase.textContent = "And out…";
          say(`And slowly out…`);
          anim(b, [{ transform: "scale(1)" }, { transform: "scale(.55)" }], 5000, { easing: "ease-in-out" });
          if (!(await beat(live, 5, n))) return false;
        }
        n.textContent = "";
        phase.textContent = "";
        return live();
      },
      async flower(live) {
        area.innerHTML = `<div class="ff-fc2"><div class="ff-flower" data-fl aria-hidden="true">🌸</div><div class="ff-candle" aria-hidden="true"><span class="ff-flame" data-flame></span><span class="ff-wax"></span></div><b class="ff-count ff-count2" data-n></b></div>`;
        const fl = $("[data-fl]", area);
        const flame = $("[data-flame]", area);
        const n = $("[data-n]", area);
        await talk(`Smell the flower, blow the candle. Breathe in slowly through your nose, as if you're smelling a flower. Then blow out gently through your mouth, to make the candle flicker.`, my);
        for (let i = 0; i < 3; i++) {
          if (!live()) return false;
          say(`Smell the flower… 🌸 <small>(${i + 1} of 3)</small>`);
          anim(fl, [{ transform: "scale(1)" }, { transform: "scale(1.25)" }], 4000, { easing: "ease-in-out" });
          flame.classList.remove("blown");
          if (!(await beat(live, 4, n))) return false;
          say(`Blow the candle, gently…`);
          anim(fl, [{ transform: "scale(1.25)" }, { transform: "scale(1)" }], 900);
          flame.classList.add("blown");
          if (!(await beat(live, 5, n))) return false;
        }
        flame.classList.remove("blown");
        n.textContent = "";
        return live();
      },
      async count(live) {
        area.innerHTML = `<div class="ff-five">${[1, 2, 3, 4, 5].map((k) => `<span class="ff-num" data-k="${k}">${k}</span>`).join("")}</div>`;
        await talk(`Count to five. Let's count slowly together, and take one slow breath with each number.`, my);
        for (let k = 1; k <= 5; k++) {
          if (!live()) return false;
          const dot = $(`[data-k="${k}"]`, area);
          dot.classList.add("on");
          pop(dot);
          MUSIC.play?.("xylophone", [72, 74, 76, 77, 79][k - 1], { gain: 0.35 });
          await talk(`<b>${k}</b>…`, my);
          await wait(1400);
        }
        if (!live()) return false;
        await talk(`Five! Now count back down: five, four, three, two, one.`, my);
        for (let k = 5; k >= 1; k--) {
          if (!live()) return false;
          $(`[data-k="${k}"]`, area).classList.remove("on");
          await wait(700);
        }
        return live();
      },
      async squeeze(live) {
        area.innerHTML = `<div class="ff-sq"><button type="button" class="ff-lemon" data-lemon aria-label="Squeeze the lemon: press and hold"><span aria-hidden="true">🍋</span></button><b class="ff-phase" data-phase>Press and hold</b></div>`;
        const lemon = $("[data-lemon]", area);
        const phase = $("[data-phase]", area);
        await talk(`Squeeze and let go. Pretend there's a lemon in your hand. Press and hold the lemon, and squeeze your hands tight! Then let go, and feel your hands go soft and floppy.`, my);
        for (let i = 0; i < 3; i++) {
          if (!live()) return false;
          phase.textContent = "Press and hold";
          say(`Press and hold the lemon. Squeeze tight! <small>(${i + 1} of 3)</small>`);
          // Hold for 3 seconds. A keyboard press squeezes for you.
          const ok = await new Promise((resolve) => {
            let timer = 0;
            let done = false;
            const finish = (v) => {
              if (done) return;
              done = true;
              clearInterval(poll);
              clearTimeout(timer);
              lemon.removeEventListener("pointerdown", down);
              lemon.removeEventListener("pointerup", up);
              lemon.removeEventListener("pointercancel", up);
              lemon.removeEventListener("pointerleave", up);
              lemon.removeEventListener("click", key);
              resolve(v);
            };
            const poll = setInterval(() => !live() && finish(false), 300);
            const squeeze = () => {
              lemon.classList.add("held");
              phase.textContent = "Squeeze…";
              VOICE.speak("Squeeze, squeeze, squeeze!");
              timer = setTimeout(() => finish(true), 3000);
            };
            const down = (event) => {
              if (event.button > 0) return;
              window.OC?.touch();
              try {
                lemon.setPointerCapture(event.pointerId);
              } catch {}
              squeeze();
            };
            const up = () => {
              if (done || !lemon.classList.contains("held")) return;
              clearTimeout(timer);
              lemon.classList.remove("held");
              phase.textContent = "Press and hold";
              say(`Keep squeezing a little longer! Press and hold.`);
            };
            const key = (event) => {
              if (event.detail === 0 && !lemon.classList.contains("held")) squeeze();
            };
            lemon.addEventListener("pointerdown", down);
            lemon.addEventListener("pointerup", up);
            lemon.addEventListener("pointercancel", up);
            lemon.addEventListener("pointerleave", up);
            lemon.addEventListener("click", key);
          });
          if (!ok || !live()) return false;
          lemon.classList.remove("held");
          phase.textContent = "Let go…";
          await talk(`And let go… Feel your hands go soft and floppy.`, my);
          await wait(1500);
        }
        return live();
      },
    };
    async function start(tool, button) {
      const g = ++gen;
      const live = () => g === gen && my === token;
      check.hidden = true;
      for (const b of stage.querySelectorAll("[data-tool]")) b.classList.toggle("on", b === button);
      pop(button);
      const ok = await RUN[tool.id](live);
      if (!ok || !live()) return;
      if (!tried.has(tool.id)) sparkle(button);
      tried.add(tool.id);
      dots();
      window.OC?.count("calm tools practiced");
      if (tried.size >= 2) mark("calm", { done: true });
      check.hidden = false;
      check.dataset.gen = g;
      await talk(`Well done! How does your body feel now?`, my);
    }
    onTap(stage, "[data-tool]", (button) => start(TOOLS.find((t) => t.id === button.dataset.tool), button));
    onTap(check, "[data-feel]", async (button) => {
      if (my !== token) return;
      const g = ++gen;
      check.hidden = true;
      pop(button);
      const feel = button.dataset.feel;
      await talk(
        feel === "calmer"
          ? `Brilliant! Your body is getting calm. You can use this tool any time.`
          : feel === "same"
            ? `That's OK. Sometimes it takes a few goes. Try it again, or pick another tool.`
            : `That's OK. Big feelings can take a while to settle. Try another tool, and remember you can always ask a grown-up for a hug or some help.`,
        my,
      );
      if (g !== gen || my !== token) return;
      if (tried.size === TOOLS.length && !finished) {
        finished = true;
        return finishCard({ id: "calm", feel: "calm", icon: "🧰", message: "Make a calm-down corner with a grown-up: a cushion, a soft toy, and pictures of your calm tools. Practice balloon breaths at bedtime, when you already feel calm.", speech: "You tried every calm-down tool! Make a calm-down corner with a grown-up, with a cushion, a soft toy, and pictures of your calm tools. Practice balloon breaths at bedtime, when you already feel calm." });
      }
      for (const b of stage.querySelectorAll("[data-tool]")) b.classList.remove("on");
      idle();
      if (tried.size < TOOLS.length) say(`Pick a tool to try.`, { voice: false });
    });
  },
};

.ff-steps-up li{padding:6px 10px;border-radius:14px;background:#fff;font:900 clamp(16px,min(8cqw,10cqh),28px)/1.15 var(--sans);color:#2b1d12;box-shadow:inset calc(var(--h) * 10px) 0 0 rgba(229,57,53,calc(var(--h) * .3))}
/* thermometers */
.ff-th{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:0}
.ff-th svg{flex:1 1 0;min-height:0;width:100%;height:auto}
.ff-th b{flex:none}
.ff-th b{font:900 clamp(17px,min(13cqw,13cqh),32px)/1.1 var(--sans)}
.ff-see-th{width:300px;height:480px;container-type:size}
/* detective clues */
.ff-clues{width:100%;height:100%;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1fr) minmax(0,1.2fr);gap:8px;padding:8px}
.ff-clue{position:relative;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 10px;border-radius:18px;background:#fff;box-shadow:0 3px 0 #d9d6ec;container-type:size;transition:box-shadow .3s ease}
.ff-clue small{position:absolute;left:8px;top:6px;font:900 clamp(11px,1.6vh,14px)/1 var(--sans);color:var(--accent-dark);text-transform:uppercase;letter-spacing:.04em}
.ff-clue svg{width:100%;height:calc(100% - 20px);margin-top:16px}
.ff-clue p{margin:14px 0 0;font:800 clamp(13px,min(8.5cqw,11cqh),24px)/1.28 var(--sans);color:#2b1d12;text-align:center;text-wrap:balance}
.ff-clue.solved{box-shadow:0 0 0 4px #22a05a}
/* solving steps */
.ff-path{width:100%;height:100%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:10px;align-items:center}
.ff-step{height:min(100%,180px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;border-radius:18px;background:rgba(255,255,255,.55);border:3px dashed #c7c3ea;text-align:center;container-type:size}
.ff-step i{font-style:normal;font:900 clamp(22px,min(36cqh,40cqw),56px)/1 var(--sans);color:#a5a1cf}
.ff-step b{font:900 clamp(11px,min(12cqw,13cqh),20px)/1.1 var(--sans);color:#2b1d12}
.ff-step.on{background:#fff;border:3px solid var(--accent)}
.ff-step.on i{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-weight:400}
.ff-step.q{background:#fff;border:3px dashed var(--accent);animation:ff-q 1.4s ease-in-out infinite}
.ff-step.q i{color:var(--accent)}
/* race track */
.ff-row{flex-wrap:nowrap;width:min(100%,620px)}
.ff-race{position:relative;flex:1 1 220px;min-width:140px;height:44px;border-radius:22px;background:#e9f5e1;box-shadow:inset 0 0 0 3px #b6dca0}
.ff-race::before{content:"";position:absolute;left:14px;right:44px;top:50%;height:3px;margin-top:-1px;background:repeating-linear-gradient(90deg,#9ccc85 0 8px,transparent 8px 16px)}
.ff-race-goal{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:24px;line-height:1}
.ff-racer{position:absolute;left:6px;top:50%;margin-top:-17px;font-size:30px;line-height:34px;transition:left .9s cubic-bezier(.3,.8,.3,1)}
@media (max-width:480px){.ff-wide{display:none}.ff-row{gap:6px}.ff-row .ap-btn{min-width:52px;padding:0 12px}}
/* Calm-down toolbox */
.ff-calm{position:absolute;inset:0;display:grid;grid-template-columns:minmax(150px,.32fr) minmax(0,1fr);gap:clamp(8px,1.6vw,16px);padding:clamp(8px,1.6vw,16px)}
.ff-tools{display:grid;grid-template-rows:repeat(4,minmax(0,1fr));gap:clamp(6px,1.2vh,12px);min-height:0}
.ff-tool{grid-template-columns:auto 1fr;gap:10px;justify-items:start;padding:6px 14px;text-align:left}
.ff-tool span{font-size:clamp(28px,6vh,48px);line-height:1}
.ff-tool b{font:900 clamp(14px,2.4vh,20px)/1.15 var(--sans)}
.ff-tool.on{box-shadow:0 0 0 5px var(--accent),0 6px 0 var(--accent-dark)}
.ff-area{position:relative;min-height:0;border-radius:24px;background:radial-gradient(circle at 50% 45%,#fff,var(--accent-soft));overflow:hidden;display:grid;place-items:center}
.ff-idle{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--accent-dark)}
.ff-idle span{font-size:clamp(60px,16vh,120px);line-height:1}
.ff-idle p{margin:0;font:900 clamp(18px,3vh,26px) var(--sans)}
.ff-breath{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:4%;padding:12px}
.ff-balloon{height:92%;aspect-ratio:200/270;transform-origin:50% 75%;will-change:transform}
.ff-balloon svg{width:100%;height:100%}
.ff-breath-side{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:6em}
.ff-phase{font:900 clamp(20px,3.6vh,34px)/1.1 var(--sans);color:var(--accent-dark);text-align:center}
.ff-count{font:900 clamp(48px,12vh,110px)/1 var(--sans);color:var(--accent);min-height:1em}
.ff-fc2{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10%}
.ff-flower{font-size:clamp(70px,22vh,180px);line-height:1;will-change:transform}
.ff-candle{position:relative;display:flex;flex-direction:column;align-items:center}
.ff-wax{width:clamp(36px,7vh,60px);height:clamp(90px,24vh,190px);border-radius:10px 10px 6px 6px;background:linear-gradient(90deg,#fff3e0,#ffe0b2);box-shadow:inset -6px 0 0 #ffcc80}
.ff-flame{width:clamp(22px,4.4vh,38px);height:clamp(38px,8vh,66px);margin-bottom:4px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(circle at 50% 70%,#fff59d,#ffb300 55%,#ff7043);transform-origin:50% 100%;animation:ff-flicker 1.2s ease-in-out infinite alternate;transition:transform 1.2s ease}
.ff-flame.blown{animation:ff-blow .5s ease-in-out infinite alternate}
.ff-count2{position:absolute;right:5%;bottom:5%;font-size:clamp(34px,8vh,70px)}
.ff-five{display:flex;gap:clamp(6px,2vw,22px);flex-wrap:wrap;justify-content:center;padding:10px}
.ff-num{display:grid;place-items:center;width:clamp(54px,min(15vw,16vh),120px);aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 0 0 4px #d9d6ec;font:900 clamp(26px,min(8vw,8vh),60px)/1 var(--sans);color:#a5a1cf;transition:background .4s ease,color .4s ease,box-shadow .4s ease}
.ff-num.on{background:var(--accent);color:#fff;box-shadow:0 0 0 6px var(--accent-soft),0 0 24px var(--accent)}
.ff-sq{display:flex;flex-direction:column;align-items:center;gap:10px}
.ff-lemon{display:grid;place-items:center;width:clamp(140px,min(36vh,40vw),260px);aspect-ratio:1;border:0;border-radius:50%;background:#fffde7;box-shadow:0 0 0 6px #fff59d,0 8px 0 #f9e27a;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.ff-lemon span{font-size:clamp(80px,min(22vh,24vw),170px);line-height:1;transition:transform .5s ease}
.ff-lemon.held span{transform:scale(1.12,.72)}
.ff-lemon.held{box-shadow:0 0 0 10px #ffd54f,0 4px 0 #f9e27a}
.ff-lemon:focus-visible{outline:4px solid #ffcf5c;outline-offset:4px}
.ff-check[hidden]{display:none}
@media (max-aspect-ratio:1/1){
  .ff-play,.ff-cards{flex-direction:column}
  .ff-prompt{flex-basis:34%}
  .ff-play.stack .ff-prompt{flex-basis:46%}
  .ff-play.stack .ff-cards,.ff-play.side.across .ff-cards{flex-direction:row}
  .ff-play.stack .ff-cards.n4,.ff-play.side .ff-cards.n4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
  .ff-calm{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .ff-tools{grid-template-rows:none;grid-template-columns:repeat(4,minmax(0,1fr))}
  .ff-tool{grid-template-columns:none;justify-items:center;padding:6px 4px;text-align:center;min-height:76px}
  .ff-tool b{font-size:12px}
  .ff-clues{grid-template-columns:minmax(0,.7fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
  .ff-clue[data-clue="0"]{grid-row:span 2}
  .ff-path{gap:4px;padding:6px}
  .ff-step{border-width:2px}
}
/* end card */
.ff-done{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vw,32px);padding:16px;background:radial-gradient(circle at 30% 40%,#fff,var(--accent-soft))}
.ff-done-pic{position:relative;height:min(70%,320px);aspect-ratio:1}
.ff-done-pic svg{width:100%;height:100%}
.ff-done-badge{position:absolute;right:-4%;bottom:2%;display:grid;place-items:center;width:30%;aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 4px 0 #d9d6ec;font-size:clamp(26px,5vw,44px)}
.ff-done-text{max-width:30em}
.ff-done-text h2{margin:0 0 8px;color:var(--accent-dark);font:900 clamp(20px,3vw,30px)/1.15 var(--sans)}
.ff-done-text p{margin:0;color:#2b1d12;font:700 clamp(17px,2.4vw,24px)/1.35 var(--sans)}
@media (max-aspect-ratio:1/1){.ff-done{flex-direction:column;text-align:center}.ff-done-pic{height:40%}}
@keyframes ff-glow{0%,100%{box-shadow:0 0 0 3px #e6e4f5,0 6px 0 #d9d6ec}50%{box-shadow:0 0 0 8px #ffcf5c,0 6px 0 #d9d6ec}}
@keyframes ff-q{0%,100%{transform:none}50%{transform:scale(1.05)}}
@keyframes ff-flicker{from{transform:rotate(-3deg) scaleY(1)}to{transform:rotate(3deg) scaleY(1.08)}}
@keyframes ff-blow{from{transform:rotate(-28deg) scale(.7,.55)}to{transform:rotate(-18deg) scale(.6,.45)}}
@media (prefers-reduced-motion:reduce){.ff-card.hint,.ff-step.q,.ff-flame{animation:none}.ff-flame.blown{animation:none;transform:rotate(-24deg) scale(.65,.5)}.ff-racer{transition:none}}
`;
document.head.appendChild(style);
</script>
</body>
</html>
