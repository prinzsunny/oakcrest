const PATTERN_KINDS = [["AB"], ["AB", "AAB", "ABB"], ["AAB", "ABB", "ABC"], ["ABC", "AABB", "ABCC", "AABC"]];
const CARGO = ["bus", "fire", "boat", "plane", "digger", "police"];

const uid = (p) => `zt${p}${++uidN}`;
const SKIN = "#c98d68";

// Learning that adapts. Each game keeps a level for the child:
// three right first time in a row → a little harder; two misses in a row → a little easier.
// Missed items are remembered and come back in later rounds until they are right first time.
// ======================================================================
function skillOf(id, { start = 1, max = 3 } = {}) {
  const saved = shell.progress()[id] || {};
  let level = Math.max(0, Math.min(max, saved.level ?? start));
  let missed = Array.isArray(saved.missed) ? saved.missed : [];
  let streak = 0;
  let slips = 0;
  const save = () => mark(id, { level, missed });
  return {
    get level() {
      return level;
    },
    max,
    // Right first time. Returns true when the level goes up.
    right(key) {
      streak += 1;
      slips = 0;
      missed = missed.filter((k) => k !== key);
      const up = streak >= 3 && level < max;
      if (up) {
        level += 1;
        streak = 0;
      }
      save();
      return up;
    },
    wrong(key) {
      streak = 0;
      slips += 1;
      missed = [key, ...missed.filter((k) => k !== key)].slice(0, 8);
      if (slips >= 2 && level > 0) {
        level -= 1;
        slips = 0;
      }
      save();
    },
    // Not the same as last time; a missed item comes back about two rounds in five.
    pick(list, keyOf, last) {
      const others = list.filter((x) => x !== last);
      const pool = others.length ? others : list;
      const review = pool.filter((x) => missed.includes(keyOf(x)));
      return review.length && Math.random() < 0.4 ? rpick(review) : rpick(pool);

      const others = shuffle(FIRST_LETTERS.filter((l) => soundGroup(l) !== soundGroup(target.letter))).slice(0, choicesFor(level) - 1);
      return {
        target,
        key: target.word,
        prompt: `<div class="zt-word-pic"><span class="zt-word-art">${picOf(target.pic)}</span><b data-word>${target.word}</b></div>`,
        choices: shuffle([target.letter, ...others]).map((l) => ({ v: l, ok: l === target.letter, art: letterCard(l), label: `letter ${l}` })),
      };
    },
    ask: (q) => ({ html: `<b>${cap(q.target.word)}</b>. What letter does <b>${q.target.word}</b> start with?`, speech: `${cap(q.target.word)}. ${cap(q.target.word)}. What letter does ${q.target.word} start with?` }),
    onRight(q, box) {

    hint(q, c) {

      return { html: `${big(c.v)} starts words like <b>${like.word}</b>. Listen again: <b>${q.target.word}</b>.`, speech: `${cap(LN(c.v))} starts words like ${like.word}. Listen to the start: ${q.target.word}, ${q.target.word}. Try again!` };
    },
    reveal: (q) => ({ html: `<b>${cap(q.target.word)}</b> starts with ${big(q.target.letter)}.`, speech: `${cap(q.target.word)} starts with ${LN(q.target.letter)}. ${cap(LN(q.target.letter))}, ${q.target.word}.` }),
  },
  rhyme: {
    id: "phonics",
    count: "rhymes found",
    layout: "side",
    stay: true,
    skill: { start: 0, max: 2 },
    gen(level, skill, last) {
      const target = skill.pick(RHYMES, (r) => r.word, last);
      const others = shuffle(RHYMES.filter((r) => r !== target)).slice(0, Math.max(2, choicesFor(level)) - 1);
      return {
        target,
        key: `rhyme:${target.word}`,
        prompt: `<div class="zt-word-pic"><span class="zt-word-art">${emojiPic(target.pic)}</span><b>${target.word}</b></div>`,
        choices: shuffle([target, ...others]).map((r) => ({ v: r, ok: r === target, art: picCard(r.rpic, r.rhyme), label: r.rhyme })),
      };
    },
    ask: (q) => `Which one rhymes with <b>${q.target.word}</b>? ${cap(q.target.word)}...`,
    praise: (q) => `Yes! ${cap(q.target.word)}, ${q.target.rhyme}! They sound the same at the end. That's a rhyme!`,
    hint: (q, c) => `Listen: ${q.target.word}, ${c.v.rhyme}. Do they sound the same at the end? Try again!`,
    reveal: (q) => `${cap(q.target.word)}, ${q.target.rhyme}. They rhyme!`,
  },
  patterns: {
    id: "patterns",
    count: "patterns finished",
    layout: "stack",
    stay: true,
    skill: { start: 0, max: 3 },
    gen(level, skill, last) {
      const kind = skill.pick(PATTERN_KINDS[Math.min(level, 3)], (k) => k, last?.kind);
      const letters = [...new Set(kind)];
      // From level 3 the wagons sometimes carry vehicles instead of being colours.
      const mode = level >= 2 && Math.random() < 0.5 ? "cargo" : "color";
      const source = mode === "color" ? shuffle(COLORS) : shuffle(CARGO).map((id) => ({ id, name: V[id].name }));
      const items = letters.map((_, i) => source[i]);
      const unit = [...kind].map((ch) => items[letters.indexOf(ch)]);
      // "What comes next?", or from level 3 sometimes "What goes in the gap?"
      const missing = level >= 2 && Math.random() < 0.35;
      const length = Math.min(8, unit.length * 2 + 1 + Math.floor(Math.random() * unit.length));
      const full = Array.from({ length }, (_, i) => unit[i % unit.length]);
      const gap = missing ? unit.length + Math.floor(Math.random() * (length - unit.length - 1)) : length - 1;
      const shown = full.map((x, i) => (i === gap ? null : x));
      const answer = full[gap];
      // Wrong choices: first the other wagons in the pattern (so the child must think), then a new one.
      const n = level === 0 ? 2 : 3;
      const others = [...items.filter((x) => x !== answer), ...source.slice(letters.length)].slice(0, n - 1);
      return {
        target: { kind },
        key: kind,
        missing,
        full,
        shown,
        unit,
        answer,
        mode,
        prompt: patternTrain(missing ? shown : shown.slice(0, gap + 1), mode),
        choices: shuffle([answer, ...others]).map((x) => ({ v: x, ok: x === answer, art: wagonCard(x, mode), label: x.name })),
      };
    },
    ask: (q) =>
      q.missing
        ? `One wagon is missing! ${q.shown.map((x) => (x ? x.name : "hmm")).join(", ")}. What goes in the gap?`
        : `Look at the train! ${q.full.slice(0, -1).map((x) => x.name).join(", ")}... What comes next?`,
    async onRight(q, box, my) {
      box.innerHTML = patternTrain(q.full, q.mode);
      const train = box.firstElementChild;
      pop(train);
      sfx("whistle");
      await wait(500);
      if (my === token) train.classList.add("driving");
    },
    praise: (q) => `Yes! ${q.full.map((x) => x.name).join(", ")}! The pattern is ${q.unit.map((x) => x.name).join(", ")}, again and again.`,
    hint: () => `Let's say the pattern out loud together. What repeats? Try again!`,
    reveal: (q) => `It's ${q.answer.name}! ${q.unit.map((x) => x.name).join(", ")}, ${q.unit.map((x) => x.name).join(", ")}.`,
  },
  sizes: {
    id: "sizes",
    count: "opposites found",
    skill: { start: 0, max: 2 },
    stay: true,
    gen(level, skill, last) {
      const pair = skill.pick(OPPOSITES.filter((p) => p.min <= level), (p) => p.words[0], last?.pair);
      const word = rpick(pair.words);
      const thing = pair.thing();
      return { target: { pair, word }, key: pair.words[0], pair, word, thing, choices: shuffle(pair.words).map((w) => ({ v: w, ok: w === word, art: pair.art(w, thing), label: w })) };
    },
    ask: (q) => q.pair.ask(q.word, q.thing),
    praise: (q) => `Yes! ${q.pair.told(q.word, q.thing)} ${cap(q.pair.words[0])} and ${q.pair.words[1]} are opposites!`,
    hint: (q, c) => `${q.pair.told(c.v, q.thing)} Find the one that is ${q.word}.`,
    reveal: (q) => `Here it is. ${q.pair.told(q.word, q.thing)} ${cap(q.pair.words[0])} and ${q.pair.words[1]} are opposites.`,
  },
  traffic: {
    id: "traffic",
    count: "road safety rules",
    layout: "side",
    stay: true,
    skill: { start: 0, max: 2 },
    gen(level, skill, last) {
      const pool = ["red", "green", ...(level >= 1 ? ["yellow"] : []), ...(level >= 2 ? ["walk", "hand"] : [])];
      const sig = skill.pick(pool, (s) => s, last);
      const walking = sig === "walk" || sig === "hand";
      const acts = walking ? [ACTS.cross, ACTS.wait] : level >= 1 ? [ACTS.stop, ACTS.go, ACTS.slow] : [ACTS.stop, ACTS.go];
      return { target: sig, key: sig, sig, prompt: signalPrompt(sig), choices: shuffle(acts).map((a) => ({ v: a, ok: a.key === SIGNALS[sig].act, art: picCard(a.icon, a.label), label: a.label })) };
    },
    ask: (q) => SIGNALS[q.sig].ask,
    praise: (q) => `Yes! ${SIGNALS[q.sig].why}`,
    hint: (q, c) => `Hmm, ${c.v.label.toLowerCase()}? Look at the light again. Which one is shining?`,
    reveal: (q) => SIGNALS[q.sig].why,
    async onRight(q, box) {
      const mover = $(".zt-tcar", box);
      if (!mover) return;
      const act = SIGNALS[q.sig].act;
      if (act === "go" || act === "cross") {
        sfx(act === "go" ? "horn" : "");
        await anim(mover, [{ transform: "none" }, { transform: "translateX(160%)" }], 1300, { easing: "ease-in" });
      } else if (act === "slow") await anim(mover, [{ transform: "none" }, { transform: "translateX(40%)" }], 2200, { easing: "ease-out" });
      else await shake(mover);
    },
  },
  who: {
    id: "who",
    count: "helpers matched",
    layout: "side",
    skill: { start: 1, max: 2 },
    gen(level, skill, last) {
      const target = skill.pick(VEHICLES, (v) => v.id, last);
      const others = shuffle(VEHICLES.filter((v) => v !== target)).slice(0, choicesFor(level) - 1);
      return { target, key: target.id, prompt: character(target.role), choices: shuffle([target, ...others]).map((v) => ({ v, ok: v === target, art: vehicle(v.id), label: v.name })) };
    },
    ask: (q) => `${cap(isA(ROLES[q.target.role].a))}! Which vehicle does ${ROLES[q.target.role].a} drive?`,
    praise: (q) => `Yes! ${cap(ROLES[q.target.role].a)} drives the ${q.target.name}. ${ROLES[q.target.role].does}`,
    hint: (q, c) => `That is the ${c.v.name}. Look at the hat. Which one is for ${ROLES[q.target.role].a}?`,
    reveal: (q) => `${cap(ROLES[q.target.role].a)} drives the ${q.target.name}.`,
    sound: (q) => q.target.sound,
  },
  hear: {
    id: "hear",
    count: "sounds matched",
    layout: "side",
    skill: { start: 1, max: 2 },
    gen(level, skill, last) {
      const target = skill.pick(VEHICLES, (v) => v.id, last);
      // Never two vehicles that sound alike (the three sirens) in one round.
      const pool = shuffle(VEHICLES.filter((v) => v.group !== target.group));
      const others = [];
      for (const v of pool) if (others.length < choicesFor(level) - 1 && !others.some((o) => o.group === v.group)) others.push(v);
      return { target, key: target.id, prompt: `<button type="button" class="zt-card zt-ear" data-hear aria-label="Play the sound again"><span>🔊</span><small>Listen</small></button>`, choices: shuffle([target, ...others]).map((v) => ({ v, ok: v === target, art: vehicle(v.id), label: v.name })) };
    },
    ask: () => `Listen! Which vehicle makes this sound?`,
    afterAsk: (q) => playHear(q),
    onPrompt: (q) => playHear(q),
    praise: (q) => `Yes! The ${q.target.name} goes: ${q.target.noise}`,
    hint: (q, c) => `The ${c.v.name} goes: ${c.v.noise} Listen again.`,
    reveal: (q) => `That was the ${q.target.name}. ${q.target.noise}`,
  },
};
function playHear(q) {
  const ear = $("[data-hear]", stage);
  if (ear) {
    ear.classList.add("playing");
    setTimeout(() => ear.classList.remove("playing"), sfx(q.target.sound) || 600);
  }
}
// A round that carries its kind's words and layout, so one game can switch kinds from round to round.
const HANDLERS = ["layout", "stay", "ask", "praise", "hint", "reveal", "sound", "onRight", "afterAsk", "onPrompt", "count"];
function roundOf(kind, level, skill, last) {
  const q = kind.gen(level, skill, last);
  q.h = Object.fromEntries(HANDLERS.map((k) => [k, kind[k] ?? (k === "layout" ? "" : undefined)]));
  return q;
}
// Road trip: a story mission. Each stop is a round from any game, at the level the child has reached in that game.

const TRIP_KINDS = ["find", "colors", "shapes", "letters", "firstSound", "rhyme", "patterns", "sizes", "traffic", "who"];

// ---------- the world behind a vehicle: road, tracks, sky or water ----------
const worldHtml = (where) => `<div class="zt-world" data-world="${where}"><div class="zt-sun"></div><div class="zt-cloud c1"></div><div class="zt-cloud c2"></div><div class="zt-cloud c3"></div><div class="zt-ground"></div><div class="zt-lane" data-lane></div></div>`;
// The same worlds as SVG, for See it scenes (1000 × 560).
function svgWorld(where) {
  const sky = `<rect width="1000" height="560" fill="#d6efff"/><circle cx="900" cy="80" r="46" fill="#ffd54f"/><g fill="#fff"><ellipse cx="200" cy="90" rx="70" ry="26"/><ellipse cx="240" cy="74" rx="44" ry="28"/><ellipse cx="560" cy="60" rx="60" ry="22"/></g>`;
  if (where === "water") return `${sky}<rect y="430" width="1000" height="130" fill="#29b6f6"/><path d="M0 440 q25 -14 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0" stroke="#e1f5fe" stroke-width="6" fill="none"/>`;
  if (where === "sky") return `${sky}<path d="M0 520 Q250 470 500 510 T1000 500 V560 H0Z" fill="#8bc34a"/>`;
  if (where === "tracks") return `${sky}<rect y="450" width="1000" height="110" fill="#8bc34a"/><rect y="490" width="1000" height="40" fill="#a1887f"/><g fill="#6d4c41">${Array.from({ length: 34 }, (_, i) => `<rect x="${i * 30}" y="490" width="14" height="40"/>`).join("")}</g><rect y="494" width="1000" height="6" fill="#90a4ae"/><rect y="520" width="1000" height="6" fill="#90a4ae"/>`;
  return `${sky}<rect y="450" width="1000" height="110" fill="#8bc34a"/><rect y="478" width="1000" height="82" fill="#5b5f66"/><g fill="#fff">${Array.from({ length: 12 }, (_, i) => `<rect x="${i * 90}" y="515" width="50" height="7" rx="3"/>`).join("")}</g>`;
}
// Where a 260 × 160 vehicle sits in a See it scene, so its wheels touch the ground.
const sceneSpot = (where) => (where === "sky" ? { y: 40 } : where === "water" ? { y: 156 } : { y: 130 });

// ======================================================================
// Games
// ======================================================================
const units = {
  // ---------- See it: meet each vehicle and its helper ----------
  see() {
    const my = token;
    const intro = {
      say: `Welcome to <b>Zoom Town</b>! Vehicles carry people and things from place to place. Helpers drive them. Let's meet them!`,
      async draw(view, api) {
        view.innerHTML = svgWorld("road");
        const kid = el("g", {}, view);
        kid.innerHTML = character("kid", 'x="20" y="225" width="270" height="337"');
        const car = el("g", {}, view);
        car.innerHTML = vehicle("car", 'x="330" y="130" width="600" height="370" class="zt-v driving"', { fill: "#1e88e5" });

    const scenes = [
      intro,
      ...VEHICLES.map((v) => ({
        say: `This is the <b>${v.name}</b>. ${v.fact} ${cap(isA(ROLES[v.role].a))}!`,
        async draw(view, api) {
          view.innerHTML = svgWorld(v.where);

          car.innerHTML = vehicle(v.id, `x="330" y="${sceneSpot(v.where).y}" width="600" height="370" class="zt-v driving"`);

          who.innerHTML = character(v.role, 'x="20" y="225" width="270" height="337"');
          await api.tween(1400, (t) => car.setAttribute("transform", `translate(${(1 - t) * 700} 0)`));

          });

      })),
      {
        say: `Vehicles go on <b>roads</b>, on <b>tracks</b>, in the <b>sky</b> and on the <b>water</b>. Now let's play!`,
        async draw(view, api) {
          view.innerHTML = `<rect width="1000" height="560" fill="#fff8f0"/>`;
          const spots = [["bus", 40, 40, "Road"], ["train", 520, 40, "Tracks"], ["plane", 40, 300, "Sky"], ["boat", 520, 300, "Water"]];

  // ---------- Drive! Free play: tap a vehicle, it drives in with its sound ----------
  drive() {
    const my = token;
    stage.innerHTML = `<div class="zt-root">${worldHtml("road")}<div class="zt-garage" role="group" aria-label="Vehicles">${VEHICLES.map((v) => `<button type="button" class="zt-card zt-g" data-v="${v.id}" aria-label="${v.name}">${vehicle(v.id)}</button>`).join("")}</div></div>`;
    const world = $(".zt-world", stage);
    const lane = $("[data-lane]", stage);
    const host = panel(`<p class="ap-dots" data-dots></p>`);
    const seen = new Set();
    let gen = 0;
    let current = null;
    const dots = () => ($("[data-dots]", host).textContent = VEHICLES.map((v) => (seen.has(v.id) ? "⭐" : "☆")).join(""));
    dots();
    say(`Tap a vehicle to make it go!`);
    async function go(v, button) {
      const g = ++gen;
      const live = () => g === gen && my === token;
      pop(button);
      // The vehicle on the road leaves fast; the new one rolls in. Nothing else on screen changes.
      if (current) {
        const old = current;
        anim(old, [{ transform: getComputedStyle(old).transform === "none" ? "translateX(0)" : getComputedStyle(old).transform }, { transform: "translateX(130%)" }], 350).then(() => old.remove());
      }
      world.dataset.world = v.where;
      const car = document.createElement("div");
      car.className = `zt-car zt-in-${v.where}`;
      car.innerHTML = vehicle(v.id, 'class="zt-v driving"');
      lane.appendChild(car);
      current = car;
      const length = sfx(v.sound);
      say(`<b>${cap(v.name)}!</b> ${v.noise}`, { voice: !length });
      await anim(car, [{ transform: "translateX(-130%)" }, { transform: "translateX(0)" }], 1100);
      if (!live()) return;
      car.querySelector("svg").classList.remove("driving");
      car.classList.add("parked");
      if (!seen.has(v.id)) sparkle(car);
      seen.add(v.id);
      dots();
      window.OC?.count("vehicles driven");
      await wait(Math.max(0, length - 1000));
      if (!live()) return;
      await talk(`The ${v.name}! ${v.fact} ${cap(isA(ROLES[v.role].a))}!`, my);
      if (!live()) return;
      if (seen.size === VEHICLES.length && !shell.progress().drive?.done) {
        mark("drive", { done: true });
        confetti();
        MUSIC.chime();
        await talk(`You drove every vehicle! Super driving!`, my);
        await giveSticker(my);
      } else if (seen.size === 4 && !shell.progress().drive?.done) mark("drive", { done: true });
    }
    onTap(stage, "[data-v]", (button) => go(V[button.dataset.v], button));
  },

  colors: () => runChoice({ ...GAMES.colors, finish: { role: "kid", icon: "🎨", message: "On your next ride, look for red cars. How many can you count?", speech: "You know your car colours! On your next ride, look for red cars. How many can you count?" } }),
  // ---------- Shapes: wheels are circles, signs are triangles ----------
  shapes: () => runChoice({ ...GAMES.shapes, finish: { role: "builder", icon: "🔷", message: "Go on a shape hunt outside: circles on wheels, rectangles on doors, triangles on signs. How many can you find?", speech: "You know your shapes! Go on a shape hunt outside. Look for circles on wheels, rectangles on doors and triangles on signs." } }),
  // ---------- Big & small: opposites ----------
  sizes: () => runChoice({ ...GAMES.sizes, finish: { role: "kid", icon: "📏", message: "Line up your toy cars from the smallest to the biggest. Then make one go fast and one go slow.", speech: "You know your opposites! Line up your toy cars from the smallest to the biggest. Then make one go fast and one go slow." } }),
  // ---------- Traffic lights: stop, go, slow down, and crossing the road ----------
  traffic: () => runChoice({ ...GAMES.traffic, finish: { role: "police", icon: "🚦", message: "On your next walk, stop at the crossing, hold a grown-up's hand, and look left and right. Tell your grown-up what the light says.", speech: "You know the road safety rules! On your next walk, stop at the crossing, hold a grown-up's hand, and look left and right. Tell your grown-up what the light says." } }),

  // ---------- Count them: tap each vehicle to count, then pick how many ----------
  count() {
    const my = token;
    const skill = skillOf("count", { start: 0, max: 4 });
    // Level → how many vehicles: 1–3, then 2–5, 3–7, 4–10, 6–10.
    const RANGE = [[1, 3], [2, 5], [3, 7], [4, 10], [6, 10]];
    const SCALE = [72, 74, 76, 77, 79, 81, 83, 84, 86, 88];
    const rounds = 8;
    let round = 0;
    let tries = 0;
    let open = false;
    let q = null;
    let lastN = 0;
    stage.innerHTML = `<div class="zt-root">${worldHtml("road")}<div class="zt-nums" data-nums></div></div>`;
    const world = $(".zt-world", stage);
    $("[data-lane]", world).remove();
    const lot = document.createElement("div");
    lot.className = "zt-lot";
    world.appendChild(lot);
    const nums = $("[data-nums]", stage);
    const host = panel(`<div class="ap-row zt-row">${raceHtml("police")}<span class="ap-status" data-level></span><button type="button" class="ap-btn" data-again aria-label="Say it again">🔊<span class="zt-wide"> Again</span></button></div>`);
    const dots = () => {
      raceTo(host, round, rounds);
      $("[data-level]", host).innerHTML = `🚦<span class="zt-wide"> Level</span> ${skill.level + 1}`;
    };
    const many = () => (q.n === 1 ? q.v.name : plural(q.v.name));
    const question = () => (q.add ? `How many <b>${plural(q.v.name)}</b> now? Tap each one to count.` : `How many <b>${plural(q.v.name)}</b>? Tap each one to count.`);
    host.onclick = (event) => event.target.closest("[data-again]") && q && talk(question(), my);

    async function ask() {
      if (my !== token) return;
      const [lo, hi] = RANGE[skill.level];
      let n = lo + Math.floor(Math.random() * (hi - lo + 1));
      if (n === lastN && hi > lo) n = n === hi ? lo : n + 1;
      lastN = n;
      // From level 3, some rounds add: a few vehicles are parked, then one or two more drive in.
      const add = skill.level >= 2 && n >= 3 && Math.random() < 0.4 ? rpick([1, 2]) : 0;
      q = { n, add, v: rpick(ROAD), counted: 0, tapped: new Set(), ready: !add };
      tries = 0;
      dots();
      // One or two rows; never fewer than three columns, so one vehicle is not giant.
      const perRow = n <= 5 ? n : Math.ceil(n / 2);
      lot.style.gridTemplateColumns = `repeat(${perRow}, minmax(0, 1fr))`;
      lot.style.padding = `0 ${Math.max(0, 3 - perRow) * 16}%`;
      lot.style.gridTemplateRows = `repeat(${Math.ceil(n / perRow)}, minmax(0, 1fr))`;
      lot.innerHTML = Array.from({ length: n }, (_, i) => `<button type="button" class="zt-cv" data-i="${i}" aria-label="${q.v.name}">${vehicle(q.v.id, 'class="zt-v driving" preserveAspectRatio="xMidYMax meet"')}<span class="zt-badge" hidden></span></button>`).join("");
      const arrive = (car, i) => anim(car, [{ transform: "translateX(-120vw)" }, { transform: "none" }], 900, { delay: i * 90, fill: "backwards" }).then(() => car.querySelector("svg")?.classList.remove("driving"));
      const cars = [...lot.children];
      const later = cars.slice(n - add);
      for (const car of later) car.style.visibility = "hidden";
      cars.slice(0, n - add).forEach(arrive);
      // Number choices: the answer and two near it, in counting order.
      const near = shuffle([n - 2, n - 1, n + 1, n + 2].filter((k) => k >= 1 && k <= 10)).slice(0, 2);
      nums.innerHTML = [n, ...near]
        .sort((a, b) => a - b)
        .map((k) => `<button type="button" class="zt-card zt-num" data-n="${k}" aria-label="${k}"><b>${k}</b><span class="zt-pips" aria-hidden="true">${"●".repeat(k)}</span></button>`)
        .join("");
      open = true;
      if (add) {
        const a = n - add;
        await talk(`There ${a === 1 ? "is" : "are"} <b>${a}</b> ${a === 1 ? q.v.name : plural(q.v.name)}. Look! Here ${add === 1 ? "comes" : "come"} <b>${add}</b> more!`, my);
        if (my !== token) return;
        sfx(q.v.sound);
        later.forEach((car, i) => {
          car.style.visibility = "";
          car.classList.add("zt-new");
          arrive(car, i);
        });
        await wait(900);
        q.ready = true;
      }
      talk(question(), my);
    }
    // Count out loud, one vehicle at a time. The last number said tells how many.
    async function countTogether() {
      q.counted = 0;
      q.tapped.clear();
      for (const b of lot.querySelectorAll(".zt-badge")) b.hidden = true;
      await talk(`Let's count together. Touch each one as I count.`, my);
      for (const [i, car] of [...lot.children].entries()) {
        if (my !== token) return;
        q.tapped.add(i);
        q.counted = i + 1;
        const badge = car.querySelector(".zt-badge");
        badge.textContent = i + 1;
        badge.hidden = false;
        pop(car);
        MUSIC.play("xylophone", SCALE[i], { gain: 0.45 });
        await talk(`<b>${i + 1}</b>`, my);
      }
      await talk(`<b>${q.n}</b>! The last number tells how many. There ${q.n === 1 ? "is" : "are"} ${q.n} ${many()}.`, my);
    }
    onTap(lot, "[data-i]", async (car) => {
      if (!q || !q.ready || my !== token) return;
      const i = Number(car.dataset.i);
      if (q.tapped.has(i)) {
        shake(car.querySelector(".zt-badge"));
        return;
      }
      q.tapped.add(i);
      q.counted += 1;
      const k = q.counted;
      const badge = car.querySelector(".zt-badge");
      badge.textContent = k;
      badge.hidden = false;
      pop(car);
      MUSIC.play("xylophone", SCALE[k - 1], { gain: 0.45 });
      await talk(`<b>${k}</b>`, my);
      if (k === q.n && q.counted === q.n && open) await talk(`<b>${k}</b>! The last number tells how many. So how many ${plural(q.v.name)}?`, my);
    });
    onTap(nums, "[data-n]", async (button) => {
      if (!open || !q || my !== token) return;
      const k = Number(button.dataset.n);
      if (k === q.n) {
        open = false;
        button.classList.add("good");
        for (const b of nums.children) if (b !== button) b.classList.add("dim");
        const up = tries === 0 ? skill.right(q.n) : false;
        MUSIC.chime();
        sfx(q.v.sound);
        round += 1;
        window.OC?.count("vehicles counted", q.n);
        dots();
        cheer(button, round, rounds);
        [...lot.children].forEach((car, i) => {
          car.querySelector("svg")?.classList.add("driving");
          anim(car, [{ transform: "none" }, { transform: "translateX(120vw)" }], 1200, { delay: i * 60, easing: "ease-in" });
        });
        await talk(q.add ? `Yes! <b>${q.n - q.add}</b> and <b>${q.add}</b> more make <b>${q.n}</b>!` : `Yes! <b>${q.n}</b> ${many()}!`, my);
        if (my !== token) return;
        hushSfx();
        if (up && round < rounds) {
          await levelUp(my);
          if (my !== token) return;
        }
        if (round === Math.ceil(rounds / 2) && round < rounds) {
          surprise();
          await talk(rpick(HALFWAY), my);
          if (my !== token) return;
        }
        if (round >= rounds)
          return finishCard({ id: "count", role: "police", icon: "🔢", message: "Count the cars parked on your street. Touch each one with your finger, and say the numbers out loud.", speech: "Super counting! Count the cars parked on your street. Touch each one with your finger, and say the numbers out loud." });
        ask();
      } else {
        if (tries === 0) skill.wrong(q.n);
        tries += 1;
        open = false;
        MUSIC.oops();
        shake(button);
        button.classList.add("bad");
        if (tries >= 2) {
          nums.querySelector(`[data-n="${q.n}"]`)?.classList.add("hint");
          await countTogether();
          if (my !== token) return;
          open = true;
          await talk(`Tap the number <b>${q.n}</b>.`, my);
        } else {
          await talk(`Not quite. That says <b>${k}</b>.`, my);
          if (my !== token) return;
          await countTogether();
          if (my !== token) return;
          open = true;
          await talk(`So how many ${plural(q.v.name)}?`, my);
        }
      }
    });
    ask();
  },

  // ---------- Letter trucks: find the letter; later, match capital to small ----------
  letters: () => runChoice({ ...GAMES.letters, finish: { role: "bus", icon: "🔤", message: "When you go out, look for letters on trucks, buses and signs. Can you find the first letter of your name?", speech: "You know your letters! When you go out, look for letters on trucks, buses and signs. Can you find the first letter of your name?" } }),
  // ---------- Sounds & rhymes: first sounds, and from level 2 rhymes too ----------
  phonics() {
    runChoice({
      ...GAMES.firstSound,
      gen: (level, skill, last) => roundOf(level >= 1 && Math.random() < 0.4 ? GAMES.rhyme : GAMES.firstSound, level, skill, last),
      finish: { role: "train", icon: "🗣️", message: "Play I spy with your toy vehicles: I spy something that starts with the letter bee. Bus! Then find words that rhyme: car, star, jar.", speech: "You hear sounds so well! Play I spy with your toy vehicles. I spy something that starts with the letter bee. Bus! Then find words that rhyme: car, star, jar." },
    });
  },
  patterns: () => runChoice({ ...GAMES.patterns, finish: { role: "train", icon: "🔁", message: "Make a pattern train with toy cars or blocks: red, blue, red, blue. Ask a grown-up to start one, and you say what comes next.", speech: "You're a pattern expert! Make a pattern train with toy cars or blocks: red, blue, red, blue. Ask a grown-up to start one, and you say what comes next." } }),
  who: () => runChoice({ ...GAMES.who, finish: { role: "fire", icon: "🧑‍🚒", message: "Read a picture book about helpers. Point to each helper and their vehicle. Wave to a real one when you see them!", speech: "You matched every helper! Read a picture book about helpers, and point to each helper and their vehicle. Wave to a real one when you see them!" } }),
  hear: () => runChoice({ ...GAMES.hear, finish: { role: "kid", icon: "👂", message: "Sit by a window and close your eyes. Listen. What vehicles can you hear going by?", speech: "Great listening! Sit by a window and close your eyes. Listen. What vehicles can you hear going by?" } }),

  // ---------- Road trip: a mission where every stop is a different kind of question ----------
  trip() {
    const m = rpick(MISSIONS);
    let lastKind = null;
    runChoice({
      id: "trip",
      count: "road trip stops",
      skill: { start: 1, max: 2 },
      racer: m.racer,
      goal: m.goal,
      intro: m.start,
      gen() {
        const id = rpick(TRIP_KINDS.filter((k) => k !== lastKind));
        lastKind = id;
        const kind = GAMES[id];
        // Each question comes at the level the child has reached in that game.
        const own = skillOf(kind.id, kind.skill);
        return roundOf(kind, own.level, own, null);
      },
      finish: { role: m.role, icon: m.goal, message: m.real, speech: `${m.end} ${m.real}` },
    });
  },

  // ---------- Where does it go? Drag (or tap) the vehicle to the road, tracks, sky or water ----------
  where() {
    const my = token;
    const rounds = 8;
    const road = shuffle(ROAD).slice(0, rounds - 3);
    const list = shuffle([V.plane, V.boat, V.train, ...road]);
    let round = 0;
    let tries = 0;
    let open = false;
    let v = null;
    stage.innerHTML = `<div class="zt-where"><div class="zt-zones">${Object.entries(WHERE).map(([key, w]) => `<button type="button" class="zt-zone" data-zone="${key}" data-world="${key}" aria-label="${w.name}"><span class="zt-zone-ground"></span><span class="zt-zone-name">${w.icon} ${cap(w.name)}</span><span class="zt-zone-park" data-park></span></button>`).join("")}</div><div class="zt-dock"><div class="zt-token" data-token></div></div></div>`;
    const tokenEl = $("[data-token]", stage);
    const zones = [...stage.querySelectorAll("[data-zone]")];
    const host = panel(`<div class="ap-row zt-row">${raceHtml("bus")}<button type="button" class="ap-btn" data-again aria-label="Say it again">🔊<span class="zt-wide"> Again</span></button></div>`);
    const dots = () => raceTo(host, round, rounds);
    host.onclick = (event) => event.target.closest("[data-again]") && v && talk(question(), my);
    const question = () => `Where does the <b>${v.name}</b> go? Drag it, or tap the place.`;

    async function ask() {
      if (my !== token) return;
      v = list[round];
      tries = 0;
      for (const a of tokenEl.getAnimations()) a.cancel();
      tokenEl.innerHTML = vehicle(v.id);
      tokenEl.style.transform = "";
      tokenEl.hidden = false;
      dots();
      anim(tokenEl, [{ transform: "translateY(40px) scale(.8)", opacity: 0 }, { transform: "none", opacity: 1 }], 400, { fill: "none" });
      open = true;
      await talk(question(), my);
    }
    async function answer(zone, from) {
      if (!open || my !== token) return;
      open = false;
      const key = zone.dataset.zone;
      if (key === v.where) {
        // Glide from wherever the finger let go into the zone, then park a small copy there.
        const z = zone.getBoundingClientRect();
        const t = tokenEl.getBoundingClientRect();
        const dx = z.left + z.width / 2 - (t.left + t.width / 2) + (from?.x || 0);
        const dy = z.top + z.height / 2 - (t.top + t.height / 2) + (from?.y || 0);
        MUSIC.chime();
        sfx(v.sound);
        await anim(tokenEl, [{ transform: from ? `translate(${from.x}px, ${from.y}px)` : "none" }, { transform: `translate(${dx}px, ${dy}px) scale(.45)`, opacity: 0.2 }], 450);
        tokenEl.hidden = true;
        const parked = document.createElement("span");
        parked.innerHTML = vehicle(v.id);
        $("[data-park]", zone).appendChild(parked);
        pop(zone);
        round += 1;
        cheer(zone, round, rounds);
        window.OC?.count("vehicles placed");
        dots();
        await talk(`Yes! The ${v.name} goes on the ${WHERE[v.where].name}. ${v.fact}`, my);
        if (my !== token) return;
        if (round === Math.ceil(rounds / 2) && round < rounds) {
          surprise();
          await talk(rpick(HALFWAY), my);
          if (my !== token) return;
        }
        if (round >= rounds)
          return finishCard({ id: "where", role: "builder", icon: "🛣️", message: "Make a road on the floor with tape and a river with a blue towel. Drive your cars on the road and float a boat on the river.", speech: "Everything is in the right place! Make a road on the floor with tape and a river with a blue towel. Drive your cars on the road and float a boat on the river." });
        ask();
      } else {
        tries += 1;
        MUSIC.oops();
        shake(zone);
        anim(tokenEl, [{ transform: from ? `translate(${from.x}px, ${from.y}px)` : "none" }, { transform: "none" }], 380, { fill: "none" });
        const wrong = { road: "drive on the road", tracks: "go on train tracks", sky: "fly in the sky", water: "float on the water" }[key];
        if (tries >= 2) {
          const right = zones.find((z) => z.dataset.zone === v.where);
          right.classList.add("hint");
          await talk(`A ${v.name} can't ${wrong}. Look! The ${v.name} goes on the ${WHERE[v.where].name}. Drag it there.`, my);
          right.classList.remove("hint");
        } else await talk(`Hmm, a ${v.name} can't ${wrong}. Try another place!`, my);
        if (my === token) open = true;
      }
    }
    // Dragging: pointer capture keeps the finger on the vehicle; the move is one transform per frame.
    let drag = null;
    let frame = 0;
    const zoneAt = (x, y) => zones.find((z) => {
      const r = z.getBoundingClientRect();
      return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
    });
    tokenEl.addEventListener("pointerdown", (event) => {
      if (!open || drag) return;
      event.preventDefault();
      // A finished spring-back must not hold the vehicle in place while the finger moves it.
      for (const a of tokenEl.getAnimations()) a.cancel();
      try {
        tokenEl.setPointerCapture(event.pointerId);
      } catch {}
      drag = { id: event.pointerId, x0: event.clientX, y0: event.clientY, x: 0, y: 0, over: null };
      tokenEl.classList.add("lift");
      window.OC?.touch();
    });
    tokenEl.addEventListener("pointermove", (event) => {
      if (!drag || event.pointerId !== drag.id) return;
      drag.x = event.clientX - drag.x0;
      drag.y = event.clientY - drag.y0;
      drag.cx = event.clientX;
      drag.cy = event.clientY;
      if (frame) return;
      frame = requestAnimationFrame(() => {
        frame = 0;
        if (!drag) return;
        tokenEl.style.transform = `translate(${drag.x}px, ${drag.y}px) scale(1.06)`;
        const over = zoneAt(drag.cx, drag.cy);
        if (over !== drag.over) {
          drag.over?.classList.remove("over");
          over?.classList.add("over");
          drag.over = over;
        }
      });
    });
    const drop = (event) => {
      if (!drag || event.pointerId !== drag.id) return;
      const d = drag;
      drag = null;
      cancelAnimationFrame(frame);
      frame = 0;
      tokenEl.classList.remove("lift");
      d.over?.classList.remove("over");
      const zone = event.type === "pointerup" ? zoneAt(event.clientX, event.clientY) : null;
      tokenEl.style.transform = "";
      if (zone) answer(zone, { x: d.x, y: d.y });
      else {
        anim(tokenEl, [{ transform: `translate(${d.x}px, ${d.y}px)` }, { transform: "none" }], 380, { fill: "none" });
        if (Math.hypot(d.x, d.y) < 12) talk(question(), my);
      }
    };
    tokenEl.addEventListener("pointerup", drop);
    tokenEl.addEventListener("pointercancel", drop);
    onTap(stage, "[data-zone]", (zone) => answer(zone));
    ask();
  },
};

// The race track under every game: the child's car drives one step towards the flag for each answer.
const raceHtml = (racer = "car", goal = "🏁") => `<div class="zt-race" data-race aria-hidden="true"><span class="zt-race-goal">${goal}</span><span class="zt-racer" data-racer>${vehicle(racer, "", { fill: "#e53935" })}</span></div>`;
function raceTo(host, round, rounds) {
  const racer = $("[data-racer]", host);
  if (!racer) return;
  racer.style.left = `calc((100% - 96px) * ${round / rounds} + 4px)`;
  const svg = racer.querySelector("svg");
  svg?.classList.add("driving");
  setTimeout(() => svg?.classList.remove("driving"), 900);
}
const HALFWAY = ["Halfway there! Keep going!", "Wow, you're halfway! Vroom vroom!", "Halfway! You're doing great!"];

// A round-based picking game. Taps answer on pointerdown; only classes change, the cards are never rebuilt mid-round.
// The game's level (skillOf) sets how many choices there are and what is asked; cfg.gen(level, skill, last) builds a round.
// A round may carry its own words and layout (q.h), so mixed games switch kinds from round to round.
function runChoice(cfg) {
  const my = token;
  const rounds = cfg.rounds || ROUNDS;
  const skill = skillOf(cfg.id, cfg.skill);
  let round = 0;
  let tries = 0;
  let open = false;
  let q = null;
  let last = null;
  stage.innerHTML = `<div class="zt-play" data-play><div class="zt-prompt" data-prompt></div><div class="zt-cards" data-cards></div></div>`;
  const play = $("[data-play]", stage);
  const cards = $("[data-cards]", stage);
  const promptBox = $("[data-prompt]", stage);
  const host = panel(`<div class="ap-row zt-row">${raceHtml(cfg.racer, cfg.goal)}<span class="ap-status" data-level></span><button type="button" class="ap-btn" data-again aria-label="Say it again">🔊<span class="zt-wide"> Again</span></button></div>`);
  const H = () => {
    const h = { ...cfg };
    for (const [key, value] of Object.entries(q?.h || {})) if (value !== undefined) h[key] = value;
    return h;
  };
  const dots = () => {
    raceTo(host, round, rounds);
    $("[data-level]", host).innerHTML = `🚦<span class="zt-wide"> Level</span> ${skill.level + 1}`;
  };
  host.onclick = (event) => {
    if (event.target.closest("[data-again]") && q) talk(H().ask(q), my).then((ok) => ok && H().afterAsk?.(q));
  };
  async function ask() {
    if (my !== token) return;
    q = cfg.gen(skill.level, skill, last);
    last = q.target;
    tries = 0;
    dots();
    const h = H();
    play.className = `zt-play ${h.layout || ""}`;
    promptBox.innerHTML = h.layout ? q.prompt || "" : "";
    if (promptBox.firstElementChild) anim(promptBox.firstElementChild, [{ transform: "scale(.85)", opacity: 0 }, { transform: "none", opacity: 1 }], 380, { fill: "none" });
    cards.className = `zt-cards n${q.choices.length}`;
    cards.innerHTML = q.choices.map((c, i) => `<button type="button" class="zt-card zt-pick" data-c="${i}" aria-label="${c.label}"><span class="zt-art">${c.art}</span></button>`).join("");
    [...cards.children].forEach((card, i) => anim(card, [{ transform: "translateY(24px)", opacity: 0 }, { transform: "none", opacity: 1 }], 380, { delay: i * 70, fill: "backwards" }));
    open = true;
    const ok = await talk(h.ask(q), my);
    if (ok && my === token) h.afterAsk?.(q);
  }
  async function next(up) {
    if (my !== token) return;
    if (up && round < rounds) {
      await levelUp(my);
      if (my !== token) return;
    }
    if (round === Math.ceil(rounds / 2) && round < rounds) {
      surprise();
      await talk(rpick(HALFWAY), my);
      if (my !== token) return;
    }
    if (round >= rounds) return finishCard({ id: cfg.id, ...cfg.finish });
    ask();
  }
  async function choose(button) {
    const c = q.choices[Number(button.dataset.c)];
    if (!open || c.state || my !== token) return;
    const h = H();
    if (c.ok) {
      open = false;
      c.state = "good";
      button.classList.add("good");
      for (const b of cards.children) if (b !== button) b.classList.add("dim");
      const up = tries === 0 ? skill.right(q.key) : false;
      MUSIC.chime();
      if (h.sound) sfx(h.sound(q));
      round += 1;
      window.OC?.count(h.count);
      dots();
      cheer(button, round, rounds);
      const art = button.querySelector(".zt-art");
      const leave = h.stay ? pop(button) : (art.querySelector("svg")?.classList.add("driving"), anim(art, [{ transform: "none" }, { transform: "translateX(-6%)" }, { transform: "translateX(140%)" }], 1100, { easing: "ease-in" }));
      await Promise.all([leave, h.onRight?.(q, promptBox, my)]);
      if (my !== token) return;
      await talk(h.praise(q, c), my);
      if (my !== token) return;
      hushSfx();
      next(up);
    } else {
      if (tries === 0) skill.wrong(q.key);
      tries += 1;
      c.state = "bad";
      button.classList.add("bad");
      MUSIC.oops();
      shake(button);
      // With two choices one miss leaves only the answer, so show it straight away.
      if (tries >= Math.min(2, q.choices.length - 1)) {
        open = false;
        const right = cards.children[q.choices.findIndex((x) => x.ok)];
        right.classList.add("hint");
        await talk(h.reveal(q, c), my);
        if (my !== token) return;
        round += 1;
        dots();
        next(false);
      } else await talk(h.hint(q, c), my);
    }
  }
  onTap(cards, "[data-c]", choose);
  onTap(promptBox, "[data-hear]", () => q && H().onPrompt?.(q));
  (async () => {
    dots();
    if (cfg.intro) {
      surprise("stars");
      await talk(cfg.intro, my);
    }
    ask();
  })();
}

// Photo: a grown-up picks a photo and drags it so the face fills the circle.

function openPhoto() {
  VOICE.hush();
  document.querySelector(".zt-photo")?.remove();
  const box = document.createElement("div");
  box.className = "zt-photo";
  const who = NAME() || "your child";
  const had = faceOf();
  box.innerHTML = `<div class="zt-photo-card" role="dialog" aria-modal="true" aria-label="Photo">
<h2>📷 A photo of ${who}</h2>
<p class="zt-note">The face goes on every helper and in every vehicle. The photo stays in this browser only. It is not uploaded, synced or put on the website.</p>
<div class="zt-crop" data-crop><img data-img alt="" draggable="false"><div class="zt-crop-ring"></div><span class="zt-crop-empty" data-empty>🙂</span></div>
<p class="zt-note" data-help>Choose a photo of ${who}'s face.</p>
<label class="zt-zoom" data-zoomrow hidden><span aria-hidden="true">➖</span><input type="range" min="1" max="4" step="0.01" value="1.4" data-zoom aria-label="Zoom"><span aria-hidden="true">➕</span></label>
<div class="ap-buttons"><label class="zt-file">🖼️ ${had ? "Choose a new photo" : "Choose a photo"}<input type="file" accept="image/*" data-file></label><button type="button" class="primary" data-save disabled>✓ Save</button></div>
<div class="ap-buttons">${had ? '<button type="button" data-remove>🗑 Remove photo</button>' : ""}<button type="button" data-close>Close</button></div>
</div>`;
  document.body.appendChild(box);
  const crop = $("[data-crop]", box);
  const img = $("[data-img]", box);
  const zoom = $("[data-zoom]", box);
  const help = $("[data-help]", box);
  let size = null;
  const st = { z: 1.4, x: 0, y: 0 };
  const base = () => crop.clientWidth / Math.min(size.w, size.h);
  const paint = () => {
    if (!size) return;
    const s = base() * st.z;
    const mx = Math.max(0, (size.w * s - crop.clientWidth) / 2);
    const my = Math.max(0, (size.h * s - crop.clientHeight) / 2);
    st.x = Math.max(-mx, Math.min(mx, st.x));
    st.y = Math.max(-my, Math.min(my, st.y));
    img.style.width = `${size.w * s}px`;
    img.style.height = `${size.h * s}px`;
    img.style.transform = `translate(${-size.w * s / 2 + st.x}px, ${-size.h * s / 2 + st.y}px)`;
  };
  const load = (src, fresh) => {
    img.onload = () => {
      size = { w: img.naturalWidth, h: img.naturalHeight };
      st.z = fresh ? 1.6 : 1;
      st.x = 0;
      // A portrait photo usually has the face in its upper half.
      st.y = fresh && size.h > size.w * 1.1 ? (size.h * base() * st.z - crop.clientHeight) / 2 * 0.35 : 0;
      zoom.value = st.z;
      $("[data-zoomrow]", box).hidden = false;
      $("[data-empty]", box).hidden = true;
      $("[data-save]", box).disabled = !fresh;
      help.textContent = "Drag the photo and use the slider so the face fills the circle.";
      paint();
    };
    img.src = src;
  };
  if (had) load(had, false);
  $("[data-file]", box).addEventListener("change", (event) => {
    const file = event.target.files?.[0];
    if (file) load(URL.createObjectURL(file), true);
  });
  zoom.addEventListener("input", () => {
    st.z = Number(zoom.value);
    $("[data-save]", box).disabled = false;
    paint();
  });
  // One finger moves the photo; two fingers zoom.
  const points = new Map();
  let pinch = null;
  crop.addEventListener("pointerdown", (event) => {
    if (!size) return;
    try {
      crop.setPointerCapture(event.pointerId);
    } catch {}
    points.set(event.pointerId, { x: event.clientX, y: event.clientY });
    if (points.size === 2) {
      const [a, b] = [...points.values()];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: st.z };
    }
  });
  crop.addEventListener("pointermove", (event) => {
    const p = points.get(event.pointerId);
    if (!p) return;
    const now = { x: event.clientX, y: event.clientY };
    if (points.size === 1) {
      st.x += now.x - p.x;
      st.y += now.y - p.y;
    }
    points.set(event.pointerId, now);
    if (points.size === 2 && pinch) {
      const [a, b] = [...points.values()];
      st.z = Math.max(1, Math.min(4, pinch.z * (Math.hypot(a.x - b.x, a.y - b.y) / pinch.d)));
      zoom.value = st.z;
    }
    $("[data-save]", box).disabled = false;
    paint();
  });
  const up = (event) => {
    points.delete(event.pointerId);
    if (points.size < 2) pinch = null;
  };
  crop.addEventListener("pointerup", up);
  crop.addEventListener("pointercancel", up);
  crop.addEventListener("wheel", (event) => {
    if (!size) return;
    event.preventDefault();
    st.z = Math.max(1, Math.min(4, st.z * (event.deltaY < 0 ? 1.06 : 0.94)));
    zoom.value = st.z;
    $("[data-save]", box).disabled = false;
    paint();
  }, { passive: false });
  const close = () => {
    box.remove();
    shell.go(shell.current());
    updatePhotoButton();
  };
  box.addEventListener("click", (event) => {
    if (event.target === box || event.target.closest("[data-close]")) return close();
    if (event.target.closest("[data-remove]")) {
      saveFace("");
      return close();
    }
    if (event.target.closest("[data-save]") && size) {
      // Save a small square JPEG (about 25 KB) of exactly what is inside the circle.
      const C = 320;
      const f = C / crop.clientWidth;
      const s = base() * st.z;
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = C;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ead3c0";
      ctx.fillRect(0, 0, C, C);
      ctx.drawImage(img, C / 2 + (st.x - (size.w * s) / 2) * f, C / 2 + (st.y - (size.h * s) / 2) * f, size.w * s * f, size.h * s * f);
      if (!saveFace(canvas.toDataURL("image/jpeg", 0.86))) {
        help.textContent = "This browser has no room to save the photo. Try a smaller photo.";
        return;
      }
      close();
    }
  });
}

  const b = $("[data-photo]");
  b.classList.toggle("zt-nudge", !faceOf());

/* Count them */
.zt-lot{position:absolute;left:3%;right:3%;top:16%;bottom:5%;display:grid;gap:4px;align-items:end}
.zt-cv{position:relative;display:grid;place-items:end center;align-self:end;min-width:0;min-height:0;width:100%;aspect-ratio:260/215;max-height:100%;padding:0;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.zt-cv svg{position:absolute;left:4%;bottom:0;width:92%;height:78%;pointer-events:none}
.zt-badge{position:absolute;left:50%;top:0;transform:translateX(-50%);display:grid;place-items:center;min-width:clamp(34px,6vh,54px);height:clamp(34px,6vh,54px);padding:0 6px;border-radius:999px;background:#fff;box-shadow:0 0 0 4px var(--accent),0 4px 10px rgba(0,0,0,.2);color:var(--accent-dark);font:900 clamp(20px,4vh,32px)/1 var(--sans);pointer-events:none}
.zt-badge[hidden]{display:none}
.zt-nums{flex:0 0 auto;display:flex;justify-content:center;gap:clamp(8px,2vw,18px)}
.zt-num{flex:0 1 150px;min-height:clamp(70px,13vh,110px);gap:2px;align-content:center}
.zt-num b{font:900 clamp(34px,7vh,60px)/1 var(--sans);color:#2b1d12}
.zt-pips{max-width:5.5em;color:var(--accent);font-size:clamp(9px,1.6vh,14px);letter-spacing:1px;line-height:1.1;word-break:break-all;text-align:center}
.zt-play.side .zt-cards{flex-direction:column}
@media (max-aspect-ratio:1/1){.zt-play,.zt-cards{flex-direction:column}.zt-prompt{flex-basis:32%}}

/* Dress up */
.zt-dress{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr);gap:clamp(8px,1.6vw,16px);padding:clamp(8px,1.6vw,16px)}
.zt-me{display:grid;place-items:center;min-height:0;border-radius:24px;background:radial-gradient(circle at 50% 40%,#fff,var(--accent-soft));will-change:transform}
.zt-me svg{width:100%;height:100%;max-height:100%}
.zt-closet{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:clamp(6px,1vw,10px);min-height:0}
.zt-tile{padding:4px;gap:0;grid-template-rows:minmax(0,1fr) auto;border-radius:20px}
.zt-tile svg{width:100%;height:100%;max-height:100%}
.zt-tile span{font:800 clamp(11px,1.5vw,15px)/1.1 var(--sans);text-align:center}
.zt-tile.on{box-shadow:0 0 0 5px var(--accent),0 6px 0 var(--accent-dark)}
@media (max-aspect-ratio:1/1){.zt-dress{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1.15fr)}.zt-tile span{display:none}}
@media (max-height:520px){.zt-tile span{display:none}}

/* Where does it go? */
.zt-where{position:absolute;inset:0;display:grid;grid-template-rows:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(8px,1.6vh,14px);padding:clamp(8px,1.6vw,14px)}
.zt-zones{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(6px,1.2vw,12px);min-height:0}
.zt-zone{position:relative;min-height:0;border:0;border-radius:22px;overflow:hidden;background:linear-gradient(#a9dcff,#e3f4ff);box-shadow:0 0 0 3px #f1e7da,0 6px 0 #e6dccd;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:box-shadow .12s ease,transform .08s ease}
.zt-zone:active{transform:translateY(3px)}
.zt-zone.over{box-shadow:0 0 0 6px #ffcf5c,0 6px 0 #e6dccd;transform:scale(1.03)}
.zt-zone-ground{position:absolute;left:0;right:0;bottom:0;height:42%}
.zt-zone[data-world=road] .zt-zone-ground{background:linear-gradient(#7cc66a 0 18%,#5b5f66 18%)}
.zt-zone[data-world=tracks] .zt-zone-ground{background:linear-gradient(#7cc66a 0 18%,transparent 18%),linear-gradient(transparent 35%,#90a4ae 35% 42%,transparent 42% 72%,#90a4ae 72% 79%,transparent 79%),repeating-linear-gradient(90deg,#6d4c41 0 10px,#a1887f 10px 24px)}
.zt-zone[data-world=water] .zt-zone-ground{height:50%;background:linear-gradient(#4fc3f7,#0288d1)}
.zt-zone[data-world=sky] .zt-zone-ground{height:14%;background:#8bc34a}
.zt-zone-name{position:absolute;left:50%;top:8px;transform:translateX(-50%);padding:4px 12px;border-radius:14px;background:rgba(255,255,255,.92);color:var(--ink);font:900 clamp(13px,2vw,19px)/1.2 var(--sans);white-space:nowrap}
.zt-zone-park{position:absolute;left:4%;right:4%;bottom:12%;height:46%;display:flex;justify-content:center;align-items:flex-end;flex-wrap:wrap-reverse;gap:2px;pointer-events:none}
.zt-zone[data-world=sky] .zt-zone-park{bottom:26%}
.zt-zone-park span{flex:0 1 46%;max-height:100%;display:grid}
.zt-zone-park svg{width:100%;height:auto}
.zt-dock{display:grid;place-items:center;min-height:0}
.zt-token{height:100%;max-width:100%;aspect-ratio:260/160;display:grid;place-items:center;touch-action:none;cursor:grab;will-change:transform;-webkit-user-drag:none}
.zt-token[hidden]{display:none}
.zt-token svg{width:100%;height:100%;pointer-events:none}
.zt-token.lift{cursor:grabbing;filter:drop-shadow(0 14px 12px rgba(0,0,0,.25));z-index:5}
@media (max-aspect-ratio:1/1){.zt-zones{grid-template-columns:repeat(2,minmax(0,1fr))}.zt-where{grid-template-rows:minmax(0,1.6fr) minmax(0,1fr)}}

/* end card */
.zt-done{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vw,32px);padding:16px;background:radial-gradient(circle at 30% 40%,#fff,var(--accent-soft))}
.zt-done-pic{position:relative;height:min(78%,360px);aspect-ratio:200/250}
.zt-done-pic svg{width:100%;height:100%}
.zt-done-badge{position:absolute;right:-6%;bottom:6%;display:grid;place-items:center;width:28%;aspect-ratio:1;border-radius:50%;background:#fff;box-shadow:0 4px 0 #e6dccd;font-size:clamp(26px,5vw,44px)}
.zt-done-text{max-width:30em}
.zt-done-text h2{margin:0 0 8px;color:var(--accent-dark);font:900 clamp(20px,3vw,30px)/1.15 var(--sans)}
.zt-done-text p{margin:0;color:#2b1d12;font:700 clamp(17px,2.4vw,24px)/1.35 var(--sans)}
@media (max-aspect-ratio:1/1){.zt-done{flex-direction:column;text-align:center}.zt-done-pic{height:46%}}

/* stickers */
.zt-book-btn{position:relative}
.zt-book-btn span{position:absolute;right:-4px;top:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--accent);color:#fff;font:900 12px/20px var(--sans)}
.zt-book-btn span:empty{display:none}
.zt-sticker{position:absolute;inset:0;z-index:8;display:grid;place-items:center;pointer-events:none}
.zt-sticker-card{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 28px;border-radius:32px;background:#fff;box-shadow:0 0 0 6px #ffcf5c,0 18px 40px rgba(0,0,0,.25);text-align:center}
.zt-sticker-glyph{font-size:clamp(70px,16vh,130px);line-height:1.1;animation:zt-wiggle 1s ease-in-out infinite}
.zt-sticker-card b{font:900 clamp(22px,3.4vh,32px)/1.1 var(--sans);color:var(--accent-dark)}
.zt-sticker-card small{font:700 14px var(--sans);color:var(--muted)}
.zt-book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px;width:100%}
.zt-slot{position:relative;display:grid;place-items:center;aspect-ratio:1;border:0;border-radius:16px;background:#fff;box-shadow:0 3px 0 #e6dccd;font-size:34px;cursor:pointer;touch-action:manipulation}
.zt-slot.empty{background:#efe7dc;box-shadow:none;color:#c9b9a6;font:900 22px var(--sans);cursor:default}
.zt-slot small{position:absolute;right:4px;bottom:2px;font:900 11px var(--sans);color:var(--accent-dark)}
@keyframes zt-wiggle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.06)}}
/* photo dialog */
.zt-photo{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:12px;background:rgba(43,29,18,.45);backdrop-filter:blur(3px)}
.zt-photo-card{width:min(440px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px;border-radius:28px;background:var(--paper);box-shadow:0 24px 60px rgba(0,0,0,.3);text-align:center}
.zt-photo-card h2{margin:0;color:var(--ink);font:900 22px/1.2 var(--sans)}
.zt-note{margin:0;color:var(--muted);font:700 14px/1.4 var(--sans)}
.zt-crop{position:relative;width:min(260px,70vw,46vh);aspect-ratio:1;border-radius:50%;overflow:hidden;background:#ead3c0;touch-action:none;cursor:grab;box-shadow:0 0 0 4px var(--accent),0 8px 20px rgba(0,0,0,.15)}
.zt-crop img{position:absolute;left:50%;top:50%;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.zt-crop-ring{position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6);pointer-events:none}
.zt-crop-empty{position:absolute;inset:0;display:grid;place-items:center;font-size:80px;opacity:.5}
.zt-crop-empty[hidden]{display:none}
.zt-zoom{display:flex;align-items:center;gap:10px;width:100%;max-width:300px}
.zt-zoom[hidden]{display:none}
.zt-zoom input{flex:1;accent-color:var(--accent)}
.zt-file{display:inline-grid;place-items:center;min-height:54px;padding:0 20px;border-radius:18px;background:#fff;box-shadow:0 4px 0 #e2d6c4;font:800 18px/1 var(--sans);cursor:pointer}
.zt-file input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.ap-icon.zt-nudge{animation:zt-ring 1.6s ease-in-out infinite}

@keyframes zt-spin{to{transform:rotate(360deg)}}
@keyframes zt-blink{0%{opacity:1}50%{opacity:.25}}
@keyframes zt-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3%)}}
@keyframes zt-smoke{0%{transform:translateY(6px) scale(.7);opacity:0}30%{opacity:.9}100%{transform:translateY(-10px) scale(1.2);opacity:0}}
@keyframes zt-drift{from{translate:0 0}to{translate:30vw 0}}
@keyframes zt-glow{0%,100%{box-shadow:0 0 0 3px #f1e7da,0 6px 0 #e6dccd}50%{box-shadow:0 0 0 8px #ffcf5c,0 6px 0 #e6dccd}}
@keyframes zt-ring{0%,100%{box-shadow:0 3px 0 #e6dccd}50%{box-shadow:0 3px 0 #e6dccd,0 0 0 7px #ffcf5c}}
@media (prefers-reduced-motion:reduce){.zt-mover span,.zt-v.driving .wh,.zt-car.parked .zt-v,.zt-cloud,.zt-v .smoke,.zt-ear.playing,.ap-icon.zt-nudge,.zt-card.hint,.zt-zone.hint{animation:none}}
`;
document.head.appendChild(style);
</script>
</body>
</html>
