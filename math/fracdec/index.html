<script>const { $, el, svg: makeSvg, text, panel, say, pick, pickInt, wait, confetti, PRAISE, KIND, choices, explain, everyday, emoji, numpad, shuffle } = KIT;
const stage = $("[data-stage]");
const W = 1000;
const H = 560;
let token = 0;
let view = null;

const UNITS = [
  { id: "fd0", label: "See it", icon: "👀" },
  { id: "fd1", label: "1. Equivalent & simplest", icon: "🧱" },
  { id: "fd2", label: "2. Compare & order", icon: "⚖️" },
  { id: "fd3", label: "3. Add & subtract", icon: "➕" },
  { id: "fd4", label: "4. Multiply fractions", icon: "✖️" },
  { id: "fd5", label: "5. Decimals to thousandths", icon: "🔢" },
  { id: "fd6", label: "6. Fraction, decimal, percent", icon: "💯" },
  { id: "fd7", label: "7. Ratios & rates", icon: "🍋" },
];

function fresh() {
  stage.querySelector(".fd-real")?.remove();
  stage.innerHTML = "";
  view = makeSvg(`0 0 ${W} ${H}`, stage);
  return view;
}

// ---------- colours ----------
const INK = "#2b1d12";
const MUTED = "#8a7764";
const LINE = "#5a4130";
const PAPER = "#fffcf6";
const Y = "#f6c453";
const B = "#86c5ee";
const G = "#7fcf95";
const RED = "#ef8a6f";
const ACC = "var(--accent-dark)";

// ---------- maths helpers ----------
const gcd = (a, b) => (b ? gcd(b, a % b) : Math.abs(a));
const lcm = (a, b) => (a / gcd(a, b)) * b;
const simp = (n, d) => {
  const g = gcd(n, d) || 1;
  return [n / g, d / g];
};
const fmt = (x) => String(Number(x.toFixed(6)));
const money = (cents) => `$${(cents / 100).toFixed(2)}`;
const same = (v, ans) => typeof v === "string" && v !== "" && v !== "." && Math.abs(Number(v) - ans) < 1e-6;
const factors = (n) => {
  const out = [];
  for (let i = 1; i <= n; i++) if (n % i === 0) out.push(i);
  return out;
};
const primes = (n) => {
  const out = [];
  for (let p = 2; n > 1; p++) while (n % p === 0) (out.push(p), (n /= p));
  return out;
};
const sharedPrimes = (a, b) => {
  const pb = primes(b);
  const out = [];
  for (const p of primes(a)) {
    const i = pb.indexOf(p);
    if (i >= 0) (out.push(p), pb.splice(i, 1));
  }
  return out;
};
const multiples = (n, upto) => {
  const out = [];
  for (let m = n; m <= upto; m += n) out.push(m);
  return out;
};
const PLURAL = { 1: "wholes", 2: "halves", 3: "thirds", 4: "quarters", 5: "fifths", 6: "sixths", 7: "sevenths", 8: "eighths", 9: "ninths", 10: "tenths", 11: "elevenths", 12: "twelfths", 20: "twentieths", 100: "hundredths" };
const ONE = { 1: "whole", 2: "half", 3: "third", 4: "quarter", 5: "fifth", 6: "sixth", 7: "seventh", 8: "eighth", 9: "ninth", 10: "tenth", 11: "eleventh", 12: "twelfth" };
const plural = (d) => PLURAL[d] || `${d}ths`;
const single = (d) => ONE[d] || `${d}th`;

// ---------- html helpers (the voice reads these as "3 quarters", "2 and 1 half") ----------
const fr = (n, d) => `<span class="fr"><sup>${n}</sup><sub>${d}</sub></span>`;
const mixHtml = (w, n, d) => (!n ? `${w}` : !w ? fr(n, d) : `${w}<span class="fd-and"> and </span>${fr(n, d)}`);
const valHtml = (n, d) => (n === 0 ? "0" : mixHtml(Math.floor(n / d), n % d, d));
const simplest = (n, d) => {
  const [a, b] = simp(n, d);
  return valHtml(a, b);
};
// The same value as an SVG row item: "3", [n, d] or [w, n, d].
const itemOf = (n, d) => (n % d === 0 ? String(n / d) : n < d ? [n, d] : [Math.floor(n / d), n % d, d]);

// ---------- SVG helpers ----------
function T(parent, x, y, str, size = 30, fill = INK, attrs = {}) {
  return text(parent, x, y, str, { "font-size": size, fill, ...attrs });
}
function fracSvg(parent, x, y, n, d, size = 40, fill = INK) {
  const g = el("g", { "pointer-events": "none" }, parent);
  const len = Math.max(String(n).length, String(d).length);
  const half = size * (0.36 + 0.3 * (len - 1));
  text(g, x, y - size * 0.18, n, { "font-size": size, fill: n === "?" ? ACC : fill });
  el("line", { x1: x - half, x2: x + half, y1: y, y2: y, stroke: fill, "stroke-width": Math.max(3, size / 11), "stroke-linecap": "round" }, g);
  text(g, x, y + size * 0.82, d, { "font-size": size, fill: d === "?" ? ACC : fill });
  return g;
}
const fw = (n, d, s) => s * (0.62 * Math.max(String(n).length, String(d).length) + 0.55);
const ww = (w, s) => s * (0.62 * String(w).length + 0.25);
const wOf = (it, s) => (Array.isArray(it) ? (it.length === 3 ? ww(it[0], s) + fw(it[1], it[2], s) : fw(it[0], it[1], s)) : s * (0.58 * String(it).length + 0.45));
// A maths row centred on cx; y is the fraction-bar line. Items: "+", 3, [n, d], [w, n, d].
function rowSvg(parent, cx, y, items, s = 44, fill = INK) {
  const g = el("g", { "pointer-events": "none" }, parent);
  const ws = items.map((it) => wOf(it, s));
  let at = cx - ws.reduce((a, b) => a + b, 0) / 2;
  items.forEach((it, i) => {
    if (Array.isArray(it) && it.length === 3) {
      const a = ww(it[0], s);
      text(g, at + a / 2 - s * 0.05, y + s * 0.38, it[0], { "font-size": s * 1.1, fill: it[0] === "?" ? ACC : fill });
      fracSvg(g, at + a + fw(it[1], it[2], s) / 2, y, it[1], it[2], s, fill);
    } else if (Array.isArray(it)) fracSvg(g, at + ws[i] / 2, y, it[0], it[1], s, fill);
    else text(g, at + ws[i] / 2, y + s * 0.38, it, { "font-size": s * 1.1, fill: it === "?" ? ACC : fill });
    at += ws[i];
  });
  return g;
}
function wrapSvg(parent, x, y, str, size = 28, max = 44, attrs = {}) {
  const lines = [];
  for (const word of str.split(" ")) {
    const last = lines[lines.length - 1];
    if (last && (last + " " + word).length <= max) lines[lines.length - 1] = last + " " + word;
    else lines.push(word);
  }
  lines.forEach((line, i) => text(parent, x, y + i * size * 1.25, line, { "font-size": size, fill: INK, ...attrs }));
  return lines.length;
}
// A fraction bar: d equal parts, parts [from, from + n) shaded.
function barSvg(parent, x, y, w, h, d, n, color = Y, { labels = true, from = 0 } = {}) {
  const g = el("g", {}, parent);
  const cells = [];
  for (let i = 0; i < d; i++) {
    cells.push(el("rect", { x: x + (i * w) / d, y, width: w / d, height: h, fill: i >= from && i < from + n ? color : PAPER, stroke: LINE, "stroke-width": 3 }, g));
    if (labels && w / d >= 50) text(g, x + ((i + 0.5) * w) / d, y + h / 2 + 8, d === 1 ? "1" : `1/${d}`, { "font-size": 22, fill: LINE, "pointer-events": "none" });
  }
  return { g, cells };
}
// Dashed cut lines that split a bar into L parts (faded in later).
function cutsSvg(parent, x, y, w, h, L) {
  const g = el("g", { opacity: 0, "pointer-events": "none" }, parent);
  for (let i = 1; i < L; i++) el("line", { x1: x + (i * w) / L, x2: x + (i * w) / L, y1: y, y2: y + h, stroke: ACC, "stroke-width": 3, "stroke-dasharray": "8 6" }, g);
  return g;
}
// A 10 x 10 hundred grid, filled column by column (so a column is a tenth). k may be fractional.
function gridSvg(parent, x, y, c, k = 0, color = B) {
  const g = el("g", {}, parent);
  const cells = [];
  for (let i = 0; i < 100; i++) cells.push(el("rect", { x: x + Math.floor(i / 10) * c, y: y + (i % 10) * c, width: c, height: c, fill: PAPER, stroke: "#c9b8a1", "stroke-width": 1.5 }, g));
  const extra = el("g", {}, g);
  el("rect", { x, y, width: 10 * c, height: 10 * c, fill: "none", stroke: LINE, "stroke-width": 4, rx: 3 }, g);
  const shade = (k2, col = color) => {
    extra.innerHTML = "";
    cells.forEach((r, i) => r.setAttribute("fill", i < Math.floor(k2 + 1e-9) ? col : PAPER));
    const part = k2 - Math.floor(k2 + 1e-9);
    if (part > 1e-6) {
      const i = Math.floor(k2);
      el("rect", { x: x + Math.floor(i / 10) * c, y: y + (i % 10) * c, width: c, height: c * part, fill: col }, extra);
    }
  };
  shade(k);
  return { g, cells, shade };
}
// A number line from lo to hi with labelled ticks.
function lineSvg(parent, x0, x1, y, ticks) {
  const g = el("g", {}, parent);
  el("line", { x1: x0 - 16, x2: x1 + 16, y1: y, y2: y, stroke: LINE, "stroke-width": 5, "stroke-linecap": "round" }, g);
  for (const [t, label, big] of ticks) {
    const x = x0 + t * (x1 - x0);
    el("line", { x1: x, x2: x, y1: y - (big ? 16 : 9), y2: y + (big ? 16 : 9), stroke: LINE, "stroke-width": big ? 4 : 2.5 }, g);
    if (label !== "") {
      if (Array.isArray(label)) fracSvg(g, x, y + 46, label[0], label[1], 24, LINE);
      else T(g, x, y + 44, label, 24, LINE);
    }
  }
  return g;
}
const fade = (node, ms, alive) => tween(ms, (t) => node.setAttribute("opacity", t), alive);
const tween = (ms, fn, alive = () => true) =>
  new Promise((resolve) => {
    if (KIT.still.matches) {
      fn(1);
      return resolve(true);
    }
    const t0 = performance.now();
    const frame = (now) => {
      if (!alive()) return resolve(false);
      const t = Math.min(1, (now - t0) / ms);
      fn(t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
      if (t < 1) requestAnimationFrame(frame);
      else resolve(true);
    };
    requestAnimationFrame(frame);
  });
// Boxes of a tape diagram, all the same unit size.
function tapeRow(parent, x, y, n, label, color, w = 66, h = 56) {
  const g = el("g", {}, parent);
  T(g, x - 16, y + h / 2 + 9, label, 26, INK, { "text-anchor": "end" });
  const texts = [];
  for (let i = 0; i < n; i++) {
    el("rect", { x: x + i * w, y, width: w, height: h, rx: 6, fill: color, stroke: LINE, "stroke-width": 3 }, g);
    texts.push(T(g, x + i * w + w / 2, y + h / 2 + 10, "", 28, INK));
  }
  return { g, texts, end: x + n * w };
}

// ---------- the simplest-form choice step (shared) ----------
function formStep(n, d, show) {
  const [sn, sd] = simp(n, d);
  const w = Math.floor(sn / sd);
  const r = sn % sd;
  const right = valHtml(sn, sd);
  const improper = n >= d;
  const cands = [];
  const add = (html, val, equal = false) => {
    if (html === right || cands.some((c) => c.label === html)) return;
    if (!equal && Math.abs(val - n / d) < 1e-9) return;
    cands.push({ label: html, equal });
  };
  add(fr(n, d), n / d, true);
  if (!improper) {
    if (d !== sd) add(fr(sn, d), sn / d);
    if (n !== sn) add(fr(n, sd), n / sd);
    add(fr(sn + 1 < sd ? sn + 1 : sn - 1 || 1, sd), (sn + 1 < sd ? sn + 1 : sn - 1 || 1) / sd);
    add(fr(sd, sn + sd), sd / (sn + sd));
  } else if (r) {
    if (d !== sd) add(mixHtml(w, r, d), w + r / d);
    add(mixHtml(w + 1, r, sd), w + 1 + r / sd);
    if (sd - r !== r) add(mixHtml(w, sd - r, sd), w + (sd - r) / sd);
    if (w > 1) add(mixHtml(w - 1, r, sd), w - 1 + r / sd);
    add(mixHtml(w, r, sd + 1), w + r / (sd + 1));
  } else {
    add(String(w + 1), w + 1);
    if (w > 1) add(String(w - 1), w - 1);
    add(mixHtml(w, 1, d), w + 1 / d);
  }
  const eq = cands.filter((c) => c.equal);
  const wrong = shuffle(cands.filter((c) => !c.equal));
  const picked = [...eq, ...wrong].slice(0, 3);
  const opts = shuffle([{ label: right, v: "R" }, ...picked.map((c, i) => ({ label: c.label, v: `W${i}` }))]);
  const g = gcd(n, d);
  return {
    type: "choice",
    form: true,
    opts,
    ans: "R",
    value: [sn, sd],
    ask: improper ? `Write ${fr(n, d)} as a ${r ? "mixed" : "whole"} number in simplest form. Tap it.` : `Write ${fr(n, d)} in simplest form. Tap it.`,
    hint: improper ? `How many groups of ${d} fit in ${n}, and what is left over?${g > 1 ? ` Can the numerator (the top number) and denominator (the bottom number) both be divided by ${g === 2 ? "2" : "the same number"}?` : ""}` : `What is the biggest number that divides both ${n} and ${d}?`,
    why: improper
      ? `${n} ÷ ${d} = ${Math.floor(n / d)} whole${Math.floor(n / d) === 1 ? "" : "s"}${n % d ? ` and ${n % d} left over` : ""}.${g > 1 && r ? ` Then divide the numerator and denominator by ${gcd(n % d, d)}.` : ""} So ${fr(n, d)} = ${right}.`
      : `Divide the numerator (the top number) and the denominator (the bottom number) by ${g}: ${n} ÷ ${g} = ${sn} and ${d} ÷ ${g} = ${sd}. So ${fr(n, d)} = ${right}.`,
    show,
  };
}

// ---------- level chips ----------
const LEVELS = [["easy", "🐣 Gr 4"], ["medium", "🦊 Gr 5–6"], ["hard", "🦁 Gr 7–8"]];
const OOPS = ["Not quite. Consider:", "Not quite. Mistakes are how we learn. Consider:", "Not quite. Look again:"];
const GOOD = ["Correct, and here is why:", "Correct. The reasoning:", "Correct. Notice the method:"];
const GRIT = ["You persisted through that one. The full reasoning:", "Worked through. Here is the complete argument:", "That one required care. The reasoning:"];
const R = 8;

// ---------- "🏠 Try it for real" ----------
const TRY = {
  fd1: {

    steps: ["Mix 2 cups of juice with 3 cups of water. Taste.", "Now make a double batch: 4 cups juice, 6 cups water.", "Does it taste the same? Explain why it should.", "What if you only doubled the juice?"],

  },
};
// "Explain it": articulate the reasoning in 2–4 sentences, then compare with a model answer.
const EXPLAIN = {
  fd1: [
    { q: "Why does multiplying the numerator (top number) and denominator (bottom number) of a fraction by the same number leave its value unchanged?", a: "Multiplying the numerator and denominator by 3 is the same as multiplying by 3/3, which equals 1. Multiplying by 1 changes nothing. On the bar, every piece is cut into 3, so there are 3 times as many pieces, each a third as big." },
    { q: "Why does dividing by the greatest common factor give simplest form in one step?", a: "The greatest common factor removes every factor the numerator and denominator share, all at once. Afterwards they share only 1, so nothing more can be divided out. A smaller common factor would leave some sharing behind." },
    { q: "Two fractions are equivalent. What is the same about them, and what is different?", a: "Their value is the same: they mark the same point on the number line. The size and number of pieces differ: one uses fewer, larger pieces, the other more, smaller ones." },
  ],
  fd2: [
    { q: "Explain why 2/5 is greater than 2/7, even though 7 is greater than 5.", a: "Both fractions have 2 pieces. Cutting a whole into 7 makes smaller pieces than cutting it into 5. Two larger pieces are more than two smaller ones, so 2/5 is greater." },
    { q: "Describe two different strategies for comparing 5/8 and 3/5.", a: "One strategy is a common denominator: 25/40 and 24/40, so 5/8 is greater. Another is to compare each to a benchmark (a reference value): both exceed 1/2, by 1/8 and 1/10, and 1/8 is larger, so 5/8 is greater." },
    { q: "Why does adding the numerators and adding the denominators of two fractions give a fraction between them?", a: "Picture a team that wins 1 of 3 games and another that wins 1 of 2. Together they win 2 of 5. The combined rate must lie between the two separate rates, just as a mixture lies between its ingredients." },
  ],

// ---------- a keypad with an optional decimal point ----------
function fdPad(host, { dot = false, onEnter, max = 7 } = {}) {
  const keys = [1, 2, 3, 4, 5, 6, 7, 8, 9, 0, ...(dot ? ["."] : []), "⌫", "✓"];
  host.innerHTML = `<div class="kt-pad fd-pad"><output class="kt-entry" data-entry>?</output><div class="kt-keys fd-keys${dot ? " fd-dot" : ""}">${keys
    .map((k) => `<button type="button" data-k="${k}"${k === "✓" ? ' class="ok"' : ""} aria-label="${k === "⌫" ? "Delete" : k === "✓" ? "Enter" : k === "." ? "Point" : k}">${k}</button>`)
    .join("")}</div></div>`;
  let value = "";
  const out = $("[data-entry]", host);
  const show = () => (out.textContent = value || "?");
  const press = (k) => {
    if (k === "⌫") value = value.slice(0, -1);
    else if (k === "✓") {
      if (value) onEnter?.(value);
      return;
    } else if (k === ".") {
      if (!value.includes(".") && value.length < max) value = (value || "0") + ".";
    } else if (value.length < max) value = value === "0" ? String(k) : value + k;
    show();
  };
  host.onclick = (event) => {
    const key = event.target.closest("[data-k]");
    if (key) press(key.dataset.k);
  };
  if (host._padKeys) removeEventListener("keydown", host._padKeys);
  const onKey = (event) => {
    if (!host.isConnected || !host.contains(out)) return removeEventListener("keydown", onKey);
    if (event.target.closest?.("input, select, textarea")) return;
    if (/^[0-9]$/.test(event.key)) press(event.key);
    else if (event.key === "." && dot) press(".");
    else if (event.key === "Backspace") press("⌫");
    else if (event.key === "Enter") {
      event.preventDefault();
      press("✓");
    }
  };
  host._padKeys = onKey;
  addEventListener("keydown", onKey);
  host._pad = {
    clear() {
      value = "";
      show();
    },
  };
  return host._pad;
}

// ---------- the game engine: problems made of steps; hints after a try; answer + why after 2 tries ----------
function game(id, cfg) {
  const my = token;
  const alive = () => my === token;
  let level = shell.progress()[id]?.level || "easy";
  let round = 0;
  let clean = 0;
  let q = null;
  let si = 0;
  let tries = 0;
  let missed = false;
  let busy = false;
  let ctx = {};
  let picked = [];
  let gen = 0;
  panel(`<div class="fd-in" data-in></div><div class="ap-row"><div class="ap-chips" data-levels>${LEVELS.map(([k, l]) => `<button type="button" data-lv="${k}" aria-pressed="${k === level}">${l}</button>`).join("")}</div><p class="ap-status" data-status></p></div>`);
  const box = $("[data-in]");
  const setStatus = (s) => {
    const n = $("[data-status]");
    if (n) n.textContent = s;
  };
  const goBtn = (label, fn) => {
    box.className = "fd-in";
    box._pad = null;
    box.innerHTML = `<div class="ap-buttons"><button type="button" class="primary" data-go>${label}</button></div>`;
    box.onclick = (event) => {
      if (!event.target.closest("[data-go]") || !alive()) return;
      box.onclick = null;
      window.OC?.touch();
      fn();
    };
  };
  const badge = (card, n, color = "var(--accent)") => {
    const g = el("g", { class: "fd-badge", "pointer-events": "none" }, view);
    el("circle", { cx: card.dataset.bx, cy: card.dataset.by, r: 26, fill: color, stroke: "#fff", "stroke-width": 4 }, g);
    T(g, Number(card.dataset.bx), Number(card.dataset.by) + 10, n, 28, "#fff");
  };
  const clearPicks = () => {
    picked = [];
    view.querySelectorAll(".fd-badge").forEach((b) => b.remove());
  };
  const onStageTap = (event) => {
    const st = q?.steps[si];
    if (!alive() || busy || !st || st.type !== "order") return;
    const card = event.target.closest(".fd-card");
    if (!card || picked.includes(card.dataset.id)) return;
    window.OC?.touch();
    picked.push(card.dataset.id);
    badge(card, picked.length);
    MUSIC.play("xylophone", 72 + picked.length * 4, { gain: 0.35 });
    if (picked.length === st.ans.split(",").length) check(st, picked.join(","));
  };
  const problem = () => {
    if (!alive()) return;
    if (round >= R) return finish();
    q = cfg.make(level, round);
    gen += 1;
    window.__fd.q = q;
    window.__fd.step = () => q.steps[si];
    si = 0;
    missed = false;
    fresh();
    ctx = q.draw(view) || {};
    view.addEventListener("pointerdown", onStageTap);
    setStatus(`Problem ${round + 1} of ${R}`);
    ask("");
  };
  const ask = (prefix) => {
    const st = q.steps[si];
    tries = 0;
    picked = [];
    busy = false;
    say(`${prefix}${st.ask}`);
    if (st.type === "pad") {
      box.className = "fd-in";
      fdPad(box, { dot: !!st.dot, onEnter: (v) => check(st, v) });
    } else if (st.type === "choice") {
      box.className = "fd-in fd-pick";
      box._pad = null;
      choices(box, st.opts, (o, button) => check(st, o.v, button));
    } else {
      box.className = "fd-in";
      box._pad = null;
      box.innerHTML = `<div class="ap-buttons"><button type="button" data-redo>↺ Start over</button></div>`;
      box.onclick = (event) => {
        if (event.target.closest("[data-redo]") && !busy) clearPicks();
      };
    }
  };
  const check = async (st, v, button) => {
    if (!alive() || busy) return;
    window.OC?.touch();
    const ok = st.type === "pad" ? same(v, st.ans) : v === st.ans;
    const g0 = gen;
    if (ok) {
      busy = true;
      button?.classList.add("right");
      MUSIC.chime();
      st.show?.(ctx);
      await wait(900);
      if (!alive() || g0 !== gen) return;
      advance("Correct. ");
      return;
    }
    if (st.type === "pad" && st.near?.(Number(v))) {
      say(st.nearSay(Number(v)));
      box._pad?.clear();
      return;
    }
    tries += 1;
    missed = true;
    MUSIC.oops();
    if (button) {
      button.classList.add("wrong");
      button.disabled = true;
    }
    if (tries === 1) {
      say(`${pick(OOPS)} ${st.hint}`);
      box._pad?.clear();
      if (st.type === "order") {
        busy = true;
        await wait(1200);
        if (!alive() || g0 !== gen) return;
        clearPicks();
        busy = false;
      }
      return;
    }
    busy = true;
    if (st.type === "order") {
      clearPicks();
      st.ans.split(",").forEach((cid, i) => {
        const card = view.querySelector(`.fd-card[data-id="${cid}"]`);
        if (card) badge(card, i + 1, "#22a05a");
      });
    }
    st.show?.(ctx);
    say(`Let's look why. ${st.why}`);
    goBtn("Got it ▶", () => advance(""));
  };
  const advance = (prefix) => {
    si += 1;
    if (si < q.steps.length) ask(prefix);
    else solved();
  };
  const solved = () => {
    round += 1;
    if (!missed) clean += 1;
    window.OC?.count(cfg.count);
    q.finish?.(ctx);
    say(`${missed ? pick(GRIT) : pick(GOOD)} ${q.why}`);
    setStatus(`${round} of ${R} done`);
    goBtn(round >= R ? "Finish ▶" : "Next problem ▶", problem);
  };
  const finish = () => {
    fresh();
    const ex = pick(EXPLAIN[id]);
    el("rect", { x: 40, y: 24, width: 920, height: 512, rx: 34, fill: PAPER, stroke: "var(--accent)", "stroke-width": 5 }, view);
    T(view, 500, 84, `${R} problems complete · ${clean} correct on the first attempt`, 28, MUTED);
    T(view, 500, 150, "Explain it", 46, ACC);
    wrapSvg(view, 500, 215, ex.q, 31, 52);
    const model = el("g", { opacity: 0 }, view);
    el("line", { x1: 120, x2: 880, y1: 352, y2: 352, stroke: "#e2d6c4", "stroke-width": 3 }, model);
    T(model, 500, 388, "One strong answer:", 24, MUTED);
    wrapSvg(model, 500, 428, ex.a, 25, 66, { "font-weight": 600 });
    confetti();
    MUSIC.chime();
    shell.mark(id, { done: true });
    setStatus("Set complete");
    say(`Set complete. Now explain it: ${ex.q} Say your answer aloud to a grown-up, or write it, in two to four sentences.`);
    box.className = "fd-in";
    box._pad = null;
    box.innerHTML = `<div class="ap-buttons"><button type="button" class="primary" data-x="model">💬 I explained it</button><button type="button" data-x="try">🏠 Try it for real</button><button type="button" data-x="again">🔁 New set</button></div>`;
    box.onclick = (event) => {
      const b = event.target.closest("[data-x]");
      if (!b || !alive()) return;
      window.OC?.touch();
      if (b.dataset.x === "model") {
        window.OC?.count("explanations");
        fade(model, 600, alive);
        b.disabled = true;
        say(`Compare your explanation with this one. ${ex.a}`);
      } else if (b.dataset.x === "try") tryCard(id);
      else {
        round = 0;
        clean = 0;
        problem();
      }
    };
  };
  $("[data-levels]").addEventListener("click", (event) => {
    const b = event.target.closest("[data-lv]");
    if (!b || !alive()) return;
    document.querySelectorAll("[data-lv]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    level = b.dataset.lv;
    shell.mark(id, { level });
    window.OC?.touch();
    VOICE.hush();
    round = 0;
    clean = 0;
    problem();
  });
  problem();
}
