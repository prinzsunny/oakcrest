<script>const { $, el, svg: makeSvg, text, panel, say, pick, pickInt, wait, confetti, PRAISE, KIND, numpad, shuffle } = KIT;

const W = 1000;
const H = 560;
let token = 0;
let view = null;

const UNITS = [
  { id: "x0", label: "See it", icon: "👀" },
  { id: "x1", label: "1. Groups and arrays" },
  { id: "x6", label: "2. Times stories", icon: "📖" },

const fresh = () => {

  return view;
};
const ITEMS = ["🍎", "🍓", "⭐", "🐞", "🌼", "🍪"];

function array(rows, cols, { icon = "🍎", reveal = rows, y0 = 30, h = 420 } = {}) {
  const size = Math.min(70, (W - 200) / cols, h / rows);
  const x0 = (W - size * cols) / 2;
  for (let r = 0; r < Math.min(reveal, rows); r++) {
    el("rect", { x: x0 - 8, y: y0 + r * size + 2, width: size * cols + 16, height: size - 4, rx: 12, fill: r % 2 ? "#f6ecdc" : "#fbf3e4" }, view);
    for (let c = 0; c < cols; c++) text(view, x0 + c * size + size / 2, y0 + r * size + size * 0.72, icon, { "font-size": size * 0.68 });
    text(view, x0 - 40, y0 + r * size + size * 0.66, (r + 1) * cols, { "font-size": Math.max(18, size * 0.36), fill: "#a8632d" });
  }
}

// A working soroban: tap beads to move them, like the real one.
// Tap a heaven bead to add or take away 5; tap an earth bead to push it (and the ones between) to the beam or away.
function soroban({ rods = 4, x0 = 250, y0 = 46, w = 500, h = 330, onChange } = {}) {
  const g = el("g", { class: "ts-soroban" }, view);
  const pitch = w / rods;
  const beamY = y0 + h * 0.3;
  const bh = Math.min(h * 0.13, 46);
  const bw = Math.min(pitch * 0.44, 62);
  const defs = el("defs", {}, g);
  const grad = el("linearGradient", { id: "ts-wood", x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
  [["0", "#d9a066"], ["0.45", "#a8632d"], ["1", "#5e3214"]].forEach(([o, c]) => el("stop", { offset: o, "stop-color": c }, grad));
  el("rect", { x: x0 - 22, y: y0 - 22, width: w + 44, height: h + 44, rx: 18, fill: "#4a2f1c" }, g);
  el("rect", { x: x0 - 22, y: y0 - 22, width: w + 44, height: h + 44, rx: 18, fill: "none", stroke: "#2e1c10", "stroke-width": 3 }, g);
  el("rect", { x: x0, y: y0, width: w, height: h, rx: 6, fill: "#f4ead8" }, g);
  const digits = new Array(rods).fill(0);
  const beads = [];
  const rest = (b, d) => (b.kind === "h" ? (d >= 5 ? beamY - 5 - bh / 2 : y0 + 4 + bh / 2) : b.j < d % 5 ? beamY + 5 + bh / 2 + b.j * bh : y0 + h - 4 - bh / 2 - (3 - b.j) * bh);
  const PLACES = ["ones", "tens", "hundreds", "thousands", "ten thousands"];
  const labels = [];
  for (let i = 0; i < rods; i++) {
    const cx = x0 + pitch * (i + 0.5);
    el("rect", { x: cx - 4, y: y0, width: 8, height: h, rx: 4, fill: "#c9a46e" }, g);
    const make = (kind, j) => {
      const node = el("g", { class: "ts-bead", "data-col": i, "data-kind": kind, "data-j": j, style: "cursor:pointer" }, g);
      el("path", { d: `M${-bw} 0Q${-bw * 0.55} ${-bh / 2} 0 ${-bh / 2}Q${bw * 0.55} ${-bh / 2} ${bw} 0Q${bw * 0.55} ${bh / 2} 0 ${bh / 2}Q${-bw * 0.55} ${bh / 2} ${-bw} 0Z`, fill: "url(#ts-wood)", stroke: "#3a1d0a", "stroke-width": 1.6 }, node);
      el("path", { d: `M${-bw * 0.68} ${-3}Q0 ${-bh / 2 + 4} ${bw * 0.6} ${-4}`, fill: "none", stroke: "#f6d7a8", "stroke-width": 2.4, "stroke-linecap": "round", opacity: 0.75 }, node);
      el("rect", { x: -bw, y: -bh / 2, width: bw * 2, height: bh, fill: "transparent" }, node);
      const bead = { node, col: i, kind, j, x: cx, y: 0 };
      bead.y = rest(bead, 0);
      node.setAttribute("transform", `translate(${cx} ${bead.y})`);
      beads.push(bead);
    };
    make("h", 0);
    for (let j = 0; j < 4; j++) make("e", j);
    labels.push(text(g, cx, y0 + h + 58, "0", { "font-size": 34, fill: "#2b1d12" }));
    text(g, cx, y0 - 30, PLACES[rods - 1 - i], { "font-size": 17, fill: "#8a7258", "font-weight": 800 });
  }
  el("rect", { x: x0, y: beamY - 5, width: w, height: 10, fill: "#4a2f1c" }, g);
  for (let i = 0; i < rods; i++) if ((rods - 1 - i) % 3 === 0) el("circle", { cx: x0 + pitch * (i + 0.5), cy: beamY, r: 3.2, fill: "#f4ead8" }, g);
  const valueOf = () => digits.reduce((v, d) => v * 10 + d, 0);
  let anim = 0;
  const place = (ms) => {
    const id = ++anim;
    const from = beads.map((b) => b.y);
    const to = beads.map((b) => rest(b, digits[b.col]));
    const t0 = performance.now();
    return new Promise((resolve) => {
      const step = (now) => {
        if (id !== anim) return resolve();
        const t = ms ? Math.min(1, (now - t0) / ms) : 1;
        const e = 1 - (1 - t) ** 3;
        beads.forEach((b, k) => {
          b.y = from[k] + (to[k] - from[k]) * e;
          b.node.setAttribute("transform", `translate(${b.x} ${b.y})`);
        });
        if (t < 1) requestAnimationFrame(step);
        else resolve();
      };
      requestAnimationFrame(step);
    });
  };
  const showDigits = () => digits.forEach((d, i) => (labels[i].textContent = d));
  let locked = false;
  g.addEventListener("pointerdown", (event) => {
    const node = event.target.closest(".ts-bead");
    if (!node || locked) return;
    event.preventDefault();
    const col = Number(node.dataset.col);
    const j = Number(node.dataset.j);
    const d = digits[col];
    if (node.dataset.kind === "h") digits[col] = d >= 5 ? d - 5 : d + 5;
    else {
      const earth = d % 5;
      digits[col] = d - earth + (j < earth ? j : j + 1);
    }
    MUSIC.bead();
    window.OC?.touch();
    showDigits();
    place(170);
    onChange?.(valueOf());
  });
  return {
    value: valueOf,
    lock: (on) => (locked = on),
    // Move to a number; slow mode goes rod by rod, from the left, with a click per rod.
    async set(value, slow = false, alive = () => true) {
      const target = String(Math.max(0, value)).padStart(rods, "0").slice(-rods).split("").map(Number);
      if (!slow) {
        target.forEach((d, i) => (digits[i] = d));
        showDigits();
        return place(0);
      }
      for (let i = 0; i < rods; i++) {
        if (!alive()) return;
        if (digits[i] === target[i]) continue;
        digits[i] = target[i];
        showDigits();
        MUSIC.bead();
        await place(650);
        await wait(350);
      }
    },
  };
}

// Shared helpers for the newer units: difficulty chips, a calm tween, picture groups, the fact triangle.
const { explain, everyday, emoji } = KIT;
const LEVELS = [["easy", "🐣 Easy"], ["medium", "🦊 Medium"], ["hard", "🦁 Hard"]];
const levelRow = (cur) => `<div class="ap-row"><div class="ap-chips" data-levels>${LEVELS.map(([k, l]) => `<button type="button" data-lv="${k}" aria-pressed="${k === cur}">${l}</button>`).join("")}</div><p class="ap-status" data-status></p></div>`;
const onLevels = (id, fn) =>
  $("[data-levels]").addEventListener("click", (event) => {
    const b = event.target.closest("[data-lv]");
    if (!b) return;
    document.querySelectorAll("[data-lv]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    shell.mark(id, { level: b.dataset.lv });
    window.OC?.touch();
    fn(b.dataset.lv);
  });

// Equal groups drawn as cards: `groups` cards, each with `k` copies of `glyph` (or dots under a `head` picture).
function groupsPic(groups, k, { glyph = "🍎", head = null, caption = null, crossLast = 0, top = 20, bottom = 470, strips = false } = {}) {
  const rows = strips ? groups : groups <= 5 ? 1 : 2;
  const cols = Math.ceil(groups / rows);
  const gap = 14;
  const cw = strips ? Math.min(900, k * 90 + 40) : Math.min(260, (940 - (cols - 1) * gap) / cols);
  const maxH = (bottom - top - (rows - 1) * gap) / rows;
  const ipr = strips ? k : k <= 4 ? k : k <= 6 ? 3 : k === 9 ? 3 : k === 10 ? 5 : 4;
  const irows = Math.ceil(k / ipr);
  const hs = head ? Math.min(cw * 0.6, maxH * 0.4, 90) : 0;
  const capH = caption && !strips ? 34 : 0;
  const s = Math.min(glyph === "dot" ? 50 : 90, (cw - (strips ? 110 : 16)) / ipr, (maxH - (strips ? 12 : 24) - hs - capH) / irows);
  const ch = Math.min(maxH, (strips ? 12 : 24) + (head ? hs + 8 : 0) + irows * s + capH);
  const x0 = (W - (cols * cw + (cols - 1) * gap)) / 2;
  const y0 = top + (bottom - top - (rows * ch + (rows - 1) * gap)) / 2;
  for (let gi = 0; gi < groups; gi++) {
    const r = Math.floor(gi / cols);
    const c = gi % cols;
    const x = x0 + c * (cw + gap);
    const y = y0 + r * (ch + gap);
    el("rect", { x, y, width: cw, height: ch, rx: 18, fill: "#fbf3e4", stroke: "#e0a96d", "stroke-width": 3 }, view);
    if (head) emoji(view, x + cw / 2, y + 12 + hs / 2, head, hs);
    const iy = y + (strips ? 6 : 12) + (head ? hs + 8 : 0);
    for (let i = 0; i < k; i++) {
      const cx = x + (strips ? 50 : 0) + (cw - (strips ? 50 : 0)) / 2 + ((i % ipr) - (Math.min(ipr, k) - 1) / 2) * s;
      const cy = iy + (Math.floor(i / ipr) + 0.5) * s;
      if (glyph === "dot") el("circle", { cx, cy, r: s * 0.3, fill: "#7a4520" }, view);
      else emoji(view, cx, cy, glyph, s * 0.8);
      if (crossLast && gi * k + i >= groups * k - crossLast) {
        el("path", { d: `M${cx - s * 0.32} ${cy - s * 0.32}L${cx + s * 0.32} ${cy + s * 0.32}M${cx + s * 0.32} ${cy - s * 0.32}L${cx - s * 0.32} ${cy + s * 0.32}`, stroke: "#c0392b", "stroke-width": 5, "stroke-linecap": "round" }, view);
      }
    }
    if (caption && strips) text(view, x + 46, y + ch / 2 + 8, caption(gi), { "font-size": 22, fill: "#a8632d" });
    else if (caption) text(view, x + cw / 2, y + ch - 12, caption(gi), { "font-size": 22, fill: "#a8632d" });
  }
}

// A pile of things in a tidy grid (for "share" and "how many groups" stories).
function pilePic(n, glyph, { top = 20, bottom = 300 } = {}) {
  const per = n <= 12 ? 6 : n <= 30 ? 10 : 12;
  const rowsN = Math.ceil(n / per);
  const s = Math.min(80, 900 / per, (bottom - top) / rowsN);
  const x0 = (W - per * s) / 2;
  const y0 = top + (bottom - top - rowsN * s) / 2;
  for (let i = 0; i < n; i++) emoji(view, x0 + (i % per + 0.5) * s, y0 + (Math.floor(i / per) + 0.5) * s, glyph, s * 0.82);
}

function triangle(v, cx, cy, { a, b, c, hide = null, scale = 1 }) {
  const g = el("g", { transform: `translate(${cx} ${cy}) scale(${scale})` }, v);
  el("path", { d: "M0 -150L-140 100L140 100Z", fill: "#fbf3e4", stroke: "#e0a96d", "stroke-width": 6, "stroke-linejoin": "round" }, g);
  text(g, 0, 60, "× ÷", { "font-size": 34, fill: "#a8632d" });
  const spot = (x, y, val, key, big) => {
    el("circle", { cx: x, cy: y, r: big ? 58 : 50, fill: key === hide ? "#fff" : big ? "var(--accent)" : "#fff", stroke: key === hide ? "var(--accent)" : big ? "var(--accent-dark)" : "#e0a96d", "stroke-width": 5, "stroke-dasharray": key === hide ? "10 8" : null }, g);
    text(g, x, y + (big ? 16 : 14), key === hide ? "?" : val, { "font-size": big ? 46 : 42, fill: key === hide ? "var(--accent)" : big ? "#fff" : "#2b1d12", class: key === hide ? "xt-hidden" : null });
  };
  spot(0, -150, c, "c", true);
  spot(-140, 100, a, "a");
  spot(140, 100, b, "b");
  return g;
}

const units = {
  x0() {
    const my = token;
    const fade = (api, node, ms = 600) => api.tween(ms, (t) => node.setAttribute("opacity", t));
    explain(
      [
        { say: "Why do we learn times tables? Times is a fast way to count equal groups. Equal groups are everywhere!", draw: everyday([["🥚", "Packs of eggs"], ["🐶", "Legs on animals"], ["💺", "Rows of seats"], ["🐷", "Saving money each week"]]) },
        {
          say: "These are equal groups: 3 plates with 4 strawberries on each. Count by 4s: 4, 8, 12!",
          async draw(v, api) {
            const xs = [200, 500, 800];
            for (let p = 0; p < 3; p++) {
              const g = el("g", { opacity: 0 }, v);
              el("ellipse", { cx: xs[p], cy: 250, rx: 135, ry: 95, fill: "#fffcf6", stroke: "#c9b8a1", "stroke-width": 5 }, g);
              [[-40, -30], [40, -30], [-40, 35], [40, 35]].forEach(([dx, dy]) => emoji(g, xs[p] + dx, 250 + dy, "🍓", 60));
              text(g, xs[p], 420, (p + 1) * 4, { "font-size": 64, fill: "var(--accent-dark)" });
              await fade(api, g, 600);
              MUSIC.play("xylophone", 76 + p * 4, { gain: 0.4 });
              await api.wait(900);
            }
            const eq = el("g", { opacity: 0 }, v);
            text(eq, 500, 520, "3 groups of 4 = 12", { "font-size": 48, fill: "#2b1d12" });
            await fade(api, eq, 700);
          },
        },
        {
          say: "Times means adding the same number again and again. 4 + 4 + 4 is three 4s. We write 3 × 4 = 12.",
          async draw(v, api) {
            const y = 390;
            const xOf = (n) => 80 + n * 70;
            el("line", { x1: 50, x2: 950, y1: y, y2: y, stroke: "#5a4130", "stroke-width": 5, "stroke-linecap": "round" }, v);
            for (let n = 0; n <= 12; n++) {
              el("line", { x1: xOf(n), x2: xOf(n), y1: y - 12, y2: y + 12, stroke: "#5a4130", "stroke-width": 4 }, v);
              text(v, xOf(n), y + 50, n, { "font-size": n % 4 ? 26 : 34, fill: n % 4 ? "#8a7764" : "#2b1d12" });
            }
            const sum = text(v, 500, 90, "", { "font-size": 50, fill: "#e0603a" });
            for (let h = 0; h < 3; h++) {
              const x1 = xOf(h * 4);
              const x2 = xOf(h * 4 + 4);
              const path = el("path", { d: `M${x1} ${y - 14}Q${(x1 + x2) / 2} ${y - 190} ${x2} ${y - 14}`, fill: "none", stroke: "#e0603a", "stroke-width": 6, "stroke-linecap": "round" }, v);
              const len = path.getTotalLength();
              path.setAttribute("stroke-dasharray", len);
              await api.tween(900, (t) => path.setAttribute("stroke-dashoffset", len * (1 - t)));
              text(v, (x1 + x2) / 2, y - 112, "+4", { "font-size": 34, fill: "#e0603a" });
              sum.textContent = ["4", "4 + 4", "4 + 4 + 4 = 12"][h];
              MUSIC.play("xylophone", 76 + h * 4, { gain: 0.4 });
              await api.wait(700);
            }
            const eq = el("g", { opacity: 0 }, v);
            text(eq, 500, 160, "3 × 4 = 12", { "font-size": 54, fill: "#2b1d12" });
            await fade(api, eq, 700);
          },
        },
        {
          say: "An array puts things in neat rows: 3 rows of 4. Turn it sideways and it is 4 rows of 3. Same dots, so 3 × 4 = 4 × 3!",
          async draw(v, api) {
            const cx = 500;
            const cy = 240;
            const g = el("g", { transform: `translate(${cx} ${cy})` }, v);
            const s = 80;
            for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) el("circle", { cx: (c - 1.5) * s, cy: (r - 1) * s, r: 30, fill: ["#e53935", "#1e88e5", "#43a047"][r], stroke: "#fff", "stroke-width": 3 }, g);
            const cap = text(v, 500, 470, "3 rows of 4 = 12", { "font-size": 48, fill: "#2b1d12" });
            await api.wait(2200);
            await api.tween(1500, (t) => g.setAttribute("transform", `translate(${cx} ${cy}) rotate(${90 * t})`));
            cap.textContent = "4 rows of 3 = 12";
            MUSIC.play("xylophone", 84, { gain: 0.4 });
            await api.wait(1400);
            const eq = el("g", { opacity: 0 }, v);
            text(eq, 500, 535, "3 × 4 = 4 × 3", { "font-size": 44, fill: "var(--accent-dark)" });
            await fade(api, eq, 700);
          },
        },
        {
          say: "Division is fair sharing. Share 12 cookies with 3 friends, one at a time. Each friend gets 4. 12 ÷ 3 = 4.",
          async draw(v, api) {
            const plates = [200, 500, 800];
            ["🐻", "🐰", "🐱"].forEach((f, i) => emoji(v, plates[i], 300, f, 60));
            plates.forEach((x) => el("ellipse", { cx: x, cy: 420, rx: 138, ry: 52, fill: "#fffcf6", stroke: "#c9b8a1", "stroke-width": 4 }, v));
            const cookies = [];
            for (let i = 0; i < 12; i++) cookies.push(emoji(v, 115 + i * 70, 90, "🍪", 48));
            await api.wait(1200);
            for (let i = 0; i < 12; i++) {
              const p = i % 3;
              const k = Math.floor(i / 3);
              const sx = 115 + i * 70;
              const tx = plates[p] + (k - 1.5) * 54;
              const node = cookies[i];
              await api.tween(320, (t) => node.setAttribute("transform", `translate(${(tx - sx) * t} ${(410 - 90) * t})`));
              MUSIC.play("woodblock", 79, { gain: 0.25 });
            }
            const eq = el("g", { opacity: 0 }, v);
            text(eq, 500, 200, "12 ÷ 3 = 4", { "font-size": 60, fill: "#2b1d12" });
            await fade(api, eq, 700);
          },
        },

        board.lock(true);
        await KIT.sayAsync(`Watch the beads. I'll make ${goal}, one rod at a time.`);
        if (!alive()) return;
        await board.set(goal, true, alive);
        if (alive()) moved(board.value());
      }
    };
    ask();
  },

  x4() {
    const my = token;
    let round = 0;
    let q;
    let pad;
    panel(`<p class="ap-status" data-status></p><div class="ap-buttons"><button type="button" class="primary" data-do="deal">🍪 Deal them out</button></div><div data-pad></div>`);
    const ask = () => {
      const k = pickInt(2, round < 3 ? 4 : 6);
      const each = pickInt(2, round < 3 ? 4 : 7);
      const extra = round >= 4 ? pickInt(0, k - 1) : 0;
      q = { k, each, extra, total: k * each + extra, dealt: false };
      fresh();
      for (let i = 0; i < q.total; i++) text(view, 110 + (i % 13) * 60, 80 + Math.floor(i / 13) * 60, "🍪", { "font-size": 44, class: "ck" });
      const pw = 860 / k;
      const friends = KIT.shuffle(["🐻", "🐰", "🐱", "🐶", "🐼", "🦊"]);
      for (let p = 0; p < k; p++) {
        text(view, 70 + pw * p + pw / 2, 350, friends[p], { "font-size": 64 });
        el("ellipse", { cx: 70 + pw * p + pw / 2, cy: 455, rx: Math.min(100, pw / 2 - 8), ry: 62, fill: "#fffcf6", stroke: "#c9b8a1", "stroke-width": 4 }, view);
      }
      $("[data-status]").textContent = `Question ${round + 1} of 6 · ${q.total} ÷ ${k}`;
      $("[data-pad]").innerHTML = "";
      $("[data-do='deal']").hidden = false;
      say(`${q.total} cookies shared between ${k} friends. Press Deal to give them out one at a time.`);
    };
    const deal = async () => {
      if (q.dealt) return;
      q.dealt = true;
      $("[data-do='deal']").hidden = true;
      const cookies = [...view.querySelectorAll(".ck")];
      const pw = 860 / q.k;
      for (let i = 0; i < q.k * q.each; i++) {
        if (my !== token) return;
        const p = i % q.k;
        const j = Math.floor(i / q.k);
        // Lift the cookie above the plates and slide it onto its plate.
        const cookie = cookies[i];
        view.appendChild(cookie);
        const x0 = Number(cookie.getAttribute("x"));
        const y0 = Number(cookie.getAttribute("y"));
        const across = pw < 160 ? 3 : 4;
        const x1 = 70 + pw * p + pw / 2 + ((j % across) - (across - 1) / 2) * 38;
        const y1 = 468 + (Math.floor(j / across) - 0.5) * 34;
        const t0 = performance.now();
        await new Promise((resolve) => {
          const step = (now) => {
            const t = Math.min(1, (now - t0) / 260);
            const e = t * (2 - t);
            cookie.setAttribute("x", x0 + (x1 - x0) * e);
            cookie.setAttribute("y", y0 + (y1 - y0) * e - Math.sin(Math.PI * t) * 40);
            cookie.setAttribute("font-size", 44 - 12 * e);
            if (t < 1 && my === token) requestAnimationFrame(step);
            else resolve();
          };
          requestAnimationFrame(step);
        });
        MUSIC.play("woodblock", 79, { gain: 0.3 });
        await wait(90);
      }
      say(`How many cookies does each friend get?${q.extra ? ` There ${q.extra === 1 ? "is" : "are"} ${q.extra} left over that can't be shared equally.` : ""}`);
      pad = numpad($("[data-pad]"), { onEnter: check, max: 2 });
    };
    const check = async (v) => {
      if (my !== token) return;
      if (v === q.each) {
        MUSIC.chime();
        round += 1;
        window.OC?.count("shares");
        say(`${pick(PRAISE)} ${q.total} ÷ ${q.k} = ${q.each}${q.extra ? ` remainder ${q.extra}` : ""}. Check: ${q.k} × ${q.each}${q.extra ? ` + ${q.extra}` : ""} = ${q.total}.`);
        await wait(3400);
        if (my !== token) return;
        if (round >= 6) {
          confetti();
          shell.mark("x4", { done: true });
          say("🎉 Great sharing!");
          round = 0;
          await wait(2400);
        }
        if (my === token) ask();
      } else {
        MUSIC.oops();
        pad.clear();
        say(`${pick(KIND)} Count the cookies on one plate.`);
      }
    };
    $("[data-panel]").onclick = (event) => {
      if (event.target.closest("[data-do='deal']")) deal();
    };
    ask();
  },

  x5() {
    const my = token;
    let list = [];
    let at = 0;
    let right = 0;
    let missed = false;
    let pad;
    panel(`<p class="ap-status" data-status></p><div data-pad></div>`);
    const start = () => {
      list = Array.from({ length: 12 }, () => {
        const b = pickInt(2, 10);
        const c = pickInt(2, 10);
        return [b * c, b, c];
      });
      at = 0;
      right = 0;
      pad = numpad($("[data-pad]"), { onEnter: check, max: 2 });
      show();
    };
    const show = () => {
      missed = false;
      const [n, b] = list[at];
      fresh();
      text(view, W / 2, 260, `${n} ÷ ${b} = ?`, { "font-size": 110, fill: "#2b1d12" });
      text(view, W / 2, 360, `Think: ${b} × ? = ${n}`, { "font-size": 34, fill: "#8a7764" });
      $("[data-status]").textContent = `Question ${at + 1} of 12 · ${right} right`;
      say(`${n} divided by ${b}`);
      pad.clear();
    };
    const check = async (v) => {
      if (my !== token) return;
      const [n, b, c] = list[at];
      if (v === c) {
        if (!missed) right += 1;
        MUSIC.play("xylophone", 84 + (at % 8), { gain: 0.5 });
        at += 1;
        window.OC?.count("division facts");
        if (at < 12) return show();
        MUSIC.chime();
        confetti();
        if (right >= 10) shell.mark("x5", { done: true });
        fresh();
        text(view, W / 2, 260, `${right} / 12`, { "font-size": 110, fill: "#2b1d12" });
        say(`🎉 ${right} out of 12! ${right >= 10 ? "Division star!" : "Practise the times tables and try again."}`);
        await wait(3000);
        if (my === token) start();
      } else {
        if (!missed) MUSIC.oops();
        missed = true;
        pad.clear();
        say(`${pick(KIND)} ${b} × ${c} = ${n}, so ${n} ÷ ${b} = ${c}. Type ${c}.`);
      }
    };
    start();
  },
};

const shell = SHELL({
  units: UNITS,
  how: {
    x0: { icon: "👀", title: "See it", steps: ["Watch the pictures.", "Press Next ▶ to go on.", "Press Let's play when you are ready."] },
    x6: { icon: "📖", title: "Times stories", steps: ["Listen to the story.", "Look at the picture: find the equal groups.", "Type the answer and press ✓."] },
    x7: { icon: "🔺", title: "Missing number", steps: ["One number is hiding: ?", "Use times or sharing to find it.", "Type it and press ✓."] },
    x1: { icon: "🍎", title: "Groups and arrays", steps: ["Watch the rows of apples appear.", "Count by rows: the numbers help!", "Type how many apples, then press ✓."] },
    x2: { icon: "✖️", title: "Times tables", steps: ["Pick a times table at the top.", "Type the answer and press ✓.", "Go as fast as you can!"] },
    x3: { icon: "🧮", title: "Soroban multiplication", steps: ["We multiply in two parts: tens, then ones.", "Type each part, then tap the beads to put it on the soroban.", "Stuck? Press 👀 Show me and watch the beads."] },
    x4: { icon: "🍪", title: "Sharing", steps: ["Press Deal to share the cookies.", "Count how many one friend gets.", "Type it and press ✓."] },
    x5: { icon: "➗", title: "Division facts", steps: ["Look at the question.", "Think: what times the small number makes the big one?", "Type it and press ✓."] },
  },
  start: "x0",
  onStop() {
    token += 1;
    $("[data-panel]").onclick = null;
  },
  subject: "Math",
  activity: "Times Tables & Division",
  onUnit(id) {
    token += 1;
    VOICE.hush();
    $("[data-panel]").onclick = null;
    units[id]();
  },
});
MUSIC.preload("xylophone", [72, 74, 76, 78, 80, 82, 84, 85, 86, 87, 88, 89, 90, 91, 96]);
MUSIC.preload("woodblock", [79]);
MUSIC.preload("piano", [64, 67]);
</script>
