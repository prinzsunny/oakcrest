// ---------- flat shapes ----------
const TAU = Math.PI * 2;
const reg = (n, r, start = -Math.PI / 2) => Array.from({ length: n }, (_, i) => [r * Math.cos(start + (i * TAU) / n), r * Math.sin(start + (i * TAU) / n)]);
function shapePts(kind, s, v = 0) {

    case "pentagon":
      return reg(5, s).map(([x, y]) => [x, y + s * 0.08]);
    case "hexagon":
      return reg(6, s, 0);
    case "heptagon":
      return reg(7, s).map(([x, y]) => [x, y + s * 0.05]);
    case "octagon":
      return reg(8, s, Math.PI / 8);

      return [[0, -s * 1.05], [s * 0.65, 0], [0, s * 1.05], [-s * 0.65, 0]];
    case "trapezoid":
      return [[-s * 0.55, -s * 0.6], [s * 0.55, -s * 0.6], [s * 1.15, s * 0.6], [-s * 1.15, s * 0.6]];

      return [[0, -s], [s * 0.85, -s * 0.2], [s * 0.85, s * 0.9], [-s * 0.85, s * 0.9], [-s * 0.85, -s * 0.2]];

      return [[-s, -s * 0.3], [s * 0.2, -s * 0.3], [s * 0.2, -s * 0.75], [s, 0], [s * 0.2, s * 0.75], [s * 0.2, s * 0.3], [-s, s * 0.3]];

const SIDES = { circle: 0, oval: 0, triangle: 3, square: 4, rectangle: 4, rhombus: 4, trapezoid: 4, pentagon: 5, house: 5, hexagon: 6, lshape: 6, heptagon: 7, arrow: 7, octagon: 8, star: 10 };
const NAME = { circle: "circle", oval: "oval", triangle: "triangle", square: "square", rectangle: "rectangle", rhombus: "rhombus", trapezoid: "trapezoid", pentagon: "pentagon", house: "pentagon", hexagon: "hexagon", lshape: "hexagon", heptagon: "heptagon", arrow: "heptagon", octagon: "octagon", star: "decagon" };
const PLURAL = { rhombus: "rhombuses" };
const plural = (k) => PLURAL[k] || `${NAME[k]}s`;
const DESC = {
  circle: "A circle is perfectly round, with no corners.",
  oval: "An oval is a stretched circle, like an egg.",
  triangle: "A triangle has 3 sides.",
  square: "A square has 4 sides that are all the same length.",
  rectangle: "A rectangle has 4 square corners: two long sides and two short sides.",
  pentagon: "A pentagon has 5 sides.",
  hexagon: "A hexagon has 6 sides, like a honeycomb cell.",
  octagon: "An octagon has 8 sides, like a stop sign.",
  rhombus: "A rhombus has 4 sides all the same length, like a diamond.",
  trapezoid: "A trapezoid has 4 sides: a long bottom and a shorter top that runs the same way.",

const rot = (pts, a) => pts.map(([x, y]) => [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)]);
const ptsStr = (pts, cx = 0, cy = 0) => pts.map(([x, y]) => `${(cx + x).toFixed(1)},${(cy + y).toFixed(1)}`).join(" ");
function drawShape(parent, kind, cx, cy, s, { fill = "#f2a03d", stroke, angle = 0, v = 0, attrs = {} } = {}) {
  const line = stroke || darker[fill] || "#5a4130";
  const common = { fill, stroke: line, "stroke-width": 5, "stroke-linejoin": "round", ...attrs };
  if (kind === "circle") return el("circle", { cx, cy, r: s * 0.95, ...common }, parent);
  if (kind === "oval") return el("ellipse", { cx, cy, rx: s * 1.15, ry: s * 0.7, transform: `rotate(${(angle * 180) / Math.PI} ${cx} ${cy})`, ...common }, parent);

function ico(kind, fill = "#f2a03d") {

  const shape = kind === "circle" ? `<circle r="38"` : kind === "oval" ? `<ellipse rx="44" ry="28"` : `<polygon points="${ptsStr(pts)}"`;
  return `<svg class="sh-ico" viewBox="-50 -50 100 100" aria-hidden="true">${shape} fill="${fill}" stroke="${darker[fill] || "#5a4130"}" stroke-width="6" stroke-linejoin="round"/></svg>`;

// ---------- 3D solids ----------
function ring(n, y, r) {

}
function box(a, b, c) {
  const v = [];
  for (const x of [-a, a]) for (const y of [-b, b]) for (const z of [-c, c]) v.push([x, y, z]);
  // index = xi*4 + yi*2 + zi
  return { v, f: [[0, 1, 3, 2], [4, 6, 7, 5], [0, 4, 5, 1], [2, 3, 7, 6], [0, 2, 6, 4], [1, 5, 7, 3]].map((idx) => ({ idx })) };
}
const SOLIDS = {
  cube: { name: "cube", hue: 28, faces: 6, edges: 12, verts: 8, things: [["🎲", "dice"], ["🧊", "an ice cube"]], make: () => box(0.95, 0.95, 0.95) },
  cuboid: { name: "cuboid", hue: 205, faces: 6, edges: 12, verts: 8, things: [["📦", "a box"], ["🧱", "a brick"]], make: () => box(1.35, 0.7, 0.85) },
  pyramid: {
    name: "pyramid", hue: 45, faces: 5, edges: 8, verts: 5, things: [["🏜️", "the pyramids in Egypt"]],
    make: () => ({ v: [[-1, -0.75, -1], [1, -0.75, -1], [1, -0.75, 1], [-1, -0.75, 1], [0, 1.15, 0]], f: [[0, 1, 2, 3], [0, 4, 1], [1, 4, 2], [2, 4, 3], [3, 4, 0]].map((idx) => ({ idx })) }),
  },
  prism: {
    name: "triangular prism", hue: 140, faces: 5, edges: 9, verts: 6, things: [["⛺", "a tent"], ["🧀", "a cheese wedge"]],
    make: () => ({ v: [[-1.05, -0.8, -1.15], [1.05, -0.8, -1.15], [0, 0.95, -1.15], [-1.05, -0.8, 1.15], [1.05, -0.8, 1.15], [0, 0.95, 1.15]], f: [[0, 1, 2], [3, 4, 5], [0, 1, 4, 3], [1, 2, 5, 4], [2, 0, 3, 5]].map((idx) => ({ idx })) }),
  },
  cylinder: {
    name: "cylinder", hue: 0, flat: 2, things: [["🥫", "a can"], ["🔋", "a battery"]],
    make: () => {
      const n = 28;
      const v = [...ring(n, 1, 0.85), ...ring(n, -1, 0.85)];
      const f = [{ idx: [...Array(n).keys()] }, { idx: [...Array(n).keys()].map((i) => n + i) }];
      for (let i = 0; i < n; i++) f.push({ idx: [i, (i + 1) % n, n + ((i + 1) % n), n + i], curved: true });
      return { v, f };
    },
  },
  cone: {
    name: "cone", hue: 300, flat: 1, things: [["🍦", "an ice-cream cone"], ["🥳", "a party hat"]],
    make: () => {
      const n = 28;
      const v = [...ring(n, -0.85, 1), [0, 1.2, 0]];
      const f = [{ idx: [...Array(n).keys()] }];
      for (let i = 0; i < n; i++) f.push({ idx: [i, n, (i + 1) % n], curved: true });
      return { v, f };
    },
  },
  sphere: { name: "sphere", hue: 120, flat: 0, things: [["⚽", "a ball"], ["🌍", "the Earth"]], make: () => ({ v: [], f: [], sphere: true }) },

function turn([x, y, z], yaw, pitch) {

})();
function drawSolid(parent, solid, { cx, cy, size, yaw, pitch, reveal = null }) {

    if (!defs) {
      const d = el("defs", {}, view);
      const g = el("radialGradient", { id: "sh-ball", cx: "0.35", cy: "0.3", r: "0.75" }, d);
      el("stop", { offset: "0", "stop-color": "#c8f0c4" }, g);
      el("stop", { offset: "0.55", "stop-color": "#4caf6a" }, g);
      el("stop", { offset: "1", "stop-color": "#22663a" }, g);

    el("ellipse", { cx, cy: cy + size * 1.08, rx: size * 0.8, ry: size * 0.12, fill: "#3a2210", opacity: 0.12 }, parent);

        const a = (i * TAU) / 72;
        const p = plane ? [0, Math.cos(a), Math.sin(a)] : [Math.cos(a), 0, Math.sin(a)];
        return turn(p, yaw, pitch);
      });
      let d = "";
      pts.forEach(([x, y, z], i) => {
        if (z < 0) return;

// ---------- angle helpers ----------

function angleRig(parent, { px = 330, py = 430, len = 330, deg = 40, protractor = false, tester = false }) {

  const square = el("path", { fill: "none", stroke: "#3d8bd9", "stroke-width": 5 }, g);
  el("line", { x1: px, y1: py, x2: px + len, y2: py, stroke: "#7a4a24", "stroke-width": 18, "stroke-linecap": "round" }, g);
  const arm = el("line", { x1: px, y1: py, stroke: "#c56a2d", "stroke-width": 18, "stroke-linecap": "round" }, g);
  const knob = el("circle", { r: 26, fill: "#ffcf3a", stroke: "#b06a14", "stroke-width": 4 }, g);
  el("circle", { cx: px, cy: py, r: 16, fill: "#5a4130" }, g);
  const set = (d) => {
    const a = (d * Math.PI) / 180;
    const x = px + len * Math.cos(a);
    const y = py - len * Math.sin(a);
    arm.setAttribute("x2", x);
    arm.setAttribute("y2", y);
    knob.setAttribute("cx", x);
    knob.setAttribute("cy", y);
    const k = kindOf(d);
    const right = k === "right";
    sector.setAttribute("d", right ? "" : arcPath(px, py, 90, d));
    sector.setAttribute("fill", KCOL[k]);
    square.setAttribute("d", right ? `M${px + 56} ${py}L${px + 56} ${py - 56}L${px} ${py - 56}` : "");
  };
  set(deg);
  return { set, g, px, py, knob };
}

const angIco = (d) => {
  const a = (d * Math.PI) / 180;
  return `<svg class="sh-ico" viewBox="0 0 60 50" aria-hidden="true"><path d="M8 42H54M8 42L${(8 + 40 * Math.cos(a)).toFixed(1)} ${(42 - 40 * Math.sin(a)).toFixed(1)}" stroke="${KCOL[kindOf(d)]}" stroke-width="7" stroke-linecap="round" fill="none"/></svg>`;
};

// ---------- garden grid ----------
const GU = 50;
const GX = 60;
const GY = 60;
const GC = 14;
const GR = 9;
function gardenGrid(parent) {
  el("rect", { x: GX - 6, y: GY - 6, width: GC * GU + 12, height: GR * GU + 12, rx: 14, fill: "#eef6e2" }, parent);
  for (let c = 0; c <= GC; c++) el("line", { x1: GX + c * GU, x2: GX + c * GU, y1: GY, y2: GY + GR * GU, stroke: "#cfe0b8", "stroke-width": 2 }, parent);
  for (let r = 0; r <= GR; r++) el("line", { y1: GY + r * GU, y2: GY + r * GU, x1: GX, x2: GX + GC * GU, stroke: "#cfe0b8", "stroke-width": 2 }, parent);
}
function perimeterSteps(c0, r0, w, h) {
  const out = [];
  for (let i = 0; i < w; i++) out.push([c0 + i, r0, c0 + i + 1, r0]);
  for (let i = 0; i < h; i++) out.push([c0 + w, r0 + i, c0 + w, r0 + i + 1]);
  for (let i = w; i > 0; i--) out.push([c0 + i, r0 + h, c0 + i - 1, r0 + h]);
  for (let i = h; i > 0; i--) out.push([c0, r0 + i, c0, r0 + i - 1]);
  return out;
}
function fence(parent, c0, r0, w, h, color = "#8a5a2b") {
  const g = el("g", {}, parent);
  el("rect", { x: GX + c0 * GU, y: GY + r0 * GU, width: w * GU, height: h * GU, fill: "none", stroke: color, "stroke-width": 8, "stroke-linejoin": "round" }, g);
  for (let c = 0; c <= w; c++)
    for (let r = 0; r <= h; r++) if (c === 0 || r === 0 || c === w || r === h) el("circle", { cx: GX + (c0 + c) * GU, cy: GY + (r0 + r) * GU, r: 7, fill: "#5a3a1a" }, g);
  return g;
}

        q.counter.textContent = `🌷 ${q.done.size}`;
        if (q.done.size === w * h) {
          busy = true;
          round += 1;
          right += 1;
          window.OC?.count("gardens planted");
          setTimeout(() => {
            if (my !== token) return;
            MUSIC.chime();
            say(`${pick(PRAISE)} You planted ${w * h} flowers. The garden's <b>area</b> is ${w * h} tiles.`);
            next(3400);
          }, 700);
        }
      } else if (q.mode === "count") {
        const { c0, r0, w, h } = q;
        if (!cell.inside || cell.c < c0 || cell.c >= c0 + w || cell.r < r0 || cell.r >= r0 + h) return;
        const key = `${cell.c},${cell.r}`;
        if (q.done.has(key)) return;
        q.done.add(key);
        plant(cell.c, cell.r, q.done.size, q.g);
        note(q.done.size % 12, 0.3);
      } else if (q.mode === "draw") {
        if (!cell.inside) return;
        dragStart = cell;
        try {
          stage.setPointerCapture(event.pointerId);
        } catch {}
        paintRect(cell, cell);
      }
    };
    stage.onpointermove = (event) => {
      if (!dragStart || my !== token || busy) return;
      paintRect(dragStart, cellAt(event));
    };
    stage.onpointerup = stage.onpointercancel = () => {
      if (!dragStart) return;
      dragStart = null;
      if (my === token && !busy && q?.mode === "draw") checkDraw();
    };
    ask();
  },
};

const clearStage = () => {
  stage.onpointerdown = stage.onpointermove = stage.onpointerup = stage.onpointercancel = null;
};

    sh3: { icon: "🧊", title: "Solid shapes", steps: ["Drag the shape to spin it.", "Look at every side.", "Tap the right answer below."] },
    sh4: { icon: "📏", title: "Angles", steps: ["Drag the yellow knob to turn the arm.", "A square corner is a right angle.", "Let go to check your angle."] },
    sh5: { icon: "🌷", title: "Fence & tiles", steps: ["Tiles inside are the area.", "The fence around is the perimeter.", "Tap, drag or type to answer."] },
  },

    token += 1;
    clearStage();
    $("[data-panel]").onclick = null;
  },

  onUnit(id) {
    token += 1;
    VOICE.hush();
    clearStage();
    units[id]();
  },
});
