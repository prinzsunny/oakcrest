// ---------- small helpers ----------
const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
const only = (list) => (list.length === 1 ? list[0] : NaN);
const perms = (list) => (list.length <= 1 ? [list] : list.flatMap((x, i) => perms([...list.slice(0, i), ...list.slice(i + 1)]).map((p) => [x, ...p])));
const pairs = (n) => range(0, n - 1).flatMap((i) => range(i + 1, n - 1).map((j) => [i, j]));
const squaresIn = (n) => range(1, n).reduce((s, k) => s + (n - k + 1) ** 2, 0);
const rectsIn = (cols, rows) => pairs(cols + 1).length * pairs(rows + 1).length;
const perimeterOf = (cells) => {
  const set = new Set(cells.map(([x, y]) => `${x},${y}`));
  let p = 0;
  for (const [x, y] of cells) for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) if (!set.has(`${x + dx},${y + dy}`)) p += 1;
  return p;
};

// Wrapped text in the SVG. Returns the number of lines.
function para(parent, x, y, str, { size = 30, width = 900, lh = 1.32, fill = "#2b1d12", weight = 700, anchor = "start" } = {}) {
  const maxChars = Math.max(8, Math.floor(width / (size * 0.53)));
  const lines = [];
  for (const block of String(str).split("\n")) {
    let line = "";
    for (const word of block.split(" ")) {
      if (line && (line + " " + word).length > maxChars) {
        lines.push(line);
        line = word;
      } else line = line ? `${line} ${word}` : word;
    }
    lines.push(line);
  }
  if (parent) lines.forEach((ln, i) => text(parent, x, y + i * size * lh, ln, { "font-size": size, fill, "font-weight": weight, "text-anchor": anchor }));
  return lines.length;
}
const fitSize = (str, width, maxH, start = 32, min = 22) => {
  let size = start;
  while (size > min && para(null, 0, 0, str, { size, width }) * size * 1.32 > maxH) size -= 2;
  return size;
};

}
function cellsPic(g, cells, cell, x0, y0, fill = "#f2c94c") {

}

}

// ---------- the problems (all original) ----------
// lvl 0 = Kangaroo grades 3–4 flavour, 1 = grades 5–6 / MOEMS E, 2 = harder MOEMS / early AMC 8.
// Multiple choice: opts (5 values) and ans (the right value). Numeric: no opts, ans is a whole number.
// calc() works the answer out again by brute force or arithmetic, so the tests can check every key.
const ROOMS = {
  ct1: {
    name: "Number sense",
    problems: [
      {
        lvl: 0,
        q: "What is the smallest whole number whose digits add up to 25?",
        opts: [799, 889, 979, 997, 1699],
        ans: 799,
        idea: "Fewest digits first, then the smallest front digit",
        hints: ["Could a 2-digit number work? What is the largest digit sum a 2-digit number can have?", "A 3-digit number can reach 25. To make it small, should the big digits go at the front or the back?", "Make the ones and tens digits as large as possible (9 and 9). What must the hundreds digit be?"],
        sol: ["The largest digit sum with 2 digits is 9 + 9 = 18, too small. So we need at least 3 digits, and any 3-digit number is smaller than any 4-digit number.", "To keep a 3-digit number small, its hundreds digit must be as small as possible, so the tens and ones digits should be as large as possible: 9 and 9.", "25 − 9 − 9 = 7, so the number is 799. The answer is 799."],
        calc: () => range(1, 9999).find((n) => String(n).split("").reduce((s, c) => s + Number(c), 0) === 25),
      },
      {
        lvl: 0,
        q: "In the subtraction 9▢2 − ▢57 = 365, each ▢ hides one digit (the two hidden digits may differ). What is the sum of the two hidden digits?",
        opts: [5, 6, 7, 8, 9],
        ans: 7,
        idea: "Undo subtraction with addition",
        hints: ["Subtraction can be checked by addition. What is ▢57 + 365?", "Add the ones: 7 + 5 = 12. Write 2, carry 1. Now the tens: 5 + 6 + 1. What do you write, and do you carry?", "The total must be 9▢2. Which hundreds digit in ▢57 makes the hundreds come to 9?"],
        sol: ["If 9▢2 − ▢57 = 365, then ▢57 + 365 = 9▢2.", "Ones: 7 + 5 = 12, write 2 and carry 1. Tens: 5 + 6 + 1 = 12, write 2 and carry 1. So the first hidden digit is 2.", "Hundreds: ▢ + 3 + 1 = 9, so the second hidden digit is 5. Check: 922 − 557 = 365. The sum is 2 + 5 = 7."],
        calc: () => only(range(0, 9).flatMap((a) => range(1, 9).filter((b) => 900 + 10 * a + 2 - (100 * b + 57) === 365).map((b) => a + b))),
      },
      {
        lvl: 0,
        q: "I am a 3-digit number with three different digits that add up to 15. My hundreds digit is twice my tens digit, and my ones digit is the largest of my three digits. What number am I?",
        opts: [249, 429, 483, 843, 924],
        ans: 429,
        idea: "List the cases a clue allows",
        hints: ["The hundreds digit is twice the tens digit. Which pairs are possible: tens 1, hundreds 2; tens 2, hundreds 4; …?", "For each pair, what must the ones digit be so that all three add to 15?", "Now test the last clue: in which case is the ones digit the largest digit?"],
        sol: ["Possible (hundreds, tens) pairs: (2, 1), (4, 2), (6, 3), (8, 4).", "The ones digit makes the total 15: 12, 9, 6, 3. A digit cannot be 12, so the candidates are 429, 636 and 843; 636 repeats a digit.", "Only in 429 is the ones digit the largest. The answer is 429."],
        calc: () => only(range(100, 999).filter((n) => { const [h, t, o] = String(n).split("").map(Number); return new Set([h, t, o]).size === 3 && h + t + o === 15 && h === 2 * t && o > h && o > t; })),
      },
      {
        lvl: 0,
        q: "Three different whole numbers, each greater than 1, multiply to make 60. What is the largest possible sum of the three numbers?",
        opts: [12, 13, 14, 15, 17],
        ans: 15,
        idea: "Make an organised list",
        hints: ["Start with the smallest number being 2. Which pairs of different numbers multiply to make 30?", "Now try the smallest number being 3. Which pairs multiply to make 20?", "Write the sum of every triple you found. Which is largest?"],
        sol: ["Smallest number 2: the other two multiply to 30, giving 2 × 3 × 10 and 2 × 5 × 6.", "Smallest number 3: the other two multiply to 20, giving 3 × 4 × 5. (Smallest 4 or more is impossible: 4 × 5 × 6 is already 120.)", "Sums: 2 + 3 + 10 = 15, 2 + 5 + 6 = 13, 3 + 4 + 5 = 12. The largest is 15."],
        calc: () => Math.max(...range(2, 60).flatMap((a) => range(a + 1, 60).flatMap((b) => range(b + 1, 60).filter((c) => a * b * c === 60).map((c) => a + b + c)))),
      },
      {
        lvl: 1,
        q: "What is 99 + 99 + 99 + 99 + 99?",
        opts: [485, 495, 499, 500, 505],
        ans: 495,
        idea: "Use a friendly number",
        hints: ["99 is very close to a nicer number. Which one?", "What would 100 + 100 + 100 + 100 + 100 be?", "Each 99 is 1 less than 100. How much too big is 500?"],
        sol: ["Each 99 is 100 − 1.", "Five hundreds make 500, but we added 1 too much five times.", "500 − 5 = 495. The answer is 495."],
        calc: () => 99 * 5,
      },
      {
        lvl: 1,
        q: "How many whole numbers from 1 to 50 have at least one digit 3?",
        opts: [5, 10, 13, 14, 15],
        ans: 14,
        idea: "Make an organised list",
        hints: ["Which numbers have 3 in the ones place? List them.", "Now which numbers have 3 in the tens place?", "Did you count 33 twice? Count it only once."],
        sol: ["3 in the ones place: 3, 13, 23, 33, 43. That is 5 numbers.", "3 in the tens place: 30 to 39. That is 10 numbers, and 33 is already counted.", "5 + 10 − 1 = 14. The answer is 14."],
        calc: () => range(1, 50).filter((n) => String(n).includes("3")).length,
      },
      {
        lvl: 1,
        q: "Three numbers in a row (like 4, 5, 6) add up to 48. What is the biggest of the three?",
        opts: [15, 16, 17, 18, 19],
        ans: 17,
        idea: "Use the middle",
        hints: ["If the three numbers were all equal, what would each one be?", "48 ÷ 3 is the middle number. Why?", "The middle number is 16. What comes just after it?"],
        sol: ["In three numbers in a row, the small one is 1 less than the middle and the big one is 1 more. They balance.", "So all three are like the middle number: 48 ÷ 3 = 16.", "The numbers are 15, 16, 17. Check: 15 + 16 + 17 = 48. The biggest is 17."],
        calc: () => only(range(1, 48).filter((n) => n + (n + 1) + (n + 2) === 48)) + 2,
      },
      {
        lvl: 1,
        q: "I am a 2-digit number less than 50. If you divide me by 2, by 3 or by 5, there is always 1 left over. What number am I?",
        opts: [11, 16, 21, 31, 41],
        ans: 31,
        idea: "Find what fits every clue",
        hints: ["Pick a choice. What is left over when you divide it by 2?", "Which numbers leave nothing over for 2, 3 and 5 all at once?", "30 shares evenly into 2s, 3s and 5s. What about 1 more than 30?"],
        sol: ["A number that leaves 1 over each time is 1 more than a number that 2, 3 and 5 all share into evenly.", "The smallest number that 2, 3 and 5 all go into is 30. The next is 60, which is too big.", "30 + 1 = 31. Check: 31 = 15 twos + 1 = 10 threes + 1 = 6 fives + 1. The answer is 31."],
        calc: () => only(range(10, 49).filter((n) => n % 2 === 1 && n % 3 === 1 && n % 5 === 1)),
      },
      {
        lvl: 2,
        q: "Multiply twenty 2s together: 2 × 2 × 2 × … × 2 (twenty factors of 2). What is the ones digit of the answer?",
        opts: [0, 2, 4, 6, 8],
        ans: 6,
        idea: "Find a pattern",
        hints: ["Work out the first few: 2, 4, 8, 16, 32 … Look only at the ones digits.", "The ones digits go 2, 4, 8, 6, 2, 4, 8, 6 … How long is the pattern?", "The pattern repeats every 4. Which ones digit is in place 4, 8, 12, 16, 20?"],
        sol: ["Ones digits of 2, 4, 8, 16, 32, 64, 128, 256 are 2, 4, 8, 6, 2, 4, 8, 6.", "The pattern 2, 4, 8, 6 repeats every 4 steps. Places 4, 8, 12, 16 and 20 always end in 6.", "So twenty 2s multiplied end in 6. (It is 1,048,576.) The answer is 6."],
        calc: () => Number(2n ** 20n % 10n),
      },
      {
        lvl: 2,
        q: "Use each of the digits 1, 2, 3, 4, 5 and 6 exactly once to make two 3-digit numbers. What is the smallest possible sum of the two numbers?",
        ans: 381,
        idea: "Put small digits in valuable places",
        hints: ["Which place contributes most to the sum: hundreds, tens or ones?", "Which two digits should occupy the hundreds places if the sum is to be small?", "Hundreds digits 1 and 2, tens digits 3 and 4, ones digits 5 and 6. Does the pairing within each place matter?"],
        sol: ["A hundreds digit counts 100 times, a tens digit 10 times and a ones digit once, so the smallest digits belong in the most valuable places.", "Hundreds: 1 and 2 give 300. Tens: 3 and 4 give 70. Ones: 5 and 6 give 11.", "300 + 70 + 11 = 381, for example 135 + 246. The pairing within a place does not change the sum. The answer is 381."],
        calc: () => Math.min(...perms([1, 2, 3, 4, 5, 6]).map(([a, b, c, d, e, f]) => 100 * a + 10 * b + c + 100 * d + 10 * e + f)),
      },
      {
        lvl: 2,
        q: "A book has pages numbered 1 to 120. How many digits are printed to number all the pages?",
        ans: 252,
        idea: "Split into groups",
        hints: ["Which page numbers use just 1 digit? How many are there?", "Which page numbers use 2 digits? How many?", "Pages 100 to 120 use 3 digits each. How many pages is that? Careful: count both ends."],
        sol: ["Pages 1 to 9: 9 pages × 1 digit = 9 digits.", "Pages 10 to 99: 90 pages × 2 digits = 180 digits.", "Pages 100 to 120: 21 pages × 3 digits = 63 digits.", "9 + 180 + 63 = 252. The answer is 252."],
        calc: () => range(1, 120).map(String).join("").length,
      },
      {
        lvl: 2,
        q: "Two whole numbers multiply to 36 and add up to 13. What is the difference between them?",
        ans: 5,
        idea: "Make an organised list",
        hints: ["Which pairs of numbers multiply to make 36? Start with 1 × 36.", "List them all: 1 × 36, 2 × 18 … Which pair adds to 13?", "You found the pair. Now take the smaller one from the bigger one."],
        sol: ["Factor pairs of 36: 1 × 36, 2 × 18, 3 × 12, 4 × 9, 6 × 6.", "Their sums: 37, 20, 15, 13, 12. Only 4 and 9 add to 13.", "9 − 4 = 5. The answer is 5."],
        calc: () => only(range(1, 36).filter((a) => 36 % a === 0 && a <= 36 / a && a + 36 / a === 13).map((a) => 36 / a - a)),
      },
    ],
  },
  ct2: {
    name: "Logic & patterns",
    problems: [
      {
        lvl: 0,
        q: "Five children compare heights. Ben is taller than Cara but shorter than Dev. Eva is shorter than Cara. Finn is taller than Dev. Who is in the middle when they stand from shortest to tallest?",
        opts: ["Ben", "Cara", "Dev", "Eva", "Finn"],
        ans: "Ben",
        idea: "Build the order one clue at a time",
        hints: ["Start with the first clue. Put Cara, Ben and Dev in order from shortest to tallest.", "Where does Eva go? Where does Finn go?", "Now write all five in order. Who is third?"],
        sol: ["Ben is taller than Cara and shorter than Dev: Cara, Ben, Dev.", "Eva is shorter than Cara, so she comes first. Finn is taller than Dev, so he comes last: Eva, Cara, Ben, Dev, Finn.", "The middle (third) child is Ben."],
        calc: () => {
          const ok = perms(["Ben", "Cara", "Dev", "Eva", "Finn"]).filter((p) => { const i = (x) => p.indexOf(x); return i("Ben") > i("Cara") && i("Ben") < i("Dev") && i("Eva") < i("Cara") && i("Finn") > i("Dev"); });
          return only(ok)[2];
        },
      },
      {
        lvl: 0,
        q: "In a sequence, every number after the first two is the sum of the two numbers just before it. The 3rd number is 7 and the 5th number is 18. What is the 1st number?",
        opts: [1, 2, 3, 4, 5],
        ans: 3,
        idea: "Work backward",
        hints: ["The 5th number is the sum of the 3rd and 4th. What must the 4th be?", "The 4th number is the sum of the 2nd and 3rd. What must the 2nd be?", "The 3rd number is the sum of the 1st and 2nd. What must the 1st be?"],
        sol: ["5th = 3rd + 4th, so 18 = 7 + 4th, and the 4th number is 11.", "4th = 2nd + 3rd, so 11 = 2nd + 7, and the 2nd number is 4.", "3rd = 1st + 2nd, so 7 = 1st + 4, and the 1st number is 3. Check: 3, 4, 7, 11, 18. The answer is 3."],
        calc: () => only(range(0, 20).flatMap((a) => range(0, 20).filter((b) => { const t = [a, b]; while (t.length < 5) t.push(t[t.length - 1] + t[t.length - 2]); return t[2] === 7 && t[4] === 18; }).map(() => a))),
      },
      {
        lvl: 0,
        q: "Of three friends, exactly one always lies and the other two always tell the truth. Amy says: 'Ben is the liar.' Ben says: 'I am not the liar.' Cal says: 'Amy is the liar.' Who is the liar?",
        opts: ["Amy", "Ben", "Cal", "Any of them", "Can't tell"],
        ans: "Amy",

    let showing = "problem";
    const tag = `${R.name} · ${set} ${i + 1} · ${LV[p.lvl][0]} ${LV[p.lvl][1]}`;
    panel(`<div class="ap-row ct-ans" data-answer></div><div class="ap-row"><p class="ap-status" data-status></p><div class="ap-chips ct-tools" data-tools><button type="button" data-t="read" aria-label="Read it to me">🔊</button><button type="button" data-t="hint" aria-label="Hint">💡<span class="ct-lab"> Hint</span></button><button type="button" data-t="sol" aria-label="Solution">📖<span class="ct-lab"> Solution</span></button><button type="button" data-t="list" aria-label="Problem list">☰<span class="ct-lab"> List</span></button><button type="button" data-t="next" aria-label="Next">Next ▶</button></div></div>`);
    const status = () => ($("[data-status]").textContent = right ? "✓ Solved" : hint ? `Hint ${hint} of 3` : tries ? `Attempts: ${tries}` : `${LV[p.lvl][0]} ${set}${i + 1}`);
    const pulse = (t, on = true) => {
      document.querySelectorAll("[data-tools] [data-pulse]").forEach((b) => b.removeAttribute("data-pulse"));
      if (on) $(`[data-t="${t}"]`)?.setAttribute("data-pulse", "");
    };
    const showProblem = () => {
      showing = "problem";
      drawProblem(p, tag);
      $('[data-t="sol"]').innerHTML = `📖<span class="ct-lab"> Solution</span>`;
    };
    const showSol = async () => {
      showing = "sol";
      $('[data-t="sol"]').innerHTML = `🧩<span class="ct-lab"> Problem</span>`;
      const groups = drawSolution(p);
      say(`<b>Key idea: ${p.idea}.</b> ${right ? "" : `The answer is <b>${answerText(p)}</b>. `}Study each step, then explain the idea aloud in your own words.`, { voice: false });
      VOICE.speak(`Key idea: ${p.idea}. ${p.sol.join(" ")}`);
      await revealSteps(groups, () => alive() && showing === "sol");
    };
    let pad = null;
    const answer = async (v, button) => {
      if (!alive() || right) return;
      window.OC?.touch();
      tries += 1;
      tried.add(p.id);
      const ok = String(v) === String(p.ans);
      if (ok) {
        right = true;
        button?.classList.add("right");
        MUSIC.chime();
        const first = !solved.has(p.id);
        solved.add(p.id);
        save();
        if (first) window.OC?.count("contest problems solved");
        if (showing !== "problem") showProblem();
        const at = p.opts ? p.opts.findIndex((o) => String(o) === String(p.ans)) : -1;
        if (at >= 0) view.querySelector(`.ct-opt-${at}`)?.setAttribute("fill", "#22a05a");
        say(`${pick(CORRECT)} The answer is ${answerText(p)}. Open the solution to compare your method with the key idea: <b>${p.idea}</b>.`);
        pulse("sol");
        const lvDone = list().filter((q) => q.lvl === p.lvl).every((q) => solved.has(q.id));
        if (first && (lvDone || countSolved() === 12)) {
          confetti();
          await wait(1500);
          if (alive()) say(countSolved() === 12 ? "All twelve problems in this set are solved. That persistence through the hardest problems is what contest preparation is made of." : `Every ${LV[p.lvl][1]} problem in this set is solved.`);
        }
      } else {
        button?.classList.add("wrong");
        MUSIC.oops();
        pad?.clear();
        if (tries === 1) {
          say(`${pick(NOTQUITE)} Try again, or press 💡 for a guiding question.`);
          pulse("hint");
        } else {
          say("Not quite. After two honest attempts, studying the solution is the right move: press 📖. Or attempt it once more.");
          pulse("sol");
        }
      }
      status();
    };
    const setupAnswer = () => {
      const host = $("[data-answer]");
      if (p.opts)
        choices(
          host,
          p.opts.map((o, k) => ({ label: optLabel(p, k), v: o })),
          (c, b) => answer(c.v, b)
        );
      else pad = numpad(host, { onEnter: (v) => answer(v), max: 4 });
    };
    $("[data-tools]").addEventListener("click", (event) => {
      const b = event.target.closest("[data-t]");
      if (!b || !alive()) return;
      window.OC?.touch();
      const t = b.dataset.t;
      if (t === "read") {
        VOICE.speak(`${p.q} ${p.opts ? p.opts.map((o, k) => `${LETTERS[k]}: ${o}.`).join(" ") : ""}`);
      } else if (t === "hint") {
        if (!tries && !right) return say("Make an attempt first. A reasoned answer is valuable even when it is wrong, and the hint will mean more afterwards.");
        if (hint >= 3) return say(`💡 That was the final hint: ${p.hints[2]} ${tries >= 2 ? "The solution is also available." : ""}`);
        hint += 1;
        pulse("", false);
        say(`💡 ${p.hints[hint - 1]}`);
        status();
      } else if (t === "sol") {
        if (showing === "sol") {
          showProblem();
          say("The problem again.", { voice: false });
          return;
        }
        if (!right && tries < 2) return say(tries ? "Attempt it once more first. Productive struggle (working on a problem you cannot yet solve) is how mathematical skill grows." : "Attempt the problem first. The solution opens after two attempts.");
        pulse("", false);
        showSol();
      } else if (t === "list") {
        VOICE.hush();
        showList();
      } else if (t === "next") {
        VOICE.hush();
        const nextUp = () => (i + 1 < 12 ? open(i + 1) : showList("That was the last problem in this set. Choose any problem to revisit, or switch sets."));
        if (right && !explained && countSolved() >= 4) {
          explained = true;
          explainCard(R.name).then(() => alive() && nextUp());
          return;
        }
        nextUp();
      }
    });
    showProblem();
    setupAnswer();
    status();
    say(`Read the problem carefully. ${p.opts ? "Choose A, B, C, D or E." : "Enter your answer and press ✓."}`, { voice: false });
    VOICE.speak(`${p.q} ${p.opts ? p.opts.map((o, k) => `${LETTERS[k]}: ${o}.`).join(" ") : "Enter your answer."}`);
  };
  showList();
}

// ---------- monthly mock contest ----------
function seeded(seed) {
  let s = seed >>> 0 || 1;
  return () => {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}
function mockSet(date = new Date()) {
  const seed = date.getFullYear() * 12 + date.getMonth();
  const rnd = seeded(seed * 7919);
  const solvedAll = new Set(ROOM_IDS.flatMap((rid) => shell.progress()[rid]?.solved || []));
  const list = [];
  for (let lv = 0; lv < 3; lv++) {
    const skip = (seed + lv * 2) % 5;
    ROOM_IDS.forEach((rid, r) => {
      if (r === skip) return;
      const pool = ROOMS[rid].problems.filter((p) => p.lvl === lv);
      const unseen = pool.filter((p) => !solvedAll.has(p.id));
      const from = unseen.length ? unseen : pool;
      list.push({ rid, p: from[Math.floor(rnd() * from.length)] });
    });
  }
  return { seed, list };
}

function mock() {
  const my = token;
  const alive = () => my === token;
  const saved = shell.progress().ct6 || {};
  let timerOn = Boolean(saved.timer);
  const month = new Date().toLocaleString("en", { month: "long", year: "numeric" });
  let set = null;
  let answers = [];
  let at = 0;
  let endAt = 0;
  let ticking = null;
  const stopTimer = () => {
    if (ticking) clearInterval(ticking);
    ticking = null;
  };
  const minsLeft = () => Math.max(0, Math.ceil((endAt - Date.now()) / 60000));

  const intro = () => {
    stopTimer();
    fresh();
    el("rect", { x: 60, y: 30, width: 880, height: 500, rx: 30, fill: "#fffaf2", stroke: "var(--accent)", "stroke-width": 4 }, view);
    emoji(view, 500, 100, "🏅", 80);
    text(view, 500, 200, `Mock contest · ${month}`, { "font-size": 40, fill: "#2b1d12" });
    const rows = ["12 problems: 4 at grade 4, 4 at grade 5–6, 4 at contest level", "Answer each one, or skip and return to it later", "No hints during the contest, as in a real one", "Afterwards: the topics to revisit, and every solution"];
    rows.forEach((r, i) => text(view, 500, 270 + i * 52, `• ${r}`, { "font-size": 26, fill: "#4d3c2e", "font-weight": 700 }));
    panel(`<div class="ap-chips" data-mk><button type="button" data-m="start" aria-pressed="true">▶ Begin</button><button type="button" data-m="timer" aria-pressed="${timerOn}">⏳ Grown-up timer (30 min): ${timerOn ? "On" : "Off"}</button></div>`);
    say(`This month's practice contest. Work carefully; it is not a race. ${timerOn ? "A gentle 30-minute timer is on; it never affects the results." : ""}`);
    $("[data-mk]").addEventListener("click", (event) => {
      const b = event.target.closest("[data-m]");
      if (!b || !alive()) return;
      window.OC?.touch();
      if (b.dataset.m === "timer") {
        timerOn = !timerOn;
        shell.mark("ct6", { timer: timerOn });
        b.setAttribute("aria-pressed", String(timerOn));
        b.textContent = `⏳ Grown-up timer (30 min): ${timerOn ? "On" : "Off"}`;
        say(timerOn ? "The timer is on. It only shows the minutes remaining and never changes the results." : "The timer is off. Take the time you need.");
      } else begin();
    });
  };

  const begin = () => {
    set = mockSet();
    window.__CT.mockNow = set;
    answers = Array(set.list.length).fill(null);
    at = 0;
    if (timerOn) {
      endAt = Date.now() + 30 * 60000;
      ticking = setInterval(() => {
        if (!alive()) return stopTimer();
        const s = $("[data-clock]");
        if (s) s.textContent = `⏳ ${minsLeft()} min`;
        if (Date.now() >= endAt) {
          stopTimer();
          if (s) s.textContent = "⏳ Time";
          say("The 30 minutes are over. Finish the problem in front of you, then press 🏁 Finish.");
        }
      }, 5000);
    }
    show();
  };

  const show = () => {
    if (!alive()) return;
    const { rid, p } = set.list[at];
    drawProblem(p, `Mock contest · ${at + 1} of 12 · ${LV[p.lvl][0]} ${LV[p.lvl][2]} · ${ROOMS[rid].name}`);
    panel(`<div class="ap-row ct-ans" data-answer></div><div class="ap-row"><p class="ap-status" data-status>${at + 1} of 12${answers[at] !== null ? " · answered" : ""}</p>${timerOn ? `<p class="ap-status" data-clock>⏳ ${ticking ? `${minsLeft()} min` : "Time"}</p>` : ""}<div class="ap-chips ct-tools" data-tools><button type="button" data-t="read" aria-label="Read it to me">🔊</button><button type="button" data-t="back" aria-label="Previous">◀</button><button type="button" data-t="skip">Skip ▶</button><button type="button" data-t="finish">🏁 Finish</button></div></div>`);
    const host = $("[data-answer]");
    const record = (v, button) => {
      if (!alive()) return;
      window.OC?.touch();
      answers[at] = v;
      MUSIC.play("woodblock", 79, { gain: 0.3 });
      button?.classList.add("right");
      if (at + 1 < 12) {
        at += 1;
        setTimeout(() => alive() && show(), 450);
      } else say("That was the final problem. Press 🏁 Finish when ready, or ◀ to review your answers.");
    };
    if (p.opts) choices(host, p.opts.map((o, k) => ({ label: optLabel(p, k), v: o })), (c, b) => record(c.v, b));
    else {
      const pad = numpad(host, { onEnter: (v) => record(v), max: 4 });
      if (answers[at] !== null) pad.set(answers[at]);
    }
    if (p.opts && answers[at] !== null) host.querySelectorAll("[data-c]")[p.opts.indexOf(answers[at])]?.classList.add("right");
    $("[data-tools]").addEventListener("click", (event) => {
      const b = event.target.closest("[data-t]");
      if (!b || !alive()) return;
      window.OC?.touch();
      const t = b.dataset.t;
      if (t === "read") VOICE.speak(`${p.q} ${p.opts ? p.opts.map((o, k) => `${LETTERS[k]}: ${o}.`).join(" ") : ""}`);
      else if (t === "back" && at > 0) {
        at -= 1;
        show();
      } else if (t === "skip") {
        if (at + 1 < 12) {
          at += 1;
          show();
        } else say("This is the final problem. Press 🏁 Finish when ready.");
      } else if (t === "finish") {
        const left = answers.filter((a) => a === null).length;
        if (left && !b.dataset.sure) {
          b.dataset.sure = "1";
          b.textContent = "🏁 Confirm";
          return say(`${left} ${left === 1 ? "problem has" : "problems have"} no answer. Press 🏁 again to finish anyway.`);
        }
        results();
      }
    });
    say(`Problem ${at + 1}. ${p.opts ? "Choose A to E." : "Enter the answer and press ✓."}`, { voice: false });
    VOICE.speak(`Problem ${at + 1}. ${p.q} ${p.opts ? p.opts.map((o, k) => `${LETTERS[k]}: ${o}.`).join(" ") : ""}`);
  };

  const results = () => {
    stopTimer();
    if (!alive()) return;
    const ok = set.list.map(({ p }, i) => answers[i] !== null && String(answers[i]) === String(p.ans));
    const total = ok.filter(Boolean).length;
    const byRoom = ROOM_IDS.map((rid) => {
      const idx = set.list.map((x, i) => (x.rid === rid ? i : -1)).filter((i) => i >= 0);
      return { rid, n: idx.length, right: idx.filter((i) => ok[i]).length };
    });
    const revisit = byRoom.filter((r) => r.n && r.right < r.n);
    shell.mark("ct6", { done: true, [`m${set.seed}`]: total });
    window.OC?.count("mock contests finished");
    fresh();
    el("rect", { x: 40, y: 20, width: 920, height: 520, rx: 28, fill: "#fffaf2", stroke: "var(--accent)", "stroke-width": 4 }, view);
    text(view, 500, 72, `Mock contest · ${month}`, { "font-size": 34, fill: "#2b1d12" });
    text(view, 500, 112, total ? `${total} of 12 correct. Where to concentrate next:` : "Where to concentrate next:", { "font-size": 25, fill: "#4d3c2e", "font-weight": 700 });
    byRoom.forEach((r, k) => {
      const y = 150 + k * 62;
      const good = r.right === r.n;
      el("rect", { x: 90, y, width: 820, height: 52, rx: 16, fill: good ? "#e3f4e7" : "#fff4dc" }, view);
      text(view, 116, y + 35, ROOMS[r.rid].name, { "text-anchor": "start", "font-size": 26, fill: "#2b1d12" });
      for (let d = 0; d < r.n; d++) el("circle", { cx: 560 + d * 36, cy: y + 26, r: 13, fill: d < r.right ? "#22a05a" : "#fff", stroke: d < r.right ? "#157a40" : "#c9b8a1", "stroke-width": 3 }, view);
      text(view, 880, y + 35, good ? "✓ secure" : "↻ revisit", { "text-anchor": "end", "font-size": 24, fill: good ? "#2e7d46" : "#a8632d" });
    });
    const first = [...revisit].sort((a, b) => a.right / a.n - b.right / b.n).slice(0, 2).map((r) => ROOMS[r.rid].name);
    text(view, 500, 500, revisit.length ? `Begin with the ${first.join(" and the ")} room${first.length > 1 ? "s" : ""}.` : "Every topic was secure. Try Set B in each room.", { "font-size": 26, fill: "var(--accent-dark)" });
    if (total >= 6) confetti();
    panel(`<div class="ap-chips" data-rs><button type="button" data-r="review" aria-pressed="true">📖 Review solutions</button><button type="button" data-r="again">↺ Back to start</button></div>`);
    say("The contest is complete. The review is where most of the learning happens: compare your reasoning with each worked solution.");
    $("[data-rs]").addEventListener("click", (event) => {
      const b = event.target.closest("[data-r]");
      if (!b || !alive()) return;
      if (b.dataset.r === "review") review(0);
      else intro();
    });
  };

  const review = (i) => {
    if (!alive()) return;
    const { p } = set.list[i];
    const yours = answers[i] === null ? "no answer" : p.opts ? `(${letterOf(p, answers[i])}) ${answers[i]}` : answers[i];
    const good = String(answers[i]) === String(p.ans);
    let showing = "sol";
    const groups = drawSolution(p, `Your answer: ${yours} · correct answer: ${answerText(p)}${good ? " ✓" : ""}`);
    revealSteps(groups, () => alive() && showing === "sol");
    panel(`<div class="ap-row"><p class="ap-status">Review ${i + 1} of 12</p><div class="ap-chips ct-tools" data-rv><button type="button" data-v="prev" aria-label="Previous">◀</button><button type="button" data-v="flip">🧩 Problem</button><button type="button" data-v="next">${i + 1 < 12 ? "Next ▶" : "✓ Done"}</button></div></div>`);
    say(`${good ? "Correct." : `Not quite: the answer is <b>${answerText(p)}</b>.`} Key idea: <b>${p.idea}</b>.`, { voice: false });
    VOICE.speak(`${good ? "Correct." : `The answer is ${p.ans}.`} Key idea: ${p.idea}. ${p.sol.join(" ")}`);
    $("[data-rv]").addEventListener("click", (event) => {
      const b = event.target.closest("[data-v]");
      if (!b || !alive()) return;
      VOICE.hush();
      if (b.dataset.v === "prev" && i > 0) review(i - 1);
      else if (b.dataset.v === "next") {
        if (i + 1 < 12) review(i + 1);
        else
          realCard({
            icon: "🗣️",
            title: "Explain it",
            need: ["your Solution Notebook", "a pencil"],
            steps: ["Choose one problem you missed.", "Write its key idea at the top of a page and solve it again without looking.", "Then explain your solution aloud to a grown-up in 2–4 full sentences: the strategy, why it works, and how you checked."],
            note: "Next month, notice whether that topic feels more secure.",
          }).then(() => alive() && intro());
      } else if (b.dataset.v === "flip") {
        if (showing === "sol") {
          showing = "problem";
          drawProblem(p, `Review ${i + 1} of 12`);
          b.textContent = "📖 Solution";
        } else review(i);
      }
    });
  };
  intro();
  return stopTimer;
}

          const m = 88;
          el("rect", { x: 380, y: y0 - 5 * m, width: 200, height: 5 * m, fill: "#d6ecf7", stroke: INK, "stroke-width": 4 }, v);
          for (let k = 0; k <= 5; k++) {
            el("line", { x1: 580, x2: 605, y1: y0 - k * m, y2: y0 - k * m, stroke: INK, "stroke-width": 3 }, v);
            text(v, 650, y0 - k * m + 9, `${k} m`, { "font-size": 26, fill: "#4d3c2e" });
          }
          const snail = el("g", {}, v);
          emoji(snail, 0, 0, "🐌", 50);
          let h = 0;
          const put = (val) => snail.setAttribute("transform", `translate(480 ${y0 - val * m - 28})`);
          put(0);
          for (let day = 1; day <= 4; day++) {
            await api.tween(1100, (t) => put(h + 2 * t));
            h += 2;
            MUSIC.play("xylophone", 72 + day * 2, { gain: 0.35 });
            if (h >= 5) {
              text(v, 200, 100 + (day - 1) * 70, `Day ${day}: escapes`, { "font-size": 30, fill: "#2e7d46" });
              break;
            }
            await api.wait(300);
            await api.tween(800, (t) => put(h - t));
            h -= 1;
            text(v, 200, 100 + (day - 1) * 70, `Day ${day}: ${h + 1} m, then ${h} m`, { "font-size": 26, fill: "#4d3c2e" });
            await api.wait(400);
          }
        },
      },
      {
        say: "Phase 4, look back: did we answer the question asked, and is the answer reasonable? The tempting answer of 5 days ignores that the snail escapes before it can slide back.",
        async draw(v, api) {
          const rows = [["Did we answer the question asked?", "Day 4 ✓"], ["Is it reasonable?", "3 m + 2 m = 5 m ✓"], ["What was the trap?", "5 m ÷ 1 m per day = 5 days ✗"]];
          for (let i = 0; i < rows.length; i++) {
            const g = el("g", { opacity: 0 }, v);
            el("rect", { x: 100, y: 70 + i * 150, width: 800, height: 120, rx: 24, fill: i === 2 ? "#fff4dc" : "#e3f4e7" }, g);
            text(g, 140, 125 + i * 150, rows[i][0], { "text-anchor": "start", "font-size": 32, fill: "#2b1d12" });
            text(g, 140, 168 + i * 150, rows[i][1], { "text-anchor": "start", "font-size": 28, fill: i === 2 ? "#a8632d" : "#2e7d46" });
            await api.tween(600, (t) => g.setAttribute("opacity", t));
            await api.wait(1200);
          }
        },
      },
      {
        say: "In each room: five choices, A to E, or a number to enter. Hints appear only after an attempt. Then study the worked solution and explain its key idea in your own words, aloud or in your Solution Notebook.",
        async draw(v, api) {
          const items = [["🅰️", "Choose A to E"], ["💡", "3 hints, after an attempt"], ["📖", "Worked solution"], ["🗣️", "Explain it"]];
          for (let i = 0; i < items.length; i++) {
            const g = el("g", { opacity: 0 }, v);
            const x = 70 + i * 225;
            el("rect", { x, y: 140, width: 205, height: 260, rx: 26, fill: "#fff", stroke: "var(--accent)", "stroke-width": 4 }, g);
            el("circle", { cx: x + 102, cy: 240, r: 66, fill: "var(--accent-soft)" }, g);
            emoji(g, x + 102, 238, items[i][0], 74);
            para(g, x + 102, 350, items[i][1], { size: 24, width: 190, anchor: "middle" });
            await api.tween(500, (t) => g.setAttribute("opacity", t));
            await api.wait(500);
          }
        },
      },
    ],
    { alive: () => my === token, onDone: () => shell.go("ct1"), title: "Contest Room", doneLabel: "▶ Begin" }
  );
}

let stopMock = null;
const units = {
  ct0: seeIt,
  ct1: () => room("ct1"),
  ct2: () => room("ct2"),
  ct3: () => room("ct3"),
  ct4: () => room("ct4"),
  ct5: () => room("ct5"),
  ct6: () => (stopMock = mock()),
};

const roomHow = (icon, title) => ({ icon, title, steps: ["Choose a problem. Set B gives twelve new ones each time.", "Answer it. After an attempt, 💡 offers a guiding question.", "Study 📖 the solution, then explain its key idea in your own words."] });
const shell = SHELL({
  units: UNITS,
  how: {
    ct0: { icon: "👀", title: "See it", steps: ["Watch and listen to each scene.", "Press Next ▶ to continue.", "Press Begin when you are ready."] },
    ct1: roomHow("🔢", "Number sense room"),
    ct2: roomHow("🧠", "Logic & patterns room"),
    ct3: roomHow("📐", "Geometry & shapes room"),
    ct4: roomHow("🎲", "Counting room"),
    ct5: roomHow("📖", "Word problems room"),
    ct6: { icon: "🏅", title: "Monthly mock contest", steps: ["Answer twelve problems; skip one and return if needed.", "There are no hints during the contest, and it is not a race.", "Afterwards, see which topics to revisit and study every solution."] },
  },
  start: "ct0",
  onStop() {
    token += 1;
    stopMock?.();
    stopMock = null;
    stage.querySelector(".ct-real")?.remove();
    $("[data-panel]").onclick = null;
  },
  subject: "Math",
  activity: "Contest Room",
  onUnit(id) {
    token += 1;
    VOICE.hush();
    units[id]();
  },
});
MUSIC.preload("xylophone", [72, 74, 76, 78, 79, 80, 84]);
MUSIC.preload("woodblock", [79]);
</script>
