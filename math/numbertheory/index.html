<script>const { $, el, svg: makeSvg, text, panel, say, pick, pickInt, wait, confetti, PRAISE, KIND, choices, explain, everyday, emoji, numpad, shuffle } = KIT;

// ---------- number facts (every answer in the app is computed from these) ----------
const isPrime = (n) => {
  if (n < 2) return false;
  for (let d = 2; d * d <= n; d++) if (n % d === 0) return false;
  return true;
};
const factorsOf = (n) => {
  const out = [];
  for (let d = 1; d <= n; d++) if (n % d === 0) out.push(d);
  return out;
};
const pairsOf = (n) => {
  const out = [];
  for (let a = 1; a * a <= n; a++) if (n % a === 0) out.push([a, n / a]);
  return out;
};
const pfList = (n) => {
  const out = [];
  let m = n;
  for (let d = 2; d * d <= m; d++) while (m % d === 0) {
    out.push(d);
    m /= d;
  }
  if (m > 1) out.push(m);
  return out;
};
const pfCount = (n) => {
  const c = new Map();
  for (const p of pfList(n)) c.set(p, (c.get(p) || 0) + 1);
  return c;
};
const SUP = "⁰¹²³⁴⁵⁶⁷⁸⁹";
const sup = (k) => String(k).split("").map((c) => SUP[Number(c)]).join("");
const expoOf = (map) => [...map].sort((a, b) => a[0] - b[0]).map(([p, k]) => (k > 1 ? `${p}${sup(k)}` : `${p}`)).join(" × ");
const expo = (n) => expoOf(pfCount(n));
const gcd = (a, b) => (b ? gcd(b, a % b) : a);
const lcm = (a, b) => (a / gcd(a, b)) * b;
const digitSum = (n) => String(n).split("").reduce((s, d) => s + Number(d), 0);
const smallestFactor = (n) => {
  for (let d = 2; d * d <= n; d++) if (n % d === 0) return d;
  return n;
};
const DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const clockTime = (h, m) => `${h}:${String(m).padStart(2, "0")}`;

// ---------- speech: superscripts read as "squared", "cubed", "to the power" ----------
const spoken = (html) =>
  String(html)
    .replace(/(\d)([⁰¹²³⁴⁵⁶⁷⁸⁹]+)/g, (_, b, s) => {
      const k = [...s].map((c) => SUP.indexOf(c)).join("");
      return `${b} ${k === "2" ? "squared" : k === "3" ? "cubed" : `to the power ${k}`}`;
    })
    .replace(/√/g, "the square root of ")
    .replace(/☐/g, " box ")
    .replace(/\bGCF\b/g, "G C F")
    .replace(/\bLCM\b/g, "L C M")
    .replace(/\bR (\d)/g, "remainder $1");
function talk(html, voiceText) {
  say(html, { voice: false });
  VOICE.speak(spoken(voiceText ?? html));
}

// ---------- drawing helpers ----------
const INK = "#2b1d12";
const SOFT = "#6b5642";
const GREEN = "#2e9b50";
const GOLD = "#f2a93b";
const RAINBOW = ["#e53935", "#fb8c00", "#f2b705", "#43a047", "#1e88e5", "#5e35b1", "#8e24aa", "#ec407a", "#00897b", "#6d4c41"];
const RIGHT = { x: 572, y: 16, w: 412, h: 528 };
const BOTTOM = { x: 24, y: 330, w: 952, h: 216 };
const LOW = { x: 24, y: 372, w: 952, h: 174 };
const STOP = Symbol("stop");
const anim = (alive) => ({
  alive,
  wait: (ms) => new Promise((res, rej) => setTimeout(() => (alive() ? res() : rej(STOP)), KIT.still.matches ? Math.min(ms, 150) : ms)),
  tween: (ms, fn) =>
    new Promise((res, rej) => {
      if (KIT.still.matches) {
        fn(1);
        return res();
      }
      const t0 = performance.now();
      const frame = (now) => {
        if (!alive()) return rej(STOP);
        const t = Math.min(1, (now - t0) / ms);
        fn(t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
        if (t < 1) requestAnimationFrame(frame);
        else res();
      };
      requestAnimationFrame(frame);
    }),
});
const quiet = (p) => Promise.resolve(p).catch((e) => (e === STOP ? null : console.error(e)));
const lerp = (a, b, t) => a + (b - a) * t;

function tag(parent, x, y, n, { r = 44, fill = "var(--accent)", color = "#fff", stroke = "#fff" } = {}) {
  const g = el("g", { transform: `translate(${x} ${y})` }, parent);
  el("circle", { r, fill, stroke, "stroke-width": 4 }, g);
  const len = String(n).length;
  const size = Math.max(22, r * (len <= 2 ? 0.95 : len === 3 ? 0.72 : len === 4 ? 0.56 : 0.46));
  text(g, 0, size * 0.36, n, { "font-size": size, fill: color });
  return g;
}
function wrap(line, per) {
  const words = String(line).split(" ");
  const rows = [];
  for (const w of words) {
    const last = rows[rows.length - 1];
    if (last !== undefined && (last + " " + w).length <= per) rows[rows.length - 1] = last + " " + w;
    else rows.push(w);
  }
  return rows;
}
// The notes card: "📁 The case" before solving, "🔎 How we know" after.
function notes(lines, { title = "🔎 How we know", region = RIGHT, tone = "work" } = {}) {
  view.querySelector(".nt-notes")?.remove();
  const g = el("g", { class: "nt-notes" }, view);
  let font = 26;
  const fit = () => {
    const per = Math.floor((region.w - 40) / (font * 0.54));
    return lines.flatMap((l) => wrap(l, per));
  };
  let rows = fit();
  while (60 + rows.length * font * 1.38 > region.h && font > 22) {
    font -= 1;
    rows = fit();
  }
  const lh = font * 1.38;
  const h = Math.min(region.h, 62 + rows.length * lh);
  const work = tone === "work";
  el("rect", { x: region.x, y: region.y, width: region.w, height: h, rx: 24, fill: work ? "#f1faf3" : "#fff8ea", stroke: work ? "#8fcf9f" : "#e0b872", "stroke-width": 3 }, g);
  text(g, region.x + 20, region.y + 38, title, { "font-size": 26, fill: work ? "#23733b" : "#8a5a12", "text-anchor": "start", "font-weight": 900 });
  rows.forEach((r, i) => text(g, region.x + 20, region.y + 40 + (i + 1) * lh, r, { "font-size": font, fill: INK, "text-anchor": "start", "font-weight": 700 }));
  return g;
}
const caseNotes = (lines, region = RIGHT) => notes(lines, { title: "📁 The case", region, tone: "case" });

// Squares or counters that can glide into new rectangles.
function counters(parent, n, { shape = "square", fill = "#f2a93b" } = {}) {
  const items = [];
  for (let i = 0; i < n; i++) {
    const node = shape === "dot" ? el("circle", { r: 10, fill, stroke: "#fff", "stroke-width": 2 }, parent) : el("rect", { width: 10, height: 10, rx: 5, fill, stroke: "#fff", "stroke-width": 2 }, parent);
    items.push({ node, x: 0, y: 0, s: 10 });
  }
  const layout = (rows, cols, box) => {
    const s = Math.min(46, box.w / cols, box.h / rows);
    const x0 = box.x + (box.w - s * cols) / 2;
    const y0 = box.y + (box.h - s * rows) / 2;
    return items.map((_, i) => ({ x: x0 + (i % cols) * s, y: y0 + Math.floor(i / cols) * s, s }));
  };
  const put = (targets, t = 1, from = null) => {
    items.forEach((it, i) => {
      const a = from ? from[i] : targets[i];
      const b = targets[i];
      const x = lerp(a.x, b.x, t);
      const y = lerp(a.y, b.y, t);
      const s = lerp(a.s, b.s, t);
      it.x = x;
      it.y = y;
      it.s = s;
      if (shape === "dot") {
        it.node.setAttribute("cx", x + s / 2);
        it.node.setAttribute("cy", y + s / 2);
        it.node.setAttribute("r", s * 0.4);
      } else {
        it.node.setAttribute("x", x + 2);
        it.node.setAttribute("y", y + 2);
        it.node.setAttribute("width", Math.max(2, s - 4));
        it.node.setAttribute("height", Math.max(2, s - 4));
        it.node.setAttribute("rx", Math.min(8, s / 4));
      }
    });
  };
  return {
    items,
    layout,
    put,
    async move(api, targets, ms = 1100) {
      const from = items.map((it) => ({ x: it.x, y: it.y, s: it.s }));
      await api.tween(ms, (t) => put(targets, t, from));
    },
  };
}

function drawArray(parent, rows, cols, box, { fill = "#f2a93b", hideFrom = Infinity } = {}) {
  const s = Math.min(46, box.w / cols, box.h / rows);
  const x0 = box.x + (box.w - s * cols) / 2;
  const y0 = box.y + (box.h - s * rows) / 2;
  const g = el("g", {}, parent);
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++) el("rect", { x: x0 + c * s + 2, y: y0 + r * s + 2, width: s - 4, height: s - 4, rx: Math.min(8, s / 4), fill: c >= hideFrom ? "#ece3d3" : fill, class: c >= hideFrom ? "nt-hid" : null }, g);
  return { g, s, x0, y0, w: s * cols, h: s * rows };
}

// Factor rainbow: factors in a row, an arc joins each pair that multiplies to n.
async function rainbow(parent, n, api, { y = 300, left = 40, right = 960 } = {}) {
  const f = factorsOf(n);
  const k = f.length;
  const step = Math.min(92, (right - left) / k);
  const x0 = (left + right) / 2 - (step * k) / 2 + step / 2;
  const xs = f.map((_, i) => x0 + i * step);
  const tiles = f.map((v, i) => {
    const g = el("g", { opacity: 0 }, parent);
    el("rect", { x: xs[i] - step / 2 + 4, y, width: step - 8, height: 54, rx: 12, fill: "#fff", stroke: "#c9b8a1", "stroke-width": 3 }, g);
    text(g, xs[i], y + 37, v, { "font-size": String(v).length > 2 ? 22 : 26, fill: INK });
    return g;
  });
  for (const t of tiles) {
    t.setAttribute("opacity", 1);
    await api.wait(90);
  }
  for (let i = 0; i < Math.ceil(k / 2); i++) {
    const j = k - 1 - i;
    const color = RAINBOW[i % RAINBOW.length];
    if (i === j) {
      const ring = el("circle", { cx: xs[i], cy: y - 30, r: 24, fill: "none", stroke: color, "stroke-width": 6, opacity: 0 }, parent);
      const lab = text(parent, xs[i], y - 66, "pairs with itself", { "font-size": 22, fill: color, opacity: 0 });
      await api.tween(700, (t) => {
        ring.setAttribute("opacity", t);
        lab.setAttribute("opacity", t);
      });
    } else {
      const rx = (xs[j] - xs[i]) / 2;
      const ry = Math.min(y - 70, 26 + rx * 0.5);
      const path = el("path", { d: `M${xs[i]} ${y - 4}A${rx} ${ry} 0 0 1 ${xs[j]} ${y - 4}`, fill: "none", stroke: color, "stroke-width": 7, "stroke-linecap": "round" }, parent);
      const len = path.getTotalLength();
      path.setAttribute("stroke-dasharray", len);
      path.setAttribute("stroke-dashoffset", len);
      await api.tween(650, (t) => path.setAttribute("stroke-dashoffset", len * (1 - t)));
      MUSIC.play("xylophone", 72 + ((i * 2) % 14), { gain: 0.3 });
    }
  }
  return xs;
}

// Venn diagram of prime factors: shared primes in the middle.
function vennSplit(a, b) {
  const ca = pfCount(a);
  const cb = pfCount(b);
  const left = [];
  const mid = [];
  const right = [];
  for (const p of new Set([...ca.keys(), ...cb.keys()])) {
    const x = ca.get(p) || 0;
    const y = cb.get(p) || 0;
    for (let i = 0; i < Math.min(x, y); i++) mid.push(p);
    for (let i = 0; i < x - Math.min(x, y); i++) left.push(p);
    for (let i = 0; i < y - Math.min(x, y); i++) right.push(p);
  }
  return { left: left.sort((p, q) => p - q), mid: mid.sort((p, q) => p - q), right: right.sort((p, q) => p - q) };
}
async function venn(parent, a, b, api, { cx = 285, cy = 300 } = {}) {
  const { left, mid, right } = vennSplit(a, b);
  el("circle", { cx: cx - 95, cy, r: 175, fill: "#ffb74d", "fill-opacity": 0.22, stroke: "#e08a1e", "stroke-width": 4 }, parent);
  el("circle", { cx: cx + 95, cy, r: 175, fill: "#64b5f6", "fill-opacity": 0.22, stroke: "#1e78c8", "stroke-width": 4 }, parent);
  text(parent, cx - 150, cy - 185, `${a}`, { "font-size": 34, fill: "#b8650a" });
  text(parent, cx + 150, cy - 185, `${b}`, { "font-size": 34, fill: "#165fa0" });
  text(parent, cx, cy + 205, "shared", { "font-size": 22, fill: SOFT });
  const place = async (list, x, color) => {
    const n = list.length;
    const gap = Math.min(54, 290 / Math.max(1, n));
    for (let i = 0; i < n; i++) {
      const y = cy - ((n - 1) * gap) / 2 + i * gap;
      const g = tag(parent, x, y, list[i], { r: 25, fill: color });
      g.setAttribute("opacity", 0);
      await api.tween(350, (t) => g.setAttribute("opacity", t));
    }
  };
  await place(left, cx - 175, "#e08a1e");
  await place(right, cx + 175, "#1e78c8");
  await place(mid, cx, "#7b5ea7");
  return { left, mid, right };
}

const EFFORT = ["Correct — and here is why.", "Correct. Your method was sound.", "Correct — a careful, systematic approach.", "Correct. Notice the reasoning:"];
const NUDGE = ["Not quite. Consider:", "Not quite — mistakes are how we learn. Consider:", "Not yet. Consider:"];

// ---------- panel rows ----------
const LEVELS = [["easy", "🐣 Grade 4"], ["medium", "🦊 Grade 5–6"], ["hard", "🦁 Grade 7–8"]];
const topRow = (level, modes, mode) =>

function bindTop(id, onLevel, onMode) {

    const b = event.target.closest("[data-lv]");

}
const setStatus = (s) => {

  if (b) b.textContent = s;
};

// ---------- "🏠 Try it for real" ----------
const REAL = {
  t1: { title: "Try it for real: bean rectangles", need: ["20 dried beans or buttons", "Paper and a pencil"], steps: ["Count out 12 beans. Make every rectangle you can.", "Write each one down: 1 × 12, 2 × 6, 3 × 4.", "Now try 7, 11 and 15 beans.", "Only one rectangle, a single line? Then that number is prime. (1 bean is the exception: 1 is neither prime nor composite.)"], note: "Do this with a grown-up. Beans are not for mouths or noses." },
  t2: { title: "Try it for real: a factor rainbow poster", need: ["A big sheet of paper", "Crayons or felt pens"], steps: ["Write the factors of 36 in a row: 1, 2, 3, 4, 6, 9, 12, 18, 36.", "Draw an arc joining each pair that makes 36.", "Which factor has no partner? Why?", "Make one for 24 too and hang them up."], note: "Ask a grown-up where you may hang your poster." },
  t3: { title: "Try it for real: receipt detective", need: ["An old shopping receipt or a book", "A pencil"], steps: ["Find 5 big numbers on the receipt or page numbers in the book.", "Add up the digits of each number.", "Digit sum a multiple of 3? Then the number is too!", "Check with a grown-up's calculator."], note: "Use an old receipt, and ask a grown-up first." },
  t4: { title: "Try it for real: a sticky-note tree", need: ["Sticky notes", "A marker", "A window or a door"], steps: ["Write 48 on a note at the top.", "Split it, for example 6 × 8. Stick two notes below.", "Keep splitting until every note is prime. Circle the primes.", "Ask a grown-up to build a different tree for 48. Same primes?"], note: "Ask a grown-up where sticky notes are allowed." },
  t5: { title: "Try it for real: clap and stomp", need: ["You and a grown-up", "A little space"], steps: ["Count out loud from 1 to 24 together.", "You clap on every 3rd number. The grown-up stomps on every 4th.", "When do you both make a sound? That is a common multiple!", "Now try clapping every 2 and stomping every 5."], note: "Stomp gently and mind each other's toes." },
  t6: { title: "Try it for real: calendar detective", need: ["A paper calendar", "A pencil"], steps: ["Find today on the calendar.", "Predict the weekday 30 days from now: 30 = 4 × 7 + 2.", "Count on the calendar to check your guess.", "Circle every prime-numbered date this month!"], note: "Ask a grown-up which calendar you may write on." },
};
function realCard(id) {
  const t = REAL[id];
  stage.querySelector(".nt-real")?.remove();
  const box = document.createElement("div");
  box.className = "nt-real";
  box.innerHTML = `<div class="nt-real-card" role="dialog" aria-label="${t.title}"><div class="nt-real-head"><span aria-hidden="true">🏠</span><h2>${t.title}</h2></div><p class="nt-need"><b>You need:</b> ${t.need.join(" · ")}</p><ol>${t.steps.map((s) => `<li>${s}</li>`).join("")}</ol><p class="nt-tip">🤝 ${t.note}</p><button type="button" class="kt-go">✓ Got it!</button></div>`;
  stage.appendChild(box);
  VOICE.speak(spoken(`${t.title}. You need: ${t.need.join(", ")}. ${t.steps.join(" ")} ${t.note}`));
  box.querySelector(".kt-go").addEventListener("click", () => {
    VOICE.hush();
    box.remove();
    window.OC?.touch();

// ---------- the case engine: ask, two honest tries, then the worked solution ----------
// cfg: { make(level, round) -> q, count, noun, modes?, mode?, onMode?, R }
// q: { draw(), ask, voice?, opts? [{label, v}], max?, ans, ok?(v), hint(v), why, work [lines], region?, onMiss?(v, api), after?(api, won) }
function quiz(id, cfg) {
  const my = token;
  const R = cfg.R || 8;
  let level = shell.progress()[id]?.level || "easy";
  let round = 0;
  let first = 0;
  let tries = 0;
  let q = null;
  let busy = false;
  let pad = null;
  panel(`${topRow(level, cfg.modes, cfg.mode)}<div class="nt-in" data-in></div>`);
  const host = $("[data-in]");
  const status = () => setStatus(`${cfg.noun1 || "Case"} ${Math.min(round + 1, R)} of ${R}`);
  const isRight = (v) => (q.ok ? q.ok(v) : v === q.ans);
  const ask = () => {
    if (my !== token) return;
    tries = 0;
    busy = false;
    q = cfg.make(level, round);
    const qq = q;
    q.api = anim(() => my === token && q === qq);
    fresh();
    q.draw(q.api);
    status();
    host.onclick = null;
    host.classList.toggle("nt-pick", !!q.opts);
    if (q.opts) {
      pad = null;
      choices(host, q.opts, (o, b) => answer(o.v, b));
    } else pad = numpad(host, { onEnter: (v) => answer(v), max: q.max || 4 });
    talk(q.ask, q.voice);
  };
  const settle = async (won) => {
    busy = true;
    const qq = q;
    host.querySelectorAll("button").forEach((b) => (b.disabled = true));
    talk(won ? `${tries ? "Correct — your persistence paid off. Here is why:" : pick(EFFORT)} ${q.why}` : `Let us look at the reasoning. ${q.why}`);
    if (q.work) notes(q.work, { region: q.region || RIGHT });
    await quiet(q.after?.(q.api, won));
    if (my !== token || q !== qq) return;
    host.classList.remove("nt-pick");
    host.innerHTML = `<div class="ap-buttons"><button type="button" class="primary" data-next>${round + 1 >= R ? "Finish ▶" : "Next ▶"}</button></div>`;
    host.onclick = (event) => {
      if (!event.target.closest("[data-next]")) return;
      window.OC?.touch();
      round += 1;
      if (round >= R) finishGame(id, host, { R, first, noun: cfg.noun, again: restart });
      else ask();
    };
  };
  const answer = (v, button) => {
    if (my !== token || busy) return;
    window.OC?.touch();
    if (isRight(v)) {
      button?.classList.add("right");
      MUSIC.chime();
      if (tries === 0) first += 1;
      window.OC?.count(cfg.count);
      return settle(true);
    }
    tries += 1;
    button?.classList.add("wrong");
    MUSIC.oops();
    if (tries < 2) {
      pad?.clear();
      quiet(q.onMiss?.(v, q.api));
      talk(`${pick(NUDGE)} ${q.hint(v)}`);
      return;
    }
    if (q.opts) {
      const i = q.opts.findIndex((o) => isRight(o.v));
      host.querySelectorAll("[data-c]")[i]?.classList.add("right");
    } else pad?.set(q.ans);
    settle(false);
  };
  const restart = () => {
    round = 0;
    first = 0;
    ask();
  };
  bindTop(id, (lv) => {
    level = lv;
    restart();
  }, cfg.onMode);
  ask();
}

// Options helper: correct value plus distinct wrong values, sorted.
const optsOf = (ans, wrongs, fmt = (v) => String(v)) => {
  const set = [ans];
  for (const w of wrongs) if (!set.includes(w) && set.length < 4) set.push(w);
  return set.sort((a, b) => (typeof a === "number" ? a - b : 0)).map((v) => ({ label: fmt(v), v }));
};
const bagOf = () => {
  const bags = {};
  return (key, list) => {
    if (!bags[key]?.length) bags[key] = shuffle(list);
    return bags[key].pop();
  };
};

const PMODES = [["sieve", "🧹 Sieve"], ["test", "❓ Prime?"]];
const switchPrimeMode = (m) => {
  shell.mark("t1", { mode: m });
  token += 1;
  VOICE.hush();
  units.t1();
};
const TEST_PRIMES = [2, 3, 5, 7, 11, 13, 17, 19, 23];

function primeCase(level, round) {
  if (level === "hard" && round === 2) return oneCase();
  if ((level === "medium" && round === 3) || (level === "hard" && (round === 3 || round === 4))) return whichPrimeCase(level);
  if ((level === "medium" && round >= 6) || (level === "hard" && round >= 5)) return twinCase(level);
  const [lo, hi] = level === "easy" ? [2, 30] : level === "medium" ? [31, 200] : [201, 500];
  const tricky = level === "easy" ? [9, 15, 21, 25, 27] : level === "medium" ? [49, 51, 57, 77, 87, 91, 93, 119, 121, 133, 143, 161, 169, 187] : [209, 221, 247, 253, 289, 299, 323, 341, 361, 377, 391, 403, 437, 451, 481, 493];
  const wantPrime = Math.random() < 0.45;
  let n;
  if (!wantPrime && Math.random() < 0.5) n = pick(tricky);
  else do n = pickInt(lo, hi);
  while (isPrime(n) !== wantPrime);
  return numberCase(n, level);
}
function numberCase(n, level) {
  const prime = isPrime(n);
  const d = prime ? null : smallestFactor(n);
  let strip = [];
  const tested = TEST_PRIMES.filter((p) => p * p <= n);
  const next = TEST_PRIMES.find((p) => p * p > n) || 29;
  const shown = TEST_PRIMES.filter((p) => p <= Math.max(7, next));
  const tw = Math.min(84, 510 / shown.length);
  let cs = null;
  const work = prime
    ? tested.length
      ? [`Try primes p with p × p ≤ ${n}:`, ...tested.map((p) => `${n} ÷ ${p} = ${Math.floor(n / p)} R ${n % p}`), `${next} × ${next} = ${next * next} > ${n}, so stop.`, `${n} is PRIME: factors 1 and ${n} only.`]
      : [`${n} has only two factors: 1 and ${n}.`, `${n} is PRIME.`]
    : [`${n} ÷ ${d} = ${n / d}, nothing left over.`, `So ${n} = ${d} × ${n / d}.`, `Factors: ${factorsOf(n).join(", ")}.`, `More than 2 factors, so ${n} is COMPOSITE.`];
  return {
    ask: `Is <b>${n}</b> prime or composite? Tap your answer.`,
    opts: [{ label: "🟢 Prime", v: "prime" }, { label: "🧱 Composite", v: "comp" }, ...(level === "hard" ? [{ label: "⚪ Neither", v: "neither" }] : [])],
    ans: prime ? "prime" : "comp",
    draw() {
      tag(view, 285, 92, n, { r: 70 });
      if (n <= 30) {
        cs = counters(view, n);
        cs.put(cs.layout(Math.ceil(n / 10), 10, { x: 40, y: 180, w: 490, h: 150 }));
      }
      text(view, 285, n <= 30 ? 380 : 260, "Test strip: divide by small primes", { "font-size": 22, fill: SOFT });
      strip = shown.map((p, i) => {
        const g = el("g", { transform: `translate(${285 - (shown.length * tw) / 2 + i * tw + 4} ${n <= 30 ? 400 : 290})` }, view);
        const r = el("rect", { width: tw - 8, height: 76, rx: 16, fill: "#fff", stroke: "#c9b8a1", "stroke-width": 3 }, g);
        text(g, (tw - 8) / 2, 50, `÷${p}`, { "font-size": tw < 70 ? 23 : 28, fill: INK });
        const mark = text(g, (tw - 8) / 2, 112, "", { "font-size": 30, fill: INK });
        return { r, mark, p };
      });
      caseNotes([`Is ${n} prime or composite?`, "Prime: exactly 2 factors, 1 and itself.", "Composite: more than 2 factors.", level === "easy" ? "Can the squares form equal rows?" : "Test small primes. When may you stop?"]);
    },
    hint(v) {
      if (v === "neither") return `Neither is only for the number 1. Does ${n} have exactly two factors, or more?`;
      if (v === "prime") {
        const clue = n % 2 === 0 ? "Look at the ones digit." : n % 3 === 0 ? "What do the digits add up to?" : n % 5 === 0 ? "Look at the last digit." : "Have you tried 7, 11, 13, 17 and 19?";
        return `Can you split ${n} into equal groups another way? ${clue}`;
      }
      return `Which two numbers, not 1, multiply to make ${n}? Which primes did you try?`;
    },
    why: prime ? `No small prime divides ${n} evenly. Its only factors are 1 and ${n}, so it is prime.` : `${n} = ${d} × ${n / d}, so it has more than two factors. It is composite.`,
    work,
    async after(api) {
      for (const s of strip) {
        if (d && s.p === d) {
          s.r.setAttribute("fill", "#c8ecd2");
          s.mark.textContent = "✓";
          s.mark.setAttribute("fill", GREEN);
          MUSIC.play("xylophone", 84, { gain: 0.35 });
          break;
        }
        if (s.p * s.p > n) {
          s.r.setAttribute("fill", "#f3eee6");
          s.mark.textContent = "–";
          continue;
        }

      hint: () => `Add them one at a time: ${ds[0]} + ${ds[1]} is…? Then add ${ds[2]}.`,
      why: `${ds.join(" + ")} = ${digitSum(n)}.`,
      work: [`${ds.join(" + ")} = ${digitSum(n)}`, digitSum(n) % 3 === 0 ? `${digitSum(n)} is a multiple of 3, so ${n} is too!` : `${digitSum(n)} is not a multiple of 3, so neither is ${n}.`],
    };
  },
  count(level) {
    const s = level === "easy" ? pickInt(3, 9) : pickInt(10, 15);
    const list = [];
    for (let n = 10; n <= 99; n++) if (digitSum(n) === s) list.push(n);
    return {
      ask: `How many 2-digit numbers have digits that add up to ${s}?`,
      max: 2,
      ans: list.length,
      draw() {
        caseArt("🧮", [s]);
        caseNotes([`How many 2-digit numbers have digits that add up to ${s}?`, "Example: 23 has digits 2 and 3, which add up to 5.", "Be systematic: start with the tens digit 1."]);
      },
      hint: () => `Go in order: tens digit 1, then 2, then 3… What must the ones digit be each time? Can it be more than 9?`,
      why: `They are ${list.join(", ")}. That is ${list.length} numbers.`,
      work: ["Go through the tens digits in order:", list.join(", "), `That is ${list.length} numbers.`, s > 9 ? "The ones digit can't be more than 9, so small tens digits don't work." : "Tens digit 1 up to the sum, ones digit makes up the rest."],
    };
  },
  share() {
    const d = pickInt(3, 9);
    const n = d * pickInt(3, 10) + pickInt(1, d - 1);
    return {
      ask: `${n} stickers are shared equally by ${d} friends. How many are left over?`,
      max: 1,
      ans: n % d,
      draw() {
        caseArt("⭐", [n, d]);
        caseNotes([`${n} stickers are shared equally by ${d} friends.`, "Each friend gets the same number.", "How many stickers are left over?"]);
      },
      hint: () => `What is the biggest multiple of ${d} that is not more than ${n}?`,
      why: `${d} × ${Math.floor(n / d)} = ${d * Math.floor(n / d)}, and ${n} − ${d * Math.floor(n / d)} = ${n % d} left over.`,
      work: [`${n} ÷ ${d} = ${Math.floor(n / d)} R ${n % d}`, `Each friend gets ${Math.floor(n / d)}.`, `${d} × ${Math.floor(n / d)} = ${d * Math.floor(n / d)}`, `${n} − ${d * Math.floor(n / d)} = ${n % d} left over.`],
    };
  },
  riddle() {
    for (;;) {
      const [a, b] = pick([[2, 3], [3, 4], [2, 5], [3, 5], [4, 6], [2, 7], [3, 7], [4, 5], [6, 4], [6, 9]]);
      const L = lcm(a, b);
      const cands = [];
      for (let n = 10; n <= 99; n++) if (n % L === 0) cands.push(n);
      const sums = cands.map(digitSum);
      const unique = cands.filter((n, i) => sums.filter((s) => s === sums[i]).length === 1);
      if (cands.length < 3 || !unique.length) continue;
      const ans = pick(unique);
      const s = digitSum(ans);
      const check = [];
      for (let n = 10; n <= 99; n++) if (n % a === 0 && n % b === 0 && digitSum(n) === s) check.push(n);
      if (check.length !== 1) continue;
      return {
        ask: `I am a 2-digit number, a multiple of ${a} and of ${b}. My digits add up to ${s}. Who am I?`,
        max: 2,
        ans,
        draw() {
          caseArt("🕵️", [a, b]);
          caseNotes(["I am a 2-digit number.", `I am a multiple of ${a} and of ${b}.`, `My digits add up to ${s}.`, "Who am I?"]);
        },
        hint: () => `A multiple of ${a} and ${b} is a multiple of their LCM. What is it? List those multiples.`,
        why: `Multiples of both are multiples of ${L}: ${cands.join(", ")}. Only ${ans} has digits adding to ${s}.`,
        work: [`Multiple of ${a} and ${b} → multiple of LCM ${L}.`, `2-digit ones: ${cands.join(", ")}`, `Digit sums: ${cands.map((n) => digitSum(n)).join(", ")}`, `Only ${ans} adds to ${s}.`],
      };
    }
  },
  ones(level) {
    const base = pick([2, 3, 7, 8]);
    const n = level === "hard" ? pickInt(20, 99) : pickInt(5, 14);
    const cyc = [];
    let v = base % 10;
    while (!cyc.includes(v)) {
      cyc.push(v);
      v = (v * base) % 10;
    }
    let ans = 1;
    for (let i = 0; i < n; i++) ans = (ans * base) % 10;
    const len = cyc.length;
    const r = n % len;
    return {
      ask: `What is the ones digit of ${base}${sup(n)}?`,
      max: 1,
      ans,
      draw() {
        caseArt("🔁");
        text(view, 285, 420, `${base}${sup(n)}`, { "font-size": 90, fill: INK });
        caseNotes([`What is the ones digit of ${base}${sup(n)}?`, `That means ${base} multiplied by itself ${n} times!`, "Clue: look for a pattern in the ones digits."]);
      },
      hint: () => `Work out ${base}¹, ${base}², ${base}³, ${base}⁴. Look only at the ones digits. What pattern do you see?`,
      why: `The ones digits go ${cyc.join(", ")} and repeat every ${len}. ${n} leaves remainder ${r} when divided by ${len}, so the ones digit is ${ans}.`,
      work: [`Ones digits of ${base}¹, ${base}², …: ${cyc.join(", ")}, then repeat.`, `The cycle is ${len} long.`, `${n} = ${len} × ${Math.floor(n / len)} + ${r}`, `Position ${r || len} in the cycle → ${ans}`],
    };
  },
  smallest() {
    const s = pickInt(10, 22);
    let ans = 1;
    while (digitSum(ans) !== s) ans += 1;
    const nines = Math.floor(s / 9);
    const lead = s % 9;
    return {
      ask: `What is the smallest number whose digits add up to ${s}?`,
      max: 4,
      ans,
      draw() {
        caseArt("🔎", [s]);
        caseNotes([`What is the smallest number whose digits add up to ${s}?`, "Clue: fewer digits make a smaller number."]);
      },
      hint: () => `Use as few digits as you can. Which digit is the biggest? Where should the smallest digit go?`,
      why: `Use as many 9s as possible to keep it short: ${s} = ${lead ? `${lead} + ` : ""}${Array(nines).fill(9).join(" + ")}. Smallest digit first: ${ans}.`,
      work: ["Fewer digits = smaller number.", "9 is the biggest digit, so use 9s.", `${s} = ${lead ? `${lead} + ` : ""}${Array(nines).fill(9).join(" + ")}`, `Smallest digit in front: ${ans}`],
    };
  },
  rem1(level) {
    const sets = level === "hard" ? [[2, 3, 4], [3, 4, 5], [2, 5, 6], [4, 5, 6], [2, 3, 7]] : [[2, 3], [3, 4], [4, 5], [3, 5], [4, 6], [5, 6]];
    const ns = pick(sets);
    const L = ns.reduce((x, y) => lcm(x, y), 1);
    let ans = 2;
    while (!ns.every((d) => ans % d === 1)) ans += 1;
    return {
      ask: `What is the smallest number bigger than 1 that leaves remainder 1 when divided by ${ns.join(", ")}?`,
      voice: `What is the smallest number bigger than 1 that leaves remainder 1 when divided by each of ${ns.join(", ")}?`,
      max: 3,
      ans,
      draw() {
        caseArt("🍪", ns);
        caseNotes([`Find the smallest number bigger than 1 that leaves remainder 1 when divided by each of ${ns.join(", ")}.`, "Clue: what if you took 1 away?"]);
      },
      hint: () => `If the number leaves 1 over, then the number minus 1 divides by ${ns.join(" and ")}. What is the smallest such number?`,
      why: `The number minus 1 must be a common multiple. The LCM is ${L}, so the answer is ${L} + 1 = ${ans}.`,
      work: ["Remainder 1 → the number − 1 divides evenly.", `LCM(${ns.join(", ")}) = ${L}`, `${L} + 1 = ${ans}`, `Check: ${ns.map((d) => `${ans} ÷ ${d} = ${Math.floor(ans / d)} R 1`).join(", ")}`],
    };
  },
  incl(level) {
    const N = level === "hard" ? pick([300, 500, 600, 1000, 2000]) : pick([50, 60, 100, 120, 200]);
    let a, b;
    do {
      a = pickInt(2, 7);
      b = pickInt(3, 9);
    } while (a >= b || b % a === 0);
    let ans = 0;
    for (let n = 1; n <= N; n++) if (n % a === 0 || n % b === 0) ans += 1;
    const A = Math.floor(N / a);
    const B = Math.floor(N / b);
    const L = lcm(a, b);
    const C = Math.floor(N / L);
    return {
      ask: `How many numbers from 1 to ${N} are multiples of ${a} or ${b} (or both)?`,
      max: 4,
      ans,
      draw() {
        caseArt("🧺", [a, b]);
        caseNotes([`How many numbers from 1 to ${N} are multiples of ${a} or of ${b}?`, "Numbers that are multiples of both count only once!"]);
      },
      hint: () => `How many multiples of ${a}? Of ${b}? Some numbers were counted twice. Which ones?`,
      why: `${A} multiples of ${a}, plus ${B} multiples of ${b}, minus ${C} counted twice (multiples of ${L}): ${ans}.`,
      work: [`Multiples of ${a}: ${N} ÷ ${a} → ${A}`, `Multiples of ${b}: ${N} ÷ ${b} → ${B}`, `Both = multiples of ${L}: ${C}`, `Counted twice, so ${A} + ${B} − ${C} = ${ans}`],
    };
  },
  zeros(level) {
    const n = level === "hard" ? pickInt(25, 120) : pickInt(10, 30);
    let f = 1n;
    for (let i = 2n; i <= BigInt(n); i++) f *= i;
    const s = f.toString();
    const ans = s.length - s.replace(/0+$/, "").length;
    return {
      ask: `${n}! means 1 × 2 × 3 × … × ${n}. How many zeros are at the end of ${n}!?`,
      voice: `${n} factorial means 1 times 2 times 3, all the way up to ${n}. How many zeros are at the end of ${n} factorial?`,
      max: 2,
      ans,
      draw() {
        caseArt("0️⃣", [`${n}!`]);
        caseNotes([`${n}! = 1 × 2 × 3 × … × ${n}`, "How many zeros are at the end of the answer?", "Clue: where does a zero at the end come from?"]);
      },
      hint: () => `A zero at the end comes from a 10 = 2 × 5. Which is rarer in 1 to ${n}: 2s or 5s?`,
      why: `Each zero needs a factor 2 and a factor 5, and 5s are scarcer. Count multiples of 5, then extra 5s from multiples of 25${n >= 125 ? " and 125" : ""}: ${ans} zeros.`,
      work: ["Each final zero = a 10 = 2 × 5.", "2s are plentiful, so count the 5s.", `Multiples of 5 up to ${n}: ${Math.floor(n / 5)}`, ...(n >= 25 ? [`Multiples of 25 (an extra 5 each): ${Math.floor(n / 25)}`] : []), ...(n >= 125 ? [`Multiples of 125: ${Math.floor(n / 125)}`] : []), `→ ${ans} zeros`],
    };
  },
  aliquot() {
    const n = pick([6, 12, 16, 18, 20, 24, 28, 30, 36]);
    const fs = factorsOf(n).filter((x) => x < n);
    const ans = fs.reduce((x, y) => x + y, 0);
    return {
      ask: `Add up all the factors of ${n} that are smaller than ${n}. What do you get?`,
      max: 3,
      ans,
      draw() {
        caseArt("➕", [n]);
        caseNotes([`Add up all the factors of ${n} that are smaller than ${n}.`, "Find the factor pairs first."]);
      },
      hint: () => `List the factor pairs of ${n}: 1 × ${n}, 2 × ?… Leave out ${n} itself. Did you get them all?`,
      why: `${fs.join(" + ")} = ${ans}.${ans === n ? ` That equals ${n}! ${n} is a perfect number.` : ""}`,
      work: [`Factors below ${n}: ${fs.join(", ")}`, `${fs.join(" + ")} = ${ans}`, ans === n ? `${ans} = ${n}: a PERFECT number!` : ans > n ? `${ans} > ${n}: an "abundant" number.` : `${ans} < ${n}: a "deficient" number.`],
    };
  },
  powmod() {
    const base = pick([2, 3, 5, 7]);
    const m = pick([3, 5, 7, 9, 11, 13].filter((x) => x % base !== 0 && x !== base));
    const n = pickInt(20, 200);
    const cyc = [];
    let v = base % m;
    while (!cyc.includes(v)) {
      cyc.push(v);
      v = (v * base) % m;
    }
    let ans = 1;
    for (let i = 0; i < n; i++) ans = (ans * base) % m;
    const len = cyc.length;
    const r = n % len;
    return {
      ask: `What is the remainder when ${base}${sup(n)} is divided by ${m}?`,
      max: 2,
      ans,
      draw() {
        caseArt("🔁");
        text(view, 285, 420, `${base}${sup(n)} ÷ ${m}`, { "font-size": 72, fill: INK });
        caseNotes([`What is the remainder when ${base}${sup(n)} is divided by ${m}?`, "The number itself is enormous. Look for a repeating pattern in the remainders instead (clock arithmetic)."]);
      },
      hint: () => `Find the remainders of ${base}¹, ${base}², ${base}³, … when divided by ${m}. Multiply only the remainders each time. When does the pattern repeat?`,
      why: `The remainders cycle ${cyc.join(", ")} with length ${len}. ${n} leaves ${r} when divided by ${len}, so the remainder is ${ans}.`,
      work: [`Remainders of ${base}¹, ${base}², … ÷ ${m}: ${cyc.join(", ")}, then repeat.`, `Cycle length ${len}.`, `${n} = ${len} × ${Math.floor(n / len)} + ${r}`, `Position ${r || len} in the cycle → ${ans}`],
    };
  },
  primecount() {
    const a = pickInt(5, 45) * 10;
    const b = a + pick([30, 40, 50]);
    const list = [];
    for (let n = a; n <= b; n++) if (isPrime(n)) list.push(n);
    return {
      ask: `How many prime numbers are there between ${a} and ${b}?`,
      max: 2,
      ans: list.length,
      draw() {
        caseArt("🔍", [a, b]);
        caseNotes([`How many primes lie between ${a} and ${b}?`, "Be systematic: discard evens and multiples of 5 first, then test 3, 7, 11, 13, 17, 19."]);
      },
      hint: () => `Only odd numbers not ending in 5 can be prime here. Test each candidate by the primes up to √${b}. Which survive?`,
      why: `The primes are ${list.join(", ")}: ${list.length} in all.`,
      work: [`Candidates: odd, not ending in 5.`, `Test by primes up to √${b} (≈ ${Math.floor(Math.sqrt(b))}).`, `Primes: ${list.join(", ")}`, `Count: ${list.length}`],
    };
  },
  crt() {
    const [a, b] = pick([[3, 4], [3, 5], [4, 5], [5, 6], [4, 7], [3, 7]]);
    // Different remainders: equal ones make the answer 1 itself, a trick rather than a puzzle.
    const r1 = pickInt(1, a - 1);
    let r2;
    do r2 = pickInt(1, b - 1);
    while (r2 === r1);
    let ans = 1;
    while (!(ans % a === r1 && ans % b === r2)) ans += 1;
    const list = [];
    for (let n = r1; n <= ans; n += a) list.push(n);
    return {
      ask: `What is the smallest number that leaves remainder ${r1} when divided by ${a}, and remainder ${r2} when divided by ${b}?`,
      max: 2,
      ans,
      draw() {
        caseArt("🧩", [a, b]);
        caseNotes([`Find the smallest number that leaves remainder ${r1} when divided by ${a},`, `and remainder ${r2} when divided by ${b}.`]);
      },
      hint: () => `List numbers with remainder ${r1} when divided by ${a}: ${r1}, ${r1 + a}, ${r1 + 2 * a}… Which one has remainder ${r2} when divided by ${b}?`,
      why: `Numbers with remainder ${r1} for ${a}: ${list.join(", ")}. The first with remainder ${r2} for ${b} is ${ans}.`,
      work: [`Remainder ${r1} when ÷ ${a}: ${list.join(", ")}`, `Test each ÷ ${b}: ${list.map((n) => `${n} R ${n % b}`).join(", ")}`, `First with R ${r2}: ${ans}`],
    };
  },
};
