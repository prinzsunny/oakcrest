// On a tall phone screen, zoom the picture to its main part so it is big enough to read.
const fitRect = (x, y, w, h) => {

const NOTES = [72, 74, 76, 77, 79, 81, 83, 84, 86, 88, 89, 91];
const note = (i, gain = 0.35) => MUSIC.play("xylophone", NOTES[Math.max(0, Math.min(NOTES.length - 1, i))], { gain });
const EFFORT = ["You kept trying!", "Careful thinking!", "You checked your work!", "You used a strategy!", "Nice reasoning!", "You stuck with it!"];
const GENTLE = "Mistakes are how we learn. Let's look why.";
// Show one thing in Ollie's bubble but speak it a little differently (for "?" in a sum).
const sayTo = (shown, spoken) => {
  say(shown, { voice: false });
  VOICE.speak(spoken);
};

// Difficulty chips and a calm tween, shared by the game units.
const LEVELS = [["easy", "🐣 Easy"], ["medium", "🦊 Medium"], ["hard", "🦁 Hard"]];
const levelChips = (cur) => `<div class="ap-chips" data-levels>${LEVELS.map(([k, l]) => `<button type="button" data-lv="${k}" aria-pressed="${k === cur}">${l}</button>`).join("")}</div>`;
const onLevels = (id, fn) =>
  $("[data-levels]").addEventListener("click", (event) => {
    const b = event.target.closest("[data-lv]");
    if (!b) return;
    document.querySelectorAll("[data-lv]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    shell.mark(id, { level: b.dataset.lv });
    window.OC?.touch();
    fn(b.dataset.lv);
  });
const tween = (ms, fn, alive) =>
  new Promise((resolve) => {
    if (KIT.still.matches) {
      fn(1);
      return resolve(true);
    }
    const t0 = performance.now();
    const frame = (now) => {
      if (!alive()) return resolve(false);
      const t = Math.min(1, (now - t0) / ms);
      fn(t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
      if (t < 1) requestAnimationFrame(frame);
      else resolve(true);
    };
    requestAnimationFrame(frame);
  });
// An animation helper bound to one game run: every step stops when the game is switched away.
const STOP = Symbol("stop");
const runner = (alive) => ({
  alive,
  wait: (ms) => new Promise((res, rej) => setTimeout(() => (alive() ? res() : rej(STOP)), KIT.still.matches ? Math.min(ms, 150) : ms)),
  tween: (ms, fn) => tween(ms, fn, alive).then((ok) => (ok && alive() ? undefined : Promise.reject(STOP))),
});
const quiet = (p) => p.catch((e) => (e === STOP ? null : console.error(e)));

// Number buttons in the panel (1..max, ⌫), for puzzles where each box takes one digit.
function digits(host, max, onDigit, extra = "", onExtra = null) {
  host.innerHTML = `<div class="gm-digits">${Array.from({ length: max }, (_, i) => `<button type="button" data-d="${i + 1}">${i + 1}</button>`).join("")}<button type="button" data-d="0" aria-label="Erase">⌫</button>${extra}</div>`;
  host.onclick = (event) => {
    const x = event.target.closest("[data-x]");
    if (x) return onExtra?.(x.dataset.x);
    const b = event.target.closest("[data-d]");
    if (b) onDigit(Number(b.dataset.d));
  };
}

// "🏠 Try it for real" / notebook card over the stage: an offline activity with a grown-up.
function realCard({ icon = "🏠", title, need = [], steps = [], note: tip = "", button = "✓ Got it!" }) {
  return new Promise((resolve) => {
    stage.querySelector(".gm-real")?.remove();
    const box = document.createElement("div");
    box.className = "gm-real";
    box.innerHTML = `<div class="gm-real-card" role="dialog" aria-label="${title}"><div class="gm-real-head"><span aria-hidden="true">${icon}</span><h2>${title}</h2></div>${need.length ? `<p class="gm-need"><b>You need:</b> ${need.join(" · ")}</p>` : ""}<ol>${steps.map((s) => `<li>${s}</li>`).join("")}</ol>${tip ? `<p class="gm-tip">⚠️ ${tip}</p>` : ""}<button type="button" class="kt-go">${button}</button></div>`;
    stage.appendChild(box);
    VOICE.speak(`${title}. ${need.length ? `You need: ${need.join(", ")}. ` : ""}${steps.join(" ")} ${tip}`);
    box.querySelector(".kt-go").addEventListener("click", () => {
      VOICE.hush();
      box.remove();
      window.OC?.touch();
      resolve();
    });
  });
}

const gmStyle = document.createElement("style");

document.head.appendChild(gmStyle);

// ---------- Facts to 20: tricks, not drills ----------
const factKey = (a, b) => (a <= b ? `${a}+${b}` : `${b}+${a}`);
const factsStore = () => shell.progress().g3?.facts || {};
const solid = (f) => !!f && f.ok >= 2 && f.last === 1;
function saveFact(a, b, ok) {
  const facts = { ...factsStore() };
  const k = factKey(a, b);
  const f = { ok: 0, miss: 0, ...(facts[k] || {}) };
  if (ok) f.ok += 1;
  else f.miss += 1;
  f.last = ok ? 1 : 0;
  facts[k] = f;
  shell.mark("g3", { facts });
  return f;
}
const span = (from, n, color) => Array.from({ length: Math.max(0, n) }, (_, i) => [from + i, color]);
const TRICK_NAMES = { zero: "Adding 0", count: "Count on", double: "Doubles", near: "Near doubles", make10: "Make 10", teen: "Ten and ones", frame: "Ten-frame", family: "Fact families" };

// A fact question q: { op: "+", a, b } · { op: "-", c, a } · { op: "?", a, c }. Returns the picture steps, a hint question and the why.
function trickOf(q, force) {
  if (q.op === "-") {
    const { c, a } = q;
    const b = c - a;
    return {
      name: "family",
      ans: b,
      show: `${c} − ${a} = ?`,
      done: `${c} − ${a} = ${b}`,
      hint: `Think addition: ${a} + what makes ${c}?`,
      why: `Think addition: ${a} + ${b} = ${c}. So ${c} − ${a} = ${b}. They are one fact family.`,
      steps: [
        { text: `${c}`, add: span(0, c, RED) },
        { text: `take away ${a}`, cross: span(b, a).map(([s]) => s) },
        { text: `${b} left: ${a} + ${b} = ${c}`, glow: span(0, b).map(([s]) => s) },
      ],
      a,
      b,
    };
  }
  if (q.op === "?") {
    const { a, c } = q;
    const b = c - a;
    return {
      name: "family",
      ans: b,
      show: `${a} + ? = ${c}`,
      done: `${a} + ${b} = ${c}`,
      hint: `Start at ${a}. How many more to get to ${c}?`,
      why: `Count up from ${a} to ${c}: that is ${b} more. ${a} + ${b} = ${c}, so ${c} − ${a} = ${b}.`,
      steps: [
        { text: `${a}`, add: span(0, a, RED) },
        { text: `fill up to ${c}`, add: span(a, b, BLUE) },
        { text: `${b} more: ${a} + ${b} = ${c}`, glow: span(a, b).map(([s]) => s) },
      ],
      a,
      b,
    };
  }
  const { a, b } = q;
  const s = a + b;
  const big = Math.max(a, b);
  const small = Math.min(a, b);
  const base = { ans: s, show: `${a} + ${b} = ?`, done: `${a} + ${b} = ${s}`, a, b };
  let name = force;
  if (!name) {
    if (small === 0) name = "zero";
    else if (a === b) name = "double";
    else if (big - small === 1) name = "near";
    else if (small <= 2) name = "count";
    else if (big < 10 && s > 10) name = "make10";
    else if (big >= 10) name = "teen";
    else if (small === 3) name = "count";
    else name = "frame";
  }
  if (name === "zero")
    return { ...base, name, hint: "What happens when you add nothing at all?", why: `Adding 0 adds nothing, so ${big} stays ${big}.`, steps: [{ text: `${big} + 0 = ${big}`, add: span(0, big, RED) }] };
  if (name === "double")
    return {
      ...base,
      name,
      hint: "What do you notice about the two numbers?",
      why: `${a} + ${a} is a double. Double ${a} is ${s}.`,
      steps: [
        { text: `${a} and ${a}: the same!`, add: [...span(0, a, RED), ...span(10, a, BLUE)] },
        { text: `double ${a} = ${s}`, glow: [...span(0, a), ...span(10, a)].map(([x]) => x) },
      ],
    };
  if (name === "near")
    return {
      ...base,
      name,
      hint: `What do you notice? ${small} and ${big} are almost the same. What is ${small} + ${small}?`,
      why: `${small} + ${big} is a near double. ${small} + ${small} = ${2 * small}, and 1 more makes ${s}.`,
      steps: [
        { text: `${small} + ${small} = ${2 * small}`, add: [...span(0, small, RED), ...span(10, small, BLUE)] },
        { text: `1 more makes ${s}`, add: [[10 + small, GOLD]] },
      ],
    };
  if (name === "count") {
    const seq = Array.from({ length: small }, (_, i) => big + i + 1);
    return {
      ...base,
      name,
      hint: `Start at the bigger number, ${big}. Count on ${small} more.`,
      why: `Start at ${big} and count on ${small}: ${seq.join(", ")}. So ${s}.`,
      steps: [{ text: `start at ${big}`, add: span(0, big, RED) }, ...seq.map((n, i) => ({ text: `${seq.slice(0, i + 1).join(", ")}`, add: [[big + i, BLUE]] }))],
    };
  }
  if (name === "make10") {
    const need = 10 - big;
    const rest = small - need;
    return {
      ...base,
      name,
      hint: `What do you notice? ${big} is close to 10. How many more make 10?`,
      why: `${big} needs ${need} to make 10. Take ${need} from the ${small}, and ${rest} are left. 10 + ${rest} = ${s}.`,
      steps: [
        { text: `${big}`, add: span(0, big, RED) },
        { text: `${big} + ${need} = 10`, add: span(big, need, BLUE) },
        { text: `10 + ${rest} = ${s}`, add: span(10, rest, BLUE) },
      ],
    };
  }
  if (name === "teen") {
    const ones = big - 10;
    return {
      ...base,
      name,
      hint: ones ? `${big} is a ten and ${ones} ones. What is ${ones} + ${small}?` : `10 is one full ten. What is a ten and ${small} more?`,
      why: ones ? `${big} is 10 and ${ones}. ${ones} + ${small} = ${ones + small}, so ${big} + ${small} = ${s}.` : `A ten and ${small} ones make ${s}.`,
      steps: [
        { text: ones ? `${big} is 10 and ${ones}` : "one full ten", add: span(0, big, RED) },
        { text: ones ? `${ones} + ${small} = ${ones + small}` : `and ${small} ones`, add: span(big, small, BLUE) },
        { text: `10 + ${ones + small} = ${s}`, glow: span(10, ones + small).map(([x]) => x) },
      ],
    };
  }
  return {
    ...base,
    name: "frame",
    hint: "Count the red and the blue in the ten-frame. How many boxes are full?",
    why: s === 10 ? `${a} and ${b} fill the whole ten-frame. They are friends of 10!` : `${a} and ${b} more fill ${s} boxes. ${s === 9 ? "Only 1 box is empty: 9." : `That leaves ${10 - s} empty.`}`,
    steps: [
      { text: `${a}`, add: span(0, a, RED) },
      { text: `${a} + ${b} = ${s}`, add: span(a, b, BLUE) },
    ],
  };
}

// Two ten-frames and a caption; steps play one at a time.
function framesPicture(parent, y0 = 175) {
  const C = 64;
  const fw = C * 5;
  const xs = [500 - fw - 22, 522];
  const g = el("g", {}, parent);
  for (const x of xs) {
    el("rect", { x: x - 10, y: y0 - 10, width: fw + 20, height: C * 2 + 20, rx: 16, fill: "#8a5a35" }, g);
    for (let k = 0; k < 10; k++) el("rect", { x: x + (k % 5) * C + 3, y: y0 + Math.floor(k / 5) * C + 3, width: C - 6, height: C - 6, rx: 10, fill: PAPER }, g);
  }
  const pos = (i) => {
    const k = i % 10;
    return [xs[i < 10 ? 0 : 1] + (k % 5) * C + C / 2, y0 + Math.floor(k / 5) * C + C / 2];
  };
  const counters = new Map();
  const caption = text(g, 500, y0 + C * 2 + 92, "", { "font-size": 44, fill: INK });
  let shown = -1;
  return {
    g,
    get shown() {
      return shown;
    },
    async play(steps, upto, rr, fast = false) {
      for (let i = shown + 1; i <= Math.min(upto, steps.length - 1); i++) {
        shown = i;
        const st = steps[i];
        caption.textContent = st.text;
        for (const [slot, color] of st.add || []) {
          const [x, y] = pos(slot);
          const c = el("circle", { cx: x, cy: y, r: 0, fill: color, stroke: "rgba(0,0,0,.25)", "stroke-width": 3 }, g);
          counters.set(slot, c);
          if (fast) c.setAttribute("r", 25);
          else {
            note(Math.min(11, Math.floor(slot / 2)), 0.25);
            await rr.tween(220, (t) => c.setAttribute("r", 25 * t));
          }
        }
        for (const slot of st.cross || []) {
          const [x, y] = pos(slot);
          counters.get(slot)?.setAttribute("opacity", 0.3);
          el("path", { d: `M${x - 20} ${y - 20}L${x + 20} ${y + 20}M${x + 20} ${y - 20}L${x - 20} ${y + 20}`, stroke: INK, "stroke-width": 6, "stroke-linecap": "round" }, g);
          if (!fast) await rr.wait(180);
        }
        for (const slot of st.glow || []) {
          const [x, y] = pos(slot);
          el("circle", { cx: x, cy: y, r: 29, fill: "none", stroke: GOLD, "stroke-width": 5 }, g);
        }
        if (!fast) await rr.wait(i < steps.length - 1 ? 900 : 300);
      }
    },
  };
}

// The shared fact game: numpad answers, a picture that teaches when you are stuck.
function factGame({ my, total, next, showSetup, onRight, onMiss, finish, statusLabel = "Fact" }) {
  let round = 0;
  let tries = 0;
  let busy = false;
  let first = 0;
  let q = null;
  let t = null;
  let pic = null;
  let qText = null;
  const rr = runner(() => my === token);
  const pad = numpad($("[data-ans]"), { onEnter: (v) => answer(v), max: 2 });
  const ask = () => {
    q = next(round);
    t = trickOf(q, q.force);
    tries = 0;
    busy = false;
    pad.clear();
    fresh();

  V: [[0, 0], [0, 1], [0, 2], [1, 2], [2, 2]],

  Y: [[1, 0], [0, 1], [1, 1], [1, 2], [1, 3]],
  Z: [[0, 0], [1, 0], [1, 1], [1, 2], [2, 2]],

const PENTO_COLORS = { F: "#e57373", I: "#64b5f6", L: "#ffb74d", N: "#81c784", P: "#ba68c8", T: "#4db6ac", U: "#f06292", V: "#a1887f", W: "#7986cb", X: "#dce775", Y: "#ff8a65", Z: "#4fc3f7" };

const flipCells = (cells) => normCells(cells.map(([x, y]) => [-x, y]));

        if (rec()) return true;
        sol.pop();
        used.delete(k);
        cells.forEach(([x, y]) => (g[y * w + x] = null));

    }

    const sol = pentoSolve(w, h, keys);

  }

}

  g1() {
    const my = token;
    const TRICKS = [["count", "Count on"], ["double", "Doubles"], ["near", "Near doubles"], ["make10", "Make 10"], ["family", "Fact families"]];
    let trick = shell.progress().g1?.trick || "count";
    const make = () => {
      if (trick === "count") {
        const small = pickInt(1, 3);
        const big = pickInt(4, 20 - small);
        return Math.random() < 0.5 ? { op: "+", a: big, b: small, force: "count" } : { op: "+", a: small, b: big, force: "count" };
      }
      if (trick === "double") {
        const a = pickInt(2, 10);
        return { op: "+", a, b: a, force: "double" };
      }
      if (trick === "near") {
        const s = pickInt(2, 9);
        return Math.random() < 0.5 ? { op: "+", a: s, b: s + 1, force: "near" } : { op: "+", a: s + 1, b: s, force: "near" };
      }
      if (trick === "make10") {
        const big = pickInt(6, 9);
        const small = pickInt(11 - big, 9);
        return Math.random() < 0.6 ? { op: "+", a: big, b: small, force: "make10" } : { op: "+", a: small, b: big, force: "make10" };
      }
      const c = pickInt(11, 18);
      const a = pickInt(c - 9, 9);
      return Math.random() < 0.6 ? { op: "-", c, a } : { op: "?", a, c };
    };
    const start = () => {
      let last = "";
      factGame({
        my,
        total: 8,
        showSetup: true,
        next: () => {
          let q = make();
          for (let i = 0; i < 5 && JSON.stringify(q) === last; i++) q = make();
          last = JSON.stringify(q);
          return q;
        },
        onRight: (q, t, first) => first && saveFact(t.a, t.b, true),
        finish: async (first) => {
          if (my !== token) return;
          confetti();
          shell.mark("g1", { done: true });
          calmEnd([`8 facts with ${TRICK_NAMES[trick]}!`, `${first} right on the first try. ${pick(EFFORT)}`]);
          await KIT.sayAsync(`🎉 You finished 8 facts with the ${TRICK_NAMES[trick]} trick. ${pick(EFFORT)}`);
          if (my !== token) return;
          await realCard({
            title: "Try it for real: an egg-box ten-frame",
            need: ["an egg box cut to 10 cups (2 rows of 5)", "20 buttons or beans in two colours"],
            steps: ["Put 8 red buttons in the cups.", "Add 5 blue ones: fill the empty cups first.", "Say it: 8 + 2 = 10, and 3 more is 13.", "Make up your own facts and show a grown-up the trick."],
            note: "Do this with a grown-up. Keep small buttons and beans away from babies.",
          });
          if (my === token) say("Pick another trick above, or take a break. Well done!");
        },
      });
    };
    panel(`<div class="ap-row"><div class="ap-chips" data-tricks>${TRICKS.map(([k, l]) => `<button type="button" data-t="${k}" aria-pressed="${k === trick}">${l}</button>`).join("")}</div><p class="ap-status" data-status></p></div><div class="gm-input" data-ans></div>`);
    $("[data-tricks]").addEventListener("click", (event) => {
      const b = event.target.closest("[data-t]");
      if (!b) return;
      token += 1;
      VOICE.hush();
      trick = b.dataset.t;
      shell.mark("g1", { trick });
      units.g1();
    });
    start();
  },

  g2() {
    const my = token;
    let level = shell.progress().g2?.level || "easy";
    panel(`<div class="ap-row">${levelChips(level)}<p class="ap-status" data-status></p></div><div class="gm-input" data-ans></div>`);
    const pool = () => {
      const out = [];
      for (let a = 0; a <= 19; a++)
        for (let b = a; b <= 19; b++) {
          const s = a + b;
          if (level === "easy" ? s <= 10 : s > 10 && s <= 20 && a >= 1) out.push([a, b]);
        }
      return out;
    };
    const build = () => {
      const facts = factsStore();
      const items = pool().map(([a, b]) => {
        const f = facts[factKey(a, b)];
        const w = (!f ? 3 : f.last === 0 ? 6 : solid(f) ? 1 : 3) * (a === 0 ? 0.3 : 1);
        return { a, b, key: Math.random() ** (1 / w) };
      });
      items.sort((x, y) => y.key - x.key);
      return items.slice(0, 15).map(({ a, b }) => {
        const [x, y] = Math.random() < 0.5 ? [a, b] : [b, a];
        if (level === "hard" && Math.random() < 0.5) return Math.random() < 0.6 ? { op: "-", c: x + y, a: x } : { op: "?", a: x, c: x + y };
        return { op: "+", a: x, b: y };
      });
    };
    const start = () => {
      const queue = build();
      const before = Object.values(factsStore()).filter(solid).length;
      factGame({
        my,
        total: 15,
        showSetup: false,
        next: (round) => queue[round],
        onRight: (q, t, first) => first && saveFact(t.a, t.b, true),
        onMiss: (q, t, round) => {
          saveFact(t.a, t.b, false);
          if (round + 3 < queue.length) queue[round + 3] = { ...q };
        },
        finish: async (first) => {
          if (my !== token) return;
          const now = Object.values(factsStore()).filter(solid).length;
          const grew = Math.max(0, now - before);
          confetti();
          shell.mark("g2", { done: true });
          window.OC?.count("practice sets");
          calmEnd(["15 facts done!", `${first} right on the first try.`, grew ? `${grew} more facts turned green.` : "Missed facts come back next time."], "🌱");
          await KIT.sayAsync(`🎉 15 facts done. ${grew ? `${grew} more facts turned green in your grid.` : ""} ${pick(EFFORT)}`);
          if (my !== token) return;
          await realCard({
            title: "Try it for real: Make-10 Go Fish",
            need: ["a deck of cards (only Ace to 10; Ace is 1)", "a grown-up or big brother or sister to play with"],
            steps: ["Deal 5 cards each. Put the rest in a pile.", "Ask for a card that makes 10 with one of yours: 'Do you have a 3?' for your 7.", "Put down each pair and say the fact: 7 + 3 = 10.", "No card? Take one from the pile. Play until the cards run out."],
            note: "No rush: say each fact out loud.",
          });
          if (my === token) {
            panel(`<div class="ap-buttons"><button type="button" class="primary" data-go="g3">🟩 See my facts</button><button type="button" data-go="g2">🌱 Another calm set</button></div>`);
            $("[data-panel]").onclick = (e) => {
              const b = e.target.closest("[data-go]");
              if (b) shell.go(b.dataset.go);
            };
            say("Look at your facts grid, or take a break. Well done!");
          }
        },
      });
    };
    onLevels("g2", (lv) => {
      token += 1;
      VOICE.hush();
      level = lv;
      units.g2();
    });
    start();
  },

    fresh();

    const colorOf = (a, b) => {
      const f = facts[factKey(a, b)];

      text(g, x0 - 16, y0 + i * C + C / 2 + 5, i, { "font-size": 15, fill: i % 5 ? "#8a7764" : INK });
    }
    let known = 0;
    let learning = 0;
    const seen = new Set();
    for (let a = 0; a < N; a++)
      for (let b = 0; b < N; b++) {

        const k = factKey(a, b);
        if (!seen.has(k)) {
          seen.add(k);
          if (fill === "#43a047") known += 1;
          else if (fill === "#f2c94c") learning += 1;
        }
      }
    const total = seen.size;
    const ring = el("rect", { x: 0, y: 0, width: C + 4, height: C + 4, rx: 6, fill: "none", stroke: BLUE, "stroke-width": 4, opacity: 0 }, g);

    [["#43a047", `Know it: ${known}`], ["#f2c94c", `Learning: ${learning}`], ["#f3ece0", `Not yet: ${total - known - learning}`]].forEach(([c, l], i) => {
      el("rect", { x: R - 130, y: 92 + i * 40, width: 28, height: 28, rx: 6, fill: c, stroke: "#c9b8a1", "stroke-width": 2 }, view);
      text(view, R - 90, 115 + i * 40, l, { "font-size": 26, fill: INK, "text-anchor": "start" });
    });
    const info = el("g", {}, view);
    const show = (a, b) => {

      text(info, R, 346, `Trick: ${TRICK_NAMES[t.name]}`, { "font-size": 28, fill: "var(--accent-dark)" });
      wrapText(info, R, 392, t.why, { max: 24, size: 24 });
      ring.setAttribute("x", x0 + b * C - 2);
      ring.setAttribute("y", y0 + a * C - 2);
      ring.setAttribute("opacity", 1);
    };
    wrapText(info, R, 300, "Tap a square to see its fact and its trick.", { max: 22, size: 28, fill: "#5a4130" });
    view.addEventListener("pointerdown", (event) => {
      const cell = event.target.closest(".gm-cell");
      if (!cell || my !== token) return;
      window.OC?.touch();
      const a = Number(cell.dataset.a);
      const b = Number(cell.dataset.b);
      show(a, b);
      note((a + b) % 12, 0.3);

    fitRect(20, 12, 545, 536);
    $("[data-status]").textContent = `Green: ${known} of ${total} facts`;
    if (known >= 40) shell.mark("g3", { done: true });
    say(known ? `Your facts grid: ${known} solid facts so far! 3 + 4 and 4 + 3 are the same fact, so both squares turn green. Tap a square to see its trick.` : "Your facts grid. Get a fact right on the first try two times, and it turns green. Tap a square to see its trick.");
  },

  g4() {
    const my = token;
    let level = shell.progress().g4?.level || "easy";
    const TOTAL = 4;
    let round = 0;
    let pz = null;
    let vals = [];
    let sel = 0;
    let tries = 0;
    let busy = false;
    let cellsG = [];
    panel(`<div class="ap-row">${levelChips(level)}<p class="ap-status" data-status></p></div><div class="gm-input" data-input></div>`);
    const n = () => (level === "easy" ? 3 : 4);
    const geo = () => {
      const S = n() === 3 ? 140 : 112;
      return { S, x0: 300 - (n() * S) / 2, y0: (H - n() * S) / 2 };
    };
    const cageOf = (i) => pz.cages.find((cg) => cg.cells.includes(i));
    const draw = () => {
      fresh();
      const { S, x0, y0 } = geo();
      const N = pz.n;
      cellsG = [];
      for (let i = 0; i < N * N; i++) {
        const x = x0 + (i % N) * S;
        const y = y0 + Math.floor(i / N) * S;
        const g = el("g", { class: "gm-cell", "data-i": i }, view);
        const r = el("rect", { x, y, width: S, height: S, fill: PAPER, stroke: "#c9b8a1", "stroke-width": 2 }, g);
        const t = text(g, x + S / 2, y + S / 2 + 24, "", { "font-size": S * 0.48, fill: BLUE });
        cellsG.push({ r, t, x, y });
      }
      // thick cage walls
      for (let i = 0; i < N * N; i++) {
        const { x, y } = cellsG[i];
        const me = cageOf(i);
        const wall = (x1, y1, x2, y2) => el("line", { x1, y1, x2, y2, stroke: INK, "stroke-width": 6, "stroke-linecap": "round", "pointer-events": "none" }, view);
        if (i < N || cageOf(i - N) !== me) wall(x, y, x + S, y);
        if (i >= N * N - N || cageOf(i + N) !== me) wall(x, y + S, x + S, y + S);
        if (i % N === 0 || cageOf(i - 1) !== me) wall(x, y, x, y + S);
        if (i % N === N - 1 || cageOf(i + 1) !== me) wall(x + S, y, x + S, y + S);
      }
      for (const cg of pz.cages) {
        const { x, y } = cellsG[cg.cells[0]];
        text(view, x + 10, y + 32, cageLabel(cg), { "font-size": 27, fill: INK, "text-anchor": "start", "pointer-events": "none" });
      }
      const R = 790;
      text(view, R, 92, "The rules", { "font-size": 34, fill: "var(--accent-dark)" });
      wrapText(view, R, 150, `Each row uses 1 to ${N} once.`, { max: 20, size: 27 });
      wrapText(view, R, 245, `Each column uses 1 to ${N} once.`, { max: 20, size: 27 });
      wrapText(view, R, 340, `Each cage makes its number with its sign.`, { max: 20, size: 27 });
      fitRect(x0 - 16, y0 - 16, N * S + 32, N * S + 32);
      if (N === 3) wrapText(view, R, 460, "7+ means the boxes add up to 7.", { max: 20, size: 24, fill: "#5a4130" });
      else wrapText(view, R, 460, level === "hard" ? "2− : the difference is 2.   6× : multiply to 6." : "2− means one number is 2 more than the other.", { max: 22, size: 24, fill: "#5a4130" });
      view.addEventListener("pointerdown", (event) => {
        const c = event.target.closest(".gm-cell");
        if (!c || my !== token || busy) return;
        window.OC?.touch();
        sel = Number(c.dataset.i);
        paint();
        MUSIC.play("woodblock", 79, { gain: 0.25 });
      });
      paint();
    };
    const paint = (bad = []) => {
      cellsG.forEach((c, i) => {
        c.r.setAttribute("fill", bad.includes(i) ? "#fde0d6" : i === sel ? "#fff1c9" : PAPER);
        c.t.textContent = vals[i] || "";
        c.t.setAttribute("fill", c.t.dataset.shown ? GOLD : BLUE);
      });
    };
    const findTrouble = () => {
      const N = pz.n;
      for (let r = 0; r < N; r++) {
        const idx = [...Array(N).keys()].map((c) => r * N + c);
        const dup = idx.find((i) => vals[i] && idx.some((j) => j !== i && vals[j] === vals[i]));
        if (dup !== undefined) return { cells: idx, say: `Look at row ${r + 1} (it is pink). What do you notice? Each number can only be in a row once.` };
      }
      for (let c = 0; c < N; c++) {
        const idx = [...Array(N).keys()].map((r) => r * N + c);
        const dup = idx.find((i) => vals[i] && idx.some((j) => j !== i && vals[j] === vals[i]));
        if (dup !== undefined) return { cells: idx, say: `Look at column ${c + 1} (it is pink). What do you notice? Each number can only be in a column once.` };
      }
      for (const cg of pz.cages) {
        const vs = cg.cells.map((i) => vals[i]);
        if (vs.every(Boolean) && cageValue(cg.op, vs) !== cg.target) {
          const joined = cg.op === "−" ? `${Math.max(...vs)} − ${Math.min(...vs)}` : vs.join(` ${cg.op || "+"} `);
          return { cells: cg.cells, say: `Look at the pink cage, ${cageSay(cg)}. What is ${joined}? Does it make ${cg.target}?` };
        }
      }
      return null;
    };
    const reveal = (area) => {
      const wrong = (area || []).concat([...vals.keys()]).find((i) => vals[i] !== pz.sol[i]);
      if (wrong === undefined) return;
      vals[wrong] = pz.sol[wrong];
      cellsG[wrong].t.dataset.shown = "1";
      const cg = cageOf(wrong);
      const vs = cg.cells.map((i) => pz.sol[i]);
      const how = cg.op ? `in its cage, ${cg.op === "−" ? `${Math.max(...vs)} − ${Math.min(...vs)}` : vs.join(` ${cg.op} `)} = ${cg.target}` : `its cage has just one box, so it is the cage number`;
      sel = wrong;
      paint();
      say(`${GENTLE} This box is ${pz.sol[wrong]}: ${how}, and its row and column then have each number once. Keep going!`);
    };
    const check = () => {
      if (my !== token || busy) return;
      window.OC?.touch();
      const trouble = findTrouble();
      if (trouble) {
        tries += 1;
        MUSIC.oops();
        paint(trouble.cells);
        if (tries >= 2) return reveal(trouble.cells);
        return say(trouble.say);
      }
      if (vals.some((v) => !v)) {
        paint();
        const single = pz.cages.find((cg) => cg.cells.length === 1 && !vals[cg.cells[0]]);
        return say(single ? `Nothing breaks the rules so far! A cage with one box just tells you its number. Can you find it?` : `Nothing breaks the rules so far! Which cage can only be made one way? What have you tried?`);
      }
      // every row, column and cage is right: the puzzle has only this answer
      busy = true;
      MUSIC.chime();
      cellsG.forEach((c) => c.r.setAttribute("fill", "#dff3e3"));
      round += 1;
      window.OC?.count("KenKen puzzles");
      say(`${pick(PRAISE)} Every row, column and cage works. ${pick(EFFORT)}`);
      setTimeout(async () => {
        if (my !== token) return;
        if (round < TOTAL) return ask();
        confetti();
        shell.mark("g4", { done: true });
        calmEnd([`${TOTAL} KenKen puzzles solved!`, "Puzzles train patience. Well done."], "🔢");
        await KIT.sayAsync(`🎉 You solved ${TOTAL} KenKen puzzles. ${pick(EFFORT)}`);
        if (my !== token) return;
        await realCard({
          title: "Try it for real: make a KenKen",
          need: ["paper", "a pencil", "a ruler"],
          steps: ["Draw a 3 by 3 grid. Fill it with 1, 2 and 3 so no row or column repeats.", "Draw thick lines to make cages of 2 or 3 boxes.", "Write each cage's sum in its corner, like 5+.", "Copy only the cages onto new paper, and give it to a grown-up to solve!"],
          note: "Check it with your grown-up: is there only one answer?",
        });
        if (my === token) say("Pick a level above to play again, or take a break.");
      }, 2600);
    };
    const ask = () => {
      pz = makeKenKen(n(), level === "hard" ? ["+", "−", "×"] : ["+", "−"]);
      vals = Array(pz.n * pz.n).fill(0);
      GM_TEST.ken = pz;
      sel = 0;
      tries = 0;
      busy = false;
      draw();
      $("[data-status]").textContent = `Puzzle ${round + 1} of ${TOTAL}`;
      digits(
        $("[data-input]"),
        pz.n,
        (d) => {
          if (my !== token || busy) return;
          window.OC?.touch();
          vals[sel] = d;
          delete cellsG[sel].t.dataset.shown;
          if (d) note(d * 2, 0.3);
          paint();
        },
        `<button type="button" class="gm-go" data-x="check">✓ Check</button>`,

          await rr.wait(1200);
          const lines = ["Primes we know: 2, 3, 5", "2 × 3 × 5 + 1 = 31", "31 ÷ 2, 3 or 5: always 1 left over!", "So a new prime is always out there."];
          for (let i = 0; i < lines.length; i++) {
            const t = text(v, 500, 360 + i * 50, lines[i], { "font-size": 32, fill: i === 3 ? "var(--accent-dark)" : INK, opacity: 0 });
            await rr.tween(600, (k) => t.setAttribute("opacity", k));
            await rr.wait(1100);
          }
        },
      },
      {
        id: "gauss",
        chip: "Add 1 to 10 fast",
        say: "Add 1 to 10 the clever way: pair the ends! 1 + 10 is 11, 2 + 9 is 11, and so on. 5 pairs of 11!",
        q: "11 + 11 + 11 + 11 + 11 = ?",
        ans: 55,
        hint: "Count by 11s: 11, 22, 33… What have you tried?",
        why: "5 pairs of 11 make 55. So 1 + 2 + 3 + … + 10 = 55! A famous story says young Carl Gauss added 1 to 100 like this: 50 pairs of 101 is 5050.",
        async draw(v) {
          const x = (i) => 95 + i * 90;
          for (let i = 0; i < 10; i++) text(v, x(i), 420, i + 1, { "font-size": 48, fill: INK });
          const colors = [RED, BLUE, GOLD, GREEN, "#8e5bd0"];
          for (let p = 0; p < 5; p++) {
            const x1 = x(p);
            const x2 = x(9 - p);
            const top = 360 - (5 - p) * 58;
            const path = el("path", { d: `M${x1} 372C${x1} ${top} ${x2} ${top} ${x2} 372`, fill: "none", stroke: colors[p], "stroke-width": 6, "stroke-linecap": "round" }, v);
            const len = path.getTotalLength();
            path.setAttribute("stroke-dasharray", len);
            await rr.tween(800, (t) => path.setAttribute("stroke-dashoffset", len * (1 - t)));
            text(v, 500, top + 52, "11", { "font-size": 26, fill: colors[p] === GOLD ? "#b07d0e" : colors[p] });
            note(p * 2 + 2);
            await rr.wait(500);
          }
          text(v, 500, 510, "5 pairs of 11", { "font-size": 40, fill: "var(--accent-dark)" });
        },
      },
    ];
    let cur = FACTS.find((f) => f.id === startId) || FACTS.find((f) => !info().seen?.[f.id]) || FACTS[0];
    const chips = () => {
      const wow = info().wow || {};
      $("[data-facts]").innerHTML = FACTS.map((f) => `<button type="button" data-f="${f.id}" aria-pressed="${f === cur}">${wow[f.id] ? "⭐ " : ""}${f.chip}</button>`).join("");
      $("[data-status]").textContent = `Wow facts: ${Object.keys(wow).length} of ${FACTS.length}`;
    };
    panel(`<div class="ap-row"><div class="ap-chips" data-facts></div><p class="ap-status" data-status></p></div><div class="gm-input" data-input></div>`);
    chips();
    const after = async () => {
      const seen = { ...(info().seen || {}), [cur.id]: true };
      shell.mark("g8", { seen });
      window.OC?.count("wow facts");
      const host = $("[data-input]");
      host.innerHTML = `<div class="ap-buttons"><button type="button" class="primary" data-wow>⭐ Wow!</button><button type="button" data-next>Next fact ▶</button></div>`;
      host.onclick = async (e) => {
        if (my !== token) return;
        if (e.target.closest("[data-wow]")) {
          shell.mark("g8", { wow: { ...(info().wow || {}), [cur.id]: true } });
          MUSIC.chime();
          e.target.closest("[data-wow]").disabled = true;
          chips();
          say("⭐ Saved in your wow facts!");
        } else if (e.target.closest("[data-next]")) {
          const all = FACTS.every((f) => info().seen?.[f.id]);
          if (all && !info().done) {
            shell.mark("g8", { done: true });
            confetti();
            calmEnd(["You explored every wow fact!", "Math is full of surprises."], "😈");
            await KIT.sayAsync("🎉 You explored every wow fact. Math is full of surprises!");
            if (my !== token) return;
            await realCard({
              title: "Try it for real: bean squares",
              need: ["25 dried beans or buttons", "a plate or tray"],
              steps: ["Put down 1 bean.", "Add 3 beans around it to make a 2 by 2 square.", "Add 5 more for 3 by 3. Then 7, then 9.", "Count each square. Do you see 1, 4, 9, 16, 25?"],
              note: "Do this with a grown-up. Beans are not for eating, and keep them away from babies.",
            });
            if (my !== token) return;
          }
          cur = FACTS[(FACTS.indexOf(cur) + 1) % FACTS.length];
          show();
        }
      };
    };
    const show = async () => {
      const mine = token;
      chips();
      fresh();
      const host = $("[data-input]");
      host.onclick = null;
      host.innerHTML = "";
      say(cur.say);
      await quiet(cur.draw(view));
      if (my !== token || mine !== token) return;
      let wrong = 0;
      let done = false;
      const pad = numpad(host, {
        max: 2,
        onEnter: (v) => {
          if (my !== token || done) return;
          window.OC?.touch();
          if (v === cur.ans) {
            done = true;
            MUSIC.chime();
            say(`${wrong ? pick(EFFORT) : pick(PRAISE)} ${cur.why}`);
            return after();
          }
          wrong += 1;
          MUSIC.oops();
          pad.clear();
          say(wrong === 1 ? `${v} is not it yet. ${cur.hint}` : `${GENTLE} ${cur.why} Type ${cur.ans}.`);
        },
      });
      sayTo(`Your turn: <b>${cur.q}</b> Type the answer.`, `Your turn: ${cur.q.replace("?", "what")} Type the answer.`);
    };
    $("[data-facts]").addEventListener("click", (event) => {
      const b = event.target.closest("[data-f]");
      if (!b) return;
      window.OC?.touch();
      token += 1;
      VOICE.hush();
      shell.mark("g8", { last: b.dataset.f });
      units.g8(b.dataset.f);
    });
    show();
  },
};

const shell = SHELL({
  units: UNITS,
  how: {
    g0: { icon: "👀", title: "See it", steps: ["Watch the pictures.", "Press Next ▶ to go on.", "Press Let's play when you are ready."] },
    g1: { icon: "🔟", title: "Fact tricks", steps: ["Pick a trick at the top.", "Look at the ten-frame picture.", "Type the answer and press ✓."] },
    g2: { icon: "🌱", title: "Calm fact practice", steps: ["15 facts. No clock, so take your time.", "Type the answer and press ✓.", "Stuck? A picture shows you a trick."] },
    g3: { icon: "🟩", title: "Facts I know", steps: ["Green squares are facts you know.", "Tap a square to see its trick.", "Practise to make more squares green."] },
    g4: { icon: "🔢", title: "KenKen", steps: ["Tap a box, then tap a number.", "Each row and column uses each number once.", "Each cage makes its number. Press Check."] },
    g5: { icon: "🃏", title: "Set", steps: ["Tap 3 cards.", "Each feature must be all the same or all different.", "Then say why it is a set."] },
    g6: { icon: "🧩", title: "Pentominoes", steps: ["Drag a piece into the box.", "Tap a piece, then Turn ⟳ or Flip ⇋ it.", "Fill every square of the box."] },
    g7: { icon: "🏔️", title: "Challenge of the week", steps: ["⭐ marks this week's challenge.", "Tap a box, then a number. Think, try, check!", "Then write it in your Solution Notebook."] },
    g8: { icon: "😈", title: "Number Devil corner", steps: ["Watch a surprising number fact.", "Answer the question.", "Tap ⭐ Wow! to save your favourites."] },
  },
  start: "g0",
  onStop() {
    token += 1;
    $("[data-panel]").onclick = null;
    stage.querySelector(".gm-real")?.remove();
  },
  subject: "Math",
  activity: "Math Games",
  onUnit(id) {
    token += 1;
    VOICE.hush();
    units[id]();
  },
});
MUSIC.preload("xylophone", NOTES);
MUSIC.preload("woodblock", [79, 84]);
</script>
