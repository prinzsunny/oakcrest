<script>
const { $, el, text, say, pick, pickInt, explain, everyday, emoji, shuffle } = KIT;
const UNITS = [
  { id: "t0", label: "See it", icon: "👀" },
  { id: "t1", label: "1. Ramp lab", icon: "🛝" },
  { id: "t2", label: "2. Shadow trick", icon: "🌳" },
  { id: "t3", label: "3. Wheel and wave", icon: "🎡" },
  { id: "t4", label: "4. Mixed puzzles", icon: "🧩" },
];
const B = IDEAS({
  title: "Triangles & Waves",
  counter: "trigonometry questions solved",
  explainPrompts: {
    t1: "Two ramps have the same rise but different runs. Which one is steeper, and why?",
    t2: "How can a short stick and its shadow tell you the height of a tall tree?",
    t3: "Why does the height of a seat on a Ferris wheel go up and down like a wave?",
    t4: "Pick one puzzle you solved. Tell a grown-up how a triangle helped you.",
  },
});
const { S, INK, fresh, tween, para, labPanel, questions, opts, numOpts } = B;
const BLUE = "#1e88e5";
const RED = "#e0603a";
const GREEN = "#43a047";
const ding = (m, o) => MUSIC.play("xylophone", Math.max(72, Math.min(96, Math.round(m))), o);
const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
const gcd = (a, b) => (b ? gcd(b, a % b) : Math.abs(a));
const frac = (n, d) => (n % d === 0 ? String(n / d) : `${n / gcd(n, d)}/${d / gcd(n, d)}`);
const deg = (r) => Math.round((r * 180) / Math.PI);

// ---------- pictures ----------
// A right triangle with run along the bottom and rise up the right side.
function rampPic(rise, run, { unit = 34, x0 = 30, y0 = 340, labels = true, color = "#ffcf5c", angle = true, g } = {}) {
  const draw = (gg) => {
    const u = Math.min(unit, 340 / run, 300 / rise);
    const [ax, ay, bx, cy] = [x0, y0, x0 + run * u, y0 - rise * u];
    el("polygon", { points: `${ax},${ay} ${bx},${ay} ${bx},${cy}`, fill: color, stroke: INK, "stroke-width": 4, "stroke-linejoin": "round" }, gg);
    el("rect", { x: bx - 18, y: ay - 18, width: 18, height: 18, fill: "none", stroke: INK, "stroke-width": 2.5 }, gg);
    if (angle) {
      const a = Math.atan2(rise, run);
      el("path", { d: `M${ax + 46} ${ay}A46 46 0 0 0 ${ax + 46 * Math.cos(a)} ${ay - 46 * Math.sin(a)}`, fill: "none", stroke: RED, "stroke-width": 3.5 }, gg);
    }
    if (labels) {
      text(gg, (ax + bx) / 2, ay + 30, `run ${run}`, { "font-size": 22, fill: INK });
      text(gg, bx + 12, (ay + cy) / 2 + 8, `rise ${rise}`, { "font-size": 22, fill: INK, "text-anchor": "start" });
    }
  };
  return g ? draw(g) : draw;
}
function shadowPic(stick, sShadow, tree, tShadow, { hideTree = false } = {}) {
  return (g) => {
    const k = 300 / Math.max(tree || stick * (tShadow / sShadow), sShadow + tShadow + 2);
    el("rect", { x: 0, y: 340, width: 400, height: 50, fill: "#c5e1a5" }, g);
    const tx = 60;
    const th = (tree || stick * (tShadow / sShadow)) * k;
    el("rect", { x: tx - 6, y: 340 - th * 0.45, width: 12, height: th * 0.45, fill: "#8d6e63" }, g);
    el("circle", { cx: tx, cy: 340 - th * 0.7, r: th * 0.3, fill: "#66bb6a", stroke: INK, "stroke-width": 2 }, g);
    el("rect", { x: tx, y: 340, width: tShadow * k, height: 10, fill: "#555", opacity: 0.5 }, g);
    text(g, tx + (tShadow * k) / 2, 380, `${tShadow} m`, { "font-size": 20, fill: INK });
    text(g, tx - 14, 340 - th / 2, hideTree ? "?" : `${tree} m`, { "font-size": 22, fill: RED, "text-anchor": "end" });
    const sx = 300;
    el("line", { x1: sx, y1: 340, x2: sx, y2: 340 - stick * k, stroke: "#6d4c41", "stroke-width": 6, "stroke-linecap": "round" }, g);
    el("rect", { x: sx, y: 340, width: sShadow * k, height: 10, fill: "#555", opacity: 0.5 }, g);
    text(g, sx - 10, 340 - (stick * k) / 2, `${stick} m`, { "font-size": 20, fill: INK, "text-anchor": "end" });
    text(g, sx + (sShadow * k) / 2, 380, `${sShadow} m`, { "font-size": 20, fill: INK });
    emoji(g, 30, 40, "☀️", 50);
  };
}
function clockPic(h, m) {
  return (g) => {
    el("circle", { cx: 200, cy: 200, r: 160, fill: "#fff", stroke: INK, "stroke-width": 6 }, g);
    range(1, 12).forEach((n) => text(g, 200 + 130 * Math.sin((n * Math.PI) / 6), 209 - 130 * Math.cos((n * Math.PI) / 6), n, { "font-size": 26, fill: INK }));
    const ha = ((h % 12) + m / 60) * (Math.PI / 6);
    const ma = (m / 60) * 2 * Math.PI;
    el("line", { x1: 200, y1: 200, x2: 200 + 80 * Math.sin(ha), y2: 200 - 80 * Math.cos(ha), stroke: INK, "stroke-width": 9, "stroke-linecap": "round" }, g);
    el("line", { x1: 200, y1: 200, x2: 200 + 120 * Math.sin(ma), y2: 200 - 120 * Math.cos(ma), stroke: BLUE, "stroke-width": 6, "stroke-linecap": "round" }, g);
    el("circle", { cx: 200, cy: 200, r: 8, fill: INK }, g);
  };
}
function wheelPic(r, centre, mark) {
  return (g) => {
    el("rect", { x: 0, y: 360, width: 400, height: 30, fill: "#c5e1a5" }, g);
    const k = 300 / (centre + r + 2);
    const cy = 360 - centre * k;
    el("circle", { cx: 170, cy, r: r * k, fill: "none", stroke: INK, "stroke-width": 5 }, g);
    el("path", { d: `M170 ${cy}L130 360M170 ${cy}L210 360`, stroke: "#8d6e63", "stroke-width": 6 }, g);
    const spots = { top: [0, -1], bottom: [0, 1], side: [1, 0] };
    for (const [name, [dx, dy]] of Object.entries(spots)) emoji(g, 170 + dx * r * k, cy + dy * r * k, name === mark ? "🧒" : "🪑", name === mark ? 36 : 22);
    text(g, 330, cy + 8, `centre ${centre} m`, { "font-size": 20, fill: INK });
    text(g, 330, cy + 38, `radius ${r} m`, { "font-size": 20, fill: INK });
  };
}

// ---------- 1. Ramp lab ----------
const RAMP = {
  easy: [
    () => {
      const rise = pickInt(2, 4);
      const [r1, r2] = shuffle([rise, rise + pickInt(2, 4)]);
      const steep = r1 < r2 ? "A" : "B";
      return { q: `Two ramps both rise ${rise} squares. Ramp A runs ${r1} squares, ramp B runs ${r2} squares. Which ramp is steeper?`, opts: ["A", "B"], ans: steep, pic: (g) => { rampPic(rise, r1, { x0: 10, y0: 170, unit: 22, color: "#ffcf5c" })(g); text(g, 20, 60, "A", { "font-size": 28, fill: RED }); rampPic(rise, r2, { x0: 10, y0: 370, unit: 22, color: "#90caf9" })(g); text(g, 20, 260, "B", { "font-size": 28, fill: RED }); }, idea: "Same rise, shorter run = steeper", hints: ["Both go up the same amount. Which one gets there in a shorter distance?"], sol: [`Both rise ${rise}.`, `Ramp ${steep} reaches that height in a shorter run, so it climbs faster: it is steeper.`] };
    },
    () => {
      const run = pickInt(3, 6);
      const [a, b] = shuffle([pickInt(1, 2), pickInt(4, 6)]);
      const steep = a > b ? "A" : "B";
      return { q: `Two ramps both run ${run} squares. Ramp A rises ${a}, ramp B rises ${b}. Which is steeper?`, opts: ["A", "B"], ans: steep, pic: (g) => { rampPic(a, run, { x0: 10, y0: 170, unit: 22 })(g); text(g, 20, 60, "A", { "font-size": 28, fill: RED }); rampPic(b, run, { x0: 10, y0: 370, unit: 22, color: "#90caf9" })(g); text(g, 20, 260, "B", { "font-size": 28, fill: RED }); }, idea: "Same run, bigger rise = steeper", hints: ["Which ramp goes higher in the same distance?"], sol: [`Ramp ${steep} rises ${Math.max(a, b)} in the same run, so it is steeper.`] };
    },
    () => ({ q: "The little square in the corner of this triangle marks a special angle. How many degrees is it?", ans: 90, pic: rampPic(pickInt(2, 5), pickInt(3, 6), { labels: false, angle: false }), idea: "A square corner is a right angle: 90°", hints: ["A square corner, like the corner of a book."], sol: ["The little square means a right angle.", "A right angle is 90 degrees: a quarter of a full turn."] }),
    () => {
      const t = pick([["a quarter turn", 90], ["a half turn", 180], ["a full turn", 360]]);
      return { q: `How many degrees are in ${t[0]}?`, opts: ["90", "180", "360", "45"], ans: String(t[1]), pic: (g) => { el("circle", { cx: 200, cy: 200, r: 150, fill: "#fff", stroke: INK, "stroke-width": 4 }, g); const a = (t[1] * Math.PI) / 180; el("path", { d: t[1] === 360 ? "M200 200m-150 0a150 150 0 1 0 300 0a150 150 0 1 0-300 0" : `M200 200L350 200A150 150 0 ${t[1] > 180 ? 1 : 0} 0 ${200 + 150 * Math.cos(a)} ${200 - 150 * Math.sin(a)}Z`, fill: "#ffcf5c", stroke: INK, "stroke-width": 3 }, g); }, idea: "A full turn is 360 degrees", hints: ["A full turn is 360°.", "A half is half of 360. A quarter is half of a half."], sol: ["Full turn: 360°.", "Half turn: 180°. Quarter turn: 90°.", `So ${t[0]} is ${t[1]}°.`] };
    },
    () => {
      const m = pickInt(1, 3);
      const run = pickInt(2, 4);
      return { q: `A staircase ramp goes up ${m} for every 1 step along. It is ${run} steps long. How high does it rise?`, ans: m * run, pic: rampPic(m * run, run), idea: "Rise = up-per-step × steps", hints: [`Each step along adds ${m} up.`, `Count up by ${m}, ${run} times.`], sol: [`Each step: up ${m}.`, `${run} steps: ${range(1, run).map(() => m).join(" + ")} = ${m * run}.`] };
    },
  ],
  medium: [
    () => {
      const rise = pickInt(1, 6);
      const run = pickInt(2, 8);
      return { q: `A ramp rises ${rise} and runs ${run}. What is its slope (rise ÷ run)?`, opts: opts(frac(rise, run), [frac(run, rise), frac(rise + 1, run), frac(rise, run + 1), String(rise + run)]), ans: frac(rise, run), pic: rampPic(rise, run), idea: "Slope = rise ÷ run", hints: ["Put the rise on top and the run on the bottom.", "Simplify if you can."], sol: [`Slope = ${rise} ÷ ${run} = ${rise}/${run}.`, frac(rise, run) !== `${rise}/${run}` ? `That simplifies to ${frac(rise, run)}.` : "It cannot be simplified."] };
    },
    () => {
      const a = pickInt(20, 70);
      return { q: `A right triangle has one angle of 90° and another of ${a}°. The three angles add to 180°. What is the third angle?`, ans: 90 - a, pic: rampPic(3, 5, { labels: false }), idea: "Angles in a triangle add to 180°", hints: [`180 − 90 − ${a}`], sol: [`180 − 90 = 90.`, `90 − ${a} = ${90 - a}°.`] };
    },
    () => {
      let ramps;
      do ramps = range(1, 4).map(() => { const r = pickInt(1, 6); const n = pickInt(2, 8); return [r, n, r / n]; });
      while (new Set(ramps.map((r) => r[2])).size < 4);
      const best = ramps.reduce((a, b) => (b[2] > a[2] ? b : a));
      const name = (r) => `rise ${r[0]}, run ${r[1]}`;
      return { q: "Which ramp is the steepest?", opts: ramps.map(name), ans: name(best), idea: "Compare rise ÷ run", hints: ["Work out rise ÷ run for each ramp.", "The biggest slope is the steepest."], sol: [ramps.map((r) => `${r[0]}/${r[1]}`).join(", ") + ".", `The biggest is ${best[0]}/${best[1]}, so ${name(best)} is steepest.`] };
    },
    () => {
      const run = pickInt(2, 6);
      const m = pickInt(2, 4);
      return { q: `A slide has slope ${m}: it goes up ${m} for every 1 along. Its run is ${run} m. How high is it?`, ans: m * run, pic: rampPic(m * run, run, { labels: false }), idea: "Rise = slope × run", hints: [`For every 1 along it goes up ${m}.`], sol: [`Rise = ${m} × ${run} = ${m * run} m.`] };
    },
    () => ({ q: "A ramp's rise and run are equal. What angle does it make with the ground?", opts: ["45°", "30°", "60°", "90°"], ans: "45°", pic: rampPic(4, 4), idea: "Equal rise and run cut a right angle in half", hints: ["The two small angles are equal, and together they make 90°."], sol: ["The triangle has two equal sides, so its two small angles are equal.", "They add to 90°, so each is 45°."] }),
  ],
  hard: [
    () => {
      const [a, b, c] = pick([[3, 4, 5], [6, 8, 10], [5, 12, 13], [8, 15, 17]]);
      return { q: `A right triangle has legs ${a} and ${b}. How long is the longest side? (a² + b² = c²)`, ans: c, pic: rampPic(a, b), idea: "Pythagoras: a² + b² = c²", hints: [`${a}² = ${a * a} and ${b}² = ${b * b}.`, "Add them, then find the square root."], sol: [`${a}² + ${b}² = ${a * a} + ${b * b} = ${c * c}.`, `√${c * c} = ${c}.`] };
    },
    () => {
      const h = pickInt(2, 12) * 2;
      return { q: `In a right triangle with a 30° angle, the side opposite 30° is half of the longest side. If the longest side is ${h}, how long is the side opposite 30°?`, ans: h / 2, pic: rampPic(2, 3.46, { labels: false }), idea: "sin 30° = 1/2", hints: [`Half of ${h}.`], sol: ["Opposite ÷ longest = sin 30° = 1/2.", `So the opposite side is ${h} ÷ 2 = ${h / 2}.`] };
    },
    () => {
      const [o, h] = pick([[3, 5], [5, 13], [8, 17], [4, 5]]);
      return { q: `In a right triangle, the side opposite angle A is ${o} and the longest side (hypotenuse) is ${h}. What is sin A = opposite ÷ hypotenuse?`, opts: opts(`${o}/${h}`, [`${h}/${o}`, `${Math.sqrt(h * h - o * o)}/${h}`, `${o}/${Math.sqrt(h * h - o * o)}`]), ans: `${o}/${h}`, idea: "SOH: sine = opposite ÷ hypotenuse", hints: ["Put the opposite side over the hypotenuse."], sol: [`sin A = ${o} ÷ ${h} = ${o}/${h}.`] };
    },
    () => {
      const [a, b] = pick([[3, 4], [5, 12], [8, 15], [6, 8]]);
      return { q: `In a right triangle, the side opposite angle A is ${a} and the side next to it is ${b}. What is tan A = opposite ÷ adjacent?`, opts: opts(frac(a, b), [frac(b, a), `${a}/${Math.hypot(a, b)}`, `${b}/${Math.hypot(a, b)}`]), ans: frac(a, b), pic: rampPic(a, b), idea: "TOA: tangent = opposite ÷ adjacent = the slope", hints: ["Tangent is the same as the ramp's slope: rise ÷ run."], sol: [`tan A = ${a} ÷ ${b} = ${frac(a, b)}.`, "Tangent is the slope of the ramp."] };
    },
    () => {
      const d = pickInt(3, 9) * 10;
      return { q: `You stand ${d} m from a tower and look up at its top at an angle of 45°. How tall is the tower (ignore your own height)?`, ans: d, idea: "At 45°, rise = run", hints: ["tan 45° = 1."], sol: ["At 45°, the triangle has equal legs.", `So the height equals the distance: ${d} m.`] };
    },
  ],
};

function ramps() {
  const my = S.token;
  const live = () => my === S.token;
  let rise = 2;
  let run = 6;
  let rolling = false;
  const draw = (ballT = null) => {
    if (!live()) return;
    const v = fresh();
    const u = Math.min(60, 760 / run, 420 / rise);
    const x0 = 70;
    const y0 = 480;
    const g = el("g", {}, v);
    rampPic(rise, run, { x0, y0, unit: u, g, labels: false });
    for (let i = 1; i < run; i++) el("line", { x1: x0 + i * u, y1: y0, x2: x0 + i * u, y2: y0 + 10, stroke: INK, "stroke-width": 2 }, v);
    text(v, x0 + (run * u) / 2, y0 + 40, `run ${run}`, { "font-size": 28, fill: INK });
    text(v, x0 + run * u + 14, y0 - (rise * u) / 2, `rise ${rise}`, { "font-size": 28, fill: INK, "text-anchor": "start" });
    const a = Math.atan2(rise, run);
    const bx = ballT == null ? x0 + run * u - 12 : x0 + run * u - (run * u) * ballT;
    const by = y0 - (bx - x0) * Math.tan(a) - 22;
    emoji(v, bx, by - 6, "⚽", 34);
    para(v, 640, 70, `Slope: ${rise} ÷ ${run} = ${frac(rise, run)}\nAngle: about ${deg(a)}°`, { size: 30, width: 340 });
  };
  draw();
  const lab = labPanel(
    [
      ["rise+", "⬆ Rise +1"],
      ["rise-", "⬇ Rise −1"],
      ["run+", "➡ Run +1"],
      ["run-", "⬅ Run −1"],
      ["roll", "⚽ Roll"],
    ],
    {
      onPress: async (k) => {
        if (rolling) return;
        if (k === "rise+") rise = Math.min(8, rise + 1);
        if (k === "rise-") rise = Math.max(1, rise - 1);
        if (k === "run+") run = Math.min(12, run + 1);
        if (k === "run-") run = Math.max(1, run - 1);
        if (k === "roll") {
          rolling = true;
          const ms = 2600 / Math.sqrt(Math.sin(Math.atan2(rise, run)) * 3);
          await tween(ms, (t) => draw(t * t), live);
          rolling = false;
          ding(72 + rise * 2, { gain: 0.35 });
          return say(rise >= run ? "Whoosh! A steep ramp makes the ball roll fast." : "A gentle ramp: the ball rolls slowly. Make it steeper and try again.");
        }
        draw();
        ding(70 + rise * 2, { gain: 0.3 });
        const a = deg(Math.atan2(rise, run));
        say(`Rise ${rise}, run ${run}. Slope ${frac(rise, run)}, angle about ${a} degrees. ${rise === run ? "Rise equals run: exactly 45 degrees!" : ""}`);
        if (rise === run) lab.pulse("__q");
      },
      onQuestions: () => questions("t1", RAMP, { label: "Ramp lab", real: { icon: "🏠", title: "Try it for real", need: ["a book or board", "a pile of books", "a toy car"], steps: ["Lean the board on one book. Roll the car down.", "Add another book: the rise gets bigger.", "Which ramp makes the car go furthest? Measure!"] } }),
    },
  );
  lab.pulse("rise+");
  say("Change the rise and the run to make the ramp steeper or gentler. Then press ⚽ Roll. Can you make the ramp exactly 45 degrees?");
}

// ---------- 2. Shadow trick (similar triangles) ----------
const SHADOW = {
  easy: [
    () => {
      const s = pickInt(1, 3);
      const k = pickInt(2, 4);
      const times = ["", "", "twice", "3 times", "4 times"][k];
      return { q: `A 1 m stick has a shadow ${s} m long. A wall nearby has a shadow ${s * k} m long: ${times} as long. How tall is the wall?`, ans: k, pic: shadowPic(1, s, k, s * k, { hideTree: true }), idea: `${times[0].toUpperCase() + times.slice(1)} the shadow, ${times} the height`, hints: [`The wall's shadow is ${k} times the stick's shadow.`], sol: ["Same sun, same time, so the shadows grow in the same way.", `The wall's shadow is ${k} times longer, so the wall is ${k} times taller: ${k} m.`] };
    },
    () => {

function shadows() {
  const my = S.token;
  let sun = 45;
  let stick = 2;
  const TREE = 8;
  const draw = () => {
    if (my !== S.token) return;
    const v = fresh();
    const k = 40;
    const ground = 480;
    el("rect", { x: 0, y: ground, width: 1000, height: 80, fill: "#c5e1a5" }, v);
    const a = (sun * Math.PI) / 180;
    const tx = 210;
    const tShadow = TREE / Math.tan(a);
    el("rect", { x: tx - 10, y: ground - TREE * k * 0.5, width: 20, height: TREE * k * 0.5, fill: "#8d6e63" }, v);
    el("circle", { cx: tx, cy: ground - TREE * k * 0.72, r: TREE * k * 0.28, fill: "#66bb6a", stroke: INK, "stroke-width": 3 }, v);
    el("polygon", { points: `${tx},${ground} ${tx},${ground - TREE * k} ${tx + Math.min(780, tShadow * k)},${ground}`, fill: "#ffcf5c", opacity: 0.35 }, v);
    el("line", { x1: tx, y1: ground + 6, x2: tx + Math.min(780, tShadow * k), y2: ground + 6, stroke: "#444", "stroke-width": 12, opacity: 0.5 }, v);
    const sx = 760;
    const sShadow = stick / Math.tan(a);
    el("line", { x1: sx, y1: ground, x2: sx, y2: ground - stick * k, stroke: "#6d4c41", "stroke-width": 8, "stroke-linecap": "round" }, v);
    el("line", { x1: sx, y1: ground + 22, x2: sx + Math.min(230, sShadow * k), y2: ground + 22, stroke: "#444", "stroke-width": 10, opacity: 0.5 }, v);
    emoji(v, 50, 40 + (75 - sun) * 3, "☀️", 60);
    el("line", { x1: 80, y1: 70 + (75 - sun) * 3, x2: 80 + 200 * Math.cos(a), y2: 70 + (75 - sun) * 3 + 200 * Math.sin(a), stroke: "#ffb300", "stroke-width": 3, "stroke-dasharray": "8 8" }, v);
    text(v, sx - 12, ground - (stick * k) / 2, `${stick} m`, { "font-size": 24, fill: INK, "text-anchor": "end" });
    para(v, 420, 40, `Sun height: ${sun}°\nStick ${stick} m → shadow ${sShadow.toFixed(1)} m\nTree ? m → shadow ${tShadow.toFixed(1)} m\nTree = ${stick} × ${tShadow.toFixed(1)} ÷ ${sShadow.toFixed(1)} = ${((stick * tShadow) / sShadow).toFixed(1)} m`, { size: 24, width: 520 });
  };
  draw();
  const lab = labPanel(
    [
      ["up", "☀️ Sun higher"],
      ["down", "🌅 Sun lower"],
      ["stick", "📏 Change stick"],
    ],
    {
      onPress: (k) => {
        if (k === "up") sun = Math.min(75, sun + 15);
        if (k === "down") sun = Math.max(15, sun - 15);
        if (k === "stick") stick = stick === 3 ? 1 : stick + 1;
        draw();
        ding(70 + sun / 5, { gain: 0.3 });
        say(k === "stick" ? "A different stick gives a different shadow, but the answer for the tree stays 8 m. The triangles are the same shape!" : `Sun at ${sun} degrees. The shadows change, but the tree's height always works out to 8 m.`);
        if (k === "stick") lab.pulse("__q");
      },
      onQuestions: () => questions("t2", SHADOW, { label: "Shadow trick", real: { icon: "🏠", title: "Try it for real", need: ["a sunny day", "a ruler", "a tape measure"], steps: ["Stand a ruler upright and measure its shadow.", "Measure the shadow of a tree, a lamp post or a grown-up.", "How many times longer is the big shadow? Multiply the ruler's height by that number."] } }),
    },
  );
  lab.pulse("up");
  say("The tree is too tall to measure. But a short stick and the sun can help! Move the sun and watch both shadows. The stick and the tree make triangles of the same shape.");
}

function wave() {
  const my = S.token;
  const live = () => my === S.token;
  let spinning = false;
  let speed = 1;
  let angle = 0;
  let trail = [];
  const R = 150;
  const CX = 210;
  const CY = 280;
  const draw = () => {
    if (!live()) return;
    const v = fresh();
    el("rect", { x: 0, y: 470, width: 1000, height: 90, fill: "#c5e1a5" }, v);
    el("path", { d: `M${CX} ${CY}L${CX - 90} 470M${CX} ${CY}L${CX + 90} 470`, stroke: "#8d6e63", "stroke-width": 10 }, v);
    el("circle", { cx: CX, cy: CY, r: R, fill: "none", stroke: INK, "stroke-width": 6 }, v);
    range(0, 7).forEach((i) => {
      const a = angle + (i * Math.PI) / 4;
      el("line", { x1: CX, y1: CY, x2: CX + R * Math.sin(a), y2: CY + R * Math.cos(a), stroke: "#bcaaa4", "stroke-width": 3 }, v);
      if (i) emoji(v, CX + R * Math.sin(a), CY + R * Math.cos(a), "🪑", 26);
    });
    const sx = CX + R * Math.sin(angle);
    const sy = CY + R * Math.cos(angle);
    emoji(v, sx, sy, "🧒", 40);
    el("line", { x1: sx, y1: sy, x2: 460, y2: sy, stroke: RED, "stroke-width": 2, "stroke-dasharray": "6 6" }, v);
    const G0 = 460;
    el("path", { d: `M${G0} ${CY - R - 20}V${CY + R + 20}M${G0} ${CY + R}H980`, stroke: INK, "stroke-width": 3, fill: "none" }, v);
    text(v, 720, 530, "time →", { "font-size": 22, fill: INK });
    text(v, G0 + 8, CY - R - 30, "height", { "font-size": 22, fill: INK, "text-anchor": "start" });
    if (trail.length > 1) el("path", { d: "M" + trail.map(([t, y]) => `${G0 + t} ${y}`).join("L"), fill: "none", stroke: BLUE, "stroke-width": 5, "stroke-linejoin": "round" }, v);
    el("circle", { cx: G0 + (trail.length ? trail[trail.length - 1][0] : 0), cy: sy, r: 9, fill: RED }, v);
  };
  draw();
  const loop = async () => {
    let last = performance.now();
    while (spinning && live()) {
      const now = await new Promise((r) => requestAnimationFrame(r));
      const dt = Math.min(50, now - last);
      last = now;
      angle += dt * 0.0016 * speed;
      const t = trail.length ? trail[trail.length - 1][0] + dt * 0.06 * speed : 0;
      if (t > 510) {
        spinning = false;
        lab.btn("spin").textContent = "▶ Spin";
        say("See the blue line? Up, down, up, down: a wave! This wave is called a sine wave. It comes from turning in a circle. Press Questions ▶ when ready.");
        lab.pulse("__q");
        break;
      }
      trail.push([t, CY + R * Math.cos(angle)]);
      draw();
      if (Math.abs(Math.cos(angle) + 1) < 0.002 * speed) ding(88, { gain: 0.25 });
    }
  };
  const lab = labPanel(
    [
      ["spin", "▶ Spin"],
      ["fast", "⏩ Faster"],
      ["reset", "↺"],
    ],
    {
      onPress: (k, btn) => {
        if (k === "spin") {
          spinning = !spinning;
          btn.textContent = spinning ? "⏸ Pause" : "▶ Spin";
          if (spinning) {
            if (trail.length && trail[trail.length - 1][0] > 510) trail = [];
            say("Watch the red dot follow the child's height. The blue line draws the height over time.");
            loop();
          }
        }
        if (k === "fast") {
          speed = speed >= 3 ? 1 : speed + 1;
          btn.textContent = speed === 3 ? "🐢 Slower" : "⏩ Faster";
          say(speed > 1 ? "Faster turning makes the waves closer together." : "Back to slow.");
        }
        if (k === "reset") {
          spinning = false;
          trail = [];
          angle = 0;
          lab.btn("spin").textContent = "▶ Spin";
          draw();
        }
      },
      onQuestions: () => {
        spinning = false;
        questions("t3", WAVE, { label: "Wheel and wave", real: { icon: "🏠", title: "Try it for real", need: ["a bicycle wheel or a plate", "a sticker", "paper and a crayon"], steps: ["Put a sticker on the edge of the wheel.", "Turn it slowly and call out: high, middle, low, middle, high…", "Draw the heights on paper as you go. Do you get a wave?"] } });
      },
    },
  );
  lab.pulse("spin");
  say("A Ferris wheel! Press ▶ Spin and watch how the child's height goes up and down. A graph draws itself on the right.");
}

function mixed() {
