<script>const { $, el, svg: makeSvg, text, panel, say, sayAsync, pick, pickInt, wait, confetti, choices, explain, everyday, emoji, numpad, shuffle } = KIT;
const stage = $("[data-stage]");
const W = 1000;
const H = 560;
let token = 0;
let view = null;

const UNITS = [
  { id: "md0", label: "See it", icon: "👀" },
  { id: "md1", label: "1. Times tables to 12", icon: "✖️" },
  { id: "md2", label: "2. Area model", icon: "🟧" },
  { id: "md3", label: "3. Column multiplication", icon: "🧮" },
  { id: "md4", label: "4. Long division", icon: "➗" },
  { id: "md5", label: "5. Order of operations", icon: "🪜" },
  { id: "md6", label: "6. Mental strategies", icon: "🧠" },
  { id: "md7", label: "7. Word problems", icon: "📝" },
];

const INK = "#2b1d12";
const MUTED = "#8a7258";
const SOFT = "#fffaf0";
const ROWC = ["#a9d4f5", "#9fd3a8", "#f4c58a"];
const ROWD = ["#1e6fb0", "#2e7d46", "#a8632d"];
const EFFORT = ["Correct.", "Correct — well reasoned.", "Correct. Your method was sound.", "Correct, and carefully done.", "Correct. Note the strategy you used."];
const TRY = ["Not quite. Consider this:", "Not quite. Mistakes are how we learn. Consider this:", "Not quite. Think it through again:"];

function fresh() {
  stage.innerHTML = "";
  view = makeSvg(`0 0 ${W} ${H}`, stage);
  return view;
}
const T = (p, x, y, s, size, fill = INK, extra = {}) => text(p, x, y, s, { "font-size": size, fill, ...extra });
const fmt = (n) => Number(n).toLocaleString("en-US");
const sum = (list) => list.reduce((a, b) => a + b, 0);
const digitsR = (n) => String(n).split("").reverse().map(Number);
// 345 -> [300, 40, 5] (zero parts left out)
const expand = (n) => String(n).split("").map((d, i, s) => Number(d) * 10 ** (s.length - 1 - i)).filter((x) => x > 0);
const lead = (n) => [Number(String(n)[0]), String(n).length - 1];
const SUP = "⁰¹²³⁴⁵⁶⁷⁸⁹";
const sup = (e) => String(e).split("").map((d) => SUP[d]).join("");
const powWords = (b, e) => (e === 2 ? `${b} squared` : e === 3 ? `${b} cubed` : `${b} to the power ${e}`);
function wrap(str, max) {
  const out = [];
  for (const w of String(str).split(" ")) {
    const last = out[out.length - 1];
    if (last !== undefined && (last + " " + w).length <= max) out[out.length - 1] = last + " " + w;
    else out.push(w);
  }
  return out;
}
function para(p, x, y, str, { size = 28, max = 40, lh = 1.32, anchor = "start", fill = INK, weight = 700 } = {}) {
  const ls = wrap(str, max);
  ls.forEach((l, i) => T(p, x, y + i * size * lh, l, size, fill, { "text-anchor": anchor, "font-weight": weight }));
  return ls.length;
}
const svgPt = (e) => {
  const p = view.createSVGPoint();
  p.x = e.clientX;
  p.y = e.clientY;
  return p.matrixTransform(view.getScreenCTM().inverse());
};
const tween = (ms, fn, alive) =>
  new Promise((resolve) => {
    if (KIT.still.matches) {
      fn(1);
      return resolve(true);
    }
    const t0 = performance.now();
    const frame = (now) => {
      if (!alive()) return resolve(false);
      const t = Math.min(1, (now - t0) / ms);
      fn(t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
      if (t < 1) requestAnimationFrame(frame);
      else resolve(true);
    };
    requestAnimationFrame(frame);
  });

// Panel pieces shared by the games: grade chips, a status line, and one input area.
const LEVELS = [["g4", "🐣 Grade 4"], ["g5", "🦊 Grade 5–6"], ["g6", "🦁 Grade 7–8"]];
const levelRow = (cur) => `<div class="ap-row"><div class="ap-chips" data-levels>${LEVELS.map(([k, l]) => `<button type="button" data-lv="${k}" aria-pressed="${k === cur}">${l}</button>`).join("")}</div><p class="ap-status" data-status></p></div><div class="md-in" data-input></div>`;
const onLevels = (id, fn) =>
  $("[data-levels]").addEventListener("click", (event) => {
    const b = event.target.closest("[data-lv]");
    if (!b) return;
    document.querySelectorAll("[data-lv]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    shell.mark(id, { level: b.dataset.lv });
    window.OC?.touch();
    fn(b.dataset.lv);
  });
const status = (s) => {
  const b = $("[data-status]");
  if (b) b.textContent = s;
};
const input = () => $("[data-input]");
const askNum = (fn, max = 6) => numpad(input(), { onEnter: fn, max });
const askPick = (opts, fn) => choices(input(), opts, fn);
const askNext = (label, fn) => {
  const h = input();
  h.innerHTML = `<div class="ap-buttons"><button type="button" class="primary" data-go>${label}</button></div>`;
  h.onclick = (e) => {
    if (!e.target.closest("[data-go]")) return;
    h.onclick = null;
    window.OC?.touch();
    fn();
  };
};

// Struggle first: a first miss gets a question to think about; a second miss shows the answer and why.
async function miss(g, hint, why) {
  g.tries += 1;
  g.clean = false;
  MUSIC.oops();
  window.OC?.touch();
  if (g.tries < 2) {
    say(`${pick(TRY)} ${hint}`);
    return false;
  }
  g.tries = 0;
  await sayAsync(`Here is the reasoning. ${why}`);
  await wait(500);
  return true;
}
const newGame = () => ({ round: 0, tries: 0, clean: true, firsts: 0 });

const REAL = {
  md1: { title: "Make a times-table poster", things: ["paper", "ruler", "colored pencils"], steps: ["Draw a 12 by 12 grid and fill in every fact you know.", "Color the square numbers on the diagonal, and the 9s row.", "Find a pattern and explain it to a grown-up."], safe: "Ask a grown-up before using markers." },
  md2: { title: "Area model on grid paper", things: ["grid paper", "pencil", "safety scissors"], steps: ["Draw a rectangle 23 squares wide and 14 squares tall.", "Cut it into 4 parts: 20 and 3 across, 10 and 4 down.", "Find each part, add them, and check you get 322."], safe: "Use safety scissors with a grown-up nearby." },
  md3: { title: "Party shopping list", things: ["paper", "pencil", "a shop flyer"], steps: ["Pick 3 things a party needs, like cups or balloons.", "Find the cost of 12 of each with the column method.", "Ask a grown-up to check your totals on a calculator."], safe: "Just pretend shopping. Talk about prices with a grown-up." },
  md4: { title: "Bean sharing", things: ["100 dried beans", "7 cups", "paper"], steps: ["Count out 100 beans.", "Share them into 7 cups so every cup gets the same.", "How many in each cup? How many left? Check: 7 × 14 + 2 = 100."], safe: "Do it with a grown-up. Keep beans away from little children." },
  md5: { title: "Make 24 card game", things: ["number cards 1 to 10", "paper", "pencil"], steps: ["Turn over 4 cards.", "Use + − × ÷ and parentheses to make 24 with all 4 cards.", "Write it down and check the order of operations."], safe: "Play together with a grown-up or a friend." },
  md6: { title: "Shopping estimate", things: ["a shopping trip or a receipt", "paper", "pencil"], steps: ["Round each price to the nearest dollar.", "Add the rounded prices to estimate the total.", "Compare with the real total. How close were you?"], safe: "Stay with your grown-up in the shop." },
  md7: { title: "Cook for a crowd", things: ["a simple recipe", "paper", "pencil"], steps: ["Pick a recipe and see how many people it serves.", "Work out every amount for 3 times as many people.", "Make it together and share it!"], safe: "Use the stove, oven and knives only with a grown-up." },
};

function drawReal(real) {
  fresh();
  el("rect", { x: 50, y: 18, width: 900, height: 524, rx: 30, fill: SOFT, stroke: "var(--accent)", "stroke-width": 5 }, view);
  T(view, 500, 78, "🏠 Try it for real", 40);
  T(view, 500, 122, real.title, 30, "var(--accent-dark)");
  T(view, 500, 168, "You need: " + real.things.join(" · "), 24, MUTED);
  let y = 224;
  real.steps.forEach((s, i) => {
    el("circle", { cx: 110, cy: y - 9, r: 19, fill: "var(--accent)" }, view);
    T(view, 110, y, i + 1, 24, "#fff");
    const n = para(view, 145, y, s, { size: 26, max: 52 });
    y += n * 34 + 18;
  });
  el("rect", { x: 90, y: 456, width: 820, height: 62, rx: 18, fill: "#fdeccf" }, view);
  T(view, 500, 496, "⚠️ " + real.safe, 23, "#7a4520");
}

// "Explain it": putting the reasoning into words is part of every game.
const EXPLAIN = {
  md0: { q: "Why does splitting 23 × 14 into four rectangles give the same answer as the whole rectangle?", start: "The four parts together…" },
  md1: { q: "Why does the ×9 finger trick work? Use the fact that 9 × n = 10 × n − n.", start: "Nine is one less than ten, so…" },
  md2: { q: "Why do the partial products (the answers for each part) add up to the whole product? Use the word area.", start: "The rectangle's area…" },
  md3: { q: "What does carrying really mean in terms of place value (ones, tens, hundreds)?", start: "When a column makes 10 or more…" },
  md4: { q: "How can multiplication check a division answer, and what exactly does the remainder (the amount left over) tell us?", start: "To check, I multiply…" },
  md5: { q: "Why must everyone agree on one order of operations? Give an example where a different order changes the answer.", start: "Without an agreed order…" },
  md6: { q: "Why does doubling one factor and halving the other leave the product unchanged? Think about the rectangle.", start: "The rectangle gets…" },
  md7: { q: "Choose one problem you solved. Explain your plan: what you found first, and why that step was needed.", start: "First I needed to know…" },
};
function drawExplain(id) {
  fresh();
  const e = EXPLAIN[id];
  el("rect", { x: 50, y: 18, width: 900, height: 524, rx: 30, fill: "#f4f8fd", stroke: "#1e6fb0", "stroke-width": 5 }, view);
  T(view, 500, 82, "🗣️ Explain it", 40);
  const n = para(view, 500, 150, e.q, { size: 31, max: 46, anchor: "middle" });
  const y = 150 + n * 41 + 30;
  T(view, 500, y, "Say it aloud to a grown-up, or write it, in 2–4 full sentences.", 24, MUTED);
  el("rect", { x: 150, y: y + 30, width: 700, height: 64, rx: 18, fill: "#fff", stroke: "#c9d8ea", "stroke-width": 2 }, view);
  T(view, 500, y + 72, `Begin: “${e.start}”`, 26, "#1e6fb0");
}

function finish(id, total, g, real) {
  confetti();
  MUSIC.chime();
  shell.mark(id, { done: true });
  drawExplain(id);
  const host = panel(`<div class="ap-buttons"><button type="button" class="primary" data-explained>✓ I have explained it</button></div>`);
  say(`All ${total} complete. ${g.firsts >= total * 0.7 ? "Your methods were careful and consistent." : "You persisted through the difficult ones, which is how understanding grows."} Now explain the idea in your own words.`);
  host.onclick = (e) => {
    if (e.target.closest("[data-explained]")) {
      window.OC?.touch();
      window.OC?.count("explanations");
      drawReal(real);
      host.innerHTML = `<p class="ap-say" data-say></p><div class="ap-buttons"><button type="button" class="primary" data-again>🔁 Play again</button></div>`;
      say("Well articulated. Here is a way to use this idea away from the screen.");
      return;
    }
    if (!e.target.closest("[data-again]")) return;
    host.onclick = null;
    token += 1;
    VOICE.hush();
    units[id]();
  };
}

// ---------- See it pictures ----------
function areaBase(v, { k = 20, x0 = 150, y0 = 100, split = true } = {}) {
  el("rect", { x: x0, y: y0, width: 23 * k, height: 14 * k, fill: SOFT, stroke: "#5a4130", "stroke-width": 3 }, v);
  for (let i = 1; i < 23; i++) el("line", { x1: x0 + i * k, x2: x0 + i * k, y1: y0, y2: y0 + 14 * k, stroke: "#e6dccd", "stroke-width": 1.5 }, v);
  for (let j = 1; j < 14; j++) el("line", { x1: x0, x2: x0 + 23 * k, y1: y0 + j * k, y2: y0 + j * k, stroke: "#e6dccd", "stroke-width": 1.5 }, v);
  if (!split) return;
  el("line", { x1: x0 + 20 * k, x2: x0 + 20 * k, y1: y0, y2: y0 + 14 * k, stroke: "var(--accent)", "stroke-width": 6 }, v);
  el("line", { x1: x0, x2: x0 + 23 * k, y1: y0 + 10 * k, y2: y0 + 10 * k, stroke: "var(--accent)", "stroke-width": 6 }, v);
  T(v, x0 + 10 * k, y0 - 16, "20", 30, "var(--accent-dark)");
  T(v, x0 + 21.5 * k, y0 - 16, "3", 30, "var(--accent-dark)");
  T(v, x0 - 16, y0 + 5 * k + 10, "10", 30, "var(--accent-dark)", { "text-anchor": "end" });
  T(v, x0 - 16, y0 + 12 * k + 10, "4", 30, "var(--accent-dark)", { "text-anchor": "end" });
}
function flat(p, x, y) {
  const g = el("g", { transform: `translate(${x} ${y})` }, p);
  el("rect", { width: 100, height: 100, rx: 4, fill: "#f2c94c", stroke: "#a8632d", "stroke-width": 2 }, g);
  for (let i = 1; i < 10; i++) {
    el("line", { x1: i * 10, x2: i * 10, y1: 0, y2: 100, stroke: "#d9a441", "stroke-width": 1 }, g);
    el("line", { x1: 0, x2: 100, y1: i * 10, y2: i * 10, stroke: "#d9a441", "stroke-width": 1 }, g);
  }
  return g;
}
function rod(p, x, y) {
  const g = el("g", { transform: `translate(${x} ${y})` }, p);
  el("rect", { width: 11, height: 100, rx: 2, fill: "#9fd3a8", stroke: "#3f7d4e", "stroke-width": 1.5 }, g);
  for (let i = 1; i < 10; i++) el("line", { x1: 0, x2: 11, y1: i * 10, y2: i * 10, stroke: "#3f7d4e", "stroke-width": 0.8 }, g);
  return g;
}
function cube(p, x, y) {
  const g = el("g", { transform: `translate(${x} ${y})` }, p);
  el("rect", { width: 11, height: 11, rx: 2, fill: "#a9d4f5", stroke: "#1e6fb0", "stroke-width": 1.5 }, g);
  return g;
}

const units = {
  md0() {
    const my = token;
    const move = (api, g, [x0, y0], [x1, y1], ms) => api.tween(ms, (t) => g.setAttribute("transform", `translate(${x0 + (x1 - x0) * t} ${y0 + (y1 - y0) * t - Math.sin(t * Math.PI) * 40})`));
    explain(
      [
        { say: "Why master large multiplication and division? Scaling recipes, packing boxes, sharing bills and planning trips all depend on them. Ancient Egyptian scribes multiplied by repeated doubling.", draw: everyday([["🥞", "Recipes for a crowd"], ["📦", "Packing boxes"], ["🍕", "Sharing costs"], ["🚌", "Buses for a trip"]]) },
        {
          say: "Multiplication can be pictured as area. A rectangle 23 units wide and 14 tall has area 23 × 14. Decompose (break apart) each side by place value: 23 = 20 + 3 and 14 = 10 + 4.",
          async draw(v, api) {
            const k = 20;
            const x0 = 150;
            const y0 = 100;
            const grid = el("g", { opacity: 0 }, v);
            areaBase(grid, { split: false });
            const w23 = T(grid, x0 + 11.5 * k, y0 - 16, "23", 32, INK);
            const h14 = T(grid, x0 - 16, y0 + 7 * k + 10, "14", 32, INK, { "text-anchor": "end" });
            await api.tween(1000, (t) => grid.setAttribute("opacity", t));
            await api.wait(900);
            const vl = el("line", { x1: x0 + 20 * k, x2: x0 + 20 * k, y1: y0, y2: y0, stroke: "var(--accent)", "stroke-width": 6, "stroke-linecap": "round" }, v);
            await api.tween(1000, (t) => vl.setAttribute("y2", y0 + t * 14 * k));
            w23.remove();
            T(v, x0 + 10 * k, y0 - 16, "20", 30, "var(--accent-dark)");
            T(v, x0 + 21.5 * k, y0 - 16, "3", 30, "var(--accent-dark)");
            const n1 = T(v, 800, 220, "23 = 20 + 3", 36, INK, { opacity: 0 });
            await api.tween(600, (t) => n1.setAttribute("opacity", t));
            await api.wait(800);
            const hl = el("line", { x1: x0, x2: x0, y1: y0 + 10 * k, y2: y0 + 10 * k, stroke: "var(--accent)", "stroke-width": 6, "stroke-linecap": "round" }, v);
            await api.tween(1000, (t) => hl.setAttribute("x2", x0 + t * 23 * k));
            h14.remove();
            T(v, x0 - 16, y0 + 5 * k + 10, "10", 30, "var(--accent-dark)", { "text-anchor": "end" });
            T(v, x0 - 16, y0 + 12 * k + 10, "4", 30, "var(--accent-dark)", { "text-anchor": "end" });
            const n2 = T(v, 800, 290, "14 = 10 + 4", 36, INK, { opacity: 0 });
            await api.tween(600, (t) => n2.setAttribute("opacity", t));
            const n3 = T(v, 800, 380, "four simpler products", 32, "var(--accent-dark)", { opacity: 0 });
            await api.wait(500);
            await api.tween(600, (t) => n3.setAttribute("opacity", t));
          },
        },
        {
          say: "Each smaller rectangle is a simple product: 200, 80, 30 and 12. These are called partial products. Their sum is the whole area: 23 × 14 = 322.",
          async draw(v, api) {
            const k = 20;
            const x0 = 150;
            const y0 = 100;
            areaBase(v);
            const fills = el("g", {}, v);
            v.insertBefore(fills, v.firstChild.nextSibling);
            const parts = [
              [0, 0, 20, 10, "200", "20 × 10 = 200", "#f2c94c"],
              [0, 10, 20, 4, "80", "20 × 4 = 80", "#9fd3a8"],
              [20, 0, 3, 10, "30", "3 × 10 = 30", "#a9d4f5"],
              [20, 10, 3, 4, "12", "3 × 4 = 12", "#f4b6c2"],
            ];
            for (let i = 0; i < parts.length; i++) {
              const [px, py, pw, ph, val, line, color] = parts[i];
              const r = el("rect", { x: x0 + px * k, y: y0 + py * k, width: pw * k, height: ph * k, fill: color, opacity: 0 }, fills);
              const lbl = T(v, x0 + (px + pw / 2) * k, y0 + (py + ph / 2) * k + 12, val, pw > 5 ? 40 : 28, INK, { opacity: 0 });
              const row = T(v, 960, 150 + i * 56, line, 30, INK, { "text-anchor": "end", opacity: 0 });
              await api.tween(800, (t) => {
                r.setAttribute("opacity", t * 0.85);
                lbl.setAttribute("opacity", t);
                row.setAttribute("opacity", t);
              });
              MUSIC.play("xylophone", 72 + i * 4, { gain: 0.35 });
              await api.wait(700);
            }
            el("line", { x1: 720, x2: 965, y1: 360, y2: 360, stroke: INK, "stroke-width": 3 }, v);
            const tot = T(v, 960, 410, "total 322", 40, "var(--accent-dark)", { "text-anchor": "end", opacity: 0 });

      if (note) note.split("\n").forEach((l, i) => T(info, 800, 300 + i * 40, l, 28, "var(--accent-dark)"));
    };
    const draw = () => {
      fresh();
      Y = String(q.b).length > 2 ? { carry: 78, top: 132, bot: 194, line: 214, rows: [264, 316, 368], line2: 390, sum: 444 } : { carry: 92, top: 152, bot: 220, line: 242, rows: [302, 366], line2: 390, sum: 452 };
      hlTop = el("rect", { width: 52, height: 62, rx: 12, fill: "#fde68a", opacity: 0 }, view);
      hlBot = el("rect", { width: 52, height: 62, rx: 12, fill: "#f9c6d0", opacity: 0 }, view);
      digitsR(q.a).forEach((d, i) => put(Y.top, i, d));
      digitsR(q.b).forEach((d, i) => put(Y.bot, i, d));
      T(view, cx(String(q.b).length) - 4, Y.bot, "×", FS);
      const width = String(q.a * q.b).length + 1;
      el("line", { x1: cx(width) + 10, x2: RX + 32, y1: Y.line, y2: Y.line, stroke: INK, "stroke-width": 4 }, view);
      el("rect", { x: 610, y: 30, width: 370, height: 500, rx: 26, fill: SOFT, stroke: "#eadcc6", "stroke-width": 2 }, view);
      info = el("g", {}, view);
    };
    const mark = (rect, col, y) => {
      rect.setAttribute("x", cx(col) - 26);
      rect.setAttribute("y", y - 46);
      rect.setAttribute("opacity", 1);
    };
    const build = () => {
      const td = digitsR(q.a);
      const bd = digitsR(q.b);
      const out = [];
      bd.forEach((b, r) => {
        let carry = 0;
        td.forEach((t, i) => {
          const v = b * t + carry;
          out.push({ kind: "mul", r, i, b, t, carry, v, last: i === td.length - 1 });
          carry = Math.floor(v / 10);
        });
      });
      if (bd.length > 1) out.push({ kind: "sum" });
      return out;
    };
    const ask = () => {
      if (my !== token) return;
      q = make();
      steps = build();
      si = 0;
      g.clean = true;
      carryEls = [];
      draw();
      status(`Problem ${g.round + 1} of ${ROUNDS}`);
      next(true);
    };
    const next = async (first = false) => {
      if (my !== token) return;
      if (si >= steps.length) return solved();
      const s = steps[si];
      g.tries = 0;
      busy = false;
      if (s.kind === "mul") {
        if (s.i === 0) {
          carryEls.forEach((c) => c.remove());
          carryEls = [];
          if (s.r > 0) {
            busy = true;
            for (let z = 0; z < s.r; z++) put(Y.rows[s.r], z, "0", "#b9a58a");
            hlTop.setAttribute("opacity", 0);
            mark(hlBot, s.r, Y.bot);
            infoSet(`Row ${s.r + 1}: the ${PLACE[s.r]} digit`, `${s.b} ${PLACE[s.r]} = ${fmt(s.b * 10 ** s.r)}`, `write ${s.r === 1 ? "a 0" : "two 0s"} as\nplaceholder${s.r === 1 ? "" : "s"} first`);
            await sayAsync(`Now multiply by the ${s.b} in the ${['ones','tens','hundreds'][s.r]} place. Its value is ${s.b * 10 ** s.r}, so first write ${s.r === 1 ? 'a zero' : s.r + ' zeros'} as a placeholder.`);
            if (my !== token) return;
            busy = false;
          }
        }
        mark(hlTop, s.i, Y.top);
        mark(hlBot, s.r, Y.bot);
        infoSet(rowHead(s), s.carry ? `${s.b} × ${s.t} + ${s.carry}` : `${s.b} × ${s.t}`, "= ?");
        say(first && g.round === 0 ? `Begin with the ones column. What is ${s.b} × ${s.t}?` : s.carry ? `What is ${s.b} × ${s.t}, plus the carried ${s.carry}?` : `What is ${s.b} × ${s.t}?`);
        askNum(answer, 3);
      } else {
        hlTop.setAttribute("opacity", 0);
        hlBot.setAttribute("opacity", 0);
        const rows = digitsR(q.b).map((b, r) => q.a * b * 10 ** r);
        const width = String(q.a * q.b).length + 1;
        el("line", { x1: cx(width) + 10, x2: RX + 32, y1: Y.line2, y2: Y.line2, stroke: INK, "stroke-width": 4 }, view);
        T(view, cx(width) + 6, Y.rows[rows.length - 1], "+", FS);
        infoSet(`Add the ${rows.length} rows`, rows.map(fmt).join(" + "), "= ?");
        say(`Now add the ${rows.length === 2 ? "two" : "three"} rows. What is the total?`);
        askNum(answer, 6);
      }
    };
    const write = (s) => {
      const y = Y.rows[s.r];
      if (s.last) {
        put(y, s.i + s.r, s.v % 10);
        if (s.v >= 10) put(y, s.i + s.r + 1, Math.floor(s.v / 10));
      } else {
        put(y, s.i + s.r, s.v % 10);
        if (s.v >= 10) carryEls.push(T(view, cx(s.i + 1), Y.carry, Math.floor(s.v / 10), 30, "#d0573a"));
      }
    };
    const answer = async (v) => {
      if (my !== token || busy) return;
      const s = steps[si];
      window.OC?.touch();
      const want = s.kind === "mul" ? s.v : q.a * q.b;
      const ok = v === want;
      busy = true;
      if (!ok) {
        const rows = digitsR(q.b).map((b, r) => q.a * b * 10 ** r);
        const hint = s.kind === "sum" ? "Align the columns and add from the ones place. What does the ones column give?" : s.carry ? `What is ${s.b} × ${s.t} alone? Then include the carried ${s.carry}.` : `Consider ${s.b} groups of ${s.t}. Which nearby fact do you know?`;
        const why = s.kind === "sum" ? `${rows.map(fmt).join(" + ")} = ${fmt(want)}.` : `${s.b} × ${s.t} = ${s.b * s.t}${s.carry ? `, plus ${s.carry} makes ${s.v}` : ""}.`;
        const revealed = await miss(g, hint, why);
        if (my !== token) return;
        if (!revealed) {
          busy = false;
          return askNum(answer, s.kind === "sum" ? 6 : 3);
        }
      } else MUSIC.play("xylophone", 76 + (si % 6) * 2, { gain: 0.4 });
      if (s.kind === "mul") {
        write(s);
        const msg = s.last ? `Write ${s.v}.` : s.v >= 10 ? `Write ${s.v % 10}, carry ${Math.floor(s.v / 10)}.` : `Write ${s.v}.`;
        infoSet(rowHead(s), s.carry ? `${s.b} × ${s.t} + ${s.carry}` : `${s.b} × ${s.t}`, `= ${s.v}\n${msg.replace(".", "")}`);
        await sayAsync(ok ? `${s.v}. ${msg}` : msg);
      } else {
        digitsR(want).forEach((d, i) => put(Y.sum, i, d, "var(--accent-dark)"));
      }
      if (my !== token) return;
      si += 1;
      next();
    };
    const solved = async () => {
      busy = true;
      hlTop.setAttribute("opacity", 0);
      hlBot.setAttribute("opacity", 0);
      MUSIC.chime();
      if (g.clean) g.firsts += 1;
      window.OC?.count("multiplications");
      const ra = Number(String(q.a)[0]) * 10 ** (String(q.a).length - 1) + (Number(String(q.a)[1]) >= 5 ? 10 ** (String(q.a).length - 1) : 0);
      const rb = q.b < 10 ? q.b : Math.round(q.b / 10) * 10;
      infoSet("Check with an estimate", `${fmt(ra)} × ${rb} = ${fmt(ra * rb)}`, `same order of size,\nso it is reasonable`);
      say(`${pick(EFFORT)} ${q.a} × ${q.b} = ${fmt(q.a * q.b)}. An estimate checks it: about ${fmt(ra)} × ${rb} = ${fmt(ra * rb)}, the same order of size, so the exact answer is reasonable.`);
      askNext(g.round + 1 >= ROUNDS ? "Finish ▶" : "Next ▶", () => {
        if (my !== token) return;
        g.round += 1;
        if (g.round >= ROUNDS) return finish("md3", ROUNDS, g, REAL.md3);
        ask();
      });
    };
    onLevels("md3", (lv) => {
      level = lv;
      g = newGame();
      ask();
    });
    window.__md3 = { state: () => ({ q, step: steps[si], si, n: steps.length }) };
    ask();
  },

  // ---------- Long division ----------
  md4() {
    const my = token;
    let level = shell.progress().md4?.level || "g4";
    let g = newGame();
    const ROUNDS = 6;
    let q;
    let si = 0;
    let busy = false;
    let phase = "q";
    let L;
    let info;
    let pills = [];
    panel(levelRow(level));
    const STORIES = [
      { kind: "up", icon: "🚐", text: (N, d) => `${N} campers go on a trip. Each van holds ${d} campers. How many vans are needed?`, ask: "How many vans are needed?", unit: "vans", why: (q, r) => `${q} vans are full, but ${r} campers are still waiting, so they need one more van.` },
      { kind: "down", icon: "🥚", text: (N, d) => `You pack ${N} eggs into boxes of ${d}. How many boxes can you fill all the way?`, ask: "How many full boxes?", unit: "boxes", why: (q, r) => `The ${r} extra eggs do not fill a box, so only ${q} boxes are full.` },
      { kind: "rem", icon: "⭐", text: (N, d) => `${N} stickers are shared equally by ${d} children. How many stickers are left over?`, ask: "How many are left over?", unit: "stickers", why: (q, r) => `Each child gets ${q}, and the remainder ${r} is what is left over.` },
      { kind: "down", icon: "🧵", text: (N, d) => `A tailor has ${N} cm of cloth. Each costume needs ${d} cm. How many complete costumes can be made?`, ask: "How many complete costumes?", unit: "costumes", why: (q, r) => `The last ${r} cm is not enough for a costume, so only ${q} can be completed.` },
      { kind: "rem", icon: "🃏", text: (N, d) => `${N} cards are dealt equally to ${d} players until no more full rounds are possible. How many cards remain undealt?`, ask: "How many cards remain?", unit: "cards", why: (q, r) => `Each player receives ${q}; the remainder, ${r}, is undealt.` },
      { kind: "up", icon: "⛵", text: (N, d) => `${N} visitors must cross a lake. A boat carries ${d} visitors per trip. How many trips are required?`, ask: "How many trips?", unit: "trips", why: (q, r) => `${q} full trips leave ${r} visitors on shore, so one more trip is required.` },
      { kind: "up", icon: "📚", text: (N, d) => `A shelf holds ${d} books. You have ${N} books. How many shelves do you need for all of them?`, ask: "How many shelves?", unit: "shelves", why: (q, r) => `${q} shelves are full, and ${r} books still need a shelf, so one more.` },
    ];
    const make = () => {
      const story = g.round === 2 || g.round === 5 ? pick(STORIES) : null;
      let N;
      let d;
      do {
        if (story) {
          if (level === "g4") (d = pickInt(3, 9)), (N = pickInt(41, 400));
          else if (level === "g5") (d = pick([6, 7, 8, 9, 12, 15, 16, 24])), (N = pickInt(100, 999));
          else (d = pickInt(12, 48)), (N = pickInt(300, 4999));
        } else if (level === "g4") (d = pickInt(2, 9)), (N = Math.random() < 0.6 ? pickInt(100, 999) : pickInt(1000, 9999));
        else if (level === "g5") Math.random() < 0.5 ? ((d = pickInt(3, 9)), (N = pickInt(1000, 9999))) : ((d = pickInt(11, 39)), (N = pickInt(300, 4999)));
        else (d = pickInt(11, 99)), (N = pickInt(2000, 99999));
      } while (d % 10 === 0 || Math.floor(N / d) < 10 || (story && N % d === 0));
      return { N, d, Q: Math.floor(N / d), R: N % d, story };
    };
    const build = (N, d) => {
      const ds = String(N).split("").map(Number);
      let cur = 0;
      let started = false;
      const out = [];
      ds.forEach((digit, i) => {
        cur = cur * 10 + digit;
        if (!started && cur < d && i < ds.length - 1) return;
        started = true;
        const qd = Math.floor(cur / d);
        out.push({ i, cur, qd, prod: qd * d, rem: cur - qd * d });
        cur -= qd * d;
      });
      return out;
    };
    const lay = () => {
      const n = String(q.N).length;
      const Y0 = q.story ? 200 : 150;
      const LH = Math.min(56, (545 - Y0) / (2 * q.steps.length));
      const FS = Math.min(46, LH * 0.9);
      const CW = FS * 1.12;
      const X0 = 230;
      return { n, Y0, LH, FS, CW, X0, col: (i) => X0 + i * CW };
    };
    const draw = () => {
      fresh();
      L = lay();
      const { n, Y0, FS, CW, X0, col } = L;
      if (q.story) {
        el("rect", { x: 14, y: 10, width: 972, height: 104, rx: 20, fill: "#fdf3e1" }, view);
        emoji(view, 66, 58, q.story.icon, 56);
        para(view, 110, 50, q.story.text(q.N, q.d), { size: 26, max: 62 });
      }
      String(q.N).split("").forEach((d, i) => T(view, col(i), Y0, d, FS, INK, { class: "md-dd", "data-i": i }));
      T(view, X0 - CW * 0.78, Y0, q.d, FS, INK, { "text-anchor": "end" });
      el("path", { d: `M${X0 - CW * 0.66} ${Y0 + FS * 0.25}Q${X0 - CW * 0.32} ${Y0 - FS * 0.35} ${X0 - CW * 0.62} ${Y0 - FS * 1.0}L${col(n - 1) + CW * 0.62} ${Y0 - FS * 1.0}`, fill: "none", stroke: INK, "stroke-width": 4, "stroke-linecap": "round" }, view);
      const by = q.story ? 128 : 30;
      el("rect", { x: 600, y: by, width: 380, height: 540 - by, rx: 24, fill: SOFT, stroke: "#eadcc6", "stroke-width": 2 }, view);
      pills = ["➗ Divide", "✖️ Multiply", "➖ Subtract", "⬇️ Bring down"].map((s, i) => {
        const pg = el("g", {}, view);
        const r = el("rect", { x: 622, y: by + 18 + i * 54, width: 336, height: 46, rx: 18, fill: "#fff", stroke: "#e0cfb5", "stroke-width": 2 }, pg);
        const t = T(pg, 790, by + 50 + i * 54, s, 24, INK);
        return { r, t };
      });
      info = el("g", { transform: `translate(0 ${by + 18 + 4 * 54})` }, view);
    };
    const pill = (k) =>
      pills.forEach((p, i) => {
        p.r.setAttribute("fill", i === k ? "var(--accent)" : "#fff");
        p.t.setAttribute("fill", i === k ? "#fff" : INK);
      });
    const infoSet = (lines) => {
      info.innerHTML = "";
      lines.forEach((l, i) => T(info, 790, 44 + i * 40, l, i === 0 ? 30 : 23, i === 0 ? INK : MUTED));
    };
    const rightAt = (num, i, y, fill = INK) => digitsR(num).forEach((d, j) => T(view, L.col(i - j), y, d, L.FS, fill));
    const ask = () => {
      if (my !== token) return;
      q = make();
      q.steps = build(q.N, q.d);
      si = 0;
      g.clean = true;
      draw();
      status(`Problem ${g.round + 1} of ${ROUNDS}`);
      if (q.story) VOICE.speak(q.story.text(q.N, q.d) + " First, divide.");
      qStep(true);
    };
    const qStep = (first = false) => {
      if (my !== token) return;
      const s = q.steps[si];
      phase = "q";
      g.tries = 0;
      busy = false;
      pill(0);
      infoSet([`How many ${q.d}s in ${s.cur}?`, s.cur < q.d ? "Zero is allowed!" : ""]);
      const line = `How many ${q.d}s fit in ${s.cur}?`;
      if (first && q.story) say(line, { voice: false });
      else say(first && g.round === 0 ? `${q.N} ÷ ${q.d}. Divide, multiply, subtract, bring down. ${line}` : line);
      askNum(answer, 2);
    };
    const remStep = () => {
      const s = q.steps[si];
      phase = "r";
      g.tries = 0;
      busy = false;
      pill(2);
      infoSet([`${s.cur} − ${s.prod} = ?`, "Subtract to see what is left."]);
      say(`What is ${s.cur} − ${s.prod}?`);
      askNum(answer, 3);
    };
    const answer = async (v) => {
      if (my !== token || busy) return;
      window.OC?.touch();
      const s = q.steps[si];
      const { Y0, LH, FS, CW, col } = L;
      const want = phase === "q" ? s.qd : s.rem;
      busy = true;
      if (v !== want) {
        let hint;
        let why;
        if (phase === "q") {
          if (q.d < 10) {
            const list = [...Array(9).keys()].map((k) => (k + 1) * q.d).filter((m) => m <= s.cur + q.d).join(", ");
            hint = `List multiples of ${q.d}: ${list}. Which is the greatest that does not exceed ${s.cur}?`;
          } else {
            const r10 = Math.round(q.d / 10) * 10;
            hint = `Round ${q.d} to ${r10}. Roughly how many ${r10}s fit in ${s.cur}? Then test that estimate with ${q.d}.`;
          }
          why = `${s.qd} × ${q.d} = ${s.prod}, and ${s.qd + 1} × ${q.d} = ${(s.qd + 1) * q.d} is more than ${s.cur}. So the answer is ${s.qd}.`;
          if (v > s.qd) hint = `${v} × ${q.d} = ${v * q.d}, which exceeds ${s.cur}. ` + hint;
          else if (v < s.qd) hint = `${v} × ${q.d} = ${v * q.d}. Is there room for another ${q.d}? ` + hint;
        } else {
          hint = `What is the difference between ${s.cur} and ${s.prod}? Counting up from ${s.prod} may help.`;
          why = `${s.cur} − ${s.prod} = ${s.rem}.`;
        }
        const revealed = await miss(g, hint, why);
        if (my !== token) return;
        if (!revealed) {
          busy = false;
          return askNum(answer, phase === "q" ? 2 : 3);
        }
      } else MUSIC.play("xylophone", 76 + (si % 5) * 2, { gain: 0.4 });
      const prodY = Y0 + (2 * si + 1) * LH;
      const remY = Y0 + (2 * si + 2) * LH;
      if (phase === "q") {
        T(view, col(s.i), Y0 - FS * 1.25, s.qd, FS, "var(--accent-dark)");
        pill(1);
        const len = String(s.prod).length;
        rightAt(s.prod, s.i, prodY);
        T(view, col(s.i - len + 1) - CW * 0.62, prodY, "−", FS);
        el("line", { x1: col(s.i - len + 1) - CW * 0.85, x2: col(s.i) + CW * 0.5, y1: prodY + FS * 0.28, y2: prodY + FS * 0.28, stroke: INK, "stroke-width": 3 }, view);
        infoSet([`${s.qd} × ${q.d} = ${s.prod}`, "Write it under, then subtract."]);

        pill(3);
        const nx = q.steps[si + 1].i;
        const digit = String(q.N)[nx];
        infoSet([`Bring down the ${digit}`, `Now we have ${q.steps[si + 1].cur}.`]);
        const t = T(view, col(nx), Y0, digit, FS, "#1e6fb0");
        el("line", { x1: col(nx), x2: col(nx), y1: Y0 + 10, y2: remY - FS, stroke: "#1e6fb0", "stroke-width": 2, "stroke-dasharray": "6 6" }, view);
        await tween(700, (k) => t.setAttribute("y", Y0 + (remY - Y0) * k), () => my === token);
        if (my !== token) return;
        await sayAsync(`${s.rem} remains. Bring down the ${digit}.`);
        if (my !== token) return;
        si += 1;
        return qStep();
      }
      return solved();

    const solved = async () => {
      const { Y0, FS, CW, col, n } = L;
      pill(-1);
      if (q.R) T(view, col(n - 1) + CW * 0.7, Y0 - FS * 1.25, `R ${q.R}`, FS * 0.8, "#d0573a", { "text-anchor": "start" });
      const check = `${fmt(q.Q)} × ${q.d}${q.R ? ` + ${q.R}` : ""} = ${fmt(q.N)}`;
      infoSet([`${fmt(q.N)} ÷ ${q.d} = ${fmt(q.Q)}${q.R ? ` R ${q.R}` : ""}`, `Check: ${check}`]);
      if (g.clean) g.firsts += 1;
      window.OC?.count("long divisions");
      if (!q.story) {
        MUSIC.chime();
        say(`${pick(EFFORT)} ${q.N} ÷ ${q.d} = ${q.Q}${q.R ? ` remainder ${q.R}` : ""}. Check: ${check}.`);
        return nextBtn();
      }
      await sayAsync(`${q.N} ÷ ${q.d} = ${q.Q} remainder ${q.R}.`);
      if (my !== token) return;
      interpret();
    };
    const interpret = () => {
      const st = q.story;
      const right = st.kind === "up" ? q.Q + 1 : st.kind === "down" ? q.Q : q.R;
      const opts = [...new Set([q.Q, q.Q + 1, q.R])].sort((a, b) => a - b).map((v) => ({ label: `${v} ${st.unit}`, v }));
      g.tries = 0;
      busy = false;
      say(`The quotient is ${q.Q} remainder ${q.R}. ${st.ask} Decide what the remainder means in this situation.`);
      const choose = async (c, button) => {
        if (my !== token || busy) return;
        window.OC?.touch();
        if (c.v === right) {
          busy = true;
          button.classList.add("right");
          MUSIC.chime();
          say(`${pick(EFFORT)} ${right} ${st.unit}. ${st.why(q.Q, q.R)}`);
          return nextBtn();
        }
        button.classList.add("wrong");
        busy = true;
        const revealed = await miss(g, `What happens to the ${q.R} left over? Reread the question: ${st.ask}`, `${st.why(q.Q, q.R)} So the answer is ${right} ${st.unit}.`);
        if (my !== token) return;
        if (revealed) return nextBtn();
        busy = false;
      };
      askPick(opts, choose);
    };
    const nextBtn = () =>
      askNext(g.round + 1 >= ROUNDS ? "Finish ▶" : "Next ▶", () => {
        if (my !== token) return;
        g.round += 1;
        if (g.round >= ROUNDS) return finish("md4", ROUNDS, g, REAL.md4);
        ask();
      });
    onLevels("md4", (lv) => {
      level = lv;
      g = newGame();
      ask();
    });
    window.__md4 = { state: () => ({ q, si, phase, step: q.steps[si] }), build };
    ask();
  },

  // ---------- Order of operations ----------
  md5() {
    const my = token;
    let level = shell.progress().md5?.level || "g4";
    let g = newGame();
    const ROUNDS = 8;
    let toks = [];
    let history = [];
    let busy = false;
    let phase = "tap";
    let chosen = -1;
    panel(levelRow(level));
    const tap = (event) => {
      const tg = event.target.closest(".md-tok");
      if (tg) tapTok(Number(tg.dataset.i));
    };
