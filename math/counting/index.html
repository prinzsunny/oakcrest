// ---------- helpers ----------
const range = (a, b) => (b < a ? [] : Array.from({ length: b - a + 1 }, (_, i) => a + i));
const pairs = (n) => range(0, n - 1).flatMap((i) => range(i + 1, n - 1).map((j) => [i, j]));
const perms = (list) => (list.length <= 1 ? [list] : list.flatMap((x, i) => perms([...list.slice(0, i), ...list.slice(i + 1)]).map((p) => [x, ...p])));
const choose = (n, k) => (k < 0 || k > n ? 0 : range(1, k).reduce((acc, i) => (acc * (n - k + i)) / i, 1));
const fact = (n) => range(1, n).reduce((a, b) => a * b, 1);
const gcd = (a, b) => (b ? gcd(b, a % b) : Math.abs(a));
const frac = (n, d) => {
  if (n === 0) return "0";
  const g = gcd(n, d);
  return d / g === 1 ? String(n / g) : `${n / g}/${d / g}`;
};
const only = (list) => (list.length === 1 ? list[0] : NaN);
const INK = "#5a4130";

function para(parent, x, y, str, { size = 30, width = 900, lh = 1.32, fill = "#2b1d12", weight = 700, anchor = "start" } = {}) {
  const maxChars = Math.max(8, Math.floor(width / (size * 0.53)));
  const lines = [];
  for (const block of String(str).split("\n")) {
    let line = "";
    for (const word of block.split(" ")) {
      if (line && (line + " " + word).length > maxChars) {
        lines.push(line);
        line = word;
      } else line = line ? `${line} ${word}` : word;
    }
    lines.push(line);
  }
  if (parent) lines.forEach((ln, i) => text(parent, x, y + i * size * lh, ln, { "font-size": size, fill, "font-weight": weight, "text-anchor": anchor }));
  return lines.length;
}
const fitSize = (str, width, maxH, start = 32, min = 22) => {
  let size = start;
  while (size > min && para(null, 0, 0, str, { size, width }) * size * 1.32 > maxH) size -= 2;
  return size;
};

const LEVELS = [["easy", "🐣 Grade 4"], ["medium", "🦊 Grade 5–6"], ["hard", "🦁 Grade 7–8"]];
const levelRow = (cur) => `<div class="ap-row"><div class="ap-chips" data-levels>${LEVELS.map(([k, l]) => `<button type="button" data-lv="${k}" aria-pressed="${k === cur}" aria-label="${l.slice(3)}">${l.replace("Grade ", "<span class=\"cn-gr\">Grade </span>")}</button>`).join("")}</div><p class="ap-status" data-status></p></div>`;
const onLevels = (id, fn) =>
  $("[data-levels]")?.addEventListener("click", (event) => {
    const b = event.target.closest("[data-lv]");
    if (!b) return;
    shell.mark(id, { level: b.dataset.lv });
    window.OC?.touch();
    // Restart the whole game at the new level, so every pending timer of the old one stops.
    token += 1;
    VOICE.hush();
    stage.onpointerdown = null;
    $("[data-panel]").onclick = null;
    units[id]();
  });
const status = (s) => {
  const box = $("[data-status]");
  if (box) box.textContent = s;
};
const tween = (ms, fn, alive) =>
  new Promise((resolve) => {
    if (KIT.still.matches) {
      fn(1);
      return resolve(true);
    }
    const t0 = performance.now();
    const frame = (now) => {
      if (!alive()) return resolve(false);
      const t = Math.min(1, (now - t0) / ms);
      fn(t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
      if (t < 1) requestAnimationFrame(frame);
      else resolve(true);
    };
    requestAnimationFrame(frame);
  });

function card({ icon, title, need = [], steps = [], note: tip = "", button = "✓ Done" }) {
  return new Promise((resolve) => {
    stage.querySelector(".cn-real")?.remove();
    const box = document.createElement("div");
    box.className = "cn-real";
    box.innerHTML = `<div class="cn-real-card" role="dialog" aria-label="${title}"><div class="cn-real-head"><span aria-hidden="true">${icon}</span><h2>${title}</h2></div>${need.length ? `<p class="cn-need"><b>You need:</b> ${need.join(" · ")}</p>` : ""}<ol>${steps.map((s) => `<li>${s}</li>`).join("")}</ol>${tip ? `<p class="cn-tip">${tip}</p>` : ""}<button type="button" class="kt-go">${button}</button></div>`;
    stage.appendChild(box);
    VOICE.speak(`${title}. ${need.length ? `You need: ${need.join(", ")}. ` : ""}${steps.join(" ")} ${tip}`);
    box.querySelector(".kt-go").addEventListener("click", () => {
      VOICE.hush();
      box.remove();
      window.OC?.touch();
      resolve();
    });
  });
}
// "Explain it" prompts: one per unit. She must articulate the reasoning in 2–4 sentences.
const EXPLAIN = {
  c1: "Explain why 4 shirts and 3 pairs of trousers make 12 outfits rather than 7. Then explain how an organized list guarantees that no outfit is missed or counted twice.",
  c2: "Explain why the number of branches at the end of a tree diagram equals the product of the numbers of choices at each stage. Use the ice-cream tree as your example.",
  c3: "Explain why 4 people can stand in a line in 4 × 3 × 2 × 1 = 24 ways. Why does each place have one fewer choice than the place before it?",
  c4: "Explain why 10 people make 10 × 9 ÷ 2 = 45 handshakes. Why must we divide by 2, when arrangements in a line do not need it?",
  c5: "Explain what a probability of 1/6 means for a fair die, using the words 'equally likely outcomes'. Why is the probability of NOT rolling a six equal to 5/6?",
  c6: "Explain the difference between experimental probability (what happened in your trials) and theoretical probability (what we expect). Why do more trials usually bring the two closer together, even though they never guarantee an exact match?",
  c7: "Choose one puzzle you solved. Explain the counting method you used, and why it counts every case exactly once.",
};
const explainCard = (id) =>
  card({
    icon: "🗣️",
    title: "Explain it",
    steps: [EXPLAIN[id], "Say it aloud to a grown-up in 2–4 full sentences, or write it in your notebook.", "Use the precise words: 'outcome', 'choice', 'multiply', 'counted twice'."],
    note: "A mathematician is judged not only by the answer but by how clearly the reasoning is communicated.",
  });
async function finishGame(id, my, message, real) {
  confetti();
  MUSIC.chime();
  shell.mark(id, { done: true });
  say(message);
  await wait(2600);
  if (my !== token) return;
  await explainCard(id);
  if (my !== token) return;
  if (real) await card(real);
}

// Clothing shapes for the outfit pictures.
function shirt(g, x, y, color, s = 1) {
  return el("path", { d: "M-20 -35L-42 -28L-56 -6L-40 2L-30 -10V36H30V-10L40 2L56 -6L42 -28L20 -35Q0 -20 -20 -35Z", fill: color, stroke: INK, "stroke-width": 3 / s, "stroke-linejoin": "round", transform: `translate(${x} ${y}) scale(${s})` }, g);
}
function trousers(g, x, y, color, s = 1) {
  return el("path", { d: "M-30 -36H30L34 36H8L0 -6L-8 36H-34Z", fill: color, stroke: INK, "stroke-width": 3 / s, "stroke-linejoin": "round", transform: `translate(${x} ${y}) scale(${s})` }, g);
}
function hat(g, x, y, color, s = 1) {
  return el("path", { d: "M-30 12Q-30 -26 0 -26Q30 -26 30 12ZM-30 8H44V16H-30Z", fill: color, stroke: INK, "stroke-width": 3 / s, "stroke-linejoin": "round", transform: `translate(${x} ${y}) scale(${s})` }, g);
}
const SHIRTS = [["#e53935", "red"], ["#1e88e5", "blue"], ["#f2c94c", "yellow"], ["#43a047", "green"]];
const BOTTOMS = [["#7e57c2", "purple"], ["#6d4c41", "brown"], ["#ff8a3d", "orange"], ["#26a69a", "teal"]];
const HATS = [["#ec407a", "pink"], ["#37474f", "black"], ["#ffffff", "white"]];
function gridPic(g, cols, rows, cell, x0, y0, attrs = {}) {
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) el("rect", { x: x0 + c * cell, y: y0 + r * cell, width: cell, height: cell, fill: "#fff", stroke: INK, "stroke-width": 4, ...attrs }, g);
}

// ---------- problem card + worked solution (shared by the puzzle-style games) ----------
function drawProblem(p, tag) {
  fresh();
  el("rect", { x: 14, y: 14, width: 972, height: 532, rx: 26, fill: "#fffaf2", stroke: "#eadfcd", "stroke-width": 3 }, view);
  text(view, 44, 60, tag, { "text-anchor": "start", "font-size": 24, fill: "var(--accent-dark)" });
  const width = p.pic ? 470 : 912;
  const size = fitSize(p.q, width, 400, p.pic ? 30 : 34, 22);
  para(view, 44, 112, p.q, { size, width });
  if (p.pic) p.pic(el("g", { transform: "translate(552 110)" }, view));
}
function drawSolution(p, answerLine) {
  fresh();
  el("rect", { x: 14, y: 14, width: 972, height: 532, rx: 26, fill: "#fff", stroke: "var(--accent)", "stroke-width": 4 }, view);
  const ideaText = `Key idea: ${p.idea}`;
  el("rect", { x: 40, y: 32, width: Math.min(900, ideaText.length * 14.5 + 60), height: 52, rx: 26, fill: "var(--accent-soft)" }, view);
  text(view, 64, 67, `🔑 ${ideaText}`, { "text-anchor": "start", "font-size": 27, fill: "var(--accent-dark)" });
  const width = p.solPic ? 520 : 860;
  let size = 28;
  const total = (s) => p.sol.reduce((h, st) => h + para(null, 0, 0, st, { size: s, width }) * s * 1.3 + 14, 0);
  while (size > 21 && total(size) > 330) size -= 1;
  let y = 128;
  p.sol.forEach((st, i) => {
    el("circle", { cx: 60, cy: y - size * 0.35, r: 17, fill: "var(--accent)" }, view);
    text(view, 60, y - size * 0.35 + 7, i + 1, { "font-size": 20, fill: "#fff" });
    y += para(view, 92, y, st, { size, width, lh: 1.3 }) * size * 1.3 + 14;
  });
  if (p.solPic) p.solPic(el("g", { transform: "translate(640 110)" }, view));
  el("rect", { x: 40, y: 474, width: 920, height: 56, rx: 16, fill: "#fff4dc" }, view);
  text(view, 500, 510, answerLine, { "font-size": 24, fill: "#7a4a10" });
}

// ---------- puzzle runner: 8 problems, Socratic hints after an attempt, solution after two ----------
function runPuzzles(id, level, gens, { title, onLevel, real } = {}) {
  const my = token;
  const alive = () => my === token;
  const list = [];
  const order = shuffle(gens);
  for (let k = 0; list.length < 8 && k < 80; k++) {
    const p = order[k % order.length]();
    if (!list.some((q) => q.q === p.q)) list.push(p);
  }
  let i = 0;
  let firstTry = 0;
  const show = () => {
    if (!alive()) return;
    const p = list[i];
    let tries = 0;
    let hint = 0;
    let done = false;
    let showing = "problem";
    let pad = null;
    panel(`${levelRow(level)}<div class="ap-row cn-ans" data-answer></div><div class="ap-chips cn-tools" data-tools><button type="button" data-t="read" aria-label="Read it to me">🔊</button><button type="button" data-t="hint" aria-label="Hint">💡<span class="cn-lab"> Hint</span></button><button type="button" data-t="sol" aria-label="Solution">📖<span class="cn-lab"> Solution</span></button><button type="button" data-t="next">Next ▶</button></div>`);
    onLevels(id, onLevel);
    status(`Problem ${i + 1} of ${list.length}`);
    drawProblem(p, `${title} · ${LEVELS.find(([k]) => k === level)[1]} · ${i + 1} of ${list.length}`);
    const ansText = p.opts ? p.ans : String(p.ans);
    const pulse = (t) => {
      document.querySelectorAll("[data-tools] [data-pulse]").forEach((b) => b.removeAttribute("data-pulse"));
      if (t) $(`[data-t="${t}"]`)?.setAttribute("data-pulse", "");
    };
    const solve = () => {
      showing = "sol";
      drawSolution(p, done ? `Answer: ${ansText}. Explain it: say why the key idea works, in 2–4 sentences.` : `The answer is ${ansText}. Study each step, then explain it in your own words.`);
      $('[data-t="sol"]').innerHTML = `🧩<span class="cn-lab"> Problem</span>`;
      say(`<b>${p.idea}.</b> ${p.sol.join(" ")}`);
    };
    const answer = (v, button) => {
      if (!alive() || done) return;
      window.OC?.touch();
      tries += 1;
      if (String(v) === String(p.ans)) {
        done = true;
        if (tries === 1) firstTry += 1;
        button?.classList.add("right");
        MUSIC.chime();
        window.OC?.count("counting problems solved");
        say(`Correct: ${ansText}. ${p.why || ""} Press 📖 to compare your method with the worked solution, or Next ▶.`);
        pulse("next");
      } else {
        button?.classList.add("wrong");
        MUSIC.oops();
        pad?.clear();
        if (tries === 1) {
          say(`Not quite. Mistakes are how we learn. ${pick(["Consider what each part of the question tells you.", "Which cases have you counted, and which might be missing or doubled?", "Check your answer against every condition in the question."])} Press 💡 for a guiding question, or try again.`);
          pulse("hint");
        } else {
          pulse("sol");
          say(`Not quite. After two honest attempts, the worked solution is the right next step: the answer is ${ansText}, and here is why.`);
          done = true;
          setTimeout(() => alive() && list[i] === p && solve(), 1600);
        }
      }
    };
    const host = $("[data-answer]");
    if (p.opts) choices(host, p.opts.map((o) => ({ label: String(o), v: o })), (c, b) => answer(c.v, b));
    else pad = numpad(host, { onEnter: (v) => answer(v), max: 5 });
    $("[data-tools]").addEventListener("click", (event) => {
      const b = event.target.closest("[data-t]");
      if (!b || !alive()) return;
      window.OC?.touch();
      const t = b.dataset.t;
      if (t === "read") VOICE.speak(`${p.q} ${p.opts ? `The choices are ${p.opts.join(", ")}.` : ""}`);
      else if (t === "hint") {
        if (!tries) return say("Make an attempt first. A reasoned answer, even a wrong one, makes the hint more useful.");
        if (hint >= p.hints.length) return say(`💡 That was the final hint: ${p.hints[p.hints.length - 1]}`);
        say(`💡 ${p.hints[hint++]}`);
        pulse("");
      } else if (t === "sol") {
        if (showing === "sol") {
          showing = "problem";
          drawProblem(p, `${title} · ${i + 1} of ${list.length}`);
          b.innerHTML = `📖<span class="cn-lab"> Solution</span>`;
          return;
        }
        if (!done && tries < 2) return say(tries ? "Attempt it once more first. Productive struggle is how skill grows; a 💡 hint may help." : "Attempt the problem first. The solution opens after two attempts.");
        solve();
      } else if (t === "next") {
        if (!done && !tries) return say("Give this problem an honest attempt before moving on.");
        VOICE.hush();
        i += 1;
        if (i < list.length) show();
        else finishGame(id, my, `That completes eight problems, ${firstTry} solved at the first attempt. Choose a level to receive a fresh set of problems.`, real).then(() => alive() && runPuzzles(id, level, gens, { title, onLevel, real }));
      }
    });
    say(`${p.opts ? "Choose the answer." : "Enter the answer, then press ✓."}`, { voice: false });
    VOICE.speak(`${p.q} ${p.opts ? `The choices are ${p.opts.join(", ")}.` : ""}`);
  };
  show();
}

// ---------- generated problem banks ----------
const nameOf = (n) => ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"][n] || String(n);
const letterPerms = (word) => new Set(perms(word.split("")).map((p) => p.join(""))).size;
const distinctNum = (ans, cands) => {
  const out = [ans];
  for (const c of cands) if (out.length < 4 && c > 0 && !out.includes(c)) out.push(c);
  let k = 1;
  while (out.length < 4) {
    if (!out.includes(ans + k)) out.push(ans + k);
    k += 1;
  }

        sol: three ? ["Ways(1) = 1, Ways(2) = 2, Ways(3) = 4. The last move is 1, 2 or 3 steps, so Ways(n) = Ways(n − 1) + Ways(n − 2) + Ways(n − 3).", `1, 2, 4, 7, 13, 24, … reaches ${f[n]} at ${n} steps.`] : ["Ways(1) = 1, Ways(2) = 2. The last move is a 1-step or a 2-step, so Ways(n) = Ways(n − 1) + Ways(n − 2).", `1, 2, 3, 5, 8, … reaches ${f[n]} at ${n} steps (the Fibonacci numbers, named after a mathematician of medieval Pisa).`],

// ---------- 1. Systematic lists: build every outfit ----------
function outfits() {
  const my = token;
  const alive = () => my === token;
  let level = shell.progress().c1?.level || "easy";
  const PLAN = {
    easy: [[2, 2], [2, 3], [3, 2], [3, 3], [2, 4], [4, 2]],
    medium: [[2, 2, 2], [3, 2, 2], [2, 3, 2], [2, 2, 3], [3, 2, 2], [2, 2, 2]],
    hard: [[3, 3, 0, 1], [3, 4, 0, 1], [4, 3, 0, 2], [3, 3, 0, 2], [3, 4, 0, 2], [4, 4, 0, 3]],
  };
  let round = 0;
  let firstClaim = 0;
  const start = (lv) => {
    level = lv;
    round = 0;
    firstClaim = 0;
    play();
  };
  const play = () => {
    if (!alive()) return;
    const [a, b, c = 0, nf = 0] = PLAN[level][round];
    const cats = c ? [a, b, c] : [a, b];
    const forbidden = new Set();
    while (forbidden.size < nf) forbidden.add(`${pickInt(0, a - 1)},${pickInt(0, b - 1)}`);
    const valid = [];
    for (let i = 0; i < a; i++) for (let j = 0; j < b; j++) for (let k = 0; k < (c || 1); k++) if (!forbidden.has(`${i},${j}`)) valid.push(c ? `${i},${j},${k}` : `${i},${j}`);
    const found = new Set();
    const sel = cats.map(() => null);
    let claims = 0;
    let busy = false;
    panel(`${levelRow(level)}<div class="ap-buttons cn-act"><button type="button" data-do="done" class="primary">✓ I have listed them all</button><button type="button" data-do="real">🏠 Try it for real</button></div>`);
    onLevels("c1", start);
    status(`Round ${round + 1} of 6 · listed ${found.size}`);
    fresh();
    el("line", { x1: 452, x2: 452, y1: 20, y2: 540, stroke: "#eadfcd", "stroke-width": 4 }, view);
    const rowsY = c ? [90, 245, 400] : [140, 340];
    const drawers = [shirt, trousers, hat];
    const palettes = [SHIRTS, BOTTOMS, HATS];
    const items = [];
    cats.forEach((n, cat) => {
      items[cat] = [];
      for (let i = 0; i < n; i++) {
        const x = 72 + i * 110;
        const g = el("g", { class: "cn-item", "data-cat": cat, "data-i": i }, view);
        const ring = el("rect", { x: x - 52, y: rowsY[cat] - 62, width: 104, height: 124, rx: 18, fill: "#fffaf2", stroke: "#eadfcd", "stroke-width": 3 }, g);
        drawers[cat](g, x, rowsY[cat], palettes[cat][i][0], cat === 0 ? 0.8 : cat === 2 ? 1.2 : 0.95);
        items[cat][i] = ring;
      }
    });
    text(view, 720, 52, "Outfits listed: 0", { "font-size": 30, fill: "#2b1d12", class: "cn-count" });
    if (nf) {
      const rules = [...forbidden].map((f) => {
        const [i, j] = f.split(",").map(Number);
        return `${SHIRTS[i][1]} shirt ✗ ${BOTTOMS[j][1]} trousers`;
      });
      rules.forEach((r, k) => text(view, 720, 530 - (rules.length - 1 - k) * 30, `Rule: ${r}`, { "font-size": 22, fill: "#b23a1c" }));
    }
    const cols = b * (c || 1);
    const tableTop = 80;
    const tableH = nf ? 440 - nf * 30 : 450;
    const rowH = Math.min(120, tableH / a);
    const colW = Math.min(120, 500 / cols);
    const mini = Math.min(rowH / 170, colW / 120) * (c ? 1 : 1.15);
    const cell = (i, j, k) => [480 + (j * (c || 1) + (k || 0)) * colW + colW / 2, tableTop + i * rowH + rowH / 2];
    const drawMini = (key, faint) => {
      const [i, j, k] = key.split(",").map(Number);
      const [x, y] = cell(i, j, k);
      const g = el("g", { opacity: faint ? 0.35 : 1, class: faint ? null : "cn-pop" }, view);
      if (faint) el("rect", { x: x - colW / 2 + 4, y: y - rowH / 2 + 4, width: colW - 8, height: rowH - 8, rx: 12, fill: "none", stroke: "#e0603a", "stroke-width": 3, "stroke-dasharray": "8 6" }, g);
      const top = c ? -rowH * 0.28 : -rowH * 0.18;
      if (c) hat(g, x, y + top - 52 * mini, HATS[k][0], mini);
      shirt(g, x, y + top, SHIRTS[i][0], mini);
      trousers(g, x, y + top + 70 * mini, BOTTOMS[j][0], mini);
      return g;
    };
    const missingHint = () => {
      const missing = valid.filter((v) => !found.has(v));
      const byShirt = range(0, a - 1).map((i) => missing.filter((m) => m.startsWith(`${i},`)).length);
      const worst = byShirt.indexOf(Math.max(...byShirt));
      return { missing, worst };
    };
    const tapItem = (cat, i) => {
      if (!alive() || busy) return;
      window.OC?.touch();
      sel[cat] = sel[cat] === i ? null : i;
      items[cat].forEach((r, k) => {
        r.setAttribute("stroke", sel[cat] === k ? "var(--accent)" : "#eadfcd");
        r.setAttribute("stroke-width", sel[cat] === k ? 6 : 3);
      });
      MUSIC.play("xylophone", 72 + cat * 4 + i * 2, { gain: 0.3 });
      if (sel.some((s) => s === null)) return;
      const key = c ? `${sel[0]},${sel[1]},${sel[2]}` : `${sel[0]},${sel[1]}`;
      const desc = `${SHIRTS[sel[0]][1]} shirt with ${BOTTOMS[sel[1]][1]} trousers${c ? ` and a ${HATS[sel[2]][1]} hat` : ""}`;
      sel.fill(null);
      items.flat().forEach((r) => (r.setAttribute("stroke", "#eadfcd"), r.setAttribute("stroke-width", 3)));
      if (forbidden.has(key.split(",").slice(0, 2).join(","))) {
        MUSIC.oops();
        return say(`Not allowed: the rule excludes the ${desc.replace(/ and a .*/, "")}. Excluded combinations are not counted.`);
      }
      if (found.has(key)) {
        MUSIC.oops();
        return say(`That outfit, the ${desc}, is already on your list. A systematic list has each outfit exactly once.`);
      }
      found.add(key);
      drawMini(key);
      view.querySelector(".cn-count").textContent = `Outfits listed: ${found.size}`;
      status(`Round ${round + 1} of 6 · listed ${found.size}`);
      say(`Listed: ${desc}. ${found.size === 1 ? "Notice where it appears in the table: each shirt has its own row." : ""}`);
    };
    view.addEventListener("pointerdown", (event) => {
      const g = event.target.closest(".cn-item");
      if (g) tapItem(Number(g.dataset.cat), Number(g.dataset.i));
    });
    $("[data-panel]").onclick = async (event) => {
      const b2 = event.target.closest("[data-do]");
      if (!b2 || !alive() || busy) return;
      window.OC?.touch();
      if (b2.dataset.do === "real")
        return card({
          icon: "🏠",
          title: "Try it for real",
          need: ["3 shirts and 2 pairs of trousers (or socks and shoes)", "paper and a pencil"],
          steps: ["Lay the clothes out in two rows on a bed or the floor.", "Make the outfits in order: the first shirt with every pair of trousers, then the second shirt, and so on.", "Record each outfit in a table, one row per shirt. Count the rows and the columns."],
          note: "Ask a grown-up before taking clothes out, and fold them away afterwards.",
        });
      claims += 1;
      const { missing, worst } = missingHint();
      if (missing.length) {
        MUSIC.oops();
        if (claims === 1) say(`Not quite: some outfits are missing. Consider the ${SHIRTS[worst][1]} shirt's row. Has it been paired with every ${c ? "pair of trousers and every hat" : "pair of trousers"}${nf ? " that the rule allows" : ""}?`);
        else {
          say(`${missing.length} outfit${missing.length === 1 ? " is" : "s are"} still missing: the dashed boxes show where. Build ${missing.length === 1 ? "it" : "them"} to complete the list.`);
          missing.forEach((m) => drawMini(m, true));
        }
        return;
      }
      busy = true;
      if (claims === 1) firstClaim += 1;
      MUSIC.chime();
      window.OC?.count("outfits listed");
      const total = a * b * (c || 1);
      const why = nf ? `${a} × ${b} = ${a * b} pairings, minus ${nf} excluded by the rule${nf > 1 ? "s" : ""}, leaves ${valid.length}. Subtracting what is not allowed is called counting the complement.` : c ? `Correct. ${a} shirts × ${b} trousers × ${c} hats = ${total}: every shirt-and-trousers pair can take any of the ${c} hats.` : `Correct. ${a} shirts × ${b} trousers = ${total}: each shirt starts a row of ${b} outfits, and there are ${a} rows.`;
      say(nf ? `Correct. ${why}` : why);
      await wait(4200);
      if (!alive()) return;
      round += 1;
      if (round < PLAN[level].length) play();
      else
        finishGame("c1", my, `All six lists are complete; ${firstClaim} were complete at the first check. An organized list (row by row) is the surest way to count without missing or repeating.`, {
          icon: "🏠",
          title: "Try it for real",
          need: ["some shirts and trousers, or cups and plates", "paper and a pencil"],
          steps: ["Choose two kinds of item, for instance 3 cups and 4 plates.", "Predict the number of cup-and-plate pairs before you start.", "Make every pair in an organized way and record them in a table. Was your prediction right?"],
          note: "Do this with a grown-up and handle breakable items carefully.",
        }).then(() => alive() && start(level));
    };
    say(c ? `Build every outfit: tap one shirt, one pair of trousers and one hat. List them all, then press ✓.` : nf ? `Build every allowed outfit. Read the rule first: some pairings are excluded.` : `Build every outfit: tap a shirt, then a pair of trousers. List them all, then press ✓.`);
  };
  start(level);
}

        else {
          say(`${total - done.size} handshake${total - done.size === 1 ? " is" : "s are"} missing: the dashed lines show where.`);
          pairs(n).forEach(([a, c]) => !done.has(`${a},${c}`) && el("line", { x1: pos[a][0], y1: pos[a][1], x2: pos[c][0], y2: pos[c][1], stroke: "#e0603a", "stroke-width": 3, "stroke-dasharray": "10 8" }, lines));
        }
        return;
      }
      busy = true;
      MUSIC.chime();
      window.OC?.count("handshake groups");
      const terms = range(1, n - 1).reverse();
      terms.forEach((t, k) => text(side, 790, 150 + k * 44, `${PEOPLE[k]} ${t} new`, { "font-size": 26, fill: "#4d3c2e" }));
      text(side, 790, 160 + terms.length * 44, `${terms.join(" + ")} = ${total}`, { "font-size": 28, fill: "var(--accent-dark)" });
      text(side, 790, 204 + terms.length * 44, `${n} × ${n - 1} ÷ 2 = ${total}`, { "font-size": 28, fill: "var(--accent-dark)" });
      say(`Correct: ${total} handshakes. The first person shakes ${n - 1} new hands, the next ${n - 2}${n > 3 ? ", and so on" : ""}: ${terms.join(" + ")} = ${total}. Or: ${n} people × ${n - 1} hands each counts every handshake twice, so divide by 2.`);
      if (level === "medium") {
        await wait(5200);
        if (!alive()) return;
        const m = n + pickInt(4, 8);
        const ans = (m * (m - 1)) / 2;
        let tries = 0;
        say(`Now predict without drawing: how many handshakes for ${m} people?`);
        choices($("[data-answer]"), distinctNum(ans, [m * (m - 1), m * 2, ans + m]).map((o) => ({ label: String(o), v: o })), async (c, btn) => {
          if (!alive() || btn.classList.contains("right")) return;
          tries += 1;
          if (c.v === ans) {
            btn.classList.add("right");
            MUSIC.chime();
            say(`Correct: ${m} × ${m - 1} ÷ 2 = ${ans}.`);
            await wait(3000);
            next();
          } else {
            btn.classList.add("wrong");
            MUSIC.oops();
            if (tries === 1) say(`Not quite. Consider: ${m} people each shake ${m - 1} hands. Has each handshake been counted once or twice?`);
            else {
              say(`The answer is ${ans}: ${m} × ${m - 1} = ${m * (m - 1)} counts each handshake twice, so halve it.`);
              await wait(4500);
              next();
            }
          }
        });
      } else {
        await wait(5600);
        next();
      }
    };
    say(`Tap two people to make them shake hands. Every pair must shake hands exactly once, then press ✓.`);
  };
  start(level);
}

// ---------- 6. Experiment lab ----------
function lab() {
  const my = token;
  const alive = () => my === token;
  const DEV = {
    coin: { name: "coin", faces: ["H", "T"], labels: ["heads", "tails"], probs: [0.5, 0.5], colors: ["#f2c94c", "#c9a227"] },
    die: { name: "die", faces: ["1", "2", "3", "4", "5", "6"], labels: ["1", "2", "3", "4", "5", "6"], probs: Array(6).fill(1 / 6), colors: ["#e53935", "#fb8c00", "#fdd835", "#43a047", "#1e88e5", "#8e24aa"] },
    spinner: { name: "spinner", faces: ["red", "blue"], labels: ["red", "blue"], probs: [0.25, 0.75], colors: ["#e53935", "#1e88e5"] },
  };
  let dev = DEV.coin;
  let counts = [0, 0];
  let total = 0;
  let last = null;
  let busy = false;
  let everTotal = 0;
  panel(`<div class="ap-row"><div class="ap-chips" data-dev><button type="button" data-d="coin" aria-pressed="true">🪙 Coin</button><button type="button" data-d="die" aria-pressed="false">🎲 Die</button><button type="button" data-d="spinner" aria-pressed="false">🎡 Spinner ¼ red</button></div><p class="ap-status" data-status></p></div><div class="ap-buttons cn-act" data-runs><button type="button" data-n="1">× 1</button><button type="button" data-n="10">× 10</button><button type="button" data-n="100" class="primary">× 100</button><button type="button" data-n="0">↺ Reset</button><button type="button" data-n="-1">🏠</button></div>`);
  const roll = () => {
    const r = Math.random();
    let acc = 0;
    for (let i = 0; i < dev.probs.length; i++) {
      acc += dev.probs[i];
      if (r < acc) return i;
    }
    return dev.probs.length - 1;
  };
  const draw = () => {
    fresh();
    el("rect", { x: 30, y: 40, width: 300, height: 300, rx: 30, fill: "#fffaf2", stroke: "#eadfcd", "stroke-width": 3 }, view);
    if (dev.name === "spinner") {
      spinnerPic(4, 1, "#e53935")(el("g", { transform: "translate(80 110) scale(0.5)" }, view));
      if (last !== null) text(view, 180, 320, dev.labels[last], { "font-size": 30, fill: dev.colors[last] });
    } else {
      el(dev.name === "coin" ? "circle" : "rect", dev.name === "coin" ? { cx: 180, cy: 180, r: 100, fill: "#f2c94c", stroke: "#b8820c", "stroke-width": 8, class: "cn-dev" } : { x: 90, y: 90, width: 180, height: 180, rx: 30, fill: "#fff", stroke: INK, "stroke-width": 6, class: "cn-dev" }, view);
      text(view, 180, 210, last === null ? "?" : dev.faces[last], { "font-size": 90, fill: "#2b1d12", class: "cn-face" });
    }
    text(view, 180, 390, `Trials: ${total}`, { "font-size": 30, fill: "#2b1d12" });
    // bars: percentage of trials, with a dashed theory line
    const n = dev.faces.length;
    const x0 = 380;
    const bw = Math.min(110, 560 / n - 16);
    const top = 70;
    const baseY = 470;
    const scale = (baseY - top) / (dev.name === "die" ? 0.5 : 1);
    text(view, 670, 40, dev.name === "die" ? "Share of trials (axis to 50%)" : "Share of trials (axis to 100%)", { "font-size": 22, fill: "#8a7764" });
    el("line", { x1: x0 - 10, x2: 980, y1: baseY, y2: baseY, stroke: INK, "stroke-width": 3 }, view);
    dev.faces.forEach((f, i) => {
      const x = x0 + i * (580 / n) + (580 / n - bw) / 2;
      const share = total ? counts[i] / total : 0;
      el("rect", { x, y: baseY - share * scale, width: bw, height: share * scale, rx: 8, fill: dev.colors[i], stroke: INK, "stroke-width": 2 }, view);
      const ty = baseY - dev.probs[i] * scale;
      el("line", { x1: x - 8, x2: x + bw + 8, y1: ty, y2: ty, stroke: "#2b1d12", "stroke-width": 3, "stroke-dasharray": "8 6" }, view);
      text(view, x + bw / 2, baseY + 32, dev.faces[i], { "font-size": 26, fill: "#2b1d12" });
      text(view, x + bw / 2, baseY + 60, counts[i], { "font-size": 22, fill: "#4d3c2e", "font-weight": 600 });
      if (total) text(view, x + bw / 2, Math.min(baseY - share * scale, ty) - 10, `${Math.round(share * 100)}%`, { "font-size": 22, fill: "#4d3c2e" });
    });
    status(`Theory: ${dev.name === "die" ? "1/6 each" : dev.name === "coin" ? "1/2 each" : "red 1/4, blue 3/4"} (dashed lines)`);
  };
  const reset = (d) => {
    dev = DEV[d] || dev;
    counts = dev.faces.map(() => 0);
    total = 0;
    last = null;
    draw();
  };
  const run = async (k) => {
    if (busy || !alive()) return;
    busy = true;
    window.OC?.touch();
    if (k === 1) {
      for (let s = 0; s < 6 && alive(); s++) {
        last = Math.floor(Math.random() * dev.faces.length);
        draw();
        MUSIC.play("woodblock", 79, { gain: 0.2 });
        await wait(90);
      }
      last = roll();
      counts[last] += 1;
      total += 1;
      draw();
    } else {
      const steps = k === 10 ? 10 : 20;
      const per = k / steps;
      for (let s = 0; s < steps && alive(); s++) {
        for (let j = 0; j < per; j++) {
          last = roll();
          counts[last] += 1;
          total += 1;
        }
        draw();
        if (s % 2 === 0) MUSIC.play("woodblock", 72, { gain: 0.12 });
        await wait(k === 10 ? 150 : 60);
      }
    }
    everTotal += k;
    window.OC?.count("experiment trials", k);
    busy = false;
    if (!alive()) return;
    const worst = Math.max(...dev.probs.map((p, i) => Math.abs(counts[i] / total - p)));
    if (total < 30) say(`With only ${total} trial${total === 1 ? "" : "s"}, the shares can be far from the theory. Before running more, predict: will the bars move toward the dashed lines?`);
    else say(`After ${total} trials the largest gap from the theory is ${Math.round(worst * 100)} percentage point${Math.round(worst * 100) === 1 ? "" : "s"}. ${total >= 300 ? "With many trials, experimental probability tends to settle near the theoretical probability (the law of large numbers)." : "Run more trials: what happens to the gap?"}`);
    if (everTotal >= 200 && !shell.progress().c6?.done) {
      shell.mark("c6", { done: true });
      await wait(3500);
      if (!alive()) return;
      await explainCard("c6");
    }
  };
  $("[data-dev]").addEventListener("click", (event) => {
    const b = event.target.closest("[data-d]");
    if (!b || busy) return;
    document.querySelectorAll("[data-d]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    reset(b.dataset.d);
    say(`The ${DEV[b.dataset.d].name}. Each dashed line marks the theoretical probability. Run trials and watch the bars.`);
  });
  $("[data-runs]").addEventListener("click", (event) => {
    const b = event.target.closest("[data-n]");
    if (!b) return;
    const k = Number(b.dataset.n);
    if (k === 0 && !busy) return reset();
    if (k === -1)
      return card({
        icon: "🏠",
        title: "Try it for real",
        need: ["a coin", "paper and a pencil"],
        steps: ["Predict how many heads you will get in 20 tosses.", "Toss the coin 20 times and keep a tally chart of heads and tails.", "Combine your results with a grown-up's 20 tosses. Is the share of heads for 40 tosses closer to one half?"],
        note: "Toss over a soft surface, with a grown-up nearby.",
      });
    run(k);
  });
  reset("coin");
  say("An experiment: run trials and compare what happens (experimental probability) with what theory predicts (the dashed lines).");
}

              await api.tween(700, (p) => (ln.setAttribute("x2", sx + 80 + (tx - 60 - sx - 80) * p), ln.setAttribute("y2", sy + (ty - sy) * p)));

          el("line", { x1: 100, x2: 940, y1: 265, y2: 265, stroke: "#2b1d12", "stroke-width": 3, "stroke-dasharray": "10 8" }, v);

            path.setAttribute("d", d);

          text(v, 800, 120, `${heads} heads in ${N}`, { "font-size": 28, fill: "#e0603a" });

  );
