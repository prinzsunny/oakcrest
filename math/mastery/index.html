<script>const { $, el, svg: makeSvg, text, panel, say, sayAsync, pick, pickInt, wait, confetti, choices, explain, everyday, emoji, numpad, shuffle } = KIT;
const stage = $("[data-stage]");
const W = 1000;
const H = 560;
let token = 0;
let view = null;

const UNITS = [
  { id: "ms0", label: "See it", icon: "👀" },
  { id: "ms1", label: "1. Equal groups & arrays", icon: "🔲" },
  { id: "ms2", label: "2. Turn it: a × b = b × a", icon: "🔄" },
  { id: "ms3", label: "3. Break it apart", icon: "✂️" },
  { id: "ms4", label: "4. Regroup three factors", icon: "📦" },
  { id: "ms5", label: "5. Two kinds of division", icon: "➗" },
  { id: "ms6", label: "6. Fact families", icon: "🔺" },
  { id: "ms7", label: "7. Remainders", icon: "🧺" },
  { id: "ms8", label: "8. One and zero", icon: "0️⃣" },
  { id: "ms9", label: "9. Strategy ladder", icon: "🪜" },
  { id: "ms10", label: "10. Daily facts", icon: "🗂️" },
  { id: "ms11", label: "11. Mastery grid", icon: "🟩" },
  { id: "ms12", label: "12. Problem solving", icon: "📝" },
];

// ==CORE== Pure logic (no page access): strategies, the spaced-review schedule and the problem banks. Tested in Node.
const CORE = (() => {
  const rint = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
  const rpick = (list) => list[Math.floor(Math.random() * list.length)];
  const gcd = (x, y) => (y ? gcd(y, x % y) : Math.abs(x));
  const lcm = (x, y) => (x / gcd(x, y)) * y;
  const mix = (list, rand = Math.random) => {
    const out = [...list];
    for (let i = out.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [out[i], out[j]] = [out[j], out[i]];
    }
    return out;
  };

  // ---- Strategy ladder, in teaching order ----
  const RUNGS = [
    { id: "r2", ks: [2], name: "×2 Doubles", short: "×2" },
    { id: "r10", ks: [10], name: "×10 Tens", short: "×10" },
    { id: "r5", ks: [5], name: "×5 Half of ×10", short: "×5" },
    { id: "r1", ks: [1, 0], name: "×1 and ×0", short: "×1 ×0" },
    { id: "r9", ks: [9], name: "×9 Ten minus one", short: "×9" },
    { id: "sq", ks: [], name: "Square numbers", short: "n × n" },
    { id: "r4", ks: [4], name: "×4 Double-double", short: "×4" },
    { id: "r8", ks: [8], name: "×8 Double ×4", short: "×8" },
    { id: "r3", ks: [3], name: "×3 Double + one more", short: "×3" },
    { id: "r6", ks: [6], name: "×6 Double ×3", short: "×6" },
    { id: "r7", ks: [7], name: "×7 Break apart", short: "×7" },
    { id: "r11", ks: [11, 12], name: "×11 and ×12", short: "×11 ×12" },
  ];

  // strat(k, m): a picture and a chain of easier facts for "k groups of m" (k rows of m).
  // rows: row segments of the picture; kind "a" / "b" are coloured parts, "ghost" rows are taken away or the unused half.
  function strat(k, m, square = false) {
    const p = k * m;
    const A = "a";
    const B = "b";
    const G = "ghost";
    const base = { k, m, p };
    if (square) {
      if (m >= 6) return { ...base, rung: "sq", rows: [{ n: 5, kind: A }, { n: m - 5, kind: B }], lines: [`5 × ${m} = ${5 * m}`, `${m - 5} × ${m} = ${(m - 5) * m}`, `${5 * m} + ${(m - 5) * m} = ${p}`], hint: `Split the ${m} rows into 5 rows and ${m - 5} rows. What is 5 × ${m}, and what is ${m - 5} × ${m}?` };
      return { ...base, rung: "sq", rows: m ? [{ n: m, kind: A }] : [], lines: [`${m} rows of ${m}`, `${m} × ${m} = ${p}`], hint: `Picture a square array: ${m} rows of ${m}. Skip-count by ${m}, ${m} times.` };
    }
    switch (k) {
      case 0:
        return { ...base, rung: "r1", rows: [], lines: [`0 groups of ${m}`, `0 × ${m} = 0`], hint: `How many objects are in zero groups?` };
      case 1:
        return { ...base, rung: "r1", rows: [{ n: 1, kind: A }], lines: [`1 group of ${m}`, `1 × ${m} = ${m}`], hint: `What is in exactly one group of ${m}?` };
      case 2:
        return { ...base, rung: "r2", rows: [{ n: 1, kind: A }, { n: 1, kind: B }], lines: [`2 × ${m} is double ${m}`, `${m} + ${m} = ${p}`], hint: `Two groups of ${m} is double ${m}. What is ${m} + ${m}?` };
      case 3:
        return { ...base, rung: "r3", rows: [{ n: 2, kind: A }, { n: 1, kind: B }], lines: [`2 × ${m} = ${2 * m}`, `${2 * m} + ${m} = ${p}`], hint: `Three groups are two groups and one more group. What is double ${m}, plus one more ${m}?` };
      case 4:
        return { ...base, rung: "r4", rows: [{ n: 2, kind: A }, { n: 2, kind: B }], lines: [`2 × ${m} = ${2 * m}`, `${2 * m} + ${2 * m} = ${p}`], hint: `Four is double two. Double ${m}, then double the result.` };
      case 5:
        return { ...base, rung: "r5", rows: [{ n: 5, kind: A }, { n: 5, kind: G }], lines: [`10 × ${m} = ${10 * m}`, `half of ${10 * m} = ${p}`], hint: `Five groups are half of ten groups. What is 10 × ${m}, and what is half of it?` };
      case 6:
        return { ...base, rung: "r6", rows: [{ n: 3, kind: A }, { n: 3, kind: B }], lines: [`3 × ${m} = ${3 * m}`, `${3 * m} + ${3 * m} = ${p}`], hint: `Six groups are two lots of three groups. What is 3 × ${m}? Now double it.` };
      case 7:
        return { ...base, rung: "r7", rows: [{ n: 5, kind: A }, { n: 2, kind: B }], lines: [`5 × ${m} = ${5 * m}`, `2 × ${m} = ${2 * m}`, `${5 * m} + ${2 * m} = ${p}`], hint: `Break 7 into 5 + 2. What are 5 × ${m} and 2 × ${m}?` };
      case 8:
        return { ...base, rung: "r8", rows: [{ n: 4, kind: A }, { n: 4, kind: B }], lines: [`4 × ${m} = ${4 * m}`, `${4 * m} + ${4 * m} = ${p}`], hint: `Eight is double four. What is 4 × ${m}? Now double it.` };
      case 9:
        return { ...base, rung: "r9", rows: [{ n: 9, kind: A }, { n: 1, kind: G }], lines: [`10 × ${m} = ${10 * m}`, `${10 * m} − ${m} = ${p}`], hint: `Nine groups are one group fewer than ten groups. What is 10 × ${m}? Now take away one ${m}.` };
      case 10:
        return { ...base, rung: "r10", rows: [{ n: 10, kind: A }], lines: [`10 groups of ${m} = ${m} tens`, `${m} tens = ${p}`], hint: `Ten groups of ${m} make ${m} tens. What number is ${m} tens?` };
      case 11:
        return { ...base, rung: "r11", rows: [{ n: 10, kind: A }, { n: 1, kind: B }], lines: [`10 × ${m} = ${10 * m}`, `${10 * m} + ${m} = ${p}`], hint: `Eleven groups are ten groups and one more. What is 10 × ${m}, plus one more ${m}?` };
      case 12:
        return { ...base, rung: "r11", rows: [{ n: 10, kind: A }, { n: 2, kind: B }], lines: [`10 × ${m} = ${10 * m}`, `2 × ${m} = ${2 * m}`, `${10 * m} + ${2 * m} = ${p}`], hint: `Twelve groups are ten groups and two more. What are 10 × ${m} and 2 × ${m}?` };
      default:
        return { ...base, rung: "", rows: [{ n: k, kind: A }], lines: [`${k} × ${m} = ${p}`], hint: `Skip-count by ${m}.` };
    }
  }
  // The strategy used for a fact a × b (a groups of b) in review and in the grid: the friendliest factor wins.
  const PRIORITY = [1, 2, 10, 5, 11, 12, 9, "sq", 4, 8, 3, 6, 7];
  function factStrat(a, b) {
    for (const x of PRIORITY) {
      if (x === "sq") {
        if (a === b && a >= 6) return { ...strat(a, a, true), a, b, swapped: false };
      } else if (a === x) return { ...strat(a, b), a, b, swapped: false };
      else if (b === x) return { ...strat(b, a), a, b, swapped: true };
    }
    return { ...strat(a, b), a, b, swapped: false };
  }
  // Practice facts for one rung: [k, m] pairs (k groups of m).
  function rungFacts(id) {
    const r = RUNGS.find((x) => x.id === id);
    const out = [];
    if (id === "sq") for (let m = 2; m <= 12; m++) out.push([m, m]);
    else for (const k of r.ks) for (let m = k === 0 ? 1 : 1; m <= 12; m++) out.push([k, m]);
    return out;
  }
  // A question for practice: multiplication in either order, or one of its two division facts (never ÷ 0).
  function asQuestion([k, m], op, rand = Math.random) {
    const p = k * m;
    if (op === "×") return rand() < 0.5 ? { op, x: k, y: m, ans: p, k, m } : { op, x: m, y: k, ans: p, k, m };
    const divisors = [k, m].filter((d) => d !== 0);
    const d = divisors[Math.floor(rand() * divisors.length)];
    return { op: "÷", x: p, y: d, ans: p / d, k, m };
  }

  // ---- Facts and the review schedule (Leitner boxes) ----
  const famKey = (a, b) => (a <= b ? `${a}x${b}` : `${b}x${a}`);
  const famOf = (key) => key.split("x").map(Number);
  const ORDER = (() => {
    const out = [];
    const add = (a, b) => {
      const key = famKey(a, b);
      if (!out.includes(key)) out.push(key);
    };
    for (const r of RUNGS) {
      if (r.id === "sq") for (let m = 1; m <= 12; m++) add(m, m);
      else for (const k of r.ks) if (k > 0) for (let m = 1; m <= 12; m++) add(k, m);
    }
    return out;
  })();
  const INTERVALS = [1, 2, 4, 8, 16]; // box n is reviewed INTERVALS[n - 1] days after its last review
  const QUICK_MS = 3000;
  const KNOWN_DAYS = 3;
  const pad2 = (n) => String(n).padStart(2, "0");
  const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  const addDays = (key, n) => {
    const [y, mo, d] = key.split("-").map(Number);
    return new Date(Date.UTC(y, mo - 1, d + n)).toISOString().slice(0, 10);
  };
  // One review of one fact family. Correct: up one box (at most 5) and the day is counted. Miss: back to box 1, days cleared.
  function review(card, { correct, ms, today, now = Date.now() }) {
    const c = card ? { ...card, days: [...(card.days || [])] } : { box: 1, days: [], quick: false, seen: 0, miss: 0, first: today };
    c.seen += 1;
    if (correct) {
      c.box = Math.min(5, c.box + 1);
      if (!c.days.includes(today)) c.days.push(today);
      c.days = c.days.slice(-6);
      c.quick = ms <= QUICK_MS;
    } else {
      c.box = 1;
      c.days = [];
      c.quick = false;
      c.miss += 1;
    }
    c.last = today;
    c.due = addDays(today, INTERVALS[c.box - 1]);
    c.t = now;
    return c;
  }
  // Known = correct on at least 3 separate days since the last miss, and the latest correct recall was quick.
  const isKnown = (c) => !!c && (c.days || []).length >= KNOWN_DAYS && c.quick === true;
  const status = (c) => (!c ? "new" : isKnown(c) ? "known" : "learning");
  function dueKeys(cards, today) {
    return Object.keys(cards)
      .filter((k) => cards[k] && cards[k].due <= today)
      .sort((x, y) => (cards[x].due < cards[y].due ? -1 : cards[x].due > cards[y].due ? 1 : cards[x].box - cards[y].box));
  }
  // Today's cards: everything due (oldest first), then new families in ladder order to fill the session (at most maxNew new per day).
  // Even positions ask a multiplication, odd positions a division, so the two are interleaved.
  function session(cards, today, { size = 20, maxNew = 20, rand = Math.random } = {}) {
    const old = dueKeys(cards, today).slice(0, size);
    const newToday = Object.values(cards).filter((c) => c && c.first === today).length;
    const room = Math.max(0, Math.min(size - old.length, maxNew - newToday));
    const fresh = ORDER.filter((k) => !cards[k]).slice(0, room);
    const keys = mix([...old, ...fresh], rand);
    return keys.map((key, i) => {
      const [a, b] = famOf(key);
      return { key, fresh: !cards[key], ...asQuestion([a, b], i % 2 === 0 ? "×" : "÷", rand) };
    });
  }
  // Two copies of the record (another tab, another device): per family, the most recent review wins.
  function merge(a = {}, b = {}) {
    const out = { ...a };
    for (const [k, c] of Object.entries(b)) if (c && (!out[k] || (c.t || 0) > (out[k].t || 0))) out[k] = c;
    return out;
  }
  // Status for each of the 144 cells of the 12 × 12 grid.
  const cellStatus = (cards, a, b) => status(cards[famKey(a, b)]);

  // ---- Concept-unit generators ----
  function remainderCompute() {
    const d = rint(3, 9);
    const q = rint(3, 9);
    const r = rint(1, d - 1);
    return { N: q * d + r, d, q, r };
  }
  const fracText = (r, k) => {
    const g = gcd(r, k);
    return `${r / g}/${k / g}`;
  };
  function remainderStory(type) {
    let N;
    let c;
    do {
      c = type === "share" ? rint(2, 4) : rint(4, 9);
      N = type === "share" ? rint(5, 15) : rint(20, 75);
    } while (N % c === 0 || Math.floor(N / c) < 2);
    const q = Math.floor(N / c);
    const r = N % c;
    const qr = `${q} r ${r}`;
    if (type === "up")
      return { type, N, c, q, r, icon: "🚐", text: `${N} students are going on a trip. Each van holds ${c} students. How many vans are needed?`, ans: `${q + 1} vans`, opts: [`${q} vans`, `${q + 1} vans`, qr, `${r} vans`], why: `${N} ÷ ${c} = ${q} r ${r}. ${q} vans carry ${q * c} students, and the ${r} remaining students still need seats, so round up: ${q + 1} vans.` };
    if (type === "down")
      return { type, N, c, q, r, icon: "🧁", text: `A baker has ${N} muffins and boxes that hold exactly ${c} muffins each. How many boxes can be completely filled?`, ans: `${q} boxes`, opts: [`${q} boxes`, `${q + 1} boxes`, qr, `${r} boxes`], why: `${N} ÷ ${c} = ${q} r ${r}. Only ${q} boxes are full; the ${r} muffins left over cannot fill another box, so the remainder is dropped.` };
    if (type === "share")
      return { type, N, c, q, r, icon: "🍕", text: `${N} pizzas are shared equally among ${c} friends, and leftover pizzas are cut fairly too. How much pizza does each friend get?`, ans: `${q} and ${fracText(r, c)} pizzas`, opts: [`${q} pizzas`, `${q + 1} pizzas`, qr, `${q} and ${fracText(r, c)} pizzas`], why: `${N} ÷ ${c} = ${q} r ${r}. Pizza can be cut, so the ${r} leftover ${r === 1 ? "pizza is" : "pizzas are"} shared as well: ${r} ÷ ${c} = ${r}/${c}${fracText(r, c) !== `${r}/${c}` ? ` = ${fracText(r, c)}` : ""} of a pizza more each.` };
    return { type: "left", N, c, q, r, icon: "⭐", text: `${N} stickers are shared equally among ${c} children, with as many as possible for each. How many stickers are left over?`, ans: `${r}`, opts: [`${r}`, `${q}`, `${c - r}`, `0`], why: `${N} ÷ ${c} = ${q} r ${r}: each child gets ${q}, which uses ${q * c} stickers, and ${r} are left over. Here the remainder itself is the answer.` };
  }
  function divisionStory(kind) {
    const things = rpick([["🍎", "apples", "basket", "baskets"], ["🖍️", "crayons", "cup", "cups"], ["🍪", "biscuits", "plate", "plates"], ["🌷", "tulips", "vase", "vases"], ["⚽", "balls", "bag", "bags"], ["🥚", "eggs", "nest", "nests"]]);
    const [icon, item, one, many] = things;
    if (kind === "share") {
      const g = rint(2, 5);
      const s = rint(2, 6);
      return { kind, icon, item, one, many, g, s, N: g * s, text: `${g * s} ${item} are shared equally among ${g} ${many}. How many ${item} go in each ${one}?`, ans: s };
    }
    const s = rint(2, 6);
    const g = rint(2, 6);
    return { kind, icon, item, one, many, g, s, N: g * s, text: `${g * s} ${item} are packed ${s} to a ${one}. How many ${many} are filled?`, ans: g };
  }
  function familyBlank() {
    const a = rint(2, 12);
    let b = rint(2, 12);
    if (b === a) b = a === 12 ? 11 : a + 1;
    const p = a * b;
    const forms = [
      { show: `${a} × ${b} = □`, ans: p },
      { show: `${b} × ${a} = □`, ans: p },
      { show: `□ ÷ ${a} = ${b}`, ans: p },
      { show: `${p} ÷ □ = ${b}`, ans: a },
      { show: `${p} ÷ ${b} = □`, ans: a },
      { show: `□ × ${b} = ${p}`, ans: a },
      { show: `${a} × □ = ${p}`, ans: b },
    ];
    return { a, b, p, ...rpick(forms) };
  }
  function smartTriple() {
    const [f1, f2] = rpick([[2, 5], [5, 2], [4, 25], [25, 4], [20, 5], [5, 20], [50, 2], [2, 50]]);
    const x = rint(3, 19);
    return { f1, f2, x, show: `${f1} × ${x} × ${f2}`, ans: f1 * f2 * x, work: [`${f1} × ${x} × ${f2}`, `= (${f1} × ${f2}) × ${x}`, `= ${f1 * f2} × ${x}`, `= ${f1 * f2 * x}`] };
  }
  function identityItems() {
    const n = () => rint(2, 12);
    const [a, b, c, d, e, f] = [n(), n(), n(), n(), n(), n()];
    const U = "undefined";
    return [
      { eq: `${a} × 1`, ans: a, opts: [a, 1, 0, a + 1], why: `${a} × 1 means ${a} groups of 1, which is ${a}. Multiplying by 1 leaves a number unchanged: 1 is the identity (the number that changes nothing) for multiplication.`, pic: "groups1", n: a },

// Dot array inside a box; colour(r, c) picks each dot's fill ("ghost" draws an empty dashed dot).
function dots(parent, rows, cols, { x, y, w, h, max = 46, colour = () => CA, anchor = "middle" } = {}) {
  const cell = Math.min(max, w / Math.max(cols, 1), h / Math.max(rows, 1));
  const x0 = anchor === "middle" ? x + (w - cell * cols) / 2 : x;
  const y0 = y + (h - cell * rows) / 2;
  const g = el("g", {}, parent);
  const nodes = [];
  for (let r = 0; r < rows; r++) {
    nodes[r] = [];
    for (let c = 0; c < cols; c++) {
      const f = colour(r, c);
      nodes[r][c] = el("circle", { cx: x0 + c * cell + cell / 2, cy: y0 + r * cell + cell / 2, r: cell * 0.36, fill: f === "ghost" ? "none" : f, stroke: f === "ghost" ? GHOST : "none", "stroke-width": 2.5, "stroke-dasharray": f === "ghost" ? "4 4" : null }, g);
    }
  }
  return { g, nodes, cell, x0, y0 };
}
// The strategy picture: k rows of m, rows grouped into coloured segments, with a label beside each segment.
function drawPic(parent, s, box) {
  const g = el("g", {}, parent);
  const total = s.rows.reduce((a, r) => a + r.n, 0);
  if (!total) {
    T(g, box.x + box.w / 2, box.y + box.h / 2, "no groups at all", 30, MUTED);
    return g;
  }
  const kinds = [];
  s.rows.forEach((seg) => {
    for (let i = 0; i < seg.n; i++) kinds.push(seg.kind);
  });
  const fill = { a: CA, b: CB, ghost: "ghost" };
  const pic = dots(g, total, s.m, { x: box.x + 120, y: box.y, w: box.w - 120, h: box.h, max: 40, colour: (r) => fill[kinds[r]] });
  let r0 = 0;
  for (const seg of s.rows) {
    const yTop = pic.y0 + r0 * pic.cell + 4;
    const yBot = pic.y0 + (r0 + seg.n) * pic.cell - 4;
    const colr = seg.kind === "ghost" ? MUTED : fill[seg.kind];
    el("path", { d: `M${pic.x0 - 10} ${yTop}h-8V${yBot}h8`, fill: "none", stroke: colr, "stroke-width": 3 }, g);
    const label = seg.kind === "ghost" ? (s.rung === "r5" ? "other half" : "take away") : `${seg.n} ${seg.n === 1 ? "row" : "rows"}`;
    T(g, pic.x0 - 24, (yTop + yBot) / 2 + 8, label, 22, colr, { "text-anchor": "end" });
    r0 += seg.n;
  }
  return g;
}
function drawLines(parent, lines, x, y, { size = 32, gap = 50, last = "var(--accent-dark)" } = {}) {
  const g = el("g", {}, parent);
  lines.forEach((l, i) => T(g, x, y + i * gap, l, size, i === lines.length - 1 ? last : INK));
  return g;
}

    {
      say: back,

}

    if (my !== token) return;
    fresh();
