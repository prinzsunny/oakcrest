<script>const { $, el, svg: makeSvg, text, panel, say, pick, pickInt, wait, confetti, PRAISE, KIND, choices, explain, everyday, emoji, numpad, shuffle } = KIT;
const stage = $("[data-stage]");
const W = 1000;
const H = 560;
let token = 0;
let view = null;

const UNITS = [
  { id: "g0", label: "See it", icon: "👀" },
  { id: "g1", label: "1. Points, lines & angles", icon: "📐" },
  { id: "g2", label: "2. Triangles & polygons", icon: "🔺" },
  { id: "g3", label: "3. Perimeter & area", icon: "🟩" },
  { id: "g4", label: "4. Circles", icon: "⭕" },
  { id: "g5", label: "5. Volume & surface area", icon: "📦" },
  { id: "g6", label: "6. Transformations & symmetry", icon: "🦋" },
  { id: "g7", label: "7. Pythagoras preview", icon: "📏" },
  { id: "g8", label: "8. Contest challenges", icon: "🏆" },
];

function fresh() {
  stage.querySelector(".gm-real")?.remove();
  stage.innerHTML = "";
  view = makeSvg(`0 0 ${W} ${H}`, stage);
  return view;
}

// ---------- exact arithmetic helpers (every answer is computed from these) ----------
const RAD = Math.PI / 180;
const r2 = (x) => Math.round(x * 100) / 100;
const fmt = (x) => String(r2(x));
const gcd = (a, b) => (b ? gcd(b, a % b) : Math.abs(a));
const choose2 = (n) => (n * (n - 1)) / 2;
const norm = (d) => ((d % 360) + 360) % 360;
// Math angles (degrees, anticlockwise, y up) on the SVG page (y down).
const at = (cx, cy, r, deg) => [cx + r * Math.cos(deg * RAD), cy - r * Math.sin(deg * RAD)];
const dirOf = (P, Q) => norm(Math.atan2(-(Q[1] - P[1]), Q[0] - P[0]) / RAD);
const dist = (P, Q) => Math.hypot(Q[0] - P[0], Q[1] - P[1]);
const mid = (P, Q) => [(P[0] + Q[0]) / 2, (P[1] + Q[1]) / 2];
const lerp = (a, b, t) => a + (b - a) * t;
const lerpP = (P, Q, t) => [lerp(P[0], Q[0], t), lerp(P[1], Q[1], t)];
// The interior (smaller) angle at V between rays V→P and V→Q: { start, sweep } in math degrees.
function cornerOf(V, P, Q) {
  const s = dirOf(V, P);
  const e = dirOf(V, Q);
  const sw = norm(e - s);
  return sw <= 180 ? { start: s, sweep: sw } : { start: e, sweep: 360 - sw };
}
const angAt = (V, P, Q) => cornerOf(V, P, Q).sweep;
// Shoelace area (absolute) of a polygon.
const areaOf = (pts) => Math.abs(pts.reduce((s, p, i) => { const q = pts[(i + 1) % pts.length]; return s + p[0] * q[1] - q[0] * p[1]; }, 0)) / 2;
const perimOf = (pts) => pts.reduce((s, p, i) => s + dist(p, pts[(i + 1) % pts.length]), 0);
function inside(pt, poly) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i];
    const [xj, yj] = poly[j];
    if (yi > pt[1] !== yj > pt[1] && pt[0] < ((xj - xi) * (pt[1] - yi)) / (yj - yi) + xi) c = !c;
  }
  return c;
}
// A triangle from its base angles: returns vertices fitted to a box.
function triFromAngles(a, b, box) {
  // A at origin, B at (1,0), C above; y up.
  const ta = Math.tan(a * RAD);
  const tb = Math.tan(b * RAD);
  const cx = b === 90 ? 1 : a === 90 ? 0 : tb / (ta + tb);
  const cy = a === 90 ? tb : cx * ta;
  return fitPts([[0, 0], [1, 0], [cx, cy]], box);
}
function triFromSides(a, b, c, box) {
  // side c on the base from A to B; |AC| = b, |BC| = a.
  const x = (b * b + c * c - a * a) / (2 * c);
  const y = Math.sqrt(Math.max(0, b * b - x * x));
  return fitPts([[0, 0], [c, 0], [x, y]], box);
}
// Fit math-coordinate points (y up) into an SVG box, keeping proportions.
function fitPts(pts, box) {
  const xs = pts.map((p) => p[0]);
  const ys = pts.map((p) => p[1]);
  const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
  const s = Math.min(box.w / Math.max(1e-9, x1 - x0), box.h / Math.max(1e-9, y1 - y0));
  const ox = box.x + (box.w - (x1 - x0) * s) / 2;
  const oy = box.y + box.h - (box.h - (y1 - y0) * s) / 2;
  return pts.map(([x, y]) => [ox + (x - x0) * s, oy - (y - y0) * s]);
}

// ---------- speech ----------
const spoken = (html) =>
  String(html)
    .replace(/<[^>]+>/g, " ")
    .replace(/(\d)\s*cm²/g, "$1 square centimetres")
    .replace(/(\d)\s*m²/g, "$1 square metres")
    .replace(/(\d)\s*cm³/g, "$1 cubic centimetres")
    .replace(/cm²/g, "square centimetres")
    .replace(/cm³/g, "cubic centimetres")
    .replace(/²/g, " squared")
    .replace(/³/g, " cubed")
    .replace(/(\d)°/g, "$1 degrees")
    .replace(/°/g, " degrees")
    .replace(/π/g, " pi ")
    .replace(/≈/g, " is about ")
    .replace(/∠/g, "angle ")
    .replace(/△/g, "triangle ")
    .replace(/′/g, " prime")
    .replace(/½/g, "one half")
    .replace(/√/g, "the square root of ")
    .replace(/∥/g, " is parallel to ")
    .replace(/⊥/g, " is perpendicular to ")
    .replace(/☐/g, " box ")
    .replace(/−/g, " minus ")
    .replace(/\(n − 2\)/g, "n minus 2");
function talk(html, voiceText) {
  say(html, { voice: false });
  VOICE.speak(spoken(voiceText ?? html));
}

// ---------- drawing helpers ----------
const INK = "#2b1d12";
const SOFT = "#6b5642";
const GREEN = "#2e9b50";
const GOLD = "#f2a93b";
const RED = "#d84a2e";
const BLUE = "#1e78c8";
const PURPLE = "#7b4fb0";
const FILL = "#fde9c8";
const LEFT = { x: 16, y: 16, w: 540, h: 528 };
const RIGHT = { x: 572, y: 16, w: 412, h: 528 };
const STOP = Symbol("stop");
const anim = (alive) => ({
  alive,
  wait: (ms) => new Promise((res, rej) => setTimeout(() => (alive() ? res() : rej(STOP)), KIT.still.matches ? Math.min(ms, 150) : ms)),
  tween: (ms, fn) =>
    new Promise((res, rej) => {
      if (KIT.still.matches) {
        fn(1);
        return res();
      }
      const t0 = performance.now();
      const frame = (now) => {
        if (!alive()) return rej(STOP);
        const t = Math.min(1, (now - t0) / ms);
        fn(t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
        if (t < 1) requestAnimationFrame(frame);
        else res();
      };
      requestAnimationFrame(frame);
    }),
});
const quiet = (p) => Promise.resolve(p).catch((e) => (e === STOP ? null : console.error(e)));
const svgPoint = (v, event) => new DOMPoint(event.clientX, event.clientY).matrixTransform(v.getScreenCTM().inverse());

const line = (parent, P, Q, attrs = {}) => el("line", { x1: P[0], y1: P[1], x2: Q[0], y2: Q[1], stroke: INK, "stroke-width": 5, "stroke-linecap": "round", ...attrs }, parent);
const poly = (parent, pts, attrs = {}) => el("polygon", { points: pts.map((p) => p.join(",")).join(" "), fill: FILL, stroke: INK, "stroke-width": 5, "stroke-linejoin": "round", ...attrs }, parent);
const dot = (parent, P, attrs = {}) => el("circle", { cx: P[0], cy: P[1], r: 8, fill: INK, ...attrs }, parent);
const label = (parent, P, s, attrs = {}) => text(parent, P[0], P[1] + 9, s, { "font-size": 26, fill: INK, ...attrs });
function arcPath(cx, cy, r, a1, sweep) {
  const [x1, y1] = at(cx, cy, r, a1);
  const [x2, y2] = at(cx, cy, r, a1 + sweep);
  return `M${x1} ${y1}A${r} ${r} 0 ${sweep > 180 ? 1 : 0} 0 ${x2} ${y2}`;
}
function wedgePath(cx, cy, r, a1, sweep) {
  const [x1, y1] = at(cx, cy, r, a1);
  const [x2, y2] = at(cx, cy, r, a1 + sweep);
  return `M${cx} ${cy}L${x1} ${y1}A${r} ${r} 0 ${sweep > 180 ? 1 : 0} 0 ${x2} ${y2}Z`;
}
// Angle mark at V: arc (or a square for exactly 90°) with an optional label.
function mark(parent, V, start, sweep, { r = 42, color = RED, lab = null, labR = null, size = 25, fill = true } = {}) {
  const g = el("g", {}, parent);
  if (Math.abs(sweep - 90) < 0.01) {
    const s = r * 0.62;
    const p1 = at(V[0], V[1], s, start);
    const p3 = at(V[0], V[1], s, start + 90);
    const p2 = [p1[0] + p3[0] - V[0], p1[1] + p3[1] - V[1]];
    el("path", { d: `M${p1.join(" ")}L${p2.join(" ")}L${p3.join(" ")}`, fill: "none", stroke: color, "stroke-width": 4 }, g);
  } else {
    if (fill) el("path", { d: wedgePath(V[0], V[1], r, start, sweep), fill: color, "fill-opacity": 0.14 }, g);
    el("path", { d: arcPath(V[0], V[1], r, start, sweep), fill: "none", stroke: color, "stroke-width": 4 }, g);
  }
  if (lab !== null) {
    const rr = labR ?? r + (sweep < 40 ? 44 : 30);
    const p = at(V[0], V[1], rr, start + sweep / 2);
    text(g, p[0], p[1] + size * 0.36, lab, { "font-size": size, fill: color, "font-weight": 800 });
  }
  return g;
}
// Mark the interior angle of a polygon corner.
const corner = (parent, V, P, Q, opts) => {
  const c = cornerOf(V, P, Q);
  return mark(parent, V, c.start, c.sweep, opts);
};
// Equal-length ticks across a segment.
function ticks(parent, P, Q, n = 1, color = INK) {
  const m = mid(P, Q);
  const d = dirOf(P, Q);
  for (let i = 0; i < n; i++) {
    const off = (i - (n - 1) / 2) * 10;
    const c = at(m[0], m[1], off, d);
    line(parent, at(c[0], c[1], 13, d + 90), at(c[0], c[1], 13, d - 90), { stroke: color, "stroke-width": 4 });
  }
}
// Label a side, placed outside the polygon.
function sideLabel(parent, P, Q, s, polyPts, { off = 30, size = 25, color = INK } = {}) {
  const m = mid(P, Q);
  const d = dirOf(P, Q);
  let p = at(m[0], m[1], off, d + 90);
  if (polyPts && inside(p, polyPts)) p = at(m[0], m[1], off, d - 90);
  return text(parent, p[0], p[1] + size * 0.36, s, { "font-size": size, fill: color, "font-weight": 800 });
}
// Vertex letters, pushed away from the centroid.
function names(parent, pts, letters, { size = 28, push = 30, color = INK } = {}) {
  const c = [pts.reduce((s, p) => s + p[0], 0) / pts.length, pts.reduce((s, p) => s + p[1], 0) / pts.length];
  pts.forEach((p, i) => {
    const d = dirOf(c, p);
    const q = at(p[0], p[1], push, d);
    text(parent, q[0], q[1] + size * 0.36, letters[i], { "font-size": size, fill: color, "font-style": "italic" });
  });
}
function wrap(line_, per) {
  const words = String(line_).split(" ");
  const rows = [];
  for (const w of words) {
    const last = rows[rows.length - 1];
    if (last !== undefined && (last + " " + w).length <= per) rows[rows.length - 1] = last + " " + w;
    else rows.push(w);
  }
  return rows;
}
// The notes card: "📋 The problem" before solving, "🔎 How we know" after.
function notes(lines, { title = "🔎 How we know", region = RIGHT, tone = "work" } = {}) {
  view.querySelector(".gm-notes")?.remove();
  const g = el("g", { class: "gm-notes" }, view);
  let font = 27;
  const fit = () => {
    const per = Math.floor((region.w - 40) / (font * 0.53));
    return lines.flatMap((l) => wrap(l, per));
  };
  let rows = fit();
  while (60 + rows.length * font * 1.36 > region.h && font > 22) {
    font -= 1;
    rows = fit();
  }
  const lh = font * 1.36;
  const h = Math.min(region.h, 62 + rows.length * lh);
  const work = tone === "work";
  el("rect", { x: region.x, y: region.y, width: region.w, height: h, rx: 24, fill: work ? "#f1faf3" : "#fff8ea", stroke: work ? "#8fcf9f" : "#e0b872", "stroke-width": 3 }, g);
  text(g, region.x + 20, region.y + 38, title, { "font-size": 26, fill: work ? "#23733b" : "#8a5a12", "text-anchor": "start", "font-weight": 900 });
  rows.forEach((r, i) => text(g, region.x + 20, region.y + 40 + (i + 1) * lh, r, { "font-size": font, fill: INK, "text-anchor": "start", "font-weight": 700 }));
  return g;
}
const caseNotes = (lines, region = RIGHT) => notes(lines, { title: "📋 The problem", region, tone: "case" });
const fadeIn = (api, node, ms = 500) => {
  node.setAttribute("opacity", 0);
  return api.tween(ms, (t) => node.setAttribute("opacity", t));
};

// Square grid of lattice points; returns converters.
function lattice(parent, { x0, y0, cell, cols, rows, axes = null, faint = false }) {
  const g = el("g", {}, parent);
  for (let i = 0; i <= cols; i++) line(g, [x0 + i * cell, y0], [x0 + i * cell, y0 + rows * cell], { stroke: faint ? "#efe6d6" : "#e3d7c3", "stroke-width": 2 });
  for (let j = 0; j <= rows; j++) line(g, [x0, y0 + j * cell], [x0 + cols * cell, y0 + j * cell], { stroke: faint ? "#efe6d6" : "#e3d7c3", "stroke-width": 2 });
  const P = (x, y) => [x0 + (x - (axes ? axes.xmin : 0)) * cell, y0 + rows * cell - (y - (axes ? axes.ymin : 0)) * cell];
  if (axes) {
    const o = P(0, 0);
    line(g, [x0, o[1]], [x0 + cols * cell, o[1]], { stroke: "#8a6a4f", "stroke-width": 3 });
    line(g, [o[0], y0], [o[0], y0 + rows * cell], { stroke: "#8a6a4f", "stroke-width": 3 });
    text(g, x0 + cols * cell - 12, o[1] - 10, "x", { "font-size": 24, fill: SOFT, "font-style": "italic" });
    text(g, o[0] + 16, y0 + 20, "y", { "font-size": 24, fill: SOFT, "font-style": "italic" });
    const step = axes.step || 2;
    for (let x = axes.xmin; x <= axes.xmax; x++) if (x !== 0 && x % step === 0) text(g, P(x, 0)[0], o[1] + 26, x, { "font-size": 22, fill: SOFT, "font-weight": 600 });
    for (let y = axes.ymin; y <= axes.ymax; y++) if (y !== 0 && y % step === 0) text(g, o[0] - 18, P(0, y)[1] + 8, y, { "font-size": 22, fill: SOFT, "font-weight": 600 });
    text(g, o[0] - 14, o[1] + 24, "0", { "font-size": 22, fill: SOFT, "font-weight": 600 });
  }
  const back = (p) => [Math.round((p.x - x0) / cell + (axes ? axes.xmin : 0)), Math.round((y0 + rows * cell - p.y) / cell + (axes ? axes.ymin : 0))];
  return { g, P, back };
}

const EFFORT = ["Correct — and here is why.", "Correct. Your method was sound.", "Correct — careful reasoning.", "Correct. Notice the reasoning:"];
const NUDGE = ["Not quite. Consider:", "Not quite — mistakes are how we learn. Consider:", "Not yet. Consider:"];

// ---------- panel rows ----------
const LEVELS = [["easy", "🐣 <span class=\"gm-long\">Grade </span>4"], ["medium", "🦊 <span class=\"gm-long\">Grade </span>5–6"], ["hard", "🦁 <span class=\"gm-long\">Grade </span>7–8"]];
const topRow = (level, only) =>
  `<div class="ap-row gm-top"><div class="ap-chips" data-levels>${LEVELS.filter(([k]) => !only || only.includes(k)).map(([k, l]) => `<button type="button" data-lv="${k}" aria-pressed="${k === level}" aria-label="${l.replace(/<[^>]+>/g, "")}">${l}</button>`).join("")}</div><p class="ap-status" data-status></p></div>`;
function bindTop(id, onLevel) {
  $("[data-levels]")?.addEventListener("click", (event) => {
    const b = event.target.closest("[data-lv]");
    if (!b) return;
    document.querySelectorAll("[data-lv]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    shell.mark(id, { level: b.dataset.lv });
    window.OC?.touch();
    VOICE.hush();
    onLevel(b.dataset.lv);
  });
}
const setStatus = (s) => {
  const b = $("[data-status]");
  if (b) b.textContent = s;
};

// ---------- "🏠 Try it for real" ----------
const REAL = {
  g1: { title: "Try it for real: an angle hunt", need: ["A protractor", "A pencil and paper", "A ruler"], steps: ["Find three angles at home: a door opened part-way, a book cover, scissors.", "Estimate each angle first, then measure it with the protractor.", "Draw two straight lines that cross. Measure all four angles.", "Check: opposite angles equal? Neighbours sum to 180°?"], note: "Ask a grown-up before measuring doors; keep fingers clear of hinges and blades." },
  g2: { title: "Try it for real: tear a triangle", need: ["Paper", "A ruler and pencil", "Coloured pencils"], steps: ["Draw any triangle with a ruler. Colour each corner a different colour.", "Tear off the three corners (tearing keeps the corners recognisable).", "Place the three points together along a straight edge.", "Repeat with a very different triangle. What happens every time?"], note: "Tearing is evidence, not proof. Ask a grown-up to see your proof from the lesson." },
  g3: { title: "Try it for real: measure a room", need: ["A tape measure", "Paper and a pencil", "A grown-up"], steps: ["Measure the length and width of a rug, table or room in metres.", "Sketch it and label the sides.", "Work out the perimeter and the area.", "For an L-shaped room, split it into two rectangles first."], note: "Measure with a grown-up; do not climb on furniture." },

// ---------- the problem engine: ask, two honest tries, then the worked solution ----------
// cfg: { make(level, round) -> q, count, noun, R, levels? }
// q: { draw(api, submit), ask, voice?, opts? [{label, v}] | stage? "tip" (answer on the picture) | check? (a Check button reads q.value()),
//      max?, ans, ok?(v), hint(v), why, work [lines], after?(api, won), onMiss?(v, api) }
function quiz(id, cfg) {
  const my = token;
  const R = cfg.R || 10;
  const only = cfg.levels;
  let level = shell.progress()[id]?.level || "easy";
  if (only && !only.includes(level)) level = only[0];
  let round = 0;
  let first = 0;
  let tries = 0;
  let q = null;
  let busy = false;
  let pad = null;
  panel(`${topRow(level, only)}<div class="gm-in" data-in></div>`);
  const host = $("[data-in]");
  const status = () => setStatus(`${cfg.noun1 || "Problem"} ${Math.min(round + 1, R)} of ${R}`);
  const isRight = (v) => (q.ok ? q.ok(v) : v === q.ans);
  const ask = () => {
    if (my !== token) return;
    tries = 0;
    busy = false;
    q = cfg.make(level, round);
    window.__gmQ = q;
    const qq = q;
    q.api = anim(() => my === token && q === qq);
    fresh();
    q.draw(q.api, (v) => answer(v));
    status();
    host.onclick = null;
    host.classList.toggle("gm-pick", !!q.opts);
    pad = null;
    if (q.opts) choices(host, q.opts, (o, b) => answer(o.v, b));
    else if (q.check) {
      host.innerHTML = `<div class="ap-buttons"><button type="button" class="primary" data-check>✓ Check</button></div>`;
      host.onclick = (event) => {
        if (event.target.closest("[data-check]")) answer(q.value());
      };
    } else if (q.stage) host.innerHTML = `<p class="gm-tip2">👆 ${q.stage}</p>`;
    else pad = numpad(host, { onEnter: (v) => answer(v), max: q.max || 4 });
    talk(q.ask, q.voice);
  };
  const settle = async (won) => {
    busy = true;
    q.locked = true;
    const qq = q;
    host.querySelectorAll("button").forEach((b) => (b.disabled = true));
    talk(won ? `${tries ? "Correct — your persistence paid off. Here is why:" : pick(EFFORT)} ${q.why}` : `Let us look at the reasoning. ${q.why}`);
    if (q.work) notes(q.work, { region: q.region || RIGHT });
    quiet(q.after?.(q.api, won));
    await wait(350);
    if (my !== token || q !== qq) return;
    host.classList.remove("gm-pick");
    host.innerHTML = `<div class="ap-buttons"><button type="button" class="primary" data-next>${round + 1 >= R ? "Finish ▶" : "Next ▶"}</button></div>`;
    host.onclick = (event) => {
      if (!event.target.closest("[data-next]")) return;
      window.OC?.touch();
      round += 1;
      if (round >= R) finishGame(id, host, { R, first, noun: cfg.noun, again: restart });
      else ask();
    };
  };
  const answer = (v, button) => {
    if (my !== token || busy || !q || q.locked) return;
    window.OC?.touch();
    if (isRight(v)) {
      button?.classList.add("right");
      MUSIC.chime();
      if (tries === 0) first += 1;
      window.OC?.count(cfg.count);
      return settle(true);
    }
    tries += 1;
    button?.classList.add("wrong");
    MUSIC.oops();
    if (tries < 2) {
      pad?.clear();
      quiet(q.onMiss?.(v, q.api));
      talk(`${pick(NUDGE)} ${q.hint(v)}`);
      return;
    }
    if (q.opts) {
      const i = q.opts.findIndex((o) => isRight(o.v));
      host.querySelectorAll("[data-c]")[i]?.classList.add("right");
    } else if (pad) pad.set(q.ans);
    settle(false);
  };
  const restart = () => {
    round = 0;
    first = 0;
    ask();
  };
  bindTop(id, (lv) => {
    level = lv;
    restart();
  });
  ask();
}

// Options helper: the correct value plus distinct wrong values, sorted when numeric.
const optsOf = (ans, wrongs, fmtF = (v) => String(v), sort = true) => {
  const set = [ans];
  for (const w of wrongs) if (!set.includes(w) && set.length < 4 && (typeof w !== "number" || (Number.isFinite(w) && w > 0))) set.push(w);
  const out = sort && typeof ans === "number" ? set.sort((a, b) => a - b) : shuffle(set);
  return out.map((v) => ({ label: fmtF(v), v }));
};
// Word options: [right, ...wrong] shuffled.
const wordOpts = (right, wrong) => shuffle([right, ...[...new Set(wrong)].filter((w) => w !== right).slice(0, 4)]).map((s) => ({ label: s, v: s }));
const bagOf = () => {
  const bags = {};
  return (key, list) => {
    if (!bags[key]?.length) bags[key] = shuffle(list);
    return bags[key].pop();
  };
};
// A plan per level: each round picks a kind from its slot (a slot may list several kinds).
function planned(plans, gens) {
  const take = bagOf();
  const recent = [];
  return (level, round) => {
    const plan = plans[level];
    const slot = plan[round % plan.length];
    const kind = Array.isArray(slot) ? take(`${level}:${round}`, slot) : slot;
    let q = gens[kind](level);
    // Never repeat a problem met in the last few rounds.
    for (let i = 0; i < 12 && recent.includes(q.ask); i++) q = gens[kind](level);
    recent.push(q.ask);
    if (recent.length > 6) recent.shift();
    q.kind = kind;
    return q;
  };
}

const WEDGE = ["#e53935", "#1e88e5", "#f2a93b"];
// Tear the three corners off a triangle and lay them side by side on a straight line at T.
async function tearDemo(v, api, pts, T, { r = null, letters = ["a", "b", "c"] } = {}) {
  const side = Math.min(dist(pts[0], pts[1]), dist(pts[1], pts[2]), dist(pts[0], pts[2]));
  const rr = r || Math.min(70, side * 0.34);
  const cs = pts.map((V, i) => cornerOf(V, pts[(i + 1) % 3], pts[(i + 2) % 3]));
  const guide = line(v, [T[0] - 230, T[1]], [T[0] + 230, T[1]], { stroke: "#b9a68c", "stroke-width": 4, "stroke-dasharray": "10 8" });
  const groups = cs.map((c, i) => {
    el("path", { d: wedgePath(pts[i][0], pts[i][1], rr, c.start, c.sweep), fill: "#fff", stroke: "#cbbca4", "stroke-width": 2, "stroke-dasharray": "6 5" }, v);
    const g = el("g", { transform: `translate(${pts[i][0]} ${pts[i][1]})` }, v);
    el("path", { d: wedgePath(0, 0, rr, c.start, c.sweep), fill: WEDGE[i], "fill-opacity": 0.9, stroke: "#fff", "stroke-width": 3 }, g);
    const p = at(0, 0, rr * 0.62, c.start + c.sweep / 2);
    const t = text(g, p[0], p[1] + 9, letters[i], { "font-size": 26, fill: "#fff", "font-style": "italic" });
    g._lab = { t, p };
    return g;
  });
  await api.wait(700);
  let s = 0;
  for (let i = 0; i < 3; i++) {
    const c = cs[i];
    let rho = norm(s - c.start);
    if (rho > 180) rho -= 360;
    const from = pts[i];
    MUSIC.play("xylophone", 72 + i * 4, { gain: 0.3 });
    await api.tween(1100, (t) => {
      const p = lerpP(from, T, t);
      groups[i].setAttribute("transform", `translate(${p[0]} ${p[1]}) rotate(${-rho * t})`);
      groups[i]._lab.t.setAttribute("transform", `rotate(${rho * t} ${groups[i]._lab.p[0]} ${groups[i]._lab.p[1]})`);
    });
    s += c.sweep;
    await api.wait(250);
  }
  guide.setAttribute("stroke", GREEN);
  guide.removeAttribute("stroke-dasharray");
  return guide;
}

// Roll a circle along a line for one full turn: the trace is the circumference.
async function rollOut(v, api, { x0, y, r, label = true }) {
  line(v, [x0 - 20, y], [x0 + 2 * Math.PI * r + 40, y], { stroke: "#b9a68c", "stroke-width": 4 });
  const trace = line(v, [x0, y], [x0, y], { stroke: RED, "stroke-width": 8 });
  const g = el("g", {}, v);
  el("circle", { r, fill: "#fff3d6", stroke: INK, "stroke-width": 5 }, g);
  line(g, [0, -r], [0, r], { stroke: BLUE, "stroke-width": 4 });
  dot(g, [0, r], { r: 9, fill: RED });
  const place = (d) => g.setAttribute("transform", `translate(${x0 + d} ${y - r}) rotate(${(d / r) * (180 / Math.PI)})`);
  place(0);
  await api.wait(500);
  // Lay diameters along the line first.
  const d = 2 * r;
  for (let k = 0; k < 3; k++) {
    const seg = line(v, [x0 + k * d, y + 22], [x0 + (k + 1) * d, y + 22], { stroke: BLUE, "stroke-width": 6 });
    line(v, [x0 + (k + 1) * d, y + 12], [x0 + (k + 1) * d, y + 32], { stroke: BLUE, "stroke-width": 4 });
    if (label) text(v, x0 + k * d + r, y + 58, `d`, { "font-size": 26, fill: BLUE, "font-style": "italic" });
    await fadeIn(api, seg, 300);
  }
  const L = 2 * Math.PI * r;
  await api.tween(2600, (t) => {
    place(t * L);
    trace.setAttribute("x2", x0 + t * L);
  });
  MUSIC.chime();
  if (label) {
    const extra = text(v, x0 + 3 * d + (L - 3 * d) / 2, y + 58, "+ ≈0.14d", { "font-size": 22, fill: RED });
    await fadeIn(api, extra, 400);
  }
  return L;
}

// Cut a circle into sectors and lay them alternately up and down: nearly a rectangle πr by r.
async function sectorsDemo(v, api, { cx, cy, r, n = 16, X0, Y }) {
  const a = 360 / n;
  const chord = 2 * r * Math.sin((a / 2) * RAD);
  const gs = [];
  for (let i = 0; i < n; i++) {
    const g = el("g", { transform: `translate(${cx} ${cy})` }, v);
    el("path", { d: wedgePath(0, 0, r, i * a, a), fill: i % 2 ? "#64b5f6" : "#ffb74d", stroke: "#fff", "stroke-width": 2 }, g);
    gs.push(g);
  }
  await api.wait(900);
  const order = [];
  for (let i = 0; i < n; i++) order.push(i);
  const targets = order.map((i, k) => {
    const m = i * a + a / 2;
    const down = k % 2 === 0;
    const x = X0 + chord / 2 + (k * chord) / 2;
    return down ? { x, y: Y - r * Math.cos((a / 2) * RAD), rho: norm(-90 - m) } : { x, y: Y, rho: norm(90 - m) };
  });
  await api.tween(2200, (t) => {
    gs.forEach((g, i) => {
      const T = targets[i];
      let rho = T.rho > 180 ? T.rho - 360 : T.rho;
      const p = lerpP([cx, cy], [T.x, T.y], t);
      g.setAttribute("transform", `translate(${p[0]} ${p[1]}) rotate(${-rho * t})`);
    });
  });
  return { width: (n / 2) * chord + chord / 2, height: r * Math.cos((a / 2) * RAD) };
}

// Slide the left triangle of a parallelogram to the right: it becomes a rectangle.
async function paraSlide(v, api, { x, y, b, h, o }) {
  // Parallelogram: bottom-left (x, y), bottom-right (x+b, y), top-right (x+b+o, y-h), top-left (x+o, y-h).
  const hole = poly(v, [[x, y], [x + o, y], [x + o, y - h]], { fill: "#fff", stroke: "#cbbca4", "stroke-width": 3, "stroke-dasharray": "8 7", opacity: 0 });
  const piece = poly(v, [[x, y], [x + o, y], [x + o, y - h]], { fill: "#f6c49a", stroke: RED, "stroke-width": 4 });
  const cut = line(v, [x + o, y], [x + o, y - h], { stroke: RED, "stroke-width": 4, "stroke-dasharray": "10 8" });
  await fadeIn(api, cut, 400);
  await api.wait(400);
  hole.setAttribute("opacity", 1);
  await api.tween(1500, (t) => piece.setAttribute("transform", `translate(${b * t} 0)`));
  MUSIC.chime();
}

    const A = P[(i + 1) % 3];
    const B = P[(i + 2) % 3];
    return (A[0] - V[0]) * (B[0] - V[0]) + (A[1] - V[1]) * (B[1] - V[1]);

const BASE_TRIPLES = [[3, 4, 5], [5, 12, 13], [8, 15, 17], [7, 24, 25], [20, 21, 29], [9, 40, 41]];
function triple(maxC = 60) {
  for (;;) {
    const [a, b, c] = pick(BASE_TRIPLES);
    const k = pickInt(1, Math.max(1, Math.floor(maxC / c)));
    if (c * k <= maxC) return Math.random() < 0.5 ? [a * k, b * k, c * k] : [b * k, a * k, c * k];
  }
}
// Right triangle with the squares on all three sides (right angle at C).
function squaresFigure(a, b, { labels, box = { x: 30, y: 30, w: 500, h: 500 } }) {
  // Math coords: C = (0, 0), B = (a, 0), A = (0, b).
  const C = [0, 0];
  const B = [a, 0];
  const A = [0, b];
  const sqA = [C, B, [a, -a], [0, -a]];
  const sqB = [C, A, [-b, b], [-b, 0]];
  const sqC = [B, A, [b, b + a], [a + b, a]];
  const all = [...sqA, ...sqB, ...sqC];
  const pts = fitPts(all, box);
  const map = new Map(all.map((p, i) => [p.join(","), pts[i]]));
  const M = (p) => map.get(p.join(","));
  poly(view, sqA.map(M), { fill: "#90caf9", "fill-opacity": 0.7 });
  poly(view, sqB.map(M), { fill: "#a5d6a7", "fill-opacity": 0.7 });
  poly(view, sqC.map(M), { fill: "#ffcc80", "fill-opacity": 0.7 });
  poly(view, [C, B, A].map(M), { fill: "#fff" });
  mark(view, M(C), 0, 90, { r: 26, color: RED });
  const cen = (sq) => {
    const P = sq.map(M);
    return [P.reduce((s, p) => s + p[0], 0) / 4, P.reduce((s, p) => s + p[1], 0) / 4];
  };
  [sqA, sqB, sqC].forEach((sq, i) => {
    const c = cen(sq);
    text(view, c[0], c[1] + 10, labels[i], { "font-size": 28, fill: INK });
  });
}

  el("rect", { x: 0, y: 0, width: 562, height: 560, fill: "#fff" }, g);
  text(g, 280, 120, "Same big square, same 4 triangles.", { "font-size": 26, fill: INK });
  for (const dx of [0, 270]) el("rect", { x: ox + dx, y: oy - S * k, width: S * k, height: S * k, fill: "#fffaf1", stroke: INK, "stroke-width": 4 }, g);

  const tri2 = [[[a, a], [0, a], [a, S]], [[S, 0], [S, a], [a, 0]], [[a, a], [a, 0], [S, a]], [[0, S], [a, S], [0, a]]];
  const cols = ["#ef9a9a", "#ce93d8", "#80cbc4", "#fff59d"];
  const left = tri1.map((t, i) => poly(g, t.map(P), { fill: cols[i], "stroke-width": 3 }));
  text(g, ox + (S * k) / 2, oy - (S * k) / 2 + 10, "c²", { "font-size": 30, fill: INK });
  const right = tri1.map((t, i) => poly(g, t.map(([x, y]) => [P([x, y])[0] + 270, P([x, y])[1]]), { fill: cols[i], "stroke-width": 3 }));
  await fadeIn(api, g, 500);
  await api.wait(700);
  await api.tween(1800, (t) => {
    right.forEach((node, i) => {
      const pts = tri1[i].map((p, j) => lerpP(p, tri2[i][j], t)).map(P).map(([x, y]) => [x + 270, y]);
      node.setAttribute("points", pts.map((p) => p.join(",")).join(" "));

  text(g, lb[0] + 270, lb[1] + 10, "b²", { "font-size": 28, fill: INK });

}

        caseNotes(["The minute hand moves 6° per minute.", "The hour hand moves 30° per hour, and also 0.5° per minute."]);
      },
      hint: () => (m === 0 ? "Between two neighbouring numbers on a clock there are 360° ÷ 12 = 30°. Count the gaps." : `Where is each hand, measured clockwise from 12? Minute: 6° × ${m}. Hour: 30° × ${h % 12} + 0.5° × ${m}.`),
      why: m === 0 ? `${Math.min(h % 12, 12 - (h % 12))} gaps of 30°: ${ang}°.` : `Minute hand at ${6 * m}°, hour hand at ${30 * (h % 12) + 0.5 * m}°. Difference ${Math.abs(30 * (h % 12) - 5.5 * m)}°${Math.abs(30 * (h % 12) - 5.5 * m) > 180 ? `, so the smaller angle is 360° − that = ${ang}°` : ""}.`,
      work: [`Minute: 6 × ${m} = ${6 * m}°`, `Hour: 30 × ${h % 12} + 0.5 × ${m} = ${30 * (h % 12) + 0.5 * m}°`, `Smaller angle: ${ang}°`],
    };
  },
  tilted(level) {
    const a = pickInt(1, level === "easy" ? 3 : 6);
    let b;
    do b = pickInt(1, level === "easy" ? 4 : 7);
    while (b === a && level !== "easy");
    const S = a + b;
    return {
      ask: `A square of side ${S} has a tilted square inside it. Each corner of the tilted square is ${a} from a corner of the big square (as shown). What is the area of the tilted square?`,
      max: 3,
      ans: a * a + b * b,
      draw() {
        const k = 400 / S;
        const P = ([x, y]) => [80 + x * k, 480 - y * k];
        poly(view, [[0, 0], [S, 0], [S, S], [0, S]].map(P), { fill: "#ef9a9a" });
        poly(view, [[a, 0], [S, a], [b, S], [0, b]].map(P), { fill: "#fff3d6" });
        text(view, P([a / 2, 0])[0], 515, `${a}`, { "font-size": 26, fill: INK });
        text(view, P([a + b / 2, 0])[0], 515, `${b}`, { "font-size": 26, fill: INK });
        caseNotes(["Big square minus the four corner triangles.", "(Or: Pythagoras on one corner triangle.)"]);
      },
      hint: () => `The big square has area ${S * S}. Each corner triangle is ½ × ${a} × ${b}. Subtract all four.`,
      why: `${S}² − 4 × ½ × ${a} × ${b} = ${S * S} − ${2 * a * b} = ${a * a + b * b}. (Also: ${a}² + ${b}², by Pythagoras.)`,
      work: [`Big: ${S}² = ${S * S}`, `Triangles: 4 × ½ × ${a} × ${b} = ${2 * a * b}`, `Tilted: ${S * S} − ${2 * a * b} = ${a * a + b * b}`],
    };
  },
  star() {
    return {
      ask: "In any five-pointed star drawn with five straight lines (like the one shown), what do the five tip angles add up to?",
      max: 3,
      ans: 180,
      draw() {
        const P = Array.from({ length: 5 }, (_, i) => at(280, 300, 230, 90 + 72 * i + pickInt(-8, 8)));
        const order = [0, 2, 4, 1, 3];
        poly(view, order.map((i) => P[i]), { fill: "#fff59d", "fill-rule": "nonzero" });
        order.forEach((i, j) => {
          const prev = P[order[(j + 4) % 5]];
          const next = P[order[(j + 1) % 5]];
          corner(view, P[i], prev, next, { r: 34, color: RED });
        });
        caseNotes(["Use the exterior angle theorem twice.", "Look for one triangle that collects all five tips."]);
      },
      hint: () => "Pick one tip. Its triangle's other two angles are exterior angles of smaller triangles, each the sum of two other tips.",
      why: "Each of two angles in the triangle at one tip is an exterior angle of a small triangle, so it equals the sum of two other tips. That one triangle then holds all five tips, so they add to 180°.",
      work: ["Exterior angle = sum of remote interior angles.", "Two such angles collect four tips.", "With the fifth tip: one triangle → 180°."],
    };
  },
  lines(level) {
    const n = pickInt(3, level === "hard" ? 12 : 7);
    const regions = level !== "easy" && Math.random() < 0.5;
    const ans = regions ? 1 + n + choose2(n) : choose2(n);
    return {
      ask: regions ? `${n} straight lines are drawn on a page. No two are parallel and no three meet at one point. Into how many regions do they divide the page?` : `${n} straight lines are drawn. No two are parallel and no three meet at one point. How many crossing points are there?`,
      max: 3,
      ans,
      draw() {
        const m = Math.min(n, 5);
        // Tangent lines to one circle: no two parallel and no three through one point.
        const cp = el("clipPath", { id: "gm-lines-clip" }, view);
        el("rect", { x: 20, y: 20, width: 530, height: 520 }, cp);
        const lg = el("g", { "clip-path": "url(#gm-lines-clip)" }, view);
        for (let i = 0; i < m; i++) {
          const th = 15 + i * 67;
          const c = at(280, 290, 80, th);
          line(lg, at(c[0], c[1], 420, th + 90), at(c[0], c[1], 420, th - 90), { "stroke-width": 4, stroke: [INK, BLUE, RED, GREEN, PURPLE][i] });
        }
        caseNotes([...(n > m ? [`The picture shows ${m} of the ${n} lines.`] : []), "Every two lines cross exactly once.", regions ? "Each new line is cut into pieces by the lines already there; each piece splits one region in two." : "Count the pairs of lines."]);
      },
      hint: () => (regions ? `The k-th new line crosses the ${"k − 1"} earlier lines, so it is cut into k pieces and adds k regions. Start from 1 region.` : `Each pair of lines makes one crossing. How many pairs of ${n} lines?`),
      why: regions ? `Start with 1 region; line k adds k regions: 1 + (1 + 2 + … + ${n}) = 1 + ${(n * (n + 1)) / 2} = ${ans}.` : `Pairs of lines: ${n} × ${n - 1} ÷ 2 = ${ans}.`,
      work: regions ? ["Regions = 1 + 1 + 2 + … + n", `= 1 + ${(n * (n + 1)) / 2} = ${ans}`] : [`${n} × ${n - 1} ÷ 2 = ${ans}`],
    };
  },
  strips(level) {
    const n = pickInt(2, level === "easy" ? 3 : 6);
    const t = pickInt(1, level === "easy" ? 4 : 8);
    const s = n * t;
    const P = 2 * (s + t);
    return {
      ask: `A square is cut into ${n} identical rectangular strips. Each strip has a perimeter of ${P} cm. What is the perimeter of the square?`,
      max: 3,
      ans: 4 * s,
      draw() {
        const k = 400 / n;
        for (let i = 0; i < n; i++) el("rect", { x: 80 + i * k, y: 80, width: k, height: 400, fill: i % 2 ? "#bbdefb" : "#ffe0b2", stroke: INK, "stroke-width": 4 }, view);
        caseNotes([`Each strip is 1/${n} of the square's width.`, "Call the square's side s."]);
      },
      hint: () => `One strip is s by s/${n}. Its perimeter is 2 × (s + s/${n}). In 'strip widths', s is ${n} widths, so the perimeter is ${2 * (n + 1)} widths.`,
      why: `Strip width w, square side ${n}w. Strip perimeter 2(${n}w + w) = ${2 * (n + 1)}w = ${P}, so w = ${t} and the side is ${s}. Square perimeter = 4 × ${s} = ${4 * s} cm.`,
      work: [`Perimeter of strip = ${2 * (n + 1)}w = ${P}`, `w = ${t}`, `side = ${n} × ${t} = ${s}`, `4 × ${s} = ${4 * s} cm`],
    };
  },
  cubeEdges() {
    const s = pickInt(2, 9);
    return {
      ask: `The 12 edges of a cube have a total length of ${12 * s} cm. What is the cube's volume (in cm³)?`,
      max: 3,
      ans: s ** 3,
      draw() {
        drawBox(4, 4, 4, [null, null, null]);
        caseNotes(["A cube has 12 equal edges."]);
      },
      hint: () => `One edge: ${12 * s} ÷ 12.`,
      why: `Edge = ${12 * s} ÷ 12 = ${s} cm. Volume = ${s}³ = ${s ** 3} cm³.`,
      work: [`Edge: ${12 * s} ÷ 12 = ${s}`, `V = ${s}³ = ${s ** 3} cm³`],
    };
  },
  cutBox(level) {
    const c = pickInt(1, level === "easy" ? 2 : 4);
    const L = 2 * c + pickInt(2, 10);
    const Wd = 2 * c + pickInt(2, 8);
    const ans = (L - 2 * c) * (Wd - 2 * c) * c;
    return {
      ask: `From a ${L} cm by ${Wd} cm sheet of card, a ${c} cm square is cut from each corner. The sides are folded up into an open box. What is its volume (in cm³)?`,
      max: 4,
      ans,
      draw() {
        const F = frameOf(L, Wd, { maxCell: 32 });
        const S = [[0, 0], [L, 0], [L, Wd], [0, Wd]].map(F.S);
        poly(view, S, { fill: "#ffe0b2" });
        for (const [x, y] of [[0, 0], [L - c, 0], [L - c, Wd - c], [0, Wd - c]]) poly(view, [[x, y], [x + c, y], [x + c, y + c], [x, y + c]].map(F.S), { fill: "#fff", "stroke-dasharray": "8 6", "stroke-width": 3 });
        poly(view, [[c, c], [L - c, c], [L - c, Wd - c], [c, Wd - c]].map(F.S), { fill: "none", stroke: SOFT, "stroke-width": 3, "stroke-dasharray": "10 8" });
        sideLabel(view, S[0], S[1], `${L} cm`, S);
        sideLabel(view, S[1], S[2], `${Wd} cm`, S);
        caseNotes(["The base shrinks by a corner square at BOTH ends.", "The height is the corner size."]);
      },
      hint: () => `Base: (${L} − ${2 * c}) by (${Wd} − ${2 * c}). Height: ${c}.`,
      why: `Base ${L - 2 * c} × ${Wd - 2 * c}, height ${c}: volume ${ans} cm³.`,
      work: [`Length ${L} − ${2 * c} = ${L - 2 * c}`, `Width ${Wd} − ${2 * c} = ${Wd - 2 * c}`, `V = ${L - 2 * c} × ${Wd - 2 * c} × ${c} = ${ans} cm³`],
    };
  },
  polyIso() {
    const n = pick([5, 6, 9, 10, 12, 18]);
    const ans = 180 / n;
    return {
      ask: `ABC… is a regular polygon with ${n} sides, and A, B, C are three corners in a row. What is angle BAC?`,
      max: 3,
      ans,
      draw() {
        const P = regular(n, [280, 300], 220, 90 + 180 / n);
        poly(view, P, { fill: "#e7f1fb" });
        poly(view, [P[0], P[1], P[2]], { fill: "#ffcc80", "fill-opacity": 0.8 });
        corner(view, P[0], P[1], P[2], { r: 46, color: RED, lab: "?", labR: 80 });
        names(view, [P[0], P[1], P[2]], ["A", "B", "C"], { push: 26 });
        caseNotes(["AB = BC (sides of a regular polygon).", "So triangle ABC is isosceles."]);
      },
      hint: () => `Angle ABC is an interior angle: (${n} − 2) × 180° ÷ ${n}. The other two angles of triangle ABC are equal.`,
      why: `Interior angle ABC = ${((n - 2) * 180) / n}°. Triangle ABC is isosceles, so angle BAC = (180° − ${((n - 2) * 180) / n}°) ÷ 2 = ${ans}°.`,
      work: [`∠ABC = ${((n - 2) * 180) / n}°`, `∠BAC = (180 − ${((n - 2) * 180) / n}) ÷ 2`, `= ${ans}°`],
    };
  },
};
