<script>const { $, el, svg: makeSvg, text, panel, say, pick, pickInt, wait, confetti, PRAISE, KIND, choices, numpad, explain, everyday, emoji } = KIT;
const stage = $("[data-stage]");
const W = 1000;
const H = 560;
let token = 0;
let view = null;

const UNITS = [
  { id: "f0", label: "See it", icon: "👀" },
  { id: "f1", label: "1. Cut the pizza" },
  { id: "f2", label: "2. Which is bigger?" },
  { id: "f3", label: "3. Equal fractions" },
  { id: "f5", label: "4. Fractions on a number line", icon: "📏" },
  { id: "f4", label: "5. Fraction of a number" },
  { id: "f6", label: "6. Add fractions", icon: "➕" },
  { id: "f7", label: "7. Tenths and decimals", icon: "🔟" },
];
const fresh = () => {
  stage.innerHTML = "";
  view = makeSvg(`0 0 ${W} ${H}`, stage);
  return view;
};
const gcd = (a, b) => (b ? gcd(b, a % b) : a);
const fracHtml = (n, d) => `<span class="fr"><sup>${n}</sup><sub>${d}</sub></span>`;
const fracWords = (n, d) => {
  const names = { 2: "half", 3: "third", 4: "quarter", 5: "fifth", 6: "sixth", 8: "eighth", 10: "tenth", 12: "twelfth" };
  return `${n} ${names[d] || `${d}th`}${n === 1 ? "" : "s"}`;
};
const style = document.createElement("style");
style.textContent = `.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 .15em;font-weight:800}.fr sup{border-bottom:2px solid currentColor;padding:0 .15em .05em}.fr sub{padding-top:.05em}.fr sup,.fr sub{font-size:.8em;vertical-align:baseline}.slice,.part{cursor:pointer}`;
document.head.appendChild(style);

function pizza(cx, cy, r, d, { shaded = new Set(), onTap, tint = "#e0603a" } = {}) {
  const g = el("g", {}, view);
  el("circle", { cx, cy: cy + 8, r: r + 6, fill: "#3a2210", opacity: 0.12 }, g);
  el("circle", { cx, cy, r: r + 10, fill: "#e8b46c", stroke: "#b8823c", "stroke-width": 3 }, g);
  for (let i = 0; i < d; i++) {
    const a0 = (i / d) * Math.PI * 2 - Math.PI / 2;
    const a1 = ((i + 1) / d) * Math.PI * 2 - Math.PI / 2;
    const large = a1 - a0 > Math.PI ? 1 : 0;
    const p = d === 1 ? `M${cx - r} ${cy}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0` : `M${cx} ${cy}L${cx + r * Math.cos(a0)} ${cy + r * Math.sin(a0)}A${r} ${r} 0 ${large} 1 ${cx + r * Math.cos(a1)} ${cy + r * Math.sin(a1)}Z`;
    const s = el("path", { class: "slice", d: p, "data-i": i, fill: shaded.has(i) ? tint : "#fbe7b5", stroke: "#b8823c", "stroke-width": 3, "stroke-linejoin": "round" }, g);
    if (shaded.has(i)) {
      const am = (a0 + a1) / 2;
      for (const [k, rr] of [[0, 0.55], [1, 0.75]]) {
        if (d > 6 && k) continue;
        el("circle", { cx: cx + r * rr * Math.cos(am + k * 0.18), cy: cy + r * rr * Math.sin(am + k * 0.18), r: r * 0.07, fill: "#b2342a", "pointer-events": "none" }, g);
      }
    }
  }
  if (onTap)
    g.addEventListener("pointerdown", (event) => {
      const s = event.target.closest(".slice");
      if (s) onTap(Number(s.dataset.i));
    });
  return g;
}

function bar(x, y, w, h, d, { shaded = new Set(), onTap, tint = "#3f7d4e", label = true } = {}) {
  const g = el("g", {}, view);
  for (let i = 0; i < d; i++) {
    const r = el("rect", { class: "part", "data-i": i, x: x + (i * w) / d, y, width: w / d, height: h, fill: shaded.has(i) ? tint : "#fffcf6", stroke: "#5a4130", "stroke-width": 3 }, g);
    if (label && w / d > 44) text(g, x + (i + 0.5) * (w / d), y + h / 2 + 9, `1/${d}`, { "font-size": 22, fill: shaded.has(i) ? "#fff" : "#8a7764", "pointer-events": "none" });
  }
  if (onTap)
    g.addEventListener("pointerdown", (event) => {
      const s = event.target.closest(".part");
      if (s) onTap(Number(s.dataset.i));
    });
  return g;
}

// Shared helpers for the newer units: difficulty chips, a calm tween, stacked fractions in the SVG.
const LEVELS = [["easy", "🐣 Easy"], ["medium", "🦊 Medium"], ["hard", "🦁 Hard"]];
const levelRow = (cur) => `<div class="ap-row"><div class="ap-chips" data-levels>${LEVELS.map(([k, l]) => `<button type="button" data-lv="${k}" aria-pressed="${k === cur}">${l}</button>`).join("")}</div><p class="ap-status" data-status></p></div>`;
const onLevels = (id, fn) =>
  $("[data-levels]").addEventListener("click", (event) => {
    const b = event.target.closest("[data-lv]");
    if (!b) return;
    document.querySelectorAll("[data-lv]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    shell.mark(id, { level: b.dataset.lv });
    window.OC?.touch();
    fn(b.dataset.lv);
  });
const tween = (ms, fn, alive) =>
  new Promise((resolve) => {
    if (KIT.still.matches) {
      fn(1);
      return resolve(true);
    }
    const t0 = performance.now();
    const frame = (now) => {
      if (!alive()) return resolve(false);
      const t = Math.min(1, (now - t0) / ms);
      fn(t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
      if (t < 1) requestAnimationFrame(frame);
      else resolve(true);
    };
    requestAnimationFrame(frame);
  });
function fracSvg(parent, x, y, n, d, size = 40, fill = "#2b1d12") {
  const g = el("g", { "pointer-events": "none" }, parent);
  const half = size * (0.38 + 0.28 * (Math.max(String(n).length, String(d).length) - 1));
  text(g, x, y - size * 0.18, n, { "font-size": size, fill });
  el("line", { x1: x - half, x2: x + half, y1: y, y2: y, stroke: fill, "stroke-width": Math.max(3, size / 11), "stroke-linecap": "round" }, g);
  text(g, x, y + size * 0.82, d, { "font-size": size, fill });
  return g;
}
// Lay out a sum like [[2, 5], "+", [1, 5], "=", "?"] centred on x.
function eqSvg(parent, x, y, items, size = 44, fill = "#2b1d12") {
  const widths = items.map((it) => (Array.isArray(it) ? size * 1.4 : size * (0.55 * String(it).length + 0.5)));
  let at = x - widths.reduce((a, b) => a + b, 0) / 2;
  const g = el("g", {}, parent);
  items.forEach((it, i) => {
    const cx = at + widths[i] / 2;
    if (Array.isArray(it)) fracSvg(g, cx, y, it[0], it[1], size, fill);
    else text(g, cx, y + size * 0.35, it, { "font-size": size * 1.1, fill: it === "?" ? "var(--accent)" : fill });
    at += widths[i];
  });
  return g;
}
const fkStyle = document.createElement("style");
fkStyle.textContent = `.fk-pick .kt-choices button{min-height:64px;min-width:88px;font-size:26px;border-radius:20px}.fr-tick{cursor:pointer}@media (max-height:460px),(max-width:420px) and (max-height:720px){.fk-pick .kt-choices button{min-height:50px;min-width:66px;font-size:20px}}`;
document.head.appendChild(fkStyle);

const units = {
  f0() {
    const my = token;
    const label = (v, cx, cy, r, d, size) => {
      for (let i = 0; i < d; i++) {
        const am = ((i + 0.5) / d) * Math.PI * 2 - Math.PI / 2;
        fracSvg(v, cx + r * 0.55 * Math.cos(am), cy + r * 0.55 * Math.sin(am) - 4, 1, d, size);
      }
    };
    const fade = (api, node, ms = 600) => api.tween(ms, (t) => node.setAttribute("opacity", t));
    explain(
      [
        { say: "Why do we learn fractions? A fraction is a part of a whole. We use them when we share, cook, and tell the time!", draw: everyday([["🍕", "Sharing pizza"], ["⏰", "Half an hour"], ["🥣", "A quarter cup in baking"], ["⚽", "Half time in a game"]]) },
        {
          say: "Here is one whole pizza. Cut it into 2 equal parts: halves. Cut again: 4 equal parts, quarters!",
          async draw(v, api) {
            view = v;
            const cx = 360;
            const cy = 275;
            const r = 200;
            let pz = pizza(cx, cy, r, 1);
            const cap = text(v, 790, 290, "1 whole", { "font-size": 52, fill: "#2b1d12" });
            await api.wait(1200);
            const cut = async (x1, y1, x2, y2) => {
              const knife = el("line", { x1, y1, x2: x1, y2: y1, stroke: "#5a4130", "stroke-width": 7, "stroke-linecap": "round" }, v);
              MUSIC.play("woodblock", 79, { gain: 0.3 });
              await api.tween(900, (t) => {
                knife.setAttribute("x2", x1 + (x2 - x1) * t);
                knife.setAttribute("y2", y1 + (y2 - y1) * t);
              });
              knife.remove();
            };
            await cut(cx, cy - r - 30, cx, cy + r + 30);
            pz.remove();
            pz = pizza(cx, cy, r, 2);
            const l2 = el("g", { opacity: 0 }, v);
            label(l2, cx, cy, r, 2, 40);
            cap.textContent = "2 halves";
            await fade(api, l2);
            await api.wait(1600);
            await cut(cx - r - 30, cy, cx + r + 30, cy);
            pz.remove();
            l2.remove();
            pz = pizza(cx, cy, r, 4);
            const l4 = el("g", { opacity: 0 }, v);
            label(l4, cx, cy, r, 4, 36);
            cap.textContent = "4 quarters";
            await fade(api, l4);
          },
        },
        {
          say: "Fraction parts must be equal. If one piece is bigger, they are not halves. Equal pieces are fair!",
          async draw(v, api) {
            const cake = (x, cutAt, faces, ok) => {
              const g = el("g", { opacity: 0 }, v);
              el("rect", { x, y: 170, width: 360, height: 190, rx: 18, fill: "#c98c58", stroke: "#7a4520", "stroke-width": 4 }, g);
              el("rect", { x, y: 170, width: 360, height: 44, rx: 18, fill: "#fbe7e9", stroke: "#7a4520", "stroke-width": 4 }, g);
              const knife = el("line", { x1: x + cutAt, x2: x + cutAt, y1: 150, y2: 150, stroke: "#2b1d12", "stroke-width": 7, "stroke-linecap": "round" }, g);
              const after = el("g", { opacity: 0 }, g);
              emoji(after, x + cutAt / 2, 110, faces[0], 64);
              emoji(after, x + cutAt + (360 - cutAt) / 2, 110, faces[1], 64);
              text(after, x + 180, 440, ok ? "✓ Equal: halves" : "✗ Not equal", { "font-size": 40, fill: ok ? "#2e7d46" : "#c0392b" });
              return { g, knife, after };
            };
            const left = cake(70, 255, ["😃", "😢"], false);
            const right = cake(570, 180, ["😊", "😊"], true);
            await fade(api, left.g);
            await fade(api, right.g);
            for (const c of [left, right]) {
              await api.tween(800, (t) => c.knife.setAttribute("y2", 150 + 230 * t));
              MUSIC.play("woodblock", 79, { gain: 0.3 });
              await fade(api, c.after, 600);
              await api.wait(900);
            }
          },
        },
        {
          say: "The bottom number tells how many equal parts. The top number tells how many we have. 3 of 4 parts is three quarters.",
          async draw(v, api) {
            view = v;
            const cx = 320;
            const cy = 280;
            const shaded = new Set();
            let pz = pizza(cx, cy, 200, 4);
            text(v, 760, 92, "parts we have", { "font-size": 30, fill: "#e0603a" });
            text(v, 760, 500, "equal parts in all", { "font-size": 30, fill: "#5a4130" });
            const top = text(v, 760, 250, "0", { "font-size": 110, fill: "#e0603a" });
            el("line", { x1: 690, x2: 830, y1: 285, y2: 285, stroke: "#2b1d12", "stroke-width": 8, "stroke-linecap": "round" }, v);
            text(v, 760, 410, "4", { "font-size": 110, fill: "#2b1d12" });
            await api.wait(1200);
            for (let i = 0; i < 3; i++) {
              shaded.add(i);
              const old = pz;
              pz = pizza(cx, cy, 200, 4, { shaded });
              v.insertBefore(pz, old);
              old.remove();
              top.textContent = i + 1;
              MUSIC.play("xylophone", 76 + i * 2, { gain: 0.4 });
              await api.wait(1000);
            }
          },
        },
        {
          say: "One half and two quarters cover the same amount. So 1/2 = 2/4. They are equal fractions!",
          async draw(v, api) {
            view = v;
            fracSvg(v, 80, 168, 1, 2, 38, "#e0603a");
            bar(150, 110, 760, 110, 2, { shaded: new Set([0]), tint: "#e0603a" });
            const lower = el("g", {}, v);
            view = lower;
            fracSvg(lower, 80, 368, 2, 4, 38, "#3f7d4e");
            const b4 = bar(150, 310, 760, 110, 4, { shaded: new Set([0, 1]), tint: "#3f7d4e" });
            view = v;
            await api.wait(1500);
            await api.tween(1300, (t) => {
              lower.setAttribute("transform", `translate(0 ${-200 * t})`);
              b4.setAttribute("opacity", 1 - 0.45 * t);
            });
            await api.wait(1400);
            await api.tween(1100, (t) => {
              lower.setAttribute("transform", `translate(0 ${-200 * (1 - t)})`);
              b4.setAttribute("opacity", 0.55 + 0.45 * t);
            });
            const eq = el("g", { opacity: 0 }, v);
            eqSvg(eq, 500, 480, [[1, 2], "=", [2, 4]], 40);
            await fade(api, eq, 700);
          },
        },
        {
          say: "Fractions work with groups too. Share 12 strawberries on 4 plates. One plate is 1/4 of 12. That is 3!",
          async draw(v, api) {
            const plates = [170, 390, 610, 830];
            plates.forEach((x) => el("ellipse", { cx: x, cy: 330, rx: 95, ry: 48, fill: "#fffcf6", stroke: "#c9b8a1", "stroke-width": 4 }, v));
            const berries = [];
            for (let i = 0; i < 12; i++) berries.push(emoji(v, 115 + i * 70, 80, "🍓", 54));
            await api.wait(1200);
            for (let i = 0; i < 12; i++) {
              const p = i % 4;
              const k = Math.floor(i / 4);
              const sx = 115 + i * 70;
              const tx = plates[p] + (k - 1) * 48;
              const node = berries[i];
              await api.tween(300, (t) => node.setAttribute("transform", `translate(${(tx - sx) * t} ${(315 - 80) * t})`));
              MUSIC.play("woodblock", 79, { gain: 0.25 });
            }
            await api.wait(500);
            const ring = el("ellipse", { cx: plates[0], cy: 330, rx: 112, ry: 64, fill: "none", stroke: "var(--accent)", "stroke-width": 6, "stroke-dasharray": "14 10", opacity: 0 }, v);
            const eq = el("g", { opacity: 0 }, v);
            eqSvg(eq, 500, 450, [[1, 4], "of 12 =", 3], 40);
            await fade(api, ring);
            await fade(api, eq);
          },
        },
      ],
      { alive: () => my === token, onDone: () => shell.go("f1"), title: "Fractions" }
    );
  },

  f5() {
    const my = token;
    let level = shell.progress().f5?.level || "easy";
    let round = 0;
    let right = 0;
    let q = null;
    let missed = false;
    let busy = false;
    let bug = null;
    panel(levelRow(level));
    const L = 110;
    const R = 890;
    const LY = 360;
    const xOf = (k) => L + (k / (q.d * q.wholes)) * (R - L);
    const make = () => {
      if (level === "easy") {
        const d = pick([2, 4, 4]);
        return { d, n: pickInt(1, d - 1), wholes: 1 };
      }
      if (level === "medium") {
        const d = pick([3, 5, 6, 8]);
        return { d, n: pickInt(1, d - 1), wholes: 1 };
      }
      const d = pick([2, 3, 4, 5, 6]);
      let n = pickInt(1, 2 * d - 1);
      if (n < d && Math.random() < 0.6) n += d;
      return { d, n, wholes: 2 };
    };
    const draw = () => {
      fresh();
      const { d, wholes } = q;
      text(view, 420, 92, "Find", { "font-size": 44, fill: "#2b1d12" });
      fracSvg(view, 530, 78, q.n, d, 46, "#e0603a");
      if (level !== "hard") bar(L, 170, R - L, 80, d, { label: level === "easy", tint: "#f2c94c" });
      else for (let w = 0; w < 2; w++) bar(L + w * ((R - L) / 2), 170, (R - L) / 2, 80, d, { label: false });
      el("line", { x1: L - 30, x2: R + 30, y1: LY, y2: LY, stroke: "#5a4130", "stroke-width": 6, "stroke-linecap": "round" }, view);
      const total = d * wholes;
      const step = (R - L) / total;
      for (let k = 0; k <= total; k++) {
        const x = xOf(k);
        const whole = k % d === 0;
        const g = el("g", { class: "fr-tick", "data-k": k }, view);
        el("rect", { x: x - Math.min(36, step / 2), y: LY - 90, width: Math.min(72, step), height: 170, fill: "transparent" }, g);
        el("line", { x1: x, x2: x, y1: LY - (whole ? 26 : 18), y2: LY + (whole ? 26 : 18), stroke: "#5a4130", "stroke-width": whole ? 6 : 4 }, g);
        if (whole) text(g, x, LY + 70, k / d, { "font-size": 40, fill: "#2b1d12" });
      }
      bug = el("g", {}, view);
      emoji(bug, 0, 0, "🐞", 52);
      bug.setAttribute("transform", `translate(${xOf(0)} ${LY - 42})`);
      view.addEventListener("pointerdown", (event) => {
        const t = event.target.closest(".fr-tick");
        if (t) tap(Number(t.dataset.k));
      });
    };
    const ask = () => {
      q = make();
      missed = false;
      busy = false;
      draw();
      $("[data-status]").textContent = `Round ${round + 1} of 8`;
      say(`Each jump is ${fracHtml(1, q.d)}. Tap where ${fracHtml(q.n, q.d)} goes on the line.`);
    };
    const hopTo = async (k) => {
      for (let j = 1; j <= k; j++) {
        const x0 = xOf(j - 1);
        const x1 = xOf(j);
        const ok = await tween(Math.max(160, 320 - k * 12), (t) => bug.setAttribute("transform", `translate(${x0 + (x1 - x0) * t} ${LY - 42 - Math.sin(t * Math.PI) * 40})`), () => my === token);
        if (!ok) return false;
        MUSIC.play("xylophone", 72 + Math.min(24, j * 2), { gain: 0.35 });
      }
      return true;
    };
    const tap = async (k) => {

    let round = 0;
    let q = null;
    let pad = null;
    panel(`<p class="ap-status" data-status></p><div class="ap-buttons"><button type="button" class="primary" data-do="share">🍪 Share them out</button></div><div data-pad></div>`);
    const ask = () => {
      const d = pick([2, 3, 4, 5]);
      const each = pickInt(2, round < 3 ? 4 : 6);
      const n = round < 3 ? 1 : pickInt(1, d - 1);
      q = { d, each, n, total: d * each, shared: false };
      fresh();
      for (let i = 0; i < q.total; i++) text(view, 120 + (i % 12) * 66, 90 + Math.floor(i / 12) * 66, "🍪", { "font-size": 48, class: "ck", "data-i": i });
      const pw = 860 / d;
      for (let p = 0; p < d; p++) {
        el("ellipse", { cx: 70 + pw * p + pw / 2, cy: 430, rx: Math.min(90, pw / 2 - 10), ry: 52, fill: "#fffcf6", stroke: "#c9b8a1", "stroke-width": 4 }, view);
        if (p < q.n) el("ellipse", { cx: 70 + pw * p + pw / 2, cy: 430, rx: Math.min(98, pw / 2 - 4), ry: 60, fill: "none", stroke: "#e0a96d", "stroke-width": 5, "stroke-dasharray": "10 8" }, view);
      }
      $("[data-status]").textContent = `Question ${round + 1} of 6`;
      $("[data-pad]").innerHTML = "";
      $("[data-do='share']").hidden = false;
      say(`What is ${fracHtml(q.n, q.d)} of ${q.total}? We have ${q.total} cookies and ${q.d} plates. Press Share to deal them out equally.`);
    };
    const share = async () => {
      if (q.shared) return;
      q.shared = true;
      $("[data-do='share']").hidden = true;
      const cookies = [...view.querySelectorAll(".ck")];
      const pw = 860 / q.d;
      for (let i = 0; i < cookies.length; i++) {
        if (my !== token) return;
        const p = i % q.d;
        const k = Math.floor(i / q.d);
        const x = 70 + pw * p + pw / 2 + ((k % 3) - 1) * 30;
        const y = 420 + (Math.floor(k / 3) - 0.5) * 26;
        cookies[i].setAttribute("x", x);
        cookies[i].setAttribute("y", y);
        cookies[i].setAttribute("font-size", 34);
        MUSIC.play("woodblock", 79, { gain: 0.35 });
        await wait(170);
      }
      say(q.n === 1 ? `How many cookies are on one plate? That's 1/${q.d} of ${q.total}.` : `Each plate has the same. How many cookies are on the ${q.n} plates with dotted rings? That's ${q.n}/${q.d} of ${q.total}.`);
      pad = numpad($("[data-pad]"), { onEnter: check, max: 3 });
    };
    const check = async (v) => {
      if (my !== token) return;
      const answer = q.each * q.n;
      if (v === answer) {
        MUSIC.chime();
        round += 1;
        window.OC?.count("shares");
        say(`${pick(PRAISE)} ${q.total} ÷ ${q.d} = ${q.each} on each plate${q.n > 1 ? `, and ${q.n} plates make ${answer}` : ""}. So ${fracHtml(q.n, q.d)} of ${q.total} is ${answer}.`);
        await wait(3400);
        if (my !== token) return;
        if (round >= 6) {
          confetti();
          shell.mark("f4", { done: true });
          say("🎉 You can find fractions of numbers!");
          round = 0;
          await wait(2600);
        }
        if (my === token) ask();
      } else {
        MUSIC.oops();
        pad.clear();
        say(`${pick(KIND)} Count the cookies on ${q.n === 1 ? "one plate" : `the ${q.n} ringed plates`} and try again.`);
      }
    };
    $("[data-panel]").onclick = (event) => {
      if (event.target.closest("[data-do='share']")) share();
    };
    ask();
  },
};

const shell = SHELL({
  units: UNITS,
  how: {
    f0: { icon: "👀", title: "See it", steps: ["Watch the pictures.", "Press Next ▶ to go on.", "Press Let's play when you are ready."] },
    f5: { icon: "📏", title: "Fractions on a number line", steps: ["The line from 0 to 1 is cut into equal jumps.", "Count the jumps the fraction tells you.", "Tap that spot on the line."] },
    f6: { icon: "➕", title: "Add fractions", steps: ["Look at the two colored bars.", "Count all the colored parts together.", "Tap the answer. The bottom number stays the same!"] },
    f7: { icon: "🔟", title: "Tenths and decimals", steps: ["The bar is cut into 10 equal parts.", "Count the purple parts.", "Tap the fraction or decimal that matches."] },
    f1: { icon: "🍕", title: "Cut the pizza", steps: ["The bottom number says how many slices.", "The top number says how many to color.", "Tap slices, then press Check."] },
    f2: { icon: "⚖️", title: "Which is bigger?", steps: ["Look at the two colored bars.", "Which one has more color?", "Tap the bigger fraction, or Equal."] },
    f3: { icon: "🟰", title: "Equal fractions", steps: ["The top bar shows a fraction.", "Color the bottom bar to match it.", "Press Check."] },
    f4: { icon: "🍪", title: "Fraction of a number", steps: ["Press Share to put the cookies on plates.", "Count the cookies the question asks for.", "Type the number and press ✓."] },
  },
  start: "f0",
  onStop() {
    token += 1;
    $("[data-panel]").onclick = null;
  },
  subject: "Math",
  activity: "Fraction Kitchen",
  onUnit(id) {
    token += 1;
    VOICE.hush();
    $("[data-panel]").onclick = null;
    units[id]();
  },
});
MUSIC.preload("xylophone", [76, 77, 79, 81, 83, 84, 86, 88, 91, 96]);
MUSIC.preload("woodblock", [79]);
MUSIC.preload("piano", [64, 67]);
