<body>
<div class="oc-wrap">
  <header class="oc-top"><a class="oc-brand" href="../../"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3 42 9v13c0 11.5-7.6 19.6-18 23C13.6 41.6 6 33.5 6 22V9Z" fill="#7a4520"/><path d="M24 6.4 39 11.4V22c0 9.7-6.3 16.6-15 19.7C15.3 38.6 9 31.7 9 22V11.4Z" fill="#fffcf6"/><path d="M24 14.5c-4.6 0-7.6 2.4-7.9 5.6h15.8c-.3-3.2-3.3-5.6-7.9-5.6Z" fill="#7a4520"/><path d="M17 21.3h14c-.2 6.3-3.1 10.7-7 12.6-3.9-1.9-6.8-6.3-7-12.6Z" fill="#c98c58"/><path d="M24 14.5v-3.2" stroke="#7a4520" stroke-width="2" stroke-linecap="round"/><path d="M19.4 17.3c1.5-1 3-1.4 4.6-1.4M28.6 17.3c-1.5-1-3-1.4-4.6-1.4" stroke="#c98c58" stroke-width="1.2" stroke-linecap="round" fill="none"/></svg><span><b>OakCrest Academy</b><small>Learning at home</small></span></a><span data-chip data-home="../"></span></header>
  <a class="oc-back" href="../">← Math</a>
<style>
.bt{max-width:720px;margin:0 auto}
.bt-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bt-dots{display:flex;gap:8px}.bt-dots i{width:16px;height:16px;border-radius:50%;background:var(--line)}.bt-dots i.ok{background:#16a34a}.bt-dots i.no{background:#f59e0b}.bt-dots i.now{box-shadow:0 0 0 3px var(--blue)}
.bt-card{margin-top:14px;padding:20px 16px;border-radius:22px;background:var(--card);box-shadow:0 0 0 1px var(--line);text-align:center}
.bt-q{display:flex;align-items:center;justify-content:center;gap:8px;font-size:22px;font-weight:800;margin:0 0 14px}
.bt-say{border:0;background:#eef4ff;border-radius:50%;width:44px;height:44px;font-size:22px;cursor:pointer;flex:none}
.bt-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;font-size:44px;line-height:1;margin:6px 0 18px}
.bt-row span{display:inline-grid;place-items:center;min-width:58px;min-height:58px;border-radius:14px;background:#f5f7fb}
.bt-row .gap{background:#fff6e0;outline:3px dashed #f0b44c;color:#c27a00;font-weight:800;font-size:32px}
.bt-row .arrow{background:none;min-width:24px;font-size:28px;color:var(--muted)}
.bt-choices{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.bt-choices button{min-width:86px;min-height:86px;font-size:46px;line-height:1;border:3px solid var(--line);border-radius:20px;background:#fff;cursor:pointer;transition:transform .15s}
.bt-choices button:hover{transform:translateY(-3px)}
.bt-choices button.right{border-color:#16a34a;background:#e9f7ee;animation:bt-pop .5s}
.bt-choices button.wrong{border-color:#f59e0b;background:#fff3e2;animation:bt-shake .4s}
.bt-choices button:disabled{cursor:default}
.bt-msg{min-height:1.6em;font-size:20px;font-weight:800;margin:14px 0 0}
.bt-next{margin-top:12px}
.bt-end{font-size:72px}
.rot{display:inline-block}
@keyframes bt-pop{50%{transform:scale(1.15)}}
@keyframes bt-shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.bt-choices button{animation:none!important;transition:none}}
@media (prefers-color-scheme:dark){.bt-row span{background:#2a3446}.bt-choices button{background:#232c3d}.bt-say{background:#2b3a55}}
</style>
<main class="bt">
  <div class="bt-top"><h1 style="margin:0">🧩 Brain teaser</h1><div class="bt-dots" data-dots aria-label="Progress"></div></div>
  <p class="oc-lead" data-lead>Five picture puzzles. Look carefully, then pick the answer.</p>
  <section class="bt-card" data-card aria-live="polite"></section>
</main>
<script>
(() => {
  const $ = (q) => document.querySelector(q);
  const KEY = "oc-teaser";
  const who = () => OC.current() || "Learner";
  const today = OC.dayOf(new Date());
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch { return {}; } };
  const save = (all) => { try { localStorage.setItem(KEY, JSON.stringify(all)); } catch {} };
  const mine = () => read()[who()] || { level: 1, days: {} };
  // Puzzles are the same all day (seeded by the date), so reloading doesn't give easier ones.
  let seed = [...(today + who())].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
  const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
  const pick = (list) => list[Math.floor(rnd() * list.length)];
  const shuffle = (list) => list.map((x) => [rnd(), x]).sort((a, b) => a[0] - b[0]).map((x) => x[1]);

  const SETS = {
    fruit: ["🍎", "🍌", "🍇", "🍓", "🍐", "🍊", "🍒", "🍉"], animal: ["🐶", "🐱", "🐰", "🦊", "🐻", "🐼", "🐯", "🐸"],
    vehicle: ["🚗", "🚌", "🚲", "🚂", "✈️", "🚀", "🚜", "⛵"], weather: ["☀️", "🌧️", "❄️", "⛅", "🌈", "⚡"],
    sea: ["🐟", "🐙", "🦀", "🐳", "🐠", "🦈"], clothes: ["👕", "👖", "🧦", "🧢", "👗", "🧤"], music: ["🎸", "🥁", "🎺", "🎻", "🎹"],
    bug: ["🐝", "🐞", "🦋", "🐛", "🐜"], veg: ["🥕", "🥦", "🌽", "🥒", "🍆"], ball: ["⚽", "🏀", "🏈", "⚾", "🎾"],
  };
  const ANALOGY = [
    ["🐶", "🦴", "🐰", "🥕", ["🦴", "🍌", "🧀"]], ["🐦", "🪺", "🐝", "🍯", ["🪺", "🧀", "🥕"]], ["☀️", "😎", "🌧️", "☂️", ["😎", "🧤", "🍦"]],
    ["🐟", "🌊", "🐦", "☁️", ["🌊", "🌳", "🚗"]], ["🥚", "🐣", "🐛", "🦋", ["🐣", "🐜", "🍎"]], ["❄️", "🧤", "☀️", "🧢", ["🧤", "🧣", "☂️"]],
    ["🍼", "👶", "☕", "🧑", ["👶", "🐱", "🍪"]], ["🔑", "🔒", "✏️", "📄", ["🔒", "✂️", "🎈"]], ["🐄", "🥛", "🐔", "🥚", ["🥛", "🌽", "🧀"]],
    ["🌱", "🌳", "🐣", "🐔", ["🌳", "🥚", "🐛"]], ["🚗", "🛣️", "🚂", "🛤️", ["🛣️", "⚓", "☁️"]], ["👟", "🦶", "🧤", "✋", ["🦶", "👂", "🧦"]],
  ];

  function pattern(level) {
    const kinds = level < 2 ? ["AB", "AAB", "ABB"] : level < 4 ? ["ABC", "AABB", "ABB", "AAB"] : ["ABCD", "AABC", "ABCB", "ABAC"];
    const unit = pick(kinds);
    const pool = shuffle(SETS[pick(Object.keys(SETS))].slice());
    const map = {}; [...new Set(unit)].forEach((ch, i) => (map[ch] = pool[i]));
    const seq = []; while (seq.length < unit.length * 2 + 2) seq.push(map[unit[seq.length % unit.length]]);
    const answer = seq.pop();
    const wrong = [...new Set(Object.values(map).filter((x) => x !== answer).concat(pool.slice(4, 6)))].slice(0, 2);
    return { q: "What comes next?", row: seq, answer, choices: shuffle([answer, ...wrong]) };
  }
  function oddOne(level) {
    const keys = shuffle(Object.keys(SETS));
    const many = shuffle(SETS[keys[0]].slice()).slice(0, level < 3 ? 3 : 4);
    const odd = pick(SETS[keys[1]]);
    return { q: "Which one does not belong?", row: [], answer: odd, choices: shuffle([...many, odd]) };
  }
  function analogy() {
    const [a, b, c, d, wrong] = pick(ANALOGY);
    return { q: `${a} goes with ${b}. ${c} goes with…?`, say: "This one goes with that one. So what goes with this one?", row: [a, "→", b, "|", c, "→", "?"], answer: d, choices: shuffle([d, ...wrong.slice(0, 2)]) };
  }
  function turning(level) {
    const thing = pick(["🐟", "👉", "🦒", "🚀", "🐌", "🦕", "✏️"]);
    const step = level < 3 ? 90 : pick([90, 45, -90]);
    const at = (n) => `<b class="rot" style="transform:rotate(${n * step}deg)">${thing}</b>`;
    const answer = at(3);
    return { q: "It keeps turning. What comes next?", html: true, row: [at(0), at(1), at(2)], answer, choices: shuffle([answer, at(1), `<b class="rot" style="transform:rotate(${3 * step + 180}deg) scaleX(-1)">${thing}</b>`]) };
  }
  function numbers(level) {
    const steps = level < 2 ? [1] : level < 3 ? [1, 2] : level < 4 ? [2, 5, 10] : [3, 4, 5, 10, "x2"];
    const step = pick(steps);
    const start = step === "x2" ? pick([1, 2, 3]) : Math.floor(rnd() * (level < 3 ? 5 : 20)) + (step === 10 ? 0 : 1);
    const seq = [start];
    while (seq.length < 5) seq.push(step === "x2" ? seq[seq.length - 1] * 2 : seq[seq.length - 1] + step);
    const answer = seq.pop();
    if (level < 2) return { q: "How many dots come next?", html: true, row: seq.map((n) => "●".repeat(n)).map((x) => `<small style="font-size:18px;letter-spacing:2px;color:#2f6fdf">${x}</small>`), answer: String(answer), choices: shuffle([answer, answer + 1, answer - 1].map(String)) };
    return { q: "What number comes next?", row: seq.map(String), answer: String(answer), choices: shuffle([answer, answer + (step === "x2" ? 2 : 1), seq[seq.length - 1] + (step === "x2" ? seq[seq.length - 1] : step) + 1].map(String)).filter((x, i, a) => a.indexOf(x) === i) };
  }

  const me = mine();
  const level = Math.max(1, Math.min(5, me.level || 1));
  const MAKERS = [pattern, oddOne, numbers, analogy, turning];
  const puzzles = MAKERS.map((f) => f(level));
  const state = me.days?.[today] || { got: [], done: false };
  let i = Math.min(state.got.length, puzzles.length);
  let tries = 0;

  const speak = (text) => { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 0.9; speechSynthesis.speak(u); } catch {} };
  const store = () => {
    const all = read();
    const m = all[who()] || { level, days: {} };
    m.days = { ...(m.days || {}), [today]: state };
    // Harder after a perfect day, easier after a hard one.
    if (state.done && !state.counted) {
      const right = state.got.filter((x) => x === "ok").length;
      m.level = Math.max(1, Math.min(5, level + (right === 5 ? 1 : right <= 2 ? -1 : 0)));
      state.counted = true;
    }
    all[who()] = m;
    save(all);
  };
  const dots = () => ($("[data-dots]").innerHTML = puzzles.map((_, n) => `<i class="${state.got[n] || (n === i ? "now" : "")}"></i>`).join(""));
  const cell = (x, html) => (x === "→" || x === "|" ? `<span class="arrow">${x === "→" ? "➜" : "·"}</span>` : x === "?" ? `<span class="gap">?</span>` : `<span>${html ? x : OC.escapeHtml(x)}</span>`);

  function show() {
    dots();
    if (i >= puzzles.length) return finish();
    const p = puzzles[i];
    tries = 0;
    const row = p.row.length ? `<div class="bt-row">${p.row.map((x) => cell(x, p.html)).join("")}${p.row.includes("?") ? "" : '<span class="gap">?</span>'}</div>` : "";
    $("[data-card]").innerHTML = `<p class="bt-q"><button type="button" class="bt-say" data-say aria-label="Read it to me">🔊</button>${OC.escapeHtml(p.q)}</p>${row}<div class="bt-choices">${p.choices.map((c, n) => `<button type="button" data-c="${n}">${p.html ? c : OC.escapeHtml(c)}</button>`).join("")}</div><p class="bt-msg" data-msg></p>`;
    speak(p.say || p.q);
  }
  function finish() {
    const right = state.got.filter((x) => x === "ok").length;
    if (!state.done) { state.done = true; store(); OC.count?.("puzzles", 5); OC.end?.(); OC.planDone?.("math/teaser/"); }
    $("[data-card]").innerHTML = `<div class="bt-end">${right === 5 ? "🏆" : right >= 3 ? "🌟" : "💪"}</div><h2>${right === 5 ? "All five right!" : `${right} of 5 on the first try!`}</h2><p>${right === 5 ? "Tomorrow's puzzles will be a bit trickier." : "Great thinking. New puzzles tomorrow!"}</p><a class="oc-button bt-next" href="../../">🏠 Back to today's plan</a>`;
    speak(right === 5 ? "All five right! Amazing!" : "Great thinking!");
  }
  $("[data-card]").addEventListener("click", (event) => {
    if (event.target.closest("[data-say]")) return speak(puzzles[i].say || puzzles[i].q);
    const btn = event.target.closest("[data-c]");
    if (!btn || btn.disabled) return;
    const p = puzzles[i];
    const ok = p.choices[Number(btn.dataset.c)] === p.answer;
    tries += 1;
    if (!ok) {
      btn.classList.add("wrong");
      btn.disabled = true;
      $("[data-msg]").textContent = pick(["Hmm, look again!", "Not that one. Try another!", "Close! Look carefully."]);
      speak($("[data-msg]").textContent);
      return;
    }
    btn.classList.add("right");
    document.querySelectorAll("[data-c]").forEach((b) => (b.disabled = true));
    state.got[i] = tries === 1 ? "ok" : "no";
    store();
    $("[data-msg]").textContent = tries === 1 ? pick(["Yes! 🎉", "You got it! ⭐", "Brilliant! 🌟"]) : "That's it! 👍";
    speak($("[data-msg]").textContent);
    i += 1;
    setTimeout(show, 1300);
  });
  OC.begin("Math", "Brain teaser");
  $("[data-lead]").textContent = `Five picture puzzles for ${who()}. Look carefully, then pick the answer. Tap 🔊 to hear the question.`;
  show();
})();
</script>

</div>
</body>
</html>
