<script>const { $, el, svg: makeSvg, text, panel, say, pick, wait, confetti, explain, everyday, emoji, shuffle } = KIT;
const stage = $("[data-stage]");
const W = 1000;
const H = 560;
let token = 0;
let view = null;

const UNITS = [
  { id: "g0", label: "See it", icon: "👀" },
  { id: "g1", label: "1. The 8 parts of speech", icon: "🏷️" },
  { id: "g2", label: "2. Subject & predicate", icon: "🎯" },
  { id: "g3", label: "3. Sentence types & clauses", icon: "🧱" },
  { id: "g4", label: "4. Sentence diagramming", icon: "📐" },
  { id: "g5", label: "5. Verb tenses & agreement", icon: "⏳" },
  { id: "g6", label: "6. Punctuation", icon: "✒️" },
  { id: "g7", label: "7. Fix the sentence", icon: "🔧" },
  { id: "g8", label: "8. Verbals", icon: "🔀" },
  { id: "g9", label: "9. Clauses at work", icon: "🧩" },
  { id: "g10", label: "10. Mood & parallelism", icon: "🎭" },
];

function fresh() {
  stage.innerHTML = "";
  view = makeSvg(`0 0 ${W} ${H}`, stage);
  return view;
}

// ---------- shared helpers ----------
const EMO = /[\p{Extended_Pictographic}\u{1F1E6}-\u{1F1FF}\u{1F3FB}-\u{1F3FF}️‍⃣]/gu;
const clean = (s) => String(s).replace(/<[^>]+>/g, " ").replace(EMO, "").replace(/[|]/g, " ").replace(/\s+/g, " ").trim();
function talk(html, speech) {
  say(html, { voice: false });
  VOICE.speak(clean(speech ?? html));
}
function talkAsync(html, speech) {
  say(html, { voice: false });
  return VOICE.speakAsync(clean(speech ?? html));
}
const LEARN = "Not quite. Consider:";
const RIGHT = ["#d8f3e0", "#22a05a"];
const WRONG = ["#fbe3dc", "#d9822b"];
const INK = "#2b1d12";
const an = (w) => (/^[aeiou]/i.test(w) ? "an" : "a");
const bare = (w) => w.replace(/[.,!?;:"]/g, "");

// Width of a string in the SVG, measured for real when possible.
function measure(str, size, weight = 700) {
  try {
    const host = stage.querySelector("svg") || view;
    const t = text(host, -999, -999, str, { "font-size": size, "font-weight": weight, "text-anchor": "start" });
    const w = t.getComputedTextLength();
    t.remove();
    if (w > 0) return w;
  } catch {}
  return String(str).length * size * 0.55;
}
// Shrink an SVG text until it fits a width.
function fit(t, maxW, min = 22) {
  let size = Number(t.getAttribute("font-size"));
  try {
    while (size > min && t.getComputedTextLength() > maxW) {
      size -= 2;
      t.setAttribute("font-size", size);
    }
  } catch {}
  return t;
}
// Wrapped, centred lines of plain text.
function para(parent, x, y, str, { size = 28, maxW = 880, lineH, fill = "#5a4130", weight = 700, maxLines = 3 } = {}) {
  let s = size;
  let lines;
  for (;;) {
    lines = [""];
    for (const word of String(str).split(" ")) {
      const tryLine = lines[lines.length - 1] ? `${lines[lines.length - 1]} ${word}` : word;
      if (measure(tryLine, s, weight) > maxW && lines[lines.length - 1]) lines.push(word);
      else lines[lines.length - 1] = tryLine;
    }
    if (lines.length <= maxLines || s <= 22) break;
    s -= 2;
  }
  const lh = lineH ?? s * 1.3;
  const g = el("g", {}, parent);
  lines.forEach((line, i) => text(g, x, y + i * lh, line, { "font-size": s, fill, "font-weight": weight }));
  g.lines = lines.length;
  g.bottom = y + (lines.length - 1) * lh;
  return g;
}

// A sentence as separate word boxes (tappable when tap is given), wrapped and centred.
function wordRow(parent, list, { y = 90, size = 48, maxW = 920, maxLines = 2, lineH, tap, cls = "gw-word" } = {}) {
  let s = size;
  let built;
  for (;;) {
    const g = el("g", {}, parent);
    const items = list.map((w, i) => {
      const wg = el("g", { class: tap ? cls : null, "data-i": i }, g);
      const r = el("rect", { class: "gw-box", rx: 12, fill: "transparent", stroke: "transparent", "stroke-width": 3 }, wg);
      const t = text(wg, 0, 0, w, { "font-size": s, fill: INK, "text-anchor": "start" });
      let w0 = 0;
      try {
        w0 = t.getComputedTextLength();
      } catch {}
      return { g: wg, r, t, w: w0 || w.length * s * 0.55, word: w, i };
    });
    const space = s * 0.4;
    const lines = [[]];
    let lw = 0;
    for (const it of items) {
      const line = lines[lines.length - 1];
      const need = (line.length ? space : 0) + it.w;
      if (line.length && lw + need > maxW) {
        lines.push([it]);
        lw = it.w;
      } else {
        line.push(it);
        lw += need;
      }
    }
    if (lines.length > maxLines && s > 26) {
      g.remove();
      s -= 4;
      continue;
    }
    const lh = lineH ?? s * 1.75;
    lines.forEach((line, li) => {
      const total = line.reduce((sum, it) => sum + it.w, 0) + space * (line.length - 1);
      let x = 500 - total / 2;
      const by = y + li * lh;
      for (const it of line) {
        it.x = x;
        it.y = by;
        it.size = s;
        it.t.setAttribute("x", x);
        it.t.setAttribute("y", by);
        Object.entries({ x: x - space * 0.36, y: by - s * 0.92, width: it.w + space * 0.72, height: s * 1.3 }).forEach(([k, v]) => it.r.setAttribute(k, v));
        x += it.w + space;
      }
    });
    built = { g, items, lines: lines.length, size: s, bottom: y + (lines.length - 1) * lh };
    break;
  }
  if (tap)
    built.items.forEach((it) =>
      it.g.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        tap(it);
      })
    );
  return built;
}
const underline = (parent, it, color, double = false) => {
  const y = it.y + it.size * 0.22;
  el("line", { x1: it.x, x2: it.x + it.w, y1: y, y2: y, stroke: color, "stroke-width": 5, "stroke-linecap": "round", class: "gw-ul" }, parent);
  if (double) el("line", { x1: it.x, x2: it.x + it.w, y1: y + 10, y2: y + 10, stroke: color, "stroke-width": 5, "stroke-linecap": "round", class: "gw-ul" }, parent);
};
const strike = (parent, it, color = "#8a7764") => {
  const y = it.y - it.size * 0.3;
  el("line", { x1: it.x - 4, x2: it.x + it.w + 4, y1: y, y2: y, stroke: color, "stroke-width": 4, "stroke-linecap": "round" }, parent);
};

function card(parent, x, y, w, h, { fill = "#fffaf0", stroke = "#d9cdb5", cls = "gw-card" } = {}) {
  const g = el("g", { class: cls, transform: `translate(${x} ${y})` }, parent);
  el("rect", { class: "gw-face", x: -w / 2, y: 0, width: w, height: h, rx: 22, fill, stroke, "stroke-width": 4 }, g);
  return g;
}
const paint = (g, fill, stroke) => {
  const r = g.querySelector(".gw-face");
  if (fill) r.setAttribute("fill", fill);
  if (stroke) r.setAttribute("stroke", stroke);
};
const glowOk = () => [...view.querySelectorAll("[data-ok='1']")].forEach((g) => g.classList.add("gw-glow", "gw-blink"));

function realCard({ icon, title, need, steps, safe = "Do this with a grown-up." }) {
  fresh();
  el("rect", { x: 30, y: 18, width: 940, height: 524, rx: 32, fill: "#fffaf0", stroke: "var(--accent)", "stroke-width": 5 }, view);
  el("circle", { cx: 110, cy: 100, r: 58, fill: "var(--accent-soft)" }, view);
  emoji(view, 110, 98, icon, 64);
  text(view, 190, 78, "🏠 Try it for real", { "font-size": 26, fill: "var(--accent-dark)", "text-anchor": "start" });
  fit(text(view, 190, 124, title, { "font-size": 40, fill: INK, "text-anchor": "start" }), 740);
  fit(text(view, 70, 210, `You need: ${need.join(" · ")}`, { "font-size": 27, fill: "#5a4130", "text-anchor": "start", "font-weight": 800 }), 860);
  steps.forEach((s, i) => {
    const y = 278 + i * 72;
    el("circle", { cx: 92, cy: y - 9, r: 22, fill: "var(--accent)" }, view);
    text(view, 92, y, i + 1, { "font-size": 24, fill: "#fff" });
    fit(text(view, 130, y, s, { "font-size": 27, fill: INK, "text-anchor": "start", "font-weight": 700 }), 810);
  });
  text(view, 70, 508, `👋 ${safe}`, { "font-size": 25, fill: "#8a6a4f", "text-anchor": "start", "font-weight": 700 });
}

// Level chips map to grades: 🐣 grade 4, 🦊 grades 5–7, 🦁 grade 8 and high school.
function explainCard(prompt) {
  fresh();
  el("rect", { x: 30, y: 18, width: 940, height: 524, rx: 32, fill: "#fffaf0", stroke: "var(--accent)", "stroke-width": 5 }, view);
  el("circle", { cx: 110, cy: 100, r: 58, fill: "var(--accent-soft)" }, view);
  emoji(view, 110, 98, "🗣️", 60);
  text(view, 190, 78, "Explain it", { "font-size": 26, fill: "var(--accent-dark)", "text-anchor": "start" });
  text(view, 190, 124, "Put the idea into words", { "font-size": 38, fill: INK, "text-anchor": "start" });
  para(view, 500, 230, prompt, { size: 40, fill: INK, maxW: 880, maxLines: 5, lineH: 52 });
  para(view, 500, 470, "Say it aloud to a grown-up, or write it in 2–4 full sentences. Use the grammar terms precisely.", { size: 28, fill: "#8a6a4f", maxW: 860, maxLines: 2 });
}

const LEVELS = [["easy", "🐣 Grade 4"], ["medium", "🦊 Grade 5–7"], ["hard", "🦁 Grade 8+"]];
const levelRow = (cur, list) => `<div class="ap-row"><div class="ap-chips" data-levels>${list.map(([k, l]) => `<button type="button" data-lv="${k}" aria-pressed="${k === cur}">${l}</button>`).join("")}</div><p class="ap-status" data-status></p></div>`;
const again = (id) => {
  token += 1;
  VOICE.hush();
  units[id]();
};

function runGame(id, cfg) {
  const my = token;
  const levels = cfg.levels || LEVELS;
  const saved = shell.progress()[id]?.level;
  const st = { id, my, level: levels.some(([k]) => k === saved) ? saved : levels[0][0], round: 0, first: 0, tries: 0, busy: false };
  st.alive = () => st.my === token;
  const bindLevels = () =>
    $("[data-levels]").addEventListener("click", (event) => {
      const b = event.target.closest("[data-lv]");
      if (!b || !st.alive()) return;
      token += 1;
      st.my = token;
      VOICE.hush();
      st.level = b.dataset.lv;
      document.querySelectorAll("[data-lv]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      shell.mark(id, { level: st.level });
      window.OC?.touch();
      restart();
    });
  const build = () => {
    panel(`${levelRow(st.level, levels)}<div class="ap-buttons gw-acts" data-acts></div>`);
    bindLevels();
  };
  build();
  st.acts = (html, handlers = {}) => {
    const box = $("[data-acts]");
    box.innerHTML = html;
    box.onclick = (e) => {
      const b = e.target.closest("[data-a]");
      if (b && !b.disabled && st.alive()) {
        window.OC?.touch();
        handlers[b.dataset.a]?.(b);
      }
    };
  };
  // Answer buttons in the panel. After two tries the right one glows, with the reason.
  st.choose = (options, right, { hint, why, extra = "", onExtra = {}, onWin } = {}) => {
    const html = options.map((o, i) => `<button type="button" data-a="c${i}">${o}</button>`).join("") + extra;
    const handlers = { ...onExtra };
    options.forEach((o, i) => {
      handlers[`c${i}`] = (b) => {
        if (st.busy) return;
        if (i === right) {
          b.classList.add("right");
          onWin?.();
          return st.win(`Correct — ${why}`);
        }
        if (b.classList.contains("wrong")) return;
        b.classList.add("wrong");
        const tries = st.oops();
        if (tries === 1) talk(`${LEARN} ${hint}`);
        else {
          $(`[data-a="c${right}"]`)?.classList.add("gw-pulse");
          talk(`The answer is highlighted. Reason: ${why} Select it to continue.`);
        }
      };
    });
    st.acts(html, handlers);
  };
  st.status = (s) => {
    const b = $("[data-status]");
    if (b) b.textContent = s ?? `${cfg.label || "Round"} ${st.round + 1} of ${cfg.rounds}`;
  };
  st.take = (list) => {
    if (!st.deck || st.deckKey !== st.level || !st.deck.length) {
      st.deck = shuffle(list);
      st.deckKey = st.level;
    }
    return st.deck.pop();
  };
  st.takeFrom = (key, list) => {
    st.decks ||= {};
    const k = `${key}:${st.level}`;
    if (!st.decks[k]?.length) st.decks[k] = shuffle(list);
    return st.decks[k].pop();
  };
  st.next = () => {
    if (!st.alive()) return;
    st.tries = 0;
    st.busy = false;
    st.status();
    cfg.ask(st);
  };
  st.win = async (html, speech, { chime = true, ms = 1000 } = {}) => {
    st.busy = true;
    const gen = st.gen;
    const live = () => st.alive() && st.gen === gen;
    if (chime) MUSIC.chime();
    if (st.tries === 0) st.first += 1;
    st.round += 1;
    window.OC?.count(cfg.count);
    await talkAsync(html, speech);
    if (!live()) return;
    await wait(ms);
    if (!live()) return;
    if (st.round >= cfg.rounds) finish();
    else st.next();
  };
  st.oops = () => {
    MUSIC.oops();
    st.tries += 1;
    return st.tries;
  };
  const finish = () => {
    confetti();
    shell.mark(id, { done: true });
    const prompt = EXPLAIN[id][st.level] || EXPLAIN[id].easy;
    explainCard(prompt);
    st.done = true;
    panel(`${levelRow(st.level, levels)}<div class="ap-buttons"><button type="button" class="primary" data-real>🏠 Try it for real</button><button type="button" data-again>🔁 Again</button></div>`);
    bindLevels();
    $("[data-status]").textContent = "Finished ✓";
    $("[data-again]").addEventListener("click", () => again(id));
    $("[data-real]").addEventListener("click", () => {
      if (!st.alive()) return;
      window.OC?.touch();
      realCard(cfg.real);
      talk("Now apply it away from the screen. The steps are on the card.");
    });
    talk(`Session complete: ${st.first} of ${cfg.rounds} correct on the first attempt. Now explain it: the task is on the card.`, `Session complete: ${st.first} of ${cfg.rounds} correct on the first attempt. Now explain it. ${prompt} Say it aloud to a grown-up, or write it in two to four sentences.`);
  };
  const restart = () => {
    if (st.done) {
      st.done = false;
      build();
    }
    st.gen = (st.gen || 0) + 1;
    st.round = 0;
    st.first = 0;
    st.deck = null;
    st.next();
  };
  restart();
  return st;
}

// Three sentence cards on the stage; tap the one that is right.
function cardRound(st, { top, sub, cards, right, hint, why }) {
  fresh();
  const my = st.my;
  const head = para(view, 500, 50, top, { size: 34, fill: INK, maxW: 920, maxLines: 2, weight: 800 });
  let y0 = head.bottom + 30;
  if (sub) {
    text(view, 500, y0 + 4, sub, { "font-size": 24, fill: "var(--accent-dark)" });
    y0 += 22;
  }
  const order = shuffle(cards.map((c, i) => i));
  const gap = 14;
  const h = Math.min(120, (540 - y0 - gap * 2) / 3);
  order.forEach((ci, k) => {
    const g = card(view, 500, y0 + k * (h + gap), 940, h, { fill: "#fff", stroke: "#c9b8a1" });
    g.dataset.ok = ci === right ? "1" : "";
    g.dataset.ci = ci;
    const t = text(g, 0, h / 2 + 11, cards[ci], { "font-size": 32, fill: INK, "font-weight": 700 });
    fit(t, 890);
    g.addEventListener("pointerdown", () => {
      if (my !== token || st.busy) return;
      window.OC?.touch();
      if (ci === right) {
        paint(g, ...RIGHT);
        return st.win(`Correct — ${why}`);
      }
      if (g.dataset.bad) return;
      g.dataset.bad = "1";
      paint(g, ...WRONG);
      const tries = st.oops();
      if (tries === 1) talk(`${LEARN} ${hint}`);
      else {
        glowOk();
        talk(`The correct version is highlighted. Reason: ${why} Select it to continue.`);
      }
    });
  });
}

// A sentence with a [marked] word or phrase, plus answer buttons.
const citeText = (y, cite) => fit(text(view, 500, y, `— ${cite}`, { "font-size": 24, fill: "#8a6a4f", "font-style": "italic", "font-weight": 700 }), 920);
function markedQ(st, { s, title, choices, right, hint, why, cite, prompt, size = 50 }) {
  fresh();
  text(view, 500, 70, title, { "font-size": 30, fill: "var(--accent-dark)" });
  let inside = false;
  const toks = s.split(" ");
  const marked = toks.map((w) => {
    if (w.includes("[")) inside = true;
    const on = inside;
    if (w.includes("]")) inside = false;
    return on;
  });
  const row = wordRow(view, toks.map((w) => w.replace(/[[\]]/g, "")), { y: 190, size, maxW: 930, maxLines: 3, lineH: size * 1.55 });
  row.items.forEach((it) => {
    if (!marked[it.i]) return;
    it.r.setAttribute("fill", "#fff1dc");
    it.r.setAttribute("stroke", "#b45f06");
  });
  if (cite) citeText(row.bottom + 62, cite);
  st.choose(choices, right, { hint, why });
  const phrase = toks.filter((w, i) => marked[i]).map((w) => w.replace(/[[\]]/g, "")).join(" ").replace(/[.,!?:;]+$/, "");
  talk(`${prompt || title} <b>${phrase}</b>`, `${toks.map((w) => w.replace(/[[\]]/g, "")).join(" ")}. ${prompt || title} The marked words: ${phrase}.`);
}

// ---------- parts of speech ----------
const POS = {
  n: ["noun", "names", "#e6effc", "#1f4e8c", "names a person, place, thing or idea"],
  pro: ["pronoun", "stands in", "#e3f4e6", "#2e7d32", "takes the place of a noun"],
  v: ["verb", "acts or is", "#fff1dc", "#b45f06", "shows action or being"],
  adj: ["adjective", "describes nouns", "#fde7f3", "#a3246b", "describes a noun: which one, what kind or how many"],

const parseSP = (s) => {
  let inS = false;
  let inV = false;
  return s.split(" ").map((tok) => {
    if (tok.includes("[")) inS = true;
    if (tok.includes("{")) inV = true;
    const out = { show: tok.replace(/[[\]{}]/g, ""), subj: inS, verb: inV };
    if (tok.includes("]")) inS = false;
    if (tok.includes("}")) inV = false;
    return out;
  });
};

          if (fresh2.length && Math.random() < 0.5) cands = fresh2;
        }
        let ti = noted.length && Math.random() < 0.8 ? pick(noted) : pick(cands);
        if (toks[ti].word === "fast") ti = Math.random() < 0.5 ? 1 : 4;
        if (toks[ti].word === "that" && toks[2]?.word === "that") ti = Math.random() < 0.5 ? 2 : 3;
        const target = toks[ti];
        const tag = target.tag;
        const row = wordRow(view, toks.map((t) => t.show), { y: 84, size: 48, maxW: 930, maxLines: 3, lineH: 70 });
        const it = row.items[ti];
        it.r.setAttribute("fill", "#fff3c4");
        it.r.setAttribute("stroke", "#e0a100");
        el("path", { d: `M${it.x + it.w / 2 - 14} ${it.y - it.size - 18}l14 16l14 -16z`, fill: "#e0a100" }, view);
        let top = row.bottom + 50;
        if (cite) {
          citeText(row.bottom + 46, cite);
          top += 34;
        }
        const n = set.length;
        const cols = n === 6 ? 3 : 4;
        const rows = Math.ceil(n / cols);
        const bw = cols === 3 ? 290 : 220;
        const bh = 104;
        const gapY = 12;
        const by0 = Math.max(top, 548 - rows * bh - (rows - 1) * gapY);
        set.forEach((k, i) => {
          const [name, job, fill, ink] = POS[k];
          const x = 500 + ((i % cols) - (cols - 1) / 2) * (bw + 16);
          const y = by0 + Math.floor(i / cols) * (bh + gapY);
          const g = card(view, x, y, bw, bh, { fill, stroke: ink, cls: "gw-card gw-bin" });
          g.dataset.ok = k === tag ? "1" : "";
          g.dataset.tag = k;
          fit(text(g, 0, bh / 2 - 2, name, { "font-size": 32, fill: ink }), bw - 20);
          fit(text(g, 0, bh / 2 + 32, job, { "font-size": 22, fill: "#5a4130" }), bw - 20);
          g.addEventListener("pointerdown", () => {
            if (my !== token || st.busy) return;
            window.OC?.touch();
            const why = notes[target.word] || `It ${POS[tag][4]}.${ARTICLES.includes(target.word.toLowerCase()) ? " A, an and the are special adjectives called articles." : ""}`;
            if (k === tag) {
              paint(g, ...RIGHT);
              return st.win(`Correct — <b>${target.word}</b> is ${an(POS[tag][0])} ${POS[tag][0]} here. ${why}`);
            }
            if (g.dataset.bad) return;
            g.dataset.bad = "1";
            paint(g, ...WRONG);
            const tries = st.oops();
            if (tries === 1) talk(`Not quite: here it is not ${an(name)} ${name}. Consider: ${ASK[tag]}`);
            else {
              glowOk();
              talk(`<b>${target.word}</b> is ${an(POS[tag][0])} ${POS[tag][0]}. ${why} Select the highlighted part of speech.`);
            }
          });
        });
        st.acts(`<button type="button" data-a="hear">🔊 Hear it</button>`, { hear: () => VOICE.speak(`${toks.map((t) => t.show).join(" ")}. What job does ${target.word} perform?`) });
        talk(`Which part of speech is <b>${target.word}</b> in this sentence?`);
      },
    });
  },

  g2() {
    runGame("g2", {
      rounds: 10,
      noun: "sentences",
      label: "Sentence",
      count: "subjects and verbs found",
      real: REAL.g2,
      ask(st) {
        const my = st.my;
        fresh();
        const [s, note, cite] = st.take(SP_SENT[st.level]);
        const toks = parseSP(s);
        let step = "subj";
        const picked = new Set();
        const marks = el("g", {}, view);
        const row = wordRow(view, toks.map((t) => t.show), {
          y: 200,
          size: 52,
          maxW: 930,
          maxLines: 2,
          lineH: 115,
          tap: (it) => {
            if (my !== token || st.busy || it.locked) return;
            window.OC?.touch();
            if (picked.has(it.i)) {
              picked.delete(it.i);
              it.r.setAttribute("fill", "transparent");
              it.r.setAttribute("stroke", "transparent");
            } else {
              picked.add(it.i);
              it.r.setAttribute("fill", step === "subj" ? "#e6effc" : "#fff1dc");
              it.r.setAttribute("stroke", step === "subj" ? "#1f4e8c" : "#b45f06");
              MUSIC.play("woodblock", 84, { gain: 0.25 });
            }
          },
        });
        const label = text(view, 500, 70, "", { "font-size": 32, fill: "#1f4e8c" });
        if (cite) citeText(row.bottom + 90, cite);
        para(view, 500, 500, "Simple subject: underline once. Verb: underline twice.", { size: 25, fill: "#8a7764" });
        const want = () => new Set(toks.map((t, i) => i).filter((i) => (step === "subj" ? toks[i].subj : toks[i].verb)));
        const prompt = () => {
          label.textContent = step === "subj" ? "Step 1: select the simple subject" : "Step 2: select the simple predicate";
          label.setAttribute("fill", step === "subj" ? "#1f4e8c" : "#b45f06");
          if (step === "subj") talk("Select the simple subject: the core noun, pronoun or verbal the sentence is about. If the subject is compound, select every part. Then press Check.");
          else talk("Now select the simple predicate: the verb with any helping verbs. If the verb is compound, select every verb. Then press Check.");
        };
        const reveal = () => {
          for (const i of picked) {
            row.items[i].r.setAttribute("fill", "transparent");
            row.items[i].r.setAttribute("stroke", "transparent");
          }
          picked.clear();
          for (const i of want()) {
            const it = row.items[i];
            it.r.setAttribute("stroke", "#ffb300");
            it.r.setAttribute("stroke-width", 7);
          }
        };
        const check = () => {
          if (my !== token || st.busy) return;
          const w = want();
          const ok = picked.size === w.size && [...w].every((i) => picked.has(i));
          if (ok) {
            MUSIC.play("xylophone", step === "subj" ? 84 : 88, { gain: 0.4 });
            for (const i of w) {
              const it = row.items[i];
              it.locked = true;
              it.r.setAttribute("stroke-width", 3);
              underline(marks, it, step === "subj" ? "#1f4e8c" : "#b45f06", step === "verb");
            }
            picked.clear();
            if (step === "subj") {
              step = "verb";
              const subj = toks.filter((t) => t.subj).map((t) => bare(t.show)).join(" ");
              talkAsync(`Correct: the simple subject is <b>${subj}</b>.`).then(() => my === token && !st.busy && prompt());
              return;
            }
            const subj = toks.filter((t) => t.subj).map((t) => bare(t.show)).join(" ");
            const verb = toks.filter((t) => t.verb).map((t) => bare(t.show)).join(" ");
            return st.win(`Correct — subject: <b>${subj}</b>; predicate: <b>${verb}</b>. ${note || ""}`);
          }
          if (picked.size === 0) return talk("Select at least one word, then press Check.");
          const tries = st.oops();
          const missing = [...w].some((i) => !picked.has(i));
          const extra = [...picked].some((i) => !w.has(i));
          let hint;
          if (step === "subj") hint = !extra && missing ? "You found part of it. Is there a second subject joined by and, or, or nor?" : "Find the verb first, then ask who or what performs it. A word inside a prepositional phrase is never the subject, and here and there never are.";
          else hint = !extra && missing ? "You found part of it. Is there a helping verb such as is, was, has, did or will, perhaps separated from the main verb? Or a second verb?" : "One selected word is not a verb. Adverbs such as never and ever interrupt verb phrases but are not verbs.";
          if (tries === 1) talk(`${LEARN} ${hint}`);
          else {
            reveal();
            talk(`The answer is highlighted. ${note || (step === "subj" ? "That is what the sentence is about." : "Those words express the action or state of being.")} Select them, then press Check.`);
          }
        };
        st.acts(`<button type="button" class="primary" data-a="check">✓ Check</button><button type="button" data-a="hear">🔊 Hear it</button>`, { check, hear: () => VOICE.speak(toks.map((t) => t.show).join(" ")) });
        prompt();
      },
    });
  },

  g3() {
    runGame("g3", {
      rounds: 10,

          text(view, 500, 80, "Clause or phrase?", { "font-size": 32, fill: "var(--accent-dark)" });

          para(view, 500, 258, s, { size: 54, fill: INK, maxW: 800, maxLines: 2 });
          para(view, 500, 420, "A clause contains a subject and a verb. A phrase does not.", { size: 26, fill: "#8a7764" });
          st.choose(CLAUSES, right, { hint: "Is there a subject-verb pair? If so, could it stand alone as a sentence?", why });
          talk(`Consider this group of words: <b>${s}</b>. Is it an independent clause, a dependent clause, or a phrase?`);

        const row = wordRow(view, s.split(" "), { y: 160, size: 44, maxW: 930, maxLines: 3, lineH: 70 });
        if (cite) citeText(row.bottom + 52, cite);
        para(view, 500, 485, "FANBOYS join equals: for, and, nor, but, or, yet, so.", { size: 24, fill: "#8a7764" });
        para(view, 500, 522, "Because, when, if, although, who, that… begin dependent clauses.", { size: 24, fill: "#8a7764" });
        st.choose(KINDS, right, {
          hint: "Count the subject-verb pairs. Which can stand alone? Does any begin with a subordinating word such as because, who or that?",
          why,
          onWin: () => row.items.filter((it) => joins.includes(it.word)).forEach((it) => {
            it.r.setAttribute("fill", "#fff3c4");
            it.r.setAttribute("stroke", "#e0a100");
          }),
        });
        talk("Count the clauses. Is this sentence simple, compound, complex, or compound-complex?");

  g4() {
    runGame("g4", {
      rounds: 8,
      noun: "diagrams",
      label: "Diagram",
      count: "sentences diagrammed",
      real: REAL.g4,
      ask(st) {
        const my = st.my;
        fresh();
        const d = st.take(DIAGRAMS[st.level]);
        const words = d.sentence.replace(/[.!?]$/, "").split(" ");
        const tiles = [];
        const pad = 26;
        const th = 52;
        const rowsT = [[]];
        let lw = 0;
        words.forEach((w, i) => {
          const tw = measure(w, DFONT, 800) + pad;
          const line = rowsT[rowsT.length - 1];
          if (line.length && lw + tw + 12 > 940) {
            rowsT.push([]);
            lw = 0;
          }
          rowsT[rowsT.length - 1].push({ w, i, tw });
          lw += tw + 12;
        });
        const by = d.sub ? (rowsT.length > 1 ? 210 : 178) : rowsT.length > 1 ? 232 : 205;
        const plan = planDiagram(d, by);
        drawLines(view, plan.lines);
        drawLines(view, plan.dashed, { "stroke-dasharray": "12 9", "stroke-width": 4 });
        if (d.cite) citeText(548, d.cite);
        const pool = {};
        for (const s of plan.slots) (pool[s.group] ||= []).push(s.word.toLowerCase());
        const slotG = el("g", {}, view);
        plan.slots.forEach((s, k) => {
          const g = el("g", { class: "gw-slot", "data-k": k, "data-group": s.group, transform: `translate(${s.x} ${s.y}) rotate(${s.a})` }, slotG);
          el("rect", { class: "gw-face", x: -s.w / 2, y: -21, width: s.w, height: 42, rx: 12, fill: "#fffaf0", stroke: "#c9b8a1", "stroke-width": 3, "stroke-dasharray": "9 7" }, g);
          s.g = g;
          if (st.level === "easy" && s.base && !/^p/.test(s.group)) text(g, 0, -34, GROUP_NAME(s.group, d), { "font-size": 22, fill: "#8a7764", "font-weight": 700 });
        });
        rowsT.forEach((line, r) => {
          const total = line.reduce((a, t) => a + t.tw, 0) + 12 * (line.length - 1);
          let x = 500 - total / 2;
          for (const t of line) {
            const hx = x + t.tw / 2;
            const hy = 40 + r * 60;
            const g = el("g", { class: "gw-tile", "data-word": t.w, transform: `translate(${hx} ${hy})` }, view);
            el("rect", { class: "gw-face", x: -t.tw / 2, y: -th / 2, width: t.tw, height: th, rx: 14, fill: "#fff", stroke: "var(--accent)", "stroke-width": 3 }, g);
            text(g, 0, 0, t.w, { "font-size": DFONT, fill: INK, "dominant-baseline": "central", "font-weight": 800 });
            tiles.push({ g, w: t.w, hx, hy, x: hx, y: hy, tries: 0 });
            x += t.tw + 12;
          }
        });
        // Crop the view to the drawing so it is as large as possible on every screen.
        try {
          const bb = view.getBBox();
          const padX = 24;
          const w0 = Math.max(620, bb.width + padX * 2);
          const h0 = Math.max(360, bb.height + 32);
          const x0 = bb.x + bb.width / 2 - w0 / 2;
          const y0 = bb.y + bb.height / 2 - h0 / 2;
          view.setAttribute("viewBox", `${x0} ${y0} ${w0} ${h0}`);
        } catch {}
        const tileOf = (g) => tiles.find((t) => t.g === g);
        const groupFor = (w) => Object.keys(pool).find((k) => pool[k].includes(w.toLowerCase()));
        let sel = null;
        let drag = null;
        const setPos = (t, x, y) => {
          t.x = x;
          t.y = y;
          t.g.setAttribute("transform", `translate(${x} ${y})`);
        };
        const select = (t) => {
          if (sel) paint(sel.g, "#fff", "var(--accent)");
          sel = sel === t ? null : t;
          if (sel) {
            paint(sel.g, "#fff3c4", "#e0a100");
            view.appendChild(sel.g);
          }
        };
        const hintFor = (t) => {
          const w = t.w;
          const g0 = groupFor(w) || "";
          if (g0 === "cj") return `${w} is a subordinating conjunction. It sits on the dashed line that links the verb of the dependent clause to the verb it modifies.`;
          const inSub = g0.startsWith("u:");
          const g = g0.replace(/^u:/, "");
          const pre = inSub ? "This word belongs to the dependent clause, drawn on the lower baseline. " : "";
          if (g === "s") return `${pre}Which word names what the clause is about? The subject sits first on the baseline, before the line that cuts through it.`;
          if (g === "v") return `${pre}Which word expresses the action or state of being? The verb sits just after the line that cuts through the baseline.`;
          if (g === "o" && d.ok !== "o") return `After a linking verb, a word that ${d.ok === "pn" ? "renames" : "describes"} the subject sits on the baseline after a line slanting back toward the subject.`;
          if (g === "o") return `Ask: ${d.v} what? The answer is the direct object. It sits after the short line that stops at the baseline.`;
          if (g === "vm") return `${pre}Does ${w} tell how, when or where? Then it hangs on a slant under the verb.`;
          if (/^p\d$/.test(g)) return `${w} is a preposition. Which word does its phrase modify? It hangs on a slant under that word.`;
          if (/^p\do$/.test(g)) return "Which noun follows the preposition? It sits on the horizontal line at the foot of the phrase.";
          return `${pre}Which noun does ${w} modify? Modifiers hang on a slant under the word they modify.`;
        };
        const done = () => plan.slots.every((s) => s.filled);
        const attempt = (t, slot) => {
          if (!t || slot.filled) return t && setPos(t, t.hx, t.hy);
          const ok = pool[slot.group].includes(t.w.toLowerCase());
          if (ok) {
            pool[slot.group].splice(pool[slot.group].indexOf(t.w.toLowerCase()), 1);
            slot.filled = true;
            slot.g.classList.remove("gw-glow", "gw-blink");
            const face = slot.g.querySelector(".gw-face");
            face.setAttribute("stroke", "transparent");
            face.setAttribute("fill", "transparent");
            [...slot.g.querySelectorAll("text")].forEach((x) => x.remove());
            text(slot.g, 0, 0, t.w, { "font-size": DFONT, fill: "var(--accent-dark)", "dominant-baseline": "central", "font-weight": 800 });
            slot.g.classList.remove("gw-slot");
            t.g.remove();
            t.placed = true;
            if (sel === t) sel = null;
            MUSIC.play("xylophone", 72 + 2 * (plan.slots.filter((s) => s.filled).length % 12), { gain: 0.35 });
            if (done()) {
              const parts = [`<b>${d.s}</b> is the subject`, `<b>${d.v}</b> is the verb`];
              if (d.o) parts.push(`<b>${d.o}</b> is the ${GROUP_NAME("o", d)}`);
              if (d.pp.length) parts.push(`${d.pp.map((p) => `<b>${p.p} ${[...p.obm, p.ob].join(" ")}</b>`).join(" and ")} ${d.pp.length > 1 ? "are prepositional phrases" : "is a prepositional phrase"}`);
              if (d.sub) parts.push(`<b>${d.sub.conj}</b> introduces the adverb clause, which modifies the verb ${d.v}`);
              return st.win(`Correct — ${parts.join("; ")}.`, null, { ms: 1400 });
            }
            const left = tiles.filter((x) => !x.placed).length;
            if (left) talk(`Correct. ${left} word${left > 1 ? "s" : ""} remaining.`);
            return;
          }
          setPos(t, t.hx, t.hy);
          if (sel === t) select(t);
          t.tries += 1;
          st.oops();
          if (t.tries === 1) talk(`${LEARN} ${hintFor(t)}`);
          else {
            const g = groupFor(t.w);
            plan.slots.filter((s) => s.group === g && !s.filled).forEach((s) => s.g.classList.add("gw-glow", "gw-blink"));
            talk(`${t.w} is ${an(GROUP_NAME(g, d))} ${GROUP_NAME(g, d)}. ${hintFor(t)} Its place is highlighted.`);
          }
        };
        const toSvg = (e) => {
          const p = view.createSVGPoint();
          p.x = e.clientX;
          p.y = e.clientY;
          return p.matrixTransform(view.getScreenCTM().inverse());
        };
        view.addEventListener("pointerdown", (e) => {
          if (my !== token || st.busy) return;
          const tg = e.target.closest(".gw-tile");
          if (tg) {
            const t = tileOf(tg);
            if (!t) return;
            drag = { t, p0: toSvg(e), x0: t.x, y0: t.y, moved: false };
            try {
              view.setPointerCapture(e.pointerId);
            } catch {}
            view.appendChild(t.g);
            window.OC?.touch();
            return;
          }
          const sg = e.target.closest(".gw-slot");
          if (sg && sel) attempt(sel, plan.slots[Number(sg.dataset.k)]);
        });
        view.addEventListener("pointermove", (e) => {
          if (!drag) return;
          const p = toSvg(e);
          const dx = p.x - drag.p0.x;
          const dy = p.y - drag.p0.y;
          if (Math.hypot(dx, dy) > 10) drag.moved = true;
          if (drag.moved) setPos(drag.t, drag.x0 + dx, drag.y0 + dy);
        });
        const up = () => {
          if (!drag) return;
          const { t, moved } = drag;
          drag = null;
          if (my !== token || st.busy) return;
          if (!moved) return select(t);
          let best = null;
          let bd = 95;
          for (const s of plan.slots) {
            if (s.filled) continue;
            const dist = Math.hypot(s.x - t.x, s.y - t.y);
            if (dist < bd) {
              bd = dist;
              best = s;
            }
          }
          if (best) attempt(t, best);
          else setPos(t, t.hx, t.hy);
        };
        view.addEventListener("pointerup", up);
        view.addEventListener("pointercancel", up);
        st.acts(`<button type="button" data-a="hear">🔊 Hear it</button>`, { hear: () => VOICE.speak(d.sentence) });
        talk(st.level === "easy" ? "Diagram the sentence: drag each word onto its line, or select a word and then its place." : d.sub ? "Diagram both clauses. The dependent clause goes on the lower baseline; its conjunction goes on the dashed line." : "Diagram the sentence: drag each word onto its line, or select a word and then its place.");
      },
    });
  },

  g5() {
    runGame("g5", {
      rounds: 10,
      noun: "verbs",
      label: "Verb",
      count: "verbs analyzed",
      real: REAL.g5,
      ask(st) {
        const blankRound = (item, title) => {

          const row = wordRow(view, s.split(" "), { y: 240, size: 54, maxW: 930, lineH: 100 });
          const blank = row.items.find((it) => it.word.startsWith("___"));
          blank.t.textContent = "_____";
          const opts = shuffle([right, ...wrongs]);
          st.choose(opts, opts.indexOf(right), {
            hint: "Is there a helping verb such as has, have or had before the blank? If so, you need the past participle. Read each option aloud within the sentence.",
            why,
            onWin: () => {
              blank.t.textContent = right + blank.word.slice(3);
              blank.t.setAttribute("fill", "#157a40");
            },
          });
          talk(`Choose the correct form of <b>${base}</b>.`, `${s.replace("___", "blank")} Choose the correct form of ${base}.`);
        };
        const agreeRound = (item) => {
          const [s, right, wrong, cross, why] = item;
          fresh();
          text(view, 500, 80, "Make the subject and verb agree", { "font-size": 32, fill: "var(--accent-dark)" });
          const row = wordRow(view, s.split(" "), { y: 230, size: 50, maxW: 930, maxLines: 2, lineH: 100 });
          const blank = row.items.find((it) => it.word.startsWith("___"));
          blank.t.textContent = "_____";
          const opts = shuffle([right, wrong]);
          st.choose(opts, opts.indexOf(right), {
            hint: "Locate the true subject first. Set aside any prepositional or interrupting phrase. Is the subject singular or plural?",
            why,
            onWin: () => {
              blank.t.textContent = right + blank.word.slice(3);
              blank.t.setAttribute("fill", "#157a40");
              let used = 0;
              row.items.forEach((it) => {
                if (used < cross.length && it.word === cross[used] && it.i > 0) {
                  strike(view, it);
                  used += 1;
                }
              });
            },
          });
          talk("Which verb agrees with the subject?", `${s.replace("___", "blank")} Which verb agrees with the subject?`);
        };
        if (st.level === "easy") {
          if (st.round % 2) return blankRound(st.takeFrom("irreg", IRREG));
          const [s, right, why] = st.takeFrom("tense", TENSE_SENT);
          markedQ(st, { s, title: "When does the action occur?", choices: TENSES, right, hint: "Look for time clues such as yesterday or tomorrow, and for helping verbs such as will, is or were.", why: why || TENSE_WHY[right], prompt: "Is the marked verb past, present, or future?" });
          return;
        }
        if (st.level === "medium") {
          if (st.round % 2) return agreeRound(st.takeFrom("agree", AGREE));
          return blankRound(st.takeFrom("irreg", [...IRREG, ...IRREG_MORE]));
        }
        if (st.round % 2) return agreeRound(st.takeFrom("agree", AGREE_HARD));
        const [s, name, why] = st.takeFrom("tense12", TENSE_HARD);
        const [time] = name.split(" ").filter((w) => ["past", "present", "future"].includes(w));
        const near = TENSE12.filter((t) => t !== name && (t.includes(time) || t.split(" ").slice(-1)[0] === name.split(" ").slice(-1)[0]));
        const opts = shuffle([name, ...shuffle(near).slice(0, 3)]);
        markedQ(st, { s, title: "Name the tense precisely", choices: opts, right: opts.indexOf(name), hint: "First decide the time: past, present or future. Then the aspect: is there a form of have (perfect), an -ing form (progressive), both, or neither (simple)?", why, prompt: "Name the tense of the marked verb." });
      },
    });
  },

  g6() {
    runGame("g6", {
      rounds: 10,
      noun: "sentences",
      label: "Sentence",
      count: "sentences punctuated",
      real: REAL.g6,
      ask(st) {
        const my = st.my;
        let kind = "comma";
        if (st.level === "medium") kind = ["comma", "apos", "quote"][st.round % 3];
        if (st.level === "hard") kind = st.round % 2 ? "semi" : "comma";
        if (kind !== "comma") {
          const list = { apos: APOS, quote: QUOTES, semi: SEMI }[kind];
          const [meaning, right, w1, w2, why, hint] = st.takeFrom(kind, list);
          const top = { apos: "Select the sentence with correct apostrophes", quote: "Select the correctly punctuated dialogue", semi: "Select the correctly punctuated sentence" }[kind];
          cardRound(st, { top, sub: `Situation: ${meaning}`, cards: [right, w1, w2], right: 0, hint, why });
          st.acts(`<button type="button" data-a="hear">🔊 Hear it</button>`, { hear: () => VOICE.speak(meaning) });
          talk(`${meaning} Which version is punctuated correctly?`);
          return;
        }
        fresh();
        const [s, rule, why] = st.takeFrom(`comma-${st.level}`, st.level === "hard" ? COMMA_HARD2 : COMMA[st.level]);
        const toks = parseComma(s);
        const on = new Set();
        const commas = el("g", { "pointer-events": "none" }, view);
        const marks = [];
        text(view, 500, 70, "Select each word that a comma should follow", { "font-size": 30, fill: "var(--accent-dark)" });
        const row = wordRow(view, toks.map((t) => t.show), {
          y: 210,
          size: 52,
          maxW: 900,
          maxLines: 3,
          lineH: 105,
          tap: (it) => {
            if (my !== token || st.busy || it.i === toks.length - 1) return;
            window.OC?.touch();
            if (on.has(it.i)) {
              on.delete(it.i);
              marks[it.i].setAttribute("opacity", 0);
            } else {
              on.add(it.i);
              marks[it.i].setAttribute("opacity", 1);
              MUSIC.play("woodblock", 84, { gain: 0.3 });
            }
          },
        });
        row.items.forEach((it) => {
          marks[it.i] = text(commas, it.x + it.w + 4, it.y, ",", { "font-size": it.size * 1.15, fill: "#c62828", "text-anchor": "start", opacity: 0, "font-weight": 900 });
        });
        para(view, 500, 500, "Select a word again to remove its comma. Some sentences need none.", { size: 24, fill: "#8a7764" });
        const need = toks.map((t, i) => (t.need ? i : -1)).filter((i) => i >= 0);
        const opt = toks.map((t, i) => (t.opt ? i : -1)).filter((i) => i >= 0);
        const check = () => {
          if (my !== token || st.busy) return;
          const missing = need.filter((i) => !on.has(i));
          const extra = [...on].filter((i) => !need.includes(i) && !opt.includes(i));
          if (!missing.length && !extra.length) {
            row.items.forEach((it) => marks[it.i].setAttribute("fill", "#157a40"));
            return st.win(`Correct — ${why}`);
          }
          const tries = st.oops();
          if (tries === 1) {
            const tip = extra.length && !missing.length ? "One of your commas is unnecessary." : missing.length && !extra.length && need.length ? "A required comma is still missing." : "";
            talk(`${LEARN} ${tip} ${COMMA_ASK[rule]}`);
          } else {
            on.clear();
            row.items.forEach((it) => marks[it.i].setAttribute("opacity", 0));
            need.forEach((i) => {
              row.items[i].r.setAttribute("stroke", "#ffb300");
              row.items[i].r.setAttribute("stroke-width", 6);
            });
            talk(`${why} ${need.length ? "Select the highlighted word" + (need.length > 1 ? "s" : "") + ", then press Check." : "Therefore remove every comma and press Check."}`);
          }
        };
        st.acts(`<button type="button" class="primary" data-a="check">✓ Check</button><button type="button" data-a="hear">🔊 Hear it</button>`, { check, hear: () => VOICE.speak(toks.map((t) => t.show).join(" ")) });
        talk("Where are commas required? Select each word that a comma should follow, then press Check.");
      },
    });
  },

  g7() {
    runGame("g7", {
      rounds: 10,
      noun: "sentences",
      label: "Sentence",
      count: "sentences repaired",
      real: REAL.g7,
      ask(st) {
        if (st.level === "easy") {
          fresh();
          const [s, right, why] = st.take(FAULT_SENT);
          text(view, 500, 80, "Diagnose the sentence", { "font-size": 32, fill: "var(--accent-dark)" });
          card(view, 500, 140, 920, 220, { fill: "#fff", stroke: "#c9b8a1", cls: "gw-deco" });
          para(view, 500, 240, s, { size: 48, fill: INK, maxW: 860, maxLines: 2, lineH: 64 });
          para(view, 500, 440, "A sentence needs a subject, a verb and a complete thought.", { size: 26, fill: "#8a7764" });
          st.choose(FAULTS, right, { hint: "Count the subject-verb pairs. Is the thought complete? If there are two independent clauses, how are they joined?", why: why ? `${FAULT_WHY[right].split(":")[0]}. ${why}` : FAULT_WHY[right] });
          talk(`<b>${s}</b> Is it a fragment, a run-on, a comma splice, or complete?`, `${s} Is it a fragment, a run-on, a comma splice, or complete?`);
          return;
        }
        const combine = () => {
          const [a, b, join, right, w1, w2, why] = st.takeFrom("combine", COMBINE);
          cardRound(st, { top: `${a} + ${b}`, sub: `Join them with ${join}.`, cards: [right, w1, w2], right: 0, hint: "Where does the comma go when the dependent clause comes first? When it comes last? With a FANBOYS conjunction, the comma precedes the conjunction.", why });
          st.acts(`<button type="button" data-a="hear">🔊 Hear it</button>`, { hear: () => VOICE.speak(`${a} ${b} Join them with ${join}.`) });
          talk(`Combine the two sentences using ${join}. Which version is correct?`);
        };
        const fix = (list, key, top) => {
          const [broken, right, w1, w2, why, hint] = st.takeFrom(key, list);
          cardRound(st, { top: `${top}: ${broken}`, cards: [right, w1, w2], right: 0, hint, why });
          st.acts(`<button type="button" data-a="hear">🔊 Hear it</button>`, { hear: () => VOICE.speak(broken) });
          talk("Which version repairs the sentence correctly?", `${broken} Which version repairs it correctly?`);
        };
        if (st.level === "medium") return st.round % 2 ? combine() : fix(FIXES, "fix", "Repair");
        return st.round % 3 === 2 ? combine() : fix(MODIFIERS, "mod", "Repair the modifier");
      },
    });
  },

  g8() {
    runGame("g8", {
      rounds: 10,
      noun: "verbals",
      label: "Verbal",
      count: "verbals identified",
      real: REAL.g8,
      ask(st) {
        if (st.level === "easy") {
          const [s, right, why] = st.take(VERBAL_EASY);
          return markedQ(st, { s, title: "Main verb, or a verb form used as an adjective?", choices: ["Main verb", "Participle (adjective)"], right, hint: "Remove the marked word. Does the sentence still have a verb? Does the marked word describe a noun?", why, prompt: "Is the marked word the main verb, or a participle describing a noun?" });
        }
        if (st.level === "medium") {
          const [s, right, why] = st.take(VERBAL_MED);
          return markedQ(st, { s, title: "Which kind of verbal is marked?", choices: ["Gerund", "Participle", "Infinitive"], right, hint: "Does it begin with to? Then consider infinitive. If it ends in -ing, does it name an activity (a noun) or describe a noun?", why, prompt: "Is the marked verbal a gerund, a participle, or an infinitive?" });
        }
        const [s, right, why, cite] = st.take(VERBAL_HARD);
        markedQ(st, { s, cite, title: "What job does the verbal phrase perform?", choices: ["Noun", "Adjective", "Adverb"], right, hint: "Can you replace it with it or something (a noun)? Does it tell which one (an adjective)? Does it tell why, how, or to what extent (an adverb)?", why, prompt: "Does the marked verbal act as a noun, an adjective, or an adverb?" });
      },
    });
  },

  g9() {
    runGame("g9", {
      rounds: 10,
      noun: "clauses",
      label: "Clause",
      count: "clauses analyzed",
      real: REAL.g9,
      ask(st) {
        const list = { easy: CLAUSE_EASY, medium: CLAUSE_MED, hard: CLAUSE_HARD }[st.level];
        const [s, right, why, cite] = st.take(list);
        const choices = st.level === "easy" ? ["Adjective clause", "Adverb clause"] : ["Adjective clause", "Adverb clause", "Noun clause"];
        markedQ(st, { s, cite, title: "What job does the dependent clause perform?", choices, right, size: 44, hint: st.level === "easy" ? "Does the clause tell which one about a noun, or when, why or under what condition about a verb?" : "Could you replace the clause with something or it? Then it is a noun clause. Does it tell which one? Adjective. When, why, how or under what condition? Adverb.", why, prompt: "Is the marked clause working as a noun, an adjective, or an adverb?" });
      },
    });
  },

  g10() {
    runGame("g10", {
      rounds: 10,
      noun: "sentences",
      label: "Sentence",
      count: "sentences analyzed",
      real: REAL.g10,
      ask(st) {
        if (st.level === "easy") {
          const [s, right, why, cite] = st.take(MOOD_EASY);
          return markedQ(st, { s, cite, title: "Which mood is the marked verb?", choices: MOODS, right, hint: "Does it state a fact or ask a question? Give a command? Or express a wish, a demand, or a condition contrary to fact?", why, prompt: "Is the marked verb indicative, imperative, or subjunctive?" });
        }
        if (st.level === "medium") {
          const [s, right, wrong, why] = st.take(SUBJ);
          fresh();
          text(view, 500, 80, "Indicative or subjunctive: which form fits?", { "font-size": 32, fill: "var(--accent-dark)" });
          const row = wordRow(view, s.split(" "), { y: 230, size: 50, maxW: 930, maxLines: 2, lineH: 100 });
          const blank = row.items.find((it) => it.word.startsWith("___"));
          blank.t.textContent = "_____";
          para(view, 500, 470, "Subjunctive: wishes, demands, and conditions contrary to fact.", { size: 25, fill: "#8a7764" });
          const opts = shuffle([right, wrong]);
          st.choose(opts, opts.indexOf(right), {
            hint: "Is the situation real and possible, or imagined, wished for, or demanded?",
            why,
            onWin: () => {
              blank.t.textContent = right + blank.word.slice(3);
              blank.t.setAttribute("fill", "#157a40");
            },
          });
          return talk("Which form completes the sentence correctly?", `${s.replace("___", "blank")} Which form is correct?`);
        }
        const [broken, right, w1, w2, why, hint] = st.take(PARALLEL);
        const cited = !/[.!?]$/.test(broken);
        cardRound(st, { top: cited ? `Which is the original, parallel wording? (${broken})` : `Make it parallel: ${broken}`, cards: [right, w1, w2], right: 0, hint, why });
        st.acts(`<button type="button" data-a="hear">🔊 Hear it</button>`, { hear: () => VOICE.speak(cited ? broken : broken) });
        talk("Parallelism: matching ideas take matching grammatical forms. Which version is parallel?");
      },
    });
  },
};

    units[id]();
  },
});
