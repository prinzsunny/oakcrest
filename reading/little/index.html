<script>const { $, el, svg: makeSvg, text, panel, say, wait, confetti, explain, everyday, emoji } = KIT;
const stage = $("[data-stage]");
let token = 0;
let cleanups = [];
let shell = null;

// ======================================================================
// <DATA> pure data and round generators (no DOM). Checked by a Node script.
// ======================================================================
const ORDER = ["s", "a", "t", "p", "i", "n", "m", "d", "g", "o", "c", "k", "e", "u", "r", "h", "b", "f", "l", "j", "v", "w", "x", "y", "z"];
// Letter names are what the voice says for a letter. Sounds are taught through words, never as bare sounds.
const LETTER_NAME = { a: "ay", b: "bee", c: "see", d: "dee", e: "ee", f: "eff", g: "gee", h: "aitch", i: "eye", j: "jay", k: "kay", l: "ell", m: "em", n: "en", o: "oh", p: "pee", q: "cue", r: "are", s: "ess", t: "tee", u: "you", v: "vee", w: "double you", x: "ex", y: "why", z: "zee" };
// c and k make the same first sound (cat, kite); every other letter has its own.
const group = (l) => (l === "k" ? "c" : l);
// Each word is [word, picture]. "svg:name" is a drawn picture (no clear emoji exists).
// Vowels use their SHORT sound only. c is always the /k/ sound, g always the hard sound.
// x is taught by words that END in x.
const WORDS = {
  s: [["sun", "☀️"], ["sock", "🧦"], ["seal", "🦭"], ["soap", "🧼"], ["salt", "🧂"], ["sandwich", "🥪"]],
  a: [["apple", "🍎"], ["ant", "🐜"], ["ax", "🪓"], ["anchor", "⚓"]],
  t: [["tiger", "🐯"], ["tent", "⛺"], ["turtle", "🐢"], ["tooth", "🦷"], ["taco", "🌮"], ["tomato", "🍅"], ["train", "🚆"]],
  p: [["pig", "🐷"], ["pizza", "🍕"], ["pear", "🍐"], ["panda", "🐼"], ["penguin", "🐧"], ["pie", "🥧"], ["piano", "🎹"], ["pineapple", "🍍"], ["popcorn", "🍿"], ["pencil", "✏️"]],
  i: [["igloo", "svg:igloo"], ["ink", "svg:ink"], ["insect", "svg:insect"]],
  n: [["nose", "👃"], ["newspaper", "📰"], ["noodles", "🍜"], ["nine", "9️⃣"]],
  m: [["moon", "🌙"], ["mouse", "🐭"], ["monkey", "🐒"], ["milk", "🥛"], ["mushroom", "🍄"], ["mango", "🥭"], ["map", "🗺️"], ["mountain", "⛰️"]],
  d: [["dog", "🐕"], ["duck", "🦆"], ["door", "🚪"], ["drum", "🥁"], ["dolphin", "🐬"], ["donut", "🍩"], ["deer", "🦌"], ["dinosaur", "🦕"]],
  g: [["goat", "🐐"], ["gift", "🎁"], ["guitar", "🎸"], ["gorilla", "🦍"], ["grapes", "🍇"]],
  o: [["octopus", "🐙"], ["ox", "🐂"], ["otter", "🦦"], ["olive", "🫒"]],
  c: [["cat", "🐱"], ["cow", "🐄"], ["car", "🚗"], ["carrot", "🥕"], ["cake", "🎂"], ["camel", "🐫"], ["corn", "🌽"], ["cookie", "🍪"], ["crab", "🦀"], ["crown", "👑"], ["camera", "📷"], ["cap", "🧢"]],
  k: [["kite", "🪁"], ["key", "🔑"], ["kangaroo", "🦘"], ["koala", "🐨"], ["kiwi", "🥝"]],
  e: [["egg", "🥚"], ["elephant", "🐘"], ["eggplant", "🍆"], ["elf", "🧝"]],
  u: [["umbrella", "☂️"], ["up", "⬆️"], ["under", "svg:under"]],
  r: [["rabbit", "🐰"], ["rainbow", "🌈"], ["ring", "💍"], ["robot", "🤖"], ["rocket", "🚀"], ["rose", "🌹"], ["rooster", "🐓"]],
  h: [["horse", "🐴"], ["house", "🏠"], ["hammer", "🔨"], ["heart", "❤️"], ["helicopter", "🚁"], ["hippo", "🦛"], ["honey", "🍯"], ["hat", "🎩"]],
  b: [["ball", "⚽"], ["bee", "🐝"], ["bear", "🐻"], ["boat", "⛵"], ["banana", "🍌"], ["bus", "🚌"], ["butterfly", "🦋"], ["bed", "🛏️"], ["book", "📖"], ["bird", "🐦"], ["bell", "🔔"], ["balloon", "🎈"], ["bread", "🍞"], ["bone", "🦴"], ["bat", "🦇"]],
  f: [["fish", "🐟"], ["frog", "🐸"], ["fox", "🦊"], ["flower", "🌸"], ["fire", "🔥"], ["feather", "🪶"], ["foot", "🦶"]],
  l: [["lion", "🦁"], ["leaf", "🍃"], ["lemon", "🍋"], ["ladder", "🪜"], ["ladybug", "🐞"], ["lock", "🔒"], ["lollipop", "🍭"], ["leg", "🦵"], ["lizard", "🦎"], ["lobster", "🦞"]],
  j: [["juice", "🧃"], ["jeans", "👖"], ["jigsaw", "🧩"], ["joystick", "🕹️"], ["jack-o-lantern", "🎃"]],
  v: [["van", "🚐"], ["violin", "🎻"], ["volcano", "🌋"], ["vest", "🦺"]],
  w: [["watch", "⌚"], ["whale", "🐋"], ["watermelon", "🍉"], ["web", "🕸️"], ["window", "🪟"], ["wolf", "🐺"], ["worm", "🪱"]],
  x: [["box", "📦"], ["fox", "🦊"], ["six", "6️⃣"], ["ax", "🪓"], ["ox", "🐂"]],
  y: [["yo-yo", "🪀"], ["yarn", "🧶"], ["yawn", "🥱"], ["yellow", "💛"]],
  z: [["zebra", "🦓"], ["zero", "0️⃣"], ["zipper", "svg:zipper"]],
};
// Rhyming sets. Every set rhymes in General American and in British English.
const RHYMES = [
  [["cat", "🐱"], ["hat", "🎩"], ["bat", "🦇"], ["rat", "🐀"]],
  [["dog", "🐕"], ["log", "🪵"], ["fog", "🌫️"]],
  [["bee", "🐝"], ["tree", "🌳"], ["key", "🔑"]],
  [["star", "⭐"], ["car", "🚗"], ["guitar", "🎸"]],
  [["moon", "🌙"], ["spoon", "🥄"], ["balloon", "🎈"]],
  [["boat", "⛵"], ["goat", "🐐"], ["coat", "🧥"]],
  [["bed", "🛏️"], ["sled", "🛷"]],
  [["fish", "🐟"], ["dish", "🍽️"]],
  [["house", "🏠"], ["mouse", "🐭"]],
  [["snail", "🐌"], ["whale", "🐋"]],
  [["hen", "🐔"], ["pen", "🖊️"], ["ten", "🔟"]],
  [["bell", "🔔"], ["shell", "🐚"]],
  [["train", "🚆"], ["rain", "🌧️"], ["plane", "✈️"], ["chain", "⛓️"]],
  [["van", "🚐"], ["man", "👨"], ["can", "🥫"]],
  [["cake", "🎂"], ["snake", "🐍"]],
  [["fox", "🦊"], ["box", "📦"], ["ox", "🐂"]],
  [["clock", "🕐"], ["lock", "🔒"], ["rock", "🪨"]],
  [["pie", "🥧"], ["eye", "👁️"], ["fly", "🪰"], ["tie", "👔"]],
  [["shoe", "👟"], ["blue", "🔵"]],
  [["bear", "🐻"], ["pear", "🍐"], ["chair", "🪑"]],
];
// Short words for blending. rime is a real word the voice can say ("at", "an", "in", "en", "ox", "ad").
const FAMILIES = [
  { rime: "at", words: [["cat", "🐱"], ["bat", "🦇"], ["hat", "🎩"], ["rat", "🐀"]] },
  { rime: "an", words: [["can", "🥫"], ["man", "👨"], ["van", "🚐"]] },
  { rime: "in", words: [["pin", "📌"], ["bin", "🗑️"]] },
  { rime: "en", words: [["hen", "🐔"], ["pen", "🖊️"], ["ten", "🔟"]] },
  { rime: "ox", words: [["fox", "🦊"], ["box", "📦"]] },
  { rime: "ad", words: [["sad", "😢"], ["mad", "😠"]] },
];

// ---------- letter shapes: standard print formation, one array of points per stroke, in order ----------
const rad = (d) => (d * Math.PI) / 180;
const arc = (cx, cy, rx, ry, a0, a1) => {
  const n = Math.max(8, Math.ceil(Math.abs(a1 - a0) / 6));
  return Array.from({ length: n + 1 }, (_, i) => {
    const a = rad(a0 + ((a1 - a0) * i) / n);
    return [cx + rx * Math.cos(a), cy + ry * Math.sin(a)];
  });
};
const line = (x0, y0, x1, y1) => {
  const n = Math.max(2, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 3));
  return Array.from({ length: n + 1 }, (_, i) => [x0 + ((x1 - x0) * i) / n, y0 + ((y1 - y0) * i) / n]);
};
const bez = (p0, p1, p2, p3, n = 18) =>
  Array.from({ length: n + 1 }, (_, i) => {
    const t = i / n;
    const u = 1 - t;
    return [0, 1].map((k) => u * u * u * p0[k] + 3 * u * u * t * p1[k] + 3 * u * t * t * p2[k] + t * t * t * p3[k]);
  });
const chain = (...parts) => parts.flatMap((part, i) => (i ? part.slice(1) : part));
const bowl = (a0, a1) => arc(28, 58, 22, 22, a0, a1);
const hump = (x, top = 32) => chain(bez([x, 56], [x + 4, 36], [x + 38, top], [x + 38, 54]), line(x + 38, 54, x + 38, 80));
const STROKES = {
  a: [bowl(-45, -405), line(50, 36, 50, 80)],
  b: [line(6, 4, 6, 80), bowl(180, 540)],
  c: [bowl(-40, -320)],
  d: [bowl(-45, -405), line(50, 4, 50, 80)],
  e: [chain(line(6, 58, 50, 58), bowl(0, -315))],
  f: [chain(bez([46, 12], [40, 2], [24, 2], [24, 24]), line(24, 24, 24, 80)), line(10, 38, 42, 38)],
  g: [bowl(-45, -405), chain(line(50, 36, 50, 100), bez([50, 100], [50, 114], [34, 118], [16, 110]))],
  h: [line(8, 4, 8, 80), hump(8)],
  i: [line(28, 36, 28, 80), [[28, 16], [28, 17]]],
  j: [chain(line(28, 36, 28, 100), bez([28, 100], [28, 114], [20, 118], [10, 112])), [[28, 16], [28, 17]]],
  k: [line(8, 4, 8, 80), line(46, 36, 10, 62), line(24, 50, 48, 80)],
  l: [line(28, 4, 28, 80)],
  m: [line(6, 36, 6, 80), chain(bez([6, 56], [8, 36], [26, 34], [26, 54]), line(26, 54, 26, 80)), chain(bez([26, 56], [28, 36], [48, 34], [48, 54]), line(48, 54, 48, 80))],
  n: [line(8, 36, 8, 80), hump(8)],
  o: [arc(28, 58, 22, 22, -90, -450)],
  p: [line(6, 36, 6, 116), bowl(180, 540)],
  q: [bowl(-45, -405), line(50, 36, 50, 116)],
  r: [line(10, 36, 10, 80), bez([10, 58], [14, 38], [28, 34], [40, 40])],
  s: [chain(arc(28, 47, 15, 11, -40, -270), arc(28, 69, 17, 11, -90, 150))],
  t: [chain(line(26, 8, 26, 70), bez([26, 70], [26, 80], [34, 82], [44, 76])), line(12, 38, 42, 38)],
  u: [chain(line(8, 36, 8, 62), arc(28, 62, 20, 18, 180, 0)), line(48, 36, 48, 80)],
  v: [chain(line(6, 36, 28, 80), line(28, 80, 50, 36))],
  w: [chain(line(4, 36, 15, 80), line(15, 80, 28, 44), line(28, 44, 41, 80), line(41, 80, 52, 36))],
  x: [line(8, 36, 48, 80), line(48, 36, 8, 80)],
  y: [line(8, 36, 30, 78), line(48, 36, 14, 116)],
  z: [chain(line(8, 36, 48, 36), line(48, 36, 8, 80), line(8, 80, 48, 80))],
};
const BOUNDS = {};
for (const [ch, strokes] of Object.entries(STROKES)) {
  const all = strokes.flat();
  BOUNDS[ch] = { minX: Math.min(...all.map((p) => p[0])), maxX: Math.max(...all.map((p) => p[0])), minY: Math.min(...all.map((p) => p[1])), maxY: Math.max(...all.map((p) => p[1])) };
}

// ---------- round generators ----------
const rpick = (list) => list[Math.floor(Math.random() * list.length)];
const rshuffle = (list) => {
  const out = [...list];
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
};
const itemsOf = (l) => WORDS[l].map(([w, pic]) => ({ w, pic, l }));
const poolLetters = (week) => ORDER.slice(0, week + 1);
const pickLetter = (week) => (Math.random() < 0.5 ? ORDER[week] : rpick(poolLetters(week)));
// Pictures for the wrong answers: any word that starts with a different sound (never x words, never the same group).
const otherStarts = (week, avoid) => ORDER.slice(0, Math.max(week, 9) + 1).filter((l) => l !== "x" && group(l) !== avoid).flatMap(itemsOf);
const takeOthers = (list, n, used) => {
  const out = [];
  for (const item of rshuffle(list)) {
    if (out.length >= n) break;
    if (used.has(item.pic) || used.has(item.w) || out.some((o) => o.pic === item.pic || group(o.l) === group(item.l))) continue;
    out.push(item);
  }
  return out;
};
const endsClean = (item) => !/[xsk]$/.test(item.w);
const withOk = (correct, others) => rshuffle([{ ...correct, ok: true }, ...others.map((o) => ({ ...o, ok: false }))]);

// Unit 1: which picture starts (or, for x, ends) like the target word?
function genSame(week, n) {
  const L = pickLetter(week);
  if (L === "x") {
    const [target, correct] = rshuffle(itemsOf("x")).slice(0, 2);
    const others = rshuffle(otherStarts(week, "x").filter(endsClean)).filter((o, i, a) => a.findIndex((p) => p.pic === o.pic) === i && o.pic !== target.pic && o.pic !== correct.pic).slice(0, n - 1);
    return { kind: "same", mode: "end", letter: "x", target, correct, choices: withOk(correct, others) };
  }
  const sameSound = poolLetters(week).filter((l) => group(l) === group(L)).flatMap(itemsOf);
  const target = rpick(itemsOf(L));
  const correct = rpick(sameSound.filter((i) => i.w !== target.w && i.pic !== target.pic));
  const others = takeOthers(otherStarts(week, group(L)), n - 1, new Set([target.pic, correct.pic, target.w, correct.w]));
  return { kind: "same", mode: "start", letter: L, target, correct, choices: withOk(correct, others) };
}

// Unit 2: the letter is shown with two example words; tap a different picture that starts with it.
function genLetter(week, n) {
  const L = pickLetter(week);
  const keys = rshuffle(itemsOf(L)).slice(0, 2);
  const correct = rpick(itemsOf(L).filter((i) => !keys.some((k) => k.pic === i.pic)));
  const pool = L === "x" ? otherStarts(week, "x").filter(endsClean) : otherStarts(week, group(L));
  const used = new Set([...keys.map((k) => k.pic), correct.pic]);
  const others = L === "x" ? rshuffle(pool).filter((o, i, a) => !used.has(o.pic) && a.findIndex((p) => p.pic === o.pic) === i).slice(0, n - 1) : takeOthers(pool, n - 1, used);
  return { kind: "letter", mode: L === "x" ? "end" : "start", letter: L, keys, correct, choices: withOk(correct, others) };
}

// Unit 4: which picture rhymes with the target?
function genRhyme(n) {
  const sets = RHYMES.map((s) => s.map(([w, pic]) => ({ w, pic })));
  const set = rpick(sets);
  const [target, correct] = rshuffle(set).slice(0, 2);
  const usedPics = new Set(set.map((i) => i.pic));
  const others = [];
  for (const s of rshuffle(sets)) {
    if (s === set || others.length >= n - 1) continue;
    const cand = rpick(s);
    if (usedPics.has(cand.pic) || others.some((o) => o.pic === cand.pic)) continue;
    others.push(cand);
  }
  return { kind: "rhyme", mode: "none", target, correct, choices: withOk(correct, others) };
}

// Unit 5: blend a first letter with a rime word the voice can say ("at"), then pick the picture.
const CVC = FAMILIES.flatMap((f) => f.words.map(([w, pic]) => ({ w, pic, l: w[0], rime: f.rime, fam: f.rime })));
function genBlend(week, n) {
  let usable = CVC.filter((c) => ORDER.indexOf(c.l) <= week);
  if (usable.length < 6) usable = CVC.filter((c) => ORDER.indexOf(c.l) <= Math.max(week, ORDER.indexOf("b")));
  const target = rpick(usable);
  const family = CVC.filter((c) => c.fam === target.fam);
  const model = rpick(family.filter((c) => c.w !== target.w));
  const used = new Set([target.pic, model.pic]);
  const others = [];
  const sibling = n >= 3 ? rshuffle(family.filter((c) => c.w !== target.w && c.w !== model.w)) : [];
  if (sibling.length) {
    others.push(sibling[0]);
    used.add(sibling[0].pic);
  }
  for (const c of rshuffle(CVC)) {
    if (others.length >= n - 1) break;
    if (c.fam === target.fam || used.has(c.pic) || others.some((o) => o.fam === c.fam)) continue;
    others.push(c);
    used.add(c.pic);
  }
  return { kind: "blend", mode: "none", target, onset: target.l, rime: target.rime, model, choices: withOk(target, others) };
}
// </DATA>

// ======================================================================
// speech and text helpers
// ======================================================================
const EMO = /[\p{Extended_Pictographic}\u{1F1E6}-\u{1F1FF}\u{1F3FB}-\u{1F3FF}️‍⃣]/gu;
const clean = (s) => String(s).replace(EMO, "").replace(/\s+/g, " ").trim();
const SAY_WORD = { "yo-yo": "yo yo", "jack-o-lantern": "jack o lantern" };
// {s} shows the letter on screen and is spoken as its name ("ess"). Words with a hyphen are spelled for the voice.
const fmt = (t, speech) => {
  const out = t.replace(/\{([a-z])\}/g, (_, l) => (speech ? LETTER_NAME[l] : `<b class="ll-l">${l}</b>`));
  return speech ? out.replace(/yo-yo|jack-o-lantern/g, (m) => SAY_WORD[m]) : out;
};
function talk(t) {
  say(fmt(t, false), { voice: false });
  VOICE.speak(clean(fmt(t, true)));
}
function talkAsync(t) {
  say(fmt(t, false), { voice: false });
  return VOICE.speakAsync(clean(fmt(t, true)));
}
const cap = (w) => w.charAt(0).toUpperCase() + w.slice(1);

// the tracing art (shared by "See it" and "Trace it")
// ======================================================================
function traceArt(parent, ch, box, px = 1) {
  const S = STROKES[ch];
  const f = fitLetter(ch, box, { pad: 20, tall: 60 });
  const g = el("g", { transform: `translate(${f.tx.toFixed(1)} ${f.ty.toFixed(1)}) scale(${f.s.toFixed(3)})` }, parent);
  const ppu = f.s * px; // screen pixels per letter unit
  const sw = Math.max(6.5, 22 / ppu);
  const b = BOUNDS[ch];
  // faint writing lines (baseline and x-height)
  for (const y of [36, 80]) el("path", { d: `M${b.minX - 14} ${y}H${b.maxX + 14}`, stroke: "#e9dfcb", "stroke-width": 1.4 / Math.max(0.6, ppu / 3), "stroke-dasharray": "6 5" }, g);
  const guide = S.map((pts) => el("path", { d: letterD([pts]), fill: "none", stroke: "#ebe3d3", "stroke-width": sw + 3.2, "stroke-linecap": "round", "stroke-linejoin": "round" }, g));
  S.forEach((pts) => el("path", { d: letterD([pts]), fill: "none", stroke: "#cfc3ad", "stroke-width": 1.6, "stroke-dasharray": "2 7", "stroke-linecap": "round" }, g));
  const ink = S.map(() => el("path", { d: "", fill: "none", stroke: "var(--accent)", "stroke-width": sw, "stroke-linecap": "round", "stroke-linejoin": "round" }, g));
  const r = Math.max(4.4, 15 / ppu);
  const dots = S.map((pts, i) => {
    const d = el("g", { transform: `translate(${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)})` }, g);
    el("circle", { class: "ll-dot-ring", r: r * 1.5, fill: "none", stroke: "var(--accent)", "stroke-width": r * 0.28 }, d);
    el("circle", { r, fill: "var(--accent-dark)", stroke: "#fff", "stroke-width": r * 0.22 }, d);
    const t = text(d, 0, r * 0.42, i + 1, { "font-size": r * 1.25, fill: "#fff", "font-weight": 900, "font-family": FONT });
    t.setAttribute("pointer-events", "none");
    return d;
  });
  const pen = el("circle", { class: "ll-pen", r: r * 0.72, fill: "#ffcf5c", stroke: "#b8860b", "stroke-width": r * 0.2, visibility: "hidden", "pointer-events": "none" }, g);
  const api = {
    g, S, f, ppu, sw,
    setInk(si, p) {
      ink[si].setAttribute("d", p < 0 ? "" : letterD([S[si].slice(0, p + 1)]));
    },
    // state of the numbered dots: done strokes are hidden, the current one pulses, later ones are quiet
    dots(si) {
      dots.forEach((d, i) => {
        d.setAttribute("opacity", i < si ? 0 : i === si ? 1 : 0.5);
        d.querySelector(".ll-dot-ring").setAttribute("class", i === si ? "ll-dot-ring ll-pulse" : "ll-dot-ring");
        d.querySelector(".ll-dot-ring").style.opacity = i === si ? "" : 0;
      });
    },
    pen(si, p) {
      if (si == null) return pen.setAttribute("visibility", "hidden");
      const pt = S[si][p];
      pen.setAttribute("cx", pt[0]);
      pen.setAttribute("cy", pt[1]);
      pen.setAttribute("visibility", p === 0 ? "hidden" : "visible");
    },
    allDone() {
      ink.forEach((p) => p.setAttribute("stroke", "#22a05a"));
      api.dots(S.length);
      api.pen(null);
    },
    toLetter(cx, cy) {
      const svgEl = g.ownerSVGElement;
      const pt = svgEl.createSVGPoint();
      pt.x = cx;
      pt.y = cy;
      const q = pt.matrixTransform(g.getScreenCTM().inverse());
      return [q.x, q.y];
    },
  };

}
// Slide a pen along a whole stroke list, one stroke after another (used by See it and the Show me button).
async function penDemo(art, { from = 0, fromPoint = 0, alive, gap = 380, speed = 150 }) {
  for (let si = from; si < art.S.length; si++) {
    const pts = art.S[si];
    art.dots(si);
    const start = si === from ? fromPoint : 0;
    const lens = [0];
    for (let i = 1; i < pts.length; i++) lens.push(lens[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const from0 = lens[start];
    const total = lens[lens.length - 1] - from0;
    const dur = Math.max(450, (total / speed) * 1000);
    art.pen(si, start);
    await wait(180);
    const t0 = performance.now();
    let idx = start;
    while (true) {
      if (!alive()) return false;
      const t = Math.min(1, (performance.now() - t0) / dur);
      const target = from0 + total * t;
      while (idx < pts.length - 1 && lens[idx + 1] <= target) idx++;
      art.setInk(si, idx);
      art.pen(si, idx);
      if (t >= 1) break;
      await new Promise((r) => requestAnimationFrame(r));
    }
    await wait(gap);
  }
  return alive();
}

function wrap(str, n) {
  const lines = [];
  for (const word of str.split(" ")) {
    const last = lines[lines.length - 1];
    if (last && (last + " " + word).length <= n) lines[lines.length - 1] = last + " " + word;
    else lines.push(word);
  }
  return lines;
}
function finishCard({ id, icon, message, speech, again, nextId }) {
  const my = token;
  const { W, H } = dims();
  stage.innerHTML = "";
  const v = makeSvg(`0 0 ${W} ${H}`, stage);
  roundRect(v, { x: 20, y: 20, w: W - 40, h: H - 40 }, { fill: "#fffaf0", stroke: "var(--accent)", "stroke-width": 5 });
  const avail = H - 40;
  const heading = Math.min(34, W * 0.05);
  const circle = Math.max(34, Math.min(78, avail * 0.15));
  let size = 38;
  let lines = [];
  for (; size >= 20; size -= 2) {
    lines = wrap(message, Math.floor((W - 110) / (size * 0.52)));
    if (circle * 2 + heading * 1.8 + lines.length * size * 1.35 + 50 <= avail) break;
  }
  const blockH = circle * 2 + 20 + heading * 1.6 + lines.length * size * 1.35;
  const top = H / 2 - blockH / 2;
  el("circle", { cx: W / 2, cy: top + circle, r: circle, fill: "var(--accent-soft)" }, v);
  emoji(v, W / 2, top + circle - 4, icon, circle * 1.25);
  const ty = top + circle * 2 + 20 + heading;
  text(v, W / 2, ty, "Try it for real, with a grown-up", { "font-size": heading, fill: "var(--accent-dark)", "font-weight": 900, "font-family": FONT });
  lines.forEach((ln, i) => text(v, W / 2, ty + 14 + (i + 1) * size * 1.3, ln, { "font-size": size, fill: "#2b1d12", "font-weight": 700, "font-family": FONT }));
  confetti();

  const host = panel(`<div class="ap-buttons"><button type="button" data-again>🔁 Play again</button>${nextId ? '<button type="button" class="primary" data-next>▶ Next game</button>' : ""}</div>`);
  talkAsync(speech).then(() => {});
  host.onclick = (event) => {
    if (my !== token) return;
    if (event.target.closest("[data-again]")) {

function slots(W, H, n) {
  const wide = W > 700;
  const gap = 14;
  if (wide) {
    const px = 16;
    const pw = Math.round(W * 0.29);
    const ax = px + pw + 18;
    const cw = (W - 16 - ax - gap * (n - 1)) / n;
    return { prompt: { x: px, y: 16, w: pw, h: H - 32 }, cards: Array.from({ length: n }, (_, i) => ({ x: ax + i * (cw + gap), y: 16, w: cw, h: H - 32 })) };
  }
  const ph = Math.round(H * 0.37);
  const cy = 16 + ph + 14;
  const cw = (W - 32 - gap * (n - 1)) / n;
  return { prompt: { x: 16, y: 16, w: W - 32, h: ph }, cards: Array.from({ length: n }, (_, i) => ({ x: 16 + i * (cw + gap), y: cy, w: cw, h: H - cy - 16 })) };
}

  if (showWord || c.state === "good") caption(g, r.x + r.w / 2, r.y + r.h - Math.max(22, r.h * 0.1), c.w, fitSize(c.w, r.w - 24, 40), hiIndex(c.w, mode));

}

function runChoice(cfg) {
  const my = token;
  const ROUNDS = 8;
  let round = 0;
  let q = null;
  let open = false;
  let tries = 0;
  const host = panel(`<p class="ap-dots" data-dots></p><div class="ap-buttons"><button type="button" class="primary" data-again>🔊 Hear it again</button>${letterChip()}</div>`);
  const dots = () => ($("[data-dots]").textContent = "●".repeat(round) + "○".repeat(ROUNDS - round));
  function draw() {
    if (!q || my !== token) return;
    const { W, H } = dims();
    stage.innerHTML = "";
    const v = makeSvg(`0 0 ${W} ${H}`, stage);
    const L = slots(W, H, q.choices.length);
    const pg = el("g", {}, v);
    cfg.drawPrompt(pg, L.prompt, q, { W, H });
    q.choices.forEach((c, i) => drawCard(v, L.cards[i], c, i, !cfg.hideWords || c.state === "good", q.mode));
  }
  async function ask() {
    if (my !== token) return;
    q = cfg.gen(round);
    tries = 0;
    open = true;
    dots();
    draw();
    await talkAsync(cfg.ask(q, round));
  }
  async function next() {
    if (my !== token) return;
    if (round >= ROUNDS) return finish();
    await wait(450);
    ask();
  }
  function finish() {
    if (my !== token) return;
    q = null;
    finishCard({ id: cfg.id, icon: cfg.realIcon, message: cfg.real(), speech: `${cfg.end} ${cfg.real()}`, again: () => shell.go(cfg.id), nextId: NEXT[cfg.id] });
  }
  async function choose(i) {
    const c = q.choices[i];
    if (!open || c.state) return;
    open = false;
    window.OC?.touch();
    if (c.ok) {
      c.state = "good";
      MUSIC.chime();
      round += 1;
      window.OC?.count(cfg.count);
      dots();
      draw();
      cfg.after?.(q, c, tries, my);
      await talkAsync(cfg.praise(q, c));
      next();
    } else {
      tries += 1;
      c.state = "bad";
      MUSIC.oops();
      draw();
      if (tries >= 2) {
        const right = q.choices.find((x) => x.ok);
        right.state = "good";
        round += 1;
        window.OC?.count(cfg.count);
        dots();
        draw();
        await talkAsync(cfg.reveal(q, c));
        next();
      } else {
        await talkAsync(cfg.hint(q, c));
        if (my === token) open = true;
      }
    }
  }
  stage.onpointerdown = (event) => {
    const g = event.target.closest?.(".ll-card");
    if (!g || my !== token || !q) return;
    choose(Number(g.dataset.i));
  };
  cleanups.push(() => (stage.onpointerdown = null));
  wireChip(host, (event) => {
    if (event.target.closest("[data-again]") && q) talk(cfg.ask(q, round));
  });
  watchSize(draw);
  ask();
}

        await help();

      art.pen(si, p);

    }

      if (!alive()) return;
      si = 0;
      p = 0;
      helps = 0;
      busy = true;

      const l = cur();
      const g = ++demoGen;
      const ok = () => alive() && g === demoGen;
      const done = await talkAsync(round === 0 ? `Let's write the letter {${l}}. Watch first. Start at the number one.` : `Now the letter {${l}}. Watch first.`);
      if (!ok()) {

        busy = false;
        return;
      }

      down = true;
      if (si < art.S.length) {
        for (let k = si; k < art.S.length; k++) art.setInk(k, k === si ? p : -1);
        art.pen(si, p);
      }
      track(event);
    }
    function onMove(event) {
      if (!down || busy || !art) return;
      const list = event.getCoalescedEvents ? event.getCoalescedEvents() : [event];
      for (const e of list.length ? list : [event]) track(e);
    }
    function onUp() {
      down = false;
      armIdle();
    }
    function track(e) {
      if (si >= art.S.length) return;
      const pt = art.toLetter(e.clientX, e.clientY);
      const best = advance(pt);
      if (best > p) {
        p = best;
        art.setInk(si, p);
        art.pen(si, p);
        armIdle();
        if (p >= art.S[si].length - 1 - (art.S[si].length > 12 ? 2 : 0)) strokeDone();
      } else if (best < 0) {
        const now = performance.now();
        if (now - lastHint > 9000) {
          lastHint = now;
          talk(p === 0 ? "Start at the number one." : "Come back to the glowing dot.");
        }
      }
    }
    async function strokeDone() {
      const k = si;
      art.setInk(k, art.S[k].length - 1);
      MUSIC.play("xylophone", 72 + k * 2, { gain: 0.6 });
      si += 1;
      p = 0;
      if (si < art.S.length) {
        art.dots(si);
        art.pen(si, 0);
        return;
      }
      await letterDone();
    }
    async function letterDone() {
      busy = true;
      clearTimeout(idle);
      stopDemo();
      art.allDone();
      MUSIC.chime();
      round += 1;
      window.OC?.count("letters traced");
      dots();
      const l = letters[round - 1];
      const w = exampleWords(l, 2);
      const line = l === "x" ? `{x} is at the end of box.` : `{${l}} is the first letter of ${w[0]} and ${w[1]}.`;
      await talkAsync(`Well traced. That is the letter {${l}}. ${line}`);
      if (!alive()) return;
      if (round >= ROUNDS) {
        over = true;
        return finishCard({
          id: "u3",
          icon: "✍️",
          message: "Draw a letter big in the air with your pointer finger. Then draw it in a tray of dry salt or sand.",
          speech: "That is five letters traced. You followed each path with care. Draw a letter big in the air with your pointer finger. Then draw it in a tray of dry salt or sand, with a grown-up.",
          again: () => shell.go("u3"),
          nextId: NEXT.u3,
        });
      }
      await wait(500);
      startLetter();
    }
    host.onclick = (event) => {
      if (!alive()) return;
      if (event.target.closest("[data-letter]")) {
        VOICE.hush();
        return shell.go("pick");
      }
      if (event.target.closest("[data-show]") && art && !busy) {
        helps = 0;
        si = 0;
        p = 0;
        for (let k = 0; k < art.S.length; k++) art.setInk(k, -1);
        (async () => {
          const g = ++demoGen;
          const ok = () => alive() && g === demoGen;
          await talkAsync("Watch. Start at the number one.");
          if (!ok()) return;
          await penDemo(art, { alive: ok });
          if (!ok()) return;
          for (let k = 0; k < art.S.length; k++) art.setInk(k, -1);
          art.dots(0);
          art.pen(0, 0);
          talk("Now you try.");
          armIdle();
        })();
      }
      if (event.target.closest("[data-redo]") && art && !busy) {
        stopDemo();
        si = 0;
        p = 0;
        for (let k = 0; k < art.S.length; k++) art.setInk(k, -1);
        art.dots(0);
        art.pen(0, 0);
        talk("Start at the number one.");
      }
    };
    watchSize(build);
    plan();
    startLetter();
  },

  // ---------- 4. Rhyme time ----------
  u4() {
    runChoice({
      id: "u4",
      count: "rhymes found",
      gen: (round) => genRhyme(round < 3 ? 2 : 3),
      drawPrompt: drawWordPrompt,
      ask: (q, round) => `${round === 0 ? "Words that rhyme sound the same at the end. " : ""}${cap(q.target.w)}. Which one rhymes with ${q.target.w}: ${listOf(q.choices.map((c) => c.w))}?`,
      praise: (q, c) => `Yes. ${cap(q.target.w)} and ${c.w} rhyme. They sound the same at the end.`,
      hint: (q, c) => `Not quite. ${cap(q.target.w)}, ${c.w}. They do not sound the same at the end. Mistakes are how we learn. Try another.`,
      reveal: (q) => {
        const right = q.choices.find((x) => x.ok);
        return `Let's look. ${cap(q.target.w)}, ${right.w}. They sound the same at the end. They rhyme.`;
      },
      end: "That is eight rhymes. You listened closely to the ends of words.",
      realIcon: "🎵",
      real: () => "Say a word, and take turns finding a word that rhymes with it. Made-up words count too, if they sound the same at the end.",
    });
  },

  // ---------- 5. Blend it ----------
  u5() {
    runChoice({
      id: "u5",
      count: "words blended",
      gen: (round) => genBlend(week, round < 3 ? 2 : 3),
      drawPrompt: drawBlendPrompt,
      hideWords: true,
      ask: (q) => `Listen. ${cap(q.model.w)}, without the {${q.model.w[0]}}, says: ${q.rime}. Put the letter {${q.onset}} in front of ${q.rime}: ${q.target.w}. Which picture is ${q.target.w}?`,
      praise: (q) => `Yes. The letter {${q.onset}} in front of ${q.rime} makes ${q.target.w}.`,
      hint: (q, c) => `Not quite. ${cap(c.w)} is a different word. Mistakes are how we learn. Listen again: ${q.rime}, ${q.target.w}. Try another.`,
      reveal: (q) => `Let's look. ${cap(q.rime)}, ${q.target.w}. This picture is ${q.target.w}.`,
      end: "That is eight words built from smaller words. You listened closely.",
      realIcon: "🧩",
      real: () => "Write two cards: one with a first letter and one with a word ending like at. Slide them together and read the new word. Change the first letter to make another word.",
    });
  },
};
