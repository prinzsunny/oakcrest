const INK = "#2b1d12";

// ---------- A game: rounds, level chips, first-try count, Explain it, Try it for real ----------
const levelRow = (cur, list) => `<div class="ap-row"><div class="ap-chips" data-levels>${list.map(([k, l]) => `<button type="button" data-lv="${k}" aria-pressed="${k === cur}">${l}</button>`).join("")}</div><p class="ap-status" data-status></p></div>`;
const again = (id) => {
  token += 1;
  VOICE.hush();
  units[id]();
};
function game(id, cfg) {
  const my = token;
  const levels = cfg.levels;
  const saved = shell.progress()[id]?.level;
  const st = { id, my, level: levels.some(([k]) => k === saved) ? saved : levels[0][0], round: 0, first: 0, tries: 0, busy: false, gen: 0 };
  const R = () => (typeof cfg.rounds === "function" ? cfg.rounds(st) : cfg.rounds);
  st.alive = () => st.my === token;
  const bindLevels = () =>
    $("[data-levels]").addEventListener("click", (event) => {
      const b = event.target.closest("[data-lv]");
      if (!b || !st.alive()) return;
      token += 1;
      st.my = token;
      VOICE.hush();
      st.level = b.dataset.lv;
      document.querySelectorAll("[data-lv]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      shell.mark(id, { level: st.level });
      window.OC?.touch();
      restart();
    });
  const build = () => {
    panel(`${levelRow(st.level, levels)}<div class="ap-buttons sp-acts" data-acts></div>`);
    bindLevels();
  };
  build();
  st.acts = (html, handlers = {}) => {
    const box = $("[data-acts]");
    if (!box) return;
    box.className = "ap-buttons sp-acts";
    box.innerHTML = html;
    box.onclick = (e) => {
      const b = e.target.closest("[data-a]");
      if (b && !b.disabled && st.alive()) {
        window.OC?.touch();
        handlers[b.dataset.a]?.(b);
      }
    };
  };
  // Choice buttons. After two wrong tries the right one is marked, with the reason.
  st.choose = (options, right, { hint, why, onWin } = {}) => {
    const handlers = {};
    options.forEach((o, i) => {
      handlers[`c${i}`] = (b) => {
        if (st.busy) return;
        if (i === right) {
          b.classList.add("right");
          onWin?.();
          return st.win(`Correct. ${why}`);
        }
        if (b.classList.contains("wrong")) return;
        b.classList.add("wrong");
        const tries = st.oops();
        if (tries === 1) talk(`Not quite. ${typeof hint === "function" ? hint(o) : hint}`);
        else {
          $(`[data-a="c${right}"]`)?.classList.add("sp-pulse");
          talk(`The answer is marked. ${why} Select it to continue.`);
        }
      };
    });
    st.acts(options.map((o, i) => `<button type="button" data-a="c${i}">${esc(o)}</button>`).join(""), handlers);
  };
  st.status = (s) => {
    const b = $("[data-status]");
    if (b) b.textContent = s ?? `${cfg.label || "Round"} ${Math.min(st.round + 1, R())} of ${R()}`;
  };
  st.take = (key, list) => {
    st.decks ||= {};
    const k = `${key}:${st.level}`;
    if (!st.decks[k]?.length) st.decks[k] = shuffle(list);
    return st.decks[k].pop();
  };
  st.next = () => {
    if (!st.alive()) return;
    st.tries = 0;
    st.busy = false;
    st.status();
    cfg.ask(st);
  };
  st.win = async (html, speech, { chime = true, ms = 900 } = {}) => {
    st.busy = true;
    const gen = st.gen;
    const live = () => st.alive() && st.gen === gen;
    if (chime) MUSIC.chime();
    if (st.tries === 0) st.first += 1;
    st.round += 1;
    window.OC?.count(cfg.count);
    window.OC?.touch();
    cfg.onRound?.(st);
    await talkAsync(html, speech);
    if (!live()) return;
    await wait(ms);
    if (!live()) return;
    if (st.round >= R()) finish();
    else st.next();
  };
  st.oops = () => {
    MUSIC.oops();
    st.tries += 1;
    return st.tries;
  };
  const finish = () => {
    confetti();
    shell.mark(id, { done: true });
    cfg.onFinish?.(st);
    const prompt = typeof cfg.explain === "string" ? cfg.explain : cfg.explain[st.level] || Object.values(cfg.explain)[0];
    explainCard(prompt);
    st.done = true;
    panel(`${levelRow(st.level, levels)}<div class="ap-buttons"><button type="button" class="primary" data-real>🏠 Try it for real</button><button type="button" data-again>🔁 Again</button></div>`);

      `Session complete: ${st.first} of ${R()} correct on the first attempt. Now explain it; the task is on the card.`,

      build();

    st.first = 0;

}

// ---------- Spelling comparison: align an attempt with the target ----------
function align(a, b) {

      ops.unshift({ op: a[i - 1] === b[j - 1] ? "=" : "s", a: a[i - 1], b: b[j - 1] });

      j--;

      i--;
    } else {
      ops.unshift({ op: "m", b: b[j - 1] });
      j--;
    }
  }
  return ops;
}
// Words for the first problem, without giving the answer away.
function describe(ops) {
  const parts = [];
  if (ops.some((o) => o.op === "s")) parts.push("underlined: wrong letter");
  if (ops.some((o) => o.op === "m")) parts.push("_ : missing letter");
  if (ops.some((o) => o.op === "x")) parts.push("struck through: extra letter");
  return parts.join("   ·   ");
}
// Draw an attempt with its problems marked, centred at (x, y).
function markedWord(parent, x, y, ops, { size = 64 } = {}) {
  const t = text(parent, x, y, "", { "font-size": size, "font-family": SERIF, "font-weight": 600, fill: INK, "letter-spacing": 2 });
  for (const o of ops) {
    const span = el("tspan", {}, t);
    if (o.op === "=") span.textContent = o.a;
    else if (o.op === "s") {
      span.textContent = o.a;
      span.setAttribute("fill", ERR);
      span.setAttribute("text-decoration", "underline");
    } else if (o.op === "m") {
      span.textContent = "_";
      span.setAttribute("fill", ERR);
    } else {
      span.textContent = o.a;
      span.setAttribute("fill", ERR);
      span.setAttribute("text-decoration", "line-through");
    }
  }
  fit(t, 880, 30);
  return t;
}

// ---------- On-screen keyboard (big keys; a physical keyboard works too) ----------
function keyboard(host, { onKey, extra = "" }) {
  const rows = ["qwertyuiop", "asdfghjkl", "zxcvbnm'-"];
  // On small screens the Check and Hear keys move into rows 2 and 3, saving a whole row.
  const hasHear = extra.includes('data-k="hear"');
  host.innerHTML = `<div class="sp-kb" role="group" aria-label="Keyboard">${rows
    .map(
      (r, i) =>
        `<div class="sp-kr">${[...r].map((k) => `<button type="button" data-k="${k}" aria-label="${k === "'" ? "apostrophe" : k === "-" ? "hyphen" : k}">${k}</button>`).join("")}${i === 1 ? `<button type="button" data-k="✓" class="sp-ok sp-mini sp-wide" aria-label="Check">✓</button>` : ""}${i === 2 ? `<button type="button" data-k="⌫" class="sp-wide" aria-label="Delete">⌫</button>${hasHear ? `<button type="button" data-k="hear" class="sp-mini" aria-label="Hear again">🔊</button>` : ""}` : ""}</div>`
    )
    .join("")}<div class="sp-kr sp-kr-last">${extra}<button type="button" data-k="✓" class="sp-ok">✓ Check</button></div></div>`;
  host.onclick = (event) => {
    const k = event.target.closest("[data-k]");
    if (k) onKey(k.dataset.k);
  };
  const onDown = (event) => {
    if (!host.isConnected || !host.querySelector(".sp-kb")) return removeEventListener("keydown", onDown);
    if (event.metaKey || event.ctrlKey || event.altKey || event.target.closest?.("input, select, textarea")) return;
    if (/^[a-zA-Z'-]$/.test(event.key)) onKey(event.key.toLowerCase());
    else if (event.key === "Backspace") onKey("⌫");
    else if (event.key === "Enter") {
      event.preventDefault();
      onKey("✓");
    } else return;
    event.preventDefault();
  };
  if (window.__spKeys) removeEventListener("keydown", window.__spKeys);
  window.__spKeys = onDown;
  addEventListener("keydown", onDown);
}

// A typed answer: the learner types, checks, sees the wrong part marked, then a hint; after two tries the
// spelling is revealed with the reason and typed once more.
function typeRound(st, { answers, scene, hint, why, speak, extra = "", onExtra, britishOk, onResult }) {
  let value = "";
  let phase = "try";
  let lastOps = null;
  const target = answers[0];
  const slotY = scene.slotY ?? 400;
  const box = el("g", {}, view);
  const draw = () => {
    box.innerHTML = "";
    el("rect", { x: 140, y: slotY - 66, width: 720, height: 96, rx: 22, fill: "#fff", stroke: phase === "copy" ? OK : "var(--accent)", "stroke-width": 4 }, box);
    if (value) {
      const t = text(box, 500, slotY, value, { "font-size": 60, "font-family": SERIF, "font-weight": 600, fill: INK, "letter-spacing": 2 });
      fit(t, 680, 30);
      const w = Math.min(680, t.getComputedTextLength?.() || 0);
      el("rect", { x: 500 + w / 2 + 6, y: slotY - 50, width: 4, height: 60, fill: "var(--accent)", class: "sp-caret" }, box);
    } else text(box, 500, slotY - 4, phase === "copy" ? "Type it once more" : "Type the word", { "font-size": 30, fill: "#b9a991", "font-weight": 700 });
  };
  const marks = el("g", {}, view);
  draw();
  const check = () => {
    const v = value.trim();
    if (!v || st.busy) return;
    if (answers.includes(v) || (britishOk && britishOk === v)) {
      marks.innerHTML = "";
      const note = britishOk === v ? ` (That is the British spelling, correct in Britain; this list uses American spelling: ${target}.)` : answers.length > 1 && v !== target ? ` (${v} is also accepted.)` : "";
      onResult?.(st.tries === 0 && phase === "try", v);
      // After a reveal the reason has just been shown, so the copy-phase win stays short (it must fit small screens).
      return st.win(phase === "copy" ? `Correct, and now typed from the model.${note}` : `Correct. ${why}${note}`);
    }
    const ops = align(v, target);
    lastOps = ops;
    const tries = phase === "copy" ? 2 : st.oops();
    marks.innerHTML = "";
    if (tries === 1) {
      text(marks, 500, slotY + 66, "Your attempt, marked:", { "font-size": 22, fill: SOFT, "font-weight": 700 });
      markedWord(marks, 500, slotY + 122, ops, { size: 50 });
      text(marks, 500, slotY + 156, describe(ops), { "font-size": 20, fill: ERR, "font-weight": 700 });
      talk(`Not quite. The orange marks show what to fix. ${hint ? `Consider: ${hint}` : ""}`);
      value = "";
      draw();
    } else {
      phase = "copy";
      const correct = text(marks, 500, slotY + 122, "", { "font-size": 54, "font-family": SERIF, "font-weight": 600, fill: INK, "letter-spacing": 2 });
      // The correct spelling, with the letters the attempt got wrong underlined.
      for (const o of ops) {
        if (o.op === "x") continue;
        const span = el("tspan", {}, correct);
        span.textContent = o.b;
        if (o.op !== "=") Object.entries({ fill: OK, "font-weight": 800, "text-decoration": "underline" }).forEach(([k, v2]) => span.setAttribute(k, v2));
      }
      fit(correct, 880, 30);
      text(marks, 500, slotY + 66, "The correct spelling; the part to learn is underlined:", { "font-size": 22, fill: SOFT, "font-weight": 700 });
      // The slot itself says "Type it once more", so the bubble keeps to the spelling and its reason (it must fit small screens).
      talk(`Here is the spelling: ${target}. ${why}`, `Here is the spelling. ${[...target].join(" ")}. ${why} Type it once more.`);
      value = "";
      draw();
    }
  };
  keyboard($("[data-acts]"), {
    extra: `${speak ? `<button type="button" data-k="hear" class="sp-hear">🔊 Hear</button>` : ""}${extra}`,
    onKey(k) {
      if (!st.alive() || st.busy) return;
      window.OC?.touch();
      if (k === "hear") return speak?.();
      if (k === "✓") return check();
      if (k === "⌫") value = value.slice(0, -1);
      else if (k.length === 1 && value.length < 24) value += k;
      else onExtra?.(k);
      draw();
    },
  });
  $("[data-acts]").className = "sp-acts sp-kbhost";
  return { ops: () => lastOps };
}

// ---------- See it pictures ----------
const tween = (ms, fn, alive) =>
  new Promise((resolve) => {
    if (KIT.still.matches) {
      fn(1);
      return resolve(true);
    }
    const t0 = performance.now();
    const frame = (now) => {
      if (!alive()) return resolve(false);
      const t = Math.min(1, (now - t0) / ms);
      fn(t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
      if (t < 1) requestAnimationFrame(frame);
      else resolve(true);
    };
    requestAnimationFrame(frame);
  });
function banner(v, x, y, label, { size = 30, fill = "var(--accent-dark)" } = {}) {
  return text(v, x, y, label, { "font-size": size, fill, "font-weight": 800 });
}
// A word drawn letter by letter so single letters can be coloured.
function lettered(v, x, y, word, { size = 56, mark = [], color = ERR, family = SERIF, fill = INK } = {}) {
  const t = text(v, x, y, "", { "font-size": size, "font-family": family, "font-weight": 600, fill });
  [...word].forEach((ch, i) => {
    const s = el("tspan", mark.includes(i) ? { fill: color, "font-weight": 800 } : {}, t);
    s.textContent = ch;
  });
  return t;
}
// Rows of "then → now" that fade in one by one.
async function changeRows(v, api, rows, { y0 = 150, gap = 92, left = 300, right = 700, size = 52, headL, headR } = {}) {
  if (headL) text(v, left, y0 - 70, headL, { "font-size": 24, fill: SOFT, "font-weight": 800 });
  if (headR) text(v, right, y0 - 70, headR, { "font-size": 24, fill: SOFT, "font-weight": 800 });
  for (let i = 0; i < rows.length; i++) {
    const [a, b, markA = [], markB = [], note] = rows[i];
    const g = el("g", { opacity: 0 }, v);
    const y = y0 + i * gap;
    const ta = lettered(g, left, y, a, { size, mark: markA, color: "#1e6fb8" });
    const tb = lettered(g, right, y, b, { size, mark: markB });
    let wa = 200;
    let wb = 200;
    try {
      wa = ta.getComputedTextLength();
      wb = tb.getComputedTextLength();
    } catch {}
    const x1 = left + wa / 2 + 24;
    const x2 = right - wb / 2 - 24;
    el("path", { d: `M${x1} ${y - 16}H${x2 - 8}`, stroke: "var(--accent)", "stroke-width": 5, "stroke-linecap": "round" }, g);
    el("path", { d: `M${x2 - 14} ${y - 28}L${x2 + 6} ${y - 16}L${x2 - 14} ${y - 4}Z`, fill: "var(--accent)" }, g);
    if (note) text(g, 500, y + 32, note, { "font-size": 22, fill: SOFT, "font-weight": 700 });
    await api.tween(450, (t) => g.setAttribute("opacity", t));
    MUSIC.play("harp", [67, 71, 74, 79, 83][i % 5], { gain: 0.25 });
    await api.wait(700);
  }
}

}

                s.textContent = p + (i < parts.length - 1 ? "·" : "");
              });
              fit(t, 900);
              para(view, 500, 380, note, { size: 28, fill: INK, maxW: 860, maxLines: 3 });
            },
          });
        } else if (kind === "meaning") {
          const [gap, letter, wrong, rel, note] = item;
          text(view, 500, 80, "Which letter fills the gap?", { "font-size": 32, fill: SOFT, "font-weight": 800 });
          const t = text(view, 500, 250, "", { "font-size": 96, "font-family": SERIF, fill: INK, "font-weight": 600 });
          [...gap].forEach((ch) => {
            const s = el("tspan", ch === "_" ? { fill: ERR } : {}, t);
            s.textContent = ch === "_" ? "▢" : ch;
          });
          const opts = shuffle([letter, ...wrong]);
          talk(`Which letter completes the word? The sound will not tell you. Think of a related word in which the letter is spoken.`);
          st.choose(opts, opts.indexOf(letter), {
            hint: `Find a related word from the same family in which this letter is spoken clearly, often because it is stressed. Say it aloud and listen to the gap.`,
            why: `${note}`,
            onWin: () => {
              t.innerHTML = "";
              [...gap].forEach((ch) => {
                const s = el("tspan", ch === "_" ? { fill: OK, "font-weight": 800 } : {}, t);
                s.textContent = ch === "_" ? letter : ch;
              });
              text(view, 500, 360, `related word: ${rel}`, { "font-size": 40, "font-family": SERIF, fill: "#1e6fb8" });
            },
          });
        } else {
          const [a, b, word, wrong, note] = item;
          text(view, 500, 80, "Join the parts. Keep every letter of each.", { "font-size": 32, fill: SOFT, "font-weight": 800 });
          text(view, 500, 230, `${a}  +  ${b}`, { "font-size": 84, "font-family": SERIF, fill: INK, "font-weight": 600 });
          const opts = shuffle([word, ...wrong]);
          talk(`Join <b>${a}</b> and <b>${b}</b>. Which spelling is correct?`);
          st.choose(opts, opts.indexOf(word), {
            hint: "When a prefix meets a root, neither part loses a letter. Count the letters where they meet.",
            why: note,
            onWin: () => {
              const t = text(view, 500, 360, "", { "font-size": 72, "font-family": SERIF, "font-weight": 600 });
              const s1 = el("tspan", { fill: "#1e6fb8" }, t);
              s1.textContent = a;
              const s2 = el("tspan", { fill: INK }, t);
              s2.textContent = b;
            },
          });
        }
      },
    });
  },

  // ---------- 2. Suffix rules (typed) ----------

    const groups = { dbl: SUFFIX.filter((r) => r[3][0] === "d"), e: SUFFIX.filter((r) => r[3][0] === "e"), y: SUFFIX.filter((r) => r[3][0] === "y") };
    const QUESTION = {
      d: "Does the suffix begin with a vowel, and is the last syllable stressed?",
      e: "Is the final e silent, and does the suffix begin with a vowel?",
      y: "Is the letter before the y a vowel or a consonant?",
    };
    game("s2", {
      levels: [["dbl", "Doubling"], ["e", "Silent e"], ["y", "Final y"], ["mix", "Mixed"]],
      rounds: 10,
      count: "suffix words",
      explain: {
        dbl: "Explain why beginning has two n's but visiting has one t. Use the word stress.",
        e: "Explain the silent e rule, and why noticeable keeps its e although -able begins with a vowel.",
        y: "Explain when y changes to i, and why carrying keeps its y.",
        mix: "Choose one spelling rule. State it precisely, give an example, and give one true exception.",
      },
      real: { icon: "🔍", title: "Suffix hunt in a real book", need: ["the book you are reading", "paper", "pencil"], steps: ["Find five words ending in -ing, -ed or -er.", "Write each as base + suffix, for example stop + ed.", "Name the rule each one follows: double, drop e, or y to i.", "Find one word that breaks a rule, and say why."] },
      ask(st) {
        const g = st.level === "mix" ? ["dbl", "e", "y"][st.round % 3] : st.level;
        const [base, suf, answers, rule, note] = st.take(g, groups[g]);

        const t = text(view, 500, 170, "", { "font-size": 84, "font-family": SERIF, "font-weight": 600, fill: INK });
        const a = el("tspan", {}, t);
        a.textContent = base;
        const p = el("tspan", { fill: SOFT }, t);
        p.textContent = "  +  ";
        const b = el("tspan", { fill: "#1e6fb8" }, t);
        b.textContent = `-${suf}`;
        const ruleBox = el("g", { opacity: 0 }, view);
        typeRound(st, {
          answers,

          },

        talk(`Add <b>-${suf}</b> to <b>${base}</b>.`, `Add ${suf} to ${base}. Spell the new word.`);
      },
    });
  },

  // ---------- 4. Homophones ----------
  s4() {
    const ADV = new Set(["principal", "stationary", "complement", "course", "council", "heal", "reign", "role", "site", "sole", "mourning", "idle", "aisle", "alter", "capital", "chord", "duel", "hoarse", "vain", "miner", "naval", "prey", "pier", "bury", "passed"]);
    const banks = { c: HOMO.filter((h) => !ADV.has(h[2])), a: HOMO.filter((h) => ADV.has(h[2])) };
    banks.mix = HOMO;
    game("s4", {
      levels: [["c", "Common"], ["a", "Advanced"], ["mix", "Mixed"]],
      rounds: 10,
      count: "homophones",
      explain: {
        c: "Explain the difference between its and it's, and give a test you can use while writing.",
        a: "Explain the difference between principal and principle, with a memory aid you have checked is accurate.",
        mix: "Homophones sound the same but differ in meaning and spelling. Explain how a reader knows which one is meant.",
      },
      real: { icon: "👂", title: "Homophone pairs aloud", need: ["paper", "pencil", "a grown-up"], steps: ["Write one sentence for each word in three homophone pairs.", "Read each sentence aloud to a grown-up.", "The grown-up names which spelling you used.", "Talk about why sound alone cannot decide."] },
      ask(st) {
        const [sentence, answer, key] = st.take("h", banks[st.level]);

        talk(`Choose the word that fits: ${sentence.replace("___", "<b>blank</b>")}`, `Choose the word that fits. ${sentence.replace("___", "blank")}`);
        st.choose(opts, opts.indexOf(answer), {

            set.forEach(([w, g], i) => {
              const y = 400 + i * 46;

            });

  // ---------- 5. Dictation with spaced repetition ----------
  s5() {
    // Leitner boxes: a miss goes to box 0 (back next session); each first-try success moves the word up one box.
    const GAPS = [1, 2, 4, 8, 16, 32];
    let srs = {};
    let sess = 0;
    let queue = [];
    game("s5", {
      levels: [["g3", "🐣 Grade 3"], ["g45", "🦊 Grade 4–5"], ["g67", "🦁 Grade 6–7"], ["tricky", "Tricky words"]],
      rounds: 10,
      label: "Word",
      count: "dictation words",
      explain: "Choose one word you misspelled today. Explain which part was difficult and the rule, history or meaning that settles it.",
      real: { icon: "✍️", title: "Dictation at the table", need: ["lined paper", "pencil", "a grown-up", "today's word list"], steps: ["The grown-up reads five words from today, each in a sentence.", "Write each word in cursive.", "Check each one against the list together.", "For each error, write the word again and say the rule aloud."] },
      onStart(st) {
        const saved = shell.progress().s5 || {};
        srs = { ...(saved.srs || {}) };
        sess = (saved.sess || 0) + 1;
        shell.mark("s5", { sess });
        const list = LEVEL_WORDS[st.level];
        const due = shuffle(list.filter((w) => srs[w] && srs[w][1] <= sess)).sort((a, b) => srs[a][1] - srs[b][1] || srs[a][0] - srs[b][0]);
        const fresh = shuffle(list.filter((w) => !srs[w]));
        const later = list.filter((w) => srs[w] && srs[w][1] > sess).sort((a, b) => srs[a][1] - srs[b][1]);
        queue = [...due, ...fresh, ...later].slice(0, 10);
      },
      ask(st) {
        const word = queue[st.round % queue.length];
        const sentence = BANK[word];
        const learned = LEVEL_WORDS[st.level].filter((w) => (srs[w]?.[0] || 0) >= 3).length;
        st.status(`Word ${st.round + 1} of 10 · ${learned}/${LEVEL_WORDS[st.level].length} secure`);
        fresh();
        const tag = srs[word] ? `Review · box ${srs[word][0] + 1} of 6` : "New word";
        el("rect", { x: 400, y: 26, width: 200, height: 40, rx: 20, fill: srs[word] ? "var(--accent-soft)" : "#e3f4e7" }, view);
        text(view, 500, 54, tag, { "font-size": 20, fill: srs[word] ? "var(--accent-dark)" : "#2e7d46", "font-weight": 800 });
        const blanked = sentence.replace(new RegExp(`\\b${word}\\b`, "i"), "________");
        para(view, 500, 128, blanked, { size: 36, fill: SOFT, maxW: 880, maxLines: 2, family: SERIF, weight: 600, lineH: 46 });
        const speak = () => VOICE.speak(`${word}. ${sentence} ${word}.`);
        const tip = TIPS[word];
        typeRound(st, {
          answers: [word],
          britishOk: BRITISH[word],
          scene: { slotY: 300 },
          speak,
          // The first-try hint must not spell the word for the learner, so the word itself is masked.
          hint: tip ? `${tip.split(":")[0].split(". ")[0].replace(/\.$/, "").replace(new RegExp(word, "gi"), "___")}.` : "Say it slowly and spell it one syllable at a time.",
          why: tip || "Spell it syllable by syllable, and write it once by hand today.",
          onResult(first) {
            const box = first ? Math.min((srs[word]?.[0] ?? 0) + 1, 5) : 0;
            srs[word] = [box, sess + GAPS[box]];
            shell.mark("s5", { srs });
          },
        });
        say(`Listen to the word and the sentence, then type the word. Press <b>🔊 Hear</b> to hear it again.`, { voice: false });
        speak();
      },
    });
  },

  // ---------- 7. Cursive: See it ----------
  c0() {
    const my = token;
    // Draw a word in the model with a moving pen; returns when finished.
    const writeWord = async (v, api, word, { x = 500, base = 330, s = 1, color = INK, width = 8, speed = 420, pen = true } = {}) => {
      const m = CURSIVE.build(word);
      const g = el("g", { transform: `translate(${x - ((m.minX + m.maxX) / 2) * s} ${base}) scale(${s})` }, v);
      const dot = pen ? el("circle", { r: 9 / s, fill: "var(--accent)" }, g) : null;
      for (const st of m.strokes) {
        if (st.type === "dot") {
          el("circle", { cx: st.at[0], cy: st.at[1], r: width * 0.9, fill: color }, g);
          await api.wait(250);
          continue;
        }
        const path = el("path", { d: CURSIVE.pathD(st.segs), fill: "none", stroke: color, "stroke-width": width, "stroke-linecap": "round", "stroke-linejoin": "round" }, g);
        const len = path.getTotalLength();
        path.setAttribute("stroke-dasharray", `${len} ${len + 10}`);
        await api.tween(Math.max(500, (len / speed) * 1000), (t) => {
          path.setAttribute("stroke-dashoffset", len * (1 - t));
          if (dot) {
            const p = path.getPointAtLength(len * t);
            dot.setAttribute("cx", p.x);
            dot.setAttribute("cy", p.y);
          }
        }, (t) => t);
      }
      dot?.remove();
      return { g, m };
    };
    const guides = (v, base, s, { labels = false, x0 = 60, x1 = 940 } = {}) => {
      const lines = [[-240, "top line", "#d8c9b3", "8 8"], [-100, "midline", "#8fa7d6", "10 8"], [0, "baseline", "#c98c58", ""], [150, "descender line", "#d8c9b3", "8 8"]];
      for (const [y, name, c, dash] of lines) {
        el("line", { x1: x0, x2: x1, y1: base + y * s, y2: base + y * s, stroke: c, "stroke-width": 3, "stroke-dasharray": dash }, v);
        if (labels) text(v, x1 - 4, base + y * s - 8, name, { "font-size": 22, fill: SOFT, "text-anchor": "end", "font-weight": 800 });
      }
    };
    explain(
      [
        { say: "Why learn joined handwriting? The pen keeps moving from letter to letter, so writing becomes faster and more fluent. It also lets you read letters and historical documents written in cursive.", draw: everyday([["✍️", "Fast notes"], ["📜", "Old documents"], ["🖊️", "Your signature"], ["✉️", "Letters and cards"]]) },
        {
          say: "Four guidelines set the size. Small letters such as a fill the space from the baseline to the midline. Tall letters such as l reach the top line. Tails such as the loop of g drop to the descender line.",
          async draw(v, api) {
            const s = 1.05;
            const base = 330;
            guides(v, base, s, { labels: true, x0: 60, x1: 960 });
            await api.wait(400);
            await writeWord(v, api, "a", { x: 230, base, s });
            await writeWord(v, api, "l", { x: 430, base, s });
            await writeWord(v, api, "g", { x: 630, base, s });
          },
        },
        {
          say: "Nearly every lowercase letter is built from four basic strokes: the undercurve, the downcurve, the overcurve, and the straight slant.",
          async draw(v, api) {
            const items = [
              ["undercurve", "M0 0 C 16 0 30 -45 38 -100"],
              ["downcurve", "M60 -100 C 31 -100 18 -78 18 -50 C 18 -22 30 0 46 0"],
              ["overcurve", "M0 0 C 4 -50 14 -100 34 -100 C 46 -100 52 -92 54 -84"],
              ["slant", "M30 -100 L 30 0"],
            ];
            for (let i = 0; i < 4; i++) {
              const [name, d] = items[i];
              const x = 140 + i * 240;
              el("line", { x1: x - 90, x2: x + 90, y1: 360, y2: 360, stroke: "#c98c58", "stroke-width": 3 }, v);
              el("line", { x1: x - 90, x2: x + 90, y1: 210, y2: 210, stroke: "#8fa7d6", "stroke-width": 3, "stroke-dasharray": "10 8" }, v);
              const g = el("g", { transform: `translate(${x - 40} 360) scale(1.5)` }, v);
              const path = el("path", { d: CURSIVE.pathD(CURSIVE.shape(d)), fill: "none", stroke: INK, "stroke-width": 7, "stroke-linecap": "round" }, g);
              const len = path.getTotalLength();
              path.setAttribute("stroke-dasharray", `${len} ${len + 10}`);
              await api.tween(900, (t) => path.setAttribute("stroke-dashoffset", len * (1 - t)));
              text(v, x, 430, name, { "font-size": 30, fill: "var(--accent-dark)", "font-weight": 800 });
              MUSIC.play("harp", [67, 71, 74, 79][i], { gain: 0.25 });
              await api.wait(400);
            }
          },
        },
        {
          say: "Consistent slant makes writing beautiful and readable. In this model every downstroke leans about 12 degrees to the right, so the strokes stay parallel.",
          async draw(v, api) {
            const s = 1.1;
            guides(v, 340, s);
            await writeWord(v, api, "illumine", { base: 340, s, speed: 520 });
            const g = el("g", { opacity: 0 }, v);
            for (let i = 0; i < 9; i++) {
              const x = 150 + i * 85;
              el("line", { x1: x, y1: 400, x2: x + 0.2126 * 330, y2: 70, stroke: "var(--accent)", "stroke-width": 3, "stroke-dasharray": "6 8" }, g);
            }
            text(g, 500, 470, "parallel slant lines, about 12°", { "font-size": 28, fill: "var(--accent-dark)", "font-weight": 800 });
            await api.tween(600, (t) => g.setAttribute("opacity", t));
          },
        },
        {
          say: "Letters join in two ways. After most letters the joining stroke rises from the baseline, as in a n. After b, o, v and w the join stays high, along the midline, as in o n.",
          async draw(v, api) {
            const s = 1.05;
            guides(v, 300, s, { x0: 70, x1: 930 });
            await writeWord(v, api, "an", { x: 290, base: 300, s, speed: 260 });
            text(v, 290, 520, "baseline join", { "font-size": 30, fill: "var(--accent-dark)", "font-weight": 800 });
            await writeWord(v, api, "on", { x: 710, base: 300, s, speed: 260 });
            text(v, 710, 520, "high join (b o v w)", { "font-size": 30, fill: "var(--accent-dark)", "font-weight": 800 });
          },
        },
        {
          say: "Write the whole word first without lifting the pen. Then go back to dot each i and j and cross each t and x, from left to right.",
          async draw(v, api) {
            const s = 1.15;
            guides(v, 340, s);
            const { g, m } = await writeWord(v, api, "it", { base: 340, s, speed: 300 });
            const marks = [m.strokes[0].pts[0], m.strokes[1].at, m.strokes[2].pts[0]];
            for (let i = 0; i < 3; i++) {
              el("circle", { cx: marks[i][0] - 16, cy: marks[i][1] - 20, r: 16, fill: "var(--accent)" }, g);
              text(g, marks[i][0] - 16, marks[i][1] - 12, i + 1, { "font-size": 22, fill: "#fff" });
              await api.wait(500);
            }
          },
        },
        {
          say: "American schools have used several models: Spencerian script from the 1840s, the Palmer Method from 1894, Zaner-Bloser, and D'Nealian from 1978. This app uses one model in the Zaner-Bloser tradition. Explain it: why should every downstroke share the same slant?",
          async draw(v, api) {
            const rows = [["1840s", "Spencerian script", "Platt Rogers Spencer"], ["1894", "The Palmer Method", "Austin Palmer"], ["early 1900s", "Zaner-Bloser", "Charles Zaner and Elmer Bloser"], ["1978", "D'Nealian", "Donald Thurber"]];
            for (let i = 0; i < rows.length; i++) {
              const g = el("g", { opacity: 0 }, v);
              const y = 80 + i * 76;
              text(g, 200, y, rows[i][0], { "font-size": 28, fill: "var(--accent-dark)", "font-weight": 800, "text-anchor": "end" });
              text(g, 230, y, rows[i][1], { "font-size": 32, fill: INK, "font-weight": 800, "text-anchor": "start" });
              text(g, 600, y, rows[i][2], { "font-size": 24, fill: SOFT, "font-weight": 700, "text-anchor": "start" });
              await api.tween(400, (t) => g.setAttribute("opacity", t));
              await api.wait(300);
            }
            const g = el("g", { opacity: 0 }, v);
            el("rect", { x: 80, y: 392, width: 840, height: 130, rx: 22, fill: "#fffaf0", stroke: "var(--accent)", "stroke-width": 4 }, g);
            text(g, 500, 432, "Explain it", { "font-size": 26, fill: "var(--accent-dark)", "font-weight": 800 });
            para(g, 500, 474, "Why should every downstroke share the same slant? Give a reason a reader would notice.", { size: 28, fill: INK, maxW: 780, maxLines: 2, lineH: 34 });
            await api.tween(500, (t) => g.setAttribute("opacity", t));
          },
        },
      ],
      { alive: () => my === token, onDone: () => shell.go("c1"), title: "Joined handwriting" }
    );
  },

  // ---------- 8–10. Tracing ----------
  c1() {
    const GROUPS = { u: "itu wrspj".replace(" ", ""), l: "elhkfb", o: "adgocq", v: "nmxyvz" };
    traceGame("c1", {
      levels: [["u", "i t u w r s p j"], ["l", "e l h k f b"], ["o", "a d g o c q"], ["v", "n m x y v z"]],
      rounds: (st) => GROUPS[st.level].length,
      label: "Letter",
      count: "cursive letters",
      pick: (st) => GROUPS[st.level][st.round],
      intro: (w) => `Trace <b>${w}</b>. ${LETTER_NOTES[w]}`,
      explain: {
        u: "Explain what the letters i, t, u and w have in common, and where each one begins.",
        l: "Explain how a loop letter such as l is formed, and where the loop should cross.",
        o: "Explain how a, d, g and o begin, and why the downcurve goes to the left.",
        v: "Explain what an overcurve is, and which letters in this group begin with one.",
      },
      real: { icon: "🖋️", title: "Letters on lined paper", need: ["lined paper", "a sharp pencil"], steps: ["Sit tall with both feet flat; tilt the paper slightly.", "Write each letter of this group three times, joined: iii, ttt.", "Check the slant: draw light parallel lines through the downstrokes.", "Circle your best letter in each row and say why it is best."] },
    });
  },
  c2() {
    const BASE = ["an", "th", "ing", "ea", "ll", "ck", "ss", "er", "it", "ed", "ly", "sh", "ch", "ai", "ee", "ur"];
    const HIGH = ["on", "ou", "wh", "br", "oo", "ve", "bl", "wa", "ow", "wi", "oa", "vi", "bu", "or", "we", "ok"];
    traceGame("c2", {
      levels: [["b", "Baseline joins"], ["h", "High joins (b o v w)"], ["mix", "Mixed"]],
      rounds: 8,
      label: "Join",
      count: "cursive joins",
      pick: (st) => st.take("j", st.level === "b" ? BASE : st.level === "h" ? HIGH : [...BASE, ...HIGH]),
      intro: (w) => `Trace <b>${w}</b> in one stroke. ${/[bovw]./.test(w) ? `After ${w.match(/[bovw](?=.)/)[0]} the join stays high, along the midline.` : "The join rises from the baseline."}`,
      explain: {
        b: "Explain where a baseline join begins and ends, using a n as your example.",
        h: "Explain why the letter after o or w begins from the midline, and how that changes its shape.",
        mix: "Explain the difference between a baseline join and a high join, and name the four letters that make high joins.",
      },
      real: { icon: "🔗", title: "Joins on lined paper", need: ["lined paper", "a pencil"], steps: ["Write each join from today five times without lifting the pencil.", "Write on, an, wh and th in a row: compare the high and baseline joins.", "Check that each join meets the next letter at its starting point.", "Show a grown-up your neatest line and explain one join."] },
    });
  },
  c3() {
    const SHORT = ["the", "and", "with", "fox", "jump", "quiet", "brown", "zebra", "sky", "wave", "boat", "light", "music", "river"];
    const LONG = ["cursive", "letter", "joined", "rhythm", "history", "friend", "because", "science", "bridge", "garden", "window", "yellow", "lovely", "quickly"];
    traceGame("c3", {
      levels: [["s", "Short words"], ["l", "Longer words"], ["mix", "Mixed"]],
      rounds: 8,
      label: "Word",
      count: "cursive words",
      pick: (st) => st.take("w", st.level === "s" ? SHORT : st.level === "l" ? LONG : [...SHORT, ...LONG]),
      intro: (w) => `Trace <b>${w}</b>. Write the whole word in one stroke, then add dots and crosses.`,
      explain: "Explain why we finish the whole word before dotting the i and crossing the t.",
      real: { icon: "📝", title: "Copy a line in cursive", need: ["lined paper", "a pencil", "a favorite book"], steps: ["Choose one short sentence from your book.", "Copy it in cursive, joining every letter in each word.", "Leave a space the width of an o between words.", "Read it back to a grown-up and check each join."] },
    });
  },
};

const LETTER_NOTES = {
  a: "Undercurve up to the midline, downcurve round to the left, close at the top, slant down, undercurve out.",
  b: "Undercurve up into a tall loop, slant down, undercurve up, a small checkstroke, then out along the midline.",
  c: "Undercurve up, a small hook at the top, downcurve round to the baseline, undercurve out.",
  d: "Undercurve up, downcurve round, up to the tall stem, slant straight back down, undercurve out.",
  e: "Undercurve up into a small loop, round down to the baseline, undercurve out.",
  f: "Undercurve into a tall loop, slant down below the baseline, a lower loop on the right back to the baseline, out.",
  g: "Undercurve up, downcurve round, close, slant below the baseline, then loop left and up through the baseline.",
  h: "Undercurve into a tall loop, slant down, back up into a hump, slant down, undercurve out.",
  i: "Undercurve up, slant down, undercurve out. Dot it last.",
  j: "Undercurve up, slant below the baseline, loop left and up through the baseline. Dot it last.",
  k: "Undercurve into a tall loop, slant down, back up into a small loop at the midline, slant down, undercurve out.",
  l: "Undercurve up into a tall loop, slant down, undercurve out.",
  m: "Overcurve, slant down; overcurve, slant; overcurve, slant; undercurve out.",
  n: "Overcurve, slant down; overcurve, slant down; undercurve out.",
  o: "Undercurve up, downcurve all the way round, a small loop at the top, then out along the midline.",
  p: "Undercurve up, slant below the baseline, back up, overcurve round into the bowl, close at the baseline, out.",
  q: "Undercurve, downcurve round, close, slant below the baseline, loop up on the right to the baseline, out.",
  r: "Undercurve up just above the midline, a small step to the right, slant down, undercurve out.",
  s: "Undercurve up just above the midline, curve down and round to close at the baseline, out.",
  t: "Undercurve up to about halfway between the midline and the top line, slant straight back down, undercurve out. Cross it last.",
  u: "Undercurve, slant down; undercurve, slant down; undercurve out.",
  v: "Overcurve, slant down, undercurve up, a small checkstroke, then out along the midline.",
  w: "Undercurve, slant; undercurve, slant; undercurve, a small checkstroke, then out along the midline.",
  x: "Overcurve, slant down, undercurve out. Then cross it with a slant from the top right.",
  y: "Overcurve, slant; undercurve, slant below the baseline; loop left and up through the baseline.",
  z: "Overcurve, slant down to the left, a small loop at the baseline, then down into a loop and up through the baseline.",
};

// A tracing game: each round is one letter, join or word, stroke by stroke.
function traceGame(id, cfg) {
  game(id, {
    ...cfg,
    ask(st) {
      const word = cfg.pick(st);
      tracer(st, word, cfg.intro(word));
    },
  });
}

function tracer(st, word, intro) {
  fresh();
  // The tracing sheet takes the stage's own shape, so letters grow to fill a tall phone screen too.
  const box = stage.getBoundingClientRect();
  const ratio = box.width > 0 && box.height > 0 ? box.height / box.width : H / W;
  const vh = Math.round(Math.max(H, Math.min(1500, 1000 * ratio)));
  const vw = Math.round(Math.max(W, Math.min(2200, vh / ratio)));
  view.setAttribute("viewBox", `0 0 ${vw} ${vh}`);
  const model = CURSIVE.build(word);
  const span = model.maxX - model.minX;
  // Zoom to the strokes actually used (a small letter grows larger), keeping all four guidelines.
  const yTop = Math.min(-110, model.minY) - 45;
  const yBot = Math.max(10, model.maxY) + 45;
  const s = Math.min((vw * 0.86) / span, (vh - 16) / (yBot - yTop), 2.6);
  const base = vh / 2 - ((yTop + yBot) / 2) * s;
  const ox = vw / 2 - ((model.minX + model.maxX) / 2) * s;
  view.classList.add("sp-tr");
  for (const [y, c, dash] of [[-240, "#e2d5c1", "8 8"], [-100, "#9fb4dc", "10 8"], [0, "#c98c58", ""], [150, "#e2d5c1", "8 8"]]) el("line", { x1: 10, x2: vw - 10, y1: base + y * s, y2: base + y * s, stroke: c, "stroke-width": 3, "stroke-dasharray": dash }, view);
  const g = el("g", { transform: `translate(${ox} ${base}) scale(${s})` }, view);
  const ghost = el("g", {}, g);
  const done = el("g", {}, g);
  const marks = el("g", {}, g);
  const fb = el("g", {}, g);
  const ink = el("path", { fill: "none", stroke: "#2c56b8", "stroke-width": 7, "stroke-linecap": "round", "stroke-linejoin": "round", opacity: 0.85 }, g);
  const strokes = model.strokes;
  let cur = 0;
  let fails = 0;
  let trace = null;
  let demo = 0;
  const tolNow = () => {
    const px = g.getScreenCTM()?.a || 1;
    // About 28 screen px (roughly 5 mm on an iPad) either side of the path, but never under 14 model units
    // (14% of the x-height) on a large letter, nor over 48 units on a small phone screen.
    return Math.max(14, Math.min(48, 28 / px));
  };
  const drawGhost = () => {
    ghost.innerHTML = "";
    marks.innerHTML = "";
    const px = g.getScreenCTM()?.a || 1;
    const k = 1 / px; // model units per screen pixel
    const band = Math.max(24, 22 * k);
    strokes.forEach((stroke, i) => {
      if (i < cur) return;
      const active = i === cur;
      if (stroke.type === "dot") {
        el("circle", { cx: stroke.at[0], cy: stroke.at[1], r: band * 0.8, fill: active ? "#f3e7d3" : "#f6efe4", "data-stroke": i, "data-kind": "dot" }, ghost);
        el("circle", { cx: stroke.at[0], cy: stroke.at[1], r: 6, fill: active ? "#b8a07c" : "#d8cbb6" }, ghost);
      } else {
        const d = CURSIVE.pathD(stroke.segs);
        el("path", { d, fill: "none", stroke: active ? "#f1e3cc" : "#f6efe4", "stroke-width": band, "stroke-linecap": "round", "stroke-linejoin": "round", "data-stroke": i, "data-kind": "line" }, ghost);
        el("path", { d, fill: "none", stroke: active ? "#c2ab86" : "#e0d5c4", "stroke-width": Math.max(2.5, 2.5 * k), "stroke-linecap": "round", "stroke-linejoin": "round" }, ghost);
        if (active) {
          const pts = stroke.pts;
          const placed = [];
          const gap = Math.max(26, Math.round((70 * k) / 3));
          for (let j = 14; j < pts.length - 8; j += gap) {
            if (placed.some((q) => Math.hypot(q[0] - pts[j][0], q[1] - pts[j][1]) < 26 * k)) continue;
            placed.push(pts[j]);
            const a = pts[j - 1];
            const b = pts[j + 1];
            const ang = (Math.atan2(b[1] - a[1], b[0] - a[0]) * 180) / Math.PI;
            el("path", { d: "M-6 -7L4 0L-6 7", fill: "none", stroke: "#8a6a3f", "stroke-width": 2.6, "stroke-linecap": "round", "stroke-linejoin": "round", transform: `translate(${pts[j][0]} ${pts[j][1]}) rotate(${ang}) scale(${Math.max(1, k * 1.1)})` }, ghost);
          }
          const e = pts[pts.length - 1];
          const q = Math.max(6, 6 * k);
          el("rect", { x: e[0] - q, y: e[1] - q, width: 2 * q, height: 2 * q, rx: q / 3, fill: "#8a6a3f" }, ghost);
        }
      }
      const p0 = stroke.type === "dot" ? stroke.at : stroke.pts[0];
      const r = Math.max(12, 15 * k);
      const m = el("g", { class: active ? "sp-start" : "" }, marks);
      el("circle", { cx: p0[0], cy: p0[1], r, fill: active ? "#2e9d5b" : "#cbbda6", stroke: "#fff", "stroke-width": 3 }, m);
      text(m, p0[0], p0[1] + r * 0.42, i + 1, { "font-size": r * 1.25, fill: "#fff" });
    });
  };
  drawGhost();
  const toModel = (e) => {
    const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(g.getScreenCTM().inverse());
    return [p.x, p.y];
  };
  const inkD = (pts) => pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join("");
  const ring = (p, color = ERR) => el("circle", { cx: p[0], cy: p[1], r: 22, fill: "none", stroke: color, "stroke-width": 5 }, fb);
  const pen = async (stroke) => {
    const my = ++demo;
    const live = () => my === demo && st.alive();
    if (stroke.type === "dot") {
      const c = el("circle", { cx: stroke.at[0], cy: stroke.at[1], r: 10, fill: "var(--accent)" }, fb);
      await wait(700);
      c.remove();
      return;
    }
    const path = el("path", { d: CURSIVE.pathD(stroke.segs), fill: "none", stroke: "var(--accent)", "stroke-width": 7, "stroke-linecap": "round", opacity: 0.9 }, fb);
    const dot = el("circle", { r: 11, fill: "var(--accent)" }, fb);
    const len = path.getTotalLength();
    path.setAttribute("stroke-dasharray", `${len} ${len + 10}`);
    await tween(Math.max(900, (len / 230) * 1000), (t) => {
      path.setAttribute("stroke-dashoffset", len * (1 - t));
      const p = path.getPointAtLength(len * t);
      dot.setAttribute("cx", p.x);
      dot.setAttribute("cy", p.y);
    }, live);
    await wait(500);
    path.remove();
    dot.remove();
  };
  const finishStroke = async () => {
    const stroke = strokes[cur];
    if (stroke.type === "dot") el("circle", { cx: stroke.at[0], cy: stroke.at[1], r: 7, fill: INK }, done);
    else {
      const path = el("path", { d: CURSIVE.pathD(stroke.segs), fill: "none", stroke: INK, "stroke-width": 8, "stroke-linecap": "round", "stroke-linejoin": "round" }, done);
      const len = path.getTotalLength();
      path.setAttribute("stroke-dasharray", `${len} ${len + 10}`);
      tween(380, (t) => path.setAttribute("stroke-dashoffset", len * (1 - t)), st.alive);
    }
    MUSIC.play("harp", [72, 76, 79, 84][cur % 4], { gain: 0.3 });
    cur += 1;
    fails = 0;
    ink.setAttribute("d", "");
    fb.innerHTML = "";
    drawGhost();
    if (cur >= strokes.length) {
      view.classList.remove("sp-tr");
      const extras = strokes.length > 1 ? " Main stroke first, then the dots and crosses." : "";
      st.win(`Correct. Every stroke followed the path in the right direction.${extras}`);
    } else {
      const next = strokes[cur];
      talk(next.type === "dot" ? `Now the dot: tap the circle marked ${cur + 1}.` : `Now stroke ${cur + 1}: begin at the green dot and follow the arrows.`);
    }
  };
  const judge = () => {
    const stroke = strokes[cur];
    const pts = trace;
    trace = null;
    const model = stroke.type === "dot" ? [stroke.at] : stroke.pts;
    const r = CURSIVE.grade(model, pts, tolNow());
    if (r.ok) return finishStroke();
    fails += 1;
    st.oops();
    fb.innerHTML = "";
    const msg = {
      start: "Not quite. Begin at the green dot marked " + (cur + 1) + ", then follow the arrows.",
      backwards: "Not quite. That went in the opposite direction. Begin at the green dot and follow the arrows to the square end.",
      off: "Not quite. The line left the path at the orange ring. Slow down there and stay inside the shaded band.",
      short: "Not quite. Keep going without lifting until you reach the square end of the path.",
      dot: "Not quite. Tap inside the small circle.",
    }[r.why];
    if (r.at && r.why !== "start") ring(r.at);
    if (r.why === "start" || r.why === "backwards") ring(model[0], "#2e9d5b");
    setTimeout(() => ink.setAttribute("opacity", 0.3), 200);
    if (fails >= 2) {
      talk(`${msg} Watch the pen once, then trace it yourself.`);
      pen(stroke);
    } else talk(msg);
  };
  view.addEventListener("pointerdown", (e) => {
    if (!st.alive() || st.busy || cur >= strokes.length) return;
    e.preventDefault();
    demo += 1;
    fb.innerHTML = "";
    try {
      view.setPointerCapture(e.pointerId);
    } catch {}
    trace = [toModel(e)];
    ink.setAttribute("opacity", 0.85);
    ink.setAttribute("d", inkD(trace));
    window.OC?.touch();
  });
  view.addEventListener("pointermove", (e) => {
    if (!trace) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of evs.length ? evs : [e]) trace.push(toModel(ev));
    ink.setAttribute("d", inkD(trace));
  });
  const up = (e) => {
    if (!trace) return;
    trace.push(toModel(e));
    judge();
  };
  view.addEventListener("pointerup", up);
  view.addEventListener("pointercancel", () => (trace = null));
  st.acts(`<button type="button" data-a="watch">▶ Watch</button><button type="button" data-a="clear">↺ Clear</button>`, {
    watch: () => pen(strokes[cur] || strokes[0]),
    clear: () => {
      ink.setAttribute("d", "");
      fb.innerHTML = "";
    },
  });
  talk(intro);
}

const shell = SHELL({
  units: UNITS,
  how: {
    s0: { icon: "👀", title: "See it", steps: ["Watch each picture and listen.", "Press Next ▶ to continue.", "Press Let's play when you are ready."] },
    s1: { icon: "🧩", title: "Word parts", steps: ["Read the word or the gap.", "Find the prefix, root and suffix, or a related word.", "Select the answer."] },
    s2: { icon: "➕", title: "Suffix rules", steps: ["Read the base word and the suffix.", "Decide: double, drop the e, change y to i, or none.", "Type the new word and press ✓ Check."] },
    s3: { icon: "📚", title: "Plurals", steps: ["Read the singular word.", "Decide which plural rule applies.", "Type the plural and press ✓ Check."] },
    s4: { icon: "👂", title: "Homophones", steps: ["Read the sentence with the gap.", "Decide which meaning it needs.", "Select the word with that meaning."] },
    s5: { icon: "⌨️", title: "Dictation", steps: ["Listen to the word and the sentence.", "Type the word; press 🔊 Hear to hear it again.", "Press ✓ Check. Words you miss return sooner."] },
    s6: { icon: "🌍", title: "British and American", steps: ["Read where the book was printed.", "Recall the pattern: -or or -our, -er or -re.", "Select the spelling it would use."] },
    c1: { icon: "🖋️", title: "Cursive letters", steps: ["Put your finger or stylus on the green dot 1.", "Follow the arrows without lifting, to the square end.", "Then do stroke 2 (a dot or a cross), if there is one."] },
    c2: { icon: "🔗", title: "Cursive joins", steps: ["Begin at the green dot 1.", "Trace both letters in one stroke, following the arrows.", "Press ▶ Watch to see the pen first."] },
    c3: { icon: "📝", title: "Cursive words", steps: ["Trace the whole word in one stroke from dot 1.", "Then dot the i and cross the t.", "Press ▶ Watch if you need to see it first."] },
  },
  start: "s0",
  onStop() {
    token += 1;
    const p = $("[data-panel]");
    if (p) p.onclick = null;
    if (window.__spKeys) removeEventListener("keydown", window.__spKeys);
  },
  subject: "Reading",
  activity: "Spelling & Cursive",
  onUnit(id) {
    token += 1;
    VOICE.hush();
    units[id]();
  },
});
MUSIC.preload("harp", [67, 71, 72, 74, 76, 79, 83, 84]);
MUSIC.preload("woodblock", [72]);
</script>
