// =====================================================================
function frame({ picker = true, tag = "" } = {}) {
  stage.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "pq-wrap";
  wrap.innerHTML = `<div class="pq-top${picker ? " has-pick" : ""}"><div class="pq-lv" data-lvs>${LEVELS.map(([k, icon, name]) => `<button type="button" data-lv="${k}" aria-pressed="${k === level}" aria-label="${name}" title="${name}">${icon}</button>`).join("")}</div>${
    picker ? `<button type="button" class="pq-pick" data-pick-poem aria-label="Choose a poem"><span></span>▾</button>` : `<span class="pq-tag" data-tag>${tag}</span>`
  }<button type="button" class="pq-info" data-info aria-label="About this poem" title="About this poem">ⓘ</button><span class="pq-pager" data-pager hidden><button type="button" data-prev aria-label="Previous page">◀</button><span data-pg></span><button type="button" data-next-pg aria-label="Next page">▶</button></span></div><div class="pq-paper" data-paper></div>`;
  stage.appendChild(wrap);
  const view = {
    wrap,
    paper: $("[data-paper]", wrap),
    onLevel: null,
    onPoem: null,
    onInfo: null,
    setTag(t) {
      const tg = $("[data-tag]", wrap);
      if (tg) tg.innerHTML = t;
    },
    setTitle() {
      const b = $("[data-pick-poem] span", wrap);
      const p = BY[poemId];
      if (b) b.textContent = `${p.icon} ${p.title}`;
    },
  };
  view.setTitle();
  $("[data-lvs]", wrap).addEventListener("click", (event) => {
    let b = event.target.closest("[data-lv]");
    if (!b) return;
    if (b.dataset.lv === level) {
      // On narrow screens only the current level shows; tapping it moves to the next level.
      const all = [...wrap.querySelectorAll("[data-lv]")];
      if (all.every((x) => x === b || !x.offsetParent)) b = all[(all.indexOf(b) + 1) % all.length];
      else return;
      say(`${LEVELS.find((l) => l[0] === b.dataset.lv)[2]} ${b.textContent}: ${poemsAt(b.dataset.lv).length} poems. Tap the level again to change it.`, { voice: false });
    }
    level = b.dataset.lv;
    wrap.querySelectorAll("[data-lv]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    if (BY[poemId].lv !== level) poemId = poemsAt()[0].id;
    remember();
    window.OC?.touch();
    view.setTitle();
    view.onLevel?.();
  });
  $("[data-pick-poem]", wrap)?.addEventListener("click", () => openPicker(view, { due: view.due?.() || {} }));
  $("[data-info]", wrap).addEventListener("click", () => {
    if (view.onInfo) return view.onInfo();
    const p = BY[poemId];
    say(`<b>${esc(p.title)}</b>, ${cite(p)}. ${esc(p.ctx)} <small>Text: ${esc(p.ref)}.</small>`);
  });
  return view;
}

function openPicker(view, { due = {} } = {}) {
  const box = document.createElement("div");
  box.className = "pq-overlay";
  const list = poemsAt();
  box.innerHTML = `<h3>${lvOf(list[0])[1]} Choose a poem</h3><div class="pq-list">${list
    .map((p) => `<button type="button" class="pq-item${p.id === poemId ? " cur" : ""}" data-id="${p.id}"><i aria-hidden="true">${p.icon}</i><span>${esc(p.title)}<small>${esc(p.author)}, ${p.year}</small></span>${due[p.id] ? `<span class="due">review</span>` : ""}</button>`)
    .join("")}</div><div class="pq-row2"><button type="button" class="pq-btn" data-close>✕ Close</button></div>`;
  view.wrap.appendChild(box);
  box.addEventListener("click", (event) => {
    const item = event.target.closest("[data-id]");
    if (item) {
      poemId = item.dataset.id;
      remember();
      view.setTitle();
      box.remove();
      view.onPoem?.();
    } else if (event.target.closest("[data-close]")) box.remove();
  });
}

// Fits a font size to the stage, then splits the poem into pages (whole stanzas where possible) that fit without scrolling.
function fitFont(paper, base = 21) {
  const r = paper.getBoundingClientRect();
  const fs = Math.max(15, Math.min(base + 3, Math.round(Math.min(r.height / 9.5, r.width / 24))));
  paper.style.setProperty("--pq-fs", `${fs}px`);
  return fs;
}
// Shrinks a centred card's font until it fits the stage without scrolling (and re-fits when the stage resizes).
function shrinkToFit(paper, { varName = "--pq-fs", max = 24, min = 12 } = {}) {
  const fitNow = () => {
    const box = paper.querySelector(".pq-center");
    if (!box || !paper.clientHeight) return;
    let fs = max;
    paper.style.setProperty(varName, `${fs}px`);
    while (fs > min && (box.scrollHeight > box.clientHeight + 1 || box.scrollWidth > box.clientWidth + 1)) {
      fs -= 1;
      paper.style.setProperty(varName, `${fs}px`);
    }
  };
  fitNow();
  if (!paper._fitRO) {
    let size = "";
    paper._fitRO = new ResizeObserver(() => {
      const now = `${paper.clientWidth}x${paper.clientHeight}`;
      if (now !== size && paper.isConnected) {
        size = now;
        paper._fit?.();
      }
    });
    paper._fitRO.observe(paper);
  }
  paper._fit = fitNow;
}
function renderLines(paper, stanzas, { head = "", lineHtml, numbered = false } = {}) {
  paper.innerHTML = `${head}${stanzas
    .map((st) => `<div class="pq-st">${st.lines.map(({ s, l, text: t }) => `<div class="pq-line" data-s="${s}" data-l="${l}" style="--ind:${indentOf(t)}">${numbered ? `<span class="pq-num">${l + 1}</span>` : ""}${lineHtml ? lineHtml(t, s, l) : shown(t)}</div>`).join("")}</div>`)
    .join("")}`;
}
function paginate(paper, stanzas, opts = {}) {
  // stanzas: [{ lines: [{ s, l, text }] }]. Fills each page greedily, keeping stanzas whole when they fit.
  renderLines(paper, stanzas, opts);
  const cs = getComputedStyle(paper);
  const H = paper.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 2;
  const head = paper.querySelector(".pq-by");
  const headH = head ? head.getBoundingClientRect().height + parseFloat(getComputedStyle(head).marginBottom) : 0;
  const gap = parseFloat(cs.fontSize) * 0.5;
  const nodes = [...paper.querySelectorAll(".pq-line")];
  const pages = [];
  let page = [];
  let used = 0;
  let room = H - headH;
  let idx = 0;
  const turn = () => {
    pages.push(page);
    page = [];
    used = 0;
    room = H;
  };
  stanzas.forEach((st, k) => {
    const hs = st.lines.map(() => nodes[idx++].getBoundingClientRect().height);
    const total = hs.reduce((a, b) => a + b, 0);
    if (page.length && used + gap + total > room) turn();
    st.lines.forEach((ln, j) => {
      const g = page.length && j === 0 ? gap : 0;
      if (page.length && used + g + hs[j] > room) turn();
      used += (page.length && j === 0 ? gap : 0) + hs[j];
      page.push({ ...ln, k });
    });
  });
  if (page.length) pages.push(page);
  return pages.map((pg) => {
    const out = [];
    for (const ln of pg) {
      if (!out.length || out[out.length - 1].k !== ln.k) out.push({ k: ln.k, lines: [] });
      out[out.length - 1].lines.push(ln);
    }
    return out;
  });
}
const stanzasOf = (p, filter) =>
  TEXT[p.id]
    .map((st, s) => ({ lines: st.map((t, l) => ({ s, l, text: t })).filter((x) => !filter || filter(x)) }))
    .filter((x) => x.lines.length);

// A paginated poem view inside a frame. opts: { lineHtml, filter, numbered, head }
function poemView(view, opts = {}) {
  const p = BY[poemId];
  const paper = view.paper;
  paper._fit = null;
  fitFont(paper, opts.base || 21);
  const head = opts.head ?? `<p class="pq-by">${cite(p)}</p>`;
  const stanzas = stanzasOf(p, opts.filter);
  let pages = paginate(paper, stanzas, { ...opts, head, numbered: opts.numbered ?? !!p.verses });
  let page = 0;
  const pager = $("[data-pager]", view.wrap);
  const show = (k) => {
    page = Math.max(0, Math.min(pages.length - 1, k));
    renderLines(paper, pages[page], { ...opts, head: page === 0 ? head : "", numbered: opts.numbered ?? !!p.verses });
    pager.hidden = pages.length < 2;
    $("[data-pg]", pager).textContent = `${page + 1}/${pages.length}`;
    $("[data-prev]", pager).disabled = page === 0;
    $("[data-next-pg]", pager).disabled = page === pages.length - 1;
    opts.onPage?.(page);
  };
  pager.onclick = (event) => {
    if (event.target.closest("[data-prev]")) show(page - 1);
    else if (event.target.closest("[data-next-pg]")) show(page + 1);
  };
  show(0);
  // Re-paginate whenever the stage changes size (the panel below grows and shrinks as Ollie speaks).
  let size = `${paper.clientWidth}x${paper.clientHeight}`;
  const ro = new ResizeObserver(() => {
    if (!paper.isConnected) return ro.disconnect();
    const now = `${paper.clientWidth}x${paper.clientHeight}`;
    if (now === size || !paper.clientHeight) return;
    size = now;
    const first = pages[page]?.[0]?.lines[0];
    const lit = paper.querySelector(".pq-line.on");
    const litAt = lit ? [Number(lit.dataset.s), Number(lit.dataset.l)] : null;
    const html = lit?.innerHTML;
    fitFont(paper, opts.base || 21);
    pages = paginate(paper, stanzas, { ...opts, head, numbered: opts.numbered ?? !!p.verses });
    const at = litAt || (first ? [first.s, first.l] : null);
    const k = at ? pages.findIndex((pg) => pg.some((st) => st.lines.some((x) => x.s === at[0] && x.l === at[1]))) : 0;
    show(Math.max(0, k));
    if (litAt) {
      const node = paper.querySelector(`.pq-line[data-s="${litAt[0]}"][data-l="${litAt[1]}"]`);
      if (node) {
        node.classList.add("on");
        if (html) node.innerHTML = html;
      }
    }
    opts.onRepage?.();
  });
  ro.observe(paper);
  return {
    get page() {
      return page;
    },
    get pages() {
      return pages;
    },
    show,
    // Turn to the page holding [s, l] and return its element.
    find(s, l) {
      const k = pages.findIndex((pg) => pg.some((st) => st.lines.some((x) => x.s === s && x.l === l)));
      if (k >= 0 && k !== page) show(k);
      return paper.querySelector(`.pq-line[data-s="${s}"][data-l="${l}"]`);
    },
    redraw() {
      show(page);
    },
  };
}

// =====================================================================
// Shared question flow: options in the panel, two honest tries, reasoning after
// =====================================================================
function askChoice({ my, host, question, options, why, hint, short = false, onAnswer }) {
  let tries = 0;
  let finished = false;
  const items = shuffle(options.map((o, i) => ({ ...o, i })));
  host.innerHTML = `<div class="pq-opts">${items.map((o) => `<button type="button" class="pq-opt${short ? " short" : ""}" data-o="${o.i}">${o.label}</button>`).join("")}</div>`;
  say(question);
  host.onclick = (event) => {
    const b = event.target.closest("[data-o]");
    if (!b || finished || !alive(my)) return;
    const o = options[Number(b.dataset.o)];
    tries += 1;
    window.OC?.touch();
    if (o.ok) {
      finished = true;
      b.classList.add("right");
      host.querySelectorAll(".pq-opt").forEach((x) => (x.disabled = true));
      MUSIC.chime();
      host.querySelector(".pq-opts")?.classList.add("settled");
      say(`<b>${tries === 1 ? "Correct." : "Correct. You reconsidered well."}</b> ${why}`);
      onAnswer(true, tries);
    } else {
      b.classList.add("wrong");
      b.disabled = true;
      MUSIC.oops();
      if (tries < 2) say(`Not quite. ${o.hint || hint || "Reread the lines: which words support your answer?"} <small>Try once more.</small>`);
      else {
        finished = true;
        const right = host.querySelector(`[data-o="${options.findIndex((x) => x.ok)}"]`);
        right?.classList.add("right");
        host.querySelectorAll(".pq-opt").forEach((x) => (x.disabled = true));
        host.querySelector(".pq-opts")?.classList.add("settled");
        say(`Mistakes are how we learn. Let's look why. The answer is <b>${options.find((x) => x.ok).label}</b>. ${why}`);
        onAnswer(false, tries);
      }
    }
  };
}

// "Explain it": say it aloud or write 2–4 sentences, then compare with a model.
function explainIt({ my, prompt, model, onDone, doneLabel = "Finish ✓" }) {
  const host = panel(`<p class="pq-note">🗣️ Explain it aloud to a grown-up, or write 2–4 sentences. Then compare with a model.</p><div class="pq-row2"><button type="button" class="pq-btn primary" data-shown>✓ I have explained it: show a model</button><button type="button" class="pq-btn" data-fin hidden>${doneLabel}</button></div>`);
  say(`<b>Explain it.</b> ${prompt}`);
  host.onclick = (event) => {
    if (!alive(my)) return;
    if (event.target.closest("[data-shown]")) {
      event.target.closest("[data-shown]").hidden = true;
      $("[data-fin]", host).hidden = false;
      $("[data-fin]", host).setAttribute("data-pulse", "");
      window.OC?.count("explanations");
      say(model ? `<b>A model answer.</b> ${model} <small>Compare: did you state the idea clearly and give evidence?</small>` : `Good. A clear explanation states the idea and gives evidence. <small>Ask your listener whether it was clear.</small>`);
    } else if (event.target.closest("[data-fin]")) onDone?.();
  };
}

// A set of rounds with a calm finish.
function runSet({ my, unit, rounds, play, explain: ex, total = 8 }) {
  let i = 0;
  let good = 0;
  const next = () => {
    if (!alive(my)) return;
    if (i >= rounds.length) return finish();
    const r = rounds[i];
    play(r, i, rounds.length, (ok) => {
      if (ok) good += 1;
    });
    i += 1;
  };
  const finish = () => {
    const passed = good >= Math.ceil(rounds.length * 0.75);
    explainIt({
      my,
      prompt: ex.prompt,
      model: ex.model,
      onDone() {
        if (!alive(my)) return;
        if (passed) {
          shell.mark(unit, { done: true });
          confetti();
        }
        MUSIC.chime();
        window.OC?.touch();
        const host = panel(`<div class="pq-row2"><button type="button" class="pq-btn primary" data-again>🔁 A new set</button><button type="button" class="pq-btn" data-menu-open>Choose another game</button></div>`);
        say(`You answered ${good} of ${rounds.length} correctly within two tries${passed ? ". That is secure understanding; this game is marked complete." : ". Come back to this game tomorrow: practice spread over days builds lasting understanding."} <small>Notice which questions made you reread; that is where you learned most.</small>`);
        host.onclick = (event) => {
          if (event.target.closest("[data-again]")) units[unit]();
          else if (event.target.closest("[data-menu-open]")) $("[data-pick]")?.click();
        };
      },
    });
  };
  return { next, count: (ok) => ok && (good += 1) };
}

          async draw(v, api) {

  // ---------------------------------------------------------------- Read & hear
  p1() {
    const my = token;
    const view = frame();
    let pv = null;
    let reading = 0;
    let along = null;
    const host = panel(`<div class="pq-row2" data-ctrl><button type="button" class="pq-btn primary" data-listen>▶ Listen</button><button type="button" class="pq-btn" data-along>🗣️ Read along</button><button type="button" class="pq-btn" data-ex>💬 Explain it</button></div><div class="pq-row2" data-alongrow hidden><button type="button" class="pq-btn primary" data-nextline>Next line ▶</button><button type="button" class="pq-btn" data-again>🔈 Again</button><button type="button" class="pq-btn" data-stop>⏹ Stop</button></div>`);
    const ctrl = $("[data-ctrl]", host);
    const alongRow = $("[data-alongrow]", host);
    const lines = () => TEXT[poemId].flatMap((st, s) => st.map((t, l) => ({ s, l, t })));
    const clearOn = () => view.paper.querySelectorAll(".pq-line.on").forEach((n) => n.classList.remove("on"));
    const stop = () => {
      reading += 1;
      along = null;
      VOICE.hush();
      clearOn();
      ctrl.hidden = false;
      alongRow.hidden = true;
      $("[data-listen]", host).textContent = "▶ Listen";
    };
    const load = () => {
      stop();
      pv = poemView(view);
      const p = BY[poemId];
      say(`<b>${esc(p.title)}</b> by ${esc(p.author)}. Read it silently first. Then press <b>Listen</b>, and after that <b>Read along</b>, line by line.`);
    };
    view.onLevel = load;
    view.onPoem = load;
    async function listen() {
      if ($("[data-listen]", host).textContent.startsWith("⏹")) return stop();
      const gen = ++reading;
      $("[data-listen]", host).textContent = "⏹ Stop";
      const p = BY[poemId];
      await sayAsync(`${esc(p.title)}, by ${esc(p.author)}.`);
      for (const { s, l, t } of lines()) {
        if (!alive(my) || gen !== reading) return;
        clearOn();
        pv.find(s, l)?.classList.add("on");
        const ok = await speakLine(t);
        if (!ok || !alive(my) || gen !== reading) return;
      }
      clearOn();
      $("[data-listen]", host).textContent = "▶ Listen";
      say(`Notice where the voice paused: at the punctuation. Now press <b>Read along</b> and read each line aloud after me.`);
    }
    async function speakAlong() {
      const gen = ++reading;
      const { s, l, t } = along.list[along.i];
      clearOn();
      pv.find(s, l)?.classList.add("on");
      say(`Listen, then read line ${along.i + 1} of ${along.list.length} aloud yourself.`, { voice: false });
      await speakLine(t);
      if (!alive(my) || gen !== reading || !along) return;
      say(`Your turn: read line ${along.i + 1} aloud, with the same pauses. Then press <b>Next line</b>.`, { voice: false });
    }
    host.onclick = async (event) => {
      if (!alive(my)) return;
      if (event.target.closest("[data-listen]")) listen();
      else if (event.target.closest("[data-along]")) {
        stop();
        along = { list: lines(), i: 0 };
        ctrl.hidden = true;
        alongRow.hidden = false;
        speakAlong();
      } else if (event.target.closest("[data-again]") && along) speakAlong();
      else if (event.target.closest("[data-nextline]") && along) {
        along.i += 1;
        window.OC?.touch();
        if (along.i < along.list.length) return speakAlong();
        stop();
        MUSIC.chime();
        confetti();
        window.OC?.count("poems read");
        shell.mark("p1", { done: true });
        say(`You have read the whole poem aloud, line by line. Read it once more on your own, then press <b>Explain it</b>.`);
      } else if (event.target.closest("[data-stop]")) stop();
      else if (event.target.closest("[data-ex]")) {
        stop();
        const p = BY[poemId];
        explainIt({
          my,
          prompt: `What is "${esc(p.title)}" about, and how do you know? Point to words in the poem.`,
          model: esc(p.ab),
          doneLabel: "Back to the poem ▶",
          onDone: () => alive(my) && units.p1(),
        });
      }
    };
    load();
  },

  // ---------------------------------------------------------------- Meter
  p2() {
    const my = token;
    const view = frame({ picker: false, tag: "🥁 Meter" });
    const build = () => {
      const pool = shuffle(POEMS.filter((p) => p.lv === level).flatMap((p) => p.scan.map((sc) => ({ p, sc }))));
      // Lines with a named foot first, then the rest, so every set teaches the four feet.
      const named = pool.filter((x) => x.sc[4]);
      const other = pool.filter((x) => !x.sc[4]);
      return [...named.slice(0, 6), ...other.slice(0, 2), ...named.slice(6)].slice(0, 8);
    };
    let set;
    const start = () => {
      const rounds = build();
      set = runSet({
        my,
        unit: "p2",
        rounds,
        play,
        explain: {
          prompt: "Explain the difference between an iamb and a trochee, and give one word of your own that is each.",
          model: "An iamb is an unstressed syllable followed by a stressed one, da-DUM, as in a-WAY or be-LOW. A trochee is the reverse, DUM-da, as in TI-ger or GAR-den. Iambic lines seem to rise; trochaic lines seem to fall.",
        },
      });
      set.next();
    };
    view.onLevel = start;
    view.onInfo = () => say(`Meter is the pattern of stressed (/) and unstressed (˘) syllables. Feet: iamb da-DUM, trochee DUM-da, anapest da-da-DUM, dactyl DUM-da-da. A dashed outline after checking marks a syllable that can honestly be read either way.`);
    function play({ p, sc }, i, n, tally) {
      const [s, l, syl, pat, foot, note] = sc;
      const words = syl.split(" ").map(syllablesOf);
      let k = 0;
      const paper = view.paper;
      paper.innerHTML = `<div class="pq-center"><p class="pq-src">${p.icon} ${esc(p.title)} · ${esc(p.author)} · line ${l + 1}${TEXT[p.id].length > 1 ? `, stanza ${s + 1}` : ""}</p><div class="pq-tiles">${words
        .map((w) => `<span class="pq-word">${w.map((x) => `<button type="button" class="pq-syl" data-k="${k++}" data-m="">${esc(x.replace(/--/g, "—"))}</button>`).join("")}</span>`)
        .join("")}</div></div>`;
      const tiles = [...paper.querySelectorAll(".pq-syl")];
      shrinkToFit(paper, { varName: "--pq-sy", max: 26, min: 14 });
      let tries = 0;
      let locked = false;
      paper.onclick = (event) => {
        const t = event.target.closest(".pq-syl");
        if (!t || locked) return;
        t.classList.toggle("on");
        t.classList.remove("bad");
        t.dataset.m = t.classList.contains("on") ? "/" : "";
        MUSIC.play("woodblock", t.classList.contains("on") ? 76 : 72, { gain: t.classList.contains("on") ? 0.5 : 0.2 });
      };
      const host = panel(`<div class="pq-row2"><p class="ap-status">Line ${i + 1} of ${n}</p><button type="button" class="pq-btn" data-hear>🔈 Hear it</button><button type="button" class="pq-btn primary" data-check>✓ Check</button></div><div data-q></div>`);
      say(`Say the line aloud and tap every <b>stressed</b> syllable, the ones said louder and longer.${i === 0 ? " <small>Long words have fixed stress (YEL-low); in short words, listen to the sense.</small>" : ""}`);
      const reveal = (ok) => {
        locked = true;
        tiles.forEach((t, j) => {
          t.classList.toggle("on", pat[j] === "/");
          t.classList.remove("bad");
          t.classList.toggle("deb", pat[j] === "?");
          t.dataset.m = pat[j] === "/" ? "/" : pat[j] === "?" ? "◇" : "˘";
        });
        const beats = [...pat].filter((c) => c === "/").length;
        const debate = note ? ` <small>${esc(note)}</small>` : "";
        const tail = `${ok ? "<b>Correct.</b>" : "Mistakes are how we learn. Let's look why."} The pattern is <b>${[...pat].map((c) => (c === "/" ? "/" : c === "?" ? "◇" : "˘")).join(" ")}</b>${pat.includes("?") ? "" : `: ${beats} beats`}.${debate}`;
        if (foot) {
          // "a|b": a is the usual name; b is also defensible for this line and is accepted.
          const feet = foot.split("|");
          const main = feet[0];
          const opts = Object.entries(FEET).map(([name, f]) => ({ label: `${name} ${f.mark.replace(/x/g, "˘")}`, ok: feet.includes(name), hint: `Look at the marks you have: which repeating group, ${FEET[main].say.includes("da-da") ? "of three" : "of two"} syllables, fits most of the line?` }));
          askChoice({
            my,
            host: $("[data-q]", host),
            question: `${tail} <b>Which foot repeats through most of this line?</b>`,
            options: opts,
            short: true,
            why: `This line is usually described as built of <b>${main}s</b>, ${FEET[main].say}.${feet[1] ? ` Naming it by <b>${feet[1]}s</b> is also defensible.` : ""} ${esc(p.meter.charAt(0).toUpperCase() + p.meter.slice(1))}.`,
            onAnswer(good) {
              tally(ok && good);
              nextBtn();
            },
          });
        } else {
          say(`${tail} <small>${esc(p.title)}: ${esc(p.meter)}.</small>`);
          tally(ok);
          nextBtn();
        }
        $("[data-check]", host).hidden = true;
      };
      const nextBtn = () => {
        const row = host.querySelector(".pq-row2");
        const b = document.createElement("button");
        b.type = "button";
        b.className = "pq-btn primary";
        b.textContent = i + 1 >= n ? "Finish ▶" : "Next line ▶";
        b.setAttribute("data-pulse", "");
        b.onclick = () => alive(my) && set.next();
        row.appendChild(b);
      };
      host.onclick = (event) => {
        if (!alive(my)) return;
        if (event.target.closest("[data-hear]")) speakLine(lineOf(p, s, l));
        else if (event.target.closest("[data-check]") && !locked) {
          tries += 1;
          window.OC?.count("lines scanned");
          let wrong = 0;
          tiles.forEach((t, j) => {
            const on = t.classList.contains("on");
            const bad = (pat[j] === "/" && !on) || (pat[j] === "x" && on);
            t.classList.toggle("bad", bad);
            if (bad) wrong += 1;
          });
          if (!wrong) {
            MUSIC.chime();
            reveal(true);
          } else if (tries < 2) {
            MUSIC.oops();
            say(`Not quite: ${wrong} syllable${wrong > 1 ? "s are" : " is"} outlined. Say each outlined word on its own, then in the line. Which part is louder? <small>Try once more.</small>`);
          } else {
            MUSIC.oops();
            reveal(false);
          }
        }
      };
    }
    start();
  },

  // ---------------------------------------------------------------- Rhyme scheme
  p3() {
    const my = token;
    const view = frame({ picker: false, tag: "🔤 Rhyme scheme" });
    const LET = "ABCDEFGHIJKLMNOP";
    const letters = (keys) => {
      const map = new Map();
      let n = 0;
      return keys.map((k) => {
        if (k === null) return LET[n++];
        if (!map.has(k)) map.set(k, LET[n++]);
        return map.get(k);
      });
    };
    // Chunks of a stanza that make a fair scheme question (whole short stanzas, or 4-line pieces of long ones).
    const chunksOf = (p, s) => {
      const st = p.rh[s];
      if (st.length <= 6) return [[0, st.length]];
      const out = [];
      for (let a = 0; a + 4 <= st.length; a += 4) out.push([a, a + 4]);
      return out;
    };
    const SCHEMES4 = ["AABB", "ABAB", "ABCB", "ABBA", "AAAA", "AABA", "ABCD"];
    const mutate = (sch) => {
      const opts = new Set([sch]);
      const pool = sch.length === 4 ? shuffle(SCHEMES4) : [];
      for (const x of pool) if (opts.size < 4) opts.add(x);
      let guard = 0;
      while (opts.size < 4 && guard++ < 60) {
        const a = [...sch];
        const i = Math.floor(Math.random() * a.length);
        const j = Math.floor(Math.random() * a.length);
        [a[i], a[j]] = [a[j], a[i]];
        const fixed = letters(a);
        opts.add(fixed.join(""));
      }
      return [...opts];
    };
    const slantKey = (p, s, a, b) => (p.sl || []).find((x) => x[0] === s && ((x[1] === a && x[2] === b) || (x[1] === b && x[2] === a)));
    // Pairs left out of "full or slant?": then/again and gone/on vary by accent; read/fed is a heteronym; thro’ (through) looks like "throw".
    const EXCLUDE = new Set(["windy:1:4:5", "if:2:5:7", "ozymandias:0:5:7", "wind:0:1:3"]);
    const build = () => {
      const ps = POEMS.filter((p) => p.lv === level && p.rh);
      const rounds = [];
      const schemes = shuffle(ps.flatMap((p) => p.rh.flatMap((_, s) => (p.noScheme?.includes(s) ? [] : chunksOf(p, s).map(([a, b]) => ({ type: "scheme", p, s, a, b }))))));
      // Lines whose rhyme spans two words ("about you", "in it") make a misleading one-word prompt, so they are not used as targets.
      const NO_TARGET = new Set(["if:0:0", "if:0:1", "if:0:2", "if:0:3", "if:2:6", "if:3:2", "if:3:6"]);
      const partners = shuffle(ps.flatMap((p) => p.rh.flatMap((st, s) => st.map((k, l) => (k && st.filter((x) => x === k).length > 1 && !NO_TARGET.has(`${p.id}:${s}:${l}`) ? { type: "partner", p, s, l } : null)).filter(Boolean))));
      const slants = shuffle(POEMS.filter((p) => p.lv === level || level !== "easy").flatMap((p) => (p.sl || []).map(([s, a, b, why]) => ({ type: "pair", p, s, a, b, slant: true, why }))));
      const fulls = shuffle(
        ps.flatMap((p) =>
          p.rh.flatMap((st, s) => {
            const out = [];
            for (let a = 0; a < st.length; a++)
              for (let b = a + 1; b < st.length; b++) {
                if (!st[a] || st[a] !== st[b] || slantKey(p, s, a, b) || EXCLUDE.has(`${p.id}:${s}:${a}:${b}`)) continue;
                const wa = lastWord(TEXT[p.id][s][a]).split("-").pop();
                const wb = lastWord(TEXT[p.id][s][b]).split("-").pop();
                if (wa.toLowerCase() === wb.toLowerCase() || vowelGroups(wa) !== 1 || vowelGroups(wb) !== 1) continue;
                out.push({ type: "pair", p, s, a, b, slant: false });
              }
            return out.slice(0, 2);
          }),
        ),
      );
      const inners = shuffle(ps.flatMap((p) => (p.inner || []).map(([s, l, pair]) => ({ type: "inner", p, s, l, pair }))));
      const plan = ["scheme", "partner", "pair", "scheme", "partner", "pair", "scheme", inners.length ? "inner" : "partner"];
      const take = { scheme: schemes, partner: partners, inner: inners };
      let flip = 0;
      for (const kind of plan) {
        let r;
        if (kind === "pair") r = (flip++ % 2 === 0 && slants.length ? slants : fulls).shift() || slants.shift() || fulls.shift();
        else r = take[kind].shift();
        if (!r) r = schemes.shift() || partners.shift();
        if (r) rounds.push(r);
      }
      return rounds;
    };
    let set;
    const start = () => {
      set = runSet({
        my,
        unit: "p3",
        rounds: build(),
        play,
        explain: {
          prompt: "What is a slant rhyme? Give an example from today's poems and say exactly which sounds match and which differ.",
          model: "A slant rhyme (or near rhyme) matches only part of the sound. In Dickinson's 'soul' and 'all', the final l-sound matches but the vowels differ. A full rhyme, like 'night' and 'light', matches everything from the stressed vowel to the end.",
        },
      });
      set.next();
    };
    view.onLevel = start;
    view.onInfo = () => say(`Give each new end-sound a letter: the first is A, the next new sound B, and so on. Lines that rhyme share a letter. A slant rhyme counts as a rhyme in the scheme, but only part of its sound matches.`);
    const rowsHtml = (p, s, a, b, { buttons = false, mark = null, lettersOn = null } = {}) => {
      const out = [];
      for (let l = a; l < b; l++) {
        const t = TEXT[p.id][s][l];
        const lw = lastWord(t);
        const txt = shown(t);
        const idx = txt.lastIndexOf(esc(lw));
        const body = idx >= 0 ? `${txt.slice(0, idx)}<b>${txt.slice(idx, idx + esc(lw).length)}</b>${txt.slice(idx + esc(lw).length)}` : txt;
        const L = lettersOn ? lettersOn[l - a] : "?";
        const cls = lettersOn ? ` L${LET.indexOf(L) % 6}` : "";
        out.push(`<${buttons ? "button type=\"button\"" : "div"} class="pq-row${mark === l ? " target" : ""}" data-l="${l}"><span class="t">${body}</span><span class="pq-let${cls}">${L}</span></${buttons ? "button" : "div"}>`);
      }
      return out.join("");
    };
    function play(r, i, n, tally) {
      const { p, s } = r;
      const paper = view.paper;
      const src = `<p class="pq-src">${p.icon} ${esc(p.title)} · ${esc(p.author)}${TEXT[p.id].length > 1 ? ` · stanza ${s + 1}` : ""}</p>`;
      const host = panel(`<div data-q></div><div class="pq-row2" data-nx><p class="ap-status">Question ${i + 1} of ${n}</p></div>`);
      const nextBtn = () => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "pq-btn primary";
        b.textContent = i + 1 >= n ? "Finish ▶" : "Next ▶";
        b.setAttribute("data-pulse", "");
        b.onclick = () => alive(my) && set.next();
        $("[data-nx]", host).appendChild(b);
      };
      if (r.type === "scheme") {
        const { a, b } = r;
        const keys = p.rh[s].slice(a, b);
        const sch = letters(keys);
        paper.innerHTML = `<div class="pq-center">${src}<div class="pq-rows">${rowsHtml(p, s, a, b)}</div></div>`;
        shrinkToFit(paper, { max: 22, min: 12 });
        const slantsHere = (p.sl || []).filter((x) => x[0] === s && x[1] >= a && x[2] < b);
        // A repeated end word (knocking / knocking, sleep / sleep) shares its letter; say so, since conventions are not always taught.
        const ends = keys.map((k, j) => (k ? lastWord(TEXT[p.id][s][a + j]).toLowerCase() : null));
        // (Not said when the same word also ends a line with a different rhyme, as in "If—": "about you" / "on you".)
        let same = false;
        let clash = false;
        ends.forEach((w, j) => ends.forEach((v, k) => {
          if (j < k && w && w === v) keys[j] === keys[k] ? (same = true) : (clash = true);
        }));
        const repeated = same && !clash;
        const options = mutate(sch.join("")).map((x) => ({ label: x, ok: x === sch.join("") }));
        askChoice({
          my,
          host: $("[data-q]", host),
          question: `Read the end words aloud (in bold). <b>What is the rhyme scheme of ${b - a === p.rh[s].length ? "this stanza" : `lines ${a + 1}–${b}`}?</b>${slantsHere.length || repeated ? ` <small>${[slantsHere.length ? "Count slant rhymes as rhymes." : "", repeated ? "A repeated end word shares its letter." : ""].filter(Boolean).join(" ")}</small>` : ""}`,
          options,
          short: true,
          hint: "Give the first end-sound A. Does the second line's end-sound match it? If not, it is B. Continue line by line.",
          why: `The scheme is <b>${sch.join("")}</b>.${slantsHere.length ? ` It counts a slant rhyme: ${slantsHere.map((x) => esc(x[3])).join(" ")}` : ""}`,
          onAnswer(ok) {
            tally(ok);
            paper.querySelector(".pq-rows").innerHTML = rowsHtml(p, s, a, b, { lettersOn: sch });
            window.OC?.count("rhyme schemes");
            nextBtn();
          },
        });
      } else if (r.type === "partner") {
        const st = TEXT[p.id][s];
        let a = 0;
        let b = st.length;
        // Show only as many tappable lines as the stage can hold (4–8), always including the target and its nearest partner.
        const cap = Math.max(4, Math.min(8, Math.floor((paper.clientHeight - 44) / 48)));
        if (st.length > cap) {
          const mates = p.rh[s].map((k, j) => (j !== r.l && k === p.rh[s][r.l] ? j : -1)).filter((j) => j >= 0);
          const near = mates.sort((x, y) => Math.abs(x - r.l) - Math.abs(y - r.l))[0];
          const lo = Math.min(r.l, near);
          const hi = Math.max(r.l, near);
          a = Math.max(0, Math.min(lo - 1, st.length - cap, hi - cap + 1));
          b = Math.min(st.length, a + cap);
        }
        paper.innerHTML = `<div class="pq-center">${src}<div class="pq-rows">${rowsHtml(p, s, a, b, { buttons: true, mark: r.l })}</div></div>`;
        shrinkToFit(paper, { max: 22, min: 14 });
        // On very small stages, hide the lines farthest from the target until the rest fit (target and nearest partner always stay).
        const mates0 = p.rh[s].map((k, j) => (j !== r.l && k === p.rh[s][r.l] && j >= a && j < b ? j : -1)).filter((j) => j >= 0);
        const keepSet = new Set([r.l, mates0.sort((x, y) => Math.abs(x - r.l) - Math.abs(y - r.l))[0]]);
        const fitBase = paper._fit;
        paper._fit = () => {
          const rows = [...paper.querySelectorAll("button.pq-row")];
          rows.forEach((x) => (x.style.display = ""));
          fitBase?.();
          const box = paper.querySelector(".pq-center");
          let guard = 0;
          while (box && box.scrollHeight > box.clientHeight + 1 && guard++ < 8) {
            const victim = rows.filter((x) => x.style.display !== "none" && !keepSet.has(Number(x.dataset.l))).sort((x, y) => Math.abs(y.dataset.l - r.l) - Math.abs(x.dataset.l - r.l))[0];
            if (!victim) break;
            victim.style.display = "none";
          }
        };
        paper._fit();
        const word = lastWord(st[r.l]);
        const answers = p.rh[s].map((k, j) => (j !== r.l && k === p.rh[s][r.l] && j >= a && j < b ? j : -1)).filter((j) => j >= 0);
        let tries = 0;
        let done = false;
        say(`<b>Tap a line that rhymes with “${esc(word)}”.</b> <small>The highlighted line is the one to match.</small>`);
        $("[data-q]", host).innerHTML = "";
        paper.onclick = (event) => {
          const row = event.target.closest("button.pq-row");
          if (!row || done || !alive(my)) return;
          const l = Number(row.dataset.l);
          if (l === r.l) return say(`That is the line we are matching. Find another line whose end sounds like “${esc(word)}”.`);
          tries += 1;
          const ok = answers.includes(l);
          const sl = slantKey(p, s, r.l, l);
          if (ok) {
            done = true;
            row.classList.add("hit");
            MUSIC.chime();
            const same = word.toLowerCase() === lastWord(st[l]).toLowerCase();
            say(`<b>Correct.</b> “${esc(word)}” and “${esc(lastWord(st[l]))}” ${sl ? `make a slant rhyme. ${esc(sl[3])}` : same ? "are the same word repeated: an identical rhyme, which poets use for emphasis." : "rhyme: they share the sound from the last stressed vowel to the end."}`);
            tally(true);
            nextBtn();
          } else {
            row.classList.add("miss");
            MUSIC.oops();
            if (tries < 2) say(`Not quite. Say “${esc(word)}” and “${esc(lastWord(st[l]))}” aloud: do they share the final vowel and consonant sounds? <small>Try once more.</small>`);
            else {
              done = true;
              answers.forEach((j) => paper.querySelector(`.pq-row[data-l="${j}"]`)?.classList.add("hit"));
              say(`Mistakes are how we learn. Let's look why. “${esc(word)}” rhymes with “${esc(lastWord(st[answers[0]]))}”, shown in green: listen to the endings.`);
              tally(false);
              nextBtn();
            }
          }
        };
      } else if (r.type === "pair") {
        const { a, b } = r;
        const wa = lastWord(TEXT[p.id][s][a]);
        const wb = lastWord(TEXT[p.id][s][b]);
        paper.innerHTML = `<div class="pq-center">${src}<div class="pq-rows">${rowsHtml(p, s, a, a + 1)}${rowsHtml(p, s, b, b + 1)}</div><p class="pq-big"><b>${esc(wa)}</b> / <b>${esc(wb)}</b></p></div>`;
        shrinkToFit(paper, { max: 22, min: 12 });
        askChoice({
          my,
          host: $("[data-q]", host),
          question: `<b>Is “${esc(wa)} / ${esc(wb)}” a full rhyme or a slant rhyme?</b> Say both words slowly.`,
          options: [
            { label: "Full rhyme", ok: !r.slant, hint: "A full rhyme matches everything from the stressed vowel to the end. Does the vowel match too, or only the ending?" },
            { label: "Slant rhyme", ok: r.slant, hint: "In a slant rhyme only part of the sound matches. Here, is anything different?" },
          ],
          short: true,
          why: r.slant ? esc(r.why) : `“${esc(wa)}” and “${esc(wb)}” match from the stressed vowel to the end: a full rhyme.`,
          onAnswer(ok) {
            tally(ok);
            window.OC?.count("rhymes judged");
            nextBtn();
          },
        });
      } else if (r.type === "inner") {
        const line = TEXT[p.id][s][r.l];
        paper.innerHTML = `<div class="pq-center">${src}<div class="pq-big"><div class="pq-line">${shown(line)}</div></div></div>`;
        shrinkToFit(paper, { max: 28, min: 13 });
        const words = [...new Map(line.trim().split(/\s+/).map((w) => w.replace(/^[^A-Za-z]+|[^A-Za-z]+$/g, "")).filter((w) => w.length > 2).map((w) => [w.toLowerCase(), w])).values()];
        const [x, y] = r.pair.split(" / ");
        // Leave out words that echo the pair's ending (e.g. 'And' with 'hand'), so no distractor is also a rhyme.
        const echo = (w) => [x, y].some((v) => w.toLowerCase() === v.toLowerCase() || w.toLowerCase().slice(-2) === v.toLowerCase().slice(-2));
        const others = shuffle(words.filter((w) => !echo(w)));
        const distract = [];
        for (let k = 0; k + 1 < others.length && distract.length < 3; k += 2) distract.push(`${others[k]} / ${others[k + 1]}`);
        while (distract.length < 2 && others.length) distract.push(`${others.pop()} / ${x}`);
        askChoice({
          my,
          host: $("[data-q]", host),
          question: `An <b>internal rhyme</b> is a rhyme inside a single line. <b>Which pair rhymes inside this line?</b>`,
          options: [{ label: r.pair, ok: true }, ...distract.map((d) => ({ label: d, ok: false }))],
          short: true,
          hint: "Read the line aloud and listen for two words in the middle that echo each other.",
          why: `“${esc(x)}” and “${esc(y)}” rhyme inside the line. Internal rhyme makes a line ring, like a bell struck twice.`,
          onAnswer(ok) {
            tally(ok);
            nextBtn();
          },
        });
      }
    }
    start();
  },

  // ---------------------------------------------------------------- Imagery & figurative language
  p4() {
    const my = token;
    const view = frame({ picker: false, tag: "🎨 Imagery & figures" });
    const build = () => {
      const ps = POEMS.filter((p) => p.lv === level);
      const devs = shuffle(ps.flatMap((p) => p.dv.map((d) => ({ type: "dev", p, d }))));
      const qs = shuffle(ps.flatMap((p) => p.qs.map((q) => ({ type: "q", p, q }))));
      const out = [];
      for (let k = 0; k < 8; k++) {
        const r = (k % 2 === 0 ? devs : qs).shift() || devs.shift() || qs.shift();
        if (r) out.push(r);
      }
      return out;
    };
    let set;
    let pxPoem = null;
    const start = () => {
      const rounds = build();
      pxPoem = pick([...new Set(rounds.map((r) => r.p))]);
      const [s, a, b, model] = pxPoem.px;
      set = runSet({
        my,
        unit: "p4",
        rounds: [...rounds, { type: "px" }],
        play(r, i, n, tally) {
          if (r.type === "px") return paraphrase(tally);
          return play(r, i, n - 1, tally);
        },
        explain: {
          prompt: `Choose one figure of speech from today's poems. Name it, quote it exactly, and explain what it makes you see or feel that plain words would not.`,
          model: `In "Hope is the thing with feathers", Dickinson uses a metaphor: hope is a small bird. Calling it a bird makes an invisible feeling seem alive, light and fragile, yet able to keep singing through a storm. Plain words such as "hope never stops" could not show its warmth or its courage.`,
        },
      });
      set.next();
      function paraphrase(tally) {
        const paper = view.paper;
        const p = pxPoem;
        paper.innerHTML = `<div class="pq-center"><p class="pq-src">${p.icon} ${esc(p.title)} · ${esc(p.author)}</p><div class="pq-big">${TEXT[p.id][s]
          .slice(a, b + 1)
          .map((t) => `<div class="pq-line" style="--ind:${indentOf(t)}">${shown(t)}</div>`)
          .join("")}</div></div>`;
        shrinkToFit(paper, { max: 24, min: 12 });
        explainIt({
          my,
          prompt: `<b>Paraphrase</b> these lines: keep the meaning, but use your own words and plain modern English.`,
          model: esc(model),
          doneLabel: "Next ▶",
          onDone() {
            tally(true);
            set.next();
          },
        });
      }
    };
    view.onLevel = start;
    view.onInfo = () => say(`Simile: ${DEVICES.simile}. Metaphor: ${DEVICES.metaphor}. Personification: ${DEVICES.personification}. Alliteration: ${DEVICES.alliteration}. Onomatopoeia: ${DEVICES.onomatopoeia}.`);
    function play(r, i, n, tally) {
      const { p } = r;
      const paper = view.paper;
      const host = panel(`<div data-q></div><div class="pq-row2" data-nx><p class="ap-status">Question ${i + 1} of ${n}</p></div>`);
      const nextBtn = () => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "pq-btn primary";
        b.textContent = "Next ▶";
        b.setAttribute("data-pulse", "");
        b.onclick = () => alive(my) && set.next();
        $("[data-nx]", host).appendChild(b);
      };
      if (r.type === "dev") {
        const [s, a, b, dev, why, also] = r.d;
        view.setTag("🎨 Imagery & figures");
        $("[data-pager]", view.wrap).hidden = true;
        paper.innerHTML = `<div class="pq-center"><p class="pq-src">${p.icon} ${esc(p.title)} · ${esc(p.author)}</p><div class="pq-big">${TEXT[p.id][s]
          .slice(a, b + 1)
          .map((t) => `<div class="pq-line">${shown(t)}</div>`)
          .join("")}</div></div>`;
        shrinkToFit(paper, { max: 28, min: 13 });
        const wrong = shuffle(Object.keys(DEVICES).filter((d) => d !== dev && !also.includes(d))).slice(0, 3);
        askChoice({
          my,
          host: $("[data-q]", host),
          question: `<b>Which figure of speech ${b > a ? "do these lines" : "does this line"} use?</b>${also.length ? ` <small>(${also.join(" and ")} may be present too, but is not offered.)</small>` : ""}`,
          options: [{ label: dev, ok: true }, ...wrong.map((w) => ({ label: w, ok: false, hint: DEVICE_HINT[w] }))],
          short: true,
          why: `It is <b>${dev}</b>, ${DEVICES[dev]}. ${esc(why)}`,
          onAnswer(ok) {
            tally(ok);
            window.OC?.count("figures identified");
            nextBtn();
          },
        });
      } else {
        const [q, opts, why] = r.q;
        poemViewFor(p, q);
        askChoice({
          my,
          host: $("[data-q]", host),
          question: `<b>${esc(q)}</b>`,
          options: opts.map((o, k) => ({ label: esc(o), ok: k === 0 })),
          why: esc(why),
          onAnswer(ok) {
            tally(ok);
            window.OC?.count("poem questions");
            nextBtn();
          },
        });
      }
    }
    function poemViewFor(p, q = "") {
      const keep = poemId;
      poemId = p.id;
      view.setTag(`${p.icon} ${esc(p.title)}`);
      const pv = poemView(view, { base: 19 });
      poemId = keep;
      // Turn to the page that holds the first phrase the question quotes, without highlighting it.
      const norm = (t) => t.toLowerCase().replace(/[’']/g, "'").replace(/--/g, "—");
      for (const m of q.matchAll(/(?<![A-Za-z])'(?=\S)([^']+?)(?<=\S)'(?![A-Za-z])/g)) {
        const phrase = norm(m[1]).split(" … ")[0];
        for (const [s, st] of TEXT[p.id].entries()) {
          const l = st.findIndex((t) => norm(t).includes(phrase));
          if (l >= 0) return pv.find(s, l);
        }
      }
    }
    start();
  },

  // ---------------------------------------------------------------- Memorise
  p5() {
    const my = token;
    const view = frame();
    const STEPS = [
      ["1", "Read", "Read the whole passage aloud twice, slowly. I will read it first."],
      ["2", "Gaps", "Some words are hidden. Say the passage aloud, filling the gaps. Tap a gap only if you are stuck."],
      ["3", "More gaps", "Now most words are hidden. Say it aloud again; tap a gap only if you are stuck."],
      ["4", "Letters", "Only the first letter of each word remains. Say the whole passage from these clues."],
      ["5", "Starts", "Only the first word of each line remains. Say each line in full."],
      ["6", "Recall", "Everything is hidden. Say each line, then reveal it and check yourself honestly."],
    ];
    const mem = () => shell.progress().p5?.mem || {};
    const saveMem = (m) => shell.mark("p5", { mem: m });
    // Memorise one stanza at a time; long stanzas are split into pieces of at most six lines (Psalm 23: two verses).
    const partsOf = (p) =>
      TEXT[p.id].flatMap((st, s) => {
        const size = p.verses ? 2 : st.length <= 8 ? st.length : 4;
        const out = [];
        for (let a = 0; a < st.length; a += size) out.push({ s, a, b: Math.min(st.length, a + size) });
        return out;
      });
    let part = 0;
    let step = 0;
    let gen = 0;
    const p = () => BY[poemId];
    const key = () => `${poemId}:${part}`;
    const dueMap = () => {
      const m = mem();
      const t = today();
      const out = {};
      for (const [k, v] of Object.entries(m)) if (v.due <= t) out[k.split(":")[0]] = (out[k.split(":")[0]] || 0) + 1;
      return out;
    };
    const host = panel(`<div class="pq-steps" data-steps>${STEPS.map(([n, name], k) => `<button type="button" data-step="${k}" aria-label="Step ${n}: ${name}">${n} ${name}</button>`).join("")}</div><div class="pq-row2" data-act></div>`);
    view.due = dueMap;
    view.onLevel = () => {
      part = 0;
      draw(0);
    };
    view.onPoem = () => {
      part = 0;
      draw(0);
    };
    view.onInfo = () => {
      const m = mem();
      const due = Object.entries(m).filter(([, v]) => v.due <= today());
      say(due.length ? `Due for review today: ${due.map(([k, v]) => `${esc(v.title)} (part ${Number(k.split(":")[1]) + 1})`).join("; ")}. Open the poem and start at step 6.` : `Nothing is due for review today. Each passage you recall comes back after 1, 2, 4, 7, 14, then 30 days.`);
    };
    const words = (line) => line.trim().split(/\s+/);
    const firstLetter = (w) => {
      const m = w.match(/^([^A-Za-z]*)([A-Za-z])[A-Za-z’'-]*(.*)$/);
      return m ? `${m[1]}${m[2]}${m[3]}` : w;
    };
    const lineHtmlFor = (mode) => (t, s, l) => {
      const ws = words(t.replace(/--/g, " — ").replace(/\s+/g, " "));
      if (mode === "full") return shown(t);
      if (mode === "starts") return `<span>${esc(ws[0])}</span> <span class="pq-hid pq-w" data-peek>${esc(ws.slice(1).join(" "))}</span>`;
      if (mode === "first") return ws.map((w) => `<span class="pq-w pq-fl" data-word="${esc(w)}" data-peekw>${esc(firstLetter(w))}</span>`).join(" ");
      return ws
        .map((w, j) => {
          const hide = mode === "gaps1" ? (j + l) % 3 === 1 : (j + l) % 3 !== 0;
          return hide && /[A-Za-z]/.test(w) ? `<span class="pq-hid pq-w" data-peek>${esc(w)}</span>` : esc(w);
        })
        .join(" ");
    };
    const MODES = ["full", "gaps1", "gaps2", "first", "starts", "recall"];
    let pv = null;
    const recallShown = new Set();
    // A bar as long as the hidden line: a length cue without giving away any words.
    const gone = (t) => `<span class="pq-gone" style="width:${Math.max(4, Math.round(t.trim().length * 0.48))}em"></span>`;
    function draw(k) {
      recallShown.clear();
      gen += 1;
      VOICE.hush();
      step = k;
      const P = p();
      const parts = partsOf(P);
      part = Math.min(part, parts.length - 1);
      const { s, a, b } = parts[part];
      const mode = MODES[step];
      host.querySelectorAll("[data-step]").forEach((x, j) => {
        x.setAttribute("aria-pressed", String(j === step));
        x.classList.toggle("done", j < step);
      });
      const label = parts.length > 1 ? `Part ${part + 1} of ${parts.length}` : "Whole poem";
      pv = poemView(view, {
        base: 23,
        filter: (x) => x.s === s && x.l >= a && x.l < b,
        head: `<p class="pq-by">${cite(P)} · <b>${label}</b></p>`,
        lineHtml: mode === "recall" ? (t, s2, l) => (recallShown.has(l) ? shown(t) : gone(t)) : lineHtmlFor(mode),
      });
      // The part pager reuses the page arrows when the poem has several parts.
      const pager = $("[data-pager]", view.wrap);
      if (pv.pages.length < 2 && parts.length > 1) {
        pager.hidden = false;
        $("[data-pg]", pager).textContent = `${part + 1}/${parts.length}`;
        $("[data-prev]", pager).disabled = part === 0;
        $("[data-next-pg]", pager).disabled = part === parts.length - 1;
        pager.onclick = (event) => {
          if (event.target.closest("[data-prev]") && part > 0) part -= 1;
          else if (event.target.closest("[data-next-pg]") && part < parts.length - 1) part += 1;
          else return;
          draw(0);
        };
      }
      view.paper.onclick = (event) => {
        const h = event.target.closest("[data-peek]");
        if (h) h.classList.toggle("peek");
        const f = event.target.closest("[data-peekw]");
        if (f) f.textContent = f.textContent === f.dataset.word ? firstLetter(f.dataset.word) : f.dataset.word;
      };
      const act = $("[data-act]", host);
      act.onclick = null;
      if (mode === "recall") return recall({ s, a, b });
      act.innerHTML = `${step === 0 ? `<button type="button" class="pq-btn" data-read>🔈 Read it to me</button>` : ""}<button type="button" class="pq-btn primary" data-forward>Next step ▶</button>`;
      say(`<b>Step ${STEPS[step][0]}: ${STEPS[step][1]}.</b> ${STEPS[step][2]}`);
      if (step === 0) readAloud();
    }
    async function readAloud() {
      const g = gen;
      const { s, a, b } = partsOf(p())[part];
      await wait(400);
      for (let l = a; l < b; l++) {
        if (!alive(my) || g !== gen) return;
        view.paper.querySelectorAll(".pq-line.on").forEach((n) => n.classList.remove("on"));
        pv.find(s, l)?.classList.add("on");
        const ok = await speakLine(TEXT[poemId][s][l]);
        if (!ok || !alive(my) || g !== gen) return;
      }
      view.paper.querySelectorAll(".pq-line.on").forEach((n) => n.classList.remove("on"));
    }
    function recall({ s, a, b }) {
      const queue = [];
      for (let l = a; l < b; l++) queue.push(l);
      const had = new Set();
      const missed = new Set();
      let cur = null;
      const act = $("[data-act]", host);
      const showLine = (l, cls = "") => {
        recallShown.add(l);
        const node = pv.find(s, l);
        if (node) {
          node.innerHTML = shown(TEXT[poemId][s][l]);
          node.className = `pq-line ${cls}`;
        }
      };
      const nextLine = () => {
        if (!alive(my)) return;
        cur = queue.shift();
        if (cur === undefined) return finish();
        recallShown.delete(cur);
        const node = pv.find(s, cur);
        view.paper.querySelectorAll(".pq-line.on").forEach((n) => n.classList.remove("on"));
        if (node) {
          node.innerHTML = gone(TEXT[poemId][s][cur]);
          node.classList.add("on");
        }
        act.innerHTML = `<button type="button" class="pq-btn primary" data-reveal>👁 Show line ${cur - a + 1}</button>`;
        say(`Say line ${cur - a + 1} aloud from memory, then reveal it to check.${missed.has(cur) ? " <small>This is your second attempt at this line.</small>" : ""}`, { voice: false });
      };
      act.onclick = null;
      host.onclick = null;
      act.onclick = (event) => {
        if (!alive(my)) return;
        if (event.target.closest("[data-reveal]")) {
          showLine(cur, "on");
          act.innerHTML = `<button type="button" class="pq-btn good" data-had>✓ I had it, word for word</button><button type="button" class="pq-btn" data-not>✗ Not yet</button>`;
          say(`Check honestly, word for word and mark for mark. Did you have it?`, { voice: false });
        } else if (event.target.closest("[data-had]")) {
          if (!missed.has(cur)) had.add(cur);
          MUSIC.play("xylophone", 79, { gain: 0.3 });
          showLine(cur);
          nextLine();
        } else if (event.target.closest("[data-not]")) {
          if (!missed.has(cur)) {
            missed.add(cur);
            queue.push(cur);
          }
          showLine(cur, "dim");
          nextLine();
        }
      };
      const finish = () => {
        const total = b - a;
        const m = mem();
        const k = key();
        const prev = m[k] || { box: -1 };
        const allHad = had.size === total;
        const box = allHad ? Math.min(5, prev.box + 1) : 0;
        const gap = [1, 2, 4, 7, 14, 30][box];
        m[k] = { box, due: addDays(gap), title: p().title, last: today() };
        saveMem(m);
        window.OC?.count("lines recalled", had.size);
        for (let l = a; l < b; l++) showLine(l);
        if (allHad) {
          MUSIC.chime();
          confetti();
          shell.mark("p5", { done: true, mem: m });
        }
        const P = p();
        const [ps, pa, pb, model] = P.px;
        const overlaps = ps === s && pa < b && pb >= a;
        say(`You recalled <b>${had.size} of ${total}</b> lines word for word on the first attempt. ${allHad ? `Review this part again in <b>${gap} day${gap > 1 ? "s" : ""}</b>; each success lengthens the gap.` : `Review it again <b>tomorrow</b>: the lines you missed will come back sooner.`}`);
        act.innerHTML = `<button type="button" class="pq-btn primary" data-ex>💬 Explain it</button><button type="button" class="pq-btn" data-redo>🔁 Practice again</button>${partsOf(P).length > part + 1 ? `<button type="button" class="pq-btn" data-nextpart>Next part ▶</button>` : ""}`;
        act.onclick = (event) => {
          if (!alive(my)) return;
          if (event.target.closest("[data-redo]")) draw(3);
          else if (event.target.closest("[data-nextpart]")) {
            part += 1;
            draw(0);
          } else if (event.target.closest("[data-ex]"))
            explainIt({
              my,
              prompt: `Explain what this part of the poem means, in your own words. Understanding the meaning is the strongest aid to memory.`,
              model: overlaps ? esc(model) : "",
              doneLabel: "Back to memorizing ▶",
              onDone: () => alive(my) && units.p5(),
            });
        };
      };
      nextLine();
    }
    host.addEventListener("click", (event) => {
      if (!alive(my)) return;
      const st = event.target.closest("[data-step]");
      if (st) return draw(Number(st.dataset.step));
      if (event.target.closest("[data-forward]")) {
        window.OC?.touch();
        draw(Math.min(5, step + 1));
      } else if (event.target.closest("[data-read]")) readAloud();
    });
    // Start where review is due, if anything is.
    const due = Object.entries(mem())
      .filter(([, v]) => v.due <= today())
      .sort((x, y) => (x[1].due < y[1].due ? -1 : 1));
    if (due.length) {
      const [k] = due[0];
      const [id, pt] = k.split(":");
      if (BY[id]) {
        poemId = id;
        level = BY[id].lv;
        view.wrap.querySelectorAll("[data-lv]").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.lv === level)));
        view.setTitle();
        part = Number(pt);
        draw(5);
        say(`<b>Review due.</b> ${esc(BY[id].title)}, part ${part + 1}: say each line from memory, then check. <small>${due.length > 1 ? `${due.length - 1} more due today; see ⓘ.` : ""}</small>`);
        return;
      }
    }
    draw(0);
  },

  // ---------------------------------------------------------------- Recite
  p6() {
    const my = token;
    const view = frame();
    const CHECK = [["🧍", "Stood tall"], ["👀", "Looked up"], ["🐢", "Steady pace"], ["⏸️", "Paused at punctuation"], ["🎭", "Fitting expression"], ["🗣️", "Clear, carrying voice"]];
    let marks = [];
    let pv = null;
    let pauses = false;
    let recorder = null;
    let chunks = [];
    let audioUrl = null;
    const canRecord = !!(navigator.mediaDevices?.getUserMedia && window.MediaRecorder);
    const host = panel(`<div class="pq-check" data-check>${CHECK.map(([i, t], k) => `<button type="button" data-c="${k}" aria-pressed="false"><span aria-hidden="true">${i}</span>${t}</button>`).join("")}</div><div class="pq-row2"><button type="button" class="pq-btn" data-pauses>⏸️ Pauses</button>${
      canRecord ? `<button type="button" class="pq-btn" data-rec>⏺ Record</button><button type="button" class="pq-btn" data-play hidden>▶ Play back</button>` : ""
    }<button type="button" class="pq-btn primary" data-fin>✓ Finished</button><button type="button" class="pq-btn" data-real>🏠 For real</button></div>`);
    const pauseHtml = (t) => {
      const body = shown(t).replace(/([,;:.!?—)]+)(?=\s|$|”|’|")/g, `$1<span class="pq-pause" aria-label="pause">▮</span>`);
      return /[,;:.!?—)”’"]$/.test(t.trim().replace(/--$/, "—")) ? body : `${body} <span class="pq-run" aria-label="carry on">→</span>`;
    };
    const load = () => {
      pv = poemView(view, pauses ? { lineHtml: pauseHtml, head: `<p class="pq-by">${cite(BY[poemId])} · <span class="pq-pause">▮</span> pause · <span class="pq-run">→</span> carry on</p>` } : {});
      say(`Recite <b>${esc(BY[poemId].title)}</b> aloud${canRecord ? ", or record yourself and play it back" : " to a grown-up"}. Then tick each point you achieved.`);
    };
    view.onLevel = load;
    view.onPoem = load;
    const stopRec = () => {
      try {
        if (recorder && recorder.state !== "inactive") recorder.stop();
      } catch {}
    };
    host.onclick = async (event) => {
      if (!alive(my)) return;
      const c = event.target.closest("[data-c]");
      if (c) {
        const on = c.getAttribute("aria-pressed") !== "true";
        c.setAttribute("aria-pressed", String(on));
        marks = [...host.querySelectorAll("[data-c][aria-pressed=true]")].map((x) => Number(x.dataset.c));
        MUSIC.play("xylophone", on ? 79 : 72, { gain: 0.25 });
        return;
      }
      if (event.target.closest("[data-pauses]")) {
        pauses = !pauses;
        event.target.closest("[data-pauses]").textContent = pauses ? "⏸️ Hide pauses" : "⏸️ Pauses";
        return load();
      }
      if (event.target.closest("[data-rec]")) {
        const b = event.target.closest("[data-rec]");
        if (recorder && recorder.state === "recording") {
          stopRec();
          b.textContent = "⏺ Record again";
          return;
        }
        try {
          VOICE.hush();
          const media = await navigator.mediaDevices.getUserMedia({ audio: true });
          if (!alive(my)) return media.getTracks().forEach((t) => t.stop());
          chunks = [];
          recorder = new MediaRecorder(media);
          recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
          recorder.onstop = () => {
            media.getTracks().forEach((t) => t.stop());
            if (audioUrl) URL.revokeObjectURL(audioUrl);
            audioUrl = URL.createObjectURL(new Blob(chunks, { type: recorder.mimeType || "audio/webm" }));
            const pb = host.querySelector("[data-play]");
            if (pb) pb.hidden = false;
            if (alive(my)) say("Recording saved on this device only. Press <b>Play back</b> and listen like a judge: pace, pauses and expression.");
          };
          recorder.start();
          b.textContent = "⏹ Stop recording";
          say("Recording. Stand tall, take a breath, and begin with the title and the poet's name.", { voice: false });
        } catch {
          say("Recording is not available here (no microphone, or permission was not given). Recite to a grown-up instead; that is the traditional way.");
          b.hidden = true;
        }
        return;
      }
      if (event.target.closest("[data-play]") && audioUrl) {
        const a = new Audio(audioUrl);
        a.play().catch(() => say("Playback is not available on this device."));
        return;
      }
      if (event.target.closest("[data-real]")) return realCard();
      if (event.target.closest("[data-fin]")) {
        stopRec();
        if (marks.length < 3) {
          say(`Tick at least three points you honestly achieved. If you could not, recite once more, focusing on one point. <small>${marks.length} ticked.</small>`);
          return;
        }
        window.OC?.count("recitations");
        explainIt({
          my,
          prompt: `Find one place where a sentence runs on past the end of a line, and one place where you paused in the middle of a line. Explain why the punctuation, not the line break, decides where to pause.`,
          model: `In "Silver", line 1 ends without punctuation ("now the moon"), so the voice carries straight on to "Walks the night". In "Dust of Snow" the whole poem is one sentence, so the voice runs on past almost every line end. Punctuation shows the grammar of the sentence; pausing there keeps the meaning whole, while stopping at every line end chops the sense apart.`,
          doneLabel: "Finish ✓",
          onDone() {
            if (!alive(my)) return;
            MUSIC.chime();
            confetti();
            shell.mark("p6", { done: true });
            const end = panel(`<div class="pq-row2"><button type="button" class="pq-btn primary" data-again>🔁 Recite again</button><button type="button" class="pq-btn" data-menu-open>Choose another game</button></div>`);
            say(`Well prepared. You ticked ${marks.length} of 6 points. Next time, choose a point you did not tick and make it your focus.`);
            end.onclick = (e) => {
              if (e.target.closest("[data-again]")) units.p6();
              else if (e.target.closest("[data-menu-open]")) $("[data-pick]")?.click();
            };
          },
        });
      }
    };
    function realCard() {
      const box = document.createElement("div");
      box.className = "pq-overlay";
      box.innerHTML = `<div class="pq-card"><h3>🏠 Try it for real: a family recital</h3><p><b>You need:</b> one poem you have memorized, a clear space to stand, and an audience of family.</p><ol><li>Copy the poem by hand once, keeping its line breaks and punctuation.</li><li>Announce the title and the poet before you begin.</li><li>Recite it from memory, looking at your listeners.</li><li>Afterwards, explain one image in the poem and why you chose it.</li></ol><p class="pq-safe">With a grown-up: choose a quiet time, and ask your listeners for one strength and one thing to improve.</p><div class="pq-row2"><button type="button" class="pq-btn primary" data-close>✕ Close</button></div></div>`;
      view.wrap.appendChild(box);
      box.addEventListener("click", (e) => e.target.closest("[data-close]") && box.remove());
    }
    units._stopRec = stopRec;
    load();
  },
};

const shell = SHELL({
  units: UNITS,
  how: {
    p0: { icon: "👀", title: "See it", steps: ["Watch each scene and listen.", "Press Next ▶ to continue.", "Press the last button to begin reading."] },
    p1: { icon: "📖", title: "Read & hear", steps: ["Choose a poem; read it silently first.", "Press Listen: the voice reads, line by line.", "Press Read along and read each line aloud after the voice."] },
    p2: { icon: "🥁", title: "Meter", steps: ["Say the line aloud.", "Tap every stressed syllable, then press Check.", "Name the foot: iamb, trochee, anapest or dactyl."] },
    p3: { icon: "🔤", title: "Rhyme scheme", steps: ["Read the end words aloud.", "Give each new end-sound a letter: A, B, C…", "Judge full rhymes and slant rhymes by ear."] },
    p4: { icon: "🎨", title: "Imagery & figures", steps: ["Read the line or the poem.", "Name the figure of speech, or answer the question.", "Every answer must rest on words in the poem."] },
    p5: { icon: "🧠", title: "Memorise", steps: ["Read the passage whole, aloud.", "Work through the steps as words disappear.", "Recall each line, check it, and come back on review days."] },
    p6: { icon: "🎤", title: "Recite", steps: ["Recite the poem aloud, or record yourself.", "Pause at punctuation, not at every line end.", "Tick the points you honestly achieved."] },
  },
  start: "p0",
  onStop() {
    token += 1;
    units._stopRec?.();
    units._stopRec = null;
    VOICE.hush();
    const p = $("[data-panel]");
    if (p) p.onclick = null;
  },
  subject: "Reading",
  activity: "Poetry & Recitation",
  onUnit(id) {
    token += 1;
    VOICE.hush();
    const s = shell.progress().pq || {};
    if (s.level && LEVELS.some((l) => l[0] === s.level)) level = s.level;
    if (s.poem && BY[s.poem]) poemId = s.poem;
    if (BY[poemId].lv !== level) poemId = poemsAt()[0].id;
    units[id]();
  },
});
MUSIC.preload("woodblock", [72, 76]);
MUSIC.preload("xylophone", [72, 76, 79]);
</script>
