// ---------- Voice: never let text-to-speech read Latin spelling ----------
// Latin is shown as <i class="la" data-v="...">word</i>. The voice says the English
// "how to say it" letters instead, and skips the visible (PRON) guide.
const speakAsyncRaw = VOICE.speakAsync;
const ABBR = [["a.m.", "A M"], ["p.m.", "P M"], ["e.g.", "E G"], ["i.e.", "I E"], ["etc.", "et cetera"], ["vs.", "versus"], ["P.S.", "P S"], ["A.D.", "A D"]];
const forVoice = (html) =>
  ABBR.reduce((h, [a, b]) => h.split(a).join(b), String(html))
    .replace(/<small class="pr">[\s\S]*?<\/small>/g, "")
    .replace(/<i class="la" data-v="([^"]*)">[\s\S]*?<\/i>/g, "$1");
VOICE.speakAsync = (html) => speakAsyncRaw(forVoice(html));
VOICE.speak = (html) => void VOICE.speakAsync(html);
const spoken = (pr) => pr.toLowerCase().replace(/-/g, " ");
const la = (word, pr) => `<i class="la" data-v="${spoken(pr)}">${word}</i>`;
const lap = (word, pr) => `${la(word, pr)}<small class="pr"> (${pr})</small>`;

function fresh() {
  stage.innerHTML = "";
  view = makeSvg(`0 0 ${W} ${H}`, stage);
  return view;
}

// A picture for a word: an emoji, a crown on top, or a coloured sky behind.
function pic(g, x, y, w, size) {
  if (w.bg) el("rect", { x: x - size * 0.62, y: y - size * 0.55, width: size * 1.24, height: size * 1.1, rx: 24, fill: w.bg }, g);
  if (w.crown) {
    emoji(g, x, y - size * 0.4, "👑", size * 0.5);
    emoji(g, x, y + size * 0.14, w.pic, size * 0.78);
  } else emoji(g, x, y, w.pic, w.pic.length > 3 && !w.pic.includes("‍") ? size * 0.7 : size);
}
function card(g, x, y, w, h, fill = "#fffcf6") {
  return el("rect", { x, y, width: w, height: h, rx: 26, fill, stroke: "#d9cdb5", "stroke-width": 4 }, g);
}
// Big Latin word with its "how to say it" guide underneath.
function latinCard(v, word, pr, y = 30, extra = "") {
  const width = Math.max(420, Math.min(900, word.length * 46 + 120));
  card(v, 500 - width / 2, y, width, 170);
  text(v, 500, y + 92, word, { "font-size": word.length > 14 ? 58 : 76, fill: "var(--accent-dark)", "font-style": "italic", "font-weight": 900 });
  text(v, 500, y + 146, `say: ${pr}${extra}`, { "font-size": 30, fill: "#7a6552", "font-weight": 700 });
}
function englishCard(v, words, y = 30, size = 64) {
  const width = Math.max(380, Math.min(920, words.length * 34 + 120));
  card(v, 500 - width / 2, y, width, 130, "#fff");
  text(v, 500, y + 86, words, { "font-size": words.length > 22 ? 44 : size, fill: "#2b1d12", "font-weight": 900 });
}
// Wrap a sentence onto lines of at most max characters; returns the y after the last line.
function lines(v, str, y, size, max, attrs = {}) {
  const out = [];
  for (const word of str.split(" ")) {
    const last = out[out.length - 1];
    if (last && (last + " " + word).length <= max) out[out.length - 1] = last + " " + word;
    else out.push(word);
  }
  out.forEach((line, i) => text(v, 500, y + i * size * 1.2, line, { "font-size": size, fill: "#2b1d12", "font-weight": 900, ...attrs }));
  return y + out.length * size * 1.2;
}
function caption(v, str, y, size = 34) {
  text(v, 500, y, str, { "font-size": size, fill: "#4d3c2e", "font-weight": 800 });
}

const levelRow = (cur) =>
  `<div class="ap-row"><div class="ap-chips" data-levels>${LEVELS.map(([k, l]) => `<button type="button" data-lv="${k}" aria-pressed="${k === cur}">${l}</button>`).join("")}</div><p class="ap-status" data-status></p><button type="button" class="la-again" data-again aria-label="Say it again">🔊</button></div>`;

// ---------- The round engine shared by every game ----------
// plan(level, extra) returns a list of questions:
// { draw(view), say, opts:[{label, ok, w?}], pics?:bool, hint, answer, why, then?:question }
function game(id, { plan, count, real, extra = "", extraKey, extraDefault }) {
  const my = token;
  const saved = shell.progress()[id] || {};
  let level = saved.level || "easy";
  let pickExtra = (extraKey && saved[extraKey]) || extraDefault;
  let qs = [];
  let round = 0;
  let first = 0;
  let clean = true;
  let q = null;
  let tries = 0;
  let busy = false;
  const root = panel(`${extra}${levelRow(level)}<div class="la-pick" data-choices></div>`);
  const host = $("[data-choices]");
  const status = (s) => ($("[data-status]").textContent = s || `Round ${round + 1} of ${qs.length}`);
  if (extraKey) root.querySelectorAll("[data-x]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.x === pickExtra)));

  const start = () => {
    qs = plan(level, pickExtra);
    round = 0;
    first = 0;
    ask(qs[0], true);
  };
  const ask = (next, newRound) => {
    q = next;
    tries = 0;
    busy = false;
    if (newRound) clean = true;
    status();
    if (!q.keep) {
      fresh();
      q.draw?.(view);
    }
    if (q.pics) {
      drawCards();
      host.innerHTML = "";
      host.onclick = null;
    } else {
      KIT.choices(host, q.opts, (o, b) => answer(o, b));
    }
    say(q.say);
  };
  const drawCards = () => {
    const n = q.opts.length;
    const w = 250;
    const gap = 40;
    const x0 = 500 - (n * w + (n - 1) * gap) / 2;
    q.opts.forEach((o, i) => {
      const g = el("g", { class: "la-card", "data-i": i }, view);
      o.node = g;
      o.rect = card(g, x0 + i * (w + gap), 238, w, 290);
      pic(g, x0 + i * (w + gap) + w / 2, 383, o.w, 150);
    });
    view.addEventListener("pointerdown", (event) => {
      const g = event.target.closest(".la-card");
      if (g && !g.dataset.off) answer(q.opts[Number(g.dataset.i)], g);
    });
  };
  const paint = (node, ok) => {
    if (node.tagName === "BUTTON") {
      node.classList.add(ok ? "right" : "wrong");
      if (!ok) node.disabled = true;
    } else {
      const rect = node.querySelector("rect");
      rect.setAttribute("stroke", ok ? "#22a05a" : "#d9822b");
      rect.setAttribute("fill", ok ? "#e6f6ea" : "#f6e6dc");
      rect.setAttribute("stroke-width", 8);
      if (!ok) {
        node.dataset.off = "1";
        node.setAttribute("opacity", 0.45);
      }
    }
  };
  const nodeOf = (o) => (q.pics ? o.node : host.querySelectorAll("[data-c]")[q.opts.indexOf(o)]);
  const nextButton = () => {
    const last = !q.then && round >= qs.length;
    host.innerHTML = `<div class="ap-buttons"><button type="button" class="primary" data-go data-pulse>${q.then ? "Next step ▶" : last ? "Finish ▶" : "Next ▶"}</button></div>`;
    host.onclick = (event) => {
      if (!event.target.closest("[data-go]") || my !== token) return;
      window.OC?.touch();
      if (q.then) ask(q.then, false);
      else if (round >= qs.length) finish();
      else ask(qs[round], true);
    };
  };
  const answer = (o, node) => {
    if (my !== token || busy) return;
    window.OC?.touch();
    if (o.ok) {
      busy = true;
      paint(node, true);
      MUSIC.chime();
      if (!q.then) {
        round += 1;
        if (clean) first += 1;
        window.OC?.count(count);
      }
      say(`${pick(GOOD)} ${q.why}`);
      nextButton();
    } else {
      tries += 1;
      clean = false;
      paint(node, false);
      MUSIC.oops();
      if (tries < 2) say(`Mistakes are how we learn. ${q.hint}`);
      else {
        busy = true;
        const right = q.opts.find((x) => x.ok);
        paint(nodeOf(right), true);
        if (!q.then) {
          round += 1;
          window.OC?.count(count);
        }
        say(`Let's look why. It is <b>${q.answer}</b>${/[.?!]$/.test(q.answer) ? "" : "."} ${q.why}`);
        nextButton();
      }
    }
  };
  const finish = () => {
    busy = true;
    const total = qs.length;
    fresh();
    for (let i = 0; i < 7; i++) emoji(view, 200 + i * 100, 60 + (i % 2) * 30, "🌿", 50);
    emoji(view, 500, 200, "🏛️", 150);
    text(view, 500, 380, "Optime!", { "font-size": 84, fill: "var(--accent-dark)", "font-style": "italic", "font-weight": 900 });
    text(view, 500, 432, "say: OP-tee-may = very well done", { "font-size": 30, fill: "#7a6552" });
    text(view, 500, 500, `${first} of ${total} right on the first try`, { "font-size": 32, fill: "#2b1d12" });
    confetti();
    MUSIC.chime();
    shell.mark(id, { done: true });
    status("All done!");
    const effort = first === total ? "You read every question carefully." : "You kept trying when it was tricky. That is how we learn.";
    say(`🎉 ${la("Optime!", "OP-tee-may")} That means very well done. You finished all ${total} rounds. ${effort}`);
    host.innerHTML = `<div class="ap-buttons"><button type="button" class="primary" data-real>🏠 Try it for real</button><button type="button" data-again2>🔁 Play again</button></div>`;
    host.onclick = (event) => {
      if (my !== token) return;
      if (event.target.closest("[data-real]")) realCard(real);
      else if (event.target.closest("[data-again2]")) start();
    };
  };
  root.onclick = (event) => {
    if (my !== token) return;
    const lv = event.target.closest("[data-lv]");
    const x = event.target.closest("[data-x]");
    if (event.target.closest("[data-again]")) {
      window.OC?.touch();
      if (q && !busy) say(q.say);
      else VOICE.speak($("[data-say]")?.innerHTML || "");
      return;
    }
    if (lv) {
      level = lv.dataset.lv;
      root.querySelectorAll("[data-lv]").forEach((b) => b.setAttribute("aria-pressed", String(b === lv)));
      shell.mark(id, { level });
    } else if (x) {
      pickExtra = x.dataset.x;
      root.querySelectorAll("[data-x]").forEach((b) => b.setAttribute("aria-pressed", String(b === x)));
      shell.mark(id, { [extraKey]: pickExtra });
    } else return;
    window.OC?.touch();
    VOICE.hush();
    start();
  };
  start();
  // Test hooks (used by the automated checks only).
  const tap = (ok) => {
    if (!q) return "no question";
    const o = q.opts.find((x) => x.ok === ok && !(nodeOf(x)?.disabled || nodeOf(x)?.dataset.off));
    if (!o) return "none";
    const node = nodeOf(o);
    if (q.pics) node.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true }));
    else node.click();
    return ok ? "right" : "wrong";
  };
  window.__lg = {
    state: () => ({ round, first, total: qs.length, level, tries, step: !!q?.keep, say: $("[data-say]")?.innerText }),
    right: () => tap(true),
    wrong: () => tap(false),
    next: () => (host.querySelector("[data-go]")?.click(), "next"),
  };
}

function realCard(r) {
  document.querySelector(".la-real")?.remove();
  const box = document.createElement("div");
  box.className = "kt-how la-real";
  box.innerHTML = `<div class="kt-how-card" role="dialog" aria-label="Try it for real"><h2>🏠 Try it for real: ${r.title}</h2><p><b>You need:</b> ${r.need}</p><ol>${r.steps.map((s) => `<li>${s}</li>`).join("")}</ol><p class="safe">🧡 ${r.safe}</p><button type="button" class="kt-go">✓ OK!</button></div>`;
  document.body.appendChild(box);
  VOICE.speak(`Try it for real: ${r.title}. You need: ${r.need}. ${r.steps.join(" ")} ${r.safe}`);
  box.querySelector(".kt-go").addEventListener("click", () => {
    VOICE.hush();
    box.remove();
  });
}

// ---------- Question makers ----------
function wordQ(level, w, pool = THEMES[w.theme].words) {
  const name = lap(w.la, w.pr);
  const isAct = w.theme === "actions";
  const why = `${name} means <b>${w.en}</b>.${isAct ? " The -o at the end means I." : ""}${w.note ? ` ${w.note}` : ""}`;
  const hint = `Clue: ${w.clue} Which one fits?`;
  if (level === "easy") {
    const others = sample(pool.filter((p) => !p.noPic), 2, [w]);
    return {
      pics: true,
      draw: (v) => latinCard(v, w.la, w.pr),
      opts: shuffle([w, ...others]).map((p) => ({ w: p, ok: p === w })),
      say: `Which picture is ${name}? Tap it.`,
      hint,
      answer: `the ${w.en} picture`,
      why,
    };
  }
  if (level === "medium") {
    const others = sample(pool, 2, [w]);
    return {
      draw(v) {
        el("circle", { cx: 500, cy: 250, r: 190, fill: "var(--accent-soft)" }, v);
        pic(v, 500, 250, w, 230);
      },
      opts: shuffle([w, ...others]).map((p) => ({ label: `<i>${p.la}</i>`, ok: p === w })),
      say: `What is this in Latin? Tap the word.`,
      hint,
      answer: w.la,
      why,
    };
  }
  const others = sample(pool, 3, [w]);
  return {
    draw(v) {
      englishCard(v, w.en, 60, 76);
      if (!w.noPic) pic(v, 500, 360, w, 190);
      else caption(v, w.clue, 330, 32);
    },
    opts: shuffle([w, ...others]).map((p) => ({ label: `<i>${p.la}</i>`, ok: p === w })),
    say: `How do you say <b>${w.en}</b> in Latin?`,
    hint: `${isAct ? "Action words end in -o, which means I. " : ""}Clue: ${w.clue} Think back to the pictures.`,
    answer: w.la,
    why,
  };
}

function countQ(n) {
  const num = NUMS[n - 1];
  const glyph = pick(["🍎", "🐞", "⭐", "🐟", "🌼", "🎈"]);
  const others = sample(NUMS, 2, [num]);
  return {
    draw(v) {
      const rows = n > 5 ? 2 : 1;
      for (let i = 0; i < n; i++) {
        const r = Math.floor(i / 5);
        const inRow = r === 0 ? Math.min(5, n) : n - 5;
        const c = i % 5;
        emoji(v, 500 + (c - (inRow - 1) / 2) * 170, rows === 1 ? 280 : 175 + r * 210, glyph, 120);
      }
    },
    opts: shuffle([num, ...others]).map((p) => ({ label: `<i>${p.la}</i>`, ok: p === num })),
    say: `How many? Tap the Latin number.`,
    hint: `Did you count each one? Touch each picture and count. Then find the Latin word. ${num.clue}`,
    answer: num.la,
    why: `There are ${n}. ${n} is ${lap(num.la, num.pr)}.`,
  };
}
function numWordQ(n) {
  const num = NUMS[n - 1];
  const others = sample(NUMS, 3, [num]).map((x) => x.n);
  return {
    draw: (v) => {
      latinCard(v, num.la, num.pr, 150);
      caption(v, "Which number is this?", 420, 36);
    },
    opts: [n, ...others].sort((a, b) => a - b).map((x) => ({ label: String(x), ok: x === n })),
    say: `Which number is ${lap(num.la, num.pr)}?`,
    hint: num.clue,
    answer: String(n),
    why: `${lap(num.la, num.pr)} is ${n}.`,
  };
}
function numHardQ(item) {
  const num = NUMS[item.n - 1];
  const others = sample(NUMS, 3, [num]);
  const q = {
    draw(v) {
      englishCard(v, item.eng, 50, 76);
      emoji(v, 500, 330, item.pic, item.pic.length > 3 ? 120 : 170);
    },
    opts: shuffle([num, ...others]).map((p) => ({ label: `<i>${p.la}</i> <small>${p.n}</small>`, ok: p === num })),
    say: `Which Latin number is hiding in <b>${item.eng}</b>?`,
    hint: `Look at the start of ${item.eng}. Which Latin number begins the same way?`,
    answer: num.la,
    why: `${lap(num.la, num.pr)} is ${item.n}. ${item.why}`,
  };
  if (item.sept)
    q.then = {
      keep: true,
      opts: shuffle([
        { label: "The old Roman year began in March", ok: true },
        { label: "The Romans could only count to 7", ok: false },
        { label: "September is the coldest month", ok: false },
      ]),
      say: `Septem means 7, but September is month 9. Why?`,
      hint: `Count the months from March: March, April, May… Which number is September?`,
      answer: "The old Roman year began in March",
      why: `March was month 1, so September was month 7. Later the year started in January, and September became month 9.`,
    };
  return q;
}

function derivQ(level, d, pool = DERIV) {
  const w = d.w;
  const name = lap(w.la, w.pr);
  const stem = d.stem ? ` (in long words: ${d.stem})` : "";
  if (level === "hard") {
    const roots = sample(pool, 3, [d]);
    const meanings = sample(pool, 2, [d]);
    return {
      draw(v) {
        englishCard(v, d.eng, 60, 76);
        emoji(v, 500, 340, d.pic, d.pic.length > 3 ? 120 : 170);
      },
      opts: shuffle([d, ...roots]).map((p) => ({ label: `<i>${p.la}</i>`, ok: p === d })),
      say: `Which Latin word is hiding inside <b>${d.eng}</b>?`,
      hint: `Say ${d.eng} slowly. Which Latin word's letters can you find inside it?`,
      answer: w.la,
      why: `${name} means <b>${w.en}</b>${stem}.`,
      then: {
        keep: true,
        opts: shuffle([d, ...meanings]).map((p) => ({ label: p.means, ok: p === d })),
        say: `${name} means ${w.en}. So what does <b>${d.eng}</b> mean?`,
        hint: `${w.la} means ${w.en}. Which meaning has ${w.en} in it?`,
        answer: d.means,
        why: d.why,
      },
    };
  }
  const n = level === "easy" ? 2 : 3;
  const others = sample(pool, n, [d]);
  return {
    draw(v) {
      latinCard(v, w.la, w.pr, 40, `   ·   ${w.en}`);
      if (level === "easy") emoji(v, 500, 360, w.noPic ? d.pic : w.pic, 170);
      else caption(v, "Which English word grew from it?", 330, 36);
    },
    opts: shuffle([d, ...others]).map((p) => ({ label: p.eng, ok: p === d })),
    say: `${name} means <b>${w.en}</b>. Which English word comes from it?`,
    hint: d.eng.toLowerCase().startsWith((d.stem || w.la).replace("-", "").slice(0, 3)) ? `Look at the first letters of each word. Which one starts like ${d.stem || w.la}?` : `${w.la} means ${w.en}. Which English word is about ${w.en}?`,
    answer: d.eng,
    why: d.why,
  };
}

function greetQ(level, g) {
  const n = level === "hard" ? 3 : 2;
  let others;
  if (level === "hard") {
    const twin = { salve: "salvete", salvete: "salve", vale: "valete", valete: "vale" }[g.la];
    others = twin ? [GREET.find((x) => x.la === twin), ...sample(GREET, 2, [g, GREET.find((x) => x.la === twin)])] : sample(GREET, n, [g]);
  } else others = sample(GREET, n, [g]);
  return {
    draw(v) {
      card(v, 140, 20, 720, 270, "#fff");
      const gap = g.scene.length > 3 ? 165 : 200;
      g.scene.forEach((s, i) => emoji(v, 500 + (i - (g.scene.length - 1) / 2) * gap, 155, s, g.scene.length > 3 ? 130 : 150));
      const y = lines(v, g.caption, 355, 46, 30, { fill: "#4d3c2e" });
      lines(v, g.ask, y + 6, 40, 34, { fill: "var(--accent-dark)" });
    },
    opts: shuffle([g, ...others]).map((p) => ({ label: `<i>${p.la}</i>${level === "easy" ? `<small>${p.en}</small>` : ""}`, ok: p === g })),
    say: `${g.caption} ${g.ask}`,
    hint: level === "hard" && /^(salve|vale)/.test(g.la) ? `Is it one person or everyone? Words ending in -te are for everyone.` : `What do you want to say? Think: hello, goodbye, thank you, yes or no?`,
    answer: g.la,
    why: `${lap(g.la, g.pr)} means <b>${g.en}</b>${/[?]$/.test(g.en) ? "" : "."}${g.note ? ` ${g.note}` : ""}${/^(salvete|valete)/.test(g.la) ? " The -te ending is for more than one person." : ""}`,
  };
}

function everyQ(level, e) {
  const draw = (v) => {
    card(v, 60, 30, 880, 230, "#fff");
    const big = e.motto ? e.ab : e.line;
    const two = big.length > 24;
    lines(v, big, two ? 128 : 165, two ? 54 : 62, 26, { "font-style": e.motto ? "italic" : "normal" });
    emoji(v, 500, 375, e.pic, e.pic.length > 3 ? 110 : 160);
    if (e.motto) caption(v, e.line, 530, 38);
  };
  if (level === "hard") {
    const others = sample(EVERY, 3, [e]);
    const meanings = sample(EVERY, 2, [e]);
    if (e.motto)
      return {
        draw,
        opts: shuffle([e, ...others]).map((p) => ({ label: p.en, ok: p === e })),
        say: `What does ${lap(e.ab, e.pr)} mean?`,
        hint: `Look for a Latin word you know inside it. What could it mean?`,
        answer: e.en,
        why: e.why,
      };
    const abOthers = sample(EVERY.filter((x) => !x.motto), 3, [e]);
    return {
      draw,
      opts: shuffle([e, ...abOthers]).map((p) => ({ label: `<i>${p.full}</i>`, ok: p === e })),
      say: `<b>${e.ab}</b> is short for which Latin words?`,
      hint: `Look at the letters in ${e.ab.replace(/\.$/, "")}. Which Latin words start with those letters?`,
      answer: e.full,
      why: `${e.ab} is short for ${lap(e.full, e.pr)}.`,
      then: {
        keep: true,
        opts: shuffle([e, ...meanings]).map((p) => ({ label: p.en, ok: p === e })),
        say: `So what does <b>${e.ab}</b> mean?`,
        hint: `Read the sentence again. What makes sense there?`,
        answer: e.en,
        why: e.why,
      },
    };
  }
  const others = sample(EVERY, level === "easy" ? 2 : 3, [e]);
  return {
    draw,
    opts: shuffle([e, ...others]).map((p) => ({ label: p.en, ok: p === e })),
    say: e.motto ? `${lap(e.ab, e.pr)}. ${e.line} What does it mean?` : `${e.line} What does <b>${e.ab}</b> mean?`,
    hint: e.motto ? `Is there a Latin word you know inside it?` : `Read the sentence again. Which meaning makes sense there?`,
    answer: e.en,
    why: e.why,
  };
}
