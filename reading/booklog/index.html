// Every year below was checked against Wikipedia or Wikidata (and Open Library for a few recent books);
// every Gutenberg number was checked against gutenberg.org. Descriptions are original; nothing is quoted.
// BOOKS-START
// s: shelf (t1 independent now · t2 longer classics · t3 adult-level classics · nf history & science · po poetry · wt wait for later)
// t title · a author · y year first published (ys: shown instead when the date is a range or approximate) · p approximate pages
// g genre · d one honest sentence · gid Project Gutenberg ebook number (public domain in the US) · fam the family plan says · ra good read-aloud
// c caution for a grown-up · yq year needs care (why) · w Wikipedia article used to verify the year
const BOOKS = [
  // ---------- Tier 1: classic children's literature, read independently now ----------
  { s: "t1", t: "Frog and Toad Are Friends", a: "Arnold Lobel", y: 1970, p: 64, g: "Animal story", fam: "Independent reading, ages 6–7", d: "Five very short stories about two friends; the sentences are simple, but the humor about patience, worry and loyalty is subtle enough to reward rereading.", w: "Frog and Toad Are Friends" },
  { s: "t1", t: "Mercy Watson to the Rescue", a: "Kate DiCamillo", y: 2005, p: 72, g: "Humour", fam: "Independent reading, ages 6–7", d: "A comic adventure about a pig who loves buttered toast; light, quick reading whose fun lies in the gap between what Mercy wants and what the adults think is happening.", w: "Mercy Watson" },
  { s: "t1", t: "Dinosaurs Before Dark (Magic Tree House 1)", a: "Mary Pope Osborne", y: 1992, p: 68, g: "Historical fiction", fam: "Independent reading, ages 6–7", d: "The first of a long time-travel series; the prose is plain and formulaic, so its real value is as a doorway into a period that you then study in a proper nonfiction book.", w: "Magic Tree House" },
  { s: "t1", t: "Encyclopedia Brown, Boy Detective", a: "Donald J. Sobol", y: 1963, p: 90, g: "Mystery", fam: "Independent reading, ages 7–8", d: "Ten short cases, each ending with a challenge to find the clue yourself before reading the solution at the back, which makes it a genuine exercise in reasoning from evidence.", w: "Encyclopedia Brown" },
  { s: "t1", t: "Nate the Great", a: "Marjorie Weinman Sharmat", y: 1972, p: 60, g: "Mystery", fam: "Independent reading, ages 7–8", d: "A deadpan boy detective solves a small case step by step; the method of listing facts and testing each idea is the point.", w: "Nate the Great" },
  { s: "t1", t: "Flat Stanley", a: "Jeff Brown", y: 1964, p: 80, g: "Humour", fam: "Independent reading, ages 7–8", d: "A boy flattened by a falling bulletin board finds the advantages and drawbacks of being half an inch thick; a short comic fantasy built on one idea followed logically.", w: "Flat Stanley" },
  { s: "t1", t: "Five on a Treasure Island", a: "Enid Blyton", y: 1942, p: 190, g: "Adventure", fam: "Independent reading, ages 7–8", d: "Four children and a dog explore an island and a shipwreck; fast and satisfying, though the writing is simple and some attitudes are of their time.", w: "Five on a Treasure Island" },
  { s: "t1", t: "Calvin and Hobbes", a: "Bill Watterson", y: 1987, p: 128, g: "Humour", fam: "Independent reading, ages 7–8 (comic strips count)", d: "The first collection of the comic strip about a boy and his tiger; the vocabulary is rich and the jokes are often about philosophy, science and how people argue.", w: "Calvin and Hobbes", yq: "The strip began in 1985; the first collection was published in 1987." },
  { s: "t1", t: "The Tale of Peter Rabbit", a: "Beatrix Potter", y: 1902, p: 72, g: "Animal story", gid: 14838, d: "A tiny book with exact, unsentimental prose and real consequences for disobedience; Potter never talks down to her reader.", w: "The Tale of Peter Rabbit", yq: "Privately printed in 1901; the first trade edition was 1902." },
  { s: "t1", t: "The Velveteen Rabbit", a: "Margery Williams", y: 1922, p: 40, g: "Fairy tale & fable", gid: 11757, d: "A toy rabbit learns what it means to become real through being loved; short, gentle and thoughtful, with a sad passage about illness.", w: "The Velveteen Rabbit" },
  { s: "t1", t: "Winnie-the-Pooh", a: "A. A. Milne", y: 1926, p: 160, g: "Humour", gid: 67098, ra: true, d: "Ten stories about a bear of very little brain and his friends; the comedy depends on precise wording, so it is funnier the better you read.", w: "Winnie-the-Pooh (book)" },
  { s: "t1", t: "The House at Pooh Corner", a: "A. A. Milne", y: 1928, p: 180, g: "Humour", gid: 73011, ra: true, d: "The sequel, ending with a farewell chapter about growing up that many adults consider the finest thing Milne wrote.", w: "The House at Pooh Corner" },
  { s: "t1", t: "Little Bear", a: "Else Holmelund Minarik", y: 1957, p: 64, g: "Animal story", d: "Four calm stories of a small bear and his mother; an easy reader written with real warmth and restraint.", w: "Little Bear (book)" },
  { s: "t1", t: "Mr. Popper's Penguins", a: "Richard and Florence Atwater", y: 1938, p: 140, g: "Humour", d: "A house painter receives a penguin from an Antarctic explorer and ends up with a performing troupe; comic, with some real penguin natural history worked in.", w: "Mr. Popper's Penguins" },
  { s: "t1", t: "A Bear Called Paddington", a: "Michael Bond", y: 1958, p: 160, g: "Humour", d: "A polite bear from Peru is taken in by a London family; each chapter is a self-contained comedy of misunderstanding.", w: "A Bear Called Paddington" },
  { s: "t1", t: "The Mouse and the Motorcycle", a: "Beverly Cleary", y: 1965, p: 160, g: "Fantasy", d: "A hotel mouse learns to ride a toy motorcycle and then has to act responsibly when a boy falls ill; a story about trust and keeping promises.", w: "The Mouse and the Motorcycle" },
  { s: "t1", t: "Ramona the Pest", a: "Beverly Cleary", y: 1968, p: 190, g: "Realistic fiction", d: "A sharply observed account of a kindergartner's first months of school, told with sympathy for how the world looks to a small child.", w: "Ramona the Pest" },
  { s: "t1", t: "Mrs. Piggle-Wiggle", a: "Betty MacDonald", y: 1947, p: 120, g: "Humour", d: "A neighbor cures children of bad habits with outrageous but logical consequences; each chapter is a small comic experiment in cause and effect.", w: "Mrs. Piggle-Wiggle" },
  { s: "t1", t: "Pippi Longstocking", a: "Astrid Lindgren", y: 1945, p: 160, g: "Humour", d: "The strongest girl in the world lives alone with a horse and a monkey and ignores every rule; translated from Swedish, it is anarchic and very funny.", c: "Older translations contain a dated, offensive word for Pippi's father; recent English editions have revised it.", w: "Pippi Longstocking" },
  { s: "t1", t: "The Courage of Sarah Noble", a: "Alice Dalgliesh", y: 1954, p: 60, g: "Historical fiction", d: "Based on a true story, an eight-year-old girl travels with her father to build a home in the Connecticut wilderness in 1707.", w: "The Courage of Sarah Noble" },
  { s: "t1", t: "Sarah, Plain and Tall", a: "Patricia MacLachlan", y: 1985, p: 60, g: "Historical fiction", d: "A woman from Maine answers a widowed prairie farmer's advertisement; spare, quiet prose in which a great deal is left unsaid.", w: "Sarah, Plain and Tall" },
  { s: "t1", t: "The Hundred Dresses", a: "Eleanor Estes", y: 1944, p: 80, g: "Realistic fiction", d: "Girls tease a poor classmate about her one faded dress and later realize what they have done; a serious short book about cruelty, silence and regret.", w: "The Hundred Dresses" },
  { s: "t1", t: "Owls in the Family", a: "Farley Mowat", y: 1961, p: 100, g: "Animal story", d: "A Saskatchewan boy raises two owls; a comic memoir-like story full of accurate observation of animals.", w: "Owls in the Family" },
  { s: "t1", t: "The Enormous Egg", a: "Oliver Butterworth", y: 1956, p: 190, g: "Science fiction", d: "A hen in New Hampshire hatches a triceratops; a witty story that also asks how scientists and politicians decide what is true.", w: "The Enormous Egg" },
  { s: "t1", t: "Old Mother West Wind", a: "Thornton W. Burgess", y: 1910, p: 120, g: "Animal story", gid: 2557, d: "Short tales of meadow animals, written to teach real natural history through character; simple, cheerful and old-fashioned.", w: "Old Mother West Wind" },
  { s: "t1", t: "Aesop's Fables", a: "Aesop (retold by Joseph Jacobs)", y: 1894, ys: "c. 600 BC (Jacobs's retelling 1894)", p: 120, g: "Fairy tale & fable", gid: 28, d: "Very short stories, each ending in a moral; read them to test whether the moral really follows from the story.", yq: "Aesop's dates are traditional, not documented; the year shown is Jacobs's English retelling.", w: "Aesop's Fables" },

  // ---------- Tier 2: longer classics ----------
  { s: "t2", t: "The Lion, the Witch and the Wardrobe", a: "C. S. Lewis", y: 1950, p: 200, g: "Fantasy", ra: true, fam: "Read-aloud now, one chapter a night; Narnia, one book a year", d: "Four children enter Narnia through a wardrobe; a tightly built fantasy about betrayal, sacrifice and forgiveness with a Christian allegory at its center.", c: "The scene at the Stone Table is frightening; read it together.", w: "The Lion, the Witch and the Wardrobe" },
  { s: "t2", t: "Charlotte's Web", a: "E. B. White", y: 1952, p: 184, g: "Animal story", ra: true, fam: "Read-aloud now, after Narnia", d: "A spider saves a pig by writing words in her web; often called one of the best-written American children's books, and honest about death.", w: "Charlotte's Web" },
  { s: "t2", t: "Stuart Little", a: "E. B. White", y: 1945, p: 130, g: "Fantasy", ra: true, fam: "Read-aloud, ages 6–7", d: "A mouse born into a New York family sets out on a quest; the prose is excellent, and the open ending is deliberate.", w: "Stuart Little" },
  { s: "t2", t: "My Father's Dragon", a: "Ruth Stiles Gannett", y: 1948, p: 90, g: "Fantasy", gid: 30017, ra: true, fam: "Read-aloud, ages 6–7", d: "A boy rescues a baby dragon from Wild Island using a knapsack of carefully chosen supplies; each problem is solved by thinking, not force.", w: "My Father's Dragon" },
  { s: "t2", t: "The Boxcar Children", a: "Gertrude Chandler Warner", y: 1924, p: 150, g: "Realistic fiction", gid: 42796, ra: true, fam: "Read-aloud, ages 6–7", d: "Four orphans make a home in an abandoned railway boxcar; plainly written, but full of practical problem-solving that is good for narration.", yq: "First published 1924 (the text on Gutenberg); the edition sold today is Warner's simplified 1942 revision.", w: "The Boxcar Children" },
  { s: "t2", t: "Little House in the Big Woods", a: "Laura Ingalls Wilder", y: 1932, p: 240, g: "Historical fiction", ra: true, fam: "Read-aloud, ages 6–7 and year 2", d: "A year of pioneer family life in 1870s Wisconsin, with exact descriptions of how food, tools and shelter were made by hand.", w: "Little House in the Big Woods" },
  { s: "t2", t: "Mary Poppins", a: "P. L. Travers", y: 1934, p: 200, g: "Fantasy", ra: true, fam: "Read-aloud, ages 6–7", d: "A stern, vain and magical nanny arrives on the east wind; stranger and sharper than the film.", c: "The chapter Bad Tuesday contained racial caricatures; Travers revised it in 1981, so choose a revised edition.", w: "Mary Poppins (book series)" },
  { s: "t2", t: "The Phantom Tollbooth", a: "Norton Juster", y: 1961, p: 256, g: "Fantasy", ra: true, fam: "Read-aloud, ages 7–8: read slowly", d: "A bored boy drives into a kingdom where words and numbers have stopped speaking to each other; nearly every page is a pun or a logical joke, so a word-loving reader gets the most from it.", w: "The Phantom Tollbooth" },
  { s: "t2", t: "A Wrinkle in Time", a: "Madeleine L'Engle", y: 1962, p: 230, g: "Science fiction", ra: true, fam: "Read-aloud, ages 7–8", d: "Meg Murry crosses space by a fold in time to rescue her father from a planet ruled by enforced sameness; science, faith and courage together.", c: "The planet Camazotz and the brain called IT can frighten; talk about them.", w: "A Wrinkle in Time" },
  { s: "t2", t: "The Borrowers", a: "Mary Norton", y: 1952, p: 180, g: "Fantasy", ra: true, fam: "Read-aloud, ages 7–8", d: "Tiny people live under the floor of an old English house and borrow what they need; a lesson in seeing ordinary things at a different scale.", w: "The Borrowers" },
  { s: "t2", t: "Prince Caspian", a: "C. S. Lewis", y: 1951, p: 220, g: "Fantasy", ra: true, fam: "Read-aloud, ages 7–8 (continue Narnia)", d: "The children return to a Narnia where centuries have passed and help a young prince reclaim his throne; about faith when evidence seems thin.", w: "Prince Caspian" },
  { s: "t2", t: "The Voyage of the Dawn Treader", a: "C. S. Lewis", y: 1952, p: 250, g: "Fantasy", ra: true, fam: "Read-aloud, ages 7–8 (continue Narnia)", d: "A sea voyage to the eastern edge of the world; each island tests a character, and a selfish boy is changed.", w: "The Voyage of the Dawn Treader" },
  { s: "t2", t: "The Silver Chair", a: "C. S. Lewis", y: 1953, p: 240, g: "Fantasy", ra: true, fam: "Narnia, one book a year", d: "Two schoolchildren and a gloomy marsh-wiggle search underground for a lost prince; about remembering instructions when appearances deceive.", w: "The Silver Chair" },
  { s: "t2", t: "The Magician's Nephew", a: "C. S. Lewis", y: 1955, p: 200, g: "Fantasy", ra: true, fam: "Narnia, one book a year", d: "The creation of Narnia, and how the White Witch first entered it; about temptation, curiosity and making amends.", w: "The Magician's Nephew" },
  { s: "t2", t: "The Jungle Book", a: "Rudyard Kipling", y: 1894, p: 210, g: "Animal story", gid: 236, ra: true, fam: "Read-aloud, ages 7–8", d: "Stories of Mowgli raised by wolves, and of the mongoose Rikki-Tikki-Tavi; the language is dense, rhythmic and very fine.", w: "The Jungle Book" },
  { s: "t2", t: "The Secret Garden", a: "Frances Hodgson Burnett", y: 1911, p: 330, g: "Realistic fiction", gid: 113, ra: true, fam: "Read-aloud, ages 7–8, and year 3", d: "A sour, neglected girl and a frightened invalid boy are changed by bringing a locked garden back to life.", c: "Mary's early contempt for her Indian servants, and some remarks about race, reflect the colonial attitudes of 1911; talk about them.", w: "The Secret Garden" },
  { s: "t2", t: "The Hobbit", a: "J. R. R. Tolkien", y: 1937, p: 310, g: "Fantasy", ra: true, fam: "Read-aloud, year 3: read slowly, use the maps", d: "A comfortable hobbit is drawn into a dwarf company's quest for a dragon's treasure; a quest story that becomes a serious book about greed and courage.", c: "A big, tense showdown in the final chapters; spiders and goblins may frighten.", w: "The Hobbit" },
  { s: "t2", t: "The Door in the Wall", a: "Marguerite de Angeli", y: 1949, p: 120, g: "Historical fiction", ra: true, fam: "Read-aloud with medieval history, year 2", d: "A noble boy in plague-time England loses the use of his legs and learns a craft, patience and a new kind of courage.", w: "The Door in the Wall (novel)" },
  { s: "t2", t: "Alice's Adventures in Wonderland", a: "Lewis Carroll", y: 1865, p: 190, g: "Fantasy", gid: 11, d: "A girl falls into a world of nonsense logic; written by an Oxford mathematician, it is full of puzzles about words, rules and reasoning.", w: "Alice's Adventures in Wonderland" },
  { s: "t2", t: "Through the Looking-Glass", a: "Lewis Carroll", y: 1871, p: 220, g: "Fantasy", gid: 12, d: "Alice crosses a giant chessboard to become a queen; even more logical play than the first book, including the poem Jabberwocky.", yq: "Published December 1871, though the first edition is dated 1872.", w: "Through the Looking-Glass" },
  { s: "t2", t: "The Wonderful Wizard of Oz", a: "L. Frank Baum", y: 1900, p: 260, g: "Fantasy", gid: 55, d: "Dorothy and three companions travel to the Emerald City to ask a great wizard for what each believes he lacks; watch whether the journey itself supplies it.", w: "The Wonderful Wizard of Oz" },
  { s: "t2", t: "Peter and Wendy (Peter Pan)", a: "J. M. Barrie", y: 1911, p: 240, g: "Fantasy", gid: 16, d: "The novel of Peter Pan, wittier and far more melancholy than the films, about children who refuse to grow up and what that costs.", c: "Its 'redskin' tribe is a crude stereotype of Native Americans; discuss it.", w: "Peter and Wendy" },
  { s: "t2", t: "A Little Princess", a: "Frances Hodgson Burnett", y: 1905, p: 240, g: "Realistic fiction", gid: 146, d: "A rich pupil at a London boarding school is left penniless and keeps her dignity and kindness through hardship.", w: "A Little Princess" },
  { s: "t2", t: "Heidi", a: "Johanna Spyri", y: 1880, ys: "1880–81", p: 300, g: "Realistic fiction", gid: 1448, d: "A Swiss orphan transforms her grandfather's life in the Alps and pines for the mountains when sent to the city; translated from German.", w: "Heidi" },
  { s: "t2", t: "The Wind in the Willows", a: "Kenneth Grahame", y: 1908, p: 260, g: "Animal story", gid: 289, ra: true, d: "Mole, Rat, Badger and the reckless Toad along an English river; some of the most beautiful prose in English children's literature.", w: "The Wind in the Willows" },
  { s: "t2", t: "Black Beauty", a: "Anna Sewell", y: 1877, p: 250, g: "Animal story", gid: 271, d: "A horse narrates his life with good and cruel owners; written to change how Victorian England treated working horses, and it helped to do so.", c: "Scenes of cruelty to horses, and the deaths of horses and of a man.", w: "Black Beauty" },
  { s: "t2", t: "Five Children and It", a: "E. Nesbit", y: 1902, p: 240, g: "Fantasy", gid: 778, d: "Children find a grumpy sand-fairy who grants a wish a day, and every wish goes wrong in a logical way.", c: "One chapter uses stereotyped 'Red Indians'.", w: "Five Children and It" },
  { s: "t2", t: "The Railway Children", a: "E. Nesbit", y: 1906, p: 230, g: "Realistic fiction", gid: 1874, d: "Three children move to the countryside after their father is mysteriously taken away, and find purpose in helping others along the railway.", w: "The Railway Children" },
  { s: "t2", t: "The Princess and the Goblin", a: "George MacDonald", y: 1872, p: 230, g: "Fantasy", gid: 708, d: "A princess and a miner's son defeat goblins under the mountain; a fairy tale about trusting what you cannot yet prove to others.", yq: "Serialised 1870–71; first book edition 1872.", w: "The Princess and the Goblin" },
  { s: "t2", t: "Understood Betsy", a: "Dorothy Canfield Fisher", y: 1916, p: 220, g: "Realistic fiction", gid: 5347, d: "A timid, over-protected city girl learns competence and independence on a Vermont farm; written by an advocate of Montessori education.", w: "Understood Betsy" },
  { s: "t2", t: "Anne of Green Gables", a: "L. M. Montgomery", y: 1908, p: 320, g: "Realistic fiction", gid: 45, d: "An imaginative, talkative orphan is adopted by mistake on Prince Edward Island; funny, wordy and moving.", w: "Anne of Green Gables" },
  { s: "t2", t: "The Adventures of Pinocchio", a: "Carlo Collodi", y: 1883, p: 220, g: "Fairy tale & fable", gid: 500, d: "A wooden puppet repeatedly chooses pleasure over duty and suffers the consequences; much darker and stranger than the film.", c: "Robbers catch Pinocchio in one frightening chapter (he escapes); read together.", w: "The Adventures of Pinocchio" },
  { s: "t2", t: "The Trumpet of the Swan", a: "E. B. White", y: 1970, p: 250, g: "Animal story", d: "A trumpeter swan born without a voice learns to read, write and play the trumpet to repay his father's debt.", w: "The Trumpet of the Swan" },
  { s: "t2", t: "Mrs. Frisby and the Rats of NIMH", a: "Robert C. O'Brien", y: 1971, p: 230, g: "Science fiction", d: "A widowed mouse seeks help from rats made intelligent in a laboratory; about science, responsibility and what a society owes others.", w: "Mrs. Frisby and the Rats of NIMH" },
  { s: "t2", t: "The Twenty-One Balloons", a: "William Pène du Bois", y: 1947, p: 180, g: "Adventure", d: "A professor's balloon voyage lands him on Krakatoa among a secret society of inventors, just before the real eruption of 1883.", w: "The Twenty-One Balloons" },
  { s: "t2", t: "Half Magic", a: "Edward Eager", y: 1954, p: 200, g: "Fantasy", d: "A coin grants exactly half of each wish, so the children must learn to wish for twice what they want; a natural fractions puzzle.", w: "Half Magic" },

const SHELVES = [
  ["fam", "Family plan", "Books named in your family's plan, earliest first."],
  ["t1", "Tier 1", "Classic children's books to read on your own now: short, well written and worth reading with care."],
  ["t2", "Tier 2", "Longer classics, mostly 150 to 400 pages. Many are also excellent read-alouds."],
  ["t3", "Tier 3", "Books written for adults or older readers whose content suits you now. The language is harder; the reward is greater."],
  ["ra", "Read-alouds", "Books best shared aloud with a grown-up, so that you can stop and talk about them."],
  ["nf", "History & science", "True books. Ask of each one: is it true, how does the author know, and is the source reliable?"],
  ["po", "Poetry", "Read poems aloud: rhythm and sound carry half of their meaning."],
  ["wt", "Wait for later", "Great books whose subjects need more experience. Each entry says why, and when."],
];
const SHELF_NAME = Object.fromEntries(SHELVES.map(([k, n]) => [k, n]));
const famRank = (b) => {
  const f = b.fam || "";
  return /now|6–7/.test(f) ? 0 : /7–8/.test(f) ? 1 : /year 2|Narnia/.test(f) ? 2 : /year 3/.test(f) ? 3 : /year [45]|age 9|9–10|age 10/.test(f) ? 4 : 5;
};
function shelfBooks(key) {
  if (key === "fam") return BOOKS.filter((b) => b.fam).sort((a, b) => famRank(a) - famRank(b));
  const list = key === "ra" ? BOOKS.filter((b) => b.ra && b.s !== "wt") : BOOKS.filter((b) => b.s === key);
  return [...list].sort((a, b) => (b.fam ? 1 : 0) - (a.fam ? 1 : 0));
}
const yearText = (b) => b.ys || (b.y < 0 ? `c. ${-b.y} BC` : String(b.y));
// US public domain: a work enters it on 1 January, 96 years after publication (in 2026, everything published in 1930 or earlier),
// plus later books on Project Gutenberg, which it lists only when their US copyright was never renewed.
const isPD = (b) => b.gid > 0 || (b.y > 0 && b.y <= new Date().getFullYear() - 96);
const gutUrl = (b) => `https://www.gutenberg.org/ebooks/${b.gid}`;
const norm = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
const findBook = (title) => BOOKS.find((b) => norm(b.t) === norm(title)) || null;

// one word that names something in the book (a character, an event, a quality of the writing) does.
const VAGUE = new Set("it it's its was is a an the and i i'm really very so such because good bad fun boring great nice ok okay cool awesome amazing best worst liked like love loved enjoy enjoyed favorite favorite funny exciting interesting sad happy scary didn't don't wasn't isn't didn t don wasn isn book books story this that me my of to too just kind much lot lots ever all whole thing things stuff pretty super fine wanted want read reading more".split(" "));
function reasonProblem(why) {
  const words = String(why || "").trim().split(/\s+/).filter(Boolean);
  if (!words.length) return "Add one line saying why. A rating needs a reason.";
  const content = words.map((w) => w.toLowerCase().replace(/[’]/g, "'").replace(/[^a-z\u00c0-\u024f']/g, "").replace(/^'+|'+$/g, "")).filter((w) => w && !VAGUE.has(w));
  if (words.length < 3 || content.length < 1) return "Not quite. That describes a feeling, not the book. Name a character, an event, a scene or an idea from the book that earned this rating.";
  return "";
}

const W = 1000;
function wrapText(parent, x, y, str, { size = 26, max = 40, lh = 1.28, ...attrs } = {}) {
  const lines = [];
  let line = "";
  for (const word of str.split(" ")) {
    if (line && (line + " " + word).length > max) {
      lines.push(line);
      line = word;
    } else line = line ? `${line} ${word}` : word;
  }
  if (line) lines.push(line);
  return lines.map((l, i) => text(parent, x, y + i * size * lh, l, { "font-size": size, fill: "#2b1d12", ...attrs }));
}

        ${b.yq ? `<p class="bl-note"><b>About the date:</b> ${esc(b.yq)}</p>` : ""}
        <p class="bl-note">${b.gid > 0 ? `<b>Public domain in the United States.</b> Free to read: <a href="${gutUrl(b)}" target="_blank" rel="noopener">Project Gutenberg ebook #${b.gid}</a>.` : isPD(b) ? `<b>Public domain in the United States</b>, but not on Project Gutenberg; borrow it from a library.` : `<b>In copyright.</b> Borrow it from a library or buy a copy.`}</p>
        <p class="bl-note explain"><b>Before you begin:</b> read the first page, then predict in one sentence what the book will be about. After you finish, check: was your prediction right, and what in the first page misled or guided you?</p>
      </article>`;
      say(`<b>${esc(b.t)}</b> (${yearText(b)}). ${esc(b.d)}`);
      stage.querySelector("[data-back]").onclick = showList;
      stage.querySelector("[data-add]").onclick = () => {
        if (mine) pendingEdit = mine.id;
        else {
          const e = blankEntry(b);
          saveEntry(e);
          pendingEdit = e.id;
          window.OC?.count("books added");
          window.OC?.note("Book", b.t);
        }
        MUSIC.chime();
        shell.mark("bl1", { done: true });
        shell.go("bl2");
      };
    };
    say("Choose a shelf, then a book. Your family's planned books come first.");
    showList();
  },

  // ---------- 2. My reading log ----------
  bl2() {
    const my = token;
    panel("");
    const showLog = () => {
      if (my !== token) return;
      const list = entries();
      const body = frame({ top: `<p class="bl-intro tight"><b>${esc(shell.learner())}'s reading log</b> · ${list.length} ${list.length === 1 ? "book" : "books"}</p><button type="button" class="bl-btn primary" data-new>＋ Add a book</button>` });
      body.innerHTML = list.length
        ? `<div class="bl-list">${list
            .map((e) => {
              const status = e.finished ? `Finished ${niceDate(e.finished)}` : e.started ? `Reading since ${niceDate(e.started)}` : "Not started";
              const narr = e.narr || e.aloud ? "Narrated" : "No narration yet";
              return `<button type="button" class="bl-book" data-entry="${esc(e.id)}"><span class="bl-book-main"><b>${esc(e.title)}</b><small>${esc(e.author || "")}${e.author ? " · " : ""}${status}${e.pages ? ` · ${e.pages} pages` : ""}</small></span><span class="bl-tags">${e.rating ? `<span class="bl-tag">${"★".repeat(e.rating)}${"☆".repeat(5 - e.rating)}</span>` : ""}<span class="bl-tag${e.narr || e.aloud ? " ok" : ""}">${narr}</span>${(e.vocab || []).length ? `<span class="bl-tag">${e.vocab.length} ${e.vocab.length === 1 ? "word" : "words"}</span>` : ""}</span></button>`;
            })
            .join("")}</div>`
        : `<div class="bl-empty"><p class="bl-big">📖</p><p>Your log is empty. Add the book you are reading now, or choose one from <b>The reading list</b>.</p></div>`;
      stage.querySelector("[data-new]").onclick = () => showForm(blankEntry(null), true);
      body.onclick = (event) => {
        const b = event.target.closest("[data-entry]");
        if (b) showForm(entryOf(b.dataset.entry), false);
      };
      say(list.length ? "Tap a book to update it: pages, narration, rating or new words." : "Press <b>＋ Add a book</b> to begin your log.");
    };
    const showForm = (entry, isNew) => {
      if (my !== token || !entry) return showLog();
      const body = frame({
        top: `<button type="button" class="bl-btn" data-back>◀ My log</button><b class="bl-formtitle">${isNew ? "Add a book" : esc(entry.title)}</b>`,
        foot: `${isNew ? "" : `<button type="button" class="bl-btn danger" data-remove>Remove</button>`}<button type="button" class="bl-btn primary" data-save>✓ Save</button>`,
      });
      const book = findBook(entry.title);
      body.innerHTML = `<form class="bl-form" autocomplete="off" onsubmit="return false">
        <label class="bl-field wide"><span>Title</span><input name="title" list="bl-titles" value="${esc(entry.title)}" placeholder="Type or choose a title"></label>
        <datalist id="bl-titles">${BOOKS.map((b) => `<option value="${esc(b.t)}">`).join("")}</datalist>
        <label class="bl-field wide"><span>Author</span><input name="author" value="${esc(entry.author)}"></label>
        <label class="bl-field"><span>Started</span><input type="date" name="started" value="${esc(entry.started)}"></label>
        <label class="bl-field"><span>Finished</span><input type="date" name="finished" value="${esc(entry.finished)}"></label>
        <label class="bl-field"><span>Pages read</span><input type="number" inputmode="numeric" min="1" max="5000" name="pages" value="${esc(entry.pages)}" placeholder="${book ? `about ${book.p}` : ""}"></label>
        <div class="bl-field wide"><span>Narration · <i>Explain it:</i> in three to five sentences, tell what happened, in order and in your own words.</span>
          <textarea name="narr" rows="4" placeholder="Who, what they wanted, what stood in the way, how it ended.">${esc(entry.narr)}</textarea>
          <label class="bl-check"><input type="checkbox" name="aloud"${entry.aloud ? " checked" : ""}> I told it aloud to a grown-up instead</label></div>
        <div class="bl-field wide"><span>Rating</span><div class="bl-stars" data-stars>${[1, 2, 3, 4, 5].map((n) => `<button type="button" data-star="${n}" aria-pressed="${n <= (entry.rating || 0)}" aria-label="${n} of 5">${n <= (entry.rating || 0) ? "★" : "☆"}</button>`).join("")}<button type="button" class="bl-clear" data-star="0">clear</button></div></div>
        <label class="bl-field wide"><span>Why? Your reason must point to something in the book.</span><input name="why" value="${esc(entry.why)}" placeholder="e.g. a character, a scene, an idea"></label>
        <label class="bl-field wide"><span>New words I found (separate with commas)</span><input name="vocab" value="${esc((entry.vocab || []).join(", "))}" placeholder="nocturnal, reluctant, …"></label>
        <p class="bl-err" data-err role="alert"></p>
      </form>`;
      const form = $(".bl-form", body);
      let rating = entry.rating || 0;
      const paintStars = () => form.querySelectorAll("[data-star]").forEach((b) => {
        const n = Number(b.dataset.star);
        if (!n) return;
        b.textContent = n <= rating ? "★" : "☆";
        b.setAttribute("aria-pressed", String(n <= rating));
      });
      $("[data-stars]", form).onclick = (event) => {
        const b = event.target.closest("[data-star]");
        if (!b) return;
        rating = Number(b.dataset.star);
        paintStars();
        MUSIC.play("woodblock", 79, { gain: 0.25 });
        if (rating && !form.why.value.trim()) say("Now say why, pointing to something in the book.");
      };
      form.title.addEventListener("change", () => {
        const b = findBook(form.title.value);
        if (b && !form.author.value.trim()) form.author.value = b.a;
        if (b) form.pages.placeholder = `about ${b.p}`;
      });
      const err = (msg, field) => {
        $("[data-err]", form).textContent = msg;
        MUSIC.oops();
        say(msg);
        if (field) {
          field.focus({ preventScroll: true });
          field.scrollIntoView({ block: "center", behavior: "smooth" });
        }
      };
      stage.querySelector("[data-back]").onclick = showLog;
      let removing = false;
      const removeBtn = stage.querySelector("[data-remove]");
      if (removeBtn)
        removeBtn.onclick = () => {
          if (!removing) {
            removing = true;
            removeBtn.textContent = "Tap again to remove";
            return say("Tap <b>Remove</b> again to delete this book from your log.");
          }
          // The store merges fields, so blank the content as well: a removed book keeps no text.
          shell.mark(KEY + entry.id, { removed: true, title: "", author: "", narr: "", why: "", vocab: [], answers: {} });
          showLog();
        };
      stage.querySelector("[data-save]").onclick = () => {
        const title = form.title.value.trim();
        if (!title) return err("Give the book's title first.", form.title);
        const started = form.started.value;
        const finished = form.finished.value;
        if (finished && started && finished < started) return err("Not quite. The finish date is earlier than the start date. Check both.", form.finished);
        if (finished && finished > today()) return err("The finish date is in the future. Fill it in when you finish.", form.finished);
        const pagesRaw = form.pages.value.trim();
        const pages = pagesRaw ? Math.round(Number(pagesRaw)) : "";
        if (pagesRaw && !(pages >= 1 && pages <= 5000)) return err("Pages must be a whole number between 1 and 5000.", form.pages);
        const why = form.why.value.trim();
        if (rating) {
          const problem = reasonProblem(why);
          if (problem) return err(problem, form.why);
        }
        const b = findBook(title);
        const vocab = [...new Set(form.vocab.value.split(/[,;\n]+/).map((w) => w.trim()).filter(Boolean))].slice(0, 60);
        const narr = form.narr.value.trim();
        const was = entryOf(entry.id);
        const next = { ...entry, title, author: form.author.value.trim() || b?.a || "", genre: b?.g || entry.genre || "", shelf: b?.s || entry.shelf || "", started, finished, pages, narr, aloud: form.aloud.checked, rating, why: rating ? why : "", vocab, answers: entry.answers || {} };
        saveEntry(next);
        shell.mark("bl2", { done: true });
        window.OC?.touch();
        if (isNew) {
          window.OC?.count("books added");
          window.OC?.note("Book", title);
        }
        if (narr && narr !== (was?.narr || "")) window.OC?.count("narrations");
        if (finished && !was?.finished) window.OC?.count("books finished");
        MUSIC.chime();
        showLog();
        const words = narr.split(/\s+/).filter(Boolean).length;
        say(
          finished && !was?.finished
            ? `Saved. You finished <i>${esc(title)}</i>. ${narr || form.aloud.checked ? "Your narration is recorded." : "Now narrate it: tell a grown-up what happened, in order, then tick the box."}`
            : narr && words < 25 && !form.aloud.checked
              ? `Saved. Your narration has ${words} words; a full narration usually needs three to five sentences. Add more when you can.`
              : "Saved.",
        );
      };
      say(isNew ? "Choose or type a title. Dates and pages can be added later." : "Update what has changed, then press <b>Save</b>.");
    };
    const target = pendingEdit;
    pendingEdit = null;
    if (target && entryOf(target)) showForm(entryOf(target), false);
    else showLog();
  },

  // ---------- 3. Narration prompts ----------
  bl3() {
    const my = token;
    panel("");
    const list = entries();
    let chosen = list[0]?.id || "";
    let tier = promptTierOf(entryOf(chosen));
    const show = () => {
      if (my !== token) return;
      const e = entryOf(chosen);
      const options = `<option value="">Choose a book from your log</option>${list.map((x) => `<option value="${esc(x.id)}"${x.id === chosen ? " selected" : ""}>${esc(x.title)}</option>`).join("")}`;
      const body = frame({ top: `<select class="bl-select" data-pick-book aria-label="Book">${options}</select>${chipsHtml(PROMPT_TABS, tier, "data-tier")}` });
      body.innerHTML = `${list.length ? "" : `<p class="bl-note">Add a book in <b>My reading log</b> first; then your answers can be saved with it. You can still read the prompts.</p>`}<div class="bl-prompts">${PROMPTS[tier]
        .map(([k, label, prompt, tip]) => {
          const ans = e?.answers?.[`${tier}:${k}`] || e?.answers?.[k] || {};
          return `<section class="bl-prompt" data-k="${k}"><h3>${label}</h3><p>${prompt}</p><p class="bl-tip">${tip}</p><textarea rows="3" placeholder="Write your answer, or tell it aloud and tick the box.">${esc(ans.text || "")}</textarea><div class="bl-row"><label class="bl-check"><input type="checkbox"${ans.aloud ? " checked" : ""}> Told aloud to a grown-up</label><button type="button" class="bl-btn primary small" data-save-k="${k}"${e ? "" : " disabled"}>✓ Save</button></div></section>`;
        })
        .join("")}</div>`;
      stage.querySelector("[data-pick-book]").onchange = (event) => {
        chosen = event.target.value;
        tier = promptTierOf(entryOf(chosen));
        show();
        if (chosen) say(`Prompts for <i>${esc(entryOf(chosen).title)}</i>. Choose one; you need not answer all four today.`);
      };
      stage.querySelector("[data-tier]").parentElement.onclick = (event) => {
        const b = event.target.closest("[data-tier]");
        if (!b) return;
        tier = b.dataset.tier;
        show();
      };
      body.onclick = (event) => {
        const b = event.target.closest("[data-save-k]");
        if (!b) return;
        const sec = b.closest(".bl-prompt");
        const textValue = sec.querySelector("textarea").value.trim();
        const aloud = sec.querySelector("input[type=checkbox]").checked;
        if (!textValue && !aloud) {
          MUSIC.oops();
          return say("Write an answer, or tell it aloud to a grown-up and tick the box.");
        }
        if (textValue && textValue.split(/\s+/).length < 8 && !aloud) {
          MUSIC.oops();
          return say("Not yet. Answer in at least two full sentences: give your idea, then the evidence from the book.");
        }
        const entry = entryOf(chosen);
        if (!entry) return;
        const answers = { ...(entry.answers || {}), [`${tier}:${b.dataset.saveK}`]: { text: textValue, aloud, on: today() } };
        saveEntry({ ...entry, answers });
        shell.mark("bl3", { done: true });
        window.OC?.count("narrations");
        window.OC?.touch();
        MUSIC.chime();
        b.textContent = "✓ Saved";
        say(`Saved with <i>${esc(entry.title)}</i>. ${b.dataset.saveK === "truth" ? "Good habit: always ask how the author knows." : "Well argued answers name the evidence; check that yours does."}`);
      };
    };
    show();
    say(list.length ? "Choose a book and a prompt. Answer one well rather than four quickly." : "These prompts work with any book. Add books to your log to save answers.");
  },

  // ---------- 4. My progress ----------
  bl4() {
    const my = token;
    panel("");
    const list = entries();
    const done = list.filter((e) => e.finished);
    const pages = list.reduce((s, e) => s + (Number(e.pages) || 0), 0);
    const narrated = list.filter((e) => e.narr || e.aloud || Object.keys(e.answers || {}).length).length;
    const words = new Set(list.flatMap((e) => (e.vocab || []).map((w) => w.toLowerCase()))).size;
    const genreCount = {};
    for (const e of done) if (e.genre) genreCount[e.genre] = (genreCount[e.genre] || 0) + 1;
    const shelfCount = {};
    for (const e of done) if (e.shelf) shelfCount[e.shelf] = (shelfCount[e.shelf] || 0) + 1;
    const logged = loggedTitles();
    const genres = [...new Set([...GENRES, ...Object.keys(genreCount)])].sort();
    const missing = genres.filter((g) => !genreCount[g]);
    const ideas = missing
      .map((g) => BOOKS.find((b) => b.g === g && b.s !== "wt" && !logged.has(norm(b.t))))
      .filter(Boolean)
      .slice(0, 3);
    const body = frame({});
    body.innerHTML = `<div class="bl-stats">
        <div><b>${done.length}</b><span>books finished</span></div>
        <div><b>${list.length - done.length}</b><span>in progress</span></div>
        <div><b>${pages.toLocaleString("en-US")}</b><span>pages read</span></div>
        <div><b>${narrated}</b><span>books narrated</span></div>
        <div><b>${words}</b><span>words collected</span></div>
      </div>
      <h3 class="bl-h">Kinds of books finished <small>(${genres.length - missing.length} of ${genres.length})</small></h3>
      <div class="bl-genres">${genres.map((g) => `<span class="${genreCount[g] ? "on" : ""}">${esc(g)}${genreCount[g] ? ` · ${genreCount[g]}` : ""}</span>`).join("")}</div>
      <h3 class="bl-h">Shelves</h3>
      <div class="bl-genres">${SHELVES.filter(([k]) => !["fam", "ra"].includes(k)).map(([k, n]) => `<span class="${shelfCount[k] ? "on" : ""}">${n}${shelfCount[k] ? ` · ${shelfCount[k]}` : ""}</span>`).join("")}</div>
      ${ideas.length ? `<h3 class="bl-h">To read more widely, you might try</h3><ul class="bl-ideas">${ideas.map((b) => `<li><b>${esc(b.t)}</b> (${esc(b.g)}, ${yearText(b)}): ${esc(b.d)}</li>`).join("")}</ul>` : ""}
      <p class="bl-note explain"><b>Explain it:</b> look at the kinds of books above. In two to four sentences, say which kind you have read least and what you might learn from it. Then name the book that most changed your mind about something, and say what changed.</p>`;
    say(done.length ? `You have finished ${done.length} ${done.length === 1 ? "book" : "books"}. Look at the kinds of books you have not yet tried.` : "Nothing finished yet. Progress here grows from your log, one honest entry at a time.");
    shell.mark("bl4", { done: true });
    window.OC?.touch();
  },
};

.bl-prompt{padding:10px 14px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px #eadfcd,0 3px 0 #eadfcd}
.bl-prompt h3{margin:0 0 4px;color:var(--accent-dark);font:900 17px/1.2 var(--sans)}
.bl-prompt p{margin:0 0 6px}
.bl-prompt .bl-tip{color:#8a7764;font:700 13.5px/1.35 var(--sans)}
.bl-prompt textarea{width:100%;box-sizing:border-box;padding:8px 10px;border:2px solid #e2d6c4;border-radius:12px}
.bl-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bl-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.bl-stats div{display:flex;flex-direction:column;align-items:center;padding:10px 6px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px #eadfcd}
.bl-stats b{color:var(--accent-dark);font:900 clamp(26px,3.4vw,36px)/1.1 var(--sans)}
.bl-stats span{color:#6d5a48;font:700 13.5px/1.3 var(--sans);text-align:center}
.bl-h{margin:14px 0 6px;font:900 17px/1.2 var(--sans)}
.bl-h small{color:#8a7764;font-weight:700}
.bl-genres{display:flex;flex-wrap:wrap;gap:6px}
.bl-genres span{padding:5px 11px;border-radius:12px;background:#f4ede1;color:#a8957f;font:800 14px/1.3 var(--sans)}
.bl-genres span.on{background:var(--accent);color:#fff}
.bl-ideas{margin:0;padding-left:20px;display:grid;gap:6px}
.bl-empty{display:grid;place-items:center;text-align:center;height:100%;color:#4d3c2e}
.bl-big{font-size:54px;margin:0}
@media (max-width:620px){.bl-form{grid-template-columns:1fr 1fr}.bl-field:nth-of-type(5){grid-column:1/-1}.bl-top{flex-wrap:wrap}.bl-select{flex:1 1 100%}}
@media (max-height:460px),(max-width:420px) and (max-height:720px){.bl-body{padding:6px 10px 16px;font-size:14px}.bl-top,.bl-foot{padding:5px 8px}.bl-btn{min-height:44px;font-size:14.5px;padding:0 12px}.bl-chips button{font-size:13.5px;padding:0 11px}.bl-book{padding:6px 10px;min-height:48px}.bl-book-main b{font-size:15px}.bl-book-main small{font-size:12.5px}.bl-tag{font-size:11.5px}.bl-intro{font-size:13.5px;margin-bottom:6px}.bl-note{font-size:13.5px;padding:6px 10px}.bl-desc{font-size:16px}.bl-field input,.bl-field textarea{font-size:16px;min-height:44px;padding:6px 10px}}
`;
