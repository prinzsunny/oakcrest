<script>const { $, el, svg: makeSvg, text, panel, say, pick, wait, confetti, explain, everyday, emoji } = KIT;
const stage = $("[data-stage]");
let token = 0;

// ===== ENGINE START =====
// Pure block-language logic (no DOM): block definitions, the interpreter and the challenge checks.
// The test file runs this part in Node.
const VARS = ["score", "count", "length", "sides", "n", "d", "roll", "low", "high", "guess", "secret"];
const FUNCS = ["A", "B", "C"];
const PEN_COLORS = [["#e53935", "red"], ["#fb8c00", "orange"], ["#f2b705", "yellow"], ["#43a047", "green"], ["#1e88e5", "blue"], ["#8e24aa", "purple"], ["#2b1d12", "black"]];
const colorName = (c) => (PEN_COLORS.find(([h]) => h === c) || [c, "colour"])[1];
const CATS = [
  { id: "events", name: "Events", color: "#a87f00" },
  { id: "motion", name: "Motion", color: "#2f6fd6" },
  { id: "looks", name: "Looks", color: "#7a4cc9" },
  { id: "pen", name: "Pen", color: "#0b8564" },
  { id: "control", name: "Control", color: "#c26a00" },
  { id: "sensing", name: "Sensing", color: "#1f86ab" },
  { id: "operators", name: "Operators", color: "#2f8f2f" },
  { id: "variables", name: "Variables", color: "#c75400" },
  { id: "myblocks", name: "My Blocks", color: "#c2365b" },
];
// parts: words, and slots: {n} number, {b} true/false, {v} variable name, {c} colour.
// shape: stmt (default), c (one mouth), e (if/else), cap (nothing below), rep (number reporter), bool.
const DEFS = {
  move: { cat: "motion", parts: ["move", { n: 10 }, "steps"] },
  right: { cat: "motion", parts: ["turn right ↻", { n: 90 }, "°"] },
  left: { cat: "motion", parts: ["turn left ↺", { n: 90 }, "°"] },
  goto: { cat: "motion", parts: ["go to x:", { n: 0 }, "y:", { n: 0 }] },
  point: { cat: "motion", parts: ["point in direction", { n: 90 }] },
  changex: { cat: "motion", parts: ["change x by", { n: 10 }] },
  changey: { cat: "motion", parts: ["change y by", { n: 10 }] },
  xpos: { cat: "motion", shape: "rep", parts: ["x position"] },
  ypos: { cat: "motion", shape: "rep", parts: ["y position"] },
  dirr: { cat: "motion", shape: "rep", parts: ["direction"] },
  say: { cat: "looks", parts: ["say", { n: 1 }] },
  changesize: { cat: "looks", parts: ["change size by", { n: 10 }] },
  setsize: { cat: "looks", parts: ["set size to", { n: 100 }, "%"] },
  sizer: { cat: "looks", shape: "rep", parts: ["size"] },
  pendown: { cat: "pen", parts: ["✏️ pen down"] },
  penup: { cat: "pen", parts: ["pen up"] },
  color: { cat: "pen", parts: ["set pen colour to", { c: "#e53935" }] },
  pensize: { cat: "pen", parts: ["set pen size to", { n: 3 }] },
  clear: { cat: "pen", parts: ["erase all"] },
  wait: { cat: "control", parts: ["wait", { n: 1 }, "seconds"] },
  repeat: { cat: "control", shape: "c", parts: ["repeat", { n: 4 }] },
  forever: { cat: "control", shape: "c", end: true, parts: ["forever"] },
  if: { cat: "control", shape: "c", parts: ["if", { b: 1 }, "then"] },
  ifelse: { cat: "control", shape: "e", parts: ["if", { b: 1 }, "then"] },
  until: { cat: "control", shape: "c", parts: ["repeat until", { b: 1 }] },
  stop: { cat: "control", shape: "cap", parts: ["stop all"] },
  edge: { cat: "sensing", shape: "bool", parts: ["touching edge?"] },
  touchc: { cat: "sensing", shape: "bool", parts: ["touching", { c: "#e53935" }, "?"] },
  add: { cat: "operators", shape: "rep", parts: [{ n: null }, "+", { n: null }] },
  sub: { cat: "operators", shape: "rep", parts: [{ n: null }, "−", { n: null }] },
  mul: { cat: "operators", shape: "rep", parts: [{ n: null }, "×", { n: null }] },
  div: { cat: "operators", shape: "rep", parts: [{ n: null }, "÷", { n: null }] },
  mod: { cat: "operators", shape: "rep", parts: [{ n: null }, "mod", { n: null }] },
  rand: { cat: "operators", shape: "rep", parts: ["pick random", { n: 1 }, "to", { n: 10 }] },
  floor: { cat: "operators", shape: "rep", parts: ["floor of", { n: null }] },
  round: { cat: "operators", shape: "rep", parts: ["round", { n: null }] },
  lt: { cat: "operators", shape: "bool", parts: [{ n: null }, "<", { n: 50 }] },
  gt: { cat: "operators", shape: "bool", parts: [{ n: null }, ">", { n: 50 }] },
  eq: { cat: "operators", shape: "bool", parts: [{ n: null }, "=", { n: 50 }] },
  and: { cat: "operators", shape: "bool", parts: [{ b: 1 }, "and", { b: 1 }] },
  or: { cat: "operators", shape: "bool", parts: [{ b: 1 }, "or", { b: 1 }] },
  not: { cat: "operators", shape: "bool", parts: ["not", { b: 1 }] },
  setv: { cat: "variables", parts: ["set", { v: "score" }, "to", { n: 0 }] },
  changev: { cat: "variables", parts: ["change", { v: "score" }, "by", { n: 1 }] },
  showv: { cat: "variables", parts: ["show variable", { v: "score" }] },
  var: { cat: "variables", shape: "rep", parts: [{ v: "score" }] },
  define: { cat: "myblocks", shape: "c", parts: ["define block", { f: "A" }, "(input)"] },
  call: { cat: "myblocks", parts: ["run block", { f: "A" }, "with input", { n: 10 }] },
  input: { cat: "myblocks", shape: "rep", parts: ["input"] },
};
const shapeOf = (op) => DEFS[op].shape || "stmt";
const isStmt = (op) => !["rep", "bool"].includes(shapeOf(op));
const slotsOf = (op) => DEFS[op].parts.filter((p) => typeof p === "object");
const slotDefault = (p) => ("n" in p ? p.n : "b" in p ? null : "v" in p ? p.v : "f" in p ? p.f : p.c);

let bkUid = 0;
const newId = () => "k" + ++bkUid;
// B("repeat", 4, [B("move", 100), B("right", 90)]): slot values in order, then the mouth lists.
function B(op, ...args) {
  const def = DEFS[op];
  const vals = args.filter((a) => !Array.isArray(a));
  const lists = args.filter(Array.isArray);
  const node = { id: newId(), op, a: [] };
  let k = 0;
  for (const p of def.parts) if (typeof p === "object") node.a.push(k < vals.length ? vals[k++] : slotDefault(p));
  if (def.shape === "c" || def.shape === "e") node.body = lists[0] || [];
  if (def.shape === "e") node.else = lists[1] || [];
  return node;
}
const V = (name) => B("var", name);
function reId(x) {
  if (Array.isArray(x)) return x.map(reId);
  if (!x || typeof x !== "object") return x;
  return { id: newId(), op: x.op, a: x.a.map(reId), ...(x.body ? { body: reId(x.body) } : {}), ...(x.else ? { else: reId(x.else) } : {}) };
}
// Every node in a program (statements and reporters), depth first.
function walk(list, out = []) {
  for (const n of list) {
    if (!n || typeof n !== "object") continue;
    out.push(n);
    walk(n.a.filter((v) => v && typeof v === "object"), out);
    if (n.body) walk(n.body, out);
    if (n.else) walk(n.else, out);
  }
  return out;
}
const has = (prog, op) => walk(prog).some((n) => n.op === op);
const hasIn = (prog, outer, inner) => walk(prog).some((n) => n.op === outer && walk([...(n.body || []), ...(n.else || [])]).some((m) => m.op === inner));
// A program is valid to save/load if every node has a known op.
function validProg(prog) {
  try {
    return Array.isArray(prog) && walk(prog).every((n) => DEFS[n.op] && Array.isArray(n.a));
  } catch {
    return false;
  }
}

const HALT = Symbol("halt");
const clean = (v) => Math.round(v * 1e6) / 1e6;
const fmt = (v) => String(clean(v));
const norm = (d) => clean(((d % 360) + 360) % 360);
const W2 = 240;
const H2 = 180;

function newState(setup = {}) {
  const S = {
    x: setup.x ?? 0, y: setup.y ?? 0, dir: setup.dir ?? 90, pen: false, color: "#1e88e5", penSize: 3, size: 100,
    vars: {}, shown: [], lines: [], said: [], bubble: null, zones: setup.zones || [], warn: "", edgeLog: [], touchedEver: {},
    offstage: false, clearGen: 0, rnd: setup.rnd || Math.random, done: false, reason: "", rolls: [], moves: 0, frames: [], funcs: {}, maxDepth: 0,
  };
  S.startX = S.x;
  S.startY = S.y;
  for (const v of VARS) S.vars[v] = 0;
  Object.assign(S.vars, setup.vars || {});
  return S;
}
const radius = (S) => (18 * S.size) / 100;
const touchingEdge = (S) => Math.abs(S.x) + radius(S) >= W2 || Math.abs(S.y) + radius(S) >= H2;
function circleRect(x, y, r, z) {
  const cx = Math.max(z.x1, Math.min(x, z.x2));
  const cy = Math.max(z.y1, Math.min(y, z.y2));
  return (x - cx) ** 2 + (y - cy) ** 2 < r * r;
}
const touchingColor = (S, c) => S.zones.some((z) => z.c === c && circleRect(S.x, S.y, radius(S), z));

function moveTo(S, nx, ny) {
  nx = clean(nx);
  ny = clean(ny);
  S.moves += 1;
  if (S.pen && (nx !== S.x || ny !== S.y)) S.lines.push({ x1: S.x, y1: S.y, x2: nx, y2: ny, c: S.color, w: S.penSize });
  S.x = nx;
  S.y = ny;
  if (Math.abs(nx) > W2 + 1 || Math.abs(ny) > H2 + 1) S.offstage = true;
  const r = radius(S);
  const side = nx + r >= W2 ? "R" : nx - r <= -W2 ? "L" : ny + r >= H2 ? "T" : ny - r <= -H2 ? "B" : "";
  if (side && S.edgeLog[S.edgeLog.length - 1] !== side) S.edgeLog.push(side);
  for (const z of S.zones) if (circleRect(nx, ny, r, z)) S.touchedEver[z.c] = true;
}

function val(v, S) {
  if (v === null || v === undefined || v === "") return 0;
  if (typeof v === "number") return v;
  if (typeof v === "string") return Number(v) || 0;
  return rep(v, S);
}
function rep(n, S) {
  const [a, b] = n.a;
  switch (n.op) {
    case "add": return clean(val(a, S) + val(b, S));
    case "sub": return clean(val(a, S) - val(b, S));
    case "mul": return clean(val(a, S) * val(b, S));
    case "div": {
      const d = val(b, S);
      if (d === 0) {
        S.warn = "Dividing by 0 has no answer, so I used 0.";
        return 0;
      }
      return clean(val(a, S) / d);
    }
    case "mod": {
      const d = val(b, S);
      if (d === 0) {
        S.warn = "mod 0 has no answer, so I used 0.";
        return 0;
      }
      const x = val(a, S);
      return clean(((x % d) + d) % d);
    }
    case "rand": {
      let lo = val(a, S);
      let hi = val(b, S);
      if (lo > hi) [lo, hi] = [hi, lo];
      const r = Number.isInteger(lo) && Number.isInteger(hi) ? lo + Math.floor(S.rnd() * (hi - lo + 1)) : clean(lo + S.rnd() * (hi - lo));
      if (S.rolls.length < 5000) S.rolls.push({ lo, hi, r });
      return r;
    }
    case "floor": return Math.floor(clean(val(a, S)));
    case "round": return Math.round(clean(val(a, S)));
    case "input": return S.frames.length ? S.frames[S.frames.length - 1] : 0;
    case "var": return S.vars[a] ?? 0;
    case "xpos": return clean(S.x);
    case "ypos": return clean(S.y);
    case "dirr": return norm(S.dir);
    case "sizer": return S.size;
    default: return truth(n, S) ? 1 : 0;
  }
}
function truth(v, S) {
  if (v === null || v === undefined) return false;
  if (typeof v !== "object") return !!v;
  const [a, b] = v.a;
  switch (v.op) {
    case "lt": return val(a, S) < val(b, S) - 1e-9;
    case "gt": return val(a, S) > val(b, S) + 1e-9;
    case "eq": return Math.abs(val(a, S) - val(b, S)) < 1e-9;
    case "and": return truth(a, S) && truth(b, S);
    case "or": return truth(a, S) || truth(b, S);
    case "not": return !truth(a, S);
    case "edge": return touchingEdge(S);
    case "touchc": return touchingColor(S, a);
    default: return val(v, S) !== 0;
  }
}

// The interpreter is a generator: it yields { id } before each block runs (so the page can glow it and
// pause in step mode), { id, loop } at the end of each loop lap, and { id, wait } for wait blocks.
function* runProg(prog, S) {
  for (const b of prog) if (b.op === "define" && !S.funcs[b.a[0]]) S.funcs[b.a[0]] = b;
  try {
    yield* runList(prog, S);
    S.reason = "end";
  } catch (error) {
    if (error !== HALT) throw error;
    if (S.reason !== "depth") S.reason = "stop";
  }
  S.done = true;
}
function* runList(list, S) {
  for (const b of list) yield* runBlock(b, S);
}
function* runBlock(b, S) {
  yield { id: b.id };
  const a = b.a;
  const n0 = () => val(a[0], S);
  switch (b.op) {
    case "move": {
      const d = n0();
      const r = (S.dir * Math.PI) / 180;
      moveTo(S, S.x + d * Math.sin(r), S.y + d * Math.cos(r));
      break;
    }
    case "right": S.dir = norm(S.dir + n0()); break;
    case "left": S.dir = norm(S.dir - n0()); break;
    case "point": S.dir = norm(n0()); break;
    case "goto": moveTo(S, n0(), val(a[1], S)); break;
    case "changex": moveTo(S, S.x + n0(), S.y); break;
    case "changey": moveTo(S, S.x, S.y + n0()); break;
    case "say": {
      const v = clean(n0());
      S.said.push(v);
      S.bubble = v;
      break;
    }
    case "changesize": S.size = Math.max(5, Math.min(500, clean(S.size + n0()))); break;
    case "setsize": S.size = Math.max(5, Math.min(500, clean(n0()))); break;
    case "pendown": S.pen = true; break;
    case "penup": S.pen = false; break;
    case "color": S.color = a[0]; break;
    case "pensize": S.penSize = Math.max(1, Math.min(30, n0())); break;
    case "clear": S.lines = []; S.clearGen += 1; break;
    case "wait": yield { id: b.id, wait: Math.max(0, Math.min(10, n0())) }; break;
    case "repeat": {
      const n = Math.min(100000, Math.max(0, Math.round(n0())));
      for (let i = 0; i < n; i++) {
        yield* runList(b.body, S);
        yield { id: b.id, loop: true };
      }
      break;
    }
    case "forever":
      for (;;) {
        yield* runList(b.body, S);
        yield { id: b.id, loop: true };
      }
    case "until":
      while (!truth(a[0], S)) {
        yield* runList(b.body, S);
        yield { id: b.id, loop: true };
      }
      break;
    case "if": if (truth(a[0], S)) yield* runList(b.body, S); break;
    case "ifelse": yield* runList(truth(a[0], S) ? b.body : b.else, S); break;
    case "stop": throw HALT;
    case "define": break;
    case "call": {
      const f = S.funcs[a[0]];
      if (!f) {
        S.warn = `Block ${a[0]} has no define block yet.`;
        break;
      }
      if (S.frames.length >= 200) {
        S.reason = "depth";
        throw HALT;
      }
      S.frames.push(val(a[1], S));
      S.maxDepth = Math.max(S.maxDepth, S.frames.length);
      yield* runList(f.body, S);
      S.frames.pop();
      break;
    }
    case "setv": S.vars[a[0]] = clean(val(a[1], S)); break;
    case "changev": S.vars[a[0]] = clean((S.vars[a[0]] ?? 0) + val(a[1], S)); break;
    case "showv": if (!S.shown.includes(a[0])) S.shown.push(a[0]); break;
  }
}
// Run a whole program at once (no waiting). Used by checks and tests.
function simulate(prog, setup = {}, limit = 60000) {
  const S = newState(setup);
  let n = 0;
  for (const step of runProg(prog, S)) {
    if (++n > limit) {
      S.reason = "limit";
      break;
    }
  }
  return S;
}

// ---- drawing checks ----
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
function segDist(px, py, l) {
  const dx = l.x2 - l.x1;
  const dy = l.y2 - l.y1;
  const len2 = dx * dx + dy * dy;
  const t = len2 ? Math.max(0, Math.min(1, ((px - l.x1) * dx + (py - l.y1) * dy) / len2)) : 0;
  return dist(px, py, l.x1 + t * dx, l.y1 + t * dy);
}
// Is every part of drawing A close to some line of drawing B?
function covers(A, B, tol = 5) {
  for (const l of A) {
    const len = dist(l.x1, l.y1, l.x2, l.y2);
    const n = Math.max(1, Math.ceil(len / 4));
    for (let i = 0; i <= n; i++) {
      const px = l.x1 + ((l.x2 - l.x1) * i) / n;
      const py = l.y1 + ((l.y2 - l.y1) * i) / n;
      if (!B.some((m) => segDist(px, py, m) <= tol)) return false;
    }
  }
  return true;
}
const sameDrawing = (lines, target, tol = 5) => lines.length > 0 && covers(target, lines, tol) && covers(lines, target, tol);
const headingOf = (s) => (Math.atan2(s.y2 - s.y1, s.x2 - s.x1) * 180) / Math.PI;
const turnBetween = (h1, h2) => {
  let t = h2 - h1;
  while (t <= -180) t += 360;
  while (t > 180) t -= 360;
  return t;
};
// Read the pen lines as one path, join straight runs, and see if it closes into a polygon.
function polygon(lines) {
  if (!lines.length) return { n: 0, paths: 0, closed: false };
  let paths = 1;
  const segs = [];
  let px = lines[0].x1;
  let py = lines[0].y1;
  for (const l of lines) {
    if (dist(px, py, l.x1, l.y1) > 1) paths += 1;
    px = l.x2;
    py = l.y2;
    if (dist(l.x1, l.y1, l.x2, l.y2) < 1e-6) continue;

// A friendly round robot (about 40 units tall, centred on 0,0).
function robot(g) {
  el("rect", { x: -9, y: 12, width: 7, height: 8, rx: 3, fill: "#2b5fb0" }, g);
  el("rect", { x: 2, y: 12, width: 7, height: 8, rx: 3, fill: "#2b5fb0" }, g);
  el("line", { x1: 0, y1: -15, x2: 0, y2: -22, stroke: "#2b5fb0", "stroke-width": 2.5 }, g);
  el("circle", { cx: 0, cy: -24, r: 3.6, fill: "#ffb703", stroke: "#c98600", "stroke-width": 1.2 }, g);
  el("rect", { x: -17, y: -15, width: 34, height: 29, rx: 11, fill: "#4f9de8", stroke: "#2b5fb0", "stroke-width": 2 }, g);
  el("rect", { x: -12, y: -10, width: 24, height: 15, rx: 6, fill: "#eaf6ff" }, g);
  el("circle", { cx: -5, cy: -3.5, r: 2.6, fill: "#2b1d12" }, g);
  el("circle", { cx: 5, cy: -3.5, r: 2.6, fill: "#2b1d12" }, g);
  el("circle", { cx: -4.2, cy: -4.4, r: 0.9, fill: "#fff" }, g);
  el("circle", { cx: 5.8, cy: -4.4, r: 0.9, fill: "#fff" }, g);
  el("path", { d: "M-4 1.5Q0 5 4 1.5", fill: "none", stroke: "#2b1d12", "stroke-width": 1.6, "stroke-linecap": "round" }, g);
  el("circle", { cx: -17, cy: 0, r: 3, fill: "#2b5fb0" }, g);
  el("circle", { cx: 17, cy: 0, r: 3, fill: "#2b5fb0" }, g);
  return g;
}

// The stage the robot draws on: x -240..240 (right), y -180..180 (up), as in Scratch.
function makeCanvas(host) {
  const v = makeSvg("-240 -180 480 360", host);
  v.setAttribute("preserveAspectRatio", "xMidYMid meet");
  v.setAttribute("role", "img");
  v.setAttribute("aria-label", "Stage with the robot");
  el("rect", { x: -240, y: -180, width: 480, height: 360, fill: "#fffdf8" }, v);
  const grid = el("g", { "pointer-events": "none" }, v);
  for (let x = -220; x <= 220; x += 20) el("line", { x1: x, x2: x, y1: -180, y2: 180, stroke: x % 100 ? "#f1e9dc" : "#e3d6c2", "stroke-width": x % 100 ? 1 : 1.5 }, grid);
  for (let y = -160; y <= 160; y += 20) el("line", { x1: -240, x2: 240, y1: y, y2: y, stroke: y % 100 ? "#f1e9dc" : "#e3d6c2", "stroke-width": y % 100 ? 1 : 1.5 }, grid);
  el("line", { x1: -240, x2: 240, y1: 0, y2: 0, stroke: "#c9b8a1", "stroke-width": 2 }, grid);
  el("line", { x1: 0, x2: 0, y1: -180, y2: 180, stroke: "#c9b8a1", "stroke-width": 2 }, grid);
  const lab = { "font-size": 13, fill: "#8a7764", "font-weight": 800 };
  for (const x of [-200, -100, 100, 200]) text(grid, x, 16, x, lab);
  for (const y of [-100, 100]) text(grid, -6, -y + 5, y, { ...lab, "text-anchor": "end" });
  text(grid, -6, 16, "0", { ...lab, "text-anchor": "end" });
  text(grid, 230, -7, "x", { ...lab, "font-size": 15 });
  text(grid, 11, -166, "y", { ...lab, "font-size": 15 });
  const zonesG = el("g", { "pointer-events": "none" }, v);
  const ghostG = el("g", { "pointer-events": "none" }, v);
  const starG = el("g", { "pointer-events": "none" }, v);
  const ink = el("g", { "stroke-linecap": "round", "pointer-events": "none" }, v);
  const spriteG = el("g", { "pointer-events": "none" }, v);
  const arrow = el("path", { d: "M25 -8L37 0L25 8Z", fill: "#ff8a3d", stroke: "#b4501a", "stroke-width": 2, "stroke-linejoin": "round" }, spriteG);
  robot(el("g", {}, spriteG));
  const bubbleG = el("g", { "pointer-events": "none" }, v);
  const monG = el("g", { "pointer-events": "none" }, v);
  const readG = el("g", { "pointer-events": "none" }, v);
  el("rect", { x: -236, y: 150, width: 236, height: 26, rx: 8, fill: "#fff", stroke: "#e3d6c2" }, readG);
  const readout = text(readG, -228, 168, "", { "font-size": 15, fill: "#2b1d12", "text-anchor": "start" });
  el("rect", { x: -240, y: -180, width: 480, height: 360, fill: "none", stroke: "#e3d6c2", "stroke-width": 2 }, v);
  let drawn = 0;
  let gen = 0;
  let bubbleKey = null;
  let monKey = "";
  return {
    scene(setup = {}, ghost = null) {
      zonesG.innerHTML = "";
      ghostG.innerHTML = "";
      starG.innerHTML = "";
      for (const z of setup.zones || []) el("rect", { x: z.x1, y: -z.y2, width: z.x2 - z.x1, height: z.y2 - z.y1, rx: 3, fill: z.c, opacity: z.c === GREEN ? 0.85 : 1 }, zonesG);
      if (ghost) for (const l of ghost) el("line", { x1: l.x1, y1: -l.y1, x2: l.x2, y2: -l.y2, stroke: "#a8967f", "stroke-width": 5, "stroke-dasharray": "9 8", "stroke-linecap": "round", opacity: 0.6 }, ghostG);
      if (setup.star) {
        emoji(starG, setup.star.x, -setup.star.y, "⭐", 34);
        text(starG, setup.star.x, -setup.star.y + 36, `(${setup.star.x}, ${setup.star.y})`, { "font-size": 15, fill: "#a8632d" });
      }
    },
    reset() {
      ink.innerHTML = "";
      drawn = 0;
      gen = 0;
      bubbleKey = null;
      monKey = "";
      bubbleG.innerHTML = "";
      monG.innerHTML = "";
    },
    paint(S) {
      if (S.clearGen !== gen) {
        ink.innerHTML = "";
        drawn = 0;
        gen = S.clearGen;
      }
      for (; drawn < S.lines.length; drawn++) {
        const l = S.lines[drawn];
        el("line", { x1: l.x1, y1: -l.y1, x2: l.x2, y2: -l.y2, stroke: l.c, "stroke-width": l.w }, ink);
      }
      const k = S.size / 100;
      spriteG.setAttribute("transform", `translate(${S.x} ${-S.y}) scale(${k})`);
      arrow.setAttribute("transform", `rotate(${S.dir - 90})`);
      const bk = S.bubble === null ? null : `${S.bubble}@${S.x},${S.y},${S.size}`;
      if (bk !== bubbleKey) {
        bubbleKey = bk;
        bubbleG.innerHTML = "";
        if (S.bubble !== null) {
          const s = String(S.bubble);
          const w = 22 + s.length * 12;
          const bx = Math.max(-236, Math.min(236 - w, S.x > 120 ? S.x - 20 * k - w : S.x + 18 * k));
          const by = Math.max(-176, Math.min(110, -S.y - 26 * k - 34));
          el("rect", { x: bx, y: by, width: w, height: 34, rx: 14, fill: "#fff", stroke: "#7a4cc9", "stroke-width": 2.5 }, bubbleG);
          text(bubbleG, bx + w / 2, by + 24, s, { "font-size": 20, fill: "#2b1d12" });
        }
      }
      const mk = S.shown.map((n) => `${n}=${S.vars[n]}`).join("|");
      if (mk !== monKey) {
        monKey = mk;
        monG.innerHTML = "";
        S.shown.forEach((n, i) => {
          const s = `${n}: ${fmt(S.vars[n])}`;
          const w = 24 + s.length * 9.5;
          el("rect", { x: -234, y: -174 + i * 30, width: w, height: 26, rx: 8, fill: "#fff", stroke: CAT.variables.color, "stroke-width": 2 }, monG);
          text(monG, -234 + w / 2, -155 + i * 30, s, { "font-size": 16, fill: CAT.variables.color });
        });
      }
      readout.textContent = `x: ${fmt1(S.x)}   y: ${fmt1(S.y)}   direction: ${fmt1(S.dir)}°`;
    },
  };
}

// ---- block HTML ----
function slotHTML(n, si, p, live, ui) {
  const v = n.a[si];
  const key = `${n.id}:${si}`;
  const attr = live ? ` data-slot="${key}"` : "";
  const on = live && ui?.slot === key ? " on" : "";
  if ("n" in p) {
    if (v && typeof v === "object") return blockHTML(v, live, ui, key);
    return `<span class="bk-slot bk-num${on}"${attr}>${v === null || v === "" ? "&nbsp;" : esc(v)}</span>`;
  }
  if ("b" in p) return v ? blockHTML(v, live, ui, key) : `<span class="bk-slot bk-bslot${on}"${attr}></span>`;
  if ("v" in p || "f" in p) return `<span class="bk-slot bk-vslot${on}"${attr}>${esc(v)} ▾</span>`;
  return `<span class="bk-slot bk-cslot${on}"${attr} style="background:${v}" aria-label="${colorName(v)}"></span>`;
}
function blockHTML(n, live, ui, pslot = "") {
  const def = DEFS[n.op];
  const shape = shapeOf(n.op);
  const c = CAT[def.cat].color;
  let si = 0;
  const inner = n.op === "var" ? `<span class="bk-w">${esc(n.a[0])}</span>` : def.parts.map((p) => (typeof p === "string" ? `<span class="bk-w">${esc(p)}</span>` : slotHTML(n, si++, p, live, ui))).join("");
  const idAttr = live ? ` data-id="${n.id}"${pslot ? ` data-pslot="${pslot}"` : ""}` : ` data-op="${n.op === "var" ? "var:" + n.a[0] : n.op}"`;
  if (shape === "rep") return `<span class="bk-r"${idAttr} style="--c:${c}">${inner}</span>`;
  if (shape === "bool") return `<span class="bk-bo"${idAttr} style="--c:${c}">${inner}</span>`;
  const sel = live && ui.sel === n.id;
  const del = sel ? `<button type="button" class="bk-del" data-del="${n.id}" aria-label="Delete block">🗑</button>` : "";
  const cls = `bk-b${shape === "c" || shape === "e" ? " bk-c" : ""}${shape === "cap" ? " bk-cap" : ""}${n.op === "define" ? " bk-def" : ""}${sel ? " bk-sel" : ""}${live && ui.fresh === n.id ? " bk-new" : ""}`;
  let h = `<div class="${cls}"${idAttr} style="--c:${c}"><div class="bk-row">${inner}${del}</div>`;
  if (shape === "c" || shape === "e") {
    h += `<div class="bk-mouth">${live ? listHTML(n.body, n.id, "body", ui) : ""}</div>`;
    if (shape === "e") h += `<div class="bk-row bk-else"><span class="bk-w">else</span></div><div class="bk-mouth">${live ? listHTML(n.else, n.id, "else", ui) : ""}</div>`;
    h += `<div class="bk-foot"></div>`;
  }
  return h + `</div>`;
}
function gapHTML(owner, key, i, empty, ui, tail = false) {
  const c = ui.cursor;
  const on = c.owner === owner && c.key === key && c.i === i;
  const label = on ? "➕ next block goes here" : empty ? "place blocks here" : tail ? "" : "";
  return `<div class="bk-gap${on ? " on" : ""}${empty && !on ? " empty" : ""}${tail ? " tail" : ""}" data-gap="${owner}|${key}|${i}">${label}</div>`;
}
function listHTML(list, owner, key, ui) {
  let h = gapHTML(owner, key, 0, list.length === 0, ui, owner === "root" && list.length === 0);
  list.forEach((b, i) => (h += blockHTML(b, true, ui) + gapHTML(owner, key, i + 1, false, ui, owner === "root" && i === list.length - 1)));
  return h;
}

// ---- the studio: palette, script, stage and runner ----
function makeStudio({ cats = ALL_CATS, onFinish, onChange, onRunStart } = {}) {
  const my = token;
  const alive = () => my === token && app.isConnected;
  const ui = { prog: [], cursor: { owner: "root", key: "body", i: 0 }, sel: null, slot: null, fresh: null, setup: {}, ghost: null, speed: 1, run: null, view: false };
  stage.innerHTML = `<div class="bk-app">
    <div class="bk-goal" data-goal><span></span></div>
    <div class="bk-tools"><button type="button" class="go" data-run>▶ <span class="lbl">Run</span></button><button type="button" data-step aria-label="Step one block">👣 <span class="lbl">Step</span></button><button type="button" class="halt" data-halt aria-label="Stop">⏹</button><button type="button" data-speed aria-label="Speed">🐇</button><button type="button" data-flip hidden>🖼 Stage</button></div>
    <div class="bk-pal"><div class="bk-cats" data-cats></div><div class="bk-list" data-list></div></div>
    <div class="bk-code" data-code><div class="bk-script" data-script></div></div>
    <div class="bk-view" data-view></div>
    <div class="bk-pop" data-pop hidden></div>
  </div>`;
  const app = $(".bk-app", stage);
  const script = $("[data-script]", app);
  const code = $("[data-code]", app);
  const list = $("[data-list]", app);
  const pop = $("[data-pop]", app);
  const canvas = makeCanvas($("[data-view]", app));
  const SPEEDS = [["🐢", 500], ["🐇", 110], ["⚡", 0]];

  // palette
  $("[data-cats]", app).innerHTML = cats.map((id) => `<button type="button" data-cat="${id}" style="--c:${CAT[id].color}"><i></i>${CAT[id].name}</button>`).join("");
  list.innerHTML = cats
    .map((id) => {
      const head = `<h4 data-head="${id}" style="--c:${CAT[id].color}">${CAT[id].name}</h4>`;
      const blocks = PAL[id]
        .map((op) => {
          if (op === "hat") return `<div class="bk-b bk-hat" data-op="hat" style="--c:${CAT.events.color}"><div class="bk-row"><span class="bk-w">when ▶ Run clicked</span></div></div><p>Every program starts here. It is already at the top of your code.</p>`;
          return blockHTML(op.startsWith("var:") ? V(op.slice(4)) : B(op), false);
        })
        .join("");
      const note = id === "myblocks" ? `<p>A custom block is a named procedure. Put define block A in your code, fill it, then use run block A.</p>` : "";
      return head + note + blocks;
    })
    .join("");

  // ---- tree helpers ----
  function locate(id, lst = ui.prog, owner = "root", key = "body") {
    for (let i = 0; i < lst.length; i++) {
      const n = lst[i];
      if (n.id === id) return { list: lst, i, owner, key, node: n };
      const r = within(n, id);
      if (r) return r;
    }
    return null;
  }
  function within(n, id) {
    for (let si = 0; si < n.a.length; si++) {
      const v = n.a[si];
      if (v && typeof v === "object") {
        if (v.id === id) return { parent: n, si, node: v };
        const r = within(v, id);
        if (r) return r;
      }
    }
    for (const key of ["body", "else"]) {
      if (!n[key]) continue;
      const r = locate(id, n[key], n.id, key);
      if (r) return r;
    }
    return null;
  }
  const listOf = (owner, key) => (owner === "root" ? ui.prog : locate(owner)?.node?.[key] || null);
  function fixCursor() {
    const l = listOf(ui.cursor.owner, ui.cursor.key);
    if (!l) ui.cursor = { owner: "root", key: "body", i: ui.prog.length };
    else ui.cursor.i = Math.max(0, Math.min(ui.cursor.i, l.length));
  }
  function detach(id) {
    const loc = locate(id);
    if (!loc) return null;
    if (loc.list) {
      loc.list.splice(loc.i, 1);
      const c = ui.cursor;
      if (listOf(c.owner, c.key) === loc.list && c.i > loc.i) c.i -= 1;
    } else {
      const p = slotsOf(loc.parent.op)[loc.si];
      loc.parent.a[loc.si] = slotDefault(p) ?? null;
    }
    fixCursor();
    return loc.node;
  }
  function insert(node, owner, key, i) {
    const l = listOf(owner, key);
    if (!l) return;
    l.splice(i, 0, node);
    ui.cursor = node.body ? { owner: node.id, key: "body", i: 0 } : { owner, key, i: i + 1 };
  }
  const slotRef = (key) => {
    const [id, si] = key.split(":");
    const loc = locate(id);
    if (!loc) return null;
    return { node: loc.node, si: Number(si), p: slotsOf(loc.node.op)[Number(si)] };
  };
  const accepts = (p, op) => ("n" in p && shapeOf(op) === "rep") || ("b" in p && shapeOf(op) === "bool");

  function render() {
    fixCursor();
    script.innerHTML = `<div class="bk-b bk-hat" style="--c:${CAT.events.color}"><div class="bk-row"><span class="bk-w">when ▶ Run clicked</span></div></div>${listHTML(ui.prog, "root", "body", ui)}`;
    ui.fresh = null;
    if (ui.run?.cur) glow(ui.run.cur);
  }
  function changed() {
    halt();
    render();
    window.OC?.touch();
    onChange?.(ui.prog);
  }
  function glow(id) {
    script.querySelectorAll(".bk-run").forEach((e) => e.classList.remove("bk-run"));
    if (!id) return;
    const e = script.querySelector(`[data-id="${id}"]`);
    if (!e) return;
    e.classList.add("bk-run");
    const r = e.getBoundingClientRect();
    const cr = code.getBoundingClientRect();
    if (r.top < cr.top || r.top + 40 > cr.bottom) code.scrollTop += r.top - cr.top - cr.height / 3;
  }

  // ---- adding blocks ----
  function fromOp(op) {
    return op.startsWith("var:") ? V(op.slice(4)) : B(op);
  }
  function addFromPalette(op) {
    if (op === "hat") return say("Every program begins with the yellow when ▶ Run clicked block. It is already at the top of your code.");
    const node = fromOp(op);
    if (!isStmt(op)) {
      const ref = ui.slot && slotRef(ui.slot);
      if (ref && accepts(ref.p, op)) {
        ref.node.a[ref.si] = node;
        closePop(false);
        MUSIC.play("woodblock", 79, { gain: 0.25 });
        return changed();
      }
      return say(shapeOf(op) === "bool" ? "Tap a six-sided hole (in if, repeat until, and, or, not) first; then tap this block to place it there." : "Tap a white number hole first; then tap this block to place it there.");
    }
    if (op === "define" && ui.prog.some((n) => n.op === "define" && n.a[0] === node.a[0])) node.a[0] = FUNCS.find((f) => !ui.prog.some((n) => n.op === "define" && n.a[0] === f)) || "A";
    if (op === "define") insert(node, "root", "body", ui.prog.length);
    else insert(node, ui.cursor.owner, ui.cursor.key, ui.cursor.i);
    ui.sel = null;
    ui.fresh = node.id;
    closePop(false);
    MUSIC.play("woodblock", 79, { gain: 0.25 });
    changed();
  }

  // ---- editor pop-up for a slot ----
  let buf = "";
  function openPop(key) {
    const ref = slotRef(key);
    if (!ref) return;
    ui.slot = key;
    ui.sel = null;
    render();
    const { node, si, p } = ref;
    const v = node.a[si];
    let h = "";
    if ("n" in p) {
      buf = typeof v === "number" ? String(v) : "";
      const ops = ["add", "sub", "mul", "div", "mod", "floor", "round", "rand"];
      h = `<div class="bk-pop-h"><b>Type a number</b><output data-buf>${esc(buf || "?")}</output><button type="button" class="ok" data-done>✓ Done</button></div>
        <div class="bk-keys">${["1", "2", "3", "4", "5", "6", "7", "8", "9", "0", "−", ".", "⌫"].map((k) => `<button type="button" data-key="${k}">${k}</button>`).join("")}</div>
        <div class="bk-chipset">${VARS.map((n) => `<button type="button" data-var="${n}" style="--c:${CAT.variables.color}">${n}</button>`).join("")}${ops.map((o) => `<button type="button" data-put="${o}" style="--c:${CAT.operators.color}">${o === "rand" ? "random" : o === "floor" ? "floor" : o === "round" ? "round" : "▢ " + DEFS[o].parts[1] + " ▢"}</button>`).join("")}<button type="button" data-put="input" style="--c:${CAT.myblocks.color}">input</button><button type="button" data-put="xpos" style="--c:${CAT.motion.color}">x position</button><button type="button" data-put="ypos" style="--c:${CAT.motion.color}">y position</button></div>`;
    } else if ("b" in p) {
      h = `<div class="bk-pop-h"><b>Choose a true-or-false question</b><button type="button" class="ok" data-done>✓ Done</button></div><div class="bk-chipset">${["edge", "touchc", "lt", "gt", "eq", "and", "or", "not"].map((o) => `<button type="button" data-put="${o}" style="--c:${CAT[DEFS[o].cat].color}">${o === "edge" ? "touching edge?" : o === "touchc" ? "touching colour?" : o === "not" ? "not ▢" : "▢ " + DEFS[o].parts[1] + " ▢"}</button>`).join("")}${v ? `<button type="button" data-clear style="--c:#8a7764">empty the hole</button>` : ""}</div>`;
    } else if ("v" in p) {
      h = `<div class="bk-pop-h"><b>Choose a variable</b><button type="button" class="ok" data-done>✓ Done</button></div><div class="bk-chipset">${VARS.map((n) => `<button type="button" class="vv" data-setv="${n}" style="--c:${CAT.variables.color}" aria-pressed="${n === v}">${n}</button>`).join("")}</div>`;
    } else if ("f" in p) {
      h = `<div class="bk-pop-h"><b>Choose a custom block</b><button type="button" class="ok" data-done>✓ Done</button></div><div class="bk-chipset">${FUNCS.map((n) => `<button type="button" data-setv="${n}" style="--c:${CAT.myblocks.color}" aria-pressed="${n === v}">block ${n}</button>`).join("")}</div>`;
    } else {
      h = `<div class="bk-pop-h"><b>Choose a colour</b><button type="button" class="ok" data-done>✓ Done</button></div><div class="bk-chipset">${PEN_COLORS.map(([c, name]) => `<button type="button" class="sw" data-setv="${c}" style="--c:${c}" aria-pressed="${c === v}" aria-label="${name}"></button>`).join("")}</div>`;
    }
    pop.innerHTML = h;
    pop.hidden = false;
  }
  function closePop(re = true) {
    pop.hidden = true;
    pop.innerHTML = "";
    ui.slot = null;
    if (re) render();

  const btn = (k) => $(`[data-${k}]`, host);

    onFinish(S, prog, reason) {
      if (my !== token) return;
      ran = true;
      const ch = list[ci];
      if (reason === "error") return say("Something went wrong inside the program. Check that every hole is filled.");
      const r = ch.check(S, prog);

        MUSIC.chime();

        const all = solved.size === list.length;
        say(`${tries ? pick(WELL.slice(2)) : pick(WELL.slice(0, 2))} ${ch.why}${S.warn ? " " + S.warn : ""} ${all ? "You have completed every challenge in this unit. Now explain your thinking, then try it for real." : "Press 🗣 Explain to put the idea into words, or ▶ for the next challenge."}`);

        }

        MUSIC.oops();

    },
    onChange() {

    },
  });
  function status() {
    const ch = list[ci];
    btn("status").textContent = `${LV[ch.lv]} ${ci + 1} of ${list.length}${solved.has(ci) ? " ✓" : ""}`;
    btn("status").title = LV_NAME[ch.lv];
  }
  function load(i) {
    ci = (i + list.length) % list.length;
    tries = 0;
    hintI = 0;
    ran = false;
    const ch = list[ci];
    st.load(ch.start ? ch.start() : [], ch.setup, ch.setup.ghost ? ghostLines(ch) : null, `🎯 ${ch.goal}`);
    status();
    btn("show").hidden = true;
    btn("next").removeAttribute("data-pulse");
    btn("explain").removeAttribute("data-pulse");
    btn("real").hidden = solved.size !== list.length;
    say(`<b>Challenge ${ci + 1}.</b> ${ch.say}`);
  }
  host.onclick = (e) => {
    if (my !== token) return;
    const b = e.target.closest("button");
    if (!b) return;
    window.OC?.touch();
    const ch = list[ci];
    if (b.dataset.prev !== undefined) load(ci - 1);
    else if (b.dataset.next !== undefined) load(ci + 1);
    else if (b.dataset.hint !== undefined) {
      if (!ran) return say("First commit to an idea: build it and press ▶ Run. Then I can help you reason about what you observe.");
      say(`${hintI === 0 ? "Consider this." : "A further hint."} ${ch.hints[Math.min(hintI, ch.hints.length - 1)]}`);
      hintI += 1;
    } else if (b.dataset.show !== undefined) {
      st.setProg(ch.sol());
      say(`Here is a worked solution. ${ch.why} Press ▶ Run to verify it, then explain it in your own words.`);
    } else if (b.dataset.explain !== undefined) {
      b.removeAttribute("data-pulse");
      explainCard({ title: ch.goal, where: `${uid}#${ci + 1}`, model: ch.why, ...EXPLAIN[key] });
    } else if (b.dataset.real !== undefined) realCard(REAL[key]);
  };
  load(ci);
  return st;
}

  const st = makeStudio({
    onChange: (prog) => store.set(keyOf("cur"), prog),
    onFinish(S, prog, reason) {
      if (my !== token) return;
      window.OC?.count("programs run");
      const bits = [];
      if (S.lines.length) bits.push(`${S.lines.length} line${S.lines.length === 1 ? "" : "s"} drawn`);
      if (S.said.length) bits.push(`said ${S.said.slice(0, 8).join(", ")}${S.said.length > 8 ? " …" : ""}`);
      if (S.shown.length) bits.push(S.shown.map((n) => `${n} = ${fmt(S.vars[n])}`).join(", "));
      say(`${reason === "limit" ? "I stopped the program after a very long run. " : reason === "user" ? "Stopped. " : "Finished. "}${bits.length ? "Result: " + bits.join("; ") + "." : "Nothing visible happened. Is the pen down, or does the robot say anything?"}${S.warn ? " " + S.warn : ""}`, { voice: reason !== "end" || !bits.length });
    },
  });
  const saved = store.get(keyOf("cur"));
  st.load(validProg(saved) ? saved : [], {}, null, "🎨 Free studio: build anything");
  say("This is your studio. Build any program; it is kept automatically. Use the slots to save programs you wish to keep.");
  host.onclick = (e) => {
    if (my !== token) return;
    const b = e.target.closest("button");
    if (!b) return;
    window.OC?.touch();
    if (b.dataset.slotN) {
      slot = Number(b.dataset.slotN);
      host.querySelectorAll("[data-slot-n]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      const has = validProg(store.get(keyOf("slot" + slot)));
      say(`Slot ${slot} is ${has ? "holding a program. Press Load to open it, or Save to replace it" : "empty. Press Save to keep your current program there"}.`);
    } else if (b.dataset.save !== undefined) {
      const ok = store.set(keyOf("slot" + slot), st.prog);
      MUSIC.chime();
      say(ok ? `Saved in slot ${slot}.` : "This browser would not save. Ask a grown-up to check the privacy settings.");
    } else if (b.dataset.load !== undefined) {
      const p = store.get(keyOf("slot" + slot));
      if (!validProg(p)) return say(`Slot ${slot} is empty.`);
      st.setProg(p);
      say(`Loaded slot ${slot}. Press ▶ Run.`);
    } else if (b.dataset.ex !== undefined) {
      const [name, make] = EXAMPLES[ex % EXAMPLES.length];
      ex += 1;
      st.setProg(make());
      say(`Example: ${name}. Read it first and predict what it will do; then press ▶ Run to test your prediction.`);
    } else if (b.dataset.new !== undefined) {
      st.setProg([]);
      say("A clean page. Your saved slots are untouched.");
    } else if (b.dataset.explain !== undefined) {
      explainCard({ title: "your own program", where: "studio", words: "algorithm, loop, variable, condition", prompt: "Explain what your program does, block by block, and what you would change to improve it.", model: "A strong explanation names the goal, describes each part in order (for example: the loop repeats the move and turn twelve times), and says why the result follows from the instructions." });
    }
  };
  return st;
}
