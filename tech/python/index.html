<script>const { $, el, svg: makeSvg, text, panel, say, pick, wait, confetti, explain, everyday, emoji } = KIT;
const stage = $("[data-stage]");
let token = 0;
const C = String.raw;

// ===== PYTHON ENGINE =====
// Real CPython (Pyodide, pinned version) runs inside a Web Worker, so a runaway program can never freeze the page:
// a step limit (sys.settrace) stops long loops politely, and a wall-clock timeout terminates the worker as a last resort.
// Pyodide is about 10 MB; it is fetched only when a coding unit opens, and the CDN lets the browser cache it for a year.
const PYODIDE_URL = "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/";
const STEP_LIMIT = 200000;

// The turtle's pen lives in JavaScript (in the worker); the Python module "turtle" below is a thin, checked wrapper over it.
const WORKER_SRC = C`
let py = null;
const T = { x: 0, y: 0, h: 0, pen: true, c: "#2b1d12", w: 3, segs: [], shown: true, fc: "#2b1d12", fill: null, fills: [], bg: "" };
const R = (v) => Math.round(v * 1e6) / 1e6;
function moveTo(nx, ny) {
  nx = R(nx); ny = R(ny);
  if (T.pen && (nx !== T.x || ny !== T.y)) T.segs.push([T.x, T.y, nx, ny, T.c, T.w]);
  if (T.fill && T.fill.pts.length < 20000) T.fill.pts.push([nx, ny]);
  T.x = nx; T.y = ny;
}
const ocjs = {
  reset() { Object.assign(T, { x: 0, y: 0, h: 0, pen: true, c: "#2b1d12", w: 3, segs: [], shown: true, fc: "#2b1d12", fill: null, fills: [], bg: "" }); },
  fd(d) { const a = (T.h * Math.PI) / 180; moveTo(T.x + d * Math.cos(a), T.y + d * Math.sin(a)); },
  turn(a) { T.h = R((((T.h + a) % 360) + 360) % 360); },
  seth(a) { T.h = R(((a % 360) + 360) % 360); },
  goto(x, y) { moveTo(x, y); },
  pen(b) { T.pen = !!b; },
  isdown() { return T.pen; },
  color(c) { T.c = c; },
  getcolor() { return T.c; },
  width(w) { T.w = w; },
  getwidth() { return T.w; },
  x() { return T.x; },
  y() { return T.y; },
  h() { return T.h; },
  count() { return T.segs.length; },
  show(b) { T.shown = !!b; },
  fillcolor(c) { T.fc = c; },
  getfill() { return T.fc; },
  // As in Python's turtle, the fill sits beneath the lines drawn after begin_fill() and appears at end_fill().
  beginfill() { T.fill = { pts: [[T.x, T.y]], at: T.segs.length }; },
  endfill() {
    if (T.fill && T.fill.pts.length >= 3 && T.fills.length < 2000) T.fills.push({ pts: T.fill.pts, c: T.fc, at: T.fill.at, end: T.segs.length });
    T.fill = null;
  },
  filling() { return !!T.fill; },
  bg(c) { T.bg = c; },
};
self.onmessage = async (e) => {
  const m = e.data;
  if (m.type === "init") {
    try {
      importScripts(m.url + "pyodide.js");
      py = await loadPyodide({ indexURL: m.url });
      py.registerJsModule("_ocjs", ocjs);
      py.runPython(m.prelude);
      postMessage({ type: "ready", version: py.runPython("import sys; sys.version.split()[0]") });
    } catch (err) {
      postMessage({ type: "fail", msg: String(err && err.message ? err.message : err).slice(0, 300) });
    }
  } else if (m.type === "run") {
    let res;
    try {
      ocjs.reset();
      const fn = py.globals.get("_oc_run");
      res = JSON.parse(fn(m.code, m.tests || "", py.toPy(m.inputs || []), m.limit));
      fn.destroy();
    } catch (err) {
      res = { out: "", err: { type: "InternalError", msg: String(err).slice(0, 300), line: null }, fails: [], steps: 0 };
    }
    res.segs = T.segs.slice(0, 20000);
    res.turtle = { x: T.x, y: T.y, h: T.h, shown: T.shown };
    res.fills = T.fills;
    res.bg = T.bg;
    postMessage({ type: "done", id: m.id, res });
  }
};
`;

const PRELUDE = C`
import sys, json, builtins, traceback, types, math, re
import _ocjs

class _StepLimit(BaseException):
    pass

class _OutLimit(BaseException):
    pass

class _Out:
    # plain: only what print() wrote (this is what the checks compare); shown: the console view, which also
    # shows input() prompts and the preset answers, marked so that the page can style them.
    def __init__(self):
        self.parts = []
        self.shown = []
        self.n = 0
    def write(self, s):
        s = str(s)
        self.n += len(s)
        if self.n > 20000:
            raise _OutLimit()
        self.parts.append(s)
        self.shown.append(s)
        return len(s)
    def echo(self, prompt, value):
        self.n += len(prompt) + len(value)
        self.shown.append(prompt + "\x01" + value + "\x02\n")
    def flush(self):
        pass
    def getvalue(self):
        return "".join(self.parts)

_COLOURS = {
    "black": "#2b1d12", "white": "#ffffff", "red": "#e53935", "orange": "#fb8c00", "yellow": "#f2b705",
    "green": "#2e9d48", "blue": "#1e6fd9", "purple": "#8e24aa", "pink": "#ec4899", "brown": "#8d5a2b",
    "gray": "#7a7a7a", "gray": "#7a7a7a", "cyan": "#00acc1", "magenta": "#d81b60", "gold": "#d4a017",
    "navy": "#1a2f80", "teal": "#00897b", "violet": "#7e57c2", "lime": "#7cb342", "maroon": "#800000",
    "olive": "#7d7d00", "indigo": "#3f51b5", "turquoise": "#1ec8b4", "crimson": "#c8102e",
}

def _num(v, fname):
    if isinstance(v, bool) or not isinstance(v, (int, float)):
        raise TypeError(f"{fname}() needs a number, not {type(v).__name__} {v!r}")
    if v != v or v in (float("inf"), float("-inf")):
        raise ValueError(f"{fname}() needs an ordinary number, not {v!r}")
    return float(v)

def _room():
    if _ocjs.count() >= 20000:
        raise RuntimeError("the turtle has drawn more than 20,000 lines; that is the limit here")

def _colour(c, fname="color"):
    if isinstance(c, (tuple, list)) and len(c) == 3:
        if all(isinstance(v, (int, float)) and 0 <= v <= 1 for v in c):
            return "#%02x%02x%02x" % tuple(round(v * 255) for v in c)
        raise ValueError(f"{fname}(): each of the three color numbers must be between 0 and 1")
    if not isinstance(c, str):
        raise TypeError(f"{fname}() needs a color name in quotation marks, such as 'red'")
    s = c.strip().lower()
    if s in _COLOURS:
        return _COLOURS[s]
    if re.fullmatch(r"#[0-9a-f]{6}", s):
        return s
    if re.fullmatch(r"#[0-9a-f]{3}", s):
        return "#" + "".join(ch * 2 for ch in s[1:])
    raise ValueError(f"I do not know the color {c!r}. Try 'red', 'blue', 'green' or a code such as '#ff8800'")

turtle = types.ModuleType("turtle")
turtle.__doc__ = ("OakCrest turtle: forward, back, left, right, penup, pendown, color, pencolor, fillcolor, begin_fill, end_fill, "
                  "bgcolor, pensize, goto, setheading, home, circle, position, heading. Angles are in degrees; heading 0 is east "
                  "and positive angles turn counterclockwise, as in Python's own turtle. Differences: there is one turtle (Turtle() "
                  "gives you that same turtle), and speed() has no effect: the drawing is shown when the program ends.")

def forward(distance):
    d = _num(distance, "forward")
    _room()
    _ocjs.fd(d)

def back(distance):
    forward(-_num(distance, "back"))

def left(angle):
    _ocjs.turn(_num(angle, "left"))

def right(angle):
    _ocjs.turn(-_num(angle, "right"))

def penup():
    _ocjs.pen(False)

def pendown():
    _ocjs.pen(True)

def isdown():
    return bool(_ocjs.isdown())

def _one(args, fname):
    # A color given as one value ('red', '#ff8800', (1, 0.5, 0)) or as three numbers (1, 0.5, 0).
    if len(args) == 3:
        return _colour(tuple(args), fname)
    if len(args) == 1:
        return _colour(args[0], fname)
    raise TypeError(f"{fname}() needs one color, such as 'red'")

def pencolor(*args):
    if not args:
        return _ocjs.getcolor()
    _ocjs.color(_one(args, "pencolor"))

def fillcolor(*args):
    if not args:
        return _ocjs.getfill()
    _ocjs.fillcolor(_one(args, "fillcolor"))

def color(*args):
    # As in Python's turtle: color('red') sets the pen and the fill; color('red', 'yellow') sets the pen, then the fill.
    if not args:
        return (_ocjs.getcolor(), _ocjs.getfill())
    if len(args) == 2:
        _ocjs.color(_colour(args[0]))
        _ocjs.fillcolor(_colour(args[1]))
        return
    c = _one(args, "color")
    _ocjs.color(c)
    _ocjs.fillcolor(c)

def begin_fill():
    _ocjs.beginfill()

def end_fill():
    _ocjs.endfill()

def filling():
    return bool(_ocjs.filling())

def bgcolor(*args):
    if args:
        _ocjs.bg(_one(args, "bgcolor"))

def pensize(width=None):
    if width is None:
        return _ocjs.getwidth()
    w = _num(width, "pensize")
    if w <= 0 or w > 40:
        raise ValueError("pensize() needs a number greater than 0 and no more than 40")
    _ocjs.width(w)

def goto(x, y=None):
    if y is None and isinstance(x, (tuple, list)):
        x, y = x
    x = _num(x, "goto")
    y = _num(y, "goto")
    _room()
    _ocjs.goto(x, y)

def setheading(angle):
    _ocjs.seth(_num(angle, "setheading"))

def home():
    goto(0, 0)
    setheading(0)

class Vec2D(tuple):
    # Python's turtle reports positions as a Vec2D, which prints with two decimal places, such as (0.00,100.00).
    def __repr__(self):
        return "(%.2f,%.2f)" % self

def position():
    return Vec2D((xcor(), ycor()))

def xcor():
    return float(round(_ocjs.x(), 4)) + 0.0

def ycor():
    return float(round(_ocjs.y(), 4)) + 0.0

def heading():
    return float(round(_ocjs.h(), 4) % 360) + 0.0

def circle(radius, extent=360, steps=None):
    r = _num(radius, "circle")
    ext = _num(extent, "circle")
    if steps is None:
        steps = max(12, min(120, int(abs(ext) / 360 * (24 + abs(r) / 4))))
    w = ext / steps
    w2 = 0.5 * w
    ln = 2 * r * math.sin(math.radians(w2))
    if r < 0:
        ln, w, w2 = -ln, -w, -w2
    left(w2)
    for _ in range(int(steps)):
        forward(ln)
        left(w)
    left(-w2)

def _nothing(*args, **kwargs):
    return None

def hideturtle():
    _ocjs.show(False)

def showturtle():
    _ocjs.show(True)

_made = [0]

class Turtle:
    # This page has a single turtle. One Turtle() works as in Python; a second would silently share the first one's pen,
    # so it is refused with an honest message instead.
    def __init__(self, *args, **kwargs):
        _made[0] += 1
        if _made[0] > 1:
            raise NotImplementedError("this page has only one turtle, so Turtle() can be used once per program. In full Python each Turtle() is a separate turtle.")
    def __getattr__(self, name):
        return getattr(turtle, name)

class _Screen:
    def bgcolor(self, *args):
        return bgcolor(*args)
    def __getattr__(self, name):
        return _nothing

def Screen():
    return _Screen()

_names = dict(forward=forward, fd=forward, back=back, bk=back, backward=back, left=left, lt=left, right=right, rt=right,
              penup=penup, pu=penup, up=penup, pendown=pendown, pd=pendown, down=pendown, isdown=isdown,
              color=color, pencolor=pencolor, fillcolor=fillcolor, begin_fill=begin_fill, end_fill=end_fill, filling=filling,
              bgcolor=bgcolor, pensize=pensize, width=pensize, goto=goto, setpos=goto, setposition=goto,
              setheading=setheading, seth=setheading, home=home, position=position, pos=position, xcor=xcor, ycor=ycor,
              heading=heading, circle=circle, speed=_nothing, done=_nothing, mainloop=_nothing, exitonclick=_nothing,
              hideturtle=hideturtle, ht=hideturtle, showturtle=showturtle, st=showturtle, shape=_nothing,
              tracer=_nothing, Vec2D=Vec2D,
              Turtle=Turtle, Screen=Screen)
turtle.__all__ = list(_names)
_BUILTINS = dict(builtins.__dict__)

def _fresh():
    # Each run starts clean, even if the last program reassigned something (turtle.color = 'red', builtins.print = ...).
    for k, v in _names.items():
        setattr(turtle, k, v)
    for k in [k for k in vars(turtle) if k not in _names and not k.startswith("__")]:
        delattr(turtle, k)
    sys.modules["turtle"] = turtle
    for k, v in _BUILTINS.items():
        if builtins.__dict__.get(k) is not v:
            setattr(builtins, k, v)
    sys.setrecursionlimit(1000)
    _made[0] = 0

_fresh()

def _oc_run(code, tests, inputs, limit):
    _fresh()
    out = _Out()
    steps = [0]
    feed = [str(v) for v in inputs]
    fails = []

    def _input(prompt=""):
        if not feed:
            out.echo(str(prompt), "?")
            raise EOFError("input() was called, but there are no more preset inputs")
        v = feed.pop(0)
        out.echo(str(prompt), v)
        return v

    def local(frame, event, arg):
        if event == "line":
            steps[0] += 1
            if steps[0] > limit:
                raise _StepLimit()
        return local

    def glob(frame, event, arg):
        if frame.f_code.co_filename == "<your code>":
            return local
        return None

    def check(got, want, label):
        if isinstance(want, bool):
            ok = got is want
        elif isinstance(want, float):
            ok = isinstance(got, (int, float)) and not isinstance(got, bool) and abs(got - want) < 1e-6
        else:
            ok = type(got) == type(want) and got == want
        if not ok and len(fails) < 4:
            fails.append(f"{label} gave {got!r}; the correct result is {want!r}")

    ns = {"__name__": "__main__", "__builtins__": builtins, "input": _input}
    err = None
    old = sys.stdout
    try:
        compiled = compile(code, "<your code>", "exec")
        sys.stdout = out
        sys.settrace(glob)
        exec(compiled, ns)
        if tests:
            tns = dict(ns)
            tns["_check"] = check
            exec(compile(tests, "<tests>", "exec"), tns)
    except SyntaxError as e:
        err = {"type": type(e).__name__, "msg": str(e.msg), "line": e.lineno if e.filename == "<your code>" else None}
    except _StepLimit:
        err = {"type": "StepLimit", "msg": f"more than {limit:,} steps", "line": None}
    except _OutLimit:
        err = {"type": "OutputLimit", "msg": "more than 20,000 characters of output", "line": None}
    except SystemExit:
        err = None
    except BaseException as e:
        tb = traceback.extract_tb(e.__traceback__)
        mine = [f.lineno for f in tb if f.filename == "<your code>"]
        where = tb[-1].filename if tb else ""
        line = mine[-1] if mine else None
        if isinstance(e, RecursionError) and len(mine) > 3:
            # The deepest frame stops on whatever line it had reached (often the def line); the recursive call is the
            # line that repeats in almost every frame.
            line = max(set(mine), key=mine.count)
        err = {"type": type(e).__name__, "msg": str(e)[:400], "line": line, "inTests": where == "<tests>" and not mine}
    finally:
        sys.settrace(None)
        sys.stdout = old
    # CPython switches tracing off once the tracer raises; if the program caught that exception, report the limit anyway.
    if err is None and steps[0] > limit:
        err = {"type": "StepLimit", "msg": f"more than {limit:,} steps", "line": None}
    return json.dumps({"out": out.getvalue(), "shown": "".join(out.shown), "err": err, "fails": fails, "steps": steps[0]})
`;

const PY = (() => {
  let worker = null;
  let ready = null;
  let state = "idle";
  let why = "";
  let pending = null;
  let seq = 0;
  let version = "";
  let chain = Promise.resolve();
  const listeners = new Set();
  const set = (s, info = "") => {
    state = s;
    why = info;
    listeners.forEach((f) => f(s, info));
  };
  function boot() {
    if (ready) return ready;
    set("loading");
    ready = new Promise((resolve) => {
      let w;
      try {
        w = new Worker(URL.createObjectURL(new Blob([WORKER_SRC], { type: "text/javascript" })));
      } catch (error) {
        ready = null;
        set("failed", String(error));
        return resolve(false);
      }
      worker = w;
      let timer = 0;
      const fail = (msg) => {
        clearTimeout(timer);
        w.terminate();
        if (worker === w) worker = null;
        ready = null;
        set("failed", msg);
        resolve(false);
      };
      timer = setTimeout(() => fail("Loading took longer than two minutes."), 120000);
      w.onmessage = (e) => {
        const m = e.data;
        if (m.type === "ready") {
          clearTimeout(timer);
          version = m.version;
          set("ready");
          resolve(true);
        } else if (m.type === "fail") fail(m.msg);
        else if (m.type === "done" && pending && m.id === pending.id) {
          const p = pending;
          pending = null;
          clearTimeout(p.timer);
          p.resolve(m.res);
          // A failure inside the runner itself can leave Python unusable: start a fresh one for the next run.
          if (m.res.err && m.res.err.type === "InternalError") abort("InternalError");
        }
      };
      w.onerror = (e) => {
        e.preventDefault?.();
        fail(e.message || "The Python worker stopped.");
      };
      w.postMessage({ type: "init", url: PYODIDE_URL, prelude: PRELUDE });
    });
    return ready;
  }
  // Ends a run that will not finish (or that the learner stops) by discarding the worker; Python reloads from the browser cache.
  function abort(type) {
    if (worker) worker.terminate();
    worker = null;
    ready = null;
    set("idle");
    if (pending) {
      const p = pending;
      pending = null;
      clearTimeout(p.timer);
      p.resolve({ out: "", err: { type, msg: "", line: null }, fails: [], segs: [], steps: 0 });
    }
    boot();
  }
  function runNow(code, { tests = "", inputs = [], limit = STEP_LIMIT, wall = 9000 } = {}) {
    return boot().then((ok) => {
      if (!ok || !worker) return { out: "", err: { type: "Unavailable", msg: why, line: null }, fails: [], segs: [], steps: 0 };
      return new Promise((resolve) => {
        const id = ++seq;
        pending = { id, resolve, timer: setTimeout(() => abort("Timeout"), wall) };
        worker.postMessage({ type: "run", id, code, tests, inputs, limit });
      });
    });
  }
  return {
    boot,
    run: (code, opts) => (chain = chain.then(() => runNow(code, opts))),
    stop: () => pending && abort("Stopped"),
    busy: () => !!pending,
    state: () => state,
    why: () => why,
    version: () => version,
    on: (f) => listeners.add(f),
    off: (f) => listeners.delete(f),
  };
})();

// ---- output and drawing checks (pure) ----
const linesOf = (s) => {
  const out = String(s || "").replace(/\r/g, "").split("\n").map((l) => l.replace(/\s+$/, ""));
  while (out.length && out[out.length - 1] === "") out.pop();
  return out;
};
const sameOut = (a, b) => linesOf(a).join("\n") === linesOf(b).join("\n");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const show = (s) => `<code>${esc(s === "" ? "(an empty line)" : s)}</code>`;

function outReason(got, want) {
  const g = linesOf(got);
  const w = linesOf(want);
  if (!g.length) return "Your program printed nothing. Which line should print?";
  for (let i = 0; i < Math.max(g.length, w.length); i++) {
    if (g[i] === w[i]) continue;
    if (g[i] === undefined) return `Your output stops after ${g.length} line${g.length === 1 ? "" : "s"}; the goal has ${w.length}. Line ${i + 1} should be ${show(w[i])}.`;
    if (w[i] === undefined) return `Your output has ${g.length} lines; the goal has only ${w.length}. Line ${i + 1}, ${show(g[i])}, is extra.`;
    const caseOnly = g[i].toLowerCase() === w[i].toLowerCase();
    const spaceOnly = g[i].replace(/\s+/g, "") === w[i].replace(/\s+/g, "");
    return `Line ${i + 1} of your output is ${show(g[i])}; the goal is ${show(w[i])}.${caseOnly ? " Look closely at capital letters: Python treats them as different characters." : spaceOnly ? " Look closely at the spaces." : ""}`;
  }
  return true;
}

// Merges a run of connected, same-direction strokes into sides, so that forward(50) twice counts as one side of 100.
function sides(segs) {
  const out = [];
  for (const [x1, y1, x2, y2, c] of segs) {
    const len = Math.hypot(x2 - x1, y2 - y1);
    if (len < 1e-6) continue;
    const dir = Math.atan2(y2 - y1, x2 - x1);
    const last = out[out.length - 1];
    if (last && Math.abs(last.x2 - x1) < 0.01 && Math.abs(last.y2 - y1) < 0.01 && Math.abs(Math.sin(last.dir - dir)) < 1e-4 && Math.cos(last.dir - dir) > 0) {
      last.x2 = x2;
      last.y2 = y2;
      last.len += len;
    } else out.push({ x1, y1, x2, y2, len, dir, c });
  }
  return out;
}
function shapeInfo(segs) {
  const s = sides(segs);
  if (!s.length) return { n: 0, sides: s, closed: false, turning: 0, colours: 0 };
  const closed = Math.hypot(s[s.length - 1].x2 - s[0].x1, s[s.length - 1].y2 - s[0].y1) < 0.5;
  let turn = 0;
  for (let i = 0; i < s.length; i++) {
    if (i === s.length - 1 && !closed) break;
    const a = s[i].dir;
    const b = s[(i + 1) % s.length].dir;
    let d = ((b - a) * 180) / Math.PI;
    while (d > 180) d -= 360;
    while (d <= -180) d += 360;
    turn += d;
  }
  return { n: s.length, sides: s, closed, turning: Math.round(Math.abs(turn) / 360), colours: new Set(segs.map((x) => x[4])).size };
}
const r1 = (v) => Math.round(v * 10) / 10;
// A regular closed figure: n equal sides of a given length, and (for stars) a given turning number.
function polyCheck({ n, len, turning = 1 }, segs) {
  const info = shapeInfo(segs);
  if (!info.n) return "Nothing was drawn. Is the pen down, and does the turtle move forward?";
  if (info.n !== n) return `I count ${info.n} side${info.n === 1 ? "" : "s"}; this figure needs exactly ${n}.${info.n > n ? " Check how many times your loop repeats." : ""}`;
  const off = info.sides.find((s) => Math.abs(s.len - len) > 0.5);
  if (off) return `Every side should be ${len} long, but one side is ${r1(off.len)}.`;
  if (!info.closed) {
    const e = info.sides[info.sides.length - 1];
    return `The figure does not close: the last side ends at (${r1(e.x2)}, ${r1(e.y2)}), not back at the start (${r1(info.sides[0].x1)}, ${r1(info.sides[0].y1)}). Check the angle of each turn.`;
  }
  if (info.turning !== turning) return turning === 1 ? "The sides cross each other, so this is not a simple polygon. Check the turning angle: the turns of a polygon add up to 360°." : `The turtle turned through ${info.turning * 360}° in total; this star needs ${turning * 360}° (${turning} full turns).`;
  return true;
}

// Runs one exercise and returns the visible run plus a verdict: true, or a reason (HTML) why it is not yet correct.
async function evaluate(item, code) {
  const res = await PY.run(code, { tests: item.tests || "", inputs: item.inputs || [] });
  const verdict = await judge(item, code, res);
  return { res, verdict };
}
async function judge(item, code, res) {
  if (res.err) return errorReason(res.err);
  if (item.tests && res.fails.length) return `Your code ran, but a test failed: ${show(res.fails[0])}.${res.fails.length > 1 ? ` (${res.fails.length} tests failed.)` : ""}`;
  if (item.out !== undefined) {
    const r = outReason(res.out, item.out);
    if (r !== true) return r;
  }
  if (item.last !== undefined) {
    const g = linesOf(res.out);
    const l = g[g.length - 1];
    if (l !== item.last) return `The last line of your output is ${show(l ?? "")}; it should be ${show(item.last)}.`;
  }
  if (item.lastNum !== undefined) {
    const g = linesOf(res.out);
    const v = Number((g[g.length - 1] || "").trim());
    if (!Number.isFinite(v) || Math.abs(v - item.lastNum) > 1e-6) return `The last line of your output is ${show(g[g.length - 1] ?? "")}; it should be the number ${item.lastNum}.`;
  }
  if (item.draw) {
    const r = typeof item.draw === "function" ? item.draw(res.segs, shapeInfo(res.segs), res) : polyCheck(item.draw, res.segs);
    if (r !== true) return r;
  }
  if (item.check) {
    const r = item.check(res, code);
    if (r !== true) return r;
  }
  const bare = code.replace(/#.*$/gm, "");
  for (const [re, msg] of item.need || []) if (!re.test(bare)) return `The result is right, but ${msg}`;
  for (const [re, msg] of item.avoid || []) if (re.test(bare)) return `The result is right, but ${msg}`;
  // A correct program is correct for every value, not only the one in front of you: re-run it with other values.
  for (const v of item.vary || []) {
    let c2 = code;
    if (v.sub) {
      if (!v.sub[0].test(c2)) return `Keep the line that sets ${v.name || "the starting value"} (such as ${show(v.sub[1])}) so that I can test your program with other values.`;
      c2 = c2.replace(v.sub[0], v.sub[1]);
    }
    const r2 = await PY.run(c2, { tests: item.tests || "", inputs: v.inputs || item.inputs || [] });
    const when = v.sub ? `with ${show(v.sub[1])}` : `with the inputs ${(v.inputs || []).map(show).join(" and ")}`;
    if (r2.err) return `Your program works for the first value, but ${when} it stops with ${r2.err.type === "StepLimit" ? "a loop that never ends" : `a ${esc(r2.err.type)}`}. A program must be correct for every value, not just one.`;
    const g = linesOf(r2.out);
    let ok = true;
    let want = "";
    if (v.out !== undefined) {
      ok = sameOut(r2.out, v.out);
      want = linesOf(v.out).join(" / ");
    } else if (v.last !== undefined) {
      ok = g[g.length - 1] === v.last;
      want = v.last;
    } else if (v.lastNum !== undefined) {
      ok = Math.abs(Number((g[g.length - 1] || "").trim()) - v.lastNum) < 1e-6;
      want = String(v.lastNum);
    }
    if (!ok) return `It works for the first value, but ${when} it prints ${show(v.last !== undefined || v.lastNum !== undefined ? g[g.length - 1] ?? "" : g.join(" / "))} instead of ${show(want)}. A program must be correct for every value, not just one.`;
  }
  return true;
}

  SyntaxError: "Python could not read this line. Look for a missing colon at the end of an if, for, while or def line, a missing bracket, or a missing quotation mark.",
  IndentationError: "The spaces at the start of the line do not match. The lines inside a block (after a colon) are indented by the same amount, usually 4 spaces.",
  TabError: "Tabs and spaces are mixed. Use 4 spaces for each level of indentation.",
  NameError: "Python does not know this name. Is it spelled exactly the same everywhere (capitals matter)? Was it given a value on an earlier line? Words meant as text need quotation marks.",
  TypeError: "A value of the wrong type was used: for example, adding a number to a string, or calling a function with the wrong number of arguments (the values in the brackets).",
  ValueError: "The type is right but the value is not acceptable, such as int('seven').",
  ZeroDivisionError: "Division by zero has no answer, in Python or in mathematics.",
  IndexError: "There is no item at that position. Positions start at 0, so a list of 3 items has positions 0, 1 and 2.",
  KeyError: "That key is not in the dictionary.",
  AttributeError: "This kind of value has no method or attribute with that name. Check the spelling after the dot.",
  RecursionError: "A function kept calling itself and never reached a stopping case (a base case).",
  EOFError: "The program asked for more input() values than the preset inputs provide.",
  UnboundLocalError: "A variable was used inside a function before it was given a value there.",
  StepLimit: `The program ran more than ${STEP_LIMIT.toLocaleString("en")} steps, so I stopped it. A while loop whose condition never becomes False runs forever.`,
  OutputLimit: "The program printed more than 20,000 characters, so I stopped it. Is a loop printing without end?",
  Timeout: "The program took too long (more than a few seconds), so I stopped it and restarted Python.",
  Stopped: "You stopped the program.",
  Unavailable: "Python is not loaded, so the program could not run.",
  InternalError: "Something went wrong inside the Python runner. Press Run again.",
};
function errorReason(err) {
  if (["Stopped", "Timeout", "Unavailable", "InternalError"].includes(err.type)) return ERR_HELP[err.type];
  const where = err.line ? ` on line ${err.line}` : "";
  if (err.inTests && err.type === "NameError") {
    const name = (err.msg.match(/'([^']+)'/) || [])[1];
    return `Your code must define the function ${show(name || "?")} exactly as named in the task. I could not find it.`;
  }
  return `Your program stopped with a <b>${esc(err.type === "StepLimit" ? "step limit" : err.type)}</b>${where}. ${ERR_HELP[err.type] || "Read the message in the output: it names the problem."}`;
}

.py-ed:focus-within{box-shadow:0 0 0 3px var(--accent)}
.py-lock{position:absolute;right:10px;bottom:8px;padding:3px 10px;border-radius:10px;background:#efe5d6;color:#6b5a48;font:800 13px/1.4 var(--sans);pointer-events:none}
.py-side{grid-area:side;display:flex;flex-direction:column;gap:8px;min-height:0}
.py-canvas{position:relative;flex:1.5 1 0;min-height:0;border-radius:16px;background:#fffdf8;box-shadow:0 0 0 1px #eadfce;overflow:hidden}

.py-canvas>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.py-con{flex:1 1 0;min-height:90px;display:flex;flex-direction:column;border-radius:16px;background:#2a1f17;box-shadow:0 0 0 1px #1b130d;overflow:hidden}
.py-con-h{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#3a2c20;color:#e8d9c0;font:800 14px/1.3 var(--sans)}

.py-con-h i.ok{background:#1f5f3a;color:#d9f5e3}
.py-con-h i.bad{background:#7a2a1d;color:#ffe1d8}

.py-out .err{display:block;margin-top:6px;color:#ffb4a2}

.py-out .note{color:#bfae94;font-family:var(--sans);font-weight:700}
.py-out .load{display:block;color:#e8d9c0;font-family:var(--sans);font-weight:700;line-height:1.4}
.py-out .load::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:py-dots 1.6s steps(4) infinite}
.py-out button{margin-top:8px;min-height:44px;padding:0 16px;border:0;border-radius:14px;background:#f6ecd9;color:#2a1f17;font:800 16px/1 var(--sans);cursor:pointer}
@keyframes py-dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

// ---- the turtle's stage ----
function drawTurtle(svgEl, segs, tur, { animate = false, alive = () => true } = {}) {
  svgEl.innerHTML = "";
  let x0 = -300;
  let x1 = 300;
  let y0 = -220;
  let y1 = 220;
  for (const [a, b, c, d] of segs) {
    x0 = Math.min(x0, a - 20, c - 20);
    x1 = Math.max(x1, a + 20, c + 20);
    y0 = Math.min(y0, b - 20, d - 20);
    y1 = Math.max(y1, b + 20, d + 20);
  }
  if (tur) {
    x0 = Math.min(x0, tur.x - 20);
    x1 = Math.max(x1, tur.x + 20);
    y0 = Math.min(y0, tur.y - 20);
    y1 = Math.max(y1, tur.y + 20);
  }
  const fills = (tur && tur.fills) || [];
  for (const f of fills)
    for (const [a, b] of f.pts) {
      x0 = Math.min(x0, a - 20);
      x1 = Math.max(x1, a + 20);
      y0 = Math.min(y0, b - 20);
      y1 = Math.max(y1, b + 20);
    }
  const k = Math.max((x1 - x0) / 600, (y1 - y0) / 440);
  svgEl.setAttribute("viewBox", `${x0} ${-y1} ${x1 - x0} ${y1 - y0}`);
  const g = el("g", { transform: "scale(1 -1)" }, svgEl);
  if (tur && tur.bg) el("rect", { x: x0 - 5000, y: y0 - 5000, width: x1 - x0 + 10000, height: y1 - y0 + 10000, fill: tur.bg }, g);
  const grid = el("g", { stroke: "#efe5d6", "stroke-width": k }, g);
  for (let x = Math.ceil(x0 / 50) * 50; x <= x1; x += 50) el("line", { x1: x, x2: x, y1: y0, y2: y1, stroke: x === 0 ? "#dccbb0" : undefined, "stroke-width": x === 0 ? 2 * k : undefined }, grid);
  for (let y = Math.ceil(y0 / 50) * 50; y <= y1; y += 50) el("line", { y1: y, y2: y, x1: x0, x2: x1, stroke: y === 0 ? "#dccbb0" : undefined, "stroke-width": y === 0 ? 2 * k : undefined }, grid);
  const ink = el("g", { "stroke-linecap": "round", "stroke-linejoin": "round", fill: "none" }, g);
  const sprite = el("g", {}, g);
  el("path", { d: "M14 0L-9 8.5L-4 0L-9 -8.5Z", fill: "var(--accent)", stroke: "#fff", "stroke-width": 1.5 }, sprite);
  const place = (x, y, h) => sprite.setAttribute("transform", `translate(${x} ${y}) rotate(${h}) scale(${Math.max(1, k)})`);
  const lines = [];
  const line = (s) => lines.push(el("line", { x1: s[0], y1: s[1], x2: s[2], y2: s[3], stroke: s[4], "stroke-width": s[5] * Math.max(1, k * 0.8) }, ink));
  // A fill appears once the lines up to its end_fill() are drawn, beneath the lines drawn after its begin_fill().
  let filled = 0;
  const fillUpTo = (n) => {
    while (filled < fills.length && fills[filled].end <= n) {
      const f = fills[filled++];
      const poly = el("polygon", { points: f.pts.map((p) => p.join(",")).join(" "), fill: f.c, stroke: "none", "fill-rule": "evenodd" }, ink);
      if (lines[f.at]) ink.insertBefore(poly, lines[f.at]);
    }
  };
  const end = () => {
    if (tur) place(tur.x, tur.y, tur.h);
    sprite.style.display = tur && tur.shown === false ? "none" : "";
  };
  place(0, 0, 0);
  if (!animate || KIT.still.matches || !segs.length) {
    segs.forEach(line);
    fillUpTo(Infinity);
    end();
    return Promise.resolve();
  }
  const total = Math.min(2600, 260 + segs.length * 45);
  return new Promise((resolve) => {
    const t0 = performance.now();
    let drawn = 0;
    const frame = (now) => {
      if (!alive() || !svgEl.isConnected) return resolve();
      const want = Math.min(segs.length, Math.ceil(((now - t0) / total) * segs.length));
      while (drawn < want) line(segs[drawn++]);
      fillUpTo(drawn);
      const s = segs[drawn - 1];
      if (s) place(s[2], s[3], (Math.atan2(s[3] - s[1], s[2] - s[0]) * 180) / Math.PI);
      if (drawn < segs.length) requestAnimationFrame(frame);
      else {
        end();
        resolve();
      }
    };
    requestAnimationFrame(frame);
  });
}

// ---- the editor, console and stage, drawn inside [data-stage] ----
function makeIDE({ onRun, onChange }) {
  const my = token;
  stage.innerHTML = "";
  const app = document.createElement("div");
  app.className = "py-app";
  app.innerHTML = `
<div class="py-top">
  <div class="py-goal" data-goal><small data-lv></small><span data-title></span></div>
  <div class="py-tools">
    <div class="py-tabs" role="group" aria-label="View"><button type="button" data-tab="code" aria-pressed="true">Code</button><button type="button" data-tab="out" aria-pressed="false">Output</button></div>
    <button type="button" data-reset aria-label="Restore the starting code" title="Restore the starting code">↺</button>
    <button type="button" data-indent aria-label="Insert an indent of four spaces" title="Indent (4 spaces)">⇥</button>
    <button type="button" class="go" data-run aria-label="Run">▶ <span class="lbl">Run</span></button>
    <button type="button" class="halt" data-stop aria-label="Stop" hidden>■ <span class="lbl">Stop</span></button>
  </div>
</div>
<div class="py-ed"><div class="py-gut" data-gut aria-hidden="true"></div><textarea class="py-ta" data-ta spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-label="Python code"></textarea><span class="py-lock" data-lock hidden>Read only: predict first</span></div>
<div class="py-pick" data-pick hidden></div>
<div class="py-side">
  <div class="py-canvas" data-canvas hidden></div>
  <div class="py-con"><div class="py-con-h"><b>Output</b><span data-inputs></span><i data-state></i></div><pre class="py-out" data-out aria-live="polite"></pre></div>
</div>`;
  stage.appendChild(app);
  const q = (s) => app.querySelector(s);
  const ta = q("[data-ta]");
  const gut = q("[data-gut]");
  const out = q("[data-out]");
  const canvasBox = q("[data-canvas]");
  const canvas = makeSvg("-300 -220 600 440", canvasBox);
  let bad = 0;
  let wantCanvas = false;

  const gutter = () => {
    const n = ta.value.split("\n").length;
    gut.innerHTML = Array.from({ length: n }, (_, i) => `<b${i + 1 === bad ? ' class="bad"' : ""}>${i + 1}</b>`).join("");
    gut.scrollTop = ta.scrollTop;
  };
  ta.addEventListener("scroll", () => (gut.scrollTop = ta.scrollTop));
  ta.addEventListener("input", () => {
    // iPad keyboards turn " and ' into curly quotation marks, which Python rejects; straighten them as they are typed.
    if (/[\u201c\u201d\u201e\u2018\u2019\u201a]/.test(ta.value)) {
      const a = ta.selectionStart;
      const b = ta.selectionEnd;
      ta.value = ta.value.replace(/[\u201c\u201d\u201e]/g, '"').replace(/[\u2018\u2019\u201a]/g, "'");
      ta.setSelectionRange(a, b);
    }
    bad = 0;
    gutter();
    onChange?.(ta.value);
  });
  // execCommand keeps the browser's undo history; setRangeText is the fallback.
  const insert = (s) => {
    ta.focus();
    const a = ta.selectionStart;
    const b = ta.selectionEnd;
    const done = s === "" ? a === b || document.execCommand?.("delete", false) : document.execCommand?.("insertText", false, s);
    if (!done) {
      ta.setRangeText(s, a, b, "end");
      ta.dispatchEvent(new Event("input"));
    }
    if (ta.selectionStart !== a + s.length) ta.setSelectionRange(a + s.length, a + s.length);
  };
  ta.addEventListener("keydown", (e) => {
    if (ta.readOnly) return;
    const v = ta.value;
    const a = ta.selectionStart;
    const b = ta.selectionEnd;
    const lineStart = v.lastIndexOf("\n", a - 1) + 1;
    if (e.key === "Tab") {
      e.preventDefault();
      if (a !== b && v.slice(a, b).includes("\n")) {
        // Indent or dedent every selected line.
        const end = v.indexOf("\n", b - 1) < 0 ? v.length : v.indexOf("\n", b - 1);
        const block = v.slice(lineStart, end);
        const next = block.split("\n").map((l) => (e.shiftKey ? l.replace(/^ {1,4}/, "") : "    " + l)).join("\n");
        ta.setSelectionRange(lineStart, end);
        insert(next);
        ta.setSelectionRange(lineStart, lineStart + next.length);
      } else if (e.shiftKey) {
        const lead = (v.slice(lineStart).match(/^ */) || [""])[0].length;
        const cut = Math.min(4, lead);
        if (cut) {
          ta.setSelectionRange(lineStart, lineStart + cut);
          insert("");
          ta.setSelectionRange(Math.max(lineStart, a - cut), Math.max(lineStart, a - cut));
        }
      } else insert("    ");
    } else if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
      e.preventDefault();
      q("[data-run]").click();
    } else if (e.key === "Enter" && !e.shiftKey && !e.altKey) {
      e.preventDefault();
      const line = v.slice(lineStart, a);
      let ind = (line.match(/^ */) || [""])[0];
      if (/:\s*(#.*)?$/.test(line)) ind += "    ";
      insert("\n" + ind);
    } else if (e.key === "Backspace" && a === b && a > lineStart) {
      const before = v.slice(lineStart, a);
      if (/^ +$/.test(before) && before.length % 4 === 0) {
        e.preventDefault();
        ta.setSelectionRange(a - 4, a);
        insert("");
      }
    }
  });
  const indentBtn = q("[data-indent]");
  indentBtn.addEventListener("pointerdown", (e) => e.preventDefault());
  indentBtn.addEventListener("click", () => !ta.readOnly && insert("    "));

  const setTab = (t) => {
    app.classList.toggle("out", t === "out");
    app.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.tab === t)));
  };
  app.querySelector(".py-tabs").addEventListener("click", (e) => {
    const b = e.target.closest("[data-tab]");
    if (b) setTab(b.dataset.tab);
  });
  const fit = () => {
    const w = stage.clientWidth;
    const h = stage.clientHeight;
    const compact = w < 700;
    app.classList.toggle("compact", compact);
    app.classList.toggle("tiny", w < 400);
    app.classList.toggle("short", compact && h < 330);
    app.style.setProperty("--fs", w < 420 || h < 360 ? "15px" : compact || h < 470 ? "17px" : "20px");
  };
  const ro = new ResizeObserver(fit);
  ro.observe(stage);
  fit();

  // Python's loading state, shown calmly in the console header and in the output while nothing has run.
  let fresh = true;
  const paintState = () => {
    const s = PY.state();
    const chip = q("[data-state]");
    chip.className = s === "ready" ? "ok" : s === "failed" ? "bad" : "";
    chip.textContent = s === "ready" ? `Python ${PY.version()}` : s === "failed" ? "Python not loaded" : "Loading Python";
    const runBtn = q("[data-run]");
    runBtn.disabled = s !== "ready";
    runBtn.innerHTML = s === "ready" ? `▶ <span class="lbl">Run</span>` : s === "failed" ? `▶ <span class="lbl">Run</span>` : `⏳ <span class="lbl">Loading</span>`;
    runBtn.title = s === "ready" ? "Run (Ctrl or ⌘ + Enter)" : s === "failed" ? "Python is not loaded" : "Python is loading";
    if (s === "failed") {
      out.innerHTML = `<span class="note">Python could not be loaded. It is downloaded from cdn.jsdelivr.net, so it needs an internet connection; after the first visit the browser keeps a copy. Predictions still work, but programs cannot run until Python loads.</span>\n<button type="button" data-retry>↻ Try again</button>`;
      out.querySelector("[data-retry]").onclick = () => PY.boot();
    } else if (fresh) out.innerHTML = s === "ready" ? `<span class="note">Press ▶ Run to run the program. Its output appears here.</span>` : `<span class="load">Loading Python. The first time takes a little while (about 10 MB); afterwards your browser keeps a copy</span>`;
  };
  const onState = () => (stage.contains(app) && my === token ? paintState() : PY.off(onState));
  PY.on(onState);
  paintState();
  PY.boot();

  q("[data-run]").addEventListener("click", () => onRun());
  q("[data-stop]").addEventListener("click", () => PY.stop());

  const api = {
    app,
    ta,
    get code() {
      return ta.value;
    },
    set code(v) {
      ta.value = v;
      bad = 0;
      gutter();
      ta.scrollTop = 0;
      ta.scrollLeft = 0;
    },
    setGoal(lv, title, kind) {
      q("[data-lv]").textContent = lv ? `${LV[lv]} ${kind || ""}`.trim() : kind || "";
      q("[data-lv]").title = lv ? LV_NAME[lv] : "";
      q("[data-title]").textContent = title;
    },
    setInputs(list) {
      q("[data-inputs]").textContent = list && list.length ? `· preset inputs: ${list.join(", ")}` : "";
    },
    readOnly(on) {
      ta.readOnly = on;
      q("[data-lock]").hidden = !on;
      indentBtn.disabled = on;
    },
    canvas(on) {
      wantCanvas = on;
      canvasBox.hidden = !on;
      if (on) drawTurtle(canvas, [], { x: 0, y: 0, h: 0 });
    },
    tab: setTab,
    clear(msg) {
      fresh = !msg;
      bad = 0;
      gutter();
      if (msg && PY.state() !== "failed") out.innerHTML = `<span class="note">${msg}</span>`;
      else paintState();
      if (wantCanvas) drawTurtle(canvas, [], { x: 0, y: 0, h: 0 });
    },
    busy(on) {
      q("[data-run]").hidden = on;
      q("[data-stop]").hidden = !on;
      if (on) {
        fresh = false;
        out.innerHTML = `<span class="note">Running…</span>`;
      }
    },
    pulseRun(on) {
      q("[data-run]").toggleAttribute("data-pulse", on);
    },
    // Shows a finished run: printed output (inputs highlighted), the error in plain words, and the drawing.
    show(res, { animate = true } = {}) {
      fresh = false;
      const shown = esc(res.shown ?? res.out ?? "").replace(/\x01([^\x02]*)\x02/g, '<span class="echo">$1</span>');
      let html = shown;
      if (res.err) {
        const e = res.err;
        const name = e.type === "StepLimit" ? "Stopped: step limit" : e.type === "OutputLimit" ? "Stopped: too much output" : e.type === "Timeout" ? "Stopped: time limit" : e.type;
        html += `<span class="err">⚠ ${esc(name)}${e.line ? ` on line ${e.line}` : ""}${e.msg && !["StepLimit", "OutputLimit"].includes(e.type) ? `: ${esc(e.msg)}` : ""}</span><span class="help">${esc(ERR_HELP[e.type] || "")}</span>`;
        bad = e.line || 0;
        gutter();
        if (bad) {
          const lh = parseFloat(getComputedStyle(ta).lineHeight) || 30;
          const top = (bad - 1) * lh;
          if (top < ta.scrollTop || top > ta.scrollTop + ta.clientHeight - lh) ta.scrollTop = Math.max(0, top - ta.clientHeight / 2);
        }
      } else if (!res.out && !(res.segs || []).length) html += `<span class="note">(The program finished without printing anything.)</span>`;
      out.innerHTML = html;
      out.scrollTop = out.scrollHeight;
      if (((res.segs || []).length || (res.fills || []).length || res.bg) && !wantCanvas) api.canvas(true);
      if (wantCanvas) return drawTurtle(canvas, res.segs || [], res.turtle && { ...res.turtle, fills: res.fills, bg: res.bg }, { animate, alive: () => my === token });
      return Promise.resolve();
    },
    // Prediction options: monospace output (new lines shown as ⏎) or plain words.
    pick(options, onPick) {
      const box = q("[data-pick]");
      if (!options) {
        box.hidden = true;
        box.innerHTML = "";
        return;
      }
      const words = options.every((o) => /^[A-Z][a-z]+( [a-z\-]+)+$|^An? /.test(o) && !o.includes("\n"));
      box.hidden = false;
      box.innerHTML = `<b>Your prediction: what will it ${words ? "draw or do" : "print"}?</b><div class="py-opts">${options
        .map((o, i) => `<button type="button" data-o="${i}" class="${words || /^An? /.test(o) ? "words" : ""}">${o.split("\n").map(esc).join(' <i aria-label="new line">⏎</i> ')}</button>`)
        .join("")}</div>`;
      box.onclick = (e) => {
        const b = e.target.closest("[data-o]");
        if (b && !b.disabled) onPick(Number(b.dataset.o), b);
      };
    },
    markPick(i, cls) {
      const b = app.querySelector(`[data-o="${i}"]`);
      if (b) b.classList.add(cls);
      if (cls === "right") app.querySelectorAll("[data-o]").forEach((x) => (x.disabled = true));
      else if (b) b.disabled = true;
    },
    stop() {
      ro.disconnect();
      PY.off(onState);
    },
  };
  q("[data-reset]").addEventListener("click", () => api.onReset?.());
  return api;
}

// ---- cards ----
function card(html, speech) {
  stage.querySelector(".py-card")?.remove();
  const box = document.createElement("div");
  box.className = "kt-how py-card";
  box.innerHTML = `<div class="kt-how-card" role="dialog">${html}</div>`;
  stage.appendChild(box);
  if (speech) VOICE.speak(speech);
  return box;
}
function explainCard({ title, prompt, words, model, where }) {
  const box = card(
    `<h2>🗣 Explain it: ${esc(title)}</h2><p>${prompt}</p><p><b>Use these words:</b> ${words}</p><textarea aria-label="Your explanation" placeholder="Write 2–4 sentences here, or say them aloud to a grown-up."></textarea><p class="model" hidden><b>A model explanation:</b> ${esc(model)}</p><div class="row"><button type="button" data-model>I have explained it: show a model</button><button type="button" class="kt-go" data-close>✓ Done</button></div>`,
    `Explain it. ${prompt} Use these words: ${words}. Write two to four sentences, or say them aloud to a grown-up.`
  );
  const area = box.querySelector("textarea");
  box.addEventListener("click", (e) => {
    if (e.target.closest("[data-model]")) {
      VOICE.hush();
      box.querySelector(".model").hidden = false;
      e.target.closest("[data-model]").remove();
      VOICE.speak(`A model explanation. ${model} Compare it with yours. Is every statement in yours true, and does each one support your conclusion?`);
      window.OC?.count("explanations");
    }
    if (e.target.closest("[data-close]")) {
      VOICE.hush();
      const said = area.value.trim();
      if (said) {
        const log = store.get("oc-py-explanations") || [];
        log.push({ who: shell.learner(), where, text: said.slice(0, 1000), at: Date.now() });
        store.set("oc-py-explanations", log.slice(-60));
      }
      box.remove();
    }
  });
}
function realCard(r) {
  const box = card(
    `<h2>🏠 Try it for real: ${esc(r.title)}</h2><p><b>You need:</b> ${r.need}</p><ol>${r.steps.map((s) => `<li>${esc(s)}</li>`).join("")}</ol><p class="safe">${r.safe}</p><div class="row"><button type="button" class="kt-go" data-close>✓ Done</button></div>`,
    `Try it for real: ${r.title}. You need: ${r.need}. ${r.steps.join(" ")} ${r.safe}`
  );
  box.querySelector("[data-close]").addEventListener("click", () => {
    VOICE.hush();
    box.remove();
  });
}

// ---- a lesson unit: one exercise at a time ----
let ide = null;
function lessonUnit(uid) {
  const my = token;
  const list = BANK[uid];
  const info = UNIT_INFO[uid];
  const solved = new Set(shell.progress()[uid]?.solved || []);
  let ci = list.findIndex((_, i) => !solved.has(i));
  if (ci < 0) ci = 0;
  let tries = 0;
  let hintI = 0;
  let attempted = false;
  let answered = false;
  let wrong = 0;
  let saveT = 0;
  const draftKey = () => `oc-py:${shell.learner()}:${uid}:${ci}`;
  const host = panel(`<div class="py-nav"><button type="button" data-prev aria-label="Previous exercise">◀</button><p class="ap-status" data-status></p><button type="button" data-next aria-label="Next exercise">▶</button><button type="button" data-hint>💡 Hint</button><button type="button" data-show hidden>👀 Show me</button><button type="button" data-explain>🗣 Explain</button><button type="button" class="primary" data-real hidden>🏠 For real</button></div>`);
  const btn = (k) => $(`[data-${k}]`, host);
  ide = makeIDE({
    onRun: run,
    onChange(v) {
      clearTimeout(saveT);
      saveT = setTimeout(() => store.set(draftKey(), v), 400);
      btn("next").removeAttribute("data-pulse");
    },
  });
  ide.canvas(uid === "p9");
  ide.onReset = () => {
    if (my !== token) return;
    ide.code = list[ci].code;
    store.set(draftKey(), null);
    ide.clear();
    say("The starting code is restored.");
  };
  const status = () => {
    const it = list[ci];
    btn("status").textContent = `${LV[it.lv]} ${ci + 1} of ${list.length}${solved.has(ci) ? " ✓" : ""}`;
    btn("status").title = LV_NAME[it.lv];
  };
  function win() {
    const it = list[ci];
    MUSIC.chime();
    const first = !solved.has(ci);
    solved.add(ci);
    shell.mark(uid, { solved: [...solved], ...(solved.size >= Math.ceil(list.length * 0.7) ? { done: true } : {}) });
    if (first) window.OC?.count("python exercises");
    window.OC?.touch();
    status();
    const all = solved.size === list.length;
    if (all) {
      confetti();
      btn("real").hidden = false;
    }
    btn("next").toggleAttribute("data-pulse", !all);
    btn("explain").toggleAttribute("data-pulse", true);
    return all;
  }
  function load(i) {
    ci = (i + list.length) % list.length;
    tries = 0;
    hintI = 0;
    attempted = false;
    answered = false;
    wrong = 0;
    const it = list[ci];
    const draft = it.t === "predict" ? null : store.get(draftKey());
    ide.setGoal(it.lv, it.title, KIND[it.t]);
    ide.setInputs(it.inputs);
    ide.code = typeof draft === "string" ? draft : it.code;
    ide.readOnly(it.t === "predict");
    ide.clear(it.t === "predict" ? "Predict first. Then press ▶ Run to test your prediction." : "");
    ide.tab("code");
    ide.pulseRun(false);
    ide.pick(it.t === "predict" ? it.options : null, onPick);
    status();
    btn("show").hidden = true;
    btn("next").removeAttribute("data-pulse");
    btn("explain").removeAttribute("data-pulse");
    btn("real").hidden = solved.size !== list.length;
    say(`<b>${ci + 1}. ${esc(it.title)}${/[.?!]$/.test(it.title) ? "" : "."}</b> ${it.t === "predict" ? (it.verifyDraw ? "Read the program. Which figure will it draw? Choose your prediction." : "Read the program. What exactly will it print? Choose your prediction.") : it.say}`);
  }
  function onPick(i, b) {
    if (my !== token) return;
    const it = list[ci];
    if (answered) return;
    attempted = true;
    window.OC?.touch();
    if (i === it.answer) {
      answered = true;
      ide.readOnly(false);
      ide.markPick(i, "right");
      const all = win();
      ide.pulseRun(true);
      say(`${wrong ? WELL[2] : pick(WELL.slice(0, 2))} ${esc(it.why)} ${all ? "You have completed every exercise in this unit." : ""} ${PY.state() === "failed" ? "When Python loads, run it to confirm." : "Press ▶ Run to confirm it with the computer."}`);
    } else {
      wrong += 1;
      MUSIC.oops();
      ide.markPick(i, "wrong");
      if (wrong >= 2) {
        answered = true;
        ide.readOnly(false);
        ide.markPick(it.answer, "right");
        ide.pulseRun(true);
        say(`Not quite. The answer is the highlighted one. ${esc(it.why)} Press ▶ Run to see the evidence for yourself.`);
      } else say(`Not quite. ${esc(it.hints[0])} Mistakes are how we learn: choose again.`);
    }
  }
  async function run() {
    if (my !== token || PY.busy()) return;
    const it = list[ci];
    const code = ide.code;
    if (it.t === "predict" && !answered) return say("Commit to a prediction first: choose one of the options. Then run the program to test it.");
    window.OC?.touch();
    ide.busy(true);
    ide.pulseRun(false);
    const at = ci;
    let res;
    let verdict = null;
    if (it.t === "predict") res = await PY.run(code, { inputs: it.inputs || [] });
    else ({ res, verdict } = await evaluate(it, code));
    if (my !== token || at !== ci) return;
    ide.busy(false);
    window.OC?.count("python programs run");
    const drawing = ide.show(res);
    if (ide.app.classList.contains("compact")) ide.tab("out");
    if (res.err && ["Unavailable", "Stopped", "Timeout"].includes(res.err.type)) {
      if (res.err.type === "Unavailable") return say("Python is not loaded yet, so I cannot run the program. Check the internet connection and press Try again.");
      return say(res.err.type === "Stopped" ? "Stopped. Python is restarting; it will be ready in a moment." : "The program took too long, so I stopped it and restarted Python. Is there a loop that never ends?");
    }
    if (it.t === "predict") {
      await drawing;
      if (my !== token || at !== ci) return;
      const same = code === it.code;
      if (!same) return say("You changed the program, so its output may differ from the original. Experimenting like this is a good way to test your understanding.");
      if (it.verifyDraw) return say(`The drawing is the evidence: ${polyCheck(it.verifyDraw, res.segs) === true ? `a closed figure with ${it.verifyDraw.n} equal sides` : "look at it closely"}. ${solved.has(ci) ? "Your prediction is confirmed." : "Compare it with your prediction."} Press ▶ for the next exercise, or 🗣 Explain.`);
      const ok = sameOut(res.out, it.options[it.answer]);
      return say(ok ? `The computer confirms it: the output matches the correct prediction. A prediction tested by running the code is knowledge, not a guess. Press ▶ for the next exercise, or 🗣 Explain.` : "The output differs from what I expected. Please tell a grown-up: this exercise may contain an error.");
    }
    if (verdict === true) {
      await drawing;
      if (my !== token || at !== ci) return;
      const all = win();
      say(`${tries ? pick(WELL.slice(2)) : pick(WELL.slice(0, 2))} ${esc(it.why)} ${all ? "You have completed every exercise in this unit. Explain your thinking, then try it for real." : "Press 🗣 Explain to put the idea into words, or ▶ for the next exercise."}`);
      return;
    }
    if (code === it.code) {
      attempted = true;
      return say(`${it.t === "fix" ? "That is the program as given, with its defect. Read the output closely: what is wrong, and on which line?" : it.t === "learn" ? "That is the example as given. Now make the change the task asks for, then run it again." : "That is the starting code. Now complete the task, then run it again."}`);
    }
    attempted = true;
    tries += 1;
    MUSIC.oops();
    say(`Not quite. ${res.err && !res.err.inTests ? `Your program stopped with a <b>${esc(res.err.type === "StepLimit" ? "step limit" : res.err.type)}</b>${res.err.line ? ` on line ${res.err.line}` : ""}. Read the explanation in the output, then look closely at that line.` : verdict}${tries >= 2 ? " You may press 👀 Show me to study a model solution." : " Mistakes are how we learn."}`);
    if (tries >= 2) btn("show").hidden = false;
  }
  host.onclick = (e) => {
    if (my !== token) return;
    const b = e.target.closest("button");
    if (!b) return;
    window.OC?.touch();
    const it = list[ci];
    if (b.dataset.prev !== undefined) load(ci - 1);
    else if (b.dataset.next !== undefined) load(ci + 1);
    else if (b.dataset.hint !== undefined) {
      if (!attempted) return say(it.t === "predict" ? "First commit to a prediction: choose an option. Then I can help you reason about it." : "First commit to an idea: write some code and press ▶ Run. Then I can help you reason about what you observe.");
      if (it.t === "predict" && answered) return say(esc(it.why));
      say(`${hintI === 0 ? "Consider this." : "A further hint."} ${esc(it.hints[Math.min(hintI, it.hints.length - 1)])}`);
      hintI += 1;
    } else if (b.dataset.show !== undefined) {
      ide.code = it.sol;
      store.set(draftKey(), it.sol);
      ide.clear();
      say(`Here is a model solution. Read it line by line, press ▶ Run to verify it, then explain it in your own words.`);
    } else if (b.dataset.explain !== undefined) {
      b.removeAttribute("data-pulse");
      explainCard({ title: it.title, where: `${uid}#${ci + 1}`, model: it.why, ...info });
    } else if (b.dataset.real !== undefined) realCard(REAL[uid]);
  };
  load(ci);
}

          const tur = el("path", { d: "M18 0L-12 11L-5 0L-12 -11Z", fill: "var(--accent)" }, g);
          let total = 0;
          const turnLbl = text(v, 730, 520, "turned: 0°", { "font-size": 26, fill: "var(--accent-dark)" });

            await api.tween(400, (t) => tur.setAttribute("transform", `translate(${bx} ${by}) rotate(${ang - 90 * t})`));
            total += 90;

          }

      },
