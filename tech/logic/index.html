<script>// ===== ENGINE START =====
// Pure puzzle logic (no DOM). The test file runs this part in Node.
const COLORS = { red: "#e5483b", blue: "#2f6fe0", yellow: "#f2b705", green: "#2e9e55", purple: "#8e44ad" };
const SHAPES = ["circle", "square", "triangle", "star", "diamond", "hexagon"];
// Two figures that LOOK the same have the same key (a square turned 90° looks unchanged).
const SYM = { circle: 1, square: 90, hexagon: 60, diamond: 180, star: 72, triangle: 120, arrow: 360, flag: 360, moon: 360 };
const keyOf = (f) => [f.shape, f.color, (f.count || 1) > 1 ? "-" : f.size || "b", f.fill || "solid", ((((f.rot || 0) % 360) + 360) % 360) % (SYM[f.shape] || 360), f.count || 1].join("|");

// Detective grids: solutions as permutations, clues checked by brute force.
function perms(n) {
  if (n === 1) return [[0]];
  const out = [];
  for (const p of perms(n - 1)) for (let i = 0; i <= p.length; i++) out.push([...p.slice(0, i), n - 1, ...p.slice(i)]);
  return out;
}
const holds = (c, s) => (c.t === "is" ? s[c.a] === c.x : c.t === "not" ? s[c.a] !== c.x : c.xs.includes(s[c.a]));
const solutions = (n, clues) => perms(n).filter((s) => clues.every((c) => holds(c, s)));
function makeGrid(n, kinds, maxClues, maxIs, rand = Math.random) {
  const shuffle = (l) => {
    const o = [...l];
    for (let i = o.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [o[i], o[j]] = [o[j], o[i]];
    }
    return o;
  };
  for (let tries = 0; tries < 500; tries++) {
    const sol = shuffle([...Array(n).keys()]);
    const cand = [];
    for (let a = 0; a < n; a++)
      for (let x = 0; x < n; x++) {
        if (x === sol[a]) {
          if (kinds.includes("is")) cand.push({ t: "is", a, x });
        } else {
          if (kinds.includes("not")) cand.push({ t: "not", a, x });
          if (kinds.includes("or")) cand.push({ t: "or", a, xs: shuffle([sol[a], x]) });
        }
      }
    let clues = [];
    for (const c of shuffle(cand)) {
      if (clues.filter((k) => k.t === "is").length >= maxIs && c.t === "is") continue;
      const before = solutions(n, clues).length;
      if (before === 1) break;
      if (solutions(n, [...clues, c]).length < before) clues.push(c);
    }
    if (solutions(n, clues).length !== 1) continue;
    for (const c of [...clues]) {
      const rest = clues.filter((k) => k !== c);
      if (solutions(n, rest).length === 1) clues = rest;
    }
    if (clues.length <= maxClues && clues.length >= 2) return { n, sol, clues };
  }
  return null;
}

// Cube nets: roll a cube over the squares. A net folds into a cube when the 6 squares land on 6 different faces.
function folds(cells) {
  if (cells.length !== 6) return false;
  const has = (x, y) => cells.some(([a, b]) => a === x && b === y);
  const start = { d: 0, u: 1, n: 2, s: 3, e: 4, w: 5 };
  const seen = new Map([[cells[0].join(","), start]]);
  const q = [[...cells[0], start]];
  while (q.length) {
    const [x, y, o] = q.shift();
    const moves = [
      [1, 0, { d: o.e, e: o.u, u: o.w, w: o.d, n: o.n, s: o.s }],
      [-1, 0, { d: o.w, w: o.u, u: o.e, e: o.d, n: o.n, s: o.s }],
      [0, -1, { d: o.n, n: o.u, u: o.s, s: o.d, e: o.e, w: o.w }],
      [0, 1, { d: o.s, s: o.u, u: o.n, n: o.d, e: o.e, w: o.w }],
    ];
    for (const [dx, dy, no] of moves) {
      const k = `${x + dx},${y + dy}`;
      if (has(x + dx, y + dy) && !seen.has(k)) {
        seen.set(k, no);
        q.push([x + dx, y + dy, no]);
      }
    }
  }
  if (seen.size !== 6) return false;
  return new Set([...seen.values()].map((o) => o.d)).size === 6;
}
const faceOf = (cells) => {
  const start = { d: 0, u: 1, n: 2, s: 3, e: 4, w: 5 };
  const has = (x, y) => cells.some(([a, b]) => a === x && b === y);
  const seen = new Map([[cells[0].join(","), start]]);
  const q = [[...cells[0], start]];
  while (q.length) {
    const [x, y, o] = q.shift();
    for (const [dx, dy, no] of [
      [1, 0, { d: o.e, e: o.u, u: o.w, w: o.d, n: o.n, s: o.s }],
      [-1, 0, { d: o.w, w: o.u, u: o.e, e: o.d, n: o.n, s: o.s }],
      [0, -1, { d: o.n, n: o.u, u: o.s, s: o.d, e: o.e, w: o.w }],
      [0, 1, { d: o.s, s: o.u, u: o.n, n: o.d, e: o.e, w: o.w }],
    ]) {
      const k = `${x + dx},${y + dy}`;
      if (has(x + dx, y + dy) && !seen.has(k)) {
        seen.set(k, no);
        q.push([x + dx, y + dy, no]);
      }
    }
  }
  return cells.map((c) => seen.get(c.join(","))?.d ?? -1);
};
const parseNet = (rows) => rows.flatMap((r, y) => [...r].map((c, x) => (c === "#" ? [x, y] : null)).filter(Boolean));
const NETS_OK = [
  ["#...", "####", "#..."], [".#..", "####", "#..."], ["..#.", "####", "#..."], ["...#", "####", "#..."],
  [".#..", "####", ".#.."], [".#..", "####", "..#."], ["##..", ".###", ".#.."], ["##..", ".###", "..#."],
  ["##..", ".###", "...#"], ["##..", ".##.", "..##"], ["###..", "..###"],
];
const NETS_BAD = [
  ["###", "###"], ["##..", "####"], ["#..#", "####"], ["##.", "##.", ".##"], ["####", ".##."],
  ["#.#", "###", ".#."], ["###", "#..", "##."], ["##..", "##..", ".##."],
];

// Polyomino rotation and mirror (for "Rotate & fold").
const norm = (cells) => {
  const mx = Math.min(...cells.map((c) => c[0]));
  const my = Math.min(...cells.map((c) => c[1]));
  return cells.map(([x, y]) => [x - mx, y - my]).sort((a, b) => a[1] - b[1] || a[0] - b[0]);
};
const rot90 = (cells) => norm(cells.map(([x, y]) => [-y, x]));
const mirror = (cells) => norm(cells.map(([x, y]) => [-x, y]));
const rotN = (cells, k) => {
  let c = norm(cells);
  for (let i = 0; i < k; i++) c = rot90(c);
  return c;
};
const cellKey = (cells) => JSON.stringify(norm(cells));
const chiral = (cells) => {
  const rots = new Set([0, 1, 2, 3].map((k) => cellKey(rotN(cells, k))));
  return [0, 1, 2, 3].every((k) => !rots.has(cellKey(rotN(mirror(cells), k))));
};
const POLY = [
  { cells: [[0, 0], [0, 1], [0, 2], [1, 2]], name: "L" },
  { cells: [[0, 0], [1, 0], [1, 1], [2, 1]], name: "S" },
  { cells: [[0, 0], [1, 0], [2, 0], [0, 1]], name: "J" },
  { cells: [[1, 0], [2, 0], [0, 1], [1, 1], [1, 2]], name: "F" },
  { cells: [[0, 0], [1, 0], [0, 1], [1, 1], [0, 2]], name: "P" },
  { cells: [[0, 0], [0, 1], [1, 1], [1, 2], [1, 3]], name: "N" },
  { cells: [[0, 0], [1, 0], [2, 0], [3, 0], [1, 1]], name: "Y" },
];
// ===== ENGINE END =====

const { $, el, svg: makeSvg, text, panel, say, sayAsync, pick, pickInt, wait, confetti, PRAISE, choices, explain, everyday, emoji, shuffle } = KIT;
const stage = $("[data-stage]");
const W = 1000;
const H = 560;
let token = 0;
let view = null;

const UNITS = [
  { id: "lg0", label: "See it", icon: "👀" },
  { id: "lg1", label: "1. Same & different", icon: "🔍" },
  { id: "lg2", label: "2. What comes next", icon: "➡️" },
  { id: "lg3", label: "3. Sort into groups", icon: "🧺" },
  { id: "lg4", label: "4. Analogies", icon: "🔗" },
  { id: "lg5", label: "5. Detective grids", icon: "🕵️" },
  { id: "lg6", label: "6. Rotate & fold", icon: "🧊" },
];

const lgStyle = document.createElement("style");
lgStyle.textContent = `.lg-tap{cursor:pointer}
.lg-real{position:absolute;inset:0;z-index:7;display:grid;place-items:center;padding:10px;background:rgba(245,239,228,.9)}
.lg-real-card{max-width:600px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:16px 20px;border-radius:26px;background:#fff;box-shadow:0 8px 0 #e2ecfb,0 18px 40px rgba(20,40,80,.18);color:#2b1d12;font:700 clamp(15px,2.1vw,19px)/1.35 var(--sans)}
.lg-real-card h2{margin:0;font:900 clamp(20px,3vw,28px)/1.15 var(--sans);color:var(--accent-dark)}
.lg-real-card ol{margin:0;padding-left:1.3em;display:grid;gap:4px}
.lg-real-card .need{margin:0;padding:6px 10px;border-radius:12px;background:var(--accent-soft)}
.lg-real-card .safe{margin:0;color:#8a4b12;font-size:.9em}
.lg-real-card .ap-buttons{justify-content:center}
@media (max-height:460px){.lg-real-card{padding:8px 12px;gap:4px;font-size:13.5px}.lg-real-card h2{font-size:18px}}
.lg-pick .kt-choices button{min-height:52px;font-size:18px}
@media (max-height:460px),(max-width:420px) and (max-height:720px){.lg-pick .kt-choices button{min-height:40px;font-size:14.5px;padding:0 12px}}`;
document.head.appendChild(lgStyle);

function fresh() {
  stage.querySelector(".lg-real")?.remove();
  stage.innerHTML = "";
  view = makeSvg(`0 0 ${W} ${H}`, stage);
  return view;
}
const tween = (ms, fn, alive) =>
  new Promise((resolve) => {
    if (KIT.still.matches) {
      fn(1);
      return resolve(true);
    }
    const t0 = performance.now();
    const frame = (now) => {
      if (!alive()) return resolve(false);
      const t = Math.min(1, (now - t0) / ms);
      fn(t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
      if (t < 1) requestAnimationFrame(frame);
      else resolve(true);
    };
    requestAnimationFrame(frame);
  });
const LEVELS = [["easy", "🐣 Easy"], ["medium", "🦊 Medium"], ["hard", "🦁 Hard"]];
const levelRow = (cur) => `<div class="ap-row"><div class="ap-chips" data-levels>${LEVELS.map(([k, l]) => `<button type="button" data-lv="${k}" aria-pressed="${k === cur}">${l}</button>`).join("")}</div><p class="ap-status" data-status></p></div>`;
const onLevels = (id, fn) =>
  $("[data-levels]").addEventListener("click", (event) => {
    const b = event.target.closest("[data-lv]");
    if (!b) return;
    document.querySelectorAll("[data-lv]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    shell.mark(id, { level: b.dataset.lv });
    window.OC?.touch();
    fn(b.dataset.lv);
  });
const status = (s) => {
  const n = $("[data-status]");
  if (n) n.textContent = s;
};
const EFFORT = ["You looked closely and kept thinking.", "You tried, checked, and tried again. That is how detectives work.", "You took your time. Careful thinking wins!", "You found the rule by looking at the clues."];
const OOPS = "Mistakes are how we learn. Let's look why.";

function realCard({ title, need, steps, safe = "Do it with a grown-up." }, again) {
  stage.querySelector(".lg-real")?.remove();
  const box = document.createElement("div");
  box.className = "lg-real";
  box.innerHTML = `<div class="lg-real-card" role="dialog" aria-label="Try it for real"><h2>🏠 Try it for real: ${title}</h2><p class="need"><b>You need:</b> ${need}</p><ol>${steps.map((s) => `<li>${s}</li>`).join("")}</ol><p class="safe">⚠️ ${safe}</p><div class="ap-buttons"><button type="button" class="primary" data-again>🔁 Play again</button><button type="button" data-close>✕ Close</button></div></div>`;
  stage.appendChild(box);
  box.querySelector("[data-again]").addEventListener("click", () => {
    box.remove();
    again?.();
  });
  box.querySelector("[data-close]").addEventListener("click", () => box.remove());
}
async function finish(my, id, count, real, again) {
  confetti();
  MUSIC.chime();
  shell.mark(id, { done: true });
  await sayAsync(`🎉 You finished all ${count}! ${pick(EFFORT)}`);
  if (my !== token) return;
  realCard(real, again);
  say("🏠 Now try it for real, away from the screen!");
}

// ---------- figures ----------
function shapePath(shape, r) {
  const pts = (list) => list.map(([x, y]) => `${(x * r).toFixed(1)},${(y * r).toFixed(1)}`).join(" ");
  if (shape === "square") return ["rect", { x: -r * 0.85, y: -r * 0.85, width: r * 1.7, height: r * 1.7, rx: r * 0.12 }];
  if (shape === "triangle") return ["polygon", { points: pts([[0, -1], [0.98, 0.78], [-0.98, 0.78]]) }];
  if (shape === "diamond") return ["polygon", { points: pts([[0, -1], [0.78, 0], [0, 1], [-0.78, 0]]) }];
  if (shape === "hexagon") return ["polygon", { points: pts([0, 1, 2, 3, 4, 5].map((i) => [Math.cos((i * Math.PI) / 3), Math.sin((i * Math.PI) / 3)])) }];
  if (shape === "star") return ["polygon", { points: pts([...Array(10).keys()].map((i) => [Math.cos(-Math.PI / 2 + (i * Math.PI) / 5) * (i % 2 ? 0.45 : 1), Math.sin(-Math.PI / 2 + (i * Math.PI) / 5) * (i % 2 ? 0.45 : 1)])) }];
  if (shape === "arrow") return ["polygon", { points: pts([[0, -1], [0.75, -0.15], [0.3, -0.15], [0.3, 0.95], [-0.3, 0.95], [-0.3, -0.15], [-0.75, -0.15]]) }];
  if (shape === "flag") return ["polygon", { points: pts([[-0.6, -1], [0.75, -1], [0.75, -0.3], [-0.05, -0.3], [-0.05, 1], [-0.6, 1]]) }];
  if (shape === "moon") return ["path", { d: `M${0.2 * r} ${-r}A${r} ${r} 0 1 0 ${0.2 * r} ${r}A${0.75 * r} ${0.75 * r} 0 1 1 ${0.2 * r} ${-r}Z` }];
  return ["circle", { cx: 0, cy: 0, r: r * 0.92 }];
}
// f: { shape, color, size: "s"|"m"|"b", fill: "solid"|"empty", rot, count }
function fig(parent, cx, cy, f, scale = 1) {
  const g = el("g", { transform: `translate(${cx} ${cy})` }, parent);
  const R = (f.size === "s" ? 28 : f.size === "m" ? 42 : 56) * scale;
  const n = f.count || 1;
  const paint = (host, r) => {
    const [tag, attrs] = shapePath(f.shape, r);
    const c = COLORS[f.color] || f.color;
    el(tag, { ...attrs, fill: f.fill === "empty" ? "#fff" : c, stroke: f.fill === "empty" ? c : "rgba(0,0,0,.25)", "stroke-width": f.fill === "empty" ? 7 * scale : 3 }, host);
  };
  if (n === 1) {
    const inner = el("g", { transform: `rotate(${f.rot || 0})` }, g);
    paint(inner, R);
  } else {
    const cols = n <= 4 ? 2 : 3;
    const rows = Math.ceil(n / cols);
    const r = 17 * scale;
    for (let i = 0; i < n; i++) {
      const row = Math.floor(i / cols);
      const inRow = Math.min(cols, n - row * cols);
      const x = ((i % cols) - (inRow - 1) / 2) * r * 2.4;
      const y = (row - (rows - 1) / 2) * r * 2.4;
      const inner = el("g", { transform: `translate(${x} ${y}) rotate(${f.rot || 0})` }, g);
      paint(inner, r);
    }
  }
  return g;
}
// a tappable card holding a figure or emoji
function card(parent, x, y, w, h, i, { fill = "#fffdf8", stroke = "#d9cdb5", dash } = {}) {
  const g = el("g", { class: "lg-tap", "data-i": i, transform: `translate(${x} ${y})` }, parent);
  el("rect", { width: w, height: h, rx: 22, fill, stroke, "stroke-width": 4, "stroke-dasharray": dash, class: "lg-card" }, g);
  return g;
}
const tint = (g, color, width = 7) => {
  const r = g.querySelector(".lg-card");
  r.setAttribute("stroke", color);
  r.setAttribute("stroke-width", width);
};
const onCards = (fn) =>
  view.addEventListener("pointerdown", (event) => {
    const g = event.target.closest(".lg-tap");
    if (g) {
      window.OC?.touch();
      fn(Number(g.dataset.i), g);
    }
  });
const CNAME = { red: "red", blue: "blue", yellow: "yellow", green: "green", purple: "purple" };
const SNAME = { circle: "circle", square: "square", triangle: "triangle", star: "star", diamond: "diamond", hexagon: "hexagon", arrow: "arrow", flag: "flag", moon: "moon" };
const plural = (s) => SNAME[s] + "s";
const randFig = (extra = {}) => ({ shape: pick(SHAPES), color: pick(Object.keys(COLORS)), size: "b", fill: "solid", rot: 0, ...extra });
const same = (a, b) => keyOf(a) === keyOf(b);

const units = {
  lg0() {
    const my = token;
    const pop = async (api, g, ms = 500) => {
      g.setAttribute("opacity", 0);
      await api.tween(ms, (t) => g.setAttribute("opacity", t));
    };
    explain(
      [
        { say: "Why do we learn logic? Logic is careful thinking. Detectives use it to solve mysteries, and scientists use it to test ideas.", draw: everyday([["🕵️", "Detectives find clues"], ["🔬", "Scientists test ideas"], ["♟️", "Games and puzzles"], ["🤝", "Fair arguments"]]) },
        {
          say: "Look closely. Three are the same. One is different. Can you see it?",
          async draw(v, api) {
            const figs = [{ shape: "circle", color: "red" }, { shape: "circle", color: "red" }, { shape: "square", color: "red" }, { shape: "circle", color: "red" }];
            const gs = [];
            for (let i = 0; i < 4; i++) {
              const g = el("g", {}, v);
              el("rect", { x: 85 + i * 220, y: 140, width: 170, height: 170, rx: 24, fill: "#fffdf8", stroke: "#d9cdb5", "stroke-width": 4, class: "lg-card" }, g);
              fig(g, 170 + i * 220, 225, figs[i]);
              await pop(api, g, 400);
              gs.push(g);
            }

  lg1() {
    const my = token;
    let level = shell.progress().lg1?.level || "easy";
    let round = 0;
    let q = null;
    let tries = 0;
    let busy = false;
    let picked = [];
    panel(levelRow(level));
    const ATTR = {
      shape: (f) => ({ ...f, shape: pick(SHAPES.filter((s) => s !== f.shape)) }),
      color: (f) => ({ ...f, color: pick(Object.keys(COLORS).filter((c) => c !== f.color)) }),
      size: (f) => ({ ...f, size: f.size === "s" ? "b" : "s" }),
      fill: (f) => ({ ...f, fill: f.fill === "empty" ? "solid" : "empty" }),
      rot: (f) => ({ ...f, rot: (f.rot + pick([90, 180, 270])) % 360 }),
    };
    const describe = (attr, odd, base) =>
      attr === "shape" ? `it is a ${SNAME[odd.shape]}, and the others are ${plural(base.shape)}` : attr === "color" ? `it is ${odd.color}, and the others are ${base.color}` : attr === "size" ? `it is ${odd.size === "s" ? "small" : "big"}, and the others are ${base.size === "s" ? "small" : "big"}` : attr === "fill" ? `it is ${odd.fill === "empty" ? "empty inside" : "filled in"}, and the others are ${base.fill === "empty" ? "empty" : "filled"}` : "it points a different way";
    const make = () => {
      if (level === "hard") {
        const base = randFig({ shape: pick(["arrow", "flag", "triangle", "star"]), size: pick(["s", "b"]), fill: pick(["solid", "empty"]), rot: pick([0, 90, 180, 270]) });
        const near = [];
        const attrs = shuffle(["shape", "color", "size", "fill", "rot", "color", "rot"]);
        for (const a of attrs) {
          const f = ATTR[a](base);
          if (!same(f, base) && !near.some((n) => same(n, f))) near.push({ ...f, attr: a });
          if (near.length === 3) break;
        }
        const items = shuffle([base, base, ...near]);
        const pair = items.map((f, i) => (same(f, base) ? i : -1)).filter((i) => i >= 0);
        return { kind: "pair", items, pair, base };
      }
      const attr = level === "easy" ? pick(["shape", "color"]) : pick(["size", "fill", "rot", "rot"]);
      const base = randFig(level === "medium" ? { shape: attr === "rot" ? pick(["arrow", "flag"]) : pick(SHAPES), size: attr === "size" ? pick(["s", "b"]) : "b", rot: attr === "rot" ? pick([0, 90, 180, 270]) : 0 } : {});
      const odd = ATTR[attr](base);
      const n = level === "easy" ? 4 : 5;
      const at = pickInt(0, n - 1);
      const items = [...Array(n)].map((_, i) => (i === at ? odd : base));
      return { kind: "odd", items, at, attr, base, odd };
    };
    const ask = () => {
      q = make();
      tries = 0;
      busy = false;
      picked = [];
      fresh();
      const n = q.items.length;
      const w = 170;
      const gap = 18;
      const x0 = (W - n * w - (n - 1) * gap) / 2;
      q.cards = q.items.map((f, i) => {
        const g = card(view, x0 + i * (w + gap), 160, w, 220, i);
        fig(g, w / 2, 110, f, 1.25);
        return g;
      });
      text(view, W / 2, 90, q.kind === "pair" ? "Find the two that match" : "Find the one that is different", { "font-size": 34, fill: "#2b1d12" });
      onCards(tap);
      status(`Round ${round + 1} of 10`);
      say(q.kind === "pair" ? "Two of these are exactly the same. Tap the two that match." : "One of these is different. Tap it.");
    };
    const next = async () => {
      round += 1;
      window.OC?.count("logic puzzles");
      await wait(2600);
      if (my !== token) return;
      if (round >= 10) return finish(my, "lg1", "10 puzzles", { title: "odd one out", need: "4 spoons and 1 fork (or any 5 things from the kitchen)", steps: ["A grown-up lines up 4 things that match and 1 that is different.", "Find the odd one and say WHY it is different.", "Swap jobs: you make one for the grown-up!"], safe: "Do it with a grown-up. No knives." }, () => units.lg1());
      ask();
    };
    const tap = async (i, g) => {
      if (my !== token || busy) return;
      if (q.kind === "odd") {
        if (i === q.at) {
          busy = true;
          tint(g, "#2e9e55", 9);
          MUSIC.chime();
          say(`${pick(PRAISE)} This one is different: ${describe(q.attr, q.odd, q.base)}.`);
          return next();
        }
        tries += 1;
        MUSIC.oops();
        tint(g, "#d9822b");
        if (tries < 2) return say(`${OOPS} That one matches another one. Look at shape, color, size, and which way it points. What do you notice?`);
        busy = true;
        tint(q.cards[q.at], "#2e9e55", 9);
        say(`Here it is: ${describe(q.attr, q.odd, q.base)}.`);
        return next();
      }
      if (picked.includes(i)) return;
      picked.push(i);
      tint(g, "var(--accent)", 8);
      MUSIC.play("xylophone", 76, { gain: 0.3 });
      if (picked.length < 2) return say("Now tap its twin.");
      if (q.pair.every((p) => picked.includes(p))) {
        busy = true;
        q.pair.forEach((p) => tint(q.cards[p], "#2e9e55", 9));
        MUSIC.chime();
        say(`${pick(PRAISE)} Those two match in every way: shape, color, size, filling and turn.`);
        return next();
      }
      tries += 1;
      MUSIC.oops();
      const wrong = picked.find((p) => !q.pair.includes(p)) ?? picked[1];
      const why = q.items[wrong].attr;
      picked.forEach((p) => tint(q.cards[p], "#d9cdb5", 4));
      picked = [];
      if (tries < 2) return say(`${OOPS} Those two are not twins: check the ${{ rot: "way they point", fill: "inside", color: "colour", size: "size", shape: "shape" }[why] || "details"}. Compare one thing at a time.`);
      busy = true;
      q.pair.forEach((p) => tint(q.cards[p], "#2e9e55", 9));
      say("Here are the twins. Every other card changes one small thing: a color, a size, a turn, or the inside.");
      next();
    };
    onLevels("lg1", (lv) => {
      level = lv;
      round = 0;
      ask();
    });
    ask();
    window.__lg = { q: () => q, tap: (i) => tap(i, q.cards[i]), setRound: (r) => (round = r), go: (r) => ((round = r), ask()) };
  },

  lg2() {
    const my = token;
    let level = shell.progress().lg2?.level || "easy";
    let round = 0;
    let q = null;
    let tries = 0;
    let busy = false;
    panel(levelRow(level));
    const cyc = (list, i) => list[i % list.length];
    const KINDS = {
      easy: [
        () => {
          const [a, b] = shuffle(Object.keys(COLORS));
          const s = pick(SHAPES);
          return { seq: (i) => ({ shape: s, color: cyc([a, b], i) }), rule: `The colors take turns: ${a}, ${b}, ${a}, ${b}.` };
        },
        () => {
          const [a, b] = shuffle(SHAPES);
          const c = pick(Object.keys(COLORS));
          return { seq: (i) => ({ shape: cyc([a, b], i), color: c }), rule: `The shapes take turns: ${SNAME[a]}, ${SNAME[b]}, ${SNAME[a]}, ${SNAME[b]}.` };
        },
        () => {
          const s = pick(SHAPES);
          const c = pick(Object.keys(COLORS));
          return { seq: (i) => ({ shape: s, color: c, size: cyc(["s", "b"], i) }), rule: "Small, big, small, big. The sizes take turns." };
        },
        () => {
          const cs = shuffle(Object.keys(COLORS)).slice(0, 3);
          const s = pick(SHAPES);
          return { seq: (i) => ({ shape: s, color: cyc(cs, i) }), rule: `Three colors repeat: ${cs.join(", ")}, then start again.` };
        },
      ],
      medium: [
        () => {
          const c = pick(Object.keys(COLORS));
          const r0 = pick([0, 90, 180, 270]);
          return { seq: (i) => ({ shape: "arrow", color: c, rot: r0 + 90 * i }), rule: "The arrow turns a quarter turn, clockwise, every time." };
        },
        () => {
          const c = pick(Object.keys(COLORS));
          const s = pick(["circle", "square", "star"]);
          return { seq: (i) => ({ shape: s, color: c, count: i + 1 }), rule: "One more each time: 1, 2, 3, 4, 5." };
        },
        () => {
          const [a, b] = shuffle(SHAPES);
          const c = pick(Object.keys(COLORS));
          return { seq: (i) => ({ shape: cyc([a, a, b, b], i), color: c }), rule: `Two ${plural(a)}, two ${plural(b)}, and again.` };
        },
        () => {
          const ss = shuffle(SHAPES).slice(0, 3);
          const c = pick(Object.keys(COLORS));
          return { seq: (i) => ({ shape: cyc(ss, i), color: c }), rule: `Three shapes repeat: ${ss.map((s) => SNAME[s]).join(", ")}.` };
        },
        () => {
          const s = pick(SHAPES);
          const c = pick(Object.keys(COLORS));
          return { seq: (i) => ({ shape: s, color: c, fill: cyc(["solid", "empty"], i), size: cyc(["s", "s", "b", "b"], i) }), rule: "Filled, empty, filled, empty, and the size changes every two." };
        },
      ],
      hard: [
        () => {
          const c = pick(Object.keys(COLORS));
          return { seq: (i) => ({ shape: "arrow", color: c, rot: 45 * i }), rule: "The arrow turns an eighth of a turn each time: a smaller step!" };
        },
        () => {
          const [a, b] = shuffle(SHAPES);
          const cs = shuffle(Object.keys(COLORS)).slice(0, 3);
          return { seq: (i) => ({ shape: cyc([a, b], i), color: cyc(cs, i) }), rule: `Two rules at once: the shapes take turns, and three colors repeat.` };
        },
        () => {
          const s = pick(["circle", "square"]);
          const c = pick(Object.keys(COLORS));
          return { seq: (i) => ({ shape: s, color: c, count: 1 + 2 * i }), rule: "Two more each time: 1, 3, 5, 7, 9. The odd numbers!" };
        },
        () => {
          const [a, b] = shuffle(Object.keys(COLORS));
          return { seq: (i) => ({ shape: "flag", color: cyc([a, b], i), rot: 270 * i }), rule: "Two rules: the flag turns a quarter turn to the left each time, and the colors take turns." };
        },
        () => {
          const c = pick(Object.keys(COLORS));
          const ss = ["triangle", "square", "hexagon"];
          return { seq: (i) => ({ shape: ss[i % 3], color: c, size: i < 3 ? "s" : "b" }), rule: "3 sides, 4 sides, 6 sides, again, and the second time they are big." };
        },
      ],
    };
    const VARY = [
      (f) => ({ ...f, color: pick(Object.keys(COLORS).filter((c) => c !== f.color)) }),
      (f) => ({ ...f, shape: pick(SHAPES.filter((s) => s !== f.shape)) }),
      (f) => ({ ...f, rot: (f.rot || 0) + pick([90, 180, 45]) }),
      (f) => ({ ...f, size: f.size === "s" ? "b" : "s" }),
      (f) => ({ ...f, count: Math.max(1, (f.count || 1) + pick([-1, 1, 2])) }),
      (f) => ({ ...f, fill: f.fill === "empty" ? "solid" : "empty" }),
    ];
    const make = () => {
      const k = pick(KINDS[level])();
      const len = k.len || 5;
      const norm = (f) => ({ size: "b", fill: "solid", rot: 0, count: 1, ...f });
      const shown = [...Array(len - 1)].map((_, i) => norm(k.seq(i)));
      const ans = norm(k.seq(len - 1));
      const opts = [ans];
      // a near miss from the pattern itself first (the frame before), then single changes
      const near = [shown[shown.length - 1], shown[shown.length - 2], ...shuffle(VARY).map((v) => norm(v(ans)))];
      for (const f of near) {
        if (opts.length >= (level === "easy" ? 3 : 4)) break;
        if (f && !opts.some((o) => same(o, f))) opts.push(f);
      }
      return { shown, ans, opts: shuffle(opts), rule: k.rule };
    };
    const ask = () => {
      q = make();
      tries = 0;
      busy = false;
      fresh();
      const n = q.shown.length + 1;
      const w = 150;
      const gap = 22;
      const x0 = (W - n * w - (n - 1) * gap) / 2;
      q.shown.forEach((f, i) => {
        el("rect", { x: x0 + i * (w + gap), y: 40, width: w, height: w, rx: 22, fill: "#fffdf8", stroke: "#d9cdb5", "stroke-width": 4 }, view);
        fig(view, x0 + i * (w + gap) + w / 2, 40 + w / 2, f, 0.95);
      });
      const qx = x0 + (n - 1) * (w + gap);
      el("rect", { x: qx, y: 40, width: w, height: w, rx: 22, fill: "#fff", stroke: "var(--accent)", "stroke-width": 5, "stroke-dasharray": "12 8" }, view);
      q.slot = text(view, qx + w / 2, 40 + w / 2 + 28, "?", { "font-size": 80, fill: "var(--accent)" });
      q.qx = qx;
      text(view, W / 2, 268, "Which one comes next?", { "font-size": 30, fill: "#6b4a2f" });
      const m = q.opts.length;
      const ow = 165;
      const ox = (W - m * ow - (m - 1) * 30) / 2;
      q.cards = q.opts.map((f, i) => {
        const g = card(view, ox + i * (ow + 30), 300, ow, ow + 20, i);
        fig(g, ow / 2, (ow + 20) / 2, f, 0.95);
        return g;
      });
      onCards(tap);
      status(`Pattern ${round + 1} of 10`);
      say("What comes next? Find the rule, then tap the answer.");
    };
    const next = async () => {
      round += 1;
      window.OC?.count("patterns");
      await wait(3000);
      if (my !== token) return;
      if (round >= 10) return finish(my, "lg2", "10 patterns", { title: "pattern train", need: "blocks, buttons, or socks in two or three colors", steps: ["Make a pattern in a long line: red, blue, red, blue…", "Ask a grown-up: what comes next?", "Now let the grown-up make one for you. Find the rule!"], safe: "Do it with a grown-up. Keep small buttons away from little ones." }, () => units.lg2());
      ask();
    };
    const tap = async (i, g) => {
      if (my !== token || busy) return;
      if (same(q.opts[i], q.ans)) {
        busy = true;
        tint(g, "#2e9e55", 9);
        q.slot.remove();
        fig(view, q.qx + 75, 115, q.ans, 0.95);
        MUSIC.chime();
        say(`${pick(PRAISE)} ${q.rule}`);
        return next();
      }
      tries += 1;
      MUSIC.oops();
      tint(g, "#d9822b");
      if (tries < 2) return say(`${OOPS} Say the pattern out loud from the start. What changes each time? What stays the same?`);
      busy = true;
      const k = q.opts.findIndex((f) => same(f, q.ans));
      tint(q.cards[k], "#2e9e55", 9);
      q.slot.remove();
      fig(view, q.qx + 75, 115, q.ans, 0.95);
      say(`This one comes next. ${q.rule}`);
      next();
    };
    onLevels("lg2", (lv) => {
      level = lv;
      round = 0;
      ask();
    });
    ask();
    window.__lg = { q: () => q, tap: (i) => tap(i, q.cards[i]), answer: () => q.opts.findIndex((f) => same(f, q.ans)), setRound: (r) => (round = r), go: (r) => ((round = r), ask()) };
  },

  lg3() {
    const my = token;
    let level = shell.progress().lg3?.level || "easy";
    let round = 0;
    let q = null;
    let tries = 0;
    let busy = false;
    panel(`${levelRow(level)}<div data-choices class="lg-pick"></div>`);
    const F = (shape, color, size = "b", count = 1) => ({ fig: { shape, color, size, fill: "solid", rot: 0, count } });
    const E = (glyph, name) => ({ glyph, name });
    const shapesOf = (list, color) => list.map((s) => F(s, color || pick(Object.keys(COLORS))));
    const RULES = {
      easy: [

      return `The ${a} ${q.theme.verb} the ${q.cols[c.xs[0]][1]} or the ${q.cols[c.xs[1]][1]}.`;
    };
    const clueIcons = (c) => `${q.rows[c.a][0]} ${c.t === "is" ? "✓" : c.t === "not" ? "✗" : ""} ${c.t === "or" ? `${q.cols[c.xs[0]][0]} or ${q.cols[c.xs[1]][0]}` : q.cols[c.x][0]}`;
    const ask = () => {
      const [n, kinds, max, is] = SET[level];
      const g = makeGrid(n, kinds, max, is);
      const theme = pick(THEMES);
      q = { ...g, theme, rows: shuffle(pick(CAST)).slice(0, n), cols: shuffle(theme.things).slice(0, n) };
      tries = 0;
      busy = false;
      grid = [...Array(n)].map(() => Array(n).fill(0));
      fresh();
      // Tall phone screens: grid on top, clues underneath, in a narrower picture.
      const tall = stage.clientWidth / Math.max(1, stage.clientHeight) < 1.2;
      const cs = n === 3 ? 108 : 84;
      const gx = tall ? (540 - n * cs) / 2 + 30 : n === 3 ? 640 : 630;
      const gy = 100;
      const ch = tall ? 86 : Math.min(92, 470 / q.clues.length - 8);
      const cy0 = tall ? gy + n * cs + 24 : 24;
      if (tall) view.setAttribute("viewBox", `0 0 532 ${cy0 + q.clues.length * (ch + 8) + 8}`);
      q.cards = q.clues.map((c, i) => {
        const y = cy0 + i * (ch + 8);
        const gg = el("g", {}, view);
        el("rect", { x: 16, y, width: 500, height: ch, rx: 16, fill: "#fff7d6", stroke: "#e0b84a", "stroke-width": 3, class: "lg-card" }, gg);
        text(gg, 40, y + ch / 2 + 9, `${i + 1}`, { "font-size": 26, fill: "#a8632d" });
        text(gg, 276, y + 34, clueIcons(c), { "font-size": 28, "font-family": "Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif", "font-weight": 400 });
        text(gg, 276, y + ch - 14, clueText(c), { "font-size": clueText(c).length > 40 ? 20 : 22, fill: "#2b1d12" });
        return gg;
      });
      q.cols.forEach((c, i) => {
        emoji(view, gx + i * cs + cs / 2, gy - 52, c[0], 46);
        text(view, gx + i * cs + cs / 2, gy - 10, c[1].split(" ")[0], { "font-size": 18, fill: "#6b4a2f" });
      });
      q.rows.forEach((r, i) => emoji(view, gx - 46, gy + i * cs + cs / 2, r[0], 52));
      cells = [];
      for (let r = 0; r < n; r++) {
        cells.push([]);
        for (let c = 0; c < n; c++) {
          const gg = card(view, gx + c * cs, gy + r * cs, cs, cs, r * n + c, { fill: "#fffdf8", stroke: "#bfae94" });
          gg.querySelector("rect").setAttribute("rx", 6);
          const t = text(gg, cs / 2, cs / 2 + 22, "", { "font-size": 62 });
          cells[r].push(t);
        }
      }
      onCards((i) => tapCell(Math.floor(i / n), i % n));
      status(`Case ${round + 1} of 8`);
      readClues(true);
    };
    const paint = (r, c) => {
      const v = grid[r][c];
      cells[r][c].textContent = v === 1 ? "✗" : v === 2 ? "✓" : "";
      cells[r][c].setAttribute("fill", v === 1 ? "#c0392b" : "#2e9e55");
    };
    const tapCell = (r, c) => {
      if (my !== token || busy) return;
      grid[r][c] = (grid[r][c] + 1) % 3;
      paint(r, c);
      MUSIC.play("woodblock", grid[r][c] === 2 ? 72 : 79, { gain: 0.25 });
    };
    const readClues = async (first) => {
      if (my !== token) return;
      const intro = first ? "Detective time! Read the clues. Tap a box once for ✗ (no), twice for ✓ (yes). " : "";
      // The bubble stays short (the clue cards are on the picture); the voice reads every clue.
      say(first ? "Detective time! Read the clues. Tap a box once for ✗ (no), twice for ✓ (yes)." : "Listen to the clues again.", { voice: false });
      VOICE.speak(`${intro}${q.clues.map((c, i) => `Clue ${i + 1}: ${clueText(c)}`).join(" ")}`);
    };
    const check = async () => {
      if (my !== token || busy) return;
      window.OC?.touch();
      const n = q.n;
      q.cards.forEach((g) => tint(g, "#e0b84a", 3));
      const ticks = [];
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (grid[r][c] === 2) ticks.push([r, c]);
      const crossesRight = [];
      for (let r = 0; r < n; r++) if (grid[r][q.sol[r]] === 1) crossesRight.push(r);
      const rowDup = q.rows.findIndex((_, r) => ticks.filter((t) => t[0] === r).length > 1);
      const colDup = q.cols.findIndex((_, c) => ticks.filter((t) => t[1] === c).length > 1);
      const wrongTick = ticks.find(([r, c]) => q.sol[r] !== c);
      if (!wrongTick && !crossesRight.length && rowDup < 0 && colDup < 0 && ticks.length === n) {
        busy = true;
        MUSIC.chime();
        for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (!grid[r][c]) (grid[r][c] = 1), paint(r, c);
        say(`🕵️ Case solved! ${q.rows.map((r, i) => `The ${r[1]} ${q.theme.verb} the ${q.cols[q.sol[i]][1]}`).join(". ")}. ${tries ? "You kept trying!" : "You used every clue!"}`);
        return next();
      }
      if (!wrongTick && !crossesRight.length && rowDup < 0 && colDup < 0) return say("So far, so good! Keep going: every animal needs one ✓. When a row has one ✓, the others in that row and column are ✗.");
      tries += 1;
      MUSIC.oops();
      let msg;
      if (rowDup >= 0) msg = `The ${q.rows[rowDup][1]} has two ✓ marks. Each animal gets just one!`;
      else if (colDup >= 0) msg = `The ${q.cols[colDup][1]} has two ✓ marks. Each one goes with just one animal!`;
      else {
        const bad = wrongTick ? { r: wrongTick[0], x: wrongTick[1], tick: true } : { r: crossesRight[0], x: q.sol[crossesRight[0]], tick: false };
        const k = q.clues.findIndex((c) => c.a === bad.r && (bad.tick ? (c.t === "is" && c.x !== bad.x) || (c.t === "not" && c.x === bad.x) || (c.t === "or" && !c.xs.includes(bad.x)) : c.t === "is" && c.x === bad.x));
        if (k >= 0) {
          tint(q.cards[k], "var(--accent)", 7);
          msg = `Look at clue ${k + 1} again. Does your grid agree with it?`;
        } else msg = bad.tick ? `Check your ✓ for the ${q.rows[bad.r][1]}. If that were true, could the other animals still fit every clue?` : `One of your ✗ marks for the ${q.rows[bad.r][1]} crosses out the real answer. Which clue made you put it there?`;
      }
      if (tries < 2) return say(`${OOPS} ${msg}`);
      busy = true;
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) (grid[r][c] = q.sol[r] === c ? 2 : 1), paint(r, c);
      say(`${msg} Here is the answer. Read the clues again and see how each one fits.`);
      next(5200);
    };
    const next = async (ms = 4200) => {
      round += 1;
      window.OC?.count("detective cases");
      await wait(ms);
      if (my !== token) return;
      if (round >= 8) return finish(my, "lg5", "8 cases", { title: "toy detective", need: "3 toys, 3 cups, paper and a pencil", steps: ["A grown-up hides each toy under a cup in secret.", "The grown-up gives clues: 'The teddy is not under the red cup.'", "Draw a grid with ✗ and ✓ until you know where each toy is!"] }, () => units.lg5());
      ask();
    };
    $("[data-check]").addEventListener("click", check);
    $("[data-read]").addEventListener("click", () => readClues(false));
    onLevels("lg5", (lv) => {
      level = lv;
      round = 0;
      ask();
    });
    ask();
    window.__lg = { q: () => q, solve: () => q.sol.forEach((c, r) => ((grid[r][c] = 2), paint(r, c))), tap: (r, c) => tapCell(r, c), check: () => check(), setRound: (rr) => (round = rr), go: (rr) => ((round = rr), ask()), grid: () => grid };
  },

  lg6() {
    const my = token;
    let round = 0;
    let q = null;
    let tries = 0;
    let busy = false;
    panel(`<p class="ap-status" data-status></p>`);
    const FACE = ["#e5483b", "#2f6fe0", "#f2b705", "#2e9e55", "#8e44ad", "#f08a24"];
    const drawCells = (parent, cx, cy, cells, size, color, faces) => {
      const w = Math.max(...cells.map((c) => c[0])) + 1;
      const h = Math.max(...cells.map((c) => c[1])) + 1;
      const g = el("g", { transform: `translate(${cx - (w * size) / 2} ${cy - (h * size) / 2})` }, parent);
      cells.forEach(([x, y], i) => el("rect", { x: x * size, y: y * size, width: size, height: size, rx: 4, fill: faces ? FACE[faces[i]] : color, stroke: "#2b1d12", "stroke-width": 3 }, g));
      return g;
    };
    const make = () => {
      if (round < 5) {
        const poly = round < 2 ? pick(POLY.slice(0, 3)) : pick(POLY.slice(3));
        const k = pickInt(1, 3);
        const ans = rotN(poly.cells, k);
        const m = mirror(poly.cells);
        const opts = [ans];
        for (const j of shuffle([0, 1, 2, 3])) {
          const f = rotN(m, j);
          if (opts.length < (round < 2 ? 3 : 4) && !opts.some((o) => cellKey(o) === cellKey(f))) opts.push(f);
        }
        return { kind: "rot", shape: rotN(poly.cells, 0), opts: shuffle(opts), ans: cellKey(ans), k };
      }
      const good = parseNet(pick(NETS_OK));
      const bads = shuffle(NETS_BAD).slice(0, round < 7 ? 2 : 3).map(parseNet);
      const opts = shuffle([good, ...bads]);
      return { kind: "net", opts, ans: cellKey(good) };
    };
    const ask = () => {
      q = make();
      tries = 0;
      busy = false;
      fresh();
      const m = q.opts.length;
      const ow = m === 3 ? 260 : 215;
      const gap = 20;
      const ox = (W - m * ow - (m - 1) * gap) / 2;
      if (q.kind === "rot") {
        el("rect", { x: 380, y: 14, width: 240, height: 220, rx: 24, fill: "var(--accent-soft)" }, view);
        drawCells(view, 500, 124, q.shape, 40, "#f2b705");
        text(view, 500, 262, "Turn it in your head. Which one is the same shape?", { "font-size": 26, fill: "#6b4a2f" });
      } else {
        emoji(view, 140, 130, "🧊", 120);
        text(view, 560, 120, "Which one folds into a cube?", { "font-size": 36, fill: "#2b1d12" });
        text(view, 560, 170, "A cube has 6 faces. Each square must cover a different face.", { "font-size": 22, fill: "#6b4a2f" });
      }
      const top = q.kind === "rot" ? 290 : 240;
      q.cards = q.opts.map((c, i) => {
        const g = card(view, ox + i * (ow + gap), top, ow, H - top - 16, i);
        const size = q.kind === "rot" ? 36 : Math.min(40, (ow - 30) / (Math.max(...c.map((p) => p[0])) + 1), (H - top - 46) / (Math.max(...c.map((p) => p[1])) + 1));
        drawCells(g, ow / 2, (H - top - 16) / 2, c, size, q.kind === "rot" ? "#f2b705" : "#a9d4f5");
        return g;
      });
      onCards(tap);
      status(`🦁 Hard · puzzle ${round + 1} of 10`);
      say(q.kind === "rot" ? "Only one of these is the same shape, just turned. The others are flipped, like in a mirror. Tap the turned one." : "Which flat shape folds up into a cube? Imagine folding the squares up. Tap it.");
    };
    const showFaces = () => {
      if (q.kind !== "net") return;
      q.opts.forEach((c, i) => {
        const faces = faceOf(c);
        const g = q.cards[i];
        const ow = Number(g.querySelector("rect").getAttribute("width"));
        const hh = Number(g.querySelector("rect").getAttribute("height"));
        const size = Math.min(40, (ow - 30) / (Math.max(...c.map((p) => p[0])) + 1), (hh - 30) / (Math.max(...c.map((p) => p[1])) + 1));
        drawCells(g, ow / 2, hh / 2, c, size, null, faces);
      });
    };
    const why = () => (q.kind === "rot" ? "The others are mirror images: you would have to flip them over, not just turn them." : "The colors show which face each square lands on. The cube net uses all 6 colors. The others have two squares on the same face, so they can't close.");
    const tap = async (i, g) => {
      if (my !== token || busy) return;
      if (cellKey(q.opts[i]) === q.ans) {
        busy = true;
        tint(g, "#2e9e55", 9);
        MUSIC.chime();
        showFaces();
        say(`${pick(PRAISE)} ${why()}`);
        return next();
      }
      tries += 1;
      MUSIC.oops();
      tint(g, "#d9822b");
      if (tries < 2) return say(q.kind === "rot" ? `${OOPS} Try turning that one in your head. Does it match, or is it flipped over? Look at where the bump is.` : `${OOPS} Fold it in your head: pick one square as the bottom and fold the others up. Do any two squares end up on the same side?`);
      busy = true;
      tint(q.cards[q.opts.findIndex((c) => cellKey(c) === q.ans)], "#2e9e55", 9);
      showFaces();
      say(`Here it is. ${why()}`);
      next(4600);
    };
    const next = async (ms = 3600) => {
      round += 1;
      window.OC?.count("shapes turned and folded");
      await wait(ms);
      if (my !== token) return;
      if (round >= 10) return finish(my, "lg6", "10 puzzles", { title: "fold a real cube", need: "paper, a pencil, a ruler, scissors and tape", steps: ["Draw 6 squares in a cross shape (4 in a line, one above, one below).", "Cut it out and fold along the lines.", "Tape the edges. You made a cube! Try other shapes too."], safe: "Use scissors only with a grown-up." }, () => units.lg6());
      ask();
    };
    ask();
    window.__lg = { q: () => q, tap: (i) => tap(i, q.cards[i]), answer: () => q.opts.findIndex((c) => cellKey(c) === q.ans), setRound: (r) => (round = r), go: (r) => ((round = r), ask()) };
  },
};

const shell = SHELL({
  units: UNITS,
  how: {
    lg0: { icon: "👀", title: "See it", steps: ["Watch the pictures.", "Press Next ▶ to go on.", "Press Let's play when you are ready."] },
    lg1: { icon: "🔍", title: "Same & different", steps: ["Look closely at every card.", "Tap the one that is different.", "On Hard, tap the two that match."] },
    lg2: { icon: "➡️", title: "What comes next", steps: ["Look at the pattern from the start.", "Find the rule: what changes?", "Tap the card that comes next."] },
    lg3: { icon: "🧺", title: "Sort into groups", steps: ["Look at the two groups.", "Tap the group where the middle picture belongs.", "Then find the secret rule."] },
    lg4: { icon: "🔗", title: "Analogies", steps: ["See how the first two go together.", "Do the same to the third one.", "Tap the answer at the bottom."] },
    lg5: { icon: "🕵️", title: "Detective grids", steps: ["Listen to the clues.", "Tap a box once for ✗, twice for ✓.", "Press Check when you are done."] },
    lg6: { icon: "🧊", title: "Rotate & fold", steps: ["Turn or fold the shapes in your head.", "Tap your answer.", "Colors show how the cube folds."] },
  },
  start: "lg0",
  onStop() {
    token += 1;
    $("[data-panel]").onclick = null;
    stage.querySelector(".lg-real")?.remove();
  },
  subject: "Tech",
  activity: "Logic Lab",
  onUnit(id) {
    token += 1;
    VOICE.hush();
    units[id]();
  },
});
MUSIC.preload("xylophone", [72, 76, 79, 82, 85, 88]);
MUSIC.preload("woodblock", [72, 79]);
</script>
