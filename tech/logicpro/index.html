<script>// ===== ENGINE START =====
// Pure puzzle logic (no DOM). The Node tests run this part on its own and check every generator.
const shuf = (list, rand = Math.random) => {
  const out = [...list];
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
};
const pickR = (list, rand = Math.random) => list[Math.floor(rand() * list.length)];
const intR = (lo, hi, rand = Math.random) => lo + Math.floor(rand() * (hi - lo + 1));
const orList = (xs, word = "or") => (xs.length <= 1 ? String(xs[0] ?? "") : xs.length === 2 ? `${xs[0]} ${word} ${xs[1]}` : `${xs.slice(0, -1).join(", ")} ${word} ${xs[xs.length - 1]}`);
const fill = (tpl, vars) => tpl.replace(/\{(\w+)\}/g, (_, k) => vars[k]);

// Names with different first letters, so a grid or a table never shows two names that start alike.
function namesR(n, rand = Math.random) {
  const out = [];
  for (const name of shuf(NAMES, rand)) if (!out.some((o) => o[0] === name[0]) && out.length < n) out.push(name);
  return out;
}

// ---------- 1. Deduction grids ----------
// A solution s is a permutation: s[row] = column. Every row and every column holds exactly one ✓.
const PERM = {};
function permsOf(n) {
  if (PERM[n]) return PERM[n];
  if (n === 1) return (PERM[1] = [[0]]);
  const out = [];
  for (const p of permsOf(n - 1)) for (let i = 0; i <= p.length; i++) out.push([...p.slice(0, i), n - 1, ...p.slice(i)]);
  return (PERM[n] = out);
}
const DNF = 99; // the "did not finish" column ranks behind everybody
const relOk = (c, oa, ob) => (c.t === "ahead" ? oa < ob : c.t === "next" ? oa !== DNF && ob !== DNF && Math.abs(oa - ob) === 1 : oa !== DNF && ob !== DNF && ob - oa === c.k);
const UNARY = new Set(["is", "not", "or", "nei"]);
function gHolds(c, s, ord) {
  if (c.t === "is") return s[c.a] === c.x;
  if (c.t === "not") return s[c.a] !== c.x;
  if (c.t === "or") return c.xs.includes(s[c.a]);
  if (c.t === "nei") return s[c.a] !== c.x && s[c.b] !== c.x;
  return relOk(c, ord[s[c.a]], ord[s[c.b]]);
}
const gSolutions = (n, ord, clues) => permsOf(n).filter((s) => clues.every((c) => gHolds(c, s, ord)));
const unaryCells = (c, n) => (c.t === "is" ? [[c.a, c.x, 2]] : c.t === "not" ? [[c.a, c.x, 1]] : c.t === "or" ? [...Array(n).keys()].filter((x) => !c.xs.includes(x)).map((x) => [c.a, x, 1]) : [[c.a, c.x, 1], [c.b, c.x, 1]]);
const gEmpty = (n) => [...Array(n)].map(() => Array(n).fill(0));
const gClone = (K) => K.map((r) => [...r]);
function gBroken(K) {
  const n = K.length;
  for (let r = 0; r < n; r++) {
    if (K[r].every((v) => v === 1)) return { type: "row", r };
    if (K[r].filter((v) => v === 2).length > 1) return { type: "row2", r };
  }
  for (let c = 0; c < n; c++) {
    const col = K.map((row) => row[c]);
    if (col.every((v) => v === 1)) return { type: "col", c };
    if (col.filter((v) => v === 2).length > 1) return { type: "col2", c };
  }
  return null;
}
// Applies a step; returns true when a cell already held the opposite mark (a contradiction).
function gApply(K, step) {
  let clash = false;
  for (const [r, c, v] of step.cells) {
    if (K[r][c] && K[r][c] !== v) clash = true;
    else K[r][c] = v;
  }
  return clash;
}
// The next forced step, from simplest to hardest. Steps: tick, clue, rowlast, collast, rel, hyp.
function gStep(K, pz, allowHyp = false) {
  const { n, ord, clues } = pz;
  for (let r = 0; r < n; r++)
    for (let c = 0; c < n; c++) {
      if (K[r][c] !== 2) continue;
      const cells = [];
      for (let k = 0; k < n; k++) {
        if (k !== c && K[r][k] === 0) cells.push([r, k, 1]);
        if (k !== r && K[k][c] === 0) cells.push([k, c, 1]);
      }
      if (cells.length) return { kind: "tick", r, c, cells };
    }
  for (let i = 0; i < clues.length; i++) {
    if (!UNARY.has(clues[i].t)) continue;
    const cells = unaryCells(clues[i], n).filter(([r, x, v]) => K[r][x] !== v);
    if (cells.length) return { kind: "clue", i, cells };
  }
  for (let r = 0; r < n; r++) {
    if (K[r].includes(2)) continue;
    const open = [...Array(n).keys()].filter((x) => K[r][x] !== 1);
    if (open.length === 1) return { kind: "rowlast", r, c: open[0], cells: [[r, open[0], 2]] };
  }
  for (let c = 0; c < n; c++) {
    if (K.some((row) => row[c] === 2)) continue;
    const open = [...Array(n).keys()].filter((r) => K[r][c] !== 1);
    if (open.length === 1) return { kind: "collast", r: open[0], c, cells: [[open[0], c, 2]] };
  }
  for (let i = 0; i < clues.length; i++) {
    const cl = clues[i];
    if (UNARY.has(cl.t)) continue;
    for (const [who, other, first] of [[cl.a, cl.b, true], [cl.b, cl.a, false]]) {
      const xs = [];
      for (let x = 0; x < n; x++) {
        if (K[who][x] === 1) continue;
        const ok = [...Array(n).keys()].some((y) => y !== x && K[other][y] !== 1 && (first ? relOk(cl, ord[x], ord[y]) : relOk(cl, ord[y], ord[x])));
        if (!ok) xs.push(x);
      }
      if (xs.length) return { kind: "rel", i, who, other, first, xs, cells: xs.map((x) => [who, x, 1]) };
    }
  }
  if (!allowHyp) return null;
  let best = null;
  for (let r = 0; r < n; r++)
    for (let c = 0; c < n; c++) {
      if (K[r][c]) continue;
      const res = gSuppose(K, pz, r, c);
      if (res && (!best || res.used.length < best.used.length)) best = { r, c, ...res };
    }
  return best ? { kind: "hyp", r: best.r, c: best.c, used: best.used, broken: best.broken, cells: [[best.r, best.c, 1]] } : null;
}
// "Suppose row r is column c": follow the simple rules until something breaks (or nothing more follows).
function gSuppose(K, pz, r, c) {
  const K2 = gClone(K);
  K2[r][c] = 2;
  const used = [];
  for (let guard = 0; guard < 80; guard++) {
    const b = gBroken(K2);
    if (b) return { used, broken: b };
    const st = gStep(K2, pz, false);
    if (!st) return null;
    used.push(st);
    if (gApply(K2, st)) return { used, broken: { type: "clash", step: st } };
  }
  return null;
}
// Solve from a knowledge grid with the allowed rules; returns the list of steps (or null if stuck).
function gSolvePath(pz, allowHyp, K0 = gEmpty(pz.n)) {
  const K = gClone(K0);
  const steps = [];
  for (let guard = 0; guard < 200; guard++) {
    if (K.every((row) => row.every((v) => v))) return { steps, K };
    const st = gStep(K, pz, allowHyp);
    if (!st) return null;
    if (gApply(K, st)) return null;
    steps.push(st);
  }
  return null;
}
// Themes: words for each clue type. {A} {B} people, {x} {y} columns, {k} a number.
const G_THEMES = {
  easy: [
    { key: "music", noun: "instrument", cols: [["🎻", "violin"], ["🎺", "trumpet"], ["🥁", "drum"], ["🎹", "piano"], ["🎷", "saxophone"]], who: "player", is: "{A} plays the {x}", not: "{A} does not play the {x}", or: "{A} plays the {x} or the {y}", nei: "Neither {A} nor {B} plays the {x}" },
    { key: "study", noun: "subject", cols: [["📜", "Latin"], ["🧪", "chemistry"], ["🔭", "astronomy"], ["📐", "geometry"], ["🏛️", "history"]], who: "student", is: "{A} studies {x}", not: "{A} does not study {x}", or: "{A} studies {x} or {y}", nei: "Neither {A} nor {B} studies {x}" },
    { key: "pets", noun: "pet", cols: [["🐢", "tortoise"], ["🦜", "parrot"], ["🐇", "rabbit"], ["🐠", "goldfish"], ["🐈", "cat"]], who: "owner", is: "{A} keeps the {x}", not: "{A} does not keep the {x}", or: "{A} keeps the {x} or the {y}", nei: "Neither {A} nor {B} keeps the {x}" },
  ],
  order: [
    { key: "race", noun: "place", who: "runner", is: "{A} came {x}", not: "{A} did not come {x}", or: "{A} came {x} or {y}", ahead: "{A} finished ahead of {B}", next: "{A} and {B} finished in neighbouring places", gap: "{A} finished exactly {k} places ahead of {B}", dnfIs: "{A} did not finish", dnfNot: "{A} finished the race" },
    { key: "queue", noun: "place", who: "person", is: "{A} is {x} in the queue", not: "{A} is not {x} in the queue", or: "{A} is {x} or {y} in the queue", ahead: "{A} stands somewhere in front of {B}", next: "{A} and {B} stand next to each other", gap: "{A} is exactly {k} places in front of {B}" },
  ],
};
const ORDN = ["1st", "2nd", "3rd", "4th", "5th"];
const G_LEVEL = {
  easy: { n: 3, ordered: false, dnf: false, kinds: ["not", "or", "nei", "is"], maxIs: 1, min: 3, max: 5, hyp: false },
  medium: { n: 4, ordered: true, dnf: false, kinds: ["ahead", "next", "gap", "not", "or", "is"], maxIs: 1, min: 4, max: 7, hyp: false },
  hard: { n: 5, ordered: true, dnf: true, kinds: ["ahead", "next", "gap", "not", "or", "is"], maxIs: 1, min: 5, max: 9, hyp: true },
};
function gMake(level, rand = Math.random) {
  const L = G_LEVEL[level];
  const n = L.n;
  for (let tries = 0; tries < 400; tries++) {
    const theme = L.ordered ? (L.dnf ? G_THEMES.order[0] : pickR(G_THEMES.order, rand)) : pickR(G_THEMES.easy, rand);
    const ord = L.ordered ? [...Array(n)].map((_, i) => (L.dnf && i === n - 1 ? DNF : i + 1)) : Array(n).fill(null);
    const sol = shuf([...Array(n).keys()], rand);
    const rels = [];
    const unary = [];
    for (let a = 0; a < n; a++) {
      for (let x = 0; x < n; x++) {
        if (x === sol[a]) {
          if (L.kinds.includes("is")) unary.push({ t: "is", a, x });
        } else {
          unary.push({ t: "not", a, x });
          if (L.kinds.includes("or") && !(L.dnf && (x === n - 1 || sol[a] === n - 1))) unary.push({ t: "or", a, xs: L.ordered ? [sol[a], x].sort((p, q) => p - q) : shuf([sol[a], x], rand) });
        }
      }
      if (L.ordered)
        for (let b = 0; b < n; b++) {
          if (b === a) continue;
          for (const t of ["ahead", "next", "gap"]) {
            if (!L.kinds.includes(t)) continue;
            if (t === "next" && b < a) continue;
            const ks = t === "gap" ? [2, 3] : [0];
            for (const k of ks) {
              const c = { t, a, b, k };
              if (gHolds(c, sol, ord)) rels.push(c);
            }
          }
        }
      if (L.kinds.includes("nei"))
        for (let b = a + 1; b < n; b++) for (let x = 0; x < n; x++) if (x !== sol[a] && x !== sol[b]) unary.push({ t: "nei", a, b, x });
    }
    // Order clues first on the harder levels, so the puzzle needs real reasoning about order.
    const pool = L.ordered ? [...shuf(rels, rand).slice(0, 6), ...shuf([...unary, ...shuf(rels, rand).slice(6)], rand)] : shuf(unary, rand);
    let clues = [];
    let count = permsOf(n).length;
    for (const c of pool) {
      if (count === 1) break;
      if (c.t === "is" && clues.filter((k) => k.t === "is").length >= L.maxIs) continue;
      const next = gSolutions(n, ord, [...clues, c]).length;
      if (next < count) {
        clues.push(c);
        count = next;
      }
    }
    if (count !== 1) continue;
    for (const c of shuf(clues, rand)) {
      const rest = clues.filter((k) => k !== c);
      if (gSolutions(n, ord, rest).length === 1) clues = rest;
    }
    if (clues.length < L.min || clues.length > L.max) continue;
    const pz = { n, ord, clues, sol, level, theme };
    const easyPath = gSolvePath(pz, false);
    if (!L.hyp && !easyPath) continue;
    const path = easyPath || gSolvePath(pz, true);
    if (!path) continue;
    if (L.ordered && !path.steps.some((s) => s.kind === "rel" || s.kind === "hyp")) continue;
    if (level === "hard" && easyPath && tries < 300 && rand() < 0.6) continue; // most 🦁 grids need a supposition
    pz.path = path.steps;
    pz.names = namesR(n, rand);
    pz.cols = L.ordered ? ord.map((o, i) => (o === DNF ? "DNF" : ORDN[i])) : shuf(theme.cols, rand).slice(0, n).map((c) => c[1]);
    pz.icons = L.ordered ? ord.map((o, i) => (o === DNF ? "🚫" : ["🥇", "🥈", "🥉", "4️⃣", "5️⃣"][i])) : pz.cols.map((name) => theme.cols.find((c) => c[1] === name)[0]);
    // Shuffle clue order so the reasoning does not simply follow the list.
    pz.clues = shuf(clues, rand);
    const again = gSolvePath(pz, L.hyp);
    if (!again) continue;
    pz.path = again.steps;
    return pz;
  }
  return null;
}
// Sentences for clues and steps.
function gIs(pz, r, x, neg = false) {
  const th = pz.theme;
  const A = pz.names[r];
  if (pz.ord[x] === DNF) return fill(neg ? th.dnfNot : th.dnfIs, { A });

}
function gClueText(pz, i) {
  const c = pz.clues[i];
  const th = pz.theme;
  const N = pz.names;
  if (c.t === "is" || c.t === "not") return gIs(pz, c.a, c.x, c.t === "not") + ".";
  if (c.t === "or") return fill(th.or, { A: N[c.a], x: pz.cols[c.xs[0]], y: pz.cols[c.xs[1]] }) + ".";
  if (c.t === "nei") return fill(th.nei, { A: N[c.a], B: N[c.b], x: pz.cols[c.x] }) + ".";

}
const CAP = (s) => s.charAt(0).toUpperCase() + s.slice(1);
function gStepText(pz, st) {
  const N = pz.names;
  const C = pz.cols;
  const rowWord = pz.theme.who;
  if (st.kind === "tick") return `${gIs(pz, st.r, st.c)}. Each row and each column holds exactly one ✓, so every other box in ${N[st.r]}'s row and in the ${C[st.c]} column is ✗.`;
  if (st.kind === "clue") {
    const c = pz.clues[st.i];
    const lead = `Clue ${st.i + 1}: ${gClueText(pz, st.i)}`;
    if (c.t === "is") return `${lead} Put a ✓ there.`;
    if (c.t === "not") return `${lead} Cross out ${N[c.a]} – ${C[c.x]}.`;
    if (c.t === "or") return st.cells.length === 1 ? `${lead} So ${gIs(pz, c.a, st.cells[0][1], true)}: cross it out.` : `${lead} Cross out every other box in ${N[c.a]}'s row: ${orList(st.cells.map(([, x]) => C[x]), "and")}.`;
    return `${lead} Cross out ${C[c.x]} for both ${N[c.a]} and ${N[c.b]}.`;
  }
  if (st.kind === "rowlast") return `${N[st.r]} has only one box left that is not crossed out. ${CAP(gIs(pz, st.r, st.c))}.`;
  if (st.kind === "collast") return `Only one ${rowWord} can still be ${C[st.c]}: every other box in that column is ✗. So ${gIs(pz, st.r, st.c)}.`;
  if (st.kind === "rel") {
    const cl = pz.clues[st.i];
    const W = N[st.who];
    const O = N[st.other];
    const parts = st.xs.map((x) => {
      const need = [...Array(pz.n).keys()].filter((y) => y !== x && (st.first ? relOk(cl, pz.ord[x], pz.ord[y]) : relOk(cl, pz.ord[y], pz.ord[x])));
      const label = pz.ord[x] === DNF ? `${W} did not finish` : `${W} were ${C[x]}`;
      return need.length ? `if ${label}, ${O} would have to be ${orList(need.map((y) => C[y]))}, and that is already ruled out` : `if ${label}, no place for ${O} could make the clue true`;
    });
    return `Clue ${st.i + 1}: ${gClueText(pz, st.i)} Test each case: ${parts.join("; ")}. So cross out ${W} – ${orList(st.xs.map((x) => C[x]))}.`;
  }
  if (st.kind === "hyp") {
    const brief = (u) =>
      u.kind === "rowlast" || u.kind === "collast" ? `${gIs(pz, u.r, u.c)}` : u.kind === "clue" || u.kind === "rel" ? `clue ${u.i + 1} rules out ${orList([...new Set(u.cells.map(([r, x]) => `${N[r]} – ${C[x]}`))], "and")}` : null;
    const b = st.broken;
    const chain = (b.type === "clash" ? st.used.slice(0, -1) : st.used).map(brief).filter(Boolean);
    const end =
      b.type === "row" ? `${N[b.r]} would have no possible ${pz.theme.noun} left` : b.type === "col" ? `nobody could be ${C[b.c]}` : b.type === "row2" ? `${N[b.r]} would need two ✓ marks` : b.type === "col2" ? `two ${rowWord}s would share ${C[b.c]}` : b.step.i !== undefined ? `${brief(b.step)}, which contradicts what we already have` : `two marks would contradict each other`;
    const shown = chain.length > 4 ? [...chain.slice(0, 3), "…"] : chain;
    return `Suppose ${gIs(pz, st.r, st.c)}. Then ${shown.length ? `${shown.join("; ")}; and ` : ""}${end}. A supposition that leads to a contradiction must be false, so ${gIs(pz, st.r, st.c, true)}.`;
  }
  return "";
}

// ---------- 2. Knights and knaves ----------

          para(g, 110, 170, EXPLAIN.lp0, { size: 30, width: 780 });
          para(g, 110, 320, "Use 2–4 full sentences: say them aloud to a grown-up, or write them down.", { size: 23, width: 780, fill: SOFT, weight: 600 });
        },
      },
    ],
    { alive: () => my === token, onDone: () => shell.go("lp1"), title: "Why logic?" }
  );
}

// ================= 1. Deduction grids =================
function gridGame() {
  const id = "lp1";
  const my = token;
  let level = shell.progress()[id]?.level || "easy";
  let R = level === "hard" ? 6 : 8;
  let round = 0;
  let first = 0;
  let tries = 0;
  let marks = 0;
  let busy = false;
  let pz = null;
  let M = null;
  let cells = [];
  let clueCards = [];
  panel(`${topRow(level)}<div class="lp-in" data-in></div>`);
  const host = $("[data-in]");
  const keyStep = () => pz.path.find((s) => s.kind === "hyp") || pz.path.find((s) => s.kind === "rel") || pz.path.find((s) => s.kind === "clue") || pz.path[0];
  const paint = (r, c) => {
    const g = cells[r][c];
    const v = M[r][c];
    g._mark.textContent = v === 1 ? "✗" : v === 2 ? "✓" : "";
    g._mark.setAttribute("fill", v === 1 ? RED : GREEN);
  };
  const clearGlow = () => {
    view.querySelectorAll(".lp-glow").forEach((n) => n.classList.remove("lp-glow"));
    cells.flat().forEach((g) => {
      g._rect.setAttribute("stroke", LINE);
      g._rect.setAttribute("stroke-width", 3);
    });
    clueCards.forEach((c) => c.setAttribute("stroke", "#e0b84a"));
  };
  const draw = () => {
    const n = pz.n;
    const tall = isTall();
    const clueTexts = pz.clues.map((_, i) => gClueText(pz, i));
    let w = W;
    let h = H;
    let cs;
    let gx;
    let gy;
    let cx;
    let cy;
    let cw;
    let size = 24;
    const labelW = 104;
    const headH = 92;
    if (tall) {
      w = 600;
      cs = Math.min(96, (w - 30 - labelW) / n);
      gx = (w - n * cs - labelW) / 2 + labelW;
      gy = 12 + headH;
      cx = 16;
      cw = w - 32;
      cy = gy + n * cs + 18;
      const need = cy + clueTexts.reduce((s, t) => s + paraH(t, size, cw - 56) + 14, 0) + 8;
      [w, h] = tallBox(600, need);
    } else {
      cs = n === 3 ? 104 : n === 4 ? 88 : 74;
      gx = W - 24 - n * cs;
      gy = (H - (headH + n * cs)) / 2 + headH;
      cx = 16;
      cw = gx - labelW - 40;
      cy = 16;
      const total = (sz) => clueTexts.reduce((s, t) => s + paraH(t, sz, cw - 56) + 14, 0);
      while (size > 21 && total(size) > H - 30) size -= 1;
      cy = Math.max(16, (H - total(size)) / 2);
    }
    fresh(w, h);
    // clue cards
    clueCards = [];
    let y = cy;
    clueTexts.forEach((t, i) => {
      const ch = paraH(t, size, cw - 56) + 8;
      const g = el("g", {}, view);
      clueCards.push(box(g, cx, y, cw, ch, { fill: "#fff7d6", stroke: "#e0b84a", sw: 3, rx: 14 }));
      text(g, cx + 24, y + ch / 2 + 8, String(i + 1), { "font-size": 24, fill: "#a8632d", "font-weight": 900 });
      para(g, cx + 46, y + 3, t, { size, width: cw - 56 });
      y += ch + 6;
    });
    // grid
    pz.cols.forEach((c, i) => {
      emoji(view, gx + i * cs + cs / 2, gy - 62, pz.icons[i], 40);
      text(view, gx + i * cs + cs / 2, gy - 12, c.length > 9 ? c.slice(0, 8) + "." : c, { "font-size": c.length > 6 ? 19 : 22, fill: SOFT });
    });
    pz.names.forEach((nm, r) => text(view, gx - 12, gy + r * cs + cs / 2 + 9, nm, { "font-size": 26, fill: INK, "text-anchor": "end" }));
    cells = [];
    for (let r = 0; r < n; r++) {
      cells.push([]);
      for (let c = 0; c < n; c++) {
        const g = el("g", { class: "lp-tap lp-cell", "data-r": r, "data-c": c, transform: `translate(${gx + c * cs} ${gy + r * cs})` }, view);
        g._rect = box(g, 0, 0, cs, cs, { rx: 6, fill: (r + c) % 2 ? "#fffaf0" : PAPER });
        g._mark = text(g, cs / 2, cs / 2 + cs * 0.22, "", { "font-size": cs * 0.62, "font-weight": 900 });
        cells[r].push(g);
        paint(r, c);
      }
    }
    onTap(view, (g) => {
      if (!g.classList.contains("lp-cell") || busy || my !== token) return;
      const r = Number(g.dataset.r);
      const c = Number(g.dataset.c);
      M[r][c] = (M[r][c] + 1) % 3;
      marks += 1;
      clearGlow();
      paint(r, c);
      MUSIC.play("woodblock", M[r][c] === 2 ? 79 : 72, { gain: 0.22 });
    });
  };
  const acts = () => {
    host.innerHTML = btnRow([["check", "✅ Check", true], ["why", "❓ Why?"], ["clear", "↺ Clear"]]);
  };
  const ask = () => {
    if (my !== token) return;
    pz = gMake(level);
    M = gEmpty(pz.n);
    tries = 0;
    marks = 0;
    busy = false;
    R = level === "hard" ? 6 : 8;
    acts();
    setStatus(`Grid ${round + 1} of ${R}`);
    const rule = pz.ord[pz.n - 1] === DNF ? " Exactly one runner did not finish (DNF); every runner who finished counts as ahead of that runner." : "";
    talk(`Read every clue. Tap a box once for ✗, twice for ✓. Each row and column has exactly one ✓.${rule}`, `Read every clue. Tap a box once for a cross, twice for a tick. Each row and each column has exactly one tick.${rule} ${pz.clues.map((_, i) => `Clue ${i + 1}: ${gClueText(pz, i)}`).join(" ")}`);
    draw();
  };
  const wrongCells = () => {
    const out = [];
    for (let r = 0; r < pz.n; r++) for (let c = 0; c < pz.n; c++) if (M[r][c] && (M[r][c] === 2) !== (pz.sol[r] === c)) out.push([r, c]);
    return out;
  };
  const solved = () => pz.sol.every((c, r) => M[r][c] === 2) && M.every((row) => row.filter((v) => v === 2).length === 1);
  const settle = (won) => {
    busy = true;
    for (let r = 0; r < pz.n; r++) for (let c = 0; c < pz.n; c++) (M[r][c] = pz.sol[r] === c ? 2 : 1), paint(r, c);
    clearGlow();
    const k = keyStep();
    k.cells.forEach(([r, c]) => cells[r][c]._rect.classList.add("lp-glow"));
    if (k.i !== undefined) clueCards[k.i].setAttribute("stroke", "var(--accent)");
    const answer = pz.names.map((nm, r) => gIs(pz, r, pz.sol[r])).join("; ");
    talk(`${won ? (tries ? "Correct — your persistence paid off." : pick(EFFORT)) : "Here is the solution."} ${answer}. <b>The key step:</b> ${gStepText(pz, k)}`);
    host.innerHTML = nextRow(round + 1 >= R);
    window.OC?.count("logic grids solved");
  };
  const check = () => {
    if (busy) return;
    clearGlow();
    if (solved()) {
      MUSIC.chime();
      if (!tries) first += 1;
      return settle(true);
    }
    const bad = wrongCells();
    if (!bad.length) {
      const left = M.filter((row) => !row.includes(2)).length;
      return talk(`Every mark so far is correct. ${left} row${left === 1 ? " still needs" : "s still need"} a ✓. Which clue have you not used yet?`);
    }
    tries += 1;
    MUSIC.oops();
    bad.forEach(([r, c]) => {
      cells[r][c]._rect.setAttribute("stroke", ORANGE);
      cells[r][c]._rect.setAttribute("stroke-width", 7);
    });
    if (tries < 2) {
      const [r, c] = bad[0];
      const clash = pz.clues.findIndex((cl) => UNARY.has(cl.t) && unaryCells(cl, pz.n).some(([a, x, v]) => a === r && x === c && v !== M[r][c]));
      if (clash >= 0) clueCards[clash].setAttribute("stroke", "var(--accent)");
      return talk(`${pick(NUDGE)} ${bad.length === 1 ? "The orange box disagrees" : `${bad.length} orange boxes disagree`} with the clues. ${clash >= 0 ? `Read clue ${clash + 1} again: does your mark agree with it?` : `Test the mark: if it were right, could every clue still be true? Follow the consequences.`}`);
    }
    settle(false);
  };
  const why = () => {
    if (busy) return;
    clearGlow();
    if (!marks && !tries) return talk("Make an attempt first. Which clue tells you something directly? Mark it; then ask <b>Why?</b> for the next forced step.");
    const bad = wrongCells();
    if (bad.length) return talk(`Before the next step: one of your marks is not forced by the clues. Look again at ${pz.names[bad[0][0]]}'s row.`);
    const K = M.map((row) => [...row]);
    const st = gStep(K, pz, true);
    if (!st) return talk("Every box is decided. Press <b>Check</b>.");
    st.cells.forEach(([r, c]) => cells[r][c]._rect.classList.add("lp-glow"));
    if (st.i !== undefined) clueCards[st.i].setAttribute("stroke", "var(--accent)");
    window.OC?.count("reasoning steps explained");
    talk(`<b>Next forced step.</b> ${gStepText(pz, st)}`);
  };
  host.onclick = (event) => {
    const b = event.target.closest("[data-a]");
    if (!b || my !== token) return;
    window.OC?.touch();
    const a = b.dataset.a;
    if (a === "check") check();
    else if (a === "why") why();
    else if (a === "clear" && !busy) {
      M = gEmpty(pz.n);
      clearGlow();
      for (let r = 0; r < pz.n; r++) for (let c = 0; c < pz.n; c++) paint(r, c);
    } else if (a === "next") {
      round += 1;
      if (round >= R) finishGame(id, host, { R, first, noun: "grids", again: restart });
      else ask();
    }
  };
  const restart = () => {
    round = 0;
    first = 0;
    host.onclick = hostClick;
    ask();
  };
  const hostClick = host.onclick;
  bindTop(id, (lv) => {
    level = lv;
    restart();
  });
  ask();
  window.__lp = { pz: () => pz, M: () => M, check, why, solve: () => pz.sol.forEach((c, r) => ((M[r][c] = 2), paint(r, c))), setRound: (r) => (round = r), mark: (r, c, v) => ((M[r][c] = v), (marks += 1), paint(r, c)) };
}

// ================= 2. Knights and knaves =================
function knightGame() {
  const id = "lp2";
  const my = token;
  const R = 8;
  let level = shell.progress()[id]?.level || "easy";
  let round = 0;
  let first = 0;
  let tries = 0;
  let busy = false;
  let pz = null;
  let pick3 = [];
  let toggles = [];
  panel(`${topRow(level)}<div class="lp-in" data-in></div>`);
  const host = $("[data-in]");
  const COLORS = ["#e08a1e", "#1e78c8", "#7b5ea7"];
  const label = (v) => (v === 1 ? "🛡️ Knight" : v === 2 ? "🎭 Knave" : "Knight or knave?");
  const draw = () => {
    const n = pz.n;
    const tall = isTall();
    const speech = (i) => {
      const st = pz.sts.find((s) => s.i === i);
      return st ? `“${knText(st, pz.names)}”` : "(says nothing)";
    };
    if (tall) {
      const cw = 600;
      const rows = [...Array(n).keys()].map((i) => paraH(speech(i), 25, 440) + 108);
      const need = 64 + rows.reduce((a, b) => a + b + 14, 0);
      const [w, h] = tallBox(cw, need);
      fresh(w, h);
      text(view, w / 2, 40, "Knights always tell the truth. Knaves always lie.", { "font-size": 23, fill: "var(--accent-dark)" });
      let y = 64;
      toggles = [];
      for (let i = 0; i < n; i++) {
        const g = el("g", {}, view);
        el("circle", { cx: 60, cy: y + 46, r: 40, fill: COLORS[i] }, g);
        text(g, 60, y + 58, pz.names[i][0], { "font-size": 36, fill: "#fff" });
        text(g, 60, y + 112, pz.names[i], { "font-size": 22, fill: INK });
        const bh = paraH(speech(i), 25, 440);
        box(g, 120, y, 464, bh + 8, { fill: "#fff", stroke: LINE, rx: 18 });
        para(g, 132, y - 2, speech(i), { size: 25, width: 440, weight: 700, fill: pz.sts.some((s) => s.i === i) ? INK : SOFT });
        toggles.push(button(view, 120, y + bh + 16, 464, 78, label(pick3[i]), { data: { k: i }, size: 28 }));
        y += rows[i] + 14;
      }
    } else {
      fresh();
      text(view, W / 2, 46, "Knights always tell the truth. Knaves always lie.", { "font-size": 30, fill: "var(--accent-dark)" });
      const cw = n === 2 ? 430 : 306;
      const gap = 20;
      const x0 = (W - n * cw - (n - 1) * gap) / 2;
      toggles = [];
      for (let i = 0; i < n; i++) {
        const x = x0 + i * (cw + gap);
        const g = el("g", {}, view);
        box(g, x, 72, cw, 470, { fill: "#fffaf0", stroke: LINE, rx: 24 });
        el("circle", { cx: x + cw / 2, cy: 132, r: 44, fill: COLORS[i] }, g);
        text(g, x + cw / 2, 146, pz.names[i][0], { "font-size": 40, fill: "#fff" });
        text(g, x + cw / 2, 210, pz.names[i], { "font-size": 30, fill: INK });
        const size = n === 3 ? 25 : 27;
        const bh = Math.max(120, paraH(speech(i), size, cw - 50) + 12);
        box(g, x + 14, 228, cw - 28, bh, { fill: "#fff", stroke: LINE, rx: 18 });
        para(g, x + 25, 228 + (bh - paraH(speech(i), size, cw - 50)) / 2 - 2, speech(i), { size, width: cw - 50, anchor: "middle", fill: pz.sts.some((s) => s.i === i) ? INK : SOFT });
        toggles.push(button(view, x + 14, 462, cw - 28, 64, label(pick3[i]), { data: { k: i }, size: n === 3 ? 24 : 27 }));
      }
    }
    onTap(view, (g) => {
      if (busy || my !== token || g.dataset.k === undefined) return;
      const i = Number(g.dataset.k);
      pick3[i] = pick3[i] === 1 ? 2 : 1;
      g._label.textContent = label(pick3[i]);
      g._rect.setAttribute("fill", pick3[i] === 1 ? "#e6f3ff" : "#f6e6f6");
      MUSIC.play("woodblock", pick3[i] === 1 ? 79 : 72, { gain: 0.22 });
    });
  };
  const ask = () => {
    if (my !== token) return;
    pz = knMake(level);
    pick3 = Array(pz.n).fill(0);
    tries = 0;
    busy = false;
    host.innerHTML = btnRow([["check", "✅ Check", true]]);
    setStatus(`Island ${round + 1} of ${R}`);
    const lines = pz.sts.map((st) => `${pz.names[st.i]} says: ${knText(st, pz.names)}`).join(" ");
    talk(`Who is a knight, and who is a knave? Tap each islander's button to decide, then press <b>Check</b>.`, `Knights always tell the truth; knaves always lie. ${lines} Who is a knight, and who is a knave?`);
    draw();
  };
  const caseTable = (won) => {
    const tall = isTall();
    const cases = knCases(pz);
    const n = pz.n;
    const colW = tall ? 84 : 120;
    const rowH = n === 3 ? 48 : 64;
    const stH = pz.sts.length * 32 + 10;
    const need = 20 + stH + 56 + cases.length * rowH + 10;
    const [w, h] = tall ? tallBox(600, need) : [W, Math.max(H, need)];
    fresh(w, h);
    let y = 14;
    pz.sts.forEach((st) => {
      text(view, 24, y + 26, `${pz.names[st.i]}: “${knText(st, pz.names)}”`, { "font-size": tall ? 19 : 23, fill: SOFT, "text-anchor": "start" });
      y += 32;
    });
    y += 10;
    const x0 = 20;
    pz.names.forEach((nm, i) => text(view, x0 + i * colW + colW / 2, y + 30, nm, { "font-size": 23, fill: INK }));
    text(view, x0 + n * colW + 16, y + 30, "Test the case", { "font-size": 23, fill: INK, "text-anchor": "start" });
    y += 46;
    cases.forEach((c) => {
      const right = c.ok;
      box(view, x0 - 6, y, w - 2 * x0 + 12, rowH - 6, { fill: right ? "#e3f4e7" : "#fff", stroke: right ? GREEN : "#e6dccd", sw: right ? 4 : 2, rx: 12 });
      c.t.forEach((k, i) => text(view, x0 + i * colW + colW / 2, y + rowH / 2 + 6, k ? "🛡️ K" : "🎭 N", { "font-size": 22, fill: k ? BLUE : "#8e44ad" }));
      const bad = pz.sts.find((st) => knTrue(st, c.t) !== c.t[st.i]);
      const verdict = right ? "✓ every statement fits" : `✗ ${pz.names[bad.i]}: a ${c.t[bad.i] ? "knight" : "knave"} could not say that`;
      text(view, x0 + n * colW + 16, y + rowH / 2 + 6, verdict, { "font-size": tall ? 18 : 22, fill: right ? GREEN : SOFT, "text-anchor": "start", "font-weight": right ? 900 : 700 });
      y += rowH;
    });
    const ans = pz.names.map((nm, i) => `${nm} is a ${pz.ans[i] ? "knight" : "knave"}`).join(", ");
    const st0 = pz.sts[0];
    const t0 = knTrue(st0, pz.ans);
    talk(`${won ? (tries ? "Correct — your persistence paid off." : pick(EFFORT)) : "Here is the reasoning."} ${ans}. The board tests every possible case: assume the types in a row, then check each statement. A knight's statement must be true and a knave's must be false; one mismatch rules the row out. Only one row survives. For example, ${pz.names[st0.i]}'s statement is ${t0 ? "true" : "false"}, which fits a ${t0 ? "knight" : "knave"}.`);
  };
  const check = () => {
    if (busy) return;
    if (pick3.some((v) => !v)) return talk("Decide for every islander first: tap each button until it shows Knight or Knave.");
    const right = pick3.every((v, i) => (v === 1) === pz.ans[i]);
    if (right) {
      MUSIC.chime();
      if (!tries) first += 1;
      busy = true;
      caseTable(true);
      host.innerHTML = nextRow(round + 1 >= R);
      window.OC?.count("knights and knaves solved");
      return;
    }
    tries += 1;
    MUSIC.oops();
    const t = pick3.map((v) => v === 1);
    const bad = pz.sts.find((st) => knTrue(st, t) !== t[st.i]) || pz.sts[0];
    if (tries < 2) {
      return talk(`${pick(NUDGE)} Test your own answer. If ${pz.names[bad.i]} is a ${t[bad.i] ? "knight" : "knave"}, the statement “${knText(bad, pz.names)}” must be ${t[bad.i] ? "true" : "false"}. Is it, with your choices? Try supposing the opposite and follow the consequences.`);
    }
    busy = true;
    caseTable(false);
    host.innerHTML = nextRow(round + 1 >= R);
  };
  host.onclick = (event) => {
    const b = event.target.closest("[data-a]");
    if (!b || my !== token) return;
    window.OC?.touch();
    if (b.dataset.a === "check") check();
    else if (b.dataset.a === "next") {
      round += 1;
      if (round >= R) finishGame(id, host, { R, first, noun: "islands", again: restart });
      else ask();
    }
  };
  const hostClick = host.onclick;
  const restart = () => {
    round = 0;
    first = 0;
    host.onclick = hostClick;
    ask();
  };
  bindTop(id, (lv) => {
    level = lv;
    restart();
  });
  ask();
  window.__lp = { pz: () => pz, set: (arr) => arr.forEach((v, i) => (pick3[i] = v ? 1 : 2)), check, setRound: (r) => (round = r) };
}

// ================= 3. Sudoku =================
function sudokuGame() {
  const id = "lp3";
  const my = token;
  let level = shell.progress()[id]?.level || "easy";
  const SIZE = { easy: 4, medium: 6, hard: 9 };
  const ROUNDS = { easy: 8, medium: 5, hard: 3 };
  let R = ROUNDS[level];
  let round = 0;
  let first = 0;
  let tries = 0;
  let entered = 0;
  let busy = false;
  let pz = null;
  let g = [];
  let pm = [];
  let sel = -1;
  let pencil = false;
  let wrongShown = new Set();
  let hintCell = -1;
  let cellG = [];
  let padG = [];
  panel(`${topRow(level)}<div class="lp-in" data-in></div>`);
  const host = $("[data-in]");
  const draw = () => {
    const n = pz.n;
    const [br, bc] = SD_BOX[n];
    const tall = isTall();
    let gs;
    let gx;
    let gy;
    let px;
    let py;
    let pw;
    let ph;
    let cols;
    if (tall) {
      // 9×9 on a phone: use the full width so the squares are as large as possible.
      gs = n === 9 ? 584 : 560;
      gx = n === 9 ? 8 : 20;
      gy = 10;
      px = gx;
      py = gy + gs + 16;
      pw = gs;
      cols = n;
      ph = 74;
      const [w, h] = tallBox(600, py + ph * 2 + 24);
      fresh(w, h);
    } else {
      fresh();
      gs = 530;
      gx = 40;
      gy = 15;
      px = 620;
      py = 30;
      pw = 350;
      cols = n === 4 ? 2 : 3;
      ph = Math.min(96, (440 - 12 * Math.ceil(n / cols)) / Math.ceil(n / cols + 1));
    }
    const cs = gs / n;
    cellG = [];
    for (let i = 0; i < n * n; i++) {
      const r = Math.floor(i / n);
      const c = i % n;
      const cg = el("g", { class: "lp-tap lp-cell", "data-i": i, transform: `translate(${gx + c * cs} ${gy + r * cs})` }, view);
      cg._rect = el("rect", { width: cs, height: cs, fill: "#fff", stroke: "#cdbfa8", "stroke-width": 1.5 }, cg);
      cg._num = text(cg, cs / 2, cs / 2 + cs * 0.2, "", { "font-size": cs * 0.56 });
      cg._pm = el("g", {}, cg);
      cellG.push(cg);
    }
    // box borders
    for (let b = 0; b <= n; b++) {
      if (b % bc === 0) el("line", { x1: gx + b * cs, y1: gy, x2: gx + b * cs, y2: gy + gs, stroke: INK, "stroke-width": 4, "pointer-events": "none" }, view);
      if (b % br === 0) el("line", { x1: gx, y1: gy + b * cs, x2: gx + gs, y2: gy + b * cs, stroke: INK, "stroke-width": 4, "pointer-events": "none" }, view);
    }
    padG = [];
    const keys = [...Array(n).keys()].map((d) => String(d + 1));
    if (tall && n === 9) {
      // Two rows of six wide keys (1–5 + pencil, 6–9 + erase) instead of nine narrow ones.
      const kw = (pw - 5 * 8) / 6;
      keys.forEach((k, j) => padG.push(button(view, px + (j % 5) * (kw + 8), py + Math.floor(j / 5) * (ph + 10), kw, ph, k, { size: 36, data: { d: k } })));
      const pb = button(view, px + 5 * (kw + 8), py, kw, ph, "✏️ off", { size: 24, data: { d: "pencil" } });
      pb._short = true;
      padG.push(pb);
      padG.push(button(view, px + 4 * (kw + 8), py + ph + 10, kw * 2 + 8, ph, "⌫ Erase", { size: 26, data: { d: "erase" } }));
    } else if (tall) {
      const kw = (pw - (n - 1) * 8) / n;
      keys.forEach((k, j) => padG.push(button(view, px + j * (kw + 8), py, kw, ph, k, { size: 34, data: { d: k } })));
      padG.push(button(view, px, py + ph + 10, pw / 2 - 5, ph, "✏️ Pencil: off", { size: 24, data: { d: "pencil" } }));
      padG.push(button(view, px + pw / 2 + 5, py + ph + 10, pw / 2 - 5, ph, "⌫ Erase", { size: 24, data: { d: "erase" } }));
    } else {
      const kw = (pw - (cols - 1) * 12) / cols;
      keys.forEach((k, j) => padG.push(button(view, px + (j % cols) * (kw + 12), py + Math.floor(j / cols) * (ph + 12), kw, ph, k, { size: 38, data: { d: k } })));
      const yb = py + Math.ceil(n / cols) * (ph + 12) + 8;
      padG.push(button(view, px, yb, pw, Math.min(ph, 72), "✏️ Pencil: off", { size: 26, data: { d: "pencil" } }));
      padG.push(button(view, px, yb + Math.min(ph, 72) + 12, pw, Math.min(ph, 72), "⌫ Erase", { size: 26, data: { d: "erase" } }));
    }
    onTap(view, (t) => {
      if (busy || my !== token) return;
      if (t.dataset.i !== undefined) {
        sel = Number(t.dataset.i);
        MUSIC.tick?.();
      } else if (t.dataset.d === "pencil") pencil = !pencil;
      else if (t.dataset.d === "erase") {
        if (sel >= 0 && !pz.givens[sel]) {
          g[sel] = 0;
          pm[sel].clear();
          wrongShown.delete(sel);
        }
      } else if (t.dataset.d) put(Number(t.dataset.d));
      render();
    });
    render();
  };
  const put = (d) => {
    if (sel < 0 || pz.givens[sel]) return say(sel < 0 ? "First tap an empty square, then a digit." : "That digit is given; choose an empty square.", { voice: false });
    if (pencil) {
      if (pm[sel].has(d)) pm[sel].delete(d);
      else pm[sel].add(d);
      g[sel] = 0;
      return;
    }
    g[sel] = g[sel] === d ? 0 : d;
    wrongShown.delete(sel);
    pm[sel].clear();
    if (g[sel]) {
      entered += 1;
      for (const j of sdPeers(pz.n).peers[sel]) pm[j].delete(d);
      MUSIC.play("xylophone", 60 + d * 2, { gain: 0.2 });
    }
    hintCell = -1;
  };
  const render = () => {
    const n = pz.n;
    const peers = sel >= 0 ? new Set(sdPeers(n).peers[sel]) : new Set();
    const cs = Number(cellG[0]._rect.getAttribute("width"));
    const selD = sel >= 0 ? g[sel] : 0;
    cellG.forEach((cg, i) => {
      const fillC = i === sel ? "#ffe3b8" : i === hintCell ? "#d8f2df" : selD && g[i] === selD ? "#fff1d6" : peers.has(i) ? "#fbf5ea" : "#fff";
      cg._rect.setAttribute("fill", fillC);
      cg._num.textContent = g[i] ? String(g[i]) : "";
      cg._num.setAttribute("fill", pz.givens[i] ? INK : wrongShown.has(i) ? RED : BLUE);
      cg._num.setAttribute("font-weight", pz.givens[i] ? 900 : 700);
      cg._pm.innerHTML = "";
      if (!g[i] && pm[i].size) {
        const [br, bc] = SD_BOX[n];
        const k = Math.ceil(Math.sqrt(n));
        const per = n === 6 ? 3 : k;
        const rows = Math.ceil(n / per);
        for (const d of pm[i]) {
          const x = (((d - 1) % per) + 0.5) * (cs / per);
          const y = (Math.floor((d - 1) / per) + 0.5) * (cs / rows) + cs / rows / 4;
          text(cg._pm, x, y, String(d), { "font-size": Math.max(13, (cs / rows) * 0.62), fill: SOFT, "font-weight": 700 });
        }
        void br;
        void bc;
      }
    });
    const pb = padG.find((p) => p.dataset.d === "pencil");
    if (pb) {
      pb._label.textContent = pb._short ? `✏️ ${pencil ? "on" : "off"}` : `✏️ Pencil: ${pencil ? "on" : "off"}`;
      pb._rect.setAttribute("fill", pencil ? "var(--accent-soft)" : "#fff");
    }
  };
  const ask = () => {
    if (my !== token) return;
    pz = sdMake(SIZE[level]);
    g = [...pz.givens];
    pm = g.map(() => new Set());
    sel = -1;
    tries = 0;
    entered = 0;
    busy = false;
    hintCell = -1;
    wrongShown = new Set();
    R = ROUNDS[level];
    host.innerHTML = btnRow([["check", "✅ Check", true], ["hint", "💡 Hint"]]);
    setStatus(`Puzzle ${round + 1} of ${R}`);
    const [br, bc] = SD_BOX[pz.n];
    talk(`Fill the grid so that every row, column and ${br}×${bc} box contains 1 to ${pz.n} exactly once. Tap a square, then a digit.`);
    draw();
  };
  const correctGrid = () => g.map((v, i) => (v && v === pz.sol[i] ? v : 0));
  const firstHint = () => sdSingle([...pz.givens], pz.n);
  const settle = (won) => {
    busy = true;
    g = [...pz.sol];
    wrongShown.clear();
    sel = -1;
    const h0 = firstHint();
    hintCell = h0 ? h0.i : -1;
    render();
    talk(`${won ? (tries ? "Correct — your persistence paid off." : pick(EFFORT)) : "Here is the solution."} Every digit was forced; no guess was needed. For example, the very first step from the start: ${h0 ? sdHintText(h0, pz.n) : ""}`);
    host.innerHTML = nextRow(round + 1 >= R);
    window.OC?.count("sudoku solved");
  };
  const check = () => {
    if (busy) return;
    const wrong = g.map((v, i) => (v && !pz.givens[i] && v !== pz.sol[i] ? i : -1)).filter((i) => i >= 0);
    const empty = g.filter((v) => !v).length;
    if (!wrong.length && !empty) {
      MUSIC.chime();
      if (!tries) first += 1;
      return settle(true);
    }
    if (!wrong.length) return talk(`No errors so far. ${empty} square${empty === 1 ? "" : "s"} remain${empty === 1 ? "s" : ""}. Look for a box, row or column with only one gap.`);
    tries += 1;
    MUSIC.oops();
    wrong.forEach((i) => wrongShown.add(i));
    render();
    if (tries < 2) return talk(`${pick(NUDGE)} ${wrong.length} digit${wrong.length === 1 ? " is" : "s are"} not part of the solution (shown in red). For each one, list the digits its row, column and box already contain. What is truly left?`);
    settle(false);
  };
  const hint = () => {
    if (busy) return;
    if (!entered && !tries) return talk("Try first. Choose one box: which digit is missing, and in how many squares could it go? Then ask for a hint.");
    if (g.some((v, i) => v && v !== pz.sol[i])) return talk("Before the next step: one of your digits is wrong. Press <b>Check</b> to find it.");
    const s = sdSingle(correctGrid(), pz.n);
    if (!s) return talk("The grid is complete. Press <b>Check</b>.");
    hintCell = s.i;
    sel = -1;
    render();
    window.OC?.count("sudoku techniques named");
    talk(`${sdHintText(s, pz.n)} (The green square.)`);
  };
  host.onclick = (event) => {
    const b = event.target.closest("[data-a]");
    if (!b || my !== token) return;
    window.OC?.touch();
    const a = b.dataset.a;
    if (a === "check") check();
    else if (a === "hint") hint();
    else if (a === "next") {
      round += 1;
      if (round >= R) finishGame(id, host, { R, first, noun: "puzzles", again: restart });
      else ask();
    }
  };
  const hostClick = host.onclick;
  const restart = () => {
    round = 0;
    first = 0;
    host.onclick = hostClick;
    ask();
  };
  bindTop(id, (lv) => {
    level = lv;
    restart();
  });
  ask();
  window.__lp = { pz: () => pz, g: () => g, fill: (k = 0) => ((g = pz.sol.map((v, i) => (i < pz.n * pz.n - k ? v : pz.givens[i]))), (entered += 1), render()), wrong: () => { const i = g.findIndex((v, k) => !pz.givens[k]); g[i] = (pz.sol[i] % pz.n) + 1; entered += 1; render(); }, check, hint, setRound: (r) => (round = r), sel: (i) => ((sel = i), render()), put: (d) => (put(d), render()) };
}

// ================= 4. River crossings and jugs =================
function crossGame() {
  const id = "lp4";
  const my = token;
  const R = 6;
  let level = shell.progress()[id]?.level || "easy";
  let round = 0;
  let first = 0;
  let tries = 0;
  let moves = 0;
  let busy = false;
  let pz = null;
  let kind = "river";
  let s = null; // current state
  let load = []; // river: items (farm) or [explorers, bears] in the boat
  let selJ = -1;
  panel(`${topRow(level)}<div class="lp-in" data-in></div>`);
  const host = $("[data-in]");
  const api = () => anim(() => my === token);
  const startState = () => (kind === "jug" ? [...pz.start] : pz.kind === "farm" ? { f: 0, at: pz.items.map(() => 0) } : { e: pz.m, b: pz.m, boat: 0 });
  const boatSide = () => (pz.kind === "farm" ? s.f : s.boat);
  // ---------- river drawing ----------
  const drawRiver = (sailing = false) => {
    const tall = isTall();
    const [w, h] = tall ? tallBox(600, 640) : [W, H];
    fresh(w, h);
    const bankW = tall ? 170 : 250;
    el("rect", { x: 0, y: 0, width: w, height: h, fill: "#cfe8f7" }, view);
    for (let k = 0; k < 6; k++) for (let x = bankW + 20 + (k % 2) * 60; x < w - bankW - 100; x += 200) el("path", { d: `M${x} ${80 + k * 80} q 40 -14 80 0 t 80 0`, fill: "none", stroke: "#a9d3ee", "stroke-width": 4 }, view);
    el("rect", { x: 0, y: 0, width: bankW, height: h, fill: "#cde7b0" }, view);
    el("rect", { x: w - bankW, y: 0, width: bankW, height: h, fill: "#cde7b0" }, view);
    text(view, bankW / 2, 34, "Start", { "font-size": 24, fill: "#3d6b22" });
    text(view, w - bankW / 2, 34, "Goal", { "font-size": 24, fill: "#3d6b22" });
    const tok = [];
    const side = boatSide();
    const boatX = side === 0 ? bankW + 10 : w - bankW - (tall ? 160 : 200) - 10;
    const boatW = tall ? 160 : 200;
    const boatY = h / 2 + 30;
    const mover = el("g", {}, view);
    const boat = el("g", { class: "lp-boat", transform: `translate(${boatX} ${boatY})` }, mover);
    el("path", { d: `M0 0 L${boatW} 0 L${boatW - 26} 46 L26 46 Z`, fill: "#9a6234", stroke: "#5d3a1c", "stroke-width": 4 }, boat);
    const r = tall ? 34 : 40;
    const place = (glyph, x, y, data, inBoat) => {
      const g2 = el("g", { class: "lp-tap", transform: `translate(${x} ${y})` }, inBoat ? mover : view);
      for (const [k, v] of Object.entries(data)) g2.setAttribute(`data-${k}`, v);
      el("circle", { r, fill: inBoat ? "#fff3c4" : "#fff", stroke: inBoat ? "#d1a52a" : "rgba(0,0,0,.18)", "stroke-width": 3 }, g2);
      emoji(g2, 0, -2, glyph, r * 1.15);
      tok.push(g2);
      return g2;
    };
    const colX = (sd) => (sd === 0 ? bankW / 2 : w - bankW / 2);
    const slots = (count) => [...Array(count).keys()].map((k) => 90 + k * Math.min(2.3 * r + 6, (h - 120) / Math.max(1, count)));
    if (pz.kind === "farm") {
      const onBank = [[], []];
      if (!sailing) onBank[s.f].push(-1); // the farmer waits on the bank until the boat sails
      pz.items.forEach((_, i) => {
        if (!load.includes(i)) onBank[s.at[i]].push(i);
      });
      for (const sd of [0, 1]) {
        const ys = slots(onBank[sd].length);
        onBank[sd].forEach((i, k) => {
          if (i === -1) place("🧑‍🌾", colX(sd), ys[k], { f: 1 }, false);
          else place(pz.items[i][0], colX(sd), ys[k], { item: i }, false);
        });
      }
      const crew = sailing ? [-1, ...load] : load;
      crew.forEach((i, k) => place(i === -1 ? "🧑‍🌾" : pz.items[i][0], boatX + boatW / 2 + (k - (crew.length - 1) / 2) * 2.1 * r, boatY - r + 6, i === -1 ? { f: 1 } : { item: i, boat: 1 }, true));
      if (!crew.length) text(view, boatX + boatW / 2, boatY - 12, "empty", { "font-size": 22, fill: "#5d3a1c" });
    } else {
      const L = [s.e, s.b];
      const Rr = [pz.m - s.e, pz.m - s.b];
      const banks = [L, Rr];
      for (const sd of [0, 1]) {
        const [ex, be] = banks[sd];
        const inE = sd === s.boat ? load[0] : 0;
        const inB = sd === s.boat ? load[1] : 0;
        const ys = slots(Math.max(pz.m, 1));
        for (let k = 0; k < ex - inE; k++) place("🤠", colX(sd) - (tall ? 40 : 52), ys[k], { who: "e", sd }, false);
        for (let k = 0; k < be - inB; k++) place("🐻", colX(sd) + (tall ? 40 : 52), ys[k], { who: "b", sd }, false);
      }
      const inside = [...Array(load[0]).fill("e"), ...Array(load[1]).fill("b")];
      inside.forEach((who, k) => place(who === "e" ? "🤠" : "🐻", boatX + boatW / 2 + (k - (inside.length - 1) / 2) * 2.1 * r, boatY - r + 6, { who, boat: 1 }, true));
      if (!inside.length) text(view, boatX + boatW / 2, boatY - 12, "empty", { "font-size": 22, fill: "#5d3a1c" });
    }
    const rule = pz.kind === "farm" ? `${pz.eats.map(([a, b]) => `${pz.items[a][1]} eats ${pz.items[b][1]}`).join(" · ")}` : `Bears must never outnumber explorers`;
    const lim = pz.kind === "farm" ? `Boat: farmer + ${pz.cap}` : `Boat: ${pz.cap} seats`;
    el("rect", { x: 0, y: h - (tall ? 80 : 86), width: w, height: tall ? 80 : 86, fill: "rgba(255,255,255,.82)" }, view);
    text(view, w / 2, h - (tall ? 48 : 52), rule, { "font-size": tall ? 21 : 24, fill: "#1d4f7a" });
    text(view, w / 2, h - 16, `${lim} · Crossings: ${moves} · Fewest possible: ${pz.min}`, { "font-size": tall ? 21 : 24, fill: "#1d4f7a" });
    onTap(view, (t) => riverTap(t));
    const target = side === 0 ? w - bankW - boatW - 10 : bankW + 10;
    return { mover, dx: target - boatX };
  };
  const riverTap = (t) => {
    if (busy || my !== token) return;
    const side = boatSide();
    if (pz.kind === "farm") {
      if (t.dataset.f) return say("The farmer always rows. Choose what goes with the farmer, then press <b>Cross</b>.", { voice: false });
      const i = Number(t.dataset.item);
      if (Number.isNaN(i)) return;
      if (t.dataset.boat) load = load.filter((x) => x !== i);
      else if (s.at[i] !== side) return say("The boat is on the other bank.", { voice: false });
      else if (load.length >= pz.cap) return say(`The boat holds the farmer and ${pz.cap === 1 ? "one passenger" : "two passengers"}.`, { voice: false });
      else load.push(i);
    } else {
      const who = t.dataset.who;
      if (!who) return;
      const k = who === "e" ? 0 : 1;
      if (t.dataset.boat) load[k] -= 1;
      else if (Number(t.dataset.sd) !== side) return say("The boat is on the other bank.", { voice: false });
      else if (load[0] + load[1] >= pz.cap) return say(`The boat has only ${pz.cap} seats.`, { voice: false });
      else load[k] += 1;
    }
    MUSIC.play("woodblock", 76, { gain: 0.2 });
    drawRiver();
  };
  const cross = async () => {
    if (busy || my !== token) return;
    if (pz.kind === "bears" && load[0] + load[1] === 0) return talk("Someone must row: put at least one passenger in the boat.");
    busy = true;
    const prev = s;
    const next = pz.kind === "farm" ? { f: 1 - s.f, at: s.at.map((v, i) => (load.includes(i) ? 1 - v : v)) } : { e: s.e + (s.boat === 0 ? -load[0] : load[0]), b: s.b + (s.boat === 0 ? -load[1] : load[1]), boat: 1 - s.boat };
    const d = drawRiver(true);
    await quiet(api().tween(900, (k) => d.mover.setAttribute("transform", `translate(${d.dx * k} 0)`)));
    if (my !== token) return;
    const bad = pz.kind === "farm" ? farmUnsafe(pz, next) : bearUnsafe(pz, next);
    if (bad) {
      tries += 1;
      MUSIC.oops();
      const msg = pz.kind === "farm" ? `Left alone without the farmer, the ${pz.items[bad[0]][1]} would eat the ${pz.items[bad[1]][1]}.` : (() => {
        const e = bad === "left" ? next.e : pz.m - next.e;
        const b = bad === "left" ? next.b : pz.m - next.b;
        return `On the ${bad === "left" ? "start" : "goal"} bank, ${b} bear${b === 1 ? "" : "s"} would outnumber ${e} explorer${e === 1 ? "" : "s"}.`;
      })();
      s = prev;
      busy = false;
      drawRiver();
      return talk(`${msg} That crossing is not allowed, so the boat returns. ${tries >= 2 ? "If you wish, press <b>▶ Show me</b> to watch the shortest solution." : "Think one move ahead: what will be left behind?"}`);
    }
    s = next;
    moves += 1;
    load = pz.kind === "farm" ? [] : [0, 0];
    busy = false;
    drawRiver();
    MUSIC.play("xylophone", 67 + (moves % 5) * 2, { gain: 0.2 });
    const done = pz.kind === "farm" ? s.f === 1 && s.at.every((v) => v === 1) : s.e === 0 && s.b === 0 && s.boat === 1;
    if (done) return win(true);
    if (tries >= 2) acts();
  };
  // ---------- jugs ----------
  const drawJugs = (flash = -1) => {
    const tall = isTall();
    const [w, h] = tall ? tallBox(600, 600) : [W, H];
    fresh(w, h);
    const n = pz.caps.length;
    const maxC = Math.max(...pz.caps);
    const jw = tall ? (n === 3 ? 140 : 170) : n === 3 ? 170 : 200;
    const gap = tall ? 30 : 70;
    const x0 = (w - n * jw - (n - 1) * gap) / 2;
    const top = 90;
    const bottom = h - (pz.tap ? (tall ? 170 : 150) : 80);
    const unit = (bottom - top) / maxC;
    const goal = pz.split ? `Goal: split the ${pz.caps[0]} litres into two equal halves, ${pz.target} + ${pz.target}` : `Goal: exactly ${pz.target} litre${pz.target === 1 ? "" : "s"} in one jug`;
    text(view, w / 2, 40, goal, { "font-size": tall ? 23 : 30, fill: "var(--accent-dark)" });
    pz.caps.forEach((cap, i) => {
      const x = x0 + i * (jw + gap);
      const hh = cap * unit;
      const jg = el("g", { class: "lp-tap", "data-j": i }, view);
      el("rect", { x: x - 10, y: top - 10, width: jw + 20, height: bottom - top + 20, fill: "transparent" }, jg);
      el("rect", { x, y: bottom - hh, width: jw, height: hh, rx: 10, fill: "#eef6fb", stroke: i === selJ ? "var(--accent)" : "#5b7f99", "stroke-width": i === selJ ? 8 : 5 }, jg);
      const lv = s[i] * unit;
      el("rect", { x: x + 5, y: bottom - lv, width: jw - 10, height: Math.max(0, lv - 4), rx: 6, fill: flash === i ? "#5fb6f0" : "#3d9be0" }, jg);
      for (let k = 1; k < cap; k++) el("line", { x1: x, y1: bottom - k * unit, x2: x + 18, y2: bottom - k * unit, stroke: "#5b7f99", "stroke-width": 3 }, jg);
      text(jg, x + jw / 2, bottom - hh - 14, `${cap}-litre jug`, { "font-size": 22, fill: SOFT });
      text(jg, x + jw / 2, bottom - hh / 2 + 12, `${s[i]} L`, { "font-size": 36, fill: INK, "font-weight": 900, stroke: "#fff", "stroke-width": 7, "paint-order": "stroke" });
      if (pz.tap) {
        const bh2 = tall ? 82 : 58;
        button(view, x - (tall ? 6 : 0), bottom + 14, jw / 2 - 2 + (tall ? 6 : 0), bh2, "Fill", { size: tall ? 26 : 23, data: { op: "fill", j: i } });
        button(view, x + jw / 2 + 4, bottom + 14, jw / 2 - 2 + (tall ? 6 : 0), bh2, "Empty", { size: tall ? 26 : 23, data: { op: "empty", j: i } });
      }
    });
    text(view, w / 2, h - 14, `${pz.tap ? "Tap a jug, then another, to pour." : "No tap: only pour, jug to jug."} Moves: ${moves} · Fewest: ${pz.min}`, { "font-size": tall ? 20 : 23, fill: SOFT });
    onTap(view, (t) => jugTap(t));
  };
  const jugDo = (mv) => {
    const next = jugMoves(pz, s).find((m) => JSON.stringify(m.move) === JSON.stringify(mv));
    if (!next) return false;
    s = next.state;
    moves += 1;
    MUSIC.play("xylophone", 60 + (s.reduce((a, b) => a + b, 0) % 20), { gain: 0.25 });
    return true;
  };
  const jugTap = (t) => {
    if (busy || my !== token) return;
    const j = Number(t.dataset.j);
    if (t.dataset.op) {
      const done = jugDo({ op: t.dataset.op, i: j });
      if (!done) say(t.dataset.op === "fill" ? "That jug is already full." : "That jug is already empty.", { voice: false });
      selJ = -1;
    } else if (selJ < 0) {
      if (!s[j]) return say("That jug is empty: there is nothing to pour.", { voice: false });
      selJ = j;
    } else if (selJ === j) selJ = -1;
    else {
      if (!jugDo({ op: "pour", i: selJ, j })) say("Nothing can be poured: the jug is full.", { voice: false });
      selJ = -1;
    }
    drawJugs();
    if (jugGoal(pz, s)) return win(true);
    if (moves > pz.min * 2 + 2 && tries < 2) {
      tries = 2;
      acts();
      talk("You have made many moves. Restart and plan ahead, ask for a hint, or press <b>▶ Show me</b> for the shortest solution.");
    }
  };
  // ---------- shared ----------
  const solveFrom = () => (kind === "jug" ? jugSolve(pz, s) : pz.kind === "farm" ? farmSolve(pz, s) : bearSolve(pz, s));
  const moveWords = (mv) => {
    if (kind === "jug") return JUG_WORD(pz, mv);
    if (pz.kind === "farm") return mv.length ? `the farmer takes the ${mv.map((i) => pz.items[i][1]).join(" and the ")} across` : "the farmer crosses alone";
    const [e, b] = mv;
    return `send ${[e ? `${e} explorer${e > 1 ? "s" : ""}` : "", b ? `${b} bear${b > 1 ? "s" : ""}` : ""].filter(Boolean).join(" and ")}`;
  };
  const win = (mine) => {
    busy = true;
    MUSIC.chime();
    if (mine && !tries) first += 1;
    const full = kind === "jug" ? jugSolve(pz) : pz.kind === "farm" ? farmSolve(pz) : bearSolve(pz);
    const best = moves === pz.min;
    talk(`${mine ? (best ? "Correct — and in the fewest possible moves." : "Solved.") : "That is the shortest solution."} ${mine ? `You used ${moves} move${moves === 1 ? "" : "s"}. ` : ""}A breadth-first search (checking every position 1 move away, then 2, then 3, and so on) examined ${full.explored} positions and proves that ${pz.min} is the minimum: no shorter route exists.${mine && !best ? " Can you find where your route took a detour?" : ""}`);
    host.innerHTML = nextRow(round + 1 >= R);
    window.OC?.count("state-space puzzles solved");
  };
  const showMe = async () => {
    if (my !== token) return;
    busy = true;
    s = startState();
    moves = 0;
    load = pz.kind === "farm" ? [] : [0, 0];
    selJ = -1;
    const path = solveFrom().path;
    const a = api();
    redraw();
    for (const step of path) {
      await quiet(a.wait(400));
      if (my !== token) return;
      say(`Move ${moves + 1}: ${moveWords(step.move)}.`, { voice: false });
      VOICE.speak(`Move ${moves + 1}: ${moveWords(step.move)}.`);
      s = step.state;
      moves += 1;
      redraw();
      MUSIC.play("xylophone", 67 + (moves % 5) * 2, { gain: 0.2 });
      await quiet(a.wait(2000));
      if (my !== token) return;
    }
    win(false);
  };
  const hint = () => {
    if (busy) return;
    if (moves < 2 && !tries) return talk("Make a few moves first; a hint is more useful once you have tried a plan.");
    if (kind === "river") load = pz.kind === "farm" ? [] : [0, 0];
    const res = solveFrom();
    if (!res.path) return talk("From this position the goal cannot be reached. Press <b>↺ Restart</b>.");
    redraw();
    window.OC?.count("hints used wisely");
    talk(`From here, the shortest route needs ${res.path.length} more move${res.path.length === 1 ? "" : "s"}. Next: ${moveWords(res.path[0].move)}.`);
  };
  const redraw = () => (kind === "jug" ? drawJugs() : drawRiver());
  const acts = () => {
    const list = kind === "jug" ? [["hint", "💡 Hint"], ["reset", "↺ Restart"]] : [["cross", "⛵ Cross", true], ["hint", "💡 Hint"], ["reset", "↺ Restart"]];
    if (tries >= 2) list.push(["show", "▶ Show me"]);
    host.innerHTML = btnRow(list);
  };
  const ask = () => {
    if (my !== token) return;
    kind = round % 2 === 0 ? "river" : "jug";
    pz = kind === "jug" ? jugMake(level) : riverMake(level);
    s = startState();
    load = kind === "river" && pz.kind === "bears" ? [0, 0] : [];
    selJ = -1;
    moves = 0;
    tries = 0;
    busy = false;
    acts();
    setStatus(`Puzzle ${round + 1} of ${R}`);
    queueMicrotask(redraw);
    if (kind === "jug") talk(pz.split ? `Split the ${pz.caps[0]} litres into two equal halves using only these jugs. Tap a jug, then another, to pour. Each pour counts as one move.` : `Measure exactly ${pz.target} litre${pz.target === 1 ? "" : "s"}. Fill, empty, or tap one jug and then another to pour. Each fill, empty or pour counts as one move.`);
    else if (pz.kind === "farm") talk(`Bring everything to the goal bank. The boat carries the farmer and ${pz.cap === 1 ? "one passenger" : "up to two passengers"}. Never leave a hungry pair alone.${round === 0 ? " (A puzzle of this kind appears in <i>Problems to Sharpen the Young</i>, a collection attributed to Alcuin of York, written around AD 800.)" : ""}`);
    else talk(`Bring all ${pz.m} explorers and ${pz.m} bears across. The boat holds ${pz.cap}. On either bank, bears must never outnumber explorers who are there.`);
  };
  host.onclick = (event) => {
    const b = event.target.closest("[data-a]");
    if (!b || my !== token) return;
    window.OC?.touch();
    const a = b.dataset.a;
    if (a === "cross") cross();
    else if (a === "hint") hint();
    else if (a === "reset" && !busy) {
      tries += 1;
      s = startState();
      moves = 0;
      load = kind === "river" && pz.kind === "bears" ? [0, 0] : [];
      selJ = -1;
      redraw();
      acts();
      talk(tries >= 2 ? "Fresh start. Plan the first three moves before you begin, or press <b>▶ Show me</b>." : "Fresh start. Plan the first three moves before you begin.");
    } else if (a === "show" && !busy) showMe();
    else if (a === "next") {
      round += 1;
      if (round >= R) finishGame(id, host, { R, first, noun: "puzzles", again: restart });
      else ask();
    }
  };
  const hostClick = host.onclick;
  const restart = () => {
    round = 0;
    first = 0;
    host.onclick = hostClick;
    ask();
  };
  bindTop(id, (lv) => {
    level = lv;
    restart();
  });
  ask();
  window.__lp = { pz: () => pz, s: () => s, kind: () => kind, setRound: (r) => (round = r), go: (r) => ((round = r), ask()), showMe, hint, solve: async () => { for (const st of solveFrom().path) { if (kind === "jug") jugDo(st.move); else { load = pz.kind === "farm" ? [...st.move] : [...st.move]; await cross(); } } if (kind === "jug") { drawJugs(); win(true); } } };
}

// ================= the question engine (binary, syllogisms, truth tables) =================
// cfg: { R, make(level, round) -> q, noun, count }
// q: { draw(a), ask, voice?, input: "num" | "choice" | "custom", opts?, mount?(host, answer), ans, ok?(v), hint(v), why, after?(a, won), max? }
function quiz(id, cfg) {
  const my = token;
  const R = cfg.R || 8;
  let level = shell.progress()[id]?.level || "easy";
  let round = 0;
  let first = 0;
  let tries = 0;
  let q = null;
  let busy = false;
  let pad = null;
  panel(`${topRow(level)}<div class="lp-in" data-in></div>`);
  const host = $("[data-in]");
  const isRight = (v) => (q.ok ? q.ok(v) : v === q.ans);
  const ask = () => {
    if (my !== token) return;
    tries = 0;
    busy = false;
    q = cfg.make(level, round);
    const qq = q;
    q.a = anim(() => my === token && q === qq);
    setStatus(`${cfg.noun1 || "Question"} ${round + 1} of ${R}`);
    host.onclick = null;
    host.className = `lp-in${q.input === "choice" ? " lp-pick" : ""}`;
    pad = null;
    if (q.input === "choice") choices(host, q.opts.map((o) => (typeof o === "object" ? o : { label: o, v: o })), (o, b) => answer(o.v, b));
    else if (q.input === "num") pad = numpad(host, { onEnter: (v) => answer(v), max: q.max || 4 });
    else q.mount(host, (v) => answer(v));
    talk(q.ask, q.voice);
    q.draw(q.a);
  };
  const settle = async (won) => {
    busy = true;
    const qq = q;
    host.querySelectorAll("button").forEach((b) => (b.disabled = true));
    talk(`${won ? (tries ? "Correct — your persistence paid off. Here is why:" : pick(EFFORT)) : "Here is the reasoning."} ${q.why}`, q.whyVoice ? `${won ? "Correct." : "Here is the reasoning."} ${q.whyVoice}` : undefined);
    await quiet(q.after?.(q.a, won));
    if (my !== token || q !== qq) return;
    host.className = "lp-in";
    host.innerHTML = nextRow(round + 1 >= R);
    host.onclick = (event) => {
      if (!event.target.closest("[data-a]")) return;
      window.OC?.touch();
      round += 1;
      if (round >= R) finishGame(id, host, { R, first, noun: cfg.noun, again: restart });
      else ask();
    };
  };
  const answer = (v, button) => {
    if (my !== token || busy) return;
    window.OC?.touch();
    if (v === null || v === undefined) return;
    if (isRight(v)) {
      button?.classList.add("right");
      MUSIC.chime();
      if (tries === 0) first += 1;
      window.OC?.count(cfg.count);
      return settle(true);
    }
    tries += 1;
    button?.classList.add("wrong");
    MUSIC.oops();
    if (tries < 2) {
      pad?.clear();
      talk(`${pick(NUDGE)} ${q.hint(v)}`);
      return;
    }
    if (q.input === "choice") {
      const i = q.opts.findIndex((o) => isRight(typeof o === "object" ? o.v : o));
      host.querySelectorAll("[data-c]")[i]?.classList.add("right");
    } else pad?.set(q.ans);
    settle(false);
  };
  const restart = () => {
    round = 0;
    first = 0;
    ask();
  };
  bindTop(id, (lv) => {
    level = lv;
    restart();
  });
  ask();
  window.__lp = { q: () => q, answer: (v) => answer(v), right: () => answer(q.ans), setRound: (r) => (round = r), go: (r) => ((round = r), ask()) };
}

// ================= 5. Binary and bases =================
// Lamps: one per binary place; tap to switch. Returns { value(), set(v) }.
function lamps(parent, n, { x0, y, w, value = 0, tap = false, labels = true } = {}) {
  const sp = w / n;
  const r = Math.min(40, sp * 0.4);
  const bits = [...Array(n)].map((_, i) => (value >> (n - 1 - i)) & 1);
  const parts = [];
  for (let i = 0; i < n; i++) {
    const cx = x0 + sp * i + sp / 2;
    const g = el("g", { class: tap ? "lp-tap" : "", "data-bit": i }, parent);
    const digit = text(g, cx, y - r - 14, "0", { "font-size": 36, fill: INK, "font-family": "ui-monospace, Menlo, monospace" });
    const bulb = el("circle", { cx, cy: y, r, fill: "#efe8da", stroke: "#8a7a50", "stroke-width": 4 }, g);
    el("rect", { x: cx - r * 0.45, y: y + r - 2, width: r * 0.9, height: r * 0.4, rx: 4, fill: "#9c9480" }, g);
    if (labels) text(g, cx, y + r + 44, String(2 ** (n - 1 - i)), { "font-size": n > 7 ? 22 : 26, fill: SOFT });
    parts.push({ digit, bulb });
  }
  const show = () =>
    parts.forEach((p, i) => {
      p.digit.textContent = String(bits[i]);
      p.bulb.setAttribute("fill", bits[i] ? "#ffd84a" : "#efe8da");
      p.bulb.setAttribute("stroke", bits[i] ? "#c49a00" : "#8a7a50");
    });
  show();
  if (tap)
    onTap(parent.ownerSVGElement || parent, (g) => {
      if (g.dataset.bit === undefined) return;
      const i = Number(g.dataset.bit);
      bits[i] ^= 1;
      MUSIC.play("xylophone", bits[i] ? 79 : 72, { gain: 0.2 });
      show();
    });
  return {
    value: () => bits.reduce((a, b) => a * 2 + b, 0),
    set: (v) => {
      for (let i = 0; i < n; i++) bits[i] = (v >> (n - 1 - i)) & 1;
      show();
    },
  };
}
const BIN_HINT = {
  b2d: () => "Add the place values of the lamps that are on. Which values are lit?",
  d2b: (v, q) => (v > q.ans ? `Your lamps make ${v}, which is too much. Which lamp is worth too much?` : `Your lamps make ${v}; you need ${q.ans - v} more. Which place values add up to that?`),
  count: () => "Look at the right-hand end. In binary, 1 + 1 = 10: the 1 becomes 0 and carries 1 to the left. Which lamps roll over?",
  place: () => "Start at 1 on the right and double at every step to the left.",
  add: () => "Work from the right, column by column. 1 + 1 = 10: write 0 and carry 1.",
  max: () => "Switch every lamp on and add their place values. Or: find the next place value and subtract 1.",
  values: () => "One digit gives 2 patterns (0, 1). Two digits give 4 (00, 01, 10, 11). What happens with each extra digit?",
  double: () => "What does writing 0 at the end of a decimal number do to it? The same idea works in base 2.",
  base: (v, q) => `List the place values in base ${q.base}: 1, ${q.base}, ${q.base * q.base}… Multiply each digit by its place value and add.`,
  tobase: (v, q) => `Find the largest place value (1, ${q.base}, ${q.base * q.base}, …) that fits, and how many times it fits; then do the same with what is left.`,
  hex: () => "The left digit counts sixteens. A = 10, B = 11, C = 12, D = 13, E = 14, F = 15.",
  tohex: () => "Split the 8 bits into two groups of four. Each group of four is one hex digit from 0 to 15.",
};
function binaryCase(level, round) {
  const q = bMake(level, round);
  const m = /base (\d+)/.exec(q.ask);
  q.addA = q.a;
  q.addB = q.b;
  delete q.a;
  q.base = m ? Number(m[1]) : 2;
  const tall = isTall();
  const bitsN = q.bits || (q.kind === "b2d" ? Math.max(5, q.ans.toString(2).length) : 8);
  let lampsObj = null;
  q.draw = () => {
    const [w, h] = tall ? tallBox(600, 440) : [W, H];
    fresh(w, h);
    const pw = w - 40;
    const y = tall ? h / 2 + 20 : 300;
    if (["b2d", "d2b", "count", "add"].includes(q.kind)) {
      const value = q.kind === "b2d" ? q.ans : q.kind === "count" ? q.start : 0;
      if (q.kind === "add") {
        const sp = pw / 8;
        const colX = (k) => 20 + sp * k + sp / 2; // k = 0..7, left to right
        const yA = tall ? 60 : 64;
        [q.addA, q.addB].forEach((v, row) => {
          const str = v.toString(2);
          [...str].forEach((d, i) => text(view, colX(8 - str.length + i), yA + row * 54, d, { "font-size": 42, fill: INK, "font-family": "ui-monospace, Menlo, monospace" }));
        });
        const lead = 8 - Math.max(q.addA, q.addB).toString(2).length;
        text(view, colX(Math.max(0, lead - 1)), yA + 54, "+", { "font-size": 42, fill: INK });
        el("line", { x1: colX(Math.max(0, lead - 1)) - sp / 2, y1: yA + 76, x2: w - 20, y2: yA + 76, stroke: INK, "stroke-width": 4 }, view);
        lampsObj = lamps(view, 8, { x0: 20, y: y + 30, w: pw, value, tap: true });
      } else {
        if (q.kind === "d2b") text(view, w / 2, 70, `Make ${q.ans}`, { "font-size": 48, fill: "var(--accent-dark)" });
        if (q.kind === "count") text(view, w / 2, 70, "Show the next number", { "font-size": 40, fill: "var(--accent-dark)" });
        if (q.kind === "b2d") text(view, w / 2, 70, "A lit lamp means 1; the number below is its place value", { "font-size": tall ? 22 : 30, fill: SOFT });
        lampsObj = lamps(view, bitsN, { x0: 20, y, w: pw, value, tap: q.kind !== "b2d" });
      }
    } else if (q.kind === "place") {
      const k = Number(/the (\d)/.exec(q.ask)[1]);
      const n = 7;
      const sp = pw / n;
      for (let i = 0; i < n; i++) {
        const pos = n - i;
        const cx = 20 + sp * i + sp / 2;
        box(view, cx - sp * 0.42, y - 60, sp * 0.84, 100, { fill: pos === k ? "#fff1d6" : "#fff", stroke: pos === k ? "var(--accent)" : LINE, sw: pos === k ? 5 : 3 });
        text(view, cx, y + 4, pos <= 3 || pos === k ? (pos === k ? "?" : String(2 ** (pos - 1))) : "…", { "font-size": 34, fill: pos === k ? "var(--accent-dark)" : SOFT });
        text(view, cx, y + 80, `${pos}${["st", "nd", "rd"][pos - 1] || "th"}`, { "font-size": 22, fill: SOFT });
      }
      text(view, w / 2, 90, "Binary places, counted from the right", { "font-size": tall ? 26 : 32, fill: SOFT });
    } else if (q.kind === "max" || q.kind === "values") {
      const n = Number(/(\d+) binary/.exec(q.ask)[1]);
      lampsObj = lamps(view, n, { x0: 20 + (pw - pw * (n / 8)) / 2, y, w: pw * (n / 8), value: q.kind === "max" ? 2 ** n - 1 : 0, tap: q.kind === "values" });
      text(view, w / 2, 80, q.kind === "max" ? `${n} binary digits` : `${n} binary digits: try some patterns`, { "font-size": tall ? 28 : 36, fill: SOFT });
    } else if (q.kind === "double") {
      const s1 = /^([01]+)/.exec(q.ask)[1];
      text(view, w / 2, 150, `${s1}₂ = ${q.ans / 2}`, { "font-size": 54, fill: INK, "font-family": "ui-monospace, Menlo, monospace" });
      text(view, w / 2, 280, `${s1}0₂ = ?`, { "font-size": 54, fill: "var(--accent-dark)", "font-family": "ui-monospace, Menlo, monospace" });
    } else {
      const big = (/(\w+[₀₁₂₃₄₅₆₇₈₉]+)/.exec(q.ask) || /Write (\d+)/.exec(q.ask))[1];
      text(view, w / 2, h / 2 - 20, big, { "font-size": tall ? 64 : 84, fill: INK, "font-family": "ui-monospace, Menlo, monospace" });
      text(view, w / 2, h / 2 + 60, q.kind === "tobase" ? `in base ${q.base} = ?` : q.kind === "tohex" ? "in base 16 = ?" : "in decimal = ?", { "font-size": tall ? 34 : 42, fill: "var(--accent-dark)" });
      if (q.kind === "hex" || q.kind === "tohex") text(view, w / 2, h - 30, "A = 10 · B = 11 · C = 12 · D = 13 · E = 14 · F = 15", { "font-size": tall ? 22 : 26, fill: SOFT });
    }
  };
  if (q.input === "bits") {
    q.input = "custom";
    q.mount = (hostEl, answer) => {
      hostEl.innerHTML = btnRow([["check", "✅ Check", true], ["off", "↺ All off"]]);
      hostEl.onclick = (event) => {
        const b = event.target.closest("[data-a]");
        if (!b) return;
        if (b.dataset.a === "off") return lampsObj?.set(0);
        answer(lampsObj.value());
      };
    };
  }
  if (q.input === "num") q.max = 4;
  q.hint = (v) => BIN_HINT[q.kind](v, q);
  q.after = async () => {
    if (lampsObj && ["d2b", "count", "add", "max"].includes(q.kind)) lampsObj.set(q.ans);
  };
  q.whyVoice = q.why;
  if (round === 0) q.ask = `${q.ask} <small>(Gottfried Leibniz explained binary arithmetic in a paper of 1703, <i>Explication de l'Arithmétique Binaire</i>; every modern computer stores numbers this way.)</small>`;
  return q;
}

// ================= 6. Syllogisms and Venn diagrams =================
let vennCount = 0;
const REAL_BAG = {};
// circles: [{ x, y, r, label, color }]; region r = bitmask of the circles it lies inside.
function venn(parent, circles) {
  const uid = `lpv${++vennCount}`;
  const defs = el("defs", {}, parent);
  circles.forEach((c, i) => {
    const cp = el("clipPath", { id: `${uid}c${i}` }, defs);
    el("circle", { cx: c.x, cy: c.y, r: c.r }, cp);
  });
  const shadeLayer = el("g", {}, parent);
  const lineLayer = el("g", {}, parent);
  circles.forEach((c) => {
    el("circle", { cx: c.x, cy: c.y, r: c.r, fill: "none", stroke: c.color, "stroke-width": 5 }, lineLayer);
  });
  const markLayer = el("g", {}, parent);
  const minX = Math.min(...circles.map((c) => c.x - c.r));
  const maxX = Math.max(...circles.map((c) => c.x + c.r));
  const minY = Math.min(...circles.map((c) => c.y - c.r));
  const maxY = Math.max(...circles.map((c) => c.y + c.r));
  const regionOf = (x, y) => circles.reduce((m, c, i) => m | ((x - c.x) ** 2 + (y - c.y) ** 2 < c.r * c.r ? 1 << i : 0), 0);
  const sums = {};
  for (let x = minX; x <= maxX; x += 5)
    for (let y = minY; y <= maxY; y += 5) {
      const r = regionOf(x, y);
      if (!r) continue;
      sums[r] = sums[r] || [0, 0, 0];
      sums[r][0] += x;
      sums[r][1] += y;
      sums[r][2] += 1;
    }
  const centroid = (r) => (sums[r] ? [sums[r][0] / sums[r][2], sums[r][1] / sums[r][2]] : [0, 0]);
  return {
    centroid,
    shade(r, color = "#9c8f7c") {
      const mask = el("mask", { id: `${uid}m${r}` }, defs);
      el("rect", { x: 0, y: 0, width: 2000, height: 2000, fill: "#fff" }, mask);
      circles.forEach((c, i) => {
        if (!(r & (1 << i))) el("circle", { cx: c.x, cy: c.y, r: c.r, fill: "#000" }, mask);
      });
      let g = el("g", { mask: `url(#${uid}m${r})` }, shadeLayer);
      circles.forEach((c, i) => {
        if (r & (1 << i)) g = el("g", { "clip-path": `url(#${uid}c${i})` }, g);
      });
      return el("rect", { x: minX, y: minY, width: maxX - minX, height: maxY - minY, fill: color, opacity: 0.55 }, g);
    },
    mark(regs, glyph = "×", color = RED, size = 54) {
      const pts = regs.map(centroid);
      const x = pts.reduce((a, p) => a + p[0], 0) / pts.length;
      const y = pts.reduce((a, p) => a + p[1], 0) / pts.length;
      return text(markLayer, x, y + size * 0.35, glyph, { "font-size": size, fill: color, "font-weight": 900 });
    },
  };

    para(view, 44, 236, facts, { size: tall ? 28 : 32, width: cw - 48 });
  };
  q.ask = `Claim: <b>${claim}</b> What happened: ${facts} Was the claim broken?`;
  q.hint = () => "Ask first: did the IF part happen? A promise can only be broken when its condition is met.";
  q.why = q.P
    ? q.Q
      ? `The condition happened and the result followed, so the claim was kept: true.`
      : `The condition happened but the result did not. This is the only way to break an "if… then…" claim: false.`
    : `The condition did not happen, so the claim made no promise about this case and nothing broke it. Logicians therefore count it as true (sometimes called "vacuously true"). Everyday speech often expects more from "if" — a cause or a real connection — but the logical meaning concerns only truth values.`;
  q.after = async () => {
    const [w, h] = box2(460);
    fresh(w, h);
    const rows = tRows(["A", "B"]);
    const hl = rows.map((env) => env.A === q.P && env.B === q.Q);
    text(view, w / 2, 34, `A = ${q.p} · B = ${q.q}`, { "font-size": tall ? 18 : 22, fill: SOFT });
    ttTable([{ head: "A", vals: rows.map((e) => e.A) }, { head: "B", vals: rows.map((e) => e.B) }, { head: "A → B", vals: rows.map((e) => !e.A || e.B), hl }], 4, { tall, y0: 56 });
    text(view, w / 2, h - 16, "Pink: what happened. Only T → F makes the claim false.", { "font-size": tall ? 19 : 23, fill: SOFT });
  };
  return q;
}
